源可以用“岛+去耦”弥补。选层不是“哪个好听选哪个”，要按“最难的信号需要什么样的参考面”来定：本项目最难的是 LPDDR4X 32bit 与 PCIe，两者都要求“上下都有地”，所以 A 更稳。叠层定稿后要写进“叠层表”，标清铜厚/介质/阻抗/PP 组合，发给板厂做阻抗条，首批用 TDR 验证。\n\n#### 29.2.8 电源完整性与“目标阻抗”\n\nRK3576 核心 0.6～0.9V、电流 2～4A，按 5% 纹波算：Ztarget=0.6×5%/4≈7.5mΩ（最坏按 0.6V/4A）；LPDDR4X VDDQ 1.1V/1A、3% 纹波：Ztarget≈33mΩ。目标阻抗决定“去耦电容组合”：低频靠大容量（22/47μF）、中频靠 1μF/0.1μF 阵列、高频靠“靠近引脚的 0.1μF+平面”。6 层板的 L5 电源平面与 L4 地构成“平板电容”，但容量有限（约 nF 级），不能替代去耦。PDN 设计步骤：算 Ztarget→选电容→看阻抗曲线→留余量（<Ztarget 的 70%）→实测（VNA/示波器纹波）。NPU 满载时的“di/dt”很大，去耦不够会“掉压/重启”，这是 AI 主板最常见的“玄学死机”。\n\n#### 29.2.9 时钟与“抖动的连锁反应”\n\nRK3576 需要 24MHz/32.768kHz；PCIe/USB3/HDMI 各自有参考时钟或从主控输出。时钟走线要“短/包地/不跨分割”，晶振下方挖空/不走线；PCIe 的 100MHz 参考时钟抖动要求高（RMS <1ps），走线过长/受电源噪声污染会导致“链路降速/重训”。时钟是“系统的心跳”，抖动会传染：时钟差→链路误码→重传→性能下降→用户感知“卡”。调试时先看“时钟是否干净”，再看“数据”。\n\n#### 29.2.10 结构与接口朝向\n\n6 层 AI 主板通常“接口三面出”：HDMI/USB 在侧边、网口在侧边、MIPI FPC 在顶边、M.2 在板中。结构决定“接口高度/开孔/散热风道”；风扇要“吹主控/吹 M.2”，进风口避开“热源/灰尘”。板框要留“螺丝孔/定位孔/拼板工艺边”，并与外壳“3D 干涉检查”。结构改一次，PCB 可能要重画，所以“结构冻结”是项目门禁。\n\n#### 29.2.11 EMC 预算：预测试留 6dB 怎么来\n\n认证限值（EN 55032 Class B）在 30～230MHz 是 30dBµV/m（3m 法），Class A 是 40dBµV/m。设计目标要“比限值低 6dB”，即 Class B 目标 24dBµV/m。6dB 是“批量/线缆/环境”的余量：同一设计换机箱/换线/换批次，辐射可能差 3～6dB。预算要分配到“源头/路径/天线”：源头降 10dB（展频/滤波）、路径降 6dB（包地/缝合孔）、天线降 3dB（屏蔽/连接器）。只靠“最后加磁环”通常不够，因为磁环对“板内辐射”无效。\n\n### 29.3 关键参数与设计约束\n\n| 项目 | 约束 | 说明 |\n|---|---|---|\n| SoC 电源 | 多路，电流按手册×1.3 | 时序/纹波 |\n| DDR | 速率/位宽/拓扑 | 等长/参考 |\n| 高速差分 | PCIe 85/90Ω、USB3 90Ω | 阻抗/过孔 |\n| 叠层 | 6 层，L2/L5 地 | 回流连续 |\n| 散热 | SoC/NPU 结温 | 铜/散热片 |\n| EMC | 时钟/DC-DC/接口 | 预测试 |\n\n### 29.4 关键电路\n\n#### 29.4.1 多路电源时序\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 29-3：多路电源时序<\/text>\n  <line x1=\"80\" y1=\"220\" x2=\"640\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M80 220 L160 120 L300 120 L300 220\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <path d=\"M300 220 L360 160 L480 160 L480 220\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <path d=\"M480 220 L540 100 L640 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"100\" y=\"105\" font-size=\"11\" fill=\"currentColor\">核心 1.0V<\/text>\n  <text x=\"340\" y=\"145\" font-size=\"11\" fill=\"currentColor\">DDR 1.1V<\/text>\n  <text x=\"545\" y=\"85\" font-size=\"11\" fill=\"currentColor\">IO 1.8/3.3V<\/text>\n  <text x=\"80\" y=\"255\" font-size=\"12\" fill=\"currentColor\">时序按 SoC 手册；使能/电源好信号级联。<\/text>\n<\/svg>\n```\n\n#### 29.4.2 PCIe/USB3 差分\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 29-4：PCIe/USB3 差分与连接器<\/text>\n  <rect x=\"60\" y=\"80\" width=\"150\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"115\" font-size=\"12\" fill=\"currentColor\">SoC<\/text>\n  <rect x=\"480\" y=\"80\" width=\"160\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"510\" y=\"115\" font-size=\"12\" fill=\"currentColor\">连接器/SSD<\/text>\n  <line x1=\"210\" y1=\"110\" x2=\"480\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"210\" y1=\"140\" x2=\"480\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"280\" y=\"100\" font-size=\"10\" fill=\"currentColor\">TX+/TX−<\/text>\n  <text x=\"280\" y=\"158\" font-size=\"10\" fill=\"currentColor\">RX+/RX−<\/text>\n  <text x=\"60\" y=\"220\" font-size=\"13\" fill=\"currentColor\">差分 85/90Ω；AC 耦合电容按协议；连接器靠板边。<\/text>\n  <text x=\"60\" y=\"245\" font-size=\"13\" fill=\"currentColor\">过孔 stub 短，参考平面连续。<\/text>\n<\/svg>\n```\n\n#### 29.4.3 LPDDR4X 训练：从“跑不起来”到“跑满速”\n\nRK3576 的 LPDDR4X 初始化要做 write leveling、read gate training、read/write DQS centering。训练失败通常不是“代码问题”，而是三个物理量不达标：VDDQ 纹波（要求 <±3%，约 30mV）、参考面连续、DQS/DQ 等长。调试顺序：先降频到 800MT/s 看能否启动，能启动说明“连线对、余量不足”；再查电源纹波/去耦/参考面；最后看等长与串扰。训练通过的标志是“满速 memtester 2 小时无错 + 高温无错”。改版时若换了颗粒型号，必须重新训练并记录“频率/时序/温度/结论”，不要假设“pin-to-pin 就能跑”。\n\n#### 29.4.4 HDMI 4K60：链路预算与眼图\n\n4K60 的 TMDS 速率约 6Gbps/对，链路预算很紧：主控驱动能力、PCB 损耗（约 0.3～0.5dB/inch@3GHz）、连接器、ESD/共模、线缆。设计要点：走线尽量短（<4inch）、同层直、参考 L2 连续、ESD 结电容 <0.3pF、共模扼流选“低差模损耗”型号。眼图判据：眼高/眼宽留 20% 余量，抖动 <0.2UI。若眼图差，优先减短走线/换低损耗板材（如 Mid-Loss），再考虑预加重/驱动电流配置。\n\n#### 29.4.5 PCIe 2.1：损耗、参考与“链路训练”\n\nPCIe Gen2 5GT/s 对 6 层板不算苛刻，但要注意：差分 85Ω、对内 ±5mil、对间 ≥5W、参考面连续、过孔 stub 尽量短（<0.3mm）。M.2 连接器到主控的走线要“一条直线”，中间不换层；必须换层时加地孔。链路训练失败常见原因：参考时钟（100MHz）抖动/走线太长、PERST# 时序、电源（3.3V/1.8V）不稳、连接器焊接。调试：先看“链路速率/宽度”，再看“误码/重训”，最后查电源/时钟。\n\n#### 29.4.6 USB3.0：SSTX/SSRX 与“电源噪声”\n\nUSB3 的 SuperSpeed 对（SSTX/SSRX）90Ω 差分、对内 ±5mil；VBUS 要限流/ESD；座子屏蔽壳接地。USB3 对电源噪声敏感，3.3V 要加 LC/去耦；与 2.4G Wi-Fi 共存时，注意“USB3 扩频噪声”落在 2.4G 附近，必要时加屏蔽/滤波。调试：先枚举（lsusb），再测速率（U 盘/网卡），最后做“插拔/热插”压力。\n\n#### 29.4.7 MIPI D-PHY：4lane 摄像头/显示\n\nMIPI CSI/DSI 4lane，每 lane 1～1.5Gbps，差分 100Ω、对内 ±5mil、对间 ≥3W；FPC 排线要“阻抗控制/地线隔离”，连接器要“带锁扣”。MIPI 是“板内短距”，但 FPC 一长（>10cm）就会“花屏/识别不到”。调试：先降 lane 数/速率，再看“时钟/复位/供电”，最后查 FPC 阻抗/接触。摄像头还要注意 MCLK/I2C 上拉与 ESD。\n\n#### 29.4.8 PMIC 时序：多路电源的“先后”\n\nRK3576 常用 PMIC（如 RK806/RK808）多路输出：核心、LPDDR4X VDD1/VDD2/VDDQ、3.3/1.8V IO。时序由 PMIC 寄存器/OTP 配置，硬件上要“EN 级联/PWRON/RESET”配合。上电顺序错会导致“LPDDR 训练失败/大电流/闩锁”。验证：多通道示波器量“各路上升/复位释放”，并做“反复上电 100 次”的一致性测试。掉电顺序也要注意：先断核心再断 IO，避免“IO 有电、核心无电”倒灌。\n\n#### 29.4.9 LPDDR4X 的布局顺序：先定“岛”，再定“线”\n\nLPDDR4X 的布局不是“把颗粒放到主控旁边”，而是“先把电源岛和参考面画出来”。步骤：①主控与颗粒同面、间距控制在 8～15mm，太长则损耗/串扰上升，太短则扇出/散热困难；②在 L5 上把 1.1V、1.8V、0.6V 分成三个岛，岛与岛之间留 1mm 以上间隙，避免“电源噪声互串”；③确认 L2/L4 在内存区域“无开槽、无挖空、无过孔密集区”，必要时把过孔移到颗粒外侧；④再开始布 DQ/DQS，先布 DQS 再布 DQ，因为 DQS 是“采样基准”，它的参考面/等长优先级最高；⑤最后布地址/命令与 CK，地址/命令可以“长一点”，但不能“跨岛”。这个顺序看起来慢，实际能省掉“布完发现参考面被切、全部重来”的返工。布局评审时拿“分区图+参考面图”两纸并排看，比看 3D 更能发现问题。\n\n#### 29.4.10 LPDDR4X 去耦：0.1μF 要“贴”，1μF 要“散”\n\nLPDDR4X 的电源引脚多、电流突变快，去耦要“分层”做：每个电源引脚旁放 0.1μF（0201/0402，回路 <2mm）；每 2～3 个引脚放 1μF；颗粒电源入口放 10μF；PMIC 输出放 22～47μF。关键是“回路电感”：电容焊盘→过孔→平面→引脚，任何一段长 1mm 都会让高频去耦失效。常见错误是“0.1μF 放在颗粒外侧、走线 5mm”，看起来有电容，实际高频阻抗很高。正确做法是“电容焊盘直接打过孔到 L4 地、到 L5 电源”，过孔 0.2mm、每焊盘 1～2 个。去耦不是“堆数量”，是“缩短回路”；评审时用“放大镜看电容过孔”比看容值表有效。VDDQ 与 VDD1 的去耦要分开，不要“共用一颗电容”，否则两种噪声互串。\n\n#### 29.4.11 MIPI 的 FPC 与连接器：板内好、板外难\n\nMIPI CSI/DSI 在板内走线通常没问题，难在“FPC 排线+连接器”：FPC 的阻抗由“线宽/地线/介质厚度”决定，便宜的双层 FPC 往往“阻抗不可控”，表现为“摄像头识别不到/花屏/闪屏”。选 FPC 时要“带地平面/阻抗控制/屏蔽层”，长度尽量 <10cm；连接器要“带锁扣/防呆/固定脚”，插拔不歪。板上走线要“差分等长/对间 ≥3W/参考连续”，FPC 连接器下方保留地，别把“地”挖空。调试时先“降 lane 数/速率”，再看“供电/时钟/复位/I2C”，最后才怀疑“FPC”。很多“摄像头问题”最后发现是“排线插反/没锁紧/阻抗不对”，不是芯片。\n\n#### 29.4.12 PCIe 的布局：M.2 与主控“一条线”\n\nPCIe Gen2 5GT/s 的损耗预算约 10～12dB（含连接器/线缆），6 层板上“短、直、参考连续”就能过。布局要点：①M.2 连接器放板边/板中，按结构“插卡方向”定，保证“模块长度/散热空间”；②TX/RX 从主控到连接器“同层直走”，尽量不换层；必须换层时加“地孔+短 stub”；③差分对间 ≥5W，与其它高速（USB3/HDMI）保持 ≥5mm；④参考面用 L4 地（内层），不要参考 L5 电源；⑤PERST#、CLKREQ#、WAKE# 等边带信号要“远离差分/加 RC”，避免“误唤醒/不识别”。M.2 的 3.3V 电源要“单独一路+大电容”，SSD 启动电流大，电源塌陷会“掉盘”。调试时先看“链路速率/宽度”，再查“连接器焊接/金手指”，最后才动“走线”。\n\n#### 29.3.7 叠层与成本的“四笔账”\n\n6 层板的成本要算四笔：①板费（6 层约 4 层 1.6 倍）；②阻抗/盲埋/背钻等特殊工艺；③贴片（双面/密脚/细间距）；④测试/治具/认证。省钱不能“砍层数”，因为“层数不够→信号过不了→改板更贵”；能省的是“拼板利用率/测试项/连接器数量/包装”。报价比较要“同层数/同工艺/同测试/同交期”，否则“便宜”是假象。小批量可以“拼板+混拼”摊薄，大批量靠“面板利用率+治具复用”。项目里“成本”不是财务的事，是设计的事：布局决定面积，面积决定拼板，拼板决定单价。\n\n#### 29.4.13 千兆网与 USB2 的“低速也要防护”\n\n千兆网差分 100Ω、变压器隔离、ESD/共模；RJ45 的 LED/屏蔽壳要接地，网口是“雷击入口”，按 IEC 61000-4-5 配 TVS/气体放电管。USB2 差分 90Ω、VBUS 限流/ESD。低速接口最容易被“省器件”，但它们是“用户天天插”的地方，ESD 失效会导致“整机重启/芯片损坏”。规则：外露接口“防护三件套”（ESD/限流/滤波），一个都不能少。\n\n#### 29.4.14 音频与风扇：两个“不起眼”的噪声源\n\n音频（I2S/模拟）要远离 PMIC/PCIe/HDMI，模拟地单独铺、隔直/低通；风扇是“机械+电气”噪声源，PWM 频率要避开音频/麦克风频段，风扇线要“远离模拟/天线”，并加“续流/滤波”。很多“底噪/啸叫”不是音频芯片，是“风扇 PWM/电源纹波”。规则：音频区域“三不放过”——不放过开关电源、不放过风扇、不放过高速时钟。\n\n### 29.5 选型与降额\n\n| 器件 | 选择 | 降额 |\n|---|---|---|\n| SoC | RK3576 | 散热/电流 |\n| DDR | LPDDR4/DDR4 4GB | 速率 |\n| eMMC | 32GB | 寿命 |\n| PMIC | 多路 | 电流×1.3 |\n| PCIe | Gen2/3 | 连接器 |\n| Wi-Fi6 | 模块 | 天线 |\n\n#### 29.5.1 主控与内存选型：先看“参考设计+供货”\n\nRK3576 有多个封装/温度等级，选型要确认“引脚/封装/散热/供货”；LPDDR4X 选“32bit 单颗、速率 1600～2133MT/s、与主控参考设计匹配”的型号，优先“原厂认证列表”里的颗粒，因为 LPDDR4X 的训练参数与颗粒特性强相关，换料必须重训。eMMC 选 5.1/32GB、双电压；Wi-Fi6 模块选“SDIO/PCIe 接口、带屏蔽罩、过认证”的。选型顺序不是“先看参数”，而是“先看能不能买到、能不能跑、有没有人用过”，最后才比价格。项目里“省 2 元的未验证颗粒”，往往换来“两周的调试+一次改版”。\n\n#### 29.5.2 电源器件：PMIC 还是分立\n\nPMIC 优点：时序可控、体积小、监控齐全；缺点：贵、交期长、坏一片换整片、散热集中。分立优点：便宜、灵活、好修；缺点：时序要自己做、占面积。AI 主板建议“核心+LPDDR 用 PMIC，外设/接口用分立 Buck/LDO”，兼顾“时序可靠”与“成本/维修”。选 PMIC 要确认“通道电流/散热/OTP 配置”，并在原理图上标“默认电压/时序/上电顺序”。分立方案要用“EN 级联+RC/PG 串联”做时序，并留“强制复位/放电”电路，避免“掉电不彻底→下次上电卡死”。\n\n#### 29.5.3 连接器与防护：AI 主板的“外露接口”\n\nHDMI/USB3/RJ45/M.2/DC 都是“外露”，要有 ESD/共模/保险；M.2 连接器要“带固定螺丝/支撑柱”，避免“插卡弯板”；FPC 连接器要“锁扣/防呆”，MIPI 排线要“地线+阻抗”。防护器件选“低电容/低钳位/高浪涌”，HDMI 4K 尤其挑“结电容<0.3pF”。连接器成本占 BOM 20%，但“插拔寿命/接触电阻”决定售后；选“镀金厚度/弹片结构”达标的，不要“只看价格”。\n\n#### 29.5.4 降额与热设计\n\n核心 Buck 按“最大电流 70%”选；LPDDR4X 电源按“峰值 1.5 倍”留；连接器按“额定 50%”；电容按“耐压 1.5 倍/温度 105℃”。RK3576 NPU 满载时核心电流突变大，输出电容要“低 ESR/多颗并联”，并在布局上“靠近负载”。热设计按“45℃环境+满载 8h”算：结温=环境+功耗×θJA，超过 105℃ 就要“加铜/加风扇/降频”。降额不是“保守”，是“给批量/灰尘/高温留活路”。\n\n#### 29.5.5 关键料的“第二来源”策略\n\n主控/内存/PMIC 这类“锁死”的料，要有“第二来源/替代型号/改板预案”：主控至少确认“同系列不同封装”的可替换性；内存确认“同容量/同速率/同电压”的替代；PMIC 确认“引脚兼容/配置可迁移”。替代不是“pin-to-pin 就行”，要“重新训练/重新认证/小批验证”。项目量产前，采购/研发一起做“缺料演练”：假设主料断供 8 周，能不能用替代料顶上。\n\n#### 29.5.6 成本与“认证/测试”的隐藏项\n\n6 层 AI 主板的成本不只是“板费+贴片”：还有“阻抗测试/飞针/治具/认证/老化/售后”。认证（HDMI/USB/CE）一次几万，改板重测又几万；老化/治具按“台数×时间”算。报价要“按全流程”算，不要“只比板费”。小批量时，工程费/NRE 摊到每片很贵；拼板/合并订单/复用治具能摊薄。\n\n### 29.6 测量与仿真\n\n#### 29.6.1 Bring-Up\n\n1. 各路电源/时序。\n2. SoC 复位/时钟。\n3. DDR 训练。\n4. eMMC/PCIe 识别。\n5. HDMI/USB3/以太网。\n6. NPU/GPU 负载/温度。\n7. 老化/EMC 预测试。\n\n#### 29.6.2 CircuitJS\n\n```circuitjs\npower-buck\n```\n\n观察多路 DCDC 的纹波/瞬态。\n\n#### 29.6.3 动手任务\n\n- 画 RK3576 框图/6 层叠层。\n- 列多路电源时序表。\n- 画 PCIe/USB3 差分连接。\n- 制定 Bring-Up 计划。\n\n#### 29.6.6 HDMI 4K 的实测方法\n\n先把“源”和“显示”固定：用同一台 4K 显示器、同一根认证线、同一版固件，避免“换个屏就好了”的误判。示波器加 HDMI 夹具（或专用协议分析仪）看 TMDS 眼图：眼高、眼宽、上升时间、抖动。4K60 的 UI 约 166ps，眼宽要留 20% 以上；上升时间受 ESD 结电容与走线电感影响，经验上每 0.1pF 约增加十几 ps。若眼图闭合，先看“走线长度/换层/参考面”，再看“ESD/共模型号”，最后才调“预加重/驱动电流”。很多“4K 花屏”不是芯片问题，是“连接器焊盘阻抗不连续/ESD 选型不对”。测完要留“眼图截图+测试条件”，作为改版基线。\n\n#### 29.6.7 PCIe 链路的“三步定位”\n\n第一步看“链路是否建立”：lspci 看速率（Gen1/Gen2）与宽度（x1/x2），若只跑 Gen1，多半是“信号完整性/参考时钟”问题。第二步看“误码/重训”：读 PCIe 错误计数器，重训频繁说明“眼图余量不足”。第三步看“电源/时钟”：PERST# 时序、100MHz 参考抖动、3.3V 纹波。硬件上重点查“M.2 连接器焊接/金手指氧化/走线 stub/参考面”。PCIe 的调试要“先降速再提速”：强制 Gen1 能通，说明链路基本对，逐步提速找余量边界。记录“速率/误码/温度”，形成“链路预算表”。\n\n#### 29.6.8 热测试：NPU 满载的“真实温度”\n\n用红外热像仪/热电偶测“主控、PMIC、LPDDR、eMMC、M.2”的温度，环境 45℃、NPU/CPU 满载、风扇按整机策略。判据：主控结温 <105℃、PMIC <110℃、LPDDR <85℃、eMMC <85℃；并留 10℃ 余量。若超温：加散热片/导热垫/风扇转速/降频；同时看“热点是否在焊盘/过孔”。热测试要“连续 8h”，观察“温度是否爬升/风扇是否振荡”。很多“跑一会儿就卡”的问题，根源是“热→降频→体验差”，不是“软件卡”。\n\n#### 29.6.9 EMC 预测试：6 层板的“辐射源”\n\n先近场扫：主控/PMIC/LPDDR/HDMI/网口/M.2，找“最强点/频率”。常见辐射：PMIC 开关（几百 kHz～几 MHz 的谐波）、LPDDR 时钟（几百 MHz）、HDMI 时钟谐波、网口共模、M.2 的 PCIe 扩频。整改顺序：源头（展频/滤波/屏蔽）→路径（包地/缝合孔/缩短）→天线（线缆/连接器）。6 层板有完整地，辐射通常比 4 层板好，但“接口共模”仍是大头。预测试留 6dB，正式认证才不慌。\n\n#### 29.7.1 LPDDR4X 走线“跨岛”\n\nLPDDR4X 的 DQ/DQS 从主控走到内存，中途跨过 1.1V 电源岛或 1.8V 岛，回流路径被切断，训练时好时坏。修法是“先画电源分区，再画内存走线”：把 LPDDR 区域上方的 L2/L4 地完整保留，电源岛只放在 L5；如果必须跨，就在跨分割处加“缝合电容/地过孔桥”，并做 TDR 确认阻抗连续。很多团队“先布线、后填电源”，结果内存区域被电源岛切得七零八落，最后只能“降频保命”。正确顺序是“叠层→分区→关键信号→普通信号”，LPDDR 是“关键信号里最娇气的一个”，它的参考面要在布局阶段就锁定。\n\n#### 29.7.2 6 层板只做“一层地”\n\n有人把 6 层叠成“信号-信号-电源-信号-信号-信号”，只有一层地，觉得“层数多就万事大吉”。实际是“地不够用”：LPDDR4X、PCIe、HDMI 同时要连续参考，最后只能“抢地”，谁都参考不全。6 层板的最低配置是“两层地”，最好“地-信号-地-信号-电源-信号”或“信号-地-信号-地-电源-信号”。地不是“越多越好”，而是“关键信号上下都要有”。如果成本压到只能一层地，那就回到 4 层板做简单项目，不要“6 层板做旗舰”。\n\n#### 29.7.3 PMIC 配置“照抄参考板”\n\n参考板的 PMIC 配置对应“它的内存/它的负载/它的散热”，照抄到自己的板，常见结果是“核心电压偏高→发热大”或“时序不对→训练失败”。正确做法是“按自己的物料/负载重算”：核心电压按主控 DVFS 表、LPDDR 电压按颗粒手册、时序按手册的 Power-Up Sequence，再用示波器逐路验证。PMIC 的 OTP 有的“一次烧死”，改配置前要确认“能不能重烧/换片”。项目里“PMIC 配置”是最容易被当成“软件问题”的硬件问题，出问题时先量电压/时序，别先改代码。\n\n#### 29.7.4 M.2 连接器“只焊不固定”\n\nM.2 模块插拔受力，连接器如果没有“固定螺丝/支撑柱”，反复插拔会把焊盘拉裂、把板压弯。修法是“连接器+固定孔+支撑柱”三件套，并在结构上留“模块长度/高度”空间。PCIe 走线要“从连接器到主控一条直线”，中间不要放“高元件/过孔密集区”。M.2 的电源（3.3V）要“单独滤波+足够载流”，SSD 启动电流可达 1A 以上，电源不足会“认不到盘/掉盘”。\n\n#### 29.7.5 散热“只加散热片，不加风道”\n\nAI 主板 NPU 满载时，散热片再大，如果外壳没有“进/出风口”，热空气出不去，温度照样爬升。修法是“结构+风扇+导热”一起做：进风口在冷区、出风口在热区，风扇“吹/抽”按风道定，导热垫/硅脂按接触面定。还要注意“风扇噪声/寿命/堵转检测”。热设计不是“贴个散热片”，是“整个机器的空气循环”。\n\n#### 29.7.6 认证“最后才做”\n\nHDMI 4K/USB3/千兆网都有“认证/一致性”要求，最后才做，发现“ESD 选型不对/共模没留位置/连接器不达标”，只能改板。正确做法是“认证清单进原理图”：每条外露接口按“认证等级”配防护/滤波/连接器，PCB 预留“共模/ESD/屏蔽”位置。认证不是“贴个标”，是“设计输入的一部分”。\n\n#### 29.6.10 实测一：LPDDR4X 频率“卡在 1200MT/s”\n\n某版 6 层板，LPDDR4X 训练只能到 1200MT/s，再往上就“偶发错码”。先降频到 800 能稳，说明“连线通、余量不足”。量 VDDQ 纹波 45mV（目标 30mV），原因是“去耦电容离引脚 6mm、过孔只有一个”；再看 DQS 与 DQ 有 2 根差 18mil（超出 ±5mil）；参考面 L4 在内存区被一条 1.8V 岛切了 3mm。改版：电容贴引脚/双过孔、重排等长、把 1.8V 岛移到外侧。复测满速 1600MT/s，memtester 4 小时无错，45℃ 2 小时无错。结论：**LPDDR 的“余量”是三个物理量：电源回路、等长、参考面**，不是“时序参数调一调”。\n\n#### 29.6.11 实测二：HDMI 4K 花屏与“连接器焊盘”\n\n4K60 输出偶发花屏，换线/换屏都一样。眼图看“上升沿有台阶”，怀疑“阻抗不连续”。用 TDR 测连接器焊盘，发现“焊盘比走线宽 0.15mm、参考面在焊盘下被挖空”，形成“容性突变”。改法：焊盘按“热焊盘/泪滴”过渡、参考面在连接器下方保留、ESD 换 0.25pF。复测眼图张开、花屏消失。结论：**HDMI 的“花屏”常常不是芯片/固件，是“焊盘/连接器/参考面”的几何问题**；眼图有台阶，先怀疑阻抗，不要先调驱动。\n\n#### 29.6.12 实测三：PCIe 只跑 Gen1 的“真凶”\n\nM.2 SSD 只识别为 Gen1 x1，换盘/换卡一样。查“参考时钟”：100MHz 差分走线 38mm、没有包地，抖动 RMS 2.3ps（要求 <1ps）；再查“PERST# 时序”，复位释放比电源晚 30ms（要求 ≥100ms）。改法：时钟包地/缩短、PERST# 加 RC 延时。复测 Gen2 x4 正常。结论：**PCIe 降速先查“时钟+复位”，再查“走线/连接器”**；很多“链路问题”是“边带信号/电源时序”，不是“差分走线”。\n\n#### 29.6.13 实测四：NPU 满载“跑十分钟就卡”\n\n红外热像仪看主控 108℃、PMIC 115℃、LPDDR 92℃，风扇转速只到 60%。原因是“风扇曲线按 CPU 温度、没把 NPU 算进去”，且“进风口被 M.2 挡住”。改法：风扇曲线按“主控+PMIC 最高温”、进风口移位、主控加铜/导热垫。复测 45℃ 满载 8 小时，主控 96℃、PMIC 102℃，不降频。结论：**AI 主板的“卡”常常是“热→降频”，先测温度再谈性能**。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 29-5：6 层叠层与关键信号分配<\/text>\n  <rect x=\"80\" y=\"60\" width=\"520\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"92\" y=\"80\" font-size=\"10\" fill=\"currentColor\">L1 信号：HDMI / USB3 / MIPI<\/text>\n  <rect x=\"80\" y=\"92\" width=\"520\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"92\" y=\"110\" font-size=\"10\" fill=\"currentColor\">L2 GND（完整）<\/text>\n  <rect x=\"80\" y=\"120\" width=\"520\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"92\" y=\"140\" font-size=\"10\" fill=\"currentColor\">L3 信号：LPDDR4X / PCIe<\/text>\n  <rect x=\"80\" y=\"152\" width=\"520\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"92\" y=\"170\" font-size=\"10\" fill=\"currentColor\">L4 GND（完整）<\/text>\n  <rect x=\"80\" y=\"180\" width=\"520\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"92\" y=\"198\" font-size=\"10\" fill=\"currentColor\">L5 PWR：1.1 / 1.8 / 0.6V 岛<\/text>\n  <rect x=\"80\" y=\"208\" width=\"520\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"92\" y=\"228\" font-size=\"10\" fill=\"currentColor\">L6 信号：低速 / 电源<\/text>\n  <text x=\"80\" y=\"270\" font-size=\"11\" fill=\"currentColor\">L3 夹在 L2/L4 之间：LPDDR4X 回流最短<\/text>\n  <text x=\"80\" y=\"292\" font-size=\"11\" fill=\"currentColor\">L5 电源岛不得切入 L2/L4 的内存区<\/text>\n<\/svg>\n```\n\n**读图 29-5**：两层地（L2/L4）把 LPDDR4X/PCIe 夹在中间，L5 只负责电源分配，不承担参考面。\n\n#### 29.6.14 第二个仿真：电源回路电感与“去耦有效性”\n\n去耦电容的高频效果由“回路电感”决定：ESL≈1nH/mm，回路 2mm 约 2nH，与 0.1μF 形成自谐振 f=1/(2π√(LC))≈11MHz；超过谐振频率，电容变“电感”，去耦失效。把回路从 6mm 缩到 2mm，谐振点从约 6MHz 提到 11MHz，高频阻抗下降约一半。用下面的 RC 低通看“转折频率随 R/C 变化”，把 R 理解为“回路电阻/ESL 的等效损耗”，就能直观看到“回路越长，高频越差”。\n\n```circuitjs\nrc-lowpass-159\n```\n\n**结论**：去耦不是“加电容”，是“缩回路”；layout 上“电容贴引脚、双过孔”比“换更贵的电容”有效。\n\n#### 29.7.7 “先布线，后改叠层”\n\n布局布线做了一半，发现 6 层叠层阻抗不对，回头改叠层→所有差分线宽/间距要重算、走线要重布。正确顺序是“叠层先行”：先定“层数/介质/铜厚/阻抗目标”，拿到板厂的“阻抗计算表”，再开始布局。叠层不是“板厂的事”，是“设计的第一块基石”。改叠层等于“改地基”，越晚越贵。\n\n#### 29.7.8 “差分等长”只做对内、不做对间\n\nHDMI 4 对之间差 500mil，看似“每对都等长”，实际“对间偏斜”导致“像素错位/闪屏”。规则：对内 ±5mil、对间 ±10mil（按协议），且对间要“同层/同参考”。等长不是“一根线”，是“一组线”的时序关系。\n\n#### 29.7.9 过孔“随便打”\n\n高速差分换层打了 4 个过孔、没有地孔、stub 长 1mm，眼图直接闭合。规则：换层加“伴随地孔”，stub <0.3mm，过孔反焊盘按阻抗设计；能用“盲埋孔”更好，但 6 层板通常通孔，靠“短 stub+地孔”补。\n\n#### 29.7.10 电源“只看电压、不看噪声”\n\n万用表量 1.1V 正常，就认为电源没问题；实际纹波 60mV、开关谐波落在 LPDDR 频段，训练偶发失败。规则：电源验收要“万用表+示波器（20MHz 带宽/AC 耦合）+负载瞬态”，看“稳态纹波/瞬态跌落/开关频率”。电压对不等于电源对。\n\n#### 29.6.15 测试计划：从“点灯”到“可量产”\n\nBring-Up 阶段测“功能/时序/训练”；设计验证测“眼图/链路/热/EMC”；小批测“良率/一致性/老化”。每阶段写“测试计划”：测什么/怎么测/判据/样本/记录。测试不是“出问题才做”，是“按计划暴露问题”。项目里最贵的是“量产才发现”，最便宜的是“打样前仿真/评审”。把测试计划贴到墙上，做完一项打勾，比“凭记忆”可靠。\n\n#### 29.6.16 产线 FCT：2 分钟测完“能不能出货”\n\n测试项：电源电压/电流、串口启动、HDMI 输出（4K/1080p）、网口 ping/iperf、USB3 枚举/速率、M.2 识别、Wi-Fi 扫描、音频环回、风扇转速、按键/LED。治具要“防呆/快速插拔/一次接触”，软件要“自动判定/记录 SN/上传 MES”。测试时间 2～3 分钟/台，别把“研发调试”搬到产线。FCT 通过率低，先查“治具接触/测试项设置”，再查“设计一致性”。\n\n#### 29.7.11 文档与版本：三个月后的“自己”\n\n原理图/PCB/BOM/叠层/测试记录/问题库要有“版本号/日期/变更说明”；每次改板建“一个文件夹”，命名“日期_版本_改了什么”。调试记录写“现象/假设/验证/结论”，不要只写“已解决”。项目交接时，别人能“按文档复现”，才算“交付”。文档不是“形式”，是“降低未来成本”的工具。\n\n### 29.7 常见坑\n\n1. **叠层参考不对**：高速阻抗/回流差。\n2. **DDR 训练失败**：等长/电源/VREF。\n3. **多路电源时序错**：SoC 不启动/损坏。\n4. **PCIe 差分跨分割**：识别不到 SSD。\n5. **USB3 过孔 stub 长**：降速/丢包。\n6. **大电流电源散热不足**：降频。\n7. **天线净空不足**：Wi-Fi 差。\n8. **连接器/结构干涉**：装不进外壳。\n9. **测试点不足**：高速调试难。\n\n### 29.8 本章复盘\n\n#### 29.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 6 层：信号-地-信号-电源-地-信号 | 叠层 | 高速参考 |\n| PCIe 85/90Ω | 差分 | 按协议 |\n| 电源×1.3 | 选型 | 峰值 |\n| 时序按手册 | 多路 | 使能级联 |\n| 过孔 stub 短 | 高速 | 背钻/盲埋 |\n\n| LPDDR4X 位宽 | 32bit | 单颗点对点 |\n| LPDDR4X VDDQ | 1.1V | 3% 纹波 |\n| LPDDR4X 等长 | 组内 ±5mil | 组间 ±10mil |\n| HDMI 4K | 100Ω | 对内 ±5mil |\n| PCIe Gen2 | 85Ω | 对内 ±5mil |\n| USB3 | 90Ω | 对内 ±5mil |\n| MIPI | 100Ω | 对内 ±5mil |\n| 核心电压 | 0.6～0.9V | DVFS |\n| Ztarget | 7.5mΩ | 0.6V/4A/5% |\n| 环境温度 | 45℃ | 满载 8h |\n\n#### 29.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| LPDDR | low power DDR | 低功耗内存 |\n| PCIe | peripheral component interconnect express | 高速串行总线 |\n| NPU | neural processing unit | 神经网络加速 |\n| PMIC | power management IC | 电源管理 |\n| stub | stub | 过孔未用段 |\n| 时序 | sequencing | 上电顺序 |\n\n**LPDDR4X**：低功耗双倍速率内存第四代 X，1.1V/1.8V。\n\n**Fly-by**：多点共享时钟/地址的拓扑。\n\n**DQS**：数据选通差分信号。\n\n**PMIC**：电源管理芯片，多路输出+时序。\n\n**PDN**：电源分配网络。\n\n**Ztarget**：目标阻抗。\n\n**MIPI D-PHY**：移动端差分物理层。\n\n**TMDS**：HDMI 差分传输。\n\n**stub**：过孔未使用的残段。\n\n**重训（retrain）**：链路重新训练。\n\n**扩频（SSC）**：时钟展频降 EMI。\n\n**θJA**：结到环境热阻。\n\n**21. 6 层板为什么不建议“一层地”？**\n答：LPDDR4X/PCIe/HDMI 同时需要连续参考，一层地会被“抢”，跨层/跨岛就断回流；两层地才能让内层信号“上下都有地”。\n\n**22. 去耦电容“容值越大越好”吗？**\n答：不是。大容量对低频有效，高频靠“小容量+短回路”；回路电感决定自谐振，超过谐振点电容变“电感”。\n\n**23. LPDDR4X 的 DQS 为什么要先布？**\n答：DQS 是采样基准，它的参考面/等长优先级最高；先布 DQS 再布 DQ，能避免“DQ 占好位置、DQS 绕远”。\n\n**24. HDMI 眼图“有台阶”说明什么？**\n答：阻抗不连续（焊盘/连接器/参考面挖空），不是“驱动不够”；先做 TDR，再调驱动。\n\n**25. PCIe 只跑 Gen1，先查什么？**\n答：先查 100MHz 参考时钟（抖动/走线/包地）与 PERST# 时序，再查连接器/走线 stub/电源。\n\n**26. MIPI 摄像头“识别不到”，先查什么？**\n答：先查 FPC 是否插反/锁紧、供电/复位/I2C，再降 lane/速率，最后查 FPC 阻抗。\n\n**27. 热测试为什么要“连续 8h”？**\n答：热稳态/风扇曲线/降频策略需要时间暴露；短测看不到“温度爬升/振荡”。\n\n**28. 关键料“第二来源”怎么验证？**\n答：参数→系统（训练/压力/EMC/热）→批次（3 批/50 片），每步留记录。\n\n**29. 6 层板 EMC 整改顺序？**\n答：源头（展频/滤波/屏蔽）→路径（包地/缝合孔/缩短）→天线（线缆/连接器），先近场定位。\n\n**30. 项目交付物有哪些？**\n答：原理图/PCB/Gerber/叠层表/BOM/拼板图/测试报告/问题库/烧录镜像/治具说明。\n\n#### 29.8.3 自测 10 题\n\n1. 6 层叠层怎么排？\n2. LPDDR4 和 DDR4 区别？\n3. 多路电源为什么要时序？\n4. PCIe 差分阻抗？\n5. USB3 过孔 stub 影响？\n6. DDR 训练失败查什么？\n7. 大电流电源怎么散热？\n8. Wi-Fi6 天线注意什么？\n9. 6 层比 4 层多了什么？\n10. 高速 Bring-Up 要测什么？\n\n**11. 为什么 6 层 AI 主板要“两层地”？**\n答：LPDDR4X/PCIe/HDMI 都需要连续参考；一层地不够分，信号跨层/抢参考会断回流。两层地让内层信号“上下都有地”。\n\n**12. LPDDR4X 训练失败先做什么？**\n答：先降频到 800MT/s 判断“连线对不对”；再查 VDDQ 纹波/参考面/等长；最后换颗粒/改时序。\n\n**13. Ztarget 怎么算？**\n答：Z=Vdd×允许纹波%/Imax。0.6V、5%、4A→7.5mΩ；LPDDR 1.1V、3%、1A→33mΩ。\n\n**14. HDMI 4K 眼图差，先改什么？**\n答：先缩短走线/同层直/参考连续；再换低电容 ESD；最后才调预加重/驱动。\n\n**15. PCIe 只跑 Gen1 说明什么？**\n答：链路基本通但余量不足：查参考时钟抖动/走线 stub/连接器/电源。\n\n**16. MIPI FPC 长了会怎样？**\n答：阻抗不连续/串扰/衰减，表现“花屏/识别不到”；要控阻抗、加地线、缩短。\n\n**17. PMIC 配置为什么要自己算？**\n答：参考板对应不同物料/负载/散热；照抄会“电压偏高/时序不对”。\n\n**18. 为什么要做 100 次反复上电？**\n答：抓“偶发不上电/时序竞争/放电不彻底”，量产常见。\n\n**19. 热测试判据是什么？**\n答：主控<105℃、PMIC<110℃、LPDDR/eMMC<85℃，45℃环境满载 8h，留 10℃。\n\n**20. 6 层板 EMC 的大头在哪？**\n答：接口共模（HDMI/网口/USB）与 PMIC 开关谐波；先近场定位再整改。\n\n#### 29.8.6 能力清单（续）\n\n- [ ] 能独立完成 6 层叠层选型，并写出可发板厂的叠层表。\n- [ ] 能算 Ztarget 并据此选去耦组合，画出 PDN 阻抗曲线。\n- [ ] 能布 LPDDR4X 32bit：先分区、再布 DQS、最后地址/命令。\n- [ ] 能布 HDMI 4K/USB3/PCIe/MIPI，并做等长/参考/阻抗检查。\n- [ ] 能配 PMIC 时序，并用示波器逐路验证、反复上电 100 次。\n- [ ] 能读 LPDDR 训练日志、按“降频→电源→参考面→等长”定位。\n- [ ] 能做 HDMI 眼图/PCIe 链路/热测试/近场扫描四项实测。\n- [ ] 能把问题写成“现象/定位/根因/对策/验证”，形成问题库。\n\n#### 29.8.4 能力清单\n\n- [ ] 能拆 AI 主板需求/功能块。\n- [ ] 能设计 6 层叠层。\n- [ ] 能规划多路电源/时序。\n- [ ] 能画 PCIe/USB3 差分。\n- [ ] 能制定高速 Bring-Up。\n\n#### 29.8.7 复盘清单（续）\n\n1. 叠层是否在布局前定稿，且板厂已确认阻抗？\n2. LPDDR4X 区域 L2/L4 是否完整、电源岛是否避开？\n3. 去耦回路是否 <2mm、每焊盘是否有独立过孔？\n4. HDMI/USB3/PCIe/MIPI 是否同层直、参考连续、等长达标？\n5. 过孔 stub 是否 <0.3mm、换层是否带地孔？\n6. PMIC 时序是否逐路实测、是否做过 100 次反复上电？\n7. 训练/压力测试是否覆盖“高温+低压+满负载”？\n8. 热测试是否按 45℃ 满载 8h，判据是否留 10℃？\n9. EMC 是否近场定位后再整改、是否留 6dB？\n10. 关键料是否有第二来源/替代预案？\n\n#### 29.8.5 下一章\n\n下一章讲**8 层板·RK3588 工业主板（选学）**：更高层数、更多高速接口、更严的工业要求。\n\n\n### 29.9 项目交付物与验收\n\n交付物：原理图（PDF+源文件）、PCB（Gerber/钻孔/叠层表/阻抗报告）、BOM（含替代料/第二来源）、拼板图、Bring-Up 记录（时序/训练/接口/热/EMC）、问题库（现象/定位/根因/对策/验证）、烧录镜像与治具说明、结构 3D/开孔图。验收判据：1080p/4K 输出稳定、千兆网吞吐达标、LPDDR4X 满速 memtester 4h 无错、PCIe Gen2 满宽、45℃ 满载 8h 不降频、EMC 预测试留 6dB、小批良率≥95%。验收不是“点亮”，是“可量产”。每一项要有“谁测/怎么测/判据/证据”，否则“验收”只是口头。\n\n### 29.10 从 6 层到 8 层的“难度台阶”\n\n8 层 RK3588 项目在 6 层基础上加：LPDDR5（更高速率/更低电压/更严等长）、PCIe 3.0/4.0（更低损耗/更高频率）、多路 4K 显示、SATA/多网口、更多电源域。难点从“能不能布”变成“损耗/抖动/电源完整性/散热”的精细控制：叠层从“两层地”到“多层地+电源平面”、阻抗从 ±10% 到 ±7%、过孔从“通孔”到“盲埋/背钻”。方法论不变：需求→框图→电源树→关键电路→叠层→布局→等长→Bring-Up→EMC→量产。6 层板把“规范”练成习惯，8 层板才有“精度”。\n\n### 29.11 本章小结\n\n这一章用 RK3576 把“6 层板 + LPDDR4X + HDMI 4K + PCIe + USB3 + MIPI + 千兆”串成一个项目。核心不是“记住参数”，而是“建立顺序感”：叠层先于布局、分区先于走线、DQS 先于 DQ、电源先于信号、测试先于优化。真正拉开差距的是“定位能力”：训练失败先降频、眼图有台阶先 TDR、PCIe 降速先查时钟、卡顿先测温度。把这四条变成习惯，8 层板也只是“同一套方法、更严的公差”。\n\n\n### 29.12 项目复盘三问\n\n一问：哪一处“最贵”？答：LPDDR4X 参考面被电源岛切开，满速训练失败、改版重投；教训是“分区先于布线”。二问：哪一处“最省”？答：叠层先行+板厂阻抗表，首批 TDR 一次过，省掉“改叠层重布”的两周。三问：下一版先改什么？答：把“LPDDR/PCIe 的参考面禁开槽区”画成图，贴在评审桌上，任何人改电源岛先看这张图。\n\n### 29.13 下一章预告\n\n第 30 章把层数加到 8 层、内存换成 LPDDR5、接口加到 PCIe 3.0/4.0、多路 4K、双千兆，主控换成 RK3588。难度不在“多画几层”，而在“损耗/抖动/电源完整性/散热”的精度：叠层要“多层地+电源”、阻抗 ±7%、过孔要“背钻/盲埋”、电源要“多相/远程 sense”。本章的顺序感（叠层→分区→关键信号→测试）会原样复用，只是每一步的“公差”更小。\n\n### 29.14 出板前最后一小时\n\n清单：叠层表已回签、阻抗条已排、LPDDR/PCIe 参考面禁开槽图已核对、差分等长报告已出、去耦回路已放大检查、过孔 stub 已量、PMIC 时序已仿真/实测、电源载流/热过孔已算、拼板/Mark/工艺边已画、BOM/位号/极性已核、Gerber/钻孔/阻抗说明已齐。每项“有人签字+有证据”，不要“大家以为别人看过”。这一小时能省“两周改版”。\n\n### 29.15 综合案例：一次“满速不过”的联合调试\n\n现象：LPDDR4X 满速偶发错码，同时 HDMI 4K 偶发闪屏。单独测都“基本正常”，一起跑就出问题。假设：①电源耦合——LPDDR 与 HDMI 共用 1.8V；②参考面——HDMI 走 L1、LPDDR 走 L3，共用 L2；③地弹——NPU 满载时 di/dt 大。验证：分别关 HDMI/降 NPU，错码减少；量 1.8V 纹波，HDMI 工作时从 25mV 升到 60mV。结论：电源耦合+地弹。对策：1.8V 分两路（LPDDR 单独 LDO）、HDMI 加 LC、L2 在 LPDDR 区域加缝合孔、NPU 满载时风扇提前提速。复测满速+4K 同时跑 4 小时无错。教训：**“单独正常、一起出错”多半是电源/地共享**，先拆分再谈信号。\n\n### 29.16 给自学者的建议\n\n先“跑通”再“跑快”：LPDDR 先 800MT/s、PCIe 先 Gen1、HDMI 先 1080p，稳定后再逐级提速，每一步记“余量”。先“量”再“猜”：电压/纹波/眼图/温度，四个量能解决 80% 的问题。先“简单”再“复杂”：能单颗内存就单颗、能点对点就点对点、能少一层就少一层。项目能力不是“会画 8 层板”，是“知道为什么这样画、出问题怎么定位”。\n\n### 29.17 本章一页纸总结\n\n叠层：L1 高速 / L2 地 / L3 LPDDR+PCIe / L4 地 / L5 电源岛 / L6 低速。电源：12V→5/3.3/1.8/1.1/0.6V，Ztarget 7.5mΩ。信号：LPDDR4X 32bit 点对点、HDMI 4K 100Ω、PCIe 85Ω、USB3 90Ω、MIPI 100Ω。测试：时序→训练→眼图→热→EMC。坑：跨岛、单层地、照抄 PMIC、M.2 不固定、只加散热片、认证最后做。方法：先分区后布线、先跑通再提速、先测量再猜。\n\n### 29.18 交接给第 30 章的三张图\n\n第一张“叠层表”，第二张“电源树+时序”，第三张“关键信号约束表”。做 8 层板时先把这三张图填满，再动原理图；三张图没定，画得越快返工越多。项目交接不是“把文件发过去”，是“把判断依据交过去”。\n\n### 29.19 本章自检一句话\n\n合上文档，你能否用三分钟讲清“为什么 6 层、为什么 LPDDR4X 走 L3、PMIC 时序为什么这样排”？能讲清，这一章就过关；讲不清，回去看 29.2 与 29.4.3。\n\n**完**：第 29 章到此收束，下一章进入 8 层 RK3588 工业主板。\n\n**下一章见**：把本章的三张图带进 8 层项目，你会发现“难”是难在细节，不是难在概念。\n\n**补充**：若只能记住一句，就记“先定参考面，再谈走线”；参考面错了，等长/阻抗/滤波都是白费。","taskSignature":"d3c21def9eb7c2cb862fb1b5c1c2f3d0a240289bc3268bde656a6d1db30b6eae","taskCount":13},{"id":"30","title":"第 30 章 · 8 层板项目：RK3588 工业主板（选学）","short":"8 层板项目：RK3588 工业主板","stage":4,"diff":5,"prev":"第 29 章 6 层板项目：RK3576 AI 主板","optional":true,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清 RK3588 类工业主板与消费板的设计差异。\n2. 设计 8 层叠层，给 PCIe/SATA/USB3/HDMI/DDR 分参考面。\n3. 处理工业板的宽温、隔离、EMC、看门狗、长寿命要求。\n4. 规划多路大电流电源、散热、结构/连接器。\n5. 做 8 层板关键布线：DDR、PCIe、SATA、USB3、HDMI。\n6. 制定工业级测试/认证计划。\n7. 说出至少 8 个 8 层工业板常见坑。\n\n8 层板不是“炫技”，是“给每条高速总线足够的参考面和走线层”。工业板还要多一层“可靠性/长寿命/宽温”的约束。\n\n## 正文\n\n### 30.1 需求与功能块\n\n需求：8 层板，RK3588 类 SoC，LPDDR4/DDR4 8GB，eMMC 64GB，2×千兆/2.5G 以太网，PCIe/SATA，USB3，HDMI/DP，MIPI，CAN/RS485，12～24V 宽压输入，−40～+85℃ 工业温。\n\n| 块 | 关键 | 工业要求 |\n|---|---|---|\n| SoC | RK3588 | 宽温/散热 |\n| 内存 | LPDDR4/DDR4 | 高速/宽温 |\n| 存储 | eMMC/SSD | 长寿命 |\n| 网络 | 2×以太网 | 隔离/防雷 |\n| 工业接口 | CAN/RS485/DI/DO | 隔离/保护 |\n| 电源 | 宽压/多路 | 浪涌/时序 |\n| 结构 | 连接器/散热 | 振动/防护 |\n\n### 30.2 系统框图与 8 层叠层\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 400\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 30-1：RK3588 工业主板框图<\/text>\n  <rect x=\"260\" y=\"80\" width=\"200\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"115\" font-size=\"14\" fill=\"currentColor\">RK3588<\/text>\n  <text x=\"290\" y=\"140\" font-size=\"11\" fill=\"currentColor\">CPU/GPU/NPU<\/text>\n  <rect x=\"40\" y=\"70\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"100\" font-size=\"12\" fill=\"currentColor\">LPDDR4/DDR4<\/text>\n  <rect x=\"530\" y=\"70\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"555\" y=\"100\" font-size=\"12\" fill=\"currentColor\">eMMC/SSD<\/text>\n  <rect x=\"40\" y=\"190\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"220\" font-size=\"12\" fill=\"currentColor\">2×以太网<\/text>\n  <rect x=\"260\" y=\"190\" width=\"200\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"290\" y=\"220\" font-size=\"12\" fill=\"currentColor\">PCIe/SATA/USB3<\/text>\n  <rect x=\"530\" y=\"190\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"555\" y=\"220\" font-size=\"12\" fill=\"currentColor\">CAN/RS485/DI/DO<\/text>\n  <rect x=\"260\" y=\"310\" width=\"200\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"285\" y=\"340\" font-size=\"12\" fill=\"currentColor\">12～24V 宽压/隔离<\/text>\n  <line x1=\"200\" y1=\"100\" x2=\"260\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"110\" x2=\"530\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"220\" x2=\"260\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"220\" x2=\"530\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"310\" x2=\"360\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n8 层叠层：\n\n| 层 | 用途 |\n|---|---|\n| L1 | 器件 + 高速（PCIe/USB3/HDMI） |\n| L2 | 地 |\n| L3 | 高速（DDR/差分） |\n| L4 | 电源 |\n| L5 | 地 |\n| L6 | 高速（DDR/差分） |\n| L7 | 电源/低速 |\n| L8 | 低速/器件 |\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 400\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 30-2：8 层叠层：双地-电源-双信号<\/text>\n  <rect x=\"100\" y=\"55\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"75\" font-size=\"10\" fill=\"currentColor\">L1 信号/器件<\/text>\n  <rect x=\"100\" y=\"85\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"105\" font-size=\"10\" fill=\"currentColor\">L2 地<\/text>\n  <rect x=\"100\" y=\"115\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"135\" font-size=\"10\" fill=\"currentColor\">L3 高速<\/text>\n  <rect x=\"100\" y=\"145\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"165\" font-size=\"10\" fill=\"currentColor\">L4 电源<\/text>\n  <rect x=\"100\" y=\"175\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"195\" font-size=\"10\" fill=\"currentColor\">L5 地<\/text>\n  <rect x=\"100\" y=\"205\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"225\" font-size=\"10\" fill=\"currentColor\">L6 高速<\/text>\n  <rect x=\"100\" y=\"235\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"255\" font-size=\"10\" fill=\"currentColor\">L7 电源/低速<\/text>\n  <rect x=\"100\" y=\"265\" width=\"420\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"285\" font-size=\"10\" fill=\"currentColor\">L8 低速/器件<\/text>\n  <text x=\"100\" y=\"330\" font-size=\"13\" fill=\"currentColor\">L3/L6 高速各有 L2/L5 地参考；L4/L7 电源完整。<\/text>\n<\/svg>\n```\n\n### 30.3 关键参数与工业约束\n\n| 项目 | 约束 | 说明 |\n|---|---|---|\n| 输入 | 12～24V ±20% | 浪涌/反接 |\n| 隔离 | CAN/RS485/DI/DO | 隔离电压 |\n| 温度 | −40～+85℃ | 降额/器件 |\n| 叠层 | 8 层，双地 | 高速回流 |\n| 连接器 | 锁扣/防振 | 机械寿命 |\n| EMC | 工业四级 | 预测试 |\n\n### 30.4 关键电路\n\n#### 30.4.1 工业接口隔离\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 30-3：CAN/RS485 隔离与保护<\/text>\n  <rect x=\"60\" y=\"80\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"115\" font-size=\"12\" fill=\"currentColor\">SoC<\/text>\n  <rect x=\"220\" y=\"80\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"235\" y=\"115\" font-size=\"11\" fill=\"currentColor\">隔离器<\/text>\n  <rect x=\"380\" y=\"80\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"395\" y=\"115\" font-size=\"11\" fill=\"currentColor\">收发器<\/text>\n  <rect x=\"540\" y=\"80\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"555\" y=\"115\" font-size=\"11\" fill=\"currentColor\">TVS/端子<\/text>\n  <line x1=\"180\" y1=\"120\" x2=\"220\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"340\" y1=\"120\" x2=\"380\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"500\" y1=\"120\" x2=\"540\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"230\" font-size=\"13\" fill=\"currentColor\">隔离电源/地；TVS 靠端子；共模/终端按总线。<\/text>\n<\/svg>\n```\n\n#### 30.4.2 宽压输入与浪涌\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 30-4：12～24V 宽压输入保护<\/text>\n  <text x=\"40\" y=\"95\" font-size=\"12\" fill=\"currentColor\">12～24V<\/text>\n  <line x1=\"120\" y1=\"90\" x2=\"180\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"180\" y=\"70\" width=\"100\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"195\" y=\"100\" font-size=\"11\" fill=\"currentColor\">保险/GDT<\/text>\n  <line x1=\"280\" y1=\"90\" x2=\"340\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"340\" y=\"70\" width=\"100\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"355\" y=\"100\" font-size=\"11\" fill=\"currentColor\">TVS/滤波<\/text>\n  <line x1=\"440\" y1=\"90\" x2=\"500\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"500\" y=\"70\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"515\" y=\"100\" font-size=\"11\" fill=\"currentColor\">DCDC 宽压<\/text>\n  <text x=\"40\" y=\"210\" font-size=\"13\" fill=\"currentColor\">宽压范围覆盖 12～24V±20%；浪涌按工业标准。<\/text>\n  <text x=\"40\" y=\"235\" font-size=\"13\" fill=\"currentColor\">反接/过压/欠压/浪涌，四级保护。<\/text>\n<\/svg>\n```\n\n### 30.5 选型与降额\n\n| 器件 | 选择 | 降额 |\n|---|---|---|\n| SoC | RK3588 | 散热/宽温 |\n| DDR | LPDDR4/DDR4 8GB | 速率/宽温 |\n| 电源 | 宽压 DCDC | 电流×1.3 |\n| 隔离器 | 数字隔离 | 耐压 |\n| TVS | 工业级 | 钳位 |\n| 连接器 | 工业/锁扣 | 振动 |\n\n### 30.6 测量与仿真\n\n#### 30.6.1 工业测试\n\n1. 宽压 12～24V 上下限。\n2. 高低温 −40～+85℃。\n3. 振动/跌落。\n4. ESD/浪涌/群脉冲。\n5. 长时间老化。\n6. 看门狗/掉电恢复。\n\n#### 30.6.2 CircuitJS\n\n```circuitjs\npower-buck\n```\n\n观察宽压输入下的占空比/纹波变化。\n\n#### 30.6.3 动手任务\n\n- 画 RK3588 框图/8 层叠层。\n- 画 CAN/RS485 隔离链。\n- 画宽压输入保护。\n- 列工业测试计划。\n\n### 30.7 常见坑\n\n1. **叠层参考面不连续**：高速失败。\n2. **宽压范围不够**：24V 输入过压。\n3. **隔离/地处理错**：CAN/RS485 不通。\n4. **散热不足**：高温降频。\n5. **连接器不锁扣**：振动松脱。\n6. **EMC 只做消费级**：工业现场不过。\n7. **看门狗/掉电恢复缺失**：死机不恢复。\n8. **长寿命器件未选**：批量早期失效。\n9. **测试点不足**：现场无法诊断。\n\n### 30.8 本章复盘\n\n#### 30.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 8 层双地-电源-双信号 | 叠层 | 高速参考 |\n| 宽压 12～24V±20% | 输入 | 工业 |\n| 隔离耐压按标准 | CAN/RS485 | 隔离电源 |\n| 降额 50% | 连接器/电容 | 长寿命 |\n| 工业温度 −40～+85℃ | 测试 | 宽温 |\n\n#### 30.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 工业主板 | industrial motherboard | 宽温/长寿命主板 |\n| 隔离 | isolation | 电气隔离 |\n| 宽压 | wide input | 宽输入范围 |\n| 看门狗 | watchdog | 死机复位 |\n| 锁扣 | latch | 连接器防脱 |\n\n#### 30.8.3 自测 10 题\n\n1. 工业板和消费板差异？\n2. 8 层叠层怎么排？\n3. 宽压输入范围？\n4. CAN/RS485 为什么要隔离？\n5. 工业温度范围？\n6. 连接器为什么要锁扣？\n7. 看门狗作用？\n8. 工业 EMC 和消费级差在哪？\n9. 长寿命器件怎么选？\n10. 8 层比 6 层多了什么？\n\n#### 30.8.4 能力清单\n\n- [ ] 能拆工业主板需求。\n- [ ] 能设计 8 层叠层。\n- [ ] 能处理宽压/隔离/EMC。\n- [ ] 能画工业接口保护。\n- [ ] 能制定工业测试计划。\n\n#### 30.8.5 下一章\n\n下一章进入阶段五：**消费电子维修与 BGA 返修（选学）**。从设计转向维修，理解板子坏了怎么查、怎么修。","taskSignature":"7575334c6897eb671cd69ebb215dbe5dd0a8abf6146c1b5f76edf415460cfcea","taskCount":5},{"id":"31","title":"第 31 章 · 消费电子维修与 BGA 返修（选学）","short":"消费电子维修与 BGA 返修","stage":5,"diff":4,"prev":"第 10 章 焊接与返修基础、第 20 章 首板上电与 Bring-Up","optional":true,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 按“观察→测阻→测压→分段”的顺序排查一块不亮的消费电子板。\n2. 用万用表/示波器/热像仪定位短路、开路、虚焊、器件失效。\n3. 认识 BGA 返修的设备与流程：预热、拆焊、植球、回流。\n4. 判断“值得修/不值得修”，避免把板子修废。\n5. 处理维修中的安全边界：电池、电容、静电、高温。\n6. 写维修记录，形成故障库。\n7. 说出至少 8 个维修/BGA 返修常见坑。\n\n维修不是“换件”，是“用证据缩小范围”。BGA 返修不是“吹下来再吹上去”，是“控制温度曲线和应力”。\n\n## 正文\n\n### 31.1 它解决什么问题：三个真实场景\n\n#### 场景一：手机不亮，先换屏还是先测电？\n\n换屏成本高，可能只是电池/排线/电源 IC。先测电池电压、开机电流、主供电，再决定换什么。\n\n#### 场景二：笔记本短路，一上电就大电流\n\n用可调电源限流，测对地阻抗，热像仪找发热点；拆电容/换 IC，不要盲目加焊。\n\n#### 场景三：BGA 虚焊，吹下来植球失败\n\n温度不够/助焊剂不足/植球错位，BGA 报废。BGA 返修要预热台+热风+植球台，按曲线。\n\n### 31.2 它是什么：维修四步与 BGA 五步\n\n维修四步：\n\n1. **观察**：外观、烧痕、电容鼓包、进液、焊点。\n2. **测阻**：断电测关键点对地阻抗，找短路。\n3. **测压**：限流上电，测各级电压。\n4. **分段**：断开负载/飞线，缩小故障范围。\n\nBGA 五步：\n\n1. 预热（板底 100～150℃）\n2. 拆焊（热风 220～250℃，按锡膏）\n3. 清焊盘/植球\n4. 贴装/对位\n5. 回流（按曲线）\n\n> **术语第一次出现**：植球（reballing）是给 BGA 重新做焊球。需要钢网/植球台，球径/间距按封装。\n\n### 31.3 关键参数与工具\n\n| 工具 | 用途 | 参数 |\n|---|---|---|\n| 可调电源 | 限流上电 | 电压/限流 |\n| 万用表 | 阻/压/通断 | 二极管档 |\n| 热像仪 | 找发热 | — |\n| 热风枪 | 拆焊 | 300～380℃ |\n| 预热台 | BGA 底部加热 | 100～150℃ |\n| 植球台/钢网 | BGA 植球 | 球径/间距 |\n| 放大镜/显微镜 | 检查 | 5～20× |\n\n### 31.4 三个典型维修流程\n\n#### 31.4.1 不亮排查\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 31-1：不亮排查顺序<\/text>\n  <rect x=\"280\" y=\"55\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"85\" font-size=\"13\" fill=\"currentColor\">不亮<\/text>\n  <rect x=\"60\" y=\"140\" width=\"150\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"80\" y=\"170\" font-size=\"12\" fill=\"currentColor\">外观/进液<\/text>\n  <rect x=\"270\" y=\"140\" width=\"150\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"290\" y=\"170\" font-size=\"12\" fill=\"currentColor\">电池/输入<\/text>\n  <rect x=\"480\" y=\"140\" width=\"180\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"170\" font-size=\"12\" fill=\"currentColor\">主供电/短路<\/text>\n  <rect x=\"60\" y=\"235\" width=\"150\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"80\" y=\"265\" font-size=\"11\" fill=\"currentColor\">排线/屏/开关<\/text>\n  <rect x=\"270\" y=\"235\" width=\"150\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"290\" y=\"265\" font-size=\"11\" fill=\"currentColor\">电源 IC/时序<\/text>\n  <rect x=\"480\" y=\"235\" width=\"180\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"265\" font-size=\"11\" fill=\"currentColor\">CPU/字库/虚焊<\/text>\n  <line x1=\"360\" y1=\"105\" x2=\"360\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"210\" y1=\"165\" x2=\"270\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"420\" y1=\"165\" x2=\"480\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n#### 31.4.2 短路定位\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 31-2：限流+热像定位短路<\/text>\n  <rect x=\"80\" y=\"80\" width=\"160\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"115\" font-size=\"12\" fill=\"currentColor\">可调电源<\/text>\n  <text x=\"100\" y=\"140\" font-size=\"11\" fill=\"currentColor\">1V/限流 100mA<\/text>\n  <rect x=\"300\" y=\"80\" width=\"160\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"320\" y=\"115\" font-size=\"12\" fill=\"currentColor\">板子<\/text>\n  <text x=\"320\" y=\"140\" font-size=\"11\" fill=\"currentColor\">对地短路<\/text>\n  <rect x=\"520\" y=\"80\" width=\"150\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"545\" y=\"115\" font-size=\"12\" fill=\"currentColor\">热像仪<\/text>\n  <text x=\"545\" y=\"140\" font-size=\"11\" fill=\"currentColor\">找热点<\/text>\n  <line x1=\"240\" y1=\"120\" x2=\"300\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"120\" x2=\"520\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"220\" font-size=\"13\" fill=\"currentColor\">先限流，再看热点；拆/换发热器件，不要满压硬扛。<\/text>\n<\/svg>\n```\n\n#### 31.4.3 BGA 返修\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 31-3：BGA 返修五步<\/text>\n  <rect x=\"30\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"115\" font-size=\"11\" fill=\"currentColor\">预热<\/text>\n  <rect x=\"170\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"190\" y=\"115\" font-size=\"11\" fill=\"currentColor\">拆焊<\/text>\n  <rect x=\"310\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"330\" y=\"115\" font-size=\"11\" fill=\"currentColor\">清焊盘/植球<\/text>\n  <rect x=\"450\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"470\" y=\"115\" font-size=\"11\" fill=\"currentColor\">贴装<\/text>\n  <rect x=\"590\" y=\"80\" width=\"100\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"605\" y=\"115\" font-size=\"11\" fill=\"currentColor\">回流<\/text>\n  <line x1=\"150\" y1=\"110\" x2=\"170\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"290\" y1=\"110\" x2=\"310\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"430\" y1=\"110\" x2=\"450\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"570\" y1=\"110\" x2=\"590\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"30\" y=\"210\" font-size=\"13\" fill=\"currentColor\">预热减应力；拆焊温度按锡膏；植球对位；回流按曲线。<\/text>\n<\/svg>\n```\n\n### 31.5 选型与降额\n\n| 场景 | 方案 | 注意 |\n|---|---|---|\n| 手机/平板 | 先测电/排线 | 不盲目换屏 |\n| 笔记本 | 限流+热像 | 主板短路 |\n| BGA | 预热台+热风 | 温度曲线 |\n| 进液板 | 清洗/超声 | 腐蚀/漏电 |\n| 电池 | 防爆/绝缘 | 安全 |\n\n### 31.6 测量与仿真\n\n#### 31.6.1 维修记录\n\n| 板号 | 现象 | 测点 | 结论 | 处理 | 结果 |\n|---|---|---|---|---|---|\n| 001 | 不亮 | 电池 0V | 电池饿死 | 激活/换 | 亮 |\n| 002 | 大电流 | 3.3V 对地 5Ω | 电容短路 | 拆电容 | 正常 |\n\n#### 31.6.2 CircuitJS\n\n```circuitjs\ndiode-forward\n```\n\n观察二极管档测结压降，理解万用表判好坏。\n\n#### 31.6.3 动手任务\n\n- 找一块废板，练测阻/测压。\n- 用限流电源+热像找短路（有条件）。\n- 记录 5 条维修案例。\n- 看一次 BGA 返修视频/实操。\n\n### 31.7 常见坑\n\n1. **不测阻直接上电**：短路扩大。\n2. **满压硬扛**：烧更多器件。\n3. **盲目换件**：成本高/问题没找到。\n4. **BGA 不预热**：板子变形/焊盘脱落。\n5. **植球错位/球径错**：返修失败。\n6. **温度过高**：芯片/PCB 损坏。\n7. **静电**：修好又坏。\n8. **电池/电容未放电**：触电/短路。\n9. **不记录**：经验不积累。\n\n### 31.8 本章复盘\n\n#### 31.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 观察→测阻→测压→分段 | 维修 | 先断电 |\n| 限流 100mA | 短路 | 1V 起步 |\n| BGA 预热 100～150℃ | 返修 | 减应力 |\n| 拆焊 220～250℃ | BGA | 按锡膏 |\n| 记录故障库 | 经验 | 可复用 |\n\n#### 31.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 植球 | reballing | 给 BGA 重做焊球 |\n| 虚焊 | cold joint | 未润湿焊点 |\n| 限流 | current limit | 限制短路电流 |\n| 热像 | thermal image | 找发热点 |\n| 进液 | liquid damage | 液体腐蚀 |\n\n#### 31.8.3 自测 10 题\n\n1. 维修四步是什么？\n2. 不亮先查什么？\n3. 短路怎么定位？\n4. BGA 返修五步？\n5. 为什么要预热？\n6. 植球注意什么？\n7. 电池/电容安全边界？\n8. 什么时候不值得修？\n9. 维修记录写什么？\n10. 静电怎么防？\n\n#### 31.8.4 能力清单\n\n- [ ] 能按四步排查不亮/短路。\n- [ ] 能用限流+热像定位。\n- [ ] 了解 BGA 返修流程。\n- [ ] 能判断维修价值。\n- [ ] 能写维修记录。\n\n#### 31.8.5 下一章\n\n下一章讲**硬件工程师职业路径与简历**：从“会修/会画”走向“能求职/能成长”。","taskSignature":"b836ec0cfcfbfbd9eaec845f5f1d214a39ee94578b5f44016c6cd0522bcd5fff","taskCount":5},{"id":"32","title":"第 32 章 · 硬件工程师职业路径与简历","short":"硬件工程师职业路径与简历","stage":5,"diff":2,"prev":"第 23 章 阶段复盘与设计评审、第 30/31 章（按方向）","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清硬件工程师的常见岗位方向：原理图/PCB、SI/PI、电源、EMC、测试、FAE。\n2. 给自己定位：零基础、转岗、应届、有经验。\n3. 写一份“项目导向”的硬件简历，而不是课程列表。\n4. 用 STAR 法描述一个项目：背景、任务、行动、结果。\n5. 准备作品集：原理图、PCB、测试报告、维修记录。\n6. 规划 6～12 个月的学习/求职路线。\n7. 说出至少 8 个简历/求职常见坑。\n\n硬件求职看“你做过什么、怎么做的、结果如何”，不看“学了多少门课”。简历要把项目写成“可验证的证据”。\n\n## 正文\n\n### 32.1 它解决什么问题：三个真实场景\n\n#### 场景一：简历全是“熟悉/了解”，没有项目\n\nHR 看 10 秒，找不到“做过什么板、用什么软件、解决了什么问题”。简历要项目前置，技能后置。\n\n#### 场景二：项目写了“负责硬件设计”，没有细节\n\n面试官问“电源怎么选、DDR 怎么布线”，答不上。项目要写清你负责的模块、关键决策、测试结果。\n\n#### 场景三：转岗没作品，只有培训证书\n\n培训证书不等于能力。用一块自己画的板+测试记录，比证书更有说服力。\n\n### 32.2 它是什么：岗位地图与能力栈\n\n| 方向 | 日常 | 核心能力 |\n|---|---|---|\n| 原理图/PCB | 画图、布局、出板 | EDA、封装、DFM |\n| SI/PI | 高速仿真、阻抗 | 叠层、TDR、眼图 |\n| 电源 | DCDC/LDO/PMIC | 拓扑、环路、热 |\n| EMC | 认证、整改 | 滤波、屏蔽、接地 |\n| 测试 | Bring-Up、可靠性 | 仪器、测试计划 |\n| FAE/技术支持 | 客户方案 | 沟通、协议、debug |\n\n> **术语第一次出现**：STAR 法是 Situation（背景）、Task（任务）、Action（行动）、Result（结果）四段式，用来把项目讲成可验证的故事。\n\n### 32.3 关键内容：简历结构\n\n推荐一页结构：\n\n1. 基本信息（姓名/联系方式/城市）。\n2. 求职意向（岗位/方向）。\n3. 项目经历（2～3 个，STAR）。\n4. 技能（EDA/仪器/协议）。\n5. 教育/证书（可选）。\n6. 作品集链接（PDF/GitHub）。\n\n### 32.4 三个典型表达\n\n#### 32.4.1 项目经历模板\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 32-1：项目经历的 STAR 结构<\/text>\n  <rect x=\"40\" y=\"70\" width=\"150\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"100\" font-size=\"12\" fill=\"currentColor\">S 背景<\/text>\n  <text x=\"55\" y=\"122\" font-size=\"10\" fill=\"currentColor\">为什么做<\/text>\n  <rect x=\"210\" y=\"70\" width=\"150\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"230\" y=\"100\" font-size=\"12\" fill=\"currentColor\">T 任务<\/text>\n  <text x=\"225\" y=\"122\" font-size=\"10\" fill=\"currentColor\">你负责什么<\/text>\n  <rect x=\"380\" y=\"70\" width=\"150\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"100\" font-size=\"12\" fill=\"currentColor\">A 行动<\/text>\n  <text x=\"395\" y=\"122\" font-size=\"10\" fill=\"currentColor\">关键决策<\/text>\n  <rect x=\"550\" y=\"70\" width=\"130\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"570\" y=\"100\" font-size=\"12\" fill=\"currentColor\">R 结果<\/text>\n  <text x=\"565\" y=\"122\" font-size=\"10\" fill=\"currentColor\">数据/验证<\/text>\n  <line x1=\"190\" y1=\"105\" x2=\"210\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"105\" x2=\"380\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"530\" y1=\"105\" x2=\"550\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"210\" font-size=\"13\" fill=\"currentColor\">结果尽量量化：层数/尺寸/电流/温升/良率/测试项。<\/text>\n<\/svg>\n```\n\n#### 32.4.2 能力矩阵\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 32-2：硬件能力矩阵<\/text>\n  <rect x=\"40\" y=\"60\" width=\"640\" height=\"180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"40\" y1=\"100\" x2=\"680\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"140\" x2=\"680\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"180\" x2=\"680\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"85\" font-size=\"11\" fill=\"currentColor\">能力<\/text>\n  <text x=\"250\" y=\"85\" font-size=\"11\" fill=\"currentColor\">入门<\/text>\n  <text x=\"400\" y=\"85\" font-size=\"11\" fill=\"currentColor\">熟练<\/text>\n  <text x=\"550\" y=\"85\" font-size=\"11\" fill=\"currentColor\">精通<\/text>\n  <text x=\"55\" y=\"125\" font-size=\"11\" fill=\"currentColor\">EDA/PCB<\/text>\n  <text x=\"55\" y=\"165\" font-size=\"11\" fill=\"currentColor\">电源/接口<\/text>\n  <text x=\"55\" y=\"205\" font-size=\"11\" fill=\"currentColor\">测试/维修<\/text>\n<\/svg>\n```\n\n#### 32.4.3 6～12 个月路线\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 32-3：学习/求职路线<\/text>\n  <rect x=\"40\" y=\"80\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"105\" font-size=\"11\" fill=\"currentColor\">1～2 月<\/text>\n  <text x=\"55\" y=\"125\" font-size=\"10\" fill=\"currentColor\">基础+EDA<\/text>\n  <rect x=\"210\" y=\"80\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"225\" y=\"105\" font-size=\"11\" fill=\"currentColor\">3～4 月<\/text>\n  <text x=\"225\" y=\"125\" font-size=\"10\" fill=\"currentColor\">2 层项目板<\/text>\n  <rect x=\"380\" y=\"80\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"395\" y=\"105\" font-size=\"11\" fill=\"currentColor\">5～6 月<\/text>\n  <text x=\"395\" y=\"125\" font-size=\"10\" fill=\"currentColor\">4/6 层+测试<\/text>\n  <rect x=\"550\" y=\"80\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"565\" y=\"105\" font-size=\"11\" fill=\"currentColor\">7～12 月<\/text>\n  <text x=\"565\" y=\"125\" font-size=\"10\" fill=\"currentColor\">作品集/面试<\/text>\n  <line x1=\"180\" y1=\"110\" x2=\"210\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"350\" y1=\"110\" x2=\"380\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"110\" x2=\"550\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n### 32.5 选型与降额\n\n| 背景 | 建议方向 | 作品 |\n|---|---|---|\n| 零基础 | 原理图/PCB 助理 | 2 层控制板 |\n| 电子类应届 | 硬件工程师 | 4 层项目板 |\n| 转岗（软件/维修） | 测试/FAE/PCB | 测试报告+维修案例 |\n| 有经验 | SI/PI/电源 | 高速/电源专项 |\n\n### 32.6 测量与仿真\n\n#### 32.6.1 简历自检\n\n- 一页？项目在前？\n- 每个项目有数字/结果？\n- 技能与岗位匹配？\n- 作品集链接可打开？\n- 没有错别字/夸大？\n\n#### 32.6.2 CircuitJS\n\n```circuitjs\nrc-lowpass-159\n```\n\n用一个小电路作为“能讲清原理”的面试素材。\n\n#### 32.6.3 动手任务\n\n- 写一页简历（2 个项目）。\n- 用 STAR 改写一个项目。\n- 整理作品集 PDF。\n- 找 3 个目标岗位，对照 JD 补短板。\n\n### 32.7 常见坑\n\n1. **简历全是课程**：没有项目。\n2. **只写“负责”**：没有行动/结果。\n3. **夸大**：面试一问就穿。\n4. **技能堆砌**：与岗位不匹配。\n5. **作品集打不开**：链接失效。\n6. **没有量化**：看不出贡献。\n7. **一份简历投所有**：不针对性。\n8. **不准备项目问答**：细节答不上。\n\n### 32.8 本章复盘\n\n#### 32.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| STAR | 项目表达 | 背景/任务/行动/结果 |\n| 一页简历 | 格式 | 项目前置 |\n| 结果量化 | 说服力 | 数字/测试 |\n| 作品集 | 证据 | PDF/GitHub |\n| 岗位匹配 | 投递 | 对照 JD |\n\n#### 32.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| STAR | situation/task/action/result | 项目表达法 |\n| JD | job description | 岗位描述 |\n| 作品集 | portfolio | 项目证据 |\n| FAE | field application engineer | 现场应用工程师 |\n| SI/PI | signal/power integrity | 信号/电源完整性 |\n\n#### 32.8.3 自测 10 题\n\n1. 硬件岗位有哪些方向？\n2. STAR 四段是什么？\n3. 简历项目要写哪些数字？\n4. 零基础先做什么项目？\n5. 转岗怎么证明能力？\n6. 作品集放什么？\n7. 简历为什么要一页？\n8. 怎么对照 JD 补短板？\n9. 面试项目会被问什么？\n10. 6～12 个月怎么排？\n\n#### 32.8.4 能力清单\n\n- [ ] 能给自己定位方向。\n- [ ] 能写一页项目导向简历。\n- [ ] 能用 STAR 讲项目。\n- [ ] 能整理作品集。\n- [ ] 能规划学习/求职路线。\n\n#### 32.8.5 下一章\n\n下一章讲**作品集与面试表达**：简历让你进面试，作品集和表达让你拿到 offer。","taskSignature":"d89be1bee1001364abf936a7331f062dc1c6ca2afd5ec2d5c04cbb5e7cc50ebc","taskCount":5},{"id":"33","title":"第 33 章 · 作品集与面试表达","short":"作品集与面试表达","stage":5,"diff":2,"prev":"第 32 章 硬件工程师职业路径与简历","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 把 2～3 个项目整理成一份 10～15 页作品集。\n2. 每个项目讲清：需求、方案、关键决策、测试结果、复盘。\n3. 应对高频硬件面试题：电源/接口/布局/测试/项目细节。\n4. 用“结论先行+证据”回答，不背课文。\n5. 处理不会的问题：承认边界、给出思路。\n6. 做一次模拟面试并复盘。\n7. 说出至少 8 个面试表达常见坑。\n\n面试不是“考试”，是“验证你能不能解决真实问题”。作品集是你自己的证据链。\n\n## 正文\n\n### 33.1 它解决什么问题：三个真实场景\n\n#### 场景一：作品集只有截图，没有“为什么”\n\n面试官看到一张 PCB 图，问“为什么这样布局”，答不上。作品集要有决策和验证，不是图册。\n\n#### 场景二：面试问“你遇到最大的问题”，答“没什么问题”\n\n没有故障/返工/测试失败，说明项目太浅或没参与。准备 1～2 个“踩坑—定位—解决”的故事。\n\n#### 场景三：不会的问题硬编，露馅\n\n面试官问 DDR 眼图，不会就承认“没做过高速实测，但知道等长/阻抗/参考面”，再讲思路。诚实+思路比瞎编好。\n\n### 33.2 它是什么：作品集=证据链\n\n一份作品集：\n\n1. 封面/目录\n2. 项目 1：需求→方案→原理图→PCB→测试→复盘\n3. 项目 2（可选）\n4. 技能/工具\n5. 附录：测试记录/ Gerber 截图/照片\n\n> **术语第一次出现**：证据链（evidence chain）是从需求到测试结果的完整记录，能证明“这个项目是你做的、做对了”。\n\n### 33.3 关键内容：项目页模板\n\n| 页 | 内容 |\n|---|---|\n| 1 | 项目名/一句话目标/你的角色 |\n| 2 | 需求/指标/框图 |\n| 3 | 电源/关键电路 |\n| 4 | PCB 布局/叠层 |\n| 5 | 测试/Bring-Up 结果 |\n| 6 | 问题/复盘/改进 |\n\n### 33.4 三个典型表达\n\n#### 33.4.1 作品集结构\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 33-1：作品集结构<\/text>\n  <rect x=\"40\" y=\"70\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"105\" font-size=\"12\" fill=\"currentColor\">封面/目录<\/text>\n  <rect x=\"210\" y=\"70\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"230\" y=\"105\" font-size=\"12\" fill=\"currentColor\">项目证据链<\/text>\n  <rect x=\"400\" y=\"70\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"420\" y=\"105\" font-size=\"12\" fill=\"currentColor\">技能/工具<\/text>\n  <rect x=\"570\" y=\"70\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"590\" y=\"105\" font-size=\"12\" fill=\"currentColor\">附录<\/text>\n  <line x1=\"180\" y1=\"100\" x2=\"210\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"370\" y1=\"100\" x2=\"400\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"540\" y1=\"100\" x2=\"570\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n#### 33.4.2 面试回答结构\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 33-2：回答结构：结论→证据→边界<\/text>\n  <rect x=\"40\" y=\"70\" width=\"180\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"100\" font-size=\"12\" fill=\"currentColor\">结论先行<\/text>\n  <text x=\"55\" y=\"122\" font-size=\"10\" fill=\"currentColor\">1 句话给判断<\/text>\n  <rect x=\"260\" y=\"70\" width=\"200\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"100\" font-size=\"12\" fill=\"currentColor\">证据/做法<\/text>\n  <text x=\"275\" y=\"122\" font-size=\"10\" fill=\"currentColor\">项目/测试/数据<\/text>\n  <rect x=\"500\" y=\"70\" width=\"180\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"520\" y=\"100\" font-size=\"12\" fill=\"currentColor\">边界/不确定<\/text>\n  <text x=\"515\" y=\"122\" font-size=\"10\" fill=\"currentColor\">没做过就说明<\/text>\n  <line x1=\"220\" y1=\"105\" x2=\"260\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"105\" x2=\"500\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"210\" font-size=\"13\" fill=\"currentColor\">不要背定义，讲你实际怎么选/怎么测/怎么改。<\/text>\n<\/svg>\n```\n\n#### 33.4.3 高频问题地图\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 33-3：硬件面试高频问题<\/text>\n  <rect x=\"40\" y=\"60\" width=\"200\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"85\" font-size=\"12\" fill=\"currentColor\">电源<\/text>\n  <text x=\"55\" y=\"110\" font-size=\"10\" fill=\"currentColor\">LDO/Buck 选型<\/text>\n  <text x=\"55\" y=\"130\" font-size=\"10\" fill=\"currentColor\">功耗/纹波/布局<\/text>\n  <rect x=\"260\" y=\"60\" width=\"200\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"85\" font-size=\"12\" fill=\"currentColor\">接口<\/text>\n  <text x=\"275\" y=\"110\" font-size=\"10\" fill=\"currentColor\">USB/RS485/ESD<\/text>\n  <text x=\"275\" y=\"130\" font-size=\"10\" fill=\"currentColor\">差分/终端/保护<\/text>\n  <rect x=\"480\" y=\"60\" width=\"200\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"495\" y=\"85\" font-size=\"12\" fill=\"currentColor\">PCB<\/text>\n  <text x=\"495\" y=\"110\" font-size=\"10\" fill=\"currentColor\">布局/叠层/回流<\/text>\n  <text x=\"495\" y=\"130\" font-size=\"10\" fill=\"currentColor\">DRC/DFM<\/text>\n  <rect x=\"40\" y=\"180\" width=\"200\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"205\" font-size=\"12\" fill=\"currentColor\">测试<\/text>\n  <text x=\"55\" y=\"230\" font-size=\"10\" fill=\"currentColor\">Bring-Up/可靠性<\/text>\n  <rect x=\"260\" y=\"180\" width=\"200\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"205\" font-size=\"12\" fill=\"currentColor\">项目<\/text>\n  <text x=\"275\" y=\"230\" font-size=\"10\" fill=\"currentColor\">难点/决策/结果<\/text>\n  <rect x=\"480\" y=\"180\" width=\"200\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"495\" y=\"205\" font-size=\"12\" fill=\"currentColor\">行为<\/text>\n  <text x=\"495\" y=\"230\" font-size=\"10\" fill=\"currentColor\">冲突/失败/学习<\/text>\n<\/svg>\n```\n\n### 33.5 选型与降额\n\n| 岗位 | 作品集重点 | 面试重点 |\n|---|---|---|\n| PCB | 布线/叠层/DFM | 布局决策 |\n| 电源 | 拓扑/效率/热 | 功耗/纹波 |\n| 测试 | 计划/仪器/报告 | 排障 |\n| FAE | 方案/沟通 | 客户问题 |\n\n### 33.6 测量与仿真\n\n#### 33.6.1 模拟面试\n\n1. 3 分钟自我介绍。\n2. 10 分钟讲一个项目。\n3. 5 个技术问题。\n4. 2 个行为问题。\n5. 反问 2 个问题。\n\n#### 33.6.2 CircuitJS\n\n```circuitjs\npower-buck\n```\n\n用仿真讲清“为什么要输入电容/电感”，比背定义有说服力。\n\n#### 33.6.3 动手任务\n\n- 做 10 页作品集。\n- 写 3 分钟自我介绍。\n- 准备 5 个项目问答。\n- 找朋友做一次模拟面试。\n\n### 33.7 常见坑\n\n1. **作品集只有图**：没有决策/结果。\n2. **讲项目像背书**：没有“我做了什么”。\n3. **不会硬编**：露馅。\n4. **回答太长**：没有结论。\n5. **不准备反问**：显得没兴趣。\n6. **贬低前公司/队友**：行为减分。\n7. **只讲成功**：没有踩坑/复盘。\n8. **作品集太大**：10～15 页刚好。\n\n### 33.8 本章复盘\n\n#### 33.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 证据链 | 作品集 | 需求→测试 |\n| 结论→证据→边界 | 回答 | 不背定义 |\n| 10～15 页 | 篇幅 | 精选 |\n| 3 分钟自我介绍 | 面试 | 岗位匹配 |\n| 反问 2 个 | 结尾 | 体现兴趣 |\n\n#### 33.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 作品集 | portfolio | 项目证据 |\n| 证据链 | evidence chain | 需求到测试 |\n| 行为面试 | behavioral interview | 问经历/软技能 |\n| 反问 | questions to interviewer | 面试结尾提问 |\n\n#### 33.8.3 自测 10 题\n\n1. 作品集应包含什么？\n2. 项目页怎么排？\n3. 回答结构三段？\n4. 不会的问题怎么答？\n5. 自我介绍多长？\n6. 面试官最看重什么？\n7. 怎么讲踩坑？\n8. 反问问什么？\n9. 作品集多少页？\n10. 模拟面试怎么练？\n\n#### 33.8.4 能力清单\n\n- [ ] 能整理 10～15 页作品集。\n- [ ] 能讲清 2 个项目。\n- [ ] 能用结论→证据→边界回答。\n- [ ] 能处理不会的问题。\n- [ ] 能做模拟面试复盘。\n\n#### 33.8.5 下一章\n\n下一章讲**证书与认证（选学）**：哪些证书有用，哪些只是“交钱拿证”。","taskSignature":"f2d74e748d76b2609511239157aa732e128021d58cb69d62c47ae6963f4e9ac9","taskCount":5},{"id":"34","title":"第 34 章 · 证书与认证（选学）","short":"证书与认证","stage":5,"diff":2,"prev":"第 32 章 硬件工程师职业路径与简历","optional":true,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 区分“职业资格/技能证书/厂商认证/体系认证”。\n2. 判断一个证书对求职是否真的有用。\n3. 了解硬件相关常见证书：CE/FCC/UL、IPC、Altium/KiCad、EMC 培训。\n4. 规划“证书+项目”的组合，而不是只堆证书。\n5. 识别“交钱拿证/包过”的坑。\n6. 用认证要求反推设计/测试清单。\n7. 说出至少 8 个证书/认证常见坑。\n\n证书是“门票/加分项”，不是“能力本身”。硬件岗位最看项目，证书用来补“合规/体系/工具”的短板。\n\n## 正文\n\n### 34.1 它解决什么问题：三个真实场景\n\n#### 场景一：简历写了一堆证书，面试还是没过\n\n证书和岗位不匹配（比如考了会计证投硬件），或者只有证书没有项目。证书要服务岗位。\n\n#### 场景二：产品要出口，不知道做 CE 还是 FCC\n\nCE 是欧盟，FCC 是美国，安规/EMC/无线要求不同。认证是“产品合规”，不是“个人证书”。\n\n#### 场景三：报了“包过”培训班，学完不会画板\n\n“包过”证书含金量低。要选有实操/项目/考试的培训。\n\n### 34.2 它是什么：四类证书\n\n| 类型 | 例子 | 作用 |\n|---|---|---|\n| 职业资格 | 电子工程师职称 | 国企/事业单位 |\n| 技能证书 | IPC-A-610/PCB 设计 | 焊接/工艺 |\n| 厂商认证 | Altium/KiCad/ Cadence | 工具能力 |\n| 体系/产品认证 | CE/FCC/UL/CCC | 产品合规 |\n\n> **术语第一次出现**：CE 是欧盟 conformity 标志，FCC 是美国联邦通信委员会认证，UL 是安全认证。它们是产品认证，不是个人证书。\n\n### 34.3 关键内容：证书价值判断\n\n| 证书 | 对求职 | 对产品 | 建议 |\n|---|---|---|---|\n| IPC-A-610 | 中（工艺/焊接） | 高（代工） | 做工艺/维修可考 |\n| IPC-2221/2152 | 中（设计） | 高 | PCB 设计可学 |\n| Altium 认证 | 低～中 | 低 | 工具会用即可 |\n| CE/FCC | 低（个人） | 高（产品） | 做产品必懂 |\n| UL | 低（个人） | 高（安规） | 电源/家电 |\n| EMC 培训 | 中 | 高 | EMC 岗位 |\n\n### 34.4 三个典型判断\n\n#### 34.4.1 证书-项目组合\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 34-1：证书 + 项目组合<\/text>\n  <rect x=\"40\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"100\" font-size=\"12\" fill=\"currentColor\">项目（主）<\/text>\n  <text x=\"60\" y=\"125\" font-size=\"10\" fill=\"currentColor\">2 层/4 层板<\/text>\n  <rect x=\"260\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"100\" font-size=\"12\" fill=\"currentColor\">证书（辅）<\/text>\n  <text x=\"280\" y=\"125\" font-size=\"10\" fill=\"currentColor\">IPC/工具/EMC<\/text>\n  <rect x=\"480\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"500\" y=\"100\" font-size=\"12\" fill=\"currentColor\">表达<\/text>\n  <text x=\"500\" y=\"125\" font-size=\"10\" fill=\"currentColor\">简历/面试<\/text>\n  <text x=\"40\" y=\"200\" font-size=\"13\" fill=\"currentColor\">项目证明“能做”，证书证明“学过/合规”，表达证明“讲得清”。<\/text>\n<\/svg>\n```\n\n#### 34.4.2 产品认证流程\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 34-2：产品 CE/FCC 认证流程<\/text>\n  <rect x=\"40\" y=\"80\" width=\"130\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"115\" font-size=\"11\" fill=\"currentColor\">标准/范围<\/text>\n  <rect x=\"200\" y=\"80\" width=\"130\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"215\" y=\"115\" font-size=\"11\" fill=\"currentColor\">预测试<\/text>\n  <rect x=\"360\" y=\"80\" width=\"130\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"375\" y=\"115\" font-size=\"11\" fill=\"currentColor\">整改<\/text>\n  <rect x=\"520\" y=\"80\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"535\" y=\"115\" font-size=\"11\" fill=\"currentColor\">正式测试/报告<\/text>\n  <line x1=\"170\" y1=\"110\" x2=\"200\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"110\" x2=\"360\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"490\" y1=\"110\" x2=\"520\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"210\" font-size=\"13\" fill=\"currentColor\">先预测试再整改，正式测试一次过，省时间/钱。<\/text>\n<\/svg>\n```\n\n#### 34.4.3 价值判断\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 34-3：证书值不值得考<\/text>\n  <rect x=\"60\" y=\"70\" width=\"180\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"100\" font-size=\"12\" fill=\"currentColor\">岗位要求？<\/text>\n  <rect x=\"280\" y=\"70\" width=\"180\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"295\" y=\"100\" font-size=\"12\" fill=\"currentColor\">有实操/考试？<\/text>\n  <rect x=\"500\" y=\"70\" width=\"180\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"515\" y=\"100\" font-size=\"12\" fill=\"currentColor\">行业认可？<\/text>\n  <line x1=\"240\" y1=\"105\" x2=\"280\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"105\" x2=\"500\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"200\" font-size=\"13\" fill=\"currentColor\">三个都“是”再考；否则先做项目。<\/text>\n<\/svg>\n```\n\n### 34.5 选型与降额\n\n| 目标 | 推荐 | 不推荐 |\n|---|---|---|\n| PCB 设计 | IPC-2221/项目 | 纯“包过”班 |\n| 工艺/维修 | IPC-A-610 | 无实操证书 |\n| 产品出口 | CE/FCC 预测试 | 只买“报告” |\n| 电源/安规 | UL/安规培训 | 与岗位无关 |\n| 工具 | 官方培训（可选） | 堆多个工具证 |\n\n### 34.6 测量与仿真\n\n#### 34.6.1 证书决策表\n\n| 证书 | 费用 | 时间 | 岗位要求 | 决定 |\n|---|---|---|---|---|\n| IPC-A-610 | 中 | 3～5 天 | 工艺 | 考 |\n| Altium | 中 | 2～3 天 | 设计 | 可选 |\n| CE/FCC | 高（产品） | 数周 | 产品 | 公司做 |\n\n#### 34.6.2 CircuitJS\n\n```circuitjs\nrc-lowpass-159\n```\n\n用一个小电路做认证预测试的“整改对象”，理解滤波对 EMC 的作用。\n\n#### 34.6.3 动手任务\n\n- 列 3 个与目标岗位相关的证书。\n- 判断每个“值不值得考”。\n- 查一个产品的 CE/FCC 要求。\n- 写一页“证书+项目”计划。\n\n### 34.7 常见坑\n\n1. **证书与岗位无关**：浪费钱。\n2. **只考证书不做项目**：面试没证据。\n3. **“包过”证书**：含金量低。\n4. **把产品认证当个人证书**：概念错。\n5. **不查标准范围**：CE/FCC 搞混。\n6. **不做预测试**：正式测试整改贵。\n7. **证书过期**：部分认证有有效期。\n8. **堆证书不深**：不如一个项目。\n\n### 34.8 本章复盘\n\n#### 34.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 四类证书 | 分类 | 职业/技能/厂商/体系 |\n| 岗位+实操+认可 | 判断 | 三者都“是” |\n| 项目为主证书为辅 | 求职 | 证据链 |\n| 预测试→整改→正式 | 产品认证 | 省成本 |\n| CE/FCC/UL 是产品认证 | 概念 | 非个人 |\n\n#### 34.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| CE | conformity europeenne | 欧盟合规标志 |\n| FCC | federal communications commission | 美国认证 |\n| UL | underwriters laboratories | 安全认证 |\n| IPC | institute for printed circuits | 电子制造标准 |\n| 预测试 | pre-test | 正式认证前摸底 |\n\n#### 34.8.3 自测 10 题\n\n1. 四类证书是什么？\n2. CE/FCC 区别？\n3. IPC-A-610 考什么？\n4. 证书值不值得考的三问？\n5. 为什么项目比证书重要？\n6. 产品认证流程？\n7. 预测试作用？\n8. “包过”证书有什么问题？\n9. 哪些证书有有效期？\n10. 证书怎么和简历结合？\n\n#### 34.8.4 能力清单\n\n- [ ] 能区分四类证书。\n- [ ] 能判断证书价值。\n- [ ] 能规划证书+项目。\n- [ ] 能理解 CE/FCC 流程。\n- [ ] 能识别“包过”坑。\n\n#### 34.8.5 下一章\n\n下一章讲**供应链、成本与学习资源**：从“会设计”走向“能落地、能持续学”。","taskSignature":"dd9ed79ed23a2170c1154259385854132597e5510c1ce082e9552e7b2cfe026c","taskCount":5},{"id":"35","title":"第 35 章 · 供应链、成本与学习资源","short":"供应链、成本与学习资源","stage":5,"diff":2,"prev":"第 27 章 DFM、拼板与生产成本","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清 PCB/PCBA 供应链的角色：原厂、代理、现货、板厂、贴片厂。\n2. 做 BOM 成本核算，区分样品价/批量价/替代料价。\n3. 识别缺货/假货/翻新/停产风险，并制定替代策略。\n4. 规划打样/小批量/量产的不同采购路径。\n5. 建立自己的学习资源库：手册、标准、社区、工具。\n6. 制定持续学习计划，避免“学完就停”。\n7. 说出至少 8 个供应链/成本常见坑。\n\n设计决定成本，采购决定交付。硬件工程师要懂“料能不能买到、价格能不能承受、替代料能不能用”。\n\n## 正文\n\n### 35.1 它解决什么问题：三个真实场景\n\n#### 场景一：BOM 选了一颗“便宜”的料，量产缺货\n\n样品价便宜，量产时原厂停产/代理没货，替代料不兼容，项目延期。选料要看生命周期/多源。\n\n#### 场景二：现货市场买到翻新/假货\n\n便宜芯片是翻新/打磨，批量失效率高。关键器件走正规代理/原厂，现货要检测。\n\n#### 场景三：只算 PCB 价，不算贴片/测试/包装\n\nPCBA 成本 = PCB + 器件 + 贴片 + 测试 + 包装 + 损耗。只算一半，报价亏。\n\n### 35.2 它是什么：供应链与成本结构\n\n供应链：\n\n- 原厂（TI/ST/NXP/国产替代）\n- 代理/分销（Arrow/Avnet/立创/得捷）\n- 现货市场（华强北/立创商城现货）\n- 板厂（PCB 打样/量产）\n- 贴片厂（SMT/插件/测试）\n\n成本：\n\n`PCBA 成本 ≈ PCB + 器件 + 贴片 + 测试 + 包装 + 损耗 + 物流`\n\n> **术语第一次出现**：BOM 成本（BOM cost）是物料清单的采购成本；PCBA 成本还包括加工/测试/损耗。两者不是一回事。\n\n### 35.3 关键内容：选料与替代\n\n| 风险 | 信号 | 对策 |\n|---|---|---|\n| 停产 | EOL/Last buy | 提前替代/最后一次采购 |\n| 缺货 | 交期 >12 周 | 多源/替代 |\n| 假货 | 现货低价/无批次 | 正规渠道/检测 |\n| 翻新 | 引脚氧化/丝印模糊 | 拒收/X-Ray |\n| 批次差异 | 参数漂移 | 来料检验 |\n\n### 35.4 三个典型流程\n\n#### 35.4.1 成本结构\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 35-1：PCBA 成本结构<\/text>\n  <rect x=\"60\" y=\"200\" width=\"60\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"140\" y=\"150\" width=\"60\" height=\"110\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"220\" y=\"120\" width=\"60\" height=\"140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"300\" y=\"90\" width=\"60\" height=\"170\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"380\" y=\"60\" width=\"60\" height=\"200\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"460\" y=\"100\" width=\"60\" height=\"160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"540\" y=\"130\" width=\"60\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"285\" font-size=\"10\" fill=\"currentColor\">PCB<\/text>\n  <text x=\"145\" y=\"285\" font-size=\"10\" fill=\"currentColor\">器件<\/text>\n  <text x=\"225\" y=\"285\" font-size=\"10\" fill=\"currentColor\">贴片<\/text>\n  <text x=\"305\" y=\"285\" font-size=\"10\" fill=\"currentColor\">测试<\/text>\n  <text x=\"385\" y=\"285\" font-size=\"10\" fill=\"currentColor\">包装<\/text>\n  <text x=\"465\" y=\"285\" font-size=\"10\" fill=\"currentColor\">损耗<\/text>\n  <text x=\"545\" y=\"285\" font-size=\"10\" fill=\"currentColor\">物流<\/text>\n<\/svg>\n```\n\n#### 35.4.2 采购路径\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 35-2：打样/小批量/量产采购路径<\/text>\n  <rect x=\"40\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"100\" font-size=\"12\" fill=\"currentColor\">打样<\/text>\n  <text x=\"55\" y=\"125\" font-size=\"10\" fill=\"currentColor\">立创/得捷/现货<\/text>\n  <rect x=\"260\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"100\" font-size=\"12\" fill=\"currentColor\">小批量<\/text>\n  <text x=\"275\" y=\"125\" font-size=\"10\" fill=\"currentColor\">代理/板厂代购<\/text>\n  <rect x=\"480\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"495\" y=\"100\" font-size=\"12\" fill=\"currentColor\">量产<\/text>\n  <text x=\"495\" y=\"125\" font-size=\"10\" fill=\"currentColor\">原厂/代理/多源<\/text>\n  <line x1=\"220\" y1=\"110\" x2=\"260\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"110\" x2=\"480\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n#### 35.4.3 学习资源库\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 35-3：学习资源四类<\/text>\n  <rect x=\"40\" y=\"70\" width=\"150\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"100\" font-size=\"12\" fill=\"currentColor\">器件手册<\/text>\n  <text x=\"55\" y=\"125\" font-size=\"10\" fill=\"currentColor\">Datasheet/AN<\/text>\n  <rect x=\"210\" y=\"70\" width=\"150\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"230\" y=\"100\" font-size=\"12\" fill=\"currentColor\">标准/规范<\/text>\n  <text x=\"225\" y=\"125\" font-size=\"10\" fill=\"currentColor\">IPC/IEC/国标<\/text>\n  <rect x=\"380\" y=\"70\" width=\"150\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"100\" font-size=\"12\" fill=\"currentColor\">社区/开源<\/text>\n  <text x=\"395\" y=\"125\" font-size=\"10\" fill=\"currentColor\">GitHub/论坛<\/text>\n  <rect x=\"550\" y=\"70\" width=\"140\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"570\" y=\"100\" font-size=\"12\" fill=\"currentColor\">工具/仿真<\/text>\n  <text x=\"565\" y=\"125\" font-size=\"10\" fill=\"currentColor\">EDA/SPICE<\/text>\n<\/svg>\n```\n\n### 35.5 选型与降额\n\n| 场景 | 策略 | 注意 |\n|---|---|---|\n| 关键器件 | 原厂/代理+替代 | 不做单一来源 |\n| 通用阻容 | 多源/国产 | 参数一致 |\n| 连接器 | 品牌+锁扣 | 机械寿命 |\n| 电源 IC | 多源/参考设计 | 环路/散热 |\n| 存储 | 原厂/生命周期 | 假货 |\n\n### 35.6 测量与仿真\n\n#### 35.6.1 成本表\n\n| 项目 | 单价 | 数量 | 小计 | 备注 |\n|---|---:|---:|---:|---|\n| PCB | | | | 层数/面积 |\n| 器件 | | | | BOM |\n| 贴片 | | | | 点数 |\n| 测试 | | | | 工时 |\n| 包装 | | | | |\n| 损耗 | | | | 3～5% |\n\n#### 35.6.2 CircuitJS\n\n```circuitjs\npower-buck\n```\n\n用仿真比较“便宜电感/电容”对纹波的影响，理解成本与性能的取舍。\n\n#### 35.6.3 动手任务\n\n- 算一块板的 PCBA 成本。\n- 给 BOM 标出关键器件/替代料。\n- 查 3 个器件的生命周期。\n- 建一个学习资源清单。\n\n### 35.7 常见坑\n\n1. **只算样品价**：量产亏。\n2. **单一来源**：缺货停产。\n3. **现货贪便宜**：假货/翻新。\n4. **替代料不验证**：参数/固件不兼容。\n5. **不算损耗/测试**：报价低。\n6. **连接器不看寿命**：批量松脱。\n7. **不查生命周期**：EOL 才发现。\n8. **学习只收藏不看**：资源库变仓库。\n\n### 35.8 本章复盘\n\n#### 35.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| PCBA=PCB+器件+贴片+测试+包装+损耗+物流 | 成本 | 全项 |\n| 关键器件多源 | 供应链 | 替代验证 |\n| 损耗 3～5% | 报价 | 按工艺 |\n| 生命周期检查 | 选料 | EOL |\n| 资源四类 | 学习 | 手册/标准/社区/工具 |\n\n#### 35.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| BOM 成本 | BOM cost | 物料成本 |\n| PCBA | printed circuit board assembly | 贴装好的板 |\n| EOL | end of life | 停产 |\n| 多源 | multi-source | 多个供应商 |\n| 损耗 | scrap | 生产报废 |\n\n#### 35.8.3 自测 10 题\n\n1. PCBA 成本包含什么？\n2. BOM 成本和 PCBA 成本区别？\n3. 关键器件为什么要多源？\n4. 现货市场有什么风险？\n5. EOL 怎么提前发现？\n6. 替代料要验证什么？\n7. 打样/小批量/量产采购差异？\n8. 损耗一般多少？\n9. 学习资源四类？\n10. 怎么避免“收藏不看”？\n\n#### 35.8.4 能力清单\n\n- [ ] 能算 PCBA 成本。\n- [ ] 能做 BOM 替代/多源。\n- [ ] 能识别缺货/假货/EOL。\n- [ ] 能规划采购路径。\n- [ ] 能建学习资源库。\n\n#### 35.8.5 下一章\n\n全课到这里结束。下一步不是“学完”，是“做一块自己的板”：选一个需求，从原理图到打样到测试，把 35 章串成一个项目。","taskSignature":"0bcb709e79d7a682579e0c223bacd0ead03e05a6dc4a38737a2dc99a9813d067","taskCount":5}],"readmeMd":"> 从电学基础到 PCB 设计、制作与验证。以理解、练习、实物验证和复盘为推进依据，不以课时或月份作为完成标准。\n\n## 使用方法\n\n课程按建议学习顺序重新编号。基础课先学能支撑下一步实践的部分；焊接、工程实践与测试的进阶章节可在项目推进时回看。练习从安全低压电路开始；市电、锂电池及高风险维修只在具备明确条件和指导时学习。\n\n项目成果分为**设计练习、参考工程解读和实物验证**。只有实际完成并保留记录，才能标注为实测通过。STM32 示例固件仅完成编译与镜像结构检查，尚未下载或在实板运行。\n\n## 学习路径与练习资料\n\n先从安全低压测量、基础器件和典型电路入手；学完第 04、05 章的相关内容后，练习传感器、比较器与驱动。完成第 09、10 章的 EDA 与基础焊接后，可继续开展首板、循迹小车和 STM32 项目。以下练习资料与 35 章并行使用，不改变课号和原有学习勾选项。\n\n- [基础练习与实验记录手册](#/resource/6a69fbba188b2ab2)：限流、分压、滤波、开关和比较器的带答案练习与实验记录表。\n- [模拟电路进阶练习](#/resource/fc9c44ec59d84fc6)：运放、高低端电流检测、恒流反馈、比较器迟滞与跨阻放大的带答案练习。\n\n新项目的设计、仿真、规则检查、生产准备与实板测试分别记录；没有实际结果的项目保持待验证。初学练习只使用合适的隔离低压供电。\n\n## 学习路线与阶段验收\n\n### 一、电学与器件基础\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 01 | [基础概念](#/lesson/01) | 电压、电流、电阻、功率与安全低压入门 |\n| 02 | [电阻](#/lesson/02) | 串并联、分压、限流与功率 |\n| 03 | [电容](#/lesson/03) | 储能、滤波、去耦与 RC 时间常数 |\n| 04 | [电感](#/lesson/04) | 储能、续流、LC 滤波与磁饱和 |\n| 05 | [二极管](#/lesson/05) | 单向导电、整流、稳压与钳位 |\n| 06 | [三极管](#/lesson/06) | 放大与开关、偏置与驱动 |\n| 07 | [MOS 管](#/lesson/07) | 低边/高边开关、栅极驱动与选型 |\n| 08 | [运算放大器](#/lesson/08) | 虚短虚断、缓冲、放大与比较 |\n\n**阶段验收：**能分析基本电路，识别元件和参数，在安全低压条件下完成基础测量并记录。\n\n### 二、EDA、PCB 与基础制作\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 09 | [EDA 与原理图入门](#/lesson/09) | 原理图→网表→PCB→生产文件的数据链 |\n| 10 | [焊接与返修基础](#/lesson/10) | 润湿、工具、通孔/贴片/QFN 与安全边界 |\n| 11 | [封装、元件库与 BOM](#/lesson/11) | 封装四要素、焊盘、BOM 与替代料 |\n| 12 | [PCB 布局与布线基础](#/lesson/12) | 布局六原则、线宽、过孔与飞线走查 |\n| 13 | [电源模块与电源树](#/lesson/13) | LDO/Buck/Boost、电源树、热与布局 |\n| 14 | [接口、ESD 与保护](#/lesson/14) | USB/HDMI/RJ45、ESD/TVS/共模 |\n| 15 | [时钟、复位、调试与常见模块](#/lesson/15) | 晶振负载电容、复位 RC、SWD、I²C |\n| 16 | [阶段项目：2 层控制板](#/lesson/16) | 继电器、RS485、输入保护与强弱电分区 |\n\n**阶段验收：**能画简单原理图和 2 层 PCB，说明焊接、供电、接口、时钟与复位的基本要求。\n\n### 三、单片机与第一块项目板\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 17 | [单片机基础与常用外设](#/lesson/17) | GPIO、推挽/开漏、ADC、UART/SPI/I²C |\n| 18 | [STM32 最小系统与开发板原理图](#/lesson/18) | 电源去耦、晶振、复位、BOOT、SWD |\n| 19 | [2 层板布局布线实战](#/lesson/19) | 地平面、晶振包地、USB 差分与电源 |\n| 20 | [首板上电与 Bring-Up](#/lesson/20) | 限流、上电顺序、电源/时钟/调试排查 |\n| 21 | [硬件测试与可靠性](#/lesson/21) | 功能/性能/环境/可靠性、降额与 FMEA |\n| 22 | [经典开源工程解读](#/lesson/22) | 结构、电源、接口、布局、测试五步读图 |\n| 23 | [阶段复盘与设计评审](#/lesson/23) | 图/板/料/测清单、P0/P1/P2 与闭环 |\n\n**阶段验收：**理解程序与硬件的关系，完成设计或参考工程分析，并分别记录制作、下载和实测状态。\n\n### 四、多层板与高速设计\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 24 | [存储与 DDR 基础](#/lesson/24) | NOR/NAND/DDR、Bank/Row/Column、Fly-by |\n| 25 | [叠层、阻抗与 SI/PI 基础](#/lesson/25) | 2/4/6/8 层、微带/带状、阻抗与回流 |\n| 26 | [EMC/ESD 与防护设计](#/lesson/26) | 三要素、共模/差模、GDT+TVS、缝隙 |\n| 27 | [DFM、拼板与生产成本](#/lesson/27) | 工艺边、V-cut/邮票孔、Mark 与成本 |\n| 28 | [4 层板项目：H3 机顶盒](#/lesson/28) | 4 层分区、DDR3、HDMI/USB、Wi-Fi 净空 |\n| 29 | [6 层板项目：RK3576 AI 主板](#/lesson/29) | 6 层叠层、多路时序、PCIe/USB3 |\n| 30 | [8 层板项目：RK3588 工业主板（选学）](#/lesson/30) | 8 层双地、宽压、隔离、宽温 |\n\n**阶段验收：**能依据具体器件、叠层与制造条件解释约束；资料不足时选择局部设计或参考工程分析。第 30 章为选学。\n\n### 五、维修、就业与持续进阶\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 31 | [消费电子维修与 BGA 返修（选学）](#/lesson/31) | 维修四步、BGA 五步与限流 |\n| 32 | [硬件工程师职业路径与简历](#/lesson/32) | 岗位地图、STAR、6～12 月路线 |\n| 33 | [作品集与面试表达](#/lesson/33) | 证据链、10～15 页作品集、高频问题 |\n| 34 | [证书与认证（选学）](#/lesson/34) | 四类证书、CE/FCC/UL 与价值判断 |\n| 35 | [供应链、成本与学习资源](#/lesson/35) | BOM/PCBA 成本、采购路径、资源库 |\n\n**阶段验收：**结合目标选择维修、就业与认证内容；第 31、34 章为选学，第 35 章可全程查阅。\n\n## 贯穿练习与项目记录\n\n以低压 LED / RC 练习连接电路计算、测量、EDA 和焊接；接着通过纯硬件循迹小车练习传感、比较器与驱动，之后以 STM32 项目串起数据手册、供电、接口、代码和测试。实践时记录：\n\n1. 目标和范围：功能、输入输出及不包含的部分。\n2. 设计依据：具体型号、手册版本、约束出处和选型条件。\n3. 设计文件：原理图、PCB、封装、BOM 与生产文件版本。\n4. 制作条件：板厂工艺、器件来源、替代料与装配方式。\n5. 验证结果：仪器、接线、条件、预期值、实际值和异常。\n6. 复盘与未决项：修改记录、未验证事项和下一步。\n\n## 课程编号与参考资料\n\n参考资料见各章末尾和第 35 章。器件手册、特定板厂工艺与实际测试条件优先于没有适用范围的经验口诀；工具菜单依实际软件版本为准。","resources":[{"id":"6a69fbba188b2ab2","title":"基础练习与实验记录手册","md":"# 基础练习与实验记录手册\n\n本手册配合第 01～06 课，按“读图 → 自算 → 查看答案 → 仿真或测量 → 记录差异”使用。下面的数值是题设或近似模型，并非对某个器件的性能保证。**目前仅核对了算式和现有仿真文件的文本参数，未逐一运行仿真，也未做实物实验。**\n\n## 使用与安全\n\n全部练习以隔离的低压直流电源为前提；先断电接线并核对极性、引脚和连接，再检查元件的额定电压、电流、功率及电源能力。实际限流按电源说明书和负载启动情况设定；限流并不消除所有风险。发热、异味或异常电流时立即断电，不触摸疑似发热元件。不可使用市电、未经确认的电池或未知电源做这些练习。\n\n涉及波形时，先核对信号源与示波器接地和输入限制；通常先测输入和输出对同一参考点的电压，不把接地夹夹在非地节点。通断、电阻档只能在断电并确认储能元件安全放电后使用。真实装配时需查具体型号与封装引脚，示意中的器件符号不是封装图。仿真无需真实器材，但模型结果并不等同于实测。\n\n现有仿真可从课程网站相应章节进入；以下给出模型文件名和参数差异，**不假定模型与题设完全相同**。修改仿真前保留初始版本，记录软件与模型版本。题设中的理想电压源、电流表和电压表不产生测量负载，实际仪表有误差和输入阻抗。\n\n## 练习 1：LED 限流和功率\n\n**题设。** 5.00 V 理想电源依次连接限流电阻、红色 LED 和地；假设本工作电流下 LED 正向压降为 2.00 V，电阻 620 Ω。目标：求电流、电阻功率；若电源最高 5.25 V、LED 最低正向压降 1.80 V、电阻最低 589 Ω，求这些边界同时出现时的估算电流。LED 的压降范围在此为题设，并非任何红色 LED 的通用保证。\n\n**参考答案。** 标称 `I=(5.00−2.00)/620≈4.84 mA`，`PR=I²R≈0.0145 W`。题设边界电流 `(5.25−1.80)/589≈5.86 mA`；相应电阻功率约 `0.0202 W`。应查所选 LED 的额定和连续电流、压降曲线及电阻功率降额，不能单凭标称 4.84 mA 选型。\n\n**验证。** 项目 `site/sim/circuits/led-resistor.txt` 使用 5 V 与 620 Ω，但 LED 的模型并非固定 2.00 V，电流不必恰好等于答案。比较电阻两端电压及流过电流；若做实测，选择经核对的低压 LED 与电阻，先测电阻值，测量 LED 和电阻两端电压，以电阻压降除以实测阻值推算电流。\n\n**易错与风险。** LED 不能直接跨接电压源；不能用电源电压除以电阻而忽略 LED 压降，也不能将 5 V/1 A 电源理解成负载一定流过 1 A。改变接线先断电。\n\n## 练习 2：分压器的负载效应\n\n**题设。** 5.00 V 经过上臂 `R1=10 kΩ` 到输出节点，节点经下臂 `R2=10 kΩ` 接地。先假设输出开路，再将 `RL=10 kΩ` 从输出接地，求两种输出电压和负载电流，忽略元件误差。\n\n**参考答案。** 开路时 `Vout=5×10/(10+10)=2.50 V`。接入负载后 `R2∥RL=5 kΩ`，输出为 `5×5/(10+5)=1.667 V`，负载电流约 `1.667/10 kΩ=0.167 mA`。上臂电流 0.333 mA，分成下臂及负载两路，每路 0.167 mA。\n\n**验证。** 现有 `level-divider.txt` 使用两个 1 kΩ 而非本题 10 kΩ；先观察无负载的 2.5 V，再把两臂改成 10 kΩ 并从输出加 10 kΩ 到地，观察约 1.67 V。实测时将表的直流电压档并在输出与地之间，记录仪表输入阻抗及实测电阻。\n\n**易错与风险。** 负载是与下臂并联，不是直接并在上臂；不能假设接入任何负载后输出仍为 2.5 V。分压电路是否可作电源需由负载电流与允许误差共同决定。\n\n## 练习 3：RC 低通和高通\n\n**题设。** 正弦信号源无直流偏置，理想源阻抗为 0，输出不接负载；`R=1.00 kΩ`、`C=100 nF`。低通连接为信号源 → R → 输出，输出经 C 接地；高通连接为信号源 → C → 输出，输出经 R 接地。分别求时间常数、截止频率及在截止频率处输出与输入的幅值比。\n\n**参考答案。** `τ=RC=100 μs`；`fc=1/(2πRC)≈1.59 kHz`。两者在该频率的理想幅值比均约 `1/√2=0.707`，即约 −3.01 dB。低通在远低于 fc 时幅值比趋近 1，远高于 fc 时趋近 0；高通相反。高通的直流稳态输出为 0，仅在题设连接、理想条件下成立。\n\n**验证。** `rc-lowpass-1592.txt` 的 1 kΩ、100 nF、约 1591.55 Hz 对应低通题设；查看输入输出幅值，不要把峰值和峰峰值混算。高通可在仿真中交换 R 与 C 的位置并保持输出为两器件中点；低频、中频、截止点和高频分别记录幅值。若实测，信号源内阻、探头输入阻抗/电容和元件容差都要记录；电容实际耐压、极性必须合适。\n\n**易错与风险。** 低通、高通不是换一个公式，而是输出节点不同；0.707 不是适用于所有频率。频率发生器、示波器的接地方式需事先核对。\n\n## 练习 4：二极管与反向保护\n\n**题设。** 5 V 理想电源正端 → 1 kΩ 电阻 → 普通二极管阳极；阴极接地。正向导通时假设二极管压降固定 0.70 V；反向时假设漏电忽略。求正接电流和电阻功率，反转二极管后求理想电流。\n\n**参考答案。** 正接 `I=(5−0.70)/1000=4.30 mA`，电阻功率 `I²R≈0.0185 W`。反向且未击穿的理想模型电流为 0；真实器件会有漏电，其压降随电流与温度变化。题中 0.70 V 只是近似条件。\n\n**验证。** 自建低压直流仿真：给二极管串入 1 kΩ，观察正向电流；反转后再观察。实际练习须按具体二极管手册确认正向电流、反向耐压、极性标记和仪表测量条件；断电后再反转器件。\n\n**易错与风险。** 阴极条纹代表极性标记，具体封装仍要核查；不能以固定 0.7 V 推定所有二极管和电流条件。此单管例子说明方向性，不代表已完成一个满足功耗与压降要求的电源防反接设计。\n\n## 练习 5：NPN 三极管低边开关\n\n**题设。** 理想 5 V 电源 → 1 kΩ 电阻 → NPN 集电极，发射极接地。控制电压 3.3 V 经 10 kΩ 连接基极，基极经 100 kΩ 下拉到地；控制端与电源共地。先假设导通时 `VBE=0.70 V`、`VCE=0.20 V`，计算集电极电流、通过基极电阻的电流和扣除下拉电流后的估计基极电流。\n\n**参考答案。** `IC≈(5−0.20)/1 kΩ=4.80 mA`；输入电阻电流 `(3.3−0.70)/10 kΩ=0.260 mA`；下拉电流 `0.70/100 kΩ=0.007 mA`；估算 `IB≈0.253 mA`。强迫电流比 `IC/IB≈19`。以上先假设饱和，**不能以该算式反过来证明实际管子已经饱和**；应选定完整型号并查该电流及温度下的驱动和 `VCE(sat)`，再核查控制输出的电流能力。\n\n**验证。** `npn-switch.txt` 的 5 V、1 kΩ、3.3 V、10 kΩ 和 100 kΩ 与本题拓扑相近，但模型参数和实际器件不同；观察开关两种状态及集电极电压。实际接线前核对具体封装的 B/C/E 引脚；以限流电源、电阻负载测试，比较不同状态的集电极电压。\n\n**易错与风险。** 不能用放大区典型 hFE 直接保证开关饱和；基极不能直接连接电压源。下拉电阻有电流，计算基极电流时不能漏掉。电机或继电器为感性负载，需另行设计续流及驱动，不能直接照搬此电阻负载例子。\n\n## 练习 6：NMOS 低边开关\n\n**题设。** 5 V → 1 kΩ 电阻 → NMOS 漏极，源极接地；栅极由 0 V/3.3 V 控制并以 100 kΩ 下拉到地。仅为计算，假设在 3.3 V 栅源电压下 MOS 可用 `RDS(on)=0.10 Ω` 近似，忽略其他误差；求导通电流与 MOS 电阻损耗。控制信号低时，假定漏电可忽略。\n\n**参考答案。** `I=5/(1000+0.10)≈4.9995 mA`，`PMOS=I²×0.10≈2.50 μW`；低电平理想情况下电流为零。实际设计必须选定 MOS，查 **实际 VGS、温度和电流条件下**的导通电阻、栅源耐压、漏源耐压和开关损耗；题设 0.10 Ω 不代表现有模型或任一指定器件。\n\n**验证。** `nmos-switch.txt` 使用 5 V、1 kΩ、3.3 V 和 100 kΩ 下拉，模型具有自己的阈值和特性，不能预计它恰好有 0.10 Ω；比较 0 V 与 3.3 V 时漏极电压及电流。实际操作只在所选器件条件允许时进行，先核查封装 G/D/S 与控制端能力，断电再改线。\n\n**易错与风险。** 栅源阈值是特定小测试电流下的指标，不是低损耗导通的保证。体二极管方向影响关断时的电流路径；要控制电机时还需额外评估续流、启动和堵转电流。\n\n## 练习 7：开集电极比较器\n\n**题设。** 理想开集电极比较器单电源 5 V，同相输入 `V+=2.0 V` 或 `3.0 V`，反相输入 `V−=2.5 V`；输出节点经 `10 kΩ` 上拉至 5 V，后级输入电流忽略。假设比较器拉低时输出为 0.20 V，未加入迟滞。求两种输入下的输出状态及拉低时上拉电流。\n\n**参考答案。** 当 `V+=2.0 V < V−` 时，假设输出晶体管导通，输出约 0.20 V，上拉电流 `(5−0.20)/10 kΩ=0.48 mA`。当 `V+=3.0 V > V−` 时，输出晶体管关断，理想无负载输出约 5 V。2.5 V 附近因失调、噪声和缓慢变化可能多次切换；需要按要求设计迟滞并核算上下阈值。\n\n**验证。** `analog-comparator.txt` 用理想开环运放示意比较，不是 LM393 开集电极模型、无本题上拉，不能用来证明输出电流或高电平；可借它观察两输入电压比较与翻转，再单独建立含上拉的比较器模型。若选用真实 LM393 系列，查完整型号和供电条件对应的输入共模范围、输出结构、电流能力与引脚，并处理未使用通道和电源去耦；手册：[TI LM393 系列](https://www.ti.com/lit/ds/symlink/lm393.pdf)。\n\n**易错与风险。** 未上拉的开集电极输出不会主动提供高电平；输出未必能直接驱动电机。不能只根据输入“不超过电源”判断共模范围合格；输入范围、绝对最大额定值和输出电平都应逐项核对。\n\n## 练习 8：电感关断与续流路径\n\n**题设。** 一个由低压电源、线圈和低边开关串联组成的电路，开关先闭合且线圈已有电流，随后断开。比较没有续流支路与在线圈两端正确并联续流二极管时，线圈电流路径的变化。这里不指定线圈和器件型号，不要求估算峰值电压或实物通断。\n\n**参考答案。** 线圈电流不会按理想电感模型瞬时归零；开关断开时，若无合适电流通路，开关两端电压可能迅速上升，实际峰值受寄生、击穿和能量耗散等影响。典型低边驱动的续流二极管阴极接电源正端、阳极接开关与线圈的连接点；关断时它为线圈电流提供回路。实际电路仍需按具体线圈与器件核验二极管电流、反向耐压、关断速度、释放时间和功耗。\n\n**验证。** 可比较课程现有 `inductkick.txt` 与 `inductkick-snub.txt`，先核对两个模型的拓扑、参数及保护方式，再记录开关断开前后线圈电流和开关电压；不得预设后者一定是与本题完全相同的二极管电路。本题先做仿真；实物操作需选定安全低压线圈、驱动器和续流器件并完成额定值核算。\n\n**易错与风险。** 二极管方向画反可能形成对电源的低阻通路；二极管不能随意省略，也不能只因加入二极管就认定所有瞬态风险已解决。\n\n## 通用实验记录模板\n\n复制下表，每次实验单独保存；未执行项填“未做”，异常保留原始数据，不把预测值填作实测。\n\n| 项目 | 记录 |\n|---|---|\n| 日期、实验名称、操作者 |  |\n| 目标、题号及电路版本 |  |\n| 器件完整型号、批次、关键额定值、手册版本 |  |\n| 仪器型号、量程、探头及校准/状态 |  |\n| 电源类型、设定值、限流依据及实际值 |  |\n| 原理图/接线图、公共参考点和测点 |  |\n| 测试前断电检查、极性、额定值及环境 |  |\n| 仿真软件及模型版本，或实物连接方式 |  |\n| 输入条件、步骤和预期范围及依据 |  |\n| 实际测量值及单位、照片/波形文件 |  |\n| 误差及可能原因 |  |\n| 异常、停止条件、处理与复测 |  |\n| 结论（通过 / 未通过 / 待验证）、下一步 |  |\n\n## 核验和边界\n\n以上习题使用题设理想条件进行算术核对；本手册未验证实物、所有仿真模型的行为或器件在具体温度、容差和生产条件下的极限。NPN 饱和驱动的条件性可参考 [onsemi 2N3904 数据手册](https://www.onsemi.com/download/data-sheet/pdf/2n3904-d.pdf)；不同器件和供应商不能未经核对直接套用其数值。\n","path":"基础练习与实验记录手册.md","group":"基础练习"},{"id":"fc9c44ec59d84fc6","title":"模拟电路进阶练习：放大、电流检测与迟滞","md":"# 模拟电路进阶练习：放大、电流检测与迟滞\n\n配合第 04、05、06、10 课及《基础练习与实验记录手册》使用。目标是把课件中的运放、采样和比较器串成可以计算和解释的任务。以下均为**理想电路或明确假设的计算练习**，尚未实物搭建；任何电阻、公差、电源和波形均应先按所选型号重新核对。练习限于合适隔离低压电源，接线前断电；示波器和信号源接地按各自手册确认。\n\n## 1. 同相放大：理解负反馈的条件\n\n### 电路和题目\n\n理想运放以 0～5 V 供电，`V+` 接理想低阻信号 `Vin`；输出经 `Rf=90 kΩ` 接反相输入，反相输入经 `Rg=10 kΩ` 接地。第 1 小问假设运放线性工作、输入电流为零、输出无负载；供电和输出限制之外不套用理想公式。\n\n1. 当 `Vin=0.15 V`，求输出电压和反相输入电压。\n2. 若 `Vin=0.60 V`，为什么不能直接断言输出一定是 6 V？\n3. 信号源内阻、运放输入范围或输出负载变化会影响什么？\n\n### 参考答案\n\n在闭环线性工作时，反馈节点 `V−=Vout×Rg/(Rg+Rf)`，理想近似 `V−=V+=Vin`，故 `Vout=(1+Rf/Rg)Vin=10Vin`。第 1 题输出 `1.50 V`，反相输入约 `0.15 V`。第 2 题理想计算为 6 V，但这超出题设 0～5 V 供电；实际输出受具体器件和负载限制，输出可能进入饱和，不能继续应用“虚短”来求实际值。带宽、输出电流、输入共模范围、源阻抗和失调等也需核验。\n\n### 验证与误区\n\n先在课程站点第 05 课的同相放大仿真中核对电源、信号幅度及反馈电阻；模型参数不一定等于本题，须修改并记录。对比低幅值和导致削顶的输入，记下实际使用的模型及供电。实际选型须查所选器件在供电、电流、温度和负载条件下的输入共模范围、输出摆幅、带宽和稳定性。**运放有负反馈，不代表任何输入下都能保持线性。**\n\n## 2. 低端电流检测：从分流电阻到输出误差\n\n### 电路和题目\n\n负载的回流依次经过 `Rs=0.50 Ω` 到系统地；假设运放测得电阻上端相对系统地的电压，并以理想同相增益 `G=10` 放大。忽略引线电阻，输入电流为零，输出范围足够。负载电流在 `0.10～0.40 A` 内。\n\n1. 求检测电压、输出电压和最大分流电阻功耗。\n2. 假设输入等效失调为 `±1 mV`，仅计这一项，输出电压误差和反推电流误差有多大？\n3. 为什么这不是完整的实际电流检测设计？\n\n### 参考答案\n\n`Vsense=I×Rs=0.05～0.2
