A，可以接受。\n- I²C 等开漏总线：上拉阻值由总线电容和上升时间决定，常见 2.2k～10kΩ；400kHz 高速总线不能用 10kΩ 配大电容。\n- 低功耗电池设备：可以用 100kΩ～1MΩ，但要核算漏电、湿度和干扰。\n\n**开漏输出**：很多芯片的输出只能“拉低”，不能“推高”。高电平必须靠外部上拉电阻。I²C 的 SDA/SCL、很多复位/中断引脚都是开漏。没有上拉，总线永远是低或浮空。\n\n**电平匹配**：5V 开漏总线用 5V 上拉，不能直接接 3.3V GPIO，除非 GPIO 耐 5V 或有电平转换。上拉电阻接到哪个电源，决定了高电平电压。\n\n#### 2.4.4 进阶电路：低边电流采样\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 340\" role=\"img\" aria-label=\"低边0.1欧采样电阻与差分放大\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M220 30 V55\"/><rect x=\"198\" y=\"55\" width=\"44\" height=\"40\"/><path d=\"M220 95 V130\"/>\n  <rect x=\"220\" y=\"118\" width=\"80\" height=\"24\"/><circle cx=\"220\" cy=\"130\" r=\"3.5\" fill=\"currentColor\"/><circle cx=\"300\" cy=\"130\" r=\"3.5\" fill=\"currentColor\"/>\n  <path d=\"M300 130 V170 M280 170 H320 M286 178 H314 M290 186 H310 M294 194 H306\"/>\n  <path d=\"M220 130 V210 H330\"/>\n  <path d=\"M300 130 V250 H330\"/>\n  <path d=\"M330 190 L330 270 L430 230 Z\"/>\n  <path d=\"M430 230 H500\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\">\n  <text x=\"214\" y=\"24\">+24V<\/text><text x=\"202\" y=\"80\">负载<\/text>\n  <text x=\"318\" y=\"126\">Rshunt 0.1Ω<\/text>\n  <text x=\"235\" y=\"205\">V+<\/text><text x=\"305\" y=\"288\">V−<\/text>\n  <text x=\"310\" y=\"160\">GND<\/text>\n  <text x=\"360\" y=\"305\">差分放大器<\/text><text x=\"470\" y=\"220\">Vout<\/text>\n<\/g><\/svg>\n```\n\n图 2-7 低边电流采样\n\n- 采样电阻 `Rshunt` 串在负载和地之间，负载电流流过它，产生压降 `V = I × Rshunt`。\n- 例：`Rshunt=0.1Ω`，`I=1A`，压降 0.1V，功耗 `I²R=0.1W`。\n- 0.1V 太小，后面用运放放大 20 倍到 2V，送 ADC。\n- `Rshunt` 要选低阻、低温漂、四端（Kelvin）连接，避免焊点/引线电阻引入误差。\n- 低边采样共模电压接近地，运放容易处理；但会破坏负载的地参考，某些电路不允许。高边采样共模电压高，需要专用电流检测放大器。\n\n这个电路把“电阻分压”升级成“电阻采样”，是后面运放章和电源章的基础。\n\n### 2.5 选型与降额\n\n#### 2.5.1 先算，再选，不要先选再凑\n\n正确的顺序：\n\n1. 算阻值 → 选标准值。\n2. 算最大功耗 → 定封装/功率。\n3. 算最大电压 → 查耐压。\n4. 算误差预算 → 定容差/温漂。\n5. 查脉冲/浪涌 → 定特殊系列。\n6. 写完整料号。\n\n错误顺序：先拿一个 0603 10kΩ，再算发现功耗 0.2W，已经超了，只能换封装重画板。\n\n#### 2.5.2 常见封装与降额参考\n\n以下只是入门参考，**具体以料号手册为准**：\n\n| 封装 | 常见额定功率 | 建议长期最大功耗（50%～70%） | 典型用途 |\n|---|---|---|---|\n| 0402 | 0.0625～0.1W | 0.03～0.07W | 高密度数字板、上拉/下拉 |\n| 0603 | 0.1W | 0.05～0.07W | 一般限流、分压 |\n| 0805 | 0.125～0.25W | 0.06～0.17W | 手焊、较大功耗 |\n| 1206 | 0.25～0.5W | 0.12～0.35W | 电源、LED、采样 |\n| 1210 | 0.5W | 0.25～0.35W | 电流采样、假负载 |\n| 2512 | 1～2W | 0.5～1.4W | 大电流采样、泄放 |\n\n注意：\n\n- 额定功率通常是在 70℃ 或 25℃ 下标的，温度越高允许功率越低；\n- 多个电阻挨在一起，实际环境温度高于室温；\n- 贴在散热差的区域（比如连接器旁边、密闭外壳内）要再降；\n- 脉冲功率和平均功率不是一回事。\n\n#### 2.5.3 具体料号示例\n\n以下是常见料号，**采购前必须核对最新手册**：\n\n| 用途 | 示例料号 | 关键参数 | 注意 |\n|---|---|---|---|\n| 普通 10kΩ 上拉 | Yageo RC0603FR-0710KL | 10kΩ, ±1%, 0.1W, 0603 | 最常用 |\n| 普通 10kΩ 上拉 | Panasonic ERJ-3EKF1002V | 10kΩ, ±1%, 0.1W, 0603 | 替代料 |\n| 普通 10kΩ 上拉 | Vishay CRCW060310K0FKEA | 10kΩ, ±1%, 0.1W, 0603 | 替代料 |\n| 0Ω 跳线 | Yageo RC0603JR-070RL | 0Ω, ±5%, 0603 | 有额定电流，不是理想导线 |\n| 0.1Ω 采样 | Yageo PE2512FKE070R1L | 0.1Ω, ±1%, 1W, 2512 | 注意 TCR、四端连接 |\n| 精密分压 | 薄膜电阻系列（如 Vishay PTF） | ±0.1%, 低 TCR | 价格高，按需 |\n\n**0Ω 电阻不是“没有电阻”**：它实际可能是几 mΩ 到几十 mΩ，有额定电流（比如 0603 0.5～1A，0805 1～2A，具体查手册）。用 0Ω 当电源跳线、大电流路径时，要查额定电流和压降。\n\n#### 2.5.4 电阻网络与匹配\n\n**电阻网络**（resistor network/array）把多个电阻封装在一起，优点是：\n\n- 占板面积小；\n- 阻值匹配好（同一芯片上温度一致）；\n- 布线方便（排阻、上拉阵列）。\n\n常见用于：\n\n- 多路上拉/下拉；\n- 差分分压、ADC 多通道；\n- 衰减网络；\n- 终端匹配。\n\n注意：网络里的电阻可能是独立、公共端、总线式，接线方式不同；功率通常按单个电阻和整体封装分别限制。\n\n#### 2.5.5 电位器与可变电阻\n\n**电位器**（potentiometer）有三个端：两个固定端 + 一个滑动端（wiper）。接法：\n\n- 两端用：可变电阻（rheostat），阻值随位置变化；\n- 三端用：可调分压，输出取自滑动端。\n\n电位器的优点是可现场调节；缺点是机械磨损、滑动端接触不良、长期稳定性差、容易受振动/灰尘影响。**不要用普通电位器做长期可靠的固定设定**，量产应该用固定电阻或数字电位器，并做校准。\n\n数字电位器（digital potentiometer）用数字接口控制，但有端电压范围、电流限制、掉电位置、非易失性等限制，不能直接替代机械电位器。\n\n### 2.6 测量与仿真\n\n#### 2.6.1 万用表测电阻\n\n**基本步骤**：\n\n1. **断电**：把电路电源断开。\n2. **放电**：如果板上有大电容，先等一会儿或用电阻放电。\n3. **隔离**：尽量把被测电阻从电路里“孤立”出来，至少确认没有并联路径。\n4. **选档**：电阻档，自动量程或手动选合适量程。\n5. **读数**：表笔接触电阻两端，读数稳定后记录。\n6. **对照**：与标称值、容差比较。\n\n**在板测量为什么会偏小**：\n\n电阻在电路里往往和其他元件并联。比如一个 10kΩ 电阻，板上另一条路径也是 10kΩ 到地，万用表读到的是 `10k || 10k = 5kΩ`，不是 10kΩ。这不是电阻坏了，是测量方法问题。\n\n排查顺序：\n\n1. 看原理图，确认被测电阻两端还连了什么；\n2. 断电测两端通断，看是否有低阻路径；\n3. 拆下一端（或吹下电阻）再测；\n4. 如果读数仍不对，再怀疑电阻本身。\n\n**表笔和接触电阻**：普通表笔、鳄鱼夹、焊点都有几 mΩ 到几百 mΩ 的接触电阻。测 0.1Ω 采样电阻时，表笔电阻可能比被测电阻还大，必须用**四线（Kelvin）测量**：两根线通电流，另两根线测电压，消除引线压降。\n\n**温度**：电阻阻值随温度变化。刚焊完的电阻可能很热，读数会偏；用手捏着电阻也会加热。精密测量要等温度稳定，避免手直接捏。\n\n#### 2.6.2 用电压/电流反算电阻\n\n如果没有电阻档，或者想在真实工作状态下测，可以：\n\n```text\nR = U / I\n```\n\n- 用电压表测电阻两端电压 `U`；\n- 用电流表测流过电阻的电流 `I`；\n- 两者相除。\n\n注意：\n\n- 电压表并联，电流表串联；\n- 电流表有负担电压，会改变电路；\n- 电阻在工作状态下发热，阻值可能与冷态不同；\n- 非线性器件（LED、二极管）不能用这个方法算“电阻”，因为 `U/I` 不是常数。\n\n#### 2.6.3 仿真任务\n\n打开以下仿真，先预测，再观察，最后解释差异：\n\n- [欧姆定律](#/sim/ohms)：改变电压和电阻，观察电流。\n- [串联电阻](#/sim/res-series)：两个 10kΩ 串联，总电阻应为 20kΩ。\n- [分压电路](#/sim/voltdivide)：10kΩ/10kΩ 空载 2.5V；接 10kΩ 负载后应跌到约 1.67V。\n- [惠斯通电桥](#/sim/wheatstone)：调到一个电阻，观察平衡时输出接近 0V。\n\n仿真记录表：\n\n| 项目 | 预测 | 仿真 | 差异原因 |\n|---|---|---|---|\n| 10k+10k 串联 | 20kΩ |  |  |\n| 10k//10k 并联 | 5kΩ |  |  |\n| 5V 分压空载 | 2.5V |  |  |\n| 5V 分压接 10k 负载 | 1.67V |  |  |\n| 电桥平衡 | 0V |  |  |\n\n#### 2.6.4 本章动手任务\n\n- [ ] 用万用表测一个 10kΩ 电阻，记录标称、容差、实测，判断是否在范围内。\n- [ ] 测两个 10kΩ 串联和并联，比较理论值与实测值。\n- [ ] 搭 5V、10kΩ/10kΩ 分压，空载测中点，再并 10kΩ 负载测一次，记录跌落。\n- [ ] 用 5V、LED、620Ω 搭限流电路，测 LED 两端电压和电阻两端电压，验证 `U_R+U_LED≈5V`。\n- [ ] 搭 3.3V、10kΩ 上拉、按键到地，测松开/按下时 GPIO 电压和按下电流。\n- [ ] 找一只 0Ω 电阻，测它的实际阻值，并查手册额定电流。\n- [ ] 用四线法（或开尔文夹）测一只 0.1Ω 采样电阻，和两线法对比。\n\n### 2.7 常见坑\n\n#### 坑 1：只看阻值，不看功率\n\n**现象**：电阻装上后发烫、变色、阻值漂移，甚至开路。\n**原因**：实际功耗超过额定功率，或降额不足。\n**排查顺序**：\n\n1. 算 `P=I²R` 或 `P=U²/R`，按最大电流/电压；\n2. 查料号额定功率和测试温度；\n3. 看环境温度和邻近热源；\n4. 换更大封装/功率，或降低电流。\n\n#### 坑 2：只算标称，不算容差\n\n**现象**：批量生产时，有的板分压偏高、有的偏低，ADC 读数不一致。\n**原因**：电阻 ±1%/±5% 的容差，叠加电源、器件容差，最坏情况超预算。\n**排查顺序**：\n\n1. 列误差预算：电阻、电源、基准、ADC；\n2. 按最坏情况（最大/最小）算；\n3. 必要时选 ±0.1% 或匹配网络；\n4. 量产做校准。\n\n#### 坑 3：忽略温漂\n\n**现象**：常温校准好的电路，夏天/冬天读数漂移；靠近发热器件后更明显。\n**原因**：TCR 大，或电阻温度梯度大。\n**排查顺序**：\n\n1. 查 TCR；\n2. 算温度变化引起的阻值变化；\n3. 换低温漂电阻；\n4. 远离热源、做温度补偿。\n\n#### 坑 4：忽略最大工作电压\n\n**现象**：高压分压/泄放电阻用着用着击穿、表面爬电、阻值异常。\n**原因**：电压超过电阻最大工作电压，即使功率没超。\n**排查顺序**：\n\n1. 算电阻两端最大电压；\n2. 查手册 max working voltage；\n3. 串联多个电阻分压，或选高压系列；\n4. 注意爬电距离和 PCB 间距。\n\n#### 坑 5：在板测电阻，读数偏小\n\n**现象**：在板测 10kΩ 读到 5kΩ，拆下来却是 10kΩ。\n**原因**：板上并联路径。\n**排查顺序**：\n\n1. 看原理图，找并联路径；\n2. 断电测节点通断；\n3. 拆一端复测；\n4. 不要直接换电阻。\n\n#### 坑 6：把 0Ω 当理想导线\n\n**现象**：用 0603 0Ω 跳 2A 电源，结果发热、压降大、甚至烧断。\n**原因**：0Ω 有实际阻值（几 mΩ 到几十 mΩ）和额定电流。\n**排查顺序**：\n\n1. 查 0Ω 料号的额定电流；\n2. 算压降 `I×R` 和功耗 `I²R`；\n3. 大电流用更宽走线、多个过孔、专用跳线/焊盘；\n4. 不要用 0402 0Ω 过大电流。\n\n#### 坑 7：上拉/下拉阻值拍脑袋\n\n**现象**：按键偶尔误触发；I²C 通信不稳定；低功耗设备待机电流大。\n**原因**：上拉太大 → 上升慢/易受干扰；上拉太小 → 功耗大；开漏总线没算电容。\n**排查顺序**：\n\n1. 算 RC 上升时间；\n2. 查总线电容和协议上升时间要求；\n3. 算按下/静态电流；\n4. 用示波器看边沿。\n\n#### 坑 8：用电位器做长期设定\n\n**现象**：设备用一段时间后，设定值漂移、接触不良、振动后变化。\n**原因**：机械电位器磨损、滑动端接触电阻变化。\n**排查顺序**：\n\n1. 确认是否必须可调；\n2. 量产改用固定电阻/数字电位器；\n3. 保留校准点；\n4. 如果必须用，选密封、长寿命型号，并做振动/寿命测试。\n\n#### 坑 9：忽略电阻热噪声\n\n**现象**：高增益小信号电路底噪大，换运放也没用。\n**原因**：高阻值电阻的热噪声被放大。\n**排查顺序**：\n\n1. 算 `Vn=√(4kTRB)`；\n2. 降低电阻值/带宽；\n3. 用低噪声运放和屏蔽；\n4. 不要盲目换昂贵运放。\n\n#### 坑 10：封装/焊盘选错\n\n**现象**：电阻装不上、立碑、虚焊、散热不足。\n**原因**：封装与焊盘不匹配，或手焊/回流工艺不适合。\n**排查顺序**：\n\n1. 查料号封装尺寸；\n2. 对照 PCB 焊盘；\n3. 手焊用 0805/1206 练习；\n4. 回流焊按厂家推荐焊盘。\n\n### 2.8 本章复盘\n\n#### 2.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| `R = ρL/A` | 导体电阻 | 长、细、材料差 → 电阻大 |\n| `U = IR` | 欧姆定律 | 线性电阻，`U` 是该电阻两端电压 |\n| `P = UI = I²R = U²/R` | 功率 | 同一器件、同一工作点 |\n| `R_series = R1+R2+…` | 串联 | 电流相同 |\n| `1/R_parallel = 1/R1+1/R2+…` | 并联 | 电压相同 |\n| `R1||R2 = R1R2/(R1+R2)` | 两电阻并联 | 快速计算 |\n| `Vout = Vin × R2/(R1+R2)` | 分压 | 输出端几乎不取电流 |\n| `I1 = I_total × R2/(R1+R2)` | 两电阻分流 | 分子是另一个电阻 |\n| `ΔR/R = TCR × ΔT` | 温漂 | TCR 单位 ppm/℃ |\n| `Vn = √(4kTRB)` | 热噪声 | 进阶，精密小信号 |\n| `P_max < 额定功率 × 50%～70%` | 降额 | 高温/密集布局再降 |\n| `R_source = R1||R2` | 分压源阻抗 | 影响 ADC 采样/负载 |\n\n#### 2.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 电阻 | resistance | 对电流的阻碍，单位 Ω |\n| 电阻器 | resistor | 具有确定阻值的两端元件 |\n| 电阻率 | resistivity | 材料本身的导电难易程度，单位 Ω·m |\n| 标称值 | nominal value | 厂家标称的阻值 |\n| 容差 | tolerance | 实际阻值允许的偏差 |\n| E 系列 | E-series | 标准阻值系列，如 E12/E24/E96 |\n| 额定功率 | power rating | 允许长期耗散的最大功率 |\n| 降额 | derating | 实际使用低于额定值，留余量 |\n| 最大工作电压 | maximum working voltage | 允许加在电阻两端的最大电压 |\n| 温度系数 | TCR | 阻值随温度变化的程度，ppm/℃ |\n| 热噪声 | thermal noise | 电阻自身产生的微弱噪声 |\n| 上拉 | pull-up | 用电阻把节点拉到高电平 |\n| 下拉 | pull-down | 用电阻把节点拉到低电平 |\n| 开漏 | open-drain | 输出只能拉低，高电平靠上拉 |\n| 分压 | voltage divider | 串联电阻按比例分电压 |\n| 分流 | current divider | 并联电阻按反比分电流 |\n| 源阻抗 | source impedance | 从输出端看进去的等效内阻 |\n| 负载效应 | loading effect | 接负载后输出电压被拉低 |\n| 0Ω 电阻 | zero-ohm resistor | 跳线用电阻，有额定电流 |\n| 电阻网络 | resistor network | 多个电阻封装在一起 |\n| 电位器 | potentiometer | 可调三端电阻 |\n| 四线测量 | Kelvin measurement | 消除引线电阻的精密测阻方法 |\n\n#### 2.8.3 自测\n\n1. 一个 10kΩ、±1% 的电阻，允许范围是多少？\n2. `103`、`472`、`4R7`、`0R1` 分别代表多少？\n3. 5V、LED `Vf=2.2V`、目标 10mA，限流电阻取多少？选 300Ω 后实际电流多少？\n4. 12V 经 10kΩ/2.7kΩ 分压，空载输出多少？15V 时多少？\n5. 上述分压器的源阻抗是多少？接一个 10kΩ 负载后输出多少？\n6. 3.3V、10kΩ 上拉、按键按下到地，按下电流多少？\n7. 一个 0603、0.1W 电阻实际耗 0.08W，能不能长期用？为什么？\n8. 0Ω 电阻为什么不能当理想导线？\n9. 在板测 10kΩ 读到 5kΩ，最可能的原因是什么？\n10. 电阻热噪声和哪些因素有关？怎么降低？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `9.9kΩ～10.1kΩ`。\n2. `103=10kΩ`；`472=4.7kΩ`；`4R7=4.7Ω`；`0R1=0.1Ω`。\n3. `R=(5−2.2)/0.01=280Ω`，取 300Ω；`I=2.8/300≈9.33mA`。\n4. `12×2.7/12.7≈2.55V`；`15×2.7/12.7≈3.19V`。\n5. `10k||2.7k≈2.13kΩ`；接 10kΩ 负载后下臂 `2.7k||10k≈2.12kΩ`，`Vout=12×2.12/(10+2.12)≈2.10V`（以 12V 输入为例）。\n6. `3.3/10k=0.33mA`。\n7. 不建议。已用到 80% 额定，长期高温会漂移/寿命下降；应换更大功率或降流。\n8. 0Ω 实际有几 mΩ 到几十 mΩ 阻值，且有额定电流；大电流会压降、发热、烧断。\n9. 板上存在并联路径，读数是被测电阻与并联路径的等效值；应拆一端复测。\n10. 与电阻值、温度、带宽有关；降低电阻、降低带宽、降低温度可减小。\n\n<\/details>\n\n#### 2.8.4 本章能力清单\n\n- [ ] 能读出三位/四位/EIA-96/R 小数点标记的阻值。\n- [ ] 能算串联、并联、分压、分流，并做最坏情况核算。\n- [ ] 能根据功耗选封装，并说出降额规则。\n- [ ] 能查 TCR、最大工作电压、额定功率。\n- [ ] 能区分上拉、下拉、开漏，选合适阻值。\n- [ ] 能正确测电阻，解释在板测量偏小的原因。\n- [ ] 能说出 0Ω 电阻的额定电流限制。\n\n#### 2.8.5 下一章\n\n下一章进入**电容**。电阻管“电流大小”，电容管“电荷存储”和“随时间变化”。很多看起来像“玄学”的现象——去耦、滤波、复位延时、耦合、RC 振荡——本质都是电容在充放电。第 03 章会从 `Q=CV` 开始，把充放电曲线、时间常数、容抗、ESR、去耦布局讲清楚。","taskSignature":"d995c97b77a0e45c32fe4cfab51721479c07616e974099ba09a166d01dfb022d","taskCount":14},{"id":"03","title":"第 03 章 · 电容","short":"电容","stage":1,"diff":3,"prev":"第 01 章 基础概念、第 02 章 电阻","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用 `Q=CV` 解释电容为什么“存电荷”，并说出电容和电池的区别。\n2. 算 RC 充放电的时间常数、63%/95%/99% 时刻，画出充放电曲线。\n3. 解释去耦电容为什么必须靠近芯片，100nF 和大电容各自管什么。\n4. 算 RC 低通/高通滤波的截止频率，知道它为什么能滤噪、隔直。\n5. 分清 MLCC、铝电解、钽电容、薄膜电容的适用场景。\n6. 查电容的耐压、容差、ESR、DC 偏压、温度特性，做降额。\n7. 用万用表/LCR 表测电容，知道在板测量为什么会偏大。\n8. 说出至少 8 个电容常见坑，并给出排查顺序。\n\n电容是“时间”的元件。电阻决定电流大小，电容决定电压**怎么随时间变化**。去耦、滤波、复位延时、耦合、振荡、峰值检测，背后都是电容在充放电。\n\n## 本章图例索引\n\n- 图 3-1 电容的两种原理图符号\n- 图 3-2 RC 充电电路与电压曲线\n- 图 3-3 去耦电容的正确/错误位置\n- 图 3-4 RC 低通滤波器与幅频特性\n- 图 3-5 耦合电容与高通特性\n- 图 3-6 RC 复位延时\n- 图 3-7 常见电容类型与封装\n\n## 正文\n\n### 3.1 它解决什么问题：三个真实场景\n\n#### 场景一：芯片一工作，电源就抖\n\n芯片内部晶体管每秒翻转几百万次，每次翻转都要瞬间取一点电流。电源和走线离得远，有电阻和电感，不能瞬间把电流送过来，芯片电源引脚上的电压就会短暂下陷。下陷太大，芯片可能误动作、复位、甚至死机。\n\n在芯片电源引脚旁边放一颗 100nF 电容，它就像“随身水杯”：芯片突然要电流，电容先就近供给；电源平稳时，电容再慢慢补满。这就是**去耦**（decoupling）。\n\n#### 场景二：按键按下，单片机要等一会儿才启动\n\n有些芯片要求电源稳定一段时间后再释放复位。用电阻和电容组成 RC 延时：上电时电容从 0V 慢慢充电，复位引脚电压缓慢上升，超过阈值后芯片才开始工作。这是电容的**定时**作用。\n\n#### 场景三：音频信号要跨过两级，但直流偏置不能互相影响\n\n前级可能有 2.5V 直流偏置，后级可能是 0V 偏置。直接把信号线连过去，两级的直流会互相打架。串一颗电容，直流被挡住，交流信号通过，这叫**耦合**（AC coupling）。\n\n这三个场景对应电容的三类角色：**储能/去耦、定时/滤波、隔直/耦合**。同一个 100nF，并联在电源上是去耦，串联在信号路径上是耦合，位置决定角色。\n\n### 3.2 它是什么：两块导体夹一层绝缘\n\n#### 3.2.1 生活类比：小水池\n\n想象一个很小的水池，进水口很细。打开进水阀，水慢慢流进池子，水位上升；关掉进水阀，池子里的水不会立刻消失，还能继续供给下游一会儿。\n\n电容就像电路里的“小水池”：\n\n- **电压**像水位；\n- **电荷**像水量；\n- **电容值 C** 像水池的底面积：底面积越大，同样水位变化能装更多水；\n- **充放电**像进水/放水，需要时间。\n\n但电容和电池不同：电容储存的是**电场能量**，不是化学能；它放电极快，自放电也比电池快；它不能像电池那样维持长时间稳定电压。电容是“短跑选手”，电池是“长跑选手”。\n\n#### 3.2.2 物理直觉：电场存能量\n\n电容由两块导体（极板）和中间的绝缘介质组成。给两极板加电压，正负电荷分别聚集在两侧，介质中建立电场，能量储存在电场里。\n\n基本关系：\n\n```text\nQ = C × U\n```\n\n- `Q`：极板上储存的电荷量，单位库仑（`C`）\n- `C`：电容值，单位法拉（`F`）\n- `U`：电容两端电压，单位伏特（`V`）\n\n所以 `1F = 1C/V`：加 1V 电压，能存 1 库仑电荷，就是 1 法拉。法拉是非常大的单位，实际电路常用：\n\n- `1F = 1000mF = 10⁶μF = 10⁹nF = 10¹²pF`\n- `1μF = 1000nF`；`1nF = 1000pF`\n- `100nF = 0.1μF`\n\n电容的电流和电压变化率有关：\n\n```text\nI = C × dU/dt\n```\n\n- `dU/dt`：电压随时间的变化率，单位 V/s。\n- 电压变化越快，充放电电流越大；电压不变（直流稳态），电流为 0（理想电容）。\n\n这解释了“通交流、阻直流”：交流电压一直在变，电容一直在充放电，外电路一直有电流；直流电压稳定后，电容充满，电流趋近于 0。\n\n电容储存的能量：\n\n```text\nE = ½ × C × U²\n```\n\n例子：100μF 电容充到 5V，储能 `0.5 × 100e-6 × 25 = 1.25mJ`。不大，但短路放电瞬间电流可能很大，所以大电容断电后要放电，不能直接用手碰。\n\n#### 3.2.3 电容 vs 电池：别混用\n\n| 特性 | 电容 | 电池 |\n|---|---|---|\n| 储能方式 | 电场 | 化学能 |\n| 电压 | 随电荷线性变化 `U=Q/C` | 放电过程中相对平稳 |\n| 充放电速度 | 很快，可高功率脉冲 | 较慢，受化学过程限制 |\n| 自放电 | 较慢但比电池快 | 慢 |\n| 寿命 | 很长（电解有寿命限制） | 充放电循环有限 |\n| 典型用途 | 去耦、滤波、定时、耦合 | 长时间供电 |\n\n电容不能替代电池做长时间供电；电池也不能替代电容做高频去耦。\n\n#### 3.2.4 原理图符号与极性\n\n电容在原理图里通常画成两条平行线。无极性电容就是两条等长线；有极性电容会标 `+`，或用一条直线+一条弧线表示。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 185\" width=\"480\" height=\"185\" role=\"img\" aria-label=\"无极性与有极性电容符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 90 H95 M95 55 V125 M110 55 V125 M110 90 H170 M250 90 H315 M315 55 V125 M330 55 V125 M330 90 H390\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"50\" y=\"40\">无极性电容<\/text><text x=\"255\" y=\"40\">有极性电容<\/text><text x=\"289\" y=\"72\">+<\/text><text x=\"30\" y=\"160\">每个元件均有两个端子；极性件按标识接线。<\/text><\/g><\/svg>\n```\n\n图 3-1 电容的两种原理图符号\n\n**极性**：\n\n- **MLCC 多层陶瓷电容**：一般无极性。\n- **铝电解电容**：有极性，外壳色带通常标负极；反接可能发热、鼓包、漏液甚至爆裂。\n- **钽电容**：有极性，色带通常标正极（不同厂家可能不同，必须查手册）；反接可能短路、起火。\n- **薄膜电容**：多数无极性，部分高压/脉冲型号有规定方向。\n- **超级电容**：有极性，单体电压低，需要均衡。\n\n**反接不是“不工作”这么简单**：电解/钽电容反接可能迅速发热、失效，甚至起火。上电前一定核对极性和丝印。\n\n#### 3.2.5 串联与并联\n\n**并联**：电压相同，容量相加。\n\n```text\nC_total = C1 + C2 + … + Cn\n```\n\n两个 1μF 并联 = 2μF。并联还能降低等效 ESR/ESL（多个电容并联），所以去耦常用多个电容。\n\n**串联**：电荷相同，容量倒数相加。\n\n```text\n1/C_total = 1/C1 + 1/C2 + …\n两个电容：C_total = C1×C2/(C1+C2)\n```\n\n两个 1μF 串联 = 0.5μF。串联时电压分配不一定均匀，取决于漏电/等效电阻；电解电容串联需要均压电阻，不能简单把耐压相加。\n\n### 3.3 关键参数与数据手册\n\n电容手册比电阻复杂得多。只看“10μF/16V”远远不够。\n\n#### 3.3.1 电容值、容差与标记\n\n**标称电容值**：厂家标的值，比如 `100nF`、`10μF`。实际有容差，常见：\n\n- MLCC：`±5%`、`±10%`、`±20%`，高容值 X5R/X7R 可能 `±20%`。\n- 铝电解：`±20%` 常见，部分 `−20%/+80%`。\n- 钽电容：`±10%`、`±20%`。\n- 薄膜：`±1%`、`±2%`、`±5%`、`±10%`。\n\n**三位标记**（以 pF 为单位）：\n\n- `104` = `10 × 10⁴ pF = 100nF = 0.1μF`\n- `223` = `22 × 10³ pF = 22nF`\n- `471` = `47 × 10¹ pF = 470pF`\n- `102` = `10 × 10² pF = 1nF`\n- `101` = `100pF`\n\n注意：不是所有电容都遵循这个规则。小尺寸 MLCC 可能无字，电解电容直接印 `10μF 16V`，钽电容可能用代码。**无字电容不能凭颜色/大小猜容值，必须测或查包装。**\n\n#### 3.3.2 额定电压与降额\n\n**额定电压**（voltage rating）：电容允许长期施加的最大直流电压。交流/脉冲场景还要看交流耐压、脉冲电压、dv/dt。\n\n降额建议：\n\n- **MLCC**：实际工作电压建议不超过额定电压的 50%～80%；高可靠/高压场景更保守。\n- **铝电解**：建议不超过 80%，高温/长寿命场景 50%～70%。\n- **钽电容**：建议不超过 50%，并且要控制浪涌电流；钽电容对过压/反接很敏感。\n- **薄膜**：按厂家脉冲/交流曲线，不能只看 DC 额定。\n\n**电压不是“不超过就行”**：电容在额定电压附近长期工作，漏电、寿命、可靠性都会下降；击穿时可能短路、起火。\n\n#### 3.3.3 ESR：等效串联电阻\n\n**ESR**（equivalent series resistance，等效串联电阻）是电容内部电极、引线、接触电阻的等效总和。它让电容不再是理想电容：\n\n- 充放电时，ESR 会产生热量 `I²×ESR`；\n- 滤波时，ESR 会让纹波变大；\n- 大电流脉冲时，ESR 上的压降会让电容“反应变慢”。\n\n电解电容的 ESR 通常比 MLCC 大；MLCC 的 ESR 很小，但具体看系列/尺寸/电压。开关电源的输出电容、电机驱动、大电流脉冲，必须看 ESR 和纹波电流。\n\n#### 3.3.4 ESL 与自谐振频率\n\n**ESL**（equivalent series inductance，等效串联电感）来自引脚、内部电极、封装。频率越高，ESL 的阻抗越大。\n\n电容的阻抗近似：\n\n```text\n|Z| = √( ESR² + (2πfL − 1/(2πfC))² )\n```\n\n- 低频：容抗 `1/(2πfC)` 主导，频率越高阻抗越小。\n- 某个频率：容抗和感抗抵消，阻抗最低，等于 ESR；这个频率叫**自谐振频率**（SRF，self-resonant frequency）。\n- 高于 SRF：感抗主导，频率越高阻抗越大，电容看起来像电感。\n\n所以“100nF 去耦”不是所有频率都有效。高频去耦要用小封装、短走线、低 ESL 的电容；大电容在高频可能已经“变电感”了。\n\n#### 3.3.5 漏电流\n\n理想电容充满后电流为零；实际电容有**漏电流**（leakage current），尤其是电解电容、钽电容、超级电容。\n\n漏电流会影响：\n\n- 长时间保持的采样/保持电路；\n- 低功耗待机；\n- 电荷泵/峰值检测；\n- 高阻节点电压。\n\n精密场合要查漏电流规格，必要时选薄膜/C0G，或加缓冲/复位。\n\n#### 3.3.6 介质类型：C0G、X7R、X5R、Y5V\n\nMLCC 的“介质”决定了稳定性、容值范围、温度特性、DC 偏压特性。\n\n| 介质 | 温度特性 | 容值稳定性 | 典型用途 | 注意 |\n|---|---|---|---|---|\n| C0G/NP0 | 极稳定，接近不随温度/电压变 | 很好 | 定时、滤波、谐振、精密 | 容值通常较小，体积大 |\n| X7R | −55～+125℃，±15% | 较好 | 一般去耦、滤波 | 有 DC 偏压损失、老化 |\n| X5R | −55～+85℃，±15% | 一般 | 大容量去耦 | 温度范围窄，DC 偏压损失 |\n| Y5V | −30～+85℃，+22/−82% | 差 | 廉价旁路 | 容值随温度/电压大幅下降，不适合定时/滤波 |\n| 铝电解 | 有极性，容量大 | 一般 | 电源储能/低频滤波 | ESR 大、寿命有限 |\n| 薄膜 | 稳定、低损耗 | 好 | 音频、脉冲、精密 | 体积大、价格高 |\n| 钽 | 有极性，容量大 | 一般 | 紧凑储能 | 过压/反接敏感，需降额 |\n\n**DC 偏压效应**：高介电常数 MLCC（X5R/X7R/Y5V）加上直流电压后，有效容值会下降，可能下降 30%～80%。比如标称 10μF/16V 的 0603 X5R，在 10V 偏压下可能只剩 4～6μF。选型必须查厂家的“capacitance vs DC bias”曲线，不能只看标称值。\n\n**温度与老化**：X7R/X5R 容值随温度变化；Class II 陶瓷还会随时间老化（容值缓慢下降），需要高温烘烤/焊接重新“复位”。精密定时用 C0G，不要用 Y5V。\n\n#### 3.3.7 纹波电流与寿命\n\n电解电容、钽电容有**纹波电流**（ripple current）限制。纹波电流在 ESR 上产生热量，温度升高会缩短寿命。\n\n铝电解寿命常用“每升高 10℃ 寿命减半”估算（具体看厂家公式），所以开关电源输出电容要选低 ESR、长寿命、额定纹波足够的型号，并注意散热。\n\n#### 3.3.8 数据手册速查表\n\n| 参数 | 英文 | 为什么重要 | 典型条件 |\n|---|---|---|---|\n| 容值 | capacitance | 决定储能/滤波/定时 | 25℃、指定频率 |\n| 容差 | tolerance | 误差预算 | ±5%/±10%/±20% |\n| 额定电压 | voltage rating | 击穿/寿命 | DC 或 AC |\n| ESR | equivalent series resistance | 纹波/发热/滤波 | 100kHz 等 |\n| ESL | equivalent series inductance | 高频阻抗/自谐振 | 频率曲线 |\n| 漏电流 | leakage current | 高阻/低功耗 | 额定电压、时间 |\n| 介质 | dielectric | 稳定性/DC 偏压 | C0G/X7R/X5R/Y5V |\n| 纹波电流 | ripple current | 发热/寿命 | 频率、温度 |\n| 工作温度 | operating temperature | 环境限制 | −55～+125℃ |\n| 寿命 | endurance/life | 电解电容更换周期 | 105℃、额定纹波 |\n\n**读手册第一原则**：容值、ESR、耐压都要看测试条件（频率、偏压、温度）。同一个 10μF，在 1kHz 和 100kHz 测出来可能不一样；加了 10V 偏压后更不一样。\n\n#### 3.3.9 选型顺序\n\n1. **定功能**：去耦、滤波、定时、耦合、储能。\n2. **定容值**：按公式算，留容差/降额。\n3. **定类型**：C0G（精密）、X7R/X5R（一般）、电解（大容量）、薄膜（音频/脉冲）、钽（紧凑）。\n4. **定耐压**：按降额规则。\n5. **查 ESR/纹波**：电源/大电流场景。\n6. **查 DC 偏压/温度**：MLCC 必查有效容值。\n7. **定封装/极性**：手焊/回流、高度、极性。\n8. **写完整料号**。\n\n### 3.4 三个典型电路\n\n#### 3.4.1 电路一：RC 充放电\n\n```svg\n<svg role=\"img\" aria-label=\"5伏电源通过开关和10千欧电阻为100微法电容充电\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"137.04pt\" width=\"240.95600000000005pt\" viewBox=\"-27.073 -145.4 240.95600000000005 137.04\"><path d=\"M 0.0,-108.0 L 18,-108 M 26.64,-111.6 L 46.8,-124.2 M 54,-108 L 72,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-108.0 L 90,-108 L 90,-117 L 126,-117 L 126,-99 L 90,-99 L 90,-108 M 126,-108 L 144,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-108.0 L 162,-108 L 180,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-108.0 L 144,-75.24 M 153,-75.24 L 135,-75.24 M 153,-68.76 L 135,-68.76 M 144,-68.76 L 144,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-36.0 L 144,-21.6 L 135,-21.6 L 153,-21.6 M 137.7,-17.28 L 150.3,-17.28 M 142.2,-12.96 L 145.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-14.4\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-14.4\" dy=\"13\">5V<\/tspan><\/text><circle cx=\"22.32\" cy=\"-108\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"49.68\" cy=\"-108\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"36.0\" y=\"-140.8\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"36.0\" dy=\"13\">S1<\/tspan><\/text><text x=\"108.0\" y=\"-133.60000000000002\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"108.0\" dy=\"13\">R 10kΩ<\/tspan><\/text><text x=\"201.6\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"201.6\" dy=\"13\">Vc<\/tspan><\/text><text x=\"131.4\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"131.4\" dy=\"13\">C 100µF<\/tspan><\/text><circle cx=\"144\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n```circuitjs\nrc-charge\n```\n\n图 3-2 RC 充电电路\n\n**过程**：\n\n1. 开关刚闭合：电容电压为 0V（电容电压不能突变），全部 5V 加在电阻上，充电电流最大 `I=5V/10kΩ=0.5mA`。\n2. 随着电容充电，`Vc` 上升，电阻两端电压 `5V−Vc` 减小，电流减小。\n3. 时间足够长，`Vc` 接近 5V，电流接近 0。\n\n**时间常数**：\n\n```text\nτ = R × C\n```\n\n- `τ`（tau）：时间常数，单位秒（s）\n- `R`：电阻，单位欧姆（Ω）\n- `C`：电容，单位法拉（F）\n\n`Ω × F = 秒`。计算前必须把 kΩ 换成 Ω、μF 换成 F。\n\n例：`R=10kΩ=10000Ω`，`C=100μF=100×10⁻⁶F=10⁻⁴F`：\n\n```text\nτ = 10000 × 10⁻⁴ = 1s\n```\n\n**充电曲线**（初始 0V，最终 5V）：\n\n```text\nVc\n5V ────────────────────────  ← 最终值\n   │                 ******\n   │            *****\n   │         ***\n   │      **\n   │    *\n   │  *\n0V *───┼────┼────┼────┼────┼──→ t\n   0   1τ   2τ   3τ   4τ   5τ\n```\n\n| 时间 | 充到最终值的比例 | 5V 时电压 |\n|---|---|---|\n| 1τ | 63.2% | 3.16V |\n| 2τ | 86.5% | 4.32V |\n| 3τ | 95.0% | 4.75V |\n| 4τ | 98.2% | 4.91V |\n| 5τ | 99.3% | 4.97V |\n\n公式：\n\n```text\nVc(t) = Vfinal + (Vinitial − Vfinal) × e^(−t/τ)\n```\n\n- 从 0V 充到 `Vfinal`：`Vc=Vfinal(1−e^(−t/τ))`\n- 从 `V0` 放电到 0V：`Vc=V0×e^(−t/τ)`\n\n**关键直觉**：\n\n- 电容电压不能突变，但电流可以突变。\n- 刚接通瞬间，电容像短路（电压为 0），电流由外电阻限制。\n- 充电久了，电容像开路（电流为 0），电压等于电源。\n- τ 不是“充满时间”，只是“充到 63% 的时间”；5τ 仍有约 0.7% 误差。\n\n**例子：1kΩ + 100nF**\n\n```text\nτ = 1000 × 100×10⁻⁹ = 100×10⁻⁶ = 0.1ms\n```\n\n0.1ms 肉眼看不到，示波器才能看清。1τ 约 63%，3τ 约 95%。\n\n**放电**：断开电源后，电容通过放电路径放电。若放电路径电阻仍为 R，τ 相同；若路径不同，重新算 τ。大电容断电后可能存电，必须放电再操作。\n\n#### 3.4.2 电路二：去耦电容\n\n**问题**：芯片瞬间取电流，电源走线有电阻和电感，不能瞬间响应，芯片电源引脚电压下陷。\n\n**解决**：在芯片电源引脚和地之间放电容，就近提供瞬态电荷。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 300\" role=\"img\" aria-label=\"去耦电容正确与错误布局对比\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <!-- correct -->\n  <rect x=\"50\" y=\"70\" width=\"140\" height=\"120\" rx=\"4\"/>\n  <path d=\"M190 100 H235\"/><path d=\"M235 100 V125\"/><path d=\"M222 125 H248\"/><path d=\"M222 135 H248\"/><path d=\"M235 135 V165\"/>\n  <path d=\"M235 165 H275 M263 165 V180 M251 180 H275 M255 188 H271 M259 196 H267\"/>\n  <path d=\"M190 160 H215\"/><path d=\"M215 160 V190 M203 190 H227 M207 198 H223 M211 206 H219\"/>\n  <text x=\"60\" y=\"95\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">IC<\/text>\n  <text x=\"120\" y=\"115\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">VCC<\/text>\n  <text x=\"112\" y=\"180\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">GND<\/text>\n  <text x=\"255\" y=\"108\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">C 100nF<\/text>\n  <!-- wrong -->\n  <rect x=\"390\" y=\"70\" width=\"120\" height=\"120\" rx=\"4\"/>\n  <path d=\"M510 100 H610\"/><path d=\"M610 100 V125\"/><path d=\"M597 125 H623\"/><path d=\"M597 135 H623\"/><path d=\"M610 135 V165\"/>\n  <path d=\"M610 165 H640 M628 165 V180 M616 180 H640 M620 188 H636 M624 196 H632\"/>\n  <path d=\"M510 160 H530\"/><path d=\"M530 160 V190 M518 190 H542 M522 198 H538 M526 206 H534\"/>\n  <text x=\"400\" y=\"95\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">IC<\/text>\n  <text x=\"440\" y=\"115\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">VCC<\/text>\n  <text x=\"430\" y=\"180\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">GND<\/text>\n  <text x=\"525\" y=\"88\" fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"12\">长走线（ESL 大）<\/text>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"40\" y=\"245\">正确：电容紧贴电源引脚，<\/text>\n  <text x=\"40\" y=\"265\">电容—引脚—地回路短。<\/text>\n  <text x=\"390\" y=\"245\">错误：电容离得远，<\/text>\n  <text x=\"390\" y=\"265\">走线电感让高频电流供不上。<\/text>\n<\/g><\/svg>\n```\n\n图 3-3 去耦电容的正确位置（示意）\n\n正确布局要点：\n\n- 电容尽量靠近芯片电源引脚，电容—引脚—地回路越短越好。\n- 过孔打在电容焊盘附近，不要经过长走线再打孔。\n- 100nF 负责高频瞬态，1～10μF 大电容负责更大、更慢的波动；具体组合看芯片手册。\n- 电源平面/地平面提供低阻抗回流，去耦电容不是唯一手段。\n\n错误布局：\n\n<!-- 错误布局见图 3-3 右半部分 -->\n\n走线电感会让高频电流“过不去”，电容再大也来不及供给。\n\n**去耦电容不能替代稳压器**：它只在短时间内提供电荷，平均电流仍由电源提供。它也不能消除所有噪声，尤其低频/共模/辐射噪声需要其他手段。\n\n**为什么多个容值并联**：不同容值/封装的电容在不同频率段阻抗低。大电容在低频段好，小电容在高频段好。但并联可能产生反谐振（anti-resonance），具体要看阻抗曲线和布局，不是“多加几个就好”。\n\n#### 3.4.3 电路三：RC 低通滤波\n\n```svg\n<svg role=\"img\" aria-label=\"RC低通电路：输入经电阻到输出，输出经电容接地\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"129.84pt\" width=\"295.244pt\" viewBox=\"-75.316 -138.20000000000002 295.244 129.84\"><path d=\"M 0.0,-108.0 L 18,-108 L 36,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-108.0 L 54,-108 L 54,-117 L 90,-117 L 90,-99 L 54,-99 L 54,-108 M 90,-108 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 144,-108 L 180,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-75.24 M 117,-75.24 L 99,-75.24 M 117,-68.76 L 99,-68.76 M 108,-68.76 L 108,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-21.6 L 99,-21.6 L 117,-21.6 M 101.7,-17.28 L 114.3,-17.28 M 106.2,-12.96 L 109.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-61.199999999999996\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-61.199999999999996\" dy=\"13\">Vin<\/tspan><\/text><text x=\"72.0\" y=\"-133.60000000000002\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">R 10kΩ<\/tspan><\/text><text x=\"201.6\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"201.6\" dy=\"13\">Vout<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">C 100nF<\/tspan><\/text><circle cx=\"108\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n```circuitjs\nrc-lowpass-159\n```\n\n图 3-4 RC 低通滤波器\n\n**原理**：频率越高，电容容抗 `Xc=1/(2πfC)` 越小，越容易把高频旁路到地；频率越低，容抗越大，信号越容易通过。结果：低频通过，高频被削弱。\n\n**截止频率**（−3dB 点）：\n\n```text\nfc = 1 / (2π × R × C)\n```\n\n例子：`R=1kΩ`，`C=100nF`：\n\n```text\nfc = 1 / (2π × 1000 × 100×10⁻⁹)\n   ≈ 1 / (6.283 × 10⁻⁴)\n   ≈ 1592Hz\n```\n\n约 1.59kHz。低于 fc 的信号基本通过；高于 fc 的信号被衰减，远高于 fc 时大约每十倍频衰减 20dB（一阶）。\n\n**阶跃响应**：输入从 0 跳到 5V，输出按 τ=RC 上升：\n\n```text\nτ = 1k × 100n = 0.1ms\n上升时间（10%～90%）≈ 2.2τ ≈ 0.22ms\n```\n\n**负载影响**：如果输出端接一个低阻负载，负载会与 C 并联/分流，截止频率和幅值都会变。RC 滤波器输出不适合直接驱动重负载，必要时加缓冲。\n\n**典型用途**：\n\n- ADC 输入抗混叠/降噪；\n- 按键消抖（配合施密特触发器）；\n- 传感器信号平滑；\n- 电源纹波滤波（大电容/LC 更常见）；\n- 音频低通/分频。\n\n**RC 低通的局限**：一阶滤波衰减慢（−20dB/decade），要求陡峭时用二阶/有源滤波；电阻会带来热噪声和压降；电容容差/温度会影响 fc。\n\n#### 3.4.4 电路四：耦合电容（高通）\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 260\" role=\"img\" aria-label=\"耦合电容隔直通交，与输入电阻组成高通\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M40 120 H120\"/><path d=\"M120 120 V92 M120 148 V120\"/><path d=\"M145 92 V148\"/><path d=\"M145 120 H240\"/>\n  <circle cx=\"240\" cy=\"120\" r=\"4\" fill=\"currentColor\"/><path d=\"M240 120 V160\"/><rect x=\"227\" y=\"160\" width=\"26\" height=\"60\"/><path d=\"M240 220 V245\"/>\n  <path d=\"M240 245 H310 M298 245 V260 M286 260 H310 M290 268 H306 M294 276 H302\"/>\n  <path d=\"M240 120 H430\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"35\" y=\"105\">Vin（含 2.5V 直流）<\/text><text x=\"100\" y=\"82\">C 1μF<\/text>\n  <text x=\"252\" y=\"110\">Vout（后级 0V 偏置）<\/text><text x=\"252\" y=\"200\">R 10kΩ<\/text>\n  <text x=\"440\" y=\"125\">后级输入<\/text><text x=\"318\" y=\"262\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 3-5 耦合电容与高通特性\n\n**原理**：电容隔直通交。串联电容与后级的输入电阻/偏置电阻组成高通，截止频率：\n\n```text\nfc = 1 / (2π × R × C)\n```\n\n例子：`C=1μF`，`R=10kΩ`：\n\n```text\nfc = 1 / (2π × 10000 × 1×10⁻⁶)\n   ≈ 1 / (0.06283)\n   ≈ 15.9Hz\n```\n\n低于 15.9Hz 的信号被衰减，高于它的通过。音频耦合常选 1～10μF，具体看输入阻抗和低频要求。\n\n**极性**：如果用电解电容，正极接直流电位较高的一侧，避免反接。音频信号本身是交流，但两端可能有直流偏置，必须按实际直流电位接。\n\n**耦合电容的副作用**：\n\n- 低频响应受限，太低会“低频不足”；\n- 电容漏电会让后级偏置漂移；\n- 上电/关电时电容充放电可能产生“噗”声（pop）；\n- 容差/ESR 影响音质/信号失真。\n\n**位置决定角色**：同一个 100nF，并联在电源与地之间是去耦；串联在信号路径上是耦合。看位置，不要只看容值。\n\n#### 3.4.5 电路五：RC 复位延时\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 320\" role=\"img\" aria-label=\"RC复位延时电路，电阻接3.3V，电容接地，中点接RESET\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M150 25 V55\"/><rect x=\"137\" y=\"55\" width=\"26\" height=\"62\"/><path d=\"M150 117 V150\"/>\n  <circle cx=\"150\" cy=\"160\" r=\"4\" fill=\"currentColor\"/><path d=\"M150 160 H285\"/>\n  <path d=\"M150 160 V200\"/><path d=\"M137 200 H163\"/><path d=\"M137 210 H163\"/><path d=\"M150 210 V240\"/>\n  <path d=\"M150 240 H230 M218 240 V255 M206 255 H230 M210 263 H226 M214 271 H222\"/>\n  <path d=\"M285 160 V135\"/><path d=\"M285 135 H330\"/>\n  <rect x=\"330\" y=\"115\" width=\"130\" height=\"42\" rx=\"4\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"135\" y=\"18\">+3.3V<\/text><text x=\"170\" y=\"92\">R 10kΩ<\/text>\n  <text x=\"185\" y=\"255\">C 10μF<\/text><text x=\"190\" y=\"185\">RESET<\/text>\n  <text x=\"345\" y=\"142\">芯片复位引脚<\/text><text x=\"300\" y=\"210\">Vc 从 0V 慢慢上升<\/text>\n  <text x=\"235\" y=\"278\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 3-6 RC 复位延时\n\n**原理**：上电瞬间电容为 0V，复位引脚被拉低（复位有效）；电容通过 R 充电，电压上升；超过芯片复位阈值后，复位释放，芯片启动。\n\n充电公式：\n\n```text\nVc(t) = Vcc × (1 − e^(−t/τ))\n```\n\n求达到阈值 `Vth` 的时间：\n\n```text\nt = −τ × ln(1 − Vth/Vcc)\n```\n\n例子：`R=10kΩ`，`C=10μF`，`τ=0.1s`；`Vcc=3.3V`，`Vth=1.6V`：\n\n```text\nt = −0.1 × ln(1 − 1.6/3.3)\n  = −0.1 × ln(0.515)\n  ≈ 0.066s = 66ms\n```\n\n**实际注意**：\n\n- 电源不是理想阶跃，上升时间、掉电、反复上电都会影响；\n- 复位阈值有容差，温度/批次不同；\n- 电容漏电、复位引脚内部电流会改变曲线；\n- 高可靠设计用专用复位监控芯片（voltage supervisor），不要只靠 RC。\n\n### 3.5 选型与降额\n\n#### 3.5.1 按功能选类型\n\n| 功能 | 首选 | 备选 | 避免 |\n|---|---|---|---|\n| 芯片高频去耦 | 100nF X7R/X5R 0402/0603 | 1μF X7R | 电解（ESR/ESL 大） |\n| 电源 bulk 储能 | 10～100μF 电解/聚合物 | 10μF MLCC | Y5V、耐压不足 |\n| 精密定时/滤波 | C0G/NP0 | 薄膜 | Y5V、X5R 大容值 |\n| 音频耦合 | 薄膜/电解（按极性） | C0G | 高-K MLCC（压电效应） |\n| 高频滤波/谐振 | C0G/NP0、低 ESL | 薄膜 | 长引脚电解 |\n| 高压/脉冲 | 薄膜/专用脉冲电容 | C0G | 普通电解 |\n| 紧凑大容量 | 钽/聚合物/高容 MLCC | 电解 | 过压/反接 |\n\n#### 3.5.2 电压降额参考\n\n| 类型 | 建议工作电压/额定电压 | 说明 |\n|---|---|---|\n| MLCC | ≤50%～80% | 高压/高可靠更保守 |\n| 铝电解 | ≤80%（长寿命 ≤50%～70%） | 纹波/温度也影响 |\n| 钽电容 | ≤50% | 过压/浪涌敏感 |\n| 薄膜 | 按厂家 DC/AC/脉冲曲线 | 不能只看 DC 额定 |\n| 超级电容 | 按单体电压/均衡设计 | 过压会显著缩短寿命 |\n\n#### 3.5.3 DC 偏压：标称 10μF 可能只剩 4μF\n\n高容 MLCC 的容值随直流偏压下降。选型步骤：\n\n1. 确定实际工作电压（不是电源标称，而是电容两端最大电压）；\n2. 查厂家“capacitance vs DC bias”曲线；\n3. 按最小有效容值核算；\n4. 不够就换更大封装/更高耐压/更大标称值；\n5. 不能拿标称值直接代入 LDO 稳定性/滤波计算。\n\n例子：某 LDO 要求输出电容在实际条件下 ≥4.7μF。某 10μF/16V 0603 X5R 在 10V 偏压、−40℃ 时只剩 4.0μF，就不满足；应换 0805/1206、更高耐压或聚合物电容，并重新核对 ESR/稳定性。\n\n#### 3.5.4 ESR 与纹波\n\n开关电源输出电容的纹波电压近似：\n\n```text\nVripple ≈ ΔI × ESR + ΔI / (8 × f × C)\n```\n\n- `ΔI`：电感电流纹波/负载瞬变；\n- `ESR`：电容等效串联电阻；\n- `f`：开关频率；\n- `C`：有效电容。\n\n大电流/低电压输出（比如 1.2V/5A）对 ESR 很敏感。电解电容 ESR 较大，可能需要并联多个或改用聚合物/MLCC。\n\n#### 3.5.5 寿命与温度\n\n铝电解的寿命与温度强相关。常见估算：温度每升高 10℃，寿命约减半（具体看厂家公式）。例如 105℃/2000h 的电容，在 85℃ 下理论寿命约 8000h（仅示意，实际按手册）。\n\n选型要：\n\n- 选 105℃ 而不是 85℃（如果环境热）；\n- 查额定纹波电流，实际纹波不要超；\n- 远离热源，留散热空间；\n- 长寿命产品选固态/聚合物/薄膜。\n\n#### 3.5.6 机械应力与音频效应\n\nMLCC 是陶瓷体，受板子弯曲、热冲击、螺钉挤压可能产生裂纹，导致短路/漏电。布局时：\n\n- 不要放在板边、连接器受力区、螺钉孔附近；\n- 大尺寸 MLCC 避免靠近拼板 V-cut；\n- 手工焊接不要过度弯折；\n- 高可靠场景用软端电极（soft termination）。\n\n高-K MLCC 有压电效应：电压变化会让陶瓷微小形变，振动也会产生电压。音频/高精度模拟附近可能听到“咔嗒”声或引入噪声，敏感场合用 C0G/薄膜。\n\n#### 3.5.7 具体料号示例\n\n| 用途 | 示例料号 | 关键参数 | 注意 |\n|---|---|---|---|\n| 100nF 去耦 | Murata GRM188R71H104KA93D | 100nF, 50V, X7R, 0603 | 通用 |\n| 100nF 去耦 | Yageo CC0603KRX7R9BB104 | 100nF, 50V, X7R, 0603 | 替代 |\n| 10μF  bulk | Murata GRM21BR61C106KE15L | 10μF, 16V, X5R, 0805 | 查 DC 偏压 |\n| 10μF  bulk | Samsung CL21A106KOQNNNE | 10μF, 16V, X5R, 0805 | 替代 |\n| 100μF 电解 | Panasonic EEU-FR1E101 | 100μF, 25V, 低 ESR | 查纹波/寿命 |\n| 1μF 精密 | Kemet C1206C105J5GACTU | 1μF, 50V, C0G, 1206 | 稳定但体积大 |\n\n料号仅为示例，采购前核对最新手册、封装、耐压、介质和供货。\n\n### 3.6 测量与仿真\n\n#### 3.6.1 万用表测电容\n\n**步骤**：\n\n1. **断电**，等电容放电（大电容用电阻放电）。\n2. 拆下电容，或至少拆开一端，避免板上并联路径影响。\n3. 万用表打到电容档（如果有），选择合适量程。\n4. 表笔接触电容两端，等待读数稳定。\n5. 与标称值/容差比较。\n\n**在板测量为什么会偏大**：\n\n电容在板上通常与多个电容并联（比如电源轨上有很多 100nF + 10μF）。万用表读到的是总电容，不是单个电容。比如测一个 100nF，旁边还有 10μF，读数会接近 10.1μF。\n\n排查顺序：\n\n1. 看原理图，确认并联电容；\n2. 拆一端复测；\n3. 如果读数仍不对，再怀疑电容本身；\n4. 电解电容可能已失效（开路/短路/容量下降/ESR 变大），万用表电容档不一定能判断 ESR。\n\n**注意**：\n\n- 电容档测试频率/电压很低，不能反映工作条件下的有效容值；\n- 大电容测试需要时间；\n- 有极性电容反接测试可能损坏；\n- 带电测电容可能损坏表。\n\n#### 3.6.2 LCR 表与 ESR 表\n\n**LCR 表**可以测电感 L、电容 C、电阻 R，通常可设测试频率、测试电压/电流、偏压。\n\n- 测电容时，测试频率要接近实际工作频率；电解电容在不同频率下容值/ESR 不同。\n- 测 MLCC 的 DC 偏压特性，需要偏压夹具，在施加直流电压的同时测小信号电容。\n- 测 ESR 要用 ESR 表或 LCR 表的 ESR 模式，普通电容档测不出来。\n\n**ESR 表**：专门测电解电容的等效串联电阻，判断电容是否老化/干涸。开关电源不启动、输出纹波大，ESR 变大是常见原因。\n\n#### 3.6.3 仿真任务\n\n- [RC 充放电](#/sim/rc-charge)：观察 1τ/3τ/5τ 的电压比例。\n- [RC 低通 159Hz](#/sim/rc-lowpass-159)：观察不同频率的衰减。\n- [电容基本特性](#/sim/capac)：观察充放电电流。\n- [模拟 RC 低通](#/sim/analog-rc-lowpass)：观察正弦波/方波的滤波效果。\n\n仿真记录表：\n\n| 项目 | 预测 | 仿真 | 差异原因 |\n|---|---|---|---|\n| 10k+100μF 的 τ | 1s |  |  |\n| 1k+100nF 的 τ | 0.1ms |  |  |\n| 1k+100nF 的 fc | 1.59kHz |  |  |\n| 1μF+10k 的 fc | 15.9Hz |  |  |\n| 5V 充电 1τ | 3.16V |  |  |\n\n#### 3.6.4 本章动手任务\n\n- [ ] 用万用表电容档测一个 100nF 和一个 10μF，记录标称、实测、容差。\n- [ ] 搭 10kΩ+100μF RC 充电电路，用示波器/万用表记录 1τ、3τ、5τ 的电压。\n- [ ] 搭 1kΩ+100nF 低通，输入 1kHz/10kHz 方波，观察输出边沿/幅度变化。\n- [ ] 在芯片电源脚旁找一颗 100nF，观察它的位置、过孔、回流路径。\n- [ ] 用 ESR 表（或 LCR 表）测一个旧电解电容，和新电容对比 ESR。\n- [ ] 查一颗 10μF MLCC 的 DC bias 曲线，记录 5V 偏压下的有效容值。\n\n### 3.7 常见坑\n\n#### 坑 1：电解/钽电容接反\n\n**现象**：上电后电容发热、鼓包、漏液、冒烟，甚至起火。\n**原因**：极性接反，或丝印/封装方向搞错。\n**排查顺序**：\n\n1. 断电，核对电容正负极和 PCB 丝印；\n2. 查厂家标记规则（铝电解色带通常负极，钽电容色带通常正极，但不绝对）；\n3. 换新电容，确认无误再上电；\n4. 上电用限流电源，观察电流/温度。\n\n#### 坑 2：耐压贴着额定值用\n\n**现象**：电容寿命短、漏电大、击穿短路。\n**原因**：工作电压接近/超过额定，或忽略浪涌/瞬态。\n**排查顺序**：\n\n1. 算电容两端最大电压（含浪涌）；\n2. 按类型降额（MLCC 50%～80%，电解 ≤80%，钽 ≤50%）；\n3. 换更高耐压/更大封装；\n4. 加 TVS/钳位。\n\n#### 坑 3：忽略 MLCC 的 DC 偏压\n\n**现象**：标称 10μF，实际滤波效果像 4μF；LDO 振荡、纹波大。\n**原因**：高-K MLCC 在直流偏压下有效容值大幅下降。\n**排查顺序**：\n\n1. 查 DC bias 曲线；\n2. 按实际工作电压/温度算最小有效容值；\n3. 换更大封装/更高耐压/更大标称；\n4. 用聚合物/电解补足。\n\n#### 坑 4：忽略 ESR 和纹波电流\n\n**现象**：电解电容发热、鼓包、寿命短；开关电源输出纹波大。\n**原因**：ESR 大，纹波电流在 ESR 上发热；或电容额定纹波不够。\n**排查顺序**：\n\n1. 查 ESR/纹波电流规格；\n2. 算 `Iripple²×ESR`；\n3. 选低 ESR/高纹波/105℃ 型号；\n4. 并联多个或改聚合物/MLCC。\n\n#### 坑 5：用 Y5V 做定时/滤波\n\n**现象**：定时时间随温度/电压大幅变化，滤波截止频率漂移。\n**原因**：Y5V 容值稳定性差（+22/−82%），随温度/偏压变化大。\n**排查顺序**：\n\n1. 查介质类型；\n2. 定时/精密滤波换 C0G/NP0；\n3. 一般去耦可用 X7R/X5R；\n4. 不要只看标称容值。\n\n#### 坑 6：在板测电容读数偏大\n\n**现象**：测 100nF 读到 10μF。\n**原因**：板上并联了其他电容。\n**排查顺序**：\n\n1. 看原理图，找并联电容；\n2. 拆一端复测；\n3. 不要直接换电容；\n4. 用 LCR 表在特定频率测。\n\n#### 坑 7：去耦电容放太远\n\n**现象**：芯片高频噪声大、电源抖动、偶尔死机；加电容也没用。\n**原因**：电容到引脚/地的走线太长，ESL 大，高频电流供不上。\n**排查顺序**：\n\n1. 看布局：电容是否紧贴电源脚；\n2. 过孔是否靠近焊盘；\n3. 回流路径是否完整；\n4. 按芯片手册调整容值/数量/位置。\n\n#### 坑 8：耦合电容太小\n\n**现象**：音频低频不足、信号低频段衰减大。\n**原因**：高通截止频率太高，`fc=1/(2πRC)` 与输入阻抗不匹配。\n**排查顺序**：\n\n1. 确认后级输入阻抗；\n2. 算 fc；\n3. 加大电容或调整偏置电阻；\n4. 注意极性/耐压。\n\n#### 坑 9：RC 滤波器带重负载\n\n**现象**：空载截止频率正常，接负载后输出幅度下降、fc 偏移。\n**原因**：负载与电容并联/分流，等效 R/C 变了。\n**排查顺序**：\n\n1. 算负载等效阻抗；\n2. 加缓冲/运放；\n3. 降低 R 或增大 C（但功耗/响应变差）；\n4. 重新仿真。\n\n#### 坑 10：大电容断电后存电\n\n**现象**：断电后触碰板子被电到，或短路打火。\n**原因**：大电容储存能量，断电后仍保持电压。\n**排查顺序**：\n\n1. 断电后等待；\n2. 用合适电阻放电（不要螺丝刀直接短路）；\n3. 测电压确认接近 0V；\n4. 再操作。\n\n### 3.8 本章复盘\n\n#### 3.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| `Q=CV` | 电荷/电压/容值关系 | 理想电容 |\n| `I=C×dU/dt` | 充放电电流 | 电压变化率 |\n| `E=½CU²` | 储能 | 理想电容 |\n| `τ=RC` | 时间常数 | Ω×F=秒 |\n| `Vc=Vfinal+(Vinitial−Vfinal)e^(−t/τ)` | 充放电 | 一阶 RC |\n| `1τ=63.2%`，`3τ=95%`，`5τ=99.3%` | 进度 | 理想阶跃 |\n| `fc=1/(2πRC)` | RC 低通/高通截止 | 一阶 |\n| `Xc=1/(2πfC)` | 容抗 | 频率越高，容抗越小 |\n| `C_parallel=C1+C2+…` | 并联 | 电压相同 |\n| `1/C_series=1/C1+1/C2+…` | 串联 | 电荷相同 |\n| `t=−τln(1−Vth/Vcc)` | RC 延时 | 理想阶跃、固定阈值 |\n| `Vripple≈ΔI×ESR+ΔI/(8fC)` | 输出纹波估算 | 开关电源近似 |\n\n#### 3.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 电容 | capacitance | 储存电荷的能力，单位 F |\n| 电容器 | capacitor | 两块导体夹绝缘介质的两端元件 |\n| 介质 | dielectric | 极板之间的绝缘材料 |\n| 容抗 | capacitive reactance | 电容对交流的阻碍，`1/(2πfC)` |\n| 时间常数 | time constant τ | RC 充放电快慢的尺度，`τ=RC` |\n| 去耦 | decoupling | 就近提供瞬态电流、降低电源阻抗 |\n| 旁路 | bypass | 把高频噪声旁路到地 |\n| 耦合 | coupling | 用电容连接两级，隔直通交 |\n| 滤波 | filtering | 按频率选择性通过/衰减 |\n| 截止频率 | cutoff frequency | 幅值下降到 −3dB 的频率 |\n| ESR | equivalent series resistance | 等效串联电阻 |\n| ESL | equivalent series inductance | 等效串联电感 |\n| 自谐振 | self-resonance | 容抗/感抗抵消的频率 |\n| 漏电流 | leakage current | 电容实际存在的微小直流电流 |\n| MLCC | multilayer ceramic capacitor | 多层陶瓷电容 |\n| C0G/NP0 | — | 极稳定的陶瓷介质 |\n| X7R | — | 较稳定的高容陶瓷介质 |\n| X5R | — | 温度范围较窄的高容介质 |\n| Y5V | — | 容值稳定性差的廉价介质 |\n| DC 偏压 | DC bias | 直流电压导致 MLCC 有效容值下降 |\n| 纹波电流 | ripple current | 流过电容的交流电流分量 |\n| 聚合物电容 | polymer capacitor | 低 ESR、无液体的电容类型 |\n\n#### 3.8.3 自测\n\n1. `100nF` 等于多少 `μF`？`104` 是多少？\n2. 10kΩ+100μF 的 τ 是多少？1τ 时电压到多少（5V 充电）？\n3. 1kΩ+100nF 的 τ 和低通 fc 各是多少？\n4. 1μF+10kΩ 的高通 fc 是多少？\n5. 去耦电容为什么必须靠近芯片电源脚？\n6. 10μF X5R 在 5V 偏压下可能只剩多少？选型要看什么曲线？\n7. 电解电容和钽电容的降额建议是多少？\n8. RC 复位 10kΩ+10μF，Vcc=3.3V，Vth=1.6V，延时约多少？\n9. 在板测 100nF 读到 10μF，最可能的原因是什么？\n10. 大电容断电后为什么不能直接用手碰？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `100nF=0.1μF`；`104=100nF`。\n2. `τ=10000×100e-6=1s`；1τ 约 `5×0.632=3.16V`。\n3. `τ=1000×100e-9=0.1ms`；`fc≈1.59kHz`。\n4. `fc≈15.9Hz`。\n5. 走线有电感，放远了高频瞬态电流供不上；电容—引脚—地回路要短。\n6. 可能只剩 4～6μF 甚至更低；要看“capacitance vs DC bias”曲线，按实际电压/温度算最小有效容值。\n7. 电解建议 ≤80%（长寿命 ≤50%～70%）；钽建议 ≤50%。\n8. `τ=0.1s`；`t≈−0.1×ln(1−1.6/3.3)≈66ms`。\n9. 板上并联了其他电容，读数是被测电容与并联电容之和；拆一端复测。\n10. 大电容储存能量，断电后仍可能保持高压；应等待并用电阻放电，确认接近 0V。\n\n<\/details>\n\n#### 3.8.4 本章能力清单\n\n- [ ] 能算 RC 时间常数和 1τ/3τ/5τ 电压。\n- [ ] 能画充电曲线，解释电容电压不能突变。\n- [ ] 能解释去耦电容的作用和布局要求。\n- [ ] 能算 RC 低通/高通截止频率。\n- [ ] 能区分 C0G、X7R、X5R、Y5V、电解、薄膜、钽。\n- [ ] 能查耐压、ESR、DC 偏压、纹波电流。\n- [ ] 能正确测电容，解释在板测量偏大。\n- [ ] 能说出至少 8 个电容坑。\n\n#### 3.8.5 下一章\n\n下一章进入**电感**。电容怕电压突变，电感怕电流突变；电容存电场，电感存磁场。第 04 章会从 `U=L×di/dt` 开始，讲清续流、反电动势、饱和、DCR、Buck 电路和变压器原理。电感是电源、电机、EMI 滤波的核心，也是新手最容易“炸管”的地方。","taskSignature":"35b889abe471e08482083c1577fb92d59f1dafc11496540a6f64b9a46468fcc1","taskCount":14},{"id":"04","title":"第 04 章 · 电感","short":"电感","stage":1,"diff":3,"prev":"第 01 章 基础概念、第 02 章 电阻、第 03 章 电容","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用“飞轮”解释电感为什么阻碍电流变化，并写出 `U=L×di/dt`。\n2. 分清电感量、饱和电流、温升电流、DCR、自谐振频率。\n3. 解释继电器/电磁阀断电时为什么需要续流二极管，并选对方向。\n4. 看懂 Buck 电路里电感、开关、二极管、电容各自的角色，算电流纹波。\n5. 算 LC 低通截止频率，理解电感的“通直流、阻高频”。\n6. 解释变压器匝比、极性、隔离，知道它为什么不能传直流。\n7. 用 LCR 表/DCR 表测电感，知道在板测量和饱和测试的注意点。\n8. 说出至少 8 个电感常见坑，并给出排查顺序。\n\n电感是“电流的飞轮”。电容怕电压突变，电感怕电流突变；电容存电场，电感存磁场。电源、电机、继电器、EMI 滤波、无线充电、变压器，核心都离不开电感。它也是新手最容易“炸管”的元件：续流没做、饱和没算、DCR 没看，开关管就可能被高压或过流打死。\n\n## 本章图例索引\n\n- 图 4-1 电感原理图符号\n- 图 4-2 磁芯饱和曲线（示意）\n- 图 4-3 继电器线圈续流\n- 图 4-4 Buck 降压电路\n- 图 4-5 电感电流波形（连续导通）\n- 图 4-6 LC 低通滤波\n- 图 4-7 变压器匝比与极性\n\n## 正文\n\n### 4.1 它解决什么问题：三个真实场景\n\n#### 场景一：继电器断电，驱动三极管被“莫名其妙”打坏\n\n继电器线圈是电感。通电时，线圈里建立磁场，储存能量；断电时，电流想瞬间归零，但电感反对电流变化，线圈两端会产生很高的感应电压。这个电压可能几十伏、几百伏，甚至上千伏，足以击穿驱动三极管/MOS 管。\n\n加一个续流二极管，给电流留一条“逃生通道”，开关管就不会承受高压。这是电感最典型的“坑”。\n\n#### 场景二：12V 降到 5V，为什么中间要一个大电感\n\n线性稳压器（LDO）像“可变电阻”，压差大时效率低、发热大。Buck 开关电源用开关+电感+电容，把能量“打包”传递：开关导通时电感储能，开关关断时电感通过二极管/同步管释放能量。电感是能量转移的核心。\n\n#### 场景三：电源入口的干扰，怎么被“堵”住\n\n电源线上有高频噪声，串一个电感/磁珠，高频阻抗大，噪声被反射/吸收；直流几乎能通过。LC 滤波器就是低通：低频/直流过，高频被挡。\n\n这三个场景对应电感的三个角色：**储能/续流、能量转移、滤波/抗干扰**。\n\n### 4.2 它是什么：电流的飞轮\n\n#### 4.2.1 生活类比：重型飞轮\n\n想象一个很重的飞轮：\n\n- 想让静止的飞轮转起来，要费很大劲，还得花时间；\n- 想让转动的飞轮停下来，也要费很大劲，不能瞬间刹死；\n- 飞轮越重（电感量 L 越大），越“固执”。\n\n电感对电流就是这样：**电流想变大，它往下压；电流想变小，它往上托。** 一句话：**电感反对电流变化**，但不是阻止电流本身。\n\n这和电容正好镜像：\n\n| | 电容 | 电感 |\n|---|---|---|\n| 存什么 | 电荷/电场 | 磁场 |\n| 类比 | 水池（水位=电压） | 飞轮（转速=电流） |\n| 不能突变 | 电压 | 电流 |\n| 直流稳态 | 开路（电流≈0） | 短路（只剩 DCR） |\n| 高频 | 容抗小，越通 | 感抗大，越堵 |\n\n#### 4.2.2 物理直觉：磁场存能量\n\n电感通常由导线绕成线圈，可能带磁芯。电流流过线圈，周围建立磁场，能量储存在磁场里。\n\n基本关系：\n\n```text\nU = L × di/dt\n```\n\n- `U`：电感两端电压，单位伏（V）\n- `L`：电感量，单位亨利（H）\n- `di/dt`：电流变化率，单位 A/s\n\n`1H = 1V·s/A`：电感两端加 1V，电流每秒变化 1A，电感量就是 1H。实际常用 `μH`、`mH`：\n\n- `1H = 1000mH`\n- `1mH = 1000μH`\n\n电感储存的能量：\n\n```text\nE = ½ × L × I²\n```\n\n例子：100μH、1A，储能 `0.5 × 100e-6 × 1 = 50μJ`。不大，但释放很快时功率很高。\n\n**关键直觉**：\n\n- 电感电流不能突变，但电压可以突变。\n- 刚接通瞬间，电感像开路（电流为 0），电压加在电感上，电流慢慢上升。\n- 稳定直流时，理想电感像短路（电压为 0），真实电感只剩 DCR 压降。\n- 电流变化越快，感应电压越大；断开电流时 `di/dt` 很大，所以尖峰很高。\n\n#### 4.2.3 电感量由什么决定\n\n电感量与线圈匝数、磁芯材料、截面积、磁路长度有关。定性地说：\n\n- 匝数越多，电感量越大；\n- 磁芯磁导率越高，电感量越大；\n- 截面积越大、磁路越短，电感量越大；\n- 有磁芯比空芯电感量大得多，但磁芯会饱和。\n\n精确公式涉及磁路，不需要现在推导。选型时直接看厂家给出的 `L`、`Isat`、`Irms`、`DCR`。\n\n#### 4.2.4 磁芯饱和：电感最危险的边界\n\n磁芯能导磁，但有限度。电流越大，磁场越强；到一定程度，磁芯进入**饱和**（saturation），磁导率急剧下降，电感量骤降，电流会快速上升。\n\n饱和后：\n\n- 电感不再是“飞轮”，更像一根导线；\n- 电流尖峰可能烧开关管、二极管、电感自身；\n- 噪声、效率、温升都会恶化。\n\n厂家用 **Isat**（饱和电流）描述这个边界，通常定义为“电感量下降到初始值的某个百分比（比如 10%～30%）时的电流”。不同厂家定义不同，必须看手册条件。\n\n**Isat 不是“平均电流上限”**，而是**峰值电流**边界。Buck 电路要算最坏峰值（最大负载、最小电感、最高输入、启动/短路），并留余量。\n\n\n#### 4.2.5 原理图符号\n\n电感符号是连续半圆/线圈，位号 `L1`。有些符号带磁芯线（两条平行线）或屏蔽标记。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 175\" width=\"480\" height=\"175\" role=\"img\" aria-label=\"电感符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 90 H75 A15 15 0 0 1 105 90 A15 15 0 0 1 135 90 A15 15 0 0 1 165 90 A15 15 0 0 1 195 90 H250\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"50\" y=\"45\">电感符号<\/text><text x=\"30\" y=\"145\">图形表示线圈；实际电感还具有电阻和寄生参数。<\/text><\/g><\/svg>\n```\n\n图 4-1 电感原理图符号\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 300\" role=\"img\" aria-label=\"磁芯饱和曲线：电流增大到一定程度后磁通不再线性增长\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M70 250 H480\"/><path d=\"M70 250 V40\"/>\n  <path d=\"M70 250 C120 250 170 210 220 150 C270 90 310 70 360 62 C410 55 450 53 480 52\"/>\n  <path d=\"M300 250 V70\" stroke-dasharray=\"6 4\"/>\n  <path d=\"M300 250 H70\" stroke-dasharray=\"6 4\"/>\n  <circle cx=\"300\" cy=\"70\" r=\"4\" fill=\"currentColor\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"470\" y=\"275\">H（电流）<\/text><text x=\"40\" y=\"45\">B（磁通）<\/text>\n  <text x=\"90\" y=\"230\">线性区：L 基本稳定<\/text>\n  <text x=\"320\" y=\"95\">饱和区：L 骤降，电流快速上升<\/text>\n  <text x=\"306\" y=\"270\">Isat<\/text>\n  <text x=\"150\" y=\"285\">拐点附近就是选型要留余量的地方<\/text>\n<\/g><\/svg>\n```\n\n图 4-2 磁芯饱和曲线（示意）\n\n\n电感一般无极性（两端可互换），但以下情况要注意方向：\n\n- 共模电感/变压器有绕组极性和同名端；\n- 有些功率电感有“屏蔽/非屏蔽”结构，引脚方向不影响电气，但布局有讲究；\n- 耦合电感/变压器不能随意反接，否则相位/输出可能相反。\n\n### 4.3 关键参数与数据手册\n\n#### 4.3.1 电感量 L 与容差\n\n**电感量**决定储能和纹波。容差常见 `±10%`、`±20%`、`±30%`。电感的容差通常比电阻大，因为磁芯/绕制工艺离散。\n\n电感量随电流、温度、频率变化：\n\n- 电流接近饱和，L 下降；\n- 温度变化，磁芯特性变化；\n- 测试频率不同，L 读数不同。\n\n所以手册会标测试条件（比如 100kHz、0.1V、无直流偏置）。实际工作点下的 L 可能明显低于标称。\n\n#### 4.3.2 饱和电流 Isat\n\n**Isat**（saturation current）：电感量下降到规定比例时的直流电流。常见定义：\n\n- L 下降 10%；\n- L 下降 20%；\n- L 下降 30%。\n\n不同厂家/系列定义不同，不能直接比较数字。选型要：\n\n1. 算电路最坏峰值电流 `Ipeak,max`；\n2. 查 Isat 的定义和温度条件；\n3. 留 20%～50% 余量（具体看应用）；\n4. 启动、短路、瞬态要单独核算。\n\n#### 4.3.3 温升电流 Irms\n\n**Irms**（RMS current / temperature rise current）：在规定温升（比如 40℃）下的允许有效电流。它主要受 DCR 和散热限制，和 Isat 不是一回事。\n\n- Isat 管“磁芯饱和”，看峰值；\n- Irms 管“发热”，看有效值/热设计。\n\n一个电感可能 Isat 很高但 Irms 很低（DCR 大、散热差），也可能反过来。两个都要满足。\n\n#### 4.3.4 DCR：直流电阻\n\n**DCR**（DC resistance）：绕线铜的直流电阻。它导致：\n\n- 直流压降 `U=I×DCR`；\n- 铜损 `P=I²×DCR`；\n- 发热、效率下降。\n\n例子：DCR=0.1Ω，电流 1A，铜损 0.1W；电流 3A，铜损 0.9W。大电流电感必须选低 DCR。\n\nDCR 随温度升高而增大（铜的正温度系数，约 +0.4%/℃），热设计要留余量。\n\n#### 4.3.5 自谐振频率 SRF\n\n电感绕组之间有寄生电容，频率高到一定程度，电感与寄生电容谐振，阻抗不再随频率上升。这个频率叫 **SRF**（self-resonant frequency）。\n\n- 低于 SRF：电感行为；\n- 接近 SRF：阻抗峰/谷，可能谐振；\n- 高于 SRF：电容行为，滤波/储能失效。\n\n开关电源的开关频率、EMI 滤波的最高频率要远低于 SRF；射频电感则要选 SRF 足够高的型号。\n\n#### 4.3.6 Q 值与损耗\n\n**Q 值**（quality factor）是电感在某个频率下的“品质因数”：\n\n```text\nQ = XL / R_total = 2πfL / R_total\n```\n\nQ 越高，损耗越小，谐振/滤波选择性越好。功率电感更关心 DCR 和磁芯损耗，射频电感更关心 Q。\n\n#### 4.3.7 磁芯材料与损耗\n\n常见磁芯：\n\n- **铁氧体**（ferrite）：高频损耗小，但饱和磁通密度较低；常用于开关电源、EMI。\n- **铁粉芯/合金粉芯**：饱和磁通高、软饱和，适合大电流储能；损耗比铁氧体大。\n- **坡莫合金**：高磁导率，敏感/精密场合。\n- **空芯**：无饱和，但电感量小、磁场开放。\n\n磁芯损耗包括磁滞损耗和涡流损耗，随频率、磁通摆幅、温度变化。开关电源电感要查“core loss vs frequency/flux”曲线。\n\n#### 4.3.8 屏蔽与磁场耦合\n\n- **屏蔽电感**：磁芯/外壳约束磁场，减少对周围的干扰；不代表完全无漏磁。\n- **非屏蔽电感**：磁场开放，便宜、体积小，但可能干扰邻近敏感电路，也容易被外部磁场影响。\n- 布局时让电感远离高增益模拟、晶振、天线、敏感信号；必要时正交放置，减少耦合。\n\n#### 4.3.9 数据手册速查表\n\n| 参数 | 英文 | 为什么重要 | 典型条件 |\n|---|---|---|---|\n| 电感量 | inductance | 储能/纹波/滤波 | 100kHz、无偏置 |\n| 容差 | tolerance | 最坏纹波/饱和 | ±10%/±20% |\n| 饱和电流 | Isat | 磁芯饱和 | L 下降 10%/20%/30% |\n| 温升电流 | Irms | 发热/散热 | 温升 40℃ |\n| DCR | DC resistance | 压降/铜损 | 25℃ |\n| SRF | self-resonant frequency | 高频失效 | 阻抗曲线 |\n| Q | quality factor | 损耗/选择性 | 指定频率 |\n| 磁芯材料 | core material | 饱和/损耗 | 铁氧体/粉末芯 |\n| 屏蔽 | shielded | 磁场耦合 | 有/无 |\n| 工作温度 | operating temperature | 环境限制 | −40～+125℃ |\n\n**读手册第一原则**：Isat、Irms、L 都有测试条件；不要拿“3A”一个数字就以为所有条件都 3A。\n\n#### 4.3.10 选型顺序\n\n1. **定功能**：储能（Buck/Boost）、滤波、续流、EMI、谐振。\n2. **算电感量**：按开关频率、纹波、负载。\n3. **算最坏峰值/有效电流**：负载、输入、启动、短路。\n4. **选 Isat/Irms**：都留余量。\n5. **查 DCR**：铜损/压降/发热。\n6. **查 SRF**：开关频率/滤波频段。\n7. **定屏蔽/尺寸/高度**。\n8. **写完整料号**。\n\n### 4.4 三个典型电路\n\n#### 4.4.1 电路一：继电器/电磁阀续流\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 320\" role=\"img\" aria-label=\"继电器线圈两端并联续流二极管，二极管阴极接电源正端\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M240 25 V65\"/><path d=\"M240 65 H240\"/>\n  <path d=\"M240 70 A10 10 0 0 1 240 90 A10 10 0 0 1 240 110 A10 10 0 0 1 240 130 A10 10 0 0 1 240 150\"/>\n  <path d=\"M240 150 V175\"/><circle cx=\"240\" cy=\"175\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M240 175 V210 M240 220 L268 200 M240 220 V255\"/>\n  <path d=\"M240 255 H300 M288 255 V270 M276 270 H300 M280 278 H296 M284 286 H292\"/>\n  <path d=\"M240 70 H380\"/><path d=\"M380 70 V120\"/><path d=\"M365 120 H395\"/><path d=\"M365 145 L395 145 L380 120 Z\"/><path d=\"M380 145 V175\"/>\n  <path d=\"M240 175 H380\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"228\" y=\"18\">+5V（电源正端）<\/text><text x=\"225\" y=\"105\" text-anchor=\"end\">继电器线圈 L<\/text>\n  <text x=\"408\" y=\"105\">续流二极管 D1<\/text><text x=\"200\" y=\"225\">开关<\/text>\n  <text x=\"310\" y=\"292\">GND<\/text><text x=\"200\" y=\"190\">SW<\/text>\n<\/g><\/svg>\n```\n\n```circuitjs\ninductkick\n```\n\n```circuitjs\ninductkick-snub\n```\n\n图 4-3 继电器线圈续流\n\n**开关导通时**：\n\n- 电流从 +5V 经线圈、开关管到 GND；\n- 线圈电流上升，磁场建立；\n- 二极管反偏（阴极接 +5V，阳极为低），不导通。\n\n**开关关断时**：\n\n- 线圈电流想瞬间归零，电感产生感应电压，SW 点电压迅速上升；\n- 当 SW 点高于 +5V + Vf 时，二极管正向导通；\n- 电流路径：线圈 → 二极管 → 线圈，形成局部回路，能量在线圈电阻/二极管上耗散；\n- SW 点被钳位在约 `+5V + Vf`，开关管承受约 `5V + Vf`，而不是几千伏。\n\n**不加续流会怎样**：\n\n假设线圈 `L=100mH`，电流 `I=50mA`，开关在 `1μs` 内关断。近似：\n\n```text\nU = L × ΔI/Δt = 0.1H × 0.05A / 1e-6s = 5000V\n```\n\n当然，实际有寄生电容、二极管/开关的雪崩、电弧等限制，不会真的到 5000V；但几十伏到几百伏的尖峰足以损坏三极管/MOS。这个算例是为了说明“di/dt 越大，感应电压越高”。\n\n**二极管选型**：\n\n- 反向耐压 `Vr` > 电源电压 + 余量（至少 1.5～2 倍）；\n- 正向电流 `If` ≥ 线圈电流（稳态）；\n- 反向恢复/速度：小继电器用 1N4148，大电流用 1N4007/肖特基；高频/快速关断选快恢复。\n- 方向绝对不能反：阴极接电源正，阳极接开关节点。反了会在开关导通时把电源短路。\n\n**释放时间**：\n\n二极管续流时，电流按 `τ=L/Rcoil` 衰减。`L=100mH`、`Rcoil=100Ω`，τ=1ms；约 3～5τ（3～5ms）释放。若要更快释放，可串稳压管/电阻，但会增加开关承受电压，需要核算。\n\n#### 4.4.2 电路二：Buck 降压\n\n```svg\n<svg role=\"img\" aria-label=\"Buck开关电源功率级示意图\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"173.03999999999996pt\" width=\"356.44399999999996pt\" viewBox=\"-28.516 -181.39999999999998 356.44399999999996 173.03999999999996\"><path d=\"M 126 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 135 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 144 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 153 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><polygon points=\"99,-83.7 108,-96.3 117,-83.7 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-144.0 L 18,-144 L 36,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-144.0 L 54,-144 M 62.64,-147.6 L 82.8,-160.2 M 90,-144 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-144.0 L 126,-144 M 162,-144 L 180,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-83.7 M 99,-96.3 L 117,-96.3 M 108,-96.3 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 180,-36 L 252,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-21.6 L 99,-21.6 L 117,-21.6 M 101.7,-17.28 L 114.3,-17.28 M 106.2,-12.96 L 109.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 180.0,-144.0 L 180,-93.24 M 189,-93.24 L 171,-93.24 M 189,-86.76 L 171,-86.76 M 180,-86.76 L 180,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 180.0,-144.0 L 216,-144 L 252,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 252.0,-144.0 L 252,-108 L 261,-108 L 261,-72 L 243,-72 L 243,-108 L 252,-108 M 252,-72 L 252,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 252.0,-144.0 L 270,-144 L 288,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-14.4\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-14.4\" dy=\"13\">Vin<\/tspan><\/text><circle cx=\"58.32\" cy=\"-144\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"85.68\" cy=\"-144\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"72.0\" y=\"-176.79999999999998\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">S<\/tspan><\/text><text x=\"144.0\" y=\"-165.09997770431488\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"144.0\" dy=\"13\">L<\/tspan><\/text><text x=\"95.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.4\" dy=\"13\">D<\/tspan><\/text><text x=\"167.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"167.4\" dy=\"13\">C<\/tspan><\/text><text x=\"239.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"239.4\" dy=\"13\">负载<\/tspan><\/text><text x=\"309.59999999999997\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"309.59999999999997\" dy=\"13\">Vout<\/tspan><\/text><circle cx=\"108\" cy=\"-144\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"180\" cy=\"-144\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n```circuitjs\npower-buck\n```\n\n图 4-4 Buck 降压电路\n\n**工作过程**：\n\n1. Q1 导通：Vin 加在电感左端，电流从 Vin 经 L 到负载，电感电流上升，储能增加；D1 反偏。\n2. Q1 关断：电感电流不能突变，左端电压下降到 GND 以下，D1 导通续流；电感电流通过 D1 继续流向负载，逐渐下降。\n3. Q1 再次导通，循环。\n\n**占空比**（理想连续导通 CCM）：\n\n```text\nD = Vout / Vin\n```\n\n例子：12V→5V，D≈0.417（41.7%）。\n\n**电感电流纹波**：\n\n```text\nΔIpp = (Vin − Vout) × D / (L × f)\n     = Vin × D × (1 − D) / (L × f)\n```\n\n- `ΔIpp`：电感电流峰峰值\n- `f`：开关频率\n- `L`：电感量\n\n例子：Vin=12V，Vout=5V，f=100kHz，L=100μH：\n\n```text\nD = 5/12 = 0.4167\nΔIpp = 12 × 0.4167 × 0.5833 / (100e-6 × 100e3)\n     = 2.9167 / 10\n     ≈ 0.292A\n```\n\n**电流波形**（CCM，平均 1A）：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 280\" role=\"img\" aria-label=\"Buck电感电流三角波，平均值1安，峰值1.15安，谷值0.85安\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M70 230 H500\"/><path d=\"M70 230 V40\"/>\n  <path d=\"M70 185 L130 105 L190 185 L250 105 L310 185 L370 105 L430 185 L490 105\"/>\n  <path d=\"M70 150 H500\" stroke-dasharray=\"6 4\"/>\n  <path d=\"M70 185 H500\" stroke-dasharray=\"3 5\"/>\n  <path d=\"M70 105 H500\" stroke-dasharray=\"3 5\"/>\n  <path d=\"M70 230 V220 M130 230 V220 M190 230 V220 M250 230 V220 M310 230 V220 M370 230 V220 M430 230 V220 M490 230 V220\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"13\">\n  <text x=\"600\" y=\"255\">t<\/text><text x=\"35\" y=\"50\">I<\/text>\n  <text x=\"510\" y=\"110\">1.15A 峰值<\/text><text x=\"510\" y=\"155\">1.00A 平均<\/text><text x=\"510\" y=\"190\">0.85A 谷值<\/text>\n  <text x=\"82\" y=\"245\">D<\/text><text x=\"192\" y=\"245\">1−D<\/text>\n  <text x=\"120\" y=\"80\">ΔIpp≈0.292A<\/text>\n<\/g><\/svg>\n```\n\n图 4-5 电感电流波形（连续导通）\n\n- 平均电流 `Iavg=1A`；\n- 峰值 `Ipeak=Iavg+ΔIpp/2=1+0.146=1.146A`；\n- 谷值 `Ivalley=1−0.146=0.854A`；\n- 有效值近似 `Irms≈√(Iavg²+ΔIpp²/12)=√(1+0.0071)≈1.004A`。\n\n**选型**：\n\n- Isat 要大于最坏峰值（含启动/短路/瞬态），建议留 30% 以上余量：`Isat > 1.146×1.3≈1.5A`。\n- Irms 要大于有效电流，并考虑温升。\n- DCR 0.1Ω 时铜损 `1.004²×0.1≈0.1W`。\n- 输出电容纹波近似 `ΔV≈ΔIpp/(8fC)`；C=100μF 时 `0.292/(8×100e3×100e-6)=3.6mV`，再加 ESR 压降。\n\n**CCM 与 DCM**：\n\n- 如果平均电流小于 `ΔIpp/2`，电感电流会降到 0，进入断续模式（DCM），公式不同。\n- 轻载时很多电源会进入 DCM/跳频，属正常；但环路/纹波会变化。\n- 设计时按最坏负载算，不要只看额定。\n\n**电感量取舍**：\n\n- L 大：纹波小、峰值低、输出电容可以小；但体积大、瞬态响应慢、DCR 可能大。\n- L 小：体积小、瞬态快；但纹波大、峰值高、更容易饱和、损耗大。\n- 具体按控制器手册/稳定性要求选，不能凭感觉。\n\n**同步 Buck**：把 D1 换成 MOS 管（同步整流），效率更高；电感仍然存在，续流路径变成低边 MOS。控制死区、直通、轻载模式要注意。\n\n#### 4.4.3 电路三：LC 低通滤波\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 280\" role=\"img\" aria-label=\"LC低通滤波，10微亨电感串联，10微法电容并联\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M40 120 H100\"/>\n  <path d=\"M100 120 A14 14 0 0 1 128 120 A14 14 0 0 1 156 120 A14 14 0 0 1 184 120 A14 14 0 0 1 212 120\"/>\n  <path d=\"M212 120 H320\"/><circle cx=\"320\" cy=\"120\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M320 120 V155\"/><path d=\"M307 155 H333\"/><path d=\"M307 165 H333\"/><path d=\"M320 165 V195\"/>\n  <path d=\"M320 195 H390 M378 195 V210 M366 210 H390 M370 218 H386 M374 226 H382\"/>\n  <path d=\"M320 120 H460\"/><path d=\"M460 120 V155\"/><rect x=\"447\" y=\"155\" width=\"26\" height=\"55\"/><path d=\"M460 210 V235\"/>\n  <path d=\"M460 235 H530 M518 235 V250 M506 250 H530 M510 258 H526 M514 266 H522\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"34\" y=\"105\">Vin<\/text><text x=\"120\" y=\"95\">L 10μH<\/text>\n  <text x=\"330\" y=\"110\">Vout<\/text><text x=\"315\" y=\"185\">C 10μF<\/text>\n  <text x=\"470\" y=\"190\">负载<\/text><text x=\"260\" y=\"240\">GND<\/text>\n  <text x=\"40\" y=\"260\">fc≈15.9kHz，Z0≈1Ω<\/text>\n<\/g><\/svg>\n```\n\n图 4-6 LC 低通滤波\n\n**原理**：\n\n- 低频：`XL=2πfL` 小，电感像导线；`Xc=1/(2πfC)` 大，电容像开路；信号通过。\n- 高频：`XL` 大，电感像墙；`Xc` 小，电容像短路；高频被挡住。\n- 截止频率：\n\n```text\nfc = 1 / (2π × √(L × C))\n```\n\n例子：L=10μH，C=10μF：\n\n```text\n√(10e-6 × 10e-6) = √(1e-10) = 1e-5\nfc = 1 / (2π × 1e-5) ≈ 15915Hz ≈ 15.9kHz\n```\n\n**特征阻抗**：\n\n```text\nZ0 = √(L/C)\n```\n\n例子：`√(10e-6/10e-6)=1Ω`。Z0 影响滤波器的阻尼/匹配；源/负载阻抗不匹配时可能谐振/峰值。\n\n**LC 滤波的问题**：\n\n- 二阶滤波在 fc 附近可能有谐振峰，必要时加阻尼（电阻/磁珠/有损电容）。\n- 电感饱和、DCR、寄生电容会改变高频特性。\n- 输入/输出阻抗、负载电流会影响实际衰减。\n- 不是“加个 LC 就一定干净”，要按频段/阻抗/布局设计。\n\n**典型用途**：电源输出滤波、EMI 滤波、音频分频、射频匹配。电源入口的共模电感/磁珠是另一类，后面第 10 课展开。\n\n#### 4.4.4 电路四：变压器\n\n```svg\n<svg role=\"img\" aria-label=\"变压器初级与次级独立绕组示意\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"112.20000000000002pt\" width=\"245.0pt\" viewBox=\"-27.1 -108.30000000000001 245.0 112.20000000000002\"><path d=\"M 72 -50.4 a 7.2 7.2 0 1 1 0 14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 72 -64.8 a 7.2 7.2 0 1 1 0 14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 72 -79.2 a 7.2 7.2 0 1 1 0 14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 72 -93.6 a 7.2 7.2 0 1 1 0 14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 108 -36 a 7.2 7.2 0 1 1 0 -14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 108 -50.4 a 7.2 7.2 0 1 1 0 -14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 108 -64.8 a 7.2 7.2 0 1 1 0 -14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 108 -79.2 a 7.2 7.2 0 1 1 0 -14.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 86.39999999999999,-93.60000000000001 L 86.4,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 93.60000000000001,-93.60000000000001 L 93.6,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-93.60000000000001 L 36,-93.6 L 0,-93.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-36.0 L 36,-36 L 0,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-93.60000000000001 L 144,-93.6 L 180,-93.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 144,-36 L 180,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-10.8\" y=\"-110.2\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-10.8\" dy=\"13\">交流输入<\/tspan><\/text><text x=\"201.6\" y=\"-110.2\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"201.6\" dy=\"13\">交流输出<\/tspan><\/text><text x=\"93.60000000000001\" y=\"-20.2\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"93.60000000000001\" dy=\"13\">独立绕组：初级 / 次级<\/tspan><\/text><\/svg>\n```\n\n```circuitjs\ntransformer-basic\n```\n\n图 4-7 变压器匝比与极性\n\n**原理**：初级交流电流产生交变磁场，磁场穿过次级，感应出电压。理想变压器：\n\n```text\nV1 / V2 = N1 / N2\nI1 / I2 = N2 / N1\nP1 ≈ P2\n```\n\n例子：初级 1000 匝，次级 100 匝，输入 230V AC：\n\n```text\nV2 = 230 × 100/1000 = 23V\n```\n\n**只能传交流/变化电流**：直流电流产生的磁场不变化，次级没有感应电压。变压器不能直接稳压直流，必须先逆变/斩波。\n\n**极性/同名端**：绕组上的“点”表示同名端。同名端电压极性相同；反接会改变输出相位/极性， flyback 可能不工作。\n\n**隔离**：初级/次级没有直接电气连接，只有磁耦合。隔离电源、安全、抗共模干扰靠它。隔离要注意爬电距离、绝缘耐压、安规认证。\n\n**应用**：AC 适配器、隔离电源、flyback、推挽、阻抗匹配、信号隔离。高频变压器体积小，但磁芯损耗/漏感/寄生电容要设计。\n\n**注意**：变压器不是“电感大号”。它有匝比、极性、隔离、漏感、励磁电感等参数；不能拿一个功率电感替代。\n\n### 4.5 选型与降额\n\n#### 4.5.1 按功能选类型\n\n| 功能 | 首选 | 备选 | 避免 |\n|---|---|---|---|\n| Buck/Boost 储能 | 屏蔽功率电感、合金粉芯 | 铁氧体功率电感 | 磁珠、信号电感 |\n| 大电流储能 | 一体成型/合金粉芯 | 多相并联 | 小尺寸叠层 |\n| EMI 滤波 | 共模电感、磁珠 | LC 滤波 | 普通功率电感（可能饱和） |\n| 射频匹配 | 高 Q、高 SRF 陶瓷/空芯 | 薄膜 | 大 DCR 功率电感 |\n| 继电器续流 | 二极管（不是电感） | TVS/RC | 只靠电感 |\n| 隔离/变压 | 变压器/耦合电感 | — | 单绕组电感 |\n\n#### 4.5.2 降额参考\n\n| 参数 | 建议 | 说明 |\n|---|---|---|\n| Isat | 最坏峰值 ≤70% Isat（留 30%） | 饱和后电流失控 |\n| Irms | 实际有效 ≤80% Irms | 温升/散热 |\n| DCR | 按铜损/压降核算 | 大电流重点 |\n| 工作温度 | 留 20～30℃ 余量 | 磁芯/绝缘 |\n| SRF | 开关/滤波最高频率远低于 SRF | 高频失效 |\n| 电压 | 按绕组/绝缘耐压 | 变压器/隔离 |\n\n#### 4.5.3 Buck 电感选型清单\n\n1. 输入/输出电压范围、最大负载、开关频率；\n2. 算占空比、ΔIpp、峰值/有效电流；\n3. 选 L：纹波 20%～40% 额定电流常见（具体按控制器）；\n4. Isat > 最坏峰值 ×1.3；\n5. Irms > 实际有效，查温升曲线；\n6. DCR 铜损/压降可接受；\n7. SRF > 开关频率（至少 10 倍更稳）；\n8. 屏蔽/尺寸/高度/焊接；\n9. 启动/短路/瞬态复核；\n10. 写料号，查供货/温度/寿命。\n\n#### 4.5.4 具体料号示例\n\n| 用途 | 示例料号 | 关键参数 | 注意 |\n|---|---|---|---|\n| 10μH/3A Buck | Bourns SRR1260-100M | 10μH, 3A, 屏蔽 | 查 Isat/Irms 条件 |\n| 10μH/5A Buck | Würth 744774110 | 10μH, 5A 级 | 查 DCR/饱和 |\n| 22μH/2A Buck | Coilcraft XAL1010-223 | 22μH, 屏蔽 | 查尺寸/温升 |\n| 共模电感 | Würth 744232090 | 共模/EMI | 查频段/电流 |\n| 磁珠 | Murata BLM18PG121SN1 | 120Ω@100MHz | 不能当储能电感 |\n\n料号仅为示例，采购前核对最新手册、Isat/Irms 定义、封装和供货。\n\n## 4.6 测量与仿真\n\n### 4.6.1 测电感量：LCR 表与万用表\n\n普通万用表大多没有电感档；能测电感的是 **LCR 表** 或带电感档的专用表。测量时注意：\n\n- **测试频率**：手册标称电感量通常给测试频率（如 100kHz）。用 1kHz 测高频功率电感，读数可能差很多。\n- **测试电平**：有些 LCR 表可在特定偏置下测；功率电感在实际直流偏置下电感量会下降，静态小信号测量不能代表工作点。\n- **在板测量**：并联的绕组、电容、芯片会严重影响读数，最好拆下或至少拆开一端。\n- **温度**：电感量随温度略变，磁芯材料影响明显。\n\n### 4.6.2 测 DCR\n\nDCR（直流电阻）可以用万用表电阻档测，但要注意：\n\n- 功率电感 DCR 可能只有几十毫欧，普通表笔接触电阻就有几十毫欧，**四线开尔文夹**才准；\n- 温度会影响铜阻，手册通常给 25℃；\n- DCR 大不一定坏，但会导致压降和铜损。\n\n**算例**：DCR=0.1Ω、电流 2A，铜损 `2²×0.1=0.4W`；如果 DCR=0.05Ω，损耗 0.2W。大电流时 DCR 是重点。\n\n### 4.6.3 测饱和电流 Isat\n\nIsat 不是用万用表能直接测的。常用方法：\n\n1. 给电感加直流偏置，同时用小信号测电感量；\n2. 逐渐增大偏置电流，记录电感量下降到规定比例（如 10%、20%、30%）时的电流；\n3. 这就是手册某条件下的 Isat。\n\n没有专用设备时，可以通过 **Buck 电路实测**间接判断：负载加大到某一点，电感电流峰值超过 Isat，电感量骤降，纹波急剧变大、开关波形异常、效率下降。**不要故意让电感长时间饱和**，可能过热/损坏。\n\n### 4.6.4 测 SRF 与阻抗\n\nSRF（自谐振频率）要用阻抗分析仪或网络分析仪看阻抗曲线：低频呈感性，阻抗随频率上升；到 SRF 附近阻抗最高；之后呈容性，阻抗下降。没有仪器时，查手册曲线，按开关频率/SRF 留余量。\n\n### 4.6.5 示波器看 Buck 电感电流\n\n电感电流不能直接用普通探头测（探头地会短路）。常用方法：\n\n- 在电感回路串一个**小采样电阻**（如 10mΩ），用差分探头测电阻两端电压；\n- 或用电流探头；\n- 观察三角波：峰值、谷值、平均、频率、占空比。\n\n**安全**：开关节点是高 dv/dt，探头地线要短，避免拾取噪声；不要用普通无源探头直接测高边栅极。\n\n### 4.6.6 仿真记录表\n\n| 仿真 | 改什么 | 预期 | 实际 |\n|---|---|---|---|\n| inductkick | 加/不加续流二极管 | 关断尖峰变化 | |\n| inductkick-snub | 改缓冲 RC | 尖峰/振荡变化 | |\n| power-buck | 改 L 或 f | 纹波变化 | |\n| transformer-basic | 改匝比 | 输出变化 | |\n\n```circuitjs\ninductkick\n```\n\n```circuitjs\ninductkick-snub\n```\n\n### 4.6.7 动手任务\n\n1. 用 LCR 表测一只 100μH 功率电感，记录 1kHz、10kHz、100kHz 下的读数，比较差异。\n2. 用四线法测 DCR，算 2A 下的铜损。\n3. 在 Buck 电路上改变负载，观察电感电流从 CCM 到 DCM 的变化。\n4. 给继电器加/去续流二极管，用示波器看开关节点尖峰。\n\n---\n\n## 4.7 常见坑\n\n### 坑 1：把电感当“电阻”\n\n电感对直流像导线（只有 DCR），对交流有阻抗 `XL=2πfL`。不能拿万用表电阻档判断电感“好坏”，直流电阻正常不代表电感量正常。\n\n### 坑 2：忽略饱和电流\n\nBuck 电感选小了，峰值电流超过 Isat，电感量骤降，电流失控，开关管过流。**Isat 要按最坏峰值留 30% 余量。**\n\n### 坑 3：只看电感量，不看 DCR\n\n大电流时 DCR 决定铜损和压降。10μH/0.5Ω 的电感在 3A 下铜损 4.5W，根本不能用。\n\n### 坑 4：续流二极管接反\n\n继电器续流二极管阴极接电源正、阳极接开关节点。接反会在开关导通时把电源短路。**方向绝对不能凭感觉。**\n\n### 坑 5：忽略 SRF\n\n高频滤波/开关电源中，电感超过 SRF 后呈容性，滤波失效。开关频率要远低于 SRF（至少 10 倍更稳）。\n\n### 坑 6：电感太靠近敏感电路\n\n无屏蔽电感的磁场会耦合到周边，造成噪声。DC-DC 电感要远离模拟小信号、晶振、ADC 走线；必要时用屏蔽电感。\n\n### 坑 7：变压器当大号电感\n\n变压器有匝比、极性、隔离、漏感、励磁电感，不能拿功率电感替代。反激/正激的变压器设计还要考虑磁芯复位、气隙、安规。\n\n### 坑 8：忽略启动/短路电流\n\n启动、短路时电感电流可能远超额定，Isat/Irms 要按最坏情况核算。电源设计不能只看额定负载。\n\n### 坑 9：布局把电感回路拉长\n\nBuck 的输入电容、高边开关、电感、地回路要短，否则寄生电感造成振铃/EMI。电感不是随便摆。\n\n---\n\n## 4.8 本章复盘\n\n### 4.8.1 公式表\n\n| 公式 | 用途 | 条件 |\n|---|---|---|\n| `U = L × di/dt` | 感应电压 | 电感电流变化 |\n| `E = ½LI²` | 储能 | 电流 I |\n| `XL = 2πfL` | 感抗 | 正弦 |\n| `fc = 1/(2π√(LC))` | LC 截止 | 理想 LC |\n| `Z0 = √(L/C)` | 特征阻抗 | LC |\n| `D = Vout/Vin` | Buck 占空比 | CCM |\n| `ΔIpp = Vin·D(1−D)/(Lf)` | 纹波 | CCM |\n| `τ = L/R` | 续流衰减 | RL 回路 |\n| `V1/V2 = N1/N2` | 变压器匝比 | 理想 |\n\n### 4.8.2 术语表\n\n| 术语 | 解释 |\n|---|---|\n| 电感 L | 储能元件，单位亨利 |\n| 电感量 | 单位电流产生的磁链 |\n| 饱和 Isat | 磁芯饱和、电感量骤降的电流 |\n| Irms | 允许有效电流（温升） |\n| DCR | 直流电阻 |\n| SRF | 自谐振频率 |\n| Q | 品质因数 |\n| 续流 | 给电感电流提供回路 |\n| CCM | 连续导通模式 |\n| DCM | 断续导通模式 |\n| 匝比 | 变压器初级/次级圈数比 |\n| 同名端 | 极性标记 |\n| 漏感 | 未耦合的寄生电感 |\n| 励磁电感 | 变压器初级等效电感 |\n\n### 4.8.3 自测 10 题\n\n1. 电感储能公式是什么？\n2. 100mH、50mA，储能多少？\n3. Buck 12V→5V，占空比多少？\n4. 续流二极管阴极接哪里？\n5. 为什么电感会饱和？\n6. Isat 和 Irms 有什么区别？\n7. DCR 0.1Ω、2A，铜损多少？\n8. LC 低通 L=10μH、C=10μF，fc 约多少？\n9. 变压器为什么不能传直流？\n10. 电感为什么不能随便靠近敏感电路？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `E=½LI²`。\n2. `0.5×0.1×0.05²=0.000125J=0.125mJ`。\n3. `D=5/12≈0.417`。\n4. 电源正端（低边开关续流）。\n5. 磁芯磁通达到材料上限，电感量骤降。\n6. Isat 是饱和电流，Irms 是温升有效电流；两者条件不同。\n7. `2²×0.1=0.4W`。\n8. `1/(2π√(1e-10))≈15.9kHz`。\n9. 直流磁场不变化，次级没有感应电压。\n10. 无屏蔽电感磁场会耦合，造成噪声/干扰。\n\n<\/details>\n\n### 4.8.4 能力清单\n\n- [ ] 能解释电感储能、感应电压、感抗。\n- [ ] 能算 Buck 占空比、纹波、峰值电流。\n- [ ] 能设计继电器续流并选二极管。\n- [ ] 能区分 Isat、Irms、DCR、SRF。\n- [ ] 能选功率电感、共模电感、变压器。\n- [ ] 能用 LCR 表/示波器做基本验证。\n\n### 4.8.5 下一章\n\n下一章讲**二极管**：它是第一种半导体器件，也是整流、防反接、续流、钳位的核心。你会看到 PN 结、正向压降、反向恢复，以及普通管、肖特基、稳压管、TVS、LED 的区别。\n\n---\n\n<!-- 第 04 章完 -->","taskSignature":"f0eedb237994091f3a4a2eb96943d4d50e8c35a26b9bc9b99280fd64e9f010a2","taskCount":6},{"id":"05","title":"第 05 章 · 二极管","short":"二极管","stage":1,"diff":2,"prev":"第 01～02 章","optional":false,"md":"## 5.1 它解决什么问题\n\n### 场景一：电源插反了，板子烧了\n\n很多小产品用 DC 插座或接线端子供电。用户把正负极接反，后级芯片的电源脚被加上负电压，轻则不工作，重则烧芯片。最常见、最便宜的补救办法，是在电源入口串一只二极管：接对时电流正常通过，接反时二极管反向阻断。\n\n这个办法不是没有代价：二极管导通时有正向压降，电流越大发热越多。所以它适合小电流、对压降不敏感的场景；大电流产品要比较理想二极管、MOS 防反接等方案。\n\n### 场景二：交流电要变成单向脉动\n\n墙上插座是交流电，电压方向一直在变。很多电路需要“只往一个方向流”的电流，比如给电容充电、给负载供电。二极管组成的半波整流、桥式整流，就是把交流“剪掉一半”或“翻正另一半”的最小电路。\n\n这里要提前说清楚：整流得到的不是平滑直流，而是脉动直流，后面通常还要加电容滤波、稳压。二极管只负责方向，不负责把电压变平。\n\n### 场景三：线圈关断时，电压突然冲到几千伏\n\n继电器、电磁阀、电机都是线圈。线圈通电时储存磁场能量；开关突然断开，电流想瞬间变成 0，电感会产生很高的反向感应电压。这个尖峰足以把驱动三极管或 MOS 管打穿。\n\n解决办法是在线圈两端并联一只“续流二极管”，给电流留一条局部回路。第 04 章已经画过这个电路，本章会把二极管的方向、选型和计算讲透。\n\n### 本章在课程里的位置\n\n第 02 章讲电阻，第 03 章讲电容，第 04 章讲电感，本章讲第一种半导体器件。二极管只有两个端子，结构最简单，但它是后面三极管、MOS、运放的基础：PN 结、单向导电、击穿、结电容这些概念，后面都会反复出现。\n\n---\n\n## 5.2 它是什么\n\n### 5.2.1 一句话定义\n\n**二极管（Diode）** 是一个两端口半导体器件，主要特性是：在规定的正向电压下电流比较容易通过，在规定的反向电压范围内电流很小；反向电压超过额定值可能击穿。\n\n> **术语解释：正向 / 反向**\n> 以阴极为参考，阳极电位高于阴极叫**正向偏置**；阳极电位低于阴极叫**反向偏置**。注意这是“相对”的，不是“接电源正极就叫正”。\n\n两个端子：\n\n- **阳极 A（Anode）**：符号里三角形的一端。\n- **阴极 K（Cathode）**：符号里横线的一端。\n\n原理图位号通常写 **D**，多只二极管写 D1、D2。实物上常用色环、标条标阴极，但不同封装、不同厂商的标记规则不一样，**以完整料号的手册为准**，不要背“长脚正短脚负”这类口诀去套所有器件。\n\n### 5.2.2 它为什么能单向导电\n\n二极管的核心是一个 **PN 结**：P 型半导体（多数载流子为空穴）和 N 型半导体（多数载流子为电子）贴在一起，交界处形成内建电场和耗尽层。\n\n> **术语解释：载流子**\n> 半导体里能移动、能形成电流的粒子。电子带负电；空穴可以理解为“缺少一个电子的位置”，等效带正电。你不需要会画能带图，只要知道：P 区多“正”，N 区多“负”。\n\n- 正向偏置时，外加电压削弱内建电场，耗尽层变窄，载流子容易越过结，电流较快上升。\n- 反向偏置时，内建电场增强，耗尽层变宽，只有很小的漏电流；电压再高到一定程度，会发生**击穿**，电流迅速增大。\n\n击穿不一定是“坏了”。稳压管就是设计在击穿区工作；但普通二极管如果进入击穿且没有限流，会因功率过大而损坏。**能不能进入击穿，取决于器件类型和外部限流，不是看它叫不叫二极管。**\n\n### 5.2.3 正向压降 VF\n\n二极管导通后，阳极和阴极之间仍有一个电压差，叫**正向压降 VF**。硅二极管常见在 0.6～0.8V 左右，肖特基常见更低，LED 则依颜色和材料不同，可能 1.8～3.3V 甚至更高。\n\nVF 不是固定值，它随电流增大而略升、随温度升高而略降，具体看手册曲线。所以：\n\n- 不能用“0.7V”去算所有二极管；\n- 不能把二极管当理想导线；\n- 大电流时 `P = VF × IF` 的功耗必须算，否则会热。\n\n### 5.2.4 反向漏电与反向耐压\n\n反向偏置时不是完全断流，会有**反向漏电流 IR**，通常很小，但会随温度升高明显增大。肖特基的漏电往往比普通硅二极管更需要注意。\n\n**反向耐压 VR** 是允许施加的反向电压上限。超过它，器件可能击穿；普通二极管击穿后可能损坏，稳压管/TVS 则是在规定条件下利用击穿。选型时反向电压要留余量，尤其是感性负载、雷击浪涌、热插拔场景。\n\n### 5.2.5 符号与封装\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 200\" role=\"img\" aria-label=\"普通二极管、发光二极管、稳压管的电路符号对比\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M30 100 H70\"/><path d=\"M70 70 V130 L110 100 Z\" fill=\"currentColor\"/><path d=\"M110 68 V132\"/><path d=\"M110 100 H150\"/>\n  <path d=\"M240 100 H280\"/><path d=\"M280 70 V130 L320 100 Z\" fill=\"currentColor\"/><path d=\"M320 68 V132\"/><path d=\"M320 100 H360\"/>\n  <path d=\"M300 62 L320 42 M312 72 L332 52\"/>\n  <path d=\"M460 100 H500\"/><path d=\"M500 70 V130 L540 100 Z\" fill=\"currentColor\"/><path d=\"M540 68 V132 M540 68 L530 58 M540 132 L550 142\"/><path d=\"M540 100 H580\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\">\n  <text x=\"38\" y=\"55\">A<\/text><text x=\"118\" y=\"55\">K<\/text><text x=\"30\" y=\"185\">普通二极管<\/text>\n  <text x=\"248\" y=\"55\">A<\/text><text x=\"342\" y=\"55\">K<\/text><text x=\"245\" y=\"185\">LED（箭头表示发光）<\/text>\n  <text x=\"468\" y=\"55\">A<\/text><text x=\"548\" y=\"55\">K<\/text><text x=\"460\" y=\"185\">稳压管（Z 形横线）<\/text>\n<\/g><\/svg>\n```\n\n图 5-1 普通二极管、LED、稳压二极管的符号\n\n图中从左到右：普通二极管、LED（带发光箭头）、稳压二极管（阴极横线带“Z”形折角）。符号只表示类型，实物引脚顺序仍要查手册。\n\n常见封装：\n\n| 封装 | 常见场景 | 注意 |\n|---|---|---|\n| SOD-123 / SOD-323 | 小信号、小电流 | 体积小，功耗有限 |\n| SMA / SMB / SMC | 整流、防反接 | 电流越大封装越大 |\n| DO-41 / DO-15 | 插件整流 | 便于手工焊接 |\n| SOT-23 | 双二极管、BAV99 等 | 可能是共阳/共阴/串联，必须查内部结构 |\n| TO-220 / TO-252 | 大电流肖特基 | 需要散热铜皮 |\n\n**SOT-23 里的两只二极管不一定是你以为的接法**。BAV99 是串联结构，BAT54 系列有共阳、共阴、串联多种版本。画原理图前先看内部等效图，否则网络会连错。\n\n---\n\n## 5.3 关键参数与手册\n\n### 5.3.1 一张表看懂二极管手册\n\n| 参数 | 英文/符号 | 含义 | 为什么重要 |\n|---|---|---|---|\n| 正向压降 | VF | 规定电流下的导通压降 | 损耗、发热、后级电压 |\n| 反向耐压 | VR / VRRM | 允许的反向电压 | 防反接、整流、续流 |\n| 正向电流 | IF | 平均正向电流 | 持续发热 |\n| 浪涌电流 | IFSM | 短时允许的大电流 | 开机、电容充电 |\n| 反向漏电 | IR | 反向小电流 | 高温、精密电路 |\n| 反向恢复时间 | trr | 从导通则关断的恢复时间 | 高频整流、开关损耗 |\n| 结电容 | Ct / CJ | PN 结寄生电容 | 高频、信号完整性 |\n| 功耗 | Ptot | 允许耗散功率 | 散热设计 |\n| 工作结温 | Tj | 内部允许温度 | 降额 |\n\n### 5.3.2 读手册的三个条件\n\n**第一，VF 一定带测试电流。** 手册写 `VF=0.45V @ IF=1A, 25℃`，你不能拿这个 0.45V 去算 10mA 的场景。小电流下 VF 通常更低，但具体看曲线。\n\n**第二，IF 是平均电流，不是峰值。** 整流电路里二极管只在半个周期导通，峰值电流可能远大于平均值；还要看 IFSM 和热。\n\n**第三，VR 是反向电压，不是“耐压有效值”。** 交流整流时，二极管承受的反向电压可能是峰值电压的 2 倍（桥式）或更高，必须按最坏情况算。\n\n### 5.3.3 六种常见二极管\n\n| 类型 | 核心特点 | 典型用途 | 不能干什么 |\n|---|---|---|---|\n| 普通整流管（1N4007 等） | 便宜、耐压高、VF 约 0.7～1V | 工频整流、防反接、续流 | 高频开关损耗大 |\n| 快恢复二极管 | trr 短 | 高频整流、开关电源 | 不是“越快越好”，要配合电路 |\n| 肖特基二极管 | VF 低、恢复快 | 低压大电流整流、防反接、Buck 续流 | 漏电大、耐压通常较低 |\n| 稳压二极管 | 规定反向电流下电压较稳 | 简单参考、钳位、保护 | 不能当大电流电源 |\n| TVS | 吸收短时浪涌 | ESD、雷击、热插拔保护 | 不能替代稳压器 |\n| LED | 通电发光 | 指示、照明 | 不能直接接电压源 |\n\n### 5.3.4 一个常被忽略的参数：结电容\n\n二极管关断时，PN 结的电荷要抽走，表现为**反向恢复**；结电容和寄生电感还会影响高频信号。比如用二极管做信号钳位、检波、OR 逻辑，频率高了以后，波形会变慢、失真。低频电源里可以忽略，高频电路里必须查 trr 和 Ct。\n\n---\n\n## 5.4 五个典型电路\n\n### 5.4.1 电路一：串联防反接\n\n```text\n电源输入 + ── D1（A→K）── 后级 VCC\n电源输入 − ─────────────── GND\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"串联二极管防反接：输入正端经二极管到后级\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M30 90 H110\"/><path d=\"M110 66 V114 L150 90 Z\"/><path d=\"M150 64 V116\"/><path d=\"M150 90 H300\"/>\n  <path d=\"M300 90 V150\"/><rect x=\"287\" y=\"150\" width=\"26\" height=\"55\"/><path d=\"M300 205 V235\"/>\n  <path d=\"M300 235 H370 M358 235 V250 M346 250 H370 M350 258 H366 M354 266 H362\"/>\n  <path d=\"M30 205 H150 M138 205 V220 M126 220 H150 M130 228 H146 M134 236 H142\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"26\" y=\"74\">+ 输入<\/text><text x=\"110\" y=\"52\">D1<\/text><text x=\"310\" y=\"80\">后级 VCC<\/text>\n  <text x=\"315\" y=\"175\">负载<\/text><text x=\"26\" y=\"190\">− 输入<\/text>\n<\/g><\/svg>\n```\n\n图 5-2 串联二极管防反接\n\n正常接法：电流从阳极流向阴极，D1 导通，后级得到约 `Vin − VF`。接反时：阳极电位低于阴极，D1 反偏，只剩很小的漏电，后级基本不工作。\n\n**算例**：5V、负载 300mA、假设 D1 在 300mA 下 VF=0.45V。\n\n- 后级电压：`5 − 0.45 = 4.55V`；\n- 二极管功耗：`0.45 × 0.3 = 0.135W`；\n- 如果后级最低要 4.5V，这个方案勉强可用；如果后级要 4.75V，就不够。\n\n**选型**：VR 至少大于最大输入电压的 1.5～2 倍；IF 大于负载电流并留余量；注意开机浪涌。大电流时，串联二极管的压降损失可能比“烧一次板子”的维修成本更值得权衡。\n\n### 5.4.2 电路二：半波整流\n\n```text\nAC ── D1 ──●── 负载 ── GND\n            │\n           C1（滤波）\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"半波整流：交流源经二极管给电容和负载供电\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"70\" cy=\"130\" r=\"26\"/><path d=\"M70 104 V156 M58 118 L82 142 M82 118 L58 142\"/>\n  <path d=\"M96 130 H160\"/><path d=\"M160 112 V148 L184 130 Z\"/><path d=\"M184 112 V148\"/><path d=\"M184 130 H260\"/>\n  <circle cx=\"260\" cy=\"130\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M260 130 V170\"/><path d=\"M247 170 H285\"/><path d=\"M247 180 H285\"/><path d=\"M260 180 V210\"/>\n  <path d=\"M260 210 H340 M328 210 V225 M316 225 H340 M320 233 H336 M324 241 H332\"/>\n  <path d=\"M260 130 H380\"/><path d=\"M380 130 V165\"/><rect x=\"367\" y=\"165\" width=\"26\" height=\"55\"/><path d=\"M380 220 V245\"/>\n  <path d=\"M380 245 H450 M438 245 V260 M426 260 H450 M430 268 H446 M434 276 H442\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\">\n  <text x=\"48\" y=\"95\">AC<\/text><text x=\"145\" y=\"100\">D1<\/text>\n  <text x=\"275\" y=\"118\">Vout<\/text><text x=\"300\" y=\"190\">C1<\/text>\n  <text x=\"390\" y=\"200\">负载<\/text><text x=\"250\" y=\"245\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 5-3 半波整流与电容滤波\n\n交流正半周，D1 导通，电流给负载和电容供电；负半周，D1 反偏，电容向负载放电。输出是带纹波的脉动直流。\n\n**算例**：次级 12V AC（有效值）、负载 100Ω、忽略二极管压降。峰值电压 `12×1.414≈17V`；半波整流后，电容足够大时输出接近峰值，但带载后会下降；二极管反向承受约 `17V`（实际还要加余量）。如果改成桥式整流，输出纹波频率翻倍、变压器利用率更高，但会多两个二极管压降。\n\n**注意**：市电整流涉及高压安全，零基础阶段不要直接搭市电电路；本章只做低压变压器输出的仿真与计算。\n\n```circuitjs\nrectify\n```\n\n### 5.4.3 电路三：二极管 OR（双电源备份）\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"二极管或门：两路输入经二极管汇合，任一路为高时输出为高\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M40 80 H110\"/><path d=\"M110 56 V104 L150 80 Z\"/><path d=\"M150 54 V106\"/><path d=\"M150 80 H310\"/>\n  <path d=\"M40 210 H110\"/><path d=\"M110 186 V234 L150 210 Z\"/><path d=\"M150 184 V236\"/><path d=\"M150 210 H310\"/>\n  <path d=\"M310 80 V210\"/><circle cx=\"310\" cy=\"80\" r=\"5\" fill=\"currentColor\"/><path d=\"M310 80 H450\"/>\n  <path d=\"M450 80 V140\"/><rect x=\"437\" y=\"140\" width=\"26\" height=\"55\"/><path d=\"M450 195 V235\"/>\n  <path d=\"M450 235 H520 M508 235 V250 M496 250 H520 M500 258 H516 M504 266 H512\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"30\" y=\"72\">A<\/text><text x=\"30\" y=\"202\">B<\/text>\n  <text x=\"112\" y=\"46\">D1<\/text><text x=\"112\" y=\"176\">D2<\/text>\n  <text x=\"360\" y=\"66\">Vout<\/text><text x=\"500\" y=\"180\">R1<\/text>\n  <text x=\"438\" y=\"292\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 5-4 两路电源经二极管汇合，防止互相倒灌\n\n两路电源各串一只二极管，阴极汇到同一个输出。哪一路电压高，哪一路就导通；另一路反偏，不会把电流倒灌回它的电源。\n\n**算例**：主电源 5V、备用电池 4.2V，二极管 VF 均约 0.4V。主电源正常时，输出约 `5−0.4=4.6V`，备用路阴极被抬到 4.6V，阳极为 4.2V，反偏不导通；主电源掉电，备用路导通，输出约 `4.2−0.4=3.8V`。\n\n**坑**：两路电压接近时，可能两路同时导通，电流互相流动；要有明确的优先级和电压差。二极管 OR 只适合小电流，大电流要用理想二极管/电源切换芯片。\n\n```circuitjs\npower-diode-or\n```\n\n### 5.4.4 电路四：稳压管与 TVS\n\n**稳压管并联稳压**：\n\n```text\nVin ── R1 ──●── Vout\n            │\n          D1（稳压管，阴极朝上）\n            │\n           GND\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"稳压管并联稳压：串联电阻限流，稳压管反向工作\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M50 120 H100\"/><rect x=\"100\" y=\"107\" width=\"64\" height=\"26\"/><path d=\"M164 120 H250\"/>\n  <circle cx=\"250\" cy=\"120\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M250 120 V160\"/><path d=\"M232 160 H268\"/><path d=\"M232 160 L226 154\"/><path d=\"M268 160 L274 166\"/><path d=\"M232 196 H268 L250 160 Z\"/><path d=\"M250 196 V225\"/>\n  <path d=\"M250 225 H330 M318 225 V240 M306 240 H330 M310 248 H326 M314 256 H322\"/>\n  <path d=\"M250 120 H400\"/><path d=\"M400 120 V165\"/><rect x=\"387\" y=\"165\" width=\"26\" height=\"55\"/><path d=\"M400 220 V250\"/>\n  <path d=\"M400 250 H470 M458 250 V265 M446 265 H470 M450 273 H466 M454 281 H462\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\">\n  <text x=\"42\" y=\"105\">Vin<\/text><text x=\"108\" y=\"92\">R1<\/text>\n  <text x=\"270\" y=\"110\">Vout<\/text><text x=\"300\" y=\"185\">D1 稳压管<\/text>\n  <text x=\"435\" y=\"215\">负载<\/text><text x=\"235\" y=\"270\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 5-5 稳压管并联稳压\n\nR1 限制总电流，稳压管在反向击穿区工作，负载并联在输出端。输入升高时，稳压管电流增大，把输出拉回约 VZ；输入降低或负载加重时，稳压管电流减小，直到无法维持。\n\n**算例**：Vin=12V、VZ=5.1V、R1=1kΩ、负载电流 5mA。\n\n- 总电流约 `(12−5.1)/1000=6.9mA`；\n- 负载拿走 5mA，稳压管只剩约 1.9mA；\n- 如果负载要到 10mA，稳压管电流为负，说明 R1 太大或输入太低，输出会跌落。\n\n**TVS** 则是吸收短时脉冲，正常工作时高阻，浪涌来时迅速钳位。TVS 的钳位电压随脉冲电流变化，选型要看浪涌波形和能量，不能只看标称电压。\n\n### 5.4.5 电路五：LED 限流\n\n```text\n5V ── R1 ── LED（A→K）── GND\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 260\" role=\"img\" aria-label=\"LED限流：5伏经电阻和LED接地\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M40 120 H100\"/><rect x=\"100\" y=\"107\" width=\"64\" height=\"26\"/><path d=\"M164 120 H260\"/>\n  <path d=\"M260 100 V140 L300 120 Z\"/><path d=\"M300 100 V140\"/><path d=\"M300 120 H360\"/><path d=\"M360 120 V175\"/>\n  <path d=\"M360 175 H420 M408 175 V190 M396 190 H420 M400 198 H416 M404 206 H412\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"36\" y=\"104\">+5V<\/text><text x=\"106\" y=\"92\">R1 330Ω<\/text>\n  <text x=\"268\" y=\"160\">LED1<\/text>\n<\/g><\/svg>\n```\n\n图 5-6 LED 限流\n\nLED 也是二极管，但它的 VF 通常比普通二极管高，且**必须限流**。直接接 5V 会因电流过大而烧毁。\n\n**算例**：5V、LED VF=2.0V、目标 10mA。\n\n```text\nR = (5 − 2.0) / 0.01 = 300Ω\nP_R = (5−2.0)² / 300 = 0.03W\n```\n\n可取 300Ω 或 330Ω（电流略小）。如果电源是 12V，`R=(12−2)/0.01=1kΩ`，电阻功耗 `(10)²/1000=0.1W`。实际要按 LED 手册的 VF 范围和最大电流核对。\n\n---\n\n## 5.5 选型与降额\n\n### 5.5.1 按用途选类型\n\n| 用途 | 首选 | 备选 | 避免 |\n|---|---|---|---|\n| 工频整流 | 普通整流管 1N4007 | 桥式整流堆 | 小信号肖特基 |\n| 低压大电流整流 | 肖特基 | 同步整流 MOS | 普通整流管（压降大） |\n| 防反接（小电流） | 肖特基/普通管 | 理想二极管 | 稳压管 |\n| 防反接（大电流） | 理想二极管/MOS | 肖特基 | 串联普通管 |\n| 线圈续流 | 1N4148/1N4007/肖特基 | TVS/RC | 稳压管单独用 |\n| 简单参考 | 稳压管 | TL431 | TVS |\n| 浪涌保护 | TVS | 压敏电阻+滤波 | 稳压管 |\n| 指示 | LED | — | 普通二极管 |\n\n### 5.5.2 降额参考\n\n| 参数 | 建议 | 说明 |\n|---|---|---|\n| VR | 实际反向电压 ≤80% 额定 | 瞬态要单独核 |\n| IF | 实际平均电流 ≤70～80% 额定 | 看温升 |\n| IFSM | 开机/浪涌不超限 | 电容充电电流很大 |\n| Ptot | 计算功耗 ≤70% 允许 | 封装/铜皮影响 |\n| Tj | 留 20～30℃ 余量 | 高温漏电增大 |\n| trr | 高频开关要远小于周期 | 否则损耗大 |\n\n### 5.5.3 选型 7 步\n\n1. 明确功能：整流、防反接、续流、钳位、指示。\n2. 算最坏反向电压（含瞬态）。\n3. 算平均电流、峰值电流、浪涌。\n4. 选类型：普通/快恢复/肖特基/稳压/TVS。\n5. 查 VF 曲线，算功耗和温升。\n6. 查封装、引脚、内部结构（尤其 SOT-23 双管）。\n7. 写完整料号，核对供货和温度等级。\n\n---\n\n## 5.6 测量与仿真\n\n### 5.6.1 万用表二极管档\n\n多数万用表二极管档会给出一个电压读数：正向导通时显示约 0.3～0.7V（肖特基更低），反向显示“OL”或超量程。它可以用来粗判好坏，但要注意：\n\n- 在板测量时，并联路径可能让读数失真；\n- 不同表笔极性和测试电流不同，LED 可能不亮；\n- 读数正常不代表耐压、漏电、恢复时间都正常。\n\n**正确做法**：断电、放电，必要时拆下一只脚再测；先查手册的引脚图，不要凭表笔“猜”。\n\n### 5.6.2 示波器看整流波形\n\n低压交流输入，探头看负载两端。你应该看到：正半周有输出，负半周被削掉；加电容后，输出变成带纹波的直流。把时间轴展开，能看到二极管导通时的压降和关断时的反向恢复尖峰。注意探头地线接法，避免短路。\n\n### 5.6.3 仿真记录表\n\n| 仿真 | 改什么 | 预期 | 实际 |\n|---|---|---|---|\n| diode-forward | 电源从 1V 调到 5V | 电流非线性上升 | |\n| rectify | 加/去滤波电容 | 输出纹波变化 | |\n| power-diode-or | 改一路电源电压 | 是否倒灌 | |\n\n```circuitjs\ndiode-forward\n```\n\n### 5.6.4 动手任务\n\n1. 用 5V、330Ω、红色 LED 搭一个指示灯，测 LED 两端电压和电阻两端电压，验证 `VF + VR ≈ 5V`。\n2. 用两只二极管搭 OR 电路，一路 5V、一路 3.3V，测输出并判断哪路导通。\n3. 用信号发生器 + 示波器看半波整流，记录峰值和纹波。\n4. 找一只 SOT-23 双二极管，查手册内部结构，画出等效连接。\n\n---\n\n## 5.7 常见坑\n\n### 坑 1：把二极管当理想导线\n\n“5V 经过二极管还是 5V”是错的。小电流时可能只掉 0.3V，大电流时可能掉 1V 以上，后级可能因此复位。\n\n### 坑 2：续流二极管接反\n\n续流二极管阴极接电源正、阳极接开关节点。接反了，开关导通时会把电源短路，轻则烧二极管，重则烧电源。\n\n### 坑 3：用稳压管当稳压电源\n\n稳压管只能在小电流、负载变化不大的场景做简单参考。负载一大，电压就塌。要稳定供电，用稳压器（LDO/DCDC）。\n\n### 坑 4：忽略反向漏电和温度\n\n肖特基在高温下漏电明显增大，精密电路、低功耗电路要算。 datasheet 的 25℃ 数据不能直接用到 85℃。\n\n### 坑 5：高频用普通整流管\n\n普通整流管 trr 长，高频下损耗大、波形差，甚至因反向恢复造成尖峰。开关电源要选快恢复或肖特基。\n\n### 坑 6：LED 不限流\n\nLED 的 VF 随温度、电流变化，直接接电压源会烧。必须串电阻或恒流驱动。\n\n### 坑 7：SOT-23 双二极管接错\n\nBAV99、BAT54 有共阳、共阴、串联等不同版本，符号一样但内部连接不同。必须查手册内部图。\n\n### 坑 8：忘记浪涌电流\n\n电容充电瞬间电流很大，二极管 IFSM 不够会损坏。电源入口要查浪涌，必要时加 NTC 或软启动。\n\n---\n\n## 5.8 本章复盘\n\n### 5.8.1
