 查探头和示波器的额定输入、倍率、带宽；根据说明书将探头接到校准输出并做补偿。\n2. 探头实际倍率与通道菜单一致，例如探头设 10×，通道也设 10×；不同探头的输入范围和负载不同。\n3. 地夹接公共参考点，尖端接测量点；选择直流耦合、合适的垂直档位与时基。\n4. 设置触发源、边沿和触发电平；波形稳定后用光标或自动测量读取。\n5. 记录峰峰值、周期和工作状态。周期为 1ms 的重复波形频率为 `f = 1/T = 1kHz`；直流偏置不等于峰峰值。\n\n测量结果受探头负载、接地引线、带宽、采样率及触发方式影响；长地线可能引入额外振铃。选用适合设备的短接地方式可改善测量，但必须保持正确参考与安全接线。具体操作见 [Tektronix 探头指南](https://www.tek.com/en/documents/whitepaper/abcs-probes-primer)。\n\n### 06.5 信号发生器：提供可控输入\n\n信号发生器可设置波形、频率、幅度和直流偏置。先确认目标输入的最大/最小允许电压及接地方式，再连接设备：例如 2Vpp、偏置 1.5V 的理想正弦波约在 0.5V～2.5V 间变化，实际需测量确认。\n\n许多发生器具有约 50Ω 输出阻抗。面板的 50Ω/高阻负载设置可能只改变显示或换算，并非改变物理输出阻抗；在某些设置下，高阻负载实际电压可接近显示值两倍。具体以设备手册与示波器实测为准，勿把未知输出直接送入 MCU 引脚。\n\n### 06.6 电子负载、频谱仪与其他仪器\n\n电子负载可按恒流等模式对电源施加受控负载；要同时核对最大电压、电流、功率及散热。频谱仪用于观察频率成分，输入多为 50Ω，未知电压、直流和功率不能直接送入；应核对输入额定值并使用适当隔直和衰减。LCR 电桥用于在规定频率和测试条件下测量元件参数。深入应用见第 16 课。\n\n**电子负载的基本工作方式**\n\n恒流（CC）模式尝试吸收设定电流；恒阻（CR）模式近似模拟电阻；恒功率（CP）模式尝试维持功率，低电压时可能需要较大电流；恒压（CV）模式尝试控制输入端电压。不同负载的模式和工作范围以说明书为准。开始测试前，将负载输入关闭，确认供电设备允许的电压、电流、功率与接线极性；从低负载逐步增加，记录电源端与负载端电压、实际电流和温度。达到任一设备或线材的额定限制前停止。不要对未知能力的 USB 口直接执行大电流测试。\n\n例如经确认允许时，5V、0.1A 稳态负载的功率约 0.5W；这是负载吸收功率的估算，不是电源效率，也不表明任意 5V 接口都能承受该负载。效率测试还需同时测量输入与输出功率。\n\n**频谱仪的基本读数**\n\n先明确目标频段、最大输入交流功率和直流电压，确认探头、隔直器与外置衰减器的额定范围后再接线；内置衰减器不一定保护输入连接器或直流通路。设置起止频率、参考电平、合适的分辨率带宽（RBW）及扫描条件，记录设置和连接方式。峰值位置可用于观察频率成分；幅度与带宽、噪声底、衰减和校准有关，不能把屏幕峰值直接当成完整的 EMC 认证结果。信号发生器的扫频或调制及频谱仪进阶操作可结合第 16 课按设备手册练习。\n\n### 06.7 综合练习：测量 RC 低通\n\n互动仿真采用理想信号源、1kΩ 电阻和 100nF 电容，正弦输入峰值 1V，频率约 1.59kHz；可修改频率比较波形。\n\n```circuitjs\nrc-lowpass-1592\n```\n\n图中 CH1、CH2 均以公共地为参考，地夹应接在同一公共地；请先确认仪器接地方式。\n\n```svg\n<svg role=\"img\" aria-label=\"RC低通电路：输入经电阻到输出，输出经电容接地\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"178.79999999999995pt\" width=\"292.47499999999997pt\" viewBox=\"-80.42499999999998 -169.49999999999994 292.47499999999997 178.79999999999995\"><path d=\"M 0.0,-108.0 L 18,-108 L 36,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-108.0 L 54,-108 L 54,-117 L 90,-117 L 90,-99 L 54,-99 L 54,-108 M 90,-108 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 144,-108 L 180,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-75.24 M 117,-75.24 L 99,-75.24 M 117,-68.76 L 99,-68.76 M 108,-68.76 L 108,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-21.6 L 99,-21.6 L 117,-21.6 M 101.7,-17.28 L 114.3,-17.28 M 106.2,-12.96 L 109.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 18.0,-108.0 L 18,-126 L 18,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 151.20000000000002,-108.0 L 151.2,-126 L 151.2,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-61.199999999999996\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-61.199999999999996\" dy=\"13\">信号源输出<\/tspan><\/text><text x=\"72.0\" y=\"-133.60000000000002\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">R1 1kΩ<\/tspan><\/text><text x=\"201.6\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"201.6\" dy=\"13\">输出<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">C1 100nF<\/tspan><\/text><text x=\"14.4\" y=\"-171.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"14.4\" dy=\"13\">CH1 探头<\/tspan><\/text><text x=\"147.60000000000002\" y=\"-171.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.60000000000002\" dy=\"13\">CH2 探头<\/tspan><\/text><text x=\"104.39999999999999\" y=\"-14.8\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"104.39999999999999\" dy=\"13\">两通道地夹接公共地<\/tspan><\/text><circle cx=\"108\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"18\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n准备隔离的低压信号源、示波器、1kΩ 电阻和 100nF 电容；电路为信号源 → 电阻 → 输出，输出经电容接公共地。先确认各仪器地的连接与设备输入范围。\n\n1. 预测：标称截止频率 `fc = 1/(2πRC)`，约 1.59kHz；这是理想值。\n2. 信号源设置小幅正弦，确认偏置与输出端电压；示波器 CH1 测电阻前输入，CH2 测电容两端输出，两通道地夹接同一公共地。\n3. 分别在低于、接近和高于 1.59kHz 的频率记录输入、输出幅度及频率。比较输出/输入比值，不能只看信号源面板设定。\n4. 检查误差来源：电阻电容容差、信号源输出阻抗、探头负载和示波器设置。没有设备时可用仿真练习并标注仿真条件。\n\n## 🔧 动手练习\n\n- 画出测电压和测支路电流的两种接线图，标明表笔孔位及电源状态。\n- 为 5V、1kΩ 负载预测电流和功率，再在元件额定范围内测量并记录偏差。\n- 设置一台直流电源，观察输出关闭、空载及负载状态的电压电流；说明 CV 与 CC 各表示什么。\n- 在确认接地安全的低压电路上观察方波，记录探头倍率、周期、频率、峰峰值与触发条件。\n- 写出 RC 练习的测量表；没有仪器时提交预期结果与仿真记录，留空实测值。\n\n## ✅ 自测清单\n\n- [ ] 我能说出电压表并联、电流表串联，以及电流表不得直接跨接电源的原因。\n- [ ] 我知道电阻和通断测量前要断电并确认电容放电。\n- [ ] 我能解释限流、CV/CC 和探头倍率，但不会把它们当成万能保护。\n- [ ] 我知道普通台式示波器的地夹可能连接保护地，并能识别不适合普通探头的测量。\n- [ ] 我能写出测量条件、预期、实际读数和误差来源。\n\n## ⚠️ 常见问题\n\n- 测完电流忘记换回 V/Ω 插孔，随后测电压；先检查表笔位置再换功能。\n- 测在板电阻时不考虑并联通路，误判元件；必要时隔离后复测。\n- 示波器探头与菜单倍率不一致，显示的电压错误；两处设置应一致。\n- 不记录偏置和负载设置，只抄信号源面板幅度；应测实际输入。\n\n## 📚 延伸学习\n\n- [嘉立创仪器仪表使用](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/Instrumentation_use.html)：参考设备分类与操作界面；实操以本课接线原则和实际仪表手册为准。\n- [Tektronix 探头指南](https://www.tek.com/en/documents/whitepaper/abcs-probes-primer)：探头、接地和测量负载。\n- 后续在第 15 课用于首板上电，在第 16 课学习测试用例和进阶仪器。","taskSignature":"006893f80ea4a2f7b22f8042e8073f671ecf4313f5d36ba9c4d38b9d6492f2dd","taskCount":5},{"id":"07","title":"第 07 课 · EDA 软件入门","short":"EDA 软件入门","stage":2,"diff":2,"prev":"第 04 课 · 硬件基础","optional":false,"md":"## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 说清 EDA 软件是什么、在 PCB 设计全流程中处于什么位置\n2. 对比立创EDA、Altium Designer、KiCad、PADS 四款主流软件的定位，明确\"入门用哪个、主修用哪个\"\n3. 独立完成软件安装与基础设置（单位、栅格）\n4. 理解工程文件、原理图文件、PCB 文件、库文件之间的关系\n5. 在原理图环境中完成放置元件、连线、放网络标号；在 PCB 环境中认识层、走线、过孔、铺铜并各操作一次\n6. 会从官方库、立创商城库、第三方库获取元器件并装入自己的工程\n\n## 📖 正文\n\n第 04 课认识了元器件和电路理论，这一课把\"纸上的电路\"搬进电脑。EDA 软件就是 PCB 设计师的\"办公桌\"，本课结束时，你要能独立画出一张小原理图并把它导入 PCB 随手走几根线——操作先混个脸熟，设计规范在第 09 课展开。\n\n### 07.1 EDA 软件是什么、主流软件对比\n\nEDA（Electronic Design Automation，电子设计自动化）软件覆盖\"从电路到板子\"的全部数字化工作：原理图绘制、电路仿真（部分软件）、封装库管理、PCB 布局布线、设计规则检查（DRC）、生产文件输出。你可以把它理解为\"电路界的 CAD + 办公全家桶\"。\n\n主流软件对比：\n\n| 软件 | 背景 | 费用 | 生态 | 学习曲线 | 行业使用 |\n|---|---|---|---|---|---|\n| 立创EDA | 立创商城 | 免费 | 与商城元件库/下单打样打通，中文资料多 | 平缓 | 国内爱好者、教学、中小团队 |\n| Altium Designer（AD） | Altium | 商业收费 | 教程最多、功能全面 | 中等 | 国内消费电子、中小企业主流 |\n| KiCad | 开源社区 | 免费开源 | 国外社区活跃、官方库完善 | 中等 | 开源硬件、不少国外公司 |\n| PADS | Siemens EDA（原 Mentor） | 商业收费 | 高速设计与仿真生态强 | 中等偏缓 | 工控、通信、大型企业 |\n\n选择建议：\n\n- 目标就业国内电子行业：**主修 Altium Designer**，辅看立创EDA。可按岗位及设备选择 AD、KiCad 或立创EDA；工具的具体操作以对应版本手册为准\n- 兴趣党/想最快出板：立创EDA 起步最快，元件库一键导入，下单打样无缝衔接\n- 好消息：四款软件的设计思想完全相通——都需要表达原理图、网络、封装和 PCB 之间的关系。迁移时还需重新学习库、规则、文件和协作流程，不只是换快捷键\n\n初学者最常问的三个问题：\n\n- **问：要不要两款都学？** 答：不要。先用一款画完第 09 课的完整项目，再考虑第二款；换软件的成本远比想象低。\n- **问：公司用 PADS，我学 AD 白学了吗？** 答：不白学。布局布线的\"思路\"是通用的，软件只是工具，面试考的也是思路。\n- **问：老电脑带不动 AD 怎么办？** 答：立创EDA 对配置要求低，浏览器即可用，功能足够完成本阶段全部练习。\n\n### 07.2 软件安装\n\n#### 07.2.1 Altium Designer\n\n- 系统要求：Windows 10/11 64 位；内存建议 16GB 起，显卡支持 OpenGL（经验配置；大板更吃资源）\n- 版本建议：选近三年的稳定版本。新版本功能新但教程少，太老的版本缺新特性——原则是\"选你能找到配套教程的版本\"\n- 获取渠道：官网下载安装包，按学校/公司/个人订阅情况合规使用正版（学生有教育优惠渠道，可搜索 \"Altium 教育版\"）\n- Mac 用户注意：AD 无原生 Mac 版。方案：Windows 虚拟机/远程主机，或改用 KiCad、立创EDA（浏览器即用）\n\n#### 07.2.2 立创EDA\n\n- 标准版和专业版是不同产品版本；专业版既有网页版也有客户端。可按设备、功能与项目协作选择，版本间数据迁移方式见[专业版官方说明](https://prodocs.lceda.cn/cn/introduction/introduction/)。\n- 官网注册账号后免费使用，工程可云端保存\n- 最大优势：直接调用立创商城元器件（可能包含原理图符号、封装和 3D 模型，仍需逐项核对器件资料），画完即可下单\n\n#### 07.2.3 安装后的基础设置\n\n- 单位切换：AD 中按 Q 键在 mil/mm 之间切换。国内板厂多用 mm，老工程师习惯用 mil，你两种都要能读（1mil ≈ 0.0254mm，20mil ≈ 0.5mm）\n- 栅格（Grid）：原理图可视栅格 100mil；PCB 布局栅格 0.5mm 级、布线栅格 0.05~0.1mm 级（经验值，先照抄，后面理解）\n- 层颜色：用默认即可。关键是认层名而不是认颜色——换一台电脑颜色可能就不一样了\n- 自动备份：AD 在设置里可开自动保存（默认间隔较短即可），立创EDA 有云端历史版本——但都替代不了手动另存版本的习惯\n- 显示与卡顿：画面卡顿时可关掉不必要的层显示（如 3D 模式、网络高亮），笔记本建议插电使用\n\n### 07.3 界面认识与基本操作\n\n#### 07.3.1 工程结构与三种文件的关系\n\nAD 中一个典型工程的文件构成：\n\n- xxx.PrjPcb —— 工程文件（相当于\"文件夹\"，管理下面所有文件）\n- xxx.SchDoc —— 原理图文件（电路的逻辑连接）\n- xxx.PcbDoc —— PCB 文件（物理实现）\n- xxx.SchLib / xxx.PcbLib —— 原理图符号库 / PCB 封装库\n\n一句话讲清关系：**原理图描述\"电路在逻辑上怎么连\"，封装描述\"元件在板上长什么样\"，PCB 文件是两者结合后的物理板**。原理图到 PCB 之间靠\"网表（Netlist）\"传递——它是一张\"谁和谁该连通\"的清单。\n\n立创EDA 对应概念：工程 → 原理图 → PCB → 元件库，一一对应，只是文件后缀不同。\n\n#### 07.3.2 常用快捷键（Altium Designer）\n\n先记住\"高频十条\"，其余用到再查：\n\n| 快捷键 | 环境 | 功能 |\n|---|---|---|\n| P → W | 原理图 | 放置导线（Wire） |\n| P → P | 原理图 | 放置元件（Part） |\n| P → N | 原理图 | 放置网络标号（Net Label） |\n| Space 空格 | 通用 | 旋转选中对象 90° |\n| Tab | 放置中 | 修改正在放置对象的属性 |\n| P → T | PCB | 交互式布线（走线） |\n| P → G | PCB | 铺铜（Polygon Pour） |\n| Ctrl + M | PCB | 测量距离 |\n| Q | PCB | mil / mm 单位切换 |\n| V → F | 通用 | 视图缩放至适合全部（图丢了就按它） |\n\n补充：布线中按小键盘 * 或 +/- 切换信号层，会自动放下过孔；Shift+R 循环切换布线推挤模式（绕开/推挤障碍物）。\n\n立创EDA 用户：功能集中在顶部菜单与右侧属性面板，快捷键可在设置中自定义，入门阶段直接用菜单即可。\n\n第二组\"操作习惯类\"快捷键，同样高频：\n\n| 快捷键 | 环境 | 功能 |\n|---|---|---|\n| Ctrl + Z / Ctrl + Y | 通用 | 撤销 / 重做 |\n| Shift + S | PCB | 单层显示模式（只看当前层，查线神技） |\n| 3 / 2 | PCB | 切换 3D / 2D 视图（3D 里检查元件干涉） |\n| E → O → S | PCB | 设置相对原点（Edit » Origin » Set，需英文输入法；重置为 E → O → R） |\n| G | PCB | 弹出捕获栅格菜单（新版 AD；循环切换是 Shift+G） |\n| X / Y | 原理图放置中 | 水平 / 垂直镜像 |\n\n记快捷键的方法：一次只记两三个，用到顺手了再加下一批。把快捷键表打印出来贴在显示器边上，是很多工程师的真实做法。\n\n#### 07.3.3 原理图环境实操\n\n画一张\"电源 + 限流电阻 + LED\"原理图的标准动作：\n\n1. 新建工程，添加原理图文件\n2. 放置元件：在库面板搜索并放置电阻、LED；放置电源端口（VCC 与 GND 符号）\n3. 连线：P → W 从引脚拖到引脚；在需要连接的位置放置或确认节点（Junction）；交叉线是否相连以软件网络高亮与电气检查为准\n4. 放网络标号：连接较远或跨页的网络用 P → N 打标签（如 +5V、LED_OUT），同名标签是否跨页相连取决于其作用域及软件设置；用网络高亮或网表核对\n5. 分配位号：用\"注释（Annotate）\"功能把 R?、D? 自动编号成 R1、D1\n6. 检查：编译工程（Compile），看 Messages 面板的错误与警告（如引脚悬空）\n\n网络命名规范（从第一张图就养成）：\n\n- 全大写、无空格、无中文：+5V、3V3、USB_DM\n- 电源网络带电压信息：5V、3V3、1V8，一眼识别电压\n- 控制信号带方向或用途后缀：LED_EN、UART_TX、KEY1\n- 地网络统一 GND；确需区分时用 AGND/PGND（第 10 课会用到）\n- 命名规范的网络，能让原理图、PCB、调试记录三者对得上话\n\n新手必懂概念：**网络（Net）= 一组该连在一起的引脚**。原理图的本质工作就是定义网络——这是理解后面一切（网表、飞线、DRC）的钥匙。\n\n#### 07.3.4 PCB 环境实操\n\n1. 从原理图导入网表：AD 中 Design → Update PCB Document，确认变更后，元件带着\"飞线（Ratsnest，指示该连未连的细线）\"堆在板框外\n2. 认识层（Layer）——先认这 6 类（展开就是下表的 10 个层）：\n\n| 层 | 名称 | 用途 |\n|---|---|---|\n| Top / Bottom Layer | 顶/底层信号层 | 走线、焊盘 |\n| Keep-Out Layer | 禁布层 | 限制器件或铜线放置；板框的定义和绘制层按软件及输出流程确认 |\n| Mechanical | 机械层 | 装配尺寸、工艺说明 |\n| Top/Bottom Overlay | 丝印层 | 白色位号、极性、外框 |\n| Top/Bottom Solder Mask | 阻焊层 | 绿油开窗（露出焊盘） |\n| Top/Bottom Paste | 锡膏（钢网）层 | 定义贴片锡膏印刷开孔 |\n\n3. 画板框：用当前 EDA 的板框定义功能建立闭合外形；禁布边界不必然等于生产板框。导出后在 Gerber 查看器核对板边\n4. 走线：P → T，点一根飞线连到另一端（本课随便走，规范在第 09 课讲）\n5. 过孔：走线中按 * 切换到另一层，自动生成过孔（via）——贯穿板层的小铜柱\n6. 铺铜：P → G 拉一个覆盖全板的矩形，网络选 GND——这块板\"地平面\"的雏形就有了\n7. 3D 检查：按 3 进入 3D 视图拖动旋转，直观看到元件是否摆反、是否相互干涉；按 2 返回 2D\n8. 保存纪律：随手 Ctrl+S；重要节点用\"另存为\"留版本档案，改坏了能回退\n\n#### 07.3.5 原理图 vs PCB 环境的分工\n\n| | 原理图环境 | PCB 环境 |\n|---|---|---|\n| 关心什么 | 电气连接对不对 | 物理位置、线宽间距够不够 |\n| 主要对象 | 符号、网络 | 焊盘、走线、过孔、铺铜 |\n| 检查工具 | 编译（ERC） | 设计规则检查（DRC） |\n\n按软件的变更清单同步原理图与 PCB；同步方向和可回写的内容取决于软件及操作；养成\"原理图为准、改动先改原理图再同步\"的习惯，避免两边对不上。\n\n**原理图操作与检查的通用顺序**\n\n建立工程并确定器件 → 放置符号和位号 → 按电路连接导线及网络标签 → 标记明确不使用的引脚 → 检查电源、引脚类型和网络 → 给每个器件匹配并核对封装 → 更新 PCB。连线必须落在引脚电气连接点，线条交叉是否连接要看连接点和软件显示；图形线、文字注释本身不产生电气连接。不同软件可能把原理图检查叫 ERC 或原理图 DRC，检查结果必须结合电路复核。\n\n[嘉立创 PCB 设计教程](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/pcb-design.html)可用于对照立创 EDA 的界面和操作；菜单名称、云端功能及版本区别以所用软件当前文档为准。\n\n**立创 EDA 对照练习：从电路意图到可检查的 PCB**\n\n以本课 RC 低通为例，在所用版本中新建工程和原理图；放置电阻、电容、输入排针及输出测试点，为每个器件指定值、唯一位号和候选封装。将 J1 一脚作为输入、另一脚作为地，R1 接输入与 LP_OUT，C1 接 LP_OUT 与地，TP1 接 LP_OUT。用电气导线连接引脚，查看连接点；网络标签用来命名电气网络，装饰线和文本不会产生连接。\n\n完成原理图检查后，查看警告对应的实际网络：未用脚应明确处理，电源输入、无驱动网络或引脚类型提示需结合真实电路判断；不为消除警告随意更改电气属性。导入或更新 PCB 时阅读变更列表，检查位号、网络和封装；确认外形尺寸，预留插接与测试空间，再按板厂约束进行布局布线。修改原理图后重新同步并检查差异，不能只在 PCB 上改网络。\n\n绘制板框、铺铜、生成钻孔和输出生产文件的具体菜单会随立创 EDA 版本变化；按所用版本的官方帮助操作。课程提供的是可验证的动作与结果，不把某个界面菜单截图当成永久步骤。练习板还要核对器件额定值、网络、DRC 和生产文件后才能考虑制作。\n\n### 07.4 元器件库的查找与使用\n\n库的来源，按优先级排：\n\n1. **官方自带库**：AD 安装时自带大量通用库（如 Miscellaneous Devices），电阻电容、接插件、二极管三极管最常用\n2. **立创商城库（强烈推荐）**：在立创EDA 中搜索型号 → 一键\"复制\"该元件 → 导出为 Altium 格式 → 在 AD 中导入使用。可能提供符号、封装和 3D 模型；引脚、尺寸和所选实物仍须对照原厂资料\n3. **第三方库平台**：SnapEDA、Ultra Librarian 等提供各大芯片厂商官方符号与封装（搜索\"平台名 + 芯片型号\"）\n4. **自建库**：查不到、或要求严格时必须自建——这是第 09 课的重点，也是招聘方最看重的基本功之一\n\nAD 中安装库的操作路径：Components 面板 → 面板右上角下拉 → File-based Libraries → Install From File，选中库文件（.IntLib / .SchLib / .PcbLib）即可；也可以直接把库文件加入工程（工程树右键 → Add Existing Document），让它跟着工程走。\n\n拿到第三方封装后的验证三步：\n\n1. 对照目标器件的推荐焊盘图检查焊盘中心距、尺寸及公差；若只有器件引脚尺寸，还应结合装配工艺计算焊盘，不能默认统一误差阈值\n2. 检查 1 脚标识、极性标识是否齐全正确\n3. 放一个器件到 PCB 里目检丝印与焊盘的关系（丝印不压焊盘）\n\n使用纪律（从今天养成）：\n\n- 每个工程挂自己的库文件，不依赖别人电脑上的库——\"换台电脑文件打不开\"的根源就是库没跟着工程走\n- 用过的元件按\"厂商_型号\"命名存入自己的库，日积月累成\"私人武器库\"\n- 下载的第三方封装，用之前必须对数据手册核一遍焊盘（第 09 课教核对方法）\n\n### 07.5 综合小练习：RC 电路从原理图到 PCB\n\n先在仿真中理解同一组 1kΩ、100nF 元件的电气行为，再依下图绘制原理图；仿真中的信号源不属于 PCB 元件。\n\n```circuitjs\nrc-lowpass-1592\n```\n\n图中 J1-2 为公共地（连接各 GND 符号）。本图选 1kΩ、100nF，与第 06 课练习对应，可用于下方绘图练习。\n\n```svg\n<svg role=\"img\" aria-label=\"RC低通电路：输入经电阻到输出，输出经电容接地\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"129.84pt\" width=\"334.28299999999996pt\" viewBox=\"-86.15799999999999 -138.20000000000002 334.28299999999996 129.84\"><path d=\"M 0.0,-108.0 L 18,-108 L 36,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-108.0 L 54,-108 L 54,-117 L 90,-117 L 90,-99 L 54,-99 L 54,-108 M 90,-108 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 144,-108 L 180,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-75.24 M 117,-75.24 L 99,-75.24 M 117,-68.76 L 99,-68.76 M 108,-68.76 L 108,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-21.6 L 99,-21.6 L 117,-21.6 M 101.7,-17.28 L 114.3,-17.28 M 106.2,-12.96 L 109.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-61.199999999999996\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-61.199999999999996\" dy=\"13\">J1-1 输入<\/tspan><\/text><text x=\"72.0\" y=\"-133.60000000000002\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">R1 1kΩ<\/tspan><\/text><text x=\"201.6\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"201.6\" dy=\"13\">LP_OUT / TP1<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">C1 100nF<\/tspan><\/text><circle cx=\"108\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n用下面的练习把操作串成一条线，先学清流程，再按第 09 课核对设计和制造条件：\n\n1. 新建工程 L05_Practice，添加原理图与 PCB 文件\n2. 放置元件：电阻 R1、电容 C1、一个 2P 输入排针 J1 和一个输出测试点 TP1\n3. 连线构成 RC 低通结构：J1 输入 → R1 → 输出节点 → C1 到地；J1 另一脚接 GND\n4. 在输出节点接 TP1 并标记 LP_OUT；输入信号与地接 J1，不要无依据将交流输入直接标为 +5V\n5. 自动编号、编译，确认无错\n6. 导入 PCB，画一个 30mm × 20mm 的板框\n7. 摆开元件，P → T 走通所有飞线，中途换一次层体验过孔\n8. P → G 给整板铺 GND 铜\n9. 按 3 看一眼 3D，按 Ctrl+M 量板框尺寸是否是 30mm\n10. 保存工程，把这 10 步整理成自己的操作笔记\n\n这个流程就是第 09 课九步流程的\"迷你彩排\"——操作顺了，第 09 课就能专注学规范。\n\n### 07.6 Allegro 与 PADS：什么时候需要学\n\n07.1 的对比表里有立创EDA、AD、KiCad、PADS 四款，还有一位重量级选手没有出场：Cadence Allegro。这两款商业软件在招聘 JD 里出镜率很高，这里专门补齐它们的定位，并回答新手高频问题——\"要不要都学\"。\n\n#### 两款软件的定位对比\n\n| 软件 | 厂商 | 定位 | 典型用户 | 学习曲线 | 操作风格 |\n|---|---|---|---|---|---|\n| Cadence Allegro | Cadence | 高端高速板、高密度大型板的事实标准 | 大厂（通信、服务器、手机）、专业 PCB 设计公司 | 陡峭 | 图形界面与可配置脚本结合，约束驱动设计 |\n| PADS | Siemens EDA（原 Mentor） | 中端主力，常规板到中等高速板 | 消费电子、中小公司、部分工控 | 中等偏缓 | 图形界面菜单为主，上手快 |\n\nAllegro 的两个标签：\n\n- **大厂高端板主流**：十几层的服务器主板、密度极高的手机主板，很多出自 Allegro；它的约束规则系统（Constraint Manager）极为强大，阻抗、等长、时序规则能精确管到每一根网络\n- **学习曲线陡**：需要熟悉命令、界面、约束与库结构（焊盘 Padstack 可独立管理）——入门比 AD 痛苦不少，但天花板也更高\n\nPADS 的两个标签：\n\n- **消费电子与中小公司常见**：规格介于\"入门级\"与 Allegro 之间，常规 4~8 层板加中等高速需求都能胜任\n- **上手快**：整体逻辑与 AD 接近（原理图 Logic → PCB Layout → 库），从 AD 迁移通常一两周即可开工\n\n#### 要不要都学？\n\n**不要。** 先用一款走完 2 层板 → 4 层板 → 8 层板的完整进阶，把叠层、阻抗、等长、电源完整性这些\"设计内功\"练扎实。入职后根据公司工具和项目复杂度逐步迁移——**软件只是工具，设计思维才是核心**，迁移时仍要学习新软件的库、约束和协作流程。面试官问的是\"你的叠层怎么设计、等长怎么处理\"，而不是\"你按的是哪个快捷键\"。\n\n#### 迁移学习法：概念映射表\n\n换软件时不要从零学，而是做一张\"概念映射表\"——把旧软件里已掌握的概念，挨个找到新软件里对应的名字，迁移效率翻倍：\n\n| 概念 | Altium Designer | 立创EDA | PADS | Allegro |\n|---|---|---|---|---|\n| 原理图传到 PCB | Update PCB | 原理图转 PCB | 原理图同步（ECO） | 生成网表再导入 |\n| 封装库 | .PcbLib | 元件库三件套 | 封装 Decal + 焊盘 | 焊盘 Padstack 与封装 Symbol 分离 |\n| 设计规则 | PCB 规则与约束 | 设计规则面板 | 校验规则（Setup） | 约束管理器 Constraint Manager |\n| 布线命令 | 交互式布线 P→T | 布线工具 | 走线 Route | add connect |\n| 铺铜 | Polygon Pour | 铺铜 | 灌铜 Flood | 铺铜 Shape |\n\n（表内名称为常见叫法，随软件版本有差异，以各软件官方文档为准。）\n\n迁移的实操打法：挑一块你画过的旧板子，在新软件里重画一遍——封装重建、规则重设、布局布线重来。一块板下来，新软件的\"肌肉记忆\"就建好了。\n\n#### 延伸搜索\n\n- B 站搜索关键词：\"Allegro 入门教程\"、\"Allegro 约束规则 设置\"、\"PADS Layout 教程\"、\"PADS Logic 教程\"、\"AD 转 PADS\"\n- 了解即可，不必现在安装：两款均为商业收费软件，个人学习成本高，等明确需要（公司要求、项目需要）再上手不迟\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 安装软件并完成基础设置 | 选定的软件能正常新建工程；按该版本说明切换并确认单位 |\n| 2 | 熟悉界面 | 不看笔记说出 5 个高频快捷键的功能 |\n| 3 | 画 LED 原理图 | 电源端口 + 限流电阻 + LED 完整连接，编译 0 错误 |\n| 4 | 导入 PCB 并体验 | 网表成功导入；画板框、走 2 根线、打 1 个过孔、GND 铺铜各完成一次 |\n| 5 | 库操作 | 从官方库和立创商城库各获取 1 个元件并用进原理图 |\n| 6 | 建立私人库雏形 | 按所选软件创建符号和封装库，放入第一个已核对的元件 |\n\n## ✅ 自测清单\n\n- [ ] 能说清 EDA 软件在 PCB 设计全流程中的位置\n- [ ] 能对比四款主流软件并说明自己的选择理由\n- [ ] 能说出 .PrjPcb / .SchDoc / .PcbDoc / .SchLib / .PcbLib 各自含义\n- [ ] 能解释\"网表\"是什么、原理图和 PCB 靠什么联系\n- [ ] 熟练使用所选软件的连线、标号、测距和单位切换操作（快捷键随软件版本不同）\n- [ ] 能独立完成\"放元件 → 连线 → 网络标号 → 自动编号 → 编译检查\"全流程\n- [ ] 能列出至少 6 个 PCB 层的名称与用途\n- [ ] 知道飞线（Ratsnest）表示什么\n- [ ] 能按所选软件导入元件库，并对照器件手册核对符号和封装\n- [ ] 能说出私人库的两条使用纪律（工程挂载、命名规范）\n\n## ⚠️ 新手常见坑\n\n1. **看着连上了，其实没连上**：导线端点没落在引脚的电气点上（栅格不对齐，或误用绘图直线 Line 代替导线 Wire）。对策：画完跑编译看悬空警告；记住两条导线交叉有节点才连通。\n2. **网络标号不一致**：\"5V\"与\"5v\"、多一个空格，就是两个不同的网络。统一命名风格（建议全大写、无空格）。\n3. **网表导入报\"找不到封装\"**：元件没挂封装，或库没安装、没加入工程。导入前逐个确认元件的 Footprint 属性非空。\n4. **单位混乱**：mil 和 mm 差 39 倍。8mil 是常见信号线宽，8mm 是\"高速公路\"。动工前先按 Q 看清当前单位。\n5. **板框画错层**：画在丝印层或信号层，板厂可能识别不了外形。使用 EDA 的板框定义功能，并按板厂要求导出外形；禁布层或机械层图形不一定自动成为生产板框。\n6. **高版本文件低版本打不开**：协作或存档时统一软件版本，必要时导出低版本兼容格式。\n\n## 📚 延伸学习\n\n- B 站搜索关键词：\"Altium Designer 入门教程\"、\"立创EDA 专业版 教程\"、\"AD 快捷键 速记\"、\"原理图绘制规范\"\n- 官方资源：Altium 官网文档与视频教程（搜索 \"Altium documentation\"）、立创EDA 官方教程中心与社区论坛\n- 跟练项目：搜索 \"AD 画 51 最小系统 教程\"，完整跟一遍\"原理图 → PCB\"流程（电路暂时不懂没关系，先练操作手感）\n- 学习节奏建议：完成安装与设置后，反复练习\"画、导、走、铺\"——操作熟练度只有靠重复","taskSignature":"472132712291fae6911918806bec203478bc04a54c6c433655f9dd7758fc794b","taskCount":10},{"id":"08","title":"第 08 课 · 焊接与返修实操","short":"焊接与返修实操","stage":2,"diff":2,"prev":"基础安全可先阅读；第 09 课首板制作前学习基础焊接，返修部分结合后续项目","optional":false,"md":"## 🎯 本课目标\n\n1. 配齐一张规范焊接工位，说得出每样工具的用途、参数与适用场景；\n2. 掌握插件件三步法、贴片两步法、QFP 拖焊与 QFN 底部散热焊盘处理，能结合焊料和工艺要求进行目检；\n3. 会用热风枪、吸锡带完成拆片、焊盘清理与焊盘/走线修复（飞线）；\n4. 理解 BGA 为什么难返修、返修台如何工作，能判断\"是不是 BGA 的问题\"，知道何时送专业返修公司；\n5. 按\"复现→定位→拆换→复测→记录\"流程完成一块不良板返修并填写返修记录表；\n6. 养成通风、焊后洗手、防静电、防烫伤的操作习惯。\n\n**术语速查（中英对照）**：拖焊 drag soldering ｜ 助焊剂 flux ｜ 焊锡丝 solder wire ｜ 锡膏 solder paste ｜ 吸锡带 desoldering wick ｜ 拆焊 desoldering ｜ 返修 rework ｜ 飞线 jumper wire ｜ 植锡网 reballing stencil ｜ 植球 reballing ｜ 虚焊 cold joint ｜ 连锡（锡桥）solder bridge ｜ 立碑 tombstoning\n\n## 📖 正文\n\n先学本课的工位安全、插件和基础贴片焊接，再用于第 09 课的简单板。QFP、拆焊和返修可在第 14 课项目或后续实践中继续学习。\n\n### 08.1 工具台：先认识你的武器\n\n先看完整工位清单，后面小节逐个展开：\n\n| 工具 | 主要用途 | 优先级 |\n|---|---|---|\n| 恒温电烙铁 + 备用烙铁头 | 焊接、补焊、吸锡带加热 | ★★★ 必备 |\n| 热风枪（拆焊台） | 拆/装贴片件与 IC | ★★★ 必备 |\n| 镊子（直头 + 弯头） | 夹持定位贴片件 | ★★★ 必备 |\n| 助焊剂（笔式/膏式） | 提升润湿、拖焊救星 | ★★★ 必备 |\n| 锡丝（含铅/无铅各一卷） | 手工焊接 | ★★★ 必备 |\n| 吸锡带、吸锡器 | 清理焊盘、退插件孔 | ★★★ 必备 |\n| 放大镜台灯/显微镜 | 目检焊点 | ★★ 强烈建议 |\n| 高温胶带、铝箔 | 热风拆片时保护周围元件 | ★★ 强烈建议 |\n| 防静电腕带、吸烟仪 | 安全健康 | ★★ 强烈建议 |\n| 锡炉 | 批量插件退锡/上锡 | ★ 了解即可 |\n\n#### 08.1.1 电烙铁：恒温 + 对口的烙铁头\n\n选**恒温（温控）电烙铁**。关键指标不是功率而是回温速度：焊大焊盘时烙铁头温度会被\"吸走\"，回温慢的烙铁焊着焊着就\"焊不动\"了。功率、烙铁头形状和热响应需匹配焊点与板材，不能仅凭功率保证覆盖所有作业；老式\"插电直热式\"烙铁温度随负载大幅漂移，不建议用于贴片。\n\n**烙铁头型号怎么选：**\n\n| 烙铁头类型 | 形状特点 | 适用场景 |\n|---|---|---|\n| IIS / 细尖头 | 尖细、传热集中 | 0603/0402 小焊盘、IC 单脚补焊、修连锡 |\n| 刀头（K 型） | 刃口宽、储热大 | QFP 拖焊、多引脚同时加热、粗导线上锡 |\n| 斜面头（B/C 型小斜面） | 接触面适中，万金油 | 插件件、0805 等常规焊点 |\n\n**温度设置参考表**（经验值，具体以所用焊锡丝规格书与烙铁说明书为准）：\n\n| 焊接对象 | 参考温度 | 说明 |\n|---|---|---|\n| 含铅锡丝（Sn63Pb37）常规焊点 | 300~330 °C | 熔点约 183 °C，留足过热余量 |\n| 无铅锡丝（SAC305 等）常规焊点 | 350~380 °C | 熔点约 217 °C，温度不足必出\"豆腐渣\"焊点 |\n| QFP 拖焊（无铅） | 360~380 °C | 需持续熔锡，回温差的烙铁拖到一半就凝固 |\n| 大面积地焊盘 / 粗引脚 | 依焊料、焊台及板材调试 | 优先改善烙铁头接触和预热，避免无依据地提高温度或延长加热 |\n\n**保养口诀：用完挂锡再上架。** 烙铁头在高温下裸露会快速氧化发黑（俗称\"烧死\"），烧死的头不挂锡、传热差。每次用完在铜丝清洁丝上蹭几下，再挂一层新鲜锡保护镀层。湿海绵擦头别太勤——温度骤缩骤胀伤镀层。\n\n烙铁头已经轻度氧化时的抢救步骤：\n\n1. 按烙铁头厂商说明，使用适合的清洁工具或活化剂，避免用砂纸打磨破坏保护镀层；\n2. 在合适温度下清洁后重新挂锡；\n3. 仍不能润湿时更换烙铁头，避免反复高温损伤焊盘。\n\n#### 08.1.2 热风枪：风温 + 风量双旋钮\n\n热风枪靠热风整体加热焊点，用于拆装贴片件。两个旋钮要一起调：**风温决定锡是否熔化，风量决定热量传给谁**——风量过大，0402 会整颗被吹飞。\n\n风嘴选择：小圆嘴（拆 0402~SOT 封装）、大圆嘴（拆 QFP/QFN/SOP）、扁嘴/屏蔽罩嘴（拆屏蔽罩、大连接器）。\n\n**拆片温度/风量经验表**（以设备说明书标称为准，先在废板上试）：\n\n| 拆卸对象 | 风温 | 风量 | 加热时间参考 |\n|---|---|---|---|\n| 0402/0603/0805 | 300~330 °C | 低档（1~3 档） | 5~10 s |\n| SOT-23 / SOT-89 | 320~340 °C | 中低档 | 10~15 s |\n| QFP / SOP / QFN | 330~360 °C | 中档 | 30~60 s，画圈均匀加热 |\n| 屏蔽罩 / 大连接器 | 350~380 °C | 中高档 | 60 s 以上，注意烫伤周围塑料件 |\n\n补充两点：一是拆**双排/四排引脚的连接器、屏蔽罩**这类大热容器件时，可在引脚区预涂助焊剂帮助传热，时间宁可靠表的下限慢慢试，别一步到位开高温；二是拆**排线座、SIM 卡座**等带塑料件的器件，塑料软化温度比锡低得多，必须用最低可行温度+最短时间，拆下后检查塑体有无变形再决定是否复用。\n\n#### 08.1.3 吸锡带与吸锡器\n\n- **吸锡带（desoldering wick）**：浸过助焊剂的编织铜带，贴在焊盘上用烙铁加热，熔化的锡被毛细作用\"吸\"进带里。用于清理贴片焊盘、拆 IC 后清残锡。\n- **吸锡器（吸锡枪）**：手动真空泵，先加热熔化插件焊点的锡，再按按钮把液态锡抽走。用于插件孔退锡、拆卸直插元件。\n\n#### 08.1.4 镊子：直头与弯头\n\n直头镊子用于夹持元件放入焊盘；弯头镊子俯视操作时手不挡视线，适合在放大镜下做精细定位。选防静电型号，夹尖端要能紧密闭合、无错位。\n\n#### 08.1.5 焊料与助焊剂：含铅 vs 无铅\n\n| 对比维度 | 含铅 Sn63Pb37 | 无铅 SAC305 |\n|---|---|---|\n| 熔点 | 约 183 °C | 约 217 °C |\n| 手感 | 润湿快、光泽亮、好上手 | 需要更高烙铁温度，润湿慢 |\n| 健康/法规 | 含铅，废弃按当地要求处理 | 是否符合 RoHS 取决于成分及适用豁免；量产要求按产品法规和工艺确认 |\n| 练习建议 | 新手找手感可以先用 | 最终要按工厂标准练无铅 |\n\n**助焊剂（flux）**是手工焊接的\"外挂\"：去掉氧化层、降低表面张力。免洗型笔式助焊剂日常够用；拖焊、拆 QFN 时用膏状助焊剂更持久。**锡膏**是焊料粉与助焊剂的混合物，可按工艺用于印刷与返修。储存温度、回温时间、开封寿命和搅拌方式应遵循具体产品说明，不同锡膏要求不同。\n\n锡膏使用注意：按产品要求密封保存和回温，避免冷罐开盖结露；依说明决定是否搅拌，并记录开封时间和可使用期限。过期或受污染的锡膏不能继续使用。\n\n#### 08.1.6 锡炉与放大设备\n\n**锡炉**是一锅熔化的锡，把成排引脚插进去一次完成上锡或退锡，量产插件线常用，学习阶段了解即可。**放大镜台灯**（5~10 倍）用于日常目检；**体视显微镜**（7~45 倍连续变倍）检查 0402、QFN 焊点和修连锡时几乎是必需品——很多虚焊肉眼根本看不出来。\n\n**基础练习的完整过程**\n\n先确认工位通风、工具状态、器件型号及极性；在废板或练习板上按“清洁焊盘 → 固定元件 → 加热焊盘和引脚 → 送适量焊料 → 撤离并等待凝固 → 放大检查”的过程练习。贴片件可先固定一端、确认对齐后再焊另一端；插件件要确保器件贴合且引脚受热充分。出现连锡时先断电，使用适当助焊剂和吸锡带处理，避免拉扯焊盘。\n\n验收时检查方向、对齐、润湿、桥连、少锡和焊盘损伤，并结合电路做断电连通检查；外观良好不等于电气可靠。返修采用适合器件与板材的温度和时间，先在废板练习。原资料的工具与工序可参考 [电子焊接训练](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/welding-training.html)。\n\n### 08.2 手工焊接基本功\n\n先立一条总原则：**焊点是\"加热被焊面、让锡自己流上去\"形成的，不是把锡抹上去粘住的。** 烙铁同时加热引脚和焊盘两个被焊面，锡送到位后靠润湿作用铺开——理解了这句，下面所有手法都只是它的变体。\n\n#### 08.2.1 插件件三步法\n\n1. **插装**：器件插正、贴板（或按工艺要求留 1~2 mm 应力间隙），弯脚固定防掉落；\n2. **加热**：烙铁头同时压住引脚与焊盘，接触 1~2 s，让两个被焊面一起升温；\n3. **送锡撤离**：在烙铁接触点送锡 0.5~1 s，见锡顺润湿角铺满焊盘后**先撤锡丝、后撤烙铁**，烙铁沿 45° 方向快速撤离，避免拉出锡尖。\n\n| ✔️ 正确手法 | ❌ 错误手法 |\n|---|---|\n| 烙铁同时压引脚 + 焊盘 | 只烫引脚或只烫焊盘，另一面没热，锡不流 |\n| 先撤锡、后撤铁，撤离干脆 | 锡丝和烙铁一起拽走，拉出毛刺锡尖 |\n| 加热 1~2 s 即送锡 | 长时间干烧焊盘，阻焊发白、焊盘翘起 |\n| 焊完目检：焊点呈裙状包裹引脚 | 焊点是个\"锡疙瘩\"盖在上面，一撬就掉 |\n\n检查外观时观察润湿、焊料量、桥连、引脚与焊盘；光亮或亚光均不能单独判定焊点可靠性。具体接受标准应结合焊料、封装、适用等级和检验规范。\n\n焊完全部引脚后再统一做收尾：剪掉过长的插件引脚（留 1~2 mm，剪口朝外防飞溅伤眼）；检查板底无锡珠散落；残留物是否清洗取决于助焊剂、板材、连接器及产品工艺；先查材料兼容性和清洗要求。若需清洗，使用指定清洗剂、断电操作并充分干燥后再测试。\n\n#### 08.2.2 贴片两步法：先吃锡，再定位\n\n1. **第一步——吃锡**：先在一个焊盘上熔一小颗锡珠（约焊盘大小的 1/3~1/2）；\n2. **第二步——定位补锡**：左手镊子夹元件按丝印方向放到焊盘上，右手烙铁熔化锡珠同时接触元件端头，元件被锡的表面张力\"吸\"到位后撤铁；再给另一端焊盘送锡补焊，补锡时烙铁轻碰元件端头与焊盘交界处。\n\n练习路线：先焊 0805 五十颗找手感，再降到 0603，0402 选做。**立碑**（元件一头翘起）多因两端加热不均——先焊端先凝固、后焊端回熔时把另一端拉起，手法要点是补焊第二端时动作快、别回头重熔第一端。\n\n从 0805 到 0603 的难点变化要心里有数：0603 本体小、镊子夹持更容易打滑，锡珠也要相应减半；0402 则连\"看清端头是否润湿\"都需要放大镜，送锡几乎不能直接碰到元件，全靠焊盘上的锡量控制。逐级练的意义就是让每个动作的\"分辨率\"提上去。\n\n| ✔️ 正确手法 | ❌ 错误手法 |\n|---|---|\n| 一端定位、一端补焊，两步走 | 两端同时送锡，元件被夹在中间对不准 |\n| 锡量以能看到元件端头轮廓为准 | 锡堆成山，元件\"淹死\"看不见方向 |\n| 镊子轻压元件中部定位 | 镊子戳元件边缘，一压就飞 |\n| 发现位置歪：重熔单端微调 | 冷态硬拨元件，端头脱落报废 |\n\n#### 08.2.3 QFP 拖焊五步法（补细节版）\n\n第 14 课焊 STM32（LQFP48）时走过一遍流程，这里补足手法参数——拖焊是\"助焊剂的表演，锡只是配角\"：\n\n1. **对角定位**：烙铁熔锡先固定对角两个引脚，显微镜/放大镜下确认四方引脚均落在焊盘中央，歪了就重熔对角微调；\n2. **涂助焊剂**：引脚区整体薄涂一层膏状助焊剂，量以\"覆盖引脚、能看见引脚轮廓、不汪成水洼\"为准——太少拖不动，太多锡乱跑；\n3. **刀头挂锡**：刀头清洁后在锡丝上蘸一下，刃口挂一层薄锡，不是挂一大滴；\n4. **拖焊**：刀头刃口平贴引脚，与芯片边呈 30~45° 夹角，从引脚根部向尖端方向、以 2~5 mm/s 匀速一次性拖过整边，中途不停顿、不回拖；\n5. **检查补焊**：放大镜下逐脚检查，发现连锡就在该处补点助焊剂再用刀头轻拖一次——助焊剂激发表面张力，会把多余的锡\"带走\"收回到刀头上。\n\n| ✔️ 正确手法 | ❌ 错误手法 |\n|---|---|\n| 助焊剂足量、边涂边拖 | 干拖（无助焊剂），越拖越桥连 |\n| 匀速一次拖完一边 | 反复来回蹭，把成型焊点搅成锡渣 |\n| 刀头与板面小角度贴引脚 | 刀头立起来\"戳\"引脚，勾弯引脚 |\n| 连锡靠助焊剂二次拖走 | 用尖头硬挑锡桥，挑断引脚 |\n\n补充：连锡修理三招（按顺序试）——\n\n1. **补助焊剂再拖**：在连锡处点一滴助焊剂，刀头轻挂薄锡慢拖一次，表面张力会把多余锡带走（成功率最高）；\n2. **尖头吸锡**：刀头清洁后不挂锡，用干净尖头点住锡桥，熔化后多余的锡会爬到尖头上被带走；\n3. **吸锡带定点**：细吸锡带盖住锡桥，加助焊剂后烙铁轻压一秒——只在锡桥很大时用，注意别带歪正常引脚。\n\n#### 08.2.4 QFN/DFN 底部散热焊盘处理\n\nQFN/DFN 的端子位于封装底面或侧边；部分器件带中央**裸露焊盘（EP）**。EP 的电气网络和散热要求因型号不同，必须查手册，不能默认接地。以下只说明工艺思路，量产或可靠性要求较高的板应按器件与装配工艺验证：\n\n1. 依器件和装配建议设计钢网开口及锡膏覆盖率；锡量过多可能顶起芯片，过少可能影响散热与焊接，不能简单认定越少越好；\n2. 散热过孔及其塞孔、盖油或开放方案应在 PCB 制造和装配前确定；按器件及板厂建议检查吸锡和空洞风险，不要在焊接时自行用锡堵孔；\n3. 芯片对准丝印框（第一脚方向务必核对），四周端子同样薄涂锡膏；\n4. 在练习板上按焊料、器件和设备要求控制预热与回流条件；表面张力可能帮助小幅对位，但不能代替正确放置和检查；\n5. 冷却后检查可见端子和桥连。底部焊点无法靠手感或一次功能测试确认可靠性；需要时按工艺使用 X-Ray 等检测，并结合电气测试和验收要求。\n\n#### 08.2.5 焊点缺陷速查表：自己给自己当质检\n\n练完每种手法，都要回到这张表自查。目检判据的完整版可参考 IPC-A-610（见延伸学习），下面是手工焊接最常见的七种缺陷：\n\n| 缺陷 | 外观特征 | 常见成因 | 对策 |\n|---|---|---|---|\n| 虚焊/冷焊 | 焊点发灰粗糙、锡与引脚有分界线 | 被焊面温度不够就送锡；烙铁只碰锡不碰板 | 重新加热补锡；调整烙铁接触位置 |\n| 连锡（锡桥） | 相邻焊点被锡短接 | 拖焊锡量过多、无助焊剂 | 按连锡修理三招处理 |\n| 锡尖（毛刺） | 焊点拉出尖刺 | 撤离烙铁太慢或方向不对 | 重熔后 45° 快速撤离 |\n| 立碑 | 片式元件一头翘起 | 两端加热不均 | 重熔两端复位；补焊第二端要快 |\n| 锡过量 | 焊点堆成球看不见元件端头 | 心里没底、怕不牢多送锡 | 吸锡带吸走部分残锡再补 |\n| 锡不足 | 焊点干瘪、覆盖不全 | 送锡时间过短 | 清洁后补锡 |\n| 焊盘剥离 | 焊盘边缘翘起/缺失 | 温度过高、加热过久、硬撬 | 按 08.3.3 焊盘修复流程处理 |\n\n判断口诀：**看轮廓、看润湿、看贴合**是初步检查；不同焊料的光泽可能不同，外观正常也不能单独保证电气和长期可靠性。接受标准以具体工艺和规范为准。\n\n**从练习板到检查记录**\n\n插件练习可按“核对器件与方向 → 固定 → 同时加热焊盘和引脚 → 送适量焊料 → 等待凝固 → 检查”进行。贴片练习先用镊子定位并固定一端，确认未偏移再焊另一端；QFP 先对准一脚和边界、固定对角，再检查引脚并逐步焊接。焊料成分、温度和工具不同，焊点外观会有差异，不能只凭是否光亮判定合格。\n\n出现桥连，可断电后用适量助焊剂与吸锡带清理，再检查相邻引脚是否导通和焊盘是否受损。拆卸时待焊料充分熔化再轻取器件，不强撬；清理后检查板铜、阻焊及相邻器件，再记录处理前后照片、方法和复测结果。热风枪、加热台与焊台的具体温度、预热和材料兼容性应按设备及元件资料确定；初学先在废板练习。\n\n### 08.3 拆焊与返修\n\n#### 08.3.1 热风枪拆片：温度曲线与保护\n\n1. **拍照**：拆前拍下器件方向（第一脚/极性标记）和周围环境，装回时对照；\n2. **保护邻居**：怕热元件（排线、塑料连接器、电解电容、邻近小元件）用**高温胶带**覆盖，大范围防热用**铝箔**弯个挡风罩；\n3. **设定参数**：按 08.1.2 经验表设风温风量，装对风嘴；\n4. **画圈加热**：风嘴距板 5~10 mm，对器件本体和引脚焊点做小圈匀速移动，别盯一点吹；\n5. **起撬时机**：用镊子轻推器件侧面——器件\"自己滑移\"的一瞬间立即夹走。没滑移就继续加热，**绝不能硬撬**：锡没全熔时撬，焊盘连铜皮一起被撕下来。\n\n| ✔️ 正确手法 | ❌ 错误手法 |\n|---|---|\n| 画圈均匀加热，推得动才起撬 | 锡未全熔就上镊子撬，焊盘连根拔起 |\n| 高温胶带/铝箔保护周围 | 裸吹，把旁边塑料座吹化、小元件吹飞 |\n| 拆下器件放金属托盘散热 | 拆下的芯片随手放桌上，烫坏桌面也烫手 |\n| 冷却到可安全操作后检查焊盘状态 | 忽略焊盘损伤，直接装新件 |\n\n#### 08.3.2 吸锡带清理焊盘\n\n拆完器件的焊盘上留着一层残锡，不平整就没法焊新件：\n\n1. 剪一段吸锡带，**先在吸锡带上加一滴助焊剂**（最容易被漏掉的一步，没有助焊剂铜带几乎不吸锡）；\n2. 干净的烙铁头隔著吸锡带压在焊盘上，感觉到锡\"嘶\"地熔入带中；\n3. 保持轻压，沿焊盘**缓慢拖动**，让吸饱锡的段落移走、新段落接上；\n4. 一段吸饱（发亮鼓起）就剪掉换新段，别反复用旧段\"刮\"焊盘。\n\n| ✔️ 正确手法 | ❌ 错误手法 |\n|---|---|\n| 加助焊剂、隔带加热、缓慢拖 | 干带直接压上去，吸不动就加大力气 |\n| 轻压拖动，让锡自己熔入 | 用力下压来回刮，铲掉焊盘露出基材 |\n| 吸饱就剪段换新 | 旧带反复刮，越刮越不吸 |\n\n#### 08.3.3 焊盘与走线修复\n\n返修中焊盘脱落、走线刮断很常见，修复规范如下：\n\n- **焊盘轻度翘边**：先停止加热并评估铜箔、基材和孔壁损伤；能否修复及使用何种修补材料应按返修规范和产品可靠性要求判断，不能直接压回就视为修好；\n- **焊盘整片脱落**：刮开焊盘末端走线的阻焊露出铜，先镀锡；取 0.1~0.2 mm 镀锡导线（漆包线去皮挂锡），一端焊在露铜处替代原焊盘，另一端直接上到器件引脚；过孔和孔壁受损时应评估层间连接及可修复性，不要直接穿线替代；\n- **断线飞线（jumper wire）规范**：走最短路径；避开高频线、差分线和天线区（见第 19 课信号完整性强化）；飞线两端焊点光亮饱满；跨过长距离用胶点固定，多根飞线并排理顺不交叉；修复完成后结合线长、表笔和被测路径核对通断及相邻网络绝缘；低阻读数不能单独证明高速、功率或可靠性要求合格。\n\n#### 08.3.4 植锡网与植球简介\n\n**植锡网（reballing stencil）**是一块与芯片焊球位一一对应的激光钢片。流程：清理芯片残锡焊盘 → 涂助焊剂膏 → 植锡网对位覆盖 → 刮锡膏填孔 → 热风回流成球 → 脱网检查。**植球（reballing）**指恢复封装底部焊球，可按工艺使用锡膏或预制焊球。这是 BGA/网格封装返修的标准前置工序，新手了解原理即可，精度靠设备，属于专业返修公司的日常。\n\n### 08.4 BGA 认知与返修\n\n#### 为什么 BGA 难\n\nBGA（球栅阵列）的焊点藏在封装底部，普通目检难以检查；装配加热要依器件和工艺控制。X-Ray 可帮助检查桥连、空洞等缺陷，但并不能可靠识别所有虚焊，仍需结合电气和其他检测方法（第 15 课 SMT 工艺一节有讲，这也是链第 16 课做测试验证前必须确认的一环）。\n\n#### 返修台（BGA rework station）工作原理\n\n三个核心部分：\n\n1. **底部预热**：红外或热风给整板预热到 100~150 °C，减小板面温差与变形（受热不均的 PCB 会像薯片一样翘曲，焊球随之断开）；\n2. **顶部热风喷嘴**：只对目标芯片局部加热，喷嘴形状与芯片匹配，热风在喷嘴内旋回，不吹偏周围元件；\n3. **光学对位系统**：分光棱镜让芯片与 PCB 焊盘两个影像重叠显示，人眼看\"十字线对齐\"后再贴装，解决\"焊点在底下看不见怎么对准\"的问题。\n\n整机跑的是**可编程温度曲线**：预热→恒温（活化助焊剂）→回流（峰值）→冷却，模仿回流炉的曲线，只是范围缩小到单颗芯片。\n\n#### 植球/重焊流程概述\n\n拆下不良 BGA → 清理 PCB 焊盘（吸锡带）→ 芯片植球（08.3.4）→ 光学对位贴装 → 曲线回流 → X-Ray 复检空洞率与连锡 → 功能测试。\n\n#### 新手建议：先学\"判断\"，再谈\"动手\"\n\nBGA 返修对温度曲线、对位精度、板变形控制要求极高，自学阶段用热风枪吹 BGA 的结局大概率是：板子吹鼓包、焊球内部连锡，一块主板直接报废。正确的目标是学会**判断\"是不是 BGA 的问题\"**：\n\n- 典型线索：摔落后不开机或故障时有时无可能涉及多种连接或器件问题；不要带电按压芯片、板面或焊球来判断。\n- 板级证据：供电、时钟、复位都正常，外围元件无损坏，唯独 CPU/存储器相关功能异常；\n- 进一步排查：由具备条件的人员结合 X-Ray、边界扫描、供电波形及其他测试；X-Ray 和功能测试各有盲区，不能凭单一现象确诊 BGA 焊点故障。\n\n判断清楚后，写清故障现象与定位结论，把重焊交给专业返修公司——会判断、会写返修单的工程师，比会吹风枪的更值钱。\n\n### 08.5 出厂不良品返修流程\n\n对应培训机构\"不良品返修\"模块，也是工厂返修岗（修理技术员）每天的工作。标准流程七步：\n\n1. **接收登记**：核对板号、版本、序列号，记录来料不良描述；板子全程防静电袋取放、上腕带；\n2. **复现现象**：按标准测试条件（规定电压、规定工装、规定程序）复现故障——**不复现的板单独标记\"待观察\"，严禁直接退回**；\n3. **定位故障**：按第 15 课故障速查表的顺序排查：电源→时钟→复位→通信，用万用表/示波器逐步收窄范围（仪器操作见第 06 课，第 16 课继续讲测试）；\n4. **拆坏件**：拍照留档 → 按 08.3.1 热风枪拆下 → 吸锡带清理焊盘 → 检查焊盘/走线有无连带损伤，有则先按 08.3.3 修复；\n5. **换新件**：核对料号、极性/第一脚方向，按 08.2 对应手法焊接（ chip 两步法 / QFP 拖焊 / QFN 刮锡膏）；\n6. **复测**：先复测原故障点，再跑整机功能测试，通过后清洗助焊剂残留、烘干；\n7. **记录归档**：填写返修记录表，按不良原因分类统计——这些数据是后续设计改进与来料反馈的依据（与第 16 课可靠性验证的失效分析闭环）。\n\n**返修记录表模板：**\n\n| 字段 | 填写示例 |\n|---|---|\n| 板号 / 版本 / 序列号 | PCB-REV2.1 / S/N 0037 |\n| 来料不良描述 | 上电电源灯不亮 |\n| 复现条件 | 12 V 适配器上电，100% 复现 |\n| 定位过程 | 测 U2 输入与输出，核对使能、负载、短路和外围；确认后再判断器件 |\n| 根因 | 示例：经进一步隔离测试确认 U2 失效；仅凭输出 0V 不能定论 |\n| 处理措施 | 更换 U2，吸锡带清焊盘后按两步法重焊 |\n| 复测结果 | 3.3 V 正常，整机功能测试通过 |\n| 返修人 / 日期 | 张三 / 2026-10-26 |\n\n注意：返修超过两次仍不良的板子要升级处理（换人或送工程分析），不要在工位上反复\"试运气\"；所有返修板复测通过不代表可以免检出厂，要按抽样规则再过一道测试（链第 16 课）。\n\n### 08.6 安全与健康\n\n| 风险点 | 防护措施 |\n|---|---|\n| 焊接烟雾和残留（助焊剂烟雾、焊料及残留） | 优先使用适用的局部排烟设备并按工作场所要求通风；普通风扇吹离面部不等于有效排烟；**焊后必须洗手才能吃东西**，食物饮料不上工位 |\n| 烙铁/热风烫伤 | 烙铁离手回架，热风枪按说明冷却；发生烫伤按当地急救指南处理，必要时及时就医 |\n| 静电（ESD）击穿 MOS/MCU | 操作敏感器件戴防静电腕带，腕带紧贴手腕皮肤、接地端接 ESD 地；板子放防静电台垫上操作 |\n| 火灾 | 酒精、助焊剂、纸巾远离烙铁与热风枪出风口；下班断电确认 |\n\n再强调一次铅的卫生：铅主要经**手→口**摄入，皮肤接触焊锡本身风险有限，但焊后不洗手就拿东西吃等于\"自投罗网\"。含铅锡丝剪下的锡渣、吸锡带废料集中回收，不当普通垃圾丢弃。\n\n## 🔧 动手练习\n\n练习板采购关键词：**贴片练习板**（0805/0603/0402 阵列含丝印位号）、**QFP 练习板**、**SMT 返修练习板**；拆旧板应先断电、移除可拆电池并确认不存在危险储能；不拆市电电源、损坏电池或来历不明的高压板。练习建议按表中顺序做——每项达标再进下一项，宁精勿多。\n\n| # | 练习内容 | 器材 | 达标标准 |\n|---|---|---|---|\n| 1 | 0805 电阻焊 20 颗 | 贴片练习板、0805 电阻 | 检查对位、润湿、桥连与立碑；记录问题，不以速度代替质量 |\n| 2 | 0603 电阻焊 20 颗 | 同上换 0603 | 放大镜下端头润湿、锡量适中 |\n| 3 | QFP（≥48 脚）拖焊整片 | QFP 练习板 | 无锡桥、无弯脚，对角对位偏差 < 半个焊盘 |\n| 4 | 热风枪拆 0805 再装回，循环 10 次 | 贴片练习板 | 焊盘零脱落，元件无烧裂变色 |\n| 5 | 断线飞线修复 3 处 | 自制断线练习板（刀划断走线） | 万用表通断正常、端点固定、走线规整 |\n| 6 | 拆旧板取器件 ≥20 颗并分类 | 报废路由器板 | QFP 引脚零弯折，元件方向记录在案 |\n| 7 | 吸锡带清理插件孔 ×20 孔 | 洞洞板/旧板 | 孔通透可插新件，焊盘完好 |\n| 8 | 完整返修一块故障板并填记录表 | 自制故障板（请同学设置故障） | 七步流程齐全、记录表 8 项填写完整、复测通过 |\n\n## ✅ 自测清单\n\n- [ ] 能说出 IIS/刀头/斜面头三种烙铁头各自最适合的场景\n- [ ] 无铅锡丝常规焊接的烙铁温度经验范围是多少？为什么比含铅高？\n- [ ] 能复述插件三步法，并解释\"先撤锡、后撤铁\"的原因\n- [ ] 贴片两步法为什么要\"先吃锡再定位\"而不是两端同时送锡？\n- [ ] QFP 拖焊的刀头角度、拖动速度、助焊剂用量三个经验参数分别是什么？\n- [ ] QFN 底部散热焊盘锡涂得过厚会有什么后果？\n- [ ] 热风枪拆片的\"起撬时机\"怎么判断？没到时机硬撬会怎样？\n- [ ] 吸锡带使用前最容易被漏掉的一步是什么？\n- [ ] 焊盘整片脱落怎么修复？飞线走线有哪三条规范？\n- [ ] X-Ray 能检查 BGA 的哪些缺陷，又有哪些局限？返修台的三个核心组成部分是什么？\n- [ ] 返修流程七步是哪七步？其中哪两步最容易被新手跳过？\n- [ ] 焊后为什么要洗手？ESD 腕带应贴在哪里、接到哪里？\n- [ ] 遇到\"怀疑 BGA 虚焊\"的板子，你的处置顺序是什么？\n- [ ] 6 个新手常见坑，能说出至少 4 个的规避方法\n\n## ⚠️ 新手常见坑\n\n1. **烙铁温度开到 450 °C 追求\"一烙就化\"**——焊盘铜皮与基材经不起持续高温，轻则阻焊发白脱落，重则焊盘连根翘起。按 08.1.1 温度表设定；感觉\"焊不动\"先查是不是无铅锡 + 回温慢的组合问题，不是猛加温度。\n2. **热风枪一开最大风量**——0402/0603 直接被吹飞，邻居元件\"躺枪\"。小件用小风嘴 + 低风量，风枪垂直对准，先在废板上试风再上正板。\n3. **带电焊接**——板子不断电就上烙铁，烙铁头漏电/杂散电流可能一击穿一片 MOS 和 MCU。任何焊接/拆焊前：断电、大电容放电。\n4. **湿手摸烙铁头\"试温\"、徒手抓刚拆下的芯片**——300 °C 的金属不需要用皮肤确认，烙铁挂不挂锡、风枪吹多久锡熔，试锡就知道。刚热风拆下的器件和板子余热同样烫人。\n5. **无铅锡丝被当成\"不好用\"**——无铅熔点通常较高，焊接效果还受热容量、烙铁头、助焊剂及氧化情况影响，然后误以为锡丝质量差。先升温、换刀头储热，再评价锡丝。\n6. **BGA 盲目自己返修**——拿热风枪对着 BGA 猛吹，大概率高温把板吹鼓、焊球内部连锡，一块主板直接报废。学会按 08.4 的方法判断与写返修单，重焊交给专业返修公司。\n\n## 📚 延伸学习\n\n- B 站搜索关键词：**拖焊 QFP**、**热风枪 拆芯片**、**BGA 返修**、**吸锡带 清理焊盘**、**植球 植锡网**——多看不同 Up 主的手法细节，再回到自己的练习板上验证\n- 行业标准：IPC-A-610（电子组件可接受性，焊点目检判据的金标准）、IPC-7711/7721（返工与修改规范）——面试返修/测试岗时能聊这两份标准会明显加分（链第 24 课就业准备）\n- 定位故障时的仪器手法回看第 06 课；返修后的复测与失效分析见第 16 课硬件测试与可靠性验证\n- 本课与第 15 课工程实践补充互为表里：那边看 SMT 产线怎么焊，这边练自己怎么焊","taskSignature":"6ab7c910e1c3a3bbf2f3b75b52f0e49d7605e3aa202ed15887c0dee598acb0ba","taskCount":14},{"id":"09","title":"第 09 课 · PCB 设计基础","short":"PCB 设计基础","stage":2,"diff":3,"prev":"第 07 课 · EDA 软件入门","optional":false,"md":"## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 完整背出并解释 PCB 设计九步流程，说清每一步的关键产出\n2. 独立创建一个合格的 PCB 封装（焊盘、丝印、阻焊、助焊层四要素齐全）\n3. 会依据数据手册的推荐焊盘图（Recommended Land Pattern）确定焊盘尺寸\n4. 独立排查网表导入的三类以上常见错误\n5. 按\"先大后小、先核心后外围、信号流向\"等六条原则完成布局，并用飞线走查法自检\n6. 按电流选线宽、按需求打过孔，理解直角/锐角走线的危害与铺铜接地的意义\n7. 完成一块 LED 闪烁板或 STM32 最小系统的全流程设计，输出可打样的 Gerber 与 BOM\n\n## 📖 正文\n\n第 07 课学会了软件操作，这一课开始\"按规矩办事\"。PCB 设计是流程驱动的手艺，顺序错了步步错；本课是阶段二的枢纽课——前两课的知识在这里汇成一块真正能打样的板子。\n\n### 09.1 完整设计流程总览\n\n先把这条主线背下来（整套课程反复使用）：\n\n需求分析 → 原理图绘制 → 封装匹配 → 网表导入 PCB → 布局 → 布线 → 铺铜 → DRC 检查 → 生产文件输出（Gerber）\n\n每步一句话说清：\n\n| 步骤 | 干什么 | 关键产出 |\n|---|---|---|\n| 需求分析 | 定功能、选主控和关键器件 | BOM（物料清单）雏形 |\n| 原理图 | 按参考设计画连接 | 原理图文件，编译无错 |\n| 封装匹配 | 给每个元件挂正确的封装 | 每个元件 Footprint 非空且核对无误 |\n| 网表导入 | 把连接关系带进 PCB | PCB 文件 + 满屏飞线 |\n| 布局 | 摆器件位置 | 器件位置定稿 |\n| 布线 | 把飞线变成满足约束的铜走线 | 所有应连接网络连通，检查回流及关键网络 |\n| 铺铜 | 大面积 GND/电源铜 | 地平面、散热面 |\n| DRC | 设计规则检查 | 间距/开路/短路清零 |\n| 输出 | Gerber + 钻孔 + BOM | 完成文件回读、规则及工艺核对后再评估生产 |\n\n贯穿全程的理念：**先想后画**。布局前花 10 分钟想清楚信号怎么流，胜过布线 2 小时反复返工。改布局等于\"动土\"，是成本最高的修改——宁可布局慢，不可布局错。\n\n### 09.2 PCB 封装创建\n\n#### 09.2.1 封装是什么\n\n封装（Footprint / Land Pattern）= 元件\"踩\"在板上的脚印，由四要素组成：\n\n1. 焊盘（Pad）：与引脚焊接的铜图形，分贴片（SMD）与通孔（THD）两类\n2. 丝印（Silkscreen）：外框、1 脚标记、极性标记\n3. 阻焊（Solder Mask）：焊盘处的开窗，防止焊锡乱跑\n4. 锡膏层（Paste Mask，钢网层）：定义贴片锡膏印刷开孔，开孔形状与面积应结合元件和装配工艺\n\n外加一个 Courtyard（放置禁区）：比丝印再大一圈的虚拟外框，用于防止相邻元件装配时相互\"打架\"（干涉）。\n\n#### 09.2.2 焊盘尺寸怎么定\n\n优先使用所选完整料号的推荐焊盘图（Recommended Land Pattern / PCB Layout），核对焊盘中心距、尺寸、孔槽、板边和公差。不是所有器件手册都给推荐图；图纸也必须结合板厂、装配方式和具体板厚检查，不能认为照搬就必然可生产。\n\n没有推荐图时，先根据器件机械尺寸、公差、目标工艺和装配要求建立候选，并使用适用标准或厂商计算工具核算；对照同类库封装只能作为交叉检查。不同引脚间距、引脚形状、焊料及工艺对应的焊盘不同，不能将统一长度套到所有 SOP/QFP。通孔还应核对成品孔公差、环宽及焊接要求。\n\n焊盘过小可能影响焊接与可靠性，过大或间距不足可能增加桥连风险。记录依据，并让板厂和装配方确认。\n\n#### 09.2.3 丝印与阻焊的规范\n\n- 丝印不得压焊盘（印到露铜区会导致虚焊）；阻焊开窗与焊盘一一对应\n- 必有 1 脚标识：封装丝印画圆点或三角，与芯片本体的缺口/圆点对应\n- 有极性元件（钽电容、电解、二极管、连接器）必须标极性（+ 号、缺口或色条区）\n- 位号（R1、C3、U2）方向尽量统一（建议都从左到右、从上到下），焊接找件不迷路\n\n#### 09.2.4 常见封装类型速查\n\n| 封装 | 类型 | 典型间距/尺寸 | 常见用途 |\n|---|---|---|---|\n| 0402 / 0603 / 0805 / 1206 | 贴片阻容（英制） | 0603 = 1.6×0.8mm | 电阻电容（新手建议 0805 起步，好焊） |\n| SOT-23 | 小信号三脚 | 3 引脚 | 三极管、小电流 MOS |\n| SOP-8 / SOP-16 | 翼型引脚 | 间距 1.27mm | 运放、LDO、EEPROM |\n| TSSOP / SSOP | 密脚翼型 | 间距 0.65/0.5mm | 引脚较多的逻辑芯片 |\n| QFP | 四侧翼型 | 间距 0.8/0.5/0.4mm | MCU、主控 |\n| QFN / DFN | 底部无引脚 + 裸露焊盘（EP） | 间距 0.5/0.4mm | 电源芯片、小 MCU，散热好 |\n| BGA | 底部球阵 | 间距 1.0/0.8/0.5mm | 高密度主控（新手阶段避开） |\n| TO-220 / TO-252 | 功率直插/贴片 | — | 稳压器、功率 MOS |\n\n这张表从上到下大致是\"越来越难焊、越来越考验工艺\"的排序。新手阶段用到 0603 ~ SOP/QFN 已足够应付绝大多数练习板。\n\n**封装核对不能只看 DRC**\n\n对照完整型号的推荐图纸，逐项检查编号与电气功能、焊盘形状尺寸、孔径和孔位、板边、极性、阻焊/钢网及机械干涉，再与目标板厂确认工艺和装配条件。库封装不是实物保证，DRC 也只检查已经设置的规则。\n\n例：第 14 课 USB-C 连接器在当前摆件草稿中存在定位孔到相邻铜的间距问题。独立试验发现缩短焊盘能改变几何检查结果，但也偏离原厂推荐尺寸；必须经过连接器、板厂与装配方确认后才能考虑采用。详见项目目录的布局说明和孔距试验记录。\n\n### 09.3 网表导入与错误排查\n\nAD 的导入入口：原理图环境中 Design → Update PCB Document，弹出 ECO 变更清单，确认后生效。立创EDA 为\"原理图转入 PCB\"按钮。\n\n高频报错与对策：\n\n| 报错/现象 | 原因 | 解决 |\n|---|---|---|\n| Footprint not found（找不到封装） | 元件未挂封装，或库未安装/未挂到工程 | 补挂封装或安装库后重新导入 |\n| Unknown Pin（管脚不匹配） | 原理图符号管脚号与封装焊盘编号对不上（典型：三极管符号的 B/C/E 对封装的 1/2/3） | 核对两侧编号映射，改符号或改封装 |\n| Extra Pin（多出焊盘） | 符号引脚和封装焊盘映射不一致，例如 QFN 的 EP | 对照器件手册核对 EP 编号、网络及散热要求；按实际需要补符号引脚或修正映射，不能为消除警告删除必需焊盘 |\n| 重复管脚编号 | 手工建库时焊盘号写重 | 逐个检查编号 |\n| 悬空网络警告 | 某网络只连了一个引脚 | 确认是漏画，还是设计如此（用 No ERC 标记压掉） |\n\n排查心法：逐条读错误信息，AD 的 Messages 面板点击错误可直接跳转到出错对象；先解决\"库类错误\"，再解决\"连接类错误\"。\n\n### 09.4 布局基础原则\n\n布局决定布线难度的上限。六条入门原则：\n\n1. **先大后小**：先摆连接器、主控、电源芯片等\"大件\"，再摆阻容小件——大件定了，小件填缝\n2. **先核心后外围**：先定主控位置，再围绕它摆晶振、去耦电容、接口电路\n3. **按信号流向**：信号从输入接口 → 处理 → 输出接口，整体走\"一\"字形或\"L\"字形，像流水线一样不回头\n4. **去耦电容靠近电源脚**：按芯片手册选择容值、数量和电流返回路径，缩短电源脚—电容—地的实际环路；不能只凭外壳距离或固定每脚 100nF 判断合格\n5. **接口靠边**：USB、排针、电源插座摆在板边，方便插接，也让走线有出口\n6. **特殊件特殊照顾**：晶振紧贴主控、远离板边与干扰源；发热件远离温度敏感件；板角预留安装孔（孔周留出禁布区，经验值孔中心距板边 ≥3mm）\n\n布局自检法——**飞线走查**：布完局后缩小视图看飞线，整体交叉少、走向清晰则合格；飞线一团乱麻就回炉重摆，别硬着头皮开布。\n\n双面板小技巧：先规划大方向——顶层优先走横向、底层优先走纵向，交叉处交给过孔，能省一半纠结。\n\n落实到操作，布局七步走：\n\n1. 摆大件：主控、接口、电源芯片先入位\n2. 定分区：按功能划分电源区、主控区、接口区，整体挪动微调\n3. 沿信号流向排布：输入在一侧、输出在另一侧，走\"一\"字或\"L\"字\n4. 布置去耦：逐路核对芯片手册并缩短电源与返回回路\n5. 摆小件：电阻电容围绕所属功能电路就近落位\n6. 飞线走查：缩小视图整体看，乱就回到第 2 步重来\n7. 定稿：锁定关键器件位置，统一微调丝印方向\n\n记住口诀：**布局是\"分区 + 流向 + 就近\"，不是\"把器件塞进去\"。**\n\n### 09.5 布线基础规范\n\n#### 09.5.1 线宽与电流的关系\n\n铜箔越宽越厚，载流越大。**经验值（1oz 铜厚、温升约 10℃、直流/低频）**：\n\n| 线宽 | 约合 mil | 仅为粗略练习示意（非允许电流） |\n|---|---|---|\n| 0.15mm | 6mil | 信号线，≤0.3A |\n| 0.2mm | 8mil | 普通信号、小电源 |\n| 0.5mm | 20mil | 约 0.6~0.8A |\n| 1.0mm | 39mil | 约 1A（保守口诀：1mm 过 1A） |\n| 2.0mm | 79mil | 约 1.5~2A（需核对散热与制造条件） |\n\n三条使用规则：\n\n- 信号线 0.15~0.2mm（6~8mil）起步；低于板厂最小线宽要加价（常见最小 4~6mil）\n- 电源路径按电流、温升和压降核算，连同焊盘收窄、过孔与连接器一起检查；尺寸不必机械保持全程等宽\n- 任何实际设计都应核对电流、铜厚、环境温度、允许温升、线路长度、压降与连接瓶颈；可参考 IPC-2152 或板厂方法并结合验证，上述数字不作为额定值\n\n铜厚、表层或内层、周边铜面和实际散热路径都会影响温升；不能用固定百分比推断载流能力。大电流线路还要核查焊盘、过孔、连接器和局部收窄处。\n\n#### 09.5.2 过孔（Via）\n\n- 常规过孔：孔径 0.3mm / 焊盘 0.6mm（经验值，各板厂标准略有差异）\n- 过孔载流取决于孔壁镀铜厚度、孔长、允许温升、铜皮及散热条件；并联数量须依据电流、压降和热设计核算，不能按固定每孔电流选取\n- 焊盘内过孔可能吸走焊料；是否允许及是否需要塞孔、盖孔或填平，按焊盘类型、器件及板厂/装配工艺共同决定\n\n#### 09.5.3 直角走线问题\n\n90° 直角与锐角（<90°）走线的两条危害与一条适用边界：\n\n- 拐角会产生局部阻抗变化；实际影响与信号边沿、几何结构和频率有关，不能笼统视为显著辐射源\n- 锐角可能形成狭窄铜尖，制造时应结合板厂工艺检查；普通直角并非必然制造缺陷\n- 对普通低速数字板实际影响很小——但请从现在养成习惯：**全部走 45° 斜线或圆弧，绝不出现锐角**\n\n#### 09.5.4 铺铜与接地\n\n- 双面板默认大面积铺铜（pour / copper area）给 GND：顶层、底层都铺，两层 GND 可用过孔缝合；数量与位置根据回流、工艺、EMC 和可用空间决定，不强制密集网格\n- 器件的地引脚就近打过孔到底层地铜，避免地电流绕远路\n- 铺铜后重算并检查孤岛、热连接和回流路径，再运行 DRC；是否保留或移除孤岛应结合设计和制造要求\n\n#### 09.5.5 其他入门规范\n\n- 走线尽量短、尽量少换层；每次换层多一个过孔，过孔既是电阻也是故障点\n- 走线可以按网络正确连接焊盘；器件下方是否允许穿线或铺铜，应按器件、绝缘、散热、制造和检修要求判断，不能一概禁止\n- 丝印不被走线/过孔遮挡——位号看不清，焊接就痛苦\n- 电源入口和关键电压节点留测试点（Test Point），调试时万用表有处可搭\n\n最后补一个\"环路意识\"的入门版：每根信号线都有回流路径（电流从哪去，就从哪回）。双面板上信号走顶层时，尽量保证其下方或附近的底层地铜连续——被走线割裂的地铜会逼回流绕远路，这是高速板 EMI 的头号来源（第 19 课展开）。现阶段你只需要养成习惯：少割地、多打过孔缝合。\n\n### 09.6 动手项目：LED 闪烁板 / 最小系统板（完整走一遍！）\n\n**方案 A 的两电阻无稳态原理图：**RA、RB 和 C 对应下方公式；RLED 用于限制 LED 电流。图为通用接法示意，具体器件的电源、负载能力和外围电容以数据手册为准。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 410\" role=\"img\" aria-label=\"555双电阻无稳态振荡器和LED负载原理图\" style=\"max-width:760px\">\n<style> .w{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .box{fill:none;stroke:currentColor;stroke-width:3} .t{fill:currentColor;font:18px sans-serif} .sm{fill:currentColor;font:15px sans-serif} .node{fill:currentColor} <\/style>\n\n<path class=\"w\" d=\"M100 55H430 M100 55V90 M100 126V150 M100 150V165 M100 201V230 M100 230V270 M100 290V320 M85 320H115 M90 328H110 M95 336H105 M100 150H300 M100 230H255V200H300 M255 230H300 M340 55V110 M430 55V110 M350 290V320 M335 320H365 M340 328H360 M345 336H355 M420 290V305 M405 305H435 M405 313H435 M420 313V320 M405 320H435 M410 328H430 M415 336H425 M470 190H510 M554 190H605 M633 190H675V320 M660 320H690 M665 328H685 M670 336H680\"/>\n<rect class=\"box\" x=\"88\" y=\"90\" width=\"24\" height=\"36\"/><rect class=\"box\" x=\"88\" y=\"165\" width=\"24\" height=\"36\"/><path class=\"w\" d=\"M85 270H115 M85 290H115\"/>\n<rect class=\"box\" x=\"300\" y=\"110\" width=\"170\" height=\"180\"/><rect class=\"box\" x=\"510\" y=\"178\" width=\"44\" height=\"24\"/>\n<path class=\"w\" d=\"M605 176V204 M605 176L630 190 605 204 M633 176V204 M614 165L621 158 M626 168L633 161\"/>\n<circle class=\"node\" cx=\"100\" cy=\"150\" r=\"4\"/><circle class=\"node\" cx=\"100\" cy=\"230\" r=\"4\"/><circle class=\"node\" cx=\"255\" cy=\"230\" r=\"4\"/>\n<text class=\"t\" x=\"65\" y=\"40\">+5V<\/text><text class=\"t\" x=\"125\" y=\"112\">RA<\/text><text class=\"t\" x=\"125\" y=\"190\">RB<\/text><text class=\"t\" x=\"120\" y=\"286\">C<\/text><text class=\"t\" x=\"355\" y=\"155\">555<\/text>\n<text class=\"sm\" x=\"305\" y=\"155\">7 放电<\/text><text class=\"sm\" x=\"305\" y=\"205\">6 阈值<\/text><text class=\"sm\" x=\"305\" y=\"235\">2 触发<\/text><text class=\"sm\" x=\"325\" y=\"130\">8<\/text><text class=\"sm\" x=\"420\" y=\"130\">4<\/text><text class=\"sm\" x=\"342\" y=\"280\">1<\/text><text class=\"sm\" x=\"412\" y=\"280\">5<\/text><text class=\"sm\" x=\"445\" y=\"195\">3<\/text><text class=\"sm\" x=\"500\" y=\"170\">RLED<\/text><text class=\"sm\" x=\"600\" y=\"220\">LED<\/text><text class=\"sm\" x=\"445\" y=\"315\">10nF<\/text>\n<text class=\"sm\" x=\"250\" y=\"383\">8 供电 / 4 复位；1 地；5 控制端<\/text>\n\n<\/svg>\n```\n\n\n下面的 555 仿真用于观察电容充放电和输出翻转。它使用的是另一种定时连接与参数，不可直接套用方案 A 的两电阻公式；实际绘图请以所选 555 的数据手册典型电路为准。\n\n```circuitjs\nlogic-555\n```\n\n先完成方案 A 的简单电路；具备电源、接口和单片机基础后，再进入第 14 课的方案 B。\n\n**方案 A：555 LED 闪烁板**\n\n- 核心电路：标准 555 两电阻无稳态接法可用 f≈1.44/((RA+2RB)C) 作理想估算；具体器件的供电、电容和输出驱动以手册为准。\n- 元件不到 15 个，双面板轻松布通，重点是把九步流程完整走顺\n\n**带参数的学习算例：**假设选用工作条件允许 5V 的 555 型号，RA=10kΩ、RB=10kΩ、C=10μF，理想周期约 0.208s、频率约 4.8Hz。输出接 RLED=620Ω 与红色 LED 到地；若粗略假设输出高电平 5V、LED 压降 2V，则电流约 4.8mA。实际 555 的高电平可能低于 5V，需核对输出曲线、LED 电流与电阻功耗。C 的极性和耐压、电源去耦与复位脚均按所选型号手册确认。\n\n**从电路到文件：**画出供电、RA/RB/C、输出 LED 及电源去耦 → 核对每个引脚与封装 → 编译并检查网络 → 布局布线和 DRC → 用 Gerber 查看器逐层核验 → 记录 BOM、尺寸及未决项。图示和估算不等于已完成打样或实测。\n\n**方案 B：STM32F103C8T6 最小系统板**\n\n- 组成：以第 14 课配套草稿为例，包括 USB-C 供电、LDO、复位、5 针 SWD、用户 LED 和两侧 GPIO 排针；当前固件采用内部 HSI，外部晶体为另行设计的选项。\n- 难点：48 脚 LQFP 的布局、供电与去耦、USB 接口及回流。现有工程尚未完成布线和制造验证。\n- 参考资源：对照第 14 课的 STM32 设计说明，以及成熟开源工程的具体器件手册。\n\n通用完成标准（全流程检查单）：\n\n1. 原理图编译无错\n2. 每个元件的封装对过数据手册（尤其三极管和芯片的脚序）\n3. 网表导入零报错\n4. 布局按 09.4 六原则自查通过\n5. 按信号、电流、压降、温升和板厂能力核对线宽间距与拐角；0.5mm 不能作为所有电源线的合格保证\n6. 两层铺铜 + 地过孔缝合\n7. DRC 全部通过\n8. 输出 Gerber，用查看工具逐层预览：外形、铜、丝印、钻孔逐项确认\n9. 导出 BOM，逐项在商城能搜到现货\n\n输出 Gerber 时应包含的内容（通用清单）：\n\n| 输出内容 | 说明 |\n|---|---|\n| 顶层铜 / 底层铜 | 走线与焊盘 |\n| 顶层丝印 / 底层丝印 | 位号与标记 |\n| 顶层阻焊 / 底层阻焊 | 绿油开窗 |\n| 钻孔文件（Drill） | 所有孔的孔径与坐标 |\n| 板边（Board Outline） | 按 EDA 与板厂要求导出的闭合外形，检查是否包含槽和圆角 |\n\n贴片焊接还需要钢网层（顶层/底层 Paste）；有阻抗要求时，另附叠层参数说明给板厂。\n\n打样说明：把 Gerber 上传打样平台（如嘉立创、捷多邦等），选板层、板厚（常规 1.6mm）、铜厚（常规 1oz）、阻焊颜色。首次下单前，强烈建议找人复核一遍 Gerber。\n\n> 🎬 **视频推荐**：B 站搜索 [嘉立创 PCB 制造流程](https://search.bilibili.com/all?keyword=%E5%98%89%E7%AB%8B%E5%88%9B%20PCB%20%E5%88%B6%E9%80%A0%E6%B5%81%E7%A8%8B)（嘉立创官方账号有从开料到成品的完整制板视频）——亲眼看你发出的 Gerber 怎么变成板子。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 手工创建封装 | 建 0805 电阻 + SOP-8 两个封装，对照具体器件推荐图纸及公差核对尺寸和编号，标出 1 脚 |\n| 2 | 完成方案 A 或 B 原理图 | 编译 0 错误，位号齐全，网络命名规范 |\n| 3 | 网表导入与排查 | 导入 0 错误（或能独立解决全部报错） |\n| 4 | 布局 | 写 3 行布局说明：信号流向如何体现、去耦电容如何就近、接口为何这样摆 |\n| 5 | 布线 + 铺铜 + DRC | 无飞线残留（或注明原因）、DRC 清零 |\n| 6 | 输出与复核 | Gerber 逐层预览留档，BOM 全部可采购 |\n| 7 | （进阶）下单打样 | 完成一次打样下单，跟踪生产进度（可选） |\n\n## ✅ 自测清单\n\n- [ ] 能默写九步设计流程并说出每步产出\n- [ ] 能说出封装四要素与 Courtyard 的作用\n- [ ] 知道焊盘尺寸的第一依据是数据手册推荐焊盘图\n- [ ] 能说出 0603、SOP、QFP、QFN、BGA 的特征与焊接难度排序\n- [ ] 能独立解决\"找不到封装\"和\"管脚不匹配\"两类导入错误\n- [ ] 能复述布局六原则并各举一个理由\n- [ ] 能解释去耦电容为什么必须靠近电源引脚\n- [ ] 知道线宽要结合电流、温升、铜厚、压降和板厂条件核算\n- [ ] 能说出常规过孔尺寸（0.3mm/0.6mm）与大电流过孔并联的做法\n- [ ] 能解释直角/锐角走线的危害与替代方案\n- [ ] 能说明铺铜、缝合过孔、移除死铜的做法\n- [ ] 能独立输出 Gerber 并逐层核对\n\n## ⚠️ 新手常见坑\n\n1. **三极管/MOS 封装脚序对不上**：SOT-23 的焊盘 1/2/3 与符号 B/C/E 映射错误，一焊上电就烧。对策：建封装时把数据手册的 Pin Assignment（引脚定义表）抄在旁边逐脚核对。\n2. **丝印压焊盘、1 脚标反**：批量贴片后返修成本极高。DRC 里打开丝印检查项，1 脚对照芯片本体圆点/缺口再确认一次。\n3. **去耦电容堆在板角\"好看\"**：电容离电源脚几厘米等于白放。按器件手册检查每个电源脚所需的电容、连接回路和布局。\n4. **电源线沿用默认细线宽**：6mil 走 500mA 会发热甚至烧线。布线前先在规则（Design Rule）里给电源网络设定线宽。\n5. **DRC 带错硬发板**：开路、短路、间距违规，任何一个都可能让板子报废。发板前 DRC 清零是铁律。\n6. **Gerber 不预览就下单**：层选错、漏钻孔层、某层镜像，整批板报废。养成逐层预览的习惯再点付款。\n7. **不看飞线就开布**：飞线乱成一团硬着头皮布线，事倍功半。先把布局调到飞线顺，再动手。\n\n## 📚 延伸学习\n\n- B 站搜索关键词：\"PCB 布局 原则 讲解\"、\"PCB 布线 教程 入门\"、\"Altium 布线技巧\"、\"STM32 最小系统 绘制\"、\"555 多谐振荡器\"\n- 标准与文档：IPC-7351（封装设计标准，先了解名字与用途即可）；芯片数据手册中 Layout 章节的阅读方法（第 10 课实战精读）\n- 工具：搜索 \"Gerber viewer\"，开源工具 gerbv 或 KiCad 的 Gerber 查看器均可\n- 复盘：把自己画的板与网上同款开源项目（搜索 \"STM32 最小系统 开源\"）对比布局，列 3 条差距","taskSignature":"050eace527b6363e058eec36539283081cd82de847187da951a573a5de40e359","taskCount":12},{"id":"10","title":"第 10 课 · 电源模块","short":"电源模块","stage":2,"diff":4,"prev":"第 09 课 · PCB 设计基础","optional":false,"md":"## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 手画 Buck 与 Boost 的基本拓扑，讲清一个开关周期内电流怎么走\n2. 说出 DCDC 外围五大件（输入电容、电感、续流管、输出电容、FB 分压）的作用与选型要点\n3. 严格执行电源 PCB 布局布线十条军规（输入电容紧靠、SW 短粗、环路最小、FB 远噪声、单点接地、散热过孔等）\n4. 讲清 LDO 原理与压差（Dropout），会用对比表在 DCDC 与 LDO 之间做选型决策\n5. 描述 PMU 多路电源的时序要求与布局注意事项\n6. 说出 AC-DC 初次级隔离三要素（爬电距离、Y 电容、热地/冷地）与安全红线\n7. 能点出拼板、叠层、阻抗、差分、等长、盲埋孔等进阶主题的用途与入门规则\n8. 完成 12V→5V(Buck)→3.3V(LDO) 电源小板设计，并精读所选 DCDC 手册的 Layout Guidelines 章节\n\n## 📖 正文\n\n第 09 课走通了完整设计流程，这一课专攻\"让板子活起来\"的部分——电源。电源板是新手到工程师的分水岭：它综合考验布局、布线、发热与噪声控制，也是面试最爱问的主题。\n\n### 10.1 为什么电源值得单独一课\n\n- **故障之首**：电源故障是常见排查方向，包括电压不对、纹波大、上电时序错或过热\n- **布局决定性能**：同一颗芯片、同一张原理图，布局不同，输出纹波可以差一个数量级\n- **电源树思维（Power Tree）**：产品供电像树一样逐级降压，例如 12V 适配器 → 5V（Buck）→ 3.3V（LDO 给 MCU）。设计电源前先画电源树、做功耗预算，再逐级实现——本课动手项目就是这个结构\n\n三大主角：DCDC 开关电源（高效）、LDO 线性稳压（线性调节）、PMU（集成多路）；外加大功率的 AC-DC（市电接入）。\n\n### 10.2 DCDC 开关电源\n\n#### 10.2.1 Buck（降压）原理\n\n```circuitjs\npower-buck\n```\n\n功率级简图仅展示能量通路，省略控制、反馈、输入去耦与保护；互动模型为开环教学模型。\n\n```svg\n<svg role=\"img\" aria-label=\"Buck开关电源功率级示意图\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"173.03999999999996pt\" width=\"356.44399999999996pt\" viewBox=\"-28.516 -181.39999999999998 356.44399999999996 173.03999999999996\"><path d=\"M 126 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 135 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 144 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 153 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><polygon points=\"99,-83.7 108,-96.3 117,-83.7 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-144.0 L 18,-144 L 36,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-144.0 L 54,-144 M 62.64,-147.6 L 82.8,-160.2 M 90,-144 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-144.0 L 126,-144 M 162,-144 L 180,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-83.7 M 99,-96.3 L 117,-96.3 M 108,-96.3 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 180,-36 L 252,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-21.6 L 99,-21.6 L 117,-21.6 M 101.7,-17.28 L 114.3,-17.28 M 106.2,-12.96 L 109.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 180.0,-144.0 L 180,-93.24 M 189,-93.24 L 171,-93.24 M 189,-86.76 L 171,-86.76 M 180,-86.76 L 180,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 180.0,-144.0 L 216,-144 L 252,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 252.0,-144.0 L 252,-108 L 261,-108 L 261,-72 L 243,-72 L 243,-108 L 252,-108 M 252,-72 L 252,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 252.0,-144.0 L 270,-144 L 288,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-14.4\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-14.4\" dy=\"13\">Vin<\/tspan><\/text><circle cx=\"58.32\" cy=\"-144\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"85.68\" cy=\"-144\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"72.0\" y=\"-176.79999999999998\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">S<\/tspan><\/text><text x=\"144.0\" y=\"-165.09997770431488\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"144.0\" dy=\"13\">L<\/tspan><\/text><text x=\"95.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.4\" dy=\"13\">D<\/tspan><\/text><text x=\"167.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"167.4\" dy=\"13\">C<\/tspan><\/text><text x=\"239.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"239.4\" dy=\"13\">负载<\/tspan><\/text><text x=\"309.59999999999997\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"309.59999999999997\" dy=\"13\">Vout<\/tspan><\/text><circle cx=\"108\" cy=\"-144\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"180\" cy=\"-144\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n> 🔬 **配套仿真**：[Buck 降压变换器](#/sim/conv-buck)——看开关节点方波与电感电流的三角波\n\n组成：开关管 Q（多集成在芯片内）、电感 L、续流二极管 D（或同步整流 MOS）、输出电容 C。\n\n想象\"水龙头开-关 + 惯性水车\"：水龙头高速开关，水车（电感）靠惯性把断续的水流平滑成连续水流。\n\n一个开关周期两步走：\n\n1. **导通阶段**：开关闭合，输入经 Q 和 L 向输出传能；在理想降压稳态中电感电流上升。电容瞬时充放电由电感电流与负载电流的差决定；二极管反偏截止\n2. **关断阶段**：开关断开，电感电流不能突变，\"惯性\"驱动电流继续流向负载，经续流二极管 D 回流成环；L 放磁维持输出\n\n占空比 D 与电压关系（CCM 连续模式下理想公式）：**Vout = D × Vin**。开关频率常见几百 kHz 到几 MHz，靠\"高频开关 + LC 滤波\"把脉冲平均成稳定直流。\n\n两个进阶名词先混个脸熟：CCM（连续模式，电感电流始终大于零，重载时的工作状态）与 DCM（断续模式，轻载时电感电流每周期归零）；不少芯片还有轻载效率优化模式（跳周期/PFM）。手册里都会提到——现阶段认得这些词即可，不影响画板。\n\n#### 10.2.2 Boost（升压）原理\n\n以下仿真仅用于观察开关和电感的工作过程，模型为开环，元件参数以窗口为准；启动瞬态不能当作稳态输出。\n\n```circuitjs\npower-boost\n```\n\n功率级简图中 S 为受控开关；控制、反馈、输入去耦和保护均未画出。\n\n```svg\n<svg role=\"img\" aria-label=\"Boost开关电源功率级示意图\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"165.84pt\" width=\"356.44399999999996pt\" viewBox=\"-28.516 -174.2 356.44399999999996 165.84\"><path d=\"M 54 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 63 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 72 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 81 -144 a 4.5 4.5 -0 1 1 9 0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><polygon points=\"137.7,-153 150.3,-144 137.7,-135 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-144.0 L 18,-144 L 36,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-144.0 L 54,-144 M 90,-144 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-144.0 L 137.7,-144 M 150.3,-153 L 150.3,-135 M 150.3,-144 L 180,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-144.0 L 108,-108 M 111.6,-99.36 L 124.2,-79.2 M 108,-72 L 108,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 180,-36 L 252,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-21.6 L 99,-21.6 L 117,-21.6 M 101.7,-17.28 L 114.3,-17.28 M 106.2,-12.96 L 109.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 180.0,-144.0 L 180,-93.24 M 189,-93.24 L 171,-93.24 M 189,-86.76 L 171,-86.76 M 180,-86.76 L 180,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 180.0,-144.0 L 216,-144 L 252,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 252.0,-144.0 L 252,-108 L 261,-108 L 261,-72 L 243,-72 L 243,-108 L 252,-108 M 252,-72 L 252,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 252.0,-144.0 L 270,-144 L 288,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-14.4\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-14.4\" dy=\"13\">Vin<\/tspan><\/text><text x=\"72.0\" y=\"-165.09997770431488\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">L<\/tspan><\/text><text x=\"144.0\" y=\"-169.6\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"144.0\" dy=\"13\">D<\/tspan><\/text><circle cx=\"108\" cy=\"-103.68\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"108\" cy=\"-76.32\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"100.08000000000001\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"100.08000000000001\" dy=\"13\">S<\/tspan><\/text><text x=\"167.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"167.4\" dy=\"13\">C<\/tspan><\/text><text x=\"239.4\" y=\"-103.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"239.4\" dy=\"13\">负载<\/tspan><\/text><text x=\"309.59999999999997\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"309.59999999999997\" dy=\"13\">Vout<\/tspan><\/text><circle cx=\"108\" cy=\"-144\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"180\" cy=\"-144\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n电感先\"充能\"再\"泵放\"：\n\n1. 开关闭合：电源直接给电感充磁；二极管截止，负载暂由输出电容供电\n2. 开关断开：电感电压与电源电压串联叠加（V_L + Vin）一起给负载和电容充电——实现升压\n\n**Vout = Vin / (1 − D)**（理想稳态、连续导通模式 CCM），在该模型中 D 越大输出越高；实际受负载、工作模式和损耗影响。典型应用：锂电池 3.7V 升到 5V 输出。\n\n#### 10.2.3 外围电路与选型要点\n\n| 元件 | 作用 | 选型要点 |\n|---|---|---|\n| 输入电容 CIN | 为开关脉冲提供局部电流通路 | 按控制器手册核对实际有效容值、纹波电流、耐压与回路布局，不能仅凭标称容值选型 |\n| 电感 L | 储能核心 | 感量按手册公式/推荐表；纹波电流取负载的 20%~40%（经验值）；饱和电流 ≥ 峰值电流 1.3 倍（经验值）；DCR 尽量小 |\n| 续流二极管 D | 异步 Buck 关断期为电感续流 | 按平均和峰值电流、反向耐压、损耗、温度、恢复特性选择；同步 Buck 使用低边 MOS，结构和效率以具体芯片为准 |\n| 输出电容 COUT | 平滑输出并影响环路 | 联合检查有效容值、ESR、纹波电流、瞬态和控制器稳定性；不能仅凭标称值或一味增大容值判定合格 |\n| FB 反馈分压 | 采样输出电压给芯片比较 | Vout = Vref × (1 + R1/R2)；R2 取 10kΩ 量级（经验值：太大易受漏电流与噪声影响，太小白白耗电流） |\n\nFB 计算实例：某芯片 Vref = 0.8V，目标 5V。R1/R2 = 5/0.8 − 1 = 5.25 → 取 R2 = 10kΩ，R1 = 52.3kΩ（E96 系列最近值）。\n\n**理想 Buck、稳态 CCM** 的电感初算（不适用于 Boost）：L = Vo × (1 − D) / (ΔI × fsw)，ΔI 取 Iout 的 20%~40%（经验值）。例：5V/1A 输出、Vin=12V、fsw=500kHz、ΔI=0.3A → D ≈ 0.42，L ≈ 5 × 0.58 / (0.3 × 500000) ≈ 19μH，就近选 22μH 标称值。\n\n效率怎么算：η = Pout / Pin。损耗主要来自开关管导通电阻、电感 DCR、开关损耗和二极管压降（异步架构）。数据手册首页的效率曲线（不同负载下的 η）是判断芯片最快的一张图——同规格下，曲线越高、越平坦越好。\n\n其他常见外围：BST 自举电容（按手册，常见 0.1μF 级）、EN 使能、SS 软启动、补偿网络——**照手册典型应用图抄，不要自由发挥**。\n\n#### 10.2.4 DCDC 布局布线十条军规（本课核心！）\n\n开关电源布局的物理本质三句话：**让大电流环路面积最小，让开关节点天线最小，让反馈采样最干净。**\n\n1. **输入电容紧靠 IC 的 VIN 与 PGND 脚**：开关电流脉冲全靠 CIN 供给，距离每增加 1cm，寄生电感就让开关节点振铃加剧。电容组合与实际有效容值按芯片手册选择，优先缩短对应的高 di/dt 回路\n2. **SW 开关节点走线短而粗、面积尽量小**：SW 上是高频方波（高 dv/dt），铜皮就是天线，面积越大 EMI 越强。SW 只连三处：IC 的 SW 脚、电感、续流管（异步才有），不绕远、不分支\n3. **大电流环路最小化**：区分完整导通/续流路径与高 di/dt 热环路。异步 Buck 的关键脉冲环路为 CIN 正端 → 高侧开关 → SW → 续流二极管 → CIN 负端；同步 Buck 则由输入电容和高、低侧开关构成。优先缩小该环路，再检查输出路径；以具体芯片布局指南为准\n4. **电感下方避免走线**：功率电感本体投影范围内、尤其内层，不走敏感信号（电感漏磁会耦合噪声；经验规则，一体成型电感稍宽松但仍建议遵守）\n5. **FB 走线远离开关噪声**：FB 采集毫伏级信号，必须远离开关（SW 走线、电感、续流二极管），走线短而细即可（它几乎不载流）；反馈分压位置和采样点按具体控制器的布局指南确定，避免开关电流与采样参考共用高阻抗路径\n6. **地与回流**：按芯片指定的 AGND/PGND 接法和布局处理。控制高电流回流路径，避免其与反馈参考共用高阻抗路径；完整地平面或单点连接的选择须以具体设计指南为准，不能机械分割\n7. **散热焊盘与过孔**：先查 EP 的网络与焊接要求，再按功耗、封装、板层和工艺决定铺铜及过孔数量；有些器件并不需要过孔，塞孔和焊料流失风险须与板厂、装配方核对\n8. **大电流路径核算**：VIN、SW、VOUT 和回流路径分别按电流、压降、温升及开关节点寄生权衡宽度和面积；换层过孔数量按实际电流、镀铜及散热核算\n9. **续流二极管（异步 Buck）靠近开关回路**：按手册缩短 SW、二极管与输入电容地之间的高 di/dt 回路\n10. **做完对照手册自查**：芯片手册的 Layout Guidelines 章节就是标准答案——本课动手练习必须逐句精读并逐条对照\n\n军规自查表（画完对着逐条打钩）：\n\n| # | 军规 | 一句话物理原因 |\n|---|---|---|\n| 1 | 输入电容紧靠 IC | 开关脉冲电流就近供给，减小寄生电感振铃 |\n| 2 | SW 短而粗、面积小 | 高 dv/dt 节点是 EMI 天线 |\n| 3 | 大电流环路最小 | 环路面积 × di/dt 决定辐射与振铃 |\n| 4 | 电感下方不走线 | 电感漏磁耦合噪声 |\n| 5 | FB 远离开关噪声 | 毫伏级采样最怕开关干扰 |\n| 6 | 按手册设计地与回流 | 避免功率回流与反馈参考共用高阻抗路径 |\n| 7 | 核验 EP 散热方案 | 按具体封装、热条件与工艺选择铺铜和过孔 |\n| 8 | 大电流路径加宽 | 减小压降与发热 |\n| 9 | 续流管靠近开关回路 | 缩短高 di/dt 续流路径 |\n| 10 | 对照手册复查 | 手册 Layout 章节就是标准答案 |\n\n### 10.3 LDO 线性稳压\n\n#### 10.3.1 原理\n\nLDO = 芯片内\"自动变阻器\"（调整管）+ 误差放大器：输出被采样后与内部基准比较，动态调整调整管的压降，维持输出稳定。它不以功率开关周期工作，但自身噪声、输入纹波抑制和瞬态表现仍取决于具体器件、频率与工作条件。\n\n#### 10.3.2 LDO vs DCDC 对比选型表\n\n| 维度 | LDO | DCDC（Buck/Boost） |\n|---|---|---|\n| 效率 | 近似 Vout/Vin，随压差、负载和静态电流变化 | 取决于拓扑、负载和器件；查效率曲线 |\n| 纹波/噪声 | 输入纹波抑制和自身噪声按 PSRR、频带和工作点核对 | 开关纹波与 EMI 依频率、布局和负载而异 |\n| 升降压 | 只能降压 | 可升可降（拓扑决定） |\n| 外围 | 通常较简单；电容、反馈和使能以型号为准 | 通常含电感、电容，部分还需反馈和补偿 |\n| 成本 | 低 | 略高 |\n| 大电流/大压差场景 | 发热严重，不适用 | 适用 |\n| 典型场景 | 模拟供电、射频、ADC 基准等噪声敏感小电流 | 主电源轨、大电流、电池供电 |\n\n选型应比较效率、噪声频谱、PSRR、成本和热条件；某些场合适合 DCDC 后接 LDO，但 LDO 不保证滤除所有频率的纹波，需查数据手册与实测。\n\n#### 10.3.3 压差（Dropout）\n\nLDO 能正常稳压所需的最小输入输出压差。Dropout 与负载电流、温度及具体型号有关。不能用某一典型值推断所有 AMS1117 的最低输入；应使用目标工况下手册保证的最大压差，再计入输入最低值、输出精度和裕量。输入不足时输出可能失去稳压。\n\nLDO 选型五步：定输出电压与精度 → 算最大电流与功耗 → 查压差余量是否够 → 看噪声/PSRR 指标（给 ADC、射频供电时重点看）→ 定封装与热阻。五步做全，基本不会选错。\n\n#### 10.3.4 LDO 布局要点\n\n- 输入电容、输出电容紧靠对应引脚（经验值 1~3mm 内），回路短\n- 发热校验：P = (Vin − Vout) × I。例：5V→3.3V、200mA 时主要功耗约 0.34W；是否满足结温取决于具体器件、PCB 散热、环境与热阻测试条件，不能只凭封装名判断\n- 带 EP 的封装按 10.2.4 第 7 条核对电气连接、散热与装配工艺，是否使用过孔按设计决定\n- LDO 的地回路同样要短，别让地引脚绕远\n\n### 10.4 PMU 电源管理芯片\n\nPMU（Power Management Unit）/SOC 集成电源：把多路 Buck + 多路 LDO + 时序控制 + 各种保护集成进一颗芯片，常见于手机、平板、嵌入式核心板。特点：多路输出（如 4 Buck + 6 LDO）、I2C/SPI 可编程、支持动态电压调节（DVS）与各路监测。\n\n设计要点：\n\n- **上电时序（Sequencing）**：核心、IO、存储等电源轨要求按先后顺序上电（谁先谁后、间隔多少），由芯片内部时序或 EN/PG（Power Good）引脚级联实现。时序错了轻则不启动、重则损坏芯片——手册的 Power Sequencing 章节必读\n- **布局**：每路输出仍当作独立的 DCDC/LDO 对待（各自的电感、电容就近），多路地统一汇流到主地；采样与补偿网络照旧远离噪声\n- PMU 引脚密集：先画电源树、定好每路走向再动手布局，避免\"绕不过去\"\n\n### 10.5 AC-DC 高压开关电源（安全第一！）\n\n> 🔬 **配套仿真**：[二极管整流](#/sim/rectify)——AC 变脉动直流的第一步（弱电演示，无危险）\n\n产品接市电（220V AC）的第一级电源，典型拓扑是**反激（Flyback）**：开关管高频通断，能量先存进高频变压器再耦合到次级；变压器同时完成\"变压 + 电气隔离\"，输出经光耦（Optocoupler）把反馈信号隔离开关地送回初级，形成隔离闭环。\n\n三大安全概念（高压板的生死线）：\n\n1. **爬电距离（Creepage）与电气间隙（Clearance）**：初级（市电侧）与次级（低压侧）铜箔之间必须拉开足够距离，所需距离取决于工作电压、绝缘等级、污染等级等条件，须按适用的现行标准及认证要求确定；隔离屏障的布局应符合器件和安规要求\n2. **安规电容**：X 电容跨接火线-零线（滤差模干扰）；Y 电容跨接初级地与次级地（为共模干扰提供受控回路）；变压器、光耦和数字隔离器也可在满足绝缘与认证要求时跨越隔离屏障。必须使用通过安规认证的 X/Y 电容——它的失效模式有保障\n3. **热地（Hot Ground）与冷地（Cold Ground）**：初级侧地随市电浮动，碰到即触电，叫热地；次级侧常称冷地，但隔离不保证次级电压或触碰安全；是否安全须按整个设备的电压、绝缘和故障条件评估。两者不可随意直接连接；热地区域丝印画警示标识；维修前必须断电并对大电解电容放电（它存着市电峰值电压！）\n\n补充两个高频名词：X 电容分 X1/X2 等级、Y 电容分 Y1/Y2 等级（耐冲击等级不同，按电路位置选）；整机的安规认证（国内 CQC、欧盟 CE、美国 UL 等）都会检查上述间距与器件选型。\n\n新手红线：AC-DC 先学原理、看懂成熟产品板即可，**不要自己设计带市电的实验板**。市电带电测试须由受训人员使用适合的隔离与测量设备按安全规程执行；隔离设备不消除触电风险。深入内容放后续课程。\n\n### 10.6 进阶主题点名（规则先记，深学在第 19 课）\n\n| 主题 | 是什么 | 入门规则（经验值） |\n|---|---|---|\n| 拼板（Panelization） | 多块小板拼成大板生产 | 规则矩形分板用 V-cut；异形用邮票孔；四周留约 5mm 工艺边 |\n| 叠层设计（Stackup） | 多层板的层排列 | 经典 4 层：信号-GND-电源-信号；关键信号参考完整地平面 |\n| 阻抗控制（Impedance） | 控制走线特征阻抗 | 单端 50Ω；USB 差分 90Ω、以太网差分 100Ω（PCIe 常用 85Ω）；线宽线距由叠层参数计算或板厂代算 |\n| 差分线（Differential Pair） | 等长等距成对走线 | 两线紧耦合、全程平行，等长误差按接口规范控制 |\n| T 点拓扑 | 一驱多的对称分支结构 | 分支对称、主干到分支等长，常见于时钟/DDR 布线 |\n| 盲埋孔（Blind/Buried Via） | 不贯穿全板的过孔 | 高密度 BGA 才需要，成本高，现阶段了解即可 |\n| 蛇形等长（Serpentine） | 绕蛇形补偿长度差 | 3W 间距规则（蛇形间距 ≥3 倍线宽），避免密绕自耦合 |\n| 光耦（Optocoupler） | 光信号隔离传输器件 | 用于跨隔离带传反馈/信号；布局时保持其两侧的隔离间距 |\n\n这些主题在高速板与复杂板上组合出现，第 19 课系统展开。现阶段只需：见到名词知道是什么，并避免在电源板里误用（例如乱分割地平面、乱加盲埋孔拉高成本）。\n\n### 10.7 动手项目：12V→5V(Buck)→3.3V(LDO) 电源小板\n\n项目结构为 DCDC 先降压，再由 LDO 产生 3.3V；效率、纹波和噪声需依据选定器件与负载核对。\n\n参考选型（商城均可搜到，同类型替换亦可）：\n\n| 模块 | 参考型号 | 说明 |\n|---|---|---|\n| 5V Buck | TPS54331 / MP1584EN 等 | 资料全、Layout 章节写得清楚，适合精读 |\n| 3.3V LDO | AMS1117-3.3 或低压差新型号 | 5V→3.3V 压差 1.7V，Dropout 余量充足 |\n| 接口 | DC 电源座 / 排针 / 测试点 | 输入 12V，输出 5V 与 3.3V 各留测试点 |\n\n设计流程（必须走完）：\n\n1. 画电源树与功耗预算：各路最大电流、各级压差与发热估算\n2. 精读 Buck 数据手册：先读 Pin Description（引脚定义），再读典型应用图，**最后精读 Layout Guidelines 一节，逐句对照自己的布局**——这是本课最重要的作业\n3. 原理图：以所选器件典型应用图为起点，按实际输入、输出、环路、反馈及保护要求逐项核算\n4. 布局：严格按 10.2.4 十条军规执行，每条做完打钩\n5. 布线与铺铜：按电流、热条件核算路径；EP 连接与散热过孔依实际器件和工艺决定\n6. DRC 清零，输出 Gerber 与 BOM\n7. （打样回来后）上电测试：空载电压、带载电压、示波器测纹波（测试方法搜索 \"示波器 测纹波\"）\n\n上电调试的安全顺序（电源板必守）：\n\n1. 焊接完成后，万用表先量输入电源对地阻抗，排除短路\n2. 使用合适的限流电源；按预期空载、启动电流和输入电容浪涌设置限流并监测，不套用固定 100mA\n3. 由前级到后级逐级确认电压：先 12V → 5V → 3.3V\n4. 空载正常后再逐步接入负载；用合适的温度测量工具监测器件温升\n5. 出问题立即断电，先放电再排查，不带电检修\n\n**电源预算练习（题设示例）：**12V 输入，Buck 输出 5V，为外部负载提供 0.5A，同时给 3.3V、0.1A 的 LDO 供电。忽略 LDO 自身电流，Buck 侧总电流约 0.6A、输出功率约 3.0W；若 Buck 在该工作点效率假设为 85%，其输入功率约 3.53W、12V 输入电流约 0.294A。LDO 功耗约 0.17W。启动峰值、效率变化、压差和温升都需由真实器件和负载重新核对。\n\n**反馈习题参考：**题设 Vref=0.6V、R2=10kΩ，按 Vout=Vref(1+R1/R2)：3.3V 时 R1=45kΩ；5V 时 R1≈73.33kΩ，可比较 E96 的 73.2kΩ，标称输出约 4.992V。只对采用该反馈结构的芯片成立，仍须核对分压电流、容差与手册要求。\n\n### 10.8 与电路基础的衔接\n\nLDO、Buck、Boost 等供电方案的入门原理和变压器专题统一放在[第 05 课 · 05.11～05.12](#/lesson/05)。本课重点学习电源模块选型、布局、测试和设计实践。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 拓扑手绘 | 手画 Buck 与 Boost 拓扑，标出导通/关断两阶段的电流回路（拍照存档） |\n| 2 | FB 分压计算 | 给定 Vref=0.6V，算出目标 3.3V 与 5V 两组的 R1/R2（E96 取值） |\n| 3 | 精读 Layout Guidelines | 摘抄所选 Buck 手册 Layout 章节全部要点，整理成自查清单 |\n| 4 | 电源小板原理图 | 12V→5V→3.3V 两级结构完整，编译无错 |\n| 5 | 电源小板布局 | 十条军规逐条自查通过并留记录 |\n| 6 | 布线与散热 | 路径按电流及压降核算，EP 散热方案有依据，DRC 检查完成 |\n| 7 | 输出与验证 | Gerber + BOM 完整；（进阶）打样上电测电压与纹波 |\n\n## ✅ 自测清单\n\n- [ ] 能手画 Buck/Boost 拓扑并讲出开关两阶段的电流路径\n- [ ] 能在理想稳态、CCM 条件下写出 Buck 的 Vout = D×Vin、Boost 的 Vout = Vin/(1−D)\n- [ ] 能说出 DCDC 五大外围元件的作用与选型要点（含电感饱和电流经验余量）\n- [ ] 能背出 DCDC 布局十条军规中的至少 8 条并解释物理原因\n- [ ] 能解释\"大电流环路面积最小化\"为什么重要\n- [ ] 能说明 FB 远离开关节点、缩短采样回路，并按芯片手册选择采样点\n- [ ] 能从效率/纹波/成本/噪声四个维度完成 LDO vs DCDC 选型对比\n- [ ] 能解释 Dropout，并按具体型号、负载与最坏条件计算所需输入电压\n- [ ] 能算 LDO 功耗 P=(Vin−Vout)×I 并判断封装是否够用\n- [ ] 能说出 PMU 上电时序为什么重要\n- [ ] 能说明 AC-DC 的绝缘距离、适用安规器件和初次级边界；Y 电容是否需要依拓扑和安全设计确定\n- [ ] 能说出 50Ω/90Ω/100Ω 分别对应什么信号\n- [ ] 知道 EP 的电气和散热要求为何需查手册，过孔与铺铜应按热设计和装配工艺决定\n\n- [ ] 我能说明不同变压器可能用于变压、隔离或阻抗匹配，并解释匝比与绝缘条件\n- [ ] 我能解释开关频率与磁性元件尺寸的设计权衡，以及反激磁性元件的储能作用\n\n## ⚠️ 新手常见坑\n\n1. **输入电容放得远**：CIN 离 IC 两三厘米，纹波暴涨甚至因振铃超耐压损坏芯片。CIN 必须紧贴 VIN/PGND 脚。\n2. **FB 走线从 SW 或电感旁边过**：输出电压漂移、抖动，示波器上毛刺大。改道绕行 + 缩短 FB 走线。\n3. **电感饱和电流不够**：满载时电感啸叫、发烫、限流提前触发。按峰值电流 1.3 倍以上选（经验值）。\n4. **LDO 大压差带大电流**：5V→3.3V、500mA 时 P = 0.85W，SOT-23 封装烫到稳不住。先算功耗，再换封装或改前级 DCDC。\n5. **高压板当普通板画**：初次级间距不足、隔离带内走线铺铜——安规不过、认证报废，还有触电风险。隔离区的间隙与爬电距离必须按适用标准、器件绝缘和污染等级确定，不能把单一数字当通用安规要求。\n6. **忽略散热焊盘**：EP 若未按要求焊接或散热不足，可能超温；应按器件手册和热设计决定焊盘连接、铺铜及是否使用过孔。\n7. **乱分割地平面**：把 GND 切得七零八落，回流路径绕远、EMI 变差。新手双面板整板 GND 大铺铜即可，分地要慎之又慎。\n\n## 📚 延伸学习\n\n- B 站搜索关键词：\"Buck 电路 原理 动画\"、\"DCDC PCB layout 讲解\"、\"LDO dropout 详解\"、\"反激 电源 原理\"、\"开关电源 环路 补偿\"\n- 厂商文档（搜索关键词）：\"TI application note buck converter layout\"、\"ADI LDO tutorial\"、\"TPS54331 datasheet Layout Guidelines\"、\"电源设计 黄金法则\"（TI/ADI/MPS 官网应用笔记板块）\n- 书籍参考：Pressman《开关电源设计》——深入阶段再读\n- 实战对比：搜一块开源电源板（如 \"MP1584 开源 原理图\"），对照自己的布局比较 SW 节点面积与电流环路","taskSignature":"f2381fb3328922421eb9ec7af75439e91b29b4d56575098bf85a51d48cd3805b","taskCount":15},{"id":"11","title":"第 11 课 · 接口模块","short":"接口模块","stage":2,"diff":3,"prev":"第 10 课 · 电源模块","optional":false,"md":"接口（Interface）是 PCB 上\"事故率\"最高的区域：要被反复插拔、要承受静电（ESD）与浪涌、还要跑高速信号。这一课把 7 类最常见的接口逐个拆开，用统一的三段式方法建立你自己的\"接口速查手册\"。\n\n## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 用\"协议 → 电路 → 布局布线\"三段式拆解任何一个没见过的接口，而不是死记硬背规则；\n2. 说出 USB2.0/USB3.0、HDMI、VGA、RJ45、SATA、SIM、TF 卡各自的信号组成、速率等级与差分阻抗要求；\n3. 按接口器件手册规划连接器、并联 ESD/TVS、可选滤波与芯片的位置，并解释泄放路径；\n4. 解释网络变压器的三大作用，独立完成 RJ45 接口区域的隔离挖空与 Bob Smith 端接布局；\n5. 为每种接口写出\"布局要点清单 + 布线规则表\"，汇总成个人速查手册；\n6. 拿到一块主流开发板，能对照丝印辨认每个接口区域，并说出其布线特点与设计意图。\n\n## 📖 正文\n\n### 11.1 三段式拆解法：学接口的通用方法论\n\n接口种类繁多，但拆解方法只有一套。以后每遇到一个新接口，都按下面三步走：\n\n1. **协议简介**：信号有几根？速率多快？差分（differential）还是单端（single-ended）？→ 速率和信号形式决定了布线难度与等长（length matching）要求；\n2. **电路组成**：连接器、ESD 保护、TVS 管、共模电感、滤波阻容、PHY/接口芯片各自在哪？→ 元件种类和顺序决定了摆放次序；\n3. **布局布线要点**：阻抗多少、等长多少 mil、参考层是否完整、防护器件离接口多远？→ 汇总成一张规则表，日后当速查手册用。\n\n**先记住本课所有接口的一张总表**（均为经验值，具体以所用主控/PHY 芯片的官方 Layout Guide 为准）：\n\n| 接口 | 信号形式 | 典型速率 | 差分阻抗 | 等长要求 | 是否热插拔 |\n|:---|:---|:---|:---|:---|:---:|\n| USB 2.0 | 1 对差分 D± | 480 Mbps | 90Ω | 以芯片指南与时序预算为准 | 是 |\n| USB 3.0 | 3 对差分（D± + TX± + RX±） | 5 Gbps | 90Ω | 按芯片指南确定对内与对间偏斜预算 | 是 |\n| HDMI TMDS | 3 对数据 + 1 对时钟 | 依版本与模式 | 常见目标 100Ω | 按发射/接收器及通道预算 | 依系统设计 |\n| VGA | 3 路模拟 + 2 控制信号 | 取决于显示模式 | 视频路径视带宽与长度考虑 75Ω | 视系统时序与图像质量要求 | 视设备设计 |\n| RJ45 千兆 | 4 对 MDI 差分 | 每对 125 MBd，四对并行 | 100Ω | 对内 ±5~10 mil，对间放宽 | 是 |\n| SATA 3.0 | 2 对差分（TX/RX） | 6 Gbps | 100Ω | 以芯片指南与时序预算为准 | 是 |\n| SIM / TF 卡 | 单端信号 | SIM 依卡与接口；TF SDR104 时钟最高 208 MHz | 按信号模式和器件指南 | 按速率及时序预算 | 取决于卡座、控制器和系统设计 |\n| MIPI 摄像头 | D-PHY 数据与时钟差分 lane | 依版本和器件 | 常见目标 100Ω | 按发射/接收器及通道预算 | 依系统设计 |\n\n> 观察：**凡是高速串行接口（USB3/HDMI/SATA/千兆网），无一例外都是受控阻抗差分对 + 对内等长**；SIM、TF、SDIO 等单端接口，重点就换成串扰控制与 ESD 防护。记住这条规律，接口模块就懂了一大半。\n\n### 11.2 USB 2.0 / USB 3.0\n\n#### 协议简介\n\nUSB 2.0 只有 4 根线：VBUS（5V）、D+、D-、GND。三种速率：低速 1.5 Mbps、全速 12 Mbps、高速 480 Mbps。D± 是一对 90Ω 差分对，但注意低速/全速使用差分 J/K 状态，也使用 SE0 等单端状态；走线阻抗与偏斜应按器件指南、接口模式及通道预算确定。\n\nUSB 3.0（SuperSpeed）在 USB 2.0 基础上增加了两组 5 Gbps 差分对：**TX±（主控发出）和 RX±（主控接收）**，加上原有 D±，共 **3 对差分**（A 型母口因此多出 5 个触点（4 信号 + 1 地））。TX 线上各有一颗交流耦合电容（常用 0.1 μF 量级，靠近发送端放置，以规范/手册为准）。\n\n#### 电路组成\n\n典型 USB 接口\"三件套\"：**连接器 → ESD 保护 → 主控**，可选共模电感：\n\n- **ESD/TVS 管**：接口常用低电容保护阵列。除结电容外，还须核对工作电压、钳位电压、脉冲波形、漏电、布局及通道损耗；按器件和接口的信号完整性预算选型，不能只看一个电容数字；\n- **共模电感（CMC）**：可用于抑制共模干扰，但也会引入差分插入损耗及阻抗不连续；是否需要由芯片指南、通道预算与 EMC 测试决定；\n- **VBUS 防护**：依据端口角色和功率预算选择适当的过流、过压与 ESD 保护；电容大小、启动浪涌、反灌及开关方案按规范和芯片手册核验，不能套用固定器件与大电容。\n\n#### 布局要点清单\n\n- [ ] ESD/TVS 靠近连接器和信号入口，缩短信号到保护器件及其地端的引线，按器件指南优化泄放回路；\n- [ ] 如选用共模电感，按芯片及防护参考设计确定信号路径上的位置；TVS 是并联泄放支路；\n- [ ] 交流耦合电容（USB 3.0）靠近发送端，不放在接收端；\n- [ ] 接口元件集中摆放，D±/TX/RX 出连接器后立即进入防护区，不绕行、不打桩（stub）；\n- [ ] 连接器外壳如何接机壳地、系统地或隔离网络，按整机 EMC、安全和连接器指南设计。\n\n#### 布线规则表\n\n| 规则项 | USB 2.0 | USB 3.0 | 备注 |\n|:---|:---|:---|:---|\n| 差分阻抗 | 90Ω ±10% | 90Ω ±10% | 3 对都按 90Ω |\n| 对内等长 | 按控制器和通道预算 | 按控制器和通道预算 | 不能将单一长度差作为通用保证 |\n| 对间等长 | 按通道与控制器预算 | 按通道与控制器预算 | TX/RX 方向与约束分别核查 |\n| 线宽/间距 | 按叠层计算（如 0.15/0.15 mm 起） | 同左 | 用阻抗计算工具算，勿抄别人的值 |\n| 参考层 | 完整地平面，禁跨分割 | 同左 | 换层处伴随地过孔 |\n| 过孔数量 | ≤2 个/对 | 尽量 0~1 个 | 过孔 = 阻抗突变点 |\n| 拐角 | 45° 或圆弧 | 同左，且两根线同步拐 | 避免直角 |\n\n> 顺带一提：Type-C 是可反插连接器规范，接口可以只支持 USB 2.0；是否具备 SuperSpeed、PD 或其他模式取决于产品、线缆及配置，不能由插头形状判断。需要 SuperSpeed 时，依据具体接口角色、方向检测、信号切换与芯片手册设计。学完本课再去查 Type-C 引脚定义即可。\n\n**Type-C 低压受电端入门例：**如果产品使用 USB-C 母座，只作为不协商 PD 的 5V 受电端，CC1 和 CC2 通常各自配置符合规范的 Rd 下拉；VBUS、GND、D+/D− 的引脚合并、去耦、ESD、防反灌及电流预算应按连接器、USB-C 规范和所选控制器参考设计核对。不能仅把 VBUS 和 GND 接上就假设所有线缆和主机都能正常供电。带 PD、双角色或高速切换的产品需相应控制器与完整设计。\n\n### 11.3 HDMI\n\n#### 协议简介\n\nHDMI 1.4/2.0 的 TMDS 模式采用 **TMDS（Transition Minimized Differential Signaling）差分对**：3 对数据（D0/D1/D2）+ 1 对时钟，**共 4 对差分**。HDMI 1.4 每对 ≤3.4 Gbps，2.0 提升到每对 6 Gbps。HDMI 2.1 的 FRL 模式采用不同的数据通道安排，不能照搬 TMDS 时钟对描述。此外还有低速信号：DDC（I²C 的 SCL/SDA，读显示器 EDID）、CEC、HPD（热插拔检测）和 +5V 电源。\n\n**阻抗注意**：不少入门资料写\"HDMI 90Ω\"，那是把 USB 的数值记串了。HDMI 规范的 TMDS 差分阻抗是 **100Ω（±15%）**；个别主控手册会给出自己的推荐区间（如 90~100Ω），**设计时以主控 Layout Guide 为准**。\n\n#### 电路组成\n\n- **ESD 阵列**：4 对 TMDS 共 8 根线，通常用多通道低结电容（<0.5 pF）ESD 阵列一颗搞定，紧贴连接器；\n- **共模电感/ESD 滤波阵列**：TMDS 每对可选共模电感，压 EMC；\n- **DDC/CEC/HPD**：低速线，常规 ESD（结电容不敏感）+ 上拉电阻即可。\n\n#### 布局要点清单\n\n- [ ] 低电容 ESD 支路靠近连接器与信号入口，缩短信号支路和接地回路；\n- [ ] 4 对差分整组并行走线，同层、同过孔数、同拐角，\"共进退\"；\n- [ ] TMDS 下方参考地平面完整，整组一次换层（最多 1 次）；\n- [ ] DDC/CEC 与 TMDS 分开，不要混扎在差分对之间。\n\n#### 布线规则表\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 差分阻抗 | 按器件、接口与叠层设计指南确定（常见目标 100Ω） | 核对完整通道而非只看走线 |\n| 对内等长 | 依器件与通道预算 | 补偿位置与形状按设计指南 |\n| 对间等长 | 依器件与通道预算 | 核对时钟与数据间的传播延迟 |\n| 参考层 | 完整、不跨分割、不跨挖空区 | 否则阻抗与串扰同时恶化 |\n| 长度 | 总长尽量短，各组接近 | 长度差带来的偏移无法靠端接修复 |\n| 过孔 | ≤1~2 个/对，4 对一致 | |\n\n### 11.4 VGA\n\n#### 协议简介\n\nVGA 是纯**模拟接口**：R/G/B 三路视频信号（各 0.7 Vpp、内阻 75Ω）+ 行同步 HSYNC / 场同步 VSYNC 两根数字信号，15 针 DSUB 连接器。没有数字链路的时钟恢复，RGB 通道仍需评估相对延迟——它的敌人不是偏斜，而是**噪声**：任何耦合进 R/G/B 的数字噪声都会直接变成屏幕上的花纹。\n\n#### 电路组成\n\n依据 DAC 输出结构、负载与厂商参考电路设计 RGB 的滤波和 75Ω 视频系统匹配；部分驱动器已集成所需输出或端接，不能默认每通道串 75Ω。同步线串阻及模拟供电滤波同样按芯片指南决定。\n\n#### 布局要点清单\n\n- [ ] R/G/B 滤波网络一字排开，放在 DAC 与连接器之间的直线通路上；\n- [ ] VGA 区域整体远离晶振、DCDC 开关节点、HDMI/USB 差分线；\n- [ ] 模拟地（AGND）与数字地在 VGA/DAC 附近单点连接（或统一地平面 + 布局分区，第 12 课音频一节展开讲两种流派）；\n- [ ] 连接器固定脚接地，外壳屏蔽接地。\n\n#### 布线规则表\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 阻抗 | 根据带宽、边沿、路径长度及器件指南判断 | 较长或快速的视频路径需考虑与 75Ω 系统匹配 |\n| 等长 | 根据系统允许的通道延迟差评估 | 延迟不匹配可能造成颜色错位；幅度误差还涉及阻抗和损耗 |\n| 间距 | R/G/B 相互间距 ≥3W，对数字信号间距更大 | 防串扰是 VGA 的头等大事 |\n| 包地 | 条件允许时两侧包地 + 地过孔 | 尤其走在数字区附近时 |\n| 总长 | 短直 | 每一毫米都是噪声天线 |\n\n### 11.5 RJ45 百兆 / 千兆以太网\n\n#### 协议简介\n\n百兆（100BASE-TX）用 2 对差分，千兆（1000BASE-T）用 **4 对差分（MDI，Medium Dependent Interface），每对 100Ω**。PHY 芯片与网线之间必须隔一颗**网络变压器（Magnetics）**，这是网口电路的核心。\n\n**网络变压器的三大作用**：\n\n1. **电气隔离**：磁性器件可隔开 PHY 侧与线缆侧的直流通路；耐压和绝缘应按器件、接口及整机标准确认，隔离本身不能替代雷击或浪涌保护；\n2. **信号耦合**：按 PHY 的接口与磁性器件要求传递信号，双绞线和 PCB 通道阻抗应按规范及参考设计匹配；不能只靠变压器保证匹配；\n3. **共模抑制**：磁性组件常组合变压器与共模扼流圈，提供一定共模抑制；插入损耗、共模阻抗和浪涌能力须看具体组件频率特性与系统设计。\n\n关于 **MDI/MDI 交叉（crossover）**：历史上同类设备互联要用交叉网线（T568A/B 两种压线顺序）；部分 PHY 支持 Auto-MDIX，可在规定模式下处理线缆中的发送与接收对交换；具体能力及配置依器件而异。**这不等于 PCB 上可以任意交换 PHY 引脚或变压器线对**：应按 PHY、磁性器件与 RJ45 的参考电路核对绕组、中心抽头和极性。\n\n**POE（Power over Ethernet）简介**：802.3af/at/bt（约 15/30/60~90 W），PSE 供电设备按具体供电模式通过线对施加直流电；可能采用两对或四对，部分方案使用变压器的中心抽头，PD 受电端用二极管桥整流 + PD 控制器取电。POE 板上这部分按大电流电源设计：走线宽度按压降计算（bt 90W 时每对线电流可达 1A 级）、变压器和连接器要选 POE 等级、隔离爬电要求更高。\n\n#### 电路组成\n\n- **RJ45 连接器**：可选\"内置变压器\"型号（如 HR91105 类，省布局）或外置变压器；\n- **线侧共模端接**：部分设计采用 Bob Smith 终端；是否需要、中心抽头/未用线对如何连接及电容绝缘额定值，必须以磁性器件、PoE 和 PHY 参考设计为准，不能固定套用 4×75Ω；\n- **PHY 侧**：4 对 MDI 差分 + PHY 的 Rset/晶振等常规电路；线侧可加低容 TVS/气体放电管做浪涌防护（室外或工业场合必备）。\n\n#### 布局要点清单\n\n- [ ] 变压器紧贴 RJ45（用内置变压器的连接器则一步到位）；PHY 与变压器之间距离尽量短（经验值 ≤25~50 mm，以 PHY 手册为准）；\n- [ ] 按磁性器件和整机隔离要求标出隔离边界；是否在器件下方挖空、范围与绝缘距离依封装、PCB 结构、适用标准及 PHY/连接器指南确定；\n- [ ] 如使用 Bob Smith 网络，按参考电路连接线侧与机壳参考；机壳地和系统地的关系依隔离、浪涌、ESD 与整机设计确定，不能预设单点或固定元件；\n- [ ] 连接器 HR 外壳脚、变压器屏蔽脚就近接地。\n\n#### 布线规则表\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 差分阻抗 | 100Ω（PHY 侧 MDI 与线侧都是） | 4 对一致 |\n| 对内等长 | ±5~10 mil | 相对宽松，但别放飞 |\n| 对间等长 | 无硬性，尽量 ±100 mil 内 | 千兆每对独立 CDR |\n| PHY-变压器距离 | ≤25~50 mm，越短越好 | 长了端接和 EMI 都难办 |\n| 隔离区 | 依具体器件、布局及适用标准确定 | 不能把 2mm 当作所有产品的安全保证 |\n| 电源 | 千兆 PHY 1.8V/2.5V 就近去耦 | 网口不稳先查电源 |\n\n### 11.6 SATA\n\n#### 协议简介\n\nSATA（Serial ATA）三代速率：1.5 / 3 / 6 Gbps。每个 SATA 通道就是 **TX±/RX± 两组 100Ω 差分对**（规范 ±15%），TX 线带交流耦合电容（常用 0.01~0.1 μF，靠近发送端，以主控手册为准）。协议层内嵌时钟（CDR），对内偏斜与通道损耗按控制器和连接器指南确定，不能统一套用一个长度差。\n\n#### 布局要点清单 + 布线规则表\n\n- [ ] 主控 SATA 控制器与连接器之间走线尽量短（经验值 ≤150 mm），mSATA/M.2 形态则按金手指扇出；\n- [ ] 两组差分并排走，同层、同过孔数，参考层完整；\n- [ ] 耦合电容垫在发送端路径上，不形成分支。\n\n| 规则项 | 经验值 |\n|:---|:---|\n| 差分阻抗 | 100Ω ±10%（规范容差 ±15%，取严做设计目标） |\n| 对内等长 | 依控制器与通道预算 |\n| 参考层 | 完整地平面，禁跨分割 |\n| 总长 | ≤150 mm，短直优先 |\n| 过孔 | ≤2 个/对 |\n\n### 11.7 SIM 卡\n\n#### 协议简介\n\nSIM 卡遵循 ISO 7816 接触式智能卡协议，核心 4 个信号：**VCC（电源，Class B 3.0V / Class C 1.8V）、RST（复位）、CLK（时钟）、DATA（双向数据）**，加 GND；卡座一般还引出 1~2 个插拔检测（DET）脚。信号速率低（兆赫兹级），**没有等长要求**，重点是 ESD 防护与走线短。\n\n#### 电路组成\n\n- **ESD 阵列**：SIM 卡接口可能承受静电；是否支持带电插拔由控制器、卡座及软件共同决定。按接口手册选择 VCC/RST/CLK/DATA 的保护及布置；\n- **滤波**：VCC 就近 100 nF + 1 μF；RST/CLK 常串 22Ω 抑制过冲；DATA 上拉 10 kΩ；\n- 卡座 DET 脚上拉到主控 GPIO。\n\n#### 布局要点清单 + 布线规则表\n\n- [ ] 卡座靠近主控/基带芯片，走线整体短；\n- [ ] ESD 器件靠近卡座信号入口，缩短并联支路及泄放回路；\n- [ ] CLK 线远离天线与射频区（第 12 课），防止时钟谐波干扰接收；\n- [ ] 卡座周边留出插拔操作空间，不摆高元件。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 阻抗/等长 | 常规 50Ω 单端，无等长要求 | 低速总线 |\n| 走线长度 | 尽量短（<50 mm 量级） | 走线长 = 天线长 |\n| 防护 | ESD 阵列紧贴卡座 | 热插拔必配 |\n| 电源 | 100 nF + 1 μF 就近 | VCC 稳是识别卡的前提 |\n\n### 11.8 TF 卡（SD 卡）\n\n#### 协议简介\n\nTF 卡（MicroSD）信号：**CLK、CMD（命令/响应，双向）、DAT0~DAT3（数据）**。总线宽度有 1 线 / **4 线模式（DAT0~3，TF 卡的常态）**；**8 线模式（DAT0~7）** 出现在 eMMC 和部分主控复用的 SD 控制器上，TF 卡本体按 4 线用。速率档位：默认 25 MHz、高速 50 MHz、UHS-I 的 SDR50/SDR104（50/208 MHz，1.8V 信号）——速率决定等长松紧。\n\n#### 电路组成\n\n- **上拉电阻**：CMD 与 DAT0~3 每根上拉 10~50 kΩ（UHS 模式按手册调整阻值），**CLK 不上拉**；\n- **串阻**：CLK（必要时 CMD）串 22~33 Ω，靠近主控端，做源端匹配；\n- **ESD**：TF 卡必配 TVS 阵列（热插拔），紧贴卡座。\n\n#### 布局要点清单 + 布线规则表\n\n- [ ] 卡座放板边，方便插拔，ESD 紧贴卡座；\n- [ ] 根据控制器的时序预算处理 CLK 与 DAT/CMD 的传播延迟；不能默认 CLK 一定要最长；\n- [ ] 串阻、上拉电阻集中摆放，不落在差分/时钟密集区。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 等长（25/50 MHz） | 宽松，±300 mil 内一般可工作 | 别花一下午绕普通 TF 卡的蛇形线 |\n| 等长（SDR50/104） | CLK 与 DAT/CMD 差 ±50~100 mil 级 | 高速档位必须收紧 |\n| 总长 | ≤100 mm 量级，短为好 | 以主控手册为准 |\n| 阻抗 | 50Ω 单端 | 高速档注意 |\n| 电源 | 3.3V 就近 10 μF + 100 nF，可加负载开关 | 支持热插拔断电更稳 |\n\n### 11.9 接口通用防护与机械要点\n\n不同接口的细节各异；下面是通用检查方向，具体连接、距离和器件必须按目标系统确定：\n\n1. **防护连接**：多数 TVS 是从信号线并联到参考地的泄放支路，不要求信号串过 TVS。应让信号入口靠近器件连接点，缩短支路与地回路；共模器件、串阻是否需要及其顺序依具体电路确定。\n2. **ESD 布局三原则**：连接点靠近接口、并联支路短、泄放回路到合适参考地短而低阻抗；过孔数和布局按器件及板层指南确定。\n3. **按速率选结电容**：低速口（VGA 同步、SIM、TF）结电容不敏感；USB 2.0 高速选 <5 pF；USB 3.0/HDMI/MIPI 选 <0.5~1 pF。结电容标错一个量级，高速口眼图就没了。\n4. **连接器机械净空**：按所选连接器的定位孔、金属壳、焊盘、插拔行程及图纸定义禁布区；本体下是否允许布线或铺铜因结构而异，须检查铜到金属件与孔的间距。\n5. **拔插应力区加固**：高频插拔的接口（USB/TF/SIM/网口）焊盘加大或选用带塑料锚固柱的连接器；卡座正后方 5 mm 内不摆 0201/0402 小件与细走线（会被反复撬裂）；板边连接器加安装孔螺丝固定。\n6. **认证意识**：对外接口按 IEC 61000-4-2（接触 ±8 kV / 空气 ±15 kV）的等级设计余量，防护电路按\"会有人带电插拔\"来假设。\n\n### 11.10 工业接口三兄弟：RS232 / RS485 / CAN\n\n前面 7 类接口统治消费电子，还有一族接口统治另一片领地——工厂、电表、充电桩、汽车。它们速率不高（kbps~Mbps 级），但个个抗造：传得远（百米到千米）、耐共模、防浪涌。这就是工业接口三兄弟，仍然用三段式拆解，并入你的速查手册。\n\n#### RS232：老牌串口\n\n**协议简介**：RS232（EIA/TIA-232）是最老牌的串行接口，9 针 DSUB 是它的经典形象，现在常用 3 线简化接法（TXD/RXD/GND）。速率一般 ≤115.2 kbps，距离短（经验值 ≤15 m）。它最大的特点是**电平古怪**：逻辑 1 用 −3~−15V、逻辑 0 用 +3~+15V（典型 ±12V 摆幅）——与 MCU 的 0/3.3V 完全不兼容，直连可能造成损坏或通信异常，应使用满足电压及协议要求的转换电路（如适用的 MAX3232 类器件）。\n\n**电路组成**：\n\n- **电平转换芯片**（MAX3232 类）：内部电荷泵把 3.3V/5V 泵出正负摆幅，MCU 的 TX/RX 在这里变成 RS232 电平；\n- **电荷泵电容**：典型 4 颗（0.1 μF 量级，以芯片手册为准），是芯片产生负压的\"泵芯\"；\n- 可选防护：线侧 TVS（±15V 级钳位）+ 串阻限流。\n\n**布局布线要点**：\n\n- [ ] 电荷泵电容**紧贴芯片引脚**、回路最短——泵回路里全是开关噪声，放远了负压不稳、EMC 恶化；\n- [ ] TXD/RXD 走线短直（≥0.2 mm），远离晶振与时钟线；速率低，无阻抗与等长要求；\n- [ ] 转换芯片靠近连接器放，缩短高压侧走线。\n\n#### RS485：差分总线，工业通信主力\n\n**两端端接示意：**两只端接电阻分别跨接总线的两条线。若线缆特性阻抗约 120Ω，端接可从 120Ω 开始设计；是否需要端接及其阻值要结合速率、长度和实际波形判断。A/B 命名在器件间可能不同，应以手册的电压定义核对。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 330\" role=\"img\" aria-label=\"RS485差分总线两端跨接终端电阻的接线示意\" style=\"max-width:760px\">\n<style> .w{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .box{fill:none;stroke:currentColor;stroke-width:3} .t{fill:currentColor;font:18px sans-serif} .sm{fill:currentColor;font:15px sans-serif} .node{fill:currentColor} <\/style>\n\n<rect class=\"box\" x=\"35\" y=\"110\" width=\"130\" height=\"110\"/><rect class=\"box\" x=\"590\" y=\"110\" width=\"130\" height=\"110\"/>\n<path class=\"w\" d=\"M165 140H590 M165 190H590 M200 140V151 M200 179V190 M555 140V151 M555 179V190\"/>\n<rect class=\"box\" x=\"188\" y=\"151\" width=\"24\" height=\"28\"/><rect class=\"box\" x=\"543\" y=\"151\" width=\"24\" height=\"28\"/>\n<circle class=\"node\" cx=\"200\" cy=\"140\" r=\"4\"/><circle class=\"node\" cx=\"200\" cy=\"190\" r=\"4\"/><circle class=\"node\" cx=\"555\" cy=\"140\" r=\"4\"/><circle class=\"node\" cx=\"555\" cy=\"190\" r=\"4\"/>\n<text class=\"t\" x=\"55\" y=\"165\">收发器 1<\/text><text class=\"t\" x=\"610\" y=\"165\">收发器 2<\/text><text class=\"t\" x=\"365\" y=\"127\">A<\/text><text class=\"t\" x=\"365\" y=\"216\">B<\/text><text class=\"sm\" x=\"215\" y=\"172\">端接 R<\/text><text class=\"sm\" x=\"475\" y=\"172\">端接 R<\/text><text class=\"sm\" x=\"130\" y=\"262\">电阻跨接 A/B；中间节点可接入总线，支线应尽量短<\/text><text class=\"sm\" x=\"130\" y=\"292\">偏置、共模参考、隔离及防护按实际系统设计<\/text>\n\n<\/svg>\n```\n\n\n**协议简介**：RS485（EIA/TIA-485）跑在**一对差分线 A/B** 上：接收器依据 A/B 差分电压判断状态，同时必须满足其规定的共模和绝对输入范围；A/B 命名与极性以具体器件手册为准。速率与距离此消彼长：短距可 10 Mbps、长距 100 kbps 传约 1200 m（经验值）。常见两线制是**半双工**，同一对线分时收发；也有四线制等实现。方向控制取决于收发器与协议；支持**多点组网**，一条总线挂几十个节点，典型一主多从轮询。\n\n**电路组成**：\n\n- **收发器**：MAX485、SP3485 类；MCU 侧接 TXD/RXD/DE，线侧出 A/B；\n- **终端电阻**：需要端接的线型总线通常在物理两端跨接接近线缆特性阻抗的电阻；120Ω 是常见例子，是否需要及阻值由线长、边沿、拓扑与芯片要求决定。中间节点额外端接会增加负载。\n- **偏置电阻**：让总线空闲时差值确定、不\"漂浮\"，取值按节点数计算（以收发器手册为准）；\n- **隔离**：按共模电位差、人员安全、浪涌和系统可靠性评估；若采用电气隔离，须同时设计跨隔离边界的信号、隔离侧供电和绝缘布局；非隔离方案仍要保证共模范围和回流路径；\n- **TVS 防护**：485 专用 TVS（如 SM712 类，钳位电压按 A/B 共模范围选），紧贴接线端子。\n\n**布局要点清单 + 布线规则表**：\n\n- [ ] 隔离区一次规划好：隔离器两侧的器件与地各自成区，隔离带下方全层挖空（与 11.5 变压器挖空同理）；\n- [ ] 终端电阻跨接 A/B，按总线拓扑放在需要端接的两端，不能把两线直接接地；\n- [ ] 顺序仍是\"先防护后芯片\"：端子 → TVS → 共模电感（可选）→ 收发器；\n- [ ] A/B 长距离并肩走、间距一致，下方参考层完整。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 走线形式 | A/B 并肩、同层、同长 | 不必控 100Ω 差分，但两线环境要一致 |\n| 对内等长 | ±10~20 mil 级即可 | 速率低，要求宽松 |\n| 防护 | 485 专用 TVS 紧贴端子 | 浪涌等级按现场选型 |\n| 隔离 | 按具体隔离等级、器件和标准规划 | 两侧供电、信号与绝缘距离须整体核对 |\n| GND | 是否共地按系统设计定 | 简单单板可共地，跨设备现场建议隔离 |\n\n#### CAN：汽车与工业的现场总线\n\n**协议简介**：CAN（Controller Area Network）是汽车发明、工业大量借用的多主总线：**CAN_H/CAN_L 一对差分线**，显性/隐性电平由两线差值表达；经典 CAN ≤1 Mbps（CAN FD 更高），距离随速率下降。它最强的是**协议层可靠性**：硬件仲裁（多主不冲突、优先级无损）、自动重发、CRC 校验、故障节点自动下线——这些由 CAN 控制器完成（很多 MCU 内置），硬件工程师管好物理层即可。\n\n**电路组成**：\n\n- **收发器**：TJA1050、SN65HVD230 类，MCU 的 CAN 控制器（TX/RX）↔ CAN_H/CAN_L；\n- **终端电阻 120Ω**：同样只加总线两端；端接要求应按具体 CAN 物理层、器件手册与实际波形确定，不能仅凭线长直接省略；\n- 依据车厂规范、EMC 测试和收发器指南选择 CAN TVS、共模电感等防护或滤波器件，不能一概假设必配。\n\n**RS485 与 CAN 对比**：\n\n| | RS485 | CAN |\n|:---|:---|:---|\n| 拓扑 | 一主多从轮询为主（协议层自定义） | 多主仲裁（协议层标准化） |\n| 仲裁 | 无，靠软件避让 | 硬件仲裁，优先级无损 |\n| 错误处理 | 应用层自理 | 自动重发、故障节点自动隔离 |\n| 电平 | A/B 差分 ±200 mV 判决阈值 | CAN_H/L 差分，显性/隐性两态 |\n| 典型场景 | 电表、门禁、工控传感网络 | 汽车 ECU、充电桩、工业现场设备 |\n\n**布局布线要点**：与 RS485 同款——终端电阻贴端子、TVS 在最外面、CAN_H/L 并肩走线。车规板额外注意：CAN_H/L 与其他网络的最小间距从严（经验值 ≥0.3 mm 起，按车厂规范执行），接口区加宽包地与敷铜隔离。\n\n#### 工业现场三防：防雷浪涌、隔离、滤波\n\n工业接口的可靠性三板斧，本质是**分级泄放 + 层层设卡**：\n\n1. **防雷/防浪涌（分级防护）**：第一级气体放电管（GDT，泄放雷击级大能量）→ 第二级 TVS（响应快、钳位准）→ 两级之间串 PTC/功率电阻限流解耦。能量大的先粗泄、剩下的精细钳——想靠一级独扛必炸；\n2. **隔离**：若系统需要隔离，按信号隔离、隔离侧供电、参考地、绝缘距离和浪涌回路做完整设计；隔离器本身不保证整机满足安全要求；\n3. **滤波**：共模电感 + 对地电容压共模干扰，A/B、CAN_H/L 各对地并 100 pF~1 nF 级（经验值，注意电容对速率的影响，以收发器手册为准）。\n\n三防的布局要点清单：\n\n- [ ] 根据设计区分并联泄放支路和串联限流/滤波元件，验证浪涌电流路径及器件配合；\n- [ ] 根据实际浪涌路径和合适的机壳/保护参考，缩短泄放回路；过孔数量和间距按设计及器件指南确定；\n- [ ] 隔离带下方全层挖空，隔离两侧器件分区摆放，不交叉、不混地；\n- [ ] 工业接口区整体远离晶振、天线与高速差分区（第 12 课的分区原则）。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|:---:|:---|:---|\n| 1 | 找 3 块开发板/成品板（手边实物或开源项目图），辨认 USB/HDMI/RJ45/TF/SIM 区域 | 每个区能说出防护器件顺序、差分对走向与一条布线特征，写成 300 字笔记 |\n| 2 | 画 USB 2.0 接口原理图（ESD 阵列 + 共模电感 + VBUS TVS），并完成布局布线 | D± 按 90Ω 差分、ESD 距接口 ≤5 mm、DRC 零报错 |\n| 3 | 按选定 PHY 与磁性器件手册画千兆 RJ45 原理图并布局 | 核对 4 对映射、参考设计的共模端接、隔离边界及阻抗要求 |\n| 4 | 等长专项：选定 USB 3.0 与 HDMI 器件并练习约束 | 标注各对的阻抗、偏斜预算和来源，保留布线及验证报告 |\n| 5 | 查一份 ESD 阵列 datasheet（如 USBLC6、TPD4E05 类型号） | 能指出结电容、钳位电压、通道数三个参数并说明选型理由 |\n| 6 | 汇总个人\"接口速查手册\"：7 类接口 ×（阻抗/等长/防护/布局 4 列） | 表格存档，第 12 课综合案例会直接复用 |\n\n## ✅ 自测清单\n\n- [ ] 能说明 USB 2.0 高速差分阻抗的常见目标，并依据器件指南确定偏斜预算；\n- [ ] 能画出 USB 3.0 的三对差分（D±/TX±/RX±）并说明交流耦合电容位置；\n- [ ] 能解释并联 ESD 器件为什么要靠近入口、缩短支路和泄放回路；\n- [ ] 能列
