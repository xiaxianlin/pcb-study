F)² / R` | 电阻功耗 | 同上 |\n| `Vout ≈ Vin − VF` | 防反接输出 | 导通时 |\n| `VZ = Vout` | 稳压管 | 有足够工作电流 |\n\n#### 5.8.2 术语表\n\n| 术语 | 解释 |\n|---|---|\n| 阳极 A | 符号三角形端，正向电流流入 |\n| 阴极 K | 符号横线端，正向电流流出 |\n| 正向压降 VF | 导通时 A-K 电压差 |\n| 反向漏电 IR | 反偏时的小电流 |\n| 反向恢复 trr | 关断时电荷抽走时间 |\n| 击穿 | 反压过高电流骤增 |\n| 稳压管 | 利用击穿区做参考 |\n| TVS | 吸收瞬态浪涌 |\n| 肖特基 | 金属-半导体结，VF 低、漏电大 |\n\n#### 5.8.3 自测 10 题\n\n1. 二极管符号哪端是阴极？\n2. 5V 经一只 VF=0.7V 的二极管，负载端约多少伏？\n3. 1A 电流下 VF=0.6V，二极管功耗多少？\n4. 防反接二极管接反会怎样？\n5. 续流二极管阴极接哪里？\n6. 稳压管为什么不能当大电流电源？\n7. 肖特基的主要优缺点？\n8. LED 为什么必须限流？\n9. TVS 和稳压管有什么区别？\n10. 高频整流为什么不能用普通整流管？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 符号横线一端。\n2. 约 4.3V（实际随电流变化）。\n3. `0.6×1=0.6W`。\n4. 反偏，后级不得电；如果反向电压超限，可能击穿损坏。\n5. 接电源正端（低边开关续流场景）。\n6. 它靠反向电流工作，负载电流过大会让稳压管电流不足，电压跌落；且功率有限。\n7. 优点 VF 低、恢复快；缺点漏电大、耐压通常较低。\n8. LED 的 VF 近似固定，直接接电压源电流会失控。\n9. TVS 吸收短时浪涌、钳位；稳压管做持续小电流参考。两者测试条件和用途不同。\n10. 普通管 trr 长，高频下反向恢复损耗大、波形差。\n\n<\/details>\n\n#### 5.8.4 能力清单\n\n- [ ] 能画出二极管符号，标出 A/K。\n- [ ] 能算串联压降、功耗、LED 限流。\n- [ ] 能判断防反接、续流、OR 的方向。\n- [ ] 能区分普通管、肖特基、稳压管、TVS、LED。\n- [ ] 能查手册的 VF/VR/IF/trr 条件。\n- [ ] 能用万用表和示波器做基本验证。\n\n#### 5.8.5 下一章\n\n下一章讲**三极管（BJT）**：它不仅能像开关一样控制负载，还能放大信号。你会看到“小电流控制大电流”的物理过程，以及 NPN/PNP 在低边、高边电路中的正确接法。\n\n---\n\n<!-- 第 05 章完 -->","taskSignature":"0ba643d8ede7c5fc07caf66c30cb78a2556e3501d0d79c7acaf7a15be6e1fd4d","taskCount":6},{"id":"06","title":"第 06 章 · 三极管","short":"三极管","stage":1,"diff":3,"prev":"第 01～05 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 分清 NPN 和 PNP，认出 B、C、E。\n2. 解释截止、放大、饱和三种状态。\n3. 会算基极电阻、判断开关是否饱和。\n4. 读懂低边开关、高边开关、射极跟随和共射放大。\n5. 知道三极管和 MOS 管各自适合什么场景。\n\n三极管是“用小电流控制大电流”的器件。它既能当开关，也能放大模拟信号；不理解截止、放大、饱和三种状态，后面的 MOS、运放和电源电路都会学得含糊。\n\n## 正文\n\n### 6.1 它解决什么问题：三个真实场景\n\n#### 场景一：单片机引脚带不动继电器\n\n单片机 GPIO 通常只能输出几毫安到十几毫安，继电器线圈可能要几十毫安甚至上百毫安。直接接 GPIO，轻则继电器不吸合，重则把引脚烧坏。\n\n用一个 NPN 三极管做“低边开关”：GPIO 只提供很小的基极电流，三极管把电源到负载的大电流“放行”。这是三极管最经典的用途。\n\n#### 场景二：麦克风的微弱信号要放大\n\n动圈麦克风、驻极体麦克风输出的信号可能只有几毫伏。ADC 根本分辨不了，需要先放大几百倍。三极管可以组成共射放大电路，把微弱交流信号放大到伏级。\n\n这里要注意：放大不是“把电压凭空变大”，能量来自电源；三极管只是用输入信号控制电源能量的输出。\n\n#### 场景三：3.3V 信号要驱动 5V 负载\n\n不同电压域之间需要电平转换。三极管可以搭成简单的电平转换、反相器、缓冲器。它比专用电平转换芯片便宜，但速度、功耗、方向性要具体分析。\n\n\n第 05 章二极管是“单向导电”，本章三极管是“用小电流控制大电流”，第 07 章 MOS 是“用电压控制电流”。三者都是半导体，但控制方式不同。学完本章，你再看 MOS，会更容易理解“为什么 MOS 的栅极几乎不耗电流”。\n\n---\n\n### 6.2 它是什么：用小电流控制大电流\n\n#### 6.2.1 一句话定义\n\n**三极管（BJT，Bipolar Junction Transistor，双极型晶体管）** 是三个端子的半导体器件，用基极电流控制集电极电流。它既能做开关，也能做放大。\n\n三个端子：\n\n- **基极 B（Base）**：控制端，像“阀门的手柄”。\n- **集电极 C（Collector）**：电流流入/流出的主端子。\n- **发射极 E（Emitter）**：电流流出的主端子，箭头画在这里。\n\n原理图位号常用 **Q**，如 Q1、Q2。实物有 TO-92、SOT-23、SOT-89、TO-220 等封装，**同一种封装不同型号的 B/C/E 顺序可能不同**，必须查完整料号的引脚图。\n\n#### 6.2.2 NPN 和 PNP\n\nBJT 分两种极性：\n\n| 类型 | 导通条件（相对 E） | 常见开关位置 | 符号 |\n|---|---|---|---|\n| NPN | B 电位比 E 高，基极电流流入 | 负载下方，低边开关 | 箭头从 B 指向 E，向外 |\n| PNP | B 电位比 E 低，基极电流流出 | 负载上方，高边开关 | 箭头从 E 指向 B，向内 |\n\n> **术语解释：低边 / 高边**\n> **低边开关**指开关器件放在负载和地之间，负载上端直接接电源；**高边开关**指开关器件放在电源和负载之间，负载下端接地。低边开关的驱动参考地，简单；高边开关的驱动参考电源，通常更复杂。\n\n箭头方向表示**发射结正向导通时的约定电流方向**，不是“电流只能这么流”。NPN 的箭头向外，PNP 的箭头向内。不要把箭头当成“电子流动方向”，它是工程约定的电流方向。\n\n#### 6.2.3 三种工作状态\n\n三极管不是只有“开”和“关”，它有三个主要区域：\n\n1. **截止区**：基极驱动不足，集电极电流很小，近似断开。实际有漏电。\n2. **放大区**：基极电流变化能引起较大的集电极电流变化，`IC ≈ β × IB`。用于线性放大。\n3. **饱和区**：基极驱动足够大，集电极电流主要受外部负载限制，C-E 之间压降很小（VCE(sat)）。用于开关导通。\n\n> **术语解释：饱和**\n> 不要和“电感磁芯饱和”混了。三极管的饱和是“电流已经大到器件不再按 β 比例控制”，C-E 压降很小；磁芯饱和是“磁通不再随电流线性增长”。两个概念不同。\n\n**开关电路要让三极管进入饱和，而不是放大区。** 如果基极电流不够，三极管停在放大区，C-E 压降大、发热大，可能烧毁。\n\n#### 6.2.4 它为什么能放大\n\nBJT 的基极-发射极之间是一个 PN 结（类似二极管），基极-集电极之间是另一个 PN 结。正常放大时：\n\n- B-E 结正偏，基极电流注入；\n- B-C 结反偏，集电极收集电流；\n- 基极很薄，大部分载流子穿过基极到达集电极，形成较大的集电极电流。\n\n所以 `IC` 比 `IB` 大很多，比例叫 **电流增益 β（hFE）**。但 β 不是常数，它随 IC、温度、器件批次变化，不能拿手册的一个典型值当保证值。\n\n#### 6.2.5 符号与封装\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 230\" width=\"480\" height=\"230\" role=\"img\" aria-label=\"NPN 和 PNP 三极管符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 100 H110 M110 60 V140 M110 80 L165 45 H195 M110 120 L165 155 H195 M245 100 H325 M325 60 V140 M325 80 L380 45 H410 M325 120 L380 155 H410\"/><path d=\"M148 134 L165 155 L141 150 Z\" fill=\"currentColor\"/><path d=\"M352 138 L337 128 L360 120 Z\" fill=\"currentColor\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"20\" y=\"104\">B<\/text><text x=\"205\" y=\"50\">C<\/text><text x=\"205\" y=\"160\">E<\/text><text x=\"235\" y=\"104\">B<\/text><text x=\"420\" y=\"50\">C<\/text><text x=\"420\" y=\"160\">E<\/text><text x=\"70\" y=\"205\">NPN：箭头向外<\/text><text x=\"280\" y=\"205\">PNP：箭头向内<\/text><\/g><\/svg>\n```\n\n图 6-1 NPN 与 PNP 三极管符号\n\n图中左边 NPN（箭头向外），右边 PNP（箭头向内）。符号上的 B/C/E 是功能名，实物引脚号以手册为准。\n\n常见封装：\n\n| 封装 | 常见场景 | 注意 |\n|---|---|---|\n| SOT-23 | 小信号开关、放大 | 引脚顺序常见 B-E-C 或 B-C-E，必须查 |\n| TO-92 | 插件、实验 | 半圆柱面朝向不同，引脚顺序会变 |\n| SOT-89 | 中小功率 | 中间引脚常与散热焊盘相连 |\n| TO-220 | 功率、需要散热 | 金属背板可能与 C 相连 |\n| SOT-223 | 稳压、驱动 | 散热焊盘连接要查 |\n\n**TO-220 的金属背板通常和集电极相连**，如果直接装在接地散热器上，可能造成短路。必须查手册和绝缘垫片要求。\n\n---\n\n### 6.3 关键参数与数据手册\n\n#### 6.3.1 一张表看懂三极管手册\n\n| 参数 | 符号 | 含义 | 为什么重要 |\n|---|---|---|---|\n| 集电极-发射极耐压 | VCEO | C-E 允许电压 | 负载电源、感性尖峰 |\n| 集电极-基极耐压 | VCBO | C-B 允许电压 | 高边、电平转换 |\n| 发射极-基极耐压 | VEBO | E-B 反向允许电压 | 基极反偏、保护 |\n| 集电极电流 | IC | 允许持续电流 | 负载电流、发热 |\n| 峰值电流 | ICM | 短时允许 | 启动、浪涌 |\n| 电流增益 | hFE / β | IC/IB 比例 | 基极驱动设计 |\n| 饱和压降 | VCE(sat) | 饱和时 C-E 电压 | 损耗、负载电压 |\n| 基极-发射极电压 | VBE | 导通时 B-E 电压 | 基极电阻计算 |\n| 耗散功率 | Pd | 允许功耗 | 散热 |\n| 特征频率 | fT | 电流增益降到 1 的频率 | 高速、放大带宽 |\n| 安全工作区 | SOA | 允许的 V-I 组合 | 避免二次击穿 |\n\n#### 6.3.2 读手册的三个关键点\n\n**第一，hFE 有测试条件。** 手册可能写 `hFE=100～300 @ IC=10mA, VCE=1V`。你设计 500mA 开关时，不能拿这个 100 直接算；要看高电流下的 hFE 曲线，或者直接按“饱和”条件设计，保证足够大的 IB。\n\n**第二，VCE(sat) 有指定的 IC 和 IB。** 比如 `VCE(sat)=0.2V @ IC=100mA, IB=5mA`。这说明该器件在 5mA 基极电流下才能达到这个饱和压降；IB 不够，VCE 会升高。\n\n**第三，Pd 有温度条件。** 25℃ 的 Pd 通常需要无限大散热面；实际封装在 PCB 上可能只能耗散很小功率。看热阻 `RθJA` 和降额曲线。\n\n#### 6.3.3 三极管 vs MOS 管（先有个印象）\n\n| 对比 | 三极管 BJT | MOS 管 MOSFET |\n|---|---|---|\n| 控制量 | 基极电流 | 栅极电压 |\n| 驱动功耗 | 持续需要基极电流 | 稳态几乎不耗电，开关时要充放电 |\n| 导通压降 | VCE(sat)，约 0.1～1V | RDS(on)×I，可很低 |\n| 成本 | 很低 | 低到中 |\n| 适合 | 小电流、低成本、线性放大 | 大电流、高频开关、低损耗 |\n| 弱点 | 基极持续耗电、饱和压降 | 栅极驱动、米勒效应、体二极管 |\n\n本章先把三极管学透，第 07 章再展开 MOS。\n\n---\n\n### 6.4 五个典型电路\n\n#### 6.4.1 电路一：NPN 低边开关\n\n```svg\n<svg role=\"img\" aria-label=\"NPN高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"276.34pt\" width=\"222.05899999999997pt\" viewBox=\"-67.375 -277.49999999999994 222.05899999999997 276.34\"><polygon points=\"108.06,-175.5 99.06,-162.9 90.06,-175.5 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-81.0 L 85.2,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-94.2 L 85.2,-67.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-87.6 L 99.06,-99.48 L 99.06,-106.08\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-74.4 L 99.06,-62.52 L 99.06,-55.92\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-74.4 L 92.227,-68.377\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 97.541 -63.822 L 89.884 -65.644 L 94.57 -71.11 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 99.05999999999999,-106.08 L 99.06,-125.04 L 99.06,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-144.0 L 99.06,-162.9 M 108.06,-162.9 L 90.06,-162.9 M 99.06,-175.5 L 99.06,-194.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 76.0613506232961,-161.07220035616922 L 85.56,-166.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 71.546 -158.492 L 74.632 -163.573 L 77.49 -158.572 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 76.0613506232961,-169.1722003561692 L 85.56,-174.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 71.546 -166.592 L 74.632 -171.673 L 77.49 -166.672 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 99.05999999999999,-194.4 L 99.06,-205.2 L 90.06,-205.2 L 90.06,-241.2 L 108.06,-241.2 L 108.06,-205.2 L 99.06,-205.2 M 99.06,-241.2 L 99.06,-252\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-55.919999999999995 L 99.06,-42.36 L 99.06,-28.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-28.8 L 99.06,-14.4 L 90.06,-14.4 L 108.06,-14.4 M 92.76,-10.08 L 105.36,-10.08 M 97.26,-5.76 L 100.86,-5.76\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-81.0 L 50.4,-81 L 28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-81.0 L 18,-81 L 18,-72 L -18,-72 L -18,-90 L 18,-90 L 18,-81 M -18,-81 L -28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"102.66\" y=\"-93.7\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"102.66\" dy=\"13\">Q1 NPN<\/tspan><\/text><text x=\"138.66\" y=\"-133.48000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"138.66\" dy=\"13\">C<\/tspan><\/text><text x=\"138.66\" y=\"-61.72\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"138.66\" dy=\"13\">E<\/tspan><\/text><text x=\"111.66\" y=\"-182.20000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"111.66\" dy=\"13\">LED<\/tspan><\/text><text x=\"86.46\" y=\"-236.20000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"86.46\" dy=\"13\">RLED<\/tspan><\/text><text x=\"95.46\" y=\"-279.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"95.46\" dy=\"13\">5V<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RB<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><circle cx=\"72\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"72.0\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">B<\/tspan><\/text><\/svg>\n```\n\n图 6-2 NPN 低边开关驱动 LED/负载\n\n```text\n5V ── 负载（LED+限流电阻）── C  Q1  E ── GND\nGPIO ── RB ── B\n```\n\n**工作原理**：\n\n- GPIO 低电平（0V）：B 相对 E 约 0V，IB≈0，Q1 截止，负载不工作。\n- GPIO 高电平（3.3V）：B 通过 RB 得到基极电流，Q1 导通；如果 IB 足够，Q1 进入饱和，C-E 压降很小，负载得到接近 5V 的电压。\n\n**基极电阻计算**：\n\n假设负载电流 `IC=100mA`，手册在 `IC=100mA` 下要求 `IB=5mA` 才能保证 `VCE(sat)≤0.3V`；GPIO 高电平最低 3.0V；VBE(sat) 最大 0.9V。\n\n```text\nRB ≤ (VGPIO − VBE(sat)) / IB\n   = (3.0 − 0.9) / 0.005\n   = 420Ω\n```\n\n可取 390Ω 或 330Ω（IB 更大，饱和更深，但 GPIO 电流也更大）。还要检查：\n\n- GPIO 最大输出电流是否够；\n- RB 太小会不会让 IB 超过 GPIO 或 B-E 结允许值；\n- 负载启动电流是否更大；\n- 关断时是否需要 B-E 下拉电阻，防止 GPIO 高阻时误导通。\n\n**感性负载**：如果负载是继电器线圈，必须在 C 和电源之间反并联续流二极管（阴极接电源正），否则关断尖峰会打穿 Q1。第 04 章已讲过。\n\n```circuitjs\nnpn-switch\n```\n\n#### 6.4.2 电路二：PNP 高边开关\n\n```svg\n<svg role=\"img\" aria-label=\"PNP高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"287.14pt\" width=\"234.527pt\" viewBox=\"-67.375 -223.49999999999994 234.527 287.14\"><polygon points=\"108.06,2.7 99.06,15.3 90.06,2.7 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-81.0 L 85.2,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-94.2 L 85.2,-67.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-87.6 L 99.06,-99.48 L 99.06,-106.08\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-74.4 L 99.06,-62.52 L 99.06,-55.92\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-99.47999999999999 L 92.033,-93.457\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 86.719 -88.902 L 89.69 -96.19 L 94.376 -90.724 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 99.05999999999999,-106.08 L 99.06,-152.04 L 99.06,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-55.919999999999995 L 99.06,-63.96 L 99.06,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-72.0 L 99.06,-63 L 108.06,-63 L 108.06,-27 L 90.06,-27 L 90.06,-63 L 99.06,-63 M 99.06,-27 L 99.06,-18\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-18.0 L 99.06,2.7 M 108.06,15.3 L 90.06,15.3 M 99.06,15.3 L 99.06,36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 112.55999999999999,11.7 L 122.059,17.128\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 126.574 19.708 L 120.63 19.628 L 123.488 14.627 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 112.55999999999999,3.599999999999999 L 122.059,9.028\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 126.574 11.608 L 120.63 11.528 L 123.488 6.527 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 99.05999999999999,36.0 L 99.06,50.4 L 90.06,50.4 L 108.06,50.4 M 92.76,54.72 L 105.36,54.72 M 97.26,59.04 L 100.86,59.04\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-81.0 L 50.4,-81 L 28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-81.0 L 18,-81 L 18,-72 L -18,-72 L -18,-90 L 18,-90 L 18,-81 M -18,-81 L -28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-81.0 L 28.8,-121.5 L 19.8,-121.5 L 19.8,-157.5 L 37.8,-157.5 L 37.8,-121.5 L 28.8,-121.5 M 28.8,-157.5 L 28.8,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-198.0 L 63.93,-198 L 99.06,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"102.66\" y=\"-94.3\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"102.66\" dy=\"13\">Q1 PNP<\/tspan><\/text><text x=\"138.66\" y=\"-133.48000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"138.66\" dy=\"13\">E<\/tspan><\/text><text x=\"138.66\" y=\"-61.72\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"138.66\" dy=\"13\">C<\/tspan><\/text><text x=\"95.46\" y=\"-225.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"95.46\" dy=\"13\">5V<\/tspan><\/text><text x=\"86.46\" y=\"-58.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"86.46\" dy=\"13\">RLED<\/tspan><\/text><text x=\"137.67000000000002\" y=\"-4.0000000000000036\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"137.67000000000002\" dy=\"13\">LED<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RB<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><text x=\"16.200000000000006\" y=\"-152.5\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"16.200000000000006\" dy=\"13\">基极上拉<\/tspan><\/text><circle cx=\"72\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"72.0\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">B<\/tspan><\/text><circle cx=\"28.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n图 6-3 PNP 高边开关驱动负载\n\n```text\n5V ── E  Q2  C ── 负载 ── GND\n       B ── RB ── 控制端\n       │\n       └── 上拉电阻 ── 5V\n```\n\n**工作原理**：PNP 的发射极接 5V，基极被拉低时，B 相对 E 为负，基极电流流出，Q2 导通；基极被上拉到接近 5V 时，VBE≈0，Q2 截止。\n\n**关键坑**：3.3V GPIO 直接控制 5V 高边 PNP 时：\n\n- GPIO 高电平 3.3V：`VBE = 3.3 − 5 = −1.7V`，可能仍让 PNP 微导通，不能可靠关断；\n- GPIO 低电平 0V：`VBE = −5V`，导通，但基极电流可能过大；\n- GPIO 引脚还可能承受 5V 反灌。\n\n所以 3.3V 控制 5V 高边 PNP，通常需要电平转换或专用驱动。不能想当然地直接连。\n\n```circuitjs\npnp-switch\n```\n\n#### 6.4.3 电路三：射极跟随器（共集）\n\n```text\nVin ── B  Q1  E ── Vout ── 负载 ── GND\n                 │\n                RE ── GND\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"NPN射极跟随器：输入接基极，输出从发射极取，RE接地\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M40 140 H120\"/><path d=\"M120 100 V180\"/>\n  <path d=\"M120 110 L180 70 H180 V30\"/><path d=\"M120 170 L180 210\"/>\n  <path d=\"M180 210 L158 190 L150 204 Z\" fill=\"currentColor\"/>\n  <path d=\"M180 210 H250\"/><path d=\"M180 210 V220\"/><rect x=\"167\" y=\"220\" width=\"26\" height=\"50\"/><path d=\"M180 270 V285\"/>\n  <path d=\"M180 285 H250 M238 285 V300 M226 300 H250 M230 308 H246 M234 316 H242\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"30\" y=\"132\">Vin<\/text><text x=\"186\" y=\"26\">+5V<\/text><text x=\"258\" y=\"202\">Vout<\/text>\n  <text x=\"190\" y=\"150\">Q1 NPN<\/text><text x=\"202\" y=\"240\">RE<\/text><text x=\"260\" y=\"310\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 6-4 射极跟随器：电压增益接近 1，输出阻抗低\n\n输入加在基极，输出从发射极取，集电极接电源。理想情况下 `Vout ≈ Vin − VBE`，电压增益略小于 1，但电流增益大，输出阻抗低，常用作**缓冲器**：前级高阻抗、后级低阻抗，中间用射极跟随器隔离。\n\n**算例**：Vin=5V，VBE≈0.7V，则 Vout≈4.3V。如果负载电流 10mA，Q1 的功耗约 `(5−4.3)×0.01=7mW`，很小；但输入电压接近电源时，输出会受 VBE 限制，无法达到 5V。\n\n#### 6.4.4 电路四：共射放大\n\n```text\nVCC ── RC ── C  Q1  E ── RE ── GND\n             │\nVin ── C1 ── B\n             │\n            RB1/RB2 偏置\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 340\" role=\"img\" aria-label=\"NPN共射放大：基极输入，集电极输出，RC和RE提供偏置与负载\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M300 30 V60\"/><rect x=\"287\" y=\"60\" width=\"26\" height=\"40\"/><path d=\"M300 100 V110\"/>\n  <path d=\"M220 110 V180\"/><path d=\"M220 125 L300 90\"/><path d=\"M220 165 L300 210\"/>\n  <path d=\"M278 185 L292 197 L270 201 Z\" fill=\"currentColor\"/>\n  <path d=\"M300 210 V220\"/><rect x=\"287\" y=\"220\" width=\"26\" height=\"50\"/><path d=\"M300 270 V295\"/>\n  <path d=\"M300 295 H370 M358 295 V310 M346 310 H370 M350 318 H366 M354 326 H362\"/>\n  <path d=\"M40 150 H90\"/><path d=\"M90 150 V138 M90 162 V150\"/><path d=\"M100 138 V162\"/><path d=\"M100 150 H220\"/>\n  <path d=\"M300 30 H220 V55\"/><rect x=\"207\" y=\"55\" width=\"26\" height=\"45\"/><path d=\"M220 100 V110\"/>\n  <path d=\"M300 90 H390\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"30\" y=\"142\">Vin<\/text><text x=\"306\" y=\"26\">+5V<\/text><text x=\"398\" y=\"82\">Vout<\/text>\n  <text x=\"320\" y=\"80\">RC<\/text><text x=\"240\" y=\"78\">RB<\/text><text x=\"320\" y=\"250\">RE<\/text>\n  <text x=\"230\" y=\"145\">Q1 NPN<\/text><text x=\"92\" y=\"130\">C1<\/text><text x=\"300\" y=\"330\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 6-5 共射放大：输出反相，电压增益大于 1\n\n共射电路输出从集电极取，输入加在基极，发射极接地（或经 RE）。它有电压增益，输出与输入反相。增益近似 `Av ≈ −RC / RE`（有发射极电阻时），具体受 β、负载、频率影响。\n\n**零基础提示**：放大电路比开关电路难，因为要设**静态工作点**（没有输入信号时，B/C/E 的直流电压和电流）。工作点不合适，输出会削顶或失真。本章只要求理解概念和简单计算，不要求独立设计高精度放大器。\n\n**偏置**：用两只电阻分压给基极一个直流电压，让 Q1 在放大区；发射极电阻 RE 提供负反馈，稳定工作点。RE 越大，增益越低但越稳定；这是取舍。\n\n#### 6.4.5 电路五：恒流源/电流镜（了解）\n\n两只参数一致的三极管，基极并在一起，发射极都接地，其中一只接参考电流，另一只的集电极电流会近似按比例复制。这叫**电流镜**，常用于集成电路内部偏置。分立电路里也可以用三极管 + 运放做恒流源，给 LED、传感器提供稳定电流。\n\n零基础阶段知道有这种用法即可，不要求计算。\n\n---\n\n### 6.5 选型与降额\n\n#### 6.5.1 按用途选类型\n\n| 用途 | 首选 | 备选 | 避免 |\n|---|---|---|---|\n| 小电流低边开关 | NPN（MMBT3904、2N3904） | MOS | 大功率管（驱动过剩） |\n| 中功率低边开关 | NPN（SOT-89/TO-252） | NMOS | 小信号管（IC 不够） |\n| 高边小电流 | PNP | PMOS | NPN（需要高于电源的驱动） |\n| 大电流高边 | PMOS/专用高边开关 | 继电器 | PNP（基极电流大） |\n| 音频小信号放大 | 低噪声 NPN/PNP | 运放 | 开关管（线性差） |\n| 高频放大 | fT 高的管子 | — | 低频功率管 |\n| 电平转换 | 小信号 NPN + 上拉 | 专用芯片 | 直接乱接 |\n\n#### 6.5.2 降额参考\n\n| 参数 | 建议 | 说明 |\n|---|---|---|\n| VCEO | 实际 C-E 电压 ≤80% | 感性负载要算尖峰 |\n| IC | 实际平均 ≤70% | 看温升 |\n| Pd | 计算功耗 ≤60～70% | 封装热阻很关键 |\n| hFE | 按最小值设计 | 不能按典型值 |\n| VCE(sat) | 按最坏 IC/IB/温度 | 否则负载电压不够 |\n| Tj | 留 20～30℃ | 高温 β 下降、漏电增大 |\n\n#### 6.5.3 开关设计 8 步\n\n1. 定负载电压、电流、类型（阻性/感性）。\n2. 选 NPN 低边或 PNP 高边。\n3. 查手册在目标 IC 下的 VCE(sat) 和所需 IB。\n4. 算基极电阻上下限。\n5. 核对 GPIO 驱动能力、耐压、上电状态。\n6. 算 Q1 功耗 `P≈VCE×IC`，查热阻。\n7. 感性负载加续流，必要时加 B-E 下拉。\n8. 写完整料号，核对引脚和封装。\n\n---\n\n### 6.6 测量与仿真\n\n#### 6.6.1 万用表二极管档测 B-E/B-C\n\n断电、放电后，用二极管档测：\n\n- NPN：B 接红表笔、E 接黑表笔，应显示一个 PN 结正向压降；反过来应 OL。\n- B-C 结类似。\n- C-E 之间正反都应 OL（除非并联了其他器件）。\n\n在板测量时，并联电阻、电容会影响读数，必要时拆下管子。读数只能粗判，不能保证 hFE、耐压、开关速度。\n\n#### 6.6.2 测开关状态\n\n给电路上电，测：\n\n- `VBE`：导通时应约 0.7～0.9V；如果远大于 0.9V，可能 IB 不足或 B-E 开路。\n- `VCE`：饱和时应接近 0.1～0.3V；如果停在 2～3V，说明没饱和，Q1 在放大区发热。\n- `IC`：用负载电流或采样电阻测，确认没有超限。\n\n**判断饱和的实用方法**：测 VCE。如果 VCE 已经很低（比如 0.2V），说明饱和；如果 VCE 明显高，先加大 IB 或减小负载，再查器件。\n\n#### 6.6.3 仿真记录表\n\n| 仿真 | 改什么 | 预期 | 实际 |\n|---|---|---|---|\n| npn-switch | 改 RB | IB 变，VCE 变 | |\n| pnp-switch | 改控制电平 | 是否可靠关断 | |\n\n#### 6.6.4 动手任务\n\n1. 用 2N3904 + 330Ω 基极电阻驱动 5V 继电器，测 VBE、VCE，确认饱和。\n2. 把 RB 从 330Ω 改成 10kΩ，观察继电器是否还能吸合，解释原因。\n3. 搭射极跟随器，输入 2V/1kHz 正弦，测输出幅度和相位。\n4. 查两只不同封装的三极管引脚图，画出 B/C/E。\n\n---\n\n### 6.7 常见坑\n\n#### 坑 1：基极电阻随便取\n\nRB 太大，IB 不够，三极管停在放大区，VCE 高、发热；RB 太小，GPIO 过流、B-E 结过流。必须按手册的 IB 要求算。\n\n#### 坑 2：把 hFE 当电压增益\n\nhFE 是电流增益，不是电路电压增益。共射电路的电压增益还取决于 RC、RE、负载和电源。\n\n#### 坑 3：PNP 高边直接用 3.3V 控制\n\n3.3V 高电平相对 5V 发射极仍是 -1.7V，PNP 可能关不死。要电平转换或专用驱动。\n\n#### 坑 4：感性负载不加续流\n\n继电器、电磁阀关断时产生高压尖峰，三极管 VCEO 超限会击穿。续流二极管方向不能接反。\n\n#### 坑 5：忽略 VCE(sat) 和功耗\n\n大电流时 VCE(sat) 可能 0.5V 以上，`P=0.5×1A=0.5W`，SOT-23 根本扛不住。要换封装或 MOS。\n\n#### 坑 6：TO-220 背板接地短路\n\nTO-220 金属背板常与集电极相连，直接拧在接地散热器上会短路。需要绝缘垫片或查手册。\n\n#### 坑 7：把三极管当理想开关\n\n饱和时仍有 0.1～0.3V 压降，截止时仍有漏电；高低温、批次都会变。精密电路要留余量。\n\n#### 坑 8：基极悬空\n\nGPIO 高阻或复位时，基极可能被干扰误导通。加 B-E 下拉电阻（如 10kΩ）更稳。\n\n---\n\n### 6.8 本章复盘\n\n#### 6.8.1 公式表\n\n| 公式 | 用途 | 条件 |\n|---|---|---|\n| `IC ≈ β × IB` | 放大区电流关系 | 未饱和 |\n| `IB ≈ (VGPIO − VBE) / RB` | 基极电流 | 导通 |\n| `RB ≤ (VGPIO(min) − VBE(max)) / IB(required)` | 基极电阻上限 | 保证饱和 |\n| `P ≈ VCE × IC` | 三极管功耗 | 开关/线性 |\n| `Vout ≈ Vin − VBE` | 射极跟随 | 轻载 |\n| `Av ≈ −RC/RE` | 共射增益 | 有 RE，近似 |\n\n#### 6.8.2 术语表\n\n| 术语 | 解释 |\n|---|---|\n| BJT | 双极型晶体管 |\n| B/C/E | 基极/集电极/发射极 |\n| NPN | 箭头向外，低边开关常用 |\n| PNP | 箭头向内，高边开关常用 |\n| hFE/β | 电流增益 |\n| VBE | 基极-发射极电压 |\n| VCE(sat) | 饱和压降 |\n| 截止 | 近似关断 |\n| 饱和 | 开关导通，VCE 小 |\n| 放大区 | IC 受 IB 控制 |\n| 射极跟随 | 输出从 E 取，电压增益≈1 |\n| 共射 | 输出从 C 取，反相放大 |\n\n#### 6.8.3 自测 10 题\n\n1. NPN 的箭头指向哪？\n2. 三极管的三个端子叫什么？\n3. 开关电路应让三极管工作在哪个区？\n4. 5V 负载 100mA，手册要求 IB=5mA，VBE=0.9V，GPIO 3.0V，RB 最大多少？\n5. PNP 高边开关的发射极接哪里？\n6. 为什么 3.3V GPIO 不能直接可靠关断 5V 高边 PNP？\n7. 续流二极管为什么不能接反？\n8. VCE(sat)=0.2V、IC=1A，功耗多少？\n9. 射极跟随器的电压增益大约多少？\n10. hFE 会随什么变化？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 从 B 指向 E，向外。\n2. 基极 B、集电极 C、发射极 E。\n3. 饱和区（截止用于关断）。\n4. `(3.0−0.9)/0.005=420Ω`，取更小标准值并核对 GPIO 电流。\n5. 接电源正端。\n6. 3.3V 高电平相对 5V 发射极是 -1.7V，PNP 可能仍导通，不能可靠关断。\n7. 接反会在开关导通时把电源短路。\n8. `0.2×1=0.2W`。\n9. 略小于 1。\n10. IC、温度、器件批次、VCE 等。\n\n<\/details>\n\n#### 6.8.4 能力清单\n\n- [ ] 能分清 NPN/PNP 和 B/C/E。\n- [ ] 能解释截止、放大、饱和。\n- [ ] 能算基极电阻并判断饱和。\n- [ ] 能画低边 NPN、高边 PNP 开关。\n- [ ] 能解释射极跟随和共射放大。\n- [ ] 知道三极管与 MOS 的差别。\n\n#### 6.8.5 下一章\n\n下一章讲 **MOS 管**：它用电压控制，不用持续基极电流，适合大电流和高频开关。你会看到 `VGS(th)`、`RDS(on)`、栅极电荷、体二极管这些关键参数，以及为什么 3.3V GPIO 驱动 MOS 也要看具体型号。\n\n---\n\n<!-- 第 06 章完 -->","taskSignature":"0377263d73f10baad844c21038a3aa2addc06b8e183395cb15ad253cb53b4e25","taskCount":6},{"id":"07","title":"第 07 章 · MOS 管","short":"MOS 管","stage":1,"diff":3,"prev":"第 01～06 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 认出 N 沟道/ P 沟道 MOS 的 G、D、S。\n2. 用 `VGS` 判断导通趋势。\n3. 理解 `VGS(th)` 不等于“完全导通”。\n4. 会算导通损耗、看 `RDS(on)` 条件。\n5. 能设计低边开关、理解高边驱动和体二极管。\n\nMOS 管是电压控制的开关，也是现代电源和数字电路的基石。它看起来像三极管，但判断导通的依据、损耗构成和驱动要求完全不同。\n\n## 正文\n\n### 7.1 它解决什么问题：三个真实场景\n\n#### 场景一：大电流负载，三极管发热严重\n\n用三极管驱动 12V/2A 的电机，假设 VCE(sat)=0.5V，功耗 `0.5×2=1W`，SOT-23 封装根本扛不住。换成导通电阻 20mΩ 的 NMOS，功耗 `2²×0.02=0.08W`，发热小得多。\n\n这就是 MOS 在大电流开关里取代三极管的核心原因：**导通时压降可以很低**。\n\n#### 场景二：PWM 调光、调速\n\nLED 调光、电机调速常用 PWM：开关快速通断，改变占空比。MOS 的开关速度可以很高，栅极驱动简单，适合高频 PWM。但频率越高，栅极充放电和开关损耗越不能忽略。\n\n#### 场景三：电源转换（Buck/Boost）\n\n开关电源的功率级几乎都用 MOS 做开关。第 04 章 Buck 电路里的高边开关、低边开关，实际就是 MOS。理解 MOS 的导通电阻、栅极电荷、体二极管，才能看懂电源为什么发热、为什么需要驱动器。\n\n\n第 06 章三极管是“电流控制”，本章 MOS 是“电压控制”。两者都能做开关，但 MOS 的栅极几乎不耗稳态电流，适合大电流；代价是栅极有电容，开关时要充放电，驱动设计更讲究。\n\n---\n\n### 7.2 它是什么：用电压控制的开关\n\n#### 7.2.1 一句话定义\n\n**MOSFET（Metal-Oxide-Semiconductor Field-Effect Transistor，金属-氧化物-半导体场效应晶体管）** 是三个端子的电压控制器件，用栅极-源极电压 `VGS` 控制漏极-源极之间沟道的导通程度。\n\n三个端子：\n\n- **栅极 G（Gate）**：控制端，和沟道之间有一层绝缘氧化层，稳态几乎不耗电流。\n- **漏极 D（Drain）**：主电流端子。\n- **源极 S（Source）**：主电流端子，通常低边开关接地。\n\n原理图位号常用 **Q**。封装有 SOT-23、SOT-323、SO-8、DFN、TO-252、TO-220 等。**同封装不同型号的 G/D/S 顺序可能不同**，必须查完整料号。\n\n#### 7.2.2 N 沟道与 P 沟道\n\n| 类型 | 导通条件（相对 S） | 常见位置 | 符号 |\n|---|---|---|---|\n| N 沟道 NMOS（增强型） | `VGS = VG − VS > 0`，足够大时导通 | 低边开关 | 箭头指向沟道（向里） |\n| P 沟道 PMOS（增强型） | `VGS = VG − VS < 0`，足够负时导通 | 高边开关 | 箭头背离沟道（向外） |\n\n> **术语解释：增强型**\n> 增强型 MOS 在 `VGS=0` 时沟道是关断的，必须施加足够的正（NMOS）或负（PMOS）栅源电压才导通。与之相对的“耗尽型”在 0V 时已有沟道，入门阶段先掌握增强型。\n\n**判断导通，永远看 `VGS`，不是看栅极对地电压。** 高边电路中，S 点电压会随负载变化，栅极对地 12V 不一定意味着 `VGS` 合适。\n\n#### 7.2.3 `VGS(th)` 不是“导通电压”\n\n手册里的 `VGS(th)`（阈值电压）通常定义为：在规定的很小漏极电流（比如 250μA）下，使沟道开始形成的 `VGS`。它只说明“开始有一点点电流”，**不说明大电流下已经充分导通**。\n\n真正决定导通电阻的是手册在具体 `VGS`、`ID`、温度下给出的 `RDS(on)`。例如某 NMOS 的 `VGS(th)` 最大 2.5V，但 `RDS(on)` 只在 `VGS=10V` 下保证 20mΩ；你用 3.3V 驱动，实际 `RDS(on)` 可能大很多，甚至发热失控。\n\n**结论：3.3V GPIO 驱动 MOS，必须查 `VGS=3.3V`（或 2.5V/4.5V）下的 `RDS(on)`，不能只看阈值。**\n\n#### 7.2.4 体二极管\n\nMOS 内部有一个寄生二极管，叫**体二极管**：\n\n- N 沟道：二极管从 S 指向 D（阳极 S，阴极 D）。\n- P 沟道：二极管从 D 指向 S（阳极 D，阴极 S）。\n\n它平时反偏，不影响导通；但当 D-S 电压反向时，它会导通。所以 MOS 关断**不一定能阻断反向电流**。防反接、电池切换、同步 Buck 等电路必须考虑体二极管的方向和压降。\n\n#### 7.2.5 符号\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 260\" role=\"img\" aria-label=\"N沟道与P沟道增强型MOS符号，标注栅极G、漏极D、源极S\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M40 120 H95\"/><path d=\"M95 78 V162\"/>\n  <path d=\"M122 78 V104 M122 112 V128 M122 136 V162\"/>\n  <path d=\"M122 92 H170 V48\"/><path d=\"M122 148 H170 V192\"/>\n  <path d=\"M145 148 L127 148 L135 138\" fill=\"currentColor\"/>\n  <path d=\"M300 120 H355\"/><path d=\"M355 78 V162\"/>\n  <path d=\"M382 78 V104 M382 112 V128 M382 136 V162\"/>\n  <path d=\"M382 92 H430 V48\"/><path d=\"M382 148 H430 V192\"/>\n  <path d=\"M407 148 L389 138 L389 158 Z\" fill=\"currentColor\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"28\" y=\"108\">G<\/text><text x=\"178\" y=\"44\">D<\/text><text x=\"178\" y=\"212\">S<\/text>\n  <text x=\"288\" y=\"108\">G<\/text><text x=\"438\" y=\"44\">D<\/text><text x=\"438\" y=\"212\">S<\/text>\n  <text x=\"86\" y=\"240\">N 沟道：箭头向里<\/text><text x=\"330\" y=\"240\">P 沟道：箭头向外<\/text>\n<\/g><\/svg>\n```\n\n图 7-1 N 沟道与 P 沟道增强型 MOS 符号\n\n符号里：G 是单独的栅极竖线；D 和 S 之间有三段沟道线；箭头表示沟道类型。实际器件的引脚号、体二极管方向、封装散热焊盘，都要查手册。\n\n#### 7.2.6 封装与散热\n\n| 封装 | 常见功率 | 注意 |\n|---|---|---|\n| SOT-23 | 小信号、几百 mA | 散热能力很有限 |\n| SOT-323 | 更小 | 功耗更低 |\n| SO-8 | 中功率、双 MOS | 多引脚并联散热 |\n| DFN 2×2 / 3×3 | 中功率、低高度 | 底部散热焊盘必须焊好 |\n| TO-252 (DPAK) | 中功率 | 散热焊盘面积 |\n| TO-220 | 较大功率 | 背板可能和 D 相连 |\n\n**ID 额定值通常有测试条件**（如 `TC=25℃`、无限大散热面）。实际 PCB 上能连续跑多少电流，取决于铜皮面积、环境温度、封装热阻。不能只看“ID=10A”就以为能跑 10A。\n\n---\n\n### 7.3 关键参数与数据手册\n\n#### 7.3.1 一张表看懂 MOS 手册\n\n| 参数 | 符号 | 含义 | 为什么重要 |\n|---|---|---|---|\n| 漏源耐压 | VDS | D-S 允许电压 | 电源、感性尖峰 |\n| 栅源耐压 | VGS(max) | G-S 允许电压 | 驱动过压、静电 |\n| 阈值电压 | VGS(th) | 开始导通的阈值 | 只作参考，不等于充分导通 |\n| 导通电阻 | RDS(on) | 导通时 D-S 电阻 | 损耗、发热 |\n| 漏极电流 | ID | 允许持续电流 | 负载、散热 |\n| 脉冲电流 | IDM | 短时允许 | 启动、浪涌 |\n| 栅极电荷 | Qg | 栅极充放电电荷 | 驱动电流、开关速度 |\n| 输入电容 | Ciss | 栅极等效电容 | 驱动、振荡 |\n| 输出电容 | Coss | D-S 电容 | 开关损耗、谐振 |\n| 反向恢复电荷 | Qrr | 体二极管恢复 | 同步 Buck、桥式 |\n| 安全工作区 | SOA | 允许 V-I 组合 | 线性/短路保护 |\n| 热阻 | RθJA/RθJC | 散热能力 | 温升计算 |\n\n#### 7.3.2 读手册的四个关键点\n\n**第一，RDS(on) 一定带 VGS 和 ID。** 手册可能给多行：`VGS=10V, ID=10A`、`VGS=4.5V, ID=5A`。你实际用 3.3V，就要找 3.3V 附近的数据或曲线；没有的话，不能保证。\n\n**第二，RDS(on) 随温度升高。** 硅 MOS 的导通电阻通常是正温度系数，结温从 25℃ 升到 100℃，RDS(on) 可能增大 30%～50%。热设计要按热态算，不能按 25℃ 算。\n\n**第三，Qg 决定驱动电流。** 开关频率 f、栅极电荷 Qg，驱动电流近似 `Ig = Qg × f`。比如 Qg=10nC、f=100kHz，`Ig=1mA`；如果 f=1MHz，`Ig=10mA`。驱动太弱，开关变慢，损耗增大。\n\n**第四，SOA 不是“任何电压电流都能扛”。** 线性区同时有大电压和大电流，发热集中，容易热失控。开关应用要看开关损耗和热，不能拿 ID 额定值硬套。\n\n#### 7.3.3 MOS 的损耗构成\n\n| 损耗 | 公式（近似） | 说明 |\n|---|---|---|\n| 导通损耗 | `Pcond = Irms² × RDS(on)` | 热态电阻 |\n| 开关损耗 | `Psw ≈ 0.5 × VDS × ID × (tr+tf) × f` | 频率越高越大 |\n| 栅极驱动损耗 | `Pgate = Qg × VGS × f` | 驱动电路承担 |\n| 体二极管损耗 | `Pdiode = VF × IF × (1−D)` | 死区/续流 |\n| 静态损耗 | 漏电 | 通常很小 |\n\n**算例**：VDS=12V、ID=2A、RDS(on)=20mΩ（热态 30mΩ）、f=100kHz、tr+tf=100ns。\n\n- 导通：`2²×0.03=0.12W`；\n- 开关：`0.5×12×2×100e-9×100e3=0.12W`；\n- 合计约 0.24W，SOT-23 可能勉强，SO-8 更稳。\n\n如果 RDS(on) 按 25℃ 的 20mΩ 算，导通损耗只有 0.08W，会低估发热。**热态电阻是关键。**\n\n---\n\n### 7.4 五个典型电路\n\n#### 7.4.1 电路一：NMOS 低边开关\n\n```svg\n<svg role=\"img\" aria-label=\"NMOS高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"276.34pt\" width=\"244.10299999999998pt\" viewBox=\"-67.375 -277.49999999999994 244.10299999999998 276.34\"><polygon points=\"117,-175.5 108,-162.9 99,-175.5 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-54.0 L 108,-69 L 84,-69 L 84,-93 L 108,-93 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.00000000000001,-69.0 L 78,-93\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 58.8,-81.0 L 78,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-126 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-144.0 L 108,-162.9 M 117,-162.9 L 99,-162.9 M 108,-175.5 L 108,-194.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.0013506232961,-161.07220035616922 L 94.5,-166.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 80.486 -158.492 L 83.572 -163.573 L 86.43 -158.572 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 85.0013506232961,-169.1722003561692 L 94.5,-174.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 80.486 -166.592 L 83.572 -171.673 L 86.4 nchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">D<\/tspan><\/text><text x=\"147.6\" y=\"-59.800000000000004\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">S<\/tspan><\/text><text x=\"120.60000000000001\" y=\"-182.20000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"120.60000000000001\" dy=\"13\">LED<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-236.20000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">RLED<\/tspan><\/text><text x=\"104.39999999999999\" y=\"-279.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"104.39999999999999\" dy=\"13\">5V<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RG<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><text x=\"16.200000000000003\" y=\"-67.9\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"16.200000000000003\" dy=\"13\">栅源下拉<\/tspan><\/text><circle cx=\"58.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"58.8\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"58.8\" dy=\"13\">G<\/tspan><\/text><circle cx=\"28.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n图 7-2 NMOS 低边开关驱动负载\n\n```text\n5V ── 负载 ── D  Q1  S ── GND\nGPIO ── RG ── G\n               │\n             RGS（下拉）\n               │\n              GND\n```\n\n**工作原理**：\n\n- GPIO 低（0V）：`VGS=0−0=0V`，NMOS 关断，负载不工作。\n- GPIO 高（3.3V）：`VGS=3.3V`，如果该器件在 3.3V 下 `RDS(on)` 足够低，NMOS 导通，负载得电。\n\n**RG 的作用**：限制栅极充电峰值电流、抑制振荡；**RGS 的作用**：GPIO 高阻/复位时把栅极拉到 0V，保证关断。RG 太大会让开关变慢，增加开关损耗；RGS 一般 10kΩ～100kΩ，具体看速度要求。\n\n**算例**：负载 1A、RDS(on)=30mΩ（热态），导通损耗 `1²×0.03=0.03W`；如果 RDS(on)=300mΩ（驱动不足），损耗 `0.3W`，发热明显。**同样的管子，驱动电压不够，RDS(on) 会大一个数量级。**\n\n```circuitjs\nnmos-switch\n```\n\n#### 7.4.2 电路二：PMOS 高边开关\n\n```svg\n<svg role=\"img\" aria-label=\"PMOS高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"287.14pt\" width=\"244.10299999999998pt\" viewBox=\"-67.375 -223.49999999999994 244.10299999999998 287.14\"><circle cx=\"73.8\" cy=\"-81\" r=\"4.2\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><polygon points=\"117,2.7 108,15.3 99,2.7 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-54.0 L 108,-69 L 84,-69 L 84,-93 L 108,-93 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.00000000000001,-69.0 L 78,-93\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 58.8,-81.0 L 69.6,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-153 L 108,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-54.0 L 108,-63 L 108,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><pa 08,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"111.60000000000001\" y=\"-94.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"111.60000000000001\" dy=\"13\">Q1 PMOS<\/tspan><\/text><text x=\"147.6\" y=\"-135.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">S<\/tspan><\/text><text x=\"147.6\" y=\"-59.800000000000004\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">D<\/tspan><\/text><text x=\"104.39999999999999\" y=\"-225.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"104.39999999999999\" dy=\"13\">5V<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-58.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">RLED<\/tspan><\/text><text x=\"146.60999999999999\" y=\"-4.0000000000000036\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"146.60999999999999\" dy=\"13\">LED<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RG<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><text x=\"16.200000000000006\" y=\"-152.5\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"16.200000000000006\" dy=\"13\">栅源上拉<\/tspan><\/text><circle cx=\"58.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"58.8\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"58.8\" dy=\"13\">G<\/tspan><\/text><circle cx=\"28.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n图 7-3 PMOS 高边开关驱动负载\n\n```text\n5V ── S  Q2  D ── 负载 ── GND\n       G ── RG ── 控制/驱动\n       │\n      RGS（上拉）\n       │\n      5V\n```\n\n**工作原理**：S 接 5V，G 被拉到 0V 时 `VGS=−5V`，PMOS 导通；G 被上拉到 5V 时 `VGS=0V`，PMOS 关断。\n\n**3.3V GPIO 直接控制 5V 高边 PMOS 的问题**：\n\n- GPIO 高 3.3V：`VGS=3.3−5=−1.7V`，可能仍导通，关不死；\n- GPIO 低 0V：`VGS=−5V`，导通，但栅极电流/电压要核；\n- GPIO 引脚可能承受 5V。\n\n所以 3.3V 控制 5V 高边 PMOS，通常需要 NPN/ NMOS 电平转换或专用高边驱动。不能直接连。\n\n```circuitjs\npmos-switch\n```\n\n#### 7.4.3 电路三：NMOS 高边开关（需要自举/驱动）\n\nN 沟道 MOS 的导通电阻通常比 P 沟道低，但高边使用时 S 点电压接近电源，要 `VGS > VGS(th)` 就必须让 G 比 S 更高，甚至高于电源。这就需要**自举电路**或专用高边驱动芯片。\n\n零基础阶段先理解：**NMOS 低边好用，高边难驱动；PMOS 高边好驱动，但 RDS(on) 通常较大、成本较高。** 实际选型要权衡。\n\n#### 7.4.4 电路四：MOS 作为负载开关\n\n```text\nVBUS ── S  Q1  D ── 负载\nEN ── RG ── G\n             │\n           RGS ── GND\n```\n\n这是低边控制的负载开关：EN 高时导通，负载得电；EN 低时关断。要加**软启动**（栅极电容、RC 缓升）限制开机浪涌，否则大电容负载会让 MOS 承受很大冲击。\n\n#### 7.4.5 电路五：同步 Buck 的低边 MOS\n\n第 04 章 Buck 电路里，续流二极管可以用 MOS 代替，叫**同步整流**。低边 MOS 在死区时靠体二极管续流，死区结束后沟道导通，压降更小、效率更高。\n\n**注意**：同步 Buck 要设计死区时间，防止高边和低边同时导通（直通）；还要考虑体二极管反向恢复、开关节点振铃。零基础阶段理解概念即可，实际设计用控制器手册的参考电路。\n\n---\n\n### 7.5 选型与降额\n\n#### 7.5.1 按用途选类型\n\n| 用途 | 首选 | 备选 | 避免 |\n|---|---|---|---|\n| 低边小电流开关 | NMOS（AO3400 等） | NPN | PMOS（低边不方便） |\n| 低边大电流 | NMOS，低 RDS(on) | 多管并联 | 小封装 |\n| 高边小电流 | PMOS | 专用高边开关 | NMOS（驱动复杂） |\n| 高边大电流 | NMOS + 高边驱动 | 专用智能开关 | PMOS（RDS(on) 大） |\n| 电源入口防反接 | PMOS 低边/理想二极管 | NMOS + 电荷泵 | 普通二极管（压降大） |\n| 高频开关 | 低 Qg、低 Coss | — | 大 Qg 功率管 |\n| 线性/恒流 | 查 SOA | — | 开关管硬套 |\n\n#### 7.5.2 降额参考\n\n| 参数 | 建议 | 说明 |\n|---|---|---|\n| VDS | 实际 ≤80% 额定 | 感性尖峰单独核 |\n| VGS | 不超过 ±20V 常见上限 | 具体看手册，有些更低 |\n| ID | 实际 ≤70～80% 额定（按温度） | 散热条件 |\n| RDS(on) | 按热态、实际 VGS | 不能按 25℃ |\n| Qg | 驱动能力足够 | 频率高时重点 |\n| Tj | 留 20～30℃ | 热阻、铜皮 |\n| SOA | 线性/短路要核 | 开关应用也看瞬态 |\n\n#### 7.5.3 选型 9 步\n\n1. 定拓扑：低边/高边/半桥/负载开关。\n2. 定 VDS：电源电压 + 尖峰余量。\n3. 定电流：平均、峰值、浪涌。\n4. 定驱动电压：3.3V/5V/10V，查对应 RDS(on)。\n5. 算导通损耗，查热阻和温升。\n6. 算开关损耗，查 Qg、tr/tf。\n7. 查体二极管方向、Qrr。\n8. 查封装、散热焊盘、引脚。\n9. 写完整料号，核对供货、温度等级。\n\n---\n\n### 7.6 测量与仿真\n\n#### 7.6.1 万用表测 MOS\n\n断电、放电后：\n\n- 测 G-S、G-D、D-S 之间是否短路；\n- 体二极管可能让 D-S 单向有读数，不能据此判断坏；\n- 栅极电容会让读数缓慢变化；\n- 在板测量受并联器件影响。\n\n**静电**：MOS 栅极氧化层很薄，手摸可能击穿。拿器件先接地，焊接时用防静电烙铁/手环。\n\n#### 7.6.2 测开关状态\n\n上电后测：\n\n- `VGS`：导通时应明显大于 `VGS(th)`，具体看驱动设计；\n- `VDS`：导通时应接近 `I×RDS(on)`，如果很大，说明驱动不足或没导通；\n- 栅极波形：用示波器看上升/下降时间、振铃、米勒平台。\n\n**注意**：示波器探头地线夹可能短路，测高边栅极要用差分探头或隔离。\n\n#### 7.6.3 仿真记录表\n\n| 仿真 | 改什么 | 预期 | 实际 |\n|---|---|---|---|\n| nmos-switch | 改栅极电压 | VDS 变 | |\n| pmos-switch | 改控制电平 | 是否关断 | |\n\n#### 7.6.4 动手任务\n\n1. 用 AO3400 驱动 5V 小电机，测 `VGS`、`VDS`，算导通损耗。\n2. 把栅极电阻从 100Ω 改成 10kΩ，观察开关波形变慢。\n3. 用 PMOS 做 5V 高边开关，用 3.3V GPIO 直接驱动，测关断时输出是否还有电压，解释原因。\n4. 查一只 MOS 的 `RDS(on)` 在 3.3V 和 10V 下的差别。\n\n---\n\n### 7.7 常见坑\n\n#### 坑 1：只看 VGS(th)，不看 RDS(on)\n\n`VGS(th)=2V` 不代表 3.3V 就能充分导通。必须查实际 `VGS` 下的 `RDS(on)`。\n\n#### 坑 2：栅极悬空\n\nGPIO 高阻、复位、上电瞬间，栅极可能被干扰，MOS 误导通。加 `RGS` 下拉/上拉，保证默认关断。\n\n#### 坑 3：高边 NMOS 直接用 GPIO\n\nNMOS 高边需要 `VGS` 高于源极，GPIO 3.3V 根本不够，必须自举/高边驱动。\n\n#### 坑 4：忽略体二极管\n\nMOS 关断不阻断反向电流，防反接、电池切换可能倒灌。要查体二极管方向。\n\n#### 坑 5：ID 额定值当实际能力\n\nID 是在特定散热条件下测的，SOT-23 实际可能只能跑 1A 左右。按热阻算。\n\n#### 坑 6：栅极电阻太大/太小\n\n太大：开关慢、损耗大、可能振荡；太小：驱动峰值电流大、振铃。按 Qg 和频率选。\n\n#### 坑 7：忘记散热焊盘\n\nDFN/SO-8 的散热焊盘不焊，热阻大幅上升，实际电流能力骤降。\n\n#### 坑 8：静电损坏\n\n手摸栅极可能击穿氧化层。防静电措施不能省。\n\n#### 坑 9：同步 Buck 直通\n\n高边/低边同时导通，电源短路，瞬间大电流。死区时间必须由控制器保证。\n\n---\n\n### 7.8 本章复盘\n\n#### 7.8.1 公式表\n\n| 公式 | 用途 | 条件 |\n|---|---|---|\n| `VGS = VG − VS` | 判断导通 | 永远相对 S |\n| `Pcond = Irms² × RDS(on)` | 导通损耗 | 热态电阻 |\n| `Psw ≈ 0.5 × VDS × ID × (tr+tf) × f` | 开关损耗 | 近似 |\n| `Ig ≈ Qg × f` | 平均驱动电流 | 开关频率 |\n| `Tj ≈ Ta + P × RθJA` | 结温 | 热阻 |\n| `RDS(on)@Tj ≈ RDS(on)@25 × (1+α(Tj−25))` | 热态电阻 | α 查曲线 |\n\n#### 7.8.2 术语表\n\n| 术语 | 解释 |\n|---|---|\n| MOSFET | 金属-氧化物-半导体场效应管 |\n| G/D/S | 栅极/漏极/源极 |\n| NMOS | N 沟道，正 VGS 导通 |\n| PMOS | P 沟道，负 VGS 导通 |\n| VGS(th) | 阈值电压，开始导通 |\n| RDS(on) | 导通电阻 |\n| Qg | 栅极电荷 |\n| Ciss | 输入电容 |\n| 体二极管 | 内部寄生二极管 |\n| SOA | 安全工作区 |\n| 同步整流 | 用 MOS 代替续流二极管 |\n\n#### 7.8.3 自测 10 题\n\n1. NMOS 的导通条件是什么？\n2. PMOS 的导通条件是什么？\n3. `VGS(th)=2V` 是否说明 3.3V 就能充分导通？\n4. RDS(on)=20mΩ、2A，导通损耗多少？\n5. 为什么高边 NMOS 难驱动？\n6. 体二极管的方向是什么？\n7. 栅极下拉电阻的作用？\n8. Qg=20nC、f=200kHz，平均驱动电流约多少？\n9. 为什么 ID 额定值不能直接当实际电流？\n10. 同步 Buck 的死区时间有什么用？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `VGS > 0` 且足够大（增强型）。\n2. `VGS < 0` 且足够负。\n3. 不一定，必须查 3.3V 下的 RDS(on)。\n4. `2²×0.02=0.08W`。\n5. S 点接近电源，需要 G 比 S 更高，要自举/高边驱动。\n6. NMOS：S→D；PMOS：D→S。\n7. 保证 GPIO 高阻/复位时关断。\n8. `20nC×200kHz=4mA`。\n9. ID 有散热/温度测试条件，实际受封装和铜皮限制。\n10. 防止高边/低边同时导通直通。\n\n<\/details>\n\n#### 7.8.4 能力清单\n\n- [ ] 能分清 NMOS/PMOS 和 G/D/S。\n- [ ] 能用 VGS 判断导通趋势。\n- [ ] 知道 VGS(th) 和 RDS(on) 的区别。\n- [ ] 会算导通损耗和温升。\n- [ ] 能设计低边开关，理解高边驱动。\n- [ ] 知道体二极管、Qg、SOA 的影响。\n\n#### 7.8.5 下一章\n\n下一章讲**运算放大器**：它是模拟电路的核心，能把微弱信号放大、缓冲、滤波、比较。你会看到“虚短”“虚断”这两个看似神奇的分析方法，以及它们成立的条件。\n\n---\n\n<!-- 第 07 章完 -->","taskSignature":"fc453556e3eb31047bac08a7e11f7aec8bf0ee9a75435aba5bd72c8e7cb93899","taskCount":6},{"id":"08","title":"第 08 章 · 运算放大器","short":"运算放大器","stage":1,"diff":4,"prev":"第 01～07 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 认出运放的同相、反相输入和输出。\n2. 解释负反馈、虚短、虚断。\n3. 会算跟随、同相、反相、差分放大。\n4. 知道输入共模、输出摆幅、GBW、压摆率、失调的限制。\n5. 能区分运放和比较器。\n\n运算放大器是把微小差分电压放大的器件，也是模拟信号链的核心。它靠负反馈工作，虚短、虚断、共模范围、带宽和压摆率决定了“理想公式”什么时候会失效。\n\n## 正文\n\n### 8.1 它解决什么问题：三个真实场景\n\n#### 场景一：传感器信号太小，ADC 读不到\n\n热电偶、应变片、光敏二极管、麦克风的输出可能只有几毫伏到几十毫伏。单片机 ADC 的分辨率有限，直接接上去，噪声一盖，什么都测不到。需要运放把信号放大到 0～3.3V 的范围，再送 ADC。\n\n#### 场景二：信号源太弱，一接后级就掉电压\n\n一个高输出阻抗的传感器，空载时 1V，接到 ADC 的输入电阻后变成 0.6V。这叫**负载效应**。用运放做电压跟随器，输入阻抗高、输出阻抗低，可以把信号“缓冲”一下，后级就不再拖垮前级。\n\n#### 场景三：需要把电流/差分信号变成单端电压\n\n电机电流采样、电桥传感器、电池电流检测，输出的都是两个点之间的差分电压。运放组成差分放大，把差分信号变成以地为参考的单端电压，再送 ADC。\n\n\n第 01 章讲过电压、电流、分压、负载效应；第 02 章电阻、第 03 章电容、第 04 章电感、第 05 章二极管、第 06 章三极管、第 07 章 MOS。本章是第一阶段最后一章，把前面所有器件组合成一个完整的模拟信号链：**传感器 → 运放 → ADC**。\n\n---\n\n### 8.2 它是什么：高增益差分放大器\n\n#### 8.2.1 一句话定义\n\n**运算放大器（Operational Amplifier，简称运放，Op-Amp）** 是一个高增益的差分电压放大器：它放大“同相输入 + 与反相输入 −”之间的电压差，输出一个电压。通过外部电阻、电容构成负反馈，可以实现放大、缓冲、滤波、求和、比较等功能。\n\n三个信号端子（实际芯片还有电源脚）：\n\n- **同相输入 +（Non-inverting）**：输出与它同相。\n- **反相输入 −（Inverting）**：输出与它反相。\n- **输出 Vout**：输出电压。\n\n原理图位号常用 **U**，如 U1A、U1B。一个芯片里可能有一个、两个或四个运放，电源脚可能共用。**符号只画信号脚，实际电路必须接电源和地**，否则不工作。\n\n#### 8.2.2 理想运放模型\n\n理想运放有三个假设：\n\n1. **开环增益无穷大**：`Aol → ∞`。\n2. **输入阻抗无穷大**：输入端不取电流，`I+ = I− = 0`。\n3. **输出阻抗为零**：输出能驱动任意负载（实际不是）。\n\n由 1 和 2，在负反馈稳定且未饱和时，可以推出两个重要结论：\n\n- **虚短**：两个输入端电压几乎相等，`V+ ≈ V−`。\n- **虚断**：输入端电流几乎为零，`I+ ≈ I− ≈ 0`。\n\n> **术语解释：虚短 / 虚断**\n> “虚短”不是真的用导线把两个输入脚短接，而是负反馈让运放自动调节输出，使两脚电压差极小；“虚断”不是内部断开，而是输入阻抗极高，几乎不取电流。**它们只在负反馈、未饱和、频率/共模/输出范围都满足时成立。** 开环比较、饱和、过载时不能套。\n\n#### 8.2.3 负反馈\n\n把输出的一部分送回**反相输入端**，叫负反馈。负反馈的作用：\n\n- 降低增益，但增益由外部电阻决定，更稳定；\n- 扩展带宽；\n- 减小失真；\n- 改变输入/输出阻抗。\n\n**正反馈**（送回同相端）会锁定到电源轨，通常用于比较器/振荡器，不用于线性放大。\n\n#### 8.2.4 运放的供电与输入输出范围\n\n运放不是理想器件，有几个现实限制：\n\n- **电源范围**：单电源 0～5V，或双电源 ±12V。\n- **输入共模范围**：两个输入电压必须落在允许范围内，否则运放不工作/输出反相。\n- **输出摆幅**：输出不能完全到电源轨，普通运放可能差 0.5～2V；轨到轨（R2R）也有条件。\n- **输出电流**：带不动太小负载。\n- **带宽/压摆率**：高频大信号会失真。\n- **失调/偏置电流/噪声**：影响精度。\n\n#### 8.2.5 符号\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 112\" width=\"280\" height=\"112\" role=\"img\"><line x1=\"30\" y1=\"30\" x2=\"100\" y2=\"30\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"30\" y1=\"80\" x2=\"100\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M 100 20 L 100 90 L 170 55 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"170\" y1=\"55\" x2=\"230\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"40\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-strong\">V−<\/text><text x=\"40\" y=\"98\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-strong\">V+<\/text><text x=\"250\" y=\"59\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-strong\">Vout<\/text><text x=\"135\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-note\">三角形指向输出<\/text><\/svg>\n```\n\n图 8-1 运放符号：三角形指向输出，+ 同相，− 反相\n\n图中省略了电源脚。实际电路必须在芯片的 V+ / V−（或 VCC/GND）脚接电源，并加去耦电容。\n\n---\n\n### 8.3 关键参数与数据手册\n\n#### 8.3.1 一张表看懂运放手册\n\n| 参数 | 符号 | 含义 | 为什么重要 |\n|---|---|---|---|\n| 供电范围 | Vs | 允许电源电压 | 单/双电源 |\n| 输入共模范围 | VCM | 输入允许范围 | 超出会失真/反相 |\n| 输出摆幅 | Vout | 输出能到的范围 | 接近电源轨时 |\n| 开环增益 | Aol | 开环电压增益 | 闭环精度 |\n| 增益带宽积 | GBW | 增益×带宽 | 频率能力 |\n| 压摆率 | SR | 输出最大变化速率 | 大信号高频 |\n| 输入失调电压 | Vos | 输入等效误差 | 直流精度 |\n| 输入偏置电流 | Ib | 输入端电流 | 高阻源误差 |\n| 共模抑制比 | CMRR | 抑制共模变化 | 差分测量 |\n| 电源抑制比 | PSRR | 抑制电源波动 | 电源噪声 |\n| 输入噪声 | en | 电压噪声密度 | 微弱信号 |\n| 输出电流 | Iout | 驱动能力 | 负载 |\n| 静态电流 | Iq | 自身耗电 | 低功耗 |\n\n#### 8.3.2 读手册的四个关键点\n\n**第一，GBW 不是“能放大到多少倍”。** GBW 是增益带宽积。闭环增益 10 倍时，带宽约 `GBW/10`。比如 GBW=1MHz，增益 10，带宽约 100kHz；增益 100，带宽约 10kHz。具体还要看相位裕度、压摆率。\n\n**第二，压摆率限制大信号。** `SR` 单位 V/μs。输出 1V 峰值的 100kHz 正弦，最大斜率 `2π×100k×1≈0.628V/μs`；如果 SR 只有 0.5V/μs，波形会变成三角波。小信号看 GBW，大信号看 SR。\n\n**第三，失调电压是直流误差。** `Vos=1mV` 经增益 100，输出误差 100mV。高精度直流测量要选低失调运放，或加调零/校准。\n\n**第四，输入共模范围不是电源范围。** 很多运放的输入不能到电源正极附近；单电源 3.3V 运放，输入 3.0V 可能已经超出共模范围。要查 `VCM` 或“输入电压范围”一栏。\n\n#### 8.3.3 运放 vs 比较器\n\n| 对比 | 运放 | 比较器 |\n|---|---|---|\n| 用途 | 线性放大、缓冲、滤波 | 判断大小，输出高低 |\n| 反馈 | 通常负反馈 | 通常开环/正反馈 |\n| 输出 | 模拟电压 | 逻辑电平/开漏 |\n| 速度 | 看 GBW/SR | 看传播延迟 |\n| 输入范围 | 共模限制 | 也有范围 |\n| 能互换吗 | 低速、条件满足时可以 | 不建议用运放替代 |\n\n**运放当比较器**可能遇到的问题：输入共模超限、输出不到逻辑电平、饱和恢复慢、功耗大。要判断高低，优先用专用比较器（如 LM393、TLV3201）。\n\n---\n\n### 8.4 六个典型电路\n\n#### 8.4.1 电路一：电压跟随器（缓冲）\n\n```svg\n<svg role=\"img\" aria-label=\"运算放大器buffer负反馈示意图，运放电源脚省略\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"126.20000000000002pt\" width=\"246.644pt\" viewBox=\"-5.115999999999999 -148.60000000000002 246.644 126.20000000000002\"><path d=\"M 72.0,-72.0 L 72,-117 L 149.942,-72 L 72,-27 L 72,-72 M 149.942,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-94.5 L 85.343,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-49.5 L 85.343,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 81.74278579257494,-45.9 L 81.743,-53.1\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-49.5 L 36,-49.5 L 72,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 149.94228634059948,-72.0 L 175.771,-72 L 201.6,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-94.5 L 59.4,-94.5 L 46.8,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-94.5 L 46.8,-119.25 L 46.8,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-144.0 L 117,-144 L 187.2,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 187.20000000000002,-144.0 L 187.2,-108 L 187.2,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"9.0\" y=\"-66.1\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"9.0\" dy=\"13\">Vin<\/tspan><\/text><text x=\"223.2\" y=\"-88.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"223.2\" dy=\"13\">Vout<\/tspan><\/text><circle cx=\"187.2\" cy=\"-72\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n图 8-2 电压跟随器：输出直接接回反相输入\n\n```text\nVin ── + 输入\n输出 ── − 输入\n输出 ── 后级\n```\n\n理想条件下 `Vout ≈ Vin`，增益为 1。它不放大电压，但输入阻抗高、输出阻抗低，能减轻后级对前级的负载。\n\n**算例**：传感器空载 1.0V，输出阻抗 10kΩ；ADC 输入阻抗 10kΩ。直接接，分压后 `1.0×10/(10+10)=0.5V`，掉了一半。加跟随器后，运放输入几乎不取电流，传感器仍是 1.0V；输出能驱动 ADC，`Vout≈1.0V`。\n\n**限制**：输入共模要包含 1.0V；输出要能到 1.0V；如果传感器输出接近电源轨，普通运放可能跟不上。\n\n```circuitjs\nopamp-buffer\n```\n\n#### 8.4.2 电路二：同相放大\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"同相放大：输入接同相端，Rf和Rg构成负反馈分压\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M30 200 H210\"/><path d=\"M210 90 L360 160 L210 230 Z\"/>\n  <circle cx=\"150\" cy=\"120\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M150 120 V105\"/><rect x=\"137\" y=\"55\" width=\"26\" height=\"50\"/><path d=\"M150 55 V40\"/><path d=\"M150 40 H410\"/><path d=\"M410 40 V160\"/><path d=\"M410 160 H470\"/>\n  <path d=\"M150 120 H115\"/><rect x=\"65\" y=\"107\" width=\"50\" height=\"26\"/><path d=\"M65 120 H40\"/><path d=\"M40 120 V145\"/>\n  <path d=\"M40 145 H100 M88 145 V160 M76 160 H100 M80 168 H96 M84 176 H92\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"24\" y=\"192\">Vin<\/text><text x=\"366\" y=\"152\">Vout<\/text>\n  <text x=\"160\" y=\"82\">Rf 10kΩ<\/text><text x=\"58\" y=\"98\">Rg 10kΩ<\/text>\n  <text x=\"196\" y=\"112\">−<\/text><text x=\"196\" y=\"208\">+<\/text>\n<\/g><\/svg>\n```\n\n图 8-3 同相放大：输入接 +，反馈分压接 −\n\n```text\nVin ── + 输入\n输出 ── Rf ──●── Rg ── GND\n              │\n            − 输入\n```\n\n理想增益：\n\n```text\nVout = (1 + Rf/Rg) × Vin\n```\n\n**算例**：Rf=90kΩ、Rg=10kΩ，增益 `1+9=10`；输入 0.2V，输出 2.0V。前提是供电、输入共模、输出摆幅都允许。\n\n**输入阻抗**：同相放大的输入阻抗很高（接近运放输入阻抗），适合高阻信号源。这是它的优点。\n\n**共模限制**：输入 0.2V 要落在运放的输入共模范围内；如果运放是单电源 3.3V、输入范围 0～1.5V，0.2V 可以，但 2.5V 可能不行。\n\n```circuitjs\nopamp-noninvert\n```\n\n#### 8.4.3 电路三：反相放大\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"反相放大：输入经Rin接反相端，Rf从输出反馈\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M30 120 H90\"/><rect x=\"90\" y=\"107\" width=\"64\" height=\"26\"/><path d=\"M154 120 H220\"/>\n  <path d=\"M220 90 L360 160 L220 230 Z\"/>\n  <circle cx=\"200\" cy=\"120\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M200 120 V105\"/><rect x=\"187\" y=\"55\" width=\"26\" height=\"50\"/><path d=\"M200 55 V40\"/><path d=\"M200 40 H410\"/><path d=\"M410 40 V160\"/><path d=\"M410 160 H470\"/>\n  <path d=\"M30 200 H220\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"24\" y=\"112\">Vin<\/text><text x=\"366\" y=\"152\">Vout<\/text>\n  <text x=\"96\" y=\"96\">Rin 10kΩ<\/text><text x=\"214\" y=\"82\">Rf 20kΩ<\/text>\n  <text x=\"24\" y=\"192\">Vref=0V<\/text><text x=\"206\" y=\"112\">−<\/text><text x=\"206\" y=\"208\">+<\/text>\n<\/g><\/svg>\n```\n\n图 8-4 反相放大：输入经 Rin 接 −，Rf 反馈\n\n```text\nVin ── Rin ──●── Rf ── 输出\n             │\n           − 输入\n+ 输入 ── Vref（通常 GND）\n```\n\n理想增益：\n\n```text\nVout = −(Rf/Rin) × Vin\n```\n\n**算例**：Rin=10kΩ、Rf=20kΩ、Vin=+0.1V，`Vout=−0.2V`。负号表示反相。\n\n**单电源限制**：如果运放只有 0～3.3V 供电，输出不能到负电压。要输出负电压，需要负电源，或把 `Vref` 抬到 1.65V，让输出围绕 1.65V 摆动。**不能只套公式不看供电。**\n\n**输入阻抗**：反相输入的输入阻抗约等于 Rin，不如同相放大高。高阻源要选大 Rin，但大 Rin 会增加噪声/偏置误差。\n\n```circuitjs\nopamp-invert\n```\n\n#### 8.4.4 电路四：差分放大\n\n```text\nV1 ── R1 ──●── R2 ── 输出\n            │\n          − 输入\nV2 ── R3 ──●── R4 ── GND\n            │\n          + 输入\n```\n\n当 `R2/R1 = R4/R3` 时，理想输出：\n\n```text\nVout = (R2/R1) × (V2 − V1)\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 350\" role=\"img\" aria-label=\"差分放大：两路输入经电阻接运放，R2反馈，R4接地\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M30 100 H70\"/><rect x=\"70\" y=\"87\" width=\"50\" height=\"26\"/><path d=\"M120 100 H220\"/>\n  <path d=\"M30 230 H70\"/><rect x=\"70\" y=\"217\" width=\"50\" height=\"26\"/><path d=\"M120 230 H220\"/>\n  <path d=\"M220 70 L360 165 L220 260 Z\"/>\n  <circle cx=\"180\" cy=\"100\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M180 100 V80\"/><rect x=\"167\" y=\"40\" width=\"26\" height=\"40\"/><path d=\"M180 40 H410 V165 H470\"/>\n  <path d=\"M180 230 V240\"/><rect x=\"167\" y=\"240\" width=\"26\" height=\"40\"/><path d=\"M180 280 V300\"/>\n  <path d=\"M180 300 H240 M228 300 V315 M216 315 H240 M220 323 H236 M224 331 H232\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"24\" y=\"92\">V1<\/text><text x=\"24\" y=\"222\">V2<\/text>\n  <text x=\"72\" y=\"76\">R1<\/text><text x=\"72\" y=\"206\">R3<\/text>\n  <text x=\"205\" y=\"60\">R2<\/text><text x=\"140\" y=\"265\">R4<\/text>\n  <text x=\"366\" y=\"157\">Vout<\/text><text x=\"206\" y=\"92\">−<\/text><text x=\"206\" y=\"258\">+<\/text>\n  <text x=\"180\" y=\"336\">GND<\/text>\n<\/g><\/svg>\n```\n\n图 8-5 差分放大：输出与两输入之差成正比\n\n差分放大用来测两个点之间的电压差，比如电流采样电阻两端、电桥中点。**电阻匹配很重要**：1% 电阻失配会直接变成共模误差，降低 CMRR。\n\n#### 8.4.5 电路五：比较器\n\n```text\nVin ── + 输入\nVref ── − 输入\n输出 ── 上拉/逻辑\n```\n\n`Vin > Vref` 时输出高，`Vin < Vref` 时输出低。专用比较器输出可能是开漏，需要上拉电阻；也有推挽输出。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"比较器：输入与参考电压比较，输出经上拉到逻辑电平\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M30 200 H220\"/><path d=\"M30 120 H220\"/>\n  <path d=\"M220 80 L360 160 L220 240 Z\"/>\n  <path d=\"M360 160 H420\"/><path d=\"M420 160 V180\"/><path d=\"M420 160 H490\"/>\n  <path d=\"M420 40 V160\"/><rect x=\"407\" y=\"40\" width=\"26\" height=\"50\"/><path d=\"M420 30 V40\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"16\">\n  <text x=\"24\" y=\"192\">Vin<\/text><text x=\"24\" y=\"112\">Vref<\/text><text x=\"440\" y=\"145\">Vout<\/text><text x=\"414\" y=\"26\">+5V<\/text>\n  <text x=\"442\" y=\"70\">上拉<\/text><text x=\"206\" y=\"112\">−<\/text><text x=\"206\" y=\"238\">+<\/text>\n<\/g><\/svg>\n```\n\n图 8-6 比较器：输出只有高/低两种状态\n\n**迟滞**：如果输入在阈值附近有噪声，输出会反复跳变。加正反馈（迟滞）可以设定上下两个阈值，避免抖动。零基础先理解概念。\n\n```circuitjs\nanalog-comparator\n```\n\n#### 8.4.6 电路六：有源低通滤波（了解）\n\n在反相/同相放大器的反馈网络里加电容，可以做成有源低通/高通滤波。比如反相低通：`Rf` 并联 `Cf`，截止频率 `fc=1/(2πRfCf)`。它比无源 RC 滤波更陡，但需要运放带宽和稳定性支持。\n\n本章只要求知道“运放+RC 可以做出比 RC 更好的滤波器”，具体设计在后续阶段展开。\n\n---\n\n### 8.5 选型与降额\n\n#### 8.5.1 按用途选类型\n\n| 用途 | 首选 | 备选 | 避免 |\n|---|---|---|---|\n| 通用缓冲 | 通用运放（LM358、TLV2372） | 轨到轨 | 高速运放（功耗大） |\n| 单电源 3.3V 信号链 | 轨到轨输入/输出 | 低电压运放 | 高压运放 |\n| 精密直流 | 低失调、低漂移 | 斩波稳零 | 普通通用运放 |\n| 高阻传感器 | 低偏置电流（CMOS/JFET） | — | 双极型高 Ib |\n| 音频 | 低噪声、足够 GBW | — | 通用慢运放 |\n| 高频 | 高速运放 | — | 低 GBW |\n| 比较 | 专用比较器 | — | 运放硬当比较器 |\n\n#### 8.5.2 降额参考\n\n| 参数 | 建议 | 说明 |\n|---|---|---|\n| 电源 | 不超过额定 | 留 10～20% |\n| 输入共模 | 留余量 | 接近电源轨要查 |\n| 输出电流 | ≤额定 | 看负载 |\n| 带宽 | 信号最高频率 ≤GBW/增益 的 1/5～1/10 | 留余量 |\n| 压摆率 | 大于最大斜率 2～5 倍 | 大信号 |\n| 功耗 | 结温留 20～30℃ | 封装热阻 |\n| 稳定性 | 容性负载要查 | 可能振荡 |\n\n#### 8.5.3 选型 8 步\n\n1. 定信号范围、源阻抗、负载。\n2. 定电源（单/双、电压）。\n3. 定增益和带宽。\n4. 查输入共模、输出摆幅。\n5. 查失调、偏置电流、噪声。\n6. 查 GBW、压摆率、稳定性。\n7. 查封装、通道数、功耗。\n8. 写完整料号，核对供货。\n\n---\n\n### 8.6 测量与仿真\n\n#### 8.6.1 测运放的基本步骤\n\n1. 先测电源脚电压，确认供电正常。\n2. 测两个输入脚电压，确认在共模范围内。\n3. 测输出，判断是否饱和（接近电源轨）。\n4. 输入小信号，用示波器看输出波形、增益、相位。\n5. 改变负载，看输出是否掉压/振荡。\n\n**注意**：探头地线可能短路，测高压/高边电路要用差分探头。\n\n#### 8.6.2 常见故障现象\n\n| 现象 | 可能原因 |\n|---|---|\n| 输出贴电源轨 | 输入超出共模、反馈断、饱和 |\n| 输出为 0 | 没供电、输入短路、负载短路 |\n| 输出振荡 | 容性负载、反馈相位、布线 |\n| 增益不对 | 电阻值错、反馈没接、输入源阻抗 |\n| 直流偏置大 | 失调、偏置电流、电阻误差 |\n\n#### 8.6.3 仿真记录表\n\n| 仿真 | 改什么 | 预期 | 实际 |\n|---|---|---|---|\n| opamp-buffer | 改负载 | 输出是否掉 | |\n| opamp-noninvert | 改 Rf | 增益变 | |\n| opamp-invert | 改 Rin | 增益变、反相 | |\n| analog-comparator | 改 Vref | 翻转点变 | |\n\n#### 8.6.4 动手任务\n\n1. 用 LM358 搭电压跟随器，输入 1V，测输出；再接 1kΩ 负载，看是否掉压。\n2. 搭同相放大 10 倍，输入 0.2V，测输出；把电源改成 3.3V，观察输出上限。\n3. 搭反相放大，输入 0.1V，测输出相位；解释为什么单电源不能输出负压。\n4. 用比较器搭一个光控开关，测翻转阈值。\n\n---\n\n### 8.7 常见坑\n\n#### 坑 1：忘记接电源\n\n运放符号只画信号脚，新手常忘记 V+/V−，输出当然不动。每个运放都必须接电源，并加 0.1μF 去耦。\n\n#### 坑 2：输入超出共模范围\n\n单电源运放输入不能到电源正极附近，超了输出会反相/锁死。查 `VCM`。\n\n#### 坑 3：输出不能到轨\n\n普通运放输出比电源轨低 1～2V，3.3V 供电可能只能到 2.5V。需要轨到轨（R2R）或更高电源。\n\n#### 坑 4：虚短乱用\n\n开环、饱和、正反馈时，`V+ = V−` 不成立。不能拿虚短公式算比较器。\n\n#### 坑 5：忽略压摆率\n\n大信号高频时，GBW 够但 SR 不够，输出变三角波。要同时查。\n\n#### 坑 6：容性负载振荡\n\n运放驱动长线/电容负载可能振荡。加隔离电阻或选稳定型号。\n\n#### 坑 7：电阻容差忽略\n\n增益 10 倍，1% 电阻可能让增益变 9.8～10.2，满量程误差明显。精密电路用 0.1% 或校准。\n\n#### 坑 8：用运放替代比较器\n\n速度慢、输出电平不兼容、恢复慢。判断高低优先用比较器。\n\n#### 坑 9：高阻源 + 高偏置电流\n\n偏置电流流过源阻抗产生误差。高阻传感器选 CMOS/JFET 输入运放。\n\n---\n\n### 8.8 本章复盘\n\n#### 8.8.1 公式表\n\n| 公式 | 用途 | 条件 |\n|---|---|---|\n| `Vout = Vin` | 跟随器 | 负反馈、未饱和 |\n| `Vout = (1+Rf/Rg)Vin` | 同相放大 | 理想运放 |\n| `Vout = −(Rf/Rin)Vin` | 反相放大 | 理想运放、有负电源/偏置 |\n| `Vout = (R2/R1)(V2−V1)` | 差分放大 | 电阻匹配 |\n| `BW ≈ GBW/增益` | 闭环带宽 | 单主极点近似 |\n| `SR ≥ 2πfVpk` | 压摆率要求 | 正弦 |\n| `fc = 1/(2πRC)` | RC 截止 | 一阶 |\n\n#### 8.8.2 术语表\n\n| 术语 | 解释 |\n|---|---|\n| 运放 | 高增益差分放大器 |\n| 同相 + | 输出同相 |\n| 反相 − | 输出反相 |\n| 负反馈 | 输出送回反相端 |\n| 虚短 | 两输入电压近似相等 |\n| 虚断 | 输入电流近似为零 |\n| 共模范围 | 输入允许范围 |\n| 输出摆幅 | 输出能到的电压范围 |\n| GBW | 增益带宽积 |\n| SR | 压摆率 |\n| Vos | 输入失调电压 |\n| Ib | 输入偏置电流 |\n| CMRR | 共模抑制比 |\n| 轨到轨 | 输入/输出接近电源轨 |\n| 比较器 | 判断大小输出高低 |\n\n#### 8.8.3 自测 10 题\n\n1. 运放的三个信号端子是什么？\n2. 虚短成立的条件是什么？\n3. 同相放大 Rf=90k、Rg=10k，增益多少？\n4. 反相放大 Rin=10k、Rf=20k，输入 0.1V，输出多少？\n5. 单电源 3.3V 运放为什么不能输出负压？\n6. GBW=1MHz、增益 100，带宽约多少？\n7. 压摆率不够会怎样？\n8. 运放输入共模超限会怎样？\n9. 运放和比较器有什么区别？\n10. 电压跟随器有什么用？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 同相 +、反相 −、输出。\n2. 负反馈、未饱和、共模/输出范围满足。\n3. 10 倍。\n4. −0.2V（需要负电源或偏置）。\n5. 输出不能超出供电轨。\n6. 约 10kHz。\n7. 大信号高频输出变三角波/失真。\n8. 输出失真、反相、锁死。\n9. 运放做线性放大，比较器判断大小输出逻辑；运放替代比较器有限制。\n10. 缓冲、隔离前后级、减轻负载效应。\n\n<\/details>\n\n#### 8.8.4 能力清单\n\n- [ ] 能画运放符号，认 +/−/输出。\n- [ ] 能解释负反馈、虚短、虚断。\n- [ ] 会算跟随、同相、反相、差分增益。\n- [ ] 知道共模、输出摆幅、GBW、SR、失调的限制。\n- [ ] 能区分运放和比较器。\n- [ ] 能搭基本运放电路并测量。\n\n#### 8.8.5 下一阶段：数字电路与单片机\n\n到这里，第一阶段 8 章完成：\n\n1. 基础概念：电、电压、电流、电阻、功率、串并联、地、欧姆定律、KCL/KVL、信号、测量、读图。\n2. 电阻：分压、限流、上拉/下拉、采样、选型、降额。\n3. 电容：储能、滤波、去耦、耦合、延时、选型。\n4. 电感：储能、续流、Buck、LC 滤波、变压器、选型。\n5. 二极管：单向导电、整流、防反接、OR、稳压、TVS、LED。\n6. 三极管：NPN/PNP、截止/放大/饱和、低边/高边、射极跟随、共射。\n7. MOS：N/P 沟道、VGS、RDS(on)、Qg、体二极管、低边/高边、同步 Buck。\n8. 运放：负反馈、虚短/虚断、跟随/同相/反相/差分/比较器。\n\n下一阶段进入**数字电路与单片机**：逻辑门、时序、ADC/DAC、GPIO、通信接口，然后把它们放到真实 PCB 上。\n\n---\n\n<!-- 第一阶段 8 章完 -->","taskSignature":"61528b8f24475cc5740d6694b9a0df1e8403fa14776abd2993a6ce02b68f34c4","taskCount":6},{"id":"09","title":"第 09 章 · EDA 与原理图入门","short":"EDA 与原理图入门","stage":2,"diff":2,"prev":"第 01～08 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清 EDA、原理图、符号、网络、网表、封装之间的关系。\n2. 独立新建一个 EDA 工程，设置图框、网格和设计规则。\n3. 从器件库调用电阻、电容、二极管，画出无 ERC 错误的 RC 电路。\n4. 给每个元件挂上正确封装，导出网表，理解“符号管脚号”和“焊盘编号”的对应。\n5. 用 ERC 定位悬空网络、输出冲突、电源短路三类错误。\n6. 用版本号和目录规范管理原理图，避免“最终版-真的最终版”。\n7. 说出至少 8 个新手在原理图阶段常犯的坑。\n\nEDA 不是“画图软件”，而是把电路意图翻译成工厂能执行的数据。原理图画对了，后面的封装、网表、PCB、Gerber 才有意义；原理图画错了，后面每一步都在放大错误。\n\n## 正文\n\n### 9.1 它解决什么问题：三个真实场景\n\n#### 场景一：手画电路图，改一次就全乱\n\n在纸上画一个 RC 低通，改一个电阻值只要擦掉重写；但加上电源、地、连接器、测试点之后，每改一次都要重新画线，版本无法比较，别人也看不懂。EDA 把“元件”和“连线”变成结构化对象：改一个参数，所有引用同步更新；改一版，可以 diff、可以回退。\n\n#### 场景二：原理图和 PCB 各画一遍，管脚对不上\n\n有人在原理图上把三极管 B/C/E 画成 1/2/3，封装却按 2/1/3 焊盘建。图看起来没错，板子做出来三极管接反。EDA 的网表把“符号管脚号”和“封装焊盘号”绑定，导入 PCB 时就会报 Unknown Pin / Extra Pin，逼你在投板前解决。\n\n#### 场景三：工厂问你要网表，你只有一张截图\n\n打样厂和贴片厂要的是 Gerber、钻孔、坐标、BOM，不是聊天窗口里的截图。EDA 工程能一键导出这些生产数据；没有工程文件，就无法保证“你看到的图”和“工厂做出的板”是同一版。\n\n### 9.2 它是什么：从电路意图到生产数据\n\n**EDA**（Electronic Design Automation，电子设计自动化）是设计电子系统的软件工具集合。对 PCB 方向，最常用的是原理图编辑器和 PCB 编辑器。\n\n一条完整的数据链是：\n\n`原理图（Symbol + Wire + Net）→ 网表（Netlist）→ PCB（Footprint + Net）→ Gerber / 钻孔 / 坐标 / BOM`\n\n几个必须分清的概念：\n\n- **符号（Symbol）**：原理图上的图形，代表器件的电气功能。符号有管脚号和管脚名，但不决定焊盘大小。\n- **封装（Footprint）**：PCB 上的焊盘图形，决定器件怎么焊。封装有焊盘编号和尺寸，但不管电气功能。\n- **网络（Net）**：同一根导线连接的所有管脚属于同一个网络。网络名是 PCB 布线的依据。\n- **网表（Netlist）**：原理图导出的“元件—管脚—网络”清单，是原理图和 PCB 之间的合同。\n- **ERC**（Electrical Rules Check，电气规则检查）：检查悬空管脚、输出冲突、电源短路等电气问题，不检查封装对不对。\n\n> **术语第一次出现**：ERC 不是“画图检查”，它只按你设置的电气管脚类型判断。ERC 通过不等于板子一定对，封装、极性、网络名还要人工核对。\n\n#### 9.2.1 四类对象：谁决定什么\n\n| 对象 | 在哪里 | 决定什么 | 错了会怎样 |\n|---|---|---|---|\n| 符号 Symbol | 原理图库 | 电气功能、管脚名/号 | 连线对不上、ERC 误报 |\n| 封装 Footprint | PCB 库 | 焊盘尺寸、间距、极性 | 焊不上、贴反、偏移 |\n| 网络 Net | 原理图连线 | 哪些管脚必须连在一起 | 板子开路/短路 |\n| 网表 Netlist | 导出文件 | 把前两者绑成合同 | 导入 PCB 报 Unknown Pin |\n| ERC | 原理图规则 | 电气连接是否自洽 | 通过但板子仍可能错 |\n\n> **术语第一次出现**：Unknown Pin（未知管脚）指网表里的管脚号在封装里找不到对应焊盘；Extra Pin（多余管脚）指封装有焊盘但网表没给连接。两者都是“符号—封装”不匹配的直接证据。\n\n> **术语第一次出现**：No Connect（不连接）是原理图里对“本来就不接”的管脚做的显式标记。它告诉 ERC“这个脚悬空是有意的”，不是“我忘了连”。\n\n#### 9.2.2 数据链的五个检查点\n\n| 检查点 | 看什么 | 通过标准 |\n|---|---|---|\n| 符号 | 管脚号与手册一致 | 1/2/3 与封装焊盘一一对应 |\n| 连线 | 每根线两端都有电气连接 | 无悬空、无重叠假连 |\n| 网络名 | 关键网络有语义名 | `VBAT_SENSE` 而不是 `Net12` |\n| 封装 | 焊盘尺寸/间距/极性 | 与器件手册推荐焊盘一致 |\n| 导出 | 网表、BOM、PDF 同版本 | 文件名与日期能对上 |\n\n\n#### 9.2.3 先把“合同”想清楚再画\n\n原理图不是画给自己看的，是画给三个人看的：**画板的人**要知道哪些脚必须连；**贴片的人**要知道每个位号焊什么；**测试的人**要知道去哪里量电压。画之前先问三句话：\n\n1. 这个信号从哪来、到哪去、中间经过谁？\n2. 这个器件的第 1 脚在哪，封装丝印能不能对上？\n3. 板子回来先量哪个点，测试点有没有留？\n\n三句话答不清，图越画越乱；答清了，ERC 只是最后一道形式检查。\n\n这也是为什么原理图阶段要“慢”：这里改一根线只花一分钟，到了 PCB 可能要重布一片地；到了工厂，就是一批板报废。前期多花十分钟核对，后面少花十天返工。\n\n### 9.3 关键参数与工程设置\n\nEDA 没有“器件手册”，但有一组工程参数必须设置对。下表是新建工程时的检查清单。\n\n| 设置项 | 推荐做法 | 不设置的后果 |\n|---|---|---|\n| 图框与纸张 | A4/A3，标题栏写项目名、版本、日期 | 打印/归档时缺版本信息 |\n| 网格 | 原理图 1.27mm（50mil）或 2.54mm | 线头对不齐，ERC 报悬空 |\n| 管脚间距 | 与符号库一致，常用 2.54mm | 连线看起来接上，实际没连 |\n| 设计规则 | 线宽、间距、过孔按板厂能力 | 后面 PCB 无法 DRC |\n| 元件库 | 只用已核对过的库，禁止随手搜 | 符号/封装不匹配 |\n| 版本命名 | `项目_功能_版本_日期` | 文件无法追溯 |\n| 备份 | Git 或每日压缩包 | 硬盘坏了全丢 |\n\n读“工程设置”的 three 个条件：\n\n1. **板厂能力先于个人喜好**：最小线宽/间距、最小孔径、层数，先看目标板厂工艺表。\n2. **符号库先于连线速度**：库里的符号管脚号必须和器件手册一致，不能“看起来像”就用。\n3. **版本先于“最终版”**：每次投板前打 tag，Gerber 与工程文件同版本归档。\n\n#### 9.3.1 新建工程 12 步\n\n1. **定项目名**：`项目_功能_版本_日期`，如 `relay4_v1_20261110`。\n2. **选图框**：A4 横版够用；功能块多就 A3，不要在一张图上挤。\n3. **设单位**：原理图用 mm/mil 均可，但全工程统一，不要一会儿 50mil 一会儿 1.27mm。\n4. **设网格**：1.27mm（50mil）或 2.54mm（100mil），保证管脚落在格点上。\n5. **建图层**：至少“主图/电源/接口/测试点”四页，别把所有东西画一张。\n6. **选库**：优先用经过核对的公司库/官方库，禁止“搜到就用”。\n7. **放符号**：先放核心器件，再放阻容，最后放连接器/测试点。\n8. **连线**：先连电源/地，再连信号；每连完一块立即命名网络。\n9. **挂封装**：逐个确认封装名、焊盘号、极性，不批量“默认”。\n10. **跑 ERC**：先清零错误，再处理警告；每个警告写原因。\n11. **导网表**：导出后搜 3 个关键网络，确认管脚归属。\n12. **归档**：PDF、网表、BOM、工程文件同目录，打 tag/日期。\n\n这 12 步里，最容易被跳过的是第 9 步和第 12 步。第 9 步决定“能不能焊”，第 12 步决定“下次还能不能找回来”。把这两步写进自己的检查表，每次新建工程照着走，比事后返工便宜得多。原理图阶段的每一分钟，都会在 PCB、焊接、调试阶段被放大成十分钟。把图当合同，而不是当草图，是这一章最想让你带走的习惯。合同写清楚，后面每个人才知道自己该做什么；合同写错，后面每个人都在替同一个错误买单。\n\n### 9.4 典型电路：从库到原理图\n\n#### 9.4.1 电路一：RC 低通（最小闭环）\n\n目标：输入 0～5V 方波，输出给 ADC，截止频率约 159Hz。选 `R=10kΩ`、`C=100nF`。\n\n计算：\n\n`fc = 1 / (2πRC) = 1 / (2π × 10k × 100n) ≈ 159Hz`\n\n操作顺序：\n\n1. 新建工程，命名 `rc_lpf_v1_20261110`。\n2. 从库中放 `R`、`C`、`GND`、`+5V`、输入/输出端口。\n3. 连线，给输入网络命名 `SIG_IN`，输出命名 `ADC_IN`。\n4. 给 R 挂 0805 封装，给 C 挂 0603 封装。\n5. 运行 ERC，确认无悬空管脚、无输出冲突。\n6. 导出网表，检查 `R1-1`、`C1-1` 是否在同一网络。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <rect x=\"20\" y=\"20\" width=\"680\" height=\"260\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"50\" font-size=\"16\" fill=\"currentColor\">图 9-1：EDA 数据链：原理图到生产文件<\/text>\n  <rect x=\"50\" y=\"90\" width=\"120\" height=\"60\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"72\" y=\"125\" font-size=\"14\" fill=\"currentColor\">原理图<\/text>\n  <text x=\"62\" y=\"145\" font-size=\"12\" fill=\"currentColor\">Symbol + Net<\/text>\n  <rect x=\"210\" y=\"90\" width=\"120\" height=\"60\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"236\" y=\"125\" font-size=\"14\" fill=\"currentColor\">网表<\/text>\n  <text x=\"222\" y=\"145\" font-size=\"12\" fill=\"currentColor\">Netlist<\/text>\n  <rect x=\"370\" y=\"90\" width=\"120\" height=\"60\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"396\" y=\"125\" font-size=\"14\" fill=\"currentColor\">PCB<\/text>\n  <text x=\"382\" y=\"145\" font-size=\"12\" fill=\"currentColor\">Footprint + Net<\/text>\n  <rect x=\"530\" y=\"90\" width=\"140\" height=\"60\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"550\" y=\"125\" font-size=\"14\" fill=\"currentColor\">生产文件<\/text>\n  <text x=\"548\" y=\"145\" font-size=\"12\" fill=\"currentColor\">Gerber/BOM/坐标<\/text>\n  <line x1=\"170\" y1=\"120\" x2=\"210\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <polygon points=\"210,120 200,115 200,125\" fill=\"currentColor\"/>\n  <line x1=\"330\" y1=\"120\" x2=\"370\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <polygon points=\"370,120 360,115 360,125\" fill=\"currentColor\"/>\n  <line x1=\"490\" y1=\"120\" x2=\"530\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <polygon points=\"530,120 520,115 520,125\" fill=\"currentColor\"/>\n  <text x=\"55\" y=\"200\" font-size=\"13\" fill=\"currentColor\">每一环都必须能追溯到上一环；任何一环靠“口头说明”，工厂都接不住。<\/text>\n<\/svg>\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 9-2：符号、封装、网络三者的对应关系<\/text>\n  <rect x=\"30\" y=\"60\" width=\"200\" height=\"110\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"85\" font-size=\"14\" fill=\"currentColor\">符号（原理图）<\/text>\n  <text x=\"50\" y=\"110\" font-size=\"13\" fill=\"currentColor\">R1  管脚 1 / 2<\/text>\n  <text x=\"50\" y=\"132\" font-size=\"13\" fill=\"currentColor\">管脚名：1、2<\/text>\n  <text x=\"50\" y=\"154\" font-size=\"13\" fill=\"currentColor\">只表达电气功能<\/text>\n  <rect x=\"260\" y=\"60\" width=\"200\" height=\"110\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"85\" font-size=\"14\" fill=\"currentColor\">封装（PCB）<\/text>\n  <text x=\"280\" y=\"110\" font-size=\"13\" fill=\"currentColor\">0805  焊盘 1 / 2<\/text>\n  <text x=\"280\" y=\"132\" font-size=\"13\" fill=\"currentColor\">焊盘尺寸/间距<\/text>\n  <text x=\"280\" y=\"154\" font-size=\"13\" fill=\"currentColor\">只表达怎么焊<\/text>\n  <rect x=\"490\" y=\"60\" width=\"190\" height=\"110\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"510\" y=\"85\" font-size=\"14\" fill=\"currentColor\">网络（Net）<\/text>\n  <text x=\"510\" y=\"110\" font-size=\"13\" fill=\"currentColor\">SIG_IN / ADC_IN<\/text>\n  <text x=\"510\" y=\"132\" font-size=\"13\" fill=\"currentColor\">同一网络 = 同一根线<\/text>\n  <text x=\"510\" y=\"154\" font-size=\"13\" fill=\"currentColor\">PCB 布线的依据<\/text>\n  <line x1=\"230\" y1=\"115\" x2=\"260\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <polygon points=\"260,115 250,110 250,120\" fill=\"currentColor\"/>\n  <line x1=\"460\" y1=\"115\" x2=\"490\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <polygon points=\"490,115 480,110 480,120\" fill=\"currentColor\"/>\n  <text x=\"30\" y=\"230\" font-size=\"13\" fill=\"currentColor\">网表把三者绑在一起：元件位号 + 符号管脚号 + 封装焊盘号 + 网络名。<\/text>\n  <text x=\"30\" y=\"255\" font-size=\"13\" fill=\"currentColor\">任何一项对不上，PCB 导入就会报 Unknown Pin / Extra Pin。<\/text>\n<\/svg>\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 260\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 9-3：RC 低通原理图<\/text>\n  <text x=\"40\" y=\"120\" font-size=\"14\" fill=\"currentColor\">SIG_IN<\/text>\n  <line x1=\"95\" y1=\"115\" x2=\"150\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"150\" y=\"100\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"160\" y=\"95\" font-size=\"13\" fill=\"currentColor\">R1 10k<\/text>\n  <line x1=\"210\" y1=\"115\" x2=\"270\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"245\" y=\"105\" font-size=\"13\" fill=\"currentColor\">ADC_IN<\/text>\n  <line x1=\"270\" y1=\"115\" x2=\"270\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"250\" y1=\"180\" x2=\"290\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"260\" y1=\"190\" x2=\"280\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"270\" y1=\"180\" x2=\"270\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"185\" font-size=\"13\" fill=\"currentColor\">C1 100n<\/text>\n  <line x1=\"270\" y1=\"200\" x2=\"270\" y2=\"225\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"255\" y1=\"225\" x2=\"285\" y2=\"225\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"260\" y1=\"232\" x2=\"280\" y2=\"232\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"265\" y1=\"239\" x2=\"275\" y2=\"239\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"295\" y=\"232\" font-size=\"13\" fill=\"currentColor\">GND<\/text>\n  <text x=\"40\" y=\"220\" font-size=\"13\" fill=\"currentColor\">fc = 1/(2πRC) ≈ 159Hz<\/text>\n<\/svg>\n```\n\n#### 9.4.2 电路二：分压网络（练网络命名与功耗）\n\n12V 电池经 `R1=10kΩ`、`R2=3.3kΩ` 分压，送 ADC。空载输出：\n\n`Vout = 12 × 3.3 / (10 + 3.3) ≈ 2.98V`\n\n先别急着画，做三个核算：\n\n| 核算 | 公式 | 结果 | 判断 |\n|---|---|---|---|\n| 分压比 | `R2/(R1+R2)` | `3.3/13.3≈0.248` | 12V→2.98V，落在 3.3V ADC 量程内 |\n| 分压电流 | `I=Vin/(R1+R2)` | `12/13.3k≈0.90mA` | 可接受；电池长期在线要算漏电 |\n| R1 功耗 | `P=I²R` | `(0.9m)²×10k≈8.1mW` | 0805 足够 |\n\n如果换成 `R1=100kΩ、R2=33kΩ`，电流降到 90µA，但 ADC 输入漏电/采样电容会影响精度；这时要在分压点加 100nF 电容，并核算 ADC 源阻抗。**分压不是“算对电压就行”，还要算电流、功耗、源阻抗。**\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 9-4：12V 电池分压进 ADC<\/text>\n  <text x=\"40\" y=\"110\" font-size=\"14\" fill=\"currentColor\">VBAT 12V<\/text>\n  <line x1=\"120\" y1=\"105\" x2=\"180\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"180\" y=\"85\" width=\"60\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"188\" y=\"78\" font-size=\"13\" fill=\"currentColor\">R1 10k<\/text>\n  <line x1=\"240\" y1=\"105\" x2=\"320\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"95\" font-size=\"13\" fill=\"currentColor\">VBAT_SENSE<\/text>\n  <line x1=\"320\" y1=\"105\" x2=\"380\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"385\" y=\"110\" font-size=\"14\" fill=\"currentColor\">ADC<\/text>\n  <line x1=\"320\" y1=\"105\" x2=\"320\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"290\" y=\"160\" width=\"60\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"298\" y=\"153\" font-size=\"13\" fill=\"currentColor\">R2 3.3k<\/text>\n  <line x1=\"320\" y1=\"200\" x2=\"320\" y2=\"235\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"300\" y1=\"235\" x2=\"340\" y2=\"235\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"306\" y1=\"242\" x2=\"334\" y2=\"242\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"312\" y1=\"249\" x2=\"328\" y2=\"249\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"350\" y=\"245\" font-size=\"13\" fill=\"currentColor\">GND<\/text>\n  <text x=\"400\" y=\"170\" font-size=\"12\" fill=\"currentColor\">Vout≈2.98V<\/text>\n  <text x=\"400\" y=\"190\" font-size=\"12\" fill=\"currentColor\">I≈0.9mA<\/text>\n<\/svg>\n```\n\n给分压点命名 `VBAT_SENSE`，不要用默认 `Net1`。命名规则建议：\n\n- 电源：`PWR_12V`、`PWR_5V`、`PWR_3V3`\n- 模拟：`ADC_xxx`、`VBAT_SENSE`\n- 数字：`GPIO_xxx`、`UART_TX`\n- 差分：`USB_DP/DM`、`ETH_TXP/TXN`\n\n默认网络名一多，PCB 里根本找不到；改一处分压比，也不知道影响哪些页。\n\n#### 9.4.3 电路三：按键输入（练端口、上拉与去抖）\n\n按键一端接 `GPIO_IN`，另一端接 GND；`GPIO_IN` 通过 `R1=10kΩ` 上拉到 3.3V。按下读 0，松开读 1。先算三个值：\n\n| 项目 | 公式 | 结果 | 说明 |\n|---|---|---|---|\n| 按下电流 | `I=3.3V/10kΩ` | 0.33mA | 触点电流偏小，潮湿环境可降到 1k～4.7k |\n| 上拉功耗 | `P=3.3V²/10kΩ` | ≈1.1mW | 0805 足够 |\n| RC 去抖时间 | `τ=RC` | 10k×100n≈1ms | 机械抖动通常 0.1～10ms，按按键选 |\n\n去抖电容 `C1=100nF` 与上拉构成低通，`τ≈1ms`；如果按键抖动重，增大到 1µF（`τ≈10ms`），但响应会变慢。**去抖不是越大约好，要在“不误触”和“响应快”之间选。**\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 9-5：按键上拉、去抖与端口命名<\/text>\n  <text x=\"40\" y=\"80\" font-size=\"13\" fill=\"currentColor\">3.3V<\/text>\n  <line x1=\"90\" y1=\"75\" x2=\"90\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"70\" y=\"120\" width=\"40\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"118\" y=\"150\" font-size=\"13\" fill=\"currentColor\">R1 10k<\/text>\n  <line x1=\"90\" y1=\"180\" x2=\"90\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"90\" y1=\"210\" x2=\"170\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"200\" font-size=\"13\" fill=\"currentColor\">GPIO_IN<\/text>\n  <line x1=\"170\" y1=\"210\" x2=\"240\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"195\" x2=\"240\" y2=\"225\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"225\" y1=\"195\" x2=\"255\" y2=\"195\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"225\" y1=\"225\" x2=\"255\" y2=\"225\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"262\" y=\"215\" font-size=\"13\" fill=\"currentColor\">按键<\/text>\n  <line x1=\"240\" y1=\"225\" x2=\"240\" y2=\"255\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"220\" y1=\"255\" x2=\"260\" y2=\"255\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"226\" y1=\"262\" x2=\"254\" y2=\"262\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"232\" y1=\"269\" x2=\"248\" y2=\"269\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"265\" font-size=\"13\" fill=\"currentColor\">GND<\/text>\n  <line x1=\"90\" y1=\"210\" x2=\"90\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"60\" y1=\"245\" x2=\"100\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"66\" y1=\"252\" x2=\"94\" y2=\"252\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"72\" y1=\"259\" x2=\"88\" y2=\"259\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"20\" y=\"280\" font-size=\"12\" fill=\"currentColor\">C1 100nF 与 R1 构成 τ≈1ms 低通；按键按下读 0，松开读 1。<\/text>\n<\/svg>\n```\n\n原理图阶段还要注意：按键是“人接触”的接口，量产板建议加 ESD 器件（如双向 TVS 或 RC+TVS），并在结构上做间隙；这些在原理图上就要留位，不要等 PCB 才想起。\n\n### 9.5 选型与降额：软件与工程规范\n\n| 软件 | 适合谁 | 优点 | 注意 |\n|---|---|---|---|\n| 立创 EDA | 零基础、快速打样 | 中文、库全、与嘉立创打通 | 库封装要自己复核 |\n| KiCad | 免费、开源、长期项目 | 跨平台、脚本强、社区大 | 学习曲线比立创陡 |\n| Altium Designer | 企业、多层板、高速 | 规则强、生态成熟 | 授权贵、上手慢 |\n| Allegro / PADS | 大厂、高速/通信 | 约束管理强 | 学习成本高，按岗位需要学 |\n\n选型三条：\n\n1. 先能独立走完“原理图→PCB→Gerber”，再谈软件高级功能。\n2. 团队协作用什么，你就学什么；个人练习优先免费/低成本。\n3. 不要同时学三套软件；一套用到能投板，再迁移。\n\n工程“降额”指给后续修改留余地：\n\n- 图框留 20% 空白，方便加测试点。\n- 网络名统一前缀（`PWR_`、`ADC_`、`GPIO_`），不要 `Net1`。\n- 每个功能块单独一页，别把所有东西塞一张图。\n- 投板前打 tag，保留 Gerber 与工程文件同版本。\n\n#### 9.5.1 库里没有的器件怎么办\n\n新手最常见的卡点不是“不会画”，而是“库里没有”。处理顺序：\n\n1. **先查官方库**：芯片官网/开发板资料常提供符号与封装，优先用原厂。\n2. **再查社区库**：立创/KiCad 官方库有大量器件，但要核对管脚号与焊盘。\n3. **最后自己建**：按手册画符号（管脚名/号/类型）和封装（焊盘尺寸/间距/丝印）。\n4. **建完必须复核**：打印 1:1 封装图，拿实物或游标卡尺对比；符号用“管脚号—功能”表逐脚核对。\n5. **入库命名**：`厂商_型号_封装`，写数据手册链接和日期，避免下次又找不到。\n\n自己建库的三条红线：\n\n- 不能凭“看起来差不多”画焊盘；QFN/BGA 差 0.2mm 就会偏移。\n- 不能把多个器件的管脚号“约定俗成”地混用；三极管 B/C/E 与 1/2/3 必须按手册。\n- 不能把符号的电源脚全部隐藏；至少要能在原理图上查到供电连接。\n\n### 9.6 测量与仿真：ERC、网表、前仿真\n\n#### 9.6.1 ERC 检查\n\n1. 运行 ERC。\n2. 看三类错误：悬空管脚、输出冲突、电源/地短路。\n3. 悬空管脚：要么接网络，要么标记“不连接”（No Connect）。\n4. 输出冲突：两个输出直接并联，必须加电阻/二极管隔离。\n5. 电源短路：`+5V` 与 `GND` 同名或误连，必须改网络名。\n\n#### 9.6.2 网表核对\n\n导出网表后，搜 `R1`，确认：\n- `R1-1` 接 `SIG_IN`；\n- `R1-2` 接 `ADC_IN`；\n- `C1-1` 与 `R1-2` 同网络；\n- `C1-2` 接 `GND`。\n\n#### 9.6.3 前仿真：RC 低通与分压\n\n```circuitjs\nrc-lowpass-159\n```\n\n观察：输入方波，输出被“磨圆”；频率越高，输出幅度越小。前仿真只验证拓扑，不验证 PCB 布局。\n\n```circuitjs\nvoltdivide\n```\n\n把 12V/10k/3.3k 填进去，观察分压点电压和电流。再改 R2，看输出怎么变；这一步比在纸上算更能建立“分压比—负载—功耗”的直觉。\n\n#### 9.6
