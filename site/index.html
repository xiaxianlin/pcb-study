- [ ] 能检查 LICENSE/BOM/Gerber/库。\n- [ ] 能提取可复用块并重算参数。\n- [ ] 能列风险点。\n- [ ] 能写解读笔记。\n\n#### 22.8.5 下一章\n\n下一章是阶段复盘：**设计评审**。把阶段三做过的板子拿出来，按评审清单逐项过。","taskSignature":"74d49baec638e91b0fed0fa931b9590a01cf0f06f63f8cb15ff4c7885ed22060","taskCount":5},{"id":"23","title":"第 23 章 · 阶段复盘与设计评审","short":"阶段复盘与设计评审","stage":3,"diff":2,"prev":"第 17～22 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用一张评审清单覆盖原理图、PCB、BOM、测试四类问题。\n2. 组织一次 30～60 分钟的设计评审，并记录结论。\n3. 区分“必须改”“建议改”“接受风险”三级问题。\n4. 用 FMEA/风险矩阵给问题排优先级。\n5. 把评审结论转成改版任务和验证计划。\n6. 复盘阶段三的学习成果，找出下一个短板。\n7. 说出至少 8 个评审常见坑。\n\n设计评审不是“挑毛病大会”，是“在投板前用别人的眼睛找自己的盲区”。评审记录比评审本身更重要。\n\n## 正文\n\n### 23.1 它解决什么问题：三个真实场景\n\n#### 场景一：评审只看了原理图，PCB 封装错了\n\n评审会上大家对着原理图讨论，没人打开 PCB 看封装。投板后发现 USB 座封装反了。评审要覆盖“图—板—料—测”四块。\n\n#### 场景二：问题记了一堆，没人闭环\n\n评审记录写了 20 条，改版时只改了 5 条，剩下的又带到下一版。每条问题要有责任人/截止/验证方式。\n\n#### 场景三：评审变成“领导拍板”\n\n没有清单，靠个人经验，漏掉电源余量/ESD/测试点。评审要有固定清单和分级。\n\n#### 23.1.1 场景一展开：评审只看了原理图\n\n很多团队的“评审”实际只做了一件事：把原理图投到屏幕上，从第一页翻到最后一页，问“这里对不对”“这个电容干嘛的”。看起来每个网络都看过了，但没有人把封装、焊盘、丝印、BOM 和结构放在一起核对。结果打样回来，芯片是 QFN 封装，原理图符号却按 LQFP 画的，引脚编号整体错位；或者连接器选了卧式，结构图要求立式，装不进外壳。这类问题在原理图阶段“看不出来”，因为原理图只表达电气连接，不表达物理尺寸。真正的评审必须把“图纸—封装—实物—结构”四条线并在一起看：原理图每个器件是否有对应封装、封装焊盘与器件手册是否一致、1 脚方向与丝印是否一致、连接器高度与外壳是否干涉、BOM 里的型号是否能买到。只翻原理图的评审，通过率很高，但打样返工率也很高；它不是评审，是“集体看了一遍图”。\n\n**怎么改**：评审材料里必须包含“封装核对表”和“1:1 打印图”；每个连接器、每个极性器件、每个非常规封装都要单独列一行，写清“手册页码/焊盘尺寸/1 脚方向/装配高度”。评审时随机抽 5 个器件，让设计者当场翻手册核对；抽到错的，说明自查没做，整批退回重查。这个动作很“笨”，但能拦住大部分“封装错、方向错、装不上”的问题。\n\n#### 23.1.2 场景二展开：问题记了一堆，没人闭环\n\n另一种常见情况：评审开了三小时，白板上写满问题，大家拍照、鼓掌、散会。两周后打样回来，同样的问题还在；问“上次那个 RS485 终端加了吗”，回答“太忙了，忘了”。问题不是“没发现”，而是“发现了没人跟”。根因通常有三个：没有责任人（写“硬件组”等于没人）、没有期限（写“尽快”等于无限期）、没有验证（改没改、改对没改，没人确认）。于是问题表变成“许愿池”，每次评审重新捞一遍，团队逐渐不相信评审有用，下一次就真的走过场了。\n\n**怎么改**：问题表只允许“具体人+具体日期+可验证结果”三列同时存在，缺一列就不算记录；每周固定 15 分钟过表，延期要说明原因和新日期；关闭必须有证据（复测数据、波形、照片、Gerber 截图），不能口头说“改好了”。主持人下次评审的第一页，就是上次问题表的关闭情况；没关闭的，先处理再开新评审。这样问题表才是“账本”，不是“备忘录”。\n\n#### 23.1.3 场景三展开：评审变成“领导拍板”\n\n还有一类评审，技术讨论还没开始，领导先说“我看这个方案可以，就这样吧”。后面的人要么附和，要么沉默；不同的意见被解读为“不配合”。评审结论变成了“领导意志”，风险没有被真正讨论。更糟的是，一旦后面出问题，没人敢说是“当时提过但被压下去”的，复盘也复不出真因。\n\n**怎么改**：把“技术结论”和“资源决策”分开。技术评审由主持人按清单问，评审人只对“事实/风险/证据”负责；领导最后听结论，做“资源/进度”决策，不提前定调。会议开始前明确“今天先不谈进度，只谈风险”；记录员把“谁提出了什么风险、是否被接受”写进纪要。这样即使决策者选择“接受风险”，也是“有记录的接受”，而不是“没人知道的风险”。评审的价值不是“统一思想”，是“把风险摆到桌面上”。\n### 23.2 它是什么：四块清单 + 三级结论\n\n四块：\n\n1. **原理图**：电源、复位、时钟、接口、保护、ERC。\n2. **PCB**：布局、地、差分、晶振、电源、DRC、丝印。\n3. **BOM/生产**：封装、替代料、钢网、坐标、测试点。\n4. **测试**：Bring-Up、功能、环境、可靠性。\n\n三级结论：\n\n- **P0 必须改**：会导致不工作/损坏/无法生产。\n- **P1 建议改**：影响可靠性/成本/可维护性。\n- **P2 接受风险**：记录原因，下一版再改。\n\n> **术语第一次出现**：风险矩阵（risk matrix）用“严重度×发生概率”给问题分级，决定先改什么。\n\n#### 23.2.5 需求清单：逐项写法\n\n| 项 | 要写清 | 验收方式 |\n|---|---|---|\n| 输入电源 | 电压范围/电流/接口 | 可调电源实测 |\n| 输出 | 路数/电压/电流/纹波 | 电子负载+示波器 |\n| 主控 | 型号/主频/存储 | 读 ID/跑程序 |\n| 通信 | 协议/速率/节点数 | 收发/误码统计 |\n| 人机 | 按键/指示/显示 | 逐项操作 |\n| 环境 | 温度/湿度/防护 | 温箱/喷淋 |\n| 结构 | 尺寸/安装/接口位置 | 卡尺/3D |\n| 成本 | BOM 目标/打样预算 | 询价对比 |\n| 时间 | 打样/小批/量产 | 里程碑 |\n| 认证 | CE/FCC/CCC/UL | 送检计划 |\n\n**写法**：每条都要“数值+条件+验收人”；写不出数值，说明需求还没定。\n\n**边界**：明确“不做什么”，比如不做无线、不做外壳，防止后期加需求。\n\n**变更**：需求变更要记录影响（成本/进度/重评）。\n\n#### 23.2.6 设计清单：逐项写法\n\n| 项 | 自查问题 | 证据 |\n|---|---|---|\n| 电源树 | 每路来源/负载/余量 | 预算表 |\n| 去耦 | 每个电源脚有电容 | 原理图截图 |\n| 复位 | 上电/按键/看门狗 | 波形 |\n| 时钟 | 晶振/负载电容/频偏 | 波形/说明 |\n| 接口 | 电平/终端/ESD | 图+计算 |\n| 保护 | 反接/过压/过流 | 图+选型 |\n| 热 | 功耗/温升/散热 | 计算/实测 |\n| PCB | 层叠/线宽/地 | 叠层+DRC |\n| 结构 | 板框/高度/连接器 | 3D/1:1 |\n| 测试 | 测试点/调试口 | 图 |\n\n**用法**：每条都要有“证据”；没有证据的“已检查”不算。\n\n**优先级**：电源/时钟/复位/接口是“板子活不活”的四根柱子。\n\n#### 23.2.7 测试清单：逐项写法\n\n| 项 | 条件 | 判据 | 样本 |\n|---|---|---|---|\n| 上电电流 | 空载/满载 | 在预算内 | 全检 |\n| 电源纹波 | 20MHz 带宽 | <规格 | 3 块 |\n| 复位时序 | 上电/掉电 | 脉宽/电平 | 3 块 |\n| 通信 | 最坏负载 | 误码率 | 3 块 |\n| 高低温 | -40/+85℃ | 功能正常 | 3 块 |\n| 温循 | 5～20 次 | 无虚焊 | 3 块 |\n| 振动 | 扫频/随机 | 无松动 | 3 块 |\n| ESD | ±4/±8kV | 不死机 | 3 块 |\n| 老化 | 24～168h | 无早期失效 | 5 块 |\n\n**写法**：判据必须是数字/波形/现象；不能写“正常”。\n\n**记录**：实测值/照片/波形；与判据一一对应。\n\n#### 23.2.8 生产清单：逐项写法\n\n| 项 | 检查 | 责任 |\n|---|---|---|\n| BOM | 型号/封装/位号/替代 | 硬件 |\n| Gerber | 层数/线宽/阻焊/字符 | 硬件 |\n| 钻孔 | 孔径/槽孔/过孔 | 硬件 |\n| 坐标 | 原点/旋转/镜像 | 硬件 |\n| 钢网 | 厚度/开孔/拼板 | 工艺 |\n| 拼板 | 间距/工艺边/Mark | 工艺 |\n| 测试 | 测试点/治具/FCT | 测试 |\n| 首件 | 核对/签字/封样 | 质量 |\n| 包装 | 静电/缓冲/标签 | 生产 |\n\n**顺序**：BOM→Gerber→钻孔→坐标→钢网→拼板；任何一项改动都要重出。\n\n**课程**：生产清单是“给工厂看的”，不是“给自己看的”。\n\n#### 23.2.9 四块清单的使用顺序\n\n评审不是四块一起上，而是有顺序：先需求，再设计，再测试，最后生产。顺序错了会浪费很多时间——需求还没定清楚就讨论 PCB 线宽，等于在流沙上盖房子；测试判据还没写就讨论生产测试点，最后一定返工。正确顺序是：先确认“要做对什么”（需求），再确认“怎么做”（设计），再确认“怎么证明做对了”（测试），最后确认“怎么造出来”（生产）。每一块内部也有顺序：需求先电源/接口/环境，设计先电源/时钟/复位/接口，测试先功能/电源/信号，生产先 BOM/Gerber/坐标。按顺序过，前面的结论能直接约束后面，评审效率最高。\n\n**反例**：一上来就讨论丝印字体、外壳颜色，花了半小时，电源余量却没算。这种评审“很热闹”，但关键风险没碰。\n\n#### 23.2.10 清单怎么维护才不过时\n\n清单不是写完就锁进抽屉。每次评审发现的新问题，如果属于“下次还会犯”，就应在 24 小时内变成清单的一条；如果是“这个项目特有”，就记在项目风险表，不进通用清单。清单每季度清理一次：合并重复项、删掉已经不可能发生的、把“建议”升级成“必须”。清单条目要写“检查动作”，不要写“注意电源”——前者可执行，后者是口号。一个团队如果半年后清单还是最初那 30 条，说明要么没评审，要么没人总结；真正用起来的清单，一定在长胖和瘦身之间反复。\n\n**做法**：给每条清单加“来源”（哪次评审/哪个客诉），评审时看到同类问题能追溯；新条目先试用两次，再决定是否固化。\n### 23.3 关键检查项\n\n| 类别 | 检查项 | 判据 |\n|---|---|---|\n| 电源 | 余量/散热/去耦 | 峰值×1.3 |\n| 复位 | RC/按键/BOOT | 按手册 |\n| 时钟 | 晶振/负载电容/包地 | 起振 |\n| 接口 | ESD/差分/终端 | 协议 |\n| PCB | 地/跨分割/DRC | 清零 |\n| BOM | 封装/替代料 | 可采购 |\n| 测试 | 测试点/文档 | 可复现 |\n\n#### 23.3.5 逐章复盘：第 17～22 章要看什么\n\n**17 单片机基础**：GPIO 推挽/开漏、上拉/下拉、ADC 采样时间与源阻抗、定时器/PWM、中断/DMA、外设保护。评审时问“按键有没有消抖/上拉多大/ADC 源阻抗多少”。\n\n**18 STM32 最小系统**：电源域/去耦、BOOT0、复位、晶振负载电容、SWD、USB、上电时序。评审时问“BOOT0 上电时是什么电平/晶振负载电容选了多少”。\n\n**19 2 层板实战**：叠层/线宽/过孔/地/差分/扇出/丝印/DRC/Gerber。评审时看“地是否连续、电源线够不够宽、Gerber 逐层对不对”。\n\n**20 Bring-Up**：静态检查、限流上电、电流预算、故障树、上电时序、记录表。评审时问“首板有没有限流/有没有记录/异常怎么定位”。\n\n**21 测试与可靠性**：测试计划/判据、温循/振动/EMC/老化、降额、失效分析、报告。评审时问“判据是数字吗/样本几块/失效闭环了吗”。\n\n**22 开源工程**：Arduino Uno R3 / OrangePi Zero H3 / CM4IO / BeagleBone Black 的电源/接口/布局可借鉴点。评审时问“我们的方案和参考设计差在哪”。\n\n**用法**：逐章复盘不是“再讲一遍”，是“拿这一章的问题清单去问当前项目”。\n\n#### 23.3.6 项目复盘：2 层控制板的评审实录\n\n**背景**：12V 输入、5V/3.3V、STM32、继电器、RS485、按键/指示灯，2 层板 100×80mm。\n\n**评审发现 1**：继电器线圈与 MCU 共地，但没有续流二极管靠近线圈；结论“有条件通过”，要求加 SS34 并挪到连接器旁。\n\n**发现 2**：RS485 终端电阻只在主站侧，从站没留；要求加跳线/焊盘可选。\n\n**发现 3**：3.3V LDO 输入 5V、输出 200mA，功耗 (5-3.3)×0.2=0.34W，SOT-23 温升偏高；改成 SOT-89 并加铜。\n\n**发现 4**：Type-C 只有 CC1/CC2 下拉，没有 ESD；加 TVS 阵列。\n\n**发现 5**：测试点只有电源，没有复位/时钟/SWD；补 4 个测试点。\n\n**结论**：Conditional；5 项闭环后打样；责任人/3 天。\n\n**课程**：真实评审的价值，是“在打样前发现这 5 条”。\n\n#### 23.3.7 评审现场怎么走\n\n**动线一：按页走**。适合原理图，逐页看，每页问“这页做什么/电源从哪来/信号去哪/有没有保护”。\n\n**动线二：按信号链走**。从输入连接器→保护→滤波→转换→主控→输出→负载，沿一条链看，容易发现“中间断点/电平不匹配”。\n\n**动线三：按电源树走**。从输入→DCDC/LDO→各电源域→负载，看每路电流/余量/去耦/上电时序。\n\n**动线四：按最坏情况走**。最高温/最低压/最大负载/最差线缆，问“这时还成不成”。\n\n**用法**：一场评审选 1～2 条动线，不要“想到哪看到哪”。动线走完，再回到清单补漏。\n\n#### 23.3.8 问题的四种类型\n\n**事实型**：“这个电容没接”“这个网络名拼错”——直接改，不需要讨论。\n\n**风险型**：“这个 LDO 功耗可能超”“这个地可能跨分割”——要算/要测，给结论。\n\n**取舍型**：“加 TVS 成本上升”“四层板贵 30%”——要决策者拍板，记录接受人。\n\n**未知型**：“这个器件高温下参数不知道”——要查手册/做实验，给期限。\n\n**处理**：事实型当场改；风险型给数据；取舍型记录决策；未知型转任务。把四类混在一起讨论，会议一定低效。\n\n#### 23.3.9 评审的边界：哪些不该在会上解决\n\n评审不是“所有问题的解决方案现场”。三类问题不该在评审会上展开：一是需要长时间计算/仿真的（如环路稳定性、SI 仿真），应会后给结论；二是需要实验验证的（如温升、EMC），应列任务；三是纯资源/进度决策（加不加人、延不延期），应由决策者另开。评审会只做三件事：确认事实、评估风险、定结论/责任人。把技术计算和资源博弈塞进评审，会议一定超时，而且结论质量差。\n\n**判断**：如果一个问题 10 分钟内无法用现有数据说清，就转任务；如果它影响 Go/No-Go，就定“关闭条件”，而不是现场猜答案。\n### 23.4 三个典型评审工具\n\n#### 23.4.1 评审流程\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 23-1：设计评审流程<\/text>\n  <rect x=\"30\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"115\" font-size=\"12\" fill=\"currentColor\">提交材料<\/text>\n  <rect x=\"180\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"115\" font-size=\"12\" fill=\"currentColor\">逐项检查<\/text>\n  <rect x=\"330\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"355\" y=\"115\" font-size=\"12\" fill=\"currentColor\">分级记录<\/text>\n  <rect x=\"480\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"115\" font-size=\"12\" fill=\"currentColor\">改版任务<\/text>\n  <rect x=\"630\" y=\"80\" width=\"70\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"645\" y=\"115\" font-size=\"12\" fill=\"currentColor\">验证<\/text>\n  <line x1=\"150\" y1=\"110\" x2=\"180\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"300\" y1=\"110\" x2=\"330\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"450\" y1=\"110\" x2=\"480\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"600\" y1=\"110\" x2=\"630\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"30\" y=\"220\" font-size=\"13\" fill=\"currentColor\">材料：原理图 PDF、PCB、BOM、Gerber、测试记录、已知问题。<\/text>\n<\/svg>\n```\n\n#### 23.4.2 风险矩阵\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 23-2：风险矩阵：严重度×发生概率<\/text>\n  <rect x=\"100\" y=\"60\" width=\"480\" height=\"180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"260\" y1=\"60\" x2=\"260\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"420\" y1=\"60\" x2=\"420\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"100\" y1=\"120\" x2=\"580\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"100\" y1=\"180\" x2=\"580\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"100\" font-size=\"11\" fill=\"currentColor\">高<\/text>\n  <text x=\"40\" y=\"170\" font-size=\"11\" fill=\"currentColor\">中<\/text>\n  <text x=\"40\" y=\"225\" font-size=\"11\" fill=\"currentColor\">低<\/text>\n  <text x=\"150\" y=\"275\" font-size=\"11\" fill=\"currentColor\">低概率<\/text>\n  <text x=\"300\" y=\"275\" font-size=\"11\" fill=\"currentColor\">中概率<\/text>\n  <text x=\"470\" y=\"275\" font-size=\"11\" fill=\"currentColor\">高概率<\/text>\n  <text x=\"130\" y=\"100\" font-size=\"11\" fill=\"currentColor\">P1<\/text>\n  <text x=\"290\" y=\"100\" font-size=\"11\" fill=\"currentColor\">P0<\/text>\n  <text x=\"450\" y=\"100\" font-size=\"11\" fill=\"currentColor\">P0<\/text>\n<\/svg>\n```\n\n#### 23.4.3 问题闭环表\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 23-3：问题闭环表字段<\/text>\n  <rect x=\"40\" y=\"70\" width=\"640\" height=\"150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"40\" y1=\"110\" x2=\"680\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"150\" x2=\"680\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"190\" x2=\"680\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"95\" font-size=\"11\" fill=\"currentColor\">编号<\/text>\n  <text x=\"120\" y=\"95\" font-size=\"11\" fill=\"currentColor\">问题<\/text>\n  <text x=\"280\" y=\"95\" font-size=\"11\" fill=\"currentColor\">等级<\/text>\n  <text x=\"350\" y=\"95\" font-size=\"11\" fill=\"currentColor\">责任<\/text>\n  <text x=\"430\" y=\"95\" font-size=\"11\" fill=\"currentColor\">措施<\/text>\n  <text x=\"540\" y=\"95\" font-size=\"11\" fill=\"currentColor\">验证<\/text>\n  <text x=\"620\" y=\"95\" font-size=\"11\" fill=\"currentColor\">状态<\/text>\n<\/svg>\n```\n\n#### 23.4.4 评审流程的六个环节\n\n**一、自检**：设计者按四块清单自查，把“已知问题”先写出来。自检不是“我觉得没问题”，而是逐条填证据。\n\n**二、材料**：提前 3 天发原理图、PCB、BOM、测试报告、风险表、问题闭环表；材料不全就改期，不要“边讲边找”。\n\n**三、逐项**：按清单过，只花时间在“没过的/有风险的/有争议的”；已经过的项一句话带过。\n\n**四、讨论**：每个问题定性（安全/功能/外观）、影响（成本/进度）、方案（改设计/改工艺/接受）；不跑题、不翻旧账。\n\n**五、结论**：当场给 Go / Conditional / No-Go；Conditional 要写清关闭项、责任人、期限、验证方法。\n\n**六、归档**：记录签字、扫描归档、问题进跟踪表；下次评审先看上次关闭情况。\n\n**时间控制**：1～2 小时；超过就拆成“原理图评审”和“PCB 评审”两场。\n\n**课程**：没有结论的评审，等于没开；没有归档的评审，等于没发生。\n\n#### 23.4.5 风险矩阵：怎么打分才有意义\n\n**严重度 S**：1=无影响，3=功能降级，5=安全/起火/批量报废。\n\n**发生度 O**：1=几乎不可能，3=偶尔，5=大概率（新设计/新工艺/新器件）。\n\n**探测度 D**：1=测试能稳定发现，3=要专门测，5=现有测试发现不了。\n\n**RPN**：`S×O×D`；>100 必须处理，50～100 要有措施，<50 可接受但记录。\n\n**例子**：电源反接无保护（S5/O3/D4=60）；丝印方向错（S2/O3/D2=12）；晶振负载电容错（S3/O4/D4=48）。\n\n**用法**：先处理“高 S”，再看 RPN；安全项不看分数，一票否决。\n\n**课程**：打分是排序工具，不是精确科学；目的是“有限时间花在刀刃上”。\n\n#### 23.4.6 问题闭环表：从记录到关闭\n\n| 字段 | 写法 | 作用 |\n|---|---|---|\n| 编号 | R-001 | 唯一、可引用 |\n| 问题 | 一句话描述现象 | 不写“有问题” |\n| 位置 | 页/位号/网络 | 能定位 |\n| 严重度 | 高/中/低 | 排序 |\n| 责任人 | 具体人 | 不写“大家” |\n| 期限 | 日期 | 可考核 |\n| 措施 | 改什么/怎么改 | 可执行 |\n| 验证 | 怎么证明改好了 | 可判定 |\n| 状态 | 打开/关闭/延期 | 可跟踪 |\n\n**关闭条件**：有验证证据（复测数据/波形/照片），不是“改完了”。\n\n**延期**：要写原因/新期限/风险接受人。\n\n**课程**：闭环表的每一列，都是防止“问题消失”的钉子。\n\n#### 23.4.7 复盘会：怎么开出不伤人的真话\n\n**开场**：主持人先定调“对事不对人，目的是下一块板更好”。\n\n**数据先行**：进度/成本/返修/测试数据摆出来，减少“互相印象”。\n\n**顺序**：先讲“做对的”（可复制），再讲“做错的”（可改进），最后讲“下一步”。\n\n**发言**：每人 3 分钟，不打断；记录员只记事实和决定。\n\n**深挖**：用 5Why，问到“流程/规范”层，不停在“某某粗心”。\n\n**输出**：3 条经验、3 条改进、责任人、时间；下次会议第一项检查。\n\n**课程**：复盘开成追责会，下一次就没人说真话了。\n\n#### 23.4.8 评审提问：二十个“一句话问到点上”\n\n1. 这路电源最坏负载多少？余量多少？\n2. 这个 LDO 功耗多少？封装能散掉吗？\n3. 上电时 BOOT0 是什么电平？\n4. 复位脉宽够不够？掉电时会不会误复位？\n5. 晶振负载电容按多少选的？频偏测过吗？\n6. 这个接口电平匹配吗？共地吗？\n7. ESD 打哪里？TVS 结电容影响信号吗？\n8. RS485 终端/偏置在哪？从站留了吗？\n9. 地去哪了？有没有跨分割？\n10. 电源线多宽？过孔几个？\n11. 差分对等长吗？参考面连续吗？\n12. 这个连接器高度和外壳干涉吗？\n13. 测试点在哪？探针够得着吗？\n14. 最坏温度下参数漂移多少？\n15. 这个器件降额多少？\n16. 失效了怎么定位？有测试点吗？\n17. BOM 有替代料吗？交期多少？\n18. Gerber 逐层看过吗？钻孔对得上吗？\n19. 首件谁签？封样了吗？\n20. 这次评审的问题，谁跟到关闭？\n\n**用法**：不需要全问；按项目风险挑 5～8 个。\n\n#### 23.4.9 评审记录：一页纸模板\n\n**抬头**：项目/版本/阶段/日期/参会。\n\n**结论**：Go / Conditional / No-Go（一句话）。\n\n**条件**：编号/关闭项/责任人/期限（表格）。\n\n**风险**：高/中/低+影响+接受人。\n\n**决定**：改设计/改工艺/接受/加测试。\n\n**签字**：主持人/设计者/决策者。\n\n**附件**：原理图截图/PCB 截图/测试数据。\n\n**课程**：一页纸能说清，才说明评审真的开过。\n\n#### 23.4.10 评审与变更：ECO 怎么走\n\n**触发**：评审问题/测试失效/物料替代/客户需求。\n\n**评估**：影响范围（原理图/PCB/BOM/结构/测试/认证）。\n\n**评审**：高风险变更重新过清单；低风险走简化审批。\n\n**实施**：改图/改版/改工艺；版本号。\n\n**验证**：针对变更项复测；回归相关项。\n\n**归档**：ECO 单/变更记录/验证报告。\n\n**课程**：变更不重评，等于把风险直接放行。\n\n#### 23.4.11 评审工具：边界图与 DFMEA\n\n**边界图**：把系统画成“输入—处理—输出—环境—人”，标出接口和外部依赖。评审时看“每个接口有没有定义/保护/测试”。\n\n**DFMEA**：对每个功能列“失效模式—后果—原因—现行控制—S/O/D—措施”。它比“凭经验挑问题”系统，但费时间；关键子系统（电源/通信/安全）值得做。\n\n**检查表**：把历史问题变成勾选项；最快、最实用。\n\n**用法**：小项目用检查表；复杂/安全相关加边界图+DFMEA；不要为了“显得专业”全上。\n\n#### 23.4.12 评审中的“三不”原则\n\n**不跑题**：问题超出本次范围，记下来另开；不要在现场展开新设计。\n\n**不翻旧账**：只讨论当前版本；历史问题进复盘，不进评审。\n\n**不追责**：评审是找风险，不是找责任人；责任在复盘/绩效环节。\n\n**主持人职责**：有人跑题就拉回；有人被攻击就制止；时间到了就收结论。\n\n**课程**：三不做不到，评审会变成“吵架/聊天/批斗”。\n\n#### 23.4.13 主持人手册：一场评审怎么控\n\n开场先说规则：只讨论当前版本、只对事、每个问题 10 分钟、结论三种。然后按动线走，遇到跑题就说“记下来，会后单独聊”；遇到人身攻击就说“我们回到数据”；遇到“这个以前都这样”就问“以前的失效数据呢”。每到 30 分钟看一次剩余高风险项，必要时砍掉低优先级。最后 10 分钟必须收结论：Go/Conditional/No-Go，条件/人/日期，当场复述一遍让记录员确认。主持人不是“技术最强的人”，而是“让会议产出结论的人”。\n\n**自检**：会后问自己三个问题——高风险项都聊到了吗？每个问题有人跟吗？结论能被执行吗？\n\n#### 23.4.14 五个门禁与评审节点\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 23-4：五个门禁（需求→原理图→PCB→首板→量产）<\/text>\n  <line x1=\"60\" y1=\"110\" x2=\"660\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <circle cx=\"110\" cy=\"110\" r=\"7\" fill=\"currentColor\"/>\n  <circle cx=\"250\" cy=\"110\" r=\"7\" fill=\"currentColor\"/>\n  <circle cx=\"390\" cy=\"110\" r=\"7\" fill=\"currentColor\"/>\n  <circle cx=\"530\" cy=\"110\" r=\"7\" fill=\"currentColor\"/>\n  <circle cx=\"640\" cy=\"110\" r=\"7\" fill=\"currentColor\"/>\n  <text x=\"78\" y=\"90\" font-size=\"11\" fill=\"currentColor\">G1 需求<\/text>\n  <text x=\"218\" y=\"90\" font-size=\"11\" fill=\"currentColor\">G2 原理图<\/text>\n  <text x=\"358\" y=\"90\" font-size=\"11\" fill=\"currentColor\">G3 PCB<\/text>\n  <text x=\"498\" y=\"90\" font-size=\"11\" fill=\"currentColor\">G4 首板<\/text>\n  <text x=\"608\" y=\"90\" font-size=\"11\" fill=\"currentColor\">G5 量产<\/text>\n  <text x=\"78\" y=\"140\" font-size=\"10\" fill=\"currentColor\">验收表<\/text>\n  <text x=\"218\" y=\"140\" font-size=\"10\" fill=\"currentColor\">ERC/封装<\/text>\n  <text x=\"358\" y=\"140\" font-size=\"10\" fill=\"currentColor\">DRC/Gerber<\/text>\n  <text x=\"498\" y=\"140\" font-size=\"10\" fill=\"currentColor\">Bring-Up<\/text>\n  <text x=\"608\" y=\"140\" font-size=\"10\" fill=\"currentColor\">报告/EMC<\/text>\n  <rect x=\"70\" y=\"190\" width=\"580\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <text x=\"90\" y=\"214\" font-size=\"12\" fill=\"currentColor\">不过门禁不进下一阶段；跳门禁要书面批准<\/text>\n  <text x=\"90\" y=\"238\" font-size=\"12\" fill=\"currentColor\">每个门禁：材料提前 3 天、90 分钟、三种结论<\/text>\n  <text x=\"40\" y=\"295\" font-size=\"12\" fill=\"currentColor\">门禁越早，返工越便宜：需求改 1 小时，批量返工 1 个月。<\/text>\n<\/svg>\n```\n\n**读法（见图 23-4）**：G1 决定“做对什么”，G2 决定“画对”，G3 决定“做得出”，G4 决定“活得了”，G5 决定“造得稳”。五个门禁都过，才叫“从设计走到量产”。\n\n#### 23.4.15 问题闭环的五个状态\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 23-5：问题闭环（打开→分派→整改→验证→关闭）<\/text>\n  <rect x=\"50\" y=\"80\" width=\"110\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"78\" y=\"110\" font-size=\"12\" fill=\"currentColor\">打开<\/text>\n  <rect x=\"200\" y=\"80\" width=\"110\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"228\" y=\"110\" font-size=\"12\" fill=\"currentColor\">分派<\/text>\n  <rect x=\"350\" y=\"80\" width=\"110\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"378\" y=\"110\" font-size=\"12\" fill=\"currentColor\">整改<\/text>\n  <rect x=\"500\" y=\"80\" width=\"110\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"528\" y=\"110\" font-size=\"12\" fill=\"currentColor\">验证<\/text>\n  <path d=\"M160 105 L200 105\" stroke=\"currentColor\" stroke-width=\"2\" marker-end=\"url(#a)\"/>\n  <path d=\"M310 105 L350 105\" stroke=\"currentColor\" stroke-width=\"2\" marker-end=\"url(#a)\"/>\n  <path d=\"M460 105 L500 105\" stroke=\"currentColor\" stroke-width=\"2\" marker-end=\"url(#a)\"/>\n  <defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/><\/marker><\/defs>\n  <rect x=\"560\" y=\"170\" width=\"90\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"580\" y=\"195\" font-size=\"12\" fill=\"currentColor\">关闭<\/text>\n  <path d=\"M555 130 L555 190 L560 190\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/>\n  <path d=\"M200 130 L200 210 L350 210\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" fill=\"none\"/>\n  <text x=\"215\" y=\"230\" font-size=\"10\" fill=\"currentColor\">证据不足→退回整改<\/text>\n  <text x=\"40\" y=\"275\" font-size=\"12\" fill=\"currentColor\">每步都要“具体人+日期”；关闭必须有复测/波形/照片。<\/text>\n<\/svg>\n```\n\n**用法（见图 23-5）**：状态只有五个，不要自创“基本完成/待观察”；“关闭”不是“改完”，是“验证通过”。\n### 23.5 选型与降额\n\n评审不是“越严越好”，要按产品定位：\n\n| 产品 | P0 门槛 | 说明 |\n|---|---|---|\n| 学习板 | 能亮/能下载 | 允许飞线 |\n| 小批量产品 | 功能/安规/可生产 | 不能飞线 |\n| 工业/医疗 | 可靠性/认证 | 全项 |\n\n#### 23.5.1 评审门禁：五个节点\n\n**门禁 1（需求→原理图）**：需求清单齐、接口/电源/环境明确、成本/时间可行。不过门禁就画图，后面一定返工。\n\n**门禁 2（原理图→PCB）**：ERC 通过、封装核对、电源预算、时钟/复位/接口/保护自查完。这一关能拦住“封装错/电源不够”。\n\n**门禁 3（PCB→打样）**：DRC/飞线、Gerber 逐层、叠层/线宽/过孔、丝印/极性、拼板/工艺边、测试点。这一关能拦住“板子做出来不能焊/不能测”。\n\n**门禁 4（首板→小批）**：Bring-Up 通过、电流/温升/波形正常、关键功能全过、问题闭环。这一关能拦住“设计缺陷进批量”。\n\n**门禁 5（小批→量产）**：测试报告齐、环境/EMC 过、BOM/替代/交期确认、治具/产能就绪。这一关能拦住“量产翻车”。\n\n**例外**：任何跳门禁都要书面批准，写清风险与补救；不能“口头说没事”。\n\n**课程**：门禁不是流程负担，是把返工成本从“批量”压到“图纸”。\n\n#### 23.5.2 文档与追溯：评审留下什么\n\n**评审记录**：结论/条件/风险/签字；一页纸。\n\n**问题闭环表**：编号/责任人/期限/验证/状态。\n\n**风险表**：S/O/D/RPN/措施/接受人。\n\n**测试报告**：条件/数据/判据/结论。\n\n**变更记录（ECO）**：改什么/为什么/影响/验证。\n\n**归档结构**：项目/阶段/日期/版本；文件名可读。\n\n**追溯链**：需求→设计→测试→问题→变更→验证，任一环能倒查。\n\n**课程**：文档不是给别人看的，是给三个月后的自己看的。\n\n#### 23.5.3 评审失败的六种典型\n\n**走过场**：材料不齐、时间 20 分钟、只签字。后面用返修买单。\n\n**一言堂**：领导先定调，评审人不敢说话；风险被“同意”掩盖。\n\n**只挑刺**：只说过错，不给方案/优先级；设计者进入防御，讨论失效。\n\n**无结论**：讨论两小时，没人拍板；问题悬空。\n\n**无闭环**：问题记了，责任人不明、期限不明；下次评审还在。\n\n**不复盘**：同类问题在不同项目重复；经验没沉淀。\n\n**课程**：评审质量，取决于“敢不敢说不”和“有没有人跟”。\n\n#### 23.5.4 设计规范怎么沉淀\n\n**来源**：评审问题/测试失效/返修案例/客诉。\n\n**形式**：一条条“必须/禁止/推荐”，配图/算例；不要写成论文。\n\n**例子**：“每个电源脚必须有 0.1μF，靠近引脚 ≤2mm”“BOOT0 必须有下拉，禁止悬空”“RS485 从站必须留终端焊盘”。\n\n**评审**：新规范进清单；下次评审逐条对照。\n\n**更新**：每季度/每项目复盘后更新；版本化。\n\n**课程**：规范是“把踩过的坑变成别人的护栏”。\n\n#### 23.5.5 评审 KPI：怎么衡量评审有没有用\n\n**前置指标**：材料齐全率、按时评审率、清单覆盖率。\n\n**过程指标**：问题数/严重度分布、平均时长、结论明确率。\n\n**结果指标**：打样返工率、首板成功率、批量不良率、客诉数。\n\n**滞后指标**：返修成本、项目延期天数。\n\n**用法**：不追求“问题越多越好”，而看“高严重度问题是否前置发现”。\n\n**课程**：评审的最终 KPI 是“少返工”，不是“多开会”。\n\n#### 23.5.6 小团队怎么落地\n\n**一人多角**：设计者不能自评；找同事/朋友交叉看，哪怕只问 10 个问题。\n\n**简化清单**：保留“电源/时钟/复位/接口/保护/生产”六块，其余按项目加。\n\n**时间**：30～60 分钟；线上/线下都行。\n\n**记录**：一页纸+问题表；共享文档。\n\n**节奏**：每个门禁一次；不追求“大而全”。\n\n**课程**：小团队也能评审，关键是“有人敢提反对意见”。\n\n#### 23.5.7 把评审嵌进项目计划\n\n项目计划里如果只有“画图/打样/调试”，没有“评审”，评审就会被挤掉。正确做法是把五个门禁写成里程碑任务，给时间和人力：需求评审 0.5 天、原理图评审 0.5 天、PCB 评审 0.5 天、首板评审 0.5 天、量产评审 0.5 天。每个门禁前留 2～3 天自检/改图，门禁后留 1 天闭环。这样“评审”不是额外负担，而是计划的一部分；延期时先砍功能，不砍门禁。\n\n**排期技巧**：评审放在打样下单前一天，逼着问题在付费前暴露；不要放在“有空的时候”。\n\n#### 23.5.8 评审与供应链的交叉\n\n很多“设计问题”其实是“供应链问题”：BOM 里的器件只有一家有货、交期 12 周、封装是冷门、替代料参数差很多。评审时要请采购/供应链参加，至少提供“交期/替代/价格”三项。关键器件（主控/电源/连接器/晶振）要确认“有替代、能买到、不是停产料”。否则设计通过、生产卡住，项目照样延期。\n\n**检查**：BOM 每行是否有“替代料/交期/停产状态”；关键器件是否只此一家。\n\n#### 23.5.9 被评审者的心态：把评审当“免费外脑”\n\n设计者最容易把评审当成“挑错/否定”，于是提前防御、会上解释、会后抱怨。换个视角：评审是几个有经验的人免费帮你找问题，而且是在打样付费之前。被问到答不上来，不是丢脸，是“提前暴露知识缺口”；被指出错误，不是否定你，是否定“这个设计里的某个选择”。好的被评审者会提前列“我自己担心的三个点”，主动请人重点看；会把“我不知道”说出来，而不是编一个理由；会把问题记下来，而不是当场争输赢。\n\n**做法**：评审前写一页“已知风险/待定项”，会上先讲；评审后把问题按 A/B/C 排序，先改 A 级。\n### 23.6 测量与仿真\n\n#### 23.6.1 评审记录模板（完整版）\n\n| 字段 | 填写要求 | 示例 |\n|---|---|---|\n| 项目/版本 | 名称+版本号+阶段 | 控制板 V1.2 / 原理图评审 |\n| 时间/地点 | 日期+会议形式 | 11-12 / 会议室 |\n| 参会 | 角色+姓名 | 主持/设计/工艺/测试 |\n| 材料 | 已发材料清单 | 原理图/PCB/BOM/测试 |\n| 结论 | Go/Conditional/No-Go | Conditional |\n| 条件 | 关闭项/责任人/期限 | R-01 张/11-15 |\n| 高风险 | 安全/认证/核心功能 | 电源反接 |\n| 签字 | 主持/决策 | 两人 |\n\n**写法**：结论一句话；条件可验证；风险有接受人。\n\n**归档**：按项目/阶段/版本命名；共享盘+Git 双备份。\n\n#### 23.6.2 复盘会议模板\n\n**会前**：发数据（进度/成本/测试/问题）；定议程；定时间盒。\n\n**会中**：目标回顾（5 分钟）→结果对比（15 分钟）→差距原因（20 分钟）→改进项（15 分钟）→责任/时间（5 分钟）。\n\n**会尾**：复述 3 条改进；确认下次检查时间。\n\n**会后**：纪要 24 小时内发出；改进项进任务表。\n\n**课程**：没有纪要的复盘，一周后就忘了。\n\n#### 23.6.3 评审问题的分级处理\n\n**A 级（安全/合规/核心功能）**：必须关闭才能 Go；不接受“下次改”。\n\n**B 级（性能/可靠性/可生产性）**：Conditional；限期关闭；影响出货要评估。\n\n**C 级（外观/丝印/文档）**：可接受/批量前改；记录。\n\n**处理原则**：A 级一票否决；B 级看风险；C 级别浪费会议时间。\n\n**课程**：分级不是“降低标准”，是“把注意力放在对的地方”。\n\n#### 23.6.4 评审后的验证与关闭\n\n**验证方式**：复测数据/波形/照片/第三方报告。\n\n**验证人**：提问题的人或指定人；不能自己改自己验。\n\n**关闭**：证据附在问题表；状态改“关闭”。\n\n**复盘**：关闭后回看“这个问题的根因是什么/规范要不要改”。\n\n**课程**：关闭不是“改完”，是“证明改好了”。\n\n#### 23.6.5 评审数据怎么统计\n\n每次评审记录：问题数、A/B/C 分布、关闭率、平均关闭天数、返工次数。按月/项目汇总，看趋势：A 级问题是否下降、关闭天数是否缩短、同类问题是否重复。数据不是为了考核个人，而是为了找“系统性弱点”：如果“封装错”反复出现，说明自查表/封装库有问题；如果“闭环慢”，说明责任/跟踪机制有问题。\n\n**呈现**：一页图（问题数趋势+A 级占比+关闭天数），比十页文字更有说服力。\n\n#### 23.6.6 复盘报告模板\n\n**一页结构**：目标 vs 实际（进度/成本/质量）→ 做对的 3 条 → 做错的 3 条 → 根因（5Why）→ 改进项（责任人/时间）→ 需要支持。\n\n**写法**：每条结论配数据/事实；不写“大家都很努力”；改进项要可执行、可检查。\n\n**归档**：项目文档；下次复盘先看上次改进是否落地。\n\n**课程**：复盘报告不是“总结”，是“下一阶段的输入”。\n\n#### 23.6.7 会议纪要怎么写才有人看\n\n**标题**：项目+阶段+日期。\n\n**三段**：结论（Go/Conditional/No-Go）、条件（谁/何时/做什么）、风险（什么/影响/谁接受）。\n\n**附件**：问题表/截图/数据。\n\n**长度**：一页；重点加粗；不用流水账。\n\n**发送**：24 小时内；抄送参会人+决策者。\n\n**课程**：纪要是“执行依据”，不是“会议记录”。\n\n#### 23.6.9 评审问题库：电源与时钟（20 问）\n\n1. 输入电源范围写了吗？反接/欠压/过压各是什么行为？——没写范围，后面选型全靠猜。\n2. 每路电源的负载清单和电流预算在哪？最坏情况是多少？——预算缺失是“上电就掉压”的头号原因。\n3. Buck/LDO 的输入电容是多少、离引脚多远？——输入电容不够/太远，瞬态直接塌。\n4. 电感饱和电流是否大于最大峰值？——饱和后电流飙升、芯片炸。\n5. LDO 功耗算了吗？封装热阻多少、温升多少？——SOT-23 扛 0.5W 以上要警惕。\n6. 每路电源有没有使能/上电时序？谁先谁后？——时序错会锁死/倒灌。\n7. 电源好（PG）信号接了吗？复位是否等电源稳定？——PG 悬空会导致“时好时坏”。\n8. 去耦电容每个电源脚都有吗？容值/位置是否合理？——0.1μF 要贴近引脚。\n9. 模拟/数字电源是否分开？磁珠/0Ω 位置对吗？——混在一起噪声大。\n10. 电源测试点有没有？能不能测到每路电压？——没有测试点，调试靠猜。\n11. 晶振是无源还是有源？负载电容按多少算？——负载电容错会频偏/不起振。\n12. 晶振下面是否避开走线/铺铜？——干扰/寄生电容。\n13. 时钟输出走线多长？有没有串阻/端接？——长线振铃。\n14. 复位电路是 RC 还是专用芯片？阈值/脉宽多少？——RC 在低温/慢上电会失效。\n15. 复位按键会误触发吗？有没有滤波/ESD？——静电通过按键进芯片。\n16. BOOT0/BOOT1 上电时是什么电平？有下拉吗？——悬空会进错启动模式。\n17. 看门狗喂狗在哪个任务？卡死时能复位吗？——喂狗放在中断里等于没喂。\n18. 调试口（SWD/JTAG）留了吗？会不会被外壳挡？——量产返修要靠它。\n19. 时钟/复位有没有测试点？——波形看不到，问题定位不了。\n20. 低功耗时时钟/电源怎么切？唤醒源是什么？——休眠漏电/唤不醒。\n\n#### 23.6.10 评审问题库：接口与保护（20 问）\n\n21. 每个接口的电平标准写了吗？3.3V/5V/RS232/RS485 是否混？——电平不匹配会烧。\n22. 接口连接器定义（针序/方向）在哪？和线缆一致吗？——针序错会反接。\n23. 有没有串阻/端接/共模电感？位置对吗？——端接位置错等于没接。\n24. ESD 器件选了吗？结电容会不会影响信号？——高速线上大电容会“削”信号。\n25. TVS 的钳位电压是否低于被保护器件耐压？——钳位太高等于没保护。\n26. 浪涌/EFT 有没有考虑？保险丝/压敏电阻选型对吗？——工业场景常见。\n27. 反接保护是二极管/MOS/理想二极管？压降/功耗多少？——二极管压降可能让后级欠压。\n28. 过流保护是自恢复/一次性？动作电流多少？——选大了不起作用。\n29. 接口地是怎么处理的？是否与主板地直连？——共地环路/浮地问题。\n30. 隔离接口的隔离电源/隔离器选了吗？爬电距离够吗？——安规距离。\n31. RS485 终端电阻/偏置电阻在哪？从站留了吗？——长线丢包。\n32. CAN 终端 120Ω 怎么配？节点数多少？——终端多了/少了都通不了。\n33. I2C 上拉多大？总线电容多少？——上拉过大上升沿慢。\n34. USB CC/DP/DM 保护/串阻有吗？——静电/短路。\n35. 网口变压器/ESD/终端电阻齐吗？——雷击/浪涌。\n36. 天线/射频接口阻抗控制了吗？——50Ω 不是画得好看就行。\n37. 连接器电流余量多少？端子压接方式？——大电流发热。\n38. 线缆最长多少？信号速率/衰减够吗？——长线需要驱动/均衡。\n39. 接口测试点/环回测试怎么接？——产测需要。\n40. 接口不用时怎么处理（悬空/接地/配置）？——悬空输入会乱跳。\n\n#### 23.6.11 评审问题库：PCB 与生产（20 问）\n\n41. 板框/定位孔/连接器位置和结构图一致吗？——1:1 打印核对。\n42. 叠层顺序/铜厚/阻抗写进 Gerber 说明了吗？——板厂按默认做会偏。\n43. 电源线宽按电流算了吗？过孔数量够吗？——2A 至少 22mil/1oz。\n44. 地去哪了？有没有跨分割？回流路径连续吗？——EMC/信号完整性根子。\n45. 晶振/差分/高速线参考面完整吗？——跨分割会辐射/误码。\n46. 差分对等长/等距/终端对吗？——USB/HDMI/网口。\n47. 丝印 1 脚/极性/方向清楚吗？会不会压焊盘？——装配错。\n48. 每个器件都有封装且核对过吗？——封装错是打样返工第一原因。\n49. DRC/飞线清零了吗？未连接引脚怎么处理？——NC 要明确。\n50. Gerber 逐层看过吗？阻焊/字符/钻孔对得上吗？——少一层就废。\n51. 拼板方式/工艺边/Mark 点定了吗？——贴片机识别。\n52. 钢网厚度/开孔按器件间距定了吗？——QFN/细间距。\n53. 测试点直径/间距/位置够探针吗？——治具做不了。\n54. 首件怎么测？AOI/X-Ray 覆盖哪些？——批量一致性。\n55. BOM 有替代料/交期/停产状态吗？——缺料停线。\n56. 极性器件（二极管/钽电容/LED）方向核对了吗？——装反炸。\n57. 螺丝孔/接地焊盘/屏蔽罩位置对吗？——装配/EMC。\n58. 板边器件离边够吗？V-CUT/铣槽影响吗？——分板应力。\n59. 包装/静电防护/标签定了吗？——运输损坏。\n60. 生产文件版本和图纸版本一致吗？——做错版本。\n\n#### 23.6.12 复盘的时间线法\n\n把项目从启动到结束画成一条时间线，标出关键节点（需求定稿/原理图/打样/首板/小批/量产）和每个节点发生的“意外”。然后逐个意外问：它是在哪个节点被发现的？如果早一个节点发现，成本差多少？为什么没早发现（没清单/没评审/没测试/没人）？这样复盘不靠记忆，而靠“事件—节点—成本”的结构。时间线法特别适合跨月项目，因为人对“哪一周发生了什么”记忆模糊，但对“打样回来那天发现什么”记得很清楚。\n\n**输出**：一张时间线图+3 个“本可更早发现”的点+对应改进。\n\n#### 23.6.13 5Why 的正确用法\n\n5Why 不是“问五次为什么”，而是“沿着因果链问到可控的层面”。比如“板子烧了”→为什么？“MOS 短路”→为什么？“栅极过压”→为什么？“驱动电阻太小/米勒电容耦合”→为什么？“原理图沿用旧设计没核算”→为什么？“没有器件级评审清单”。问到“清单/流程”层，改进才是可复制的；停在“某人粗心”，改进只能是“下次注意”，等于没改。每问一层要有证据（波形/手册/记录），否则就是编故事。问到自己能改变的那一层就停，不必问到最后“宇宙为什么”。\n\n**模板**：现象→直接原因→设计原因→流程原因→改进项（可执行）。\n\n#### 23.6.14 仿真二：复位 RC 的延时与判据\n\n评审常问“复位脉宽够不够”。用一个 RC 复位做仿真：10kΩ+100nF，时间常数 τ=1ms，从 0 到阈值约 0.7τ≈0.7ms；如果 MCU 要求复位低电平 ≥1μs 且电源上升 10ms，这个 RC 在电源慢上电时可能“复位跟着电源爬”，并不产生干净的低脉冲。仿真里把电源改成斜坡，观察复位脚波形，就能看出“RC 复位在慢上电下不可靠”，从而在评审里要求改专用复位芯片。\n\n```circuitjs\nrc-charge\n```\n\n**判据**：复位低电平持续时间、阈值电压、释放点是否在电源稳定之后；三者任一不满足，就是 A/B 级问题。\n\n**课程**：仿真不是为了“好看”，是为了在评审桌上拿出波形，而不是“我觉得”。\n#### 23.6.15 仿真一：用低通看“判据”的意义\n\n评审里常说“这个电源纹波可以接受”，但“可以接受”不是判据。用 RC 低通（1kΩ+1μF，fc≈159Hz）做一次仿真：输入方波/噪声，观察输出衰减。它说明两件事：一是“滤波”只在特定频段有效，超过 fc 的噪声才能被压；二是“判据”必须写频段/幅度，否则“看起来干净”不等于“在 20MHz 带宽下纹波达标”。评审时把仿真波形和实测波形放在一起，讨论才有共同语言。\n\n```circuitjs\nrc-lowpass-159\n```\n\n**判据写法**：频段（DC～20MHz）、幅度（峰峰值）、条件（满载/最坏输入）、样本（3 块）。\n\n**课程**：仿真不能替代实测，但能让评审从“感觉”变成“看曲线”。\n\n### 23.7 常见坑\n\n1. **只看原理图不看 PCB**：封装/布局漏。\n2. **没有清单**：靠记忆漏项。\n3. **问题不分级**：P0 和 P2 混一起。\n4. **不写责任/验证**：改了没确认。\n5. **评审太晚**：投板前才看。\n6. **只挑错不给方案**：无法闭环。\n7. **忽略 BOM/测试点**：生产/调试出问题。\n8. **评审记录不归档**：下一版重犯。\n\n#### 23.7.7 评审案例库（一）：电源与复位\n\n**案例 1：输入电容离 LDO 太远。** 某板 12V 转 5V 再转 3.3V，3.3V LDO 输入电容放在板子另一头，中间走线 15mm。空载正常，一接无线模块就掉到 2.9V。评审时如果量一下“电容到引脚距离”，10 秒就能发现。规则：输入/输出电容离引脚 ≤5mm，地就近打孔。\n\n**案例 2：LDO 功耗没算。** 5V 转 3.3V、负载 300mA，功耗 (5-3.3)×0.3≈0.51W；SOT-23 热阻约 250℃/W，温升超过 100℃。评审时算一下就会改成 SOT-89/加铜/换 Buck。规则：LDO 功耗 >0.3W 必须算热阻。\n\n**案例 3：复位 RC 在慢上电时失效。** 某板用 10k+100nF 复位，电源上升时间 50ms，复位脚跟着电源慢慢爬，MCU 进入不确定状态。评审时问“电源上升时间多少/复位芯片阈值多少”，就能发现。规则：慢上电/宽温用专用复位芯片。\n\n**案例 4：BOOT0 悬空。** 某 STM32 板 BOOT0 只画了测试点，没下拉；上电偶尔进 Bootloader，表现为“有时不跑程序”。评审时问“BOOT0 上电电平”，并要求 10k 下拉。规则：BOOT0 禁止悬空。\n\n**案例 5：电源时序倒灌。** 某板 3.3V 先上、1.8V 后上，1.8V 器件 IO 通过上拉电阻给 3.3V 域“倒灌”，出现锁死。评审时看“每路使能/时序/隔离”，加时序控制或理想二极管。规则：多电源域必须写时序。\n\n**案例 6：PG 悬空。** 某板 DC-DC 的 PG 没接，MCU 复位释放靠 RC；电源还没稳，MCU 先跑，偶发不启动。评审时问“复位是否等 PG”，把 PG 接到复位延时。规则：PG 要么用，要么明确 NC。\n\n#### 23.7.8 评审案例库（二）：接口与保护\n\n**案例 7：RS485 从站没终端。** 主站有 120Ω，从站没有；短线上没问题，拉到 30m 就丢包。评审时看“每个节点终端/偏置”，从站留焊盘可选。规则：终端按总线两端配置，偏置只在一处。\n\n**案例 8：TVS 结电容太大。** 某 USB 2.0 线上用大结电容 TVS，眼图闭合、识别不稳。评审时问“结电容多少/速率多少”，换低电容型号。规则：高速线 TVS 结电容 <1pF 量级。\n\n**案例 9：ESD 只打电源。** 某产品接口能过 ±4kV 接触，但空气放电打外壳缝隙时死机；原因是信号线没防护/地不连续。评审时看“ESD 打哪里/地怎么走”，补 TVS/地缝合。规则：ESD 要按“最可能打到的位置”设计。\n\n**案例 10：反接二极管压降。** 12V 输入用二极管防反，压降 0.7V，后级 Buck 输入最低 10.5V，接近欠压点；冷启动时掉压复位。评审时算“最坏压降+欠压阈值”，改 MOS 理想二极管。规则：防反器件压降要进最坏计算。\n\n**案例 11：I2C 上拉过大。** 4.7k 上拉、总线电容 300pF，上升时间约 1.4μs，快速模式 400kHz 下勉强；再加两个从站就出错。评审时算 `t_r≈0.8RC`，改 2.2k/减小电容。规则：上拉按速率/电容算，不抄默认。\n\n**案例 12：连接器针序反。** 原理图按“1 脚方焊盘”画，实物连接器 1 脚在另一端；线缆做出来电源接反。评审时看“连接器手册针序+实物照片”，并要求 1:1 打印。规则：连接器必须对实物核对。\n\n#### 23.7.9 评审案例库（三）：PCB 与 EMC\n\n**案例 13：地跨分割。** 某 4 层板把模拟地/数字地分成两块，ADC 跨分割走线，采样噪声大 20 倍。评审时看“地被什么切开/回流路径”，改成单点连接/桥接。规则：信号线下方参考面必须连续。\n\n**案例 14：电源线太细。** 2A 输出只画 10mil，满载压降 0.4V、发热明显。评审时按 `I=kΔT^0.44A^0.725` 算，2A/10℃/1oz 约 22mil。规则：电源线宽进评审表。\n\n**案例 15：过孔不够。** 2A 只放 1 个 0.3mm 过孔，孔壁温升高、压降大。评审时算“每孔载流约 1A”，至少 2～3 个。规则：大电流过孔阵列。\n\n**案例 16：晶振下方走线。** 晶振正下方走了 SPI 时钟，频偏/起振不稳。评审时看“晶振禁布区”，挖空/避开。规则：晶振下方不走线、不铺铜。\n\n**案例 17：差分对不等长。** USB 差分差 8mm，高速时误码。评审时看“差分对长度差/间距”，控制在 5mil 内。规则：差分等长进 DRC/检查表。\n\n**案例 18：丝印压焊盘。** 丝印压到 0402 焊盘，贴片后立碑/偏移。评审时 1:1 打印看丝印，挪位。规则：丝印离焊盘 ≥0.15mm。\n\n**案例 19：测试点被器件挡。** 测试点放在屏蔽罩下/连接器后，探针够不着。评审时用治具模拟，挪到板边/空区。规则：测试点直径 ≥1mm、间距 ≥2.54mm。\n\n**案例 20：板边器件太近。** 连接器离板边 0.5mm，分板时应力拉裂焊盘。评审时看“器件离边距离/拼板方式”，加工艺边。规则：器件离 V-CUT ≥1mm。\n\n**案例 21：Mark 点被阻焊盖。** 贴片机识别不到 Mark，贴偏。评审时看 Gerber 阻焊层，Mark 开窗。规则：Mark 点周围 2mm 无阻焊/无铜。\n\n**案例 22：拼板无工艺边。** 板边直接 V-CUT，轨道夹不住。评审时加 5mm 工艺边+Mark。规则：拼板按贴片机要求。\n\n**案例 23：屏蔽罩接地不够。** 屏蔽罩只有 2 个焊盘接地，屏蔽效果差。评审时看“屏蔽罩地过孔/焊盘”，沿边多点。规则：屏蔽罩每边至少 2 个接地。\n\n**案例 24：ESD 地环路。** 接口地与数字地长距离连，ESD 电流穿过 MCU。评审时看“地分割/单点”，加 TVS 就近泄放。规则：ESD 电流不穿敏感电路。\n\n#### 23.7.10 评审案例库（四）：生产与测试\n\n**案例 25：BOM 封装错。** 原理图 0805，BOM 写 0603，贴片后焊盘不匹配。评审时逐行对“封装/位号”，用 BOM 工具校验。规则：BOM 与原理图封装双向核对。\n\n**案例 26：极性电容反。** 钽电容极性画反，上电短路。评审时看“极性标记/丝印/封装”，1:1 核对。规则：极性器件单独列表。\n\n**案例 27：Gerber 缺阻焊层。** 出 Gerber 漏了阻焊，板厂按默认做，焊盘全开。评审时逐层对照层叠表。规则：Gerber 逐层签字。\n\n**案例 28：钻孔与焊盘偏。** 钻孔文件原点与 Gerber 不一致，孔偏 0.3mm。评审时叠图检查。规则：钻孔/Gerber 同原点。\n\n**案例 29：钢网开孔太大。** QFN 散热焊盘开孔 100%，锡量过多、芯片浮起。评审时按面积比 50%～80% 开孔。规则：细间距钢网开孔进工艺评审。\n\n**案例 30：首件没测。** 小批直接生产，首件没签字，批量偏移。评审时确认“首件测什么/谁签”。规则：首件不签不批量。\n\n**案例 31：测试判据太松。** 只测“能亮”，不测电流/纹波；坏板流到客户。评审时把判据量化。规则：判据必须数字/波形。\n\n**案例 32：测试样本太少。** 1 块板通过就放行，批次问题没暴露。评审时按风险定样本（3～5 块）。规则：样本量与风险匹配。\n\n**案例 33：老化没做。** 早期失效在客户手里出现。评审时加 24～48h 老化/温循。规则：新产品必须老化。\n\n**案例 34：夹具压坏板。** 探针压力过大，测试时压裂焊盘。评审时看“探针行程/支撑”。规则：夹具要有限位/支撑。\n\n**案例 35：包装不防静电。** 板子装普通塑料袋，运输后 ESD 损伤。评审时用防静电袋/托盘。规则：包装进生产清单。\n\n**案例 36：版本不一致。** 生产文件 V1.1，图纸 V1.2，做错版本。评审时核对“文件版本/日期/签字”。规则：生产文件单一版本源。\n\n#### 23.7.11 评审案例库（五）：流程与组织\n\n**案例 37：评审前没发材料。** 会上才第一次看到图，大家只能“跟着翻页”，提不出深入问题。规则：提前 3 天发材料，标注重点页。\n\n**案例 38：评审人不对。** 只有硬件参加，结构和工艺没来；连接器高度、拼板问题没人提。规则：按项目类型定参会角色。\n\n**案例 39：主持人没控场。** 一个问题讨论 40 分钟，后面高风险项没时间看。规则：每个问题限时 10 分钟，超时转任务。\n\n**案例 40：设计者防御。** 被提问题就解释“这是客户要求/以前都这样”，讨论变成辩论。规则：设计者只讲事实/数据，不辩护。\n\n**案例 41：领导提前定调。** “我看没问题，下一个”，评审人不再发言。规则：技术结论先于资源决策。\n\n**案例 42：结论模糊。** 记录写“基本通过，后续优化”，没有人知道到底能不能打样。规则：只允许三种结论。\n\n**案例 43：问题没责任人。** 写“硬件组跟进”，实际没人跟。规则：责任人必须是具体人。\n\n**案例 44：期限写“尽快”。** 两周后还在“尽快”。规则：期限必须是日期。\n\n**案例 45：关闭没证据。** 说“改了”，但没复测/没截图。规则：关闭必须附证据。\n\n**案例 46：不跟踪。** 问题表建了，没人过；下次评审同样问题还在。规则：每周 15 分钟过表。\n\n**案例 47：复盘变追责。** 主持人问“谁的责任”，真因被藏。规则：对事不对人，先数据后结论。\n\n**案例 48：复盘无输出。** 聊了两小时，没有改进项。规则：必须产出 3 条改进+责任人+时间。\n\n**案例 49：经验不归档。** 同样的问题在下一个项目重复。规则：问题→规范/检查表。\n\n**案例 50：评审记录丢失。** 三个月后查不到当时结论。规则：记录归档+版本命名。\n\n**案例 51：变更不重评。** 打样前临时换器件，封装/参数没核对，板子回来不能焊。规则：变更走 ECO/重评。\n\n**案例 52：门禁可跳。** “这次赶时间，先打样再说”，结果返工两次。规则：跳门禁要书面批准。\n\n**案例 53：评审变批斗。** 评审人语气攻击，设计者以后隐瞒问题。规则：对事不对人，提问题带方案。\n\n**案例 54：只评审不测试。** 图纸通过，但没人验证；首板一堆问题。规则：评审+测试两条腿。\n\n**案例 55：只测试不评审。** 靠打样试错，周期长/成本高。规则：能在图纸上发现的，不要留到打样。\n\n**案例 56：小团队不评审。** “就我一个人，评什么”，结果封装错/电源不够。规则：找外部人交叉看 10 个问题。\n\n**案例 57：评审时间太长。** 4 小时会议，大家疲劳，后半段没人认真。规则：拆成 2 场/每场 90 分钟。\n\n**案例 58：评审没有清单。** 想到哪看到哪，漏掉电源/时钟。规则：清单+动线。\n\n**案例 59：评审没有优先级。** 丝印和电源余量一起讨论，高风险被稀释。规则：先 A 级后 C 级。\n\n**案例 60：评审后不更新图纸。** 问题记了，图没改，下次还错。规则：关闭前必须改图/改文件。\n\n#### 23.7.12 项目复盘：4 层板的两次改版\n\n某 4 层板第一版：电源层被信号线切得零碎，DDR 走线跨分割，跑高负载时偶发死机。首板评审只看了功能，没有看“地/电源完整性”，结论 Go；小批后死机率 3%。第二版重新叠层（电源完整地平面、DDR 参考面连续），问题消失，但成本增加 15%。复盘结论：第一版省下的评审/仿真时间，远小于改版+客诉成本；门禁 3 应增加“参考面连续性”检查。\n\n**教训**：4 层板的地/电源规划要在布局前定，不要“画完再补”。\n\n#### 23.7.13 项目复盘：6 层板为什么一次成功\n\n另一个 6 层板项目，首板一次通过，小批不良 <0.5%。复盘发现三个关键动作：一是需求阶段就把“环境/EMC/成本”写进验收；二是原理图和 PCB 各做了一次 90 分钟评审，问题全部闭环；三是首板 Bring-Up 按十步记录，异常 2 小时内定位。没有“神级设计”，只有“每个门禁都真的过了”。这说明评审的价值不是“保证不出问题”，而是“把问题留在便宜的地方”。\n\n**可复制点**：需求验收表、两次评审、Bring-Up 记录表；这三样比“高手”更可靠。\n### 23.8 本章复盘\n\n#### 23.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 四块清单 | 评审覆盖 | 图/板/料/测 |\n| P0/P1/P2 | 分级 | 按后果 |\n| 风险矩阵 | 排序 | 严重×概率 |\n| 每条闭环 | 改版 | 责任/验证 |\n| 评审在投板前 | 时机 | 越早越好 |\n\n#### 23.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 设计评审 | design review | 投板前集体检查 |\n| P0/P1/P2 | priority | 问题等级 |\n| 风险矩阵 | risk matrix | 严重度×概率 |\n| 闭环 | closure | 问题改完并验证 |\n| 改版 | revision | 下一版设计 |\n\n#### 23.8.3 自测 10 题\n\n1. 评审四块是什么？\n2. P0/P1/P2 怎么分？\n3. 风险矩阵两个维度？\n4. 评审材料至少有哪些？\n5. 为什么评审要看 PCB？\n6. 问题闭环表有哪些字段？\n7. 评审太晚有什么问题？\n8. 学习板和工业板评审门槛差在哪？\n9. 评审记录为什么要归档？\n10. 阶段三复盘写什么？\n\n#### 23.8.4 能力清单\n\n- [ ] 能用四块清单做评审。\n- [ ] 能给问题分 P0/P1/P2。\n- [ ] 能用风险矩阵排序。\n- [ ] 能写闭环表并跟踪。\n- [ ] 能复盘阶段三短板。\n\n#### 23.8.5 下一章\n\n下一章进入阶段四：**存储与 DDR 基础**。从单片机走向多层板/高速，先搞懂 Flash、DRAM、DDR 的基本概念。","taskSignature":"c2249e1da6ea9cb9a3ad9bce1df7c3880721c79ac66ef48c36d5ede1e5fdac93","taskCount":5},{"id":"24","title":"第 24 章 · 存储与 DDR 基础","short":"存储与 DDR 基础","stage":4,"diff":3,"prev":"第 23 章 阶段复盘与设计评审","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 区分 NOR/NAND Flash、EEPROM、SRAM、DRAM、DDR 的用途。\n2. 说清 DDR 的 bank、row/column、prefetch、burst 基本概念。\n3. 看懂 DDR 的电源、时钟、命令/地址、数据组的连接关系。\n4. 解释 DDR 布线为什么要求等长、阻抗、参考平面。\n5. 给一个 SoC 画 DDR 拓扑（点对点/ fly-by）。\n6. 判断 DDR 容量/位宽/速率是否匹配 SoC。\n7. 说出至少 8 个 DDR 设计常见坑。\n\n存储是“程序的仓库”，DDR 是“运行时的桌子”。DDR 不像 SPI Flash 那样“接上就能读”，它是高速并行总线，布线/电源/时序都要一起看。\n\n## 正文\n\n### 24.1 它解决什么问题：三个真实场景\n\n#### 场景一：DDR 容量选小，系统跑大程序就崩\n\nSoC 标称支持 2GB，板子只贴 512MB，跑 Linux + 应用后 OOM。DDR 容量/位宽要按系统预算选，不是“能亮就行”。\n\n#### 场景二：DDR 布线不等长，跑一会儿花屏\n\nDDR 数据组内不等长、跨分割，低频能跑，高频误码。DDR 的等长/阻抗/参考平面是硬要求。\n\n#### 场景三：DDR 电源噪声大，随机死机\n\nDDR 的 VREF/VTT/电源去耦不足，读写时电流突变，眼图闭合。DDR 电源要按手册加电容/终端。\n\n### 24.2 它是什么：从存储层次到 DDR\n\n| 类型 | 掉电保留 | 速度 | 用途 |\n|---|---|---|---|\n| NOR Flash | 是 | 中 | 启动代码/固件 |\n| NAND Flash | 是 | 高容量 | 系统/数据存储 |\n| EEPROM | 是 | 低 | 参数/校准 |\n| SRAM | 否 | 高 | MCU 内部 RAM |\n| DRAM | 否 | 高 | 运行内存 |\n| DDR | 否 | 很高 | SoC 主内存 |\n\nDDR（Double Data Rate，双倍数据速率）在时钟上下沿都传数据。关键概念：\n\n- **Bank**：内部存储阵列分区，可并行。\n- **Row/Column**：行地址/列地址，先激活行再读列。\n- **Burst**：一次连续读/写多个数据。\n- **Prefetch**：内部预取，提高带宽。\n- **DQS**：数据选通，和 DQ 一起传输。\n\n> **术语第一次出现**：Fly-by（飞越式）是 DDR 命令/地址/时钟走线依次经过多颗颗粒的拓扑；数据线点对点。Fly-by 要做终端匹配和长度补偿。\n\n#### 24.2.1 存储层次：为什么需要 DDR\n\nCPU 跑得比存储快得多：寄存器 1 个周期、L1 几个周期、L2 十几个、主存几十到上百个周期、Flash/硬盘上千。为了让 CPU 不“等米下锅”，系统用“缓存+主存”分层：常用数据放 SRAM 缓存，大块数据放 DRAM 主存，掉电不丢的放 Flash/ eMMC。DDR 就是“主存”这一层：容量大（GB 级）、带宽高（GB/s 级）、单位成本低，但掉电即失、需要定期刷新、时序复杂。做硬件时要回答三个问题：容量够不够、带宽够不够、时序/电源能不能稳。任何一个不够，系统就表现为“跑大程序崩/花屏/随机死机”。\n\n**课程**：先分清“哪一层存储”再谈选型；把 eMMC 当内存、把 DDR 当硬盘，都是常见误解。\n\n#### 24.2.2 DRAM 单元与刷新\n\nDRAM 的 1 bit 是一个电容+一个晶体管：电容存电荷表示 0/1，晶体管做开关。电容会漏电，所以必须每隔几十毫秒“读出来再写回去”，叫刷新（refresh）。刷新按行进行，每次刷一行；温度越高漏电越快，高温下刷新频率要加倍（如 85℃ 以上）。刷新会占用总线时间，所以“可用带宽”不是标称带宽的 100%。读操作是“破坏性读出”：读走电荷后要写回，这也是 DRAM 时序里 tRCD/tRAS/tWR 存在的原因。\n\n**课程**：DDR 的“随机死机”有时不是布线，是刷新/温度/电源问题；先看温度再怀疑走线。\n\n#### 24.2.3 SDRAM 的内部结构：bank/row/col\n\n一颗 DDR 内部分成多个 bank（常见 8/16 个），每个 bank 有行（row）和列（col）阵列。访问流程是：先激活某 bank 的某行（ACT），再读/写某列（RD/WR），最后预充电（PRE）关闭该行。同一 bank 连续访问不同行要先 PRE 再 ACT，开销大；不同 bank 可以交错操作，提高效率。这就是为什么“顺序访问/多 bank 并行”快，而“随机跨行”慢。控制器会做调度（bank interleaving）来隐藏这些开销；硬件设计要保证地址/命令/数据走线等长、电源干净，否则控制器再聪明也救不回来。\n\n**课程**：DDR 不是“插上就能跑”，它是“模拟+数字+时序”三合一。\n\n#### 24.2.4 DDR 代际：DDR3/4/5 的差别\n\n**电压**：DDR3 1.5V（L 1.35V）、DDR4 1.2V、DDR5 1.1V；电压越低，眼图越小、对电源/阻抗越敏感。\n\n**速率**：DDR3 800～2133MT/s、DDR4 2133～3200、DDR5 4800～6400+；速率越高，时序窗口越窄。\n\n**结构**：DDR4 引入 bank group，DDR5 把 channel 拆成两个子通道、片上 ECC、决策反馈均衡（DFE）。\n\n**电源**：DDR3 需要 VTT 端接电源，DDR4/DDR5 多为 POD 端接，VTT 需求减少但 VREF 更敏感。\n\n**课程**：新手建议从 DDR3/DDR4 点对点学起；DDR5 对阻抗/电源/仿真要求高，不适合第一块板。\n\n#### 24.2.5 位宽、容量与颗粒数量\n\n容量=颗粒容量×颗粒数；位宽=颗粒位宽×颗粒数（并联）。例如 2 颗 16bit 512Mb 颗粒并联成 32bit、1Gb 总容量。控制器位宽常见 16/32/64bit；位宽越宽，带宽越高，但走线越多、等长越难。颗粒数量增加会带来拓扑问题（fly-by/星形）、负载加重、信号质量下降。选型时要先定“位宽/容量/速率”，再定“几颗/什么拓扑”，不要先买颗粒再凑。\n\n**算例**：64bit 总线、1600MT/s，理论带宽=64bit×1600MT/s/8=12.8GB/s；实际可用约 70%～85%，看访问模式。\n\n#### 24.2.6 突发长度与预取\n\nDDR 以“突发（burst）”为单位传输，常见 BL8（连续 8 个数据）。内部预取（prefetch）把多个 bit 并行取出再串行发送：DDR3 8n、DDR4 8n、DDR5 16n。突发长度与位宽共同决定“一次访问搬多少数据”：64bit×8=512bit=64B，正好一个缓存行。硬件设计要保证 DQS/DQ 的相位关系支持这个突发；控制器会做 write leveling/read training，但前提是走线等长、阻抗连续。\n\n**课程**：看到“BL8/预取 8n”不要死记，理解为“内部宽、外部快”。\n\n#### 24.2.7 单端与差分：DQS 为什么是差分\n\nDDR 的数据 DQ 是单端信号，参考 VREF；选通 DQS 是差分（DQS/DQS#），因为它要在高速下准确“框住”数据窗口。DQS 由发送端随数据一起发出（源同步），接收端用 DQS 的边沿采样 DQ。差分 DQS 抗共模噪声、时序抖动小；单端 DQ 则依赖 VREF 和电源质量。设计时要成对走 DQS、等长、同层、参考面连续；DQ 组内等长、组间可不同。把 DQS 当普通单端线走，是 DDR 失败的常见原因。\n\n**课程**：DQS 是“节拍器”，DQ 是“演员”；节拍器乱了，演员再好也没用。\n\n#### 24.2.8 控制器与 PHY 的分工\n\nDDR 控制器（Controller）负责命令调度、地址复用、刷新、时序参数；PHY 负责把数字信号变成模拟波形、做 write leveling/read training、调节 delay/驱动强度。SoC 厂商通常给“PHY 训练固件/配置表”，硬件工程师要做的是：按参考设计布线、选对颗粒、供好电源、留测试点。训练能补偿一部分偏差，但补偿不了“阻抗不连续/等长差太多/电源噪声大”。所以“反正有训练”不是不做等长的理由。\n\n**课程**：训练是“微调”，不是“纠错”；先把物理层做对。\n\n### 24.3 关键参数与手册\n\n| 参数 | 含义 | 设计影响 |\n|---|---|---|\n| 容量 | 颗粒容量×数量 | 系统内存 |\n| 位宽 | x8/x16/x32 | 总线宽度 |\n| 速率 | MT/s | 布线/时序 |\n| 电压 | 1.5V/1.35V/1.2V | 电源/电平 |\n| VREF | 参考电压 | 走线/去耦 |\n| ODT | 片上终端 | 匹配 |\n| CL/tRCD/tRP | 时序 | SoC 配置 |\n\n#### 24.3.1 速率、时钟与数据率\n\nDDR 标称“1600MT/s”指每秒 1600M 次数据传输；时钟 CK 是 800MHz，因为双沿传输（DDR=Double Data Rate）。所以“1600MT/s”不等于“1600MHz 时钟”，看手册时要分清 tCK（时钟周期，单位 ns）与数据率。tCK=1.25ns 对应 800MHz 时钟/1600MT/s；tCK=0.625ns 对应 3200MT/s。带宽=位宽×数据率/8。写预算时用“数据率”，画时序/算等长时用“tCK”，不要混。\n\n**算例**：32bit、2400MT/s → 32×2400/8=9.6GB/s 理论峰值。\n\n#### 24.3.2 关键时序参数：CL/tRCD/tRP/tRAS\n\n**CL（CAS Latency）**：从读命令到数据输出的时钟数；越大越慢，但高频下必须大。\n\n**tRCD**：激活到读/写命令的最小间隔；行选通延迟。\n\n**tRP**：预充电到下一次激活的最小间隔。\n\n**tRAS**：激活到预充电的最小时间；保证行保持足够久。\n\n**tWR**：写恢复到预充电的时间。\n\n**关系**：一次“跨行读”大致要 tRCD+CL+tRP 的等待；控制器会重排命令隐藏。选颗粒时不能只看 CL，要看整套时序在目标速率下是否满足控制器/PHY 能力。\n\n#### 24.3.3 刷新与温度：tREFI 与高温加倍\n\ntREFI 是刷新间隔（常见 7.8μs/3.9μs），tRFC 是刷新占用时间。温度升高漏电加快，标准要求 85℃ 以上刷新频率加倍（tREFI 减半），更高温再加倍。刷新占用带宽：占用率≈tRFC/tREFI。例如 tRFC=350ns、tREFI=7.8μs，占用约 4.5%；高温加倍后约 9%。这就是“高温下带宽下降/更热”的原因之一。设计时要保证高温下电源/散热/刷新配置都到位，不能只按常温调。\n\n**课程**：工业/车载产品必须按最高温度配刷新策略。\n\n#### 24.3.4 端接：ODT、VTT 与 POD\n\n**ODT（On-Die Termination）**：颗粒内部可切换端接电阻，写时开启、读时关闭；控制器通过 MR 寄存器配置。ODT 不匹配会造成反射/过冲。\n\n**VTT**：DDR3 常用 0.75V 端接电源（VDD/2），需要能吸/灌电流的 LDO 或专用 VTT 芯片；VTT 不稳会直接恶化眼图。\n\n**POD（Pseudo Open Drain）**：DDR4/DDR5 端接为“上拉到 VDDQ/下拉到地”的组合，不再需要 VTT；但 VREF 更关键。\n\n**用法**：按颗粒/控制器手册配 ODT；不要“全开/全关”图省事。\n\n#### 24.3.5 VREF：单端信号的“尺子”\n\nDDR3 的 VREF 常为 VDDQ/2（0.75V），由电阻分压或专用 VREF 芯片产生；DDR4 的 VREF 可能由控制器内部生成/外部提供。VREF 不稳或噪声大，DQ 采样就会“高低不分”，表现为随机误码。要求：VREF 走线远离高速/电源开关节点、加去耦、分压电阻精度 1%、靠近控制器/颗粒。很多“跑一会儿花屏”的根因就是 VREF 被电源噪声带动。\n\n**课程**：VREF 是“尺子”，尺子抖，量什么都不准。\n\n#### 24.3.6 电源域与去耦\n\nDDR 电源通常有 VDD（核心）、VDDQ（IO）、VPP（DDR4 字线升压）、VTT/VREF。每路都要有足够去耦：大容量（10μF 级）+ 中容量（1μF/0.1μF）+ 小容量（0.01μF）组合，靠近颗粒/控制器放置。VDDQ 的噪声直接进 DQ 眼图；VPP 不稳会影响激活/写恢复。去耦不是“越多越好”，而是“容值组合+位置+低 ESL”。DDR 颗粒下方尽量放 0.1μF，电源引脚到电容到地过孔路径最短。\n\n**课程**：DDR 电源评审先看“每颗颗粒旁边有没有 0.1μF”。\n\n#### 24.3.7 温度与自刷新\n\nDRAM 有自刷新（Self Refresh）模式：低功耗时由颗粒自己刷新，控制器可休眠。温度升高时自刷新频率也要提高；工业级颗粒支持宽温。做产品时要确认“工作温度范围内自刷新/刷新配置”是否满足，不能只测常温。高温还会加速老化，DDR 周围的热设计（风道/铜箔/散热片）要一起看。\n\n**课程**：温度不是“环境部门的事”，它直接改 DDR 的时序和寿命。\n\n#### 24.3.8 手册怎么读：先看这五页\n\n1. **Features/Ordering**：电压/速率/容量/位宽/温度等级。\n2. **Pin Description**：电源/地/DQ/DQS/地址/命令/ODT/ZQ。\n3. **Absolute/Recommended Operating**：电压范围、温度范围。\n4. **AC/DC 时序表**：tCK/tRCD/tRP/tRAS/CL、建立/保持窗口。\n5. **初始化/模式寄存器**：上电序列、MR 配置、ZQ 校准、ODT 设置。\n\n**方法**：把关键参数抄到自己的“选型表”，不要每次翻 200 页手册；抄的时候带页码。\n\n### 24.4 三个典型连接\n\n#### 24.4.1 DDR 点对点\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 24-1：SoC 与 DDR 点对点连接<\/text>\n  <rect x=\"80\" y=\"80\" width=\"160\" height=\"140\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"115\" font-size=\"13\" fill=\"currentColor\">SoC<\/text>\n  <text x=\"100\" y=\"145\" font-size=\"11\" fill=\"currentColor\">DDR 控制器<\/text>\n  <text x=\"100\" y=\"170\" font-size=\"11\" fill=\"currentColor\">DQ/DQS/CA<\/text>\n  <rect x=\"460\" y=\"80\" width=\"160\" height=\"140\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"500\" y=\"115\" font-size=\"13\" fill=\"currentColor\">DDR 颗粒<\/text>\n  <text x=\"480\" y=\"145\" font-size=\"11\" fill=\"currentColor\">DQ/DQS/CA<\/text>\n  <text x=\"480\" y=\"170\" font-size=\"11\" fill=\"currentColor\">VREF/VTT<\/text>\n  <line x1=\"240\" y1=\"120\" x2=\"460\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"150\" x2=\"460\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"180\" x2=\"460\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"110\" font-size=\"10\" fill=\"currentColor\">DQ<\/text>\n  <text x=\"300\" y=\"145\" font-size=\"10\" fill=\"currentColor\">DQS<\/text>\n  <text x=\"300\" y=\"175\" font-size=\"10\" fill=\"currentColor\">CA<\/text>\n  <text x=\"80\" y=\"265\" font-size=\"13\" fill=\"currentColor\">数据组内等长；CA/CLK 按拓扑；参考平面连续。<\/text>\n<\/svg>\n```\n\n#### 24.4.2 Fly-by 多颗粒\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 24-2：Fly-by：CA/CLK 依次经过颗粒<\/text>\n  <rect x=\"40\" y=\"90\" width=\"120\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"125\" font-size=\"13\" fill=\"currentColor\">SoC<\/text>\n  <rect x=\"230\" y=\"90\" width=\"100\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"250\" y=\"125\" font-size=\"12\" fill=\"currentColor\">DDR1<\/text>\n  <rect x=\"380\" y=\"90\" width=\"100\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"125\" font-size=\"12\" fill=\"currentColor\">DDR2<\/text>\n  <rect x=\"530\" y=\"90\" width=\"100\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"550\" y=\"125\" font-size=\"12\" fill=\"currentColor\">DDR3<\/text>\n  <line x1=\"160\" y1=\"120\" x2=\"230\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"120\" x2=\"380\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"480\" y1=\"120\" x2=\"530\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"630\" y1=\"120\" x2=\"680\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"650\" y=\"110\" font-size=\"10\" fill=\"currentColor\">终端<\/text>\n  <text x=\"40\" y=\"230\" font-size=\"13\" fill=\"currentColor\">数据线仍点对点；CA/CLK 长度补偿/终端按手册。<\/text>\n<\/svg>\n```\n\n#### 24.4.3 DDR 电源\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 24-3：DDR 电源与去耦<\/text>\n  <text x=\"40\" y=\"95\" font-size=\"13\" fill=\"currentColor\">1.2V/1.5V<\/text>\n  <line x1=\"120\" y1=\"90\" x2=\"220\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"220\" y=\"70\" width=\"120\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"245\" y=\"105\" font-size=\"12\" fill=\"currentColor\">DDR 电源<\/text>\n  <text x=\"235\" y=\"130\" font-size=\"11\" fill=\"currentColor\">VDD/VDDQ<\/text>\n  <line x1=\"340\" y1=\"90\" x2=\"440\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"440\" y=\"70\" width=\"140\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"465\" y=\"105\" font-size=\"12\" fill=\"currentColor\">VREF/VTT<\/text>\n  <text x=\"460\" y=\"130\" font-size=\"11\" fill=\"currentColor\">分压/终端<\/text>\n  <text x=\"40\" y=\"210\" font-size=\"13\" fill=\"currentColor\">每个电源脚 100nF；大电容 10μF；VREF 单独滤波，远离开关电源。<\/text>\n<\/svg>\n```\n\n#### 24.4.4 拓扑选择：点对点、fly-by、星形\n\n**点对点**：控制器→1 颗颗粒，走线最短、信号最好，常见于 MCU/低端 SoC。\n\n**Fly-by**：地址/命令/时钟沿一条线依次经过多颗颗粒，末端端接；数据线各自点对点。DDR3/DDR4 多颗粒常用，优点是地址/命令负载可控，缺点是末端颗粒时序偏后，需要 write leveling/读训练补偿。\n\n**星形**：所有颗粒到同一节点等长，适合少量颗粒/低速；高速多颗粒时分支反射严重。\n\n**选择**：1～2 颗优先点对点/短 fly-by；4 颗以上按控制器手册推荐拓扑；不要自创“随便连”。\n\n#### 24.4.5 Fly-by 的等长与端接细节\n\nFly-by 要求：地址/命令/时钟走线连续、分支短（最好无分支）、末端端接电阻靠近最后一颗颗粒；每颗颗粒的 DQS/DQ 与控制器点对点，组内等长。时钟与地址/命令之间的偏斜要靠 write leveling 补偿，但前提是“同一拓扑、阻抗连续”。末端端接（常见 39～56Ω 到 VTT 或 VDDQ）不能省；省了会看到振铃/过冲。走线要避免跨分割、避免过孔 stub 过长。\n\n**课程**：fly-by 不是“把线拉直”，是“让每颗颗粒看到同样的波形”。\n\n#### 24.4.6 星形的适用与风险\n\n星形拓扑把所有颗粒的地址/命令连到一个中心点，理论上等长最好；但中心点分支多，阻抗不连续，高速下反射明显。它适合 2～4 颗、速率不高、控制器驱动强的场景。做星形时要：中心节点加端接、分支尽量短、每支等长；数据线仍按组点对点。速率 >1600MT/s 时优先 fly-by/点对点，不要硬上星形。\n\n**课程**：拓扑没有“最好”，只有“和速率/颗粒数匹配”。\n\n#### 24.4.7 DDR 电源的三种方案\n\n**LDO 方案**：VDDQ/VTT 用 LDO，简单、噪声低，但效率低、发热大；适合小电流/低速率。\n\n**Buck 方案**：VDDQ 用 Buck，效率高，但开关噪声要滤；适合大电流/高速。\n\n**专用 PMIC**：DDR4/DDR5 常用多路 PMIC（VDD/VDDQ/VPP），配时序/监控；省空间但贵。\n\n**选择**：按电流/效率/噪声/成本；VTT 要能吸灌电流（DDR3），VPP 要干净（DDR4）。\n\n#### 24.4.8 ZQ 校准电阻\n\n颗粒的 ZQ 引脚要接精密电阻（常见 240Ω/1%）到地，用于输出阻抗校准；控制器也有 ZQ 校准。电阻精度/走线短/远离噪声是关键。ZQ 校不准会导致驱动强度/端接偏差，眼图变差。评审时看“ZQ 电阻值/精度/位置”，不要漏。\n\n**课程**：一颗 1% 电阻，可能决定 DDR 能不能跑满速。\n\n#### 24.4.9 DDR 测试点与调试\n\n留测试点：CK/CK#、DQS/DQ（至少一组）、VDDQ/VREF、ZQ、复位。测试点要短、不破坏阻抗、可探。调试顺序：电源→时钟→复位→初始化→训练→读写测试→压力测试。没有测试点，只能“换颗粒/换板”猜。\n\n**课程**：DDR 调试最贵的是“看不见波形”。\n\n#### 24.4.10 点对点与 fly-by 的走线差别\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 24-4：点对点 vs fly-by<\/text>\n  <rect x=\"60\" y=\"60\" width=\"90\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"82\" y=\"90\" font-size=\"12\" fill=\"currentColor\">控制器<\/text>\n  <rect x=\"380\" y=\"60\" width=\"90\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"405\" y=\"90\" font-size=\"12\" fill=\"currentColor\">颗粒<\/text>\n  <line x1=\"150\" y1=\"85\" x2=\"380\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"200\" y=\"75\" font-size=\"10\" fill=\"currentColor\">DQ/DQS/CK/ADDR<\/text>\n  <text x=\"60\" y=\"145\" font-size=\"12\" fill=\"currentColor\">点对点：一颗一颗走，最短<\/text>\n  <rect x=\"60\" y=\"180\" width=\"90\" height=\"45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"207\" font-size=\"11\" fill=\"currentColor\">控制器<\/text>\n  <rect x=\"230\" y=\"180\" width=\"60\" height=\"45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"245\" y=\"207\" font-size=\"10\" fill=\"currentColor\">颗粒1<\/text>\n  <rect x=\"350\" y=\"180\" width=\"60\" height=\"45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"365\" y=\"207\" font-size=\"10\" fill=\"currentColor\">颗粒2<\/text>\n  <rect x=\"470\" y=\"180\" width=\"60\" height=\"45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"485\" y=\"207\" font-size=\"10\" fill=\"currentColor\">颗粒3<\/text>\n  <line x1=\"150\" y1=\"202\" x2=\"230\" y2=\"202\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"290\" y1=\"202\" x2=\"350\" y2=\"202\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"410\" y1=\"202\" x2=\"470\" y2=\"202\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"530\" y1=\"202\" x2=\"560\" y2=\"202\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"560\" y=\"190\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"560\" y=\"235\" font-size=\"10\" fill=\"currentColor\">末端端接<\/text>\n  <text x=\"60\" y=\"265\" font-size=\"12\" fill=\"currentColor\">fly-by：地址/命令一条线串下去，末端端接；DQ 各自点对点<\/text>\n  <text x=\"40\" y=\"300\" font-size=\"11\" fill=\"currentColor\">末端颗粒时序最晚，需要 write leveling/读训练补偿。<\/text>\n<\/svg>\n```\n\n**看图**：点对点没有分支反射，fly-by 有末端端接但各颗粒到达时间不同；拓扑由颗粒数和速率决定。\n\n### 24.5 选型与降额\n\n| 项目 | 选择 | 注意 |\n|---|---|---|\n| 容量 | 按系统预算×1.5 | 不选刚好 |\n| 位宽 | 匹配 SoC | x16/x32 |\n| 速率 | 按 SoC 支持 | 高速布线难 |\n| 电压 | 按颗粒 | 1.2/1.35/1.5V |\n| 颗粒数量 | 拓扑/布线 | Fly-by |\n| 终端 | 按手册 | VTT/ODT |\n\n#### 24.5.1 容量预算：别按“能跑就行”\n\n容量预算要列：操作系统/文件系统、应用、缓存/缓冲、日志、升级余量。经验：预留 30%～50% 余量，否则“跑大程序/升级”就崩。eMMC/NAND 还要算“预留空间/磨损均衡”；DDR 容量不够会频繁换页，性能骤降。评审时问“最大同时运行什么/未来一年加什么”，不要只看 demo。\n\n**课程**：容量是“需求”，不是“成本项”；省 1GB 可能省出一年后的返工。\n\n#### 24.5.2 带宽预算：峰值不等于可用\n\n带宽=位宽×速率/8×效率。效率受刷新、跨行、命令开销、访问模式影响，通常 70%～85%。预算要按“最坏并发”算：屏幕刷新+DDR 读写+网络 DMA+CPU 缓存未命中。若峰值接近理论值 80%，就要升位宽/升速率/加缓存/优化访问。不要用“理论带宽”做设计余量。\n\n**算例**：64bit/2400MT/s=19.2GB/s 理论；按 75% 可用≈14.4GB/s；系统峰值 12GB/s，余量约 20%。\n\n#### 24.5.3 颗粒选型：先看“能不能买到/能不能跑”\n\n选型顺序：控制器支持列表（QVL）→ 电压/速率/容量/位宽 → 温度等级 → 封装/高度 → 供货/价格/替代。优先选“参考设计用过/厂商验证过”的颗粒；新颗粒要打样验证。注意“同型号不同批次”的时序差异，量产要锁定批次/供应商。\n\n**课程**：DDR 颗粒不是“参数对就行”，互通性/批次一致性很关键。\n\n#### 24.5.4 降额：速率/温度/电压\n\n降额思路：标称 3200MT/s 的颗粒在四层板/普通阻抗下可能只能跑 2400；工业温度下时序余量更小。设计时按“降一档”选型（如目标 2400 选 3200 颗粒），留时序/眼图余量。电压/端接/驱动强度按手册推荐，不要“超频”当常规。降额不是“保守”，是“给批次/温度/生产波动留空间”。\n\n**课程**：能跑 demo 不等于能量产；降额是量产思维。\n\n#### 24.5.5 BOM 与替代\n\nBOM 要写清：厂商/型号/速度等级/温度/封装/批次要求；替代料要同电压/同速率/同时序/同封装，且验证过。DDR 替代不能只看“容量一样”，bank 结构/时序/ODT 可能不同。建议关键物料双源，但替代料必须打样验证，不能“直接换”。\n\n**课程**：DDR 是“最不该随便替代”的器件之一。\n\n#### 24.5.6 成本与层数\n\nDDR 布线层数影响成本：2 层很难做好阻抗/等长；4 层可做但余量小；6 层以上更容易。速率越高、颗粒越多，层数/阻抗/电源要求越高。选型时把“层数/阻抗/电源/测试”成本一起算，不要只看颗粒单价。\n\n**课程**：省 layer 的钱，常在调试/返工里加倍还回去。\n\n### 24.6 测量与仿真\n\n#### 24.6.1 DDR 检查\n\n1. 电源电压/纹波。\n2. VREF 电压。\n3. 时钟/CA/DQ 波形。\n4. 眼图/误码（有条件）。\n5. 内存测试（memtest）。\n\n#### 24.6.2 CircuitJS\n\n```circuitjs\nrc-lowpass-159\n```\n\n观察高速线上的 RC 效应，理解等长/阻抗为什么重要。\n\n#### 24.6.3 动手任务\n\n- 查一颗 DDR 颗粒手册，列容量/位宽/电压/速率。\n- 画 SoC 与 DDR 的连接框图。\n- 列 DDR 电源去耦清单。\n- 跑一次内存测试，记录速率/误码。\n\n#### 24.6.1 眼图与模板\n\nDDR 眼图看“张开度”：水平（时间）和垂直（电压）。用示波器+差分探头测 DQS/DQ，触发用 CK 或 DQS；看最差组合（高温/低压/满载）。眼图闭合的常见原因：阻抗不连续、等长差、VREF 噪声、端接错、电源跌落。测试要记录“条件/速率/温度”，不能只截一张漂亮图。\n\n**课程**：眼图是“结果”，布线/电源/端接是“原因”；先查原因再调 PHY。\n\n#### 24.6.2 时序测量：建立/保持窗口\n\n用示波器测 DQ 相对 DQS 的建立/保持时间；与颗粒/控制器手册的窗口比较。注意探头带宽/接地方式（短地弹簧），否则测到的是“探头振铃”。多测几组 DQ（最差位），不要只看一组。结果偏小先查等长/阻抗，再查 PHY delay 配置。\n\n**课程**：量时序时，探头地线太长会把好板测成坏板。\n\n#### 24.6.3 读写压力测试\n\n初始化通过不等于稳定。要做：全地址写读比对、March 测试、长时间老化、温度循环、满带宽压力。观察误码/重启/花屏。压力测试暴露的是“时序/电源/温度余量”，不是“功能”。记录误码位置/温度/电压，便于定位。\n\n**课程**：DDR 问题常是“概率性”的，跑 10 分钟不算测过。\n\n#### 24.6.4 电源噪声测量\n\n测 VDDQ/VREF/VPP 的纹波/瞬态：用 AC 耦合、20MHz 带宽、短地。最坏情况是“DDR 满负荷+CPU 满负荷+屏幕刷新”。纹波超标先查去耦/电源环路/地。VREF 噪声要单独看，它直接进眼图。\n\n**课程**：DDR 电源不是“直流对就行”，瞬态才是杀手。\n\n#### 24.6.5 仿真：IBIS 与拓扑\n\n高速 DDR 建议做 IBIS 仿真：看振铃/过冲/眼图/串扰。模型用厂商 IBIS，叠层/阻抗/端接按实际。仿真不能替代实测，但能在打样前发现“拓扑/端接/等长”问题。仿真报告要写“条件/模型/结论”，不要只放一张图。\n\n**课程**：仿真和实测是“互相验证”，不是“二选一”。\n\n#### 24.6.6 调试顺序：从电源到压力\n\n1. 静态阻抗/短路。\n2. 电源电压/纹波（VDD/VDDQ/VPP/VREF）。\n3. 时钟频率/幅度。\n4. 复位/初始化。\n5. PHY 训练（write leveling/read training）。\n6. 单地址读写。\n7. 全地址/压力/温度。\n8. 眼图/时序余量。\n\n**课程**：跳过前面直接跑压力，等于在坏地基上盖楼。\n\n#### 24.6.7 眼图要看什么\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 24-5：DDR 眼图示意（时间×电压）<\/text>\n  <line x1=\"90\" y1=\"60\" x2=\"90\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"90\" y1=\"230\" x2=\"640\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"70\" font-size=\"11\" fill=\"currentColor\">电压<\/text>\n  <text x=\"600\" y=\"255\" font-size=\"11\" fill=\"currentColor\">时间<\/text>\n  <path d=\"M110 100 L250 100 L270 140 L290 100 L430 100 L450 140 L470 100 L610 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <path d=\"M110 180 L250 180 L270 140 L290 180 L430 180 L450 140 L470 180 L610 180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"270\" y1=\"100\" x2=\"270\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"450\" y1=\"100\" x2=\"450\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"255\" y=\"95\" font-size=\"10\" fill=\"currentColor\">采样点<\/text>\n  <text x=\"300\" y=\"150\" font-size=\"10\" fill=\"currentColor\">眼高<\/text>\n  <text x=\"420\" y=\"208\" font-size=\"10\" fill=\"currentColor\">眼宽<\/text>\n  <text x=\"40\" y=\"280\" font-size=\"12\" fill=\"currentColor\">眼高=电压余量，眼宽=时间余量；闭合先查阻抗/等长/电源。<\/text>\n<\/svg>\n```\n\n**读法**：眼图张开越大，余量越大；温度/低压/满载下再看一次，才是“最坏眼图”。\n\n#### 24.6.8 仿真：VREF 分压与噪声\n\nVREF 常用两颗等值电阻从 VDDQ 分压得到（如 1kΩ/1kΩ 得 VDDQ/2），再并联 0.1μF。问题在于：分压电阻本身有容差，电源纹波会按比例传到 VREF；如果 VREF 走线又长、又没有去耦，DQ 采样阈值就跟着抖。用分压电路仿真可以看到“输入纹波→VREF 纹波”的关系，从而理解为什么评审要求 1% 电阻、近端去耦、远离开关电源。\n\n```circuitjs\nvoltdivide\n```\n\n**判据**：VREF 直流偏差 <±1%；VREF 上的 AC 纹波 < DQ 眼高的 5%；分压电阻精度 1%。\n\n**课程**：VREF 不是“随便分一下”，它是 DDR 的模拟基准。\n\n### 24.7 常见坑\n\n1. **容量/位宽不匹配**：系统不稳/OOM。\n2. **DQ 组内不等长**：高频误码。\n3. **CA/CLK 拓扑错**：Fly-by 没终端。\n4. **参考平面跨分割**：眼图闭合。\n5. **VREF 噪声大**：采样错误。\n6. **电源去耦不足**：随机死机。\n7. **ODT/终端配置错**：反射。\n8. **颗粒批次混用**：时序不同。\n9. **不跑内存测试**：问题到客户才暴露。\n\n#### 24.7.1 只做“组内等长”，忘了参考面\n\nDQ 组内等长做了，但走线跨了电源/地分割，回流路径断，眼图照样差。评审要看“参考面是否连续、跨分割有没有桥接电容/改层”。等长是“长度”，参考面是“阻抗”；两者缺一不可。\n\n**课程**：等长不等于“信号好”。\n\n#### 24.7.2 把 DQS 当普通线走\n\nDQS 差分对没成对走、没等长、被其他信号穿插，采样窗口直接乱。要求：DQS/DQS# 同层、紧耦合、等长、两侧包地、参考面连续。\n\n**课程**：DQS 是“时钟”，不是“数据”。\n\n#### 24.7.3 去耦电容放太远\n\n0.1μF 放在颗粒另一侧/板边，等于没有。要求：电容靠近电源引脚、地过孔就近、回路最短。DDR 颗粒下方/背面是常用位置。\n\n**课程**：去耦看“回路”，不是看“数量”。\n\n#### 24.7.4 VREF 分压电阻精度不够/噪声大\n\n5% 电阻分压，VREF 偏 0.1V，DQ 采样阈值偏移；加上电源噪声，误码率上升。要求 1% 电阻、加 0.1μF、远离开关电源。\n\n**课程**：VREF 是“模拟基准”，按模拟电路对待。\n\n#### 24.7.5 忽略 ZQ/ODT 配置\n\nZQ 电阻漏贴/错值，ODT 全关/全开，驱动强度不对，眼图过冲/欠冲。按手册配 MR/ODT，量驱动强度。\n\n**课程**：DDR 初始化不是“跑通就行”，配置错了会“能跑但不可靠”。\n\n#### 24.7.6 电源上电时序错\n\nVDD/VDDQ/VPP 上电顺序不对，颗粒进入异常状态；DDR4 的 VPP 要先于 VDDQ 或按手册。评审看“电源时序图/PMIC 配置”。\n\n**课程**：DDR 也讲“上电礼仪”。\n\n#### 24.7.7 一上来就跑高频\n\n标称 3200 直接跑 3200，失败就换颗粒；其实降频 2400 能稳，说明布线余量不足。正确做法：从低速起，逐步升频，记录失败点，再优化。\n\n**课程**：调试是“二分”，不是“硬顶”。\n\n#### 24.7.8 忽略温度/批次\n\n常温通过，高温误码；这批通过，下批失败。要求高温/低温/电压拉偏测试，锁定批次，量产抽测。\n\n**课程**：DDR 的“稳定性”是温度/电压/批次的函数。\n\n### 24.8 本章复盘\n\n#### 24.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 容量×1.5 | 系统预算 | 不选刚好 |\n| DQ 组内等长 | 数据 | 按手册公差 |\n| Fly-by + 终端 | CA/CLK | 按拓扑 |\n| 参考平面连续 | 阻抗 | 不跨分割 |\n| VREF 单独滤波 | 采样 | 远离开关 |\n\n#### 24.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| DDR | double data rate | 双倍速率内存 |\n| Bank | bank | 内部阵列分区 |\n| DQS | data strobe | 数据选通 |\n| Fly-by | fly-by | CA/CLK 依次经过颗粒 |\n| ODT | on-die termination | 片内终端 |\n| VREF | reference voltage | 参考电压 |\n\n#### 24.8.3 自测 10 题\n\n1. NOR/NAND/DRAM 区别？\n2. DDR 为什么叫双倍速率？\n3. Bank/Row/Column 是什么？\n4. DQS 作用？\n5. Fly-by 拓扑是什么？\n6. DQ 为什么组内等长？\n7. VREF 为什么要滤波？\n8. ODT 作用？\n9. DDR 容量怎么选？\n10. 内存测试怎么做？\n\n#### 24.8.4 能力清单\n\n- [ ] 能区分存储类型。\n- [ ] 能解释 DDR 基本概念。\n- [ ] 能画 DDR 连接拓扑。\n- [ ] 能列 DDR 电源/去耦要求。\n- [ ] 能跑内存测试。\n\n#### 24.8.6 下一章\n\n下一章讲“叠层阻抗与 SI/PI”：把这一章的 DDR 走线，放到“层叠/阻抗/参考面/电源完整性”的框架里。DDR 是 SI/PI 最苛刻的场景之一；学完下一章再回头看 24 章，会更清楚“为什么要等长、为什么要连续参考面、为什么要去耦”。\n\n**衔接**：本章的眼图/时序问题，下一章用阻抗/回流/PDN 解释；先去把叠层阻抗的算例做一遍，再回来调 DDR，会少走很多弯路，也能看懂 DDR 为什么对“连续参考面”这么敏感，也能解释为什么“等长做了、眼图还是差”；这两件事在叠层/阻抗那一章会彻底讲清。\n\n**练习**：拿一块现成 DDR 板，量一颗颗粒的 VDDQ 纹波和 DQS 眼图，记录温度/负载；再对照本章的“电源/端接/参考面”逐条查，你会发现问题往往不在“跑多快”，而在“供电和回流”；把这两项做对，再谈速率。\n\n#### 24.8.6 下一章\n\n下一章讲**叠层、阻抗与 SI/PI 基础**：DDR 能不能跑，最终取决于叠层和阻抗。","taskSignature":"09d6deae04e3f5d8222facb5297e2ef111f9680f4ed9fdef5c5d07d383317ce0","taskCount":5},{"id":"25","title":"第 25 章 · 叠层、阻抗与 SI/PI 基础","short":"叠层、阻抗与 SI/PI 基础","stage":4,"diff":4,"prev":"第 24 章 存储与 DDR 基础","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 画出 4 层/6 层/8 层典型叠层，并说清每层作用。\n2. 计算微带线/带状线的特征阻抗，理解线宽/介质/参考面关系。\n3. 区分 SI（信号完整性）与 PI（电源完整性）。\n4. 解释反射、串扰、地弹、回流路径的物理原因。\n5. 给 USB/HDMI/DDR 设阻抗目标，并与板厂沟通。\n6. 用 TDR/眼图/仿真判断通道好坏。\n7. 说出至少 8 个叠层/阻抗设计常见坑。\n\n高速不是“跑得快”，是“波形到接收端还认得出来”。叠层和阻抗，是让波形不变形的物理基础。\n\n## 正文\n\n### 25.1 它解决什么问题：三个真实场景\n\n#### 场景一：4 层板叠层错，USB 阻抗做不出来\n\n板厂按“信号-信号-地-电源”做，USB 差分没有连续参考面，阻抗偏离 90Ω，眼图闭合。叠层要“信号-地-电源-信号”，关键信号有地参考。\n\n#### 场景二：线宽按“经验”设，阻抗差 20%\n\nUSB 差分按 6/6mil 画，板厂算出 110Ω。没做阻抗控制，也没给板厂目标，最后靠“能枚举”过关。高速线要按叠层算线宽/间距。\n\n#### 场景三：电源平面谐振，板子某频点噪声大\n\n电源/地平面像一块“板”，在特定频率谐振。去耦电容 placement 不对，谐振点噪声放大。PI 要看平面+电容的阻抗曲线。\n\n### 25.2 它是什么：叠层是“地-信号-电源”的排序\n\n典型叠层：\n\n| 层数 | 叠层 | 特点 |\n|---|---|---|\n| 2 层 | 信号/地（底层铺铜） | 便宜，参考不完整 |\n| 4 层 | 信号-地-电源-信号 | 性价比高，有完整参考 |\n| 6 层 | 信号-地-信号-电源-地-信号 | 高速/双参考 |\n| 8 层 | 信号-地-信号-电源-地-信号-地-信号 | 高速/多层 |\n\n阻抗：\n\n- **微带线**（microstrip）：外层，一边是空气，一边是介质。\n- **带状线**（stripline）：内层，上下都是介质/参考面。\n\n近似公式（微带，粗略）：\n\n`Z0 ≈ 87 / sqrt(εr + 1.41) × ln(5.98h / (0.8w + t))`\n\n其中 h 介质厚度，w 线宽，t 铜厚。工程上用板厂/阻抗计算器，不手算投产。\n\n> **术语第一次出现**：SI（Signal Integrity，信号完整性）关心“信号波形是否失真”；PI（Power Integrity，电源完整性）关心“电源/地是否稳定”。两者通过回流路径耦合在一起。\n\n#### 25.2.1 叠层是什么：一张“三明治”的排序表\n\n叠层（stackup）就是把铜箔、介质、铜箔一层层排起来：信号层、地平面、电源平面、信号层……每层标铜厚（1oz=35μm）、介质材料（FR-4/高速材料）、介质厚度、阻抗目标。叠层决定三件事：阻抗（线宽/介质厚度）、回流路径（参考面在哪）、电源完整性（电源/地平面成对）。它不是“画图时顺便填的表”，而是“SI/PI 的地基”。叠层错了，线宽怎么调都做不出目标阻抗。\n\n**课程**：先定叠层，再定线宽；顺序反了，一定返工。\n\n#### 25.2.2 参考面：每条信号线都要问“下面是哪一层”\n\n微带线的参考面是正下方的地/电源平面；带状线的参考面是上下两个平面。信号回流总是走“阻抗最低的路径”，通常就在参考面上、信号线正下方。如果下方参考面被切碎/跨分割，回流被迫绕路，形成“回流断点”，表现为阻抗突变、辐射、串扰。评审时逐条关键线问“参考面是哪层、连不连续”；不要只看“线走完了”。\n\n**课程**：信号不是“从 A 到 B”，是“去线和回流一起走”。\n\n#### 25.2.3 铜厚与介质厚度：阻抗的两个旋钮\n\n阻抗主要由“线宽/介质厚度/介电常数”决定。介质越厚，阻抗越高；线越宽，阻抗越低；介电常数越低，阻抗越高、传播越快。常见 1oz 铜（35μm）、介质 0.1～0.2mm。铜厚还影响载流/温升；介质厚度还影响层间串扰。调阻抗时优先调线宽（便宜），其次调介质厚度（改叠层，贵），最后换材料（更贵）。\n\n**课程**：阻抗不是“算一次”，是“叠层+线宽+工艺”的联合结果。\n\n#### 25.2.4 半固化片（PP）与芯板（Core）\n\n叠层由“芯板+半固化片”压合：芯板两面有铜，PP 是粘合层，压合后变成介质。PP 的厚度由“几张家树脂+玻璃布”决定，常见 0.1mm/0.2mm；压合后厚度会变。设计叠层要按板厂“可生产的 PP 组合”选，不能写一个“理论厚度”让板厂凑。阻抗计算要用“压合后实际厚度”，不是“PP 标称厚度”。\n\n**课程**：叠层表要跟板厂确认，不要自己拍脑袋。\n\n#### 25.2.5 对称与翘曲\n\n叠层要尽量对称：铜厚/介质厚度/层数上下对称，减少压合应力/翘曲。不对称叠层在回流焊后容易“弓/扭”，尤其是大板/薄板。厚铜/大面积铜不平衡也会翘。设计时把“铜分布/叠层对称”纳入评审；必要时加平衡铜/工艺边。\n\n**课程**：翘曲不是“板厂的事”，叠层设计就决定了。\n\n#### 25.2.6 层数怎么选：4/6/8 层的分界\n\n**4 层**：信号-地-电源-信号；适合中低速、DDR3/少量高速，电源/地各一层，参考面有限。\n\n**6 层**：信号-地-信号-信号-电源-信号 或 信号-地-信号-电源-地-信号；适合 DDR3/DDR4、USB3、千兆网。\n\n**8 层**：多组地/电源、多个信号层，适合 DDR4/5、PCIe、多路高速。\n\n**选择**：按“高速信号数量/电源域数量/EMC 要求/成本”定；不要“先画 4 层，画不下再加层”。\n\n#### 25.2.7 叠层与 EMC：地平面成对\n\n电源平面和地平面要“成对”且靠近，形成平面电容，高频去耦好；地平面要完整，不能被打散。信号层尽量夹在“地-信号-地”或“电源-信号-地”之间，两侧都有参考。叠层里“地平面数量”往往比“信号层数量”更影响 EMC。4 层板只有一层地，所有信号都参考它，任何分割都会伤到多条线。\n\n**课程**：EMC 好不是“加滤波”，是“叠层里地够不够”；地平面完整，比多放十颗磁珠更管用，这是叠层设计最容易被忽略的一条：先有完整的地，再谈滤波和屏蔽，这条顺序不要颠倒，先把地做完整；地不完整，后面全是补丁。\n\n#### 25.2.8 传播延迟与介电常数\n\n信号在介质中的传播速度 `v=c/√εr`，延迟 `t=长度/v`。FR-4 的 εr 约 4.2～4.6，传播延迟约 6～7ps/mm（微带）或 6ps/mm（带状线，全在介质中）。等长匹配要用“同层/同结构”，因为微带和带状线的延迟不同；跨层换层会引入延迟差。做 DDR/差分等长时，先确认“参考结构一致”，再谈“长度一致”。\n\n**算例**：100mm 微带，延迟约 0.6～0.7ns；同样 100mm 带状线略不同，跨层要补偿。\n\n### 25.3 关键参数与手册\n\n| 参数 | 含义 | 设计影响 |\n|---|---|---|\n| εr | 介质介电常数 | 阻抗/传播速度 |\n| h | 介质厚度 | 阻抗 |\n| w/t | 线宽/铜厚 | 阻抗 |\n| Z0 | 特征阻抗 | 匹配 |\n| 传播延迟 | ps/inch | 等长 |\n| 平面电容 | 电源-地 | PI |\n| 谐振 | 平面谐振 | EMI |\n\n#### 25.3.1 特性阻抗是什么\n\n特性阻抗 Z0 是“信号沿传输线传播时看到的瞬时阻抗”，由单位长度电感 L 和电容 C 决定：`Z0=√(L/C)`。它不是直流电阻，不能用万用表量；它由几何（线宽/介质厚度）+ 材料（εr）+ 参考面决定。阻抗不连续（线宽突变/参考面断开/过孔）会产生反射，反射系数 `Γ=(Z1-Z0)/(Z1+Z0)`。目标是把沿线阻抗控制在 ±10% 内。\n\n**课程**：Z0 是“几何+材料”的函数，不是“设一个数”。\n\n#### 25.3.2 微带线阻抗估算\n\n表层走线、下方一个参考面，是微带线（microstrip）。常用近似：\n\n`Z0≈87/√(εr+1.41) · ln(5.98h/(0.8w+t))`\n\n其中 h=介质厚度、w=线宽、t=铜厚（同单位）。例：εr=4.2、h=0.2mm、w=0.35mm、t=0.035mm，算得 Z0≈50Ω 量级。注意：阻焊层会略降阻抗（约 1～3Ω），高速时要让板厂按“带阻焊”模型算。\n\n**用法**：先算再画，不要“看着差不多”。\n\n#### 25.3.3 带状线阻抗估算\n\n内层走线、上下两个参考面，是带状线（stripline）。常用近似：\n\n`Z0≈60/√εr · ln(4b/(0.67πw(0.8+t)))`\n\n其中 b=两参考面间距、w=线宽、t=铜厚。带状线全在介质中，传播延迟更稳定、串扰更小，但布线层受限。DDR/高速差分常走内层带状线。\n\n**用法**：内层阻抗更“可控”，但过孔/换层会破坏参考。\n\n#### 25.3.4 差分阻抗与耦合\n\n差分对由两条等宽线组成，差分阻抗 `Zdiff≈2Z0(1-k)`，k 是耦合系数（与间距/介质有关）。间距越小，耦合越强，Zdiff 越低；线宽越大，Z0 越低。常见 USB 90Ω、HDMI 100Ω、以太网 100Ω、PCIe 85/100Ω。差分对要“等宽/等距/等长/同层/连续参考”，否则差分阻抗沿线变化。\n\n**课程**：差分不是“画两条平行线”，是“控制一个阻抗”。\n\n#### 25.3.5 铜厚与阻焊的影响\n\n铜厚增加会降低阻抗（线更“厚”，等效更宽）；常见 1oz/0.5oz。阻焊层 εr 与空气不同，会让表层微带阻抗略降；高频/高速要让板厂按“带阻焊”算。铜箔粗糙度在高频下增加损耗（趋肤效应+粗糙度），高速材料会选低轮廓铜（HVLP）。\n\n**课程**：阻抗计算要写清“铜厚/阻焊/粗糙度”，否则和板厂算的不是一回事。\n\n#### 25.3.6 过孔阻抗与 stub\n\n过孔不是“一根导线”：它有电感/电容，阻抗通常低于 50Ω，会产生反射；长 stub（未使用的过孔段）会在特定频率谐振。高速过孔要做“背钻（back drill）”去掉 stub，或按厂商模型优化孔径/焊盘/反焊盘。普通 2 层/4 层板过孔 stub 短，影响小；10Gbps 以上必须处理。\n\n**课程**：过孔是“阻抗断点”，不是“连接点”。\n\n#### 25.3.7 传播延迟与等长换算\n\n延迟 `t=length/v`，`v=c/√εr`。FR-4 带状线约 6ps/mm，微带约 6.5～7ps/mm。等长不是“绝对长度相等”，而是“延迟相等”：同层同结构才可直接比长度；跨层要按 ps 换算。DDR 组内等长通常按“mil/ps”给容差，差分对内 ±5mil 量级、组间按协议。\n\n**算例**：1000mil≈25.4mm，带状线延迟约 152ps。\n\n#### 25.3.8 损耗：导体损耗与介质损耗\n\n高速信号衰减来自导体损耗（趋肤效应、铜粗糙度）和介质损耗（εr 的虚部/损耗角 tanδ）。频率越高、线越长，损耗越大；FR-4 在 10GHz 以上损耗明显，高速/长距离要用低损耗材料（如 Megtron/ Rogers）。损耗会让眼图闭合/抖动增加，预算时要算“链路损耗预算”。\n\n**课程**：阻抗对了不等于“能跑”，损耗也会吃眼图。\n\n### 25.4 三个典型叠层与结构\n\n#### 25.4.1 4 层叠层\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 25-1：4 层板典型叠层<\/text>\n  <rect x=\"100\" y=\"60\" width=\"420\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"85\" font-size=\"12\" fill=\"currentColor\">L1 信号/器件<\/text>\n  <rect x=\"100\" y=\"100\" width=\"420\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"125\" font-size=\"12\" fill=\"currentColor\">L2 地平面<\/text>\n  <rect x=\"100\" y=\"140\" width=\"420\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"165\" font-size=\"12\" fill=\"currentColor\">L3 电源平面<\/text>\n  <rect x=\"100\" y=\"180\" width=\"420\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"205\" font-size=\"12\" fill=\"currentColor\">L4 信号/地<\/text>\n  <text x=\"100\" y=\"260\" font-size=\"13\" fill=\"currentColor\">关键信号走 L1，参考 L2；L4 走低速/电源。<\/text>\n  <text x=\"100\" y=\"285\" font-size=\"13\" fill=\"currentColor\">L2/L3 完整，避免被过孔/走线切碎。<\/text>\n<\/svg>\n```\n\n#### 25.4.2 微带/带状线\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 25-2：微带线与带状线<\/text>\n  <rect x=\"60\" y=\"70\" width=\"240\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"95\" font-size=\"12\" fill=\"currentColor\">微带线：线在表面<\/text>\n  <line x1=\"80\" y1=\"130\" x2=\"280\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"6\"/>\n  <rect x=\"60\" y=\"150\" width=\"240\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"170\" font-size=\"11\" fill=\"currentColor\">介质<\/text>\n  <rect x=\"60\" y=\"180\" width=\"240\" height=\"25\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"197\" font-size=\"11\" fill=\"currentColor\">参考地<\/text>\n  <rect x=\"400\" y=\"70\" width=\"260\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"415\" y=\"90\" font-size=\"11\" fill=\"currentColor\">参考地<\/text>\n  <rect x=\"400\" y=\"100\" width=\"260\" height=\"35\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"415\" y=\"122\" font-size=\"11\" fill=\"currentColor\">介质<\/text>\n  <line x1=\"420\" y1=\"150\" x2=\"640\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"6\"/>\n  <rect x=\"400\" y=\"160\" width=\"260\" height=\"35\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"415\" y=\"182\" font-size=\"11\" fill=\"currentColor\">介质<\/text>\n  <rect x=\"400\" y=\"195\" width=\"260\" height=\"25\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"415\" y=\"212\" font-size=\"11\" fill=\"currentColor\">参考地<\/text>\n  <text x=\"60\" y=\"270\" font-size=\"13\" fill=\"currentColor\">微带：一边空气；带状：上下介质，阻抗更稳。<\/text>\n<\/svg>\n```\n\n#### 25.4.3 回流路径\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 25-3：信号回流路径<\/text>\n  <rect x=\"60\" y=\"70\" width=\"580\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"90\" font-size=\"11\" fill=\"currentColor\">信号线<\/text>\n  <rect x=\"60\" y=\"170\" width=\"580\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"190\" font-size=\"11\" fill=\"currentColor\">地平面<\/text>\n  <line x1=\"120\" y1=\"100\" x2=\"120\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"170\" x2=\"120\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"580\" y1=\"100\" x2=\"580\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"580\" y1=\"170\" x2=\"580\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"245\" font-size=\"13\" fill=\"currentColor\">回流走最近的地平面；跨分割时回流绕远，形成环路/辐射。<\/text>\n<\/svg>\n```\n\n#### 25.4.4 6 层叠层：两种常用方案\n\n**方案 A（信号-地-信号-信号-电源-信号）**：L2 地、L5 电源，L3/L4 内层信号，L1/L6 表层。优点是两层内层信号都有参考，电源/地成对；缺点是 L3/L4 相邻，层间串扰要控。\n\n**方案 B（信号-地-信号-电源-地-信号）**：L2 地、L4 电源、L5 地，L3 夹在电源/地之间。优点是 L3 上下都有平面、SI 好；缺点是可用的内层信号层少。\n\n**选择**：DDR/千兆网优先 B；需要更多布线层选 A，并加大 L3/L4 间距/加屏蔽。\n\n#### 25.4.5 8 层叠层：高速的“地-信号-地”夹心\n\n8 层常见：L1 信号、L2 地、L3 信号、L4 电源、L5 地、L6 信号、L7 电源、L8 信号。关键是每个信号层都紧邻一个平面，且地平面完整。DDR4/5、PCIe 多 Lane 常用这种结构。层数增加不是“随便加信号层”，而是“加地/电源对”，让每个信号都有参考、每路电源都有去耦平面。\n\n**课程**：8 层的价值在“参考面”，不在“多画两层线”。\n\n#### 25.4.6 微带 vs 带状线：怎么选\n\n**微带**：表层、方便调试/换线、阻抗受阻焊影响、辐射稍大；适合短距离/低速/需要探针。\n\n**带状线**：内层、上下参考、辐射小、串扰小、延迟稳定；适合高速/长距离/EMC 敏感。\n\n**用法**：USB/HDMI/DDR 关键线优先内层带状线；调试线/短接口可用微带。\n\n#### 25.4.7 回流路径：换层时的“地过孔”\n\n信号换层时，回流也要换层；如果参考面从 GND 换到 GND，要在换层过孔旁放“地回流过孔”（通常 1～2 个，靠近信号过孔）。没有回流过孔，回流被迫绕远，形成阻抗突变/辐射。差分换层时，两线过孔对称、旁边加地孔。评审时看“换层处有没有伴随地孔”。\n\n**课程**：过孔不是“信号自己过去”，回流也要有路。\n\n#### 25.4.8 跨分割：什么时候可以接受\n\n跨分割会切断回流，原则上禁止。例外：低速/静态信号、电流极小、分割两侧有桥接电容/缝补、或有专门回流路径。高速/时钟/复位/模拟小信号绝不允许跨分割。评审时用“分割线叠在走线上”检查；修法：改参考面/改走线/加缝合孔/加桥接电容。\n\n**课程**：跨分割不是“能不能”，是“代价多大”。\n\n#### 25.4.9 缝合孔（stitching via）怎么放\n\n地平面之间/地-电源平面边缘放缝合孔，缩短回流路径、降低平面谐振。沿板边/分割线/连接器附近每 5～10mm 放一个；高速过孔/连接器旁加密。缝合孔要接地平面，不要“悬空”。它不是“越多越好”，而是“沿电流路径放”。\n\n**课程**：缝合孔是“回流的桥”，不是“装饰”。\n\n#### 25.4.10 平面分割与电源岛\n\n电源平面按电源域分割（3.3V/1.8V/1.2V），分割线要远离高速信号；每个电源岛要有足够去耦/缝合。分割不是“越多越好”，分割太多会让回流更难。评审时看“电源岛形状/去耦/跨分割信号”。\n\n**课程**：电源分割是“按需”，不是“按颜色”。\n\n#### 25.4.11 微带与带状线的场分布\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 25-4：微带（上）与带状线（下）<\/text>\n  <line x1=\"60\" y1=\"80\" x2=\"340\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <rect x=\"60\" y=\"80\" width=\"280\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <text x=\"150\" y=\"70\" font-size=\"10\" fill=\"currentColor\">信号线 w<\/text>\n  <line x1=\"60\" y1=\"110\" x2=\"340\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <text x=\"130\" y=\"103\" font-size=\"10\" fill=\"currentColor\">介质 h<\/text>\n  <rect x=\"60\" y=\"140\" width=\"280\" height=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"130\" y=\"175\" font-size=\"10\" fill=\"currentColor\">参考面 GND<\/text>\n  <path d=\"M100 80 Q120 120 100 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <path d=\"M220 80 Q240 120 220 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <text x=\"60\" y=\"185\" font-size=\"11\" fill=\"currentColor\">微带：一侧介质+一侧空气，阻抗受阻焊影响<\/text>\n  <line x1=\"400\" y1=\"80\" x2=\"660\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"500\" y=\"70\" font-size=\"10\" fill=\"currentColor\">GND<\/text>\n  <rect x=\"400\" y=\"80\" width=\"260\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <line x1=\"430\" y1=\"120\" x2=\"630\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"520\" y=\"112\" font-size=\"10\" fill=\"currentColor\">信号线<\/text>\n  <rect x=\"400\" y=\"120\" width=\"260\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <line x1=\"400\" y1=\"160\" x2=\"660\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"500\" y=\"178\" font-size=\"10\" fill=\"currentColor\">GND<\/text>\n  <text x=\"400\" y=\"210\" font-size=\"11\" fill=\"currentColor\">带状线：上下都有参考，延迟稳定、辐射小<\/text>\n  <text x=\"40\" y=\"255\" font-size=\"12\" fill=\"currentColor\">同样的线宽/介质，微带和带状线阻抗不同；<\/text>\n  <text x=\"40\" y=\"280\" font-size=\"12\" fill=\"currentColor\">等长要“同结构”比较，不能拿微带和带状线直接比长度。<\/text>\n<\/svg>\n```\n\n**看图**：微带的场一部分在空气、一部分在介质；带状线全在介质中，所以 εeff 更稳定、延迟更好算，但布线只能在内层。\n\n### 25.5 选型与降额\n\n| 项目 | 目标 | 说明 |\n|---|---|---|\n| USB2.0 | 90Ω 差分 | 板厂阻抗控制 |\n| HDMI | 100Ω 差分 | 4 对 |\n| DDR | 按手册 | 单端/差分 |\n| 叠层 | 4/6/8 层 | 按速率/成本 |\n| 介质 | FR-4/高速材料 | 按损耗 |\n| 铜厚 | 1oz/0.5oz | 细线用 0.5oz |\n\n#### 25.5.1 阻抗目标怎么定\n\n按接口标准：USB2.0 90Ω差分、USB3 90Ω、HDMI 100Ω、以太网 100Ω、PCIe 85/100Ω、DDR 单端 40～50Ω（按控制器手册）、天线 50Ω。没有标准时按“驱动器/接收器手册”的推荐。目标要写成“Z0±10%”并注明“带阻焊/铜厚”，否则板厂和你的“50Ω”不是同一个。\n\n**课程**：阻抗目标不是“50Ω 万能”，按接口查手册。\n\n#### 25.5.2 叠层方案怎么跟板厂对\n\n给板厂一张叠层表：层号/功能/铜厚/介质材料/介质厚度/阻抗目标/线宽/间距。让板厂回“可生产的叠层+阻抗计算”，双方签字。不要只发“4 层 1.6mm”就让板厂自由发挥；同样“4 层 1.6mm”可以有多种叠层，阻抗差很多。打样前确认“叠层/阻抗”是必须要做的一步。\n\n**课程**：叠层表是“技术合同”，不是“备注”。\n\n#### 25.5.3 成本：层数、材料、工艺\n\n层数越多越贵；高速材料（低损耗）比 FR-4 贵；阻抗控制/背钻/盲埋孔都加钱。选型时算“总成本”：板费+阻抗测试+返工风险。低速产品用 FR-4+4 层；高速长距离再上低损耗/6～8 层。不要“为了跑分”上贵材料，也不要“为了省钱”让阻抗失控。\n\n**课程**：成本要和“能不能做出来”一起算。\n\n#### 25.5.4 降额：阻抗容差与工艺能力\n\n阻抗容差常用 ±10%，高要求 ±7%；板厂能力有限，线宽/介质厚度都有公差。设计时留“阻抗余量”：线宽不要卡在板厂极限；介质厚度选常用 PP 组合；差分间距不要太小（蚀刻/压合偏差大）。评审时问“板厂能不能做到这个线宽/间距”。\n\n**课程**：设计值≠生产值，容差要进预算。\n\n#### 25.5.5 叠层与层间串扰\n\n相邻信号层间距小、同向平行走线长，会串扰。对策：加大层间距、加地平面隔离、走线错开/正交、包地。6 层方案 A 的 L3/L4 相邻，要特别控；8 层“地-信号-地”夹心天然隔离好。评审时看“相邻层是否有长距离平行”。\n\n**课程**：串扰是“叠层+布线”的共同结果。\n\n#### 25.5.6 阻抗与载流的取舍\n\n电源线要宽（载流），信号线要窄（阻抗）；同一层既有电源又有信号时，线宽差异大，蚀刻/阻抗难控。对策：电源单独层/区域，信号按阻抗走；必要时电源用铜皮+过孔。评审时看“电源/信号是否混在同一阻抗层”。\n\n**课程**：别让“电源线”破坏“信号阻抗”。\n\n#### 25.5.7 一张能直接发给板厂的叠层表\n\n| 层 | 功能 | 铜厚 | 材料/PP | 介质厚度 | 阻抗/线宽 |\n|---|---|---|---|---|---|\n| L1 | 信号+器件 | 1oz | — | — | 微带 50Ω / 0.35mm |\n| L1-L2 | 介质 | — | PP 2116×2 | 0.20mm | — |\n| L2 | GND | 1oz | 芯板 | 0.15mm | — |\n| L3 | PWR | 1oz | 芯板 | — | — |\n| L3-L4 | 介质 | — | PP 2116×2 | 0.20mm | — |\n| L4 | 信号 | 1oz | — | — | 微带 50Ω / 0.35mm |\n\n**用法**：把“材料/PP 组合”写成板厂常用型号，让板厂回“可生产/阻抗计算”；不要只写“FR-4 1.6mm”。这张表就是你和板厂之间的“技术合同”。\n\n### 25.6 测量与仿真\n\n#### 25.6.1 阻抗验证\n\n1. 给板厂叠层+阻抗目标。\n2. 板厂回传阻抗报告。\n3. 用 TDR 测样板（有条件）。\n4. 眼图/误码测试。\n\n#### 25.6.2 CircuitJS\n\n```circuitjs\nrc-lowpass-159\n```\n\n用 RC 低通理解“上升沿变慢/带宽限制”。\n\n#### 25.6.3 动手任务\n\n- 画一个 4 层叠层，标出参考面。\n- 用阻抗计算器算 90Ω 差分线宽/间距。\n- 找一条跨分割的线，改布局。\n- 读一份板厂阻抗报告。\n\n#### 25.6.1 TDR 阻抗测试\n\nTDR（时域反射）发一个快沿脉冲，测反射回来的波形，换算出沿线阻抗。看“阻抗是否平/有没有台阶/过孔处下陷”。测试要用“同阻抗探头/短地”，校准开路/短路/50Ω。常见问题：线宽偏差、介质厚度偏差、参考面断开、过孔 stub。TDR 是“验收工具”，不是“调试万能药”。\n\n**课程**：TDR 图上每一个“坑”，都对应一个几何/材料问题。\n\n#### 25.6.2 阻抗测试 coupon\n\n板边做“阻抗测试条（coupon）”：与正式走线同叠层/同线宽/同间距，留测试点。板厂用 coupon 测阻抗，你也可复测。coupon 要标“层/线宽/目标阻抗”，不要只写“50Ω”。没有 coupon，阻抗只能“信板厂”。\n\n**课程**：coupon 是“证据”，不是“装饰”。\n\n#### 25.6.3 眼图与插损\n\n高速链路看眼图/插损（S21）。插损随频率下降，眼图随长度闭合；用 VNA 测 S 参数，或示波器看眼图。预算：驱动器输出→走线损耗→连接器→接收器，留足够余量。眼图闭合先查阻抗/损耗/串扰，不要先换芯片。\n\n**课程**：SI 问题要“看曲线”，不要“凭感觉”。\n\n#### 25.6.4 PDN 阻抗与目标阻抗\n\nPDN（电源分配网络）的阻抗要在“DC～最高频率”内低于目标阻抗：`Ztarget=(Vdd×允许纹波)/最大瞬态电流`。例：1.2V、允许 5%（60mV）、瞬态 2A → Ztarget=30mΩ。电容/平面/VRM 共同决定阻抗曲线；反谐振峰要压平。PI 不是“多放电容”，是“控制阻抗”。\n\n**算例**：0.9V/±3%/1.5A → Ztarget≈18mΩ。\n\n#### 25.6.5 平面谐振与去耦\n\n电源/地平面形成腔体，会在特定频率谐振；谐振点阻抗高，噪声放大。对策：加缝合孔/加去耦/改平面形状/加阻尼。仿真看“平面阻抗 vs 频率”，找出谐振峰；实测用 VNA+探头。4 层板电源/地间距大，谐振更低频，要特别注意。\n\n**课程**：平面不是“理想导体”，它也会“唱歌”。\n\n#### 25.6.6 近场/远场扫描\n\nEMC 预测试用近场探头扫板面，找辐射热点（时钟/电源/接口）；远场在暗室测。热点常对应“回流断点/跨分割/连接器”。整改优先改布局/回流，再加屏蔽/滤波。\n\n**课程**：先找“哪里辐射”，再谈“加什么”。\n\n#### 25.6.7 仿真工具与流程\n\nSI 仿真：叠层/阻抗/拓扑/IBIS → 眼图/串扰；PI 仿真：PDN 阻抗/平面谐振/去耦。流程：建模→扫频→看最坏→改叠层/布线→复算。仿真报告写“模型/条件/结论/风险”，不要只放图。仿真不能替代实测，但能减少打样次数。\n\n**课程**：仿真“算得对”比“算得快”重要。\n\n#### 25.6.8 仿真：RC 低通用的“阻抗/滤波”直觉\n\n用 RC 低通看“不同频率的衰减”，建立“阻抗随频率变化”的直觉：低频几乎不衰减，高频被压。PDN 里的电容/平面也是“随频率变化的阻抗”，不是“一个电容值”。仿真不能代替 SI/PI 工具，但能帮你理解“为什么 0.1μF 在高频有效、10μF 在低频有效”。\n\n```circuitjs\nrc-lowpass-159\n```\n\n**判据**：目标频段内阻抗低于 Ztarget；反谐振峰不超过目标；电容组合覆盖频段。\n\n#### 25.6.9 PDN 阻抗曲线要看什么\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 25-5：PDN 阻抗 vs 频率（目标阻抗线）<\/text>\n  <line x1=\"80\" y1=\"60\" x2=\"80\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"80\" y1=\"230\" x2=\"660\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"70\" font-size=\"11\" fill=\"currentColor\">|Z|<\/text>\n  <text x=\"600\" y=\"255\" font-size=\"11\" fill=\"currentColor\">频率<\/text>\n  <line x1=\"80\" y1=\"120\" x2=\"660\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <text x=\"590\" y=\"112\" font-size=\"10\" fill=\"currentColor\">Ztarget<\/text>\n  <path d=\"M80 132 L160 148 L240 165 L320 150 L400 190 L480 152 L560 172 L660 200\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"292\" y=\"186\" font-size=\"10\" fill=\"currentColor\">反谐振峰<\/text>\n  <text x=\"470\" y=\"215\" font-size=\"10\" fill=\"currentColor\">电容/平面共同作用<\/text>\n  <text x=\"40\" y=\"290\" font-size=\"12\" fill=\"currentColor\">目标：全频段 |Z| 低于 Ztarget；反谐振峰不能翘过线。<\/text>\n<\/svg>\n```\n\n**读法**：低频段靠大电容/VRM，中频靠 0.1μF/平面，高频靠平面电容/封装内电容；某一段“翘起来”，就是那一段缺去耦/有反谐振。\n\n### 25.7 常见坑\n\n1. **叠层没有完整参考面**：阻抗不稳。\n2. **线宽凭经验**：阻抗偏。\n3. **差分线不按叠层算**：90Ω 变 110Ω。\n4. **参考面被切碎**：回流绕远。\n5. **过孔 stub 太长**：高速反射。\n6. **介质厚度不均**：阻抗批次差异。\n7. **电源平面谐振**：PI 噪声。\n8. **不做 TDR/眼图**：问题到现场。\n9. **板厂没做阻抗控制**：报告对不上。\n\n#### 25.7.1 只设线宽，不定叠层\n\n“我要 50Ω，线宽 0.2mm”——没有叠层/介质厚度，这个线宽没有意义。正确顺序：定叠层→算线宽→让板厂确认。评审时看“叠层表+阻抗表”，不是看“线宽数字”；线宽只是叠层算出来的结果。\n\n**课程**：阻抗是“叠层+线宽”的结果，不是“线宽”的属性。\n\n#### 25.7.2 参考面被自己切开\n\n为了“电源分割”把地平面切成几块，信号跨过去，回流断。修法：地平面保持完整，电源分割单独层；必须分割时加桥接/缝合。评审时用“分割线叠图”查。\n\n**课程**：地平面是“公共回流”，不是“可随意切”。\n\n#### 25.7.3 换层不加地孔\n\n信号换层，回流没换，过孔处阻抗突变。修法：每个信号过孔旁 1～2 个地孔；差分对称加。评审时看“过孔阵列”。\n\n**课程**：过孔旁的地孔，是“回流的桥”。\n\n#### 25.7.4 差分对“等长”但不等距\n\n只做了长度匹配，间距忽大忽小，差分阻抗沿线变化，眼图照样差。要求：等宽/等距/同层/连续参考，拐角对称。\n\n**课程**：差分是“阻抗”，不是“两条线”。\n\n#### 25.7.5 叠层不对称/铜不平衡\n\n上下不对称、铜分布不均，压合后翘曲，贴片偏移/焊点开裂。修法：对称叠层、平衡铜、工艺边。评审时看“叠层对称/铜面积”。\n\n**课程**：翘曲是“设计”问题，不是“运气”。\n\n#### 25.7.6 忽略阻焊/铜厚\n\n按“裸铜”算阻抗，实际带阻焊/厚铜，阻抗偏 5%～10%。修法：让板厂按“带阻焊/实际铜厚”算，留容差。\n\n**课程**：阻抗计算要写“工艺条件”。\n\n#### 25.8.1 公式与规则表（扩展）\n\n| 项 | 公式/规则 | 备注 |\n|---|---|---|\n| 微带 Z0 | 87/√(εr+1.41)·ln(5.98h/(0.8w+t)) | 表层 |\n| 带状线 Z0 | 60/√εr·ln(4b/(0.67πw(0.8+t))) | 内层 |\n| 差分 Zdiff | ≈2Z0(1-k) | 间距决定 k |\n| 反射系数 | Γ=(Z1-Z0)/(Z1+Z0) | 不连续 |\n| 传播延迟 | t=length·√εr/c | ≈6～7ps/mm |\n| 目标阻抗 | Ztarget=Vdd·ripple/Imax | PDN |\n| 阻抗容差 | ±10%（高要求 ±7%） | 板厂能力 |\n| 参考面 | 信号正下方连续 | 回流 |\n| 换层 | 伴随地孔 | 回流 |\n| 缝合孔 | 每 5～10mm | 板边/分割 |\n\n#### 25.8.2 术语表（扩展）\n\n**叠层（stackup）**：铜箔/介质/铜箔的排序与厚度表。\n\n**参考面**：信号回流所在的平面（地/电源）。\n\n**微带/带状线**：表层单参考/内层双参考的传输线。\n\n**Z0/Zdiff**：单端/差分特性阻抗。\n\n**TDR**：时域反射，测阻抗。\n\n**Coupon**：板边阻抗测试条。\n\n**PDN**：电源分配网络。\n\n**Ztarget**：目标阻抗，PDN 设计核心。\n\n**反谐振**：电容/电感并联造成的阻抗峰。\n\n**背钻**：去掉过孔 stub 的工艺。\n\n**低损耗材料**：低 tanδ/低粗糙度，用于高速长距离。\n\n### 25.8 本章复盘\n\n#### 25.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 微带 Z0 近似 | 估算 | 最终用板厂 |\n| 差分 90/100Ω | USB/HDMI | 按叠层 |\n| 参考面连续 | 回流 | 不跨分割 |\n| 4 层：信号-地-电源-信号 | 性价比 | 关键信号参考地 |\n| 阻抗报告 | 验证 | 板厂回传 |\n\n#### 25.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| SI | signal integrity | 信号完整性 |\n| PI | power integrity | 电源完整性 |\n| 微带 | microstrip | 表面线 |\n| 带状 | stripline | 内层线 |\n| TDR | time domain reflectometry | 时域反射 |\n| 眼图 | eye diagram | 信号质量图 |\n\n#### 25.8.3 自测 10 题\n\n1. 4 层典型叠层？\n2. 微带和带状线区别？\n3. 特征阻抗由什么决定？\n4. SI 和 PI 分别关心什么？\n5. 回流为什么走最近地？\n6. 跨分割有什么后果？\n7. USB 差分阻抗多少？\n8. 阻抗报告怎么用？\n9. 过孔 stub 有什么影响？\n10. 4/6/8 层怎么选？\n\n**11. 为什么“50Ω 线宽”不能脱离叠层单独给？**\n答：Z0 由线宽、介质厚度、εr、铜厚、参考面共同决定；同一线宽在不同叠层下阻抗差很多，必须“叠层+线宽”一起给。\n\n**12. 信号换层时，回流怎么走？**\n答：回流也要换层；在信号过孔旁放 1～2 个地孔，让回流有低阻抗路径，否则过孔处阻抗突变、辐射增加。\n\n**13. 差分对等长但不等距，会怎样？**\n答：差分阻抗沿线变化，产生反射/共模噪声，眼图变差；必须等宽、等距、同层、连续参考。\n\n**14. PDN 的目标阻抗怎么算？**\n答：Ztarget=(Vdd×允许纹波比例)/最大瞬态电流；例如 1.2V、5%、2A → 30mΩ。\n\n**15. 4 层板为什么更容易出 SI 问题？**\n答：只有一层地/一层电源，参考面有限，信号跨分割/换层时回流路径更容易被切断；高速信号多时余量小。\n\n#### 25.8.4 能力清单\n\n- [ ] 能画 4/6/8 层叠层。\n- [ ] 能算/查微带/带状阻抗。\n- [ ] 能解释反射/串扰/回流。\n- [ ] 能给板厂阻抗目标并读报告。\n- [ ] 能用 TDR/眼图验证。\n\n- [ ] 能画 4/6/8 层叠层，标清铜厚/介质/阻抗目标。\n- [ ] 能算/查微带、带状线、差分阻抗，并给板厂书面参数。\n- [ ] 能解释反射、串扰、回流路径、跨分割的因果关系。\n- [ ] 能给板厂阻抗目标，会读 coupon/TDR 报告并判断合格。\n- [ ] 能用眼图/插损/PDN 阻抗验证 SI/PI，能定位“哪一段”超标。\n- [ ] 能在评审里逐条问“参考面是哪层、换层有没有地孔、差分等不等距”。\n\n#### 25.8.5 复盘清单\n\n1. 叠层表有没有写“铜厚/介质/PP 组合/阻抗目标”？\n2. 每条高速线是否都有连续参考面？跨分割的有几处、为什么允许？\n3. 换层处是否都加了伴随地孔？差分是否对称？\n4. 差分对是否等宽/等距/同层/等长？拐角是否对称？\n5. 阻抗 coupon 是否做了？板厂报告是否在 ±10% 内？\n6. PDN 是否算了 Ztarget？反谐振峰是否压住？\n7. 叠层是否对称、铜是否平衡？会不会翘曲？\n8. 是否给下一章（EMC）留了“地平面/缝合孔/滤波”的接口？\n\n**课程**：这 8 条过一遍，比“再看十篇公众号”有用。\n\n#### 25.8.6 动手练习与延伸\n\n**练习一**：拿一块 4 层板，量出叠层（板厚/铜厚/介质），用微带公式反算 50Ω 需要的线宽，再和实际线宽对比，差多少？为什么？\n\n**练习二**：找一条换层的信号，看旁边有没有地孔；没有的话，想象回流绕多远、在哪个频率开始“难受”。\n\n**练习三**：给一块 1.2V 核心板算 Ztarget（假设瞬态 3A、允许 4%），再看板上电容组合够不够覆盖频段。\n\n**延伸**：SI/PI 是“电磁场+电路+工艺”的交叉；先把本章的“叠层/阻抗/回流/PDN”四件事做扎实，再去看 HFSS/ADS 的教程，才不会“会点软件但不会判断”；先能判断，再谈工具。\n\n#### 25.8.7 下一章\n\n下一章讲**EMC/ESD 与防护设计**：高速板不仅要“自己跑得稳”，还要“不干扰别人、不被别人干扰”。","taskSignature":"9ed42d224a126e13de599a838832843d5f3cfe33dbdfa1b39fab85d96998eb5d","taskCount":11},{"id":"26","title":"第 26 章 · EMC/ESD 与防护设计","short":"EMC/ESD 与防护设计","stage":4,"diff":4,"prev":"第 25 章 叠层、阻抗与 SI/PI 基础","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 区分 EMI（发射）与 EMS（抗扰），理解 EMC = 两者之和。\n2. 说清辐射/传导的常见耦合路径，以及板级抑制手段。\n3. 设计接口 ESD、电源浪涌、信号滤波的保护链。\n4. 处理屏蔽、接地、电缆、缝隙、共模电流。\n5. 做一次 EMC 预测试（近场探头/频谱仪）并定位噪声源。\n6. 区分“过认证”和“现场稳定”的差别。\n7. 说出至少 8 个 EMC 设计常见坑。\n\nEMC 不是“加个磁珠”，是“从源头减小、从路径阻断、从敏感体加固”。板级 EMC 做不好，认证要整改，现场还会死机。\n\n## 正文\n\n### 26.1 它解决什么问题：三个真实场景\n\n#### 场景一：DC-DC 辐射超标，30～100MHz 包络\n\nBuck 的 SW 节点/输入环路大，辐射发射超标。改布局（输入电容紧靠、SW 短粗）、加 snubber/屏蔽，辐射下降。\n\n#### 场景二：RS485 现场通信，雷击/浪涌打坏收发器\n\n接口只加了普通 TVS，浪涌能量太大，TVS 失效。要加气体放电管/压敏+TVS 两级，配合隔离。\n\n#### 场景三：塑料外壳缝隙漏辐射\n\n板子本身辐射不大，但外壳缝隙像“天线”，特定频率泄漏。屏蔽要连续，缝隙长度小于最高频率波长 1/20。\n\n### 26.2 它是什么：EMC 的三要素\n\nEMC（Electromagnetic Compatibility，电磁兼容）= EMI（发射）+ EMS（抗扰）。\n\n三要素：\n\n- **源**：开关电源、时钟、高速总线、继电器。\n- **路径**：传导（线缆/电源）、辐射（空间）、耦合（电容/电感）。\n- **敏感体**：MCU、ADC、通信、传感器。\n\n> **术语第一次出现**：共模电流（common-mode current）是两根线/地之间同向流动的电流，是电缆辐射的主因。差模是两根线反向流动。\n\n#### 26.2.1 EMC 三要素：源、路径、敏感体\n\nEMC（电磁兼容）= EMI（发射）+ EMS（抗扰）。任何问题都能拆成三要素：**干扰源**（开关电源/时钟/电机/继电器）、**耦合路径**（导线/PCB 走线/空间辐射/共模）、**敏感体**（MCU/ADC/通信接收）。整改的顺序是“先找路径，再改源或改敏感体”；只改一处往往“按下葫芦浮起瓢”。评审时用这张三要素表逐项填，比“凭经验加磁珠”靠谱；填不出来的那一格，就是你要补的知识点。\n\n**课程**：EMC 不是“玄学”，是“源-路径-敏感体”的排列组合。\n\n#### 26.2.2 差模与共模：两种完全不同的干扰\n\n**差模**：干扰出现在两条线之间，电流方向相反，靠“线间滤波/去耦”解决。\n\n**共模**：干扰同时出现在两条线上（对地同相），靠“共模电感/ Y 电容/屏蔽/接地”解决。\n\n辐射主要是共模（电缆/板边像天线）；传导既有差模也有共模。整改先判断“差模还是共模”：看换一根电缆/拔掉某根线是否变化；共模问题常与“接地/屏蔽/电缆”有关。\n\n**课程**：分不清差模共模，就会“乱加电容”。\n\n#### 26.2.3 天线效应：走线和电缆都是“天线”\n\n一段走线/一根电缆，长度接近 λ/4 时会高效辐射/接收。λ=c/f：30MHz→10m，100MHz→3m，1GHz→30cm。所以“长电缆/长排线”在几十 MHz 就容易超标；板边/缝隙尺寸接近 λ/2 也会漏。对策：缩短、屏蔽、加共模扼流、降低边沿速率（ slew rate）。\n\n**课程**：EMC 里“长度”比“器件”更关键。\n\n#### 26.2.4 频谱：方波边沿决定高频含量\n\n理想方波的谐波按 1/n 衰减，边沿越陡，高频分量越强。上升时间 tr 对应的“拐点频率”约 `f≈0.35/tr`；tr=1ns→350MHz。所以“时钟 24MHz 但辐射到 300MHz”很常见。对策：串联电阻/磁珠/降低驱动强度/展频（spread spectrum），让边沿“慢一点”。\n\n**算例**：tr=2ns → 拐点约 175MHz；超过拐点后谐波快速下降。\n\n#### 26.2.5 接地：EMC 的“地基”\n\n接地不是“接到地皮”，是“给回流一个低阻抗路径”。单点接地/多点接地/混合接地按频率选：低频单点，高频多点；射频/屏蔽用多点。地平面完整、地过孔密集、接口地/数字地/模拟地分区，是 EMC 的基础。地不好，滤波/屏蔽都“浮在空中”。\n\n**课程**：EMC 整改先看地，再看滤波。\n\n#### 26.2.6 屏蔽：缝隙比材料更重要\n\n屏蔽体的效能取决于“缝隙/开孔尺寸”，不是“板厚/材料厚度”。缝隙长度接近 λ/2 会漏；对策：缩短缝隙、加导电衬垫/簧片、开孔改小孔阵列、螺钉间距 <λ/20。塑料外壳内喷导电漆/贴铜箔也有效，但“缝隙”仍是短板。\n\n**课程**：屏蔽不是“盖个铁盒”，是“把缝堵住”。\n\n#### 26.2.7 滤波：接口的第一道防线\n\n接口滤波按“先共模后差模、先粗后细”排列：气体放电管/压敏（粗保护）→ TVS/共模电感（中级）→ RC/磁珠/电容（细滤波）。滤波器要“就近接口、地回路短”，否则高频旁路失效。不要“一个磁珠包打天下”。\n\n**课程**：滤波器的位置比型号更重要。\n\n#### 26.2.8 ESD：静电放电的三种破坏\n\n**硬失效**：器件击穿/烧毁（TVS 没扛住）。\n\n**软失效**：复位/死机/数据错（地弹/瞬态耦合）。\n\n**潜在失效**：参数漂移（多次小能量累积）。\n\nESD 模型：人体模型 HBM（±几 kV）、机器模型 MM、系统级 IEC 61000-4-2（接触 ±4/8kV、空气 ±8/15kV）。防护思路：泄放（TVS/火花间隙）→ 限流（串阻/磁珠）→ 隔离（光耦/隔离器）→ 屏蔽/接地。\n\n**课程**：ESD 不是“加个 TVS 就行”，是“泄放路径+地”。\n\n### 26.3 关键参数与标准\n\n| 项目 | 典型要求 | 说明 |\n|---|---|---|\n| 辐射发射 | CISPR 32/EN 55032 | 30MHz～1GHz |\n| 传导发射 | CISPR 32 | 150kHz～30MHz |\n| ESD 抗扰 | IEC 61000-4-2 | ±4/8kV |\n| 浪涌 | IEC 61000-4-5 | 1/2kV |\n| 群脉冲 | IEC 61000-4-4 | 1/2kV |\n| 电压跌落 | IEC 61000-4-11 | 按产品 |\n\n#### 26.3.1 发射标准：EN 55032 / CISPR 32\n\n这类标准管“设备往外辐射/传导多少”。半导体/信息技术设备分 Class A（工业）和 Class B（家用），B 类限值更严（约低 10dB）。测试项：辐射发射（30MHz～1GHz/更高）、传导发射（150kHz～30MHz）、谐波/闪烁。整改目标通常按“留 6dB 余量”设计，不要卡着限值过。\n\n**课程**：标准是“及格线”，量产要留余量。\n\n#### 26.3.2 抗扰标准：IEC 61000-4 系列\n\n-4-2 ESD：接触放电 ±4kV（Level 2）/±8kV（Level 3/4），空气 ±8/15kV。\n-4-3 辐射抗扰：80MHz～6GHz，场强 3/10V/m。\n-4-4 EFT/Burst：电源口 ±2kV、信号口 ±1kV（Level 3）。\n-4-5 Surge：电源口 1.2/50μs+8/20μs，±1/2kV。\n-4-6 传导抗扰
