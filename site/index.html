dth=\"2\"/>\n  <text x=\"530\" y=\"235\" font-size=\"12\" fill=\"currentColor\">ADC/运放<\/text>\n<\/svg>\n```\n\n#### 13.3.1 电感与电容：按纹波和饱和电流选\n\nBuck 的电感不是随便选一个值。它决定电感电流纹波、输出纹波、环路响应。\n\n**电感纹波电流**：\n\n`ΔIL = (Vin − Vout) × D / (L × fsw)`，其中 `D = Vout / Vin`。\n\n简化成 `ΔIL = Vout × (1 − D) / (L × fsw)`。\n\n算例：Vin=12V，Vout=5V，fsw=500kHz，L=10μH。\n\n`D = 5/12 ≈ 0.417`，`1−D = 0.583`。\n\n`ΔIL = 5 × 0.583 / (10e-6 × 500e3) = 2.915 / 5 ≈ 0.583A`。\n\n如果输出电流 2A，纹波电流约 0.58A，峰峰值约 0.58A，峰值电流 `2 + 0.29 = 2.29A`。\n\n**饱和电流**：电感的饱和电流 `Isat` 要大于峰值电流，并留 30% 余量。`Isat ≥ 2.29 × 1.3 ≈ 3A`。饱和后电感量骤降，电流猛增，开关管可能烧。选电感要看 `Isat`，不能只看标称电感值。\n\n**直流电阻（DCR）**：DCR 带来 `I²R` 损耗。2A 电流、DCR=50mΩ，损耗 `2² × 0.05 = 0.2W`。小封装电感 DCR 大，效率低；大封装 DCR 小，但占板面积。\n\n**输出电容**：输出纹波由两部分组成：电容充放电的容性纹波 `ΔVc = ΔIL / (8 × fsw × Cout)`，以及 ESR 带来的纹波 `ΔVesr = ΔIL × ESR`。\n\n算例：`ΔIL=0.58A`，`fsw=500kHz`，`Cout=47μF`，`ESR=10mΩ`。\n\n`ΔVc = 0.58 / (8 × 500e3 × 47e-6) = 0.58 / 188 ≈ 3.1mV`。\n\n`ΔVesr = 0.58 × 0.01 = 5.8mV`。\n\n总纹波约 9mV。实际还要加 PCB 寄生、负载瞬态，可能更大。输出电容要选低 ESR，纹波电流额定值要大于 `ΔIL` 的有效值。\n\n**输入电容**：输入电容承受脉冲电流，纹波电流大。选陶瓷电容（低 ESR）+ 大容量电解/钽电容组合。陶瓷电容靠近开关管，电解电容放在稍远处，形成“高频+低频”组合。\n\n**降额**：电容的工作电压要留 50% 余量（陶瓷电容可以留 30%，但直流偏压会让容量下降）；纹波电流要留 50% 余量；电感 `Isat` 留 30% 余量。\n\n#### 13.4.6 电源保护：反接、过压、过流、浪涌\n\n电源入口是整块板最危险的地方。插反、浪涌、过压、短路，都可能一次烧掉整板。保护要放在入口，不能放在负载旁边。\n\n**反接保护**：最简单的是串联肖特基二极管，正常工作时压降 0.3～0.5V，2A 电流就是 0.6～1W 损耗。大电流场合用 P-MOS 低边/高边开关，导通电阻小，压降小。P-MOS 反接保护要注意栅极钳位，输入浪涌时 `Vgs` 不能超限。\n\n**过压保护（OVP）**：用 TVS 或专用 OVP 芯片。TVS 响应快，但钳位电压是“浪涌电流下的残压”，不是精确阈值；OVP 芯片用分压检测，超过阈值拉断开关，精度高但响应慢。两者可以组合：TVS 扛瞬态，OVP 扛持续过压。\n\n**过流保护（OCP）**：保险丝、PTC、电子熔断器（eFuse）。保险丝便宜，但熔断后要更换；PTC 可恢复，但动作慢、有电阻；eFuse 精度高、可恢复，成本高。课程项目用保险丝 + TVS 即可，大电流/电池产品考虑 eFuse。\n\n**浪涌**：接口拔插、雷击感应、电机反电动势都会产生浪涌。TVS 要选“ standoff 电压高于最高工作电压、钳位电压低于后级绝对最大额定值”的型号。TVS 的功率额定值按浪涌波形（8/20μs 等）选，不能只看稳态。\n\n**浪涌与保险丝的配合**：TVS 先把浪涌钳住，保险丝再慢慢熔断。如果保险丝太快，浪涌没到 TVS 就断了；如果太慢，TVS 会被烧。两者要按浪涌能量配合，不能各自拍脑袋。\n\n**保护器件的布局**：保护器件要靠近连接器，地回路短；TVS 的地要在接口地，不能拉到板子另一头。保护器件后面的走线要“短、粗”，减少残压路径。\n\n### 13.5 选型与降额\n\n| 场景 | 推荐 | 不推荐 |\n|---|---|---|\n| 压差大、电流大 | Buck | LDO（烫） |\n| 压差小、纹波要求低 | LDO | Buck（噪声） |\n| 输入低于输出 | Boost | LDO（不能升压） |\n| 电池产品 | 低 Iq LDO/Buck | 高静态电流 |\n| 多路时序 | PMU/使能电路 | 直接并联 |\n\n降额：\n\n- 电感饱和电流 ≥ 峰值电流 ×1.3。\n- 输出电容纹波电流 ≥ 计算值 ×1.5。\n- Buck 的 Vin 瞬态留 20% 余量。\n- LDO 结温留 20℃ 余量。\n\n#### 13.3.2 反馈分压与环路：输出为什么不准\n\nBuck/LDO 的输出电压由反馈分压电阻决定：\n\n`Vout = Vref × (1 + R1/R2)`，其中 `Vref` 是芯片内部基准，`R1` 是上分压（Vout 到 FB），`R2` 是下分压（FB 到地）。\n\n算例：`Vref=0.8V`，要 `Vout=3.3V`，则 `R1/R2 = 3.3/0.8 − 1 = 3.125`。取 `R2=10kΩ`，`R1=31.25kΩ`，用 31.6kΩ 标准值，实际 `Vout=0.8×(1+3.16)=3.328V`，误差约 0.85%。\n\n**分压电阻的精度**：1% 电阻带来的输出误差约 1%，加上基准误差、温度漂移，总误差可能 2%～3%。ADC 供电要求高时，要用 0.1% 电阻或可调基准。\n\n**FB 走线**：FB 是高阻节点，容易被噪声干扰。走线要短，远离 SW、电感、时钟；FB 分压电阻靠近芯片，不要拉长线。FB 节点下面尽量不要走其他信号，必要时包地。\n\n**环路稳定性**：Buck 是负反馈系统，环路增益/相位决定稳定性。输出电容的 ESR、电感、补偿网络都会影响。芯片手册通常给“推荐输出电容范围”和“补偿元件值”，不要随便改。改电容值/ESR 后，要做负载瞬态测试，看有没有振荡。\n\n**前馈电容**：有些 Buck 在 R1 上并一个小电容（前馈电容），改善瞬态响应。电容值按手册，太大会导致环路不稳。课程项目先用手册推荐值，不要凭感觉加。\n\n**LDO 的反馈**：LDO 内部已经补偿，外部只需按手册选输入/输出电容。有些 LDO 要求输出电容有最小 ESR，ESR 太小反而振荡；有些要求陶瓷电容。看手册的“稳定工作范围”，不能随便换电容类型。\n\n#### 13.5.1 电源树核算表：每路都要有数字\n\n画电源树不是画几个框，而是给每一路填数字。建议用一张表：\n\n| 轨 | 输入 | 输出 | 最大电流 | 效率 | 损耗 | 负载 |\n|---|---|---|---|---|---|---|\n| 5V | 12V | 5V | 2A | 90% | 1.1W | USB/继电器 |\n| 3.3V | 5V | 3.3V | 0.5A | 66% | 0.85W | MCU/数字 |\n| 1.8V | 3.3V | 1.8V | 0.3A | 55% | 0.82W | DDR/模拟 |\n\n损耗算法：`P_loss = P_out × (1/η − 1)`。5V/2A 输出 10W，效率 90%，损耗 `10 × (1/0.9 − 1) = 1.11W`。3.3V/0.5A 输出 1.65W，效率 66%，损耗 `1.65 × (1/0.66 − 1) ≈ 0.85W`。\n\n每一路的损耗要加总，和输入功率比较，看总效率；每一路的发热要单独算，看封装/铜箔能不能承受。电源树不是“电压关系图”，是“功率/热/成本”的账本。\n\n**电流预算**：每个负载的电流要按最坏情况填，不能按典型值。MCU 标称 50mA，外设全开可能 150mA；USB 标称 500mA，瞬态可能 1A。电流预算留 30% 余量，电源芯片按“峰值”选，不按“平均”选。\n\n**时序列**：电源树表里加一列“上电顺序/延迟”，标清哪路先上、哪路后上、间隔多少。没有时序要求的，也要写“无”，不要空着。\n\n### 13.6 测量与仿真\n\n#### 13.4.4 上电时序与使能：多路电源不能一起上\n\n多路电源的板子，上电顺序不对，芯片可能起不来，甚至损坏。\n\n**为什么要时序**：\n\n- FPGA/SoC 通常要求核心电压先上、IO 后上，或者反过来；顺序错了，内部 ESD 二极管导通，电流倒灌。\n- 多路电源同时上电，浪涌电流叠加，输入电源可能跌电。\n- 模拟电路和数字电路的上电顺序影响初始化，顺序错了，MCU 可能锁死。\n\n**时序实现方式**：\n\n1. **使能级联**：第一路电源的 Power Good（PG）信号接到第二路的 EN，第一路稳定后第二路才开。简单、便宜，但依赖 PG 的阈值和延迟。\n2. **RC 延迟**：用 RC 给 EN 脚做延迟，成本低，但精度差，受温度/电容容差影响。\n3. **PMU/时序芯片**：专用 PMU 或 S equencer，按固定顺序/延迟控制多路，精度高，成本高。\n4. **MCU 控制**：MCU 上电后逐个拉 EN，灵活，但 MCU 自己要先有电。\n\n**Power Good**：PG 是开漏/推挽输出，表示输出电压在范围内。PG 的阈值、延迟、滤波要按手册。PG 上拉电阻不能太大，否则上升沿慢，下一路使能延迟。\n\n**断电顺序**：断电时，电容放电顺序也要考虑。大电容放得慢，小电容放得快，可能出现“某路先掉、另一路还在”的倒灌。必要时加放电电阻或主动放电电路。\n\n**课程项目**：一路 12V→5V→3.3V，可以用 5V 的 PG 控制 3.3V 的 EN；如果没有 PG，用 RC 延迟 + 使能分压。上电后用示波器四通道抓 12V、5V、3.3V、EN，确认顺序和间隔。\n\n#### 13.6.3 纹波与负载瞬态怎么测才准\n\n测纹波最容易犯的错，是用长地线。示波器探头的地线夹子像一根天线，会拾取开关噪声，测到的“纹波”其实是探头噪声。\n\n**正确测法**：\n\n1. 示波器带宽限制到 20MHz，打开 AC 耦合；\n2. 用探头尖端直接接触输出电容的焊盘，地线用最短的弹簧地/同轴转接；\n3. 测点选在输出电容旁边，不要选在负载远端；\n4. 记录峰峰值、有效值，不要只看平均值；\n5. 分别测空载、50%、100% 负载，看纹波随负载变化。\n\n**负载瞬态**：用电子负载或 MOSFET+电阻做阶跃，从 10% 到 90% 负载，上升时间尽量快（比如 10μs）。看输出电压的跌落/过冲和恢复时间。跌落超过芯片允许范围，说明输出电容不够或环路响应慢。\n\n**上电时序**：四通道示波器同时抓 Vin、Vout1、Vout2、EN。触发设在 Vin 上升沿，看每路的上升时间、间隔、是否有倒灌。没有四通道，可以两两抓，但要注意共地。\n\n**效率测量**：同时测输入电压/电流、输出电压/电流，`η = (Vout×Iout)/(Vin×Iin)`。注意电流表的内阻会影响结果，尽量用高精度分流器/电子负载。\n\n**热测量**：用热电偶或热像仪测芯片表面/电感/二极管温度。热电偶要贴紧，不要悬空；热像仪要注意发射率。温升 = 稳定温度 − 环境温度，按最坏负载测。\n\n#### 13.6.1 测电源轨\n\n1. 限流上电，先测 Vin。\n2. 测每路 Vout，空载/满载。\n3. 示波器 AC 耦合测纹波，带宽 20MHz。\n4. 测负载瞬态：从 10% 到 90% 负载，看跌落/恢复。\n\n#### 13.4.5 电源布局六军规：每条都在保环路\n\n电源布局的六条“军规”，本质都是“让脉冲电流在本地闭合、让敏感节点远离噪声”。\n\n**第一，输入电容紧靠开关管**。输入电容的 GND 和开关管的 GND/Source 要在同一个铜皮上，走线短、过孔少。电容离得远，脉冲电流沿长线流，寄生电感产生尖峰。\n\n**第二，SW 走线短、粗**。SW 节点是噪声源，走线越长，辐射和耦合越大。SW 到电感的走线要短，宽度按电流，下面不要走 FB/模拟信号。\n\n**第三，环路最小**。高边开关、低边开关、输入电容、电感组成的环路面积要小。环路面积越大，寄生电感越大，EMI 越强。布局时把这三个器件围成一个紧凑的“功率三角”。\n\n**第四，FB 远离噪声**。FB 走线短，分压电阻靠近芯片，远离 SW/电感。FB 节点不要包在功率环路里。\n\n**第五，单点接地**。功率地（输入电容、开关管、电感）和信号地（FB、控制芯片）分开走，在芯片的 GND 脚附近单点汇合。不是“整板只留一个地”，而是“功率地不在信号地里乱窜”。\n\n**第六，散热过孔**。芯片的 EP/散热焊盘下方打孔，连到背面铜箔。过孔孔径 0.3mm、间距 1.0～1.2mm，盖油或开窗按工艺。散热过孔不够，结温超限，芯片热保护/寿命下降。\n\n**布局顺序**：先放连接器/输入电容/开关管/电感/输出电容，形成功率路径；再放 FB/补偿/使能；最后放指示灯/测试点。功率路径优先，信号让位。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 13-4：Buck 功率环路与输入电容位置<\/text>\n  <rect x=\"80\" y=\"90\" width=\"100\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"125\" font-size=\"12\" fill=\"currentColor\">输入电容<\/text>\n  <rect x=\"240\" y=\"90\" width=\"90\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"255\" y=\"125\" font-size=\"12\" fill=\"currentColor\">HS 开关<\/text>\n  <rect x=\"240\" y=\"200\" width=\"90\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"255\" y=\"230\" font-size=\"12\" fill=\"currentColor\">LS 开关<\/text>\n  <path d=\"M360 120 Q390 95 420 120 Q450 145 480 120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"410\" y=\"90\" font-size=\"12\" fill=\"currentColor\">L<\/text>\n  <line x1=\"480\" y1=\"120\" x2=\"540\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"500\" y=\"110\" font-size=\"11\" fill=\"currentColor\">Vout<\/text>\n  <line x1=\"540\" y1=\"120\" x2=\"540\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"170\" x2=\"560\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"530\" y1=\"178\" x2=\"550\" y2=\"178\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"540\" y1=\"178\" x2=\"540\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"215\" x2=\"560\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"565\" y=\"180\" font-size=\"11\" fill=\"currentColor\">Cout<\/text>\n  <line x1=\"180\" y1=\"120\" x2=\"240\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"180\" y1=\"150\" x2=\"180\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"180\" y1=\"220\" x2=\"240\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"120\" x2=\"360\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"220\" x2=\"360\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"220\" x2=\"360\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"340\" y1=\"250\" x2=\"380\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"330\" y=\"275\" font-size=\"11\" fill=\"currentColor\">GND<\/text>\n  <text x=\"80\" y=\"310\" font-size=\"12\" fill=\"currentColor\">Cin 紧靠 HS/LS，脉冲电流在本地闭合；功率三角越小，寄生电感越低。<\/text>\n<\/svg>\n```\n\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 13-5：使能级联与上电时序<\/text>\n  <rect x=\"60\" y=\"70\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"100\" font-size=\"12\" fill=\"currentColor\">5V Buck<\/text>\n  <rect x=\"250\" y=\"70\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"100\" font-size=\"12\" fill=\"currentColor\">PG / EN<\/text>\n  <rect x=\"440\" y=\"70\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"460\" y=\"100\" font-size=\"12\" fill=\"currentColor\">3.3V LDO<\/text>\n  <line x1=\"180\" y1=\"95\" x2=\"250\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"370\" y1=\"95\" x2=\"440\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"190\" y=\"85\" font-size=\"10\" fill=\"currentColor\">PG<\/text>\n  <text x=\"380\" y=\"85\" font-size=\"10\" fill=\"currentColor\">EN<\/text>\n  <line x1=\"60\" y1=\"190\" x2=\"620\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"60\" y1=\"240\" x2=\"620\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M80 190 L140 190 L160 160 L520 160 L540 190 L620 190\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M80 240 L210 240 L230 210 L520 210 L540 240 L620 240\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"70\" y=\"150\" font-size=\"11\" fill=\"currentColor\">5V<\/text>\n  <text x=\"70\" y=\"265\" font-size=\"11\" fill=\"currentColor\">3.3V<\/text>\n  <text x=\"300\" y=\"285\" font-size=\"12\" fill=\"currentColor\">5V 稳定后 PG 拉高，3.3V EN 才使能；间隔按手册。<\/text>\n<\/svg>\n```\n\n#### 13.6.2 CircuitJS\n\n```circuitjs\npower-buck\n```\n\n观察 SW 节点、电感电流、输出纹波。把输入电容移远，观察纹波变化（仿真里用导线电阻模拟）。\n\n#### 13.6.4 用电感反电动势理解续流\n\nBuck 的续流不是“可选功能”，是电感电流不能突变的必然结果。电感断电瞬间，`V = L × di/dt`，电流变化越快，感应电压越高。没有续流路径，这个电压会击穿开关管。\n\n```circuitjs\ninductkick-snub\n```\n\n先看没有续流二极管时，开关关断瞬间电感上的电压尖峰；再加上续流二极管/RC 吸收，看尖峰怎么被压下去。Buck 的低边开关就是“同步续流”，作用一样：给电感电流一条回路。\n\n#### 13.6.3 动手任务\n\n- 画一棵 `12V→5V→3.3V` 电源树。\n- 算 LDO 在 12V→3.3V、300mA 时的功耗/温升。\n- 给 Buck 选电感/电容，记录饱和电流/纹波电流。\n- 测一块板的上电时序，记录每路电压。\n\n### 13.7 常见坑\n\n1. **LDO 压差大、电流大**：功耗超限，烫/保护。先算 `(Vin−Vout)×Iout`，再决定用不用 LDO。\n2. **Buck 输入电容放远**：SW 环路大，纹波/EMI 差。电容要贴着开关管的 Vin/GND 脚。\n3. **FB 走线靠近 SW/电感**：反馈被噪声干扰，输出不稳。FB 是高阻节点，要走短、包地。\n4. **电感饱和电流不够**：大电流饱和，电感变成“导线”，烧开关管。按峰值电流留 30%。\n5. **输出电容太小/ESR 不合适**：纹波大/环路不稳。按手册范围选，不随便换类型。\n6. **多路电源直接并联**：倒灌/环流。不同输出电压的电源不能直接并，必须加 OR-ing 二极管/理想二极管。\n7. **忽略上电时序**：芯片起不来/损坏。核心/IO 顺序按手册，不能“一起上”。\n8. **散热焊盘没打孔**：结温超限。EP 下方要打过孔阵列，连到背面铜箔。\n9. **测纹波用长地线**：测到的是探头噪声。用弹簧地/同轴转接，测点选在输出电容旁。\n\n### 13.8 本章复盘\n\n#### 13.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| `P_LDO=(Vin−Vout)×Iout` | LDO 功耗 | 加 Iq 项 |\n| `ΔT=P×θJA` | 温升 | 按实际铜箔/散热 |\n| `D=Vout/Vin` | Buck 占空比 | 连续导通模式 |\n| `ΔIL=Vin×D/(L×fsw)` | 电感纹波 | 选饱和电流 |\n| 输入电容紧靠 | 环路最小 | SW 短粗 |\n| FB 远离 SW | 反馈稳定 | 走线短、包地 |\n\n#### 13.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| LDO | low dropout regulator | 低压差线性稳压 |\n| Buck | step-down converter | 降压开关电源 |\n| Boost | step-up converter | 升压开关电源 |\n| SW 节点 | switch node | 开关管与电感连接点 |\n| 电源树 | power tree | 输入到各级负载的供电关系 |\n| 纹波 | ripple | 输出直流上的交流波动 |\n| 时序 | sequencing | 多路电源上电顺序 |\n\n#### 13.8.3 自测 10 题\n\n1. LDO 和 Buck 的本质区别？\n2. 12V→3.3V、500mA 为什么不能用 LDO？\n3. Buck 的 SW 节点为什么是噪声源？\n4. 输入电容为什么紧靠开关管？\n5. 电感饱和电流怎么选？\n6. FB 走线为什么要远离 SW？\n7. 多路电源为什么要时序？\n8. LDO 功耗怎么算？\n9. 纹波怎么测才准？\n10. 电源树要标哪些信息？\n\n#### 13.8.4 能力清单\n\n- [ ] 能画 Buck/Boost/LDO 拓扑并解释电流路径。\n- [ ] 能画电源树并做方案选型。\n- [ ] 能算 LDO 功耗/温升、选电感/电容。\n- [ ] 能按六条军规布局电源。\n- [ ] 能测电源轨、纹波、时序。\n\n#### 13.8.6 电源设计评审清单\n\n投板前逐条核对，每条都要能指到图上的位置：\n\n1. 每一路输出都有电源树记录：输入、输出、最大电流、效率、损耗；\n2. LDO 的功耗/温升算过，结温留 20℃ 余量；\n3. Buck 的电感 `Isat` ≥ 峰值电流 ×1.3，DCR 损耗算过；\n4. 输出电容的容性纹波 + ESR 纹波算过，纹波电流留 50% 余量；\n5. 输入电容紧靠开关管，功率三角面积最小；\n6. SW 走线短、粗，下方没有 FB/模拟信号；\n7. FB 分压电阻靠近芯片，走线短、包地；\n8. 多路电源有时序设计，PG/EN 连接正确；\n9. 电源入口有反接/过压/过流/浪涌保护；\n10. 散热焊盘打过孔，背面铜箔面积够；\n11. 每路电源都有测试点，纹波测点选在输出电容旁；\n12. 上电用限流电源，先空载后满载，记录每路电压/纹波/温升。\n\n评审不是“看一眼觉得行”，是“每个数字都有出处、每个器件都有位置”。电源出问题，后面全板连坐，这一步不能省。\n\n#### 13.8.5 下一章\n\n下一章讲**接口、ESD 与保护**：电源把板子点亮，接口把板子连到外部世界。USB、HDMI、RJ45、TF 卡这些接口，是 ESD 和浪涌最容易打进来的地方。","taskSignature":"287f39e4a38443d18912f9f84ffda0b0526dc31479c3de5d8e056d7756d47064","taskCount":5},{"id":"14","title":"第 14 章 · 接口、ESD 与保护","short":"接口、ESD 与保护","stage":2,"diff":3,"prev":"第 13 章 电源模块与电源树","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用“协议→电路→布局”三段式拆解一个没见过的接口。\n2. 说清 USB 2.0/3.0、HDMI、RJ45、TF/SIM 的信号组成与差分要求。\n3. 给接口加 ESD/TVS、限流、共模电感，并解释保护器件放在哪。\n4. 区分 ESD 二极管、TVS、压敏电阻、保险丝的适用场景。\n5. 处理连接器屏蔽、接地、机械固定与热插拔。\n6. 用万用表/示波器检查接口电源、差分、保护器件。\n7. 说出至少 8 个接口设计常见坑。\n\n接口是板子上“事故率最高”的区域：要反复插拔、承受静电/浪涌、跑高速信号。接口设计不是“把连接器画上去”，而是“协议、保护、布局”三件事一起做。\n\n## 正文\n\n### 14.1 它解决什么问题：三个真实场景\n\n#### 场景一：USB 插拔时静电打坏 MCU\n\nUSB 连接器金属外壳/差分线直接连到 MCU，人体静电从接口打进来，MCU 的 USB 引脚击穿。加 ESD 二极管/TVS，放在连接器入口，让浪涌在接口处泄放，不要跑到芯片。\n\n#### 场景二：RJ45 网口能通但不稳定，差分对没按规则走\n\n百兆/千兆网口的 TX/RX 差分对没有等长、参考平面被分割，眼图闭合，丢包。以太网变压器/PHY 的布局和差分阻抗必须按规范。\n\n#### 场景三：TF 卡插拔后数据损坏，电源没有去耦/保护\n\nTF 卡座没有电源去耦，插拔瞬间电流突变，卡内数据写坏。卡座电源脚加 100nF+10μF，信号线加 ESD，插拔检测加 RC 去抖。\n\n### 14.2 它是什么：接口的三段式\n\n**协议**：这个接口有哪些信号、速率、电平、差分/单端、阻抗。\n**电路**：连接器、保护、匹配、变压器/共模电感、上下拉。\n**布局**：连接器靠板边、差分对、参考平面、ESD 器件位置、机械固定。\n\n> **术语第一次出现**：ESD（Electrostatic Discharge，静电放电）是人体/物体带电后瞬间放电，电压可达几千伏。ESD 二极管/TVS 的作用是把浪涌钳位到安全电压，并泄放到地。\n\n#### 14.2.1 单端、差分与阻抗：先看信号怎么传\n\n接口信号分两类：单端和差分。单端信号以地为参考，一根线传一个电平；差分信号用两根反相线传差值，接收端相减。\n\n**单端接口**：UART、I2C、SPI、复位、GPIO。它们的共同特点是“以地为参考”，地噪声会直接叠加到信号上。所以单端接口的地要稳，走线不要太长，远端要有去耦。\n\n**差分接口**：USB、HDMI、RJ45、RS485、CAN。它们的共同特点是“两根线反相”，共模噪声在接收端被抵消。差分接口的关键不是“两根线”，而是“两根线要对称”：等长、等距、同层、参考连续。\n\n**阻抗**：单端接口通常 50Ω（射频/测试），差分接口有 90Ω（USB）、100Ω（HDMI/以太网）、120Ω（CAN/RS485）。阻抗由线宽、间距、介质厚度、铜厚决定。2 层板很难控制，4 层板用阻抗计算工具算。\n\n**终端匹配**：高速差分/长线要加终端电阻，吸收反射。RS485 用 120Ω 终端，CAN 用 120Ω 终端，USB 由芯片内部/外部匹配。终端电阻要放在“线缆末端”，不是随便放在板上。\n\n**上下拉**：I2C 的 SDA/SCL 是开漏，必须加上拉电阻；UART 的 TX/RX 空闲电平要明确，未用的引脚不要浮空；SPI 的 CS 要加上拉，防止上电时误选中。\n\n**电平**：3.3V、5V、1.8V 不能直接互连。5V TX 接 3.3V RX，可能把 RX 打坏；要用电平转换/分压/隔离。RS485/CAN 是差分电平，不能直接接 TTL。\n\n接口设计的第一步，不是画连接器，而是把“信号类型、速率、电平、阻抗、终端”写清楚。这五项写不清，后面保护/布局都是猜。\n\n#### 14.2.3 速率决定走线长度：不是所有接口都能拉长\n\n接口能跑多快，不只取决于芯片，还取决于走线长度、寄生电容、参考平面。速率越高，允许的走线越短。\n\n**经验判断**：\n\n- 低速（<10MHz）：UART、I2C、SPI、GPIO，短线几厘米到几十厘米，加串阻/上拉即可；\n- 中速（10～100MHz）：SPI 高速、TF 卡、USB 全速，走线几厘米，要包地/参考平面；\n- 高速（>100MHz）：USB 高速、HDMI、以太网、DDR，走线按阻抗/等长，必须有完整参考平面。\n\n**传播速度**：信号在 PCB 上的传播速度约 15cm/ns（FR4，具体看介电常数）。1ns 上升沿对应约 15cm 的走线；走线长度超过上升沿对应长度的 1/6，就要按传输线处理，考虑反射/终端。\n\n**寄生电容**：走线对参考面的电容约 1～3pF/cm。10cm 走线就是 10～30pF，对高速信号是明显的负载。接口保护器件的电容要算进去，不能只看走线。\n\n**参考平面**：高速接口下方要有连续地平面，不能跨分割。2 层板做 USB 高速很吃力，就是因为地不完整。4 层板把地放在第二层，接口走线在顶层，回流短。\n\n**走线长度不是唯一指标**：连接器、保护器件、共模电感的寄生参数也会影响。保护器件要选低电容，共模电感要选低漏感。接口链路是“连接器+保护+走线+芯片”的整体，不能只优化一段。\n\n课程项目做 USB 全速/低速，走线短、差分等长即可；做 USB 高速/以太网，建议 4 层板，按阻抗/等长/参考平面做。\n\n### 14.3 关键参数与保护器件\n\n| 接口 | 信号 | 速率 | 阻抗/保护 |\n|---|---|---|---|\n| USB 2.0 | VBUS、D+、D−、GND | 480Mbps | 90Ω 差分，ESD |\n| USB 3.0 | 增加 SuperSpeed 差分对 | 5Gbps | 90Ω 差分，ESD |\n| HDMI | TMDS 差分、DDC、+5V | 最高数 Gbps | 100Ω 差分，ESD |\n| RJ45 | TX/RX 差分、变压器 | 百兆/千兆 | 100Ω 差分，共模/变压器 |\n| TF/SIM | CLK、CMD、DAT、电源 | 几十 MHz | 上拉/ESD/去耦 |\n\n保护器件对比：\n\n| 器件 | 响应速度 | 钳位 | 适用 |\n|---|---|---|---|\n| ESD 二极管 | 快 | 低 | 高速信号 ESD |\n| TVS | 快 | 较低 | 电源/接口浪涌 |\n| 压敏电阻 | 较慢 | 较高 | 电源初级浪涌 |\n| 保险丝 | 慢 | 无 | 过流/短路 |\n| 共模电感 | — | — | 差分共模噪声 |\n\n#### 14.2.2 连接器的机械与热插拔\n\n连接器不只是电气器件，还是机械器件。接口设计要考虑“插得进、拔得出、插不坏”。\n\n**机械固定**：USB、HDMI、RJ45、DC 座都有固定脚/定位柱。固定脚要焊在板上，不能只靠信号脚受力；否则反复插拔，焊盘会撕裂。固定脚的焊盘要大，必要时加过孔/沉板。\n\n**插拔方向**：连接器要放在板边，插口朝外。卧式连接器的锁扣方向要朝外，否则线缆插进去拔不出来。连接器的高度要和外壳匹配，不能顶到外壳。\n\n**热插拔**：带电插拔时，连接器的引脚会“先接后断”或“先断后接”。设计时要考虑：\n\n- 电源脚和地脚要比信号脚长，先接地、后上电；\n- 信号脚要加 ESD/限流，防止插拔瞬间的浪涌；\n- 电源入口要加软启动/限流，防止插拔时的浪涌电流；\n- 热插拔检测（HD）脚要用 RC 去抖，避免误触发。\n\n**连接器外壳**：屏蔽壳要接机壳地/板地，按 EMC 设计。塑料外壳的连接器没有屏蔽，ESD 会从缝隙打进来，保护要更强。\n\n**机械寿命**：连接器有插拔次数额定值（比如 5000 次）。课程项目反复插拔，要选工业级/带固定脚的连接器，不要用廉价排针代替。\n\n#### 14.3.3 保护器件布局：位置比型号更重要\n\n同样的 TVS，放在连接器入口和放在芯片旁边，效果差很多。保护器件的布局原则是“先拦后放，靠近入口”。\n\n**顺序**：连接器 → TVS/ESD → 限流/共模 → 芯片。TVS 要放在连接器和内部电路之间，不能放在芯片后面。ESD 电流从连接器进来，先经过 TVS 到地，残压才进芯片。\n\n**地回路**：TVS 的地要就近连接到接口地，不能拉到板子另一头。地回路越长，寄生电感越大，钳位时地弹越高，残压可能仍然超限。接口地要和板地单点连接，连接点靠近连接器。\n\n**走线**：TVS 到连接器的走线要短、粗；TVS 到被保护芯片的走线也要短。保护器件后面的走线如果很长，残压会沿着走线继续传播。\n\n**多路保护**：一个 ESD 阵列可以保护多路信号，但每路的引脚要靠近对应信号，不能把阵列放在板子中间，让所有信号绕过去。\n\n**隔离带**：隔离器/变压器的隔离带下方不能有铜箔跨过，爬电距离按标准。隔离两侧的地要分开，保护器件的地要接在“被保护侧”。\n\n**热插拔**：连接器的电源脚/地脚要先接，信号脚后接。保护器件要能承受插拔瞬间的浪涌，TVS 的峰值功率要够。\n\n**布局检查**：把保护器件高亮，看它是否在连接器和芯片之间；看地回路是否短；看是否有长走线绕过保护器件。布局错了，再好的器件也白搭。\n\n### 14.4 三个典型接口电路\n\n#### 14.4.1 USB 2.0\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 14-1：USB 2.0 接口与 ESD 保护<\/text>\n  <rect x=\"60\" y=\"80\" width=\"120\" height=\"120\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"105\" font-size=\"13\" fill=\"currentColor\">USB 座<\/text>\n  <text x=\"80\" y=\"130\" font-size=\"12\" fill=\"currentColor\">VBUS<\/text>\n  <text x=\"80\" y=\"150\" font-size=\"12\" fill=\"currentColor\">D+<\/text>\n  <text x=\"80\" y=\"170\" font-size=\"12\" fill=\"currentColor\">D−<\/text>\n  <text x=\"80\" y=\"190\" font-size=\"12\" fill=\"currentColor\">GND<\/text>\n  <line x1=\"180\" y1=\"125\" x2=\"300\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"230\" y=\"115\" font-size=\"12\" fill=\"currentColor\">VBUS 5V<\/text>\n  <line x1=\"180\" y1=\"145\" x2=\"300\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"180\" y1=\"165\" x2=\"300\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"230\" y=\"140\" font-size=\"12\" fill=\"currentColor\">D+<\/text>\n  <text x=\"230\" y=\"160\" font-size=\"12\" fill=\"currentColor\">D−<\/text>\n  <rect x=\"300\" y=\"135\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"310\" y=\"165\" font-size=\"12\" fill=\"currentColor\">ESD 阵列<\/text>\n  <line x1=\"380\" y1=\"160\" x2=\"460\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"460\" y=\"120\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"480\" y=\"150\" font-size=\"13\" fill=\"currentColor\">MCU/PHY<\/text>\n  <text x=\"480\" y=\"175\" font-size=\"12\" fill=\"currentColor\">USB 外设<\/text>\n  <text x=\"60\" y=\"250\" font-size=\"13\" fill=\"currentColor\">ESD 器件放在连接器入口，先泄放，再进芯片；差分对 90Ω。<\/text>\n<\/svg>\n```\n\n#### 14.4.2 RJ45 与变压器\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 14-2：RJ45：连接器→变压器→PHY<\/text>\n  <rect x=\"50\" y=\"80\" width=\"100\" height=\"100\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"65\" y=\"110\" font-size=\"13\" fill=\"currentColor\">RJ45<\/text>\n  <rect x=\"220\" y=\"80\" width=\"140\" height=\"100\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"235\" y=\"110\" font-size=\"13\" fill=\"currentColor\">网络变压器<\/text>\n  <text x=\"235\" y=\"135\" font-size=\"11\" fill=\"currentColor\">隔离/共模<\/text>\n  <rect x=\"430\" y=\"80\" width=\"120\" height=\"100\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"450\" y=\"120\" font-size=\"13\" fill=\"currentColor\">PHY<\/text>\n  <line x1=\"150\" y1=\"120\" x2=\"220\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"120\" x2=\"430\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"50\" y=\"220\" font-size=\"13\" fill=\"currentColor\">差分对 100Ω；变压器靠近连接器；外壳地与信号地按规范处理。<\/text>\n<\/svg>\n```\n\n#### 14.4.3 接口保护\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 14-3：接口保护链：保险→TVS→共模→芯片<\/text>\n  <rect x=\"40\" y=\"80\" width=\"100\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"115\" font-size=\"12\" fill=\"currentColor\">连接器<\/text>\n  <rect x=\"180\" y=\"80\" width=\"100\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"195\" y=\"115\" font-size=\"12\" fill=\"currentColor\">保险/TVS<\/text>\n  <rect x=\"320\" y=\"80\" width=\"100\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"335\" y=\"115\" font-size=\"12\" fill=\"currentColor\">共模电感<\/text>\n  <rect x=\"460\" y=\"80\" width=\"100\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"475\" y=\"115\" font-size=\"12\" fill=\"currentColor\">芯片<\/text>\n  <line x1=\"140\" y1=\"110\" x2=\"180\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"280\" y1=\"110\" x2=\"320\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"420\" y1=\"110\" x2=\"460\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"210\" font-size=\"13\" fill=\"currentColor\">保护顺序：先钳位/限流，再滤波，最后进芯片；器件越靠接口越好。<\/text>\n<\/svg>\n```\n\n#### 14.3.1 ESD 与 TVS 的选型：钳位电压不是唯一参数\n\nESD 二极管和 TVS 都是“正常高阻、浪涌导通”的器件，但选型要看五个参数。\n\n**1. 工作电压（Standoff / Reverse Working Voltage）**：正常工作时能承受的最高电压。要大于接口的最高工作电压，留 10%～20% 余量。比如 5V 接口选 5.5～6V 的 TVS，不能选 5V 整。\n\n**2. 钳位电压（Clamping Voltage）**：浪涌电流下的残压。要低于后级芯片的绝对最大额定值，留 20% 余量。比如芯片绝对最大 6V，TVS 钳位要 ≤4.8V。钳位电压是在特定浪涌电流下测的，要看测试条件，不能只看标称。\n\n**3. 峰值脉冲电流/功率**：TVS 能承受的浪涌能量。按接口可能遇到的浪涌波形（8/20μs、10/700μs 等）选，不能只看稳态电流。\n\n**4. 电容**：高速接口要选低电容 ESD，通常 <0.5pF；USB 2.0 可以用 1～3pF；电源/低速接口可以用大电容。电容太大会衰减高频信号，眼图闭合。\n\n**5. 漏电流**：正常工作时不能影响信号。低漏电流的 TVS 适合高阻/模拟接口。\n\n**ESD 二极管 vs TVS**：ESD 二极管响应更快、电容更低，适合高速信号；TVS 功率更大，适合电源/浪涌。很多接口用“ESD 阵列 + TVS”组合：ESD 扛静电，TVS 扛浪涌。\n\n**压敏电阻（MOV）**：便宜、功率大，但响应慢、钳位电压高、有老化。适合电源初级浪涌，不适合高速信号。\n\n**保险丝**：只防过流，不防过压。保险丝要和 TVS 配合，TVS 先钳位，保险丝再熔断。保险丝额定电流 ≥ 工作电流 ×1.5，但不要过大，否则短路不熔断。\n\n#### 14.4.6 HDMI/显示接口：高速差分+DDC 低速线\n\nHDMI 是“高速 TMDS 差分 + 低速 DDC/CEC/HPD”的混合接口。高速部分按差分规则，低速部分按单端规则，两者要分开布局。\n\n**TMDS 差分**：3 对数据 + 1 对时钟，100Ω 差分。要等长、等距、同层、参考连续。差分对之间要保持间距，避免串扰。HDMI 连接器的引脚密集，扇出时要小心，不能破坏差分对。\n\n**DDC**：SDA/SCL，I2C 电平，要加上拉/ESD。DDC 是低速线，但它是“显示器和源端通信”的通道，坏了会黑屏/不识别。\n\n**CEC**：单端低速控制线，要加 ESD/串阻。\n\n**HPD**：热插拔检测，单端，要加 RC 去抖/ESD。\n\n**+5V**：HDMI 源端给显示器供电，要加限流/保险/TVS。+5V 的电流不大，但短路时会拖垮源端。\n\n**连接器**：HDMI 连接器有屏蔽壳，要接机壳地；固定脚要焊牢，反复插拔受力大。连接器靠板边，插口朝外。\n\n**布局**：高速差分靠近连接器，DDC/CEC/HPD 可以稍远；+5V 的保护放在连接器旁；ESD 器件要低电容，不能影响 TMDS。\n\n**测试**：HDMI 一致性测试复杂，课程项目至少做“能显示、不黑屏、插拔不断”。有条件用示波器看 TMDS 眼图。\n\n#### 14.4.8 接口布线的通用规则\n\n不同接口的协议不同，但布线规则有很多共通之处。下面十条适用于大多数接口。\n\n1. **连接器靠板边**：插口朝外，固定脚焊牢，连接器后面留出保护器件的位置。\n2. **保护器件靠入口**：TVS/ESD 放在连接器和内部电路之间，地回路短。\n3. **差分对对称**：等长、等距、同层、参考连续；换层时两根一起换，旁边加回流地过孔。\n4. **单端线包地**：时钟、复位、高速单端线两侧包地，地过孔间距 5mm 左右。\n5. **电源线短粗**：接口电源（VBUS、+5V、TF 电源）走短、粗，加去耦。\n6. **地平面连续**：接口下方地不能断；2 层板至少保证接口区域地完整。\n7. **避免跨分割**：差分/高速线不能跨电源分割，回流会绕。\n8. **测试点可及**：每个接口的电源、关键信号留测试点，探针能碰到。\n9. **丝印清楚**：接口方向、1 脚、极性标清楚，装配不看错。\n10. **机械复核**：连接器高度、插口方向、线缆折弯半径，用 3D/1:1 打印确认。\n\n**布线顺序**：先布电源/地，再布差分/高速，最后布低速/GPIO。保护器件要在布线前放好，不能布完线再“补”一个 TVS，位置往往已经不对。\n\n**接口区域的地**：接口地、屏蔽地、板地要按 EMC 设计连接。课程项目简化：接口地接板地，屏蔽壳通过 0Ω 电阻/螺丝孔接机壳地，留调整位置。\n\n**常见返工**：连接器放反、保护器件放远、差分跨分割、电源没去耦。这四类问题在评审时最容易发现，也最容易改；布完线再改，代价最大。\n\n### 14.5 选型与降额\n\n| 场景 | 保护方案 | 注意 |\n|---|---|---|\n| USB/HDMI 高速 | 低电容 ESD 二极管 | 电容 <0.5pF，避免影响信号 |\n| 电源入口 | TVS/压敏+保险 | 钳位电压低于后级耐压 |\n| RJ45 | 变压器+共模 | 隔离耐压/共模抑制 |\n| TF/SIM | ESD+电源去耦 | 插拔检测 RC |\n| 工业 RS485/CAN | TVS+共模+终端 | 共模范围/隔离 |\n\n降额：\n\n- TVS 钳位电压 ≤ 后级绝对最大电压 ×0.8。\n- ESD 二极管电容按信号速率选，高速选低电容。\n- 保险丝额定电流 ≥ 工作电流 ×1.5，但不要过大。\n\n#### 14.3.2 共模电感、隔离与终端\n\n**共模电感（Common Mode Choke）**：两个绕组绕在同一磁芯上，差分信号电流产生的磁场相互抵消，共模电流产生的磁场叠加，形成高阻抗。它对差分信号影响小，对共模噪声抑制大。\n\n共模电感放在“连接器之后、芯片之前”，靠近连接器。选型看：\n\n- 共模阻抗（100MHz 下的 Ω）；\n- 额定电流（要大于接口电流）；\n- 直流电阻（影响压降）；\n- 漏感（影响差分信号，越小越好）。\n\n**隔离**：RJ45 变压器、RS485/CAN 隔离器、USB 隔离器。隔离的作用是“断开地环路、承受高压差”。工业接口（RS485/CAN）通常要求 2.5kV 隔离，医疗/电力要求更高。\n\n隔离器的布局要保证“隔离带”干净：隔离器下方不能有铜箔跨过，爬电距离/电气间隙按标准。隔离两侧的地要分开，不能随便连。\n\n**终端**：RS485/CAN 的 120Ω 终端电阻，吸收总线反射。终端要放在总线两端，不是每个节点都放。课程项目一个发送端、一个接收端，两端各放一个 120Ω；中间节点不放。\n\n**偏置电阻**：RS485 在空闲时总线电平不确定，需要偏置电阻（上拉/下拉）让总线保持空闲状态。偏置电阻值按总线负载/终端算，不能太小，否则功耗大。\n\n**保护顺序**：连接器 → TVS → 共模电感 → 隔离/终端 → 芯片。TVS 先钳位，共模电感滤共模，隔离断开地环路，终端吸收反射。\n\n#### 14.4.7 TF/SIM 卡接口：电源、时钟、插拔检测\n\nTF/SIM 卡是“可插拔的存储/身份模块”，接口设计要同时考虑信号、电源、插拔检测、ESD。\n\n**电源**：TF 卡电源 3.3V（部分支持 1.8V），插拔瞬间电流突变，卡座电源脚要加 100nF + 10μF 去耦。电源走线要短、粗，不能和时钟线并行。\n\n**时钟**：TF 卡的 CLK 是高速时钟，要走短、包地，远离 DAT/CMD。时钟频率越高，走线越要短。SIM 卡的 CLK 频率较低，但也要避免干扰。\n\n**数据/命令**：TF 卡的 DAT0～DAT3、CMD 要加上拉/ESD；SIM 卡的 I/O 是开漏/双向，要加上拉。数据线要等长（TF 高速模式），按卡规范。\n\n**插拔检测（CD）**：卡座有插拔检测脚，要加 RC 去抖（比如 10kΩ + 100nF），防止插拔抖动误触发。CD 信号要加上拉，接到 MCU 中断。\n\n**ESD**：卡座是人体接触最多的接口之一，所有信号/电源脚都要加 ESD。ESD 器件的电容要符合卡的速度，TF 高速模式要低电容。\n\n**布局**：卡座靠板边，插拔方向朝外；卡座下方不要走高速线；电源去耦靠近卡座；ESD 靠近卡座。\n\n**常见错误**：电源没去耦，插拔时数据写坏；CLK 线太长，高速模式不识别；CD 没去抖，插卡瞬间反复中断；ESD 电容太大，信号眼图闭合。\n\n#### 14.5.1 保护链的降额核算\n\n保护链不是“放一个 TVS 就行”，每一级都要算：\n\n**TVS 的工作电压**：`Vrmw ≥ 接口最高工作电压 ×1.1`。5V 接口选 5.5～6V，12V 接口选 13～15V。工作电压太低，正常信号会漏电/发热；太高，钳位电压也高。\n\n**TVS 的钳位电压**：`Vclamp ≤ 后级绝对最大额定值 ×0.8`。芯片绝对最大 6V，钳位要 ≤4.8V。注意 `Vclamp` 是在规定浪涌电流下测的，实际浪涌电流小于测试电流时，钳位更低；大于测试电流时，钳位更高。\n\n**TVS 的峰值功率**：`Ppp ≥ 浪涌电流 × 钳位电压`，并按波形/持续时间降额。8/20μs 和 10/700μs 的能量不同，不能只看标称功率。\n\n**保险丝**：`In ≥ 工作电流 ×1.5`，`In ≤ 短路电流 ×0.8`（保证短路时熔断）。保险丝太大，短路不熔断；太小，正常浪涌/启动电流会误熔断。\n\n**共模电感**：额定电流 ≥ 接口电流 ×1.2；直流电阻带来的压降 ≤ 接口允许的 5%；共模阻抗在目标频段足够大，漏感不影响差分信号。\n\n**ESD 电容**：高速接口 `C ≤ 0.5pF`，USB 2.0 `C ≤ 3pF`，低速接口可以到几十 pF。电容要和走线电容一起算，不能只看器件。\n\n**降额不是“越大越好”**：TVS 工作电压选太高，钳位也高，保护不够；保险丝选太大，短路不熔断；共模电感选太大，压降/体积增加。每一级都要在“保护够、影响小”之间取平衡。\n\n### 14.6 测量与仿真\n\n#### 14.4.4 UART、I2C、SPI：低速接口也会坏\n\n低速接口看起来简单，实际最容易“时好时坏”。问题通常不在协议，而在电平、上拉、地、保护。\n\n**UART**：TX/RX 交叉连接，空闲电平为高。未用的 RX 不要浮空，加上拉/下拉，否则会收到噪声。长线/高波特率要加串阻（22～100Ω）抑制反射；接口要加 ESD。电平不匹配时用分压/电平转换，5V TX 到 3.3V RX 用电阻分压（注意分压比和速率）。\n\n**I2C**：SDA/SCL 是开漏，必须加上拉电阻。上拉值由总线电容和速率决定：`Rmin = (Vcc − Vol)/Iol`，`Rmax = tr/(0.8473×Cb)`（粗略）。课程项目 100kHz、短总线，用 4.7kΩ 上拉；400kHz 用 2.2～4.7kΩ；总线长/器件多要减小上拉，但注意功耗。I2C 要加 ESD，热插拔时 SDA/SCL 可能被拉低，要串阻保护。\n\n**SPI**：SCK、MOSI、MISO、CS。SCK 是高速时钟，要走短、包地；CS 要加上拉，防止上电误选中；MISO 是高阻输入，不要浮空。多从机时，CS 要分开，不能并联。\n\n**电平转换**：3.3V 和 5V 互连，不能直接接。单向用电阻分压/二极管钳位，双向用专用电平转换芯片（如 TXB/TXS 系列）。I2C 的电平转换要注意开漏和上拉。\n\n**保护**：低速接口的 ESD 电容可以大一点（几 pF～几十 pF），但 I2C 的上拉/电容会影响上升沿，选 ESD 要看电容。UART/SPI 的串阻 + ESD 是常用组合。\n\n**地**：低速接口的地要和芯片地连在一起，不能浮空。长线接口要加共模电感/隔离，防止地环路。\n\n#### 14.6.1 接口检查\n\n1. 测 VBUS/电源电压。\n2. 测差分对通断/短路。\n3. 测 ESD 器件是否漏电/短路。\n4. 插拔测试，观察是否复位/丢包。\n\n#### 14.4.5 RS485 与 CAN：工业接口的共模与隔离\n\nRS485/CAN 是差分总线，适合长线、多节点、工业环境。它们的设计重点不是“接两根线”，而是“共模范围、终端、隔离、保护”。\n\n**RS485**：\n\n- 差分电平，A/B 两根线；\n- 共模范围通常 −7V～+12V，超过会损坏收发器；\n- 终端 120Ω，放在总线两端；\n- 偏置电阻让空闲时 A>B，保证空闲状态；\n- 长线/多节点要加共模电感、TVS、隔离；\n- 隔离 RS485 的隔离侧地要单独，不能和逻辑地混。\n\n**CAN**：\n\n- 差分电平，CAN_H/CAN_L；\n- 终端 120Ω，两端各一个；\n- 共模范围通常 −2V～+7V（具体看收发器）；\n- 总线要加共模电感、TVS；\n- 节点多时，终端只放两端，中间不放。\n\n**保护**：RS485/CAN 的 TVS 要选“共模范围覆盖总线电平、钳位低于收发器绝对最大”的型号。共模电感要选“差分阻抗影响小、共模阻抗大”的。隔离器要选“隔离电压、速率、节点数”匹配的。\n\n**布局**：差分对要等长、等距、同层；终端电阻靠近连接器；隔离器的隔离带要干净；TVS 靠近连接器；总线连接器的地要接机壳地/屏蔽地。\n\n**常见错误**：每个节点都放 120Ω，总线负载过重；TVS 钳位电压太高，收发器先坏；隔离器两侧地连在一起，隔离失效；共模电感放在隔离后面，保护顺序错。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 14-4：I2C/UART 上拉、串阻与 ESD<\/text>\n  <text x=\"40\" y=\"80\" font-size=\"13\" fill=\"currentColor\">3.3V<\/text>\n  <line x1=\"80\" y1=\"75\" x2=\"80\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"65\" y=\"110\" width=\"30\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"140\" font-size=\"11\" fill=\"currentColor\">4.7k<\/text>\n  <line x1=\"80\" y1=\"160\" x2=\"80\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"20\" y=\"165\" width=\"45\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"26\" y=\"195\" font-size=\"9\" fill=\"currentColor\">座<\/text>\n  <line x1=\"65\" y1=\"190\" x2=\"80\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"80\" y1=\"190\" x2=\"300\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"182\" font-size=\"11\" fill=\"currentColor\">SDA/SCL<\/text>\n  <rect x=\"300\" y=\"170\" width=\"70\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"308\" y=\"195\" font-size=\"11\" fill=\"currentColor\">ESD<\/text>\n  <line x1=\"370\" y1=\"190\" x2=\"420\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"420\" y=\"180\" width=\"50\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"428\" y=\"194\" font-size=\"9\" fill=\"currentColor\">22Ω<\/text>\n  <line x1=\"470\" y1=\"190\" x2=\"520\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"520\" y=\"160\" width=\"120\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"540\" y=\"195\" font-size=\"12\" fill=\"currentColor\">MCU<\/text>\n  <text x=\"40\" y=\"255\" font-size=\"12\" fill=\"currentColor\">开漏必须加上拉；ESD 靠近连接器；长线加 22～100Ω 串阻。<\/text>\n  <text x=\"40\" y=\"285\" font-size=\"12\" fill=\"currentColor\">上拉太大上升沿慢，太小功耗/灌电流大。<\/text>\n<\/svg>\n```\n\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 14-5：RS485 终端、偏置与共模保护<\/text>\n  <rect x=\"50\" y=\"100\" width=\"100\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"65\" y=\"135\" font-size=\"12\" fill=\"currentColor\">收发器<\/text>\n  <line x1=\"150\" y1=\"120\" x2=\"300\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"150\" x2=\"300\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"170\" y=\"112\" font-size=\"11\" fill=\"currentColor\">A<\/text>\n  <text x=\"170\" y=\"168\" font-size=\"11\" fill=\"currentColor\">B<\/text>\n  <rect x=\"300\" y=\"105\" width=\"60\" height=\"55\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"310\" y=\"135\" font-size=\"10\" fill=\"currentColor\">TVS<\/text>\n  <line x1=\"360\" y1=\"120\" x2=\"500\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"150\" x2=\"500\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"440\" y=\"120\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"448\" y=\"140\" font-size=\"10\" fill=\"currentColor\">120Ω<\/text>\n  <text x=\"420\" y=\"95\" font-size=\"11\" fill=\"currentColor\">终端放总线两端<\/text>\n  <line x1=\"500\" y1=\"120\" x2=\"620\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"500\" y1=\"150\" x2=\"620\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"560\" y=\"110\" font-size=\"11\" fill=\"currentColor\">A<\/text>\n  <text x=\"560\" y=\"168\" font-size=\"11\" fill=\"currentColor\">B<\/text>\n  <text x=\"50\" y=\"235\" font-size=\"12\" fill=\"currentColor\">保护顺序：连接器→TVS→共模→隔离/终端；终端只放两端。<\/text>\n  <text x=\"50\" y=\"265\" font-size=\"12\" fill=\"currentColor\">偏置电阻保证空闲电平；隔离器两侧地不能连。<\/text>\n<\/svg>\n```\n\n#### 14.6.2 CircuitJS\n\n```circuitjs\ndiode-forward\n```\n\n观察二极管正向导通/反向截止，理解 ESD 二极管“正常高阻、浪涌导通”的行为。\n\n```circuitjs\npower-diode-or\n```\n\n观察两路电源经二极管汇合，理解接口防倒灌。\n\n#### 14.6.4 眼图、插拔与一致性测试\n\n接口“能通”不等于“稳定”。要验证接口，至少做三类测试：电气、协议、插拔/环境。\n\n**电气测试**：\n\n- 电源电压/纹波：VBUS、+5V、3.3V；\n- 差分通断/短路：D+/D−、TX/RX；\n- 阻抗：差分阻抗（有条件用 TDR）；\n- 保护器件漏电：TVS/ESD 是否漏电/短路；\n- 信号质量：示波器看上升沿/过冲/眼图。\n\n**眼图**：高速接口用示波器+眼图模板，看眼高/眼宽/抖动。眼图闭合通常是走线太长、差分不对称、参考不连续、保护电容太大。课程项目没有高速示波器，可以用“误码/丢包”间接判断。\n\n**协议测试**：\n\n- USB：枚举、读盘、反复插拔；\n- 以太网：ping、大包、长时间跑流；\n- HDMI：显示、分辨率切换、热插拔；\n- RS485/CAN：多节点、长线、终端匹配。\n\n**插拔测试**：反复插拔至少几十次，看是否复位/丢包/死机；带电插拔要测浪涌/倒灌；ESD 测试有条件用 ESD 枪，打接触/空气放电，看是否复位/损坏。\n\n**环境测试**：高低温、湿热、振动。接口连接器在温度循环后可能接触不良；ESD 器件在湿热后漏电增加。课程项目至少做一次高低温循环/反复插拔。\n\n**记录**：测试条件、结果、失败现象、整改措施。接口问题往往“偶发”，没有记录就无法复现。\n\n#### 14.6.3 动手任务\n\n- 给 USB 接口画 ESD 保护，标注器件位置。\n- 给 TF 卡座画电源去耦和插拔检测。\n- 测一个 USB 口的 VBUS 和差分通断。\n- 记录一次插拔静电测试（有条件用 ESD 枪）。\n\n### 14.7 常见坑\n\n1. **ESD 器件放得太远**：浪涌先到芯片，保护无效。器件要放在连接器和芯片之间，地回路要短。\n2. **高速信号用大电容 ESD**：信号衰减/眼图闭合。USB 高速选 <0.5pF，不能拿电源 TVS 凑。\n3. **USB 差分不等长**：枚举失败/丢包。等长、等距、同层、参考连续，四条缺一不可。\n4. **连接器外壳地处理错**：屏蔽无效/共模辐射。屏蔽壳要接机壳地，按 EMC 设计。\n5. **TF/SIM 无电源去耦**：插拔数据损坏。卡座电源脚加 100nF+10μF，CD 加 RC 去抖。\n6. **TVS 钳位电压高于芯片耐压**：保护等于没保。按绝对最大额定值留 20% 余量。\n7. **保险丝额定电流过大**：短路不熔断。按工作电流 1.5 倍、短路电流 0.8 倍取。\n8. **接口靠板内**：插不进外壳/线缆干涉。连接器靠边、插口朝外、3D 复核。\n9. **忽略机械固定**：反复插拔焊盘脱落。固定脚要焊牢，必要时加过孔/沉板。\n\n### 14.8 本章复盘\n\n#### 14.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 三段式：协议→电路→布局 | 拆接口 | 先看手册 |\n| USB2.0 差分 90Ω | 阻抗 | USB3 也是 90Ω |\n| HDMI 差分 100Ω | 阻抗 | TMDS |\n| RJ45 差分 100Ω | 阻抗 | 变压器隔离 |\n| TVS 钳位 ≤ 后级耐压×0.8 | 保护 | 留余量 |\n| ESD 电容按速率选 | 高速 | 低电容 |\n\n#### 14.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| ESD | electrostatic discharge | 静电放电 |\n| TVS | transient voltage suppressor | 瞬态电压抑制 |\n| 共模电感 | common mode choke | 抑制共模噪声 |\n| 差分对 | differential pair | 一对反相信号 |\n| 钳位 | clamping | 把电压限制在安全范围 |\n| 热插拔 | hot plug | 带电插拔 |\n\n#### 14.8.3 自测 10 题\n\n1. 接口三段式是什么？\n2. USB2.0 差分阻抗多少？\n3. ESD 二极管为什么放在连接器入口？\n4. 高速信号为什么不能用大电容 ESD？\n5. RJ45 变压器的作用？\n6. TVS 钳位电压怎么选？\n7. TF 卡为什么需要电源去耦？\n8. 连接器外壳地怎么处理？\n9. 保险丝额定电流怎么选？\n10. 接口布局为什么要靠板边？\n\n#### 14.8.4 能力清单\n\n- [ ] 能用三段式拆一个接口。\n- [ ] 能画 USB/RJ45/TF 的保护电路。\n- [ ] 能选 ESD/TVS/共模/保险。\n- [ ] 能检查差分对、保护器件位置。\n- [ ] 能测接口电源和通断。\n\n#### 14.8.6 接口设计评审清单\n\n1. 接口三段式（协议/电路/布局）写清楚了吗？\n2. 信号类型（单端/差分）、速率、电平、阻抗、终端明确了吗？\n3. 连接器靠板边、插口朝外、固定脚焊牢了吗？\n4. 电源脚/地脚比信号脚长，热插拔先接地了吗？\n5. ESD/TVS 在连接器和芯片之间，地回路短吗？\n6. TVS 工作电压、钳位电压、峰值功率算过吗？\n7. 高速接口的 ESD 电容够低吗？\n8. 差分对等长、等距、同层、参考连续吗？\n9. 共模电感/变压器/隔离器的位置和隔离带对吗？\n10. 终端电阻只放在总线两端吗？\n11. I2C 上拉、UART 电平、SPI CS 上拉处理了吗？\n12. TF/SIM 电源去耦、CD 去抖、ESD 齐备吗？\n13. 连接器外壳/屏蔽地按 EMC 要求接了吗？\n14. 接口电源有保险/限流/软启动吗？\n15. 每个接口都有测试点/测试方法吗？\n16. 反复插拔、带电插拔、ESD 测试记录了吗？\n\n接口是“事故率最高”的区域，评审要按“最坏情况”问：插反会怎样？打静电会怎样？线缆短路会怎样？地环路会怎样？能用一句话回答，才算设计清楚。\n\n#### 14.8.5 下一章\n\n下一章讲**时钟、复位、调试与常见模块**：接口之外，板子上还有晶振、复位、SWD、EEPROM、按键、传感器这些“小但致命”的模块。","taskSignature":"464bb768c695a0a35ff1abc23709b5aae003f2905a1c09b0edfd411d7d8a10c4","taskCount":5},{"id":"15","title":"第 15 章 · 时钟、复位、调试与常见模块","short":"时钟、复位、调试与常见模块","stage":2,"diff":3,"prev":"第 14 章 接口、ESD 与保护","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 画晶振电路，解释负载电容、起振、包地。\n2. 设计复位电路，理解上电复位、手动复位、看门狗复位。\n3. 认识 SWD/JTAG 调试接口，画出最小的 SWD 连接。\n4. 处理 EEPROM、按键、蜂鸣器、I²C 传感器等常见模块。\n5. 解释 I²C 上拉电阻、地址冲突、总线电容。\n6. 检查时钟/复位/调试三件套的 PCB 布局。\n7. 说出至少 8 个“小模块”常见坑。\n\n主芯片能跑起来，靠的不是“电源接对”一件事，而是电源、时钟、复位、调试四件套都对。四件套里任何一件参数偏一点、位置偏一点，表现出来都是“芯片像坏了”：不启动、下载失败、串口乱码、跑一会儿复位。而且它们互相牵连：复位不对会让人误判时钟，时钟不对会让人误判芯片。这四件套必须一起查，不能只查一个。很多“单片机不工作”，最后查到是晶振没起振、复位被拉低、SWD 接反；芯片本身往往没坏，坏的是外围那几个不起眼的元件和走线。\n\n## 正文\n\n### 15.1 它解决什么问题：三个真实场景\n\n#### 场景一：晶振不起振，MCU 卡在启动\n\n晶振负载电容选错/走线太长，起振失败。MCU 用内部 RC 能跑，但 USB/串口波特率不准。晶振要靠近芯片，负载电容按手册，走线短、包地。\n\n#### 场景二：复位脚被电容“按住”，程序不跑\n\n复位电路 RC 时间常数太大，上电后复位脚长时间低电平，MCU 一直不启动。或者复位按键卡住，现场“死机”。复位要按手册的复位时间设计。\n\n#### 场景三：SWD 少接一根地，下载失败\n\nSWD 只接了 SWDIO/SWCLK，没接 GND，或者 GND 接触不良。下载器能识别芯片但不稳定。调试接口必须 GND、VCC、SWDIO、SWCLK 四根可靠连接。\n\n### 15.2 它是什么：四件套与小模块\n\n- **时钟**：晶振/陶瓷谐振器/内部 RC，给 MCU 和外设提供节拍。\n- **复位**：上电复位（POR）、手动复位、看门狗复位、低电压复位。\n- **调试**：SWD（Serial Wire Debug）两线调试，JTAG 四/五线。\n- **常见模块**：EEPROM、按键、蜂鸣器、I²C 传感器、LED。\n\n> **术语第一次出现**：负载电容（CL）是晶振两端到地的电容，和晶振的指定负载电容匹配。选错会导致频率偏移或不起振。\n\n#### 15.2.1 晶振为什么会起振：负阻与环路增益\n\n晶振不是“通电就振”，它需要满足两个条件：**相位条件**和**幅度条件**。\n\n**相位条件**：整个环路（放大器 + 晶振 + 负载电容）的相移是 360° 的整数倍，信号才能同相叠加。晶振在串联谐振点附近呈感性/容性，和负载电容一起决定相位。\n\n**幅度条件**：环路的负阻（放大器的增益）要大于晶振的等效串联电阻（ESR）加上负载/走线损耗。也就是“放大器提供的能量 > 晶振消耗的能量”，才能维持振荡。MCU 手册通常给“最大 ESR”和“推荐负载电容”，就是保证这个条件。\n\n**负载电容**：晶振标称频率是在指定负载电容 `CL` 下测的。PCB 上的实际负载电容是 `C1`、`C2` 串联再并联杂散电容 `Cstray`。公式：\n\n`CL = C1×C2/(C1+C2) + Cstray`\n\n当 `C1=C2` 时，`CL = C1/2 + Cstray`，所以 `C1 = C2 = 2×(CL − Cstray)`。\n\n算例：CL=8pF，Cstray=3pF，`C1=C2=2×(8−3)=10pF`。取 10pF 标准值。如果取 20pF，实际 CL=13pF，频率偏低；取 5pF，实际 CL=5.5pF，频率偏高，甚至不起振。\n\n**Cstray 不是固定值**：走线越长、焊盘越大、附近铜箔越多，Cstray 越大。经验值 2～5pF，布局紧凑取小，走线长取大。手册给的 CL 是“晶振的负载”，不是“PCB 电容”，要减去 Cstray。\n\n**ESR**：晶振的等效串联电阻，通常在几十Ω到几百Ω。ESR 太高的晶振，MCU 的负阻不够，起振困难。选晶振要看手册的“最大 ESR”，不要只看频率/精度。\n\n**起振时间**：晶振从加电到稳定需要时间，通常几 ms 到几十 ms。MCU 的启动代码要等晶振稳定（OVR/RDY 标志）再切换时钟，不能上电就切。\n\n#### 15.2.4 内部 RC、外部晶振与时钟树\n\nMCU 的时钟可以来自内部 RC、外部晶振、外部时钟输入，再经过 PLL 倍频到系统时钟。\n\n**内部 RC**：便宜、省引脚，精度差（±1%～±5%），温漂大。适合“能跑就行”的应用，不适合 USB/串口高波特率/长时间计时。\n\n**外部晶振**：精度高（几十 ppm），需要晶振 + 负载电容 + 布局。适合 USB、以太网、高精度计时。\n\n**外部时钟输入**：由外部有源晶振/时钟芯片提供方波，直接进 MCU 的 OSC_IN。适合多芯片共享时钟/高精度场景。\n\n**PLL**：把晶振频率倍频到系统时钟。PLL 的配置要按手册，输入频率/分频/倍频/输出范围不能超。PLL 失锁，系统时钟会切回内部 RC 或停振。\n\n**时钟树**：系统时钟 → AHB/APB 分频 → 外设时钟。每个外设的时钟要单独使能，没使能的外设读写会出错/卡死。低功耗模式要关掉不用的时钟。\n\n**时钟切换**：从内部 RC 切到 PLL/外部晶振，要等目标时钟稳定；切换失败要能回退。启动代码里的时钟配置错，会导致“程序跑飞/串口乱码”。\n\n**时钟与接口**：USB 需要 48MHz（±0.25%），以太网需要 25MHz/50MHz，CAN 需要精确时钟。这些接口的时钟要专门核算，不能拿内部 RC 凑。\n\n### 15.3 关键参数与手册\n\n| 项目 | 关键参数 | 说明 |\n|---|---|---|\n| 晶振 | 频率、负载电容 CL、ESR、精度 | 按 MCU 手册选 |\n| 负载电容 | C1/C2 | `C1≈C2≈2×(CL−Cstray)` |\n| 复位 | 复位阈值、复位时间 | 按 MCU 手册 |\n| SWD | SWDIO/SWCLK/GND/VCC | 上拉/串联电阻按手册 |\n| EEPROM | 地址、I²C 速率 | 地址不能冲突 |\n| I²C 上拉 | 2.2k～10k | 按速率/总线电容 |\n| 按键 | 上拉/下拉、去抖 | RC/软件去抖 |\n\n晶振负载电容估算：\n\n`C1 = C2 ≈ 2×(CL − Cstray)`\n\n例：CL=8pF，Cstray=3pF，则 `C1=C2≈10pF`，取 10pF/12pF 标准值。\n\n#### 15.2.2 复位：不是“拉低一下”这么简单\n\n复位让 MCU 回到初始状态，但复位的来源有很多种，行为也不同。\n\n**上电复位（POR）**：电源上升时，复位电路保持低电平，等电源稳定、时钟稳定后再释放。POR 的阈值和延时由芯片内部/外部 RC 决定。RC 太小，电源还没稳就释放，MCU 可能跑飞；RC 太大，启动慢。\n\n**手动复位**：按键拉低复位脚，松开后 RC 充电释放。按键要加去抖（RC 或软件），否则一次按下会产生多次复位。按键卡住，MCU 一直复位，现场“死机”。\n\n**看门狗复位（WDT）**：MCU 内部/外部看门狗计时，程序定期“喂狗”；程序跑飞/死循环，看门狗溢出复位。看门狗要能在程序卡死时独立工作，不能依赖主循环。\n\n**低电压复位（BOR）**：电源低于阈值时复位，防止 MCU 在低压下乱跑/写坏 Flash。BOR 阈值要高于 MCU 的最低工作电压，低于正常电源纹波。\n\n**复位电路的选择**：\n\n- 简单 RC + 按键：便宜，适合课程项目；\n- 专用复位 IC（如 MAX809）：阈值准、延时固定，适合产品；\n- 内部 POR + 外部按键：很多 MCU 自带 POR，外部只需按键/电容；\n- 看门狗：内部/外部，按可靠性要求选。\n\n**复位脚的上拉/下拉**：复位通常是低有效，内部有上拉，外部可以加 10k 上拉 + 100nF 电容 + 按键。复位脚不能浮空，否则噪声会误复位。\n\n**复位与调试**：SWD 的 NRST 可以接复位脚，调试器可以控制复位。但 NRST 上的电容会影响调试器的复位时序，电容太大可能无法连接。调试口附近要留 NRST 测试点。\n\n#### 15.3.2 复位阈值与延时的计算\n\n复位电路要满足两个数字：**阈值**和**延时**。\n\n**阈值**：复位释放的电压点。MCU 手册会给“最低工作电压”和“POR 释放阈值”。外部复位 IC 的阈值要高于 MCU 最低工作电压，低于正常电源电压。比如 MCU 最低 1.8V，电源 3.3V，复位 IC 选 2.9～3.0V 阈值，既保证低压时复位，又不误触发。\n\n**延时**：复位保持低电平的时间。要大于“电源稳定时间 + 时钟稳定时间 + MCU 内部复位时间”。RC 电路的延时 `τ=RC`，复位释放大约在 `3～5τ`。比如 R=10k、C=100nF，`τ=1ms`，释放约 3～5ms。\n\n算例：MCU 要求复位低电平至少 1ms，电源上升时间 2ms，晶振起振 5ms。RC 要保证 `3τ ≥ 1ms`，取 τ=1ms 足够；但电源/晶振稳定时间更长，实际要等 MCU 内部 POR 或软件延时。\n\n**RC 的局限**：RC 复位对电源上升速度敏感，电源慢升/快升，复位时间都不同；电源跌落时，RC 可能不能及时复位。产品级用专用复位 IC，阈值/延时固定。\n\n**复位 IC 的选择**：看阈值、延时、复位极性（低有效/高有效）、手动复位输入、看门狗。MAX809/811 是常用低有效复位 IC，阈值 2.63/2.93/3.08V 等。\n\n**看门狗时间**：看门狗溢出时间要大于“最长正常任务时间”，小于“故障容忍时间”。比如主循环 10ms，看门狗设 100ms；喂狗要在主循环里，不能在中断里（中断还在跑，主循环可能已死）。\n\n**复位后的状态**：复位释放后，GPIO 是输入/高阻，外设未初始化。复位电路要保证释放时电源/时钟已稳定，否则 MCU 可能读到错误状态。\n\n### 15.4 三个典型电路\n\n#### 15.4.1 晶振\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 15-1：晶振与负载电容<\/text>\n  <rect x=\"220\" y=\"80\" width=\"160\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"260\" y=\"115\" font-size=\"14\" fill=\"currentColor\">MCU<\/text>\n  <text x=\"240\" y=\"140\" font-size=\"12\" fill=\"currentColor\">OSC_IN<\/text>\n  <text x=\"240\" y=\"165\" font-size=\"12\" fill=\"currentColor\">OSC_OUT<\/text>\n  <rect x=\"430\" y=\"95\" width=\"60\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"440\" y=\"135\" font-size=\"12\" fill=\"currentColor\">Y1<\/text>\n  <text x=\"440\" y=\"155\" font-size=\"11\" fill=\"currentColor\">8MHz<\/text>\n  <line x1=\"380\" y1=\"135\" x2=\"430\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"380\" y1=\"160\" x2=\"430\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"490\" y1=\"135\" x2=\"540\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"540\" y1=\"135\" x2=\"540\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"180\" x2=\"560\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"570\" y=\"185\" font-size=\"12\" fill=\"currentColor\">C1 10pF<\/text>\n  <line x1=\"490\" y1=\"160\" x2=\"540\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"540\" y1=\"160\" x2=\"540\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"220\" x2=\"560\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"570\" y=\"225\" font-size=\"12\" fill=\"currentColor\">C2 10pF<\/text>\n  <text x=\"220\" y=\"250\" font-size=\"13\" fill=\"currentColor\">晶振靠近 MCU，走线短，下面包地，不走高速线。<\/text>\n<\/svg>\n```\n\n#### 15.4.2 复位\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 15-2：上电复位 + 手动复位<\/text>\n  <text x=\"40\" y=\"95\" font-size=\"13\" fill=\"currentColor\">3.3V<\/text>\n  <line x1=\"85\" y1=\"90\" x2=\"130\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"130\" y=\"75\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"95\" font-size=\"12\" fill=\"currentColor\">R 10k<\/text>\n  <line x1=\"190\" y1=\"90\" x2=\"250\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"255\" y=\"85\" font-size=\"12\" fill=\"currentColor\">NRST<\/text>\n  <line x1=\"250\" y1=\"90\" x2=\"250\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"130\" x2=\"270\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"140\" x2=\"260\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"280\" y=\"140\" font-size=\"12\" fill=\"currentColor\">C 100nF<\/text>\n  <line x1=\"250\" y1=\"140\" x2=\"250\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"175\" x2=\"270\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"280\" y=\"180\" font-size=\"12\" fill=\"currentColor\">GND<\/text>\n  <circle cx=\"330\" cy=\"90\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"98\" x2=\"330\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"310\" y1=\"130\" x2=\"350\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"135\" font-size=\"12\" fill=\"currentColor\">复位按键<\/text>\n  <text x=\"40\" y=\"230\" font-size=\"13\" fill=\"currentColor\">RC 时间常数 ≈ 1ms；按键按下拉低，松开后电容充电复位。<\/text>\n<\/svg>\n```\n\n#### 15.4.3 SWD 调试\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 15-3：SWD 四线连接<\/text>\n  <rect x=\"80\" y=\"80\" width=\"140\" height=\"120\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"105\" y=\"110\" font-size=\"13\" fill=\"currentColor\">调试器<\/text>\n  <text x=\"100\" y=\"135\" font-size=\"12\" fill=\"currentColor\">3.3V<\/text>\n  <text x=\"100\" y=\"155\" font-size=\"12\" fill=\"currentColor\">GND<\/text>\n  <text x=\"100\" y=\"175\" font-size=\"12\" fill=\"currentColor\">SWDIO<\/text>\n  <text x=\"100\" y=\"195\" font-size=\"12\" fill=\"currentColor\">SWCLK<\/text>\n  <rect x=\"430\" y=\"80\" width=\"140\" height=\"120\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"460\" y=\"110\" font-size=\"13\" fill=\"currentColor\">MCU<\/text>\n  <text x=\"455\" y=\"135\" font-size=\"12\" fill=\"currentColor\">VDD<\/text>\n  <text x=\"455\" y=\"155\" font-size=\"12\" fill=\"currentColor\">GND<\/text>\n  <text x=\"455\" y=\"175\" font-size=\"12\" fill=\"currentColor\">SWDIO<\/text>\n  <text x=\"455\" y=\"195\" font-size=\"12\" fill=\"currentColor\">SWCLK<\/text>\n  <line x1=\"220\" y1=\"135\" x2=\"430\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"220\" y1=\"155\" x2=\"430\" y2=\"155\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"220\" y1=\"175\" x2=\"430\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"220\" y1=\"195\" x2=\"430\" y2=\"195\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"245\" font-size=\"13\" fill=\"currentColor\">四根线必须可靠：VCC/GND/SWDIO/SWCLK；GND 不能省。<\/text>\n<\/svg>\n```\n\n#### 15.4.4 I²C 传感器\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 15-4：I²C 上拉与地址<\/text>\n  <text x=\"40\" y=\"80\" font-size=\"13\" fill=\"currentColor\">3.3V<\/text>\n  <line x1=\"85\" y1=\"75\" x2=\"130\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"130\" y=\"60\" width=\"50\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"138\" y=\"80\" font-size=\"11\" fill=\"currentColor\">4.7k<\/text>\n  <line x1=\"180\" y1=\"75\" x2=\"300\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"220\" y=\"65\" font-size=\"12\" fill=\"currentColor\">SCL<\/text>\n  <line x1=\"85\" y1=\"120\" x2=\"130\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"130\" y=\"105\" width=\"50\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"138\" y=\"125\" font-size=\"11\" fill=\"currentColor\">4.7k<\/text>\n  <line x1=\"180\" y1=\"120\" x2=\"300\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"220\" y=\"110\" font-size=\"12\" fill=\"currentColor\">SDA<\/text>\n  <rect x=\"300\" y=\"60\" width=\"120\" height=\"100\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"320\" y=\"95\" font-size=\"13\" fill=\"currentColor\">传感器<\/text>\n  <text x=\"320\" y=\"120\" font-size=\"11\" fill=\"currentColor\">地址 0x48<\/text>\n  <text x=\"470\" y=\"95\" font-size=\"13\" fill=\"currentColor\">总线上所有器件地址不能冲突；<\/text>\n  <text x=\"470\" y=\"120\" font-size=\"13\" fill=\"currentColor\">上拉阻值按速率/总线电容选。<\/text>\n<\/svg>\n```\n\n#### 15.2.3 SWD/JTAG 与启动模式\n\n**SWD** 是两线调试：SWDIO（数据）、SWCLK（时钟），加上 VCC、GND，最少四根。SWD 的优点是引脚少、速度快，适合小封装 MCU。\n\n**JTAG** 是四/五线：TCK、TMS、TDI、TDO，加上 TRST（可选）、VCC、GND。JTAG 的优点是标准、可链式连接多个器件；缺点是引脚多。\n\n**SWD 连接要点**：\n\n- VCC 要接目标板的电源（不是调试器的电源），让调试器检测目标电压；\n- GND 必须可靠连接，最好多根/短；\n- SWDIO 通常需要上拉（内部/外部），SWCLK 需要下拉（内部/外部），按 MCU 手册；\n- 串联电阻（22～100Ω）可以抑制振铃，但太大会影响速率；\n- 调试口要留测试点/排针，丝印标清 1 脚。\n\n**启动模式（BOOT）**：MCU 上电时根据 BOOT 引脚选择从 Flash/系统存储器/DFU 启动。BOOT 引脚要加上拉/下拉，不能浮空；BOOT 测试点要可及，方便强制进入下载模式。\n\n**调试口布局**：SWD 排针靠板边，1 脚标清；SWDIO/SWCLK 走线短，不要和高速/电源并行；GND 引脚靠近信号引脚；调试口附近留 NRST、BOOT 测试点。\n\n**常见错误**：SWD 少接 GND、VCC 接错、SWDIO/SWCLK 反接、BOOT 浮空、NRST 电容太大。这些错误会让“芯片识别不到/下载失败”，但芯片本身可能是好的。\n\n#### 15.4.6 调试口、BOOT 与测试点的布局\n\n调试口是“板子和外界对话的窗口”，布局错了，后面调试很痛苦。\n\n**排针/座子**：SWD 用 2.54mm 排针或 1.27mm 座子，靠板边，1 脚标清（丝印圆点/三角）。排针周围留出调试器探针的空间，不要被高器件挡住。\n\n**走线**：SWDIO/SWCLK 走线短，尽量 <5cm；不要和电源/高速线并行；下面有地平面。串联电阻（22～100Ω）靠近 MCU 或排针，按手册。\n\n**GND**：调试口的 GND 要多根/靠近信号，最好单独一根 GND 引脚；GND 走线要粗，不能和信号共用细线。\n\n**VCC**：调试口的 VCC 接目标板电源，让调试器检测目标电压；不要接调试器的 VCC 给目标供电（除非确认电流/电压匹配）。\n\n**BOOT**：BOOT0/BOOT1 加上拉/下拉，不能浮空；留测试点/跳线，方便强制进入下载模式。BOOT 引脚的电平在复位时采样，复位期间不能变。\n\n**NRST**：复位测试点要可及；NRST 电容不要太大（否则调试器复位困难）；NRST 可以接调试器的复位脚。\n\n**测试点**：电源、GND、SWDIO、SWCLK、NRST、BOOT、UART TX/RX 都要留测试点。测试点要够大（1mm 以上），探针能稳定接触；不要被丝印/器件盖住。\n\n**常见错误**：排针 1 脚反、SWDIO/SWCLK 反、GND 少、VCC 接错、BOOT 浮空、NRST 电容太大。调试口的问题，往往在“第一次下载”时暴露，改板代价高，布局时要按 checklist 检查。\n\n#### 15.4.7 上电时序：时钟、复位、电源的配合\n\n上电不是“电源一加，一切就绪”。电源、时钟、复位有先后，顺序错了，MCU 可能锁死/跑飞。\n\n**典型顺序**：电源上升 → 内部 POR 保持复位 → 时钟起振 → POR 释放 → 程序启动 → 配置 PLL/外设。\n\n**电源上升慢**：LDO/DC-DC 软启动，电源上升时间可能几 ms。复位要等电源稳定，否则 MCU 在低压下跑飞。\n\n**时钟未稳就释放复位**：MCU 用未稳的时钟启动，PLL 可能失锁，程序跑飞。启动代码要等时钟稳定标志。\n\n**复位释放太早**：电源/时钟没稳，MCU 读到错误状态。RC 复位要按最慢的电源上升时间算。\n\n**多电源域**：MCU 有 VDD/VDDA/VDDIO 多个电源，上电顺序按手册。VDDA 先于 VDD 可能损坏；VDDIO 晚于 VDD 可能让 IO 状态不确定。\n\n**调试器供电**：调试器给目标供电时，要确认电压/电流；调试器 VCC 和目标 VCC 冲突会倒灌。\n\n**排查**：用示波器四通道同时抓 VDD、NRST、OSC_OUT、SWDIO，看时序。上电问题往往是“顺序/时间”，不是“器件坏”。\n\n### 15.5 选型与降额\n\n| 模块 | 选型要点 | 降额 |\n|---|---|---|\n| 晶振 | 频率/CL/精度/封装 | 负载电容按手册，不随意 |\n| 复位 IC | 阈值/延时/手动复位 | 阈值覆盖电源波动 |\n| EEPROM | 容量/接口/地址 | 地址不冲突 |\n| 按键 | 行程/寿命/防水 | 上拉/去抖 |\n| 蜂鸣器 | 有源/无源/电压/电流 | 三极管/MOS 驱动 |\n| I²C 传感器 | 地址/速率/量程 | 上拉/总线电容 |\n\n#### 15.3.1 晶振的 ESR、精度与温度\n\n选晶振不只看频率，还要看四个参数：负载电容 CL、ESR、精度（ppm）、温度特性。\n\n**ESR**：等效串联电阻。ESR 越大，起振越难，功耗越大。MCU 手册通常给“最大 ESR”，比如 8MHz 晶振 ESR ≤ 100Ω。选型时 ESR 要小于手册值，留余量。\n\n**精度**：标称频率的偏差，单位 ppm（百万分之一）。20ppm 的 8MHz 晶振，偏差 `8MHz × 20e-6 = 160Hz`。串口波特率对时钟精度敏感，USB 要求更严（通常 ±0.25% 以内）。普通 UART 用 20～50ppm 足够，USB 要用专门晶振/内部 PLL。\n\n**温度特性**：晶振频率随温度漂移。普通晶振在 −20～+70℃ 可能漂几十 ppm；温补晶振（TCXO）可以做到几 ppm。工业/户外产品要按温度范围选。\n\n**负载电容**：CL 要匹配，C1/C2 按公式算。CL 选错，频率偏；偏太多，起振失败。\n\n**封装**：贴片晶振（3225、2520、2016）体积小，适合高密度板；插件晶振（HC-49）便宜，适合教学。贴片晶振的焊盘要按手册，不能按“差不多”建。\n\n**晶振的布局**：靠近 MCU 的 OSC_IN/OSC_OUT，走线短、等长（不一定等长，但要短）；下方包地，不走高速/电源；负载电容靠近晶振，地回到 MCU 的 GND；晶振下方不要打过孔（除非是地过孔）。\n\n**起振测试**：用示波器测 OSC_OUT（注意探头电容会影响起振），或测 MCU 的时钟输出（MCO）引脚。没有 MCO，可以用频率计/示波器测晶振脚，但探头电容可能让本来勉强的晶振不起振。\n\n#### 15.5.1 I²C 上拉与总线电容的核算\n\nI²C 的上拉不是“随便放 4.7k”，要按总线电容和速率算。\n\n**上拉下限**：`Rmin = (Vcc − Vol)/Iol`。`Vol` 是器件输出低电平，`Iol` 是灌电流能力。3.3V、Vol=0.4V、Iol=3mA，`Rmin=(3.3−0.4)/0.003≈967Ω`。上拉不能小于这个值，否则器件拉不低。\n\n**上拉上限**：上升沿时间 `tr ≈ 0.8473×R×Cb`（从 0.3Vcc 到 0.7Vcc）。标准模式 100kHz 要求 `tr ≤ 1μs`，快速模式 400kHz 要求 `tr ≤ 300ns`。总线电容 `Cb` 包括器件引脚/走线/连接器，典型 50～200pF。\n\n算例：Cb=100pF，100kHz 要求 tr≤1μs，`R ≤ 1μs/(0.8473×100pF) ≈ 11.8kΩ`。取 4.7k，tr≈0.4μs，满足。400kHz 要求 tr≤300ns，`R ≤ 3.5kΩ`，4.7k 就不够，要换 2.2k。\n\n**总线电容**：I²C 标准规定总线电容 ≤400pF（快速模式），超了上升沿变慢/通信失败。器件多/线长要算电容，必要时减小上拉/加缓冲器。\n\n**地址冲突**：I²C 器件地址由固定位 + 地址引脚决定。地址冲突时，两个器件同时响应，SDA 被拉低/数据错。解决：改地址引脚、用 I²C 多路复用器、换器件。\n\n**上拉的功耗**：上拉在低电平时有电流 `Vcc/R`。4.7k、3.3V，约 0.7mA；2.2k 约 1.5mA。电池产品要权衡速率/功耗。\n\n**I²C 的保护**：SDA/SCL 加 ESD、串阻（22～100Ω）；热插拔时 SDA/SCL 可能被拉低，串阻限流；总线长要加缓冲器/隔离。\n\n### 15.6 测量与仿真\n\n#### 15.4.5 EEPROM、按键、蜂鸣器：小模块的大坑\n\n**EEPROM**：I²C/SPI 接口，注意地址（A0/A1/A2）、写保护（WP）、上拉。WP 悬空可能被误写，要接 GND/VCC（按手册）；地址脚不能浮空，否则地址不确定。EEPROM 的电源要加 100nF 去耦，写操作时电流突变。\n\n**按键**：机械按键有抖动，要 RC 去抖（比如 10k 上拉 + 100nF）或软件去抖。按键要上拉/下拉，不能浮空；长线按键要加串阻/ESD，防止静电。按键的行程/寿命/防水按使用场景选。\n\n**蜂鸣器**：有源蜂鸣器（自带振荡）加电压就响，无源蜂鸣器需要 PWM 驱动。蜂鸣器电流通常几十 mA，不能直接接 GPIO（GPIO 通常几 mA～十几 mA），要用三极管/MOS 驱动，加续流二极管（有源/电磁式）。\n\n**LED**：加限流电阻，电阻按 `(Vcc−Vf)/If` 算。LED 的反向耐压很低，不要反接；多色 LED 要分别限流。\n\n**I²C 传感器**：地址不能冲突，上拉按速率/总线电容选；传感器的电源要干净，模拟传感器要加 LDO/滤波；中断脚要加上拉，不能浮空。\n\n**模块的布局**：小模块靠近 MCU 的对应引脚，走线短；按键/蜂鸣器/连接器靠板边，方便操作；EEPROM/传感器远离发热/高速。\n\n**常见错误**：EEPROM WP 悬空、按键浮空、蜂鸣器直连 GPIO、LED 没限流、I²C 地址冲突。这些小模块不工作，往往被误判为“MCU 坏了”，实际是外围电路错。\n\n#### 15.6.1 检查顺序\n\n1. 测晶振是否起振（示波器/频率计）。\n2. 测复位脚上电波形，确认复位时间。\n3. 测 SWD 四线通断。\n4. 测 I²C 上拉电压/波形。\n5. 按键按下/松开电平。\n\n#### 15.6.4 用示波器测晶振、复位与 I²C\n\n**测晶振**：\n\n- 探头要选低电容（<10pF），否则探头电容会让晶振停振；\n- 测 OSC_OUT 或 MCO，不要直接测 OSC_IN（OSC_IN 是高阻/敏感节点）；\n- 看波形是否起振、幅度、频率；幅度太小/波形畸变，说明负阻不够/负载电容不对；\n- 没有示波器，可以用频率计测 MCO，或看 MCU 是否能正常跑程序。\n\n**测复位**：\n\n- 单次触发，抓上电/按键瞬间的 NRST；\n- 看低电平持续时间是否满足 MCU 复位要求；\n- 看释放后是否有毛刺/多次复位；\n- 按键按下/松开，看抖动次数。\n\n**测 I²C**：\n\n- 测 SCL/SDA 的上拉电压、上升沿；\n- 看 SCL 频率、SDA 数据是否稳定；\n- 地址冲突时，SDA 会被某个器件拉低，波形异常；\n- 总线电容太大，上升沿变慢，要减小上拉/缩短总线。\n\n**测 SWD**：\n\n- 测 SWDIO/SWCLK 通断、对地/对电源短路；\n- 测 VCC 目标电压、GND 通断；\n- 用调试器读 ID，读不到先查线，不要先怀疑芯片。\n\n**测量注意事项**：示波器地线要短，避免地环路；探头衰减/带宽要匹配；测晶振时尽量用低电容探头/有源探头。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 15-5：复位释放与看门狗时序<\/text>\n  <line x1=\"60\" y1=\"90\" x2=\"660\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n  <text x=\"40\" y=\"80\" font-size=\"11\" fill=\"currentColor\">3.3V<\/text>\n  <line x1=\"60\" y1=\"150\" x2=\"660\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n  <text x=\"30\" y=\"155\" font-size=\"11\" fill=\"currentColor\">NRST<\/text>\n  <path d=\"M80 90 L140 90 L170 60 L640 60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M80 150 L250 150 L270 110 L640 110\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"132\" font-size=\"11\" fill=\"currentColor\">复位释放<\/text>\n  <line x1=\"360\" y1=\"190\" x2=\"660\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n  <text x=\"30\" y=\"212\" font-size=\"11\" fill=\"currentColor\">WDT<\/text>\n  <path d=\"M80 190 L360 190 L380 160 L480 160 L500 190 L640 190\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"390\" y=\"150\" font-size=\"11\" fill=\"currentColor\">喂狗<\/text>\n  <text x=\"505\" y=\"178\" font-size=\"11\" fill=\"currentColor\">溢出→复位<\/text>\n  <text x=\"40\" y=\"245\" font-size=\"12\" fill=\"currentColor\">复位要等电源/时钟稳定；看门狗要独立于主循环。<\/text>\n  <text x=\"40\" y=\"275\" font-size=\"12\" fill=\"currentColor\">NRST 电容太大，调试器复位时序会受影响。<\/text>\n<\/svg>\n```\n\n#### 15.6.2 CircuitJS\n\n```circuitjs\nrc-charge\n```\n\n观察 RC 充电波形，对应复位延时。\n\n```circuitjs\ngpio-button\n```\n\n观察按键上拉/去抖。\n\n#### 15.6.5 上电不启动的排查流程\n\nMCU 上电不启动，按“电源→时钟→复位→启动模式→调试口”的顺序查，不要一上来就换芯片。\n\n**1. 电源**：测 VDD/VDDA 电压、纹波；测每个电源脚是否都接上；测复位期间电源是否稳定。电源不对，后面都不用查。\n\n**2. 时钟**：测晶振是否起振（OSC_OUT/MCO）；测晶振负载电容、ESR；没有晶振，MCU 可能用内部 RC 跑，但 USB/串口不准。\n\n**3. 复位**：测 NRST 上电波形，看是否一直低/释放太早/有毛刺；测按键是否卡住；测复位 IC 阈值。\n\n**4. 启动模式**：测 BOOT0/BOOT1 电平，确认从 Flash 启动；BOOT 浮空会导致启动模式不确定。\n\n**5. 调试口**：测 SWD 四线通断、VCC/GND；用调试器读 ID，读不到先查线/BOOT/复位。\n\n**6. 程序**：确认程序下载成功、复位向量正确、时钟配置正确；用调试器单步/看门狗确认程序是否跑飞。\n\n**7. 外围**：确认 EEPROM/传感器/接口没有把总线拉死；I²C 地址冲突/短路会让程序卡在初始化。\n\n**记录**：每一步测到什么、和预期差多少。排查不是“猜”，是“用测量排除”。大部分“不启动”是电源/复位/时钟/BOOT 四个之一，不是芯片坏。\n\n#### 15.6.3 动手任务\n\n- 画一个 8MHz 晶振 + 10pF 负载电容电路。\n- 画复位 RC + 按键。\n- 画 SWD 四线座。\n- 测一块开发板的晶振/复位/SWD。\n\n### 15.7 常见坑\n\n1. **晶振负载电容拍脑袋**：频率偏/不起振。按 `CL` 和 `Cstray` 算，不要拿 22pF 到处套。\n2. **晶振走线太长**：易受干扰。靠近 MCU、短、包地、下方不走高速。\n3. **复位电容太大**：上电不启动。按复位时间算，电容大释放慢。\n4. **复位按键卡住**：现场“死机”。按键要能回弹，结构/外壳别压住。\n5. **SWD 不接地**：下载不稳定。VCC/GND/SWDIO/SWCLK 四根都要可靠。\n6. **I²C 地址冲突**：总线读不到。地址脚不能浮空，多个器件要错开。\n7. **I²C 上拉太小/太大**：波形上升沿差/功耗大。按总线电容/速率算上下限。\n8. **蜂鸣器直接用 GPIO 驱动**：电流超限。用三极管/MOS，加续流二极管。\n9. **EEPROM 写保护脚悬空**：数据被误写。WP 接 GND/VCC，地址脚不浮空。\n\n### 15.8 本章复盘\n\n#### 15.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| `C1=C2≈2×(CL−Cstray)` | 晶振负载电容 | 按手册 CL |\n| `τ=RC` | 复位延时 | 按 MCU 复位时间 |\n| I²C 上拉 2.2k～10k | 总线 | 按速率/电容 |\n| SWD 四线 | 调试 | VCC/GND/SWDIO/SWCLK |\n| 晶振包地 | 抗干扰 | 下方不走高速 |\n| `CL = C1×C2/(C1+C2)+Cstray` | 实际负载电容 | 反推 C1/C2 |\n| `tr≈0.8473×R×Cb` | I²C 上升沿 | 按速率定上限 |\n| `Rmin=(Vcc−Vol)/Iol` | I²C 上拉下限 | 灌电流 |\n| 看门狗时间 > 最长任务 | 防跑飞 | 喂狗在主循环 |\n\n#### 15.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 晶振 | crystal | 提供时钟的谐振器件 |\n| 负载电容 | load capacitance | 晶振两端匹配电容 |\n| 复位 | reset | 让 MCU 回到初始状态 |\n| SWD | serial wire debug | 两线调试接口 |\n| 看门狗 | watchdog | 程序跑飞时复位 |\n| I²C | inter-integrated circuit | 两线总线 |\n\n#### 15.8.3 自测 10 题\n\n1. 晶振负载电容怎么算？\n2. 晶振为什么要包地？\n3. 复位 RC 时间常数怎么定？\n4. SWD 最少几根线？\n5. I²C 上拉作用？\n6. I²C 地址冲突怎么排查？\n7. 蜂鸣器为什么不能直连 GPIO？\n8. EEPROM 写保护脚怎么处理？\n9. 看门狗复位和上电复位区别？\n10. 时钟/复位/调试布局各注意什么？\n\n#### 15.8.4 能力清单\n\n- [ ] 能画晶振、复位、SWD、I²C 四个电路。\n- [ ] 能算负载电容/复位时间。\n- [ ] 能检查四件套布局。\n- [ ] 能测晶振/复位/SWD/I²C。\n- [ ] 能说出小模块常见坑。\n\n补充：能解释“晶振为什么需要负阻/负载电容”，能按 `CL` 反算 C1/C2；能区分 POR/手动/看门狗/BOR 四种复位；能画出最小 SWD 四线并标 1 脚；能按总线电容算 I²C 上拉上下限；能用示波器单次触发抓复位/上电时序；能按“电源→时钟→复位→BOOT→调试口”顺序排查不启动。\n\n#### 15.8.6 时钟复位调试评审清单\n\n1. 晶振频率、CL、ESR、精度按手册选了吗？\n2. 负载电容按 `C1=C2=2×(CL−Cstray)` 算了吗？\n3. 晶振靠近 MCU、走线短、下方包地了吗？\n4. 复位阈值/延时满足 MCU 要求吗？\n5. 复位脚有上拉、按键去抖、不浮空吗？\n6. 看门狗时间/喂狗位置合理吗？\n7. SWD 四线（VCC/GND/SWDIO/SWCLK）都接了吗？\n8. SWD 有上拉/下拉/串阻吗？\n9. BOOT 引脚有上拉/下拉/测试点吗？\n10. 调试口 1 脚、NRST、BOOT 丝印清楚吗？\n11. EEPROM 地址/WP 处理了吗？\n12. 按键上拉/去抖、蜂鸣器驱动、LED 限流做了吗？\n13. I²C 上拉/地址/总线电容核算了吗？\n14. 电源/时钟/复位/调试都有测试点吗？\n\n这四件套的共同点是“平时看不见，坏了全板停”。评审时不要只看“有没有画”，要问“参数对不对、位置对不对、测试点够不够”。一个 10pF 的电容、一根没接的地、一个浮空的 BOOT，足以让一块看起来没问题的板子启动不了。\n\n#### 15.8.5 下一章\n\n下一章是阶段项目：**2 层控制板**。把 EDA、封装、布局布线、电源、接口、时钟复位串起来，从需求走到 Gerber、打样、焊接、上电。","taskSignature":"72fe3a8d94ad110d63f915b10348b079094f01e5b66c6ecdcb533023ad66d075","taskCount":5},{"id":"16","title":"第 16 章 · 阶段项目：2 层控制板","short":"阶段项目：2 层控制板","stage":2,"diff":4,"prev":"第 09～15 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 把一句需求拆成功能块、指标、接口和验收条件。\n2. 独立完成一块 2 层控制板的原理图、封装、布局、布线、Gerber。\n3. 设计电源树、继电器/光耦隔离、输入检测、通信接口。\n4. 做 BOM、钢网/坐标、贴片/手焊方案。\n5. 制定上电 Bring-Up 步骤，按顺序排查不亮/不跑/不通。\n6. 做设计评审，列出风险与改进项。\n7. 交付一套可打样、可复现的工程文件。\n\n这是阶段二的收口项目。它不追求“高性能”，追求“从需求到板子”全流程走通，并且每一步都有记录。\n\n## 正文\n\n### 16.1 需求：一块 4 路继电器控制板\n\n需求原文：\n\n> 做一块控制板：12V 供电，4 路继电器输出（每路 10A/250VAC），4 路干接点/湿接点输入，1 路 RS485，1 路 USB 转串口，板载 STM32F103，预留 SWD。\n\n拆成指标：\n\n| 项目 | 指标 | 验收 |\n|---|---|---|\n| 输入 | 12V±10%，最大 2A | 上电不冒烟，电压正常 |\n| 继电器 | 4 路，10A/250VAC | 每路可吸合/释放 |\n| 输入 | 4 路，干/湿可配 | 输入状态可读 |\n| 通信 | RS485 + USB 串口 | 能收发 |\n| MCU | STM32F103C8T6 | 可下载/运行 |\n| 调试 | SWD 四线 | 可连接 |\n| 板尺寸 | ≤100×80mm，2 层 | 打样可做 |\n\n> **术语第一次出现**：干接点（dry contact）是无源开关触点；湿接点（wet contact）是带电压的输入。输入电路要兼容两种，通常用光耦/电阻分压+保护。\n\n#### 16.1.1 把一句需求拆成可验收的条目\n\n“做一块 4 路继电器控制板”是一句话，不是需求。需求要拆到“能测、能判、能签字”的程度。\n\n**功能条目**：4 路继电器独立控制；4 路输入独立检测；RS485 半双工通信；USB 转串口调试；SWD 下载。\n\n**电气条目**：12V±10% 输入，最大 2A；5V/2A、3.3V/0.5A；继电器触点 10A/250VAC；输入干/湿兼容，湿接点最高 24V；RS485 总线 120Ω、共模 −7～+12V。\n\n**机械条目**：板尺寸 ≤100×80mm；2 层、1.6mm、1oz；端子 5.08mm；安装孔 M3；USB/RS485 靠板边。\n\n**环境条目**：工作温度 0～50℃（课程级）；存储 −20～+70℃；无腐蚀性气体。\n\n**验收条目**：每路继电器吸合/释放 100 次无粘连；每路输入干/湿各测 10 次无误判；RS485 9600～115200 收发 1 小时无丢包；USB 枚举稳定；满载 30 分钟温升 ≤30℃；SWD 可下载/调试。\n\n**边界条目**：不做过安规认证；不做雷击/浪涌等级认证；不追求 EMC Class B；继电器触点不带负载做寿命试验（课程条件有限）。\n\n拆完需求，才知道哪些要画、哪些要测、哪些不做。需求不拆，后面一定返工：要么做多了，要么漏了验收项。\n\n拆需求的三个检查：\n\n1. 每条都有数字（电压/电流/尺寸/温度/次数）；\n2. 每条都有验收方法（测什么、怎么测、判据）；\n3. 每条都有边界（不做什么、什么条件不保证）。\n\n课程项目也要按这个标准写，哪怕数字是“课程级”的。写清楚比“差不多”强。需求里没写的功能，默认不做；需求里写了的，必须有验收方法。\n\n### 16.2 系统框图与电源树\n\n功能块：\n\n1. 电源：12V→5V（Buck）→3.3V（LDO）。\n2. MCU：STM32F103 + 晶振 + 复位 + SWD。\n3. 继电器驱动：ULN2003/达林顿 + 续流二极管 + 光耦隔离（可选）。\n4. 输入：RC 滤波 + TVS + 光耦。\n5. 通信：MAX485 + TVS + 终端电阻；CH340/CP2102 USB 转串口。\n6. 接口：接线端子、USB、RS485 端子。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 380\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 16-1：2 层控制板系统框图<\/text>\n  <rect x=\"40\" y=\"70\" width=\"120\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"58\" y=\"100\" font-size=\"11\" fill=\"currentColor\">12V 输入<\/text>\n  <rect x=\"210\" y=\"70\" width=\"120\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"232\" y=\"100\" font-size=\"11\" fill=\"currentColor\">Buck 5V<\/text>\n  <rect x=\"380\" y=\"70\" width=\"130\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"100\" font-size=\"11\" fill=\"currentColor\">LDO 3.3V<\/text>\n  <line x1=\"160\" y1=\"95\" x2=\"210\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"95\" x2=\"380\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"250\" y=\"160\" width=\"200\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"188\" font-size=\"13\" fill=\"currentColor\">STM32F103<\/text>\n  <text x=\"280\" y=\"212\" font-size=\"10\" fill=\"currentColor\">晶振/复位/SWD<\/text>\n  <line x1=\"510\" y1=\"95\" x2=\"560\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"560\" y1=\"95\" x2=\"560\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"560\" y1=\"160\" x2=\"450\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"30\" y=\"285\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"45\" y=\"310\" font-size=\"10\" fill=\"currentColor\">4 路继电器<\/text>\n  <text x=\"45\" y=\"328\" font-size=\"9\" fill=\"currentColor\">ULN2003+续流<\/text>\n  <rect x=\"200\" y=\"285\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"215\" y=\"310\" font-size=\"10\" fill=\"currentColor\">4 路干湿输入<\/text>\n  <text x=\"215\" y=\"328\" font-size=\"9\" fill=\"currentColor\">RC+TVS+光耦<\/text>\n  <rect x=\"370\" y=\"285\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"390\" y=\"310\" font-size=\"10\" fill=\"currentColor\">RS485<\/text>\n  <text x=\"390\" y=\"328\" font-size=\"9\" fill=\"currentColor\">MAX485+TVS<\/text>\n  <rect x=\"540\" y=\"285\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"560\" y=\"310\" font-size=\"10\" fill=\"currentColor\">USB 串口<\/text>\n  <text x=\"560\" y=\"328\" font-size=\"9\" fill=\"currentColor\">CH340/CP2102<\/text>\n  <line x1=\"300\" y1=\"230\" x2=\"105\" y2=\"285\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"330\" y1=\"230\" x2=\"275\" y2=\"285\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"380\" y1=\"230\" x2=\"445\" y2=\"285\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"420\" y1=\"230\" x2=\"615\" y2=\"285\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"365\" font-size=\"11\" fill=\"currentColor\">12V→5V→3.3V；继电器/RS485 用 5V，MCU 用 3.3V；强弱电分区。<\/text>\n<\/svg>\n```\n\n电源预算：\n\n| 负载 | 电压 | 电流 | 功耗 |\n|---|---:|---:|---:|\n| MCU+外设 | 3.3V | 80mA | 0.26W |\n| 继电器线圈×4 | 5V | 4×70mA=280mA | 1.4W |\n| RS485/USB | 5V | 120mA | 0.6W |\n| 余量 | — | 30% | — |\n| 合计 | — | 约 0.8A@5V | Buck 选 2A |\n\n#### 16.2.1 电源预算：峰值、同时性、余量\n\n电源预算不是把每路电流加起来乘 1.3，要考虑“峰值、同时性、转换效率、压降、热”。\n\n**逐路列**：\n\n| 负载 | 电压 | 典型 | 峰值 | 备注 |\n|---|---|---:|---:|---|\n| STM32F103 | 3.3V | 30mA | 50mA | 含外设 |\n| 晶振/复位/LED | 3.3V | 10mA | 15mA | |\n| EEPROM/传感器 | 3.3V | 5mA | 10mA | |\n| RS485 收发器 | 5V | 20mA | 40mA | 发送时 |\n| CH340 | 5V | 20mA | 30mA | |\n| 继电器线圈×4 | 5V | 280mA | 300mA | 同时吸合 |\n| 输入光耦×4 | 5V/12V | 40mA | 60mA | 湿接点 |\n| 其他/LED | 5V | 30mA | 50mA | |\n\n**同时性**：继电器 4 路可能同时吸合，按 4×70mA=280mA 算；如果错开吸合，峰值会低，但不能假设软件一定错开。\n\n**效率**：Buck 12V→5V 效率按 85%～90%，输入电流 `I_in = P_out/(η×V_in)`。5V/0.8A 输出 4W，η=0.88，`I_in=4/(0.88×12)≈0.38A`。12V 输入最大 2A，余量够。\n\n**LDO**：5V→3.3V，压差 1.7V，3.3V/0.1A 时 `P_loss=1.7×0.1=0.17W`，SOT-23 LDO 热阻约 200℃/W，温升 34℃，可接受；如果 3.3V 负载 0.3A，损耗 0.51W，温升 100℃，必须换 Buck 或加散热。\n\n**余量**：按峰值的 1.3 倍选 Buck/LDO；按峰值的 1.5 倍选端子和保险丝。余量不是越大越好，太大则成本/体积/效率变差。\n\n**压降**：12V 输入到板上的端子/保险丝/走线有压降，Buck 的最低输入电压要留够。12V−10%=10.8V，减去 0.3V 压降，Buck 输入最低 10.5V，要能正常工作。\n\n**热**：继电器线圈 1.4W、LDO 0.17W、Buck 损耗约 0.5W，总热约 2W。100×80mm 板自然对流，温升约 10～15℃，可接受；封闭外壳要留散热孔。\n\n电源预算表要写“典型/峰值/同时性/余量”，不能只写一个数。每一路都要能追到“哪个器件、什么工况、哪个手册页码”，否则评审时说不清。Bring-Up 时按峰值加载，看 5V 掉不掉、继电器吸合时 MCU 复位不复位。\n\n#### 16.2.2 系统框图的读法：信号、电源、地三条线\n\n框图不是“摆几个方块”，要能看出三条线：信号怎么走、电源怎么分、地怎么汇。\n\n**信号线**：MCU→ULN→继电器线圈；输入端子→RC/TVS→光耦→GPIO；RS485 A/B→TVS→MAX485→UART；USB D+/D−→ESD→CH340→UART。每条信号线都要标方向/电平/速率。\n\n**电源线**：12V→保险/TVS→Buck→5V→LDO→3.3V；5V 给继电器/RS485/USB；3.3V 给 MCU/晶振/EEPROM。每条电源线标电压/最大电流/去耦。\n\n**地线**：12V 地/5V 地/3.3V 地在单点汇合；继电器/输入端子的功率地不要穿过 MCU 地；USB/RS485 屏蔽地按 EMC 处理。\n\n**框图检查**：\n\n1. 每个方块有输入/输出/电源/地；\n2. 每条线有方向，不画“双向箭头”糊弄；\n3. 关键保护器件（TVS/保险/光耦）在框图里可见；\n4. 测试点/连接器在框图里标出；\n5. 强弱电边界画出来。\n\n框图错了，后面原理图/PCB 都会错。框图评审花 10 分钟，能省几天返工。\n\n### 16.3 关键电路\n\n#### 16.3.1 继电器驱动\n\nMCU GPIO 不能直接驱动继电器线圈。用 ULN2003（达林顿阵列）或 MOS 管；线圈并联续流二极管，触点加 RC/压敏吸收。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 16-2：继电器驱动：GPIO→ULN2003→线圈<\/text>\n  <text x=\"40\" y=\"95\" font-size=\"13\" fill=\"currentColor\">GPIO<\/text>\n  <line x1=\"95\" y1=\"90\" x2=\"150\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"150\" y=\"70\" width=\"100\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"165\" y=\"95\" font-size=\"12\" fill=\"currentColor\">ULN2003<\/text>\n  <text x=\"165\" y=\"115\" font-size=\"11\" fill=\"currentColor\">IN → OUT<\/text>\n  <line x1=\"250\" y1=\"100\" x2=\"330\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"330\" y=\"70\" width=\"100\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"350\" y=\"100\" font-size=\"12\" fill=\"currentColor\">继电器<\/text>\n  <text x=\"345\" y=\"120\" font-size=\"11\" fill=\"currentColor\">线圈 5V<\/text>\n  <line x1=\"330\" y1=\"85\" x2=\"300\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"300\" y1=\"85\" x2=\"300\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"265\" y=\"55\" font-size=\"11\" fill=\"currentColor\">5V<\/text>\n  <path d=\"M300 85 L320 70 L320 100 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"330\" y=\"180\" font-size=\"13\" fill=\"currentColor\">线圈并联续流二极管；触点侧加 RC/压敏，强弱电爬距 ≥6mm。<\/text>\n<\/svg>\n```\n\n#### 16.3.1 继电器驱动：线圈、续流、触点三本账\n\n继电器驱动要算三本账：线圈电流、驱动管功耗、触点灭弧。\n\n**线圈电流**：5V 线圈、70mA，`R_coil=5/0.07≈71Ω`。吸合电流和保持电流可能不同，按手册的最大值算。4 路同时吸合 280mA，5V 电源/走线要按 300mA 设计。\n\n**驱动管**：ULN2003 是达林顿，饱和压降约 1.0～1.4V（看电流）。单路 70mA 时 `V_CE(sat)≈1.1V`，`P=1.1×0.07≈0.077W`，7 路封装总功耗要算。ULN2003 的每路最大 500mA，但总封装功耗有限，4 路 70mA 约 0.3W，SOP-16 热阻约 80℃/W，温升 24℃，可接受。\n\n**续流二极管**：线圈断电时反峰 `V=L×di/dt`，可能几十伏到上百伏，击穿驱动管。续流二极管并联在线圈两端，给电流一条回路。选 `I_F ≥ 线圈电流`、`V_R ≥ 电源电压` 的二极管，如 1N4148（小电流）或 1N4007（较大电流）。二极管方向：阴极接电源侧，阳极接驱动管侧。\n\n**触点灭弧**：继电器触点带 250VAC/10A 负载，断开时电弧会烧蚀触点、产生 EMI。触点并联 RC（如 100Ω+0.1μF/630V）或压敏电阻，吸收电弧。RC 的电容要选 X2/安规电容，不能拿普通瓷片凑。\n\n**触点降额**：10A 触点按 5A 用，寿命/可靠性更好。课程项目不带大负载，但设计要按“可能带”算。\n\n**强弱电爬距**：250VAC 的爬距按标准 ≥6mm（材料组/污染等级不同），继电器触点侧和线圈侧要分开，PCB 开槽/挖空。端子之间、继电器引脚之间都要查。\n\n**驱动逻辑**：ULN2003 是反相（输入高→输出低→线圈通电）。软件要清楚“高有效还是低有效”，上电默认状态要安全（继电器不吸合）。\n\n**光耦隔离（可选）**：如果 MCU 和继电器/输入共地，噪声会串；加光耦隔离，MCU 侧和负载侧地分开。光耦的 CTR、速度、隔离电压要选够。\n\n#### 16.3.2 输入保护\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 16-3：干/湿接点输入保护<\/text>\n  <text x=\"40\" y=\"90\" font-size=\"13\" fill=\"currentColor\">输入端子<\/text>\n  <line x1=\"120\" y1=\"85\" x2=\"180\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"180\" y=\"70\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"188\" y=\"90\" font-size=\"11\" fill=\"currentColor\">R 1k<\/text>\n  <line x1=\"240\" y1=\"85\" x2=\"300\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"300\" y=\"65\" width=\"60\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"310\" y=\"90\" font-size=\"11\" fill=\"currentColor\">TVS<\/text>\n  <line x1=\"360\" y1=\"85\" x2=\"430\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"430\" y=\"65\" width=\"80\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"442\" y=\"90\" font-size=\"11\" fill=\"currentColor\">光耦<\/text>\n  <line x1=\"510\" y1=\"85\" x2=\"580\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"590\" y=\"90\" font-size=\"12\" fill=\"currentColor\">GPIO<\/text>\n  <text x=\"40\" y=\"190\" font-size=\"13\" fill=\"currentColor\">干接点：外部无源，板上提供偏置；湿接点：外部带压，分压/限流。<\/text>\n  <text x=\"40\" y=\"215\" font-size=\"13\" fill=\"currentColor\">TVS 钳位、RC 滤波、光耦隔离，三选二起步。<\/text>\n<\/svg>\n```\n\n#### 16.3.2 干/湿接点输入：分压、光耦、去抖\n\n输入要兼容“干接点（无源开关）”和“湿接点（带电压）”，电路要能自动/跳线适配。\n\n**干接点**：板上提供偏置电压（如 5V/12V），经上拉电阻到输入端子，外部开关闭合时拉到地。上拉电阻要大（如 10k），避免开关触点电流过大；同时要能可靠识别“闭合”。\n\n**湿接点**：外部带 24V/12V，输入要分压/限流。比如 24V 输入、光耦 LED 正向 1.2V、10mA，`R=(24−1.2)/0.01≈2.2kΩ`，功耗 `I²R=0.01²×2200=0.22W`，选 0.5W 电阻。24V 时电阻承受 22.8V，要查耐压。\n\n**光耦**：EL817/PC817 的 CTR 约 50%～300%，输入 10mA、CTR 50%，输出最大 5mA。上拉 4.7k、3.3V 时，输出低电平需要 `3.3/4.7k≈0.7mA`，CTR 够。光耦的速度慢（μs 级），适合按钮/开关，不适合高频脉冲。\n\n**RC 去抖**：机械开关抖动几 ms，RC 时间常数取 10～20ms。比如 10k 上拉 + 1μF，`τ=10ms`。光耦输出侧也可以加 RC/软件去抖。\n\n**TVS/保护**：湿接点可能带浪涌/静电，输入端加 TVS（如 SMBJ24A）、串阻、RC。TVS 的钳位要低于光耦/电阻的耐压。\n\n**共模/隔离**：工业现场输入地可能和板地有压差，光耦隔离能断开地环路。隔离侧的地要单独，爬距/隔离电压按标准。\n\n**输入端子**：5.08mm 端子、线规 16～22AWG；端子之间爬距够；丝印标清 IN1～IN4、COM、干/湿跳线。\n\n**测试**：干接点用短接线模拟开关；湿接点用可调电源 12V/24V 测阈值；去抖用示波器看输出波形；每路至少测 10 次。\n\n#### 16.3.3 RS485\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 16-4：RS485：收发器、终端、保护<\/text>\n  <rect x=\"60\" y=\"90\" width=\"140\" height=\"110\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"78\" y=\"125\" font-size=\"12\" fill=\"currentColor\">MAX485<\/text>\n  <text x=\"78\" y=\"150\" font-size=\"10\" fill=\"currentColor\">RO/DI/DE/RE<\/text>\n  <text x=\"215\" y=\"115\" font-size=\"11\" fill=\"currentColor\">A<\/text>\n  <text x=\"215\" y=\"165\" font-size=\"11\" fill=\"currentColor\">B<\/text>\n  <line x1=\"200\" y1=\"120\" x2=\"350\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"170\" x2=\"350\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"350\" y1=\"120\" x2=\"380\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"380\" y1=\"120\" x2=\"380\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"365\" y=\"135\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"380\" y1=\"165\" x2=\"380\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"380\" y1=\"170\" x2=\"350\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"402\" y=\"155\" font-size=\"10\" fill=\"currentColor\">TVS<\/text>\n  <line x1=\"380\" y1=\"120\" x2=\"520\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"380\" y1=\"170\" x2=\"520\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"470\" y1=\"120\" x2=\"470\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"455\" y=\"135\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"470\" y1=\"165\" x2=\"470\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"452\" y=\"153\" font-size=\"9\" fill=\"currentColor\">120Ω<\/text>\n  <text x=\"530\" y=\"125\" font-size=\"12\" fill=\"currentColor\">A<\/text>\n  <text x=\"530\" y=\"175\" font-size=\"12\" fill=\"currentColor\">B<\/text>\n  <text x=\"40\" y=\"240\" font-size=\"13\" fill=\"currentColor\">终端电阻只在总线两端；A/B 加 TVS/共模，必要时隔离。<\/text>\n<\/svg>\n```\n\n#### 16.3.3 RS485 与 USB：通信接口的工程化\n\n**RS485**：MAX485 是 5V 半双工，RO/DI/DE/RE 四根控制线。DE 高=发送，RE 低=接收；DE/RE 可以并联用一根 GPIO 控制。A/B 差分，终端 120Ω 只在总线两端；偏置电阻让空闲时 A>B。\n\n**保护**：A/B 加 TVS（如 SMBJ6.5CA）、共模电感、串阻（10～22Ω）。工业现场加隔离（ADM2483/隔离电源），隔离电压 2.5kV。\n\n**布线**：A/B 差分等长、等距、同层；终端靠近端子；TVS 靠近端子；共模电感在 TVS 之后。\n\n**USB 转串口**：CH340C 内置晶振，外围简单；CP2102 需要晶振。USB 差分 90Ω、等长；VBUS 加 ESD/保险；D+/D− 加低电容 ESD。\n\n**USB 与 RS485 的地**：USB 的 GND 和板地相连；RS485 如果隔离，隔离侧地单独。不要把所有“地”随便连，地环路会带来共模问题。\n\n**通信测试**：RS485 用 USB-RS485 转换器 + 串口助手，9600/115200 各跑 1 小时；USB 用枚举/收发测试；误码率/丢包记录。\n\n**终端电阻的跳线**：课程板可以留 120Ω 跳线，默认断开；作为总线末端时短接。不要焊死，否则中间节点也带终端。\n\n**偏置电阻**：A 上拉 4.7k 到 5V、B 下拉 4.7k 到 GND，保证空闲状态。偏置电阻和终端一起算，总线负载不要过重。\n\n#### 16.3.5 EMC、接地与屏蔽：项目板的底线\n\n课程项目不追求 EMC 认证，但基本的接地/屏蔽/滤波要有，否则“继电器一吸合，MCU 就复位”。\n\n**继电器/触点**：线圈加续流二极管；触点加 RC/压敏；继电器下方不要走敏感信号；强弱电开槽。\n\n**电源**：12V 入口加 TVS/保险/共模电感；Buck 输入电容紧靠；SW 节点短；输出加 LC/磁珠。\n\n**地**：2 层板地用“分区+单点汇合”：电源地、数字地、功率地在入口附近汇合；继电器/输入大电流回路单独走，不要穿过 MCU 地。\n\n**屏蔽**：USB/RS485 连接器屏蔽壳接机壳地；机壳地和板地通过 0Ω/电容/螺丝连接，按 EMC 需要调整。\n\n**滤波**：RS485 A/B 加共模电感；USB D+/D− 加共模电感（可选）；输入加 RC；电源加磁珠/LC。\n\n**晶振**：晶振下方包地，不走高速；晶振地回到 MCU 地。\n\n**测试**：继电器吸合时测 3.3V 纹波/MCU 复位；用示波器看 SW 节点/触点电弧；有条件做 ESD/浪涌预测试。\n\n**原则**：EMC 不是“加个磁珠就行”，是“源头抑制+路径阻断+敏感体保护”。项目板先把源头（继电器/ Buck）和路径（地/走线）做好。\n\n\n\n\n#### 16.3.4 叠层与布局分区\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 16-5：2 层板分区与叠层<\/text>\n  <rect x=\"40\" y=\"60\" width=\"640\" height=\"200\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"55\" y=\"75\" width=\"170\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"105\" font-size=\"12\" fill=\"currentColor\">电源区<\/text>\n  <text x=\"70\" y=\"125\" font-size=\"11\" fill=\"currentColor\">Buck/LDO/输入电容<\/text>\n  <rect x=\"250\" y=\"75\" width=\"220\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"290\" y=\"105\" font-size=\"12\" fill=\"currentColor\">MCU/数字区<\/text>\n  <text x=\"280\" y=\"125\" font-size=\"11\" fill=\"currentColor\">晶振/SWD/EEPROM<\/text>\n  <rect x=\"500\" y=\"75\" width=\"160\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"105\" font-size=\"12\" fill=\"currentColor\">继电器区<\/text>\n  <text x=\"520\" y=\"125\" font-size=\"11\" fill=\"currentColor\">ULN/续流/端子<\/text>\n  <rect x=\"55\" y=\"175\" width=\"250\" height=\"70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"205\" font-size=\"12\" fill=\"currentColor\">接口区<\/text>\n  <text x=\"70\" y=\"225\" font-size=\"11\" fill=\"currentColor\">RS485/USB/输入端子<\/text>\n  <rect x=\"330\" y=\"175\" width=\"330\" height=\"70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"360\" y=\"205\" font-size=\"12\" fill=\"currentColor\">强弱电隔离带<\/text>\n  <text x=\"355\" y=\"225\" font-size=\"11\" fill=\"currentColor\">爬距 ≥6mm，开槽/挖空<\/text>\n<\/svg>\n```\n\n#### 16.4.1 原理图分页、网络命名与网表核对\n\n项目原理图不能一张纸画到底，要分页、命名、核对。\n\n**分页**：电源页、MCU 页、继电器页、输入页、通信页、连接器页。每页有标题、版本、页码。\n\n**网络命名**：电源 `+12V/+5V/+3V3/GND`；信号 `RLY1_IN/RLY1_OUT`、`IN1_A/IN1_K`、`RS485_A/RS485_B`、`USB_DP/USB_DM`。命名要能看出“从哪来到哪去”，不要用 `N1/N2`。\n\n**跨页连接**：用网络标签/端口，不要用长线跨页；电源/地用全局标签；关键信号加页码/来源。\n\n**ERC**：电源/地冲突、输入输出冲突、未连接引脚、单端网络，全部清零。ERC 的 warning 也要看，不能只关掉。\n\n**网表核对**：导出网表，和 BOM/封装核对：每个器件的封装是否存在、引脚数是否匹配、极性器件方向是否正确。网表里的 `Unknown Pin` 要查。\n\n**版本管理**：原理图/PCB/BOM 同一版本号；改板要记录 ECO（改了什么、为什么、影响哪些文件）。\n\n**评审**：原理图评审按“电源→MCU→接口→保护→连接器”顺序，每条网络有人名/日期。评审不是“看一眼”，是按清单打勾。\n\n**常见错误**：网络名拼错（`RS485_A` vs `RS485A`）、跨页标签漏加、封装引脚数不对、极性器件方向反、电源标签冲突。这些错误在 PCB 上很难改，原理图阶段必须抓。\n\n#### 16.4.3 2 层板的地策略：不完整地怎么用\n\n2 层板没有完整地平面，地策略比 4 层板更重要。\n\n**底层尽量完整地**：底层铺地，少走线；必须走的线要短，下面尽量有地。\n\n**顶层分区铺地**：电源区、数字区、功率区分块铺地，块之间用“桥”连接；不要整板碎铜。\n\n**单点汇合**：电源地/数字地/功率地在入口附近汇合；汇合点用 0Ω/铜箔连接，方便改。\n\n**大电流回路**：继电器/输入端子的大电流回路要走“端子→器件→地”短路径，不要绕到 MCU 下方。\n\n**过孔**：地过孔多打，尤其是晶振/去耦/连接器附近；过孔不要打断地平面。\n\n**去耦**：每个电源脚旁 100nF，电源入口 10μF/100μF；去耦电容的地过孔要短。\n\n**跨分割**：2 层板很难避免，高速/敏感线不要跨分割；必须跨时加缝合电容/地过孔。\n\n**检查**：铺铜后看孤岛、死铜、地通道宽度；DRC 后人工看地回路。\n\n#### 16.3.6 端子、线缆与接线规范\n\n控制板的“最后一公里”是端子和线缆。端子选错/线规不对，前面设计再好也烧。\n\n**端子**：5.08mm 凤凰端子，额定 10A/300V；12V 输入用 2Pin，继电器输出每路 3Pin（COM/NO/NC），输入每路 2Pin。端子要带螺丝/弹片，线缆压接后不松动。\n\n**线规**：10A 用 16AWG（约 1.3mm²），5A 用 18AWG，信号用 22～24AWG。线太细会发热/压降大；线太粗装不进端子。\n\n**压接**：用端子压线钳，压接后拉一下不脱；剥线长度按端子，不要露铜太多/太少；多股线要拧紧/镀锡（按端子要求）。\n\n**接线顺序**：先接 12V/地，再接输入/输出；带电接线危险，断电操作；继电器输出侧 250VAC 要断电/验电。\n\n**标识**：端子丝印 IN1～IN4、OUT1～OUT4、COM、NO、NC、+12V、GND；线缆用号码管/标签，和图纸一致。\n\n**应力**：端子附近留线缆折弯空间；不要让线缆直接拉焊盘；必要时加扎带/线槽。\n\n**测试**：每路端子拉拔/通断；大电流端子测压降/温升；输入/output 绝缘（250VAC 侧）按安规。\n\n**常见错误**：端子间距不够/爬距不够、线规太细、压接不牢、COM/NO/NC 接反、带电接线。这些错误在现场很危险，设计/装配都要按规范。端子/线缆是“人和板子的接口”，任何松动/接反都可能烧板或伤人，项目验收要单独列一项。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 16-6：电源预算与电流分配<\/text>\n  <rect x=\"40\" y=\"70\" width=\"110\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"52\" y=\"95\" font-size=\"11\" fill=\"currentColor\">12V/2A<\/text>\n  <text x=\"52\" y=\"115\" font-size=\"10\" fill=\"currentColor\">端子+保险<\/text>\n  <line x1=\"150\" y1=\"100\" x2=\"220\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"158\" y=\"92\" font-size=\"10\" fill=\"currentColor\">0.4A<\/text>\n  <rect x=\"220\" y=\"70\" width=\"120\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"235\" y=\"95\" font-size=\"11\" fill=\"currentColor\">Buck 5V/2A<\/text>\n  <text x=\"235\" y=\"115\" font-size=\"10\" fill=\"currentColor\">η≈88%<\/text>\n  <line x1=\"340\" y1=\"100\" x2=\"410\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"348\" y=\"92\" font-size=\"10\" fill=\"currentColor\">0.8A<\/text>\n  <rect x=\"410\" y=\"70\" width=\"110\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"422\" y=\"95\" font-size=\"11\" fill=\"currentColor\">LDO 3.3V<\/text>\n  <text x=\"422\" y=\"115\" font-size=\"10\" fill=\"currentColor\">0.3A<\/text>\n  <line x1=\"525\" y1=\"100\" x2=\"600\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"545\" y=\"92\" font-size=\"10\" fill=\"currentColor\">0.1A<\/text>\n  <text x=\"610\" y=\"105\" font-size=\"11\" fill=\"currentColor\">MCU<\/text>\n  <rect x=\"220\" y=\"180\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"235\" y=\"210\" font-size=\"10\" fill=\"currentColor\">继电器 4×70mA<\/text>\n  <rect x=\"360\" y=\"180\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"375\" y=\"210\" font-size=\"10\" fill=\"currentColor\">RS485/USB<\/text>\n  <line x1=\"280\" y1=\"130\" x2=\"280\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"340\" y1=\"130\" x2=\"340\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"340\" y1=\"145\" x2=\"480\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"480\" y1=\"145\" x2=\"480\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"430\" y=\"140\" font-size=\"10\" fill=\"currentColor\">5V 负载<\/text>\n  <text x=\"40\" y=\"270\" font-size=\"11\" fill=\"currentColor\">按峰值+同时性算，余量 1.3 倍；LDO 压差损耗要核。<\/text>\n  <text x=\"40\" y=\"298\" font-size=\"11\" fill=\"currentColor\">继电器同时吸合时，5V 瞬态跌落不能触发 MCU 复位。<\/text>\n<\/svg>\n```\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 16-7：Bring-Up 分步上电流程<\/text>\n  <rect x=\"40\" y=\"60\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"52\" y=\"82\" font-size=\"11\" fill=\"currentColor\">1 目视/短路<\/text>\n  <text x=\"52\" y=\"98\" font-size=\"10\" fill=\"currentColor\">极性/锡珠<\/text>\n  <rect x=\"190\" y=\"60\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"202\" y=\"82\" font-size=\"11\" fill=\"currentColor\">2 空板电源<\/text>\n  <text x=\"202\" y=\"98\" font-size=\"10\" fill=\"currentColor\">限流 100mA<\/text>\n  <rect x=\"340\" y=\"60\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"352\" y=\"82\" font-size=\"11\" fill=\"currentColor\">3 焊 MCU<\/text>\n  <text x=\"352\" y=\"98\" font-size=\"10\" fill=\"currentColor\">SWD 读 ID<\/text>\n  <rect x=\"490\" y=\"60\" width=\"140\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"502\" y=\"82\" font-size=\"11\" fill=\"currentColor\">4 时钟/复位<\/text>\n  <text x=\"502\" y=\"98\" font-size=\"10\" fill=\"currentColor\">起振/波形<\/text>\n  <rect x=\"490\" y=\"160\" width=\"140\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"502\" y=\"182\" font-size=\"11\" fill=\"currentColor\">5 通信<\/text>\n  <text x=\"502\" y=\"198\" font-size=\"10\" fill=\"currentColor\">USB/485 环回<\/text>\n  <rect x=\"340\" y=\"160\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"352\" y=\"182\" font-size=\"11\" fill=\"currentColor\">6 继电器<\/text>\n  <text x=\"352\" y=\"198\" font-size=\"10\" fill=\"currentColor\">逐路吸合<\/text>\n  <rect x=\"190\" y=\"160\" width=\"120\" height=\"
