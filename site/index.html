13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"138.66\" dy=\"13\">E<\/tspan><\/text><text x=\"138.66\" y=\"-61.72\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"138.66\" dy=\"13\">C<\/tspan><\/text><text x=\"95.46\" y=\"-225.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"95.46\" dy=\"13\">5V<\/tspan><\/text><text x=\"86.46\" y=\"-58.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"86.46\" dy=\"13\">RLED<\/tspan><\/text><text x=\"137.67000000000002\" y=\"-4.0000000000000036\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"137.67000000000002\" dy=\"13\">LED<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RB<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><text x=\"16.200000000000006\" y=\"-152.5\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"16.200000000000006\" dy=\"13\">基极上拉<\/tspan><\/text><circle cx=\"72\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"72.0\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">B<\/tspan><\/text><circle cx=\"28.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```circuitjs\npnp-switch\n```\n\n```text\n5V ── E  Q2  C ── 限流电阻 ── LED（A → K）── GND\n       B ── 基极电阻 RB ── 控制端\n       │\n       └── 上拉电阻 ── 5V\n```\n\n当控制端经电阻把 B 拉低，使 B 相对 E 足够低且有合适基极电流时，Q2 可以导通；B 被拉回接近 E 的电位时，Q2 截止。这里控制电压要相对 E 判断。若用 3.3V MCU 控制 5V 高边，不能假设 3.3V 高电平就能可靠关断；还需考虑引脚耐压、反灌和电平转换。两图均是解释连接关系的简化示意，非已选料号的生产电路。\n\n##### 参数和类型如何联系起来？\n\n`VCEO` 是规定条件下 C-E 耐压，`IC` 是集电极电流指标，`VCE(sat)` 是指定电流和基极驱动下的饱和压降。`hFE` 表示一定线性工作条件下的电流增益，它随器件与工作点变化，不能直接当作饱和设计保证值。导通时需要持续基极电流；达林顿结构可提高电流增益，但通常带来更大的饱和压降等代价。下面通过参数和算例继续选型。\n\n##### 原理图符号示意\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 230\" width=\"480\" height=\"230\" role=\"img\" aria-label=\"NPN 和 PNP 三极管符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 100 H110 M110 60 V140 M110 80 L165 45 H195 M110 120 L165 155 H195 M245 100 H325 M325 60 V140 M325 80 L380 45 H410 M325 120 L380 155 H410\"/><path d=\"M148 134 L165 155 L141 150 Z\" fill=\"currentColor\"/><path d=\"M352 138 L337 128 L360 120 Z\" fill=\"currentColor\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"20\" y=\"104\">B<\/text><text x=\"205\" y=\"50\">C<\/text><text x=\"205\" y=\"160\">E<\/text><text x=\"235\" y=\"104\">B<\/text><text x=\"420\" y=\"50\">C<\/text><text x=\"420\" y=\"160\">E<\/text><text x=\"70\" y=\"205\">NPN：箭头向外<\/text><text x=\"280\" y=\"205\">PNP：箭头向内<\/text><\/g><\/svg>\n```\n\n图中是常见符号示意；实物引脚编号与极性仍以具体器件手册为准。\n\n##### 种类、封装和引脚\n\nBJT 分 NPN 与 PNP。开关电路中常见 NPN 低边开关、PNP 高边开关；放大电路常见共射、共集（射极跟随）和共基结构。不同结构的输入输出阻抗、增益和相位不同，不能把“hFE 是 100”当成电路电压增益为 100。\n\nTO-92、SOT-23、SOT-89 和功率封装的引脚排列可能不同，同名器件不同厂商也可能存在不同脚位。先查完整料号和观察方向，确认 B、C、E，再结合 PCB 焊盘编号与丝印核对。丝印代码可能不唯一。\n\n##### 工作状态与开关设计\n\n以 NPN 低边驱动为例：负载上端接电源，下端接集电极 C；发射极 E 接地；MCU 输出经基极电阻接 B。低电平使器件截止，高电平提供基极电流，使器件在满足条件时接近饱和。**线性区 hFE 不是保证开关饱和的设计值**；应查看手册在指定 IC、IB 下的 VCE(sat) 与 VBE(sat)。\n\n假设负载电流 100mA、器件手册饱和测试条件需要基极 5mA、MCU 保证输出高电平不低于 3.0V、VBE(sat) 估计 0.9V，`Rb ≤ (3.0−0.9)/0.005 = 420Ω`，可初选 390Ω。再按最大输出电压、最小基极压降和电阻容差检查最大基极电流及 MCU 输出能力；核对 IC、VCEO、饱和压降、功耗、温度及负载启动电流。上述数字只是算例，不能代替所选器件数据。\n\n若负载为继电器线圈，关断时按电路正确配置续流或其他钳位，核查释放速度和瞬态耐压。电阻负载的开关与线圈负载的故障模式不同。\n\n##### 放大、测量与故障\n\n共射放大可提供电压增益；射极跟随器常用于缓冲，电压增益通常接近但小于 1，实际取决于偏置和负载。放大必须设计静态工作点、信号幅度和供电范围；输入过大可能进入截止或饱和而失真。\n\n二极管档可帮助检查基极与其他端之间的 PN 结，但不同仪表、电路中并联通路和器件结构会影响结果。先断电放电，必要时拆离至少一个引脚，不能只凭一次读数认定全部电气参数合格。\n\n##### 优点、局限与选择\n\n三极管可以用较小的基极电流控制集电极电流，在简单开关、电平转换和模拟放大中用途广；开关导通时需要持续基极电流，饱和压降和功耗也不能忽略。\n\n| 类型或用法 | 常见优点 | 局限与适用场景 |\n|---|---|---|\n| NPN 低边开关 | 接法直观，适合控制小电流指示灯或继电器等负载 | 负载低端不再直接接地；需限制基极电流，并为感性负载设计续流 |\n| PNP 高边开关 | 可控制接在电源正端的负载 | 基极驱动电平必须相对发射极判断；高电压供电时 MCU 可能需要电平转换 |\n| 达林顿管 | 在一定条件下具有较高电流增益，减少所需输入电流 | 饱和压降和关断速度可能不利，须核对实际器件；适用于可接受这些代价的驱动 |\n| 线性放大 | 可组成放大与偏置电路 | 工作点受温度和器件差异影响，需设计偏置与反馈，不能把开关饱和条件套用到线性区 |\n\n**怎么选：**小负载、低频率且 GPIO 有足够驱动电流时，可比较 NPN 方案；电流较大或压降要求严格时，也比较合适的 MOS 管。最终以最坏驱动、电流、损耗和上电状态为依据。\n\n##### 进阶案例：基极电阻同时有上下边界\n\n设计 NPN 开关时，基极电阻既不能太大导致驱动不足，也不能太小让 MCU 或 B-E 结过流。假设器件在目标集电极电流下需要至少 0.5mA 基极电流，MCU 的最小高电平为 3.0V、B-E 饱和电压最大按 0.9V，基极电阻实际最大值需不超过 `(3.0−0.9)/0.5mA=4.2kΩ`。若电阻为 ±1%，标称值还需满足 `Rnom×1.01≤4.2kΩ`。\n\n另一方面，若假设驱动端最高 3.6V、B-E 最小 0.7V，并要求基极电流不超过 1mA，则电阻实际最小值要不小于 `(3.6−0.7)/1mA=2.9kΩ`，即 `Rnom×0.99≥2.9kΩ`。在这组示例假设下，3.3kΩ 标称值处于可选区间。真实可用性仍取决于所选晶体管在实际 IC、IB、温度下的保证值、MCU 的输出规格和功耗；假设的 0.5mA 和 1mA 并非通用额定值。\n\n如果负载不工作，测基极、发射极、集电极电位并结合负载状态判断：基极电压异常可能是驱动、连接或器件问题，不能只依据一个 VBE 数值判定好坏。\n\n##### 🔧 动手练习与参考答案\n\n1. 根据上面的假设，基极电阻上限是多少？**约 420Ω**；初选 390Ω 后仍须核验最大电流。\n2. 画出低边 NPN 驱动线圈和续流二极管，分别标出关断时的电流路径。\n3. 查一个实际 NPN 型号在指定 IC/IB 下的 VCE(sat)、最大电流和 B/C/E 脚位。\n4. 说明 hFE 与饱和开关条件为何不能直接互换。\n5. 低边 NPN 电路中，E 接地且 GPIO 给 B 提供足够驱动时，负载电流路径是什么？**电源→负载→C→E→地**；PNP 高边则需使 B 相对 E 足够低。\n\n##### ✅ 自测清单\n\n- [ ] 能区分 NPN、PNP、B/C/E 和常见封装的观察方向。\n- [ ] 能依据饱和测试条件初算基极电阻并检查 MCU 驱动能力。\n- [ ] 能解释感性负载需要的关断路径与器件耐压。\n\n##### 📚 延伸学习\n\n[嘉立创元器件基础](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)中的晶体管分类与应用；实际设计以具体器件手册为准。\n\n#### 04.4.6 MOS 管（MOSFET）：电压控制的\"电动闸门\"\n\n**学习目标：**能解释 G、D、S 的作用，分别判断增强型 NMOS 和 PMOS 在两种控制电平下的工作状态。\n\n##### 先认识它：用电压控制电流通路\n\nMOSFET（场效应晶体管，常简称 MOS 管）可以用来控制负载，也可以用于电源转换和信号处理。它的控制端是**栅极 G**，负载电流通路通常连接**漏极 D**和**源极 S**。栅极与内部沟道绝缘，稳定状态下栅极漏电通常很小；改变开关状态时，驱动电路仍需给栅极相关电容充放电。\n\nMOS 管原理图位号常为 Q，实物有 SOT-23、SO-8 等封装；相同外形可能是不同类型，G/D/S 顺序也可能不同。**先查完整型号和数据手册的引脚图**，不能凭外观决定连接。\n\n##### 什么是 NMOS、PMOS？\n\nNMOS 指 N 沟道 MOS 管，PMOS 指 P 沟道 MOS 管，二者是按沟道类型区分的器件；常用电源开关器件多为**增强型**。本课先学习增强型的典型用法：\n\n- **增强型 NMOS：**G 的电压比 S 高，形成合适的正栅源电压时，D-S 沟道可以增强导通；G 与 S 电压相同时沟道处于关断条件。\n- **增强型 PMOS：**G 的电压比 S 低，形成合适的负栅源电压时，D-S 沟道可以增强导通；G 与 S 电压相同时沟道处于关断条件。\n\n判断依据是 `VGS=VG−VS`，即**栅极相对于源极的电压**。电压极性正确只是第一步；导通是否足够还取决于具体器件、电流和温度。这里的关断指沟道，体二极管仍可能导通。\n\n##### 电路一：增强型 NMOS 低边开关\n\n下图使用 LED 负载并画出栅极串阻；仿真使用 1kΩ 电阻负载，未加入串联栅阻，用于理解栅源驱动与通断。\n\n```svg\n<svg role=\"img\" aria-label=\"NMOS高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"276.34pt\" width=\"244.10299999999998pt\" viewBox=\"-67.375 -277.49999999999994 244.10299999999998 276.34\"><polygon points=\"117,-175.5 108,-162.9 99,-175.5 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-54.0 L 108,-69 L 84,-69 L 84,-93 L 108,-93 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.00000000000001,-69.0 L 78,-93\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 58.8,-81.0 L 78,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-126 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-144.0 L 108,-162.9 M 117,-162.9 L 99,-162.9 M 108,-175.5 L 108,-194.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.0013506232961,-161.07220035616922 L 94.5,-166.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 80.486 -158.492 L 83.572 -163.573 L 86.43 -158.572 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 85.0013506232961,-169.1722003561692 L 94.5,-174.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 80.486 -166.592 L 83.572 -171.673 L 86.43 -166.672 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 108.0,-194.4 L 108,-205.2 L 99,-205.2 L 99,-241.2 L 117,-241.2 L 117,-205.2 L 108,-205.2 M 108,-241.2 L 108,-252\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-54.0 L 108,-41.4 L 108,-28.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-28.8 L 108,-14.4 L 99,-14.4 L 117,-14.4 M 101.7,-10.08 L 114.3,-10.08 M 106.2,-5.76 L 109.8,-5.76\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 58.8,-81.0 L 43.8,-81 L 28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-81.0 L 18,-81 L 18,-72 L -18,-72 L -18,-90 L 18,-90 L 18,-81 M -18,-81 L -28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-81.0 L 28.8,-72.9 L 37.8,-72.9 L 37.8,-36.9 L 19.8,-36.9 L 19.8,-72.9 L 28.8,-72.9 M 28.8,-36.9 L 28.8,-28.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-28.8 L 28.8,-14.4 L 19.8,-14.4 L 37.8,-14.4 M 22.5,-10.08 L 35.1,-10.08 M 27,-5.76 L 30.6,-5.76\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"111.60000000000001\" y=\"-94.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"111.60000000000001\" dy=\"13\">Q1 NMOS<\/tspan><\/text><text x=\"147.6\" y=\"-135.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">D<\/tspan><\/text><text x=\"147.6\" y=\"-59.800000000000004\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">S<\/tspan><\/text><text x=\"120.60000000000001\" y=\"-182.20000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"120.60000000000001\" dy=\"13\">LED<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-236.20000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">RLED<\/tspan><\/text><text x=\"104.39999999999999\" y=\"-279.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"104.39999999999999\" dy=\"13\">5V<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RG<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><text x=\"16.200000000000003\" y=\"-67.9\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"16.200000000000003\" dy=\"13\">栅源下拉<\/tspan><\/text><circle cx=\"58.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"58.8\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"58.8\" dy=\"13\">G<\/tspan><\/text><circle cx=\"28.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```circuitjs\nnmos-switch\n```\n\n```text\n5V ── 限流电阻 ── LED（A → K）── D  Q1  S ── GND\nGPIO ── 栅极电阻 ────────────── G\n                                 │\n                            栅源下拉电阻\n                                 │\n                                GND\n```\n\n源极 S 接地，漏极 D 接负载低端。GPIO 低时，假设 VG＝0V，VS＝0V，则 VGS＝0V，沟道关断；GPIO 高时，假设 VG＝3.3V，VS＝0V，则 VGS＝＋3.3V，若所选器件在该驱动下满足负载要求，沟道导通，电流经 LED 和 D-S 返回地。栅源下拉电阻用于在 GPIO 高阻时帮助保持关断；串联栅极电阻用于控制驱动过程，阻值要结合实际情况选择。两电源须有适当公共参考。\n\n##### 电路二：增强型 PMOS 高边开关\n\n下图使用 LED 负载和串联栅阻；仿真使用 1kΩ 电阻负载，并用开关拉低栅极，未加入串联栅阻。仿真仅说明控制关系。\n\n```svg\n<svg role=\"img\" aria-label=\"PMOS高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"287.14pt\" width=\"244.10299999999998pt\" viewBox=\"-67.375 -223.49999999999994 244.10299999999998 287.14\"><circle cx=\"73.8\" cy=\"-81\" r=\"4.2\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><polygon points=\"117,2.7 108,15.3 99,2.7 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-54.0 L 108,-69 L 84,-69 L 84,-93 L 108,-93 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.00000000000001,-69.0 L 78,-93\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 58.8,-81.0 L 69.6,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-153 L 108,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-54.0 L 108,-63 L 108,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-72.0 L 108,-63 L 117,-63 L 117,-27 L 99,-27 L 99,-63 L 108,-63 M 108,-27 L 108,-18\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-18.0 L 108,2.7 M 117,15.3 L 99,15.3 M 108,15.3 L 108,36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 121.5,11.7 L 130.999,17.128\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 135.514 19.708 L 129.57 19.628 L 132.428 14.627 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 121.5,3.599999999999999 L 130.999,9.028\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 135.514 11.608 L 129.57 11.528 L 132.428 6.527 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 108.0,36.0 L 108,50.4 L 99,50.4 L 117,50.4 M 101.7,54.72 L 114.3,54.72 M 106.2,59.04 L 109.8,59.04\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 58.8,-81.0 L 43.8,-81 L 28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-81.0 L 18,-81 L 18,-72 L -18,-72 L -18,-90 L 18,-90 L 18,-81 M -18,-81 L -28.8,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-81.0 L 28.8,-121.5 L 19.8,-121.5 L 19.8,-157.5 L 37.8,-157.5 L 37.8,-121.5 L 28.8,-121.5 M 28.8,-157.5 L 28.8,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.8,-198.0 L 68.4,-198 L 108,-198\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"111.60000000000001\" y=\"-94.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"111.60000000000001\" dy=\"13\">Q1 PMOS<\/tspan><\/text><text x=\"147.6\" y=\"-135.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">S<\/tspan><\/text><text x=\"147.6\" y=\"-59.800000000000004\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">D<\/tspan><\/text><text x=\"104.39999999999999\" y=\"-225.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"104.39999999999999\" dy=\"13\">5V<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-58.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">RLED<\/tspan><\/text><text x=\"146.60999999999999\" y=\"-4.0000000000000036\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"146.60999999999999\" dy=\"13\">LED<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RG<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><text x=\"16.200000000000006\" y=\"-152.5\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"16.200000000000006\" dy=\"13\">栅源上拉<\/tspan><\/text><circle cx=\"58.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"58.8\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"58.8\" dy=\"13\">G<\/tspan><\/text><circle cx=\"28.8\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```circuitjs\npmos-switch\n```\n\n```text\n5V ── S  Q2  D ── 限流电阻 ── LED（A → K）── GND\n       G ── 电阻 ── 合适的控制/驱动电路\n       │\n       └── 栅源上拉电阻 ── 5V\n```\n\n源极 S 接 5V，漏极 D 接负载。上拉使栅极回到接近源极电压，帮助无驱动时关断；驱动电路降低栅极电压时，可让 PMOS 导通。表中数字是**示意电压**，需要选合适型号和驱动电路：\n\n| S 电压 | G 电压 | VGS＝VG−VS | 增强型沟道状态 |\n|---:|---:|---:|---|\n| 5V | 5V | 0V | 关断条件 |\n| 5V | 0V | −5V | 可能导通，需确认驱动与额定值 |\n| 5V | 3.3V | −1.7V | 不能保证关断或充分导通，须查型号与工作条件 |\n\n因此，不能简单地将 3.3V GPIO 高电平当作 5V 高边 PMOS 的关断电平；GPIO 直接连到 5V 栅极网络还可能超出引脚允许电压或造成反灌。若源极接 12V，直接接 3.3V GPIO 时 VGS 为 −8.7V 或 −12V，更不能可靠关断，还必须核对 MOS 栅源耐压和 MCU 引脚耐压。需要适当电平转换或专用驱动。\n\n##### 增强型、耗尽型与体二极管\n\n**增强型**在 VGS＝0V 时沟道处于关断条件，施加合适极性的 VGS 后增强导通。**耗尽型**在 VGS＝0V 时可有导电沟道，施加合适的相反方向栅源电压可以减弱导通。N/P 沟道与增强/耗尽是两个分类维度，本课主要分析常用增强型：\n\n| 类型 | VGS＝0V 时的沟道 | 改变栅源电压的基本方向 |\n|---|---|---|\n| 增强型 NMOS | 关断条件 | 正 VGS 增强导通 |\n| 增强型 PMOS | 关断条件 | 负 VGS 增强导通 |\n| 耗尽型 NMOS | 通常可导通 | 负 VGS 减弱导通，可在规定条件下关断 |\n| 耗尽型 PMOS | 通常可导通 | 正 VGS 减弱导通，可在规定条件下关断 |\n\n表中描述的是沟道的一般工作趋势，不表示在任意漏源电压和负载下都能完全导通或关断；实际范围和器件结构以手册为准。\n\n常见分立功率 MOS 内有体二极管。典型 N 沟道体二极管方向是 S→D，P 沟道是 D→S；画电路时还须核对实际器件的结构及符号。如果它被正向偏置，即使沟道关断，也可能有电流。因此一只 MOS 管不一定能双向断流；续流或防倒灌能否成立，需要按整个电路判断，不能只凭“有体二极管”。\n\n##### 为什么不能只看阈值？\n\n`VGS(th)` 是在手册指定的小测试电流下定义的阈值，**不是满足负载电流所需的完整导通电压**。应查实际 VGS 下保证的 `RDS(on)`，并计算导通损耗、考虑温升和驱动能力；还要查 VDS、正负 VGS 极限、栅极电荷及上电状态。例子可查 [AO3400A N 沟道手册](https://www.aosmd.com/res/data_sheets/AO3400A.pdf)和 [AO3401A P 沟道手册](https://www.aosmd.com/sites/default/files/res/datasheets/AO3401A.pdf)，但不能把它们的条件套给其他型号。\n\n##### 结构、引脚与驱动方式\n\nMOSFET 常见 N 沟道和 P 沟道增强型器件。N 沟道低边开关中，源极接地、漏极接负载低端、负载高端接电源；栅极相对源极的电压 `VGS` 决定导通状态。P 沟道高边开关通常让源极接近正电源，通过降低栅极电压形成负 VGS；实际驱动还需检查 MCU 是否能正确关断、能否承受栅极电压。\n\nMOS 有体二极管，单管关断不一定阻断两个方向的电流。SOT-23、SO-8、DFN 和 TO-252 等封装的 G/D/S 顺序、散热焊盘与漏极连接不一定一致，必须依据完整料号核对。\n\n##### 从参数到可用电路\n\n1. **VDS**：覆盖最大电源电压及关断瞬态，核对工作温度和设计余量。\n2. **VGS 最大额定值**：正负方向都不能超限。`VGS(th)` 只对应手册规定的小测试电流，不意味着大电流时已充分导通。\n3. **RDS(on)**：查看在实际驱动电压、结温和电流下的数值或曲线；3.3V GPIO 驱动时不能用仅在 10V VGS 下给出的导通电阻保证结果。\n4. **电流与热**：先估 `P≈Irms²RDS(on)`，再计开关损耗、体二极管、铜面积、环境及封装散热。标称 ID 受测试散热条件约束。\n5. **栅极电荷 Qg 与驱动能力**：开关时要充放电；频率、驱动峰值电流、电阻和电容会影响速度与损耗。需要时使用驱动器。\n\n例：RDS(on)=50mΩ、有效电流 2A，假设该阻值适用于实际栅压与温度，则导通损耗约 `2²×0.05=0.2W`；若热态阻值更高或开关频繁，总损耗还会增加。\n\n##### 输入、续流和测量\n\n低边 NMOS 可以用栅极串电阻控制充放电/抑制振荡，并用适当栅源下拉使 MCU 上电或高阻时保持关闭；阻值需结合驱动与速度确定。线圈负载按拓扑配置续流二极管或其他钳位，核验电压、能量与关断速度。\n\n断电后检查封装、引脚和短路；MOS 的体二极管及栅极电容会影响万用表读数。敏感器件使用合适防静电措施，不能把一两次读数当成动态和热性能验证。\n\n##### 优点、局限与选择\n\nMOS 管由栅源电压控制导通；稳定导通时通常不需要像 BJT 那样持续提供基极电流。适当选型时，低导通电阻有利于降低损耗；但栅极充放电需要电荷和驱动能力，开关过程、电压极限和体二极管均要考虑。\n\n| 类型或用法 | 常见优点 | 局限与适用场景 |\n|---|---|---|\n| N 沟道低边开关 | 常见，部分型号在相同条件下可取得较低导通电阻 | 负载低端不是固定地；需核对 GPIO 栅压下的 RDS(on)、栅极电荷与关断状态 |\n| P 沟道高边开关 | 较容易实现某些低频高边控制，负载低端可接地 | 高电源电压下通常需要安全的电平转换；同类条件下导通电阻可能较高，具体以型号为准 |\n| N 沟道高边开关 | 可选择低导通电阻器件，适合部分高效率场景 | 栅极通常需要高于源极的适当驱动电压，驱动电路和上电控制可能更复杂 |\n| MOS 线性工作 | 可用于受控电流等特定电路 | 同时承受电压和电流会发热，需查安全工作区（SOA）和散热，开关用途额定值不能直接套用 |\n\n**怎么选：**3.3V GPIO 驱动时查 **VGS=实际驱动电压**下保证的 RDS(on)，不能仅看阈值电压；还应核对 VGS/VDS 极限、负载电流、开关损耗和掉电状态。\n\n##### 进阶案例：为什么 3.3V GPIO 未必能直接驱动高边 PMOS\n\n假设 P 沟道 MOS 的源极连接 12V，若把栅极直接连接 3.3V MCU 输出：GPIO 输出 3.3V 时，`VGS=3.3−12=−8.7V`；输出 0V 时，`VGS=−12V`。两个状态都可能让 MOS 导通，而且栅极及连接节点可能超出 MCU 的允许电压，是否超过 MOS 的 VGS 绝对限值也需要查手册。\n\n正确设计需同时解决**安全电平转换、可靠关断和栅源限压**：关断时栅极应被拉向源极附近；导通时由合适的驱动级将栅极拉低，并确保所有器件不超额定。具体电阻、驱动结构、上电顺序、体二极管及负载瞬态应按所选器件设计；这不是完整可直接生产的 12V 电路。\n\n**检查路径：**先测源极相对地的电压，再测栅极相对地的电压，计算 VGS；不能把栅极对地电压直接当成 VGS。测量时确认仪器接地与被测点安全。\n\n##### 🔧 动手练习与参考答案\n\n1. RDS(on)=50mΩ、2A 的估算导通损耗为 **0.2W**；说明为什么还需考虑温度和开关损耗。\n2. 某器件 VGS(th)=2V，但仅给出 VGS=10V 时的导通电阻：**不能据此保证 3.3V GPIO 能可靠驱动**。\n3. 画 NMOS 低边驱动、电阻和续流路径；核对所选器件的 VDS、VGS、RDS(on)、Qg 和封装脚位。\n4. 增强型 NMOS 的 S＝0V、G＝3.3V，VGS 是多少？**＋3.3V**；能否承担负载仍需查手册。增强型 PMOS 的 S＝5V、G＝0V，VGS 是 **−5V**；G＝5V 时为 **0V**，沟道处于关断条件。\n\n##### ✅ 自测清单\n\n- [ ] 能解释 VGS(th) 与工作电流下 RDS(on) 的区别。\n- [ ] 能分析体二极管、栅极充放电和热损耗。\n- [ ] 能按目标器件核对引脚、耐压及感性负载保护。\n\n##### 📚 延伸学习\n\n[嘉立创元器件基础](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)中的晶体管应用；以具体 MOS 数据手册的测试条件为准。\n\n#### 04.4.7 运算放大器（Op-Amp）：小信号的\"扩音机\"\n\n**学习目标：**能说清运放的输入、输出和供电，解释负反馈，并读懂跟随、同相和反相三种电路。\n\n##### 先认识它：微弱信号为什么需要处理？\n\n假设传感器输出 0.2～0.3V，而后级希望读取更明显的电压变化，可以用合适的放大电路进行信号调理。**运算放大器**（运放，op amp）是一种放大电压差的集成电路；通过外围电阻等元件和反馈，可构成放大、缓冲、滤波等电路。运放需要电源，不能凭空产生超出其供电和输出能力的电压或功率。\n\n一个基本运放有两个信号输入端和一个输出端：标 **+** 的是同相输入，标 **−** 的是反相输入；另有正、负电源端。单电源电路的负电源端常接地，实际范围须查手册。原理图中通常画三角形，位号常为 U；多通道芯片的三角形可能共用供电脚，实物引脚号必须查型号。\n\n##### 增益和负反馈是什么意思？\n\n**电压增益**描述输出变化与输入变化的比例。例如理想增益为 2 时，输入变化 0.1V，输出对应变化约 0.2V，仍要满足供电、输入和输出范围。\n\n将输出的一部分送回反相端，使输出变化倾向于抵消输入差，称为**负反馈**。对于合适的负反馈电路，在运放有供电、未饱和、频率和输入输出均处于允许范围并且工作稳定时，可以用两个近似关系分析：输入端电流很小（常称“虚断”）；两个输入端电压很接近（常称“虚短”）。它们不是物理断线或短接，也不适用于任意开环、饱和或不稳定状态。\n\n##### 电路一：电压跟随器\n\n图中省略运放供电脚；实际电路必须按所选器件接电源。\n\n```svg\n<svg role=\"img\" aria-label=\"运算放大器buffer负反馈示意图，运放电源脚省略\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"126.20000000000002pt\" width=\"246.644pt\" viewBox=\"-5.115999999999999 -148.60000000000002 246.644 126.20000000000002\"><path d=\"M 72.0,-72.0 L 72,-117 L 149.942,-72 L 72,-27 L 72,-72 M 149.942,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-94.5 L 85.343,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-49.5 L 85.343,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 81.74278579257494,-45.9 L 81.743,-53.1\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-49.5 L 36,-49.5 L 72,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 149.94228634059948,-72.0 L 175.771,-72 L 201.6,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-94.5 L 59.4,-94.5 L 46.8,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-94.5 L 46.8,-119.25 L 46.8,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-144.0 L 117,-144 L 187.2,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 187.20000000000002,-144.0 L 187.2,-108 L 187.2,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"9.0\" y=\"-66.1\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"9.0\" dy=\"13\">Vin<\/tspan><\/text><text x=\"223.2\" y=\"-88.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"223.2\" dy=\"13\">Vout<\/tspan><\/text><circle cx=\"187.2\" cy=\"-72\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```circuitjs\nopamp-buffer\n```\n\n```text\n传感器输出 ── 运放 + 输入\n运放输出 ───── 运放 − 输入\n运放输出 ───── 后级输入\n供电端接合适电源，电路使用共同参考地\n```\n\n输出直接反馈到 − 输入，在满足条件时，输出电压近似等于 + 输入电压。它不提供电压倍数放大，但可在适当条件下减轻后级对信号源的负载。运放是否能在单位增益下稳定、输入和输出能否到达目标电压、是否能驱动后级，都需要查手册。\n\n##### 电路二：同相放大\n\n图中省略运放供电脚，阻值对应下方增益为 2 的例子。\n\n```svg\n<svg role=\"img\" aria-label=\"运算放大器noninvert负反馈示意图，运放电源脚省略\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"158.24pt\" width=\"327.12800000000004pt\" viewBox=\"-85.6 -166.60000000000002 327.12800000000004 158.24\"><path d=\"M 72.0,-72.0 L 72,-117 L 149.942,-72 L 72,-27 L 72,-72 M 149.942,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-94.5 L 85.343,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-49.5 L 85.343,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 81.74278579257494,-45.9 L 81.743,-53.1\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-49.5 L 36,-49.5 L 72,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 149.94228634059948,-72.0 L 175.771,-72 L 201.6,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-94.5 L 59.4,-94.5 L 46.8,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-94.5 L 46.8,-110.25 L 37.8,-110.25 L 37.8,-146.25 L 55.8,-146.25 L 55.8,-110.25 L 46.8,-110.25 M 46.8,-146.25 L 46.8,-162\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-162.0 L 117,-162 L 187.2,-162\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 187.20000000000002,-162.0 L 187.2,-117 L 187.2,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-94.5 L 5.4,-94.5 L 5.4,-85.5 L -30.6,-85.5 L -30.6,-103.5 L 5.4,-103.5 L 5.4,-94.5 M -30.6,-94.5 L -72,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M -72.0,-94.5 L -72,-65.25 L -72,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M -72.0,-36.0 L -72,-21.6 L -81,-21.6 L -63,-21.6 M -78.3,-17.28 L -65.7,-17.28 M -73.8,-12.96 L -70.2,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-21.599999999999998\" y=\"-66.1\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-21.599999999999998\" dy=\"13\">Vin<\/tspan><\/text><text x=\"223.2\" y=\"-88.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"223.2\" dy=\"13\">Vout<\/tspan><\/text><text x=\"34.2\" y=\"-141.25\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"34.2\" dy=\"13\">Rf 10kΩ<\/tspan><\/text><text x=\"-12.599999999999994\" y=\"-94.9\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-12.599999999999994\" dy=\"13\">Rg 10kΩ<\/tspan><\/text><circle cx=\"187.2\" cy=\"-72\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"46.8\" cy=\"-94.5\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```text\n输入 Vin ── 运放 + 输入\n运放输出 ── Rf ──●── Rg ── GND\n                  └── 运放 − 输入\n```\n\n输入加在 + 端，输出通过 Rf、Rg 分压反馈到 − 端。理想条件下输出与输入同相，`Vout=(1+Rf/Rg)×Vin`。例如 Rf＝10kΩ、Rg＝10kΩ，增益为 2；输入 0.5V 时理想输出约 1.0V。需要供电范围、共模范围与输出摆幅都允许这一工作点，实际还受电阻误差和运放失调影响。\n\n##### 电路三：反相放大\n\n图中省略运放供电脚；本例需要允许负电压输出的供电。\n\n```svg\n<svg role=\"img\" aria-label=\"运算放大器invert负反馈示意图，运放电源脚省略\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"144.20000000000005pt\" width=\"309.644pt\" viewBox=\"-68.116 -166.60000000000002 309.644 144.20000000000005\"><path d=\"M 72.0,-72.0 L 72,-117 L 149.942,-72 L 72,-27 L 72,-72 M 149.942,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-94.5 L 85.343,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 78.14278579257493,-49.5 L 85.343,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 81.74278579257494,-45.9 L 81.743,-53.1\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-49.5 L 36,-49.5 L 72,-49.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 149.94228634059948,-72.0 L 175.771,-72 L 201.6,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-94.5 L 59.4,-94.5 L 46.8,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-94.5 L 28.8,-94.5 L 28.8,-85.5 L -7.2,-85.5 L -7.2,-103.5 L 28.8,-103.5 L 28.8,-94.5 M -7.2,-94.5 L -25.2,-94.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-94.5 L 46.8,-110.25 L 37.8,-110.25 L 37.8,-146.25 L 55.8,-146.25 L 55.8,-110.25 L 46.8,-110.25 M 46.8,-146.25 L 46.8,-162\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 46.800000000000004,-162.0 L 117,-162 L 187.2,-162\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 187.20000000000002,-162.0 L 187.2,-117 L 187.2,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"9.0\" y=\"-66.1\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"9.0\" dy=\"13\">Vref=0V<\/tspan><\/text><text x=\"223.2\" y=\"-88.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"223.2\" dy=\"13\">Vout<\/tspan><\/text><text x=\"10.8\" y=\"-120.10000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"10.8\" dy=\"13\">Rin 10kΩ<\/tspan><\/text><text x=\"-54.0\" y=\"-103.89999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">Vin<\/tspan><\/text><text x=\"34.2\" y=\"-141.25\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"34.2\" dy=\"13\">Rf 20kΩ<\/tspan><\/text><circle cx=\"187.2\" cy=\"-72\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"46.8\" cy=\"-94.5\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```text\nVin ── Rin ──●── Rf ── 运放输出\n              │\n         运放 − 输入\n运放 + 输入 ── 参考电位 Vref\n```\n\n当 `Vref=0V` 且满足理想负反馈条件时，`Vout=−(Rf/Rin)×Vin`。例如 Rin＝10kΩ、Rf＝20kΩ，输入为 +0.1V，理想输出为 −0.2V，符号表示相对参考点反相。若运放只由 0V 和 3.3V 供电，通常不能直接输出负电压；需采用允许负输出的供电方式，或重新设计参考电位和信号范围。不能只套公式忽略供电。\n\n##### 扩展：求和与电压比较\n\n**求和放大器：**在适当反馈电路中，多个信号分别经输入电阻接到反相端，输出可以是多个输入的加权和。若同相端接 0V、两只输入电阻及反馈电阻均相等，理想情况下 `Vout=−(V1+V2)`；仍须确认供电能够覆盖输出范围。这是反相放大的扩展，不是把两路电源直接连在一起。\n\n**比较电压：**比较器把两个输入电压的大小转换为高低状态；专用比较器通常为此设计。运放在某些低速条件下也可开环使用，但可能有输入电压限制、输出与逻辑不兼容或饱和恢复慢等问题，须确认手册与应用条件。\n\n##### 怎么选运放？\n\n先确定信号与电源范围、目标增益和负载，再查输入共模范围、输出摆幅、输入失调、带宽、压摆率、输出驱动与稳定性。轨到轨输入或输出也有具体条件，不意味着能无限超过电源轨。要判断信号高低时通常先考虑专用比较器；将运放当比较器必须核实输入限制、恢复速度与输出兼容性。\n\n##### 原理图符号示意\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 112\" width=\"280\" height=\"112\" role=\"img\"><line x1=\"30\" y1=\"30\" x2=\"100\" y2=\"30\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"30\" y1=\"80\" x2=\"100\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M 100 20 L 100 90 L 170 55 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"170\" y1=\"55\" x2=\"230\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"40\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-strong\">V−<\/text><text x=\"40\" y=\"98\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-strong\">V+<\/text><text x=\"250\" y=\"59\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-strong\">Vout<\/text><text x=\"135\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-note\">三角形指向输出<\/text><\/svg>\n```\n\n图中是常见符号示意；实物引脚编号与极性仍以具体器件手册为准。\n\n##### 器件类别、封装与引脚\n\n运算放大器是一类有源模拟集成电路，可以在适当反馈网络下实现放大、跟随、求和和滤波；比较功能通常优先选用专门比较器。单运放、双运放和四运放可能使用不同封装与引脚分配，不能只看 SOP-8 外观就认定功能。查完整料号、封装图的观察方向、一脚标记、电源脚和各通道引脚；文字朝向不是统一判断标准。\n\n数字逻辑、存储器、MCU、稳压器与运放都是集成电路，但它们的功能和供电要求不同。芯片丝印可能是缩写，识别时结合制造商、封装、板上连接、BOM 和数据手册，不以封装或位号单独确定型号。\n\n##### 负反馈与三个基础电路\n\n下面的公式均基于理想运放、负反馈稳定、输入共模满足要求且输出没有饱和；实际误差还包括阻值容差、输入偏置、失调和带宽限制。\n\n**电压跟随器**：输入接同相端，输出接回反相端，理想条件下 `Vout≈Vin`。它可以减轻信号源负载，但输入共模范围、输出摆幅、输出电流、容性负载稳定性都要满足要求。\n\n**同相放大器**：输入接同相端，反相端通过 `Rg` 接参考点、通过 `Rf` 接输出。当参考点为 0V 时，理想增益 `Av=1+Rf/Rg`。例如 Rf=9kΩ、Rg=1kΩ、输入 0.2V，理想输出 2.0V；前提是供电、输入范围和实际输出摆幅允许此值。\n\n**反相放大器**：输入通过 `Rin` 接反相端、`Rf` 从输出反馈到反相端、同相端接参考点。若参考点为 0V，理想增益 `Av=−Rf/Rin`；例如 Rin=10kΩ、Rf=20kΩ、输入 +0.1V，理想输出 −0.2V。若只用 0～3.3V 单电源且没有负电源或偏置，负输出通常无法实现，实际可能受限；应设计合适参考电压并重新计算。\n\n虚短和虚断是理想化分析：在线性负反馈的适用条件下，输入端电压近似相等、输入电流近似为零；一旦饱和或超出共模范围，不能继续套用。输出短接到反相输入的是反馈连接，**不表示两个输入脚被一根导线短接**。\n\n##### 从需求选运放\n\n1. **电源与输入**：确认供电范围和输入共模电压范围；输入允许范围与绝对最大额定值不同。\n2. **输出**：核对在实际负载下的高低电平摆幅、输出电流和容性负载稳定性；“轨到轨”不等于所有条件下可精确到电源轨。\n3. **带宽与速度**：GBW 指增益带宽积，是判断运放频率能力的一个参数。在适合的单主极点近似下，闭环带宽可由 GBW/噪声增益粗估，仍需看频率响应、稳定性和压摆率；不能将 10 倍增益、1MHz 信号简单视为“只要 GBW 等于 10MHz 就完全合格”。\n4. **精度**：输入失调电压是折算到输入端的等效误差；偏置电流流过输入等效电阻也会产生误差。温漂、噪声及电阻容差需纳入总预算。\n5. **比较器与运放**：两者用途和输出结构可能不同；把运放当比较器前，要核对输入范围、过驱恢复、输出方式和速度，不能直接替代。\n\n##### 实践：把传感器电压送入 ADC\n\n假设某低压传感器输出在 0.2～0.3V，目标是放大约 10 倍送入 0～3.3V ADC。先选择同相增益 10 的反馈比，如 Rf=90kΩ、Rg=10kΩ；理想输出为 2～3V。再检查运放在供电范围内对 0.2～0.3V 的输入共模、带负载输出能否达到 3V、ADC 的采样输入与噪声、阻值容差、带宽和失调误差。目标电压接近电源轨时尤其不能仅凭理想增益判断可行。\n\n##### 优点、局限与选择\n\n运放配合负反馈和外围元件，可实现放大、缓冲、滤波和信号调理；输入阻抗通常较高，便于减轻对信号源的负载，但具体阻抗、偏置电流和精度取决于型号与条件。运放需要供电，也有共模范围、输出摆幅、带宽、失调和负载驱动限制。\n\n| 类型或用法 | 常见优点 | 局限与适用场景 |\n|---|---|---|\n| 通用运放 | 功能灵活，很多常见型号易于获得 | 低压、精度、噪声和驱动能力不一定满足需求；用于一般缓冲或放大前须核对 |\n| 精密运放 | 可选低失调、低漂移产品，适合慢变化微弱信号 | 成本、功耗、速度、噪声等仍需按型号权衡；低失调不等于所有误差都小 |\n| 轨到轨输入/输出运放 | 在规定条件下可扩展输入或输出接近电源轨的范围 | 并非总能达到电源轨或适用于电源范围外；具体范围受负载与条件影响 |\n| 高速运放 | 可满足较高带宽或较快信号变化需求 | 功耗、稳定性和布线要求可能更高；需核查增益、带宽、压摆率和负载 |\n\n**怎么选：**缓冲传感器时先核对信号范围和源阻抗，再检查输入共模、输出摆幅、负载、误差和稳定性。若目标是判断电平高低，通常先考虑比较器；运放只有在确认输入限制、恢复速度和输出兼容后才可能适用。参见 [ADI 对运放与比较器的比较](https://www.analog.com/en/resources/analog-dialogue/articles/amplifiers-as-comparators.html)。\n\n##### 进阶案例：增益够了，输出为什么仍可能不准？\n\n以非反相放大器为例，`Rg=10kΩ`、`Rf=90kΩ`，理想增益为 10。假设输入 0.2～0.3V，则理想输出为 2～3V。若两电阻都为 ±1%，只考虑电阻容差：最小增益 `1+89.1/10.1≈9.82`；最大增益 `1+90.9/9.9≈10.18`。因此仅电阻误差就会改变满量程输出；计算后仍须核对输出上限、ADC 允许范围和实际信号范围。\n\n若运放输入失调上限假设为 1mV，单独按噪声增益约 10 估算，可产生约 10mV 输出失调；还可能有输入偏置电流、温漂、噪声与源阻抗造成的误差。上述误差不一定同向或彼此独立，正式预算应明确最坏情况或统计方法。\n\n输入电压始终处在共模范围内、输出在当前负载下能达到所需电压、频率与压摆率足够、反馈稳定，这些条件必须同时核对。普通单电源运放的输出未必能达到 0V 或 3.3V，轨到轨器件也有与负载有关的限制。\n\n##### 🔧 动手练习与参考答案\n\n1. 同相放大器 Rf=9kΩ、Rg=1kΩ，理想增益是多少？**10 倍**；输入 0.2V 时理想输出 **2V**。\n2. 反相电路 Rin=10kΩ、Rf=20kΩ、输入 +0.1V 的理想输出为 **−0.2V**；单 0～3.3V 供电的普通电路需先处理负输出限制。\n3. 查一款双运放的引脚、电源范围、输入共模、输出摆幅及 GBW，并写明每一项的测试条件。\n4. 对照实际电路判断反馈类型、参考点和输出范围；条件不满足时说明不能直接套用虚短公式。\n5. 电压跟随器是否把电压放大 10 倍？**不是**。满足线性负反馈等条件时，其输出近似跟随输入，主要用于缓冲；还要检查输入、输出范围和负载。\n\n##### ✅ 自测清单\n\n- [ ] 能区分同相、反相和跟随电路及其反馈方向。\n- [ ] 能说出输入共模范围、输出摆幅、GBW、失调和偏置电流对选型的影响。\n- [ ] 能解释为什么运放不能未经核查直接替代比较器。\n\n##### 📚 延伸学习\n\n[嘉立创元器件与运放选型资料](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)；[TI 运放学习资料](https://www.ti.com/product-category/amplifiers/op-amps/the-signal-ebook.html)。具体电气参数以所选完整料号的数据手册为准。\n\n#### 04.4.8 七大主角速查表\n\n| 器件 | 一句话作用 | 最关键参数 | 板上典型应用 |\n|---|---|---|---|\n| 电阻 R | 限流、分压（减速带） | 阻值、功率 | LED 限流、上拉下拉 |\n| 电容 C | 储荷，通交阻直（小水池） | 容值、耐压 | 去耦、滤波 |\n| 电感 L | 储磁，感抗随频率变化（飞轮） | 感量、饱和电流 | DCDC 储能、滤波 |\n| 二极管 D | 单向导电（单行道） | 压降、耐压、电流 | 整流、续流、防反 |\n| 三极管 Q | 电流控制开关（水阀） | hFE、Ic | 小信号开关、放大 |\n| MOS 管 Q | 电压控制开关（电动闸门） | 工作栅压下的 Rds(on)、耐压和热参数 | 电源开关、驱动 |\n| 运放 U | 高增益放大（扩音机） | GBW、失调电压 | 信号调理、缓冲 |\n\n### 04.5 电路理论复习卡：四张卡串回基础课程\n\nPCB 设计不是\"照图连线\"：线走多宽、电阻多大功率、电容耐压够不够，每步都藏着计算。这些公式第 01、02 课都推导过，这里不重讲，只做成四张\"复习卡\"——公式、口算、板上的用场各一行，热身完毕就去做 04.6 的实战。\n\n**复习卡 1｜欧姆定律**（第 01 课）\n\n- 公式：U = I × R；变形 I = U/R、R = U/I。口算：1kΩ 两端加 5V → I = 5mA\n- 这在板子上：限流、压降、短路电流——一切计算的起点\n\n**复习卡 2｜串联与并联**（第 02 课）\n\n- 电阻串联相加、并联变小（R1×R2/(R1+R2)）；电容的公式与电阻恰好\"对调\"。口算：10kΩ 并 10kΩ = 5kΩ；10μF 并 10μF = 20μF\n- 这在板子上：电源入口并联不同电容时，实际频率响应取决于电容参数与布局，不能保证每颗只作用于某一个频段；两电阻并联凑阻值、分摊功率\n\n**复习卡 3｜分压**（第 02 课）\n\n- 公式：U2 = U总 × R2/(R1+R2)（空载或负载电流可忽略）——\"谁占的阻值比例大，谁分的电压多\"。口算：12V、R1 = 30k、R2 = 10k → 3.0V\n- 这在板子上：用 3.3V ADC 测 12V 电源的标称分压计算（第 02 课还列出了实际设计待核条件）\n\n**复习卡 4｜功率**（第 01 课）\n\n- 直流功率 P = U×I；对电阻可进一步写成 P = I²R = U²/R。选电阻应按具体额定功率、温度和项目要求降额。口算：20mA 流过 150Ω → 0.06W\n- 这在板子上：功耗决定封装大小、要不要铺铜散热——功率算错等于烧件\n\n### 04.6 综合实战：给 LED 选限流电阻（一步不跳）\n\n这是硬件入门的\"第一道必会题\"，四步流程一步都不能跳。\n\n**先想明白为什么**：LED 是二极管，导通压降 VF 随电流与温度变化，本例暂按红光约 2V 估算。电流过大可能损坏 LED，过小时可能不够亮；串联电阻可限制电流。\n\n教学假设：电源 5V，红色 LED 在目标电流附近 VF ≈ 2V，目标电流 20mA。实际器件是否允许该电流须查手册，不能将 20mA 当作所有 LED 的通用工作电流。\n\n**第 1 步：定压差（电阻要分掉多少伏）**——电阻和 LED 串联，电源电压被两者瓜分：LED 拿走 VF，剩下的全是电阻的。\n\n电阻电压 = 5 − 2 = **3V**\n\n**第 2 步：算阻值（欧姆定律，复习卡 1）**\n\nR = U/I = 3V ÷ 0.02A = **150Ω**。150Ω 恰好是标准值直接可用；算出非标准值时可先选不小于计算值的常用阻值（如 150、220、330Ω），再按电源、LED 正向压降和电阻容差核对最大电流；电阻变大通常使电流减小，但亮度和安全性仍取决于具体器件与工作条件。\n\n**第 3 步：验功率（复习卡 4）**\n\nP = I²R = 0.02² × 150 = **0.06W**。若项目初步采用半额定功率作为余量，需额定 ≥ 0.12W 的电阻；例如按第 02 课表中的假设，0.125W 仅刚好满足。实际应按具体料号与工作温度选型。\n\n**第 4 步：定精度与封装**——指示灯用途可先考虑 ±5% 电阻，但是否满足要求仍需结合电流变化和 LED 规格。最终答案：**150Ω ±5%、0805 封装的示例值；真实使用前须查具体料号、温度及公差。**\n\n这套\"定压差 → 算阻值 → 验功率 → 选封装\"四步适合本例的初步估算；实际还需要核对供电、LED、驱动和元件公差，练成肌肉记忆。后面第 09 课画板、第 10 课设计电源时，它就是你的呼吸动作。\n\n<details>\n<summary>停下来检查：自己来一遍——3.3V 点蓝光 LED<\/summary>\n\n3.3V 单片机板上点一颗蓝色 LED，VF ≈ 3.0V，目标 10mA。四步走完，写出阻值、功率、封装。\n\n答案：① 压差 = 3.3 − 3.0 = 0.3V；② R = 0.3 ÷ 0.01 = 30Ω，就近选标准值 33Ω（在电源和 VF 均按题设标称值固定的近似下，电流约 9.09mA）；③ P ≈ 0.00909² × 33 ≈ 2.73mW（按 10mA 上限估算约 3.3mW），需按实际电阻型号确认；④ 可初选 ±5% 的 0805 作为教学示例，但须核对料号、温度和耐压。顺带一个真实经验：压差只剩 0.3V 时，VF 的个体差异会让亮度偏差明显——例如仅为说明敏感性，若电源在 3.2～3.4V、把 VF 粗略视为 2.8～3.2V，则用同一近似模型估算电流可从接近 0 到约 18mA；实际 VF 随电流变化，须查具体 LED 数据并做最坏情况分析。\n\n<\/details>\n\n### 04.7 动手时间：万用表三板斧 + 认丝印 + 拆解旧物\n\n#### 04.7.1 装备清单（按已有条件选择）\n\n- 如需购买元器件套装，可搜索\"电子元器件套装 初学者\"、\"电阻电容电感 套装\"、\"面包板 套件\"。要求含：直插电阻、贴片电阻、电容、电感、二极管、LED、三极管、蜂鸣器、面包板、杜邦线\n- 万用表：搜\"数字万用表 自动量程\"，入门几十块的就够\n- 可选但好用：防静电手环、镊子、塑料撬棒、带微距的手机（拍丝印用）\n- 到货后每类元件留两三个贴上标签（名称 + 数值），攒成你的\"实物字典\"——后面每课都要翻它\n\n#### 04.7.2 先认识万用表：三个孔、一个盘\n\n- 表盘下方常有三个或四个插孔：黑笔通常接 **COM**；测电压、电阻及二极管时红笔接仪表标识的 **V/Ω** 孔。毫安和大电流插孔可能与 V/Ω 共用，也可能分开，必须按仪表标识与手册确认。\n- 表盘中间是档位旋钮：本课只用三个区——Ω（电阻）、蜂鸣/二极管符号（通断+二极管常在一起）、OFF\n- 本节测电阻、通断和二极管时：**黑笔通常插 COM，红笔插标有 V/Ω 的孔**；电流测量要重新核对相应插孔。\n\n#### 04.7.3 第一斧：电阻档（测阻值）\n\n1. 插表笔：黑笔 COM、红笔接仪表标识的 V/Ω 孔\n2. 旋档位：转到 Ω 档。手动量程的表：不知道多大就从最大量程试，读出数量级再降档；自动量程直接测\n3. **断电**：⚠️ 测电阻必须断电！带电测读数乱跳还可能损坏仪表。测板上的电容前还要先放电\n4. 测：两表笔分别搭电阻两端。电阻无极性，红黑随便接\n5. 读数：屏显 4.68kΩ → 就是 4.7kΩ，在 ±5% 内完全正常\n6. 两个细节：测 100kΩ 以上大阻值时，手指不要同时捏住两个表笔尖（人体电阻并联进去会拉低读数）；\"在路\"直接测板上的电阻会被并联支路影响，读数只当参考，要精确就拆下一脚再测\n\n#### 04.7.4 第二斧：通断档（蜂鸣档，查\"通不通\"）\n\n1. 旋到蜂鸣符号档（小喇叭图形，常与二极管档共用一个位置）\n2. 断电并确认无危险残余电压后，表笔碰被测导线两端；蜂鸣表示低于仪表设定阈值，无声不一定断路，需结合阻值及电路判断\n3. 三大用途：测杜邦线/排线好坏（断芯的杜邦线是新手调试第一大坑）；测保险丝；**上电前测电源正负极之间是否短路**——蜂鸣时先检查阻值、充电过程和电路资料；低阻电源轨也可能正常，不能仅凭蜂鸣判定短路\n4. 注意：一般阻值低于几十 Ω 才响；线路里串着二极管或大电阻时可能不响——不响不等于断路，换电阻档复查\n\n#### 04.7.5 第三斧：二极管档（测方向与好坏）\n\n1. 旋到二极管符号（▶|）档\n2. 接法：**红笔接阳极 A、黑笔接阴极 K**（多数数字表在此档红笔电位较高，实际以仪表说明为准）\n3. 读数：硅二极管约 0.5~0.7V；肖特基约 0.3~0.4V；部分 LED 可显示正向压降并微亮；不同表的开路电压和测试电流不同，蓝白 LED 可能因电压不足不亮或显示 OL，应按仪表与 LED 规格判断\n4. 判断好坏：正反向读数可作为初筛：并联电路、测试电压不足或器件结构都会影响结果；必要时断开一端并参考手册，不能仅凭一次读数断言好坏\n5. 附赠技巧：在已确认该仪表二极管档红笔电位较高，且独立 LED 正向发光的条件下，红笔通常接阳极。长短脚可能已被剪过；最终以器件手册和正确的测试条件核对\n\n#### 04.7.6 认丝印五步法（拿到任何一块板都能开口）\n\n1. **看位号定类别**：R 电阻、C 电容、L 电感、D 二极管、Q 三极管/MOS、U 芯片/运放\n2. **看本体丝印**：部分电阻采用三位或四位数字编码，也有其他编码方式；电感标识依厂商和系列而异，须结合制造商资料核对。R 作小数点的用法也应结合具体标识规则判断\n3. **电容没丝印是常态**：MLCC 靠 BOM 和封装位置认，别当成质量问题\n4. **极性件找标记**：标条、长短脚、圆点或凹坑可作线索，但必须对照具体器件手册确认极性、1 脚与观察方向\n5. **记录**：整理\"位号 → 丝印 → 万用表实测值\"三列对照表——这就是你人生第一份 BOM 的雏形\n\n#### 04.7.7 拆解一件旧电子产品（本课压轴练习）\n\n流程六步：\n\n1. 选对象：选已断开电源且可安全移除电池的低压设备，如旧鼠标、遥控器；不拆市电充电器或电源适配器\n2. 安全检查（见下方警告，先读警告再动手）\n3. 拍照：拆前拍、每拆一步拍一张，装不回去看照片\n4. 开壳：拧螺丝、撬卡扣（用塑料撬棒少留伤）\n5. 认板：对照 04.1 找出绿油、丝印、焊盘、过孔；再按 04.3 的五个问题识别板上实际存在的器件；并非每块板都有全部七类器件，数量也要以实际观察为准\n6. 记录：写下你认出的器件位号和丝印，能测的用万用表验证（断电状态）\n\n> ⚠️ **安全警告（每次拆解前默念一遍）**\n>\n> 1. **只拆已断电、已移除可拆卸电池，且确认不存在危险储能的低压设备**；有损坏或鼓胀锂电池的设备不要自行拆解。\n> 2. **拆过市电的板子（充电器、电源适配器）最危险**：内部大电解电容在断电后仍可能存着几百伏电压。初学者不要拆解或测量市电电源板。断电和等待不能保证电容已放电；应交由受训人员使用适当设备按规程处理并验证。\n> 3. **绝对不拆**：CRT 老电视、微波炉、显像管设备——内部高压足以致命，新手禁区。\n> 4. **ESD 防护**：碰芯片、MOS 管前先摸一下接地金属放掉自身静电；拿元件捏本体、不碰引脚；有条件戴防静电手环。\n> 5. 拆完**洗手**（焊锡可能含铅）；小零件收好，别让小孩和宠物碰到。\n\n### 04.8 别忘了三个配角：按键、继电器、蜂鸣器\n\n七大主角之外，板上还有几位出场率极高的\"配角\"：按键管输入，继电器和蜂鸣器管输出。它们原理简单，却各有经典的坑。这里用五问法的轻量版过一遍：是什么、怎么接、有什么坑。凑齐它们，你就能看懂一条最基础的产品链路：**按键（输入）→ MCU（思考）→ 继电器/蜂鸣器（输出）**。\n\n#### 04.8.1 按键（Key）：最简单的\"输入\"\n\n**是什么？** 一个用手按的开关：不按时内部断开，按下去接通。直插的只有两根腿；板子上最常见的是四脚轻触开关内部连通对有同侧与对角两种，装转 90° 可能常通也可能失效，焊前必须对照封装脚位图。\n\n**符号怎么画？** 原理图上就是\"开关\"符号：一段断开的线，加一个能摆过去合上的触点，旁标 SW。它没有极性，接\"反\"了照样工作。\n\n**经典电路：上拉电阻 + 按键。** 按键一脚接 GND，另一脚经一只 10kΩ 上拉电阻接到 3.3V，中间节点接 MCU 引脚：\n\n- **没按**：引脚被上拉电阻\"拴\"在 3.3V，MCU 读到高电平 1\n- **按下**：引脚被直接拉到 GND，MCU 读到低电平 0（此时电流从 3.3V 经 10kΩ 入地，约 0.33mA，几乎不耗电）\n\n口诀：**上拉配按键，按下是低电平**。上拉电阻的使命是让\"没按\"时引脚有个确定的电平——如果没有它，引脚悬空，读数乱飘，MCU 会随机误判。\n\n**必懂的坑：抖动（Bounce）。** 按键里的金属触点在按下瞬间会像落地前的皮球一样\"弹几下\"——约 5~20ms 内反复通断（经验值，以实际器件为准）。你以为按了一次，MCU 却读到了七八次\"按下\"，表现为\"按一下灯闪三下\"。\n\n- **硬件消抖**：在引脚与 GND 之间并一个小电容（如 100nF）可滤除部分抖动；还应核对 RC 时间、输入上升时间及必要时的施密特触发器——第 03 课的\"小水池\"又立功了\n- **软件消抖**：检测到电平变化后等 10~20ms 再读一次，两次一致才算数——一行延时代码省一个电容，产品里更常用\n\n**实物怎么认？** 四脚轻触开关有方向坑：四只脚通常两两相通，不能只凭外形判断方向——它看着方方正正最像\"随便放\"，但转动后可能常通、无法导通或仍可用；必须对照实物和封装脚位图。\n\n#### 04.8.2 继电器（Relay）：用小电流管大电流的\"电动开关\"\n\n**是什么？** 一个\"电动开关\"：线圈通电变成电磁铁，吸动衔铁带动触点闭合——**你用几十 mA 的小电流，去开关几安培的大电流**。它动作时\"咔哒\"一声，就是衔铁被吸合的声音，找个旧继电器通电听一次就忘不了。\n\n**结构一句话：线圈 + 触点。** 在线圈与触点独立的继电器中，两侧通常无直接导电连接；能否用于安全隔离还要核对器件的绝缘额定值、触点间距、PCB 布局和整机要求。\n\n**驱动电路必配两件套：**\n\n1. **三极管或 MOS 管**：先查 MCU 引脚允许电流和继电器线圈工作电流；如果引脚不能满足要求，应设计合适的驱动级，并核对启动、温升和上电状态\n2. **续流二极管**：线圈绕出来的就是电感（第 03 课的\"飞轮\"）！断电瞬间电流不想停，会感应出高压尖峰反打回来。常见低边直流线圈驱动可在线圈两端**反向**并一只二极管（阴极朝电源正极），给这股电流留泄放路——不并的话，继电器\"咔哒\"几下，驱动管就可能被尖峰打穿\n\n**应用**：控制 220V 灯、电机、加热器这类大电流负载的通断。\n\n> ⚠️ **安全警告（强电区）**：继电器触点接 220V 市电属于强电区。强弱电之间必须拉开距离、开槽隔离，爬电距离有硬性安规要求，绝不许走线交叉混叠。**新手阶段不要碰市电**——练习继电器时用 12V 灯带、小风扇这类低压负载代替，等系统学过安规再说。\n\n#### 04.8.3 蜂鸣器（Buzzer）：板子的\"嘴巴\"\n\n**是什么？** 通电发声的元件，分两大类，买错了\"响不对\"：\n\n| 类型 | 英文 | 发声条件 | 特点 | 怎么辨别 |\n|---|---|---|---|---|\n| 有源蜂鸣器 | Active Buzzer | 通直流电就响 | 内置振荡电路，上电即\"滴——\"持续响 | 不可仅凭外形判断，以完整型号和手册为准 |\n| 无源蜂鸣器 | Passive Buzzer | 要喂方波（如 2~4kHz，经验值） | 像个小喇叭，变频率能\"唱歌\" | 不可仅凭外形判断，以完整型号和手册为准 |\n\n注意：\"源\"指振荡源，不是电源。要\"哔——\"一声报警选有源（最省 MCU 资源），要\"哆来咪\"旋律选无源。\n\n**怎么驱动？** 某些低功率蜂鸣器在满足电压、电流及引脚限制时可由 MCU 直接驱动；是否需要串联电阻取决于具体器件和驱动方式。电流偏大时可使用合适的三极管或 MOS 管驱动；感性蜂鸣器还需按手册设计续流。无源蜂鸣器的方波由 MCU 定时器输出，频率决定音调。\n\n#### 04.8.4 顺带认识：磁珠（Ferrite Bead）\n\n讲电感时提过一嘴，这里正式认个脸：磁珠常为两端贴片件，位号可用 FB 或 L。它的阻抗随频率和直流偏置变化，在一定频段可提供损耗性阻抗，常与电容配合抑制干扰；它也有寄生参数，不能把任意磁珠视为所有高频干扰的解决办法。电源储能电感和磁珠各有用途，选型要查实际曲线。\n\n<details>\n<summary>停下来检查：按键与继电器二连<\/summary>\n\n① 上拉电阻 + 按键的电路里，MCU 什么时候读到 0？如果去掉上拉电阻会怎样？② 直流继电器线圈为什么需要续流或钳位路径？二极管有什么作用？\n\n答案：① 按下时——按键把引脚直接拉到 GND，读到低电平；没按时上拉电阻把引脚拴在 3.3V，读到 1。去掉上拉电阻，没按时引脚悬空、电平乱飘，MCU 会随机误判\"按没按\"。② 线圈是电感，断电瞬间电流不能突变，会感应出高压尖峰（第 03 课的飞轮尖峰），反向并的二极管给这股电流留了泄放回路；不并的话尖峰可能直接击穿驱动三极管。\n\n<\/details>\n\n<details>\n<summary>停下来检查：蜂鸣器选型<\/summary>\n\n产品要发固定音调的长报警音，可优先考虑哪一类？想播放旋律又如何选择？\n\n答案：固定音调可优先考虑合适的有源蜂鸣器，其通电方式和是否需要驱动级应查手册；播放旋律可考虑合适的无源蜂鸣器，由驱动电路提供不同频率的信号。\n\n<\/details>\n\n### 04.9 数据手册实战：从“找到型号”到“确认能用”\n\n拿到器件后，不要只看封面上的“最大电流”或商城标题。按下面顺序建立一张可复查的器件卡：\n\n| 步骤 | 要找的信息 | 为什么要看 |\n|---|---|---|\n| 确认身份 | 制造商、完整订货号、封装、手册版本 | 同系列的固定/可调输出、封装和引脚可能不同 |\n| 建立工作范围 | 推荐供电、温度、输入电平、负载条件 | 判断电路设计的每个工作点是否落在允许范围 |\n| 阅读极限参数 | 绝对最大电压、电流、结温 | 这是应力边界，不能当作正常工作保证值 |\n| 阅读电气特性 | 最小、典型、最大值与测试条件 | 数值只适用于表中列出的电压、电流与温度等条件 |\n| 查典型电路 | 外围元件、补偿、去耦、启动条件 | 应用图是设计起点，仍需按实际负载和条件验证 |\n| 查封装与布局 | 观察方向、引脚号、焊盘、散热和机械公差 | 原理图正确不代表 PCB 焊盘和实物匹配 |\n| 记录未决项 | 不足的数据、需要厂商确认的条件、验证计划 | 避免把猜测写成已确认的参数 |\n\n**最小、典型、最大怎么用？**典型值适合建立预期，不应自动代替产品在全部温度、批次和负载条件下的保证值。保证设计通常需要寻找适用条件下的最小/最大值；没有保证值时要明确不确定性或联系厂商。绝对最大额定值是器件允许承受的应力界限，长时间工作可能影响可靠性，也不承诺电路性能。[Analog Devices 对绝对最大额定值的说明](https://www.analog.com/en/resources/faqs/faq_absolute_max.html)可帮助区分这些概念。\n\n**示例：稳压器候选。**第 14 课草稿使用 LDL1117S33R 候选。查资料时应先确认 3.3V 固定输出及 SOT223 引脚，再核对输入范围、输出电压精度、负载及温度条件、压差、输入/输出电容和稳定性。计算热耗时使用实际最大输入和负载：例如假设输入 5.25V、输出 3.3V、负载 100mA，主要功耗约 `(5.25−3.3)×0.1=0.195W`，还需计入自身电流损耗。实际温升受铜面积、环境和封装热条件影响。\n\n草稿标称 10µF 的输入和输出电容尚未确认完整料号；不能以此认定有效容值、ESR、上电浪涌或稳定性合格。数据来源：[ST LDL1117 数据手册](https://www.st.com/resource/en/datasheet/ldl1117.pdf)。第 14 课项目目录保留具体的待核验记录。\n\n### 04.10 看懂一张原理图：连接、器件和信号的关系\n\n原理图用符号表达电气关系，不等于真实的器件大小和摆放位置。看图时按“**电源入口 → 稳压与保护 → 主控供电 → 输入 → 处理 → 输出 → 调试接口**”追踪：\n\n1. **先看电源**：哪些网络输入电源？经过何种保护和稳压？输出电压对应哪些负载？\n2. **看器件**：位号如 R3、C5、U1 标识实例；数值或型号描述器件；完整料号与封装应在 BOM/属性中核对。\n3. **看网络**：同名网络是否相连取决于所用 EDA 的标签范围；线交叉不一定连接，连接点/节点和工具网络高亮更可靠。\n4. **看输入输出**：信号是模拟还是数字？有效高还是有效低？是否有上拉、下拉、电平转换和保护？\n5. **看参考和回流**：GND 是某个电路的参考网络，不自动等同于大地或机壳；电流必须有完整返回路径。\n6. **看接口**：引脚号、方向、供电、电平、接插件正反及插拔条件都应对照具体连接器图纸。\n\n举例：若电源标记均为 `3V3`，而 LED 阴极接到 MCU 的 PC13，则 LED 是否亮取决于串联电阻、LED 极性和 PC13 输出状态，不能仅凭一个网络名判断；应沿完整电流路径读图。原理图的网络连接与 PCB 的焊盘、铜线还需同步核对。\n\n### 04.11 综合设计练习：让 GPIO 控制一个低压 LED\n\n下面是一道**带完整假设的设计练习**，不是已选定料号、可以直接打样的产品设计。目标是把前面的电阻、二极管和三极管知识连起来。\n\n#### 04.11.1 需求和连接\n\n下面仅示意低边开关的连接，控制端为 3.3V GPIO，具体阻值在后文计算。\n\n```svg\n<svg role=\"img\" aria-label=\"NPN高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"276.34pt\" width=\"222.05899999999997pt\" viewBox=\"-67.375 -277.49999999999994 222.05899999999997 276.34\"><polygon points=\"108.06,-175.5 99.06,-162.9 90.06,-175.5 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-81.0 L 85.2,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-94.2 L 85.2,-67.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-87.6 L 99.06,-99.48 L 99.06,-106.08\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;s
