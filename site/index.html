50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"202\" y=\"182\" font-size=\"11\" fill=\"currentColor\">7 输入<\/text>\n  <text x=\"202\" y=\"198\" font-size=\"10\" fill=\"currentColor\">干/湿各测<\/text>\n  <rect x=\"40\" y=\"160\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"52\" y=\"182\" font-size=\"11\" fill=\"currentColor\">8 满载老化<\/text>\n  <text x=\"52\" y=\"198\" font-size=\"10\" fill=\"currentColor\">30min/温度<\/text>\n  <line x1=\"160\" y1=\"85\" x2=\"190\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"310\" y1=\"85\" x2=\"340\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"460\" y1=\"85\" x2=\"490\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"560\" y1=\"110\" x2=\"560\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"490\" y1=\"185\" x2=\"460\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"340\" y1=\"185\" x2=\"310\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"190\" y1=\"185\" x2=\"160\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"270\" font-size=\"11\" fill=\"currentColor\">每步记录期望/实测；异常先查电源/焊接，再查器件。<\/text>\n  <text x=\"40\" y=\"298\" font-size=\"11\" fill=\"currentColor\">每次只改一个变量；改完复测相关项。记录表要能追溯到“哪一步、谁、什么值”，否则出了问题只能重来。<\/text>\n<\/svg>\n```\n\n### 16.4 原理图与 PCB 实施顺序\n\n1. 建工程，画电源树。\n2. 画 MCU 最小系统（电源、晶振、复位、SWD、BOOT）。\n3. 画继电器驱动、输入、RS485、USB。\n4. ERC 清零，网表核对。\n5. 建封装：继电器、端子、USB、RS485、晶振。\n6. 布局：接口靠边、强弱电分区、电源靠入口。\n7. 布线：电源粗、差分/晶振短、继电器区铺铜。\n8. 铺铜、DRC、丝印、3D 检查。\n9. 出 Gerber/钻孔/坐标/BOM。\n\n#### 16.5.1 降额核算：不是“选大一点”\n\n降额是“按最坏情况算，留出安全余量”，不是“随便选大”。\n\n**Buck**：输出峰值 0.8A，选 2A（2.5 倍），因为继电器吸合瞬间有浪涌；电感 `Isat ≥ 峰值×1.3`，即 ≥1.04A，选 2A 饱和电流的电感。\n\n**LDO**：3.3V 负载峰值 0.15A，选 0.5A；功耗 `(5−3.3)×0.15=0.255W`，SOT-23 热阻 200℃/W，温升 51℃，加铜箔/换 SOT-89。\n\n**继电器**：触点 10A，按 5A 用；线圈 5V/70mA，驱动管按 500mA 选；续流二极管按 1A/100V 选。\n\n**端子**：5.08mm 端子额定 10A，按 5A 用；线规 16AWG 够 10A，22AWG 只够 3A。\n\n**保险丝**：12V 输入最大 2A，保险丝选 3A（1.5 倍），但短路电流要能熔断；如果用 PPTC，注意保持电流/跳闸电流。\n\n**电容**：Buck 输入电容按 `I_rms` 选，输出电容按纹波/ESR 选；耐压按 1.5～2 倍，12V 用 25V，5V 用 10V。\n\n**连接器**：USB/RS485 端子按插拔次数/电流选；固定脚要焊牢。\n\n**降额检查表**：每个器件写“实际值/额定值/降额比”，评审时逐条看。没有降额比的 BOM，是“凭感觉选型”。\n\n#### 16.4.2 布局与布线的项目级检查\n\n项目板的布局不是“把块摆进去”，是按“接口→电源→数字→隔离→功率”的顺序。\n\n**接口靠边**：USB、RS485、输入/输出端子靠板边，插口朝外；端子之间留线缆/螺丝刀空间。\n\n**电源靠入口**：12V 端子→保险/TVS→Buck→LDO，一条直线；输入电容紧靠 Buck；电感/开关节点短。\n\n**数字区集中**：MCU、晶振、SWD、EEPROM 放一起；晶振靠近 MCU；SWD 靠板边。\n\n**功率区隔离**：继电器、ULN、端子放一侧；强弱电之间开槽/挖空，爬距 ≥6mm；继电器线圈侧和触点侧分开。\n\n**地**：2 层板地不完整，要保证“电源地/数字地/功率地”在单点汇合；继电器/输入大电流回路不要穿过 MCU 地。\n\n**布线顺序**：电源→晶振/SWD→RS485/USB 差分→继电器/输入→其他。\n\n**铜厚/线宽**：12V/5V 主电流按 1A/mm 估算（1oz、10℃ 温升约 1A/mm 级别，保守），继电器 300mA 用 0.5mm 以上；地线尽量宽。\n\n**测试点**：12V/5V/3.3V/GND、SWD、RS485 A/B、每路继电器/输入，都要留测试点。\n\n**丝印**：端子功能、继电器编号、输入编号、LED 含义、版本号、极性标记。\n\n**3D/1:1 检查**：连接器高度、端子方向、继电器高度、外壳干涉；1:1 打印比对。\n\n#### 16.4.4 项目进度与检查点\n\n项目要按“里程碑”推进，每个检查点有交付物，不能“画到哪算哪”。\n\n**M1 需求/框图**：需求表、系统框图、电源预算；评审通过才能画原理图。\n\n**M2 原理图**：分页原理图、ERC 清零、网表核对、关键器件选型；评审通过才能建封装。\n\n**M3 封装/布局**：封装库、板框、布局图、3D 初检；评审通过才能布线。\n\n**M4 布线/DRC**：布线完成、铺铜、DRC、丝印、测试点；评审通过才能出 Gerber。\n\n**M5 生产文件**：Gerber/钻孔/坐标/BOM/钢网/装配图；打包/版本记录。\n\n**M6 打样/焊接**：打样回板、目视/短路、焊接顺序。\n\n**M7 Bring-Up**：分步上电、记录、故障处理、复测。\n\n**M8 验收/复盘**：验收表、问题清单、改进项、文档归档。\n\n**检查点原则**：每个里程碑有“输入/输出/评审人/日期”；没通过不进入下一阶段。返工越早越便宜：原理图改一条线几分钟，PCB 改一条线几小时，打样后改板几天。\n\n**时间预算（课程级）**：需求/框图 1 天，原理图 2～3 天，封装/布局 2 天，布线 3～5 天，生产文件 1 天，打样/焊接 1～2 周，Bring-Up 2～3 天。按自己的时间调整，但里程碑不能省。\n\n### 16.5 选型与降额\n\n| 器件 | 选型 | 降额 |\n|---|---|---|\n| Buck | 12V→5V/2A | 电流 ≥1.3× |\n| LDO | 5V→3.3V/0.5A | 结温留 20℃ |\n| 继电器 | 5V 线圈/10A 触点 | 触点降额 50% |\n| ULN2003 | 7 路达林顿 | 单路 ≥ 线圈峰值 |\n| MAX485 | 5V/半双工 | 加 TVS/终端 |\n| 端子 | 5.08mm/10A | 爬距/线规 |\n\n### 16.6 测量与仿真：Bring-Up\n\n#### 16.6.1 上电顺序\n\n1. 不焊 MCU/继电器，只焊电源，限流 100mA 上电。\n2. 测 5V/3.3V，确认纹波/温升。\n3. 焊 MCU，测电流，连 SWD，读 ID。\n4. 焊晶振/复位，测起振/复位波形。\n5. 焊通信，环回测试。\n6. 焊继电器，逐路吸合/释放。\n7. 输入逐路测试干/湿接点。\n8. 满载老化 30 分钟，记录温度。\n\n#### 16.6.2 CircuitJS\n\n```circuitjs\npower-buck\n```\n\n观察 12V→5V 的 SW/电感电流。\n\n```circuitjs\nnmos-switch\n```\n\n观察 MOS 驱动继电器线圈的开关行为。\n\n#### 16.6.4 Bring-Up 记录表与故障树\n\nBring-Up 不是“上电看看亮不亮”，是按步骤记录、按现象排查。\n\n**记录表字段**：步骤、测试点、期望值、实测值、结论、异常处理、时间/人。\n\n**步骤**：\n\n1. 目视：器件方向、极性、焊点、锡珠、短路；\n2. 电源：限流 100mA，测 12V/5V/3.3V，记录纹波；\n3. MCU：焊 MCU，测电流，连 SWD，读 ID；\n4. 时钟/复位：测起振/复位波形；\n5. 通信：USB 枚举、RS485 环回；\n6. 继电器：逐路吸合/释放，测线圈电压/触点通断；\n7. 输入：干/湿各测，记录阈值；\n8. 满载/老化：30 分钟，记录温度/电压。\n\n**故障树**：\n\n- 不上电：保险/反接/短路/电源芯片/焊接；\n- 5V 掉压：负载过大/电感饱和/输入电容不够/限流；\n- MCU 不识别：SWD 线/BOOT/复位/晶振/电源；\n- 通信不通：A/B 反/终端/偏置/波特率/地；\n- 继电器不吸合：驱动/线圈/续流/逻辑电平；\n- 输入误判：分压/光耦/去抖/阈值；\n- 复位随机：电源跌落/看门狗/噪声/复位电容。\n\n**原则**：先电源后信号，先静态后动态，先单路后全路。每次只改一个变量，改完复测。\n\n**记录的价值**：同样的问题下次能快速定位；交付时能看到“板子是怎么被调通的”。\n\n#### 16.5.2 BOM、替代料与采购风险\n\n项目 BOM 不是“列个清单”，要考虑采购/停产/替代。\n\n**必填字段**：位号、数量、值、封装、型号、厂家、替代料、DNP、备注。\n\n**AVL**：关键器件（MCU/电源/继电器/光耦/RS485）要有 2 个以上可选型号，避免停产。\n\n**MOQ/MPQ**：采购按整盘/最小包装，BOM 数量要按“实际+损耗”算；电阻电容多买 10%。\n\n**替代料验证**：替代料的封装/引脚/参数/极性要兼容；不能只看“参数差不多”。替代后要重新测。\n\n**DNP**：不贴的器件标 DNP，贴片厂不会贴；BOM 和坐标要一致。\n\n**成本**：课程项目优先“易买/便宜/封装好焊”；产品要算 BOM 成本/加工费/测试费。\n\n**采购风险**：MCU 缺货/继电器交期长/连接器停产；提前查库存/交期，准备替代方案。\n\n**BOM 版本**：和原理图/PCB 同版本；改料要记录 ECO；BOM 错了，贴片厂会贴错/停产。\n\n#### 16.6.5 测试设备、安全与记录\n\nBring-Up 要用对设备、注意安全、留下记录。\n\n**设备**：可调直流电源（限流）、万用表、示波器（≥100MHz）、USB-RS485 转换器、SWD 调试器、负载（电阻/灯泡）、热像仪/热电偶。\n\n**安全**：12V 安全电压，但 250VAC 触点侧危险；继电器带负载测试要绝缘/护罩；电容放电后再摸；限流电源先设 100mA。\n\n**记录**：每一步的电压/电流/波形/温度；照片/截图；异常现象/处理；时间/人。\n\n**对照**：实测 vs 设计值 vs 手册；偏差大要查原因，不能“能用就行”。\n\n**复测**：改一个变量后复测相关项；不要一次改多个，否则无法定位。\n\n**交付**：测试记录随板交付；下次维修/改板有据可查。\n\n#### 16.6.3 设计评审清单\n\n- 电源：输入保护、电容、电感饱和、散热。\n- MCU：BOOT、复位、晶振、SWD。\n- 接口：ESD、终端、隔离。\n- PCB：强弱电爬距、接口靠边、测试点。\n- 生产：BOM、封装、钢网、坐标。\n\n#### 16.7.1 生产文件与可复现交付\n\n“画完板”不等于“能生产”。交付要包含一整套可复现文件，缺一项就可能被打样厂/贴片厂退回。\n\n**Gerber**：每层一个文件，命名清楚（Top/Bottom/Inner/Soldermask/Silkscreen/Drill）；检查单位、格式、原点、层对齐。\n\n**钻孔**：钻孔文件要和 Gerber 对齐；过孔/插件孔分开；孔位/孔径表。\n\n**坐标（Pick&Place）**：元件位号、X/Y、旋转角、层；和 BOM 对应；贴片厂能直接导入。\n\n**BOM**：位号、数量、值、封装、型号、替代料、DNP；和原理图/PCB 一致；关键器件标 AVL。\n\n**钢网**：开口/厚度按封装（0402/0603/QFN）；EP 开口分割；钢网文件给贴片厂。\n\n**装配图**：器件位置、极性、1 脚、连接器方向；给焊接/维修用。\n\n**测试说明**：测试点、期望值、Bring-Up 步骤、故障树。\n\n**版本/变更记录**：版本号、日期、改了什么、为什么；和 Git/文件命名对应。\n\n**打包**：一个 zip/文件夹，内含 Gerber/钻孔/坐标/BOM/钢网/装配图/测试说明/原理图 PDF；文件名带版本/日期。\n\n**可复现**：别人拿到包，能直接打样/贴片/测试，不用问你“这个封装在哪/这个电阻什么型号”。课程项目也要按这个标准交付。\n\n#### 16.6.6 三个真实故障案例\n\n**案例一：继电器一吸合，MCU 复位**。现象：单路继电器吸合正常，4 路同时吸合时 MCU 复位/通信断。排查：5V 瞬态跌到 4.2V，Buck 输入电容不够/走线太长；继电器线圈续流二极管漏焊。整改：加 100μF 输入电容、缩短 5V 走线、补续流二极管，复位消失。\n\n**案例二：湿接点 24V 输入，光耦烧**。现象：接 24V 后光耦发热/输出常低。排查：限流电阻按 5V 算，24V 时电流过大；电阻功率不够。整改：按 24V 重算 2.2k/0.5W，加 TVS，光耦正常。\n\n**案例三：RS485 通信时好时坏**。现象：短线正常，长线丢包；多个节点时更差。排查：每个节点都焊了 120Ω，总线负载过重；A/B 没有偏置，空闲电平不确定。整改：只留两端终端，加偏置电阻，通信稳定。\n\n**共同点**：都不是“芯片坏”，而是“电源/保护/终端”这些外围设计没按最坏情况算；而且都能用万用表/示波器在几分钟内定位，前提是测试点留了、记录写了。故障案例要记录“现象→测量→原因→整改→复测”，下次遇到同类问题能快速定位。\n\n### 16.7 常见坑\n\n1. **继电器线圈不加减续流**：驱动管击穿。\n2. **强弱电爬距不够**：耐压/安规不过。\n3. **输入无 TVS/光耦**：现场浪涌打坏 MCU。\n4. **RS485 终端电阻乱加**：总线负载过重。\n5. **USB 差分不等长**：枚举失败。\n6. **晶振走线长**：不起振。\n7. **电源余量不足**：继电器同时吸合时掉压复位。\n8. **BOM 封装缺失**：贴片厂停产。\n9. **不留测试点**：Bring-Up 无法下探针。\n\n### 16.8 本章复盘\n\n#### 16.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 电源预算 = 各负载 +30% | 选 Buck/LDO | 按峰值 |\n| 继电器触点降额 50% | 可靠性 | 10A 触点按 5A |\n| RS485 终端 120Ω | 匹配 | 只在两端 |\n| 强弱电爬距 ≥6mm | 安规 | 按电压/标准 |\n| Bring-Up 分步上电 | 排查 | 先电源后负载 |\n\n#### 16.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 干接点 | dry contact | 无源开关触点 |\n| 湿接点 | wet contact | 带电压输入 |\n| 续流二极管 | flyback diode | 吸收线圈反峰 |\n| 爬距 | creepage | 沿表面最短绝缘距离 |\n| Bring-Up | bring-up | 新板首次上电调试 |\n| 钢网 | stencil | 锡膏印刷模板 |\n\n#### 16.8.3 自测 10 题\n\n1. 继电器线圈为什么加续流二极管？\n2. 干接点和湿接点输入怎么兼容？\n3. RS485 终端电阻加在哪？\n4. 强弱电为什么要爬距？\n5. 电源预算怎么留余量？\n6. Bring-Up 第一步做什么？\n7. 晶振不起振怎么查？\n8. 继电器同时吸合为什么会复位？\n9. Gerber 之外还要出哪些生产文件？\n10. 设计评审至少看哪五块？\n\n#### 16.8.4 能力清单\n\n- [ ] 能把需求拆成功能块/指标/验收。\n- [ ] 能完成 2 层控制板原理图到 Gerber。\n- [ ] 能设计电源、继电器、输入、RS485。\n- [ ] 能制定 Bring-Up 顺序。\n- [ ] 能做设计评审并记录风险。\n\n#### 16.8.6 项目验收表：逐条打勾\n\n| 类别 | 验收项 | 判据 | 结果 |\n|---|---|---|---|\n| 需求 | 功能/电气/机械/环境条目齐全 | 每条有数字/方法/边界 | |\n| 原理图 | ERC 清零、网表核对 | 无 Unknown Pin | |\n| 电源 | 12V/5V/3.3V 正常 | 纹波 ≤ 设计值 | |\n| MCU | SWD 可读 ID/下载 | 连续 10 次成功 | |\n| 时钟 | 晶振起振 | 频率偏差 ≤ 标称 | |\n| 复位 | 上电/按键复位 | 波形/时间符合 | |\n| 通信 | USB/RS485 | 1 小时无丢包 | |\n| 继电器 | 4 路吸合/释放 | 100 次无粘连 | |\n| 输入 | 干/湿各 4 路 | 10 次无误判 | |\n| 热 | 满载 30 分钟 | 温升 ≤30℃ | |\n| PCB | 爬距/丝印/测试点 | 按清单 | |\n| 生产 | Gerber/BOM/坐标/钢网 | 可复现 | |\n| 文档 | Bring-Up 记录/评审 | 完整 | |\n\n验收不是“我觉得行”，是“每条有判据、有记录、有结论”。课程项目也按这个表走，做完就知道自己到底会不会。没过的项要写原因和整改计划，不能留空。\n\n项目做完，回头检查四件事：需求每条都有验收记录吗？关键器件都有降额比吗？每个接口都有测试点吗？别人拿到文件包能复现吗？四件事都能答“是”，这块板才算真的做完，而不是“在我电脑上能跑”。做完一遍，你才算真正走完了“需求→原理图→PCB→生产→Bring-Up”的整条链路；这条链路走通一次，后面做 4 层、6 层板都是同一套方法换规模；差别在叠层、阻抗、EMC 的深度，不在流程本身。所以不要跳过这块 2 层板直接去做 6 层板，基础流程没走通，层数越多坑越多。先把这块 2 层板从头到尾做完一遍，再谈更复杂的项目，这个顺序不能反。这一章就是你的起点，先做完这一块，再往下走。\n\n#### 16.8.5 下一章\n\n下一章进入阶段三：**单片机基础与常用外设**。从“板子能亮”走向“程序能跑”，先把 GPIO、定时器、ADC、UART、SPI、I²C 这些外设弄明白。","taskSignature":"590b27a60c116cc3fe9015b49ff97b8df65c434128bac265b182e19192dcab1d","taskCount":5},{"id":"17","title":"第 17 章 · 单片机基础与常用外设","short":"单片机基础与常用外设","stage":3,"diff":3,"prev":"第 16 章 阶段项目：2 层控制板","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清 MCU 的最小系统由哪几部分组成。\n2. 区分 GPIO 的输入/输出、推挽/开漏、上拉/下拉。\n3. 理解定时器、PWM、ADC、UART、SPI、I²C 的硬件本质。\n4. 给一个外设画最小连接图，并判断电平/电流是否匹配。\n5. 用寄存器/库函数两种视角看 GPIO 配置。\n6. 解释中断、DMA、时钟树在硬件上的意义。\n7. 说出至少 8 个 MCU 外设设计常见坑。\n\n硬件工程师不必写完整固件，但必须知道每个外设在芯片里“长什么样”、在板子上“怎么接”。否则原理图只能照抄开发板。\n\n## 正文\n\n### 17.1 它解决什么问题：三个真实场景\n\n#### 场景一：GPIO 直接驱动 LED，电流超限\n\nLED 串联电阻算错，GPIO 输出 20mA 已经接近极限；多路 LED 同时亮，端口总电流超限，MCU 发热/复位。GPIO 有单脚和总和两个限制，驱动负载要查手册。\n\n#### 场景二：I²C 设备不响应，地址/上拉错\n\n传感器地址脚悬空，实际地址和软件里写的不一致；上拉电阻 10k 太大，总线电容大，上升沿变慢。I²C 不是“接两根线就行”。\n\n#### 场景三：ADC 读数跳，参考电压/输入阻抗没算\n\nADC 输入直接接高阻分压，采样保持电容充电不够；参考电压用 VDDA 但 VDDA 有纹波。ADC 前端要加 RC/缓冲，参考要干净。\n\n### 17.2 它是什么：MCU 是“带外设的 CPU”\n\nMCU（Microcontroller Unit，微控制器）把 CPU、Flash、RAM、时钟、复位、外设集成到一颗芯片。最小系统：\n\n- 电源（VDD/VDDA/VSS）\n- 时钟（晶振/内部 RC）\n- 复位\n- 启动模式（BOOT）\n- 调试（SWD/JTAG）\n\n常用外设：\n\n| 外设 | 硬件本质 | 典型用途 |\n|---|---|---|\n| GPIO | 可配置数字引脚 | LED、按键、使能 |\n| 定时器 | 计数器/比较器 | 延时、PWM、捕获 |\n| ADC | 采样保持 + 逐次逼近 | 电压/电流/温度 |\n| UART | 异步串行 | 串口、Modbus |\n| SPI | 同步串行（4 线） | Flash、屏、传感器 |\n| I²C | 两线总线 | EEPROM、传感器 |\n| DMA | 外设↔内存搬运 | ADC/SPI 大数据 |\n\n> **术语第一次出现**：推挽（push-pull）输出能主动拉高/拉低；开漏（open-drain）只能拉低，必须外加上拉。I²C 的 SDA/SCL 就是开漏。\n\n#### 17.2.1 MCU 内部：CPU、总线、存储、外设\n\nMCU 不是“小黑盒”，内部有清晰的几条总线。\n\n**CPU 核**：取指、译码、执行。Cortex-M3/M4 有哈佛架构（指令/数据总线分开）或改进型哈佛，取指和取数可以并行。\n\n**总线矩阵**：CPU、DMA、外设通过总线矩阵访问 Flash/SRAM/外设。总线有主/从、仲裁、优先级；DMA 和 CPU 争总线时，性能会下降。\n\n**Flash**：存程序/常量，擦写有寿命（几千到几万次）；Flash 等待周期随主频增加，主频越高越要加 wait state。\n\n**SRAM**：存变量/栈/堆，掉电丢失；栈溢出会跑飞，堆碎片会分配失败。\n\n**外设**：GPIO、定时器、ADC、UART、SPI、I²C、DMA、中断控制器。外设通过 APB/AHB 挂在总线上，时钟单独使能。\n\n**时钟/复位**：内部 RC、PLL、外部晶振；复位源有 POR/BOR/看门狗/外部复位。\n\n**调试**：SWD/JTAG 通过调试接口访问内核/内存/外设。\n\n**理解内部结构的意义**：知道“为什么外设没使能时钟就不工作”“为什么 DMA 和 CPU 会抢总线”“为什么 Flash 等待周期影响主频”。这些不是软件细节，是硬件设计要预留的资源。\n\n#### 17.2.2 GPIO 的电气结构：推挽、开漏、上拉\n\nGPIO 不是“一根线”，内部有输出驱动、输入缓冲、上下拉、保护二极管。\n\n**推挽输出**：上面一个 PMOS、下面一个 NMOS，输出高时 PMOS 导通拉到 VDD，输出低时 NMOS 导通拉到 GND。推挽能主动拉高/拉低，驱动能力强，但不能“线与”（两个推挽输出直接相连会短路）。\n\n**开漏输出**：只有 NMOS 拉低，高电平靠外部上拉。开漏可以“线与”——多个开漏输出并联，只要有一个拉低就是低。I²C 的 SDA/SCL、很多中断/复位信号用开漏。\n\n**上拉/下拉**：内部弱上拉/下拉（几十 kΩ），用于确定空闲电平；外部上拉/下拉用于更强/更远。按键常用外部 10k 上拉 + 内部上拉可选。\n\n**输入缓冲**：施密特触发器（带迟滞），抗噪声；模拟输入要关掉数字缓冲，避免漏电/干扰。\n\n**保护二极管**：引脚对 VDD/GND 有钳位二极管，能吸收少量静电；但持续过压/大电流会烧。5V 信号直连 3.3V GPIO，即使有钳位二极管，也会通过二极管灌电流，长期不可靠。\n\n**5V 容忍**：只有手册标明“5V tolerant”的引脚才能接 5V；普通引脚绝对最大通常是 VDD+0.3V。\n\n**配置顺序**：先使能时钟，再配置模式/上下拉/速度，最后读写。模式配错（比如输出当输入读）会读不到/冲突。\n\n**未用引脚**：不要浮空，配置为模拟/输出低/上拉输入，按手册建议。浮空引脚会增加功耗/噪声。\n\n#### 17.2.3 最小系统的电源与去耦\n\nMCU 最小系统里，电源/地去耦比“接对电压”更重要。\n\n**电源脚**：VDD 每个电源脚旁 100nF，VDDA 加 100nF+1μF，VREF 加 100nF+10μF（按手册）。去耦电容要靠近引脚，地过孔短。\n\n**电源顺序**：VDDA 不能早于 VDD 太多，按手册；多电源域要按顺序上电。\n\n**地**：VSS 每个地脚都接，不要只接一个；地平面尽量完整；模拟地/数字地在芯片下方单点汇合。\n\n**复位**：NRST 加 100nF + 10k 上拉 + 按键；复位脚不要浮空。\n\n**BOOT**：BOOT0/BOOT1 加上拉/下拉，不能浮空；留跳线/测试点。\n\n**晶振**：靠近 OSC_IN/OSC_OUT，负载电容按 `CL` 算，下方包地。\n\n**SWD**：VCC/GND/SWDIO/SWCLK 四线，1 脚标清；SWDIO 上拉、SWCLK 下拉按手册。\n\n**未用引脚**：按手册配置为模拟/输出低/上拉输入，不要浮空。\n\n**电源纹波**：MCU 对电源纹波敏感，尤其 ADC/PLL；LDO 输出加 10μF+100nF，ADC 参考加 LC/磁珠。\n\n**常见错误**：去耦电容离得远、地脚只接一个、VDDA 没滤波、BOOT 浮空、复位电容太大。这些错误会让“芯片时好时坏”。\n\n#### 17.2.4 Flash、EEPROM、RAM 与掉电保存\n\nMCU 里几种“存储”容易混，用途完全不同。\n\n**Flash**：存程序/常量，按页/扇区擦除，写前要擦；擦写寿命有限（几千到几万次），不能频繁写。参数保存不要直接写 Flash，除非做磨损均衡。\n\n**EEPROM**：字节级擦写，寿命长（百万次），适合存参数/校准值。片内 EEPROM 小（几 KB），片外 I²C EEPROM 便宜/容量大。写的时候要等（页写时间几 ms），掉电可能写坏。\n\n**RAM**：运行时变量/栈/堆，掉电丢失。栈溢出/堆碎片是固件常见问题；硬件上要保证 RAM 电源干净。\n\n**掉电保存**：检测电源下降（BOR/比较器/ADC），在电容维持的时间内把关键数据写 EEPROM/Flash；电容要够（`C×ΔV=I×t`）。没有掉电检测，写一半断电会丢/坏。\n\n**写保护**：EEPROM 的 WP 脚、Flash 的写保护位；量产时要能锁定，防止误写。\n\n**寿命估算**：每天写 10 次、EEPROM 100 万次，理论 27 年；Flash 1 万次，理论 2.7 年。频繁写的参数要放 EEPROM/FRAM。\n\n**硬件设计**：EEPROM 电源去耦、WP 上拉/下拉、地址脚不浮空；Flash 不用外接。掉电保存要加储能电容/比较器。\n\n#### 17.2.5 MCU 选型的六个维度\n\n选 MCU 不是“哪个便宜选哪个”，要按六个维度。\n\n**1. 资源**：Flash/RAM 够不够；外设数量（UART/SPI/I²C/ADC/定时器）够不够；封装引脚够不够。\n\n**2. 性能**：主频/内核（M0/M3/M4/M7）；有没有 FPU/DSP；能不能跑算法/协议栈。\n\n**3. 功耗**：运行/睡眠/待机电流；唤醒时间；低功耗外设。\n\n**4. 封装/引脚**：LQFP/QFN/BGA；引脚间距/散热；手工焊/贴片可行性。\n\n**5. 供货/成本**：库存/交期/价格；是否有替代/国产兼容；开发工具/生态。\n\n**6. 生态/工具**：SDK/库/例程；调试器；社区/文档；认证（工业/车规）。\n\n**课程项目**：STM32F103C8T6（LQFP48、72MHz、64KB Flash、20KB RAM、UART/SPI/I²C/ADC/定时器齐全、便宜好买）是典型选择。\n\n**产品**：要算 BOM/供货/认证；不能只看开发板例程。\n\n**选型错误**：Flash 差 2KB、RAM 不够、外设少一个 UART、封装手工焊不了。选型阶段多花一天，后面少改一次板；选型表写清楚“为什么选它、备选是谁”，换料时不用重新想一遍。\n\n#### 17.2.6 开发板与自画最小系统板的差别\n\n开发板能跑，不等于自画板能跑。差别在“最小系统 + 外设 + 保护”。\n\n**开发板**：电源/复位/晶振/BOOT/调试都验证过，外设全引出，丝印清楚；但成本高、体积大、不能直接做产品。\n\n**自画板**：要自己保证电源/去耦/复位/晶振/BOOT/调试；外设按项目裁剪；要加保护/连接器/测试点。\n\n**最容易漏的**：去耦电容、BOOT 下拉、复位电容、SWD 上拉、晶振负载电容、VDDA 滤波、未用引脚处理。\n\n**对照方法**：拿开发板原理图逐页对照；每去掉一个器件问“为什么可以去”；每加一个器件问“解决什么问题”。\n\n**打样前**：1:1 打印、封装核对、DRC、丝印、测试点、BOM 可采购。\n\n**第一块板**：不要一次加太多外设；先做最小系统 + 1～2 个外设，验证通过再迭代。第一块板的目标不是“功能全”，而是“每一部分都测过、都说得清”，这样第二块板才敢加东西。\n\n#### 17.2.7 最小系统原理图的分页与自检\n\n原理图画完不是“连上就行”，要能检查。\n\n**分页**：电源页、MCU 页、时钟/复位页、调试/BOOT 页、外设页。每页有标题/页码/网络标号。\n\n**电源页**：输入保护、DCDC/LDO、各路电压、去耦、电源指示；每路标电压/电流。\n\n**MCU 页**：电源脚/地脚/晶振/复位/BOOT/SWD/未用脚；每个脚有网络名。\n\n**自检**：每个电源脚都有去耦？每个地脚都接地？复位/BOOT 有确定电平？晶振负载电容对？SWD 四线齐？未用脚有处理？\n\n**网表核对**：原理图→网表→PCB 一致；封装/引脚号对；电源/地网络不短路。\n\n**评审**：让别人看图，问“这个脚为什么这样接”；自己讲不清就是没想清。\n### 17.3 关键参数与手册\n\n| 参数 | 看哪里 | 设计影响 |\n|---|---|---|\n| 工作电压 | VDD 范围 | 电平匹配 |\n| GPIO 电流 | 单脚/总和 | 驱动能力 |\n| GPIO 耐压 | 5V 容忍？ | 能否直连 5V |\n| ADC 位数/速率 | 12bit/1MSPS | 精度/采样 |\n| 参考电压 | VREF/VDDA | 精度 |\n| UART 波特率 | 时钟/分频 | 通信误差 |\n| SPI 速率 | 主/从 | 走线/匹配 |\n| I²C 速率 | 100k/400k/1M | 上拉/电容 |\n\n#### 17.3.1 GPIO 电流、电压与电平匹配\n\nGPIO 的“能驱动”有三个限制：单脚电流、端口总电流、电压范围。\n\n**单脚电流**：手册给 `I_OH/I_OL`（比如 ±8mA/±20mA），但这是“保证电平”的电流，不是“绝对最大”。LED 20mA 可能已经接近极限；多路同时亮，总电流超限。\n\n**总电流**：所有 IO 的源/灌电流总和有上限（比如 100mA/150mA）。4 路 LED 每路 20mA 就 80mA，接近上限；再加其他负载就超。\n\n**电压范围**：输出高 `V_OH ≈ VDD−0.3V`（带负载会降）；输出低 `V_OL ≈ 0.4V`（带负载会升）。输入高/低阈值 `V_IH/V_IL` 通常是 0.7VDD/0.3VDD 左右。电平不匹配时，可能“读不到高”或“灌电流”。\n\n**电平匹配**：\n\n- 3.3V→5V：3.3V 输出高可能不够 5V 输入的 `V_IH`（5V TTL 通常 2.0V，CMOS 可能 3.5V），要查手册；用电平转换/上拉。\n- 5V→3.3V：分压/电平转换/二极管钳位；不能直连，除非 5V 容忍。\n- 1.8V↔3.3V：专用电平转换芯片。\n\n**驱动负载**：\n\n- LED：串限流电阻，按 2～10mA 设计，不追最大亮度；\n- 蜂鸣器/继电器：三极管/MOS/驱动芯片；\n- 长线/电容负载：加串阻，防止振铃/过冲；\n- 按键/开关：上拉/下拉 + RC 去抖。\n\n**算例**：3.3V、红光 LED `Vf=1.8V`、目标 5mA，`R=(3.3−1.8)/0.005=300Ω`，取 330Ω，实际 `I=(3.3−1.8)/330≈4.5mA`。如果用 100Ω，电流 15mA，接近单脚极限。\n\n**降额**：按手册单脚/总和的 50%～70% 用；不确定时加驱动芯片。\n\n#### 17.3.2 ADC 的采样原理与源阻抗\n\nADC 不是“读电压”这么简单，内部有采样保持电容、逐次逼近、参考电压。\n\n**采样保持**：ADC 采样时，内部采样电容 `C_sample` 通过输入开关连接到外部源，充电到输入电压；然后断开，保持电荷，逐次比较。`C_sample` 通常几 pF～几十 pF。\n\n**源阻抗**：外部源阻抗 `R_source` 和 `C_sample` 形成 RC，充电时间常数 `τ=R_source×C_sample`。采样时间 `T_sample` 要大于 `(n+1)×τ`（n 为位数），否则采样不足，读数偏低/跳。\n\n算例：`C_sample=8pF`、`R_source=10kΩ`，`τ=80ns`；12 位要 13τ≈1.04μs，采样时间要 ≥1μs。如果源阻抗 100kΩ，`τ=800ns`，采样要 ≥10μs，普通 ADC 采样时间不够，读数就跳。\n\n**高阻源**：分压电阻大/传感器高阻，要加运放缓冲（电压跟随器），把源阻抗降到几Ω。\n\n**RC 抗混叠**：ADC 前加 RC 低通，截止频率按信号带宽/采样率；RC 的 R 不能太大（否则源阻抗高），C 不能太大（否则响应慢）。\n\n**参考电压**：`VREF` 决定量化台阶 `LSB=VREF/2^n`。3.3V/12 位，LSB≈0.8mV。VREF 有纹波/噪声，读数就跳；VREF 要加去耦/基准芯片。\n\n**输入范围**：0～VREF，不能超；超了会钳位/损坏。分压/运放要把信号调到范围内。\n\n**差分/单端**：差分抗共模，单端简单；差分输入要按手册的共模范围。\n\n**校准**：ADC 有偏移/增益误差，产品要校准；课程项目至少做“两点校准”（0 和满量程）。\n\n#### 17.3.3 DAC、PWM 模拟输出与基准\n\nMCU 输出“模拟量”有三种方式：DAC、PWM+滤波、外部 DAC。\n\n**DAC**：内置 DAC 位数（8/12），输出 0～VREF；建立时间/毛刺要看手册。DAC 输出驱动能力弱，要加运放缓冲。\n\n**PWM+RC 滤波**：PWM 经 RC/LC 滤波得到模拟电压，`Vout=D×VDD`。纹波/响应速度由 RC 决定；PWM 频率越高，纹波越小，但开关损耗/EMI 越大。适合 LED 调光/简单基准，不适合高精度。\n\n**外部 DAC**：I²C/SPI DAC，位数/精度/通道更多；基准要外接。\n\n**基准**：DAC/ADC 的精度取决于 VREF。内部 VREF 温漂大；外部基准（如 2.5V/3.0V）更稳。基准要加去耦/缓冲。\n\n**输出保护**：DAC/运放输出加串阻/ TVS，防止外部短接/过压；输出不能超负载范围。\n\n**算例**：3.3V、8 位 PWM、RC 滤波，`Vout=D×3.3V`，分辨率 12.9mV；要 1mV 分辨率，用 12 位 DAC 或更高 PWM 位数。\n\n**布局**：DAC/基准/运放远离数字/电源；模拟地/参考地单独；输出走线短、包地。\n\n#### 17.3.4 封装、引脚与热：MCU 也要散热\n\nMCU 的封装影响焊接/散热/引脚分配。\n\n**LQFP**：引脚外露，手工焊/返修容易；引脚间距 0.5/0.8mm；适合课程/中小批量。\n\n**QFN**：无引脚，体积小、散热好（EP 焊盘）；手工焊难，需要钢网/热风；EP 要打过孔散热。\n\n**BGA**：引脚在底部，密度高；需要 X-Ray/返修台；课程不建议。\n\n**引脚分配**：电源/地/晶振/调试/BOOT 优先放；高速/模拟/通信分开；相邻引脚不要“一个模拟一个功率”。\n\n**热**：MCU 功耗一般 <1W，LQFP 靠引脚/铜箔散热；QFN 靠 EP + 过孔 + 背面铜。结温 `Tj=Ta+P×RθJA`；RθJA 看封装/铜面积。\n\n**焊接**：QFN 的 EP 要焊满（散热/机械），钢网开口分割；LQFP 注意连锡；BGA 要回流曲线。\n\n**检查**：封装引脚数/间距/EP 尺寸按手册；1:1 打印比对；3D 检查高度。封装错了，板子再对也焊不上；封装确认是打样前最后一道关，别省这一步。\n### 17.4 三个典型外设电路\n\n#### 17.4.1 GPIO：LED 与按键\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 17-1：GPIO 输出 LED 与输入按键<\/text>\n  <rect x=\"70\" y=\"60\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"105\" y=\"92\" font-size=\"13\" fill=\"currentColor\">MCU<\/text>\n  <text x=\"100\" y=\"118\" font-size=\"12\" fill=\"currentColor\">PA0<\/text>\n  <line x1=\"190\" y1=\"105\" x2=\"220\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"220\" y=\"90\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"230\" y=\"110\" font-size=\"11\" fill=\"currentColor\">R 1k<\/text>\n  <line x1=\"280\" y1=\"105\" x2=\"310\" y mlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 17-2：ADC 前端：分压 + RC + 缓冲<\/text>\n  <text x=\"40\" y=\"95\" font-size=\"13\" fill=\"currentColor\">Vin<\/text>\n  <line x1=\"85\" y1=\"90\" x2=\"140\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"140\" y=\"75\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"148\" y=\"95\" font-size=\"11\" fill=\"currentColor\">R1 10k<\/text>\n  <line x1=\"200\" y1=\"90\" x2=\"260\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"260\" y=\"75\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"268\" y=\"95\" font-size=\"11\" fill=\"currentColor\">R2 3.3k<\/text>\n  <line x1=\"320\" y1=\"90\" x2=\"380\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"380\" y1=\"90\" x2=\"380\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"130\" x2=\"400\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"370\" y1=\"140\" x2=\"390\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"410\" y=\"135\" font-size=\"11\" fill=\"currentColor\">C 100nF<\/text>\n  <line x1=\"380\" y1=\"140\" x2=\"380\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"175\" x2=\"400\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"410\" y=\"180\" font-size=\"11\" fill=\"currentColor\">GND<\/text>\n  <line x1=\"320\" y1=\"90\" x2=\"480\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"480\" y=\"70\" width=\"100\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"495\" y=\"100\" font-size=\"12\" fill=\"currentColor\">ADC<\/text>\n  <text x=\"40\" y=\"230\" font-size=\"13\" fill=\"currentColor\">分压后加 RC 抗混叠；高阻源加运放缓冲；参考电压要干净。<\/text>\n<\/svg>\n```\n\n#### 17.4.3 UART/SPI/I²C 连接\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 17-3：三种串行总线的最小连接<\/text>\n  <rect x=\"40\" y=\"60\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"85\" font-size=\"13\" fill=\"currentColor\">UART（异步）<\/text>\n  <text x=\"55\" y=\"110\" font-size=\"11\" fill=\"currentColor\">TX → RX / RX ← TX / GND<\/text>\n  <rect x=\"260\" y=\"60\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"85\" font-size=\"13\" fill=\"currentColor\">SPI（同步 4 线）<\/text>\n  <text x=\"275\" y=\"110\" font-size=\"11\" fill=\"currentColor\">SCK/MOSI/MISO/CS<\/text>\n  <rect x=\"480\" y=\"60\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"495\" y=\"85\" font-size=\"13\" fill=\"currentColor\">I²C（两线）<\/text>\n  <text x=\"495\" y=\"110\" font-size=\"11\" fill=\"currentColor\">SCL/SDA + 上拉<\/text>\n  <text x=\"40\" y=\"190\" font-size=\"13\" fill=\"currentColor\">UART 要交叉 TX/RX；SPI 每设备单独 CS；I²C 开漏+上拉+地址不冲突。<\/text>\n  <text x=\"40\" y=\"220\" font-size=\"13\" fill=\"currentColor\">电平不匹配时用电平转换/分压，不能直接 5V 灌 3.3V GPIO。<\/text>\n<\/svg>\n```\n\n#### 17.4.4 定时器与 PWM：时间是怎么“数”出来的\n\n定时器本质是“计数器 + 比较器 + 预分频”。\n\n**时基**：时钟 `f_clk` 经预分频 `PSC` 得到计数频率 `f_cnt=f_clk/(PSC+1)`；计数器从 0 数到 `ARR` 溢出，周期 `T=(ARR+1)×(PSC+1)/f_clk`。比如 72MHz、PSC=71、ARR=999，`f_cnt=1MHz`，周期 1ms。\n\n**PWM**：比较值 `CCR` 决定占空比 `D=CCR/(ARR+1)`。PWM 频率 `f=1/T`，占空比可调。LED 调光、电机调速、蜂鸣器都用 PWM。\n\n**PWM 分辨率**：`ARR` 越大，占空比台阶越细；但频率越低。`f_pwm=f_clk/((PSC+1)(ARR+1))`。72MHz、PSC=0、ARR=255，PWM 频率 281kHz，8 位分辨率；要 16 位分辨率，ARR=65535，频率降到 1.1kHz。\n\n**捕获/输入**：定时器可以捕获外部脉冲宽度/频率（红外、编码器、转速）。\n\n**编码器模式**：正交编码器 A/B 两路，定时器硬件计数，不用软件中断。\n\n**死区/互补**：电机 H 桥需要互补 PWM + 死区，防止上下管直通。高级定时器有死区硬件。\n\n**硬件设计要点**：PWM 输出要加驱动（MOS/驱动芯片）；长线加串阻；电机/继电器要加续流/吸收；PWM 频率要避开音频/通信频段。\n\n**算例**：3.3V、LED 限流 330Ω、PWM 1kHz、占空比 50%，平均电流约 `(3.3−1.8)/330×0.5≈2.3mA`，亮度可调。\n\n#### 17.4.5 中断、DMA 与时钟树：硬件视角\n\n**中断**：外设/引脚事件触发中断，CPU 保存现场、跳中断向量、执行 ISR、恢复现场。中断有优先级/嵌套；ISR 要短，重活放主循环/任务。\n\n**中断的硬件意义**：按键/编码器/串口接收用中断，避免轮询丢事件；但中断太频繁会占 CPU，要用 DMA/缓冲。\n\n**DMA**：外设和内存直接搬运数据，不经过 CPU。ADC 连续采样→DMA 写缓冲；SPI/I²C 大数据→DMA；UART 接收→DMA + 空闲中断。\n\n**DMA 的硬件意义**：高速/连续数据不丢；CPU 可以同时做别的。DMA 和 CPU 争总线，带宽要算。\n\n**时钟树**：外部晶振→PLL→系统时钟→AHB/APB 分频→外设时钟。每个外设的时钟要单独使能；时钟频率决定 UART 波特率、SPI 速率、ADC 采样时间、定时器周期。\n\n**时钟配置错的表现**：UART 乱码（波特率偏）、定时器不准、ADC 采样时间不够、SPI 速率不对。排查先看时钟树/晶振。\n\n**低功耗**：睡眠/停机/待机模式关不同时钟/电源；唤醒源（中断/RTC/看门狗）要配置。低功耗产品要算平均电流。\n\n**看门狗**：独立时钟源，主程序喂狗；程序跑飞/死循环，看门狗复位。喂狗不能放中断（中断还在跑，主循环可能已死）。\n\n#### 17.4.6 UART/SPI/I²C 的时序与硬件约束\n\n三种串行总线，硬件约束完全不同。\n\n**UART（异步）**：无时钟线，收发双方按约定波特率采样。帧格式：起始位（低）、数据位（5～9）、校验位（可选）、停止位（高）。波特率误差要 <3%（最好 <2%），否则采样点漂移，误码。\n\n- TX/RX 要交叉；共地；\n- 空闲高电平；未用 RX 加上拉，不要浮空；\n- 长线/高波特率加串阻（22～100Ω）；\n- 电平不匹配用电平转换/分压。\n\n**SPI（同步 4 线）**：SCK、MOSI、MISO、CS。主机产生时钟，从机在时钟边沿采样。模式由 CPOL/CPHA 决定（Mode 0～3），主从要一致。\n\n- 每个从机独立 CS，不能共用；\n- SCK 速率受走线/从机限制，长线降速；\n- MISO 是高阻输入，多从机时要注意总线冲突（未选中的从机要释放 MISO）；\n- CS 加上拉，防止上电误选中。\n\n**I²C（两线）**：SCL/SDA，开漏 + 上拉。起始/停止条件、地址、ACK。速率 100k/400k/1M。\n\n- 上拉按总线电容/速率算（见 15 章）；\n- 地址不能冲突；地址脚不能浮空；\n- 总线电容 <400pF（快速模式）；\n- 热插拔要串阻/ESD；\n- 多主设备要仲裁，课程项目一般单主。\n\n**硬件设计要点**：三种总线都要“共地、电平匹配、保护（ESD/串阻）、测试点”。协议错误先查硬件（电平/上拉/CS/地），再查软件；硬件正常再怀疑协议/固件，顺序反了会浪费很多时间。\n\n#### 17.4.7 运放、比较器与传感器前端\n\nMCU 的 ADC 前面经常要加模拟前端（AFE），不是“直接接传感器”。\n\n**电压跟随器**：运放同相输入接信号、输出接反相输入，增益 1，输入阻抗高、输出阻抗低。用于高阻传感器/分压网络，把源阻抗降下来，让 ADC 采样准确。\n\n**同相/反相放大**：同相 `G=1+Rf/Rg`，反相 `G=−Rf/Rin`。单电源运放要加偏置（虚拟地），否则负半周被削掉。\n\n**差分放大**：测电流/电桥，用差分/仪表放大，抗共模。电阻匹配影响 CMRR，1% 电阻大概 40dB，0.1% 更好。\n\n**比较器**：开漏/推挽输出，带迟滞防抖。用于过压/欠压/零交叉检测；输出接 GPIO/中断，加上拉。\n\n**滤波**：RC 低通抗混叠；截止频率 `fc=1/(2πRC)`。R 不能太大（影响 ADC 源阻抗），C 不能太大（响应慢）。\n\n**保护**：运放输入加 TVS/串阻，防止超范围；输入共模范围要包含信号；输出不能超 ADC 输入范围。\n\n**传感器前端**：热敏电阻分压、电桥、霍尔、4～20mA 环路。每种都有偏置/放大/滤波/保护，不能照抄开发板。\n\n**布局**：模拟走线短、包地、远离数字/电源；运放电源去耦；参考/地被模拟信号包围。\n\n#### 17.4.8 LED、按键、蜂鸣器的工程做法\n\n**LED**：限流电阻 `R=(VDD−VF)/I`；多个 LED 分别限流，不要并联共享一个电阻（VF 不一致会亮度不均/电流集中）。RGB LED 三路分别限流。LED 反向耐压低，不要反接；PWM 调光频率 >200Hz，避免闪烁。\n\n**按键**：上拉/下拉 + RC 去抖；长线按键加串阻/ESD；矩阵键盘要扫描/二极管防鬼键。按键的机械抖动几 ms，软件去抖 10～20ms。\n\n**蜂鸣器**：有源（自带振荡）加电压就响；无源需要 PWM/方波。蜂鸣器电流几十 mA，用三极管/MOS 驱动，加续流二极管（电磁式）。PWM 频率选 2～4kHz（谐振频率），音量最大。\n\n**继电器**：线圈加续流二极管，驱动管/MOS，触点加 RC/压敏；强弱电爬距。\n\n**电机**：H 桥/驱动芯片，续流/刹车，PWM 调速；电流检测/过流保护。\n\n**共同点**：这些“负载”都不是 GPIO 能直驱的，要算电流/电压/反峰，加驱动/保护。GPIO 只做“控制信号”，不做“功率输出”。\n\n#### 17.4.9 复位、看门狗与低电压检测\n\nMCU 的“可靠启动/恢复”靠复位和看门狗。\n\n**复位源**：POR（上电）、BOR（低压）、NRST（外部）、看门狗、软件复位。复位后要读复位标志，知道“为什么复位”。\n\n**BOR**：电源低于阈值时复位，防止低压跑飞/写坏 Flash。BOR 阈值要高于 Flash 写/CPU 最低电压。\n\n**看门狗**：独立时钟，主循环喂狗；喂狗太频繁/太慢都不对。窗口看门狗要求“在规定窗口内喂”，防止程序跑飞后仍在喂。\n\n**复位电路**：NRST 上拉 + 电容 + 按键；电容太大影响调试器复位；复位 IC 阈值准/延时固定。\n\n**低电压检测**：ADC/比较器监测电源，提前保存/报警；电池产品要设阈值/迟滞。\n\n**复位后的安全状态**：GPIO 默认输入/高阻，继电器/电机驱动要加上下拉，确保复位时不误动作。\n\n**调试**：用示波器抓 NRST/电源/复位标志；复位随机先查电源跌落/看门狗/噪声。\n\n#### 17.4.10 通信接口的 ESD 与保护\n\nMCU 的通信接口经常外露，保护不能省。\n\n**UART**：TX/RX 加 ESD（低电容）、串阻（22～100Ω）；长线加共模电感/隔离。\n\n**RS485/CAN**：收发器 + TVS + 共模 + 终端；工业加隔离。MCU 侧只接 TTL，不直接接总线。\n\n**USB**：D+/D− 低电容 ESD（<0.5pF）；VBUS 加保险/ESD；差分 90Ω。\n\n**I²C/SPI**：外露连接器加 ESD/串阻；I²C 上拉/电容按速率。\n\n**ADC 输入**：外露传感器加 TVS/串阻/RC；输入范围不能超 VREF。\n\n**GPIO**：外露按键/LED 加串阻/ESD；长线加 RC。\n\n**保护顺序**：连接器→TVS/ESD→串阻/共模→MCU。保护器件靠近连接器，地回路短。\n\n**常见错误**：ESD 电容太大影响高速；TVS 钳位高于 MCU 耐压；保护器件放太远。保护不是“加上就行”，要按信号速率/电平选。\n### 17.5 选型与降额\n\n| 外设 | 选型 | 降额 |\n|---|---|---|\n| GPIO 驱动 LED | 电阻按 5～10mA | 不超单脚/总和 |\n| 按键 | 上拉 10k + 100nF | 去抖 |\n| ADC 分压 | 源阻抗 ≤ 手册 | 加 RC/缓冲 |\n| UART | 波特率误差 <3% | 晶振精度 |\n| SPI | 速率按走线 | 长线降速 |\n| I²C | 上拉按速率/电容 | 总线电容 <400pF |\n\n#### 17.5.1 外设选型的核算：不是“能接就行”\n\n外设选型要算“电平、电流、速率、阻抗、保护”五项。\n\n**电平**：MCU 3.3V，外设 5V/1.8V，要电平转换。3.3V 输出到 5V 输入，查 `V_IH`；5V 输出到 3.3V 输入，查是否 5V 容忍。\n\n**电流**：GPIO 单脚/总和；外设工作/峰值电流；电源余量。LED/蜂鸣器/继电器要驱动。\n\n**速率**：UART 波特率误差、SPI 速率/走线、I²C 速率/电容、ADC 采样率/源阻抗。\n\n**阻抗**：ADC 源阻抗、SPI 长线阻抗、I²C 上拉/电容。\n\n**保护**：外设接口是否外露，要不要 ESD/TVS/串阻/隔离。\n\n**算例**：3.3V MCU 接 5V 传感器 I²C。SDA/SCL 是开漏，上拉到 5V 会灌 3.3V 引脚；要用 I²C 电平转换（如 PCA9306）或 3.3V 上拉 + 5V 容忍引脚。不能直接上拉到 5V。\n\n**算例**：SPI Flash 3.3V、SCK 50MHz、走线 5cm。要阻抗控制/短走线/串阻；长线降速到 10～20MHz。\n\n**算例**：ADC 测 12V 电池，分压 1:4，源阻抗 10k。要加运放缓冲/减小分压电阻，否则采样跳。\n\n**降额**：外设电源/电流/速率按 70%～80% 用；接口保护按最坏情况选。选型表里每项都写“依据/页码”，评审时才站得住。\n\n#### 17.5.2 低功耗与电源模式\n\n电池/低功耗产品，MCU 的功耗设计比外设还重要。\n\n**运行模式**：主频越高功耗越大；降频/降压能省电。`P ∝ C×V²×f`，电压降 10%，功耗降约 19%。\n\n**睡眠/停机/待机**：睡眠关 CPU 时钟，外设可运行；停机关大部分时钟，保留 RAM/寄存器；待机关电源，只留 RTC/唤醒。不同模式唤醒源/恢复时间不同。\n\n**外设功耗**：ADC/运放/传感器不用时关掉；上拉电阻在低功耗时断开；LED 不要常亮。\n\n**唤醒源**：按键/ RTC/看门狗/比较器/串口。唤醒要能区分“真事件”和“噪声”，加去抖/滤波。\n\n**平均电流**：`I_avg = (I_run×t_run + I_sleep×t_sleep)/T`。1 秒醒一次、每次 10ms/10mA、睡眠 1μA，平均约 `(10mA×0.01+1μA×0.99)/1≈101μA`。\n\n**电池寿命**：`t = 容量/平均电流`。1000mAh/100μA≈10000 小时≈1.1 年（理想，实际打折）。\n\n**硬件配合**：低功耗不是软件一个人的事；电源芯片的静态电流、上拉电阻、传感器待机电流都要算。\n\n#### 17.5.3 替代料与国产兼容\n\n课程/产品都可能遇到“原型号买不到”，要会找替代。\n\n**替代维度**：引脚兼容（Pin-to-Pin）、外设兼容、Flash/RAM 够、电压/温度范围、封装一致。\n\n**国产兼容**：GD32/APM32/CH32 等与 STM32F1 系列部分兼容；外设/寄存器有差异，固件要改；不能直接替换不验证。\n\n**验证**：先做最小系统（供电/时钟/下载/串口），再逐个外设验证；时序/ADC/USB 差异要重点测。\n\n**风险**：替代料的 Errata/温度/供货；量产前做小批验证；BOM 里标“可选替代”，不要偷偷换。\n\n**成本**：替代料便宜但工具/文档/生态可能差；算总成本（开发/返修/风险），不只看单价。\n### 17.6 测量与仿真\n\n#### 17.6.1 测外设\n\n1. GPIO 输出高低电平、驱动电流。\n2. 按键按下/松开电平、抖动。\n3. ADC 输入电压 vs 读数。\n4. UART 波特率/波形。\n5. SPI/I²C 波形、上拉。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 17-4：推挽 vs 开漏输出<\/text>\n  <text x=\"50\" y=\"75\" font-size=\"13\" fill=\"currentColor\">推挽<\/text>\n  <line x1=\"50\" y1=\"95\" x2=\"180\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"90\" font-size=\"11\" fill=\"currentColor\">VDD<\/text>\n  <rect x=\"105\" y=\"100\" width=\"40\" height=\"25\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"112\" y=\"117\" font-size=\"10\" fill=\"currentColor\">PMOS<\/text>\n  <rect x=\"105\" y=\"150\" width=\"40\" height=\"25\" fill=\"none\" stroke=\"currentColor\" ont-size=\"11\" fill=\"currentColor\">OUT<\/text>\n  <text x=\"40\" y=\"250\" font-size=\"12\" fill=\"currentColor\">推挽能主动拉高/拉低；开漏只能拉低，高电平靠上拉。<\/text>\n  <text x=\"40\" y=\"280\" font-size=\"12\" fill=\"currentColor\">两个推挽输出不能直接并联；开漏可以线与。<\/text>\n<\/svg>\n```\n\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 17-5：ADC 采样保持与源阻抗<\/text>\n  <text x=\"40\" y=\"80\" font-size=\"12\" fill=\"currentColor\">R_source<\/text>\n  <rect x=\"110\" y=\"65\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"85\" font-size=\"10\" fill=\"currentColor\">10k<\/text>\n  <line x1=\"60\" y1=\"80\" x2=\"110\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"170\" y1=\"80\" x2=\"250\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"180\" y=\"72\" font-size=\"11\" fill=\"currentColor\">Vin<\/text>\n  <line x1=\"250\" y1=\"80\" x2=\"250\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"130\" x2=\"260\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"275\" y=\"128\" font-size=\"10\" fill=\"currentColor\">C_sample<\/text>\n  <line x1=\"250\" y1=\"130\" x2=\"250\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"170\" x2=\"270\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"275\" y=\"175\" font-size=\"10\" fill=\"currentColor\">GND<\/text>\n  <rect x=\"400\" y=\"50\" width=\"100\" height=\"70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"425\" y=\"90\" font-size=\"12\" fill=\"currentColor\">ADC<\/text>\n  <line x1=\"250\" y1=\"80\" x2=\"400\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"235\" font-size=\"12\" fill=\"currentColor\">τ=R_source×C_sample；采样时间要 ≥(n+1)τ，否则读数跳。<\/text>\n  <text x=\"40\" y=\"265\" font-size=\"12\" fill=\"currentColor\">高阻源加运放缓冲；参考电压要干净。<\/text>\n<\/svg>\n```\n\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 17-6：时钟树与外设时钟<\/text>\n  <rect x=\"40\" y=\"70\" width=\"110\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"55\" y=\"95\" font-size=\"11\" fill=\"currentColor\">晶振 8MHz<\/text>\n  <line x1=\"150\" y1=\"95\" x2=\"210\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"210\" y=\"70\" width=\"90\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"225\" y=\"95\" font-size=\"11\" fill=\"currentColor\">PLL ×9<\/text>\n  <line x1=\"300\" y1=\"95\" x2=\"360\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"310\" y=\"88\" font-size=\"10\" fill=\"currentColor\">72MHz<\/text>\n  <rect x=\"360\" y=\"70\" width=\"110\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"375\" y=\"95\" font-size=\"11\" fill=\"currentColor\">AHB 72MHz<\/text>\n  <line x1=\"470\" y1=\"95\" x2=\"530\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"530\" y=\"70\" width=\"120\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"545\" y=\"95\" font-size=\"11\" fill=\"currentColor\">APB 36MHz<\/text>\n  <line x1=\"415\" y1=\"120\" x2=\"415\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"590\" y1=\"120\" x2=\"590\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"330\" y=\"160\" width=\"140\" height=\"45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"345\" y=\"185\" font-size=\"10\" fill=\"currentColor\">DMA/GPIO/ADC<\/text>\n  <rect x=\"520\" y=\"160\" width=\"140\" height=\"45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"535\" y=\"185\" font-size=\"10\" fill=\"currentColor\">UART/SPI/I²C<\/text>\n  <text x=\"40\" y=\"250\" font-size=\"12\" fill=\"currentColor\">每个外设时钟单独使能；分频决定波特率/定时/采样。<\/text>\n  <text x=\"40\" y=\"280\" font-size=\"12\" fill=\"currentColor\">时钟配错：串口乱码、定时不准、ADC 采样不足。<\/text>\n<\/svg>\n```\n\n#### 17.6.2 CircuitJS\n\n```circuitjs\ngpio-button\n```\n\n观察上拉按键与去抖。\n\n```circuitjs\nled-resistor\n```\n\n观察 LED 限流电阻与电流。\n\n#### 17.6.3 动手任务\n\n- 算一个 3.3V、2mA LED 的限流电阻。\n- 画 ADC 分压 12V→3.3V 前端。\n- 画 UART 交叉连接。\n- 测一块开发板的 GPIO/ADC/UART。\n\n#### 17.6.4 用示波器/逻辑分析仪测外设\n\n**GPIO**：测高/低电平、上升/下降沿、驱动能力（带负载看电平跌落）；按键测抖动。\n\n**PWM**：测频率、占空比、上升沿；带电机/继电器看波形畸变。\n\n**ADC**：测输入电压 vs 读数；用可调电源扫几个点，算偏移/增益；看参考电压纹波。\n\n**UART**：测波特率（位宽）、帧格式、空闲电平；解码看数据；误码时查波特率/地/电平。\n\n**SPI**：测 SCK/MOSI/MISO/CS；看 CPOL/CPHA、CS 时序、MISO 冲突；长线看振铃。\n\n**I²C**：测 SCL/SDA 上拉/上升沿、起始/停止、ACK；地址冲突时 SDA 被拉低。\n\n**逻辑分析仪**：多通道抓时序/解码协议，比示波器更适合数字总线；采样率要 ≥5 倍信号频率。\n\n**测量注意**：地线短、探头电容小、衰减/带宽匹配；数字信号用 DC 耦合，电源纹波用 AC 耦合。\n\n#### 17.6.5 固件与硬件联调的顺序\n\n硬件工程师要会和固件联调，不然“板子好了但跑不起来”说不清是谁的问题。\n\n**顺序**：\n\n1. 供电/复位/时钟：先让 MCU 能跑（SWD 读 ID、点灯）；\n2. GPIO：输入输出、上下拉、中断；\n3. 定时器/PWM：测频率/占空比；\n4. UART：环回/收发；\n5. SPI/I²C：读 ID/寄存器；\n6. ADC：测已知电压；\n7. DMA/中断：连续数据不丢；\n8. 外设整机：传感器/执行器。\n\n**分工**：硬件保证电平/电源/时钟/连接；固件保证配置/时序/协议。出问题先测硬件（电压/波形/通断），再查固件（寄存器/时钟/模式）。\n\n**联调工具**：SWD 调试器、串口打印、逻辑分析仪、示波器。打印不要占用关键引脚；调试口要留。\n\n**记录**：每次改硬件/固件都记录；版本对应；否则“上次好的，这次坏了”无法定位。\n\n**常见扯皮**：“软件说硬件没接对，硬件说软件配错了”。用测量说话：波形/电压/通断，不猜。\n\n#### 17.6.6 外设测量的最小工具集\n\n不用高端仪器，几件工具就能覆盖大部分外设调试。\n\n**万用表**：测电源/电平/通断/电阻/电流；二极管档测 LED/二极管；通断档查虚焊/断线。\n\n**示波器**（≥100MHz，2 通道）：测 GPIO/PWM/UART/SPI/I²C/电源纹波；带宽不够会“看不到真实边沿”。\n\n**逻辑分析仪**（8～16 通道）：抓数字总线/解码协议；比示波器更适合多线时序。\n\n**可调电源**：限流保护，逐步上电；看电流判断短路/异常。\n\n**USB 转串口**：调试打印/通信；注意电平（3.3V/5V）。\n\n**SWD 调试器**：下载/调试/读寄存器；ST-Link/J-Link/DAPLink。\n\n**焊接工具**：烙铁/热风/助焊剂/吸锡带；返修 QFN/LQFP。\n\n**测量习惯**：先测电源再测信号；地线短；单次/自动触发抓偶发；记录波形/数值。工具不在多，在会用：一块万用表加一台示波器，能解决八成外设问题。\n\n#### 17.6.7 一张外设测试记录表\n\n测试不是“看一眼”，要留记录。\n\n| 项目 | 测点 | 期望 | 实测 | 结论 |\n|---|---|---|---|---|\n| VDD/VDDA | C 两端 | 3.3V±5% |  |  |\n| NRST | NRST 脚 | 高电平，按键拉低 |  |  |\n| 晶振 | OSC_OUT | 8MHz 正弦 |  |  |\n| GPIO 高/低 | PA0 | 3.3V/0V |  |  |\n| LED 电流 | 电阻两端 | 4.5mA |  |  |\n| ADC 0/满量程 | ADC 脚 | 0/4095±2LSB |  |  |\n| UART 波形 | TX | 115200，位宽 8.7μs |  |  |\n| I²C 上升沿 | SDA | <1μs |  |  |\n| 复位电流 | 电源 | <50mA |  |  |\n\n每一行都有“期望/实测/结论”；没有记录就等于没测，出了问题也说不清是设计还是装配。课程报告里附这张表，比写“功能正常”有说服力得多。这张表以后每块板都能复用，改几行就适配新项目，长期看是最省时间的习惯。别等到出问题才想起补记录；这一步花十分钟，后面往往能省十小时。记录是工程师的第二种语言，也是团队协作的基础；先写下来，再谈优化、复盘与传承，这一步真的省不得，也急不得。课程项目把这张表附在报告里，面试时也能讲。\n### 17.7 常见坑\n\n1. **GPIO 直驱大电流负载**：端口烧/复位。\n2. **5V 信号直连 3.3V GPIO**：除非手册标 5V 容忍。\n3. **I²C 上拉太大/太小**：上升沿差/功耗大。\n4. **SPI CS 共用**：多设备冲突。\n5. **ADC 源阻抗太高**：采样不准。\n6. **UART TX/RX 没交叉**：通信不通。\n7. **BOOT 脚悬空**：启动模式随机。\n8. **复位脚无滤波**：干扰复位。\n9. **时钟配置错**：波特率/定时全偏。\n\n#### 17.7.1 外设设计的 12 条检查\n\n1. GPIO 单脚/总电流是否降额？\n2. 5V 信号是否直连 3.3V 非容忍脚？\n3. 未用引脚是否浮空？\n4. 去耦电容是否靠近电源脚？\n5. 复位/BOOT 是否浮空？\n6. 晶振负载电容是否按 CL 算？\n7. ADC 源阻抗/采样时间是否够？\n8. ADC 参考电压是否干净？\n9. UART TX/RX 是否交叉、共地？\n10. SPI 每个从机是否独立 CS？\n11. I²C 上拉/地址/电容是否核算？\n12. 外露接口是否有 ESD/串阻/保护？\n\n每条都能指到原理图/PCB 的位置；指不到，就是“没做”。\n\n#### 17.7.2 三个“外设玄学”案例\n\n**案例一：ADC 读数随 LED 闪烁跳**。现象：LED 一亮，ADC 读数跳几十个码。排查：LED 电流经过地线，地弹影响 ADC 参考；LED 与 ADC 共用电源/地。整改：LED 单独走线/地，ADC 参考加 RC/去耦，读数稳定。\n\n**案例二：I²C 偶尔 NACK**。现象：上电偶尔读不到传感器，复位后正常。排查：上拉太大/总线电容大，上升沿慢；传感器上电慢，MCU 先发命令。整改：减小上拉、加延时/重试，NACK 消失。\n\n**案例三：PWM 调光 LED 有啸叫**。现象：低亮度时听到高频声。排查：PWM 频率落在音频范围/电容啸叫。整改：PWM 提到 20kHz 以上，或加 RC 滤波，啸叫消失。\n\n**共同点**：不是“芯片玄学”，是“地/电源/时序/频率”这些硬件参数。用示波器看波形/电源，比换芯片有效。\n\n#### 17.7.3 上电不工作的七步排查\n\n1. 电源：各路电压/纹波/电流；限流电源看是否限流。\n2. 复位：NRST 电平/波形；是否一直被拉低。\n3. 时钟：晶振起振/波形；是否用内部 RC。\n4. BOOT：BOOT0/1 电平；启动模式对不对。\n5. 调试：SWD 能否读 ID；接线/上拉/地。\n6. 最小系统：只焊 MCU + 电源 + 复位 + 时钟，能否点灯。\n7. 外设：逐个加，找出“加了就不跑”的那个。\n\n顺序不能反：先电源/复位/时钟，再调试/外设。七步能解决大部分“新板不跑”；剩下的小概率是焊接/器件/固件，再往下查；排查记录写下来，下次同类问题能少走一半弯路。\n### 17.8 本章复盘\n\n#### 17.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| `R=(VDD−VF)/I` | LED 限流 | 按目标电流 |\n| `Vout=Vin×R2/(R1+R2)` | ADC 分压 | 源阻抗要低 |\n| UART 交叉 TX/RX | 通信 | 共地 |\n| I²C 开漏+上拉 | 总线 | 地址不冲突 |\n| SPI 独立 CS | 多设备 | 速率/走线 |\n\n#### 17.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| GPIO | general purpose IO | 通用输入输出 |\n| 推挽 | push-pull | 主动拉高/拉低 |\n| 开漏 | open-drain | 只能拉低，需上拉 |\n| ADC | analog-to-digital converter | 模数转换 |\n| UART | universal asynchronous receiver/transmitter | 异步串口 |\n| SPI | serial peripheral interface | 同步四线总线 |\n| I²C | inter-integrated circuit | 两线总线 |\n| DMA | direct memory access | 外设内存直传 |\n\n#### 17.8.3 自测 10 题\n\n1. MCU 最小系统包含什么？\n2. 推挽和开漏的区别？\n3. GPIO 驱动 LED 怎么算电阻？\n4. 5V 信号能直连 3.3V GPIO 吗？\n5. ADC 源阻抗为什么重要？\n6. UART 为什么要交叉 TX/RX？\n7. SPI 多设备怎么选 CS？\n8. I²C 上拉的作用？\n9. BOOT 脚悬空有什么风险？\n10. DMA 解决什么问题？\n\n#### 17.8.4 能力清单\n\n- [ ] 能说清 MCU 最小系统。\n- [ ] 能配置/检查 GPIO 输入输出。\n- [ ] 能画 ADC/UART/SPI/I²C 最小连接。\n- [ ] 能判断电平/电流/上拉是否匹配。\n- [ ] 能测基本外设波形。\n\n#### 17.8.5 外设章节复盘清单\n\n1. MCU 最小系统五件套齐全吗？\n2. GPIO 推挽/开漏/上下拉配置对吗？\n3. 单脚/总电流降额了吗？\n4. 5V/1.8V 电平匹配了吗？\n5. 未用引脚处理了吗？\n6. 去耦/地脚/VDDA 滤波做了吗？\n7. 复位/BOOT/晶振/SWD 检查了吗？\n8. ADC 源阻抗/采样时间/参考算了吗？\n9. 定时器/PWM 频率/分辨率算了吗？\n10. UART/SPI/I²C 电平和时序对吗？\n11. 中断/DMA/时钟树理解了吗？\n12. 低功耗/唤醒源算了吗？\n13. 外露接口保护做了吗？\n14. 每个外设都有测试点/测试方法吗？\n\n这 14 条不是“考试题”，是画板前的检查表。每条都能在原理图上指到位置，才算真的懂。先照着表把最小系统板过一遍，再去看开发板原理图，你会发现“原来每个器件都有理由”。\n\n**最后一句**：外设不是“软件配一配”，每个外设背后都有电气约束。你把 GPIO/ADC/定时器/串行总线这四类吃透，换任何 MCU 都是同一套方法，差别只在寄存器和引脚名。\n\n#### 17.8.6 下一章\n\n下一章讲**STM32 最小系统与开发板原理图**：把 MCU 最小系统真正画成一块可打样的开发板，从选型、电源、时钟、复位到调试口逐页画完。\n\n本章内容完。","taskSignature":"a931fb3cfe9cb7199e329455fd2686091b2fed87528ca30ceaa48d9db088e899","taskCount":5},{"id":"18","title":"第 18 章 · STM32 最小系统与开发板原理图","short":"STM32 最小系统与开发板原理图","stage":3,"diff":3,"prev":"第 17 章 单片机基础与常用外设","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 画出一块 STM32F103C8T6 的最小系统原理图。\n2. 正确处理电源脚、VDDA、备份域、BOOT、复位、晶振、SWD。\n3. 给每个电源脚配去耦电容，并解释 100nF + 10μF 的分工。\n4. 画 USB 转串口、LED、按键、排针等开发板外设。\n5. 检查 STM32 原理图的 12 个易错点。\n6. 把原理图转成 PCB 前的封装/网表检查清单。\n7. 说出至少 8 个 STM32 最小系统常见坑。\n\nSTM32 最小系统不复杂，但“少一个电容、错一个 BOOT、反一个二极管”都会让板子不跑。本章按手册逐脚过一遍。\n\n## 正文\n\n### 18.1 它解决什么问题：三个真实场景\n\n#### 场景一：VDDA 没接，ADC 读数乱\n\nSTM32 的 VDDA 是模拟电源，必须接 3.3V 并加去耦；有人只接 VDD，ADC 还能出数，但精度/稳定性很差。VDDA/VSSA 要单独滤波。\n\n#### 场景二：BOOT0 悬空，程序时好时坏\n\nBOOT0 决定启动模式，悬空时电平不确定，有时进 Flash、有时进系统存储器。BOOT0 必须下拉/上拉固定。\n\n#### 场景三：SWD 只接两根线，下载器识别不到\n\nSWDIO/SWCLK 接对，但 GND 没接或复位脚被按住，下载器识别失败。SWD 座要 VCC/GND/SWDIO/SWCLK/NRST 完整。\n\n### 18.2 它是什么：最小系统的 7 个部分\n\n1. 电源：VDD ×3、VDDA、VSS ×3、VSSA。\n2. 去耦：每个 VDD 100nF，整体 10μF。\n3. 时钟：8MHz 晶振 + 负载电容；可选 32.768kHz。\n4. 复位：NRST + 100nF + 按键。\n5. BOOT：BOOT0 下拉 10k，BOOT1 可跳线。\n6. 调试：SWD 5 针。\n7. 外设：USB、串口、LED、按键、排针。\n\n> **术语第一次出现**：备份域（VBAT）是给 RTC/备份寄存器供电的域。不用电池时 VBAT 接 VDD，不能悬空。\n\n#### 18.2.1 STM32F103C8T6 的资源与引脚\n\n先认清这颗芯片，再画图。\n\n**资源**：Cortex-M3 72MHz、64KB Flash、20KB SRAM、2×12 位 ADC、3 个 USART、2 个 SPI、2 个 I²C、多个 16 位定时器、USB 设备、CAN（部分型号）。\n\n**封装**：LQFP48，0.5mm 间距，引脚 1 在圆点/缺角处；手工焊可行，但要注意连锡。\n\n**电源脚**：VDD_1/2/3（24/36/48 脚附近）、VSS_1/2/3、VDDA（9 脚）、VSSA（8 脚）、VBAT（1 脚）。具体脚号以手册为准。\n\n**时钟**：OSC_IN/OSC_OUT（5/6 脚）接 8MHz；OSC32_IN/OSC32_OUT 接 32.768kHz（可选）。\n\n**复位**：NRST（7 脚），内部上拉，外部 100nF 到地。\n\n**BOOT**：BOOT0（44 脚）、BOOT1/PB2（20 脚）；BOOT0 下拉从 Flash 启动。\n\n**调试**：SWDIO（34 脚）、SWCLK（37 脚），PA13/PA14；复位后可复用为 GPIO，调试时要保留。\n\n**USB**：PA11/PA12（D−/D+），USB 设备；D+ 上拉 1.5k 到 3.3V（部分型号内置）。\n\n**引脚分配原则**：电源/地/晶振/复位/BOOT/SWD 先固定；通信/模拟/定时器按功能分；相邻引脚避免“模拟+功率”。\n\n#### 18.2.2 备份域、RTC 与 VBAT\n\nVBAT 不是“可接可不接”，它决定备份域能不能工作。\n\n**备份域内容**：RTC、备份寄存器（BKP）、部分低功耗逻辑。主电源掉电后靠 VBAT 维持。\n\n**不用电池**：VBAT 接 VDD；不能悬空，悬空时备份域电平不确定，RTC 可能不走/寄存器乱。\n\n**用电池**：CR1220/纽扣电池 + 二极管（防反充）；电池座靠近 VBAT，走线短；电池电压 3V，低于 VDD 时自动切换。\n\n**RTC 晶振**：32.768kHz，CL 6～12pF，负载电容小；布局远离高速/电源，包地。\n\n**校准**：RTC 有 ppm 误差，产品要校准/温度补偿；课程项目知道“有误差”即可。\n\n**低功耗**：待机模式只留 RTC/备份域，VBAT 供电；唤醒源要配置。\n\n**常见错误**：VBAT 悬空、电池反接、RTC 晶振电容按 8MHz 算（太大不起振）。\n\n#### 18.2.3 时钟方案：HSI、HSE、PLL 怎么选\n\nSTM32 的时钟有三条路，选错会影响串口/USB/定时精度。\n\n**HSI**：内部 8MHz RC，无需外部晶振，成本低；精度 ±1%～2%（温漂更大），高速串口/USB 不合适。\n\n**HSE**：外部 8MHz 晶振，精度 ppm 级；经 PLL 倍频到 72MHz；USB 需要精确 48MHz，必须用 HSE/PLL。\n\n**LSI/LSE**：内部/外部低速时钟，给看门狗/RTC；LSE 32.768kHz 精度高，RTC 用。\n\n**PLL**：`f_out=f_in×M/(N×P)`（按型号），STM32F103 常用 8MHz×9=72MHz；PLL 配置错会超频/降频。\n\n**时钟输出**：MCO 引脚可输出时钟，方便测/给外设；调试时能验证时钟树。\n\n**低功耗**：睡眠/停机时可切 HSI/LSI，唤醒后切回 HSE/PLL。\n\n**选型**：课程/开发板用 8MHz HSE + PLL 72MHz；电池产品可 HSI 降频；USB 必须 HSE。\n\n### 18.3 关键参数与手册\n\n| 项目 | 推荐 | 说明 |\n|---|---|---|\n| VDD | 2.0～3.6V | 常用 3.3V |\n| VDDA | 与 VDD 同源，加 LC/RC | ADC 参考 |\n| 去耦 | 每个 VDD 100nF + 10μF | 靠近引脚 |\n| 晶振 | 8MHz，CL 按手册 | 负载电容 10～20pF |\n| NRST | 100nF 到地，10k 上拉 | 内部已有上拉，外部可选 |\n| BOOT0 | 10k 下拉 | 固定从 Flash 启动 |\n| SWD | 3.3V/GND/SWDIO/SWCLK/NRST | 5 针 |\n| USB | D+/D− 串联 22Ω | 差分 90Ω |\n\n#### 18.3.1 电源域：VDD、VDDA、VBAT 怎么接\n\nSTM32 有三个电源域，接错一个就“时好时坏”。\n\n**VDD**：数字电源 2.0～3.6V，每个 VDD 脚旁 100nF；三个脚都要接，不能只接一个。\n\n**VDDA**：模拟电源，给 ADC/DAC/比较器；要和 VDD 同源，经磁珠/10Ω + 100nF+1μF 滤波；VDDA 不能悬空，否则 ADC 读数乱。\n\n**VSSA**：模拟地，和 VSS 在芯片下方单点汇合；不要和数字地大面积直连后再进 ADC。\n\n**VBAT**：备份域（RTC/备份寄存器）；不用电池时接 VDD（不是悬空）；用电池时加二极管/电池座，防止反充。\n\n**上电顺序**：VDD 和 VDDA 尽量同时/VDDA 不早于 VDD；多电源域按手册。\n\n**去耦分工**：100nF 管高频瞬态，10μF 管低频/储能；都要靠近引脚，地过孔短。\n\n**常见错误**：VDDA 直接接 VDD 不加滤波、VBAT 悬空、VSSA 不接、去耦电容离得远。\n\n#### 18.3.2 8MHz 晶振与负载电容\n\n晶振不是“接上就起振”，负载电容和布局都影响。\n\n**负载电容 `CL`**：晶振手册给 `CL`（比如 10pF/20pF）。外部电容 `C1=C2≈2×(CL−Cstray)`；`Cstray` 是 PCB/引脚杂散（3～5pF）。CL=10pF、Cstray=4pF，`C1=C2≈12pF`，取 10～12pF。\n\n**起振条件**：负阻/环路增益够；ESR 不能太大；负载电容匹配；晶振靠近 MCU（<10mm），下方包地，走线短/对称。\n\n**不起振排查**：电容太大/太小、晶振坏、焊接虚、负载电容不对称、MCU 配置成外部时钟但晶振没起。\n\n**32.768kHz**：RTC 晶振，CL 通常 6～12pF，电容更小；布局更敏感，包地/远离干扰。\n\n**精度**：晶振 ppm 影响 RTC/串口；串口波特率误差 <3%，一般晶振够；RTC 要校准。\n\n**替代**：不想用外部晶振，可用内部 RC（HSI），但精度/温漂差，串口高速/USB 不建议。\n\n#### 18.3.3 SWD、BOOT 与调试口的工程细节\n\n**SWD 五线**：3.3V、GND、SWDIO、SWCLK、NRST。少 GND 最常见；NRST 可不接（用软件复位），但接了更稳。\n\n**上拉/下拉**：SWDIO 内部上拉、SWCLK 内部下拉；外部可加 10k 上拉/下拉，长线更稳。\n\n**接口保护**：SWD 座加 ESD/串阻（22～100Ω），防止插拔静电。\n\n**BOOT0**：10k 下拉固定 Flash 启动；跳线/按键可拉高进 ISP；不要悬空。\n\n**BOOT1/PB2**：启动模式组合，一般下拉；复用为 GPIO 时注意启动时电平。\n\n**调试口复用**：PA13/PA14 复位后是 SWD，固件里不要配成普通 GPIO，否则下次连不上；留“调试保留”宏。\n\n**下载方式**：SWD（ST-Link/J-Link/DAPLink）、串口 ISP（BOOT0=1）、USB DFU（部分型号）。\n\n**量产**：留测试点/排针，不要只留插座；治具要能接触。\n\n### 18.4 三个典型电路\n\n#### 18.4.1 电源与去耦\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 18-1：STM32 电源脚与去耦<\/text>\n  <text x=\"60\" y=\"90\" font-size=\"12\" fill=\"currentColor\">3.3V<\/text>\n  <line x1=\"100\" y1=\"85\" x2=\"240\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"85\" x2=\"240\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"105\" x2=\"320\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"180\" y=\"135\" width=\"44\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"186\" y=\"153\" font-size=\"10\" fill=\"currentColor\">100nF<\/text>\n  <line x1=\"202\" y1=\"105\" x2=\"202\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"202\" y1=\"161\" x2=\"202\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"124\" y=\"185\" width=\"44\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"134\" y=\"203\" font-size=\"10\" fill=\"currentColor\">10μF<\/text>\n  <line x1=\"146\" y1=\"105\" x2=\"146\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"146\" y1=\"211\" x2=\"146\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"145\" x2=\"280\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"280\" y=\"133\" width=\"34\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"283\" y=\"149\" font-size=\"9\" fill=\"currentColor\">R 10Ω<\/text>\n  <line x1=\"314\" y1=\"145\" x2=\"320\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"260\" y1=\"185\" x2=\"320\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"260\" y1=\"185\" x2=\"260\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"146\" y1=\"250\" x2=\"260\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"260\" y1=\"250\" x2=\"260\" y2=\"268\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"242\" y1=\"268\" x2=\"278\" y2=\"268\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"288\" y=\"273\" font-size=\"11\" fill=\"currentColor\">GND<\/text>\n  <rect x=\"320\" y=\"60\" width=\"240\" height=\"200\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"92\" font-size=\"13\" fill=\"currentColor\">STM32F103<\/text>\n  <text x=\"335\" y=\"110\" font-size=\"11\" fill=\"currentColor\">VDD_1/2/3<\/text>\n  <text x=\"335\" y=\"150\" font-size=\"11\" fill=\"currentColor\">VDDA<\/text>\n  <text x=\"335\" y=\"190\" font-size=\"11\" fill=\"currentColor\">VSS/VSSA<\/text>\n  <text x=\"335\" y=\"228\" font-size=\"11\" fill=\"currentColor\">VBAT<\/text>\n  <text x=\"390\" y=\"228\" font-size=\"10\" fill=\"currentColor\">不用电池时接 VDD<\/text>\n  <text x=\"40\" y=\"320\" font-size=\"13\" fill=\"currentColor\">每个 VDD 脚一个 100nF；VDDA 经 RC 滤波；VBAT 不用电池时接 VDD。<\/text>\n<\/svg>\n```\n\n#### 18.4.2 晶振与复位\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 18-2：8MHz 晶振 + NRST 复位<\/text>\n  <text x=\"40\" y=\"60\" font-size=\"12\" fill=\"currentColor\">晶振<\/text>\n  <rect x=\"80\" y=\"55\" width=\"130\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"105\" y=\"82\" font-size=\"12\" fill=\"currentColor\">STM32<\/text>\n  <text x=\"95\" y=\"100\" font-size=\"10\" fill=\"currentColor\">OSC_IN<\/text>\n  <text x=\"95\" y=\"130\" font-size=\"10\" fill=\"currentColor\">OSC_OUT<\/text>\n  <line x1=\"210\" y1=\"95\" x2=\"310\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"210\" y1=\"125\" x2=\"310\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"310\" y1=\"95\" x2=\"310\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"295\" y1=\"100\" x2=\"325\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"298\" y=\"103\" width=\"24\" height=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"295\" y1=\"112\" x2=\"325\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"310\" y1=\"112\" x2=\"310\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"95\" x2=\"390\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"390\" y1=\"95\" x2=\"390\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"375\" y1=\"125\" x2=\"405\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"390\" y1=\"130\" x2=\"390\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"372\" y1=\"152\" x2=\"408\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"418\" y=\"102\" font-size=\"10\" fill=\"currentColor\">C1 10pF<\/text>\n  <line x1=\"310\" y1=\"112\" x2=\"460\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"112\" x2=\"460\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"445\" y1=\"140\" x2=\"475\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"145\" x2=\"460\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"442\" y1=\"165\" x2=\"478\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"488\" y=\"148\" font-size=\"10\" fill=\"currentColor\">C2 10pF<\/text>\n  <text x=\"40\" y=\"230\" font-size=\"12\" fill=\"currentColor\">复位<\/text>\n  <rect x=\"80\" y=\"210\" width=\"130\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"95\" y=\"250\" font-size=\"10\" fill=\"currentColor\">NRST<\/text>\n  <line x1=\"210\" y1=\"245\" x2=\"300\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"200\" font-size=\"11\" fill=\"currentColor\">3.3V<\/text>\n  <line x1=\"300\" y1=\"205\" x2=\"300\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"280\" y=\"215\" width=\"40\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"284\" y=\"229\" font-size=\"9\" fill=\"currentColor\">10k<\/text>\n  <line x1=\"300\" y1=\"235\" x2=\"300\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"280\" y=\"255\" width=\"40\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"282\" y=\"270\" font-size=\"9\" fill=\"currentColor\">100nF<\/text>\n  <line x1=\"300\" y1=\"245\" x2=\"300\" y2=\"255\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"300\" y1=\"277\" x2=\"300\" y2=\"295\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"282\" y1=\"295\" x2=\"318\" y2=\"295\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"326\" y=\"300\" font-size=\"10\" fill=\"currentColor\">GND<\/text>\n  <text x=\"40\" y=\"335\" font-size=\"12\" fill=\"currentColor\">晶振靠 MCU，负载电容按 CL 算；NRST 10k 上拉 + 100nF 到地。<\/text>\n<\/svg>\n```\n\n#### 18.4.3 SWD 与 BOOT\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 18-3：SWD 座与 BOOT0 下拉<\/text>\n  <rect x=\"60\" y=\"70\" width=\"100\" height=\"130\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"75\" y=\"95\" font-size=\"12\" fill=\"currentColor\">SWD<\/text>\n  <text x=\"75\" y=\"120\" font-size=\"10\" fill=\"currentColor\">3.3V<\/text>\n  <text x=\"75\" y=\"140\" font-size=\"10\" fill=\"currentColor\">GND<\/text>\n  <text x=\"75\" y=\"160\" font-size=\"10\" fill=\"currentColor\">SWDIO<\/text>\n  <text x=\"75\" y=\"180\" font-size=\"10\" fill=\"currentColor\">SWCLK<\/text>\n  <rect x=\"300\" y=\"70\" width=\"160\" height=\"130\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"330\" y=\"100\" font-size=\"13\" fill=\"currentColor\">STM32<\/text>\n  <text x=\"320\" y=\"125\" font-size=\"10\" fill=\"currentColor\">3.3V/GND<\/text>\n  <text x=\"320\" y=\"145\" font-size=\"10\" fill=\"currentColor\">SWDIO/SWCLK<\/text>\n  <text x=\"320\" y=\"170\" font-size=\"10\" fill=\"currentColor\">BOOT0<\/text>\n  <line x1=\"160\" y1=\"130\" x2=\"300\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"165\" x2=\"520\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"520\" y=\"150\" width=\"50\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"528\" y=\"170\" font-size=\"10\" fill=\"currentColor\">10k<\/text>\n  <line x1=\"570\" y1=\"165\" x2=\"610\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"610\" y1=\"165\" x2=\"610\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"620\" y=\"205\" font-size=\"11\" fill=\"currentColor\">GND<\/text>\n  <text x=\"60\" y=\"245\" font-size=\"13\" fill=\"currentColor\">BOOT0 下拉 = 从 Flash 启动；SWD 五线完整。<\/text>\n<\/svg>\n```\n\n#### 18.4.4 USB 转串口与开发板外设\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 18-4：开发板外设框图<\/text>\n  <rect x=\"270\" y=\"80\" width=\"180\" height=\"90\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"115\" font-size=\"14\" fill=\"currentColor\">STM32<\/text>\n  <text x=\"300\" y=\"140\" font-size=\"11\" fill=\"currentColor\">最小系统<\/text>\n  <rect x=\"40\" y=\"70\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"100\" font-size=\"12\" fill=\"currentColor\">USB<\/text>\n  <text x=\"60\" y=\"118\" font-size=\"10\" fill=\"currentColor\">CH340/CP2102<\/text>\n  <rect x=\"530\" y=\"70\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"560\" y=\"100\" font-size=\"12\" fill=\"currentColor\">LED×4<\/text>\n  <rect x=\"40\" y=\"210\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"240\" font-size=\"12\" fill=\"currentColor\">按键×2<\/text>\n  <rect x=\"270\" y=\"210\" width=\"180\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"300\" y=\"240\" font-size=\"12\" fill=\"currentColor\">排针/扩展<\/text>\n  <rect x=\"530\" y=\"210\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"560\" y=\"240\" font-size=\"12\" fill=\"currentColor\">电源/复位<\/text>\n  <line x1=\"190\" y1=\"100\" x2=\"270\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"450\" y1=\"110\" x2=\"530\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"190\" y1=\"240\" x2=\"270\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"450\" y1=\"240\" x2=\"530\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n#### 18.4.5 USB 转串口：CH340/CP2102 怎么接\n\n开发板常用 USB 转串口，方便下载/打印。\n\n**CH340C**：内置晶振、3.3V/5V 可选、成本低；V3 脚接 3.3V 或 VCC（按型号）；D+/D− 串 22Ω；TX/RX 交叉接 MCU。\n\n**CP2102**：稳定、驱动好、成本高；VBUS 检测/自供电要按手册；D+/D− 串 22Ω。\n\n**电平**：CH340 的 VCC 3.3V 时 IO 3.3V；5V 时 TX 5V，不能直连 3.3V MCU（除非 tolerate）。\n\n**USB 保护**：D+/D− 低电容 ESD（<0.5pF）；VBUS 加 500mA 保险/ESD；差分 90Ω。\n\n**下载电路**：CH340 的 DTR/RTS 经三极管控制 BOOT0/NRST，实现自动下载；手动下载用跳线/按键。\n\n**布局**：USB 座→ESD→串阻→芯片，走线短/差分；晶振（CH340C 内置）靠近；电源去耦。\n\n**常见错误**：D+/D− 反、TX/RX 没交叉、5V TX 直连 3.3V、ESD 电容太大。\n\n#### 18.4.6 排针、电源开关与保护\n\n开发板的排针是“最容易被忽略的电气接口”。\n\n**排针**：2.54mm，电源/地/信号分组；电源脚标丝印；每个电源脚加自恢复保险/限流，防止外接短路。\n\n**电源开关**：拨动/按键，选额定电流；开关后加 TVS/电容；避免“开关抖动导致复位”。\n\n**外部供电**：USB 5V 与外部 5V 不能同时反灌；加二极管/理想二极管；电源选择电路。\n\n**测试点**：3.3V、5V、GND、NRST、BOOT0、UART TX/RX，方便探头/夹子。\n\n**丝印**：引脚功能、极性、电压；丝印不清=用错。\n\n**ESD**：外露排针/接口加 ESD；USB/串口重点。\n\n**机械**：排针/插座高度、间距、定位；装壳不打架。\n\n### 18.5 选型与降额\n\n| 器件 | 选型 | 降额 |\n|---|---|---|\n| LDO | 5V→3.3V/500mA | 结温留 20℃ |\n| 晶振 | 8MHz/CL 匹配 | 精度按串口 |\n| USB 串口 | CH340C/CP2102 | 3.3V/5V 电平 |\n| ESD | USB 低电容 | 钳位 |\n| 排针 | 2.54mm | 电流按引脚 |\n\n#### 18.5.1 LDO 选型：5V→3.3V 怎么算\n\n开发板电源常用 LDO，选型要算压差/功耗/热。\n\n**压差**：`Vdrop=Vin−Vout`；LDO 要大于 dropout（比如 0.3V@500mA）。5V→3.3V 压差 1.7V，够。\n\n**功耗**：`P=(Vin−Vout)×Iout`。5V→3.3V/300mA，`P=1.7×0.3=0.51W`；SOT-23 结温升 `0.51×250≈127℃`，太高；换 SOT-89/DFN 或降低电流。\n\n**热**：`Tj=Ta+P×RθJA`；RθJA 看封装/铜面积。Ta=40℃、RθJA=60℃/W、P=0.51W，`Tj≈71℃`，可接受；RθJA=250 就超。\n\n**电流**：LDO 额定要大于负载峰值；余量 30%；USB 供电 500mA，系统负载要算。\n\n**噪声/PSRR**：ADC/射频要低噪声 LDO；普通数字 3.3V 用通用 LDO。\n\n**保护**：输入加 TVS/保险，输出加 10μF+100nF；反接/过压保护。\n\n**算例**：5V/500mA 输入、3.3V/300mA 输出，LDO 功耗 0.51W；选 SOT-89（RθJA≈100℃/W），`Tj=40+51=91℃`，留 20℃ 余量要降负载/加铜。\n\n### 18.6 测量与仿真\n\n#### 18.6.1 上电检查\n\n1. 测 3.3V、VDDA。\n2. 测 NRST 上电波形。\n3. 测 BOOT0 电平。\n4. 连 SWD，读 ID。\n5. 测晶振起振。\n6. USB 枚举/串口环回。\n\n#### 18.6.2 CircuitJS\n\n```circuitjs\nrc-charge\n```\n\n观察 NRST 上电 RC 波形。\n\n```circuitjs\ngpio-button\n```\n\n观察 BOOT/按键电平。\n\n#### 18.6.3 动手任务\n\n- 画 STM32F103C8T6 最小系统。\n- 给每个 VDD 放 100nF，VDDA 加 RC。\n- 画 SWD 5 针、BOOT0 下拉、NRST RC。\n- 导出网表，检查电源/地网络。\n\n#### 18.6.4 上电波形与首次下载\n\n上电不是“灯亮就行”，要看波形。\n\n**3.3V 上升**：用示波器看上升时间/过冲；过冲大要加电容/调整 LDO；上升太慢可能复位不正常。\n\n**NRST**：上电时低→高，RC 延时 `t≈R×C`；10k×100nF=1ms；电容太大会延迟启动/下载。\n\n**BOOT0**：上电时必须是低（Flash 启动）；跳线/下拉要可靠。\n\n**晶振**：起振时间几 ms；示波器探头电容会影响，用 10× 探头/短地。\n\n**SWD 连接**：先上电再连；读 ID `0x1BA01477`（Cortex-M3）；连不上查 GND/复位/BOOT/时钟。\n\n**首次下载**：SWD 下载/串口 ISP（BOOT0=1）；下载后 BOOT0 回 0，复位运行。\n\n**记录**：上电波形/电流/ID 写进 Bring-Up 记录，后面对比。\n\n#### 18.6.5 最小系统 Bring-Up 记录表\n\n| 步骤 | 测点 | 期望 | 实测 | 结论 |\n|---|---|---|---|---|\n| 1 目视 | 焊点/短路 | 无连锡/虚焊 |  |  |\n| 2 5V | 输入电容 | 5.0V±5% |  |  |\n| 3 3.3V | LDO 输出 | 3.3V±5% |  |  |\n| 4 VDDA | VDDA 脚 | 3.3V±3% |  |  |\n| 5 NRST | NRST | 高，按键低 |  |  |\n| 6 BOOT0 | BOOT0 | 0V |  |  |\n| 7 晶振 | OSC_OUT | 8MHz 起振 |  |  |\n| 8 SWD | SWDIO/CLK | 读 ID 成功 |  |  |\n| 9 串口 | TX | 115200 输出 |  |  |\n| 10 USB | D+/D− | 枚举成功 |  |  |\n\n每步“期望/实测/结论”，不通过就停在这一步查，不要跳步上电。跳步省下的十分钟，往往要用一天来找问题。上电顺序不是形式，是保护芯片和板子的底线；先低压后高压、先控制后功率，这条原则放哪块板都成立。把顺序写进检查表，下一次不用凭记忆。检查表越具体，越不依赖“老师傅手感”；好的团队都有一份自己的检查表，而不是只靠口头传承经验，就这么简单，也这么难，慢慢练出来吧！！！\n\n### 18.7 常见坑\n\n1. **VDDA 不接/不滤波**：ADC 不稳。\n2. **VBAT 悬空**：备份域异常。\n3. **BOOT0 悬空**：启动模式随机。\n4. **NRST 电容太大**：下载/启动失败。\n5. **晶振负载电容错**：不起振/频偏。\n6. **SWD 少 GND**：下载不稳定。\n7. **USB D+/D− 反**：枚举失败。\n8. **去耦电容放远**：电源噪声。\n9. **排针电源脚无保护**：外接短路烧板。\n\n#### 18.7.1 STM32 最小系统 16 项自检\n\n1. 每个 VDD 都有 100nF？\n2. 总 10μF 有没有？\n3. VDDA 是否经磁珠/RC 滤波？\n4. VSSA 是否接？\n5. VBAT 是否接 VDD/电池？\n6. BOOT0 是否 10k 下拉？\n7. BOOT1 是否固定？\n8. NRST 是否 100nF+上拉？\n9. 晶振 CL 是否算？\n10. 晶振是否靠近 MCU/包地？\n11. SWD 五线是否完整？\n12. USB D+/D− 是否串 22Ω/不反？\n13. USB ESD 是否低电容？\n14. 排针电源脚是否有保护？\n15. 未用引脚是否处理？\n16. 封装/引脚号是否核对？\n\n16 项都能在原理图指到，才算画完；指不到的那条，就是打样后最可能出问题的地方。\n\n#### 18.7.2 三个最小系统翻车案例\n\n**案例一：ADC 跳，VDDA 只接了 VDD**。现象：ADC 读数随负载跳。排查：VDDA 无滤波，数字噪声进模拟电源。整改：加磁珠+100nF+1μF，读数稳定。\n\n**案例二：下载一次成功，第二次连不上**。现象：固件把 PA13/PA14 配成 GPIO。排查：SWD 引脚被复用。整改：固件保留 SWD，或加“复位时按住 BOOT0”恢复。\n\n**案例三：USB 枚举失败**。现象：插电脑不识别。排查：D+/D− 反、22Ω 没接、ESD 电容太大、D+ 上拉缺失。整改：按图核对，换低电容 ESD，枚举成功。\n\n**共同点**：都是“少一个器件/错一个电平/复用冲突”，不是芯片坏。按清单逐项核对，比换芯片快；每次翻车后把原因补进清单，下一块板就不会再犯。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 18-5：上电时序与首次下载<\/text>\n  <line x1=\"80\" y1=\"70\" x2=\"660\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"80\" y1=\"70\" x2=\"80\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"74\" font-size=\"11\" fill=\"currentColor\">3.3V<\/text>\n  <path d=\"M80 190 L140 190 L160 120 L660 120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"130\" font-size=\"11\" fill=\"currentColor\">NRST<\/text>\n  <path d=\"M80 220 L660 220\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n  <text x=\"40\" y=\"230\" font-size=\"11\" fill=\"currentColor\">BOOT0<\/text>\n  <line x1=\"160\" y1=\"70\" x2=\"160\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"168\" y=\"90\" font-size=\"10\" fill=\"currentColor\">上电稳定<\/text>\n  <line x1=\"260\" y1=\"70\" x2=\"260\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"268\" y=\"90\" font-size=\"10\" fill=\"currentColor\">释放复位<\/text>\n  <text x=\"40\" y=\"285\" font-size=\"12\" fill=\"currentColor\">3.3V 稳定→NRST 释放→BOOT0=0 从 Flash 启动→SWD 读 ID；BOOT0 必须保持低，不能悬空！！<\/text>\n<\/svg>\n```\n\n### 18.8 本章复盘\n\n#### 18.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 每个 VDD 100nF | 去耦 | 靠近引脚 |\n| VDDA 加 RC/LC | 模拟电源 | 参考干净 |\n| BOOT0 10k 下拉 | 启动 | 固定 Flash |\n| NRST 100nF | 复位 | 按手册 |\n| USB 串联 22Ω | 匹配 | 差分 90Ω |\n\n#### 18.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 最小系统 | minimum system | 让 MCU 能跑的最小电路 |\n| VDDA | analog VDD | 模拟电源 |\n| VBAT | battery backup | 备份域电源 |\n| BOOT | boot mode | 启动模式选择 |\n| SWD | serial wire debug | 两线调试 |\n| 去耦 | decoupling | 就近提供瞬态电流 |\n\n#### 18.8.3 自测 10 题\n\n1. STM32 最小系统七部分？\n2. VDDA 为什么要单独滤波？\n3. VBAT 不用电池怎么接？\n4. BOOT0 悬空会怎样？\n5. NRST 电容太大有什么问题？\n6. 晶振负载电容怎么选？\n7. SWD 需要几根线？\n8. USB D+/D− 接反会怎样？\n9. 去耦电容为什么靠近引脚？\n10. 排针电源脚要加什么保护？\n\n#### 18.8.4 能力清单\n\n- [ ] 能画 STM32F103 最小系统。\n- [ ] 能处理电源/VDDA/VBAT。\n- [ ] 能画晶振/复位/BOOT/SWD。\n- [ ] 能加 USB 转串口和开发板外设。\n- [ ] 能上电检查并连 SWD。\n\n#### 18.8.5 下一章\n\n下一章讲**2 层板布局布线实战**：把 STM32 开发板从原理图变成可制造的 PCB。","taskSignature":"a6004ad6d0068d11f3265294ab4bab2fe11929837f591888c8f4aebfe2527d72","taskCount":5},{"id":"19","title":"第 19 章 · 2 层板布局布线实战","short":"2 层板布局布线实战","stage":3,"diff":4,"prev":"第 18 章 STM32 最小系统与开发板原理图","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 把 STM32 开发板原理图转成 2 层 PCB，并完成布局。\n2. 按“电源→晶振→USB→排针→去耦”的顺序布局。\n3. 在 2 层板上处理地平面不完整、跨分割、回流路径。\n4. 给电源/晶振/USB 差分做专项布线。\n5. 用 DRC、飞线、3D、丝印检查把问题清零。\n6. 输出 Gerber、钻孔、坐标、BOM 并自检。\n7. 说出至少 8 个 2 层板实战常见坑。\n\n2 层板没有完整地平面，所有“参考平面”都要靠铺铜和走线补。布局布线不是“连通就行”，是“让回流最短”。\n\n## 正文\n\n### 19.1 它解决什么问题：三个真实场景\n\n#### 场景一：地平面被排针切碎，USB 丢包\n\n2 层板底层铺铜做地，但排针/走线把地切成几块，USB 差分跨过分割，回流绕远。USB 低速能枚举，高速丢包。\n\n#### 场景二：晶振走线在顶层绕远，时钟受干扰\n\n晶振放在板边，走线 20mm 到 MCU，旁边是排针。时钟上叠噪声，MCU 偶尔跑飞。晶振必须靠近、包地、下方不走线。\n\n#### 场景三：电源线太细，开发板插 USB 就掉压\n\nUSB 5V 进板，走 10mil 线到 LDO，电流 500mA 时压降/发热。电源线要短粗，USB 入口加电容。\n\n### 19.2 它是什么：2 层板的“地”是设计出来的\n\n2 层板常见叠层：\n\n- 顶层：器件 + 信号 + 局部铺铜\n- 底层：地平面（尽量完整）+ 少量信号\n\n关键：**底层地平面要连续**。如果底层必须走线，走线不要横切关键信号（USB/晶振/复位）下方；被切开的地方用地过孔/跳线补。\n\n> **术语第一次出现**：跨分割（split crossing）指信号线跨越地/电源平面的缝隙，回流被迫绕行，形成环路天线。2 层板要尽量避免关键信号跨分割。\n\n#### 19.2.1 叠层与铜厚：2 层板只有两个自由度\n\n2 层板的叠层选项比 4 层少得多，能调的只有板厚、铜厚、表面处理。\n\n**板厚**：1.6mm 最通用（结构/连接器/成本）；1.0mm 用于薄型/卡类；0.8mm 以下要确认板厂能力。\n\n**铜厚**：1oz（35μm）常规；2oz 载流/散热好，但最小线宽/间距变差（蚀刻侧壁），成本上升。\n\n**表面处理**：HASL（有铅/无铅）便宜、可焊性好、平整度差；ENIG 平整、适合细间距/BGA、成本高；OSP 便宜但存储期短。\n\n**介质**：FR-4 常规；高频（>GHz）才考虑 Rogers，2 层板基本用不到。\n\n**阻焊/丝印**：阻焊颜色不影响电气；丝印白色最常用，注意字符最小线宽。\n\n**选择原则**：先满足结构/成本，再谈电气；2 层板不要为了“看起来专业”选 2oz/ENIG，除非真有细间距/大电流。\n\n**算例**：1oz、20mil 线宽、10℃ 温升，载流约 1.9A；2oz 同宽度约 3.4A（截面积翻倍，`I∝A^0.725`）。\n\n#### 19.2.2 什么时候必须从 2 层升到 4 层\n\n2 层板不是“永远够用”，以下情况要考虑 4 层：\n\n**有高速差分/总线**：USB HS、HDMI、MIPI、DDR、千兆以太网；需要连续参考平面。\n\n**BGA/细间距**：0.5mm 以下 pitch、BGA 逃线；2 层板扇出困难。\n\n**电源多/电流大**：多路 DCDC、大电流；需要完整电源平面/地平面。\n\n**EMC 严苛**：要过辐射/传导测试；4 层板地平面屏蔽更好。\n\n**板面积小/器件密**：2 层板布线密度不够，飞线清不完。\n\n**成本权衡**：4 层板单价约 2 层 1.5～2.5 倍，但面积/层数/调试成本可能更省；量产看总成本。\n\n**折中**：2 层板 + 关键区域局部 4 层（刚挠/混压）成本高，不如整板 4 层。\n\n**课程顺序**：先用 2 层板把“布局/回流/DRC”练明白，再上 4 层；层数不是水平，理解回流才是。\n\n#### 19.2.3 从原理图到 PCB 的八步\n\n**第一步：原理图定稿**。ERC 清零、封装齐全、网络命名清晰、电源/地符号正确。\n\n**第二步：网表/封装核对**。每个器件有封装；引脚号/极性；NC 标注；DNP 标注。\n\n**第三步：板框/结构**。按外壳画板框、定位孔、连接器位置；3D 模型确认。\n\n**第四步：分区布局**。电源/ MCU/晶振/USB/排针/按键；飞线最短。\n\n**第五步：电源/地规划**。电源线宽、地通道、过孔；底层地连续。\n\n**第六步：布线**。先难后易：晶振/差分/电源→普通信号→铺铜。\n\n**第七步：DRC/检查**。间距/线宽/飞线/丝印/3D。\n\n**第八步：出生产文件**。Gerber/钻孔/坐标/BOM/钢网；打包/自检。\n\n**顺序不能跳**：原理图错→PCB 白做；封装错→焊不上；板框错→装不进。\n\n#### 19.2.4 网表与封装核对：最便宜的一次检查\n\n**封装**：电阻/电容 0603/0805；二极管 SMA/SOD；连接器按实物；MCU LQFP48。\n\n**引脚号**：原理图符号引脚号要和封装一致；1 脚方向；双排/多排连接器。\n\n**极性**：二极管/TVS/电解电容/LED；封装丝印/焊盘形状。\n\n**NC/DNP**：不焊的器件标注；BOM 一致；避免“多焊/漏焊”。\n\n**网络**：电源/地网络名；差分对命名；总线命名。\n\n**核对方法**：原理图→PCB 对比（飞线）；封装 3D；打印 1:1 对比实物。\n\n**错误代价**：封装错要飞线/改板；引脚错要割线；极性错会烧。\n\n**课程**：这一步花 30 分钟，能省一次打样。\n\n#### 19.2.5 2 层板常用叠层方案对比\n\n| 方案 | 板厚 | 铜厚 | 表面处理 | 适用 | 注意 |\n|---|---|---|---|---|---|\n| 经济型 | 1.6mm | 1oz | HASL | 开发板/打样 | 平整度一般 |\n| 常规型 | 1.6mm | 1oz | 无铅 HASL | 大多数 | 环保 |\n| 细间距 | 1.6mm | 1oz | ENIG | QFN/细间距 | 成本高 |\n| 大电流 | 1.6mm | 2oz | HASL/ENIG | 电源/电机 | 线宽间距放大 |\n| 薄型 | 1.0/1.2mm | 1oz | ENIG | 卡类/薄壳 | 结构强度 |\n| 高频 | 1.6mm | 1oz | ENIG | >GHz | 需专用材料 |\n\n**选择**：先按结构/成本定板厚，再按器件/电流定铜厚/表面处理。\n\n**打样**：同一叠层多打几块；不同叠层不要混在一批。\n\n**记录**：叠层写进 README/生产说明；下次改板能对上。\n### 19.3 关键参数与规则\n\n| 项目 | 2 层开发板建议 | 说明 |\n|---|---|---|\n| 板厚 | 1.6mm | 常规 |\n| 铜厚 | 1oz | 常规 |\n| 最小线宽 | 6mil | 板厂 |\n| 电源线 | 20～40mil | 按电流 |\n| 过孔 | 0.3/0.6mm | 常规 |\n| 晶振包地 | 是 | 地过孔包围 |\n| USB 差分 | 90Ω，等长 | 尽量短 |\n| 铺铜 | 底层完整地 | 多打过孔 |\n| 丝印 | 不压焊盘 | 字高 1mm |\n\n#### 19.3.1 线宽与载流：把电流算成宽度\n\n**公式**（IPC-2221 近似，外层）：`I = k·ΔT^0.44·A^0.725`，A 为截面积（mil²），k 外层≈0.048、内层≈0.024。\n\n**反算宽度**：`W = A/(t)`，t 为铜厚（1oz≈1.37mil）。\n\n**算例**：2A、允许 10℃ 温升、1oz 外层：`A=(I/k/ΔT^0.44)^(1/0.725)`≈`(2/0.048/2.75)^1.379`≈ 30.4mil² → `W≈30.4/1.37≈22mil`（约 0.56mm）。\n\n**经验值**：信号 6～10mil；电源 20～40mil；大电流 60mil 以上或铺铜；GND 尽量整片。\n\n**压降校验**：`Vdrop=I·ρ·L/(W·t)`；1A、50mm、20mil、1oz 约 0.05V，可接受；大电流要算。\n\n**温度**：宽线/铺铜/过孔/铜厚都能降温度；不要“线宽够但过孔不够”。\n\n**注意**：公式是近似，实际按板厂工艺/散热/环境留 30% 余量；高可靠场景按 IPC 更严标准。\n\n#### 19.3.2 过孔载流与工艺：小孔不是“随便打”\n\n**载流**：0.3mm 孔径、1oz 镀铜，约 1～1.5A（温升 10℃）；大电流用多孔并联/大孔/铜浆。\n\n**工艺**：孔径/环宽/孔距按板厂；0.3/0.6mm 最通用；0.2mm 以下成本高。\n\n**过孔类型**：通孔（最便宜）、盲埋孔（4 层以上）、盘中孔（需树脂塞孔）。\n\n**地过孔**：晶振/去耦/连接器/屏蔽罩周围多打；缝合间距 <λ/20（经验 1/10 波长）。\n\n**回流过孔**：高速信号换层时，旁边放地过孔，给回流“换层”。\n\n**热过孔**：QFN EP/功率器件下方阵列，孔径 0.3mm、间距 1.0～1.2mm。\n\n**错误**：过孔打在焊盘上（漏锡）、过孔太靠板边（破孔）、过孔太少（地不连续）。\n\n**检查**：DRC 过孔间距/环宽；Gerber 钻孔表核对孔径/数量。\n\n#### 19.3.3 间距、安规与爬电距离\n\n**电气间距**：按电压/污染等级/涂层；低压（<50V）常规 6～8mil；高压要查表。\n\n**爬电距离**：沿绝缘表面；高压/潮湿环境要加；开槽/涂覆可增加。\n\n**安规**：AC 市电/隔离；强弱电间距、Y 电容、保险、接地；2 层板做市电要非常谨慎。\n\n**工艺间距**：板厂最小 6/6mil（1oz）；2oz 要放大；细间距器件按封装。\n\n**阻焊桥**：细间距引脚间阻焊桥宽度；太窄会连锡。\n\n**铜到板边**：≥0.5mm（铣刀/公差）；拼板 V-cut 要留余量。\n\n**丝印到焊盘**：≥0.15mm；否则上锡/识别受影响。\n\n**原则**：先满足安规/工艺，再谈“布得下”；布不下就升层/改封装，不要硬压间距。\n\n#### 19.3.4 阻抗与差分：2 层板也能做，但窗口窄\n\n**微带线阻抗**：`Z0≈87/√(εr+1.41)·ln(5.98h/(0.8w+t))`；h 为介质厚度，w 线宽，t 铜厚。\n\n**2 层板问题**：介质厚（1.6mm），50Ω 线宽会很宽（约 3mm），差分 90Ω 更难；通常靠“短+包地”而不是精确阻抗。\n\n**USB 低速/全速**：阻抗要求宽松，等长/同层/连续地更重要；高速才需要严格 90Ω。\n\n**差分三原则**：等长（±5mil 内）、等距、同层；换层要一起换，旁边加地过孔。\n\n**共模/差模**：差分对远离电源/时钟；包地不要“切断”差分。\n\n**终端**：USB 通常不需要外加终端；RS485/CAN 需要终端电阻。\n\n**测量**：TDR 才能测阻抗；课程条件不足时，按参考设计/板厂叠层算。\n\n**结论**：2 层板做 USB 全速可以，做 HS 要谨慎；先把“短、直、连续地”做到。\n\n#### 19.3.5 2 层板工艺能力表（下单前确认）\n\n| 项目 | 常见能力 | 备注 |\n|---|---|---|\n| 最小线宽/间距 | 6/6mil | 更细加价 |\n| 最小孔径 | 0.3mm | 0.2mm 加价 |\n| 板厚 | 0.8～2.0mm | 特殊确认 |\n| 铜厚 | 1/2oz | 2oz 加价 |\n| 最大尺寸 | 按板厂 | 拼板注意 |\n| 阻焊颜色 | 绿/黑/蓝/红/白 | 白色难做 |\n| 表面处理 | HASL/ENIG/OSP | ENIG 加价 |\n| 外形公差 | ±0.1～0.15mm | 结构留余量 |\n| V-cut 角度 | 30/45/60° | 余量 |\n| 阻抗控制 | 可选 | 2 层难 |\n\n**用法**：设计规则按“常见能力”设；要超能力先问板厂，不要“设计了再说”。\n\n**打样**：同一设计多问几家；交期/价格/工艺差异大。\n\n**量产**：工艺能力/一致性/不良率比单价更重要。\n\n#### 19.3.6 线宽经验表（1oz、10℃）\n\n| 电流 | 线宽（外层） | 备注 |\n|---|---|---|\n| <0.5A | 10mil | 信号 |\n| 1A | 15mil | 电源 |\n| 2A | 22mil | 电源 |\n| 3A | 30mil | 或铺铜 |\n| 5A | 45mil+ | 多过孔/铺铜 |\n| >5A | 铺铜/端子 | 不要只靠线 |\n\n**用法**：先按表估，再用公式核；大电流/高温/密闭要加余量。\n\n**注意**：过孔/连接器/保险可能是瓶颈；线宽够不代表整条路径够。\n### 19.4 三个典型布局\n\n#### 19.4.1 整板分区\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 19-1：STM32 开发板 2 层布局分区<\/text>\n  <rect x=\"40\" y=\"60\" width=\"640\" height=\"240\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"55\" y=\"75\" width=\"150\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"70\" y=\"105\" font-size=\"12\" fill=\"currentColor\">USB/电源入口<\/text>\n  <text x=\"65\" y=\"125\" font-size=\"10\" fill=\"currentColor\">ESD/电容/LDO<\/text>\n  <rect x=\"230\" y=\"75\" width=\"200\" height=\"110\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"105\" font-size=\"12\" fill=\"currentColor\">MCU<\/text>\n  <text x=\"250\" y=\"125\" font-size=\"10\" fill=\"currentColor\">晶振/SWD/去耦<\/text>\n  <rect x=\"455\" y=\"75\" width=\"210\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"500\" y=\"105\" font-size=\"12\" fill=\"currentColor\">排针/扩展<\/text>\n  <rect x=\"55\" y=\"180\" width=\"180\" height=\"100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"70\" y=\"210\" font-size=\"12\" fill=\"currentColor\">按键/LED<\/text>\n  <rect x=\"260\" y=\"205\" width=\"170\" height=\"75\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"285\" y=\"235\" font-size=\"12\" fill=\"currentColor\">USB 差分<\/text>\n  <text x=\"275\" y=\"255\" font-size=\"10\" fill=\"currentColor\">短、等长、同层<\/text>\n  <rect x=\"455\" y=\"180\" width=\"210\" height=\"100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"500\" y=\"215\" font-size=\"12\" fill=\"currentColor\">底层地平面<\/text>\n  <text x=\"480\" y=\"240\" font-size=\"10\" fill=\"currentColor\">连续、多过孔<\/text>\n<\/svg>\n```\n\n#### 19.4.2 晶振包地\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 19-2：晶振包地：地过孔围一圈<\/text>\n  <rect x=\"220\" y=\"70\" width=\"140\" height=\"100\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"260\" y=\"110\" font-size=\"13\" fill=\"currentColor\">MCU<\/text>\n  <rect x=\"420\" y=\"85\" width=\"80\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"435\" y=\"120\" font-size=\"11\" fill=\"currentColor\">Y1<\/text>\n  <line x1=\"360\" y1=\"115\" x2=\"420\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"145\" x2=\"420\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <circle cx=\"410\" cy=\"85\" r=\"4\" fill=\"currentColor\"/>\n  <circle cx=\"500\" cy=\"85\" r=\"4\" fill=\"currentColor\"/>\n  <circle cx=\"410\" cy=\"155\" r=\"4\" fill=\"currentColor\"/>\n  <circle cx=\"500\" cy=\"155\" r=\"4\" fill=\"currentColor\"/>\n  <text x=\"220\" y=\"220\" font-size=\"13\" fill=\"currentColor\">晶振下方铺地，四周地过孔；走线不跨出包地区。<\/text>\n<\/svg>\n```\n\n#### 19.4.3 USB 差分与电源\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 19-3：USB 差分与电源走线<\/text>\n  <rect x=\"50\" y=\"80\" width=\"100\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"70\" y=\"110\" font-size=\"12\" fill=\"currentColor\">USB 座<\/text>\n  <line x1=\"150\" y1=\"110\" x2=\"280\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"135\" x2=\"280\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"200\" y=\"100\" font-size=\"11\" fill=\"currentColor\">D+<\/text>\n  <text x=\"200\" y=\"155\" font-size=\"11\" fill=\"currentColor\">D−<\/text>\n  <rect x=\"280\" y=\"80\" width=\"120\" height=\"90\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"120\" font-size=\"12\" fill=\"currentColor\">MCU<\/text>\n  <line x1=\"150\" y1=\"160\" x2=\"280\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"4\"/>\n  <text x=\"180\" y=\"180\" font-size=\"11\" fill=\"currentColor\">5V 电源粗线<\/text>\n  <text x=\"430\" y=\"110\" font-size=\"13\" fill=\"currentColor\">差分等长、等距、同层；<\/text>\n  <text x=\"430\" y=\"135\" font-size=\"13\" fill=\"currentColor\">下方地连续，不跨分割。<\/text>\n  <text x=\"430\" y=\"175\" font-size=\"13\" fill=\"currentColor\">电源短粗，入口加 10μF+100nF。<\/text>\n<\/svg>\n```\n\n#### 19.4.4 去耦电容：位置比容值更重要\n\n**原理**：电容给瞬态电流提供“本地水库”，降低电源阻抗；离得远，走线电感就把效果吃掉。\n\n**位置**：100nF 放引脚旁（<2mm），10μF 放电源入口/区域；大电容靠近电源，小电容靠近引脚。\n\n**数量**：每个电源脚一个 100nF；每路电源 1～2 个 10μF；不要“一个 10μF 管全部”。\n\n**过孔**：电容焊盘到地/电源用过孔，缩短回路；过孔不要打在焊盘上（漏锡）。\n\n**布局**：电容和引脚在同一面最好；双面布局时过孔要短。\n\n**错误**：电容在板边、走线长、多个引脚共用一个电容、只放大电容。\n\n**验证**：示波器测电源纹波/瞬态；去耦差表现为噪声大/复位不稳。\n\n#### 19.4.5 排针、连接器与结构干涉\n\n**排针**：2.54mm 标准；每脚载流 ≤1A；电源/地多脚并联；排针旁边留走线空间。\n\n**连接器**：USB/DC/端子；按结构位置放，先定连接器再布局；插拔方向留手指空间。\n\n**结构**：板框/定位孔/螺丝孔；孔到铜/器件距离；螺母/铜柱高度。\n\n**干涉**：3D 检查器件高度/连接器/外壳；排针旁边的器件不要太高。\n\n**丝印**：连接器方向/引脚 1/电压；插错会烧。\n\n**固定**：连接器加定位/焊盘加固；频繁插拔的加螺丝/卡扣。\n\n**课程**：先画板框和连接器，再放 MCU；不要“布完再塞连接器”。\n\n#### 19.4.6 按键、LED 与丝印：人机界面也是布局\n\n**按键**：放在手指容易按的位置；远离高压/发热；加 RC/软件去抖；ESD 保护。\n\n**LED**：指示电源/状态/通信；亮度/角度；限流电阻靠近 LED；颜色含义写丝印。\n\n**丝印**：板名/版本/日期/作者；接口定义；测试点；警告（高压/极性）。\n\n**字符**：字高 ≥1mm，线宽 ≥0.15mm；不压焊盘/过孔；方向统一（从左/从下读）。\n\n**标识**：1 脚/极性/连接器方向；保险/TVS 位置。\n\n**美观**：丝印不是装饰，是“给装配/维修的人看的说明书”。\n\n**检查**：3D/实物对比；丝印被器件挡住要挪。\n\n#### 19.4.7 LQFP48 扇出与引脚分配\n\n**扇出**：0.5mm pitch，引脚间走 6mil 线；外层扇出优先，必要时过孔到内层（2 层板只能底层）。\n\n**电源/地**：VDD 多脚并联，每个脚去耦；VSS 连地平面。\n\n**晶振**：OSC_IN/OUT 相邻，走线短；包地；下方不走线。\n\n**SWD**：SWDIO/SWCLK 引出排针/测试点；靠近 MCU。\n\n**BOOT0**：下拉电阻；测试点/跳线。\n\n**USB**：PA11/PA12 相邻，差分走线短；ESD 靠近座子。\n\n**排针**：按功能分组（电源/地/模拟/数字）；电源多脚。\n\n**原则**：先定“必须就近”的（晶振/去耦/SWD），再排普通 IO。\n\n#### 19.4.8 USB Type-C 的 CC、ESD 与电源\n\n**Type-C 座**：CC1/CC2 各 5.1kΩ 下拉（UFP/受电）；VBUS/GND 多脚；D+/D- 差分。\n\n**ESD**：靠近连接器放 TVS（低电容）；VBUS 加 TVS/保险；D+/D- 加低电容 ESD。\n\n**电源**：VBUS 入口 10μF+100nF；LDO/DCDC 输入；反接/过压保护。\n\n**差分**：D+/D- 短、等长、同层；下方地连续；不要跨分割。\n\n**外壳**：Type-C 外壳地/屏蔽；ESD 路径。\n\n**错误**：CC 不接（不能识别）；ESD 放远；VBUS 线细；差分绕远。\n\n**课程**：用 Type-C 做供电/串口时，CC 电阻和 ESD 是必查项。\n\n#### 19.4.9 SWD、BOOT 与复位接口的布局\n\n**SWD**：SWDIO/SWCLK/GND/NRST/3.3V 五线；排针/测试点；靠近 MCU；走线短。\n\n**BOOT0**：下拉 10kΩ；跳线/测试点；上电必须低。\n\n**NRST**：100nF 到地；按键；测试点；远离干扰。\n\n**串口**：TX/RX/GND；排针；交叉；电平匹配。\n\n**测试点**：3.3V/5V/GND/NRST/BOOT0/UART/SWD；直径 1mm。\n\n**布局**：接口放板边；ESD 靠近接口；地过孔多。\n\n**错误**：SWD 少地/长线；BOOT0 悬空；NRST 电容太大；串口不共地。\n\n**课程**：调试接口是“救命的”，布局时优先留位置。\n\n#### 19.4.10 晶振负载电容与布局的配合\n\n**负载电容**：`CL = C1·C2/(C1+C2) + Cstray`；对称取 `C1=C2≈2(CL−Cstray)`。\n\n**算例**：CL=10pF、Cstray≈4pF → `C1=C2≈12pF`；取 12pF/10pF 常见。\n\n**布局**：晶振靠近 MCU（<10mm）；走线短/等长；下方不走线；包地过孔。\n\n**电容**：C1/C2 靠近晶振；地端就近打过孔；不要用长走线。\n\n**串联电阻**：必要时加 `Rs`（抑制过驱），按芯片手册；不是所有晶振都加。\n\n**测量**：探头 10×/短地；探头电容会让频率偏/停振；看起振时间/幅度。\n\n**错误**：负载电容选错→频偏/不起振；晶振走线长→EMI/受扰。\n\n#### 19.4.11 功能块的地边界怎么划\n\n**原则**：按“回流路径”划，不是按“原理图页”划。\n\n**功率地**：输入电容/电感/开关/MOS/输出电容围成最小环路；功率地只在一点连信号地。\n\n**模拟地**：ADC/运放/传感器；远离开关/数字；必要时单点汇合。\n\n**数字地**：MCU/通信/晶振；晶振地就近。\n\n**接口地**：连接器/ESD/屏蔽；ESD 泄放路径到地。\n\n**2 层板现实**：没有完整平面，“划地”要谨慎；先保证地连续，再谈分割。\n\n**验证**：地阻抗/噪声；分割错会比不分割更差。\n\n#### 19.4.12 飞线体检：布局好坏的“体温计”\n\n**看长度**：飞线总长/最长的几条；太长说明器件放远。\n\n**看交叉**：交叉多说明分区乱；同一功能块内应尽量少交叉。\n\n**看方向**：电源从入口到负载、信号从源到负载；逆向说明放反。\n\n**看热点**：某器件飞线特别密，说明它被围在中间/位置不对。\n\n**看地/电源**：电源/地飞线是否分散；地是否被切断。\n\n**方法**：布局后隐藏布线，只看飞线；反复挪，直到“最长飞线可接受、交叉明显减少”。\n\n**标准**：不是“飞线为 0”（那是布线后），是“飞线结构合理”。\n### 19.5 选型与降额\n\n| 项目 | 选择 | 降额 |\n|---|---|---|\n| 排针 | 2.54mm | 每脚 ≤1A |\n| USB 座 | Type-C/Micro | 5V/2A |\n| LDO | 3.3V/500mA | 结温 |\n| 晶振 | 8MHz/3225 | CL 匹配 |\n| 过孔 | 0.3/0.6mm | 载流 |\n\n#### 19.5.1 器件选型与封装：先确认“买得到、焊得上”\n\n**封装**：0603/0805 手焊友好；0402 密度高但难焊；QFP 比 QFN 好焊/好测。\n\n**货源**：常用阻容/连接器选通用型号；MCU/电源芯片确认库存/替代。\n\n**参数**：电压/电流/精度/温度；降额 50%～80%；不要“刚好够”。\n\n**成本**：不要为省几分钱选冷门封装；打样/返修成本更高。\n\n**可焊性**：MSL 等级/存储；BGA/QFN 要烘烤/控制湿度。\n\n**替代**：Pin-to-pin 替代/参数兼容；BOM 里标注。\n\n**课程**：先用“好焊、好买、好测”的器件把板子做出来，再谈小型化。\n\n#### 19.5.2 连接器、结构与外壳的配合\n\n**先结构后电气**：外壳/安装位置定了，再定连接器/板框；反了就要改板。\n\n**板框**：按外壳内腔留 0.5～1mm 间隙；定位孔/螺丝孔按结构图。\n\n**连接器高度**：插头/线缆要能进外壳；卧式/立式按空间。\n\n**操作空间**：按键/拨码/卡座要能操作；不要被线挡住。\n\n**散热**：发热器件靠近外壳/开孔；不要贴塑料。\n\n**装配顺序**：先装什么后装什么；维修可拆。\n\n**验证**：3D 打印外壳/纸模型；实物装配一次。\n\n#### 19.5.3 可制造性与成本：设计决定 70% 的成本\n\n**层数/面积**：面积越大越贵；拼板提高利用率。\n\n**线宽/间距**：越细越贵；6/6mil 是常见低价档。\n\n**过孔**：孔径/数量；激光孔/盲埋孔贵。\n\n**表面处理**：HASL 最便宜；ENIG 加钱。\n\n**拼板**：V-cut/邮票孔；工艺边 ≥5mm；夹持区。\n\n**测试**：测试点/治具；ICT 增加成本但降不良。\n\n**BOM**：通用料/替代料；MOQ/交期。\n\n**原则**：设计阶段就把“好不好做/好不好测/好不好修”想清楚；后面改板最贵。\n\n#### 19.5.4 排针与接口引脚规划表\n\n| 排针 | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| P1 | 3.3V | GND | PA9/TX | PA10/RX | SWDIO | SWCLK |\n| P2 | 5V | GND | PB6 | PB7 | PA0 | PA1 |\n| P3 | GND | NRST | BOOT0 | 3.3V | PA11/D− | PA12/D+ |\n\n**原则**：电源/地放在两端；相邻信号不打架；差分相邻；调试口集中。\n\n**载流**：每脚 ≤1A；电源/地多脚并联；大电流用端子。\n\n**防插反**：丝印标 1 脚；连接器加方向；关键接口用防呆座。\n\n**可测**：关键信号引测试点；排针可插杜邦线。\n\n**文档**：引脚表写进原理图/README；丝印标功能。\n\n#### 19.5.5 极性与方向核对表\n\n| 器件 | 极性/方向 | 核对方法 |\n|---|---|---|\n| 二极管 | 阴极（丝印横线） | 封装丝印/万用表 |\n| TVS | 单向/双向 | 型号/丝印 |\n| 电解电容 | 正极 | 丝印/焊盘 |\n| LED | 阳极/阴极 | 封装/丝印 |\n| MCU | 1 脚 | 圆点/缺角 |\n| 连接器 | 1 脚/方向 | 丝印/实物 |\n| 排针 | 1 脚 | 丝印方块 |\n| QFN | 1 脚/EP | 圆点/焊盘 |\n\n**原则**：每个有极性的器件都要在丝印/封装上能看出来；不能靠“记忆”。\n\n**装配**：首件确认极性；批量 AOI/目视。\n\n**返修**：拆之前拍照；装回去按丝印。\n\n#### 19.5.6 2 层板成本估算（打样/小批）\n\n**打样**：5 片 100×100mm、1.6mm、1oz、HASL，约几十到一两百元（含工程费）；ENIG/小尺寸/加急加价。\n\n**贴片**：按点数/焊盘数；钢网/首件/工程费；小批量单价高。\n\n**物料**：BOM 成本 + 采购/物流；连接器/芯片占大头。\n\n**拼板**：面积利用率提高，单价下降；但分板/治具增加。\n\n**返修**：一次改板 = 打样+贴片+时间；设计阶段多检查最省钱。\n\n**算例**：100×100mm 板，拼 4 块在 200×200 拼板，材料利用率提高；单价按面积算，拼板摊薄工程费。\n\n**原则**：成本不是“单价最低”，是“打样+贴片+返修+时间”的总成本。\n\n#### 19.5.7 BOM、替代料与采购风险\n\n**BOM 字段**：位号/型号/封装/数量/电压/精度/替代/供应商。\n\n**替代**：参数兼容、封装兼容、Pin-to-pin；标注“可替代/不可替代”。\n\n**采购**：库存/交期/MOQ；停产物料提前找替代。\n\n**风险**：单一来源、冷门封装、长交期芯片；BOM 里标风险等级。\n\n**成本**：通用料优先；不要为“可能更好”选贵料。\n\n**课程**：设计时就想“买不买得到”；打样前核对 BOM 两次。\n### 19.6 测量与仿真\n\n#### 19.6.1 DRC 与检查\n\n1. DRC 清零：间距/线宽/过孔/丝印。\n2. 飞线为 0。\n3. 底层地平面连续性检查：有没有被长线切断。\n4. 3D 检查：USB/排针/器件干涉。\n5. Gerber 预览：阻焊/丝印/钻孔。\n\n#### 19.6.2 CircuitJS\n\n```circuitjs\nrc-lowpass-159\n```\n\n观察 USB/信号线上的 RC 效应，理解走线电容/电感。\n\n```circuitjs\npower-buck\n```\n\n观察电源入口电容对纹波的影响。\n\n#### 19.6.3 动手任务\n\n- 完成 STM32 开发板 2 层布局。\n- 给晶振包地，给 USB 差分等长。\n- 底层铺地，多打过孔。\n- 出 Gerber 并在 Gerber 查看器里逐层检查。\n\n#### 19.6.4 Gerber、钻孔、坐标与钢网\n\n**Gerber**：顶层/底层铜、阻焊、丝印、外形（Outline）、钻孔表；RS-274X 格式；单位/精度一致。\n\n**钻孔**：孔径/数量/镀铜；槽孔（Slot）单独；钻孔表与 Gerber 对得上。\n\n**坐标**：SMT 贴片坐标（Pick&Place）；原点/旋转/封装名；和 BOM 对应。\n\n**BOM**：位号/型号/封装/数量；DNP 标注；替代料。\n\n**钢网**：开口/厚度；细间距/EP 开口；拼板钢网。\n\n**打包**：一个 zip，命名版本/日期；README 说明层/工艺。\n\n**检查**：用 Gerber 查看器逐层开关；和 PCB 软件对比；让板厂工程确认。\n\n**错误**：少外形层、钻孔与 Gerber 不符、坐标原点错、镜像底层丝印。\n\n#### 19.6.5 拼板、工艺边与 V-cut\n\n**为什么拼板**：提高贴片效率/降低单价；小批量也常拼。\n\n**方式**：V-cut（直线、成本低、留 0.3～0.5mm）、邮票孔（异形/无直边）、桥接。\n\n**工艺边**：≥5mm，放 Mark 点/定位孔；不要放器件。\n\n**Mark 点**：对角 2～3 个，直径 1～1.5mm，周围留空旷区。\n\n**间距**：板与板 2～5mm；V-cut 余量；铣槽宽度。\n\n**应力**：拼板方向/器件方向；避免变形；大板少拼。\n\n**分板**：V-cut 用分板机；邮票孔用手掰/铣；避免损伤器件。\n\n**课程**：打样可不拼；但要知道拼板/工艺边/Mark 是量产必备。\n\n#### 19.6.6 打样、SMT 与收货检查\n\n**打样**：选板厂（工艺/交期/价格）；上传 Gerber+钻孔+说明；确认叠层/表面处理/颜色。\n\n**SMT**：提供 BOM/坐标/Gerber；确认物料替代；首件确认（AOI/目视）。\n\n**收货**：外观/板厚/铜厚/阻焊/丝印；抽测通断；关键尺寸。\n\n**首件**：焊接质量/极性/偏移；功能测试；记录。\n\n**问题反馈**：拍照/标注；板厂/贴片厂责任区分。\n\n**课程**：打样不是“下单就完”，要会看工艺能力/收货检查。\n\n#### 19.6.7 地平面被切断后的三种补救\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 19-4：底层地被切断的补救（加过孔/桥接/改层）<\/text>\n  <rect x=\"40\" y=\"60\" width=\"280\" height=\"150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"80\" font-size=\"11\" fill=\"currentColor\">底层地平面（被长线切开）<\/text>\n  <line x1=\"60\" y1=\"120\" x2=\"300\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"120\" y=\"112\" font-size=\"10\" fill=\"currentColor\">长信号线<\/text>\n  <line x1=\"60\" y1=\"150\" x2=\"300\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <text x=\"120\" y=\"170\" font-size=\"10\" fill=\"currentColor\">地缝<\/text>\n  <rect x=\"400\" y=\"60\" width=\"280\" height=\"150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"410\" y=\"80\" font-size=\"11\" fill=\"currentColor\">补救：缝两侧加地过孔 + 桥接<\/text>\n  <line x1=\"420\" y1=\"120\" x2=\"660\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <line x1=\"420\" y1=\"150\" x2=\"660\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"4\"/>\n  <circle cx=\"500\" cy=\"135\" r=\"4\" fill=\"currentColor\"/>\n  <circle cx=\"560\" cy=\"135\" r=\"4\" fill=\"currentColor\"/>\n  <text x=\"410\" y=\"190\" font-size=\"10\" fill=\"currentColor\">桥接铜/0Ω；关键信号改走顶层<\/text>\n  <text x=\"40\" y=\"250\" font-size=\"12\" fill=\"currentColor\">原则：关键信号下方不要有缝；缝两侧必须有地过孔，给回流一条“桥”。<\/text>\n<\/svg>\n```\n\n三种办法按代价排序：① 把长线改到顶层，底层恢复连续；② 缝两侧加地过孔/铺铜桥接；③ 关键信号改层/加电容。能从布局解决就不要靠“补”。\n\n**过孔位置**：缝两端、信号换层处、连接器地脚旁；间距 2～5mm。\n\n**验证**：地连续性用万用表；高速信号看眼图/误码；没有仪器就看“是否偶发丢包”。\n\n**注意**：桥接铜要与两侧地充分重叠，不要只搭一根细线。\n\n#### 19.6.8 布线顺序与检查的流程图\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 19-5：2 层板从布局到出板的流程<\/text>\n  <rect x=\"40\" y=\"60\" width=\"130\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"86\" font-size=\"10\" fill=\"currentColor\">板框/连接器<\/text>\n  <rect x=\"200\" y=\"60\" width=\"130\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"215\" y=\"86\" font-size=\"10\" fill=\"currentColor\">分区布局<\/text>\n  <rect x=\"360\" y=\"60\" width=\"130\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"375\" y=\"86\" font-size=\"10\" fill=\"currentColor\">电源/地规划<\/text>\n  <rect x=\"520\" y=\"60\" width=\"150\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"535\" y=\"86\" font-size=\"10\" fill=\"currentColor\">晶振/差分/电源<\/text>\n  <rect x=\"520\" y=\"140\" width=\"150\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"535\" y=\"166\" font-size=\"10\" fill=\"currentColor\">普通信号<\/text>\n  <rect x=\"360\" y=\"140\" width=\"130\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"375\" y=\"166\" font-size=\"10\" fill=\"currentColor\">铺铜/缝合<\/text>\n  <rect x=\"200\" y=\"140\" width=\"130\" height=\"42\" rx=\"5\" fill=\"
