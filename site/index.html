过的模块套路，九成电路都是老面孔。\n5. **网络标号追踪**：同名网络（Net Label）在图上是连通的；全局网络（如 VCC/GND）跨页相连。顺着标号\"跳页\"追信号，不要被分页吓住。\n6. **看细节做批注**：去耦有没有、防护有没有、测试点有没有、没用的引脚（NC/DNU）处理是否合规；边看边在图上做笔记，形成你自己的问题清单。\n\n**经验心法**：80% 的时间花在电源树和主控上，20% 扫模块；看不懂的局部先标问号，配合芯片 Datasheet 的引脚定义与典型应用电路对照，别跟一个电阻死磕。读得多了你会形成\"模块模板库\"，新图扫一眼就知道哪里是套路、哪里是自定义。\n\n**电源树画法示例**（看图时随手就能画出这种结构）：\n\n```mermaid\nflowchart TD\n    IN[\"DC 12V 输入\"] --> F[\"防反接 / 保险丝\"]\n    F --> D1[\"DCDC#1 → 5V\"]\n    F --> D2[\"DCDC#2 → 1.2V\"]\n    F --> D3[\"DCDC#3 → 1.1V\"]\n    D1 --> U1[\"USB 供电 / CH340\"]\n    D1 --> L1[\"LDO#1 → 3.3V\"] --> U2[\"MCU / 传感器\"]\n    D2 --> DDR[\"DDR\"]\n    D3 --> CORE[\"核心供电\"]\n```\n\n有了这棵树，布局时电源模块该放哪、铜宽该多少、哪路电流大，全都一目了然。\n\n### 15.3 元器件选型：参数、生命周期与成本\n\n**看懂关键参数（以三大件为例）**：\n\n- **电阻**：阻值、精度（常用 1%/5%）、封装（0201/0402/0603/0805…）、额定功率随封装升级（0402 常见 1/16W 量级，以规格书为准）、特殊用途看温漂与材质（采样电阻看低阻值/大功率/合金）。\n- **电容**：容值、耐压（留裕量，经验至少 1.5~2 倍于工作电压）、精度、介质（X5R/X7R 用于去耦耦合，C0G/NP0 用于定时/滤波/射频等稳定场合——容值随温度电压漂移小）、温度等级。\n- **电感/磁珠**：感量、饱和电流（Isat，超了感量跳水）、温升电流（Irms）、直流电阻 DCR；磁珠看阻抗@100MHz 与直流电阻，单位是欧姆不是亨利。\n\n**温度等级（影响价格与可靠性）**：商业级（经验 0~70°C）、工业级（经验 −40~85°C）、车规级（经验 −40~125°C 起，且需 AEC-Q 系列认证）——以器件规格书为准。消费电子用商业级省钱，工控/车载按需求升级，别无脑上高等级浪费成本。\n\n**生命周期管理（Lifecycle）**：\n\n1. 选型时查器件状态：量产中（Active）、不推荐新设计（NRND）、停产公告（EOL）；NRND/EOL 的料再便宜也别上新项目。\n2. 关注 PCN（Product Change Notice，产品变更通知）——供应商改工艺/换厂可能影响你的设计。\n3. **替代料（Second Source）**：关键器件准备 Pin-to-Pin 兼容的备选，封装相同、关键参数覆盖；国产替代是当前主旋律，电源类、接口类、MCU 类国产料的成熟度已相当高。\n\n**LDO vs DCDC vs MOS 选型对比（高频面试题）**：\n\n| 维度 | LDO（线性稳压） | DCDC（开关稳压，以 BUCK 为例） | MOS（功率开关管） |\n|:---|:---|:---|:---|\n| 效率 | 低，约 Vout/Vin | 高（经验 85%~95%，以规格书为准） | 取决于 Rds(on) 与驱动损耗 |\n| 噪声/纹波 | 极低，干净 | 有开关纹波与 EMI，需滤波 | 开关应用有损耗与 EMI |\n| 压差 | 受 Dropout 限制 | 可升/降压 | — |\n| 外围 | 简单（进出电容） | 电感、二极管/MOS、补偿 | 栅极驱动电路 |\n| 成本 | 低 | 中 | 看电流/耐压等级 |\n| 适用 | 小电流、射频/模拟供电、对噪声敏感处 | 大电流、大压差、效率敏感处 | 电源开关、电机驱动、负载开关 |\n\nMOS 选型：耐压留裕量；在实际栅源驱动电压下核对规定的 Rds(on)，并据此计算导通损耗；Vgs(th) 是规定小电流下的阈值，不代表 MOS 已充分导通。还要核对电流、封装热条件、开关损耗与栅极电荷 Qg。\n\n**选型自查清单（每次新料入库前过一遍）**：\n\n- [ ] 电气参数覆盖工作点：电压留 1.5~2 倍裕量、电流留裕量（经验起点，按可靠性要求降额）\n- [ ] 封装与功耗：功率损耗 × 热阻 = 温升，是否在允许范围\n- [ ] 温度等级匹配应用场景（商业/工业/车规）\n- [ ] 生命周期状态为量产中（Active），且库存/交期可接受\n- [ ] 有替代料（最好 Pin-to-Pin），价格在数量阶梯下可接受\n- [ ] 关键料已读 Datasheet 的推荐应用与 Layout 章节\n\n**成本意识**：询价看数量阶梯（Price Break，1k 与 10k 单价差很多）；封装别追小（0201 省板面积但贴装成本与不良率上升）；优先选\"通用量产料\"而不是冷门料；设计时就把 BOM 成本表列出来，养成\"每加一个器件都问一句为什么\"的习惯。\n\n**数据手册阅读与选型记录**\n\n1. 确认制造商、完整订货号、文档版本、封装和引脚；同系列不同后缀可能不同。\n2. 先区分绝对最大额定值与推荐工作条件，后者才是设计工作点的基本依据；再按温度、负载、电压和时序查电气特性。\n3. 核对参考电路与测试条件：外围元件、容差、稳定性、布局和启动条件不能脱离原应用。\n4. 建立候选表，记录最坏条件、功耗、封装、供货状态和未决项。替代件即使同封装，也要逐项比较引脚、电气和实际工作条件。\n5. 用第 14 课 LDL1117、电容、USB 连接器做一次练习；当前项目中电容有效值、USB 电流预算和制造条件尚未核准。\n\n可参考 [嘉立创元器件与选型资料](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)，最终以具体器件厂商的数据手册和相关应用资料为准。\n\n### 15.4 PCB 打样与焊接：从下单到手上亮板子\n\n**打样下单参数详解**（以常见打样平台的下单页为参照，界面以平台实际为准）：\n\n| 参数 | 常见选项 | 怎么选 |\n|:---|:---|:---|\n| 板厚 | 0.6/0.8/1.0/1.2/**1.6**/2.0mm | 常规默认 1.6mm；阻抗板要配合层叠计算 |\n| 层数 | 2/4/6… | 按设计，层数与成本强相关 |\n| 铜厚 | 0.5oz/**1oz**/2oz（约 17/35/70µm） | 大电流电源用 2oz 并加宽走线 |\n| 最小线宽/孔径 | 按板厂能力 | 留裕量，别顶格画 |\n| 阻焊色 | 绿/蓝/红/黄/黑/白/紫 | 绿色工艺最成熟；黑/白丝印对比度注意 |\n| 字符色 | 白/黑/黄 | 与阻焊色搭配保证可读 |\n| 表面工艺 | HASL / ENIG / 沉银 / OSP | 见下文 |\n| 过孔处理 | 盖油/开窗 | 批量默认盖油防连锡短路 |\n| 特殊工艺 | 阻抗控制/喷锡厚度等 | 高速板选阻抗控制，板厂按你的层叠做阻抗 |\n\n**表面工艺（Surface Finish）对比**：\n\n- **HASL（喷锡，热风整平）**：便宜、可焊性好，但表面平整度一般，细间距/BGA 器件慎用；分有铅/无铅（RoHS 合规选无铅）。\n- **ENIG（沉金）**：平整、耐用、适合 BGA 与细间距、保质期长；价格更高，工艺不良时有\"黑盘\"风险。\n- **沉银**：平整、成本居中，注意硫污染变色。\n- **OSP（有机保焊膜）**：最便宜、平整，但可焊性随时间衰减、返工次数受限。\n\n经验选择：练习板/无 BGA 用 HASL 省钱；有 BGA 或 0.4mm 以下细间距用 ENIG。\n\n**小批量 SMT 流程（做 10~100 片时的标准动线）**：\n\n1. **备料**：BOM 采购、来料检验、湿敏器件（MSD）按等级烘干拆包管理；\n2. **钢网（Stencil）**：激光钢网对应贴片层开孔，常用厚度 0.1~0.12mm 量级（以锡珠/器件间距与锡膏规格书推荐为准）；\n3. **印刷锡膏**：锡膏印刷机（小批量手工刮也行），印刷后检查少锡/连锡；\n4. **贴片（Pick & Place）**：贴片机按坐标文件贴装；小批量手工贴片用镊子+放大镜/显微镜；\n5. **回流焊（Reflow）**：按温度曲线（Profile）走\"预热—恒温—回流—冷却\"四区；无铅工艺峰值温度常见约 245~250°C 量级、有铅约 225~235°C（**以所用锡膏规格书的推荐曲线为准**）；\n6. **检查**：AOI 或目检贴件极性、偏移、连锡；ICT/FCT 测试；\n7. **通孔件**：小批量手工焊或选择波峰焊；压接件不能焊。\n\n**BGA 焊接与 X-Ray**：BGA 焊球在封装底部，目视完全看不到——可根据质量要求使用 **X-Ray** 检查空洞、桥连和偏移；检测能力及验收标准依设备和工艺要求确定；返修要用返修站（BGA Rework Station）局部加热拆焊重植球。设计端的配合：BGA 周边留出返修操作空间、扇出走线别把测试点埋在正下方死角。\n\n**打样回来之后**：先目检（阻焊/丝印/孔），万用表量电源对地阻抗（防止焊接短路再上电烧板），上电测各路电压，再按\"电源→时钟→复位→最小系统→外设\"的顺序调试。\n\n**手工焊接实操要点（贴片返修与样板必会）**：\n\n1. 烙铁温度：无铅焊料常用 350~380°C 区间、有铅可低一些（经验值，以焊锡丝规格书与烙铁手册推荐为准）；温度不是越高越好，过高加速焊盘脱落与烙铁头氧化；\n2. 贴片件手法：先给一个焊盘上锡 → 镊子夹件对位焊一脚 → 再焊另一脚； CHIP 件两端加热要均衡，否则\"立碑\"；\n3. 拆件用热风枪：从外围小件练起，注意保护周边塑料连接器与相邻器件（锡箔纸遮挡）；\n4. 焊接顺序：低矮小件 → 大件 → 连接器 → 怕热器件最后；同批次多板流水作业；\n5. 质量自检标准参考 IPC-A-610 的合格焊点形态描述：焊料润湿、轮廓完好、无桥连无针孔。\n\n### 15.5 量产工艺规范与成本控制\n\n**从打样到量产，多出来的事**：\n\n1. **拼板效率**：把小板拼成大板提高原材料利用率——拼板尺寸尽量贴合格料尺寸（按板厂大料规格）、板间留工艺边（经验 5mm 量级，以产线要求为准）；分板方式：直线用 V-CUT（成本低但应力大）、异形或应力敏感用邮票孔（Mouse Bites）加挖槽。\n2. **测试**：ICT（In-Circuit Test，在线测试，针床/飞针逐网络测器件与连接，要求设计留测试点）、FCT（Functional Test，功能测试，治具+测试程序模拟真实工作）、边界扫描（JTAG）覆盖难测的 BGA 网络。\n3. **直通率（FPY，First Pass Yield）**：一次通过不返修的比例，是产线核心指标——设计质量直接体现在 FPY 上：焊盘设计不规范→立碑、偏移；丝印不清→极性贴反；测试点缺失→只能人工补测。\n4. **典型焊接不良与设计对策**：立碑（元件一头翘起，片式件两端焊盘受热不均/不对称）、桥连（间距过近/锡量过多）、虚焊（焊盘氧化/温度曲线不当）、偏移（Mark 点/封装库精度）。\n\n**典型不良与设计端对策表**：\n\n| 不良 | 机理 | 设计对策 |\n|:---|:---|:---|\n| 立碑（墓碑） | 片式件两端受热不均，焊料表面张力把元件拉起 | 两端焊盘对称、尺寸符合封装规范、热容量均衡 |\n| 桥连 | 间距过近或锡量过多 | 放宽间距、钢网开孔缩比、保住阻焊桥 |\n| 虚焊/冷焊 | 焊盘氧化、温度曲线不当 | 焊盘可焊性设计（表面工艺选择）、回流曲线验证 |\n| 偏移 | 贴片精度/封装库误差 | Mark 点设计规范、封装库严格按 IPC-7351 类规范建 |\n\n**DFM 审查清单（量产前自查）**：\n\n- [ ] 线宽/间距/孔径/环形宽度未顶板厂能力上限\n- [ ] 密集焊盘间阻焊桥可制造，丝印不压焊盘\n- [ ] 拼板方式、工艺边、定位孔、Mark 点已按产线要求设计\n- [ ] 测试点覆盖关键网络（每网络可测是 ICT 的理想状态，实际按优先级取舍）\n- [ ] BGA 可 X-Ray 检查、可返修\n- [ ] 极性/一脚/方向丝印齐全清晰\n- [ ] 散热器件与安装件（螺丝孔/保持足够间距）不冲突\n\n**降本手段（按效果排序的思路）**：\n\n1. **板层数**：6 层改 4 层是最大单项降幅之一，条件允许时通过重排信号层压缩；\n2. **工艺退档**：线宽/孔径放宽到主流工艺档位，HDI 换通孔工艺；\n3. **器件替代**：进口料换国产 Pin-to-Pin、高精度换常规精度（评估容差）、分立方案换集成度更高的芯片（减少 BOM 行数与贴片点数）；\n4. **板尺寸**：布局紧凑化缩小面积、拼板排布优化利用率；\n5. **表面工艺/材料**：非 BGA 板 ENIG 换 HASL、高频板材按需分区使用混压。\n\n注意：降本永远和可靠性做交易——每砍一项都要评估对性能、良率、EMC 的影响，\"省了五毛钱、返修一百块\"是量产最常见的笑话。\n\n### 15.6 测试仪器与电路调试方法论（Bring-Up）\n\n板子从工厂回来那一刻，才是硬件工程师真正的考试——行业里把这个过程叫 **Bring-Up（点亮）**。国际社区（Phil's Lab、EEVblog 等）反复强调：**会设计只是半个工程师，会把不工作的板子调好，才是完整的工程师**。这一节补上仪器与调试方法这块拼图。\n\n#### 15.6.1 调试台三件套\n\n| 仪器 | 核心用途 | 必会操作 | 新手要点 |\n|:---|:---|:---|:---|\n| 万用表 | 电压/通断/对地阻抗 | 通断档查短路、电压档测各电源轨 | 在路测电阻受并联支路影响，读数仅作参考 |\n| 直流稳压电源（带限流） | 给板子安全供电 | **上电前先设置限流**；结合启动浪涌、负载和电源能力确定数值 | 限流有助于限制故障能量，但不能保证器件不损坏；按设备启动电流、故障能量和电源动态特性设置并监测 |\n| 示波器 | 看波形：时钟、复位、纹波、通信 | 探头补偿校准、垂直/水平档位、边沿触发 | 带宽按被测信号最高频率的 3~5 倍选（经验值）；测电源纹波用 20MHz 带宽限制 + 短地弹簧 |\n\n进阶仪器（知道干什么用即可）：逻辑分析仪（抓 I2C/SPI/UART 协议波形）、JTAG/SWD 调试器（配合固件单步调试）、电子负载（测电源带载能力）、热成像仪（找发热点与短路点）。\n\n#### 15.6.2 首板点亮七步法（Bring-Up 标准流程）\n\n1. **目检（IPC）**：放大镜/显微镜对照 BOM 与丝印查方向、错料、连锡、虚焊——一半的\"不工作\"是焊接问题\n2. **断电测对地阻抗**：万用表通断/电阻档，测每路电源对 GND 的阻抗，与正常参考值对比（无参考时凭经验：3.3V 轨对地通常几十~几百 Ω，接近 0Ω 必有短路）\n3. **限流上电**：电源限流设为预期电流的 1.5 倍左右，从 0V 缓慢抬高，盯电流——一抬电压电流就顶满 = 还有短路，立即断电\n4. **测电压轨**：按电源树逐路测：输入→各 DCDC 输出→LDO 输出→主核/IO/DDR 各轨，顺序对了才能进下一步\n5. **查时钟与复位**：示波器测晶振起振（幅度、频率）、复位脚释放时序（上电后应保持复位低电平一段时间后拉高）\n6. **最小系统验证**：接调试器，看能否识别目标芯片（SWD/JTAG 能连上 = 最小系统活了），抓 UART 启动日志\n7. **逐个外设点亮**：一次只启用一个外设，LED→串口→存储→显示→无线，谁出问题查谁，不要一上来全开\n\n#### 15.6.3 调试方法论：四板斧\n\n- **二分法**：信号链路从中间断开测，确定问题在前半段还是后半段，逐步缩小包围圈\n- **对比法**：好板 vs 坏板同一点对测（打样多打几块的意义之一）；没有好板就和参考设计比\n- **替换法**：怀疑的元件/模块换掉验证（先换便宜的、好焊的）\n- **最小系统剥离**：把外设全部断开只留最小系统，逐个加回，锁定引入问题的外设\n\n记录习惯：每次调试把现象、测量值、改动、结论记进错题本——三天后你会感谢这份记录。\n\n#### 15.6.4 高频\"点不亮\"故障速查表\n\n| 现象 | 首查方向 |\n|:---|:---|\n| 限流上电电流顶满 | 电源对地短路：电容连锡、芯片焊盘桥连、BGA 焊球短路 |\n| 某电压轨无输出 | 使能脚电平、FB 分压阻值、软启动脚、电感焊点 |\n| 电压对但芯片不工作 | 复位脚被拉住、晶振不起振、boot 启动配置脚电平错误 |\n| 随机死机/重启 | 电源纹波过大、复位阈值设置、看门狗、焊接虚焊（断电后检查焊接，必要时采用受控方法复现） |\n| 通信时好时坏 | 波特率/上拉电阻/信号完整性、共地是否连接 |\n| 芯片烫手 | 输出短路、芯片接反/丝印方向看错、电源轨接错 |\n\n### 15.7 设计评审（Design Review）：出厂前的最后一道关\n\n**是什么**：设计评审（Design Review）是图纸或板子投产前，由多人从不同视角系统性检查设计的流程——本质是**团队互查**，用集体的眼睛补个人的盲区，而不是领导签字走过场。行业共识：自己查自己的图，漏检率天然高（你不知道自己不知道什么）；评审是成本最低的排雷手段——评审时改一行原理图只要一分钟，打样回来再改就是两周一版。\n\n**四级评审流程**：\n\n| 级别 | 谁来审 | 审什么 | 产出 |\n|:---|:---|:---|:---|\n| ① 自审 | 自己 | 按检查表逐项自查，先消灭低级错误 | 自查记录 |\n| ② 交叉审 | 水平相近的同事 | 用\"陌生人的眼睛\"重走一遍设计逻辑 | 问题清单 |\n| ③ 专家审 | 资深工程师/主管 | 叠层、阻抗、EMC、电源架构等高风险决策 | 风险决议 |\n| ④ 设计冻结 | 项目组 | 确认问题全部闭环、锁定版本，才允许投板 | 冻结版本号 |\n\n顺序不能乱：自己没过一遍就拿去交叉审，等于浪费同事的时间在\"忘放的去耦电容\"这种低级问题上——先自审清场，再借别人的眼睛。\n\n**三张精简检查表**：\n\n原理图审查：\n\n- [ ] 电源树完整：每路电压/电流/给谁用，功率余量是否够\n- [ ] 每个芯片供电脚就近有去耦；关键信号有上拉/下拉处理\n- [ ] 冗余与预留：测试点、NC 脚处理、0Ω 选焊的兼容位\n- [ ] 位号连续无重复，极性/一脚标注齐全\n\nPCB 审查：\n\n- [ ] DRC 零报错；阻抗与等长按规则表复核（第 11、19 课的速查表）\n- [ ] 敷铜检查：地平面完整无分割、孤岛消除、散热铜量足够\n- [ ] 安装检查：孔位/外壳/元件高度冲突、高频插拔区应力加固（第 11 课）\n\nDFM 审查：直接复用 15.5 的 DFM 审查清单，逐项打勾。\n\n**评审会议怎么开**：\n\n1. **对事不对人**：审的是\"这块板的风险\"，不是\"谁画得差\"——被指出问题是设计受益，不是面子受损；\n2. **问题分级**：Must（必须改，不改不投板）/ Nice（建议改，记录在案下版处理）；\n3. **记录与闭环**：每个问题记入评审记录表（问题描述/位置/级别/责任人/期限），改完逐条销项——没有闭环的评审等于没开。\n\n**新人如何参与评审**：先旁听 + 记录，把评审里的高频问题记进错题本；提问要带数据、带句式——不问\"这里对不对\"，问\"这根线的回流路径在哪\"\"这路电源的峰值电流按多少算的\"。带着具体数据的提问，一次顶十次。\n\n**与 15.5 DFM 审查的关系**：DFM 是评审的一个维度——三张检查表里的一张。评审的视野更宽：除了\"造得出\"（DFM），还管\"用得对\"（原理审查）、\"走得通\"（PCB 审查）、\"修得了\"（测试点与返修空间）。\n\n> 🎬 **视频推荐**：B 站搜索 [嘉立创 PCB 制造流程](https://search.bilibili.com/all?keyword=%E5%98%89%E7%AB%8B%E5%88%9B%20PCB%20%E5%88%B6%E9%80%A0%E6%B5%81%E7%A8%8B)——配合本课光绘与打样章节，理解工厂端的 SMT 与制板工艺。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 给你的 6 层板项目输出完整光绘（含钢网/坐标），用 CAM 工具逐层检查 | 文件齐全无缺层，CAM 检查截图留档 |\n| 2 | 找一份网上的开源项目原理图（如 STM32 最小系统扩展板），按六步法解读 | 产出手绘电源树 + 一页模块清单批注 |\n| 3 | 为同一个需求（5V 转 3.3V/1A）分别选一款 LDO 和一款 DCDC，列参数对比表并给出结论 | 对比表含效率、成本、纹波、外围器件数 |\n| 4 | 完成一次真实打样下单：自己决定所有参数并说明理由 | 下单参数截图 + 每项选择理由 |\n| 5 | 把打样回来的板子完成焊接与上电调试（可只贴电源+最小系统） | 上电各路电压正常，记录调试过程到错题本 |\n| 6 | 给你的板子写一份量产 DFM 审查报告 + 三条降本建议 | 报告含清单逐项结论与整改项 |\n| 7 | 查 BOM 中两个关键器件的生命周期状态（Active/NRND/EOL），为其中一个找替代料 | 状态查询截图 + 替代料参数对比表 |\n| 8 | 练一次\"安全上电\"：电源限流设为预估 1.5 倍，按器件要求设置电压和限流，采用允许的上电斜率并记录电流电压曲线 | 记录表含每一步电流读数与判断依据 |\n| 9 | 用示波器测一块能工作的板子：晶振波形 + 任一电源轨纹波（20MHz 带宽限制） | 截图标注幅度/频率/纹波峰峰值 |\n\n## ✅ 自测清单\n\n- [ ] 我能说出 Gerber 各层文件的含义与后缀对应关系，并知道 RS-274X/Excellon 分别是什么格式\n- [ ] 我知道输出光绘前要检查哪五类问题（层叠/阻焊/丝印/钻孔/板框）\n- [ ] 我能背出原理图解读六步法（图纸信息→电源树→主控→模块→标号→批注）\n- [ ] 我能读电容的耐压/精度/介质/温度等级并说出 X7R 与 C0G 的适用场景，也知道 NRND/EOL/PCN 与替代料的处理\n- [ ] 我能对比 HASL/ENIG/沉银/OSP 四种表面工艺的优缺点与适用场景\n- [ ] 我能按顺序描述 SMT 小批量流程（备料→钢网→印刷→贴片→回流→检查→插件）\n- [ ] 我知道 BGA X-Ray 能检查哪些 BGA 缺陷及有哪些局限，以及无铅回流峰值温度的常见量级（以锡膏规格书为准）\n- [ ] 我能说出 ICT 与 FCT 的区别，以及测试点的设计要求\n- [ ] 我能解释直通率 FPY 的含义，并列出至少 4 条设计端影响 FPY 的因素\n- [ ] 我能给出至少 4 条降本手段并说明各自的风险\n- [ ] 我能解释片式件\"立碑\"的机理与焊盘设计对策，并知道湿敏器件（MSD）要按等级管理开封时间\n- [ ] 我知道上电前为什么必须设电源限流，限流值一般设多少\n- [ ] 我能背出首板点亮七步法的顺序（目检→对地阻抗→限流上电→电压轨→时钟复位→最小系统→逐外设）\n- [ ] 我能说出调试四板斧（二分法/对比法/替换法/最小系统剥离）各自的适用场景\n- [ ] 我能说出四级评审流程（自审→交叉审→专家审→设计冻结）与问题分级 Must/Nice 的含义\n- [ ] 我能解释设计评审与 DFM 审查的关系（DFM 是评审的一个维度），以及评审问题为什么必须\"记录—整改—销项\"闭环\n\n## ⚠️ 新手常见坑\n\n1. **光绘漏层/极性错**：忘了输出钻孔或某内层、内电层负片没勾——板厂照做出来才发现。对策：输出后必须用 CAM 工具逐层预览，建立自己的输出模板（Layer Set）。\n2. **单位/精度不统一**：Gerber 用 2:4、钻孔用 2:3，工厂解析出错孔位漂移。对策：输出设置里统一单位与精度，下单后核对工厂反馈的工程确认（EQ）问题。\n3. **只看单价不看阶梯与库存**：选了个便宜料，量产时缺货交期三个月。对策：选型时同时看库存、生命周期状态和多家供应渠道。\n4. **打样参数照抄默认**：大电流板用默认 1oz 铜厚打样，上电走线发热。对策：先算载流（参考 IPC-2152 类降额思路），再定铜厚与线宽。\n5. **BGA 板选 HASL**：表面不平整导致焊球虚焊，X-Ray 一片空洞。对策：细间距/BGA 根据平整度、组装、可靠性和成本选择表面工艺。\n6. **不做来料与 MSD 管理**：拆封的湿敏芯片直接过回流焊，水汽膨胀导致分层开裂。对策：按湿敏等级（MSL）管理开封时间，超时的先烘烤（条件以器件规格书为准）。\n\n## 📚 延伸学习\n\n- 书籍：一本《SMT 工艺基础》或《电子组装工艺》类教材，重点看锡膏印刷与回流曲线章节\n- 标准：IPC-A-610（电子组装件外观验收）、IPC-7351（焊盘图形设计）、IPC-2152（载流能力）\n- 手册：常用 DCDC 芯片 Datasheet 的 Layout Guidelines 章节逐字读两遍\n- 工具：CAM350 / KiCad Gerber Viewer / 打样平台 DFM 预览功能，各跑一遍真实文件\n- 搜索关键词：`Gerber 输出 检查`、`Excellon 钻孔文件`、`HASL ENIG OSP 对比`、`回流焊 温度曲线 无铅`、`BGA X-Ray 检测 空洞`、`拼板 V-CUT 邮票孔`、`ICT FCT 区别`","taskSignature":"b3bc5d3227c45eb8ddbe80ac729d5881f85309449e09c560c73125b53ffe3a51","taskCount":36},{"id":"16","title":"第 16 课 · 硬件测试与可靠性验证","short":"硬件测试与可靠性验证","stage":3,"diff":3,"prev":"第 06 课基础测量；配合第 14、15 课项目上电，进阶测试结合第 19 课","optional":false,"md":"第 15 课解决了\"怎么把板子点亮\"（仪器三件套 + Bring-Up 七步法），这一课解决\"怎么证明板子合格、怎么证明产品可靠\"：把仪器从三件套扩到五件套再补上 LCR 电桥与频谱仪，把\"我测了一下没问题\"升级成\"按用例测了 N 项、有记录、有报告、可追溯\"，再把高低温、老化、振动这些可靠性试验的意图和方法讲透。学完这课，你就能回答面试官那句高频提问——\"你们产品怎么测的？\"\n\n## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 操作信号发生器、电子负载、LCR 电桥、频谱仪四台新仪器，说清每台仪器解决什么问题，与第 15 课的万用表/限流电源/示波器串成完整工具链。\n2. 用电子负载给 DC-DC 电源做拉载（load）测试，输出\"效率-负载\"与\"纹波-负载\"曲线。\n3. 搭建规范的测试台面：台面分区、共地与防地环路、防静电三件套、线材整理。\n4. 按研发测试分层（来料→单板→模块→整机→认证）编写测试用例、提交规范的 Bug 报告、组织回归测试。\n5. 独立完成开机自检、接口逐项验证、功耗三态测试与温升测试，产出记录表。\n6. 说清高低温/恒温恒湿/老化（burn-in）/振动跌落/盐雾五类可靠性试验模拟什么、怎么操作、设计端如何预防。\n7. 用近场探头（near-field probe）+ 频谱仪做 EMC 预测试，与第 19 课\"定位→源头→路径→受体\"四步整改闭环。\n8. 在示波器上实测眼图（eye diagram）、上升沿与反射现象。\n9. 对照硬件测试工程师岗位清单评估自己，能写出结构完整的测试报告，规划从测试岗到设计岗的路径。\n\n## 📖 正文\n\n### 16.1 测试五件套进阶：从\"能测\"到\"会测\"\n\n第 06 课介绍仪器的基本接线与安全，第 15 课用于首次上电；本课继续学习信号发生器、电子负载、LCR 电桥、频谱仪以及示波器的触发、解码和 FFT。\n\n先用一张表建立全局感——什么问题找什么仪器：\n\n| 你想干什么 | 用哪台 | 一句话要点 |\n|:---|:---|:---|\n| 这条线通不通、电压多少 | 万用表 | 第 06 课已学 |\n| 安全地给板上电并看电流 | 直流限流电源 | 第 06 课已学 |\n| 看波形形状、时序关系 | 示波器 | 第 06 课已学，本课进阶 |\n| 给电路灌一个已知信号 | 信号发生器 | \"激励-响应\"测法的起点 |\n| 让电源带规定负载跑 | 电子负载 | CC 模式最常用 |\n| 测电感/电容/ESR | LCR 电桥 | 频点选对读数才作数 |\n| 看频率成分、定位 EMI | 频谱仪 | 先加衰减再测量 |\n\n#### 16.1.1 信号发生器：给电路一个\"已知的标准输入\"\n\n第 06 课的 RC 电路可作为激励与响应的练习，CH1 测输入、CH2 测输出，地夹接公共地。下方仿真的输入为 **1 V 峰值（2 Vpp）**，与后文实操的 1 Vpp 设置不同；比较的是输出与输入的幅度比。\n\n```svg\n<svg role=\"img\" aria-label=\"RC低通电路：输入经电阻到输出，输出经电容接地\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"178.79999999999995pt\" width=\"292.47499999999997pt\" viewBox=\"-80.42499999999998 -169.49999999999994 292.47499999999997 178.79999999999995\"><path d=\"M 0.0,-108.0 L 18,-108 L 36,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-108.0 L 54,-108 L 54,-117 L 90,-117 L 90,-99 L 54,-99 L 54,-108 M 90,-108 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 144,-108 L 180,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 108,-75.24 M 117,-75.24 L 99,-75.24 M 117,-68.76 L 99,-68.76 M 108,-68.76 L 108,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-36.0 L 108,-21.6 L 99,-21.6 L 117,-21.6 M 101.7,-17.28 L 114.3,-17.28 M 106.2,-12.96 L 109.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 18.0,-108.0 L 18,-126 L 18,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 151.20000000000002,-108.0 L 151.2,-126 L 151.2,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-61.199999999999996\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-61.199999999999996\" dy=\"13\">信号源输出<\/tspan><\/text><text x=\"72.0\" y=\"-133.60000000000002\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">R1 1kΩ<\/tspan><\/text><text x=\"201.6\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"201.6\" dy=\"13\">输出<\/tspan><\/text><text x=\"95.39999999999999\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"95.39999999999999\" dy=\"13\">C1 100nF<\/tspan><\/text><text x=\"14.4\" y=\"-171.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"14.4\" dy=\"13\">CH1 探头<\/tspan><\/text><text x=\"147.60000000000002\" y=\"-171.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.60000000000002\" dy=\"13\">CH2 探头<\/tspan><\/text><text x=\"104.39999999999999\" y=\"-14.8\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"104.39999999999999\" dy=\"13\">两通道地夹接公共地<\/tspan><\/text><circle cx=\"108\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"18\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n```circuitjs\nrc-lowpass-1592\n```\n\n**是什么**：信号发生器（Signal Generator，低端机型也叫函数发生器 Function Generator）能输出频率、幅度、波形都可控的标准信号。调试的核心方法论之一就是\"激励-响应\"：给电路一个已知的输入，看输出对不对——没有信号发生器，很多测试根本无从谈起。\n\n**三个必会设置**：\n\n| 设置项 | 含义 | 注意点 |\n|:---|:---|:---|\n| 波形 Waveform | 正弦（测频响/失真）、方波（测时序/瞬态）、三角波（测线性度） | 方波边沿陡，还能当\"临时时钟\"用 |\n| 频率 Frequency | 每秒重复的周期数 | 根据被测带宽与安全输入范围确定扫频范围 |\n| 幅度 Amplitude | 常用 Vpp（峰峰值）与偏置 Offset | 注意输出阻抗：许多发生器具有约 50Ω 物理输出阻抗；若显示设置按 50Ω 终端校准而实际接高阻，端电压可能约为显示值的两倍，具体看仪器设置与说明书 |\n\n补充两个进阶设置：**占空比（Duty Cycle）**只在方波/脉冲波下有效，测 PWM 类电路时直接用它给出标准激励；**负载设置（50 Ω/高阻）**通常影响幅度显示和换算，未必切换物理输出阻抗；具体查仪器说明书，设错读数差一倍——这是信号发生器的第一大新手坑。\n\n**实操：测一阶 RC 低通滤波器的截止频率**（步骤化）：\n\n使用独立的无源实验电路：输入经 1 kΩ 电阻接输出，输出经 100 nF 电容接公共地；输出不接其他负载。按标称值计算，截止频率约为 1.59 kHz。使用高阻探头，并直接测量电阻前的实际输入电压；信号发生器输出阻抗、负载及元件误差都会影响结果。\n\n1. 信号发生器输出正弦波，幅度设 1 Vpp、偏置 0 V，接滤波器输入；\n2. 示波器 CH1 探输入、CH2 探输出（两根探头地线都接滤波器地，就近共地）；\n3. 从 100 Hz 起，按 1-2-5 步进升频（100 Hz→200 Hz→500 Hz→1 kHz→…）；\n4. 每个频点记录 Vout/Vin 比值，填入表格；\n5. 找到 Vout/Vin 跌到低频通带比值约 0.707 倍（-3 dB）的频率，与理论值 f=1/(2πRC) 对比；误差大就查电容实际容值（正好可以用下面讲的 LCR 电桥验证）。\n\n**其他高频用途**：给音频放大器灌正弦看削波失真；给复位脚容性耦合注入毛刺，做简单的抗扰度试验；若器件明确支持外部时钟旁路且完成相应配置，可按手册规定的引脚、电平和频率输入时钟，辅助缩小故障范围；不可直接把方波接到任意晶体引脚。\n\n#### 16.1.2 电子负载：让电源\"负重跑\"\n\n**是什么**：电子负载（Electronic Load）是一只\"可编程的假负载\"，按你设定的规律把能量\"吃掉\"（转成热），用来给电源做拉载（load）测试。它不等于功率电阻——电流可编程、可精细步进、可在恒流/恒压/恒阻/恒功率之间切换。\n\n**四种模式（面试常问）**：\n\n| 模式 | 全称 | 含义 | 典型场景 |\n|:---|:---|:---|:---|\n| CC | Constant Current 恒流 | 端电压怎么变，吃掉的电流恒定 | 电源拉载测效率/纹波/负载调整率（最常用） |\n| CV | Constant Voltage 恒压 | 把端电压钳在设定值，电流随源能力变化 | 测电池放电平台、充电器的限流保护行为 |\n| CR | Constant Resistance 恒阻 | 等效一只电阻，I=V/R | 模拟纯阻性负载（加热丝、指示灯类） |\n| CP | Constant Power 恒功率 | P=V×I 恒定，电压跌则电流自动增大 | 模拟恒功率设备（LED 驱动下游、部分电机类负载） |\n\n**实操：Buck 板卡满载效率与纹波 vs 负载曲线（链第 10 课 Buck 电路）**：\n\n1. 接线：直流电源输出设到被测板输入规格值（如 12 V），接板输入；板输出接电子负载（注意极性，接反可能损坏负载）；\n2. 电子负载设 CC 模式，起始电流 0.1 A；**设好拉载斜率（Slew Rate）或改用小步进**（如每步 0.1~0.2 A、带转换时间），不要一档直跳满载——原因见文末常见坑；\n3. 从轻载到满载（按产品规格书，例如 2 A）逐点加载，每点稳定停留约 30 s（以读数稳定为准）；\n4. 每点记录：输入电压/电流（算 Pin）、输出电压/输出电流（算 Pout）、效率 η=Pout/Pin；\n5. 同一点用示波器测输出纹波：探头 10X 档、地线最短、开 20 MHz 带宽限制（测试条件以电源规格书为准）；\n6. 产出两张曲线图：效率-负载曲线、纹波-负载曲线。看四个点：满载效率是否达标；轻载效率是否难看；纹波是否随负载单调变大；有没有\"负载越大电压跌得越狠\"的异常（提示退耦不足或环路问题，回看第 19 课 PI）。\n\n**安全提醒**：连续满载时注意被测电源与负载两者的散热——负载吸收的功率=电压×电流，全部变成热量，长时间满载前确认两者额定功率都有裕量（以设备规格书为准）。\n\n#### 16.1.3 LCR 数字电桥：给 L、C 做体检\n\n**是什么**：LCR 数字电桥（LCR Meter）专测电感（L）、电容（C）、电阻（R）及其寄生参数，最重要的两个衍生指标是 **ESR**（Equivalent Series Resistance，等效串联电阻）与 **D**（损耗角正切，Dissipation Factor）。\n\n**关键设置——测试频率与电平**：电解电容常用 100 Hz/120 Hz，陶瓷电容常用 1 kHz~1 MHz（以电桥说明书与器件规格书为准）。**测出来的容值和频率强相关**：同一颗 X5R 电容用 120 Hz 和 1 MHz 测，读数可能差出 20% 以上——对照规格书判合格，必须用同频点数据比。\n\n**两个经典诊断（维修与来料检验都靠它）**：\n\n- **判电容老化**：电解电容寿命到期的第一体征是 ESR 变大（电解液逐渐干涸，经验上常规铝电解几十~几百 mΩ（聚合物电容才能到 mΩ 级），老化后可翻数倍，具体以规格书寿命表为准）。滤波电容 ESR 变大 → 纹波变大 → 电源带载跌压 → 设备重启。维修时\"测 ESR 换电容\"是标准动作，焊接更换手法见第 08 课。\n- **判电感饱和**：电感感量随直流偏置电流增大而下跌，跌到标称值的 70%~80% 即认为接近饱和（经验判据，以器件规格书的\"感量-偏流曲线\"为准）。带直流偏流源的电桥可直接扫出这条曲线；普通电桥可间接判断——饱和后感量跳水、纹波电流剧增、电感异常发烫，三者同时出现基本可以定罪。\n\n**实操：批量测 10 颗同型号电容的 ESR 分布**：\n\n1. 电桥开机预热（10~30 分钟，以说明书为准），环境远离风扇与热源；\n2. 选主参数 C、副参数 ESR（或 D），频点按电容类型选（如电解 120 Hz、MLCC 1 kHz）；\n3. 先做开路（OPEN）/短路（SHORT）校零，把测试夹具自身的寄生参数从读数中扣除；\n4. 逐颗夹持测量，记录容值与 ESR；大容值电容测量前先放电；\n5. 统计均值与极差，标出离群点：容值超下限（如低于标称 -20%）或 ESR 明显偏高的那颗，就是\"来料不良\"的活样本——这也是练习 3 的原型。\n\n#### 16.1.4 频谱仪：从\"看波形\"到\"看频谱\"（简介）\n\n**与示波器的本质区别**：\n\n| 对比 | 示波器 | 频谱仪 |\n|:---|:---|:---|\n| 观察域 | 时域：电压随时间变化 | 频域：各频率分量的幅度 |\n| 擅长 | 波形形状、时序关系、边沿质量 | 微弱的频率成分、谐波、杂散 |\n| 典型用途 | 看纹波形状、协议解码、测边沿 | EMI 定位（链第 19 课）、开关谐波分析、晶振频谱检查 |\n\n一句话：示波器回答\"这个信号长什么样\"，频谱仪回答\"这里面混了哪些频率、各有多强\"。很多 EMC 问题在时域上根本看不见（幅度太小、淹没在底噪里），到了频域一目了然。\n\n**核心用途**：EMI 预测试定位（16.6 节展开）；DCDC 开关频率与谐波成分分析（配合第 19 课 PI 排查）；验证晶振频偏与杂散发射。\n\n**保命设置——输入衰减**：先根据被测源的最大可能交流功率、直流电压与频率，核对频谱仪输入及前级衰减器的额定值；必要时选用额定隔直器和衰减器。未知信号不得直接接入，内置衰减不一定保护输入连接器或直流通路。频谱仪前端混频器烧毁是经典的贵修，典型事故就是把探头直接怼到电源线或功放输出上。另外记住频谱仪输入阻抗多为 50 Ω，不能像高阻示波器探头那样随便并到电路上——它接入本身就会明显改变被测电路的行为。\n\n#### 16.1.5 示波器进阶：触发、解码与 FFT\n\n**触发（Trigger）详解**——触发稳了，波形才有意义：\n\n- **边沿触发（Edge）**：最常用。选上升/下降沿 + 设触发电平（打在波形幅度中间附近）。波形左右乱滚时，先检查触发电平与触发源，再怀疑信号本身不同步。\n- **脉宽触发（Pulse Width）**：只在脉冲宽度满足条件（小于/大于/落在区间）时才触发。两大妙用：抓毛刺（设\"小于 200 ns\"的异常窄脉冲，电源轨上的尖刺一抓一个准）、抓协议异常（如某帧的间隔特别短）。\n- **实操：抓电源毛刺**——10X 探头接 3.3 V 轨，触发模式选 Normal/单次（Single），脉宽条件设\"小于 200 ns\"、电平设在明显高于纹波的位置；正常电源轨是平线，一旦触发捕获说明有窄脉冲，定格后分析它的幅度、宽度、周期性，再顺藤摸瓜（是负载突变？DCDC 补偿问题？还是旁边时钟串扰？菜单参数以示波器说明书为准）。\n\n**协议解码（Protocol Decode）**：现代示波器内置 UART/I2C/SPI 解码器，三步走：通道接到信号线（I2C 要 SCL/SDA 双通道）→ 解码菜单里选协议、设阈值电平与采样位置 → 打开总线显示，波形上直接叠加十六进制数据。排错实例：主控读不到传感器——解码一看 I2C 第九个时钟位 SDA 一直为高（无 ACK），说明从机没应答，查地址写错/上拉电阻缺失/从机根本没上电，十分钟锁定方向（接口电路基础见第 11 课）。\n\n**数学运算（Math）与 FFT**：Math 通道常用三个动作——CH1−CH2（在两通道输入和公共地均处于安全范围时作伪差分测量；共模抑制受探头匹配限制）、CH1×CH2（电压×电流=瞬时功率，配合电流探头算开关损耗）、反转/滤波。FFT 把时域搬进频域：对电源纹波做 FFT，主峰对应的频率应该正好是 DCDC 的开关频率及其倍频——如果纹波 FFT 的主峰不在开关频率上，说明混进了别的东西（50 Hz 工频、某路时钟），这是定位\"纹波到底是谁贡献的\"的利器（呼应第 19 课 PI 与 16.6 的 EMC 思路）。\n\n### 16.2 测试环境搭建：先搭台，再唱戏\n\n机构课里\"测试环境搭建\"是独立模块，因为它决定**测试结果的一致性与安全性**——同一块板换张桌子结果不同，多半是环境的锅。\n\n**台面分区（三区）**：\n\n| 分区 | 放什么 | 要点 |\n|:---|:---|:---|\n| 被测区（DUT 区） | 被测板、治具（fixture）、转接板 | 铺防静电垫；离桌边一拳以上防跌落；发热器件旁不放塑料件与线束 |\n| 仪器区 | 五件套、频谱仪、温升记录仪 | 显示屏朝向操作者；叠放注意底层仪器散热；旋钮接口留出操作空间 |\n| 工具区 | 电烙铁、热风枪、镊子、螺丝刀 | 烙铁上架、发热头朝外；远离仪器线缆（防烫伤线皮短路） |\n\n**共地与地环路（Ground Loop）**：先确认仪器和探头的接地方式。常见台式示波器探头地夹与保护地相连，不能夹到带电节点或市电初级热地；禁止断开仪器保护地。低压测量时，依据被测电路选择安全的公共参考点与接线。多台仪器各自通过探头地线在板上\"多点接地\"，会形成环形回路，拾取 50 Hz 工频磁场，测量中表现为怎么都抹不掉的低频纹波。实操规则：探头地线夹夹在离测试点最近的地；测小信号前先只接一台仪器验证基线干净；探头地线过长就是\"自制天线\"，高频测量换成弹簧短接地针。\n\n**防静电（ESD）三件套**：\n\n1. **腕带（Wrist Strap）**：贴皮肤佩戴，经约 1 MΩ 电阻接地——这颗电阻是保护人身的限流电阻，绝不能把人体直接短接到地；\n2. **防静电垫**：铺在被测区与工具区，经接地扣可靠接地（接地电阻按车间规范验证）；\n3. **离子风机（Ionizer）**：给不方便接地的物体（塑料外壳、成品整机、包装盒）吹离子风中和电荷。\n\n静电对 MOS 类器件的损伤很多是\"暗伤\"——当场不坏、寿命缩短、良率缓降。所以防静电不是仪式感，是良率与可靠性的地基（第 08 课焊接实操同样执行这套要求）。\n\n**线材整理**：电源粗线与信号细线分开走线不互相捆扎；每根测试线两端贴标签（如\"+5V_OUT\"\"GND\"\"CH1\"）；不用的探头收纳离台。桌面上每多一根乱线，就多一个接错点、多一路地环路。\n\n**搭一张新台面的动作顺序（照做一遍）**：\n\n1. 清空桌面，铺防静电垫并扣好接地；\n2. 按三分区摆仪器与工具，显示屏朝向一致；\n3. 佩戴腕带，确认与地可靠导通（按车间规范验证）；\n4. 仪器电源线统一走桌后，插座不串联过载；\n5. 布一根共地母线：把各仪器的地汇到被测区公共接地点；\n6. 贴标签、收多余线缆，拍一张\"标准台面\"照片存档——下次照图复原，保证一致性。\n\n**测试工装（治具 fixture）简介**：研发阶段靠手扶探头，重复性差、慢、还容易压滑短路；量产测试与正式回归要用治具——探针（Pogo Pin）阵列按 PCB 测试点位置布局，配合翻盖或气动结构\"一压全通\"，测试程序自动跑完给 PASS/FAIL。设计端的配套要求是**按规范留测试点**（要求见第 15 课 ICT 部分）。本课的实验用手动治具即可：一块打孔亚克力 + 测试针 + 排线，把\"每次手扶探头\"变成\"压下就测\"，重复性立刻上一个台阶。\n\n### 16.3 硬件测试体系：从\"测一下\"到\"有体系\"\n\n**研发测试分层**——产品从料到货要过五道测试关，层级越早发现问题，修复成本越低：\n\n| 层级 | 测试对象 | 典型内容 | 通过判据 |\n|:---|:---|:---|:---|\n| 来料检验 IQC | 元器件 | 容值/感量/ESR 抽测、丝印与封装核对、外观 | 抽样方案 + 器件规格书 |\n| 单板测试 | 焊好的 PCB | 上电电压轨、时钟复位、功能项、性能项 | 单板测试用例全集 |\n| 模块/整机联调 | 多板/带结构件 | 板间接口互连、时序配合、系统功能 | 联调用例 |\n| 整机测试 | 完整产品 | 全功能 + 功耗 + 温升 + 装配 + 初步环境 | 整机测试报告 |\n| 认证测试 | 送检样机 | EMC/安规/环境试验（第三方实验室） | 相应国家/国际标准 |\n\n\"来料发现一颗坏电容\"与\"整机到客户手里才发现\"，修复代价差着两个数量级——这就是分层的意义。\n\n**测试用例怎么写**——用例是测试的\"最小合同\"，四要素缺一不可：**前置条件、步骤、预期结果、实际结果**。可直接抄用的模板：\n\n| 字段 | 填写示例 |\n|:---|:---|\n| 用例编号 | TC-PWR-003 |\n| 用例标题 | 5V 轨满载纹波测试 |\n| 前置条件 | 样机 PCA_V1.2；固件 v0.3；环境温度 25 °C；示波器+电子负载已共电预热 |\n| 测试步骤 | 1) 电子负载 CC 模式接 5V 输出；2) 从 0.5 A 逐点加到 2.0 A；3) 每点稳定 30 s 后测纹波峰峰值（20 MHz 带宽限制） |\n| 预期结果 | 各负载点纹波峰峰值 ≤ 50 mV（指标来源：产品规格书） |\n| 实际结果 | 0.5 A: 18 mV；1.0 A: 24 mV；2.0 A: 41 mV |\n| 判定 | PASS |\n| 备注 | 波形截图 3 张存档 Reports/2103_PCA_V1.2/ |\n\n**新手最常见的错误是只写步骤不写预期结果**——没有预期，测完连\"过没过\"都说不清，换个执行人结论就变，用例等于白写（详见文末常见坑）。\n\n**Bug 报告规范**——Bug 单是研发沟通的正式文件，写得越完整，设计端定位越快：\n\n| 字段 | 填写示例 |\n|:---|:---|\n| Bug 编号 | BUG-2026-0117 |\n| 严重等级 | S1 致命（无法开机）/ S2 严重（主要功能失效）/ S3 一般 / S4 轻微 |\n| 标题 | 满载运行约 30 分钟后 5V 跌到 4.6 V，设备重启 |\n| 复现步骤 | 1) 固件 v0.3，负载 CC 2 A；2) 常温连续运行；3) 约 30 min 后观察复位 |\n| 复现概率 | 3/5 次 |\n| 现象描述 | 跌压前 5V 纹波从 41 mV 增大到 180 mV，怀疑输出电容温升后 ESR 变大 |\n| 日志/证据 | 串口复位日志、纹波波形前后对比、热成像照片（电容壳 71 °C） |\n| 测试环境 | PCA_V1.2 + 固件 v0.3 + 室温 25 °C + 仪器编号 |\n| 提出人/日期 | 张三 / 2026-xx-xx |\n\n**Bug 的生命周期**：新建（测试提交）→ 确认（设计端复现认领）→ 已修复（注明修复版本）→ 复测验证（测试按原步骤回归）→ 关闭/重开。测试岗要盯住两个点：**不带版本号的\"已修复\"不接收复测**（不知道该测哪一版）；复测通过后在 Bug 单里补上证据截图，否则半年后\"这问题当初怎么解决的\"就没人说得清。\n\n**版本管理与回归测试**：硬件测试的对象一直在变，任何测试结果都必须绑定**三个版本**：硬件版本（原理图/PCB，如 PCA_V1.2）+ 固件版本 + 关键器件批次。没有版本号的数据无法比较、无法追溯。改版之后（哪怕只换了一颗电容）要做**回归测试（Regression Test）**：重跑与该改动相关的用例子集 + 核心冒烟用例，确认\"旧的修好了、新的没弄坏\"。工程做法：用例集用表格管理，一行一条用例，一列一个版本，单元格填 PASS/FAIL/未执行，形成\"用例×版本\"矩阵，回归范围一目了然。\n\n### 16.4 单板与整机功能验证：按清单干活\n\n**开机自检清单**——每次上电前过一遍（第 15 课 Bring-Up 七步法的日常化精简版）：\n\n- [ ] 目检：极性器件方向、IC 一脚标记、焊点有无连锡/立碑/虚焊（标准见第 08 课）\n- [ ] 电源设置：电压正确、限流设为预估正常电流的约 1.5 倍（经验值，以调试规范为准）\n- [ ] 不上电测各电源轨对地阻抗，确认无短路\n- [ ] 上电后按电源树逐轨测电压（偏差 ±5% 内，以各芯片规格书为准）\n- [ ] 按芯片手册用合适探头或时钟输出脚确认主时钟与复位电平/时序，避免普通探头负载导致晶体停振\n- [ ] 总电流在预估值范围内（差出数倍必有隐情，先停）\n\n**从单板到整机，多出这三类检查**：装配检查（外壳合缝、螺丝到位、线缆不压不磨）；结构接地（USB/网口金属外壳到系统地的导通性，直接影响 ESD 与 EMC 表现，链第 19 课接口地处理）；人机接口（按键手感与一致性、指示灯、麦克风喇叭等结构件相关功能）。\n\n**接口逐项验证表**（各接口电路见第 11、18、12 课）——以一块带 USB/网口/HDMI/串口/TF 卡的开发板为例：\n\n| 接口 | 测试项 | 方法 | 通过标准 |\n|:---|:---|:---|:---|\n| USB 2.0 | 枚举 | 插主机看设备管理器 / lsusb | 识别出正确 VID:PID，无\"未知设备\" |\n| USB 2.0 | 大批量传输 | 拷贝大文件或跑 USB 测速工具 | 速度达到等级折算值，长时间无掉线 |\n| 网口 | 链路建立 | 插线看 Link 灯与协商速率 | 协商速率符合设计（如 1000M） |\n| 网口 | 吞吐与稳定 | iperf3 打流 5 分钟 | 带宽达标、无异常丢包 |\n| HDMI | 显示 | 接显示器逐档换分辨率 | 各档点亮、无花屏闪烁 |\n| HDMI | EDID 读取 | 读显示器 EDID | 主控能正确解析分辨率与音频能力 |\n| 串口 | 收发 | 回环或接上位机发长报文 | 波特率无误、连续大数据量无错字节 |\n| TF 卡 | 读写 | dd 写入后读出比对 | 无坏块、速度达标 |\n| GPIO/LED | 输出控制 | 逐个翻转 | 全部可控、无粘连 |\n\n**功耗测试**（mAh 与续航概念见第 01 课）——根据产品使用场景与规格选择测量状态；以下三种是便携设备的常见示例：\n\n| 状态 | 测法 | 记录 | 量级示例（便携设备） |\n|:---|:---|:---|:---|\n| 深度睡眠 | 万用表 µA 档串入，或电源电流统计功能 | 平均电流 | 几十 µA |\n| 典型工作 | 稳定工况下读电源平均电流 | 平均电流 | 100~300 mA |\n| 峰值 | 示波器 + 电流探头/采样电阻差分 + Math 标定 | 峰值电流与持续时间 | 2 A 持续 50 ms（射频发射） |\n\n续航估算 = 电池容量（mAh）× 转换效率 / 平均工作电流（mA）。特别警惕峰值电流与电池\"最大放电能力\"的关系：峰值超出电池能力会触发电池保护板关断——这是\"接电源一切正常、装电池就关机\"的经典原因。\n\n**峰值电流的土办法——采样电阻法**：没有电流探头时，在电源走线上串一只小阻值采样电阻（如 10~50 mΩ，功率与压降按电路预算选），用额定电压、带宽和共模范围合适的差分探头测电阻两端电压，按 I=V/R 换算电流。若用两只普通探头相减，两个地夹必须接安全公共参考地，不能分别夹在采样电阻的两端；还须核对各通道最大输入、共模范围和误差。注意电阻要选低感型号（合金采样电阻），普通绕线电阻的寄生电感会让尖峰读数失真。\n\n**温升测试**——发热是电子产品的头号寿命杀手：\n\n- 工具选择：K 型热电偶 + 温度记录仪（点测精确、可长时间跟踪多通道）；热成像仪（扫全板快速找热点，但发射率设置影响读数，适合\"找\"不适合\"判\"）；\n- 测试条件：置于最大功耗组合的典型工作状态；记录环境温度——**温升 ΔT = 表面温度 − 环境温度**，报告的是温升而不是绝对温度（夏天测的绝对值天然偏高，比温升才公平）；\n- 记录表模板：\n\n| 器件/位置 | 环境温度 | 表面温度 | 温升 ΔT | 器件限值 | 判定 |\n|:---|:---|:---|:---|:---|:---|\n| Buck U5 | 25.1 °C | 68.3 °C | 43.2 K | 结温 125 °C（规格书） | PASS |\n| 电解电容 C21 | 25.1 °C | 71.0 °C | 45.9 K | 105 °C 等级 | PASS（关注寿命折损） |\n\n- 经验判据：电解电容附近温度每升高约 10 °C，寿命约减半（阿伦尼乌斯经验规律，以电容规格书寿命曲线为准）；功率器件结温须按功耗、热阻、环境及瞬态计算，并依据规格书和可靠性要求留温度余量；不能把摄氏温度简单乘以 80% 作为普遍规则。\n\n### 16.5 可靠性与耐用性验证：让产品经得起岁月\n\n功能测试回答\"现在好不好用\"，可靠性测试回答\"一年以后还好不好用\"。核心思想一句话：**用加速应力，把几年的使用场景压缩成实验室里的几天**。\n\n**五类经典试验总览**（条件为常见经验起点，实际以产品规格书与相关标准如 GB/T 2423 系列为准）：\n\n| 试验 | 模拟什么 | 典型条件（经验值） | 设计端预防（反向链接） |\n|:---|:---|:---|:---|\n| 高低温工作 | 寒冬/盛夏仍需正常运行 | 低温 -20 °C 与高温 +55 °C 下各运行 2~4 h | 器件温度等级选对（第 15 课）；高温下功率器件留降额裕量 |\n| 高低温存储 | 运输与仓储极限 | -40~+85 °C 存储 24~48 h，回温后复测功能 | 塑料件与器件耐温匹配；大电解的低温 ESR 恶化 |\n| 恒温恒湿 | 梅雨季/沿海高湿环境 | 40 °C / 95%RH，48 h | 三防漆、结构密封、避免裸露相邻焊盘电迁移（第 15 课） |\n| 老化（burn-in） | 早期失效筛查 | 满载 + 45~60 °C 运行 24~72 h | 器件降额设计降低早期失效率（第 15 课） |\n| 振动与跌落 | 公路运输颠簸/搬运跌落 | 振动按运输试验谱；带包装约 1 m 六面三棱跌落 | 重器件（电解/散热器）加固定胶；BGA 区加固与支撑（第 19 课 DFM）；结构件螺丝/卡扣 |\n| 盐雾 | 户外/沿海含盐雾气氛 | 48~96 h 喷雾（户外产品才需要） | 外壳 IP 防护等级、金属件表面处理、避免异种金属直接接触 |\n\n**振动与跌落的工程细节**：振动试验分扫频正弦（找共振点）与随机振动（模拟运输路况），观察重点不只是\"试验后还能不能用\"，还要拆开看：螺丝是否松动、重器件（电解电容、散热器、屏蔽罩）焊点是否出现裂纹、结构件有无干涉磨痕。跌落试验通常带完整包装执行，跌落高度与跌落姿态（六面三棱一角）按产品定位与标准执行（消费类常见 1 m 量级，以标准为准）。设计端对应动作：重器件点胶固定、BGA 下方或四角加固、结构件留缓冲与限位（第 19 课 DFM 与结构配合）。\n\n**温箱操作要点（新手最容易翻车的地方）**：\n\n1. 样机固定与走线：线缆从温箱引线孔穿出，接外部电源与仪器，板子悬空不碰箱壁；\n2. 变温速率按试验要求设定（常见每分钟 1~3 °C，以标准为准），不要图快；\n3. **凝露（Condensation）风险**：低温阶段结束后样机表面很冷，直接开门或立刻上电，湿空气会在冷板上结露 → 短路烧板。正确做法：关箱回温到室温并保持一段时间（30 min 至数小时，以试验规范为准）再取出上电；\n4. 箱内引线测量时注意热电偶导线本身经过温度梯度区会引入误差，测点要贴牢（高温焊锡或导热胶固定）。\n\n**老化（burn-in）多久合理**：理论依据是浴盆曲线（Bathtub Curve）——产品失效率随时间呈\"高→低→高\"：早期失效期（制造缺陷集中暴露）→ 偶发失效期（平缓，正常使用寿命段）→ 耗损期（器件寿命到期）。老化就是人为让产品在早期失效期的应力下先跑一段，把\"注定早死的\"在出厂前筛掉。经验时长：消费类 24~48 h，工业/高可靠要求 72 h 或更长，常叠加热应力（45~60 °C）与满载电应力。注意**不是越久越好**——超过早期失效期后继续跑只是烧电费、消耗产品寿命（以公司可靠性大纲与行业惯例为准）。\n\n**MTBF 与加速老化的直觉**：MTBF（Mean Time Between Failures，平均无故障时间）是统计指标，来自失效率模型与现场数据，**它是\"平均值\"，不是\"每台都能活这么久\"**。加速模型的工程直觉：对于受温度激活的特定失效机理，Arrhenius 模型可用活化能和绝对温度估算加速因子；模型参数与失效机理必须有依据，且高温不得引入新的失效机制。不能把“每升高 10 °C 寿命减半”或“48 小时等效常温数周”推广到所有器件和产品。\n\n**试验后必须复测**：每项环境试验结束后，回到常温重新执行功能测试（至少核心用例子集），并对比试验前后的功耗、精度等关键指标漂移——\"试验中挂掉\"和\"试验后性能漂移超标\"同属不通过，后者更隐蔽，往往指向器件级损伤（如电容 ESR 恶化，可用 16.1.3 的 LCR 手段复核）。\n\n**可靠性试验的\"前后对比\"记录表**（每个试验都要有，否则\"损伤\"无从量化）：\n\n| 记录项 | 试验前 | 试验后 | 判定 |\n|:---|:---|:---|:---|\n| 核心功能用例（抽 5 条） | 全 PASS | 全 PASS | 无回归 |\n| 典型工作电流 | 182 mA | 185 mA | 漂移约 1.6%，可接受 |\n| 5V 轨纹波 | 24 mV | 27 mV | 趋势正常，持续跟踪 |\n| 关键器件温升 | 43.2 K | 43.8 K | 无异常恶化 |\n| 外观/结构 | 无异常 | 螺丝轻微松动（附照片） | 提结构端改进项 |\n\n### 16.6 EMC 预测试与整改联动：别等认证才发现问题\n\n第 19 课讲过 EMC 整改四步：**定位 → 源头 → 路径 → 受体**。本节补上\"定位\"环节的实操手段——近场探头 + 频谱仪，让你在送认证实验室之前心里有数，省钱省时间。\n\n**近场探头套件常识**：一套通常包含一大一小两个磁场环探头（H 场，耦合电流辐射，对应高频电流环路）与一个电场探头（E 场，感应电压/高阻节点辐射）。规律是**探头越小、分辨率越高、灵敏度越低**——所以先用大环\"找区域\"，再用小环\"定点\"。\n\n**近场探头（near-field probe）+ 频谱仪定位辐射源流程**：\n\n1. **频谱仪初始设置**：频段先设 30 MHz~1 GHz（辐射骚扰主战场，具体频段与限值以对应标准为准）；RBW 设 100 kHz 量级加快扫描；**打开 20~30 dB 输入衰减**保护前端；显示开 Max Hold（最大保持），便于捕捉间歇性发射；\n2. **粗扫**：用大环磁场探头（灵敏度高、分辨率低）贴着板面上方几厘米缓慢平移，观察频谱冒尖的频点，记录下来；\n3. **对号入座**：超标频点与板上时钟/开关频率对号——峰正好落在某时钟的 N 次谐波上，是最重要的破案线索（第 19 课干扰源排序）；\n4. **精确定位**：换小探头（分辨率高、灵敏度低）贴近板面毫米级距离逐区域扫，信号最强的位置就是辐射源；沿一条长走线扫过去，还能看出哪里\"漏\"得最凶（缺口、跨分割、无回流路径的段落）；\n5. **记录基线**：频点、幅度读数（dBµV/dBµA）、探头位置照片——整改前没有基线，整改后就说不清\"降了多少\"；\n6. **进入整改循环**：按第 19 课四步走——先降源头（源端串小电阻缓边沿、降驱动强度、开展频），再断路径（磁珠/电容/共模电感/屏蔽罩/地过孔缝合），每改一步复测对比，直到留出足够余量。注意：近场读数与暗室远场测量没有严格定量关系，只做相对比较与定位用；经验上预测试要留出数 dB 余量，正式结论以认证实验室为准。\n\n**传导骚扰（Conducted Emission）初测概念**：传导骚扰指沿电源线跑出去的骚扰（经验上以 150 kHz~30 MHz 频段为主，呼应第 19 课\"30 MHz 上下分传导与辐射\"）。正式测量需要 LISN（Line Impedance Stabilization Network，人工电源网络）+ EMI 接收机，在屏蔽环境进行；研发阶段的定性初测可以用\"电流探头套在电源线上 + 频谱仪\"看相对趋势——重点看整改前后有没有明显下降。定位到传导超标时，优先检查电源入口滤波链路（X/Y 电容、共模电感是否漏贴/虚焊/参数缩水，第 19 课）。\n\n### 16.7 信号完整性实测：把第 19 课的理论落到屏幕上\n\n**眼图（eye diagram）实测步骤**——第 19 课讲了眼图\"眼睛张开程度\"综合反映抖动、噪声与码间串扰（ISI），实操如下（以示波器自带眼图/余辉功能为例，菜单名称以示波器说明书为准）：\n\n1. 确认设备：按信号速率、边沿时间、测量精度及接口规范选择示波器与探头的带宽和采样率；不能仅按重复基频估算。差分信号优先选满足差分电压、共模范围和带宽要求的差分探头；\n2. 接测：依探头说明书将差分输入接到测试点，控制连接长度及负载；普通接地式探头的地夹只能接安全公共地，不可夹到差分信号线上；\n3. 打开余辉（Persistence）设为无限余辉，或直接进入眼图分析模式；\n4. 同步方式：仪器有时钟恢复（CDR）功能则开启；数据边沿触发可作定性观察，但不能替代规定时钟恢复方式下的标准一致性测试；\n5. 累积样本：连续采集上千到数万个比特，让抖动与 ISI 充分暴露——样本太少眼图是\"假漂亮\"；\n6. 判读指标：眼高（Eye Height）大 → 噪声容限足；眼宽（Eye Width）大 → 抖动小；叠加模板（Mask Test）自动判 PASS/FAIL；交叉点位置偏移与眼图不对称，指向端接或偏置不当（第 19 课 SI）；\n7. 前后对比：按第 19 课端接计算串入源端电阻，整改前后各截一张眼图——\"眼睛\"明显更张开，就是最有说服力的作业证据。\n\n**上升沿（Rise Time）测量**：时基拉到完整边沿占屏约 1/3，垂直幅度占屏 2/3，用光标或自动参数测 10%~90% 时间。两个干扰因素先排除：探头地线环路会串入振铃让沿\"看着变差\"；探头带宽不足会滤波让沿\"看着变缓\"。想扣掉仪器影响，用经验公式：实际沿² ≈ 测得沿² − 测量系统沿²（系统上升时间可由示波器带宽折算，以说明书为准）。\n\n**阻抗与反射的实测观察**：专业工具是 TDR（时域反射计）——向线路发一个快沿，遇阻抗突变产生反射，从反射的极性与延时反推各段阻抗与不连续点位置，线缆/连接器/过孔问题都现形。没有 TDR 时的替代实验：信号发生器输出方波（沿越快越好），经一段足够长的走线或同轴电缆到端接电阻，用正确接地的探头观察源端与末端（先核对信号和仪器额定范围）——阻抗不匹配处的反射波来回叠加，表现为特征延时处的台阶与振铃；若从源端观察到反射台阶，时间包含往返传播：不连续点距离约等于往返时间差 × 传播速度 ÷ 2；还需扣除线缆和仪器延时，具体看测量参考点。动手对比：源端分别串 0 Ω 与 33 Ω（经验起点，按第 19 课阻抗计算定值），观察末端振铃幅度的变化，反射与端接的概念就从公式变成了手感。\n\n### 16.8 硬件测试工程师方向：一份能落地的岗位地图（链第 24 课岗位画像）\n\n硬件测试岗是硬件大类里入行门槛相对友好、又极练基本功的方向——很多资深硬件工程师是从测试岗起步的。以下是第 24 课岗位画像在测试方向上的展开。\n\n**测试岗技能 Checklist**（对照自查，简历技能栏可直接按此组织）：\n\n| 能力项 | 达标要求 |\n|:---|:---|\n| 仪器操作 | 五件套 + LCR 电桥 + 频谱仪独立操作，熟练设触发/解码/FFT |\n| 用例与报告 | 能写用例、执行、提规范 Bug、写完整测试报告（本课模板） |\n| 电路理解 | 能按第 15 课六步法看懂原理图电源树与主控框架，能按电路原理推测故障点 |\n| 调试定位 | 掌握二分法/对比法/替换法/最小系统剥离（第 15 课调试方法论） |\n| 标准常识 | 知道环境试验（GB/T 2423 类）、EMC 基础标准的存在与适用范围（不要求背条文） |\n| 焊接动手 | 会换料返修、飞线改板（第 08 课），测试岗天天要为验证而改板 |\n| 自动化加分 | 会用 Python + SCPI/VISA 控制仪器跑自动化测试，把重复测量脚本化 |\n\n**测试报告写作结构**（可直接抄用的骨架，五个章节一个都不能少）：\n\n| 章节 | 内容要点 | 写法建议 |\n|:---|:---|:---|\n| 摘要 | 一段话说清：测什么对象、跑了多少项、通过率、遗留问题与风险 | 5 行以内，写给领导看的，先结论后细节 |\n| 测试环境 | 硬件/固件/器件批次三版本、仪器清单与编号、环境条件 | 表格化，可追溯 |\n| 测试项目与结果 | 按用例组给结果（标注用例编号），失败项展开现象与分析 | 主体章节，表格 + 关键波形/照片 |\n| 问题与风险 | 未通过项汇总：严重等级、责任人、修复计划、复测状态 | 表格化，闭环跟踪 |\n| 结论与建议 | 是否达到可发布/可量产状态；对设计端的具体改进建议 | 结论要敢下，建议要具体到器件与参数 |\n\n**从测试岗转设计岗的路径**——测试岗不是终点，而是\"带薪练级\"：\n\n1. **积累期（0~2 年）**：吃透仪器与测试体系（本课全部内容），大量接触失效案例，建立\"现象 → 机理 → 定位\"的电路直觉——失效分析经验是测试岗独有的财富；\n2. **转化期**：在 Bug 分析中主动深挖设计原因（为什么会温升超标、为什么 EMC 不过——用第 19、15 课的知识反推设计缺陷），在测试报告里写设计改进建议，让设计端看见你的分析能力；\n3. **补齐期**：系统补原理图与 PCB 设计能力（回修本课程 01~14 课的完整链条），争取参与改版的局部模块设计（从简单子电路入手，如电源、接口）；\n4. **面试话术**：测试出身的设计工程师，画图时会天然考虑可测性（DFT）与可靠性裕量——这是纯设计路线工程师的普遍短板，也是你的差异化标签（简历与面试准备见第 24 课）。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 器材 | 完成标准 |\n|---|---------|------|---------|\n| 1 | 给一块开发板写 10 条测试用例并执行 | 开发板、基础仪器 | 用例含前置/步骤/预期/实际四要素，执行后有 PASS/FAIL 判定与截图 |\n| 2 | 用电子负载测 USB 输出 5V 在 0~2A 的压降曲线 | USB 转接线、电子负载、万用表 | 压降-电流曲线图 + 标出最大压降点并估算等效内阻 |\n| 3 | 用 LCR 表测 10 颗同型号电容，记录 ESR 分布 | LCR 电桥、10 颗电容 | 记录表 + 均值/极差统计，标出离群点并给出来料判定 |\n| 4 | 手机充电器功耗与温升简易测试 | 充电器、电子负载、点温计或热成像 | 空载/半载/满载三态功耗表 + 满载 30 min 温升记录表 |\n| 5 | 用脉宽触发抓一次电源毛刺并分析来源 | 示波器、运行中的板子 | 触发设置截图 + 毛刺波形 + 幅度/宽度/周期性分析 |\n| 6 | 近场探头 + 频谱仪扫一块板，定位最强辐射点 | 频谱仪、近场探头套装 | 频点/幅度记录 + 位置照片 + 与板上时钟频率的对号分析 |\n| 7 | 给一块板实测眼图：端接整改前后各一张 | 带余显功能的示波器、高速信号板 | 两张眼图对比 + 眼高/眼宽读数与结论 |\n| 8 | 按本课模板写一份完整测试报告（汇总练习 1~4 数据） | — | 报告含摘要/环境/项目/结论/建议五章节，版本信息齐全 |\n\n## ✅ 自测清单\n\n- [ ] 我能说出电子负载 CC/CV/CR/CP 四种模式各自的含义与典型场景\n- [ ] 我能完整走一遍 Buck 拉载测试：接线、设斜率、逐点记录、算效率、测纹波、画曲线\n- [ ] 我知道 LCR 电桥测电解/陶瓷电容分别用什么频点，判电容老化看 ESR，判电感饱和看感量下跌 20%~30% 的经验判据\n- [ ] 我能说清示波器与频谱仪的区别（时域 vs 频域）以及\"未知信号先加衰减\"的原因\n- [ ] 我会用脉宽触发抓毛刺，会用示波器解码 I2C/UART 并定位\"无 ACK\"类问题\n- [ ] 我能说出测试台面三分区、地环路的成因与处理、防静电三件套（含腕带串 1 MΩ 电阻的安全含义）\n- [ ] 我能背出研发测试五分层（来料→单板→模块联调→整机→认证）与各层典型内容\n- [ ] 我能默写测试用例四要素，并解释\"没写预期结果\"为什么致命\n- [ ] 我能按模板写出含复现概率与日志证据的 Bug 报告，并说明回归测试的组织方法\n- [ ] 我能列出功耗三态（睡眠/典型/峰值）的测法与用途，并做续航估算与电池峰值能力核对\n- [ ] 我知道温升报告的是 ΔT 而不是绝对温度，以及\"温度每升 10 °C 电解电容寿命约减半\"的经验规律\n- [ ] 我能说出五类可靠性试验各自模拟什么，以及温箱测试的凝露风险与正确操作顺序\n- [ ] 我能解释 burn-in 的理论依据（浴盆曲线）与\"多久合理\"的工程取舍，知道 MTBF 是统计平均值\n- [ ] 我能说出近场探头定位辐射源的六步流程，并把它接回第 19 课整改四步的\"定位\"环节\n\n- [ ] 我知道示波器眼图怎么测，上升沿与反射怎么实测观察\n- [ ] 我能默写测试报告的章节结构，并说清测试岗转设计岗的路径\n\n## ⚠️ 新手常见坑\n\n1. **电子负载直接 CC 大电流拉载、不带斜率**：从 0 A 一档直跳 2 A，瞬间阶跃等于给电源一个电流冲击，环路响应不及就触发过流保护或瞬间跌压，误判成\"电源不行\"。对策：设拉载斜率（Slew Rate）或改小步进递增，每点进入稳态后再读数（设置方法以负载说明书为准）。\n2. **频谱仪不加衰减器接大信号**：把电源线、功放输出直接接进频谱仪，前端混频器过载甚至烧毁，是最贵的一类新手事故。对策：先确认仪器允许的最大输入功率、直流电压、频率和衰减器额定值；不明信号不得直接接入，合适的衰减和隔直措施须按计算与设备说明书选择。\n3. **示波器探头 1X/10X 忘切换**：探头拨在 1X、通道菜单设在 10X（或反过来），读数直接差十倍；而且 1X 档带宽通常只有几 MHz 量级，测高速信号全是假的。对策：养成\"探头衰减档与通道设置必须核对\"的习惯，换探头后先用示波器自带的校准方波打一发验证。\n4. **温箱测试不注意凝露**：低温段结束立刻开箱取板上电，冷板遇湿空气结露导致短路烧机。对策：回温到室温并保持干燥一段时间后再上电；跨温区试验计划里显式预留干燥时间（以试验规范为准）。\n5. **测试用例没写预期结果**：只有步骤没有预期，测完无法判 PASS/FAIL，换个人执行结论就变，用例失去复现价值。对策：预期结果必须量化（数值/现象/引用标准），写不出预期说明指标没搞清楚，先回去读产品规格书。\n6. **把\"一次通过\"当\"稳定复现\"**：Bug 只出现一次就下结论，或\"改完之后再没出现\"就关单——偶发问题必须用概率统计（N 次中出现 M 次）加应力条件记录说话。对策：复现概率写进 Bug 单；修复验证要跑足够次数与时长，回归测试留档。\n\n## 📚 延伸学习\n\n- 标准族：GB/T 2423（环境试验系列）通读目录，知道低温/高温/湿热/振动/盐雾各有对应部分；EMC 相关基础标准看目录与适用范围即可，不必背条文\n- 手册：你手上每台仪器的说明书——重点读\"安全注意事项\"与\"测量误差/不确定度\"章节（信号发生器的 50 Ω 源阻抗、频谱仪最大输入电平、电子负载斜率设置、LCR 的频率选择）\n- 书籍：《电子测量与仪器》类教材补仪器原理；《可靠性工程基础》类教材的\"浴盆曲线/加速试验/MTBF\"两章\n- 工具路线：Python + PyVISA/SCPI 仪器自动化入门，试着用脚本控制万用表自动记录一小时的电流曲线——这是测试岗自动化加分项的第一步\n- 搜索关键词：`电子负载 CC CV CR CP 模式 区别`、`LCR 电桥 ESR 电容老化 判断`、`电感 饱和 感量 下跌 偏置电流`、`近场探头 频谱仪 EMI 定位 流程`、`示波器 眼图 测量 步骤`、`脉宽触发 抓毛刺`、`高低温试验 凝露 注意事项`、`burn-in 老化 浴盆曲线 时长`、`MTBF 加速老化 Arrhenius`、`LISN 传导骚扰 预测试`、`硬件测试用例 模板`、`GB/T 2423 环境试验 系列`","taskSignature":"bc193e8dded4f891ca18c31470f44b0c2cf42ef5486cd81407b0e3a129da488e","taskCount":22},{"id":"17","title":"第 17 课 · 经典开源工程解读实战","short":"经典开源工程解读实战","stage":3,"diff":3,"prev":"第 07、09 课；入门案例配合第 14 课，高速案例配合第 18、20、21 课","optional":false,"md":"## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 掌握\"解读五步法\"：拿到任何一块板子的公开资料，知道按什么顺序把它读透\n2. 独立解读 Arduino Uno（2 层）、OrangePi Zero（H2+，与 H3 同族）、树莓派 CM4IO（4 层底板）、BeagleBone Black（6 层）四块经典板\n3. 会用立创开源平台（oshwhub）搜索、在线查看、克隆开源工程\n4. 养成\"临摹式学习\"习惯：每读完一块板，产出一页可借鉴清单，并反哺自己的项目\n5. 理解开源硬件协议（CC BY-SA 类），避免商用踩坑\n\n## 📖 正文\n\n从简单电路和首板开始，就可以换个方向：**读别人的板子**。书法临帖、绘画临摹，硬件工程师的成长同样靠\"临摹\"——成熟产品的每一处布局、每一个器件选型，都是别人踩过坑之后留下的答案。读懂一块经典板的收获，往往大于自己闷头画三块新板。\n\n### 17.1 解读五步法：拿到资料先做什么\n\n无论解读哪块板，都按这个固定顺序走（配合第 15 课的原理图解读六步法使用，那套方法针对单张原理图，这套针对整块板）：\n\n| 步骤 | 做什么 | 产出 |\n|:---:|:---|:---|\n| ① 资料收集 | 下载原理图 PDF / PCB 源文件 / 数据手册 / 板卡文档，确认版本号（Rev 几） | 资料清单 |\n| ② 电源树 | 从电源入口开始，画出\"输入 → 各路 DCDC/LDO → 各电压轨 → 供给谁\"的树 | 手绘电源树 |\n| ③ 主控最小系统 | 找到主芯片，检查供电/晶振/复位/启动配置/调试口五大件 | 最小系统清单 |\n| ④ 关键模块 | 按第 11、18、12 课的模块知识逐个看：接口、存储、电源细节 | 模块笔记 |\n| ⑤ 布局布线观察 | 打开 PCB 源文件，看分区、叠层、特殊处理（等长/包地/散热） | 可借鉴清单（至少 10 条） |\n\n一个心法：**先带着问题看，再带着答案走**。看每个模块前先问\"如果是我来画，我会怎么摆\"，再看别人怎么摆——差异处就是你的成长点。\n\n### 17.2 案例一：Arduino Uno Rev3——2 层板\"看图识字\"\n\n**资料获取**：[Arduino Uno Rev3 官方硬件页](https://docs.arduino.cc/hardware/uno-rev3/)（原理图 PDF 与 EAGLE 源文件均可免费下载）。\n\n**为什么从它开始**：公开资料较完整，适合练习阅读电源、复位与接口。你第 14 课画的 STM32 最小系统可与它对照；具体板层数应在所选版本 PCB 或制造资料中核对。\n\n**解读要点**（按五步法走）：\n\n1. **电源树**：先将 DC 座、USB 入口分别追到 5V 轨，再追踪 3.3V 稳压支路；USB 支路还有保险丝和 MOS 电源选择，不要把两路都画成同一只二极管。稳压芯片标称电流不能直接等同板上 3.3V 排针的可用电流，应按所用板卡官方规格和负载条件核对。参见 [UNO R3 官方原理图](https://docs.arduino.cc/resources/schematics/A000066-schematics.pdf)。\n2. **主控最小系统**：检查 ATmega328P 的供电去耦、16 MHz 陶瓷谐振器和复位网络；USB 接口用的 ATmega16U2 的时钟应作为另一支路单独查看，不要把它的电容接法误套到主控。参见 [UNO R3 官方资料](https://docs.arduino.cc/hardware/uno-rev3/)。\n3. **隐藏的第二个 MCU**：板上还有一颗 ATmega16U2 做 USB 转串口——**一颗芯片专职做接口转换**，这是\"USB 转串口\"功能模块的完整参考（对照你第 14 课用的 CH340）。\n4. **布局观察**（打开 EAGLE 文件）：电源区在板一角、接口全在板边、时钟器件靠近主控（UNO 主控使用陶瓷谐振器，以原理图为准）——分区思想与我们第 14 课讲的一致，看大厂怎么执行得更彻底。\n5. **可借鉴清单示例**：排针丝印把引脚功能印全（用户不用翻手册）、模拟电源与数字电源用磁珠隔离、USB 接口附近的 ESD 器件、安装孔的禁布区。\n\n### 17.3 案例二：OrangePi Zero——H2+ 原理图精读（对口第 20 课）\n\n**资料获取**：香橙派官网下载中心免费公开各板原理图 PDF，搜索\"OrangePi Zero schematic\"直达；立创开源平台也有网友的还原工程可对照（[oshwhub.com/explore](https://oshwhub.com/explore) 搜\"OrangePi\"）。\n\n**为什么读它**：第 20 课的 4 层板项目用的就是全志 H3，该板使用 H2+，并非 H3 官方参考设计；可对照学习同系列工程的模块组成，芯片引脚、电源和启动资料必须分别核实。\n\n**解读要点**：\n\n1. **电源树**：5V 输入 → 多路 DCDC（内核/DDR/IO 各自独立），画出电压轨表后与第 20 课 12.1 节的电源表对比——你会发现我们课程里的方案就是这类真实产品的典型做法。\n2. **DDR3 区**：按具体 Zero 版本的原理图确认内存颗粒数量、位宽、型号及其与 H2+ 的连接；若找到匹配版本且有权使用的 PCB 源文件，再观察布局和走线。不能把 H3 的引脚或时序约束直接当作 H2+ 的规范。\n3. **启动介质**：TF 卡 / SPI NOR 的启动选择电路（Zero 无 eMMC，eMMC 是 H3 家族其他板的启动介质），理解\"FEL 救砖\"按键在原理图上的位置（第 20 课讲过的概念落地）。\n4. **网口**：先在所选版本原理图中确认 PHY、网络变压器、RJ45 与保护电路，再与第 11 课对应内容比较；是否外挂 PHY 取决于具体 SoC 和方案，不能按速率一概而论。\n5. **练习任务**：做一个三列对比表——\"OrangePi Zero 的做法 / 我第 20 课的做法 / 差异原因猜测\"，这个表就是你的成长记录。\n\n### 17.4 案例三：树莓派 CM4IO——大厂 4 层底板规范\n\n**资料获取**：[树莓派 CM4IO 官方设计文件](https://pip.raspberrypi.com/categories/1210-design-files)——官方直接公开 CM4IO 底板的 **KiCad 源文件**（CM5IO 同样开源），这是极少数\"国际大厂完整开源 EDA 源文件\"的案例。\n\n**为什么读它**：学的不只是电路，更是**大厂的工程规范**——怎么命名、怎么画图、怎么留版本痕迹。\n\n**解读要点**：\n\n1. **架构思想：核心板 + 底板**：CM4 是计算模块（CPU/DDR/eMMC 集成在一条小板上），CM4IO 是底板。**把\"变\"的部分（核心板）与\"不变\"的部分（接口）分离**，这是产品平台化的经典架构（第 21、22 课的核心板方案同源）。\n2. **原理图分页规范**：大厂原理图按功能分页（电源页/USB 页/HDMI 页…），每页有标准图框、版本号、审签栏、修改记录——对比你自己的原理图，把这些规范搬过来，作品集立刻上一个档次。\n3. **电源树**：从官方原理图的 12V 主输入开始，分别追踪板上的转换电源、CM4 供电和各接口分支；是否具备开关或限流由具体支路决定。\n4. **接口大合集**：USB Hub、双 HDMI、PCIe、以太网、摄像头/显示排线——对照第 11、18、12 课逐个模块\"验收\"自己掌握程度。\n5. **PCB 观察**（打开 KiCad 文件）：4 层叠层怎么排、接口 ESD 阵列的摆放、差分对的处理、大片 GND 铺铜的完整度。\n6. **社区参考**：最小化载板 [cmio](https://github.com/deltabeard/cmio)（开源 KiCad）适合通读全部源码——先读小的，再读官方的。\n\n### 17.5 案例四：BeagleBone Black——6 层工业级精髓\n\n**资料获取**：[github.com/beagleboard/beaglebone-black](https://github.com/beagleboard/beaglebone-black)（包含多个版本的设计资料与制造文件）；具体文件版本、格式和许可需逐项核对。认证状态应按具体产品与版本在 OSHWA 查询，不能推广到整个系列。\n\n**为什么读它**：6 层工业级经典板，DDR3、PMU、双扩展连接器一应俱全，是第 21、22 课的\"实物答案册\"。\n\n**解读要点**：\n\n1. **叠层与回流**：找到所选版本的制造文件和叠层图，记录每层用途、介质和参考平面，再结合信号位置分析回流；不要先假设每个信号层都与地平面相邻。\n2. **DDR3 等长**：在 PCB 文件里找到蛇形绕线最密集的区域，量一量同组误差（EDA 里看网络长度表）——第 18、21 课的等长表在真实产品里的样子。\n3. **PMU 电源管理**：TI PMU 芯片的多路输出与时序管脚——第 10 课 PMU 小节的展开实物。\n4. **工程细节清单**：检查具体接口是否有 ESD/TVS、测试点、极性和一脚标记、安装孔禁布及连接器固定方式；逐项记录证据和适用条件，不能预先假设全板都有相同防护。\n5. **开源硬件认证（OSHWA）**：查找具体型号、版本及认证状态，区分认证要求、硬件设计文件的许可证和软件许可证；各自条款以原始资料为准。\n\n### 17.6 立创开源平台使用指南\n\n[oshwhub.com](https://oshwhub.com)（立创开源硬件平台）是国内最大的开源硬件库，与我们第 07 课的工具链无缝衔接（立创EDA 工程在线打开）。\n\n**使用技巧**：\n\n| 场景 | 怎么做 |\n|:---|:---|\n| 找参考 | 按平台搜（\"STM32\"\"RK3588\"\"GD32\"），按收藏数/浏览量排序，优先选文档齐全、版本多的工程 |\n| 看工程 | 点开即在线查看原理图与 PCB，无需下载——把五步法直接用在网页里 |\n| 克隆 | \"克隆工程\"到自己的立创EDA 账号，可以逐层翻看、量尺寸、看网络（比 PDF 强得多） |\n| 跟着做 | 优先选立创官方系项目：**梁山派 GD32F470 开发板**（配全套视频教程与文档），是中文世界最好的\"跟做\"项目 |\n| 大板参考 | 搜 RK3588 底板类工程（如 tb_rk3588），对照第 22 课的 8 层板方案 |\n\n**开源协议注意**：各工程及其硬件、软件、图片可能采用不同许可。学习、修改和商用前，应核对具体文件许可、署名与分享要求；许可允许范围内是否需要额外授权取决于协议和用途，这是工程师的法律底线。\n\n### 17.7 临摹实战任务（本课的最终产出）\n\n从上述素材中选**一块与你下一步目标最相关的板**（做 2 层板选 Uno/梁山派，做 H3 类平台选 OrangePi Zero，做底板选 CM4IO，做多层大板选 BBB），完成四件产出：\n\n1. 手绘电源树一张（从输入到每一条电压轨）\n2. 模块清单一页（每个模块标\"我懂/半懂/不懂\"，不懂的回到对应课程补）\n3. 可借鉴清单 10 条（布局/布线/器件选型/文档习惯各占几条）\n4. 重画一个模块：挑一个你\"半懂\"的模块，用你自己的 EDA 重画原理图 + 布局，与原板对比\n\n这四件产出放进你的作品集，比\"我又看了一块板\"有说服力得多。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 下载 Arduino Uno 原理图，手绘电源树 | 电源树含输入两路合流、5V/3.3V 轨及去向 |\n| 2 | OrangePi Zero 与第 20 课方案对比表 | 三列表格（它的/我的/差异原因），≥8 行 |\n| 3 | 打开 CM4IO 的 KiCad 源文件，找出版框/版本/审签规范 | 截图并整理成\"我可以抄的 5 条规范\" |\n| 4 | 在 BBB 的 PCB 文件里找到 DDR3 蛇形绕线区并测量同组等长误差 | 截图 + 误差数值（对照第 21 课等长表） |\n| 5 | 注册立创开源平台，克隆一个 STM32 高收藏工程在线研读 | 完成五步法笔记 |\n| 6 | 完成 17.7 的临摹实战任务（四件产出） | 作品集新增一页\"开源工程解读\" |\n\n## ✅ 自测清单\n\n- [ ] 我能背出解读五步法并说明每步的产出物\n- [ ] 我知道 Uno 上第二颗 MCU（ATmega16U2）的作用，并 能对照自己的 CH340 方案说差异\n- [ ] 我能说出\"核心板+底板\"架构解决什么问题\n- [ ] 我看大厂原理图时能指出图框/分页/版本/审签四类规范\n- [ ] 我知道 OSHWA 认证与 CC BY-SA 协议对\"学习\"和\"商用\"的不同含义\n- [ ] 我会在立创开源平台按收藏数筛选、在线查看、克隆工程\n- [ ] 我建立了自己的\"可借鉴清单\"积累习惯\n\n## ⚠️ 新手常见坑\n\n1. **只看 PCB 不看原理图**：布线是表象，电路才是因果。永远先读原理图（五步法前四步），最后才看布局布线。\n2. **照抄参数不理解场景**：别人的线宽/电容值/滤波配置与它的电流、成本、EMC 需求绑定，抄之前先问\"为什么\"。\n3. **忽略版本号**：拿到 Rev A 的资料去分析 Rev C 的板（或反过来），处处对不上。读图第一步先确认版本。\n4. **忽略具体许可证**：CC BY-SA 4.0 允许商业使用，但分享改编材料时有署名及相同方式共享等条件；具体是否构成适用的改编材料、硬件文件与软件的许可范围，应按实际文件和使用方式核对，不能把“商用”直接等同于“违规”。参见 [Creative Commons 条款说明](https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans)。\n5. **下载了源文件不打开**：EAGLE/KiCad/OrCAD 源文件才是宝藏（能量尺寸、看网络），只看 PDF 等于只看封面。\n6. **贪多不消化**：一周精读一块板 > 一天扫十块板。每块板必须有产出物（电源树/清单），否则等于没读。\n\n## 📚 延伸学习\n\n- 官方文档：各板卡的 Datasheet / Hardware User Manual（树莓派设计文件库与 BeagleBoard 文档目录本身就是\"工程文档规范\"的教材）\n- 立创开源平台星火计划榜单：[oshwhub.com/explore](https://oshwhub.com/explore)，每月关注新上榜工程\n- 搜索关键词：`Arduino Uno 原理图 解读`、`CM4IO 底板 设计分析`、`BeagleBone Black 硬件分析`、`开源硬件 OSHWA 认证`\n- 配套课程：第 15 课原理图解读六步法（单图精读）与本课五步法（整板解读）配合使用","taskSignature":"0c957c3c629c94faa67b7e3dde57b1540fb8b7e539fb89db87faa40293ecdb7a","taskCount":7},{"id":"18","title":"第 18 课 · 存储模块","short":"存储模块","stage":4,"diff":4,"prev":"第 11 课 · 接口模块","optional":false,"md":"存储模块是\"看懂主流开发板\"的最后一道门槛，也是新手与合格工程师的分水岭：**DDR 走线是整块板子上规则最多、最容易翻车的区域**。这一课我们把 SDRAM 到 DDR4 的演进讲清楚，把 DDR 布局布线的核心规则一条条落到可执行的数字上，最后学会\"看懂\"任何一块开发板的 DDR 区域。\n\n## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 说出 SDRAM → DDR → DDR2 → DDR3 → DDR4 每一代的电压、速率与关键新特性，以及为什么布线难度逐代递增；\n2. 解释时钟（CK/CK#）、数据选通（DQS）、地址/命令/数据总线、ODT、端接这几个 DDR 核心概念各自的作用；\n3. 区分 T 型、菊链、Fly-by、点到点四种拓扑（topology）结构，说明各自适用场景；\n4. 按\"地址/命令/控制一组、DQ/DQS 按字节组\"的分组方式制定 DDR 等长规则表，并给出经验误差值；\n5. 说明 VTT、VREF 电源的处理方式与 VREF 走线防护要点；\n6. 拿到一块主流开发板，能通过观察颗粒摆位、VTT 电阻和蛇形走线，判断它的 DDR 拓扑与分组策略。\n\n## 📖 正文\n\n### 18.1 存储器演进概览与关键概念\n\n#### 从 SDRAM 到 DDR4：一张表看懂\n\n| 代际 | 核心电压 | 预取（prefetch） | 典型数据率 | 关键新特性 | 布线难度 |\n|:---|:---:|:---:|:---|:---|:---:|\n| SDRAM | 3.3V | 1n | 66~166 MT/s | 同步接口，单倍速率 | ⭐⭐ |\n| DDR | 2.5V | 2n | 200~400 MT/s | 时钟上下沿都传数据（Double Data Rate） | ⭐⭐⭐ |\n| DDR2 | 1.8V | 4n | 400~800 MT/s | 引入 **ODT 片上端接**、CAS 更低 | ⭐⭐⭐ |\n| DDR3 | 1.5V | 8n | 800~2133 MT/s | **Fly-by 拓扑 + 写平衡（write leveling）** | ⭐⭐⭐⭐ |\n| DDR4 | 1.2V | 8n | 1600~3200 MT/s | Bank Group、更严时序、CA 训练 | ⭐⭐⭐⭐⭐ |\n\n规律很直观：**速率每翻一倍，时序余量（timing margin）就砍一半，布线等长与阻抗要求就严一档**。SDRAM 时代 2 层板随手布；DDR3 单颗点到点 4 层板能做；DDR4 基本就是 6~8 层板的专业活。\n\n#### 必须先弄懂的几个概念\n\n读任何 DDR 布线指南之前，这几个词必须过关（中英对照）：\n\n- **时钟（Clock，CK/CK#）**：差分时钟，全总线的时序基准。时钟是地址/命令等时序关系的重要参考；数据通常以各自字节组的 DQS 为基准，具体按芯片指南；\n- **数据选通（DQS，Data Strobe）**：与数据（DQ）**成对出现的源同步（source synchronous）选通信号**，接收方靠 DQS 的边沿来采样 DQ。每 8 位 DQ（一个字节组 byte lane）配一对 DQS（DDR3 起为差分 DQS/DQS#）。**DQS 与 DQ 的偏移 = 采样窗口的直接损失**，所以它们是全总线等长要求最严的一组；\n- **地址/命令/控制总线（Address/Command/Control）**：RAS/CAS/WE/CS/CKE/ACT 加地址线，**多颗颗粒共享一条总线**（都挂在同样的地址上），因此诞生了 T 型、Fly-by 等拓扑问题；而 DQ/DQS 是每颗独享的点到点连接；\n- **ODT（On-Die Termination，片上端接）**：颗粒芯片内部集成的可编程端接电阻，用于吸收数据线上的反射，DDR2 起引入，DDR3 广泛依赖——**数据线端接靠 ODT，地址线端接靠外部 VTT**（见 18.2）；\n- **端接（Termination）**：高速信号到达总线末端后防止反射的措施。常见两种：串联源端（发送端串阻）、并联端接（末端电阻拉到 VTT）。端接方式由存储器规格书（如 JEDEC SSTL）与主控手册共同决定；\n- **写平衡（Write Leveling）**：DDR3 与 Fly-by 拓扑配套的训练机制——因为 Fly-by 让各颗颗粒收到时钟的时间天然不同，主控在上电训练阶段逐颗补偿延迟差。**这就是 Fly-by 敢\"不等长\"的底气**。\n\n### 18.2 DDR 布局布线核心规则\n\n这是本课的重头戏。按\"布局 → 拓扑 → 分组等长 → 阻抗 → 参考层 → 电源\"的顺序展开。\n\n#### 18.2.1 布局：先摆好位，布线就成功了一半\n\n- **颗粒紧贴主控**：DDR 颗粒与主控内存控制器引脚的距离经验值控制在 500~1000 mil（12~25 mm）量级，越近时序余量越大；\n- 单颗颗粒放主控同侧最近处；两颗放主控两侧对称或后方并排——**怎么摆由拓扑决定，先定拓扑再摆件**；\n- **利用引脚交换（pin swapping）**：部分主控和存储器允许特定范围内的交换，必须同时核对控制器、颗粒、训练及软件配置；地址线不能默认可交换，巧妙交换能把交叉走线变成顺直走线，这是 DDR 布局最大的\"合法外挂\"；\n- 去耦电容每颗电源引脚一颗 0.1 μF 就近摆放 + 整体 10 μF 一颗，电容置于颗粒背面正对引脚处（BGA 背面扇出）。\n\n**4 层板 DDR3 单颗叠层示例**（经验参考，以板厂加工能力为准）：\n\n| 层 | 用途 | 说明 |\n|:---|:---|:---|\n| L1 TOP | 主控/DDR 元件 + 大部分信号 | 数据组优先走本层 |\n| L2 GND | 完整地平面 | 全板不分割、不打无谓的孔阵 |\n| L3 PWR | 电源平面（1.5V/3.3V 分区） | 电源分区只在这层做 |\n| L4 BOTTOM | 换层信号 + 背面去耦电容 | 数据组可少量换到本层（换层点加地过孔） |\n\n#### 18.2.2 拓扑结构：四种形态\n\n```mermaid\nflowchart TD\n    subgraph TT[\"T 型拓扑（等长分支到每颗）\"]\n        MC1[\"主控\"] --> GA[\"颗粒 A\"]\n        MC1 --> GB[\"颗粒 B\"]\n    end\n    subgraph FB[\"Fly-by 菊花链（顺序到达，末端端接）\"]\n        MC2[\"主控\"] --> FA[\"颗粒 A\"] --> FB2[\"颗粒 B\"] --> FC[\"颗粒 C · 末端端接\"]\n    end\n```\n\n| 拓扑 | 结构 | 特点与适用 | 等长要求 |\n|:---|:---|:---|:---|\n| **T 型（星型）** | 地址/命令从主控出发，等长分支到每颗颗粒 | DDR2、低频 DDR3 两颗场景；分支等长要求苛刻 | 分支必须严格等长，否则反射叠加 |\n| **菊链（Daisy-chain）** | 信号依次经过每颗颗粒 | 概念上是 Fly-by 的总称 | — |\n| **Fly-by（DDR3 标配）** | 地址/命令/时钟按菊花链顺序\"顺访\"每颗颗粒，末端端接 | DDR3/DDR4 多颗首选，减少分支反射；靠写平衡补偿天然时差 | **允许不等长**，但要按主控手册给出的各颗延迟补偿范围控制总量 |\n| **点到点（Point-to-Point）** | 单颗颗粒直连 | 单颗 DDR3 最常见（主流开发板、嵌入式 SoC），最简单 | 无拓扑问题，只剩分组等长 |\n\n> 数据线（DQ/DQS）永远是**点到点**的（每颗独享），拓扑之争只发生在**地址/命令/控制**总线上——理解了这一点，四种拓扑就不用死记了。\n\n#### 18.2.3 等长分组：DDR 规则表的核心\n\n**先弄懂\"为什么要等长\"——时序余量（timing margin）**：DDR 是源同步系统，接收方在 DQS 边沿对应位置采样 DQ。采样裕量应从发送端可用的数据有效区间出发，扣除接收端要求的建立/保持时间、走线偏斜（skew）、抖动（jitter）等；tDS/tDH 是对采样边沿的输入时间要求，不是可直接拿来减的窗口总宽。速率越高窗口越窄——DDR3-1600 的数据传输率为 1600 MT/s，理想每位时间为 1/(1.6×10⁹ 次传输/秒) = 625 ps；实际可用采样窗口还要扣除器件建立/保持、抖动、封装与通道误差，不能将它固定成统一的 375 ps；FR4 板上 1 mil 走线差大约对应 0.15~0.18 ps（经验值），据此可以反推\"±25 mil ≈ ±4 ps\"的量级概念。所以等长 mil 数不是玄学，而是**时序预算（timing budget）的减法**：窗口是芯片给的，偏斜是布线花掉的，你只能控制后者。\n\n**分组原则**（务必背下来）：\n\n- **第 1 组：地址/命令/控制 + 时钟**——它们共享总线、在同一时钟域，作为一组整体匹配；\n- **第 2~N 组：DQ/DQS 按字节组（byte lane）**——DQ[7:0]+DQS0±+DM0 为一组，DQ[15:8]+DQS1±+DM1 为一组，以此类推。**组内等长严，组间可放宽**，因为每个字节组是独立的源同步采样单元。\n\n**等长误差经验值表**（不同主控/颗粒差异很大，**最终以主控官方 Layout Guide 为准**，下表用于建立量级概念）：\n\n| 匹配对象 | 经验值 | 说明 |\n|:---|:---|:---|\n| DQS 差分对内（DQS 与 DQS#） | ±2~5 mil | 全总线最严的一档 |\n| DQ 相对本字节组 DQS | **±10~25 mil** | 字节组内最核心的指标 |\n| 同字节组 DQ 之间 | ±10~25 mil | 组内对齐 |\n| 字节组之间（group to group） | ±25~50 mil | 可放宽，独立采样单元 |\n| T 型下地址/命令对时钟 | ±50~100 mil | 分支等长要求高 |\n| Fly-by 地址线 | 允许不等长 | 按主控手册补偿表控制，末端端接电阻务必保留 |\n\n蛇形绕线（serpentine）三要素：绕线段间距 ≥3W（3 倍线宽，防自耦合）、锯齿单段长度别太短、绕线放在走线末端靠近颗粒处。**先布通、再分组、最后统一绕等长**，顺序别反。\n\n#### 18.2.4 阻抗与参考层\n\n| 项目 | 经验值 | 说明 |\n|:---|:---|:---|\n| 单端阻抗 | 50Ω（地址/命令/控制/DQ） | 部分手册给 45~60Ω 区间，以手册为准 |\n| 差分阻抗 | 100Ω（DQS±、CK±） | 紧耦合设计 |\n| 参考层 | **DDR 区下方地平面必须完整** | 数据线、地址线各自整段不跨分割；一个过孔都不跨 |\n| 换层 | 每条线 ≤1~2 次，换层点旁加地过孔 | 数据组整组同步换层 |\n| 层分配 | 4 层板：TOP（元件+走线）/GND/PWR/BOTTOM（走线） | DDR 信号优先 TOP 与 BOTTOM，参考同一 GND |\n\n#### 18.2.5 电源三兄弟：VDD、VTT、VREF\n\nDDR3 为例（1.5V 系统），三路电源各司其职：\n\n- **VDD/VDDQ（1.5V）**：主电源，主控与颗粒同源同压，按第 10 课电源模块的常规去耦设计；电流按颗粒数量估算（每颗几百 mA 级），走线宽度留余量；\n- **VTT（0.75V，= VDDQ 的一半）**：**只给地址/命令/控制总线的并联端接电阻供电**（数据线靠颗粒 ODT）。端接电流大且动态，必须用专用 VTT 稳压器（如 TPS51200 类双路 LDO），**不能**用电阻从 1.5V 分压糊弄；VTT 电阻排靠近总线末端（Fly-by 链尾）摆放，VTT 就近密集去耦（0.1 μF 多颗 + 10 μF）。注意：**单颗点到点、走线短的 DDR3 常可省略外部 VTT 端接**（反射可控），省不省以主控手册/仿真为准；\n- **VREF（0.75V 基准）**：差分接收器的判决门限基准，电流极小但**噪声敏感度极高**。处理要点：\n  - 走线宽度 ≥15~20 mil，单独拉到主控与颗粒的 VREF 引脚；\n  - **两侧包地（guard trace）+ 沿线地过孔**，远离 DQS/DQ/时钟等噪声源，绝不与数据线平行长距离走线；\n  - 每个 VREF 引脚就近 0.1 μF，电源端 1~10 μF；\n  - VREF 由 VTT 稳压器第二路输出提供（与 VTT 同源同步变化，这是 TPS51200 这类\"VTT+VREF 双输出\"芯片存在的原因）。\n\n> 一句话总结：**VDD 喂饱、VTT 吸收反射、VREF 提供判决基准**——三者角色不同，谁都不能凑合。\n\n### 18.3 NAND FLASH\n\n#### 是什么、怎么工作\n\nNAND FLASH 是最经典的裸闪存：**I/O0~I/O7 八根线复用传输命令、地址、数据**，靠控制引脚区分当前 I/O 上是什么：\n\n| 引脚 | 名称 | 作用 |\n|:---|:---|:---|\n| I/O0~7 | 数据/地址/命令复用总线 | 三种内容分时复用 |\n| CLE | Command Latch Enable | 高电平 = I/O 上是命令 |\n| ALE | Address Latch Enable | 高电平 = I/O 上是地址 |\n| WE# / RE# | 写/读使能 | 上升沿锁存/输出数据 |\n| CE# | 片选 | |\n| WP# | 写保护 | |\n| R/B# | Ready/Busy | 颗粒忙闲状态输出，需上拉 |\n\n读写时序一句话：主控先拉高 CLE（或 ALE）标注 I/O 上的内容类型，再给 WE# 上升沿锁存——命令、地址、数据就这样分批送进颗粒。异步接口速率一般 ≤100 MHz，SLC/MLC/TLC 颗粒密度与寿命不同，但对外接口一样。\n\n#### 布局布线要点（相对宽松）\n\n- **没有硬性等长要求**：异步接口、单端信号，普通规则走线即可（常规模式总长控制在几十~上百 mm 量级、走线整体短，以主控手册为准）；\n- 重点是**串扰控制与防挂总线**：I/O 总线并排整齐走线，时钟/WE#/RE# 远离敏感模拟区；\n- R/B# 上拉电阻靠近主控；CE# 每颗独立，方便以后做多启动；\n- TSOP48 封装焊盘常规扇出即可；注意 NAND 与 eMMC 不同，**需要主控自带 ECC 校验和 FLASH 控制器（或软件管理坏块）**，原理图阶段就要确认主控支持。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 等长 | 无硬性要求 | 异步接口，无源同步选通 |\n| 走线长度 | 尽量短（几十 mm 量级） | 以主控手册为准 |\n| 阻抗 | 50Ω 单端 | 常规数字线 |\n| 串扰控制 | I/O 总线并排整齐走，WE#/RE#/CLE/ALE 与 I/O 保持间距 | 控制线边沿耦合进数据线是常见翻车点 |\n| 上拉 | R/B# 上拉电阻靠近主控 | 开漏输出，无上拉读不到状态 |\n\n### 18.4 eMMC\n\n#### 是什么\n\neMMC = NAND 颗粒 + 控制器（管坏块/ECC/磨损均衡）封装成一颗 BGA，主控只管发标准命令，省心得多，是当前嵌入式主板的主力存储。封装常见 **BGA153（11.5×13 mm，0.5 mm 间距）与 BGA169**，以及更薄的 **WLBGA（晶圆级封装）**——WLBGA 没有基板、更薄更便宜，但底部焊球直接承载应力，**不能放板边、下方避免刚度突变区**，扇出过孔要规划好（通常 0.3 mm 及以下钻孔）。\n\n#### 信号与电路\n\n| 信号 | 说明 |\n|:---|:---|\n| CLK | 时钟，传统模式 52 MHz，HS200 200 MHz，HS400 双倍速率 |\n| CMD | 命令/响应，双向，需上拉 |\n| DAT0~7 | 8 位数据（也支持 1/4 位模式），需上拉 |\n| RST# | 复位 |\n| VCC / VCCQ | 3.3V（核心）/ 1.8V 或 3.3V（IO），两路都要好去耦 |\n\n电源去耦经验：VCC 就近 4.7 μF + 0.1 μF×2，VCCQ 就近 10 μF + 0.1 μF×2；eMMC 是写脉冲电流负载，去耦摆在 BGA 背面正对电源球。\n\n#### 布局布线要点\n\n- 颗粒靠近主控（总长经验值 ≤75~100 mm，HS200/HS400 收紧，以主控手册为准）；\n- **分组等长**：CLK 最长做基准，DAT/CMD 向 CLK 看齐。经验值：传统 52 MHz 模式宽松（±300 mil 内常能工作）；**HS200 需收紧到 ±50~100 mil 级**，HS400 更严并要求 CMD/DAT 采样时序复核——都以所用 SoC 的 eMMC Layout Guide 为准；\n- CLK 靠近主控端串 22~33 Ω（源端匹配），DAT 可选串阻；\n- BGA 扇出两行过孔、保持整组同层走线，参考层完整。\n\n| 规则项 | 传统 52 MHz 模式 | HS200（200 MHz） | 说明 |\n|:---|:---|:---|:---|\n| 等长（DAT/CMD 对 CLK） | ±300 mil 内常可工作 | **±50~100 mil 级** | HS400 更严，均以 SoC 手册为准 |\n| 阻抗 | 50Ω 单端 | 50Ω 单端 | 参考层完整、不跨分割 |\n| 串阻 | CLK 22~33Ω 靠主控端 | 同左，DAT 可加 | 源端匹配抑制反射 |\n| 总长 | ≤100 mm 量级 | 尽量短 | 长走线 + 高速率 = 眼图闭合 |\n| 电源 | VCC 4.7μF+0.1μF×2；VCCQ 10μF+0.1μF×2 | 同左，更靠近引脚 | 写脉冲电流负载 |\n\n### 18.5 各代 DDR 难度递进与\"看懂开发板 DDR 区\"\n\n#### 难度递进表\n\n| 代际 | 典型叠层 | 等长量级 | 端接 | 拓扑 | 新手可达性 |\n|:---|:---:|:---|:---|:---|:---|\n| SDRAM | 2 层 | 无严格要求 | 无 | 随意 | 阶段二水平即可 |\n| DDR2 | 4 层 | ±50~100 mil | 常需 VTT | T 型 | 认真学可做 |\n| DDR3 单颗 | 4 层 | ±10~25 mil（组内） | ODT，VTT 常可省 | 点到点 | 本课目标，4 层板可做 |\n| DDR3 两颗 | 4~6 层 | 同上 + Fly-by 补偿 | VTT + ODT | Fly-by | 进阶 |\n| DDR4 | 6~8 层 | 更严 + 分 bank group 走线 | ODT + CA 端接训练 | 点到点/多颗堆叠 | 阶段四后再战 |\n\n#### 看板三步法（拿来任何开发板都能用）\n\n1. **看摆位判拓扑**：单颗贴主控 = 点到点；两颗在两侧/后方对称 = T 型或 Fly-by；顺着地址线走线看是\"对称分支\"还是\"依次串过去\"，即可区分 T 型与 Fly-by；\n2. **找 VTT 和 VREF**：找 0.75V 稳压器（或双输出 VTT/VREF 芯片）和一排端接电阻——有端接电阻排 = 地址总线并联端接，没有 = 靠 ODT/短线省略；再找那根\"又宽又包地、孤零零走\"的线，就是 VREF；\n3. **顺一组 DQ 验证分组**：从颗粒某个字节组引脚反查到主控，观察蛇形绕线段——绕线集中出现在靠近颗粒处、按 8 根一组扎堆，就是\"字节组等长\"的实物证据。\n\n三步做完，这块板的 DDR 设计策略就被你\"逆向\"出来了。**能做到这一点，本课的核心目标就达成了**——看懂主流开发板（如 H3/RK3399/RK3588 类）的 DDR 区域不再有神秘感，只剩规则松紧的差别。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|:---:|:---|:---|\n| 1 | 找一份 DDR3 颗粒手册 + 一份 SoC 内存接口 Layout Guide | 摘抄出 VDDQ/VTT/VREF 电压、等长分组表、阻抗要求，整理成笔记 |\n| 2 | 在 EDA 中为单颗 DDR3 点到点方案建等长规则类（地址组 + 各字节组） | 规则类建组正确，误差值按 18.2.3 表设置并注明出处 |\n| 3 | 摆一个\"主控 + 单颗 DDR3 + 去耦\"的布局，完成 DQ/DQS 扇出与分组走线 | 组内 DQ 对 DQS ±25 mil 内、DQS 对内 ±5 mil 内、参考层零跨分割 |\n| 4 | 给上述设计补 VTT/VREF 电路（含稳压器、端接电阻、包地） | VREF 走线 ≥15 mil 且两侧包地带过孔，VTT 去耦到位 |\n| 5 | 找一款主流开发板的 DDR 区高清图（开源项目或实板拍照） | 用\"看板三步法\"写出 300 字分析：拓扑、端接、分组策略各说一条证据 |\n| 6 | 画 eMMC（BGA153）原理图并完成布局布线 | CLK 串阻、DAT/CMD 上拉、HS200 档等长规则（±100 mil 内）全部落实 |\n\n## ✅ 自测清单\n\n- [ ] 能说出 DDR 每代的核心电压（3.3/2.5/1.8/1.5/1.2V）与 DDR3 引入的两大布线相关特性（Fly-by、写平衡）；\n- [ ] 能解释 DQS 是什么、为什么 DQ 与 DQS 的等长要求最严（源同步采样窗口）；\n- [ ] 能说出地址/命令/控制为什么是一组（共享总线、同时钟域）而 DQ/DQS 按字节组分组（独立采样单元）；\n- [ ] 能默写核心等长经验值：DQ 对 DQS ±10~25 mil、DQS 对内 ±2~5 mil、字节组间 ±25~50 mil，并知道\"以主控手册为准\"；\n- [ ] 能画草图区分 T 型、菊链、Fly-by、点到点，并各举一个适用场景；\n- [ ] 能说出数据线端接靠 ODT、地址线端接靠外部 VTT 电阻；\n- [ ] 能说出 VTT 的电压（DDR3 为 0.75V）、供电对象（地址/命令端接）与电流特点（大且动态）；\n- [ ] 能说出 VREF 走线三要点（加宽、包地、远离噪声源）；\n- [ ] 能说出 NAND 的 CLE/ALE 作用（标注 I/O 总线上当前是命令/地址）与\"无硬性等长\"的原因；\n- [ ] 能说出 eMMC 的 VCC/VCCQ 区分与 HS200 档的等长收紧方向（±50~100 mil 级，以手册为准）；\n- [ ] 能用\"看板三步法\"（摆位→VTT/VREF→字节组蛇形）分析一块陌生开发板。\n\n## ⚠️ 新手常见坑\n\n1. **不查主控手册就抄别人的等长值**：不同 SoC 的控制器训练能力差异巨大，A 板 ±25 mil 能跑，B 板可能要 ±10 mil。解法：每换一颗主控，先读它的 Layout Guide，把它的等长表抄进工程规则。\n2. **数据组与地址组混扎走线**：为了\"布通\"让 DQ 和地址线互相穿插，等长绕线时全线缠死。解法：布局阶段就给每组划出走线通道（数据组走主控与颗粒之间的直达区，地址组绕外侧），先分区再动手。\n3. **DDR 区下方地平面被信号孔或分割切断**：4 层板为了电源分区把 GND 层切了一刀，正好横穿 DDR——参考层断裂，阻抗与串扰双爆。解法：GND 层永远保持完整，电源分区放在 PWR 层做。\n4. **用电阻分压生成 VTT/VREF**：VTT 端接电流动态变化，分压电阻撑不住电压跌落，VREF 跟着抖，内存\"偶发死机\"查不出原因。解法：VTT/VREF 用专用稳压器（双路输出那种），成本几块钱换稳定性。\n5. **忘记 pin swap 这个外挂**：硬按引脚自然顺序布线，交叉严重、绕线爆炸。解法：查主控手册的 DQ/地址交换许可表，布局前先规划交换方案。\n6. **eMMC 按 NAND 的宽松标准走线**：传统 52 MHz 模式下能跑，升到 HS200 就枚举失败。解法：一开始就按目标速率档（HS200/HS400）的等长规则设计，预留收紧余量。\n\n## 📚 延伸学习\n\n- **B 站搜索关键词**：「DDR3 布线 等长」「DDR fly-by 拓扑」「VTT VREF PCB」「DDR3 四层板」「eMMC HS200 布线」「write leveling 是什么」\n- **手册阅读指引**：任选一颗主流 SoC（如全志 H3/H616、瑞芯微 RK33xx 系列）的 Datasheet 或 Hardware Design Guide，找到 DDR 布局布线章节，重点读三张表——**等长分组表、阻抗控制表、电源去耦推荐表**，与本章 18.2 逐条对照印证；再找一颗 DDR3 颗粒手册（如三星/镁光任意型号）读 \"VREF noise\" 与端接章节。\n- **进阶主题**：搜索「源同步时序」「蛇形线 3W 间距」「DDR3 点到点 省略 VTT」——理解\"经验值为什么是这个数\"，是从抄规则到懂规则的一步。","taskSignature":"81c2213b121411d2cbfc3d11f989ccfd6d39a4ba0e7e096187cec5bfc09a9d33","taskCount":11},{"id":"19","title":"第 19 课 · 专项技能强化","short":"专项技能强化","stage":4,"diff":5,"prev":"第 09、10 课及基础电路；基础部分在第 20 课前学习，进阶部分结合项目复习","optional":false,"md":"学习了电路与 PCB 基础后，你已经接触过\"把板子画出来、调得通\"；这一课要练的是\"把板子画好\"——过得了 EMC、跑得动高速信号、产线造得出、安规查得安心。EMC/SI/PI/DFM 这几块是初级与中级工程师的分水岭，也是面试中区分\"会画板\"与\"懂设计\"的核心考点。本课概念密度大，建议结合自己已完成的项目板对照学习：每学一节，就回到已有的简单板或参考工程中查找实例；高速部分配合第 20～22 课深入。\n\n## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 说清传导干扰与辐射干扰的来源与传播路径，在自己的项目板上指出至少 5 个 EMC 风险点并给出整改措施。\n2. 用反射、串扰、回流路径三个概念解释\"这根线为什么不能这样走\"，并正确应用 3W 规则与串联/并联/戴维南端接。\n3. 为一路电源（如 MCU 的 3.3V）规划去耦电容组合（容值、数量、摆放），并解释 PDN 阻抗与目标阻抗的含义。\n4. 按板厂工艺能力自查设计：最小线宽/间距/孔径、阻焊桥、丝印与焊盘关系、工艺边、测试点是否合规（具体数值以板厂能力表为准）。\n5. 区分爬电距离（Creepage）与电气间隙（Clearance），说出一次侧/二次侧的间距设计思路（具体数值以现行安规标准为准）。\n6. 给出含 ADC/DAC 的模数混合板的分区布局与单点接地方案。\n\n## 📖 正文\n\n### 19.1 EMC/EMI 处理：不吵别人，也不被吵\n\n**是什么**：EMC（Electromagnetic Compatibility，电磁兼容）指设备在电磁环境中能正常工作、且不向环境发出不可接受的干扰。它包含两面：EMI（Electromagnetic Interference，电磁干扰，\"吵别人\"）和 EMS（Electromagnetic Susceptibility，电磁抗扰度，\"被吵\"）。民用产品要做 EMC 认证（国内常见依据 GB 标准族，如信息技术设备类标准），过不了认证产品就不能上市。\n\n**干扰从哪来（先分清传导与辐射）**：\n\n- **传导干扰**：噪声沿电源线、信号线\"顺线跑出去\"，经验上以 30MHz 以下频段为主，在电源入口处被测。\n- **辐射干扰**：噪声通过空间电磁场\"空中传播\"，经验上以 30MHz 以上为主，在电波暗室或近场测量。\n\n板子上典型的干扰源，排查时按\"强度\"依次想：\n\n1. **DCDC 的开关节点（SW）**：高 dv/dt、di/dt 的方波，是板内最强干扰源；\n2. **时钟与高速总线**：晶振、DDR、HDMI/LVDS 等，边沿越陡谐波越丰富；\n3. **感性负载通断**：继电器、电机、接触器断开瞬间的反电动势；\n4. **大电流环路**：环路面积越大、电流越大，辐射越强。\n\n**干扰源速查表（看到什么想到什么）**：\n\n| 干扰源/现象 | 常见对策 |\n|:---|:---|\n| DCDC SW 节点 | 缩小 SW 铜面积、加 RC 吸收电路（Snubber）、栅极串小电阻减缓边沿 |\n| 晶振 | 两侧包地 + 地过孔、远离板边与接口、下方内层不走高速线 |\n| 高速总线 | 端接、阻抗控制、参考平面完整、减少长距离平行走线 |\n| 从接口进来的 EMI/ESD | 共模电感/磁珠滤波、TVS 防护、接口地与机壳地处理好 |\n| 大电流环路 | 缩小环路面积、功率路径短而粗、输入输出电容紧靠开关管 |\n| 板边辐射 | 板边地过孔缝合、电源平面内缩（20H 原则，见 19.7） |\n\n**怎么做——滤波**：\n\n- 交流输入端典型滤波链路：保险丝 → 压敏电阻（MOV，浪涌钳位）→ X 电容（跨接 L-N，滤差模）→ 共模电感（Common Mode Choke）→ Y 电容（L/N 对地，滤共模）。X/Y 电容是\"安规电容\"，失效模式可控，**绝不能用普通电容替代**。\n- 直流电源入口用磁珠 + 大容值电容组合抑制高频；芯片级用去耦电容（见 19.3）。\n\n**怎么做——接地**：\n\n| 方式 | 适用频率（经验值） | 原理 |\n|:---|:---|:---|\n| 单点接地 | 低频（约 <1MHz） | 所有地回流到一个点，避免地环路引入共模噪声 |\n| 多点接地 | 高频（约 >10MHz） | 就近打地过孔，减小地阻抗和驻波 |\n| 混合接地 | 宽频段 | 低频单点 + 高频经电容多点，工程中最常见 |\n\n**怎么做——屏蔽与缝合**：WiFi/射频模块加金属屏蔽罩；大面积铺铜的地平面之间，沿板边与接口每隔一小段距离打**地过孔缝合（Via Stitching）**，经验间距取所关注最高频率波长的 1/20 量级（仅为经验起点，以仿真/实测为准）。\n\n**怎么做——展频**：Spread Spectrum Clocking（SSC 展频时钟）把时钟能量在频率上\"摊开\"来压低峰值发射。注意：HDMI 等对时钟有严格抖动/频偏要求的接口，乱开展频可能违反规范，能不能开以芯片手册为准。\n\n**敏感信号防护**：复位线、晶振线、模拟小信号要远离 SW 节点、接口连接器与高速总线；必要时两侧包地并加密集地过孔（包地线要真的接地，浮空的包地线反而变成天线）。\n\n**接口防护（ESD/浪涌）**：\n\n- **ESD（静电放电）**：TVS 管 / ESD 二极管阵列，**靠近连接器放置**，让静电能量先泄放到地、再进入芯片；信号路径顺序是\"连接器 → 防护器件 → 共模电感/滤波 → 芯片\"。\n- **浪涌（Surge）**：MOV + 气体放电管（GDT）+ PPTC 自恢复保险丝组合，按防护等级选参数。\n- 网口用网络变压器 + Bob Smith 75Ω 端接；USB 常用共模电感 + ESD 阵列；防护器件的地要就近低阻抗接地。\n\n**EMC 整改的通用流程（面试常问\"超标了怎么办\"）**：\n\n1. **先定位**：用近场探头扫板找\"热点\"，对照超标频点锁定源头（超标频点往往正好是某个时钟的谐波，这是重要线索）；\n2. **源头降**：减缓边沿（源端串小电阻）、降低驱动强度、开启展频；\n3. **断路径**：加滤波（磁珠/电容/共模电感）、加屏蔽罩、地平面缝合；\n4. **保受体**：接口加 ESD/浪涌防护、敏感信号远离干扰源并包地。\n\n记住顺序是\"定位 → 源头 → 路径 → 受体\"，不要一上来就乱贴磁珠乱加电容——没定位的整改是碰运气。\n\n### 19.2 SI 信号完整性：反射、串扰、损耗与端接\n\n下面的传输线仿真使用 CircuitJS 的 [端接示例](https://github.com/pfalstad/circuitjs1/blob/master/ts/public/circuits/tlterm.txt)：四条理想 75Ω 传输线分别比较 75Ω 匹配、10kΩ 高阻、10Ω 低阻负载，以及低源阻抗配高阻负载。观察波在线路中往返与端点反射；这是理想传输线示范，不能直接代表某块 PCB 的波形或端接数值。\n\n```circuitjs\ntlterm\n```\n\n**是什么**：SI（Signal Integrity，信号完整性）研究信号在传输过程中波形是否还\"像它自己\"。低速板不需要太操心 SI，但 DDR、HDMI、百兆/千兆网这类信号，走线要按\"传输线\"对待。\n\n**反射（Reflection）——阻抗突变**：信号遇到阻抗变化就反射，反射系数 Γ = (Z₂ − Z₁)/(Z₂ + Z₁)。常见突变原因：走线宽度变化、过孔、分支桩线（stub）、参考平面切换、跨分割。经验判断：当走线延时超过信号上升沿时间的 1/6 左右，就要按传输线处理，认真做阻抗匹配（经验阈值，精确判定以仿真为准）。\n\n**串扰（Crosstalk）——线与线互相干扰**：通过寄生电容（容性耦合）和互感（感性耦合）传递。三条经验对策：\n\n1. **3W 规则**：线中心距 ≥ 3 倍线宽（即线间净间距 ≥ 2 倍线宽），经验上能显著削弱相邻线耦合（常被引用为约 70%，具体以仿真/实测为准）；对关键信号可放宽到 4W~5W。\n2. **相邻信号层走线垂直**：一层横向、一层纵向，减少平行重叠面积。\n3. 关键信号（时钟、复位）两侧包地 + 地过孔隔离。\n\n**损耗（Loss）**：长走线的导体损耗（趋肤效应，频率越高电流越集中在表面）与介质损耗随频率增大。对策：长线适当加宽、高频高速场合评估低损耗板材（普通 FR4 与高频板材的 Df 差异明显，选型以板材规格书为准）。\n\n**端接（Termination）策略**：反射治不了就\"吸收\"它。\n\n| 端接方式 | 做法 | 优点 | 缺点 |\n|:---|:---|:---|:---|\n| 串联端接 | 源端串电阻（常见 22~33Ω 经验值，按阻抗差算） | 省功耗、最常用 | 只适合点对点 |\n| 并联端接 | 末端接电阻到地或电源 | 匹配好 | 持续漏电流 |\n| 戴维南端接（Thevenin） | 末端上下两电阻分压 | 兼容性好、匹配稳 | 静态功耗更大 |\n| AC 端接 | 末端串电容再接电阻 | 无直流功耗 | 只适合特定总线/时钟 |\n\n**阻抗控制（Impedance Control）——匹配的前提**：单端走线常见目标 50Ω 左右，由线宽、介质厚度、介电常数共同决定。微带线（Microstrip，表层走线）与带状线（Stripline，内层夹在平面之间）的计算模型不同——同一阻抗在不同层的线宽不一样。实际操作流程：定层叠 → 用 EDA 自带阻抗计算器或板厂提供的阻抗计算工具算出各层线宽 → 下单时勾选\"阻抗控制\"，由板厂按层叠微调保证。理解了这一点，你就明白\"走线随意换层\"为什么等于阻抗突变。\n\n**回流路径（Return Path）——SI 的灵魂**：高频电流走\"感抗最小\"的路径，也就是**信号正下方的参考平面**。由此推出本课最重要的一条纪律：\n\n> 信号线下方的参考平面必须完整。跨分割、换参考层、参考平面被挖洞，都会迫使回流绕远路，形成大环路——SI 变差、串扰变大、EMI 变强，三个问题一起爆。\n\n换层时如果参考平面从地层换到电源层，在过孔旁放一个缝合电容（接地/接电源）给回流一条低阻抗通路。\n\n### 19.3 PI 电源完整性：让芯片每一纳秒都\"吃得上电\"\n\n**是什么**：PI（Power Integrity，电源完整性）研究从电源芯片到芯片内部晶体管这整条供电网络（PDN，Power Delivery Network，电源分配网络）能否在芯片电流快速变化时仍把电压稳定在允许纹波内。\n\n**PDN 阻抗与目标阻抗**：工程师用\"目标阻抗\"量化 PI 要求——\n\n```\nZ_target = (电源电压 × 允许纹波百分比) / 瞬态电流变化量\n```\n\n设计目标是让**全频段**内 PDN 阻抗都低于目标阻抗。频率从低到高分别由 VRM（电源芯片）、板级电容、平面电容、芯片封装内电容接力承担，任何一段\"掉链子\"都会出现一个阻抗尖峰，对应频段的噪声就会超标。\n\n**去耦电容搭配（数量、容值、摆放）**：\n\n1. **大小容值组合**：大容值（如 10µF/22µF）管低频储能，小容值（如 0.1µF/0.01µF）管高频去耦——电容实际是\"电容 + ESR + ESL\"的串联结构，安装电感决定了它的高频有效性，不是\"多并几个大电容\"就能解决高频问题。\n2. **摆放**：最小容值的电容最靠近芯片电源管脚，大电容可稍远、放在电源进入区域；每个（组）电源管脚附近都要有电容，数量与组合**优先按芯片手册 Layout 章节的推荐执行**。\n3. **接地要\"就近且粗\"**：电容电源/地焊盘到过孔的距离尽量短，条件允许时一个焊盘打两个过孔，比电容本体更靠近谁更有效。\n4. 电容之间避免\"共享一条细长的地过孔链\"。\n\n**电源平面谐振（Cavity Resonance）**：电源平面与地平面构成谐振腔，在某些频段会把边缘当成天线向外辐射，造成 EMI 问题。对策：合理布置去耦电容打乱谐振模式、板边地过孔缝合、必要时平面内缩（见 20H 原则）。\n\n**平面分割的利弊**：分割电源平面可以把\"脏电源\"与\"干净电源\"隔离（如数字 3.3V 与模拟 AVDD），但分割边界会切断信号的回流路径。原则：分割边界尽量放在没有高速线穿过的区域；跨越时优先重新规划走线和参考层；是否需要及如何设置跨平面回流连接，须根据电源域、电路功能和具体回流路径设计，不能随意用磁珠或 0Ω 跨接不同电源轨。\n\n**6 层板层叠参考示例**（仅示意思路，具体以阻抗计算结果与板厂叠构确认为准）：\n\n| 层 | 用途 | 设计意图 |\n|:---:|:---|:---|\n| L1 | 信号（器件面） | 表层走关键信号，紧邻 L2 完整地 |\n| L2 | 地（GND） | L1 的完整参考平面 |\n| L3 | 信号 | 带状线层，适合走高速线 |\n| L4 | 电源（PWR） | 与 L5 地平面紧耦合 |\n| L5 | 地（GND） | 主参考地平面 |\n| L6 | 信号（底层） | 常规走线与低速信号 |\n\n层叠设计的通用思路：每个信号层都紧邻完整参考平面；电源平面与地平面相邻（层间距压小）以提高平面间电容、改善 PI；多个地平面之间打地过孔缝合，并联降低整体地阻抗。层数与排布永远在成本与性能之间做取舍。\n\n### 19.4 高速信号完整性综合：眼图、等长、差分\n\n**眼图（Eye Diagram）**：把高速比特流按单位间隔（UI）在示波器上无限叠加，得到\"眼睛\"状的图形。眼睛张得越开（眼高越大=噪声容限大，眼宽越大=抖动小），信号质量越好；抖动（Jitter）和噪声会让眼睛\"闭合\"。眼图是仿真软件（如 Sigrity 类工具）与示波器通用的语言，面试考概念时能画出示意图并解释眼高/眼宽即可。\n\n**等长与等延时**：DDR、RGB 屏线、MIPI 等并行/高速总线要求组内信号\"同时到达\"。但严格说**等长只是手段，等延时才是目的**——不同层、不同线宽的走线单位长度延时不同，精细设计按延时匹配。实操规则：\n\n1. 以芯片手册/控制器参考设计给出的误差范围为准（不同总线宽严差异很大，例如 DDR 数据组与时钟的相对偏差通常在百皮秒级、对应的长度误差常控制在几十 mil 量级——均为经验量级，以手册为准）。\n2. 常用手法：蛇形绕线（serpentine）。绕线区的线间距、绕线幅度会影响延时与串扰，不要紧贴着绕；绕线放在有余量的区域，且同组尽量同层。\n3. 差分对内等长要求远比组间严格，先保对内再保组间。\n\n**差分对（Differential Pair）完整性**：\n\n1. **差分阻抗**：USB 常用 90Ω、以太网常用 100Ω 是常见经验值，实际以接口规范与板厂阻抗计算为准（下单时可选阻抗控制工艺，由板厂按层叠保证）。\n2. **紧耦合 vs 松耦合**：紧耦合（线间距小）抗共模干扰好，是主流做法；松耦合用于大功率差分或特殊场合。\n3. **对称性**：两根线同层、同长、少打孔、打孔也成对对称，避免一处走粗一处走细。\n4. **对内等长**：对内偏差控制在远小于组间偏差的量级（经验上几个 mil 以内，以规范为准）；**对间间距** ≥ 3W 或按规范拉开。\n\n**DDR 等长布线实操要点（项目中最常见的等长场景）**：\n\n1. **分组**：数据线按字节分组（DQ/DQS/DM 同组），地址/控制/时钟归另一组；组内误差要求严、组间宽松，具体公差以控制器手册的长度匹配表为准；\n2. **先定拓扑**：是点对点直连还是 Fly-by 串联拓扑，拓扑定了再谈等长；桩线（Stub）越短越好；\n3. **绕线手法**：蛇形绕线放在同层、有余量的区域，绕线间距适当加大避免自耦合，不要为了等长把线绕成密密麻麻的\"弹簧\"；\n4. **过孔一致**：同组信号的过孔数量尽量一致——每个过孔的延时与寄生电容不同；\n5. **工具终验**：用 EDA 的等长检查规则（如 Matched Lengths）跑报告，而不是肉眼估计。\n\n### 19.5 DFM 可制造性设计：让产线造得出你的板\n\n**是什么**：DFM（Design for Manufacturability，可制造性设计）——设计阶段就按工厂能力来画，避免\"画得出来、造不出来、造得贵\"。\n\n**板厂工艺能力**（常见打样厂典型值，**必须以你所选板厂的能力表实时为准**，先进工艺可更小但加价）：\n\n| 项目 | 常见能力/经验值 | 说明 |\n|:---|:---|:---|\n| 最小线宽/间距 | 常见 3.5~4mil 可做 | 不是\"能画多细\"而是\"造得起多细\"，越细越贵 |\n| 最小机械钻孔 | 常见 0.2mm，0.15mm 级加价 | 更小需激光孔（HDI 工艺） |\n| 过孔焊盘环形宽度（Ring） | 经验 ≥0.15mm | 太小钻孔偏心就破环 |\n| 阻焊桥（Solder Mask Dam） | 经验 ≥0.1mm | 焊盘间距过近时桥造不出来，可能连锡 |\n\n**阻焊与丝印**：\n\n- 阻焊桥：相邻焊盘之间保留的阻焊隔离带；间距太近的密集焊盘要主动放大间距保桥。\n- **丝印不许压焊盘**：丝印油墨落在焊盘上会影响可焊性，输出光绘前用 DFM 检查项筛一遍。\n- 丝印字号建议高度不小于约 0.8mm（经验值，以板厂为准），否则印刷模糊；极性标、一脚标、接口名必须清晰。\n\n**拼板与工艺边**：小板批量生产时拼板（Panelization），四周留工艺边（经验 5mm 左右，以贴片厂要求为准）；连接方式用 V-CUT（直线分板，省成本）或邮票孔（异形板/应力敏感板）。工艺边上按产线要求加定位孔与光学点（Mark 点）。\n\n**测试点（Test Point）**：批量要做 ICT（In-Circuit Test，在线测试）就得预留测试点——经验直径约 1mm、中心间距 ≥2mm 量级（以测试厂治具能力为准）；测试点不能被屏蔽罩/散热器挡住；BGA 区域底下无法探测的网络要靠 X-Ray 或 FCT 兜底。\n\n**AOI / X-Ray**：AOI（Automated Optical Inspection，自动光学检测）检查贴件、极性、外观，替代目检；X-Ray 穿透检查 BGA 等看不见的焊点（空洞、桥连、偏移）。设计时要给 BGA 焊球阵列的\"看视角度\"留出邻位空间（周边至少一排无高大元件），具体以产线要求为准。\n\n### 19.6 爬电距离与电气间隙：安规的硬指标\n\n**是什么**：这是强电/隔离电源设计的\"保命尺寸\"。\n\n- **电气间隙（Clearance）**：两导体之间**空气中的最短直线距离**，防的是击穿放电。\n- **爬电距离（Creepage）**：沿**绝缘表面**的最短距离，防的是表面漏电起痕（灰尘受潮后沿面爬电）。\n\n**一次侧/二次侧（Primary/Secondary）**：隔离电源里接市电的一次侧与安全超低电压的二次侧之间，必须满足相应绝缘等级（基本绝缘/附加绝缘/加强绝缘）的间隙与爬电要求。**经验数值仅作量级参考**：老标准（IEC/GB 60950 时代）中 250V 系统一次侧对二次侧的加强绝缘常被引用为爬电约 6.4mm 之类的数值；现行标准（如音视频/信息技术设备的 IEC/GB 62368-1、信息技术设备安全 GB 4943 类标准）的取值随工作电压、污染等级、材料 CTI、绝缘等级变化——**实际设计必须查现行标准原文并按认证机构（如 CQC/UL/TÜV）要求执行，不可背一个数走天下**。\n\n**设计手法**：\n\n1. 高压区与低压区**分区布局**，一、二次侧之间拉距离；\n2. 距离不够时在两者之间**开槽（挖孔/开窗）**，用空气拉长爬电路径（开槽位置不能破坏结构强度）；\n3. 变压器、光耦、Y 电容等跨隔离器件自身提供隔离，其爬电要求同样按标准；\n4. 高压走线加宽、远离可触碰部位，加危险警示丝印；\n5. 保险丝之后的走线按故障电流考虑载流能力。\n\n**安规间距设计措施速查**：\n\n| 目的 | 设计措施 |\n|:---|:---|\n| 拉大电气间隙 | 一、二次侧分区布局，高压走线相互间距加大 |\n| 拉长爬电距离 | 在分界区开槽（挖长条孔/开窗），让沿面路径变长 |\n| 靠器件隔离 | 变压器、光耦、Y 电容等跨隔离器件按绝缘等级选型（规格书有标注） |\n| 让人看得见 | 高压区丝印警告标识，一次侧区域轮廓丝印标出 |\n\n### 19.7 电源平面分割与 20H 原则\n\n**分割岛（Power Island）**：一层电源平面被划成多块，分别给不同电压域供电。要点：\n\n1. 每个电压域的岛要包住自己的用电区域，岛大小按电流与去耦需求留够；\n2. 岛与岛之间留出间隙（经验 1~2mm 量级，兼顾工艺与隔离，以设计规范为准），边界避开高速走线；\n3. **跨分割走线是大忌**：信号跨过电源平面的分割沟，回流路径被切断——阻抗突变、振铃、EMI 全来了。路由前先规划哪些信号会跨域，要么改层、要么加桥接缝合电容。\n\n**20H 原则**：电源平面相对相邻的地平面**内缩 20 倍层间介质厚度**，让板边的电源-地边缘场不至于外泄，抑制边缘辐射。这是流传很广的经验规则；在实际高速设计中其效果与层叠、频率相关，业界对有效性有讨论，可作为了解并在有条件时结合仿真/实测验证，不必教条执行。\n\n### 19.8 模数混合设计：数字地、模拟地、大电流地\n\n**为什么要分地**：数字电路的开关噪声通过共用地阻抗耦合进模拟小信号（ADC 一个 LSB 可能只有毫伏甚至微伏级），所以地的\"纯净度\"直接决定精度。\n\n**分地三原则**：\n\n1. **先分区，再分地**：布局上把数字区、模拟区、大电流区（功放/电机/电源功率级）物理分开，地自然就分开了；分地治不了布局混乱的病。\n2. **单点连接**：优先按芯片手册规划完整参考地与布局分区；如确需分地，连接位置和回流路径应依具体电路设计，而非固定单点；大电流地单独走，最终汇到电源地，不让大电流流经模拟地。磁珠/0Ω 电阻可以用于地的连接，但要理解它是\"高频阻抗、直流近似导通\"，不能替代正确的拓扑。\n3. **跨界的芯片跨在地界上**：ADC/DAC 一只脚踩数字区一只脚踩模拟区——数字引脚朝向数字区布线、模拟引脚朝向模拟区布线，不要让数字信号穿越模拟区。\n\n**ADC/DAC 布局要点**：\n\n1. 参考电压（VREF）是精度的命根子：VREF 去耦电容按手册要求紧贴管脚，参考源走线短、粗、远离干扰；\n2. 模拟输入信号线短而直，两侧包地，远离晶振、SW 节点、时钟线；\n3. 模拟区铺铜完整、多打地过孔；晶振布局在数字侧；\n4. 数字电源与模拟电源之间按需用磁珠隔离，但大电流场合慎用磁珠（直流电阻压降与饱和问题）。\n\n**一句话总结本课**：EMC 讲\"源—路径—受体\"，SI 讲\"阻抗—回流\"，PI 讲\"目标阻抗—接力去耦\"，DFM 讲\"按工厂能力画\"，安规讲\"距离就是安全\"，模数混合讲\"分区+单点\"。所有经验数值都以现行标准（如 IPC 系列与国标安规类标准）与板厂/产线实际能力为准。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|:---:|:---|:---|\n| 1 | 打开你的 6 层板项目，列出所有 DCDC 的 SW 节点、晶振、接口连接器位置，标注 5 个以上 EMC 风险点及整改措施 | 有一张带批注的截图 + 整改清单，能向别人讲清每个风险的理由 |\n| 2 | 挑板上一组高速信号（DDR 或网口），检查是否满足 3W、有无跨分割、有无桩线，写整改方案 | 整改前后对比说明，包含回流路径分析 |\n| 3 | 为主控的某一路电源整理去耦电容表（位号/容值/封装/距管脚距离），对照芯片手册推荐核对 | 表格完整，偏差处有修改动作 |\n| 4 | 用板厂官网的工艺能力表逐项核对你的设计（最小线宽/间距/孔径/环形/阻焊桥/丝印） | 输出一份 DFM 自查表，全部通过 |\n| 5 | 在电源板（或含隔离电源的板）上标出一次侧/二次侧区域，测量两者最近间距并注明所依据的绝缘等级 | 标注图 + 依据说明（注明以现行标准为准） |\n| 6 | 找一个带 ADC 的原理图（或自己加一个），画出分区布局草图与地的单点连接方案 | 一张布局草图 + 地连接拓扑图 |\n| 7 | 用 EDA 阻抗计算器或板厂工具，对你的层叠计算 50Ω 单端与 100Ω 差分线宽，核对实际走线 | 计算截图 + 线宽修正记录 |\n| 8 | 给板上一组总线（DDR 或并口）跑等长检查，记录组内最大误差并整改 | 误差报告 + 整改前后对比 |\n\n## ✅ 自测清单\n\n- [ ] 我能区分 EMC/EMI/EMS，并说出传导与辐射的大致分界（经验 30MHz）\n- [ ] 我能画出交流输入的 EMI 滤波链路（保险丝→MOV→X 电容→共模电感→Y 电容）\n- [ ] 我能解释单点/多点/混合接地各自的适用频率段\n- [ ] 我能写出反射系数公式并说出至少 4 种阻抗突变原因\n- [ ] 我能解释 3W 规则的内容、目的与局限\n- [ ] 我能默写四种端接方式及优缺点，知道源端串联 22~33Ω 是最常见的做法\n- [ ] 我能解释为什么\"信号下方参考平面必须完整\"，以及换参考层时缝合电容的作用\n- [ ] 我能写出 PDN 目标阻抗公式，并说出去耦电容\"大小搭配、小者就近\"的原因\n- [ ] 我能列出 DFM 检查清单（线宽/间距/孔径/阻焊桥/丝印/工艺边/测试点）\n- [ ] 我能区分爬电距离与电气间隙，并说明为何不能只背 6.4mm 一个数\n- [ ] 我能讲清模数混合设计的\"分区+单点连接\"原则与 ADC 布局要点\n- [ ] 我能解释微带线与带状线的区别（以及同阻抗不同层线宽不同的原因），并按\"定位→源头→路径→受体\"口述 EMI 整改流程\n\n## ⚠️ 新手常见坑\n\n1. **把 EMC 当\"最后补丁\"**：Layout 完成后才想加屏蔽罩、加磁珠。EMC 的 80% 在布局布线阶段就已决定，回来改的成本是设计期的数倍——布局时就把\"源—路径—受体\"想清楚。\n2. **盲目分地**：听说要分地就把地割得七零八落，结果数字信号跨分割、回流绕大圈，EMC 反而更差。正确顺序是先分区布局，再谈分地，且单点连接。\n3. **去耦电容乱摆**：电容放在\"有空的地方\"离芯片两三厘米，高频去耦形同虚设。记住经验法则：0.1µF 级电容到芯片电源管脚的距离通常控制在几毫米内，越近越好。\n4. **等长教条化**：为了等长满板蛇形线，绕出大量耦合与延时误差。等长是手段不是目的，蛇形线的耦合效应和\"同层同宽\"优先级要心里有数，误差范围以芯片手册为准。\n5. **拿别人的数值当圣旨**：6.4mm、3W、λ/20、1/6 上升沿……全是经验起点。不同电压等级、不同污染等级、不同板厂，取值都会变，最终以现行标准与板厂能力表为准。\n6. **丝印/阻焊细节不检查**：丝印压焊盘、阻焊桥缺失、Mark 点遗漏，打样能过、量产必翻车。输出光绘前务必跑一遍 DFM 检查（见第 15 课）。\n\n## 📚 延伸学习\n\n- 书籍：Howard Johnson《High-Speed Digital Design: A Handbook of Black Magic》（《高速数字设计黑魔法》，SI/EMC 经典）\n- 书籍：Eric Bogatin《Signal and Power Integrity — Simplified》（《信号完整性与电源完整性分析》）\n- 书籍：任何一本国内出版社的《电磁兼容设计与整改》类实战书，重点看\"整改案例\"章节\n- 标准（了解体系即可，不必背条文）：IPC-2221（PCB 设计通用）、IPC-A-600（成品板验收）、GB 4943 / IEC 62368-1 类安规标准\n- 搜索关键词：`DCDC 布局 SW节点`、`PDN 目标阻抗 去耦电容摆放`、`跨分割 回流路径`、`爬电距离 电气间隙 查表`、`DDR 等长 绕线`、`展频时钟 EMI`","taskSignature":"ba02e4bc1951f27682c9ab09b3651e6c03dd66b1a3ac3ef41bd09ba12a49df09","taskCount":12},{"id":"20","title":"第 20 课 · 项目实战 · 4 层板 · H3 机顶盒","short":"4 层板 · H3 机顶盒","stage":4,"diff":4,"prev":"第 14 课；第 11、18 课相关接口与存储；第 19 课 SI/PI、回流与 DFM 基础","optional":false,"md":"## 🎯 本课目标\n\n> **项目状态与使用边界**：本课是设计学习与参考工程分析材料；示意参数不是已验证的目标板约束。动手前须落实具体芯片与参考设计版本、完整原理图/BOM、封装、存储和启动资料，以及板厂工艺。相关参数按对应手册、计算和验证结果确定；资料不齐时先做分析练习，不按经验表直接投板。\n\n1. 完成全志 H3 机顶盒整板方案理解与原理图移植：SOC + DDR3 ×4 + eMMC + 百兆网口 + HDMI + USB + WIFI\n2. 掌握 4 层板叠层（TOP / GND / PWR / BOTTOM）设计方法与内层平面的分工\n3. **完成第一次 BGA 扇出（fanout）**：狗骨式（dogbone）扇出、BGA 区域 4/4mil 级线宽间距规则、过孔选择\n4. 完成 DDR3 分组等长布线，理解 3W 规则（3W rule）并应用到 DDR/USB/HDMI 区域\n5. 完成 WIFI 区屏蔽罩（shield can）焊盘设计、RMII 网口与网络变压器（magnetics）处理、三路 DCDC 电源平面分割\n6. 输出 4 层板生产文件并按 BGA 工艺要求下单\n\n> **做完第 14 课的你现在具备了**：完整闭环经验、规范的布局分区习惯、双面铺铜的纪律。**本课新增挑战**：第一次面对 BGA——焊盘在芯片肚皮下，线必须「扇出」才能逃逸；第一次拥有真正的地平面和电源平面；第一次做分组等长。从这课起，「能不能连上」升级为「连得好不好」。\n\n---\n\n## 📖 正文\n\n### 20.1 项目方案与系统框图\n\n**项目定位**：复刻一台入门 TVBOX（网络机顶盒）主板，板尺寸约 100mm × 80mm。主控全志 H3（四核 Cortex-A7，FBGA-347 封装、0.8mm 球距、15×15mm——**具体球数、球距、焊盘尺寸以官方数据手册封装章节为准**）。H3 内置百兆 EPHY 可直连网口；本课刻意选 RMII 外挂 PHY 方案，便于对照第 11 课练习经典架构。\n\n**系统框图**：\n\n```mermaid\nflowchart TD\n    IN[DC 5V/2A 输入] --> D1[DCDC 3.3V · VCC-IO]\n    IN --> D2[DCDC 1.5V · VDD-DDR]\n    IN --> D3[DCDC 1.2V · VDD-CPU]\n    D1 --> SOC[H3 SOC · FBGA-347]\n    D2 --> DDR[DDR3 ×4]\n    D3 --> SOC\n    TF[TF 卡 · 救砖启动] <--> SOC\n    EMMC[eMMC 5.1 · 主启动] <--> SOC\n    X[24MHz 晶振] --> SOC\n    SOC --> HDMI[HDMI 座]\n    SOC --> USB[USB OTG / Host]\n    SOC --> IR[红外接收头]\n    SOC --> DBG[UART0 调试 / FEL 键 / LED]\n    SOC -->|RMII 百兆| PHY[RTL8201F 类 PHY]\n    PHY --> RJ45[RJ45 · 内置网络变压器]\n    SOC -->|SDIO| WIFI[WIFI 模组 · 屏蔽罩内]\n```\n\n**模块清单表**：\n\n| # | 模块 | 选型建议 | 数量 | 说明 |\n|:--:|:--|:--|:--:|:--|\n| 1 | 主控 SOC | 全志 H3（FBGA-347） | 1 | 本课主角，BGA 首秀 |\n| 2 | 内存 | DDR3 8bit 颗粒（512Mb 级，1.5V；选 DDR3L 则 1.35V，需与电源表同步） | 4 | 组成 32bit 总线，贴 H3 两侧或同侧 |\n| 3 | 大容量存储 | eMMC 5.1（153 球 / 11.5×13mm） | 1 | 8bit 总线，紧贴 H3 |\n| 4 | 启动介质 | 自弹 TF 卡座 | 1 | 官方系统可从 TF 启动，救砖用 |\n| 5 | 网口 | RTL8201F / IP101G 类 PHY + RJ45（内置变压器，如 HR911105A） | 1 | RMII 百兆 |\n| 6 | USB | Micro-USB（OTG）+ Type-A（Host） | 2 | OTG 兼做 FEL 烧录口 |\n| 7 | 显示 | HDMI Type-A 母座 + ESD 阵列 | 1 | H3 内置 HDMI PHY，外围极简 |\n| 8 | 红外 | HS0038 / VS838 接收头 | 1 | 遥控器接收，远离板边噪声 |\n| 9 | WIFI | SDIO 模组（XR818 / RTL8189 类）+ 板载天线 | 1 | 屏蔽罩练习的载体（强烈建议做） |\n| 10 | 电源 | DC005 座 + 三路 DCDC（2~3A 级同步整流，CPU 路取 3A） | 1 | 见下方电源表 |\n| 11 | 时钟 | 24MHz 无源晶振 | 1 | 紧贴 H3，包地 |\n| 12 | 调试 | UART0 排针 + FEL 按键 + 系统 LED | — | 留测试点，量产板思维 |\n\n**电源树与电流估算**（轨名、电压以 H3 数据手册电源章节为准，下表为机顶盒方案典型值）：\n\n| 电源轨 | 电压 | 电流估算 | 方案 | PCB 载体 |\n|:--|:--:|:--:|:--|:--|\n| 5V 输入 | 5V | 峰值 ≥2A | DC005 直进 | ≥40mil 主干 + 4 过孔 |\n| VCC_IO（IO/eMMC/HDMI） | 3.3V | ~1.5A | DCDC#1 | L3 平面岛 |\n| VDD_DDR（DDR3 电源） | 1.5V | ~0.8A | DCDC#2 | L3 岛 → 星形到 4 颗 DDR |\n| VDD_CPU（内核，DVFS 动态调压） | 1.2V（0.9~1.3V） | 峰值 ~2A | DCDC#3（3A 级） | L3 独立大岛 |\n\n**启动与调试链路说明**（画原理图时就要留好）：\n- H3 支持 TF 卡 / eMMC / SPI NOR 多种启动介质，本板用 eMMC 主启动 + TF 备份；\n- **FEL 模式**是全志的 USB 下载模式：OTG 口接电脑 + 按住 FEL 键上电，即可用烧录工具（如 sunxi-fel / PhoenixSuit）写入系统——这是救砖的命根子，FEL 键必须画、必须好按；\n- UART0 调试串口（115200bps）排针必须保留：能上电就看到启动日志（BootLog），黑屏排查全靠它；\n- IR 接收头与系统 LED 是「人机确认」：LED 呼吸 = 系统活着，遥控有反应 = IR 链路通。\n\n**资料获取指引**：H3 数据手册从全志官网或代理商、方案商渠道获取；**立创开源硬件平台**搜「H3」「OrangePi Zero」有大量开源原理图可对照；香橙派 OrangePi Zero 官网公开原理图 PDF，是本课最好的参考设计。\n\n### 20.2 叠层设计\n\n| 层号 | 名称 | 用途 | 厚度参考 |\n|:--:|:--|:--|:--|\n| L1 | TOP | 元件 + 信号 + BGA 外环出线 | 1oz 铜（35µm） |\n| — | 半固化片（prepreg） | L1–L2 介质 | ~0.2mm（7628 类） |\n| L2 | GND02 | **完整地平面，不许分割** | 35µm |\n| — | 芯板（core） | L2–L3 介质 | ~1.0mm |\n| L3 | PWR03 | 电源平面（按电压轨分割成岛） | 35µm |\n| — | 半固化片 | L3–L4 介质 | ~0.2mm |\n| L4 | BOTTOM | 元件 + 信号 + 铺铜 | 35µm |\n\n设计纪律：\n1. **L2 是全板的「大地」**，任何理由都不要割它——TOP 信号的第一参考层就是它。\n2. **L3 按电源轨分割成岛**：3.3V / 1.5V / 1.2V 各一岛，岛界沿着「不重要的区域」划。\n3. **注意：BOTTOM 信号参考的是 L3（电源平面）**。BOTTOM 上走高速线前，先看它下方 L3 是不是完整对应轨的岛——跨岛就是跨分割（split plane），回流路径断裂。底线：**BOTTOM 高速线下方保持同轨完整铜；跨不过去就改走 TOP**。\n4. 阻抗说明：低成本 4 层打样通常不做控阻（板厂按标准叠层生产）；若要控阻（如 HDMI 100Ω 差分），下单时勾选阻抗要求并按板厂返回的叠层微调线宽。经验值：TOP 到 L2 介质 ~0.2mm 时，50Ω 微带线宽约 0.33~0.38mm，100Ω 差分约 0.15~0.2mm 线宽 / 0.18~0.25mm 间距——**以板厂阻抗模板为准**。\n\n### 20.3 布局规划\n\n**布局分区图**（H3 居中，高速模块贴身，低速与接口沿边）：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 575 345\" width=\"575\" height=\"345\" role=\"img\"><rect class=\"fp-board\" x=\"6\" y=\"6\" width=\"560\" height=\"330\" rx=\"8\"/><text x=\"20\" y=\"26\" text-anchor=\"start\" font-size=\"10\" class=\"fp-strong\">电源区（板角，远离天线/音频）<\/text><rect class=\"fp-part\" x=\"24\" y=\"36\" width=\"130\" height=\"44\" rx=\"5\"/><text x=\"89.0\" y=\"62.0\" text-anchor=\"middle\" font-size=\"11\">DCDC ×3<\/text><text x=\"160\" y=\"60\" text-anchor=\"start\" font-size=\"10\" class=\"fp-note\">DC005 5V 入口<\/text><rect class=\"fp-part\" x=\"320\" y=\"36\" width=\"80\" height=\"44\" rx=\"5\"/><text x=\"360.0\" y=\"62.0\" text-anchor=\"middle\" font-size=\"11\">eMMC<\/text><rect class=\"fp-part\" x=\"416\" y=\"36\" width=\"90\" height=\"44\" rx=\"5\"/><text x=\"461.0\" y=\"62.0\" text-anchor=\"middle\" font-size=\"11\">DDR3 ×2<\/text><line class=\"wv-dash\" x1=\"16\" y1=\"94\" x2=\"556\" y2=\"94\" stroke=\"var(--line)\"/><rect class=\"fp-part\" x=\"24\" y=\"108\" width=\"110\" height=\"40\" rx=\"5\"/><text x=\"79.0\" y=\"125.0\" text-anchor=\"middle\" font-size=\"11\">RJ45<\/text><text x=\"79.0\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\">（内置变压器·板边）<\/text><rect class=\"fp-part\" x=\"150\" y=\"108\" width=\"70\" height=\"40\" rx=\"5\"/><text x=\"185.0\" y=\"125.0\" text-anchor=\"middle\" font-size=\"11\">PHY<\/text><text x=\"185.0\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\">（百兆）<\/text><rect class=\"fp-core\" x=\"240\" y=\"104\" width=\"130\" height=\"76\" rx=\"5\"/><text x=\"305.0\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\">H3 BGA<\/text><text x=\"305.0\" y=\"153.0\" text-anchor=\"middle\" font-size=\"11\">+ 24MHz 晶振<\/text><rect class=\"fp-part\" x=\"388\" y=\"104\" width=\"90\" height=\"44\" rx=\"5\"/><text x=\"433.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"11\">DDR3 ×2<\/text><rect class=\"fp-part\" x=\"388\" y=\"158\" width=\"90\" height=\"30\" rx=\"5\"/><text x=\"433.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"11\">HDMI 座<\/text><rect class=\"fp-part\" x=\"24\" y=\"162\" width=\"110\" height=\"40\" rx=\"5\"/><text x=\"79.0\" y=\"186.0\" text-anchor=\"middle\" font-size=\"11\">TF 卡座<\/text><line class=\"wv-dash\" x1=\"16\" y1=\"214\" x2=\"556\" y2=\"214\" stroke=\"var(--line)\"/><rect class=\"fp-part\" x=\"24\" y=\"228\" width=\"100\" height=\"34\" rx=\"5\"/><text x=\"74.0\" y=\"243.0\" text-anchor=\"middle\" font-size=\"9\">Micro-USB<\/text><text x=\"74.0\" y=\"255.0\" text-anchor=\"middle\" font-size=\"9\">OTG<\/text><rect class=\"fp-part\" x=\"138\" y=\"228\" width=\"86\" height=\"34\" rx=\"5\"/><text x=\"181.0\" y=\"243.0\" text-anchor=\"middle\" font-size=\"9\">Type-A<\/text><text x=\"181.0\" y=\"255.0\" text-anchor=\"middle\" font-size=\"9\">Host<\/text><rect class=\"fp-part\" x=\"238\" y=\"228\" width=\"44\" height=\"34\" rx=\"5\"/><text x=\"260.0\" y=\"249.0\" text-anchor=\"middle\" font-size=\"11\">IR<\/text><rect class=\"fp-part\" x=\"296\" y=\"228\" width=\"120\" height=\"34\" rx=\"5\"/><text x=\"356.0\" y=\"249.0\" text-anchor=\"middle\" font-size=\"9\">UART0/FEL 调试区<\/text><rect class=\"fp-rf\" x=\"430\" y=\"222\" width=\"120\" height=\"56\" rx=\"5\"/><text x=\"490.0\" y=\"248.0\" text-anchor=\"middle\" font-size=\"9\">WIFI + 屏蔽罩<\/text><text x=\"490.0\" y=\"260.0\" text-anchor=\"middle\" font-size=\"9\">板载天线 → 板边豁口<\/text><\/svg>\n```\n\n**摆放理由**：\n- **DDR3 与 H3 的距离是本板成败关键**：4 颗分组就近摆放（见本课布局图：H3 上侧与右侧各一组），让每组数据线「就近出线」，总线长天然短且对称；地址线走 H3 一侧共享。\n- eMMC、PHY、HDMI、WIFI 分占 H3 四个方向，互不打架——**BGA 板布局的本质是给每个方向分配一个「出口」**。\n- 24MHz 晶振贴 H3 晶振脚 ≤10mm，包地；H3 本体下方 L2 保持完整地。\n- RJ45 与 PHY 同侧直连；网络变压器已集成在 RJ45 内（选「内置变压器」型号省一大堆外围）。\n- WIFI 模组放板角，**天线朝板外**，屏蔽罩一侧留天线豁口；天线方向远离 DDR 与电源。\n- 电源区占一角，三路 DCDC 排成一列，散热与 EMI 集中处理；功率环路（输入电容→电感→输出电容）面积最小化。\n\n**飞线引导**：先只显示 DDR 相关飞线 → 摆好 DDR 颗粒 → 再显示 eMMC/PHY/HDMI 分组微调 → 最后全板看交叉。BGA 板布局要**分组切换显示**，一次看全所有飞线只会眼花。\n\n**布局验收清单**（进入扇出与布线前逐项打勾）：\n- [ ] DDR3 颗粒距 H3 ≤25mm，各字节组就近、方向对准扇出环\n- [ ] eMMC 距 H3 ≤25mm，8bit 走线不与 DDR 抢同一出口方向\n- [ ] 24MHz 晶振贴片 ≤10mm 且包地区域完整\n- [ ] PHY 与 RJ45 同侧直连，MDI 线短\n- [ ] 三路 DCDC 集中一角，功率环路（输入电容→电感→输出电容）肉眼可见地小\n- [ ] WIFI 模组天线朝外、净空区无铜无件（所有层）\n- [ ] UART0/FEL/测试点全部可达，不被屏蔽罩、高件遮挡\n- [ ] 全板飞线分组抽查无整板交叉\n\n### 20.4 布线与重点难点\n\n**线宽 / 间距规则表**：\n\n| 对象 | 线宽/间距 | 说明 |\n|:--|:--|:--|\n| 一般信号 | 5/5mil | 4 层板空间紧张，全局 5mil |\n| **BGA 区域内** | **4/4mil（或 3.5/3.5mil）** | 常规工艺上限，下单如实填写并选对应工艺档 |\n| DDR3 单端线 | 5mil | 组内并行，间距满足 3W（见 20.7） |\n| DDR3 差分（DQS/CK） | 5mil 线宽，对内间距 5mil | 尽量并行走线 |\n| HDMI TMDS ×4 对 | 5mil，对内 6~7mil | 差分对，远离板边 ≥20mil |\n| USB D+/D− | 5mil，对内 5mil | 并行短走线 |\n| 电源主干（外层） | ≥40mil / 约 2A | 经验：外层 1oz、10℃ 温升下 1A 约 0.25~0.3mm 线宽，用板厂线宽计算器复核 |\n\n**布线顺序**：① BGA 扇出 → ② DDR3 分组布线与等长 → ③ HDMI/USB/RMII → ④ 电源平面与电源主干 → ⑤ 其余信号 → ⑥ 铺铜。\n\n**难点一：H3 BGA 扇出六步法**（详细方法论见 20.7）：\n1. 查封装：确认焊盘外径、球距（以官方封装为准）；\n2. 在 BGA 投影区建区域规则（Room/规则区）：线宽 4mil、间距 4mil、过孔 0.15mm 孔 / 0.30mm 盘；\n3. 电源/地焊盘先行：每个地焊盘打 1 孔（可两焊盘共享），电源焊盘 2~4 孔并联直下 L2/L3 平面；\n4. 信号焊盘狗骨扇出：过孔打在相邻 4 焊盘正方形中心，焊盘到过孔短走线；\n5. 环形逃逸：最内 1~2 环信号从 TOP 过孔间隙直接走出，其余经通孔下到 BOTTOM，在 BGA 投影区内展开引出；\n6. 逐环 DRC + 目检，确认无焊盘-过孔、过孔-过孔间距违例。\n\n**难点二：DDR3 分组等长**（第 18 课知识首次实战）：\n\n| 组名 | 包含信号 | 组内误差（经验值） | 备注 |\n|:--|:--|:--:|:--|\n| 数据组 0 | DQ0~7 + DQS0± + DQM0 | ≤ ±25mil（0.64mm） | DQS 差分对内 ≤5mil |\n| 数据组 1~3 | 其余三个字节组 | 各 ≤ ±25mil | 32bit 共 4 组 |\n| 地址/命令组 | ADDR/BA/CAS/RAS/WE/CS/CKE/ODT | ≤ ±100mil（2.5mm） | 以 CLK 为基准 |\n| 时钟 CLK± | 差分对 | 对内 ≤5mil，与各组 DQS 组间 ≤50mil | — |\n\n> 以上为通用 DDR3 设计经验值，**最终以全志 H3 数据手册 / 硬件设计指南给出的等长表为准**。等长绕线放在组内「最长的线」定标后统一补偿，蛇形线间距 ≥2 倍线宽。\n\n**DDR3 布线三条补充纪律**：\n1. **数据组「各自为政」**：每个字节组（8 根 DQ + DQS + DQM）走向自己那一侧的颗粒，不同组之间不交叉、不共用通道；地址组才走「总线共享」；\n2. **善用引脚交换（pin swap）**：为让走线顺畅，同一字节组内的 DQ 位序通常可交换（软件可配置），但 **DQS/DQM/CK/控制类引脚绝不允许交换**——交换前查 H3 数据手册的 MIO/引脚复用说明；\n3. **参考地完整**：DDR 走线所在层（TOP/BOTTOM）下方的 L2/L3 必须连续；BOTTOM 的 DDR 线要逐根检查下方 L3 是否为对应电源轨连续区。\n\n**难点三：RMII 网口**：\n- REF_CLK（50MHz）是命脉：PHY 与 MAC 之间尽量短（≤100mm 级），两侧包地，地孔伴随；\n- TX/RX 各 4 根 + MDIO/MDC，按「一组」并行走线，组内不严格要求等长（百兆宽松），但别绕远；\n- RJ45 侧 MDI 两对差分（100M 只用 2 对），变压器已内置；PHY 侧按所选 PHY 手册配 RBIAS 电阻（1% 精度）。\n\n**难点四：电源通道**：1.2V CPU 岛是最大电流路径，DCDC 输出到岛用粗线 + 多孔「灌」进去；电感下方及其正下方内层禁止走任何信号线；SW 开关节点铺铜克制够载流即可（面积越大 EMI 越差）。\n\n### 20.5 铺铜、地平面与电源处理\n\n1. **L2 绝对完整**：H3 下方的地焊盘过孔阵就是全板回流枢纽；若某电源必须借 L2，只允许「窄缝借道」且缝两侧补地孔桥接。\n2. **L3 分割三原则**：① 岛界避开 BOTTOM 高速线投影；② 每岛进出电源 ≥2 过孔；③ 岛与岛间隙 ≥20mil。\n3. TOP/BOTTOM 铺铜接 GND，与 L2 用地孔缝合：BGA 区、DDR 区、晶振区、接口区每 5mm 一个。\n4. **每个 BGA 电源焊盘环**配 2~3 颗 100nF（0402/0201 视封装间距塞入）+ DCDC 输出处 22µF 级大电容。\n5. HDMI/USB 座外壳脚、RJ45 外壳：经 TVS 或直接接机壳地（chassis/GND 策略按参考设计），接口金属壳就近打孔接地。\n6. WIFI 天线净空区（keepout）：天线正下方及外侧 5mm 内所有层禁止铺铜与走线。\n\n### 20.6 DRC 检查与生产文件输出\n\n- **DRC 规则**：全局 5/5mil、BGA 区 4/4mil、过孔 0.15/0.30mm → 错误清零 + 飞线清零；另外手工专项检查：BGA 焊盘-过孔间距、等长报告（输出长度表核对 20.4 表格）。\n- **Gerber 输出**：铜层 ×4 + 阻焊 ×2 + 丝印 ×2 + 钻孔 + 板边；CAM 预览逐层检查，重点看 BGA 区阻焊桥是否可制作（板厂标准工艺即可，无需特殊要求）。\n- **打样下单参数**（与 2 层板的差异点加粗）：\n\n| 参数 | 选择 | 说明 |\n|:--|:--|:--|\n| 板层 / 板厚 | **4 层** / 1.6mm | 叠层选 TOP/GND/PWR/BOTTOM 标准结构 |\n| 最小线宽/间距 | **如实填 4/4 或 3.5/3.5mil** | 低于免费档位会有少量加价，别谎报 |\n| 过孔 | 0.2mm 孔（0.8mm 球距的常规档；0.15mm 小钻针档留给更密 BGA） | 按实际工艺档勾选 |\n| 表面处理 | **沉金 ENIG**（推荐） | BGA 焊盘平整度要求高，喷锡会偏锡 |\n| 过孔处理 | 过孔盖油 | — |\n| 数量 | 5~10 片 | — |\n| 阻抗（可选） | 如需控阻则勾选并填要求 | 板厂会返回调整后的线宽 |\n\n- **BOM + CPL 必须导出**：BGA 与 0402 电容**强烈建议委托板厂 SMT 贴片**（钢网 + 回流焊），手工焊 BGA 成功率极低；若坚持手焊，须有热风枪/加热台 + 大量助焊剂，并接受较高报废率。\n- 下单备注栏写明：BGA 区域最小线宽/间距数值、过孔最小孔径，方便厂内审核。\n\n**回板验收清单**（开箱即查，别急着上电）：\n- [ ] 层数/板厚/颜色与下单一致，板边平整无毛刺\n- [ ] BGA 焊盘阻焊完好、无破孔偏孔（放大镜看 BGA 区）\n- [ ] 沉金面平整光亮，无氧化发黑\n- [ ] 孔位抽检：排针孔、USB 座孔对位准确\n- [ ] 丝印位号清晰、无偏移压盘\n- [ ] 拿万用表蜂鸣档抽测：GND 各点连通、电源轨之间无短路\n\n**贴片策略选择**（BGA 板第一课）：\n- 全委托 SMT：提供 BOM + CPL，板厂代购物料并贴装，贵但稳；适合主控、LPDDR 这类高价值器件；\n- 混合模式：BGA 与 0402 委托贴片，连接器、排针自己手焊——性价比之选；\n- 无论哪种，**首件（前 1 片）先做目检 + X 光检查 BGA 焊点**（板厂可代做），结合 X 光能力、电气测试与其他检查确认后再批量处理；X 光不能保证识别所有空焊。\n\n### 20.7 本课核心技能专项：BGA 出线 / 屏蔽罩 / 3W 规则详解\n\n**A. BGA 出线通用方法（背下来，以后所有 BGA 板通用）**\n\n球距决定工艺，先背这张表：\n\n| BGA 球距 | 难度 | 推荐过孔（孔/盘） | 线宽/间距 | 每通道线数 | 备注 |\n|:--:|:--:|:--|:--|:--:|:--|\n| ≥1.0mm | ★ | 0.3/0.6mm | 5/5mil | 2 | 常规免费工艺 |\n| 0.8mm | ★★ | 0.2/0.4mm | 4/4mil | 1 | 常规工艺上限内 |\n| 0.65mm | ★★★ | 0.15/0.30mm | 3.5~4/3.5~4mil | 1 | 需小钻针工艺，下单注明 |\n| 0.5mm | ★★★★ | 0.1/0.30mm 激光盲孔 | 3/3mil | 1 | HDI 工艺，成本明显上升 |\n| ≤0.4mm | ★★★★★ | 盲埋孔/堆叠孔 | — | — | 多阶 HDI，量产板常见 |\n\n两种扇出方式：\n- **狗骨式（dogbone）**：过孔打在 4 个焊盘的正方形中心，焊盘引短线上过孔——**常规首选**，本课用这种；\n- **盘中孔（via in pad）**：过孔直接打在焊盘上，出线最省空间，但必须做树脂塞孔 + 电镀封帽（POFV），打样加价，0.65mm 球距通常用不着。\n\n操作细节：\n1. 扇出方向**统一**（建议全部朝一个方向斜打），出线通道才整齐；\n2. 先扇出电源/地（数量最多的内环球），再扇出信号，DDR 相关信号**优先分配到 TOP 好逃逸的环位**；\n3. 每根信号从焊盘到目标层**只允许 1 个过孔**；\n4. 出线顺序从**最内环开始**，内环走不到的层再往外让；\n5. 完成后做三查：DRC 间距、逐环目检、等长敏感信号是否走了 BGA 区最顺的通道。\n\n**B. 屏蔽罩（shield can）落地**\n\n屏蔽罩是一个金属结构件，PCB 上要做的是「一圈可焊接的墙脚」：\n1. 沿罩体四周布焊盘：约 0603 大小、中心间距 2.0~2.54mm；\n2. **每个焊盘旁打 1~2 个 0.3mm 地过孔**直连 L2——接地不良的屏蔽罩只是个装饰品；\n3. 罩内区域设高度 keepout：罩外器件、调试点、测试点不得进入；\n4. **天线豁口**：板载天线必须伸出罩外，或在罩壁开缺口；天线净空区所有层禁铜；\n5. 选两片式可拆屏蔽罩（调试期能掀盖），罩体高度 = 内部最高元件 + 1mm；\n6. 最常见错误：把屏蔽罩画成元件层一块实心铜箔——屏蔽靠的是立起来的金属壁，平铺的铜不屏蔽。\n\n**C. 3W 规则（3W rule）**\n\n- 定义：相邻两根线的**中心距 ≥ 3 倍线宽**（W 为线宽），即净间距 ≥ 2W。例：5mil 线 → 中心距 ≥15mil、净间距 ≥10mil。\n- 原理：线间电磁场耦合随距离迅速衰减，3W 中心距可把感性串扰（crosstalk）降低约 70%。\n- 应用位置：DDR3 数据组**之间**、时钟/复位线两侧、USB/HDMI 与普通信号之间；差分对与差分对之间同样适用（对中心距 ≥3W，条件允许 4W 更好）。\n- 局限：3W 是低成本经验规则，不是高速设计的完整答案；更高要求靠**完整参考平面 + 包地 + 地孔隔离**叠加。\n\n**3W 计算示例**（面试常考）：设 DDR 数据线线宽 W=5mil——\n- 3W 要求：相邻线中心距 ≥ 3×5 = 15mil，即净间距 ≥ 10mil（约 0.25mm）；\n- 若走线只能给 12mil 中心距（净间距 7mil），就不到 3W，此时要么包地隔离、要么挪层；\n- 记住量纲：3W 比的是**中心距**不是净间距，考试和评审都在这设坑。\n\n**本课术语速查**：\n\n| 术语 | 英文 | 一句话解释 |\n|:--|:--|:--|\n| 扇出 | fanout | 把 BGA 焊盘经短走线+过孔引到可布线层 |\n| 狗骨式扇出 | dogbone fanout | 过孔打在 4 焊盘中心的经典扇出方式 |\n| 盘中孔 | via in pad | 过孔直接打在焊盘上，需塞孔封帽 |\n| 树脂塞孔/封帽 | via plugging / POFV | 堵孔电镀，防吸锡、可焊 |\n| 串扰 | crosstalk | 相邻走线间的电磁耦合干扰 |\n| 3W 规则 | 3W rule | 线中心距 ≥3 倍线宽的降串扰经验规则 |\n| 屏蔽罩 | shield can | 焊在板上的金属罩，隔离射频/噪声 |\n| 网络变压器 | Ethernet magnetics | 网口信号耦合与隔离器件 |\n| 平面分割 | plane split | 一个铜平面切成多个电压岛 |\n| 回流路径 | return path | 电流返回路径，须与信号
