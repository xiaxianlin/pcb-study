<script id="course-data" type="application/json">{"title":"PCB 设计系统教学课程","lessons":[{"id":"01","title":"第 01 章 · 基础概念","short":"基础概念","stage":1,"diff":1,"prev":"无","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用自己的话解释电荷、电流、电压、电阻、功率，并说出它们的单位。\n2. 看懂 `5V`、`10kΩ`、`100nF`、`20mA` 这类标注，能换算常见数量级。\n3. 判断串联与并联，算总电阻、分压和分流。\n4. 用欧姆定律和功率公式算 LED 限流电阻、走线压降和电阻功耗。\n5. 说清通路、开路、短路，知道短路为什么危险。\n6. 说清“地”只是参考点，知道电压表并联、电流表串联。\n7. 用 KCL、KVL 检查一个简单电路，理解负载效应。\n8. 知道直流、交流、周期、频率、占空比、有效值这些词在说什么。\n\n本章不要求你背完所有公式。更重要的是建立画面：看到一块板子、一张原理图、一个数字，你知道它在说哪件事。\n\n## 正文\n\n### 1.1 电、电荷与电流：先建立画面\n\n这一节只做一件事：把“电”从一个抽象名词，变成你能在脑子里看见的画面。后面所有公式，都是在这个画面上做加减乘除。\n\n#### 1.1.1 电荷：电的“原材料”\n\n想象一个水池，里面装了多少水，我们心里有数。电也一样，是一种“东西”，只是小到看不见。\n\n一切物质由原子组成。原子中心是**原子核**，带正电；外围是**电子**，带负电。平时正负电量相等、互相抵消，物体就“不带电”；一旦电子被搬走或塞进来，平衡被打破，物体就带电了。\n\n这种“带电的多少”叫**电荷**（charge），符号常用 `Q`，单位是**库仑**（coulomb，符号 `C`）。\n\n库仑是一个很大的单位。1 库仑约等于 `6.24×10¹⁸` 个电子所带电荷量的绝对值。这个数不用记，有感觉就行：单个电子的电量小到夸张，所以人们成堆地数它们，就像用“吨”来数米。\n\n两个够用的直觉：\n\n- **同性相斥、异性相吸**：正正互推、正负互拉。\n- **电荷只转移、不凭空产生**：这叫电荷守恒。摩擦起电不是“造出电”，而是把电子从一个物体搬到另一个物体。\n\n材料按“电子能不能自由跑”分成三类：\n\n| 类别 | 特点 | 常见材料 | 在 PCB 上的角色 |\n|---|---|---|---|\n| 导体 | 电子能自由移动 | 铜、金、银、铝、焊锡 | 铜箔走线、焊盘、过孔内壁镀铜 |\n| 绝缘体 | 电子被束缚，几乎不导电 | 玻璃纤维与树脂组成的 FR-4、塑料、陶瓷、空气 | 基材、阻焊层、导线外皮 |\n| 半导体 | 导电能力介于两者之间，而且可以控制 | 硅、锗 | 二极管、三极管、MOS 管、芯片的原材料 |\n\n半导体先留个印象：芯片不是“更高级的铜线”，而是用“可控制的导体/绝缘体”堆出来的开关阵列。它什么时候通、什么时候断，由电压和掺杂决定。第 05～08 章会逐个拆开。\n\n**这在板子上**：一块 PCB 就是“导体 + 绝缘体”的三明治。中间是玻璃纤维（绝缘），两面贴铜箔（导体）；蚀刻掉不要的铜，剩下的铜线就是电路。你以后画的每一根走线，本质上都是这里的“导体”。\n\n#### 1.1.2 电流：电荷的定向移动\n\n水在水管里流动，我们叫水流；电荷在导体里定向移动，我们叫**电流**（current），符号常用 `I`。\n\n电流的大小，用“单位时间内流过某个截面的电荷量”来定义：\n\n```text\nI = Q / t\n```\n\n- `I`：电流，单位**安培**（ampere，符号 `A`）\n- `Q`：电荷量，单位库仑（`C`）\n- `t`：时间，单位秒（`s`）\n\n所以 `1 A = 1 C/s`：每秒钟有 1 库仑电荷流过这个截面。\n\n这里要提前说清一个容易误会的地方：**电流的方向，物理上规定为正电荷流动的方向**，也就是从电源正极经外电路流向负极。但在金属导线里，真正移动的是带负电的电子，它们的方向正好相反。\n\n这会不会矛盾？不会。这只是“记账约定”。就像地铁里人群往出口走，但你统计“客流方向”时可以从入口往出口记。工程上统一用“正电荷方向”，公式和符号才不容易乱。你只要记住：**算电路时按规定的电流方向算，不要一会儿按电子、一会儿按正电荷。**\n\n电流还分两种情况：\n\n- **直流**（DC，direct current）：方向不随时间改变，大小可以稳定，也可以有纹波。\n- **交流**（AC，alternating current）：方向随时间周期性改变。家里插座就是交流，我们后面做实验只用隔离低压。\n\n严格说，“直流/交流”描述的是随时间的变化方式，不是“电池/插座”的同义词。电池也可能被电路快速开关，变成脉冲电流；插座经过整流也能变直流。第 1.5 节会专门讲“随时间变化”这件事。\n\n电流要持续流动，必须有**闭合路径**：从电源一端出发，经过负载，再回到电源另一端。路径断了，电流就停了（开路）；路径被一根几乎零电阻的线直接接通，电流会异常大（短路，1.2 节讲）。\n\n**这在板子上**：电流从电源正极出发，经过稳压器、走线、过孔、器件引脚、负载，再经地线回到电源负极。走线不是“理想导线”，它有电阻，所以大电流路径会发热、会掉电压。第 1.3 节会算这件事。\n\n#### 1.1.3 电压：两点之间的“电位差”\n\n水为什么往低处流？因为高处和低处有高度差。电荷为什么愿意流动？因为两点之间有**电位差**。\n\n**电压**（voltage）就是两点之间的电位差，符号常用 `U`（有些书用 `V`），单位**伏特**（volt，符号 `V`）。\n\n电压的定义可以从能量理解：把 1 库仑电荷从一点搬到另一点，如果电场做了 1 焦耳的功，这两点之间的电压就是 1 伏特：\n\n```text\n1 V = 1 J/C\n```\n\n这个定义现在不用深究，先记住一句更重要的话：\n\n> **电压永远是两个点之间的事，不存在“某一点有 5V”这种绝对说法。**\n\n我们说“这个引脚是 5V”，省略了参照点，完整意思是“这个引脚相对于电路的地（0V 参考点）是 5V”。如果换一个参考点，同一个点的“电压读数”会变，但两点之间的电压差不变。\n\n这和身高很像：你说“他身高 1.8 米”，是以地面为参考；如果站在 10 米高的楼顶量，读数会变，但他和地面之间的高度差没变。电压也一样，**参考点决定读数，不决定电路里真实的电位差**。\n\n电路里的**地**（GND，ground）通常被选作 0V 参考点。注意：这里的“地”不一定真的接到大地。它可能只是板上的一条公共回线，叫**信号地**；也可能是金属外壳，叫**机壳地**；还可能是通过隔离电源浮空的**隔离地**。它们不是一回事，后面第 11 课讲接口和隔离时会展开。\n\n电压有正负。比如 `A 点比 B 点高 5V`，写成 `U_AB = +5V`；反过来 `U_BA = -5V`。负号只表示方向相反，不表示“比零小所以没有电”。\n\n**这在板子上**：电源轨（3.3V、5V、12V）是对地电压；器件的“耐压”指的是它两端允许的最大电压差；万用表测电压时，表笔要分别接触两个点，读数是这两点之间的差。\n\n**常见错**：把“电源电压”当成“某个电阻两端的电压”。比如 5V 电源串一个电阻和一个 LED，电阻两端并不是 5V，而是 `5V - LED 压降`。第 1.3 节会用算例纠正。\n\n#### 1.1.4 电阻：对电流的阻碍\n\n水在水管里流，会遇到管壁摩擦、弯头、阀门；电荷在导体里跑，也会遇到阻碍。这个阻碍作用叫**电阻**（resistance），符号常用 `R`，单位**欧姆**（ohm，符号 `Ω`）。\n\n电阻的定义来自欧姆定律：\n\n```text\nR = U / I\n```\n\n- `R`：电阻，单位欧姆（`Ω`）\n- `U`：电阻两端的电压，单位伏特（`V`）\n- `I`：流过电阻的电流，单位安培（`A`）\n\n所以 `1 Ω = 1 V/A`：在电阻两端加 1V，如果流过 1A，这个电阻就是 1Ω。\n\n电阻的大小由材料、长度、截面积和温度决定。定性地说：\n\n- 材料越难导电，电阻越大；\n- 导体越长，电阻越大；\n- 截面积越粗，电阻越小；\n- 温度升高时，多数金属的电阻会变大（不是所有材料都这样，半导体通常相反）。\n\n写成公式就是：\n\n```text\nR = ρ × L / A\n```\n\n- `ρ`（读作“rho”）：电阻率，材料本身的属性，单位 `Ω·m`\n- `L`：导体长度，单位米（`m`）\n- `A`：截面积，单位平方米（`m²`）\n\n这个公式现在不用代入复杂数字，但要记住它的三个结论：**长、细、材料差 → 电阻大**。PCB 走线为什么大电流要加宽？因为加宽就是增大 `A`，电阻和压降都会变小。\n\n还要分清两个概念：\n\n- **电阻**是物理性质，任何导体都有，哪怕是一根铜线。\n- **电阻器**（resistor）是专门做出来、具有确定阻值的元件，原理图里用 `R` 表示，位号如 `R1`。\n\n电阻器有额定功率。电流流过电阻会发热，超过额定功率可能烧毁。第 1.3 节会算。\n\n电阻不一定是“线性的”。线性电阻满足 `U/I` 为常数；二极管、LED、灯丝、热敏电阻的 `U/I` 关系不是直线，不能简单套欧姆定律。这个区别在第 05 章讲二极管时会非常关键。\n\n**这在板子上**：铜走线有电阻，过孔有电阻，连接器触点有电阻，电阻器本身更是故意做出来的电阻。小信号路径上，几欧姆可能无所谓；大电流路径上，几毫欧都会变成压降和热量。\n\n#### 1.1.5 功率与能量：电到底在“干什么”\n\n电流流过电阻会发热，灯泡会发光，电机会转。这些都是电在做功，也就是把电能转换成其他形式。\n\n**功率**（power）是单位时间内转移或消耗的能量，符号 `P`，单位**瓦特**（watt，符号 `W`）。\n\n最基本的公式是：\n\n```text\nP = U × I\n```\n\n- `P`：功率，单位瓦（`W`）\n- `U`：器件两端的电压，单位伏（`V`）\n- `I`：流过器件的电流，单位安（`A`）\n\n结合欧姆定律 `U = I × R`，还能得到两个常用变形：\n\n```text\nP = I² × R\nP = U² / R\n```\n\n这三个公式是同一件事的不同写法，用哪个方便就用哪个：\n\n- 知道电压和电流：用 `P = U × I`。\n- 知道电流和电阻：用 `P = I² × R`。\n- 知道电压和电阻：用 `P = U² / R`。\n\n**能量**（energy）是功率乘以时间：\n\n```text\nE = P × t\n```\n\n单位是**焦耳**（`J`）。日常电费说的“度”，是千瓦时（`kWh`）：`1 kWh = 1000W × 3600s = 3.6×10⁶ J`。\n\n功率和能量别混：\n\n- 功率是“快慢”：1W 的灯，每秒钟消耗 1J。\n- 能量是“总量”：1W 的灯亮 1 小时，消耗 3600J。\n\n**这在板子上**：电阻的额定功率常见 0.125W、0.25W、0.5W、1W。算出实际功耗后，不能贴着额定值用，要留降额余量（比如按额定值的 50%～70% 设计，具体看温度和厂家要求）。一个 0.25W 的电阻上消耗 0.2W，虽然“没超”，但已经很热，长期可靠性会下降。第 02 章会专门讲选型。\n\n#### 1.1.6 单位换算与数量级\n\n电子电路里的数字跨度很大，从皮安到安培、从皮法到法拉。先建立“数量级感”，比死记换算表更重要。\n\n常用前缀：\n\n| 前缀 | 符号 | 倍数 | 例子 |\n|---|---|---:|---|\n| 皮 | p | 10⁻¹² | 10pF = 0.00000000001F |\n| 纳 | n | 10⁻⁹ | 100nF = 0.1μF |\n| 微 | μ | 10⁻⁶ | 10μF = 0.00001F |\n| 毫 | m | 10⁻³ | 20mA = 0.02A |\n| 千 | k | 10³ | 10kΩ = 10000Ω |\n| 兆 | M | 10⁶ | 1MΩ = 1000000Ω |\n| 吉 | G | 10⁹ | 1GHz = 10⁹Hz |\n\n几个必须脱口而出的换算：\n\n- `1 A = 1000 mA = 10⁶ μA`\n- `1 V = 1000 mV`\n- `1 Ω = 1000 mΩ`；`1 kΩ = 1000 Ω`；`1 MΩ = 1000 kΩ`\n- `1 F = 1000 mF = 10⁶ μF = 10⁹ nF = 10¹² pF`\n- `100 nF = 0.1 μF`\n- `1 kHz = 1000 Hz`；`1 MHz = 1000 kHz`\n\n做计算前，先把单位统一成“伏、安、欧、瓦、秒”。比如 `20mA` 要写成 `0.02A`，`10kΩ` 要写成 `10000Ω`。这一步不做，答案会差 1000 倍。\n\n**这在板子上**：丝印上的 `103` 不是 103Ω，而是 `10×10³Ω = 10kΩ`；`104` 是 `100kΩ`。电容上的 `104` 是 `10×10⁴pF = 100nF`。这些标记法第 02、03 章会讲，现在先知道“数字不等于阻值本身”。\n\n#### 1.1.7 停下来检查\n\n1. 一个物体带负电，是多了电子还是少了电子？\n2. `2 A` 的电流，10 秒内流过某截面的电荷量是多少库仑？\n3. “这个引脚是 3.3V”这句话省略了什么？\n4. 一根铜线被加粗后，电阻变大还是变小？为什么？\n5. `P = U × I` 和 `P = I² × R` 在什么条件下等价？\n6. `100nF` 等于多少 `μF`？`10kΩ` 等于多少 `Ω`？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 多了电子。电子带负电，负电荷过剩。\n2. `Q = I × t = 2A × 10s = 20C`。\n3. 省略了参考点。完整意思是“这个引脚相对于电路 0V 参考点是 3.3V”。\n4. 变小。加粗增大了截面积 `A`，由 `R = ρL/A`，电阻与截面积成反比。\n5. 对线性电阻、且 `U` 是电阻两端电压时，由欧姆定律 `U = IR` 可推出 `P = I²R`。如果 `U` 拿的是电源电压而不是电阻两端电压，就不能直接代。\n6. `100nF = 0.1μF`；`10kΩ = 10000Ω`。\n\n<\/details>\n\n### 1.2 电路的基本连接\n\n#### 1.2.1 通路、开路、短路\n\n一个能持续工作的电路，至少要有三部分：\n\n- **电源**（source）：提供电压，推动电荷流动。\n- **负载**（load）：消耗电能、完成工作的部分，比如 LED、电阻、电机、芯片。\n- **连接路径**：把电源和负载连成闭合回路的导线、走线、接插件。\n\n按路径状态，电路分三种：\n\n| 状态 | 路径情况 | 电流 | 现象 |\n|---|---|---|---|\n| **通路**（closed circuit） | 闭合，电流能回到电源 | 正常 | 负载工作 |\n| **开路**（open circuit） | 某处断开 | 近似为零 | 负载不工作 |\n| **短路**（short circuit） | 电源两端被极低电阻直接连通 | 很大 | 发热、烧器件、电池危险 |\n\n短路为什么危险？因为回路里几乎只剩电源内阻和导线电阻，按欧姆定律 `I = U/R`，电阻极小，电流会非常大。这个电流会在导线、接插件、电池内部产生大量热，可能烧毁器件、熔化焊锡、引燃附近材料，锂电池还可能发生热失控。\n\n**短路不是“电压没了”**。短路时电源电压几乎都降在电源内阻和导线电阻上，负载两端反而接近 0V；但电流可能已经大到危险。所以“用万用表量到 0V”不能说明安全，必须断电查短路。\n\n**这在板子上**：焊接桥连、锡渣、器件引脚搭到一起、电源与地接反、封装焊盘画错，都可能造成短路。第一次上电前，先断电用万用表通断档查电源正负之间是否直通，是基本习惯。\n\n#### 1.2.2 串联与并联\n\n两个电阻（或任何器件）只有两种基本接法。\n\n**串联**：首尾相连，只有一条电流路径。\n\n```text\n        R1          R2\n  A ──[====]──●──[====]── B\n              │\n            这里没有分支\n```\n\n串联的特点：\n\n- 流过每个器件的**电流相同**（同一根水管，水流量一样）。\n- 各器件两端电压**相加**等于总电压：`U_total = U1 + U2`。\n- 总电阻**相加**：`R_total = R1 + R2 + …`。\n\n为什么总电阻相加？因为电荷要依次穿过每一段阻力，阻力当然越走越大。串联两个 10kΩ，总电阻就是 20kΩ。\n\n**并联**：首首相连、尾尾相连，电流有多个分支。\n\n```text\n          ┌──[ R1 ]──┐\n  A ──●──┤          ├──●── B\n          └──[ R2 ]──┘\n```\n\n并联的特点：\n\n- 每个分支两端的**电压相同**（都接在同样的两个节点上）。\n- 各分支电流**相加**等于总电流：`I_total = I1 + I2`。\n- 总电阻的倒数等于各分支倒数之和：\n\n```text\n1 / R_total = 1 / R1 + 1 / R2 + …\n```\n\n两个电阻并联时，有一个更顺手的形式：\n\n```text\nR_total = (R1 × R2) / (R1 + R2)\n```\n\n两个 10kΩ 并联，总电阻是 `(10k×10k)/(10k+10k)=5kΩ`。**并联越并越小**，因为相当于给电流多开了一条路；总电阻一定小于最小的那个分支。这个直觉很重要，后面算负载、算上拉下拉都会用到。\n\n串联分压、并联分流，是电路里最常用的两个“分配规则”。\n\n#### 1.2.3 分压与分流：先会算，再谈用\n\n**分压**：两个电阻串联，总电压按阻值比例分到各电阻上。\n\n```text\n        R1\n  Vin ──[====]──● Vout\n                │\n              [ R2 ]\n                │\n               GND\n```\n\n如果 `Vout` 取自 R2 两端（相对 GND），空载时：\n\n```text\nVout = Vin × R2 / (R1 + R2)\n```\n\n推导很短：串联电流 `I = Vin/(R1+R2)`；R2 两端电压 `Vout = I×R2`；代入就得到上式。\n\n例子：`Vin=5V`，`R1=10kΩ`，`R2=10kΩ`，则 `Vout=5×10k/(10k+10k)=2.5V`。两个阻值相等，电压对半分。\n\n如果 `R1=10kΩ`、`R2=1kΩ`，则 `Vout=5×1k/(11k)≈0.455V`。R2 越小，分到的电压越小。\n\n**分压公式只在输出端“几乎不取电流”时成立**。一旦在 Vout 上接负载，负载会和 R2 并联，等效阻值变小，输出电压就跌。这个现象叫**负载效应**，1.4 节会算。分压电路不能当“稳压电源”用，这是零基础最容易踩的坑之一。\n\n**分流**：两个电阻并联，总电流按阻值反比分配。\n\n```text\nI_total ──●──[ R1 ]──┐\n          │          ├── 回到电源\n          └──[ R2 ]──┘\n```\n\n两个并联分支中，流过 R1 的电流是：\n\n```text\nI1 = I_total × R2 / (R1 + R2)\n```\n\n注意分子是“另一个电阻”。因为阻值越小，分到的电流越大，所以公式里 R1 的电流配 R2。这个形式和分压刚好“反过来”，容易记混，建议每次用之前先想“电流喜欢走阻力小的路”。\n\n例子：总电流 3mA，R1=1kΩ，R2=2kΩ，则 `I1=3mA×2k/(1k+2k)=2mA`，`I2=1mA`。1kΩ 那条路更通畅，分到更多电流。\n\n#### 1.2.4 地（GND）只是参考点\n\n原理图里经常看到一条横线、一个倒三角，或者 `GND`、`AGND`、`PGND`、`EARTH` 这些标记。零基础最容易以为“地就是没有电”，其实不是。\n\n**地是人为选定的 0V 参考点。** 就像测身高以地面为 0，地只是“我们约定从这里开始量电压”。电路里的电流照样会流经地线，地线也有电阻，也会发热、掉电压。\n\n常见的“地”至少有三种：\n\n| 名称 | 含义 | 注意 |\n|---|---|---|\n| **信号地**（GND） | 板上大部分电路的 0V 参考，也是信号回流的公共路径 | 不是“万能吸收点”，大电流回流会抬高地电位 |\n| **大地 / 保护地**（EARTH、PE） | 真正接到建筑物大地，用于安全保护 | 与信号地可能隔离，不能想当然短接 |\n| **机壳地**（Chassis GND） | 金属外壳、屏蔽罩的参考 | 常与信号地通过电容/电阻/螺钉连接，具体看设计 |\n\n还有**隔离地**：通过变压器、光耦、隔离电源隔开的地。隔离两侧的地之间可能有很高的电位差，直接用万用表把两边地夹在一起，可能损坏设备或引入危险。\n\n**这在板子上**：`GND` 网络不是一个“点”，而是一大片铜、很多过孔、很多引脚。大电流（电机、电源）和小信号（传感器、ADC）共用一条地线时，大电流在地线电阻上产生的压降会叠加到小信号上，造成干扰。这就是后面要学的“回流路径”和“分区/单点接地”的由来。现在先记住：**地是参考点，也是电流的回流路径，不是垃圾场。**\n\n#### 1.2.5 电压表、电流表怎么接\n\n测量电压和电流，接线方式完全不同。接错可能读不出数，也可能烧表、烧电路。\n\n**测电压：并联。**\n\n电压是两点之间的差，所以电压表要跨接在被测两点上。\n\n```text\n       ┌──────[ V ]──────┐\n       │                 │\n  A ───●────[ 电阻 ]─────●─── B\n```\n\n电压表的内阻很大（理想为无穷大），几乎不取电流，所以并联上去不会明显改变原电路。万用表电压档就是这样用的。\n\n**测电流：串联。**\n\n电流要流过表，表才能数出多少电荷通过。所以电流表要串在被测支路里，让电流从表里穿过。\n\n```text\n  A ───[ A ]───[ 电阻 ]─── B\n        ↑\n     电流从表里流过\n```\n\n电流表的内阻很小（理想为零），串进去尽量不改变原电路。但“很小”不是零，会有一点**压降**（叫负担电压），大电流测量时要注意。\n\n**绝对不要把电流表并联在电源两端**。那相当于用一根几乎零电阻的线把电源短路，电流会瞬间很大，轻则烧保险，重则烧表、烧电源。\n\n**这在板子上**：测某器件电压，表笔分别点器件两端；测某支路电流，需要断开支路串入表，或者用电流探头/分流器。板上留测试点（test point）就是为了方便夹表笔，不用在密密麻麻的引脚上冒险。\n\n#### 1.2.6 停下来检查\n\n1. 两个 10kΩ 电阻串联、并联，总电阻各是多少？\n2. 5V 经 R1=10kΩ、R2=2kΩ 串联，R2 两端电压是多少？如果输出端接一个 2kΩ 负载，输出会变大还是变小？\n3. 为什么并联电路的总电阻一定小于最小的分支电阻？\n4. “GND 上没有电压”这句话为什么是错的？\n5. 测一个电阻两端的电压，表应该并联还是串联？测流过它的电流呢？\n6. 如果不小心把电流表并联到 5V 电源两端，会发生什么？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 串联 `20kΩ`；并联 `5kΩ`。\n2. 空载 `Vout=5×2k/(10k+2k)=0.833V`；接 2kΩ 负载后，R2 与负载并联成 1kΩ，`Vout=5×1k/(10k+1k)=0.455V`，变小。\n3. 并联相当于多开电流通路，总电流变大而电压不变，所以等效电阻变小；极限情况（短路一条分支）总电阻趋近 0。\n4. 地只是 0V 参考点，地线有电阻，电流流过会产生压降；大电流回流时地电位会抬升。\n5. 测电压并联；测电流串联。\n6. 相当于短路电源，电流会非常大，可能烧表、烧电源或引发危险。\n\n<\/details>\n\n### 1.3 欧姆定律与功率：电路计算的两把起子\n\n#### 1.3.1 欧姆定律的三种形态\n\n欧姆定律描述的是线性电阻上电压、电流、电阻三者的关系：\n\n```text\nU = I × R\nI = U / R\nR = U / I\n```\n\n三个式子完全等价，只是把不同的量放在等号左边。做题时先看“已知什么、求什么”，再挑最省事的那一个。\n\n- 已知电流和电阻，求电压：`U = I × R`。\n- 已知电压和电阻，求电流：`I = U / R`。\n- 已知电压和电流，求电阻：`R = U / I`。\n\n关键不是背公式，而是记住**每个量指的是同一段电路**。`U` 必须是这段电阻两端的电压，`I` 必须是通过这段电阻的电流，`R` 必须是这段电阻的阻值。三个量“对不上号”，算出来一定错。\n\n#### 1.3.2 欧姆定律的适用条件\n\n欧姆定律不是万能公式。它成立需要满足：\n\n1. **线性关系**：电压和电流成正比，`U/I` 是常数。普通金属电阻、绝大多数电阻器在正常工作范围内满足。\n2. **温度等条件基本稳定**：电阻会随温度变化，温度大幅变化时 `R` 不再是常数。\n3. **是同一段导体/电阻**：不能拿电源电压和另一个器件的电流硬套。\n\n下面这些**不能直接套欧姆定律**：\n\n- 二极管、LED：正向电压和电流是指数关系，不是直线。\n- 三极管、MOS 管：它们是受控器件，电流由控制端决定，不是简单 `U/R`。\n- 灯丝灯泡：冷态和热态电阻差很多，开机瞬间浪涌电流大。\n- 电机：启动、堵转、空载状态差别巨大。\n\n所以看到“非线性器件”，要查数据手册或按器件模型分析，不能拿万用表量一个电阻值就代入。\n\n#### 1.3.3 算之前先统一单位\n\n电子电路里最常见的计算错误不是公式错，而是单位没统一。\n\n规则很简单：**代入公式前，把电压换成伏（V）、电流换成安（A）、电阻换成欧（Ω）、功率换成瓦（W）、时间换成秒（s）。**\n\n例如：\n\n- `20mA` 写成 `0.02A`\n- `10kΩ` 写成 `10000Ω`\n- `100nF` 写成 `100×10⁻⁹F`\n- `2ms` 写成 `0.002s`\n\n如果题目给的是 `5V`、`10kΩ`，求电流，可以直接用 `I=5/10000=0.0005A=0.5mA`。如果先把 `10kΩ` 当成 `10` 代进去，就错了 1000 倍。\n\n#### 1.3.4 算例一：给 LED 选限流电阻\n\n这是最经典、也最容易被“想当然”算错的一道题。\n\n**题目**：5V 电源，红色 LED 正向压降约 2V，希望工作电流约 5mA，求串联限流电阻。\n\n**第一步：画清谁和谁串联。**\n\n```text\n  +5V ───[ R1 ]───→|─── GND\n                  LED\n```\n\n电阻和 LED 串联，流过它们的电流相同。电源电压 5V 分在两部分上：\n\n```text\nU_R + U_LED = 5V\n```\n\n**第二步：求电阻两端的电压。**\n\nLED 正向导通时，两端大约有 2V 的压降（具体查手册，且随电流、温度变化）。所以电阻两端不是 5V，而是：\n\n```text\nU_R = 5V - 2V = 3V\n```\n\n**第三步：用欧姆定律求电阻。**\n\n目标电流 5mA = 0.005A：\n\n```text\nR = U_R / I = 3V / 0.005A = 600Ω\n```\n\n600Ω 不是常用阻值，选标准系列里最接近的 **620Ω**。\n\n**第四步：复核实际电流。**\n\n```text\nI = 3V / 620Ω ≈ 0.00484A = 4.84mA\n```\n\n和 5mA 很接近，可以接受。实际还要考虑电源容差、LED 压降离散性、电阻容差。\n\n**第五步：算电阻功耗。**\n\n```text\nP_R = U_R × I ≈ 3V × 0.00484A ≈ 0.0145W\n```\n\n选 0.25W 电阻远远够用。\n\n**第六步：做一次保守上界。**\n\n如果电源偏高到 5.25V、电阻偏小到 646Ω（620Ω ±5% 的下限），并且极端假设 LED 压降为 0V：\n\n```text\nI_max = 5.25V / 646Ω ≈ 8.13mA\n```\n\n这个值是“最坏情况”的保守估计，用来确认不会超过 LED 允许电流。实际 LED 有正向压降，电流会比这个小。不能把绝对最大额定值（比如 30mA）当成推荐工作电流，仍要留余量和查温度降额。\n\n**这道题的关键不是 600Ω，而是：电阻两端的电压 = 电源电压 − LED 压降。** 直接把 5V 代进 `R=U/I` 会得到 `R=1kΩ`，电流只有约 3mA，LED 会偏暗；如果 LED 压降更低的型号，偏差更大。\n\n#### 1.3.5 算例二：PCB 走线的电阻和压降\n\n铜不是理想导体，走线有电阻。小信号可以忽略，大电流不能忽略。\n\n**题目**：一条 1oz 铜、宽 1mm、长 100mm 的走线，流过 1A，估算压降和功耗。\n\n1oz 铜厚约 `35μm = 35×10⁻⁶m`，宽 `1mm = 1×10⁻³m`，长 `0.1m`。截面积：\n\n```text\nA = 35×10⁻⁶ × 1×10⁻³ = 3.5×10⁻⁸ m²\n```\n\n铜的电阻率约 `ρ = 1.7×10⁻⁸ Ω·m`（室温附近，具体随温度和铜纯度变化）：\n\n```text\nR = ρL/A = 1.7×10⁻⁸ × 0.1 / 3.5×10⁻⁸ ≈ 0.049Ω\n```\n\n压降：\n\n```text\nU_drop = I × R = 1A × 0.049Ω ≈ 0.049V = 49mV\n```\n\n功耗：\n\n```text\nP = I²R = 1² × 0.049 ≈ 0.049W\n```\n\n49mV 的压降对 3.3V 逻辑可能已经接近允许范围，对 5V 电源也不小；0.049W 集中在一条细走线上，会局部升温。如果电流是 3A，压降和功耗都按平方/比例变大：压降约 0.147V，功耗约 0.44W。这就是大电流走线要加宽、加铜、多打过孔的原因。\n\n注意：这是**估算**，没有算过孔、焊盘、连接器、铜厚公差、温度升高等。实际设计要用板厂参数、载流表或仿真复核。这里只建立“走线不是零电阻”的意识。\n\n#### 1.3.6 功率、额定功率与降额\n\n前面已经给出三个功率公式。工程上还要多问一句：**这个功率，器件受不受得了？**\n\n电阻器手册里会写额定功率，比如：\n\n- 0603 贴片电阻常见 0.1W\n- 0805 常见 0.125W\n- 1206 常见 0.25W\n- 插件金属膜电阻常见 0.25W、0.5W、1W\n\n额定功率是在规定环境温度、安装条件下的允许值，不是“超过一点也没事”。实际使用要**降额**：\n\n- 电阻长期工作，建议按额定功率的 50%～70% 以内设计；\n- 环境温度高、散热差、多个发热器件挨在一起时，还要再降；\n- 脉冲、浪涌、启动电流要单独核算，不能只看平均值。\n\n**这在板子上**：一个 0.25W 电阻实际耗 0.2W，看起来“没超”，但已经很热；长期高温会改变阻值、缩短寿命，甚至烧断。选型时宁可大一号，也不要贴着极限用。\n\n功率和能量再区分一次：\n\n- 功率是“每秒消耗多少能量”，单位 W；\n- 能量是“总共消耗多少”，单位 J 或 kWh。\n\n电阻的发热功率是瞬时/平均功率；一段时间的总发热量是 `E=P×t`。算温升要看热阻和散热条件，不能只拿功率对比额定值。\n\n#### 1.3.7 常见错误清单\n\n1. **拿电源电压当电阻电压**：串联多个器件时，每个器件只分到一部分电压。\n2. **忘记 LED 正向压降**：`R=(5−2)/I`，不是 `R=5/I`。\n3. **mA 没换成 A**：`5mA` 要写成 `0.005A`，否则结果差 1000 倍。\n4. **把欧姆定律套在二极管/LED 上**：它们不是线性电阻，`U/I` 不是常数。\n5. **忽略电阻功率**：算出阻值就选最便宜的 0603，结果一上电就发烫。\n6. **把“额定功率”当“实际功耗上限”**：额定值要降额使用。\n7. **忽略容差和温度**：`±5%` 的电阻，最坏情况要按边界算。\n8. **把走线当理想导线**：大电流路径的压降和发热必须核算。\n\n#### 1.3.8 停下来检查\n\n1. 5V 电源、LED 压降 2V、目标电流 5mA，限流电阻约多少？选 620Ω 后实际电流约多少？\n2. 一个 1kΩ 电阻两端电压 5V，流过它的电流是多少？功耗是多少？\n3. 一个 0.25W 电阻实际耗 0.3W，能不能长期用？为什么？\n4. 为什么不能直接用 `R=U/I` 算 LED 的“电阻”？\n5. 一条走线电阻 0.1Ω，流过 2A，压降和功耗各是多少？\n6. `20mA`、`10kΩ` 代入公式前分别要写成什么？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `R=(5−2)/0.01=300Ω`；选 620Ω 后 `I=3/620≈4.84mA`（如果题目要求 10mA，应选 300Ω 左右的标准值，620Ω 会偏暗）。\n2. `I=5/1000=0.005A=5mA`；`P=5×0.005=0.025W`。\n3. 不能。已经超过额定值，长期发热会缩短寿命甚至烧毁；应选更大功率或降低电流。\n4. LED 的正向电压和电流不是线性关系，`U/I` 随工作点变化，不是常数；应按手册的正向特性或串限流电阻设计。\n5. `U=2×0.1=0.2V`；`P=2²×0.1=0.4W`。\n6. `20mA=0.02A`；`10kΩ=10000Ω`。\n\n<\/details>\n\n### 1.4 电路分析的两条“对账规则”\n\n#### 1.4.1 为什么需要 KCL 和 KVL\n\n简单电路可以靠直觉：串联电流一样，并联电压一样，分压按比例。但电路一复杂，直觉就不够用了。比如一个节点连着三条支路，每条支路的电流是多少？一个回路里有电源、两个电阻、一个二极管，电压怎么分？\n\n这时需要两条“对账规则”：\n\n- **KCL**（基尔霍夫电流定律，Kirchhoff's Current Law）：电荷不会在节点上堆积，流进来的必须等于流出去的。\n- **KVL**（基尔霍夫电压定律，Kirchhoff's Voltage Law）：绕一个闭合回路走一圈，电压升和电压降必须抵消，回到起点电位相同。\n\n先定义三个词：\n\n- **节点**（node）：两条或更多支路汇合的点。\n- **支路**（branch）：连接两个节点的路径，通常是一段导线或一个器件。\n- **回路**（loop）：从某个节点出发，沿支路走一圈回到该节点，途中不重复经过支路。\n\n这两条规则本质上是**电荷守恒**和**能量守恒**在电路里的写法。它们对线性、非线性电路都成立，不依赖欧姆定律，所以比“分压公式”更通用。\n\n#### 1.4.2 KCL：节点上的电流账本\n\nKCL 的一句话版本：\n\n> 流入一个节点的电流总和，等于流出这个节点的电流总和。\n\n写成式子：\n\n```text\nΣ I_in = Σ I_out\n```\n\n如果把“流入”记为正、“流出”记为负，也可以写成：\n\n```text\nΣ I = 0\n```\n\n两种写法等价，选一种，全程不要混。\n\n例子：一个节点连着三条支路，支路 A 流入 2mA，支路 B 流出 1mA，支路 C 的电流是多少？\n\n```text\n流入 = 流出\n2mA = 1mA + I_C\nI_C = 1mA（流出）\n```\n\n如果算出来是负值，说明实际方向和假设相反，不是“没有电流”。\n\nKCL 的直觉很像十字路口的车流：不管路口里怎么拐，进路口的车总数必须等于出路口的车总数；车不会在路口堆起来。电荷也一样，节点不是仓库。\n\n#### 1.4.3 KVL：绕回路走一圈的电压账本\n\nKVL 的一句话版本：\n\n> 沿一个闭合回路走一圈，所有电压升之和等于所有电压降之和；回到起点，电位差为零。\n\n写成式子：\n\n```text\nΣ U_rise = Σ U_drop\n```\n\n或者把“升”记正、“降”记负：\n\n```text\nΣ U = 0\n```\n\n例子：5V 电源、R1、R2 串联成一个回路。从电源负极出发，经电源升 5V，再经 R1 降 U1、经 R2 降 U2，回到负极：\n\n```text\n5V = U1 + U2\n```\n\n这就是串联分压的来源。KVL 不需要知道电阻多少，先告诉你“总电压被分完了”。\n\n符号约定很重要：\n\n- 从 `+` 到 `−` 穿过一个器件，算**电压降**。\n- 从 `−` 到 `+` 穿过电源，算**电压升**。\n- 绕行方向可以自己选，选顺时针或逆时针都行，但一圈内要一致。算出的负号只表示实际极性与假设相反。\n\n#### 1.4.4 用 KCL、KVL 解一个分压电路\n\n题目：5V 电源，R1=10kΩ，R2=10kΩ 串联，求 R2 两端电压和回路电流。\n\n**第一步：KVL 列电压账。**\n\n```text\n5V = U1 + U2\n```\n\n**第二步：欧姆定律把电压换成电流。**\n\n串联回路只有一条电流 `I`，流过 R1 和 R2：\n\n```text\nU1 = I × R1\nU2 = I × R2\n```\n\n代入 KVL：\n\n```text\n5V = I × R1 + I × R2 = I × (R1 + R2)\n```\n\n所以：\n\n```text\nI = 5V / (10kΩ + 10kΩ) = 5V / 20kΩ = 0.00025A = 0.25mA\n```\n\n**第三步：求 R2 电压。**\n\n```text\nU2 = I × R2 = 0.00025A × 10000Ω = 2.5V\n```\n\n结果和分压公式 `Vout=Vin×R2/(R1+R2)` 一致。分压公式不是新公式，它就是 KVL + 欧姆定律推出来的快捷方式。\n\n**第四步：KCL 检查。**\n\n这个串联回路只有一个回路电流，每个节点都是一进一出，KCL 自动满足：`I_in = I_out = 0.25mA`。如果电路有分支，KCL 才真正派上用场。\n\n#### 1.4.5 负载效应：分压点为什么一接东西就跌\n\n这是零基础最重要的“反直觉”之一。\n\n前面算出 5V、10kΩ、10kΩ 的分压点是 2.5V。但这个 2.5V 是**空载**值。现在在输出点和地之间接一个 10kΩ 的负载，会发生什么？\n\n负载 R_L 与 R2 并联：\n\n```text\nR2 || R_L = (10k × 10k) / (10k + 10k) = 5kΩ\n```\n\n下半段等效电阻从 10kΩ 变成 5kΩ，分压比变了：\n\n```text\nVout = 5V × 5kΩ / (10kΩ + 5kΩ) = 5 × 5/15 ≈ 1.667V\n```\n\n从 2.5V 掉到 1.667V，跌了 0.833V，跌幅约 33%。\n\n为什么？因为负载不是“白拿电压”，它要从分压点取电流。这个电流流过 R1，在 R1 上产生额外压降，输出自然被拉低。\n\n从“输出端看进去”，这个分压电路不是一个理想电压源，而是一个带**内阻**的电压源。内阻等于 R1 与 R2 并联：\n\n```text\nR_out = R1 || R2 = 5kΩ\n```\n\n负载 R_L 和 R_out 串联分压，负载越重（R_L 越小），拿到的电压越低。这个“内阻”概念是后面戴维南等效、信号源阻抗、传感器输入阻抗的基础，现在先建立直觉。\n\n**结论**：\n\n- 分压电路可以当**电压参考**（后级几乎不取电流时），不能当**电源**。\n- 如果后级要取明显电流，需要加缓冲器（运放跟随器）、稳压器，或者把分压电阻取小（但功耗变大）。\n- 万用表测分压点时，表的内阻也会形成负载。普通数字万用表输入阻抗很高（通常 10MΩ 量级），对 10kΩ 分压影响很小；但用低阻抗表或测高阻分压时，读数会明显偏低。\n\n**这在板子上**：传感器分压、ADC 采样、基准电压，都要算“后级输入阻抗”。一个 100kΩ/100kΩ 的分压接进 10kΩ 输入，输出会严重偏离设计值，这不是器件坏了，是负载效应。\n\n#### 1.4.6 惠斯通电桥：分压的进阶用法\n\n惠斯通电桥是四个电阻组成的桥式电路，常用于传感器测量。\n\n```text\n            R1          R2\n      + ───[====]──●──[====]─── +\n                  │\n                 Vout\n                  │\n      − ───[====]──●──[====]─── −\n            R3          R4\n```\n\n两个分压支路并联在同一个电源上：\n\n- 上支路：R1 与 R2 分压，中点电压 `V_A = Vin × R2/(R1+R2)`。\n- 下支路：R3 与 R4 分压，中点电压 `V_B = Vin × R4/(R3+R4)`。\n- 输出电压是两点之差：`Vout = V_A − V_B`。\n\n当电桥**平衡**时：\n\n```text\nR1 / R2 = R3 / R4\n```\n\n或者交叉相乘：\n\n```text\nR1 × R4 = R2 × R3\n```\n\n此时 `V_A = V_B`，`Vout = 0V`。\n\n电桥的价值在于“测微小变化”：把其中一个电阻换成传感器（应变片、热敏电阻、光敏电阻），它的阻值随物理量变化，电桥就从不平衡输出一个小电压。这个电压很小，通常需要后面接仪表放大器或比较器。第 02 章讲电阻传感器、第 08 章讲运放时会再回来。\n\n现在只要记住：**电桥不是新魔法，就是两个分压支路相减；平衡条件是阻值比例相等。**\n\n#### 1.4.7 停下来检查\n\n1. 一个节点流入 5mA，两条支路分别流出 3mA 和 `I`，`I` 是多少？\n2. 5V 电源、R1=2kΩ、R2=3kΩ 串联，回路电流和 R2 电压各是多少？\n3. 分压电路空载输出 2.5V，接负载后跌到 1.8V，主要原因是什么？\n4. 分压电路的“输出内阻”怎么算？为什么负载越小，输出跌得越多？\n5. 惠斯通电桥平衡的条件是什么？平衡时输出是多少？\n6. KCL 和 KVL 只对线性电路成立吗？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `I = 5mA − 3mA = 2mA`（流出）。\n2. `I=5V/(2k+3k)=1mA`；`U2=1mA×3kΩ=3V`。\n3. 负载取电流，负载与下臂电阻并联使等效阻值变小，同时电流在上臂电阻上产生额外压降。\n4. `R_out = R1 || R2`；负载 R_L 与 R_out 串联分压，R_L 越小，分到的电压越小。\n5. `R1/R2 = R3/R4`（或 `R1×R4 = R2×R3`）；平衡时 `Vout=0V`。\n6. 不是。KCL 和 KVL 来自电荷守恒和能量守恒，对线性、非线性电路都成立；欧姆定律才要求线性电阻。\n\n<\/details>\n\n<!-- 待续：1.5 -->","taskSignature":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","taskCount":0},{"id":"02","title":"第 02 课 · 电路分析基本功","short":"电路分析基本功","stage":1,"diff":2,"prev":"第 01 课 · 电学基本概念","optional":false,"md":"## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 用\"数一数有几条路\"的办法一眼判断串联还是并联；会算串联总电阻，会用速算公式算两只电阻并联的总电阻\n2. 用\"两步欧姆定律\"现场推出分压公式——不用背，忘了随时重新长出来；说出\"谁的阻值大，谁分得的电压多\"\n3. 完成\"用 3.3V ADC 测 12V 电源\"的标称分压计算，并列出输入范围、公差、采样与保护等实际设计条件\n4. 会算并联电路每条支路分到的电流，记住\"分压按正比、分流按反比\"\n5. 用\"流入 = 流出\"（KCL）和\"绕一圈、升 = 降\"（KVL）给电路对账，能用 KVL 重新推出分压公式\n6. 解释\"分压电路一接负载电压就跌\"的原因，会按允许误差计算电阻负载与分压等效电阻的关系；养成\"算完电流必查功率\"的习惯\n\n## 📖 正文\n\n第 01 课你认识了电流、电压、电阻、功率这四个\"单词\"，还学会了欧姆定律。这一课学\"造句\"：把电阻连成电路之后，每个点是几伏、每条路是几毫安，怎么算出来。\n\n本课的主角仍然只有电阻（电容、电感到第 03 课 电容、电感与电信号 才登场）。这些方法是分析原理图的起点；更复杂的器件与动态电路还需要结合器件模型和后续课程——这是\"看懂电路\"和\"只会照抄\"的分水岭。\n\n放心，全程只用加减乘除和分数。\n\n### 02.1 串联与并联：电路的两种基本接法\n\n> 🔬 **配套仿真**：[电阻串联电路](#/sim/res-series)——观察串联的电阻和节点，比较各器件电流及两端电压\n\n#### 02.1.1 先学会\"数路\"：一条路，还是几条路\n\n一个电阻单独放着，没什么好算的。真实的电路里，电阻总是一堆一堆出现。怎么连？只有两种基本方式。\n\n先看元件连接的节点：两个元件共用一个中间节点且该节点没有其他支路时，它们串联；两个元件分别接在相同的两个节点之间时，它们并联。下列简单电阻回路也可通过数路径建立直觉：\n\n- 只有**一条路**，元件必须排队一个个过——**串联**\n- 中途**分了岔**，有两条或更多条路可以走——**并联**\n\n串联长这样（箭头是电流方向：从正极出发，绕一圈回负极）：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"143.8pt\" width=\"329.516pt\" viewBox=\"-80 -145 360 155\"><circle cx=\"0\" cy=\"-54\" r=\"18\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 0.0,-0.0 L 0,-36 L 0,-36 M 0,-72 L 0,-72 L 0,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000003,-45.0 L -3.6,-45\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.637200993467639e-15,-59.4 L 0,-66.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000004,-63.0 L -3.6,-63\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 6.613092715395707e-15,-108.0 L 14.4,-108 L 28.8,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.80000000000001,-108.0 L 64.8,-108 L 67.8,-117 L 73.8,-99 L 79.8,-117 L 85.8,-99 L 91.8,-117 L 97.8,-99 L 100.8,-108 L 136.8,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 136.8,-108.0 L 172.8,-108 L 175.8,-117 L 181.8,-99 L 187.8,-117 L 193.8,-99 L 199.8,-117 L 205.8,-99 L 208.8,-108 L 244.8,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 244.8,-108.0 L 259.2,-108 L 273.6,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 273.6,-108.0 L 273.6,-54 L 273.6,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 273.59999999999997,-0.0 L 136.8,-0 L 0,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-21.599999999999994\" y=\"-68.0\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-21.599999999999994\" dy=\"14.0\">电源 U<\/tspan><\/text><text x=\"82.80000000000001\" y=\"-134.60000000000002\" dominant-baseline=\"ideographic\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"82.80000000000001\" dy=\"14.0\">R1<\/tspan><\/text><text x=\"190.8\" y=\"-134.60000000000002\" dominant-baseline=\"ideographic\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"190.8\" dy=\"14.0\">R2<\/tspan><\/text><text x=\"130\" y=\"-27.200000000000003\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"11\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"130\" dy=\"11\">电流 I 处处相等 ←<\/tspan><\/text><\/svg>\n```\n\n并联长这样：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" width=\"620\" height=\"250\" role=\"img\" aria-label=\"两只电阻并联且无短路线\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M90 45 H490 M90 205 H490 M90 45 V95 M90 155 V205 M250 45 V77 M250 127 V205 M410 45 V77 M410 127 V205\"/><circle cx=\"90\" cy=\"125\" r=\"30\"/><rect x=\"235\" y=\"77\" width=\"30\" height=\"50\"/><rect x=\"395\" y=\"77\" width=\"30\" height=\"50\"/><circle cx=\"250\" cy=\"45\" r=\"3\" fill=\"currentColor\"/><circle cx=\"410\" cy=\"45\" r=\"3\" fill=\"currentColor\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"84\" y=\"120\">+<\/text><text x=\"84\" y=\"143\">−<\/text><text x=\"25\" y=\"130\">电源<\/text><text x=\"275\" y=\"108\">R1<\/text><text x=\"435\" y=\"108\">R2<\/text><text x=\"170\" y=\"238\">两支路接在同一对节点上<\/text><\/g><\/svg>\n```\n\n真实电路常常串联、并联混着来。本课先练纯串联、纯并联，混搭的账，02.5 的\"对账规则\"能收拾。\n\n#### 02.1.2 串联：一条独木桥，电流处处相等\n\n类比：电流像排队过独木桥的人。桥中间最窄的地方是 R1。不管桥头多宽，整队人的速度都被最窄处卡住——**队里每个人的速度一样**。电流也一样：电阻让整条路的电流**一起**变小，而不是\"过了一个少一截\"。\n\n所以串联的第一条铁律：**串联电路里，流过每个元件的电流是同一个值。**\n\n❌ **误解**：电流流过第一个电阻后被\"挡掉\"一部分，到第二个电阻就变小了。\n✅ **正解**：第 01 课说过，电荷只转移、不消失。串联电路像一根首尾相接的闭合水管，水在里面循环——每秒经过任何一截的水量必须相同，不然水会在某处堆积爆管；在集总电路模型中，中间节点没有其他支路，电流必须相等；实际导线有寄生电容，快速变化过程需要更完整的模型。\n\n串联的第二件事：总电阻怎么算。独木桥接得越长越难走，阻力直接相加：\n\n**R总 = R1 + R2 + R3 + …**（越串越大）\n\n算例 1：100Ω 串 200Ω，R总 = 100 + 200 = 300Ω。接 3V 电池，I = 3V ÷ 300Ω = 0.01A = 10mA。\n\n算例 2：三只 1kΩ 串联，R总 = 3kΩ。接 9V，I = 9V ÷ 3kΩ = 3mA。\n\n这里学一个本课反复要用的单位速算：**伏 ÷ 千欧 = 毫安**。道理很简单：1V ÷ 1kΩ = 1V ÷ 1000Ω = 0.001A = 1mA。所以 9 ÷ 3 = 3，直接写 3mA，不用搬小数点。\n\n**这在板子上**：两只阻值相同的电阻串联，在相同电流下各分担一半电压和功率；阻值不同时分担比例也不同——功率扛不住时的\"分摊\"招数，02.7 细讲。\n\n#### 02.1.3 并联：多开一扇门，总阻力变小\n\n类比：一个门挤，再开一扇门。人流分成两股，整体通过反而容易——**总阻力变小**。\n\n并联的第一条铁律：**并联的每个电阻，两端是同一个电压。**看上面那张图：R1 和 R2 都跨接在同样的两个点之间，两点之间的电压只有一个值。\n\n总电阻呢？比任何一只都小。两只电阻并联，有速算公式：\n\n**R并 = (R1 × R2) ÷ (R1 + R2)**（分子相乘，分母相加）\n\n逐个字母认识：R1、R2 是两只电阻的阻值，R并 是它们并联后的总电阻。\n\n算例 1：10kΩ 并 10kΩ。R并 = (10 × 10) ÷ (10 + 10) = 100 ÷ 20 = 5kΩ。**等值并联直接减半**——这是口算题。\n\n算例 2：10kΩ 并 30kΩ。R并 = (10 × 30) ÷ (10 + 30) = 300 ÷ 40 = 7.5kΩ。\n\n算例 3：1kΩ 并 3kΩ。R并 = (1 × 3) ÷ (1 + 3) = 3/4 kΩ = 0.75kΩ = 750Ω。\n\n注意：并联结果**比小的那只还小**（7.5k < 10k），不是取平均。\n\n三只以上并联怎么办？用\"倒数相加再倒回来\"：1/R总 = 1/R1 + 1/R2 + 1/R3 + …。本课的题目都只用两只，速算式够用。\n\n**这在板子上**：板上最常见的并联是\"去耦电容\"——10μF 和 100nF 并联挂在芯片供电脚上。不同容值电容可能在不同频段发挥作用，但具体效果取决于 ESR、ESL、自谐振、并联情况和布局；第 03 课继续解释。另一个常见操作：两只 1Ω 并联得到 0.5Ω——凑出更小的阻值，顺便各分一半发热。\n\n#### 02.1.4 三种元件的串并联公式对比表（先混个脸熟）\n\n电容、电感还没正式登场，先把对比表摆在这里——第 03 课讲电容电感时，记得回来验证\"电容公式与电阻错位互换\"这条规律：\n\n| 元件 | 串联 | 并联 | 一句话记忆 |\n|---|---|---|---|\n| 电阻 R | R = R1 + R2（越串越大） | 1/R = 1/R1 + 1/R2（越并越小） | 桥变长 / 多开门 |\n| 电容 C | 1/C = 1/C1 + 1/C2（越串越小） | C = C1 + C2（越并越大） | 与电阻正好互换 |\n| 电感 L | L = L1 + L2（越串越大） | 1/L = 1/L1 + 1/L2（越并越小） | 跟电阻一组 |\n\n上表仅针对理想元件；电感之间无互感时才可直接使用表中公式，真实元件还需考虑损耗和寄生。\n\n记忆技巧：**电阻和电感是一组**（串联直接相加）；**电容单独一组**，公式跟电阻正好互换——你只要记住\"电容越并越大、越串越小\"这一句。直觉验证：电容是\"装电的小水池\"，并联 = 水池拼大（容量相加），串联 = 水池上下摞起来（还是只算一层的水量，反而变小）。\n\n**停下来检查 02.1**（先别看答案，全部口算）\n\n1. 三只电阻首尾相连接在电池上，是串联还是并联？判断依据是什么？\n2. 47kΩ 和 3kΩ 串联，总电阻是多少？\n3. 口算：20kΩ 并 20kΩ = ？；10kΩ 并 30kΩ = ？\n\n<details>\n<summary>停下来检查：答案<\/summary>\n\n1. 串联。依据：从正极出发只有一条路回负极（\"一条独木桥\"）；串联电路电流处处相等。\n2. R总 = 47k + 3k = 50kΩ。\n3. 20kΩ 并 20kΩ：等值减半 = 10kΩ。10kΩ 并 30kΩ = (10 × 30) ÷ (10 + 30) = 300 ÷ 40 = 7.5kΩ。\n\n<\/details>\n\n### 02.2 分压电路：把电压按比例切（本课重点）\n\n> 🔬 **配套仿真**：[分压电路](#/sim/voltdivide)——观察两组电阻分压；可在仿真器中编辑电阻值，再比较各节点电压\n\n#### 02.2.1 电路长什么样\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" width=\"620\" height=\"250\" role=\"img\" aria-label=\"串联分压并相对地测量输出\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M90 45 H195 M90 45 V90 M90 150 V205 H405 M265 45 H405 V70 M405 130 V205 M405 70 H500\"/><circle cx=\"90\" cy=\"120\" r=\"30\"/><rect x=\"195\" y=\"33\" width=\"70\" height=\"24\"/><rect x=\"390\" y=\"70\" width=\"30\" height=\"60\"/><circle cx=\"405\" cy=\"70\" r=\"4\" fill=\"currentColor\"/><path d=\"M390 205 H420 M395 213 H415 M400 221 H410\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"84\" y=\"115\">+<\/text><text x=\"84\" y=\"139\">−<\/text><text x=\"23\" y=\"125\">12 V<\/text><text x=\"215\" y=\"27\">R1<\/text><text x=\"435\" y=\"104\">R2<\/text><text x=\"475\" y=\"61\">输出 U2<\/text><text x=\"310\" y=\"238\">地（0 V）<\/text><\/g><\/svg>\n```\n\n三件事看清楚：\n\n- R1 在上面，一脚接电源正极；R2 在下面，一脚接地（GND，就是第 01 课说的 0V 参考点）\n- 输出从中间那个点（●）引出，取的是 **R2 两端的电压**，习惯记作 U2\n- 电流路径：从 12V 出发 → 过 R1 → 过 R2 → 进地 → 回电源负极。输出不接负载或负载电流可忽略时是一条路，R1、R2 可按串联分压计算；接入负载后需计入负载电流\n\n这个\"两只电阻一上一下\"的电路叫**分压电路**。它在原理图里出现频率高到离谱，是本课头号重点。\n\n#### 02.2.2 分蛋糕的直觉\n\n把电源电压想成一块蛋糕。两只电阻串联，蛋糕按**阻值比例**切：阻值大的分得多。输出取的是下面那只（R2）的那一份。\n\n比如 R1 = 20kΩ、R2 = 10kΩ：总电阻 30kΩ，R2 占 10/30 = 1/3，那它分到 12V 的 1/3，约 4V。\n\n直觉归直觉，工程要算得准。好消息：不用背任何新公式，两步欧姆定律就能把答案\"长\"出来。\n\n#### 02.2.3 两步推导（比背公式重要一百倍）\n\n**第一步：算电流。**串联，先合总电阻，再用欧姆定律求电流：\n\n- R总 = R1 + R2\n- I = U ÷ R总\n\n**第二步：算输出。**对 R2 单独用一次欧姆定律（就是第 01 课的 U = I × R）：\n\n- U2 = I × R2\n\n把第一步算出的 I 代进第二步：\n\nU2 = (U ÷ (R1 + R2)) × R2 = **U × R2 ÷ (R1 + R2)**（空载，或负载电流可忽略）\n\n这就是大名鼎鼎的分压公式。逐个字母认识一下：\n\n- U：电源电压（伏）\n- R1：上端电阻（接电源的那只）\n- R2：下端电阻（接地的那只）\n- U2：输出电压，也就是 R2 两端的电压（伏）\n\n❌ **误解**：分压公式长得又长又像，必须死记硬背。\n✅ **正解**：不要背。忘了就现场两步推：**先\"电压 ÷ 总电阻\"得电流，再\"电流 × R2\"得输出**。十秒钟长出来，而且永远不可能把分子分母搞反——因为每一步你都知道自己在干什么。\n\n#### 02.2.4 算例三连（一步不跳）\n\n**算例 1**：U = 9V，R1 = 2kΩ，R2 = 1kΩ\n\n1. R总 = 2k + 1k = 3kΩ\n2. I = 9V ÷ 3kΩ = 3mA（伏 ÷ 千欧 = 毫安）\n3. U2 = 3mA × 1kΩ = 3V（毫安 × 千欧 = 伏，因为 0.001 × 1000 = 1）\n4. 顺手把 U1 也算了：U1 = 3mA × 2kΩ = 6V\n5. 对账：U1 + U2 = 6V + 3V = 9V = 电源电压 ✓ 蛋糕正好分完，一点不剩\n\n**算例 2**：U = 5V，R1 = 10kΩ，R2 = 10kΩ\n\n1. R总 = 10k + 10k = 20kΩ\n2. I = 5V ÷ 20kΩ = 0.25mA\n3. U2 = 0.25mA × 10kΩ = 2.5V（两只一样大，平分蛋糕）\n\n**算例 3**（熟练后直接用公式）：U = 12V，R1 = 20kΩ，R2 = 10kΩ\n\n- U2 = 12 × 10 ÷ (20 + 10) = 12 × 10/30 = 12 × 1/3 = 4V\n\n跟 02.2.2 分蛋糕的直觉对上了。\n\n#### 02.2.5 一条规律：阻值大，分得多\n\n回头看算例 1：同一股电流 I 先后流过 R1 和 R2。U1 = I × R1，U2 = I × R2——电流相同，电压就跟阻值**成正比**。R1 是 R2 的两倍，U1 就是 U2 的两倍；R2 占总电阻的几分之几，就分到电源电压的几分之几。\n\n口诀：**串联分压，按阻值比例分。**\n\n**这在板子上**：电池电压检测、旋钮位置读取、给芯片造一个参考电压、传感器把光强温度变成电压……原理图里到处是\"两只电阻一上一下\"。别人看到的是两个零件，你看到的是\"一块蛋糕按比例切\"。\n\n**停下来检查 02.2**\n\n1. U = 6V，R1 = 1kΩ，R2 = 2kΩ，输出 U2 是多少？（小心：输出取自 R2，别代错）\n2. U = 5V，R1 = R2 = 4.7kΩ，U2 是多少？\n3. 想从 9V 电源得到 3V，已经选定 R2 = 10kΩ，R1 应该多大？\n\n<details>\n<summary>停下来检查：答案<\/summary>\n\n1. 两步法：R总 = 1k + 2k = 3kΩ；I = 6 ÷ 3 = 2mA；U2 = 2mA × 2kΩ = 4V。（公式直接算：6 × 2/3 = 4V）\n2. 两只等值，平分：U2 = 2.5V。走一遍：I = 5 ÷ 9.4 ≈ 0.53mA；U2 = 0.53 × 4.7 ≈ 2.5V。\n3. 比例 = 3 ÷ 9 = 1/3，即 R2 占总电阻的 1/3 → R总 = 3 × R2 = 30kΩ → R1 = 30k − 10k = 20kΩ。验证：U2 = 9 × 10/30 = 3V ✓\n\n<\/details>\n\n### 02.3 并联分流：电流按\"路的宽窄\"分\n\n#### 02.3.1 每条支路自己算自己的\n\n并联时，每条支路两端都是同一个电压 U。那就每条支路单独用欧姆定律：\n\n**I1 = U ÷ R1，I2 = U ÷ R2**\n\n类比：商场开两个门。宽门（电阻小）走的人多，窄门（电阻大）走的人少——两边的\"推力\"（电压）一样，路宽的流量大。\n\n算例：U = 12V，R1 = 1kΩ、R2 = 3kΩ 并联\n\n1. I1 = 12V ÷ 1kΩ = 12mA\n2. I2 = 12V ÷ 3kΩ = 4mA\n3. I总 = 12 + 4 = 16mA\n4. 对账：R并 = (1 × 3) ÷ (1 + 3) = 3/4 kΩ = 750Ω；I总 = 12V ÷ 750Ω = 16mA ✓ 两条路算出来的一样\n\n❌ **误解**：并联时电阻大的那条支路电流也大。\n✅ **正解**：两条支路电压相同，电阻大的路更\"窄\"，电流更小。1kΩ 支路 12mA，3kΩ 支路只有 4mA——阻值 3 倍，电流只有 1/3，正好反着来。\n\n#### 02.3.2 分流公式：跟分压公式是镜像\n\n有时候已知的是总电流，想直接分。代入消元后得到：\n\n**I1 = I总 × R2 ÷ (R1 + R2)，I2 = I总 × R1 ÷ (R1 + R2)**\n\n瞪大眼睛：I1 的分子是 **R2**（对方）！因为分配跟自己的阻值**成反比**。\n\n验证上面的算例：I1 = 16mA × 3 ÷ (1 + 3) = 16 × 3/4 = 12mA ✓\n\n再来一个：总电流 1A，分给 1Ω 和 3Ω 两条并联支路。\n\n- I(1Ω) = 1 × 3/4 = 0.75A\n- I(3Ω) = 1 × 1/4 = 0.25A\n- 对账：0.75 + 0.25 = 1A ✓\n\n两句口诀连起来记：**分压正比（自己大分得多），分流反比（自己大分得少）。**\n\n**这在板子上**：测大电流的\"采样电阻\"——在电源回路里串一只 0.01Ω 的小电阻，大电流过去只掉一点点电压；测它两端的电压就能反推电流。比如测得 0.05V，电流 = 0.05V ÷ 0.01Ω = 5A。第 10 课 电源模块 的电流监测就用这招。\n\n**停下来检查 02.3**\n\n1. 5V 加在 1kΩ 和 4kΩ 的并联两端。每条支路电流多大？总电流多大？\n2. 两条支路都是 2kΩ，总电流 10mA，每条分多少？\n\n<details>\n<summary>停下来检查：答案<\/summary>\n\n1. I1 = 5V ÷ 1kΩ = 5mA；I2 = 5V ÷ 4kΩ = 1.25mA；I总 = 5 + 1.25 = 6.25mA。\n2. 等值平分：每条 5mA。（用分流公式：10 × 2/4 = 5mA）\n\n<\/details>\n\n### 02.4 分压实战：三个真问题\n\n#### 02.4.1 实战一：用 3.3V 的 ADC 测 12V 电源（逐行算给你看）\n\n先认识 ADC：单片机（可编程的小芯片，板上的\"小电脑\"）里自带一个\"电压表\"，学名模数转换器（ADC）。它把引脚上的电压变成数字，交给程序去读。本例假设允许输入范围是 0～3.3V；具体 ADC 量程、输入耐压和绝对最大额定值要查手册。12V 直连不耐压的输入可能损坏芯片。\n\n方案：用分压把 12V 按比例缩小到 3V 以内，再交给 ADC。\n\n**第 1 步：定比例。**满 12V 时输出别顶到 3.3V，留点余量，按 3.0V 设计：\n\n- k = 输出 ÷ 输入 = 3.0V ÷ 12V = 1/4\n\n理想空载、阻值不变时输出按输入的 1/4 变化；真实电路还要考虑负载和电阻误差。\n\n**第 2 步：由比例选电阻。**k = R2 ÷ (R1 + R2) = 1/4，意思是\"R1 + R2 是 R2 的 4 倍\"，一步步来：\n\n- R1 + R2 = 4 × R2\n- R1 = 4 × R2 − R2 = 3 × R2\n\n所以 R1 是 R2 的 3 倍。取 R2 = 10kΩ（为什么取这个量级？看 02.4.3），R1 = 30kΩ。30kΩ 虽是 E24 标准值，但常见备货系列里不常有，就近选 33kΩ 更好买——分压比再压低一点，余量也更足。\n\n**第 3 步：逐行核算（一步不跳）：**\n\n1. R总 = 33k + 10k = 43kΩ\n2. I = 12V ÷ 43kΩ = 12/43 mA ≈ 0.28mA——很省电\n3. U2 = I × R2 = 0.28mA × 10kΩ ≈ 2.8V。精确算：12 × 10/43 = 120/43 ≈ 2.79V < 3.3V ✓ 还留约 0.5V 余量\n4. 功率：P(R1) ≈ 2.6mW、P(R2) ≈ 0.8mW（算法见 02.7），仍须按具体型号核对功率、电压及降额\n5. 软件换算：芯片读到 2.79V 时，真实电压是 12V。倍数 = 43 ÷ 10 = **4.3**，程序里写\"实际电压 = 读数 × 4.3\"\n\n**把标称计算变成安全设计**：上面只核算了 12V 标称值、理想空载。假设两只电阻均为 ±1%，输入升到 14V 时，最不利分压比出现在 R1 最小（32.67kΩ）、R2 最大（10.10kΩ），输出约 14 × 10.10/(32.67 + 10.10) = **3.31V**。这已超过假设的 3.3V ADC 量程，不能用“12V 时有余量”证明安全。若先将 R1 改为 39kΩ、R2 保持 10kΩ，在同样 14V 和 ±1% 假设下，最坏输出约为 14 × 10.10/(38.61 + 10.10) = **2.90V**。这是改善余量的标称方案，并不自动构成完整设计：仍需核对输入最大值与瞬态、ADC 电源最小值、输入绝对最大额定值、关机时的注入电流、采样时间和保护方案，再决定是否投板。\n\n下表汇总**原始 33kΩ/10kΩ 标称算例**，不是上面 14V 最坏条件下的通过方案。真正交付设计时，应更新为选定方案并记录最大输入、误差和待核条件：\n\n| 项目 | 数值 | 说明 |\n|---|---|---|\n| R1 | 33kΩ | 上端电阻，E24 标准值，1% 精度 |\n| R2 | 10kΩ | 下端电阻，E24 标准值，1% 精度 |\n| 分压比例 k | 10/43 ≈ 0.233 | 输出 = 输入 × 0.233 |\n| 12V 时输出 | ≈ 2.79V | 低于 3.3V，余量约 0.5V |\n| 支路电流 | ≈ 0.28mA | 全天挂着也几乎不耗电 |\n| 电阻功率 | 各 < 3mW | 实际选型仍需核对具体型号的功率、耐压和温度降额（见 02.7） |\n| 软件换算 | × 4.3 | 实际电压 = ADC 读数 × 4.3 |\n\n两个常被追问的问题：\n\n- **为什么选 1% 精度的电阻？**两只电阻的误差会直接变成分压比的误差。5% 的电阻能让读数偏一大截，而 1% 只贵几分钱——监测用途 1% 起步。\n- **为什么不能\"减掉 8.7V\"？**简单的二极管、稳压电路等也可以产生一定压降；这里选比例分压是为了将被测电压映射到 ADC 量程。把 12V 变成稳定的 3.3V **给芯片供电**是另一回事，那是稳压电源的工作（第 10 课 电源模块）。\n\n#### 02.4.2 实战二（反向设计）：要一个 2.5V，电阻怎么选\n\n正向设计：知道电阻，算输出。反向设计：先定了想要的输出，回头挑电阻。工程里反向更常用。\n\n问题：单电源供电的运放电路常需要一个 2.5V 的中间参考点（运放＝放大信号的芯片，第 04 课再认识）。手头电源只有 5V。\n\n**第 1 步：算比例。**\n\n- k = 2.5 ÷ 5 = 1/2\n- R2 要占总电阻的一半 → R1 + R2 = 2 × R2 → **R1 = R2**\n\n**第 2 步：在经验区间里挑具体值**（区间马上讲）。各取 10kΩ。\n\n**第 3 步：验证。**\n\n1. R总 = 10k + 10k = 20kΩ\n2. I = 5V ÷ 20kΩ = 0.25mA\n3. U2 = 0.25mA × 10kΩ = 2.5V ✓ 正中目标\n\n反向设计口诀：**先拿\"目标 ÷ 电源\"算出比例（一个分数），再按比例定\"谁是谁的几倍\"，最后在经验区间里挑具体阻值。**\n\n#### 02.4.3 电阻取多大合适？太小费电，太大惹干扰\n\n比例定了，那取 10Ω 还是 10MΩ？比例都对，但两个极端都有坑。\n\n- **太小（比如 10Ω + 3.3Ω，同样是约 1/4 的比例）**：I = 12V ÷ 13.3Ω ≈ 0.9A——将近 1 安培！发热 P = 0.9 × 0.9 × 10 ≈ 8W，电阻秒变电烙铁，冒烟报废（功率细算见 02.7）。\n- **太大（比如 10MΩ 级）**：电流只剩微安级，看着省电，但输出点\"内劲极小\"（阻抗高），旁边的干扰电场、甚至你手凑过去的静电，都能把这个点的电压拨来拨去，ADC 读数乱漂。\n- **初步尝试范围：1kΩ ~ 100kΩ。**这不是通用设计保证：应同时核对输入最大值、功耗、后级漏电与采样时间；ADC 动态采样电流、滤波电容和精度要求可能改变可用阻值。\n\n#### 02.4.4 电位器：会动的分压器\n\n电位器（俗称可调电阻、旋钮）= 一条电阻轨道 + 一个滑动触点。总阻值固定（比如 10kΩ），触点把它分成上下两段——相当于一个 R1、R2 都能连续调节的分压器：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" width=\"620\" height=\"250\" role=\"img\" aria-label=\"电位器分压器和滑动输出\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M90 50 H235 M90 50 V90 M90 150 V205 H465 V50 H345\"/><circle cx=\"90\" cy=\"120\" r=\"30\"/><rect x=\"235\" y=\"38\" width=\"110\" height=\"24\"/><path d=\"M290 5 V31 M284 24 L290 31 L296 24\"/><path d=\"M275 205 H305 M280 213 H300 M285 221 H295\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"84\" y=\"115\">+<\/text><text x=\"84\" y=\"139\">−<\/text><text x=\"28\" y=\"125\">电源<\/text><text x=\"215\" y=\"85\">电位器 10 kΩ<\/text><text x=\"305\" y=\"18\">滑动端 → ADC<\/text><text x=\"250\" y=\"238\">电源负极与地连接<\/text><\/g><\/svg>\n```\n\n- 触点滑到最上：上段电阻 = 0，输出 = 5V\n- 触点滑到最下：下段电阻 = 0，输出 = 0V\n- 滑到正中间：上下各 5kΩ，输出 = 5 × 5/10 = 2.5V\n\n音量旋钮、台灯调光旋钮，本质都是电位器在当\"会动的分压器\"。\n\n单片机读旋钮时，电位器通常接 ADC 对应的安全参考电压与 GND，滑动端接 ADC。对于只能承受 3.3V 的 ADC，不能把电位器接到 5V 后直接接入：滑动端可以达到 5V。具体还要核对输入范围、上电顺序和采样源阻抗。\n\n**这在板子上**：不止旋钮。光敏电阻、热敏电阻这些传感器，本质是\"阻值随环境变化的电阻\"。让它和一只固定电阻组成分压：环境变 → 阻值变 → 输出电压变 → ADC 读到。**分压电路是把物理世界变成电压的桥头堡。**\n\n**停下来检查 02.4**\n\n1. 3.3V 的 ADC 要测 5V 电源，按\"满量程输出减半\"设计：比例取多少？R2 = 10kΩ 时 R1 取多少？软件怎么换算？\n2. 10kΩ 电位器接在 5V 上，触点转到正中间，输出多少伏？\n3. 有同学用 10Ω + 10Ω 给 12V 分压取中点。这设计有几处毛病？\n\n<details>\n<summary>停下来检查：答案<\/summary>\n\n1. k = 2.5 ÷ 5 = 1/2 → R1 = R2 = 10kΩ。满 5V 时输出 5 × 10/20 = 2.5V，换算倍数 = 20 ÷ 10 = 2，程序里\"实际电压 = 读数 × 2\"。\n2. 上下各 5kΩ，输出 = 5 × 5/10 = 2.5V。\n3. 两处大毛病：① 电流巨大：I = 12 ÷ 20 = 0.6A，每只电阻发热 = 0.6 × 0.6 × 10 = 3.6W，若器件额定功率不足会严重过载，可能损坏；② 要是再接负载，输出电压还会被进一步拉低（见 02.6）。若后级是高阻输入，可以先比较 10kΩ + 10kΩ；如果需要为负载供电，则应另外核对负载电流和稳压要求。\n\n<\/details>\n\n### 02.5 基尔霍夫定律：电路的两条\"对账规则\"\n\n电阻不是永远只串只并。电路一复杂，就要请出两条定律。名字来自德国物理学家基尔霍夫（Kirchhoff），听着唬人，内容却是两句生活常识——它们也是所有电路仿真软件的底层原理。\n\n#### 02.5.1 KCL（节点电流定律）：流进 = 流出\n\n**节点**：由理想导线直接连通、视为同一电位的一组连接点；三个或更多支路汇合的节点尤其便于列 KCL。\n\n类比：三通水管接头。几根管子往接头里灌水，几根往外流——接头就那么大，存不了水。所以**进多少，必然同时出多少**。\n\n**KCL：流进一个节点的电流总和 = 流出这个节点的电流总和。**\n\n算例 1：电源送 2A 进一个节点，节点分出两条路，测得第一条路 1.2A，第二条多少？\n\n- 流进 = 流出：2A = 1.2A + I2\n- I2 = 2 − 1.2 = 0.8A\n\n算例 2（一块板子的账）：5V 电源入口进来 1A，板上三样东西用电：\n\n| 支路 | 电流 | 去向 |\n|---|---|---|\n| 5V 入口 | 1.0A | 总电流 |\n| 稳压器输入支路 | 0.4A | 这是 5V 侧的输入电流；3.3V 侧负载电流另算（第 10 课 电源模块） |\n| 屏幕背光 | 0.35A | 直接挂 5V |\n| 传感器 | 0.25A | 直接挂 5V |\n| 合计 | 1.0A | KCL 自动平账 |\n\n0.4 + 0.35 + 0.25 = 1.0，账是平的。设计时正着用：各路电流相加得到总电流，再拿总电流决定电源选型和入口走线多粗。这套账叫**电流预算**，每块板子开工前都要算一遍（走线宽度的规矩，第 19 课 专项技能强化 展开）。\n\n❌ **误解**：电流流进芯片就被\"用掉\"了，流出来的应该变少。\n✅ **正解**：芯片消耗的是**电能**，电荷本身一个不少地穿过去。在集总电路模型中，节点各支路电流按 KCL 平衡；实际导线和节点的寄生电容可在变化过程中储存电荷，需将相关支路计入。串联电路\"电流处处相等\"，其实就是 KCL 在电路每个点上的应用。\n\n**列算式的小约定**：方向拿不准的电流，先随便假设一个箭头方向，然后坚持算到底。**解出来是负数，只说明\"实际方向跟假设相反\"**，数字照样能用（练习 D 亲自体验一次）。\n\n#### 02.5.2 KVL（回路电压定律）：绕一圈，升 = 降\n\n类比：爬楼。你从一楼出发，在大楼里上上下下绕一整圈，最后回到一楼出发点——**上过的台阶总数必然等于下过的台阶总数**。不然你就停在别的楼层了，回不到原地。\n\n**KVL：沿集总电路模型中的一个闭合回路绕一圈，电压\"升\"的总和 = \"降\"的总和。**\n\n谁是\"升\"？电源——电池把电荷\"抬\"上高处。谁是\"降\"？电阻——电荷流过时\"掉\"下来，能量变成热。\n\n算例：还是 02.2.4 算例 1 的回路——9V 电池串 R1(2kΩ)、R2(1kΩ)，I = 3mA：\n\n- 电池升：9V\n- R1 降：U1 = 3mA × 2kΩ = 6V\n- R2 降：U2 = 3mA × 1kΩ = 3V\n- 对账：降的总和 6 + 3 = 9V = 升的总和 ✓ 账平\n\n#### 02.5.3 用 KVL 把分压公式重新推一遍（验证一致性）\n\n定律比公式更根本。现在用 KVL 重推 02.2.3 的分压公式，看是不是同一个东西：\n\n1. 沿分压回路走一圈：电池升 U，R1 降 I × R1，R2 降 I × R2\n2. KVL：U = I × R1 + I × R2 = I × (R1 + R2)\n3. 解出电流：I = U ÷ (R1 + R2)\n4. 输出是对 R2 用欧姆定律：U2 = I × R2 = **U × R2 ÷ (R1 + R2)**\n\n跟 02.2.3 一字不差。**定律是根，公式是叶。**以后任何公式忘了，回到定律现推——这就是\"数学只有加减乘除，也能吃电子这碗饭\"的底气。\n\n**这在板子上**：拿万用表黑表笔接地、红表笔量板上各点对地电压，一圈加加减减。对不上账？多半是短路、虚焊或焊错元件——KVL 是检修时的\"对账工具\"。\n\n**停下来检查 02.5**\n\n1. 一个节点接四根线：两根分别流入 0.5A 和 0.3A，一根流出 0.6A；假设第四根流出，它的电流多大？方向真如所设吗？\n2. 12V 电池的回路里，两只电阻分别降 7V 和 6V。可能吗？为什么？\n3. 用 KVL 两步算：5V 电源，R1 = R2 = 10kΩ 串联，R2 两端电压是多少？\n\n<details>\n<summary>停下来检查：答案<\/summary>\n\n1. 流进 0.5 + 0.3 = 0.8A；流出 0.6 + I4 = 0.8 → I4 = 0.8 − 0.6 = 0.2A。正数，说明方向确实是流出。\n2. 不可能。7 + 6 = 13 ≠ 12，一圈下来账不平，违反 KVL。真实电路会自动调整电流大小，直到升降恰好相等。\n3. KVL：5 = I × 10k + I × 10k = I × 20k → I = 5 ÷ 20k = 0.25mA；U2 = 0.25 × 10 = 2.5V。\n\n<\/details>\n\n### 02.6 负载效应：为什么一接上东西，电压就跌\n\n#### 02.6.1 现场翻车：2.5V 怎么变成 1.67V 了\n\n看一个翻车现场。02.4.2 设计好的分压器：5V 电源 + 10kΩ/10kΩ，空载输出 2.5V，很好。\n\n现在把一个 10kΩ 的负载接到输出点和地之间。\n\n第一步：看清楚接法。负载和 R2 都接在\"输出点\"和\"地\"之间——它俩是**并联**！\n\n- R并 = (10 × 10) ÷ (10 + 10) = 100 ÷ 20 = 5kΩ\n\n第二步：分压器的下臂从 10kΩ 变成了 5kΩ，重新分压：\n\n- U负 = 5 × 5 ÷ (10 + 5) = 25/15 = 5/3 ≈ 1.67V\n\n2.5V 跌到 1.67V，跌掉了三分之一。这就是**负载效应（loading effect）**。\n\n为什么？负载一接上，相当于\"帮着\" R2 一起导电，下臂总阻力变小，分到的比例自然变小——蛋糕的下那一块，被更多人分了。\n\n❌ **误解**：分压器输出 2.5V，接什么东西上去都还是 2.5V。\n✅ **正解**：接负载 = 给 R2 并了个帮手 = 下臂阻值变小 = 输出下跌。负载电阻越小（越能\"吃\"电流），跌得越狠。\n\n#### 02.6.2 戴维南等效：把分压器看成一个\"真实电源\"\n\n第 01 课介绍过：在一定条件下，可用理想电压源和内阻近似真实电源。**戴维南定理**说：任何分压器，从输出点往外看，也长这样——\n\n- **等效电压 Vth** = 空载（不接负载）时的输出电压。本例 = 2.5V\n- **等效内阻 Rth** = 独立电压源置零（理想电压源短接）后，从输出端看进去的等效电阻 = **R1 并 R2**。本例 = 10kΩ 并 10kΩ = 5kΩ\n\n不要求会证明，只要求会查这两个数。接上负载 RL 后，就是\"内阻 Rth + 负载 RL\"再分一次压：\n\n- U负 = Vth × RL ÷ (RL + Rth) = 2.5 × 10 ÷ (10 + 5) ≈ 1.67V\n\n跟 02.6.1 算的残酷地一致 ✓。本质一句话：**负载电流流过 Rth，在内阻上产生了压降**——和第 01 课\"旧电池内阻把端电压吃掉\"是同一件事，只不过这次的\"内阻\"是你自己分压器的。\n\n#### 02.6.3 经验规则：负载电阻 ≥ 10 倍\n\n想让电压跌得少，负载电阻就要远大于 Rth。对恒定电阻负载，**RL ≥ 10 × Rth** 时，相对于空载电压的跌幅不超过 1/11（约 9.1%）；是否满足精度要求仍需另行判断。\n\n验证：Rth = 5kΩ，取 RL = 50kΩ：\n\n- U负 = 2.5 × 50 ÷ (50 + 5) = 125/55 ≈ 2.27V\n- 跌了 2.5 − 2.27 = 0.23V，约 9.1%；是否够用取决于允许误差\n\nADC 的静态漏电可能很小，但采样型 ADC 会周期性给内部采样电容充电，不能把它简单当作固定的大电阻。02.4 的电路仍须按实际 ADC 的采样时间、源阻抗、输入范围和漏电条件核验；14V 及公差示例已显示它可能超过量程。可参考 [TI 的 ADC 输入建立时间说明](https://www.ti.com/lit/spract6)。\n坏消息的典型：想用分压器给 LED\"供电\"——LED 是非线性负载，不能简单按固定电阻判断；应按 LED 的伏安特性、限流和分压器输出能力求工作点。普通高阻分压器通常不适合作为 LED 的稳定供电。\n\n于是得到本课最重要的工程结论：\n\n> **分压器输出会随负载变化。**它常用于电压检测或为高输入阻抗电路提供参考；带负载时必须核算误差、功耗和稳定性。需要稳定供电或较大电流时，通常选择合适的稳压器或缓冲电路——第 10 课 电源模块 的主角。\n\n**这在板子上**：电压检测、旋钮读取和传感器信号常用分压，但仍要核对负载、采样与精度。\n\n**停下来检查 02.6**\n\n1. 33kΩ/10kΩ 分压器（02.4.1 那个），它的 Rth 是多少？（提示：两只并联）\n2. Rth = 5kΩ 的分压器，想让接负载后电压跌幅严格小于 10%，负载电阻应满足什么条件？\n\n<details>\n<summary>停下来检查：答案<\/summary>\n\n1. Rth = (33 × 10) ÷ (33 + 10) = 330 ÷ 43 ≈ 7.7kΩ。\n2. 跌幅为 Rth/(RL + Rth)；要求小于 10%，因此 RL > 9×Rth = 45kΩ。50kΩ 是符合条件的一个选择，跌幅约 9.1%。\n\n<\/details>\n\n### 02.7 功率校验：算完电流，必查发热\n\n#### 02.7.1 为什么要查\n\n电阻的本职工作就是把电能变成热。热过了头，电阻烧黑、断路，严重时把板子烤糊。所以每只电阻定型前都要问一句：**你热得起吗？**\n\n查的工具是第 01 课学过的 **P = I² × R**。逐个字母：P 是功率，单位瓦（W），表示发热的快慢；I 是流过这只电阻的电流，单位安（A）；R 是它的阻值；I² 就是 I × I。\n\n单位速算（接着 02.1.2 的套路）：毫安 × 千欧 = 伏，两边再乘一个毫安，得 **毫安 × 毫安 × 千欧 = 毫瓦**。验证：(1mA)² × 1kΩ = 0.001 × 0.001 × 1000 = 0.001W = 1mW ✓。\n\n#### 02.7.2 算例两连\n\n**算例 1（好设计）**：02.4.1 的 ADC 分压，I ≈ 0.28mA\n\n1. P(R2) = 0.28 × 0.28 × 10 = 0.0784 × 10 ≈ 0.78mW\n2. P(R1) = 0.0784 × 33 ≈ 2.6mW\n3. 几毫瓦，摸都摸不出来——低于下表示例的 0402 半额定功率；实际还要核对器件型号、耐压及温度降额\n\n**算例 2（坏设计）**：某支路电流 50mA，有人串了一只 100Ω 电阻\n\n1. I = 50mA = 0.05A\n2. P = 0.05 × 0.05 × 100 = 0.0025 × 100 = 0.25W\n3. 查表：若按下表示例，0805 额定 0.125W，已超额定；1206 额定 0.25W，在额定条件下接近满载，需结合降额和工作温度重新选型\n4. 顺手再算压降：0.05A × 100Ω = 5V——电阻上掉 5V；是否可行还要看实际供电电压、负载要求和功率额定值\n\n功率校验经常像算例 2 这样，顺手把设计错误暴露出来。这就是它值钱的地方。\n\n#### 02.7.3 封装功率表与\"半功率\"规则\n\n下表仅作为一组**假设的普通厚膜电阻练习值**，并非封装通用额定值；同一封装不同系列可能有不同功率额定值，例如 [Vishay 普通与高功率系列对比](https://www.vishay.com/doc?48634=)。实际还要查安装条件、环境温度降额、工作电压、脉冲和阻值范围：\n\n| 封装 | 额定功率 | 按\"一半规则\"使用 |\n|---|---|---|\n| 0402 | 1/16 W（62.5mW） | ≤ 31mW |\n| 0603 | 1/10 W（100mW） | ≤ 50mW |\n| 0805 | 1/8 W（125mW） | ≤ 62mW |\n| 1206 | 1/4 W（250mW） | ≤ 125mW |\n\n**本课练习假设：实际功率不超过表中额定功率的一半。**这只是本例的设计余量，不保证任意环境下温升或寿命合格；实际须遵守器件降额曲线与项目规范。降额设计思想，第 19 课 专项技能强化 会系统展开。\n\n#### 02.7.4 一只扛不住，两只一起扛\n\n串联电阻可以**分摊电压和功率**：两只相同的电阻串联，各分一半电压、一半发热。要监测几十上百伏的高压时，常用多只电阻串联分摊耐压和发热，而不是让一只硬扛——这也解释了为什么高压分压电路里，R1 常常画成一长串。\n\n**流程口诀：定工作条件 → 求电流 → 每只电阻算功率 → 查具体料号的功率、耐压和降额 → 结合实际温度选型。**\n\n**这在板子上**：每张原理图定型前，工程师都会把所有电阻过一遍这道流程。你在第 04 课 硬件基础 开始选零件时，就要养成这个习惯。\n\n**停下来检查 02.7**\n\n1. LED 支路电流 20mA，限流电阻 150Ω。功率是多少？0603（按一半规则 ≤ 50mW）扛得住吗？\n2. 12V、43kΩ 的分压支路，每只电阻的功率大约多少？选什么封装？\n\n<details>\n<summary>停下来检查：答案<\/summary>\n\n1. P = 0.02 × 0.02 × 150 = 0.0004 × 150 = 60mW > 50mW，按本课假设的表值和半功率要求，0603 不满足；0805 为 62.5mW，余量很小。可优先考察 1206 的具体料号，并核查温度降额和耐压。\n2. I ≈ 0.28mA；P(R2) ≈ 0.8mW、P(R1) ≈ 2.6mW——按本课表值小于 0402 半额定功率；实际还需查具体器件条件。\n\n<\/details>\n\n\n### 02.8 惠斯通电桥：分压的巅峰应用\n\n> 🔬 **配套仿真**：[惠斯通电桥](#/sim/wheatstone)——调整桥臂电阻，观察中点之间的理想电流表何时读数为 0；失衡时该读数是桥支电流，不是开路差分电压\n\n把**两个分压器背对背**接在一起，就得到了电子测量里的百年经典——惠斯通电桥（Wheatstone bridge）：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" width=\"620\" height=\"250\" role=\"img\" aria-label=\"惠斯通电桥及两个中点间的检流计\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M100 40 H480 M100 200 H480 M100 40 V90 M100 150 V200 M250 40 V60 M250 100 V140 M250 180 V200 M420 40 V60 M420 100 V140 M420 180 V200 M250 120 H300 M370 120 H420\"/><circle cx=\"100\" cy=\"120\" r=\"30\"/><rect x=\"235\" y=\"60\" width=\"30\" height=\"40\"/><rect x=\"235\" y=\"140\" width=\"30\" height=\"40\"/><rect x=\"405\" y=\"60\" width=\"30\" height=\"40\"/><rect x=\"405\" y=\"140\" width=\"30\" height=\"40\"/><circle cx=\"335\" cy=\"120\" r=\"35\"/><circle cx=\"250\" cy=\"120\" r=\"3\" fill=\"currentColor\"/><circle cx=\"420\" cy=\"120\" r=\"3\" fill=\"currentColor\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"94\" y=\"115\">+<\/text><text x=\"94\" y=\"139\">−<\/text><text x=\"32\" y=\"125\">电源<\/text><text x=\"275\" y=\"85\">R1<\/text><text x=\"275\" y=\"165\">R2<\/text><text x=\"445\" y=\"85\">R3<\/text><text x=\"445\" y=\"165\">Rx<\/text><text x=\"328\" y=\"126\">G<\/text><text x=\"190\" y=\"238\">G 为检流计；平衡时两中点等电位。<\/text><\/g><\/svg>\n```\n\n**原理三句话**：\n\n1. 左边 R1/R2 是一个分压器，右边 R3/Rx 是另一个分压器，共用同一个电源；\n2. 两个分压器的中点（图中的检流计两端）各有一个电压，**输出 = 两个中点电压之差**；\n3. 当两个分压**比**相等（R1/R2 = R3/Rx）时，两个中点电压相等，输出恰好为 **0V——这叫\"电桥平衡\"**。\n\n**平衡条件的推导**（一步不跳）：设电源电压 U。左中点电压 = U × R2/(R1+R2)（分压公式，NTC 在下臂同款）；右中点 = U × Rx/(R3+Rx)。两者相等：\n\nU × R2/(R1+R2) = U × Rx/(R3+Rx) → 交叉相乘化简（两边同除 U）→ **Rx = R3 × R2 / R1**\n\n于是**测未知电阻**就变成：调已知电阻直到检流计读零（平衡），代入公式算出 Rx——零点检测可降低对检流计绝对刻度的依赖；实际精度还取决于已知电阻、温度、检流计灵敏度及接线。\n\n**算例**：R1 = 1kΩ，R2 = 2kΩ，R3 = 3kΩ，平衡时 Rx = 3k × 2k / 1k = **6kΩ**。\n\n**不平衡才是日常用途**：把一个\"会变的电阻\"放进桥臂（应变片、PT100、热敏电阻），物理量变化→桥臂阻值变化→电桥失衡→输出小电压→放大后读数（第 12 课 12.7 节信号调理的经典前端）。输出灵敏度与桥臂阻值、电源电压相关，产品中常配仪表放大器。\n\n**停下来检查**：R1=1k、R2=1k、R3=10k 时，Rx 多大能平衡？如果四个电阻都是 10k，输出是多少？\n\n<details>\n<summary>参考答案<\/summary>\n\n- Rx = R3 × R2/R1 = 10k × 1k/1k = **10kΩ**\n- 四臂相等时分压比都是 1/2，两中点电压相等，输出 **0V**（标准平衡桥）\n\n<\/details>\n\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 分压设计三连（练习 A） | 每题写出完整步骤：比例、阻值、电流、输出电压、功率 |\n| 2 | 并联速算（练习 B） | 10 组口算，至少 8 组正确 |\n| 3 | 分流计算（练习 C） | 算出每条支路电流和总电流，并\"对账\" |\n| 4 | KCL 对账（练习 D） | 列出\"流入 = 流出\"算式，说清负号的含义 |\n| 5 | KVL 对账（练习 E） | 一圈的\"升\"和\"降\"分别加一遍，账要平 |\n| 6 | 负载效应（练习 F） | 算出 Rth 和接负载后的电压，验证 10 倍规则 |\n| 7 | 功率校验（练习 G） | P = I²R 全过程 + 选封装 |\n| 8 | 仿真两连（练习 H） | 手算数值与仿真读数对上 |\n\n### 练习 A：分压设计三连\n\n**A1（正向）**：12V 电源，R1 = 20kΩ，R2 = 10kΩ。求输出电压 U2、支路电流 I、每只电阻的功率。\n\n**A2（反向）**：手头只有一排 10kΩ 电阻和 5V 电源，需要一个约 1.65V 的参考电压（3.3V 的一半）。只用 10kΩ 电阻能凑出来吗？给出方案和实际输出值。\n\n**A3（校验挑错）**：同学说：\"我要用 12V 分压得到 6V，去带一个小灯。\"他选了 R1 = R2 = 10Ω。先假设灯尚未接入，请算出空载支路电流和每只电阻的功率，判断这设计行不行，并给出修改建议。\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n**A1**：\n\n1. R总 = 20k + 10k = 30kΩ\n2. I = 12V ÷ 30kΩ = 0.4mA\n3. U2 = 0.4mA × 10kΩ = 4V（公式验算：12 × 10/30 = 4V ✓）\n4. P(R1) = 0.4 × 0.4 × 20 = 3.2mW；P(R2) = 0.4 × 0.4 × 10 = 1.6mW——按具体器件的功率、耐压和温度条件核对\n\n**A2**：\n\n1. 比例 k = 1.65 ÷ 5 = 0.33，约等于 1/3\n2. R2 占总电阻 1/3 → R总 = 3 × R2 → R1 = 2 × R2\n3. 方案：R2 用一只 10kΩ；R1 用两只 10kΩ 串联凑出 20kΩ\n4. 实际输出 = 5 × 10/30 = 5/3 ≈ 1.67V，比目标 1.65V 高约 0.02V（约百分之一），一般用途够用；要更准就得用别的标准值或加微调\n\n**A3**：\n\n1. I = 12V ÷ (10 + 10)Ω = 12 ÷ 20 = 0.6A\n2. 每只电阻 P = 0.6 × 0.6 × 10 = 3.6W——必须选能满足 3.6W、温升和耐压要求的具体器件；普通小封装通常无法满足\n3. 就算换大功率电阻，小灯（低阻抗负载）一接上，输出电压也会被拉低（负载效应），6V 保不住\n4. 建议：该分压器不适合题设小灯的稳定供电；可以按负载、电流和电压要求选择合适电源方案（第 10 课）。如果改为给高输入阻抗端提供 6V 信号，可以先比较 10kΩ + 10kΩ，并核对负载与误差\n\n<\/details>\n\n### 练习 B：并联速算 10 组\n\n| # | 题目 | # | 题目 |\n|---|------|---|------|\n| 1 | 10kΩ ∥ 10kΩ = ? | 6 | 2kΩ ∥ 6kΩ = ? |\n| 2 | 1kΩ ∥ 1kΩ = ? | 7 | 3kΩ ∥ 6kΩ = ? |\n| 3 | 100Ω ∥ 100Ω = ? | 8 | 4kΩ ∥ 4kΩ = ? |\n| 4 | 10kΩ ∥ 30kΩ = ? | 9 | 5kΩ ∥ 20kΩ = ? |\n| 5 | 1kΩ ∥ 3kΩ = ? | 10 | 6kΩ ∥ 3kΩ = ? |\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n1. 等值减半：5kΩ\n2. 等值减半：0.5kΩ = 500Ω\n3. 等值减半：50Ω\n4. (10 × 30) ÷ (10 + 30) = 300 ÷ 40 = 7.5kΩ\n5. (1 × 3) ÷ (1 + 3) = 3/4 kΩ = 750Ω\n6. (2 × 6) ÷ (2 + 6) = 12 ÷ 8 = 1.5kΩ\n7. (3 × 6) ÷ (3 + 6) = 18 ÷ 9 = 2kΩ\n8. 等值减半：2kΩ\n9. (5 × 20) ÷ (5 + 20) = 100 ÷ 25 = 4kΩ\n10. (6 × 3) ÷ (6 + 3) = 18 ÷ 9 = 2kΩ\n\n<\/details>\n\n### 练习 C：分流计算\n\n6V 电源接 1kΩ 与 2kΩ 的并联组合。求：（1）每条支路的电流；（2）总电流；（3）用\"总电流 = 电压 ÷ 并联总电阻\"对账；（4）用分流公式再验算一遍 I1。\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n（1）I1 = 6V ÷ 1kΩ = 6mA；I2 = 6V ÷ 2kΩ = 3mA。\n（2）I总 = 6 + 3 = 9mA。\n（3）R并 = (1 × 2) ÷ (1 + 2) = 2/3 kΩ ≈ 0.67kΩ；I总 = 6 ÷ (2/3) = 6 × 3/2 = 9mA ✓\n（4）I1 = I总 × R2 ÷ (R1 + R2) = 9 × 2/3 = 6mA ✓（注意分子是\"对方\"的电阻——反比）\n\n<\/details>\n\n### 练习 D：KCL 节点练习\n\n某节点接 4 条支路：I1 = 0.6A 流入，I2 = 0.25A 流入，I3 = 0.9A 流出，I4 方向未知（先假设流出）。求 I4 的大小和真实方向。\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n按\"流入 = 流出\"列算式：I1 + I2 = I3 + I4\n\n- 左边（流入）：0.6 + 0.25 = 0.85A\n- 0.85 = 0.9 + I4 → I4 = 0.85 − 0.9 = −0.05A\n\n负号说明假设的方向反了：I4 实际是**流入**节点，大小 50mA。数字照样可用——这就是 02.5.1 说的\"负号不是错误，是情报\"。\n\n<\/details>\n\n### 练习 E：KVL 回路练习\n\n12V 电池串着 R1 = 1kΩ、R2 = 2kΩ、R3 = 3kΩ。求电流、每只电阻的电压，并验证\"一圈升降相等\"。\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n1. R总 = 1k + 2k + 3k = 6kΩ\n2. I = 12V ÷ 6kΩ = 2mA\n3. U1 = 2 × 1 = 2V；U2 = 2 × 2 = 4V；U3 = 2 × 3 = 6V\n4. 对账：降的总和 = 2 + 4 + 6 = 12V = 电池升 ✓ 账平（顺带发现：三只电阻 1:2:3，电压也正好 2:4:6——正比分压）\n\n<\/details>\n\n### 练习 F：负载效应\n\n5V 电源 + 10kΩ/10kΩ 分压器（空载输出 2.5V），输出端接一个 100kΩ 的负载。求 Rth、接负载后的输出电压、跌了多少，并检查是否符合\"10 倍规则\"。\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n1. Vth = 空载输出 = 2.5V\n2. Rth = R1 ∥ R2 = 10k ∥ 10k = 5kΩ\n3. U负 = Vth × RL ÷ (RL + Rth) = 2.5 × 100 ÷ (100 + 5) = 250/105 ≈ 2.38V\n4. 跌了 2.5 − 2.38 = 0.12V，约二十分之一（5%）\n5. 检查：RL = 100kΩ = 20 × Rth ≥ 10 × Rth ✓ 符合 10 倍规则，跌幅小于十分之一；是否满足目标精度还需另算\n\n<\/details>\n\n### 练习 G：功率校验与选封装\n\n5V 电源点亮一颗 LED（导通压降 2V，第 01 课的老朋友），限流电阻取 200Ω。求支路电流、电阻功率，并按\"半功率规则\"选封装。\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n1. 电阻两端电压 = 5 − 2 = 3V\n2. I = 3V ÷ 200Ω = 15mA\n3. P = I² × R = 0.015 × 0.015 × 200 = 0.000225 × 200 ≈ 45mW\n4. 查表：0603 半功率限 50mW——45mW 踩线通过，但没有余量；稳妥选 0805（限 62mW）\n5. 顺手对账：电阻压降 = 0.015 × 200 = 3V，与第 1 步一致 ✓\n\n<\/details>\n\n### 练习 H：仿真两连\n\n1. 打开配套仿真\"电阻串联电路\"，改变两只电阻的阻值，确认两件事：电流处处相等、电压按阻值比例分配\n2. 打开配套仿真\"分压电路\"，把两只电阻的阻值对调，观察输出电压怎么变；有电脑的话用 LTspice 搭出 12V + 33kΩ/10kΩ 的分压，先测空载输出，再在输出端挂 10kΩ 负载，最后换 1MΩ 负载\n\n<details>\n<summary>参考答案（点击展开）<\/summary>\n\n1. 任意阻值下，电路里电流表读数到处一样；阻值翻倍的那只电阻，电压也翻倍。\n2. 两只电阻对调，输出电压正好变成\"互补\"（比如 4V 变 8V，因为总还是 12V）。\n3. LTspice 三次读数：空载 ≈ 2.79V（手算 12 × 10/43）；挂 10kΩ 负载 ≈ 1.58V（2.79 × 10 ÷ 17.7，负载效应实锤）；换 1MΩ 负载 ≈ 2.77V（几乎不跌——1MΩ 远大于 10 × Rth ≈ 77kΩ，10 倍规则验证通过）。\n\n<\/details>\n\n## ✅ 自测清单\n\n- [ ] 能用\"数路径\"判断串联还是并联，说出两者的判据（同一电流 / 同一电压）\n- [ ] 会算串联总电阻；两只并联会用 (R1×R2)÷(R1+R2) 速算，等值并联立即报\"减半\"\n- [ ] 能默写电阻、电容、电感串并联对比表，记住\"电容跟电阻正好互换\"\n- [ ] 能用两步欧姆定律现推分压公式，不靠背\n- [ ] 能说出\"阻值大分压多\"，并举一个数字例子\n- [ ] 能独立完成\"3.3V ADC 测 12V\"全套：比例、阻值、电流、功率、软件换算\n- [ ] 能解释分压电阻过小或过大各有何问题，并结合后级与精度确定阻值\n- [ ] 会算并联支路电流，说出\"分压正比、分流反比\"\n- [ ] 能复述 KCL\"流入 = 流出\"，并算一个三支路节点\n- [ ] 能复述 KVL\"绕一圈升 = 降\"，并用它重新推出分压公式\n- [ ] 会算分压器的 Rth = R1∥R2，并按允许跌幅计算电阻负载要求\n- [ ] 能说明分压器带负载时的误差，知道供电或缓冲方案需结合要求选择\n- [ ] 会用 P = I²R 校验电阻功率，并按具体料号、环境及项目要求核查额定值和降额\n- [ ] 养成\"算完电流必查功率\"的习惯，知道功率校验经常能顺手暴露设计错误\n\n- [ ] 我能画出惠斯通电桥结构，并推出平衡条件 Rx = R3×R2/R1\n- [ ] 我知道电桥\"不平衡输出\"在传感器测量里的用途\n\n## ⚠️ 新手常见坑\n\n1. **以为电流过第一个电阻会变小**：串联电路电流处处相等——闭合水管里的水不会中途消失，电阻是让整条路的电流一起变小。\n2. **分压公式分子分母代反**：输出取自哪只电阻，分子就是谁。根治办法不是背得更熟，而是每次都\"两步现推\"：电压÷总阻得电流，电流×R2 得输出。\n3. **分压当电源用**：给 LED、小灯这类低阻抗负载\"供电\"，电压立刻被拉垮（02.6 的负载效应），功率也扛不住。分压用于实际负载时必须核算负载效应和功耗；稳定供电可参看第 10 课。\n4. **设计时忘了负载效应**：后级电路也是负载！设计完必查：对于恒定电阻负载，RL ≥ 10×Rth 也仍可能产生约 9.1% 的下降；按目标精度计算。\n5. **分压电阻走极端**：10Ω 级费电冒烟，10MΩ 级易受干扰、ADC 读数漂。选值还需核对后级漏电、ADC 动态采样、功耗和精度。\n6. **算完电流不查功率**：P = I²R 一分钟的事。以适当降额作为初步考虑，并核对所选型号和工作条件——50mA 串 100Ω 就能烧给你看。\n\n## 📚 延伸学习\n\n- B 站搜索关键词：\"串联并联 通俗\"、\"分压电路 计算\"、\"基尔霍夫定律 例题\"、\"戴维南等效 通俗\"、\"电位器 原理\"\n- 经典教材参考：初中物理\"串联和并联\"一章（任一版本）快速回顾；邱关源《电路》第二章选读——只看等效变换的思想，不必啃习题\n- 仿真实践：把配套的两个仿真玩透，再用 LTspice 复现练习 H 的三连测——\"手算 → 仿真 → 对账\"这个循环，是整个阶段一的学习方法\n- 生活观察：台灯调光旋钮、音箱音量旋钮都是电位器；充电宝显示电量百分比，背后就是\"分压 + ADC\"在数电压","taskSignature":"eed1e1e1a891383d9d72a95863699cf5a74c0f87656bb32746d692093f4e50c4","taskCount":16},{"id":"03","title":"第 03 课 · 电容、电感与电信号","short":"电容、电感与电信号","stage":1,"diff":3,"prev":"第 02 课 · 电路分析基本功","optional":false,"md":"## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 用\"海绵 / 小水库\"的类比，向同学讲清电容存的是什么、怎么充电、怎么放电\n2. 用\"慢镜头\"描述充电全过程：电压先快后慢爬到顶、电流从最大逐渐趋近于零\n3. 默写时间常数 τ = R×C，一步一步算出 τ（包括 Ω×F=秒 这个单位大坑），背出 1τ→63%、3τ→95%、5τ 约 99.3%，是否够用取决于允许误差\n4. 说出 RC 电路三大应用——去耦、耦合、上电复位延时——各自长在板子的什么地方\n5. 用\"飞轮\"类比讲清电感为什么反对电流变化，解释断开电感为什么可能产生高压，以及如何选择续流或钳位路径\n6. 不用计算，说出理想电容和理想电感的电抗随频率变化的趋势，并用\"阻抗\"这个词解释交流世界的阻力\n7. 读懂正弦波的幅值、峰峰值、有效值、频率、周期、相位，会把 220V 换算成 311V\n8. 区分模拟信号和数字信号（调光台灯 vs 开关灯），说清数字电路为什么抗干扰强\n\n## 📖 正文\n\n### 03.1 前两课缺了一样东西：时间\n\n前两课主要分析稳态电阻电路，像一张**照片**：在给定条件下先算出稳定后的电压和电流。实际切换过程仍受寄生参数影响。\n\n真实的电路，是一部**电影**：\n- 电源插头插上的那一瞬间，会发生什么？\n- 信号每秒变化几百万次，怎么看？\n- 继电器说断就断，断的那一下，发生了什么？\n\n照片里没有\"一瞬间\"，电影里才有。想看懂电影，就得盯住**每一个时刻**的电压和电流。\n\n为什么前两课只看照片就够？因为理想电阻模型不储存能量：在该简化模型中电流随电压即时变化；真实电路仍有寄生电容、电感和传播延迟。这一课的两位新主角——电容和电感——会\"存\"东西：\n- 电容两极板储存等量异号电荷，能量储存在**电场**中\n- 电感的能量储存在**磁场**中\n\n存东西需要时间，放东西也需要时间。于是电路里第一次出现了\"过程\"——这一课的全部内容，就是学会看这个过程。\n\n本课路线：先电容（03.2～03.3），再电感（03.4），再看频率怎么改变它们的脾气（03.5），最后读\"会动的信号\"（03.6～03.7）。\n\n**停下来检查**\n\n1. 为什么前两课的电路可以当\"照片\"看，这一课必须当\"电影\"看？\n2. 电容和电感最像的地方是什么？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 为什么前两课的电路可以当\"照片\"看，这一课必须当\"电影\"看？**\n前两课主要采用理想电阻模型，它不储存能量，稳定状态可用电压和电流描述；真实电路的变化过程可能受寄生参数影响。电容和电感会\"存\"东西，存和放都需要时间，每个时刻的电压电流都可能不同，必须按时间一段一段看。\n\n**2. 电容和电感最像的地方是什么？**\n理想情况下都不消耗能量，而是\"存\"能量：电容存进电场（电荷），电感存进磁场。存取需要时间，这是它们和电阻最大的区别。\n\n<\/details>\n\n### 03.2 电容：会吸水放水的\"电子海绵\"\n\n#### 03.2.1 电容长什么样，存的是什么\n\n电容的结构简单到离谱：**两块金属板，中间夹一层绝缘体**，靠得非常非常近。接上电池会发生什么？\n- 正电荷涌向其中一块板，负电荷涌向另一块板\n- 中间的绝缘体拦住它们，不让过\n- 两块板上的正负电荷隔着\"绝缘墙\"互相吸引，谁也跑不了——**电荷被存住了**\n\n这就是电容（capacitor）：一个存电荷的容器。类比一块海绵（或一个小水库）：\n\n| 电容做的事 | 海绵/水库做的事 |\n|---|---|\n| 充电（存电荷） | 吸水 |\n| 放电（放电荷） | 挤水 |\n| 电压升高 | 水位升高 |\n| 容量 C 大 | 池子大，能装更多水 |\n\n容量 C 的单位是法拉（F）。1F 大得吓人，实际常用 μF、nF、pF（换算第 01 课学过）。存了多少电荷？一个乘法：**Q = C × U**——池子越大（C 大）、水位越高（U 高），存得越多。\n\n❌ **误解**：\"电容存的是电压，用的时候把电压放出来。\"\n\n✅ **正解**：电容存的是**电荷（能量）**。电压只是\"水位刻度\"——告诉你池子现在装了多满。存的东西是水（电荷），不是刻度。\n\n常见电容家族（认实物是第 04 课的事）：陶瓷电容（个头小、无极性、方向随便装）、铝电解电容（容量大、**有极性，装反会发热鼓包甚至炸**）、钽电容（小而有极性）。\n\n**停下来检查**\n\n1. 电容能存的电荷多少，由哪两个量决定？\n2. \"电容里存着电压\"这句话错在哪？\n3. 为什么电解电容装反方向会出事？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 电容能存的电荷多少，由哪两个量决定？**\n容量 C 和电压 U。Q = C×U：池子越大、水位越高，存得越多。\n\n**2. \"电容里存着电压\"这句话错在哪？**\n存的是电荷（能量）。电压只是反映\"存了多少\"的水位刻度，不是被存的东西本身。\n\n**3. 为什么电解电容装反方向会出事？**\n有极性的电解电容反接可能损伤介质，使漏电增加、发热，严重时鼓包或破裂。长短脚和色带只能作为线索，须按具体器件的标记和手册确认极性。\n\n<\/details>\n\n#### 03.2.2 充电慢镜头：一秒一秒地看\n\n先搭一个理想模型：5V 恒压电源、开关、10kΩ 电阻和 100μF 电容串联，假设电容初始电压为 0V，忽略漏电与寄生参数。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"174.03999999999996pt\" width=\"315.848pt\" viewBox=\"-43.588 -146.39999999999998 315.848 174.03999999999996\"><circle cx=\"0\" cy=\"-54\" r=\"18\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 0.0,-0.0 L 0,-36 L 0,-36 M 0,-72 L 0,-72 L 0,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000003,-45.0 L -3.6,-45\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.637200993467639e-15,-59.4 L 0,-66.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000004,-63.0 L -3.6,-63\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 6.613092715395707e-15,-108.0 L 36,-108 M 44.64,-111.6 L 64.8,-124.2 M 72,-108 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 144,-108 L 147,-117 L 153,-99 L 159,-117 L 165,-99 L 171,-117 L 177,-99 L 180,-108 L 216,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 216.0,-108.0 L 216,-57.24 M 225,-57.24 L 207,-57.24 M 225,-50.76 L 207,-50.76 M 216,-50.76 L 216,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 215.99999999999997,-0.0 L 108,-0 L 0,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-2.6452370861582824e-14 L 0,14.4 L -9,14.4 L 9,14.4 M -6.3,18.72 L 6.3,18.72 M -1.8,23.04 L 1.8,23.04\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-21.599999999999994\" y=\"-68.0\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-21.599999999999994\" dy=\"14.0\">5V<\/tspan><\/text><circle cx=\"40.32\" cy=\"-108\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"67.68\" cy=\"-108\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"54.00000000000001\" y=\"-141.8\" dominant-baseline=\"ideographic\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"54.00000000000001\" dy=\"14.0\">开关（闭合开始充电）<\/tspan><\/text><text x=\"162.0\" y=\"-134.60000000000002\" dominant-baseline=\"ideographic\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"162.0\" dy=\"14.0\">10kΩ<\/tspan><\/text><text x=\"228.6\" y=\"-68.0\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"228.6\" dy=\"14.0\">100μF<\/tspan><\/text><\/svg>\n```\n\n现在合上开关，放慢镜头。（为什么时间点刚好是 1 秒、2 秒、3 秒？03.2.3 的 τ 会揭晓。）\n\n**第 0 秒（合上开关的一瞬间）：**\n- 电容是块干海绵，电压 0V\n- 电源 5V，电容 0V，差距全落在电阻上：电阻两端 5V\n- 电流 = 5V ÷ 10kΩ = **0.5mA——全场最大的一刻**\n\n**第 1 秒末：**\n- 电容充到 5V 的 63%，约 3.15V\n- 电阻两端只剩 5 − 3.15 = 1.85V\n- 电流降到 1.85V ÷ 10kΩ = 0.185mA——变小了\n\n**第 2 秒末：**\n- 电容到 86%，约 4.3V\n- 电阻两端只剩 0.7V，电流只剩 0.07mA——更慢了\n\n**第 3 秒末：**\n- 电容到 95%，约 4.75V\n- 电流只剩 25μA，几乎充不动了\n\n**第 5 秒末：**\n- 电容到 99.3%，约 4.97V\n- 电流不到 4μA；此时仍有约 0.7% 的电压差，是否足够接近终值由允许误差决定\n\n看完慢镜头，提炼两条规律（比公式还重要）：\n- **电容的电压一路升高，先快后慢**\n- **理想充电电流一路减小，开头最大，长期趋近于零**\n\n为什么先快后慢？看\"差距\"：一开始电容 0V、电源 5V，差距 5V，推力最猛，电荷涌着进；电容电压越高，和电源的差距越小，推力越弱，充得越慢。\n\n这与某些受环境温差影响的加热过程类似，但实际烧水还涉及加热功率、散热和沸腾，不能直接等同于 RC 电路。充电曲线就是这个脾气：**先快后慢，逼近上限，永不超越。**\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 255\" width=\"470\" height=\"255\" role=\"img\"><line class=\"wv-axis\" stroke=\"currentColor\" x1=\"60\" y1=\"27\" x2=\"60\" y2=\"202\"/><line class=\"wv-axis\" stroke=\"currentColor\" x1=\"60\" y1=\"200\" x2=\"450\" y2=\"200\"/><polyline class=\"wv-curve\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" points=\"60.0,200.0 63.8,192.0 67.6,184.3 71.4,177.0 75.2,170.1 79.0,163.5 82.8,157.2 86.6,151.3 90.4,145.6 94.2,140.2 98.0,135.1 101.8,130.2 105.6,125.6 109.4,121.1 113.2,116.9 117.0,112.9 120.8,109.1 124.6,105.5 128.4,102.1 132.2,98.8 136.0,95.7 139.8,92.7 143.6,89.9 147.4,87.2 151.2,84.7 155.0,82.3 158.8,80.0 162.6,77.8 166.4,75.7 170.2,73.7 174.0,71.8 177.8,70.0 181.6,68.3 185.4,66.7 189.2,65.1 193.0,63.7 196.8,62.3 200.6,60.9 204.4,59.7 208.2,58.5 212.0,57.3 215.8,56.2 219.6,55.2 223.4,54.2 227.2,53.3 231.0,52.4 234.8,51.5 238.6,50.7 242.4,50.0 246.2,49.2 250.0,48.5 253.8,47.9 257.6,47.3 261.4,46.7 265.2,46.1 269.0,45.5 272.8,45.0 276.6,44.5 280.4,44.1 284.2,43.6 288.0,43.2 291.8,42.8 295.6,42.4 299.4,42.1 303.2,41.7 307.0,41.4 310.8,41.1 314.6,40.8 318.4,40.5 322.2,40.2 326.0,40.0 329.8,39.7 333.6,39.5 337.4,39.3 341.2,39.1 345.0,38.9 348.8,38.7 352.6,38.5 356.4,38.3 360.2,38.2 364.0,38.0 367.8,37.9 371.6,37.7 375.4,37.6 379.2,37.5 383.0,37.4 386.8,37.2 390.6,37.1 394.4,37.0 398.2,36.9 402.0,36.8 405.8,36.7 409.6,36.7 413.4,36.6 417.2,36.5 421.0,36.4 424.8,36.4 428.6,36.3 432.4,36.2 436.2,36.2 440.0,36.1\"/><line class=\"wv-dash\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" x1=\"60\" y1=\"95.7\" x2=\"136\" y2=\"95.7\"/><line class=\"wv-dash\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" x1=\"136\" y1=\"95.7\" x2=\"136\" y2=\"200\"/><text x=\"64\" y=\"91.72\" text-anchor=\"start\" font-size=\"10\" class=\"wv-em\">3.15V<\/text><text x=\"136\" y=\"214\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">1τ：63%<\/text><line class=\"wv-dash\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" x1=\"60\" y1=\"43.2\" x2=\"288\" y2=\"43.2\"/><line class=\"wv-dash\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" x1=\"288\" y1=\"43.2\" x2=\"288\" y2=\"200\"/><text x=\"64\" y=\"39.25\" text-anchor=\"start\" font-size=\"10\" class=\"wv-em\">4.75V<\/text><text x=\"288\" y=\"214\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">3τ：95%<\/text><text x=\"136\" y=\"227\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">1τ<\/text><text x=\"136\" y=\"240\" text-anchor=\"middle\" font-size=\"9\" class=\"fp-note\">(1s)<\/text><text x=\"212\" y=\"227\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">2τ<\/text><text x=\"212\" y=\"240\" text-anchor=\"middle\" font-size=\"9\" class=\"fp-note\">(2s)<\/text><text x=\"288\" y=\"227\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">3τ<\/text><text x=\"288\" y=\"240\" text-anchor=\"middle\" font-size=\"9\" class=\"fp-note\">(3s)<\/text><text x=\"364\" y=\"227\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">4τ<\/text><text x=\"364\" y=\"240\" text-anchor=\"middle\" font-size=\"9\" class=\"fp-note\">(4s)<\/text><text x=\"440\" y=\"227\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">5τ<\/text><text x=\"440\" y=\"240\" text-anchor=\"middle\" font-size=\"9\" class=\"fp-note\">(5s)<\/text><text x=\"52\" y=\"41\" text-anchor=\"end\" font-size=\"10\" class=\"wv-lab\">5V<\/text><text x=\"52\" y=\"204\" text-anchor=\"end\" font-size=\"10\" class=\"wv-lab\">0V<\/text><text x=\"450\" y=\"214\" text-anchor=\"end\" font-size=\"10\" class=\"wv-lab\">时间 →<\/text><text x=\"450\" y=\"23\" text-anchor=\"end\" font-size=\"10\" class=\"wv-em\">终值 5V（5τ 达 99.3%）<\/text><text x=\"60\" y=\"21\" text-anchor=\"start\" font-size=\"10\" class=\"wv-lab\">电压<\/text><\/svg>\n```\n\n放电时要切换到一条从电容经电阻返回电容的闭合路径；仅仅断开电源不一定形成放电回路。理想模型中：电压从 5V 往下掉，1τ 后放掉 63%（剩 37%），3τ 后只剩 5%，5τ 后剩约 0.7%。放电曲线就是充电曲线翻过来的镜像。\n\n❌ **误解**：\"电容充电是一瞬间充满的。\"\n\n✅ **正解**：充电永远需要时间，快慢由 R 和 C 决定。小电容配小电阻可以快到纳秒级，大电容配大电阻可以慢到几分钟。\"快到肉眼看不见\"不等于\"不用时间\"。\n\n人眼当然看不了这么快或这么慢的电影。工程师用**示波器**——一台专门把\"电压随时间变化的曲线\"画在屏幕上的仪器，相当于给电压拍电影，整个课程里它会反复出场。\n\n**这在板子上**：大电容的设备（台式电脑、充电器）插电瞬间偶尔\"啪\"地打一下火——空电容在第一瞬间像短路，电流冲得最猛（行话叫浪涌电流）。板子上防浪涌的设计，防的就是这一下。\n\n**停下来检查**\n\n1. 合上开关的第 0 秒，电容电压是多少？全部电压落在谁身上？电流是最大还是最小？\n2. 充电到尾声，电流为什么越来越小？\n3. 充电进行到 3τ 时，电容电压大约是最终值的百分之几？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 合上开关的第 0 秒，电容电压是多少？全部电压落在谁身上？电流是最大还是最小？**\n电容电压 0V（干海绵）；电源的 5V 全部落在电阻上；电流 = 5V÷10kΩ = 0.5mA，是全程最大的一刻。\n\n**2. 充电到尾声，电流为什么越来越小？**\n电容电压升高后，电阻两端只剩\"电源电压 − 电容电压\"这一小截，电流 = 这一截 ÷ R，自然越来越小。\n\n**3. 充电进行到 3τ 时，电容电压大约是最终值的百分之几？**\n约 95%。\n\n<\/details>\n\n#### 03.2.3 时间常数 τ = RC：充电速度的\"刻度尺\"\n\n> 🔬 **配套仿真**：[RC 充放电](#/sim/capac)——切换双向开关观察充放电；仿真采用 100Ω、200μF，理想时间常数约 20ms，与正文的 1 秒算例不同。按初值到终值的变化量读取比例\n\n上面慢镜头里\"1 秒充到 63%\"不是巧合。充电快慢有一个统一的度量，叫**时间常数 τ**（τ 是希腊字母，读作\"掏\"）：\n\n**τ = R × C**\n- R 越大 = 水管越细，充得越慢\n- C 越大 = 池子越大，充得越慢\n- τ 越大 = 整个过程越慢\n\n百分比进度表（背下来，考试和调试天天用）：\n\n| 经过时间 | 充到（占最终电压） | 5V 电路里是 |\n|---|---|---|\n| 1τ | 63% | 3.15V |\n| 2τ | 86% | 4.3V |\n| 3τ | 95% | 4.75V |\n| 4τ | 98% | 4.9V |\n| 5τ | 约 99.3% | 约 4.97V；是否够用看允许误差 |\n\n1τ、3τ、5τ 分别代表给定比例，不存在适用于所有电路的“充满”时刻：3τ 仍差约 5%，5τ 仍差约 0.7%；要依据电路允许误差决定。\n\n**单位大坑：Ω × F = 秒。** R 必须先换成 Ω、C 必须先换成 F，乘出来的才是秒。直接拿\"10\"和\"100\"相乘必错。把慢镜头的例子一步不跳地算一遍：\n\n例 1：R = 10kΩ，C = 100μF，τ = ?\n- 第一步，把 R 换成 Ω：10kΩ = 10 × 1000 = **10000Ω**\n- 第二步，把 C 换成 F：100μF = 100 × 0.000001 = **0.0001F**\n- 第三步，相乘：τ = 10000 × 0.0001 = **1**\n- 第四步，配单位：Ω × F = 秒，所以 **τ = 1 秒**\n\n这就是在本例条件下约 1 秒达到 63%、3 秒达到 95%、5 秒达到 99.3% 的来历。\n\n例 2：R = 1kΩ，C = 100nF，τ = ?\n- 1kΩ = 1000Ω\n- 100nF = 100 × 0.000000001 = 0.0000001F\n- τ = 1000 × 0.0000001 = 0.0001 秒 = **0.1ms**\n\n一眨眼（约 0.3 秒）的三千分之一，肉眼完全看不见，只有示波器拍得到。\n\n数量级手感表：\n\n| R | C | τ | 什么感觉 |\n|---|---|---|---|\n| 10kΩ | 100nF | 1ms | 只有示波器看得见 |\n| 10kΩ | 10μF | 0.1s | 眼睛能察觉一点延迟 |\n| 10kΩ | 100μF | 1s | 秒表可测，课堂演示刚好 |\n| 1MΩ | 1μF | 1s | 一兆欧\"细水管\"配小池子，也是 1 秒 |\n\n心算绝招：全换成\"10 的几次方\"再乘。10kΩ = 10⁴Ω，100μF = 100 × 10⁻⁶ = 10⁻⁴F，10⁴ × 10⁻⁴ = 10⁰ = 1，即 1 秒。\n\n当放电路径的等效电阻仍为同一个 R 时，放电用相同的 τ：1τ 剩约 37%，3τ 剩约 5%，5τ 剩约 0.7%；路径电阻不同则需重新算 τ。实测小技巧：示波器上找到电压爬到终值 63% 的时刻，对应的时间就是 1 个 τ——实验室里测量未知 RC 的标准招数。\n\n**这在板子上**：上电复位延时（03.3.3 详讲）就是拿 τ 当\"闹钟\"用——设计等待时间还要考虑复位释放阈值、电源上升过程、初始电压和容差，不能只凭 τ 决定启动时间。\n\n**停下来检查**\n\n1. R = 1kΩ，C = 1000μF，τ = ?（写出换算过程）\n2. τ = 2 秒的电路，充到约 95% 要多久？\n3. 如果电路允许 5% 的电压误差，理想 RC 充电大约要多久？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. R = 1kΩ，C = 1000μF，τ = ?（写出换算过程）**\n1kΩ = 1000Ω；1000μF = 1000 × 0.000001 = 0.001F；τ = 1000 × 0.001 = 1 秒。\n\n**2. τ = 2 秒的电路，充到约 95% 要多久？**\n95% ≈ 3τ = 3 × 2 = 6 秒。\n\n**3. 允许 5% 电压误差，大约要多久？**\n约 3τ，此时达到终值的 95%；如果误差要求更严，应计算所需时间，5τ 仍有约 0.7% 的残差。\n\n<\/details>\n\n#### 03.2.4 通交流、阻直流：一堵\"认频率的墙\"\n\n把电容接到**直流**电源上：\n- 一开始：充电，有电流\n- 充满后：电容电压 = 电源电压，两边一样高，水不流了\n- 在理想模型且电源维持不变时：电流随时间趋近于 0；真实电容仍可能有漏电\n\n结论：充满的电容对直流是**一堵墙**。这叫\"阻直流\"（也叫\"隔直\"）。把电容接到**交流**电源上：\n- 电压正半周：给电容充电，电荷涌向这一侧\n- 电压负半周：反过来充，电荷又涌回去\n- 电压每秒完整地来回变化 50 次（50Hz），电荷就在导线里来回跑 50 个来回\n- 结果：**外电路里一直有电荷在流动**\n\n这叫\"通交流\"。但请注意用词——\n\n❌ **误解**：\"通交流是电荷穿过了电容中间的绝缘层。\"\n\n✅ **正解**：理想电容的介质不导电；实际介质有漏电，超出额定条件还可能击穿。所谓\"通\"，是电容两头被来回充放电、导线里的电荷来回跑——**宏观效果**上像通了。打个比方：电容是块跷跷板，这头压下去、那头翘起来，两头的电荷隔空联动，但没有人真的从板子中间穿过去。\n\n**这在板子上**：音频电路里前后两级之间串一颗电容——直流被挡住（两级的直流偏置互不干扰），声音信号（交流）顺利通过。这颗电容叫**耦合电容**，03.3.2 详说。\n\n**停下来检查**\n\n1. 理想 RC 电路由 5V 恒压源充电，经过远大于时间常数的时间后，电流趋向多少？为什么？\n2. \"通交流\"的时候，有电子穿过电容中间的绝缘层吗？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 理想 RC 电路充电很久后，电流趋向多少？为什么？**\n电流趋近于 0；具体过了一分钟是否足够，要看 τ 和初始条件。实际电容还存在漏电。\n\n**2. \"通交流\"的时候，有电子穿过电容中间的绝缘层吗？**\n没有。是两端的电荷被反复充放电、在导线里来回跑，外电路看像\"通了\"，电荷从未穿墙。\n\n<\/details>\n\n### 03.3 RC 三大应用：电容 + 电阻 = 三件兵器\n\n电容和电阻搭伙，能在板子上干三件大事，三件事随处可见。\n\n#### 03.3.1 去耦电容：芯片身边的\"随身水杯\"\n\n先说问题。芯片干活时会突然\"猛喝一口水\"——内部电路翻转的一瞬间，电流猛地跳一下。电源（水厂）离得远，中间的连接具有电阻与寄生电感，水压瞬间跟不上，芯片身边的电压就会\"抖\"一下——电压一抖，旁边的芯片也跟着抖，这就是干扰。\n\n解法：在芯片每个供电引脚旁边，就地放一颗小电容（通常 100nF），当**随身水杯**：\n- 芯片突然要水：水杯就地供水，电压不抖\n- 平时电压稳：水杯又悄悄从电源把自己补满\n\n这颗电容叫**去耦电容**（decoupling / bypass capacitor）。一种常见入门搭配如下，具体容值、数量和连接以器件指南及系统电源完整性要求为准：\n- **供电引脚附近常放 100nF 陶瓷电容**，但不同器件的要求可能不同\n- **每个电源区域：再加 1~10μF 的大电容**，稳住大幅度的慢波动\n- 不同容值可用于覆盖不同频段；还应看实际阻抗曲线、寄生参数与布线，不能仅凭容值判断\n\n去耦电容必须**紧贴**芯片的供电引脚（以后画板子时的布局铁律）。放远了，连接的走线本身就有电感，高频电流\"挤不过去\"，水杯形同虚设。\n\n#### 03.3.2 耦合电容：只放行\"变化\"，拦截\"不变\"\n\n把电容**串联**在两级电路之间的信号路径上：\n- 前级的直流成分：被墙挡住，过不去\n- 前级的交流信号（比如音乐）：顺利通过\n\n这颗电容叫**耦合电容**。音响的前级接后级、收音机的级间传递，全靠它。一句话分工（必背）：\n\n**并联在电源和地之间的，是滤波/去耦电容；串联在信号路径上的，是耦合电容。同一个元件，位置决定角色。**\n\n#### 03.3.3 上电复位延时：用 τ 当\"闹钟\"\n\n芯片上电时最好别急着启动——万一电源还没稳，它半路死机怎么办？让它\"等一下再开工\"，用的正是 RC 充电的慢劲儿：\n- 上电瞬间：电容从 0V 开始充电，复位引脚电压很低，芯片保持\"复位\"状态（原地不动）\n- 电压按 τ 的节奏慢慢爬，爬过芯片的启动阈值（比如 1.6V），芯片解除复位，开始干活\n- 是否在电源稳定后释放复位，必须结合电源上升过程和器件要求验证\n\n典型参数：R = 10kΩ、C = 10μF。算 τ（单位大坑又来了，一步不跳）：\n- 10kΩ = 10000Ω\n- 10μF = 10 × 0.000001 = 0.00001F\n- τ = 10000 × 0.00001 = **0.1 秒**\n\n0.1 秒只是时间常数，不代表电源必定稳定；必须比较实际电源上升时间、复位阈值和芯片手册。\n\n**这在板子上**：一些单片机板采用复位电容和按键，另一些使用内部上电复位或专用监控器；具体接法、按键放电电流和复位时序应按器件手册确定。\n\n**停下来检查**\n\n1. 去耦电容为什么必须紧贴芯片的供电引脚？\n2. 同一颗 100nF 电容，并联在电源和地之间是什么角色？串联在音频信号路径上是什么角色？\n3. 复位延时电路 R = 10kΩ、C = 100μF，τ = ? 芯片大约等多久启动？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 去耦电容为什么必须紧贴芯片的供电引脚？**\n放远了，电容到引脚之间的走线本身有电感，高频突发电流挤不过去，电容来不及供水，电压照样抖。近了才供得上。\n\n**2. 同一颗 100nF 电容，并联在电源和地之间是什么角色？串联在音频信号路径上是什么角色？**\n并联在电源上是去耦/滤波电容；串联在信号路径上是耦合电容。位置决定角色。\n\n**3. 复位延时电路 R = 10kΩ、C = 100μF，τ = ? 芯片大约等多久启动？**\nτ = 10000 × 0.0001 = 1 秒；延时取决于复位阈值。在电源瞬时阶跃至恒定 Vcc、电容初始为 0V 且阈值固定的理想 RC 模型中，t = −RC × ln(1 − Vth/Vcc)；阈值为 0.5Vcc 时约 0.69 秒。实际缓慢上电不能直接套用。\n\n<\/details>\n\n### 03.4 电感：电流的重型飞轮\n\n#### 03.4.1 电感长什么样，存的是什么\n\n电感（inductor）的结构同样朴素：**一根导线一圈一圈绕成的线圈**，常绕在磁芯上。电流流过线圈，线圈周围建立起**磁场**——能量被存进了磁场里。电感量 L 的单位是亨利（H），常用 μH、mH（电源滤波电感常见 1~10μH）。\n\n它的脾气，全在**重型飞轮**这个类比里：\n- 让静止的飞轮转起来：**费劲**。它反对\"从静止变成转动\"\n- 让转动的飞轮停下来：**也费劲**。它反对\"从转动变成静止\"\n- 飞轮越重（L 越大），这股\"反对劲儿\"越强\n\n电感对电流就是这个态度：**电流想变？先问过它。** 电流要增大，它往下压一压；电流要减小，它往上托一托。一句话——**电感反对电流变化。**\n\n电容和电感是一对镜像兄弟，放一张表里对照着记：\n\n| | 电容 | 电感 |\n|---|---|---|\n| 存什么 | 电荷（电场） | 磁场 |\n| 类比 | 海绵 / 水池（水位 = 电压） | 飞轮（转速 = 电流） |\n| 不能突变的是 | **电压** | **电流** |\n| 直流下 | 一堵墙（隔直） | 一根导线（通直） |\n| 高频下 | 越来越\"通\" | 越来越\"堵\" |\n\n\"通直流、阻交流\"在电感这里的意思：\n- 电流稳定不变（直流稳态）：飞轮匀速转，毫无意见，线圈就剩铜线那点电阻，约等于一根导线\n- 电流不停在变（交流）：飞轮被来回拨，它就来回反抗，表现出来就是阻力\n\n常见电感家族（认实物在第 04 课）：绕线电感（电源电路的大块头）、叠层电感（信号滤波的小个子）、磁珠（串在电源入口\"吸\"高频噪声的黑色小豆子）。\n\n**这在板子上**：电源入口有时串接电感或磁珠以抑制特定频段的干扰；直流路径仍有电阻和压降，实际高频效果由阻抗曲线、直流偏置、源与负载和布局共同决定。\n\n**停下来检查**\n\n1. 用飞轮类比说一句完整的话，概括电感的脾气。\n2. 稳定的直流电流流过电感，电感表现出多大的阻力？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 用飞轮类比说一句完整的话，概括电感的脾气。**\n电感像重型飞轮：转起来费劲、停下来也费劲——电流想变大它压一压，想变小它托一托，总之反对电流变化。\n\n**2. 稳定的直流电流流过电感，电感表现出多大的阻力？**\n几乎只剩线圈铜线的电阻，约等于一根普通导线。\n\n<\/details>\n\n#### 03.4.2 电流不能突变\n\n飞轮的转速不能瞬间跳变——从 0 转提到 1000 转需要时间，从 1000 转刹到 0 也需要时间。同理：**流过电感的电流不能突变，只能渐变。**\n\n和电容配成一对，全课最值钱的两句话：\n- **理想电容：有限电流下，电压不能瞬间突变**\n- **理想电感：有限电压下，电流不能瞬间突变**\n\n记住这对镜像，以后分析一切\"开关闭合 / 断开瞬间\"的电路都有了出发点：先看哪个量被强行要求突变，再推断会发生什么。\n\n#### 03.4.3 自感尖峰：为什么开关电感需要续流或钳位路径\n\n> 名词速览：**继电器**＝用电流控制的开关（里面的线圈就是电感）；**二极管**＝只许电流单向通过的\"阀门\"。\n\n> 🔬 **配套仿真**：[电感断开尖峰](#/sim/inductkick) · [加缓冲后的效果](#/sim/inductkick-snub)——先看断开瞬间电压毛刺冲多高，再看给它留了\"逃生通道\"之后有多平静\n\n电路：5V 电源、一个开关、一个继电器线圈（线圈就是电感）。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"174.03999999999996pt\" width=\"282.188pt\" viewBox=\"-43.588 -146.39999999999998 282.188 174.03999999999996\"><circle cx=\"0\" cy=\"-54\" r=\"18\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 0.0,-0.0 L 0,-36 L 0,-36 M 0,-72 L 0,-72 L 0,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000003,-45.0 L -3.6,-45\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.637200993467639e-15,-59.4 L 0,-66.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000004,-63.0 L -3.6,-63\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 6.613092715395707e-15,-108.0 L 36,-108 M 44.64,-111.6 L 64.8,-124.2 M 72,-108 L 108,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-108.0 L 144,-108 L 144.033,-109.463 L 144.134,-110.964 L 144.304,-112.472 L 144.542,-113.955 L 144.846,-115.382 L 145.214,-116.722 L 145.64,-117.947 L 146.12,-119.033 L 146.645,-119.954 L 147.208,-120.693 L 147.8,-121 **反向并联**在线圈两端：正常工作时电流方向和二极管相反，二极管关死，完全不碍事\n- 开关断开的瞬间：线圈感应出的高压恰好让二极管导通，电流顺着二极管绕线圈继续转圈，边转边把能量慢慢耗在线圈电阻上\n- 以图中的高边开关、线圈下端接地的例子：线圈两端反向电压约为二极管正向压降，开关的负载侧电压约为 −VF，开关两端约为 5V + VF，并会受二极管、寄生参数和瞬态影响。仍要核对开关器件耐压、二极管电流及释放时间\n\n**这在板子上**：驱动继电器、电磁蜂鸣器、马达、电磁阀等感性负载时，需要按电路拓扑提供适当续流或钳位路径；二极管是常见选择，其他拓扑可采用 TVS、RC 吸收或主动钳位。忘了加，驱动管早晚会\"莫名\"损坏，其实是被自感高压一枪毙命。第 10 课电源模块里的 Buck 降压电路，更是把\"开关 + 电感 + 续流回路\"这套动作玩成了主角。\n\n**停下来检查**\n\n1. 用飞轮解释：为什么电感的电流不能突变？\n2. 断开串着电感的开关，线圈两端会出现什么？能有多大？\n3. 续流二极管在开关闭合、电路正常工作时导通吗？它在哪个瞬间起作用？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 用飞轮解释：为什么电感的电流不能突变？**\n飞轮转速不能瞬间改变——要变只能渐变。电感把能量存在磁场里，电流突变等于磁场瞬间消失，能量无处安放，物理上不允许。\n\n**2. 断开串着电感的开关，线圈两端会出现什么？能有多大？**\n出现很高的自感电压尖峰（电感拼命维持电流的反抗），几十到几百伏甚至上千伏，足以击穿开关管或拉弧打火。\n\n**3. 续流二极管在开关闭合、电路正常工作时导通吗？它在哪个瞬间起作用？**\n不导通——正常电流方向与它相反，它关死。在开关断开后、线圈电流衰减期间，线圈反向电压使它导通，给电流留一条绕圈续命的路。\n\n<\/details>\n\n### 03.5 频率的魔法：电容越变越\"通\"，电感越变越\"堵\"\n\n#### 03.5.1 频率越高，电容越通\n\n直觉推理：电压翻转得慢，电容每次都来得及充满——充满后就是墙，电流断了；电压翻转得快，电容每次都\"来不及充满\"就被叫去反方向充——电荷永远在来回赶路，外电路里电流不断。\n\n理想电容的结论：**频率越高，容抗越小。** 它的阻力叫**容抗 Xc**，公式混个脸熟即可（**本课不要求计算**）：\n\n**Xc = 1 / (2πfC)** —— f 在分母里：f 越大，Xc 越小。公式和直觉一致。\n\n#### 03.5.2 频率越高，电感越堵\n\n直觉推理：飞轮最怕被快速来回拨动——拨得越快，反抗得越凶。电流变化越快（频率越高），电感表现出的阻力越大。\n\n理想电感的结论：**频率越高，感抗越大。** 这个阻力叫**感抗 XL**（同样只认脸，不要求算）：\n\n**XL = 2πfL** —— f 在分子上：f 越大，XL 越大。\n\n#### 03.5.3 一张表看懂两个元件的极端表现\n\n| 情形 | 电容 | 电感 |\n|---|---|---|\n| 直流（频率 = 0，充满后） | 一堵墙（电流为 0） | 一根导线（只剩铜线电阻） |\n| 低频 | 阻力大，基本不让过 | 阻力小，基本让过 |\n| 高频 | 阻力很小，近乎导线 | 阻力很大，近乎一堵墙 |\n\n一句话总纲（必背）：**频率越高，电容越通、电感越堵；频率越低，反过来。**\n\n上表仅适用于理想模型。真实电容有 ESR、寄生电感和自谐振；真实电感有绕组电阻、寄生电容和自谐振。高于自谐振频率后，实际阻抗可能不再遵循上述趋势，需查器件阻抗曲线与布局寄生。\n\n这张表可以帮助理解一些初步用途：\n- \"大电容配小电容\"：常见搭配可覆盖不同频段，但不能只凭容值判断高频效果；封装、ESL、自谐振、并联反谐振和布局同样重要，以芯片手册及阻抗曲线为依据\n- 电源入口串电感/磁珠：为直流提供通路，并在适合的频段抑制干扰；具体效果要核查\n- 音频耦合电容：直流被挡、声音（交流）放行\n\n#### 03.5.4 \"阻抗\"是个什么词\n- 电阻：对电流的阻力，固定值，对直流交流一视同仁\n- 电容、电感的阻力：随频率变来变去\n\n阻抗（impedance，Z）描述正弦稳态下电压与电流的幅值和相位关系；它既包含电阻，也可包含容抗或感抗，不是把几个阻值简单相加。走线标称 50Ω 通常指其**特性阻抗**，与末端接入的负载阻抗不是同一个概念；传输线与端接在第 19 课继续学习。\n\n最后一个预告（现在只记结论，不展开）：频率非常高时（几十上百 MHz），不只是元件有脾气——**PCB 上每一寸铜走线**，自己有一点点电阻、一点点电感，和旁边导体之间还有一点点电容。低频时它们小到可以无视；高频时它们开始当家做主。行话叫：**\"高频下，走线不再是导线。\"**\n\n**这在板子上**：高速板上的时钟线、USB 差分线，从来不是\"随便连一根线就算\"，要控制阻抗、计算长度、讲究参考层——那是第 19 课\"信号完整性\"的正题，种子在这一课就种下了。\n\n**停下来检查**\n\n1. 同一个电容，信号频率从 1kHz 提到 1MHz，它的容抗变大还是变小？\n2. 同一个电感，信号频率升高，感抗变大还是变小？\n3. \"高频下走线不再是导线\"是什么意思？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 同一个电容，信号频率从 1kHz 提到 1MHz，它的容抗变大还是变小？**\n变小。频率越高电容越通（Xc = 1/(2πfC)，f 在分母）。\n\n**2. 同一个电感，信号频率升高，感抗变大还是变小？**\n变大。频率越高电感越堵（XL = 2πfL，f 在分子）。\n\n**3. \"高频下走线不再是导线\"是什么意思？**\n频率很高时，走线自身的电阻、电感和它与邻近导体之间的电容都不再能忽略，走线变成布满 R、L、C 的\"元件\"，必须按阻抗对待——这是第 19 课信号完整性的起点。\n\n<\/details>\n\n### 03.6 交流电：会荡秋千的电压\n\n#### 03.6.1 直流 vs 交流\n- **直流（DC）**：电流方向不随时间反向；大小可以恒定，也可以变化。电池、USB 的 5V，前两课玩的全是它\n- **交流（AC）**：大小和方向随时间来回变化，最基本的是**正弦波**。插座里的市电就是交流\n\n#### 03.6.2 正弦波：电压的\"秋千\"\n\n秋千怎么荡？从最高点出发 → 越荡越快 → 最低点时最快 → 靠惯性冲上另一侧最高点 → 再荡回来，周而复始。正弦波一模一样的脾气：从 0 上升，先快后慢冲到最高点，再加速回落，穿过 0，冲到最低点，再回来。荡完一遍，叫**一个周期**。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 240\" width=\"540\" height=\"240\" role=\"img\"><line class=\"wv-axis\" stroke=\"currentColor\" x1=\"55\" y1=\"105\" x2=\"450\" y2=\"105\"/><text x=\"49\" y=\"109\" text-anchor=\"end\" font-size=\"10\" class=\"wv-lab\">0<\/text><polyline class=\"wv-curve\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" points=\"80.0,105.0 81.8,102.6 83.6,100.2 85.4,97.8 87.2,95.4 89.0,93.0 90.8,90.7 92.6,88.3 94.4,86.0 96.2,83.7 98.0,81.5 99.8,79.2 101.6,77.0 103.4,74.8 105.2,72.7 107.0,70.6 108.8,68.6 110.6,66.6 112.4,64.6 114.2,62.7 116.0,60.8 117.8,59.0 119.6,57.3 121.4,55.6 123.2,54.0 125.0,52.4 126.8,50.9 128.6,49.5 130.4,48.2 132.2,46.9 134.0,45.7 135.8,44.5 137.6,43.5 139.4,42.5 141.2,41.6 143.0,40.8 144.8,40.0 146.6,39.3 148.4,38.8 150.2,38.3 152.0,37.8 153.8,37.5 155.6,37.3 157.4,37.1 159.2,37.0 161.0,37.0 162.8,37.1 164.6,37.3 166.4,37.5 168.2,37.9 170.0,38.3 171.8,38.8 173.6,39.4 175.4,40.1 177.2,40.8 179.0,41.7 180.8,42.6 182.6,43.6 184.4,44.7 186.2,45.8 188.0,47.0 189.8,48.3 191.6
