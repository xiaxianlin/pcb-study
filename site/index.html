.4 ERC 三类错误对照\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 9-6：ERC 三类常见错误<\/text>\n  <rect x=\"30\" y=\"60\" width=\"200\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"45\" y=\"85\" font-size=\"13\" fill=\"currentColor\">① 悬空管脚<\/text>\n  <text x=\"45\" y=\"108\" font-size=\"11\" fill=\"currentColor\">管脚没有网络<\/text>\n  <text x=\"45\" y=\"126\" font-size=\"11\" fill=\"currentColor\">处理：接网络或标 NC<\/text>\n  <rect x=\"260\" y=\"60\" width=\"200\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"85\" font-size=\"13\" fill=\"currentColor\">② 输出冲突<\/text>\n  <text x=\"275\" y=\"108\" font-size=\"11\" fill=\"currentColor\">两个输出直接并联<\/text>\n  <text x=\"275\" y=\"126\" font-size=\"11\" fill=\"currentColor\">处理：串电阻/二极管<\/text>\n  <rect x=\"490\" y=\"60\" width=\"200\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"85\" font-size=\"13\" fill=\"currentColor\">③ 电源/地短路<\/text>\n  <text x=\"505\" y=\"108\" font-size=\"11\" fill=\"currentColor\">+5V 与 GND 同名/误连<\/text>\n  <text x=\"505\" y=\"126\" font-size=\"11\" fill=\"currentColor\">处理：改网络名/查电源脚<\/text>\n  <text x=\"30\" y=\"200\" font-size=\"13\" fill=\"currentColor\">ERC 只查“电气自洽”，不查封装、极性、器件选型。<\/text>\n  <text x=\"30\" y=\"225\" font-size=\"13\" fill=\"currentColor\">ERC 通过后，仍要人工核对：封装、极性、电源管脚、NC 是否合理。<\/text>\n<\/svg>\n```\n\n| 错误 | 典型原因 | 处理 |\n|---|---|---|\n| 悬空管脚 | 忘了连线/管脚隐藏 | 接网络、上拉/下拉、或标 NC |\n| 输出冲突 | 两个 LDO/两个 IO 输出并联 | 加隔离电阻/二极管/换开漏 |\n| 电源短路 | 网络名相同、电源脚误连 | 改网络名、逐个查电源脚 |\n| 单端网络 | 连接器只连了一端 | 补线或删除多余管脚 |\n\n#### 9.6.5 动手任务：一张图走完整个数据链\n\n任务目标：在一块 A4 原理图里放“12V 分压 + 按键 + RC 低通”三个小电路，导出网表并留下检查记录。\n\n步骤：\n\n1. 新建工程 `eda_lab_v1_20261110`，图框写项目名、日期、姓名缩写。\n2. 放三个功能块：`VBAT_SENSE`、`KEY_IN`、`ADC_FILTER`，块之间留 10mm 以上空白。\n3. 给每个电阻/电容挂封装：R 用 0805，C 用 0603；连接器用 2.54mm 排针。\n4. 给关键网络命名：`PWR_12V`、`VBAT_SENSE`、`GPIO_KEY`、`ADC_IN`。\n5. 运行 ERC，记录每一条错误/警告，逐条写“原因 + 处理”。\n6. 导出网表，搜 `R1`、`C1`、`J1`，确认管脚号与网络名。\n7. 故意制造一个错误：把 `PWR_12V` 与 `GND` 短接，再跑 ERC，截图。\n8. 修复后导出 PDF，和网表、工程文件放同一目录，命名带版本与日期。\n\n验收标准：\n\n- [ ] ERC 零错误；每条警告都有原因说明。\n- [ ] 网表里三个关键网络都能搜到，管脚归属正确。\n- [ ] 三个功能块的网络名不重复、不冲突。\n- [ ] PDF 图框有项目名/版本/日期。\n- [ ] 目录里能一眼看出“工程、网表、PDF”是同一版。\n\n### 9.7 常见坑\n\n| 坑 | 现象 | 根因 | 正确做法 |\n|---|---|---|---|\n| 符号/封装管脚号不一致 | 导入 PCB 报 Unknown Pin | 符号按 1/2/3，封装按 2/1/3 | 建库时逐脚对照手册 |\n| 默认网络名 | PCB 里找不到 `Net37` | 没有命名习惯 | 关键网络统一前缀命名 |\n| 隐藏电源管脚 | ERC 不报，板子没电 | 符号把 VDD/GND 隐藏 | 显式画出电源脚或确认库定义 |\n| 输出直接并联 | 轻则倒灌，重则烧 | 以为“并联加大电流” | 加隔离/均流/换方案 |\n| No Connect 乱用 | ERC 通过但功能没有 | 把该接的脚标 NC | NC 只用于“确实不接”的脚 |\n| 图框不写版本 | 三版图混一起，投错版 | 文件名随手起 | `项目_功能_v1_日期` |\n| 库封装不核对 | QFN 偏移 0.2mm | 直接调用库，不看手册 | 按手册推荐焊盘复核 |\n| 原理图当草稿 | 网表和 PCB 对不上 | 边画边改网络名 | 每完成一块立即定名/复查 |\n| 只跑 ERC 不看封装 | 板子焊不上 | 把 ERC 当万能检查 | ERC+封装+极性+网表四查 |\n| 多张图网络重名 | 电源/地跨页冲突 | 分页后没统一命名 | 全局网络表/电源符号统一 |\n| 连接器定义反了 | 插上就反/不通 | 公母/正反没对照 | 按实物/手册画 pin1 标记 |\n| 忘记测试点 | 上电没法测 | 原理图没留测试点 | 关键电源/信号留测试点 |\n\n\n\n### 9.8 本章复盘\n\n#### 9.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| `fc = 1/(2πRC)` | RC 低通截止频率 | R 单位 Ω，C 单位 F |\n| `Vout = Vin × R2/(R1+R2)` | 分压 | 输出端几乎不取电流 |\n| 符号管脚号 = 封装焊盘号 | 网表绑定 | 必须逐个核对 |\n| ERC 通过 ≠ 板子正确 | 电气规则检查 | 封装/极性/网络仍要人工核对 |\n| 网络名统一前缀 | 可读性 | 禁止 `Net1` 满天飞 |\n\n#### 9.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| EDA | Electronic Design Automation | 电子设计自动化工具 |\n| 符号 | symbol | 原理图上的器件图形 |\n| 封装 | footprint | PCB 上的焊盘图形 |\n| 网络 | net | 同一根导线连接的所有管脚 |\n| 网表 | netlist | 元件—管脚—网络清单 |\n| ERC | electrical rules check | 电气规则检查 |\n| 网表导入 | netlist import | 把原理图连接同步到 PCB |\n\n#### 9.8.3 自测 10 题\n\n1. 符号和封装分别决定什么？\n2. 网表里 `R1-1` 代表什么？\n3. ERC 报“悬空管脚”怎么处理？\n4. 为什么不能把两个输出直接并联？\n5. 默认网络名有什么问题？\n6. 原理图版本怎么命名？\n7. 立创 EDA 和 KiCad 各自适合什么场景？\n8. 隐藏电源管脚为什么危险？\n9. No Connect 什么情况下可以用？\n10. 投板前要归档哪些文件？\n\n**自测参考答案（先自己做，再对照）：**\n\n1. 符号决定电气功能与管脚号；封装决定焊盘尺寸、间距和极性。\n2. `R1-1` 是位号 R1 的第 1 号管脚；在网表里它属于某个网络。\n3. 先判断该脚是否确实不用：不用则标 NC，要用则接网络/上拉/下拉。\n4. 两个输出并联会互相倒灌，轻则电压拉偏，重则烧器件；需要隔离或均流。\n5. 默认网络名不可读、不可搜，改一处不知道影响哪页，PCB 里也无法定位。\n6. `项目_功能_版本_日期`，投板前打 tag，Gerber 与工程同版本归档。\n7. 立创 EDA 适合零基础快速打样；KiCad 适合免费、长期、跨平台项目。\n8. 隐藏电源脚会让 ERC 看不到供电连接，板子可能根本没电。\n9. 只在“该脚确实不接”时用，并写原因；不能用来掩盖漏连。\n10. 工程文件、PDF 原理图、网表、BOM、Gerber、钻孔、坐标、版本说明。\n\n#### 9.8.4 能力清单\n\n- [ ] 能新建工程并设置图框、网格、规则。\n- [ ] 能画 RC 低通、分压、按键三个原理图。\n- [ ] 能给元件挂封装并导出网表。\n- [ ] 能用 ERC 定位三类错误。\n- [ ] 能按版本规范归档工程。\n\n#### 9.8.5 下一章\n\n下一章讲**焊接与返修基础**：原理图画完、板子打样回来，第一件事是把它焊出来。你会看到工具、温度、焊锡、助焊剂，以及虚焊、连锡、冷焊怎么识别。\n\n用别人的库，也要用自己的眼睛再核对一遍。核对完再投板，别把别人的错误焊到自己的板上。","taskSignature":"8e68e99471c22cdf929488bd6de0b1148a8676832ac54222eb57cde8508d1666","taskCount":10},{"id":"10","title":"第 10 章 · 焊接与返修基础","short":"焊接与返修基础","stage":2,"diff":2,"prev":"第 09 章 EDA 与原理图入门","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 认识烙铁、热风枪、焊锡、助焊剂、吸锡带、镊子等基础工具，并知道各自用途。\n2. 解释“热、锡、助焊剂、时间”四个变量，理解为什么温度不是越高越好。\n3. 独立焊接通孔元件和 0805/0603 贴片元件，焊点光亮、无连锡。\n4. 识别虚焊、冷焊、连锡、 tombstone、焊盘脱落五类常见缺陷。\n5. 用热风枪拆焊 SOP/QFN，知道什么时候该用烙铁、什么时候该用热风。\n6. 用万用表通断档和目视/放大镜做焊后检查。\n7. 说出至少 8 个焊接新手坑，并知道安全边界。\n\n焊接是硬件工程师的“ handwriting”。你可以不会画多层板，但不能不会焊。焊不好，原理图再对，板子也会时好时坏。\n\n## 正文\n\n### 10.1 它解决什么问题：三个真实场景\n\n#### 场景一：板子时好时坏，原来是虚焊\n\n一块 LED 板，上电有时亮有时不亮。万用表测电压正常，轻压一下电阻又亮了。拆下来发现电阻一端只有锡堆，没有真正润湿焊盘——这就是虚焊。虚焊的接触电阻随温度/应力变化，万用表静态测不出来，产品到了客户手里才出问题。\n\n#### 场景二：贴片电容“立碑”，一端翘起\n\n回流焊时，0805 电容一端先熔化，另一端被表面张力拉起，像墓碑一样立起来。原因可能是焊盘不对称、锡量不均、升温太快。手工焊也会出现一端吃锡、一端没吃锡的“立碑”。\n\n#### 场景三：拆一个 QFN，把焊盘全带掉了\n\n没有热风枪，用烙铁硬撬 QFN，焊盘铜箔被拉掉，板子报废。拆焊不是“用力”，是“让锡同时熔化”。工具、温度、助焊剂、加热方式，缺一不可。\n\n### 10.2 它是什么：焊接是“润湿”，不是“堆锡”\n\n焊接的本质是：**熔化的焊锡在助焊剂帮助下，润湿两个金属表面，冷却后形成金属间化合物连接**。\n\n四个变量：\n\n- **热**：烙铁/热风把焊盘和引脚同时加热到焊锡熔点以上。\n- **锡**：填充间隙，形成连接。\n- **助焊剂**：清除氧化层，帮助润湿；受热后失效。\n- **时间**：太短不润湿，太长氧化/烫坏器件。\n\n> **术语第一次出现**：润湿（wetting）指焊锡在金属表面铺开、形成薄而连续的合金层。焊点表面光亮、呈凹月面，说明润湿好；锡堆成球、表面粗糙，说明润湿差。\n\n常见焊锡：\n\n| 类型 | 熔点 | 特点 | 适用 |\n|---|---:|---|---|\n| Sn63/Pb37 有铅 | 183℃ | 好焊、光亮 | 练习、维修（注意环保/健康） |\n| SAC305 无铅 | 217～220℃ | 环保、熔点高 | 产品、出口 |\n| 低温锡 | 138℃ | 易焊、强度低 | 返修/热敏器件，不作为主焊料 |\n\n#### 10.2.1 润湿的四个阶段\n\n焊接不是“锡化了就行”，而是四个阶段：\n\n1. **预热**：烙铁把焊盘、引脚同时升到接近熔点，助焊剂开始活化。\n2. **润湿**：焊锡在助焊剂作用下铺开，排出氧化层和空气。\n3. **扩散**：锡与铜/镍表面形成薄薄的金属间化合物（IMC），这是真正的连接。\n4. **冷却**：焊锡凝固，焊点成型；冷却太快会应力大，太慢会晶粒粗大。\n\n润湿好坏看“润湿角”：\n\n| 润湿角 | 外观 | 判断 |\n|---|---|---|\n| <30° | 薄而连续、凹月面、光亮 | 良好 |\n| 30～60° | 锡堆起、边缘圆 | 一般，可能热量不足 |\n| >90° | 锡成球、不铺展 | 未润湿，虚焊 |\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 10-1：润湿角：良好 / 一般 / 未润湿<\/text>\n  <line x1=\"40\" y1=\"160\" x2=\"250\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M60 160 Q110 120 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"70\" y=\"195\" font-size=\"13\" fill=\"currentColor\">良好：凹月面<\/text>\n  <line x1=\"270\" y1=\"160\" x2=\"480\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M300 160 Q340 115 380 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"300\" y=\"195\" font-size=\"13\" fill=\"currentColor\">一般：锡堆起<\/text>\n  <line x1=\"500\" y1=\"160\" x2=\"700\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <circle cx=\"570\" cy=\"135\" r=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"520\" y=\"195\" font-size=\"13\" fill=\"currentColor\">未润湿：成球<\/text>\n  <text x=\"40\" y=\"250\" font-size=\"12\" fill=\"currentColor\">润湿角越小，接触面积越大，机械/电气连接越好。<\/text>\n<\/svg>\n```\n\n> **术语第一次出现**：IMC（intermetallic compound，金属间化合物）是焊锡与焊盘金属在界面生成的合金层。它太薄则连接不牢，太厚则脆；回流时间过长会让 IMC 过厚。\n\n#### 10.2.2 四个变量互相制约\n\n焊接质量不是“某个参数对了”就行，而是热、锡、助焊剂、时间四者配合：\n\n| 变量 | 不足 | 过量 | 怎么判断“够” |\n|---|---|---|---|\n| 热 | 不润湿、虚焊 | 氧化、焊盘翘、器件坏 | 锡铺开、凹月面、2～3 秒内完成 |\n| 锡 | 连接不牢、空隙 | 锡球、掩盖虚焊、连锡 | 覆盖焊盘、引脚轮廓可见 |\n| 助焊剂 | 润湿差、锡成球 | 残留、飞溅、腐蚀 | 少量活化、焊后按需清理 |\n| 时间 | 冷焊、IMC 不足 | IMC 过厚、氧化 | 焊点成型即撤，不反复烫 |\n\n一个常见误区是“温度不够就多烫一会儿”。实际上，温度不足时延长加热会让助焊剂先失效，锡越烫越不润湿；正确做法是**提高热输入能力**（换大头/预热/补锡），而不是单纯延长时间。\n\n#### 10.2.3 有铅、无铅与低温锡怎么选\n\n| 焊料 | 熔点 | 强度 | 润湿 | 适用 | 不适用 |\n|---|---:|---|---|---|---|\n| Sn63/Pb37 | 183℃ | 中 | 好 | 练习/维修 | 出口产品（RoHS） |\n| SAC305 | 217～220℃ | 中高 | 一般 | 产品/出口 | 热敏器件/低温场景 |\n| SnBi 低温 | 138℃ | 低 | 好 | 返修/热敏 | 振动/受力/高温 |\n\n注意：\n\n- 有铅/无铅不要混用；混用熔点不确定，焊点脆。\n- 无铅烙铁头寿命短，温度高氧化快，要勤清洁/换头。\n- 低温锡不是“万能返修锡”；BGA/大焊盘用低温锡，机械强度可能不够。\n\n### 10.3 关键参数与工具选择\n\n| 参数/工具 | 推荐值 | 说明 |\n|---|---|---|\n| 烙铁温度 | 有铅 300～330℃，无铅 330～360℃ | 大焊盘/散热快取上限 |\n| 烙铁功率 | 60～80W 恒温 | 功率太小，补热慢，焊点发灰 |\n| 烙铁头 | 刀头/尖头/马蹄头各一 | 刀头适合多脚拖焊，尖头适合细线 |\n| 焊锡丝 | 0.6～0.8mm，含助焊剂 | 太粗不好控量 |\n| 助焊剂 | 松香/免洗 | 不要用酸性焊膏 |\n| 热风枪 | 300～380℃，风量中低 | 拆 QFN/BGA 用 |\n| 吸锡带 | 宽 1.5～2.5mm | 拆通孔/清理焊盘 |\n| 放大镜/显微镜 | 5～20 倍 | 检查虚焊/连锡 |\n\n读工具参数的三个条件：\n\n1. **温度是烙铁头温度，不是焊点温度**：大焊盘/多层板散热快，实际焊点温度低 20～50℃。\n2. **有铅/无铅不同**：无铅熔点高，温度不够会“豆腐渣”焊点。\n3. **风量不是越大越好**：风大吹飞小元件，也容易把周边塑料件烤变形。\n\n#### 10.3.1 工具不是越贵越好，是“热够、手稳、看得见”\n\n| 工具 | 关键指标 | 常见误区 | 怎么选 |\n|---|---|---|---|\n| 恒温烙铁 | 60～80W、回温快 | 只看功率不看头 | 选带温控、头可换的 |\n| 烙铁头 | 刀头/尖头/马蹄头 | 一个头焊所有 | 至少三支，按焊盘选 |\n| 热风枪 | 温度可调、风量可调 | 风量开最大 | 选带数显、风量中低 |\n| 焊锡丝 | 0.6～0.8mm、含助焊剂 | 越粗越好 | 细焊盘用 0.6，通孔用 0.8 |\n| 助焊剂 | 免洗/松香 | 酸性焊膏 | 少量、及时清理 |\n| 吸锡带 | 1.5～2.5mm | 用脏了还继续 | 一次性或及时换 |\n| 放大镜 | 5～20 倍 | 只靠肉眼 | 有灯、视野大 |\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 10-2：三种常用烙铁头与适用场景<\/text>\n  <path d=\"M60 110 L160 110 L180 95 L180 125 L160 110\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"160\" font-size=\"12\" fill=\"currentColor\">尖头：细线/密脚<\/text>\n  <path d=\"M260 110 L350 110 L370 85 L390 135 L370 110\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"260\" y=\"160\" font-size=\"12\" fill=\"currentColor\">刀头：拖焊/多脚<\/text>\n  <path d=\"M470 110 L560 110 Q590 110 590 135 Q590 160 560 160 L470 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"470\" y=\"190\" font-size=\"12\" fill=\"currentColor\">马蹄头：大焊盘/补热<\/text>\n  <text x=\"40\" y=\"240\" font-size=\"12\" fill=\"currentColor\">选头原则：接触面积够大、能同时碰到焊盘和引脚，但不碰到隔壁。<\/text>\n<\/svg>\n```\n\n#### 10.3.2 温度到底准不准\n\n烙铁数显 350℃，焊点不一定 350℃。三个原因：\n\n1. **头温≠焊点温度**：头离开焊台会掉温；大焊盘一碰就掉 30～50℃。\n2. **传感器位置**：便宜烙铁测的是发热芯，不是头尖。\n3. **校准**：用烙铁温度计/热电偶测头尖，偏差超过 ±20℃ 要校。\n\n自己校准的笨办法：用 0.8mm 焊锡丝碰头尖，看几秒熔化。Sn63 在 183℃ 熔，SAC305 在 217℃ 熔；如果 300℃ 还熔得慢，实际温度可能不够。\n\n#### 10.3.3 静电防护：看不见的杀手\n\nMOS 管、MCU、USB 接口芯片对静电敏感。冬天脱毛衣的静电可达几千伏，人体感觉不到，芯片已经损伤。\n\n三条基本措施：\n\n1. **戴防静电手环**，可靠接地；没有手环时，先摸一下接地金属放电。\n2. **工作台铺防静电台垫**，烙铁/热风枪接地。\n3. **器件用防静电袋/盒**，不要用普通塑料袋；拆下的芯片放回防静电盒。\n\n静电损伤常常“当时能用，几天后失效”，比直接烧坏更难查。养成习惯比买贵设备重要。\n\n### 10.4 三个典型焊接场景\n\n#### 10.4.1 通孔元件：电阻、排针、连接器\n\n步骤：\n\n1. 元件插入，引脚露出焊盘 1～2mm。\n2. 烙铁同时接触焊盘和引脚，预热 1～2 秒。\n3. 焊锡丝送到焊盘/引脚交界，熔化适量锡。\n4. 先撤锡丝，再撤烙铁，焊点自然形成凹月面。\n5. 剪脚，保留 0.5～1mm。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 10-3：通孔焊接四步<\/text>\n  <rect x=\"30\" y=\"60\" width=\"140\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"45\" y=\"85\" font-size=\"14\" fill=\"currentColor\">① 插入<\/text>\n  <line x1=\"70\" y1=\"100\" x2=\"70\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <rect x=\"55\" y=\"95\" width=\"30\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"70\" cy=\"145\" r=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"190\" y=\"60\" width=\"140\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"85\" font-size=\"14\" fill=\"currentColor\">② 预热<\/text>\n  <line x1=\"230\" y1=\"100\" x2=\"230\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <line x1=\"245\" y1=\"135\" x2=\"260\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"4\"/>\n  <text x=\"250\" y=\"155\" font-size=\"12\" fill=\"currentColor\">烙铁<\/text>\n  <rect x=\"350\" y=\"60\" width=\"140\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"365\" y=\"85\" font-size=\"14\" fill=\"currentColor\">③ 送锡<\/text>\n  <line x1=\"390\" y1=\"100\" x2=\"390\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <line x1=\"400\" y1=\"125\" x2=\"420\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"410\" y=\"155\" font-size=\"12\" fill=\"currentColor\">焊锡丝<\/text>\n  <rect x=\"510\" y=\"60\" width=\"160\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"525\" y=\"85\" font-size=\"14\" fill=\"currentColor\">④ 成型<\/text>\n  <line x1=\"550\" y1=\"100\" x2=\"550\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <path d=\"M535 145 Q550 130 565 145\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"530\" y=\"170\" font-size=\"12\" fill=\"currentColor\">凹月面、光亮<\/text>\n<\/svg>\n```\n\n#### 10.4.2 贴片元件：0805/0603 电阻、电容\n\n步骤：\n\n1. 焊盘上先点少量锡（一端）。\n2. 镊子夹元件，先焊一端固定。\n3. 检查位置，再焊另一端。\n4. 两端焊点应大小相近，元件不歪。\n\n常见错误：\n- 先堆一大坨锡，元件浮起；\n- 两端锡量差太多，立碑；\n- 烙铁停留太久，焊盘翘起。\n\n#### 10.4.3 SOP/QFN：拖焊与热风\n\nSOP/QFP 多脚芯片：\n\n1. 对齐 1 脚，先焊对角两个脚固定。\n2. 加助焊剂，刀头带锡拖过引脚。\n3. 吸锡带清理连锡。\n4. 放大镜检查虚焊。\n\nQFN：\n\n1. 焊盘涂薄锡/焊膏。\n2. 热风枪均匀加热，芯片自动对位。\n3. 轻推芯片，能回弹说明锡全熔。\n4. 冷却后检查侧面爬锡和底部散热焊盘。\n\n#### 10.4.4 大焊盘、散热焊盘与连接器\n\n大焊盘/散热焊盘最容易“看着化了，其实没连”。原因：铜面积大，烙铁的热被迅速导走。处理顺序：\n\n1. **预热整板**：用预热台/热风把板子到 80～120℃，减小温差。\n2. **加大烙铁头**：马蹄头/刀头，接触面积大。\n3. **提高温度**：比小焊点高 20～30℃，但不要超过 380℃。\n4. **先给焊盘补锡**：形成热桥，再把器件引脚压上去。\n5. **停留足够但不过长**：看到锡完全铺开、器件能回弹再撤。\n\n连接器（USB、排针、端子）注意：\n\n- 先固定机械脚，再焊信号脚；否则插拔时焊盘受力。\n- 排针焊完再剪脚，剪脚后补焊，避免虚焊。\n- 大电流端子要加锡、加粗走线，焊点不是“导电主力”。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 10-4：散热焊盘的热桥与热风返修<\/text>\n  <rect x=\"60\" y=\"80\" width=\"200\" height=\"120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"80\" y=\"105\" font-size=\"13\" fill=\"currentColor\">大铜面/散热焊盘<\/text>\n  <rect x=\"110\" y=\"130\" width=\"60\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"118\" y=\"155\" font-size=\"10\" fill=\"currentColor\">器件<\/text>\n  <line x1=\"170\" y1=\"150\" x2=\"220\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"225\" y=\"155\" font-size=\"11\" fill=\"currentColor\">补锡热桥<\/text>\n  <path d=\"M330 180 Q360 120 390 180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"330\" y=\"205\" font-size=\"12\" fill=\"currentColor\">热风环绕<\/text>\n  <rect x=\"430\" y=\"110\" width=\"180\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"450\" y=\"140\" font-size=\"12\" fill=\"currentColor\">预热台 80～120℃<\/text>\n  <text x=\"450\" y=\"165\" font-size=\"11\" fill=\"currentColor\">减小整板温差<\/text>\n  <text x=\"40\" y=\"250\" font-size=\"12\" fill=\"currentColor\">大焊盘先预热、再补锡、再加热；不要只靠烙铁头硬顶。<\/text>\n<\/svg>\n```\n\n#### 10.4.5 拆焊与返修：先保焊盘，再保器件\n\n拆焊的目标不是“把器件弄下来”，是“焊盘完好、器件可再用”。顺序：\n\n1. **断电/放电**，确认没有残余电压。\n2. **加助焊剂**，让旧锡重新活化。\n3. **补锡**：旧焊点锡少/氧化时，先补一点新锡，热传导更好。\n4. **加热**：热风环绕，不要只吹一个脚；QFN/BGA 要预热。\n5. **轻推/轻夹**：锡全熔后器件会“浮起”，轻推能回弹再取。\n6. **清焊盘**：吸锡带+助焊剂，把残锡吸平；不要用烙铁硬刮。\n7. **检查**：焊盘是否翘起、阻焊是否脱落、邻近器件是否被吹移位。\n\n返修红线：\n\n- 不撬、不砸、不硬拉；焊盘翘起比器件损坏更贵。\n- 热风温度不超过器件手册的回流峰值；塑料连接器要遮挡。\n- 拆下来的器件如果要复用，先测引脚/极性，再决定是否上板。\n\n#### 10.4.6 一张焊接工艺卡\n\n把参数写成卡，比记在脑子里可靠。下面是一张练习用工艺卡，实际生产以板厂/器件手册为准。\n\n| 场景 | 烙铁温度 | 烙铁头 | 焊锡丝 | 助焊剂 | 单点时间 |\n|---|---:|---|---|---|---|\n| 通孔电阻/排针 | 320℃ | 刀头/马蹄 | 0.8mm | 松香 | 2～3s |\n| 0805/0603 | 310℃ | 尖头 | 0.6mm | 免洗 | 1～2s |\n| SOP-8 密脚 | 330℃ | 刀头 | 0.6mm | 免洗 | 拖焊 2～3s |\n| QFN 散热焊盘 | 350℃+预热 | 热风 | 锡膏 | 免洗 | 20～40s |\n| USB/排针连接器 | 330℃ | 马蹄 | 0.8mm | 松香 | 2～4s |\n| 大铜面/接地 | 350℃+预热 | 马蹄 | 1.0mm | 松香 | 3～5s |\n\n工艺卡还要写“三不焊”：\n\n- 焊盘氧化/污染不焊：先清洁，否则锡只成球。\n- 器件受潮不焊：潮敏器件（MSL）要烘烤，否则回流会“爆米花”。\n- 板子没固定不焊：一手拿板一手拿烙铁，焊点必抖。\n\n#### 10.4.7 五个递进练习\n\n练习不是“焊一个算一个”，每个练习只练一个变量：\n\n| 练习 | 目标 | 成功标准 | 常见失败 |\n|---|---|---|---|\n| 1. 通孔电阻 10 个 | 练“同时加热焊盘+引脚” | 10 个凹月面、无虚焊 | 只烫引脚，焊盘不润湿 |\n| 2. 0805 电阻 10 个 | 练“先固定一端再焊另一端” | 不歪、不立碑、锡量一致 | 一端堆锡太多 |\n| 3. SOP-8 拖焊 | 练“助焊剂+刀头+吸锡带” | 脚间无连锡、无虚焊 | 拖太快，锡没铺开 |\n| 4. QFN 热风 | 练“预热+环绕风+回弹” | 侧面爬锡、底部无空洞 | 风太大吹飞/只吹一面 |\n| 5. 拆焊+清焊盘 | 练“保焊盘” | 焊盘平整、无翘起 | 硬撬、吸锡带太脏 |\n\n每个练习拍“前/后/放大”三张照片，写一句“这次改了哪个参数”。五次之后，你会有一张自己的参数表，而不是背别人的数字。\n\n#### 10.4.8 通孔返修与 BGA 的边界\n\n通孔器件拆焊：\n\n- 单脚：补锡→加热→吸锡→轻拔。\n- 多脚排针：热风+吸锡带，或专用吸锡枪；不要一脚一脚硬拔，容易翘焊盘。\n- 连接器：先拆机械脚，再拆信号脚；塑料件怕热，要遮挡。\n\nBGA 不在本章要求“会做”，但要知道边界：\n\n- 需要预热台/返修台、BGA 植球、X 光/内窥检查。\n- 家用热风枪“吹下来”通常焊盘/芯片都受损，不建议练。\n- 返修后要做跌落/热循环/功能测试，不能只看“能开机”。\n\n#### 10.4.9 焊点在真实环境里怕什么\n\n| 环境因素 | 对焊点的影响 | 设计/工艺对策 |\n|---|---|---|\n| 振动 | 裂纹从焊点边缘起 | 加支撑/胶固/柔性连接 |\n| 热循环 | IMC 长大、热膨胀失配 | 控制回流时间、避免大铜面直连 |\n| 潮湿 | 助焊剂残渣吸潮、漏电 | 清洗/三防漆 |\n| 盐雾 | 腐蚀、爬电 | 三防漆/密封/材料选择 |\n| 电流 | 接触电阻发热、热失效 | 足够锡量/铜箔/散热 |\n| 机械插拔 | 连接器焊盘受力 | 机械脚固定/加强焊盘 |\n\n焊点不是“焊亮就行”，是要在振动、温度、湿度下活几年。练习板可以只看外观，产品板必须想环境。\n\n#### 10.4.10 先焊什么、后焊什么\n\n推荐顺序：\n\n1. 最矮/最耐热的先焊：电阻、电容、二极管。\n2. 再焊 IC/密脚器件：SOP/QFN。\n3. 再焊高的/怕热的：连接器、电解电容、蜂鸣器。\n4. 最后焊机械件/易损件：排针、端子、显示屏。\n\n原因：矮件先焊，板子能平放；怕热件后焊，避免反复受热；机械件最后焊，避免插拔/摆放时碰坏。\n\n返修顺序相反：先拆高的/挡路的，再拆目标器件。\n\n### 10.5 选型与降额：工具与耗材\n\n| 场景 | 推荐工具 | 不要用 |\n|---|---|---|\n| 通孔/排针 | 60～80W 恒温烙铁、刀头 | 20W 小烙铁，补热慢 |\n| 0805/0603 | 尖头/刀头、0.6mm 焊锡 | 大烙铁头，容易连锡 |\n| SOP/QFN | 热风枪 + 助焊剂 + 吸锡带 | 烙铁硬撬 |\n| BGA | 返修台/预热台 | 家用热风枪乱吹 |\n| 维修 | 防静电手环、放大镜 | 带电焊接 |\n\n安全边界：\n\n- 焊接时通风，避免吸入助焊剂烟雾。\n- 有铅焊锡不入口、不接触食品；焊后洗手。\n- 热风枪/烙铁放在支架上，不随手放桌面。\n- 断电、放电后再拆电容；大电容可能残留高压。\n\n#### 10.5.1 焊锡、助焊剂、吸锡带怎么选\n\n| 耗材 | 选型要点 | 适用 | 注意 |\n|---|---|---|---|\n| 有铅 Sn63/Pb37 | 183℃、流动性好 | 练习/维修 | 通风、洗手、不入口 |\n| 无铅 SAC305 | 217～220℃、环保 | 产品/出口 | 温度高、烙铁头寿命短 |\n| 低温锡 | 138℃、强度低 | 热敏器件返修 | 不用于振动/受力焊点 |\n| 松香助焊剂 | 活性中等 | 通孔/维修 | 残渣要清 |\n| 免洗助焊剂 | 残渣少 | 贴片/返修 | 不是“免洗=不用管” |\n| 吸锡带 | 宽度匹配焊盘 | 清焊盘/拆通孔 | 用脏立即换，否则越吸越脏 |\n\n焊锡丝直径选择：\n\n- 0.6mm：0805/0603、密脚 SOP；\n- 0.8mm：通孔、排针、连接器；\n- 1.0mm 以上：大焊盘/接地铜面，但不好控量。\n\n助焊剂不是越多越好：太多会残留、飞溅、腐蚀；太少则润湿差。原则是“少量、点到为止、该清就清”。\n\n#### 10.5.2 工具维护与安全\n\n工具维护：\n\n- 烙铁头每次用完擦净、挂锡，防止氧化；氧化头不能用，换。\n- 热风枪滤网定期清；风量变小/温度不稳，先查滤网/发热芯。\n- 吸锡带用脏就换；脏带会把残锡又抹回焊盘。\n- 镊子尖端要尖、要不磁；磁化镊子会吸住小元件。\n\n安全边界：\n\n- 通风：助焊剂烟雾不吸入；有条件的用吸烟仪。\n- 有铅：不入口、不接触食品、焊后洗手；孕妇/儿童远离。\n- 热：烙铁/热风放支架，线不绊脚；断电后余温仍高。\n- 电：拆电容先放电；大电容可能残留高压。\n- 眼：剪脚/吹锡戴护目镜；锡珠飞入眼睛很危险。\n\n#### 10.5.3 成本与耗材预算\n\n| 项目 | 入门配置 | 参考价（练习级） | 备注 |\n|---|---|---|---|\n| 恒温烙铁 | 60～80W、可换头 | 100～300 元 | 别买 20W 笔式 |\n| 热风枪 | 数显、风量可调 | 150～400 元 | 返修 QFN 必需 |\n| 焊锡丝 | 0.6/0.8mm 各一卷 | 30～80 元 | 有铅/无铅分开 |\n| 助焊剂 | 免洗/松香 | 10～30 元 | 别用酸性焊膏 |\n| 吸锡带 | 1.5/2.5mm | 10～20 元 | 消耗品 |\n| 放大镜/显微镜 | 5～20 倍 | 30～300 元 | 检查虚焊 |\n| 防静电手环 | 有线/无线 | 10～30 元 | 干燥季节必用 |\n\n预算有限时，优先级是：**烙铁 > 助焊剂/焊锡 > 放大镜 > 热风枪 > 显微镜**。热风枪可以晚点买，但拆 QFN/BGA 之前必须有。\n\n### 10.6 测量与仿真：焊后检查\n\n#### 10.6.1 目视检查\n\n- 焊点是否光亮、凹月面；\n- 是否有连锡、锡珠、虚焊；\n- 元件是否歪斜、立碑、极性反；\n- 焊盘是否翘起、脱落。\n\n#### 10.6.1 目视检查 20 项\n\n先看整体，再看局部；先看电源/地，再看信号。下表按“从外到内”排列：\n\n| # | 检查项 | 合格 | 不合格处理 |\n|---|---|---|---|\n| 1 | 板面清洁 | 无残留、无飞珠 | 清洗/吸走锡珠 |\n| 2 | 元件位号 | 与 BOM/丝印一致 | 核对 BOM，返修 |\n| 3 | 极性 | 二极管/电容/IC 方向正确 | 拆下重焊 |\n| 4 | 元件高度 | 不超高、不压邻近 | 重新贴装 |\n| 5 | 焊点光泽 | 光亮/哑光均匀 | 发灰查温度/氧化 |\n| 6 | 润湿角 | 凹月面、连续 | 成球则补焊 |\n| 7 | 锡量 | 覆盖焊盘、轮廓可见 | 过多吸锡，过少补锡 |\n| 8 | 连锡 | 脚间无桥接 | 助焊剂+吸锡带 |\n| 9 | 虚焊 | 无松动/无空洞 | 补焊/拆重焊 |\n| 10 | 立碑 | 两端同时着焊 | 重新贴装 |\n| 11 | 偏移 | 不超出焊盘 1/4 | 重新贴装 |\n| 12 | 焊盘翘起 | 无剥离 | 飞线/换板 |\n| 13 | 阻焊 | 无脱落/无起泡 | 评估返修 |\n| 14 | 过孔 | 无堵孔/无漏锡 | 清理/补焊 |\n| 15 | 连接器 | 机械脚/信号脚都焊 | 补焊机械脚 |\n| 16 | 排针 | 剪脚后补焊 | 补焊 |\n| 17 | 测试点 | 可触及、无覆盖 | 清理/补测试点 |\n| 18 | 邻件 | 无被吹移位/烫变形 | 复位/更换 |\n| 19 | 字符 | 丝印可读 | 不影响功能可放行 |\n| 20 | 整体 | 与首件一致 | 首件对比 |\n\n目视不是“看一眼”，是“按顺序看 20 项”。新手最容易只看焊点亮不亮，忽略极性、偏移、邻件。\n\n#### 10.6.2 万用表检查\n\n1. 通断档测电源与地是否短路。\n2. 测关键网络是否连通。\n3. 测二极管/三极管极性。\n4. 上电前先测对地阻抗，不要直接满压上电。\n\n#### 10.6.3 温度曲线（回流焊）\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 10-5：典型无铅回流焊温度曲线<\/text>\n  <line x1=\"80\" y1=\"240\" x2=\"660\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"80\" y1=\"240\" x2=\"80\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"640\" y=\"265\" font-size=\"12\" fill=\"currentColor\">时间<\/text>\n  <text x=\"40\" y=\"70\" font-size=\"12\" fill=\"currentColor\">温度℃<\/text>\n  <path d=\"M80 240 L180 200 L260 200 L340 90 L420 90 L500 150 L620 240\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"180\" y=\"185\" font-size=\"12\" fill=\"currentColor\">预热 150～180℃<\/text>\n  <text x=\"330\" y=\"75\" font-size=\"12\" fill=\"currentColor\">峰值 235～245℃<\/text>\n  <text x=\"500\" y=\"135\" font-size=\"12\" fill=\"currentColor\">回流 217℃以上 60～90s<\/text>\n  <text x=\"570\" y=\"225\" font-size=\"12\" fill=\"currentColor\">冷却<\/text>\n<\/svg>\n```\n\n#### 10.6.2 万用表检查：先测短路，再测通断\n\n顺序不能反：\n\n1. **对地阻抗**：黑表笔接地，红表笔测各电源轨；阻抗接近 0 说明短路，不要上电。\n2. **电源—地通断**：确认没有锡桥；有桥先清。\n3. **关键网络通断**：按原理图逐段测，特别是连接器/排针。\n4. **极性**：二极管档测 PN 结；三极管测 B-C/B-E。\n5. **上电**：限流电源先设 100mA，电压从低到高；看电流是否异常。\n\n万用表不能替代“带载测试”：虚焊在小电流下可能通，大电流才发热/掉压。所以关键电源还要加负载测。\n\n#### 10.6.3 回流四区与算例\n\n回流曲线分四区：\n\n| 区 | 温度范围 | 时间（参考） | 作用 |\n|---|---|---|---|\n| 预热 | 室温→150℃ | 60～90s | 去潮、均匀升温 |\n| 恒温/浸润 | 150～180℃ | 60～90s | 助焊剂活化、缩小温差 |\n| 回流 | 217℃以上 | 60～90s | 锡全熔、润湿 |\n| 冷却 | 峰值→室温 | 60～90s | 凝固、晶粒控制 |\n\n峰值温度按焊料定：SAC305 峰值 235～245℃，略高于熔点 217～220℃，给器件/板面温差留余量。峰值太高会伤器件/板，太低会冷焊。\n\n算例：某板用 SAC305，回流区 217℃以上要求 60～90s。若实测 217℃以上只有 40s，说明链速太快或峰值不够；先调链速，再调峰值，不要一上来就加 10℃。\n\n#### 10.6.4 热时间常数算例\n\n把焊点看成“热容 C_th + 热阻 R_th”的一阶系统，时间常数 `τ=R_th×C_th`。粗略估算：\n\n- 小焊盘（0805）：τ 约 1～3s；\n- 大铜面/接地焊盘：τ 约 10～30s；\n- 整板预热：τ 约 1～3min。\n\n所以大焊盘“点一下就走”根本没到温；整板预热能把 τ 降下来，是因为减小了板与焊点的温差，不是把烙铁调高 50℃。\n\n这个模型和 RC 充电同形：`V(t)=V0(1-e^{-t/τ})`。仿真里把 R 当热阻、C 当热容，看“多久到 63%”；实际焊接看“多久锡完全铺开”，两者趋势一致。\n\n#### 10.6.4 CircuitJS\n\n```circuitjs\nrc-charge\n```\n\n把烙铁/板子升温看成“热阻 + 热容”的一阶系统，和 RC 充电同形：时间常数越大，到温越慢。曲线用来理解预热/回流的时间分配，不是精确热仿真。\n\n```circuitjs\nled-resistor\n```\n\n焊点的热与电阻功耗同构：`P=I²R`。同样的电流，焊点接触电阻大一点，局部功率就大一点；这也是虚焊/冷焊在大电流下先发热、后失效的原因。\n\n#### 10.6.5 上电前 10 项检查\n\n1. 电源与地不短路：万用表测阻抗，>几十 Ω 才敢上电。\n2. 电源轨电压正确：限流电源设 100mA，先低压。\n3. 极性元件方向：二极管/电解电容/IC 1 脚。\n4. 连接器无连锡：排针/USB/端子逐脚看。\n5. 焊点无虚焊：轻推元件，看是否动。\n6. 无锡珠/飞线：板面干净。\n7. 保险丝/防反接器件已装。\n8. 测试点可触及。\n9. 散热器件/风扇方向正确。\n10. 首件与 BOM/图纸一致。\n\n这 10 项里，第 1 项最重要：**先测短路，再上电**。很多“上电烧板”不是设计错，是焊接短路没查。\n\n#### 10.6.6 动手任务\n\n- 焊一块 0805 LED 限流板，记录焊点照片。\n- 故意做一个虚焊，用万用表/轻压法观察现象。\n- 用热风枪拆一个 SOP-8，记录温度/风量/时间。\n- 写一页“焊接参数记录”：烙铁温度、焊锡型号、助焊剂、缺陷。\n\n#### 10.7.1 缺陷图谱：看到什么，先查什么\n\n| 缺陷 | 外观 | 先查 | 处理 |\n|---|---|---|---|\n| 虚焊 | 焊点光亮但器件可动 | 温度/时间/氧化 | 补焊/拆重焊 |\n| 冷焊 | 表面粗糙、灰暗 | 温度不足/冷却异常 | 补焊 |\n| 连锡 | 脚间锡桥 | 锡量/助焊剂/拖焊速度 | 吸锡带 |\n| 锡球 | 板面小锡珠 | 锡量/飞溅/助焊剂 | 吸走/清洗 |\n| 立碑 | 一端翘起 | 两端受热不均/焊盘不对称 | 重新贴装 |\n| 偏移 | 元件不在焊盘中心 | 贴装/风量 | 重新贴装 |\n| 焊盘翘起 | 铜箔剥离 | 温度过高/硬撬 | 飞线/换板 |\n| 空洞 | X 光/切开可见 | 锡膏/回流/散热焊盘 | 改钢网/曲线 |\n| 爆米花 | 器件鼓包/开裂 | 潮敏器件未烘烤 | 换器件/烘烤 |\n| 金面发黑 | ENIG 焊盘变色 | 存储/污染/温度 | 清洁/换板 |\n\n### 10.7 常见坑\n\n1. **温度越高越好**：焊盘翘起、器件烫坏、助焊剂瞬间失效。\n2. **烙铁头氧化不擦**：不上锡，热传不出去。\n3. **焊锡丝当“胶水”堆**：锡堆不润湿，虚焊。\n4. **元件先焊一端不检查**：另一端焊不上，立碑/歪斜。\n5. **拆焊硬撬**：焊盘脱落，板子报废。\n6. **QFN 底部散热焊盘没上锡**：看似焊上，实际散热/接地不良。\n7. **带电焊接**：带电插拔/焊接，烧器件、伤自己。\n8. **忽视静电**：MOS/IC 被静电打伤，现场测不出，可靠性下降。\n9. **助焊剂不洗**：残留吸潮/漏电，高阻电路出问题。\n\n#### 10.7.2 两周训练计划\n\n第 1 周：只练“热”和“锡量”——\n\n- 周一：通孔电阻 20 个，每个 2～3 秒，拍放大图。\n- 周二：0805 电阻 20 个，练一端固定。\n- 周三：拆 10 个通孔件，练吸锡带。\n- 周四：重复周一，比较焊点差异。\n- 周五：写一页“我的温度/时间参数”。\n\n第 2 周：练“密脚”和“返修”——\n\n- 周一：SOP-8 拖焊 5 片，练助焊剂+吸锡带。\n- 周二：QFN 热风 3 片，练预热+回弹。\n- 周三：拆 SOP-8 3 片，清焊盘。\n- 周四：做 1 块 0805 LED 板，全流程。\n- 周五：对照 10.6.1 的 20 项目视检查，写缺陷记录。\n\n训练的核心不是“焊得多”，是“每次只改一个变量，并留下记录”。没有记录，焊 100 个也只是重复同一个错误。\n\n#### 10.7.3 返修记录模板\n\n每次返修留一行，久了就是自己的缺陷数据库：\n\n| 日期 | 板号/位号 | 缺陷 | 可能原因 | 处理 | 结果 | 复测 |\n|---|---|---|---|---|---|---|\n| 2026-11-10 | A01/U3 | 连锡 | 锡量过多 | 吸锡带 | 通过 | 通断+上电 |\n| 2026-11-10 | A01/R7 | 立碑 | 两端受热不均 | 重焊 | 通过 | 目视 |\n\n记录三原则：\n\n1. **写现象，不写结论**：“U3 的 5/6 脚连锡”比“焊坏了”有用。\n2. **写参数**：温度、烙铁头、焊锡、时间；否则无法复现。\n3. **写复测**：目视/通断/上电/带载，哪一项通过。\n\n#### 10.7.4 焊完的板子怎么放\n\n- 不要叠放：焊点/元件相互刮擦，尤其是排针/连接器。\n- 不要用普通塑料袋：静电/潮气；用防静电袋+干燥剂。\n- 不要马上装壳：等板子冷却、清洗、测试后再装。\n- 不要带电插拔：先断电，再插连接器。\n- 记录环境：湿度高时助焊剂残留更容易吸潮。\n\n这些看似“仓库管理”，实际决定返修率。很多“放几天就不亮”的板，是残留/潮气/静电造成的，不是设计问题。\n\n### 10.8 本章复盘\n\n#### 10.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 有铅 183℃，无铅 217～220℃ | 焊锡熔点 | 烙铁头温度要高于熔点 |\n| 烙铁温度 = 熔点 + 50～100℃ | 工艺窗口 | 大焊盘取上限 |\n| 焊点应光亮、凹月面 | 润湿判断 | 锡堆/粗糙 = 润湿差 |\n| 通断档测电源对地 | 上电前检查 | 先测阻抗，再上电 |\n| 热风温度 300～380℃ | 拆 QFN/SOP | 风量中低，均匀加热 |\n\n#### 10.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 润湿 | wetting | 焊锡在金属表面铺开 |\n| 虚焊 | cold/virtual joint | 表面接触但未形成合金连接 |\n| 连锡 | solder bridge | 相邻焊盘被锡短接 |\n| 立碑 | tombstone | 贴片元件一端翘起 |\n| 助焊剂 | flux | 清除氧化、帮助润湿 |\n| 回流焊 | reflow | 焊膏熔化连接 |\n| 返修 | rework | 拆下/重焊已焊器件 |\n\n#### 10.8.3 自测 10 题\n\n1. 焊接的四个变量是什么？\n2. 有铅和无铅的熔点差多少？\n3. 虚焊为什么静态万用表测不出来？\n4. 通孔焊接的四步是什么？\n5. 0805 立碑的常见原因？\n6. QFN 底部散热焊盘怎么焊？\n7. 拆焊为什么不能硬撬？\n8. 焊后目视检查看哪四项？\n9. 上电前为什么先测对地阻抗？\n10. 助焊剂残留有什么风险？\n\n\n**自测参考答案：**\n\n1. 热、锡、助焊剂、时间。\n2. 有铅 183℃，无铅 217～220℃，差约 34～37℃。\n3. 虚焊可能仍有微小接触，静态通断能通；大电流/轻压/热测才暴露。\n4. 插入→同时预热焊盘和引脚→送锡→先撤锡丝再撤烙铁。\n5. 两端受热不均、焊盘不对称、锡量差太多。\n6. 焊盘涂薄锡/焊膏，预热，热风环绕，轻推回弹，冷却后查侧面爬锡。\n7. 硬撬会翘焊盘/拉断铜箔；焊盘损坏比器件损坏更难修。\n8. 润湿/锡量、连锡/锡珠、极性/方向、偏移/立碑；再查焊盘/邻件。\n9. 防止已有短路在满压上电时扩大故障；先测阻抗，限流上电。\n10. 吸潮、腐蚀、漏电，影响长期可靠性。\n\n#### 10.8.4 能力清单\n\n- [ ] 能焊通孔电阻/排针，焊点光亮。\n- [ ] 能焊 0805/0603，元件不歪、不立碑。\n- [ ] 能用热风枪拆 SOP/QFN。\n- [ ] 能识别虚焊、连锡、冷焊、立碑。\n- [ ] 能写焊接参数与缺陷记录。\n\n#### 10.8.5 下一章\n\n下一章讲**封装、元件库与 BOM**：焊什么、怎么焊，取决于封装选得对不对。你会看到封装四要素、推荐焊盘、引脚映射，以及 BOM 里的替代料怎么处理。\n\n#### 10.8.6 练习复盘表\n\n| 练习 | 参数 | 缺陷数 | 主要原因 | 下次改什么 |\n|---|---|---|---|---|\n| 通孔 20 点 | 320℃/0.8mm | 2 | 预热不足 | 先烫焊盘 1s |\n| 0805 20 点 | 310℃/0.6mm | 1 | 锡量多 | 送锡减半 |\n| SOP-8 5 片 | 330℃/刀头 | 1 | 拖焊太快 | 放慢、加助焊剂 |\n\n复盘不是写检讨，是写“下一次只改哪一个参数”。三行写完，比看十篇教程有用。\n\n焊接这一章没有“看会”的可能，只有“手会”。你可以把 20 个项目视检查当成一张飞行检查单：每次焊完按顺序走一遍，走习惯之后，眼睛会自动去找连锡、偏移和虚焊，而不是只盯着“亮不亮”。焊接是手上功夫，也是眼上功夫；手稳靠练，眼准靠清单。清单走顺了，返修率自然往下走。\n\n最后提醒一句：焊接参数可以抄，手感抄不走。抄来的参数只能让你“焊得上”，练出来的手感才能让你“焊得稳”。每次练习只改一个变量，记录一个结果，三个月后你会发现自己不再依赖别人的温度表。\n\n焊接台上最贵的不是烙铁，是那块被你焊废的板；最便宜的不是练习板，是每次只改一个参数的习惯。把这两句话贴在工位上，比背十张参数表都管用。\n\n下一章你会看到封装与 BOM：焊什么、焊哪里，其实在画图那一刻就定了。焊得好，只能补救；选得对，才不用补救。焊接是最后一道手，但从来不是唯一一道关。前面画错一根线，后面焊得再漂亮也救不回来。反过来，图画对了，焊接只是把它变成实物。所以别把焊接当成孤立的技能，它是设计链的最后一环，也是离用户最近的一环。\n这句话请始终牢牢记住。\n共勉。","taskSignature":"94c23b31ec0762537eb99f8e9163163730bae8f0fb74eb6b2746323327b52b9e","taskCount":5},{"id":"11","title":"第 11 章 · 封装、元件库与 BOM","short":"封装、元件库与 BOM","stage":2,"diff":3,"prev":"第 09 章 EDA 与原理图入门、第 10 章 焊接与返修基础","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清封装四要素：焊盘、阻焊、丝印、助焊层。\n2. 按器件手册的推荐焊盘图建一个 0805 电阻封装和一个 SOT-23 三极管封装。\n3. 核对引脚号、极性、1 脚标识，避免符号与封装对不上。\n4. 区分通孔、SOP、QFN、连接器封装的建库要点。\n5. 看懂 BOM 的位号、型号、封装、数量、替代料字段。\n6. 为一块 2 层板整理 BOM，并检查封装缺失、重复位号、替代料风险。\n7. 说出至少 8 个封装/BOM 常见坑。\n\n封装选错，原理图再对也焊不上；BOM 错了，采购买回来的料可能根本贴不上。封装和 BOM 是“设计—采购—贴片”之间的接口。\n\n## 正文\n\n### 11.1 它解决什么问题：三个真实场景\n\n#### 场景一：封装焊盘小 0.2mm，回流焊偏移\n\n一个 SOT-23 三极管，手册推荐焊盘长 1.0mm，库里只有 0.8mm。手工焊勉强能连，回流焊时锡量不足，管子偏移/立碑。封装不是“看起来差不多”，是按推荐图纸做。\n\n#### 场景二：三极管 B/C/E 和焊盘 1/2/3 对不上\n\n原理图符号按 B=1、C=2、E=3 画，封装焊盘按 E=1、B=2、C=3 建。网表导入 PCB 报 Unknown Pin，或者更糟：不报错但网络接错。必须对着手册的 Pin Configuration 逐脚核对。\n\n#### 场景三：BOM 里同一个 10k 电阻有 5 个型号\n\n设计里随手从不同库拿了 5 个 10k 电阻，封装有 0402、0603、0805 三种。采购按 BOM 买回 5 种料，贴片换料 5 次，成本和时间都上去。BOM 要合并同规格料，统一封装。\n\n### 11.2 它是什么：封装是器件的“脚印”\n\n**封装（Footprint / Land Pattern）** 是器件在 PCB 上占用的焊盘图形。它不是器件本身，而是“器件怎么落在板上”。\n\n封装四要素：\n\n| 要素 | 作用 | 建库要点 |\n|---|---|---|\n| 焊盘（Pad） | 电气连接与机械支撑 | 尺寸按推荐图纸，编号与符号一致 |\n| 阻焊（Solder Mask） | 防止焊锡流到相邻焊盘 | 阻焊开窗通常比焊盘大 0.05～0.1mm |\n| 丝印（Silkscreen） | 标识位号、极性、1 脚 | 不压焊盘，字高 ≥0.8mm |\n| 助焊层（Paste） | 钢网开孔，锡膏印刷 | 通常与焊盘同尺寸或略小 |\n\n> **术语第一次出现**：推荐焊盘图（Recommended Land Pattern）是器件手册给出的焊盘尺寸/间距建议，按目标工艺和器件封装给出。不同板厂/工艺可能要微调，但不能凭“经验”随便缩。\n\n#### 11.2.1 封装从手册走到板上的五道转换\n\n器件手册上的封装图是机械尺寸，落到 PCB 文件里要经过五道转换，每一道都可能丢信息。\n\n第一道是**引脚编号**。手册的 Pin Configuration 用 1、2、3 给引脚编号，原理图符号也用 1、2、3 做电气连接。两者对不上，网表就把网络连到错误的焊盘。三极管、MOS、稳压器、USB 连接器最容易在这里出错，因为同一封装不同厂商的引脚定义并不统一。\n\n第二道是**焊盘图形**。手册给的是器件本体尺寸和推荐焊盘（Recommended Land Pattern），不是“把本体外形画成焊盘”。焊盘要留出 toe（趾部）、heel（跟部）、side（侧部）三个方向的余量，让锡膏熔化后能形成弯月面。余量不足，焊点只有一条细线；余量过大，锡液表面张力会把元件拉偏。\n\n第三道是**阻焊开窗**。阻焊是板面上那层绿色（或其他颜色）的绝缘漆。焊盘上的阻焊必须开窗，否则锡膏印不到铜面。开窗通常比焊盘单边大 0.05～0.1mm，具体看板厂的最小阻焊桥能力。开窗太小，边缘残留阻焊会阻碍上锡；开窗太大，相邻焊盘之间没有阻焊桥，回流时容易连锡。\n\n第四道是**助焊层（Paste Mask）**。它不印在板上，而是用来开钢网。钢网开孔一般与焊盘 1:1，或面积略缩 5%～10%，用来控制锡量。QFN 的散热焊盘如果 1:1 开孔，锡膏太多会把芯片顶起来，出现“浮高”；通常要分成几个小孔，或用窗口式开孔。\n\n第五道是**丝印与装配标识**。丝印要标位号、极性和 1 脚，但不能压焊盘。压焊盘一方面会被锡膏覆盖，另一方面会在回流后留下白色残留，影响外观和焊接。高密度板上丝印放不下时，宁可把位号移到器件外侧，也不要把字压在焊盘上。\n\n这五道转换里，前四道决定“能不能焊”，第五道决定“会不会焊反”。建库时把五道当成五个检查项，比事后在板上找错要省时间。\n\n#### 11.2.2 封装不是越小越好\n\n零基础容易有一个直觉：封装越小，板子越省空间，越“高级”。实际选型要同时看四个约束。\n\n其一是**工艺能力**。0402 电阻的焊盘间距只有 0.5mm 左右，0201 更小。板厂能做出焊盘，不代表贴片厂能稳定贴装。小批量打样时，贴片厂的贴片精度、钢网厚度、回流曲线都按最熟悉的 0603/0805 调过，突然上 0201，立碑和偏移的概率会明显上升。\n\n其二是**散热**。同样 0.1W 的功耗，0805 的表面积比 0402 大，温升更低。功耗接近额定值时，封装尺寸比阻值更关键。电阻的额定功率随封装增大而增大，但降额规则不变：高温环境、密闭外壳、邻近发热器件时，实际可用功率要再打折。\n\n其三是**手工返修**。0603 以上，烙铁和热风还能处理；0402 需要放大镜和细尖头；0201 基本只能靠返修台。课程项目要反复调试，封装太小会让每次换料都变成风险。\n\n其四是**机械应力**。大封装（1206、1210）在板子弯曲时更容易开裂，尤其是靠近板边、连接器、螺钉孔的位置。陶瓷电容对弯曲应力很敏感，板边 5mm 内尽量不放 1206 以上电容，或把长边平行于板边摆放，减少应力集中。\n\n所以“选封装”不是选最小的，而是选工艺、散热、返修、应力四者都过得去的。课程项目默认 0603 电阻、0603/0805 电容、SOT-23/SOIC-8 小芯片，是在这四个约束下取的折中，不是随便定的。\n\n#### 11.2.3 封装代码：英制叫法和公制尺寸不是一回事\n\n新手看 BOM 最容易在这里踩坑：`0402`、`0603`、`0805` 是英制代码，单位是英寸的千分之一，不是毫米。\n\n- 0402 = 0.04 英寸 × 0.02 英寸，约 1.0mm × 0.5mm；\n- 0603 = 0.06 英寸 × 0.03 英寸，约 1.6mm × 0.8mm；\n- 0805 = 0.08 英寸 × 0.05 英寸，约 2.0mm × 1.25mm；\n- 1206 = 0.12 英寸 × 0.06 英寸，约 3.2mm × 1.6mm。\n\n有些厂商用公制代码，`1005` 指 1.0mm × 0.5mm，对应英制 0402；`1608` 对应 0603；`2012` 对应 0805。BOM 里如果只写 `0402`，采购一般能懂；如果写 `1005`，要确认是公制代码还是某个厂商的内部编号。最稳的写法是“封装代码 + 公制尺寸”，例如 `0402 (1005)`。\n\n封装代码只描述本体尺寸，不描述焊盘。同样是 0603，不同厂商的端头电极长度可能差 0.1mm，焊盘就要跟着调。所以 BOM 的封装字段要和 EDA 库的封装名对应，不能只写一个代码就完事。\n\n#### 11.2.4 极性与方向：封装上的“第一眼信息”\n\n器件焊反，轻则不工作，重则上电烧毁。封装设计要把极性和方向做成“第一眼能看见”的信息。\n\n**二极管**：有极性的二极管（肖特基、TVS、LED）在封装上要有阴极标识。常见做法是丝印画一条横线或一个三角形，横线对应阴极。LED 的丝印还要标发光方向，避免“焊上了但不亮”。\n\n**电解电容**：钽电容和铝电解有极性，封装丝印要用“+”号或半圆阴影标正极。钽电容反接会发热甚至燃烧，丝印不能只靠焊盘形状区分。\n\n**IC**：1 脚用圆点、三角或缺口感标识。QFN 的 1 脚通常在左上角，但不同厂商可能旋转 90°，必须看手册的 Pin 1 Indicator，不能凭“习惯”。\n\n**连接器**：1 脚用三角或方焊盘标识，锁扣方向用丝印箭头标。卧式连接器还要标“插入方向”，否则装配时容易反插。\n\n丝印标识的原则是：**不压焊盘、不被器件本体完全遮住、在装配后仍能看到**。0603 电阻太小，丝印放不下位号，可以把位号放在器件外侧，或用装配图代替。极性器件的标识优先于位号，因为位号错了还能查，极性错了会烧板。\n\n### 11.3 关键参数与建库规则\n\n| 参数 | 看哪里 | 常见值 | 错误后果 |\n|---|---|---|---|\n| 焊盘长/宽 | 手册推荐图 | 0805：1.0×1.3mm 左右 | 太小虚焊，太大连锡 |\n| 焊盘间距 | 手册推荐图 | 0805：0.9～1.0mm | 偏大立碑，偏小连锡 |\n| 引脚间距 | 手册 Pin Pitch | SOP-8：1.27mm | 与符号管脚号错位 |\n| 焊盘编号 | 符号管脚号 | 1、2、3… | 网络接错 |\n| 1 脚标识 | 手册/丝印 | 圆点/三角/缺口 | 芯片焊反 |\n| 阻焊开窗 | 板厂能力 | 焊盘 +0.05～0.1mm | 开窗太小上锡难 |\n| 钢网开孔 | 贴片工艺 | 焊盘 1:1 或略小 | 锡量过多/少 |\n\n建库三条件：\n\n1. **以手册推荐图为准**：不用“别人的库”直接投产，库只能交叉检查。\n2. **焊盘编号必须和符号一致**：三极管、MOS、USB-C、QFN 的 EP 最容易错。\n3. **丝印不能压焊盘**：压焊盘会导致上锡不良/误判。\n\n#### 11.3.1 焊盘尺寸怎么从手册推出来\n\n手册通常直接给推荐焊盘图，照画即可。但只会照画，遇到手册没给图、或板厂要求调整时就没办法。这里给一个可复算的推导框架，目的不是替代 IPC 标准，而是让你知道每个尺寸在管什么。\n\n以 0805 电阻为例。器件本体长约 2.0mm、宽约 1.25mm，端头电极各约 0.4mm。焊盘要在端头外侧留 toe，在内侧留 heel，在宽度方向留 side。一个常见的课程用起点是：\n\n- 焊盘长 = 端头长 + toe + heel，约 1.0～1.3mm；\n- 焊盘宽 = 本体宽 + 2×side，约 1.3～1.5mm；\n- 两焊盘内边间距 = 本体长 − 2×端头长 + 2×heel，约 0.9～1.1mm。\n\n这三个尺寸不是独立参数。焊盘变长，内边间距就要相应调整，否则总跨距变了，元件会在回流时被拉向一边。正确做法是先定内边间距（由器件端头和中部的间隙决定），再向外加 toe 和 heel。\n\n**toe（趾部）** 是焊盘超出器件端头外侧的长度，提供锡量形成外侧弯月面。toe 太小，外侧没有锡，焊点只剩底部连接；toe 太大，锡液表面张力把元件拉向焊盘中心，细间距器件会偏移。\n\n**heel（跟部）** 是焊盘伸入器件端头内侧的长度，决定内侧弯月面。heel 不足，内侧空洞；heel 过大，两个焊盘之间的间距变小，容易桥连。\n\n**side（侧部）** 是焊盘比器件本体宽出的部分，提供横向润湿。side 不足，焊点只在端头正面，机械强度差；side 过大，相邻元件之间容易连锡。\n\nIPC-7351 把密度分成 A（最大）、B（中等）、C（最小）三档，对应不同的 toe/heel/side 余量。课程项目建议用 B 档：既能手工焊，也能回流，密度不算激进。A 档适合有返修空间的教学板，C 档适合高密度消费板，但需要更好的贴片和钢网能力。\n\n推导完一定要做两件事：一是把焊盘尺寸和手册推荐图叠在一起看，差异超过 0.1mm 要写理由；二是打印 1:1，把实物放上去，看端头是否完全落在焊盘内。纸面尺寸对、实物放上去偏，说明本体尺寸或端头尺寸取错了。\n\n#### 11.3.2 阻焊、钢网与散热焊盘的联动\n\n焊盘不是孤立的铜块，它和阻焊、钢网、过孔一起构成“焊接系统”。改一个，另外两个要跟着改。\n\n**阻焊开窗** 决定锡膏能覆盖多大面积。开窗比焊盘小，边缘的阻焊会阻止锡膏铺展，焊点看起来“缩在中间”；开窗比焊盘大太多，相邻焊盘之间没有阻焊坝，回流时锡液会顺着铜面流过去，形成桥连。一般规则是单边 +0.05～0.1mm，但 0.4mm 间距的 QFN 就不能按这个规则，必须让板厂按最小阻焊桥能力调整。\n\n**钢网开孔** 决定锡量。钢网厚度通常是 0.1～0.15mm，开孔面积比焊盘小，锡量就少。细间距 QFN 的引脚焊盘，如果钢网 1:1 开孔，锡膏量往往偏多，回流后引脚之间桥连；常见做法是开孔宽度缩到焊盘的 80%～90%，长度方向保持，靠面积比控制脱模。\n\n**散热焊盘（EP）** 是 QFN/BGA 里最特殊的一块。它面积大，如果钢网整片开孔，锡膏熔化后的表面张力会把芯片托起，引脚反而接触不到焊盘。常见做法是把 EP 开孔分成 4～9 个小方块，总面积控制在 EP 面积的 50%～70%，并在 EP 上打过孔散热。过孔如果直接打在焊盘上，锡会顺着孔流到背面，造成正面缺锡；所以要么把过孔盖油（tented via），要么在孔口留一小段阻焊，要么用导电胶填充。课程项目做 2 层板时，最简单的是“过孔盖油 + EP 分区开孔”，牺牲一点散热，换焊接稳定。\n\n这三者的联动可以用一句话记：**焊盘定边界，阻焊定范围，钢网定锡量，过孔定散热路径**。任何一项改了，另外三项都要重新核对。\n\n#### 11.3.3 焊盘公差：名义尺寸对，不代表每块板都对\n\n焊盘图上的尺寸是名义值，实际做出来有公差。铜箔蚀刻会让焊盘边缘内缩，阻焊曝光会让开窗偏移，钻孔会有偏位。设计时要给这些公差留余量，不能按“名义值刚好等于器件尺寸”来画。\n\n**蚀刻公差**：板厂蚀刻铜箔时，焊盘边缘通常内缩 0.02～0.05mm。焊盘名义长 1.0mm，做出来可能只有 0.95mm。对 0805 影响不大，对 0.4mm 间距的 QFN 就是 10% 的宽度。\n\n**阻焊偏移**：阻焊开窗和焊盘对位有偏差，通常 ±0.05mm。开窗单边只比焊盘大 0.05mm 时，偏移后一侧可能没有开窗，另一侧开窗过大。细间距器件要把开窗做大一点，或让板厂用 LDI（激光直接成像）提高对位精度。\n\n**钻孔偏位**：通孔钻孔相对焊盘中心有偏差，通常 ±0.05～0.1mm。环宽 0.15mm 是最低要求，钻孔偏 0.1mm 时，一侧环宽只剩 0.05mm，另一侧 0.25mm。环宽不足，钻孔可能切到焊盘边缘，形成开路。\n\n**层间对位**：多层板的层间对位偏差会影响埋孔/盲孔和焊盘的对齐。2 层板问题不大，4 层以上要按板厂的层间对位能力设计。\n\n设计规则里通常写“最小环宽”“最小阻焊桥”“最小焊盘间距”，这些不是建议，是板厂能力的边界。超过边界，板厂会提醒你改，或者按“有能力做但不保证良率”处理。课程项目打样时，把板厂的工艺能力表读一遍，比事后返工便宜。\n\n### 11.4 三个典型封装\n\n#### 11.4.1 0805 电阻/电容\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 11-1：0805 封装四要素<\/text>\n  <rect x=\"80\" y=\"90\" width=\"100\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <rect x=\"90\" y=\"100\" width=\"30\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"140\" y=\"100\" width=\"30\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"95\" y=\"180\" font-size=\"12\" fill=\"currentColor\">焊盘 1<\/text>\n  <text x=\"145\" y=\"180\" font-size=\"12\" fill=\"currentColor\">焊盘 2<\/text>\n  <rect x=\"80\" y=\"90\" width=\"100\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n  <text x=\"80\" y=\"215\" font-size=\"13\" fill=\"currentColor\">虚线：阻焊开窗 / 丝印外框<\/text>\n  <text x=\"80\" y=\"240\" font-size=\"13\" fill=\"currentColor\">焊盘间距 ≈ 0.9～1.0mm，焊盘 1.0×1.3mm<\/text>\n  <text x=\"80\" y=\"265\" font-size=\"13\" fill=\"currentColor\">丝印不压焊盘，1 脚可用圆点标识<\/text>\n<\/svg>\n```\n\n#### 11.4.2 SOT-23 三极管\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 11-2：SOT-23 引脚映射（以手册为准）<\/text>\n  <rect x=\"160\" y=\"80\" width=\"180\" height=\"120\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <circle cx=\"185\" cy=\"105\" r=\"6\" fill=\"currentColor\"/>\n  <text x=\"200\" y=\"110\" font-size=\"12\" fill=\"currentColor\">1 脚标识<\/text>\n  <rect x=\"150\" y=\"210\" width=\"40\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"220\" y=\"210\" width=\"40\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"290\" y=\"210\" width=\"40\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"155\" y=\"255\" font-size=\"12\" fill=\"currentColor\">1（B）<\/text>\n  <text x=\"225\" y=\"255\" font-size=\"12\" fill=\"currentColor\">2（E）<\/text>\n  <text x=\"295\" y=\"255\" font-size=\"12\" fill=\"currentColor\">3（C）<\/text>\n  <text x=\"380\" y=\"120\" font-size=\"13\" fill=\"currentColor\">原理图符号管脚号必须与焊盘号一致；<\/text>\n  <text x=\"380\" y=\"145\" font-size=\"13\" fill=\"currentColor\">不同厂商 SOT-23 引脚定义可能不同，<\/text>\n  <text x=\"380\" y=\"170\" font-size=\"13\" fill=\"currentColor\">以具体型号手册为准，不能套用“通用”。<\/text>\n<\/svg>\n```\n\n#### 11.4.3 QFN 与散热焊盘\n\nQFN 的关键不是四边引脚，而是中间 **EP（Exposed Pad，裸露焊盘）**。EP 通常接 GND，既散热又接地。建库时：\n\n- EP 焊盘尺寸按手册，不能缩小；\n- EP 上开过孔（散热孔）要兼顾漏锡；\n- 钢网开孔要分区，避免锡量过多把芯片顶起。\n\n#### 11.4.4 连接器与通孔封装：机械尺寸优先\n\n连接器封装和芯片封装不一样。芯片封装主要保证电气连接，连接器还要保证“插得进、拔得出、不松动”。所以连接器的机械图比焊盘图更重要。\n\n以常见的 2.54mm 排针为例，电气上只有一排焊盘，但机械上要考虑：\n\n- 针脚直径与钻孔直径的匹配：钻孔太小插不进，太大焊锡会从孔里漏到背面；\n- 塑高与相邻元件的高度冲突：排针旁边的电解电容如果比塑高高，插拔时会挡住；\n- 针脚长度与板厚：长针适合多层板，短针适合薄板，选错会顶到外壳；\n- 固定脚/定位脚：带定位脚的连接器要在板上开对应的孔，漏画就装不进去；\n- 锁扣方向：卧式连接器的锁扣朝外还是朝内，决定板子在壳里的安装方向。\n\n通孔（Through-Hole，THT）封装的焊盘通常是环形，外径约为钻孔直径的 1.8～2.2 倍，环宽至少 0.15mm。环太窄，钻孔偏位时会切到焊盘边缘，失去连接；环太宽，相邻焊盘容易连锡。钻孔直径按引脚直径 +0.2～0.3mm，太长会漏锡，太紧插不进。\n\n连接器还要注意**装配顺序**。先焊连接器再焊周边元件，连接器的高温会二次回流周边小元件；先焊小元件再焊连接器，手工焊时烙铁会碰到已焊好的元件。课程项目建议先低后高、先小后大、先难后易，连接器放最后。\n\n#### 11.4.5 BGA 与 LGA：看不见的焊点\n\nBGA（Ball Grid Array）的焊点在芯片底部，回流后靠锡球熔化形成连接，外观检查看不到，只能靠 X 射线或边界扫描。LGA（Land Grid Array）没有锡球，靠焊盘上的锡膏和芯片焊盘接触，对共面度更敏感。\n\nBGA 建库的要点：\n\n- 焊盘直径通常略小于锡球直径，给锡球熔化后的塌陷留空间；\n- 焊盘间距（pitch）决定布线通道，0.8mm pitch 还能扇出，0.4mm pitch 需要盘中孔/盲埋孔；\n- 焊盘不能做阻焊开窗过大，否则相邻球桥连；\n- 芯片底部的散热焊盘/接地焊盘要按手册处理，不能因为“看不见”就省略；\n- 返修时需要重新植球，焊盘设计要允许锡球塌陷，不能做成过大的平面。\n\nLGA 没有锡球，焊盘上的锡膏量必须精确。钢网开孔过大，锡膏会把芯片顶起；开孔过小，接触不良。LGA 的共面度要求比 BGA 高，板子翘曲会直接导致部分引脚开路。\n\n对零基础课程，BGA 不是必做项，但必须知道它的三个事实：**焊点不可见、返修成本高、布线通道由 pitch 决定**。看到一块板上有 BGA，先问“几圈、什么 pitch、有没有 X 光”，而不是先问“多少脚”。\n\n#### 11.4.6 板对板与模块封装：先定机械接口\n\n板对板连接器、核心板、模块的封装，电气引脚只是其中一部分，机械接口才是第一约束。\n\n**板对板连接器** 有固定高度（stack height），比如 5mm、8mm、10mm。选错高度，两块板要么压得太紧，要么插不到。封装要按连接器的推荐焊盘画，同时要在板上留出配对连接器的让位空间。两块板对插时，连接器的 X/Y 方向不能反，1 脚要对 1 脚。\n\n**核心板/模块** 通常有邮票孔（castellated holes）或插针。邮票孔的焊盘要跨在板边，半圆孔的内径和外径按模块手册；插针模块要注意针脚长度和插座高度。模块下方如果有元件，要留出高度间隙，不能直接贴在底板上。\n\n**屏蔽罩** 的封装不是焊盘，而是一圈接地焊盘和框架。屏蔽罩的尺寸要和模块匹配，焊盘要连续接地，不能只打几个点。屏蔽罩内部如果还有元件，要留出取放空间，否则返修时拆不下来。\n\n**天线** 的封装更特殊：它不是焊盘，而是一块净空区。天线下方和周围不能铺铜、不能走线、不能放电池，净空尺寸按天线手册。封装里要画 Keep-Out（禁布区），否则布线时容易把天线效果破坏掉。\n\n模块化设计的好处是“接口清楚”，坏处是“机械公差累积”。两块板、连接器、外壳三者叠加，公差可能到 ±0.5mm。封装设计时要按最坏情况留间隙，不能按名义值刚好贴合。\n\n#### 11.4.7 封装热设计：焊盘也是散热器\n\n封装不只传电，也传热。同样一颗 1W 的稳压器，SOT-23 和 SOT-223 的温升可能差几十度，差别就在焊盘和铜箔面积。\n\n热量的路径是：**芯片结（Junction）→ 封装壳体/引脚 → 焊盘 → 铜箔 → 板面/空气**。每一步都有热阻，单位是 ℃/W。数据手册通常给：\n\n- `RθJA`：结到环境的热阻，整块板在自然对流下的综合值；\n- `RθJC`：结到壳的热阻，主要看封装材料；\n- `RθJB`：结到板的热阻，通过焊盘和铜箔散热。\n\n`RθJA` 不是一个固定常数，它随铜箔面积、层数、气流、邻近发热器件变化。手册给的 `RθJA` 通常是在 JEDEC 标准板上测的，你的板子铜箔面积比标准板小，实际热阻会更大。所以用 `RθJA` 算温升，只能当“下限估计”，不能当保证值。\n\n估算例子：一颗 LDO 输入 5V、输出 3.3V、负载 300mA，压差 1.7V，功耗 `P = 1.7 × 0.3 = 0.51W`。如果 `RθJA = 60℃/W`，温升约 `0.51 × 60 = 30.6℃`；环境 40℃ 时结温约 70.6℃，离 125℃ 结温上限还有余量。如果实际铜箔面积只有标准板的一半，热阻可能翻倍，结温就到 101℃，仍然能用，但余量小了很多。\n\n降额要看最坏情况：最高环境温度、最大负载、最低效率。三者不能同时取典型值。课程项目做电源模块时，宁可把 LDO 换成 Buck，也不要靠“摸起来不烫”来判断。\n\n**散热焊盘（Thermal Pad）** 的设计要点：\n\n- EP 下方铺铜，面积尽量大，但不要跨分割地；\n- 散热过孔阵列，孔径 0.3mm、间距 1.0～1.2mm，能显著降低 `RθJB`；\n- 过孔盖油还是开窗，取决于焊接工艺；盖油散热差一点，但不会漏锡；\n- 大电流路径的铜箔要加宽，热和电一起考虑。\n\n封装选型时，先算功耗，再看 `RθJA`，最后看焊盘能不能铺开铜。只比较封装大小，不看铜箔面积，热设计就是空的。\n\n### 11.5 选型与降额：BOM 与替代料\n\nBOM（Bill of Materials，物料清单）至少包含：\n\n| 字段 | 示例 | 作用 |\n|---|---|---|\n| 位号 | R1、C1、U1 | 对应 PCB 丝印 |\n| 型号 | STM32F103C8T6 | 采购/贴片 |\n| 封装 | LQFP-48 | 与封装库一致 |\n| 数量 | 1 | 采购数量 |\n| 替代料 | GD32F103C8T6 | 缺货/降本 |\n| 备注 | 不贴/选贴 | 生产说明 |\n\n替代料三条：\n\n1. **引脚兼容**：封装、引脚定义一致，不能只看“同型号不同品牌”。\n2. **参数不降级**：耐压、电流、温度、精度要满足最坏情况。\n3. **固件/驱动兼容**：MCU 替代要看 Flash/RAM/外设/时钟，不能只看脚位。\n\n#### 11.5.1 BOM 不是物料清单，是采购与生产的合同\n\n很多人把 BOM 当成“元件列表”，导出 Excel 就交差。实际上 BOM 要同时给采购、贴片厂、测试、维修四个角色看，每个角色关心的字段不同。\n\n采购关心：**型号是否唯一、是否有替代料、是否有最小起订量（MOQ）、交期多少、价格是否含税**。同一个 10k 电阻，如果 BOM 里写了五个不同厂商的料号，采购会分别询价，最后可能只买到其中三种，贴片厂停线等料。\n\n贴片厂关心：**封装、位号、贴装角度、是否 DNP（Do Not Populate，不贴）、钢网开孔**。BOM 里封装字段为空，贴片厂的程序没法编；位号重复，贴片机会把两个料贴到同一个位置；角度没标，二极管、极性电容可能贴反。\n\n测试关心：**关键料是否可测、是否有测试点、替代料是否影响测试限值**。比如把 1% 精度的采样电阻换成 5%，测试限值不变，良率会突然下降。\n\n维修关心：**位号是否可见、封装是否可手工更换、是否有替代料说明**。BGA 和 QFN 的返修需要专用设备，BOM 里最好标注“不可手工返修”或“需返修台”。\n\n所以一张可生产的 BOM 至少要有这些列：位号、数量、型号（MPN）、厂商、封装、描述、替代料、DNP/选贴、备注。课程项目可以先用最小列，但要知道每一列是给谁看的。\n\n**AVL（Approved Vendor List，合格供应商清单）** 是替代料的边界。不是“ pin to pin 就能替”，还要看温度等级、精度、耐压、认证。比如一个 16V 电容替 25V，容量一样、封装一样，但耐压降级，在 24V 电源轨上就是隐患。替代料要写清“可替条件”，不能只写一个型号。\n\n**DNP** 是“不贴”的标记。调试阶段常留一些可选元件（比如上拉、滤波、测试点），BOM 里标 DNP，贴片厂就不贴，但焊盘还在，方便后期手工补。DNP 不等于“删除”，位号要保留，否则 PCB 和 BOM 对不上。\n\n**MOQ/MPQ** 是采购的最小起订量和最小包装量。一个 0.1uF 电容可能 1000 个一卷，课程项目只用 10 个，买一卷就浪费。BOM 里可以备注“可拆零/需整卷”，让采购决定。成本核算时，要用“实际购买量”而不是“板上用量”，否则算出来的单价会偏低。\n\n#### 11.5.2 BOM 版本与变更管理\n\nBOM 不是一次性文件，它随设计变更不断更新。没有版本管理，就会出现“采购按旧 BOM 买料、贴片按新 BOM 贴片”的错位。\n\nBOM 版本号建议跟 PCB 版本号绑定，例如 `PCBA-REV-A`、`PCBA-REV-B`。每次变更要记录：\n\n- 变更位号；\n- 旧料号/新料号；\n- 变更原因（缺货、降本、改设计、修 Bug）；\n- 影响范围（哪些板、哪些批次）；\n- 验证结果（是否重新测试、是否重新认证）。\n\n**ECO（Engineering Change Order，工程变更单）** 是变更的正式记录。小项目可以简化成一张表，但要有“谁改、为什么改、什么时候生效”三个信息。没有 ECO，变更就只是口头说，过两周没人记得为什么换料。\n\n**批次追溯** 是 BOM 的另一个用途。板子上如果有一个关键料（比如电源芯片）换了批次，出现问题时能查到是哪批料、哪批板。BOM 里记录厂商和批次，配合生产记录，才能做追溯。课程项目不用做完整追溯，但要知道“BOM 不只是给采购看的，也是给问题分析看的”。\n\n**替代料验证** 不能只看参数表。替代料上板后要重新做至少三项测试：电源纹波、接口眼图/误码、温度循环。参数表一样，不代表 PCB 上的寄生参数一样。特别是 LDO、晶振、TVS，替代料的稳定性可能差很多。\n\n### 11.6 测量与仿真：封装核对\n\n#### 11.6.1 四步核对\n\n1. 打开器件手册，找 Package/Pin Configuration。\n2. 对照符号管脚号和封装焊盘号，逐个打勾。\n3. 打印 1:1 封装图，把实物放上去比对。\n4. 在 PCB 里看 3D/丝印，确认极性、1 脚、干涉。\n\n#### 11.6.1 封装核对的“三图一表”法\n\n封装核对不能只靠眼睛看 PCB 编辑器。建议同时打开三张图和一张表：\n\n三张图是**手册推荐焊盘图、符号引脚图、PCB 封装图**。把三张图并排，先对引脚号，再对焊盘尺寸，最后对 1 脚方向。引脚号对不上，后面都不用看；焊盘尺寸差超过 0.1mm，要写调整理由；1 脚方向反了，芯片焊上去就是反的。\n\n一张表是**引脚映射表**。每一行写：符号引脚号、手册引脚名、封装焊盘号、网络名、备注。三极管写 B/C/E，MOS 写 G/D/S，QFN 写 1～N 和 EP，连接器写 1～N 和 SHIELD。填完这张表，网表导入 PCB 前就能发现大部分错误。\n\n具体步骤：\n\n1. 在手册里找 Pin Configuration 和 Package Outline，截图保存；\n2. 在EDA里打开符号，记录每个引脚号对应的引脚名；\n3. 打开封装，记录每个焊盘号；\n4. 填引脚映射表，逐行核对；\n5. 在PCB里导入网表，看是否有 Unknown Pin；\n6. 打印1:1封装图，把实物放上去，检查端头是否落在焊盘内；\n7. 用3D视图检查极性、1脚、连接器方向、元件干涉；\n8. 把核对结果写进设计评审记录，不要只口头确认。\n\n**Unknown Pin** 是网表导入时最常见的报错，意思是符号里的引脚号在封装里找不到。遇到这个报错，不要急着“重新绑定”，先查是符号多了引脚、封装少了焊盘，还是编号规则不同。重新绑定只是把错误藏起来，网络可能已经接错。\n\n**1:1 打印** 是最便宜的验证。打印机可能有缩放，打印前要画一个已知尺寸的标尺（比如 10mm 线），量一下实际是不是 10mm。缩放 2% 在 0805 上可能看不出来，在 0.4mm 间距的 QFN 上就是半个焊盘。\n\n**3D 视图** 能发现二维图看不出的问题：元件高度冲突、连接器方向反、芯片压到丝印、散热器挡住螺丝孔。课程项目至少要看一遍 3D，不要等到装壳时才发现插不进。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 11-3：焊盘 toe / heel / side 三个余量<\/text>\n  <rect x=\"230\" y=\"90\" width=\"260\" height=\"90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <text x=\"330\" y=\"82\" font-size=\"12\" fill=\"currentColor\">器件本体<\/text>\n  <rect x=\"150\" y=\"105\" width=\"80\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"490\" y=\"105\" width=\"80\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"160\" y=\"205\" font-size=\"12\" fill=\"currentColor\">焊盘 1<\/text>\n  <text x=\"500\" y=\"205\" font-size=\"12\" fill=\"currentColor\">焊盘 2<\/text>\n  <line x1=\"230\" y1=\"70\" x2=\"150\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <text x=\"150\" y=\"62\" font-size=\"11\" fill=\"currentColor\">toe（外侧）<\/text>\n  <line x1=\"230\" y1=\"210\" x2=\"230\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <text x=\"238\" y=\"240\" font-size=\"11\" fill=\"currentColor\">heel（内侧）<\/text>\n  <line x1=\"150\" y1=\"240\" x2=\"150\" y2=\"285\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <text x=\"100\" y=\"300\" font-size=\"11\" fill=\"currentColor\">side（横向）<\/text>\n  <text x=\"250\" y=\"285\" font-size=\"12\" fill=\"currentColor\">内边间距先定，再向外加 toe / heel<\/text>\n<\/svg>\n```\n\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 11-4：QFN 散热焊盘与过孔（剖面示意）<\/text>\n  <rect x=\"90\" y=\"100\" width=\"260\" height=\"55\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"145\" y=\"88\" font-size=\"12\" fill=\"currentColor\">芯片本体<\/text>\n  <rect x=\"120\" y=\"155\" width=\"80\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"240\" y=\"155\" width=\"80\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"195\" font-size=\"11\" fill=\"currentColor\">引脚焊盘<\/text>\n  <text x=\"225\" y=\"218\" font-size=\"11\" fill=\"currentColor\">EP 焊盘<\/text>\n  <rect x=\"255\" y=\"173\" width=\"12\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <rect x=\"285\" y=\"173\" width=\"12\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <text x=\"310\" y=\"225\" font-size=\"11\" fill=\"currentColor\">散热过孔<\/text>\n  <rect x=\"80\" y=\"253\" width=\"300\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"90\" y=\"300\" font-size=\"12\" fill=\"currentColor\">背面铜箔 / 接地平面<\/text>\n  <text x=\"420\" y=\"120\" font-size=\"12\" fill=\"currentColor\">EP 钢网分区开孔，总面积 50%～70%；<\/text>\n  <text x=\"420\" y=\"145\" font-size=\"12\" fill=\"currentColor\">过孔盖油可减少正面漏锡，但散热略差。<\/text>\n  <text x=\"420\" y=\"170\" font-size=\"12\" fill=\"currentColor\">先保焊接，再谈散热，不能两头都想要。<\/text>\n<\/svg>\n```\n\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 11-5：从原理图到 BOM 的核对链<\/text>\n  <rect x=\"40\" y=\"70\" width=\"130\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"62\" y=\"105\" font-size=\"13\" fill=\"currentColor\">符号引脚<\/text>\n  <rect x=\"220\" y=\"70\" width=\"130\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"242\" y=\"105\" font-size=\"13\" fill=\"currentColor\">封装焊盘<\/text>\n  <rect x=\"400\" y=\"70\" width=\"130\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"422\" y=\"105\" font-size=\"13\" fill=\"currentColor\">网表网络<\/text>\n  <rect x=\"580\" y=\"70\" width=\"110\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"602\" y=\"105\" font-size=\"13\" fill=\"currentColor\">BOM 位号<\/text>\n  <line x1=\"170\" y1=\"100\" x2=\"220\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"350\" y1=\"100\" x2=\"400\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"530\" y1=\"100\" x2=\"580\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"172\" y=\"92\" font-size=\"10\" fill=\"currentColor\">引脚号<\/text>\n  <text x=\"352\" y=\"92\" font-size=\"10\" fill=\"currentColor\">网络名<\/text>\n  <text x=\"532\" y=\"92\" font-size=\"10\" fill=\"currentColor\">位号/型号<\/text>\n  <text x=\"40\" y=\"180\" font-size=\"12\" fill=\"currentColor\">任何一环编号不一致，后面的核对都失去意义；<\/text>\n  <text x=\"40\" y=\"205\" font-size=\"12\" fill=\"currentColor\">先锁引脚映射表，再导网表，最后生成 BOM。<\/text>\n  <text x=\"40\" y=\"240\" font-size=\"12\" fill=\"currentColor\">变更时四处同步改，不能只改其中一处。<\/text>\n<\/svg>\n```\n\n#### 11.6.2 BOM 检查\n\n- 位号是否重复/遗漏；\n- 封装字段是否为空；\n- 同规格料是否合并；\n- 替代料是否引脚兼容；\n- 是否有“不贴/选贴”标记。\n\n#### 11.6.2 来料检验与首件确认\n\n封装和 BOM 的错误，最终会在来料或首件上暴露。把这两步做扎实，能挡住大部分问题。\n\n**来料检验（IQC，Incoming Quality Control）** 至少看四项：\n\n1. 包装标签与 BOM 的型号、厂商、批次是否一致；\n2. 卷带/托盘上的料号、极性方向、引脚数是否正确；\n3. 实物与封装是否匹配：用卡尺量本体尺寸，用放大镜看引脚数；\n4. 湿度敏感器件（MSL）是否在有效期、是否受潮。\n\n**首件确认（FAI，First Article Inspection）** 是贴片后的第一块板，重点看：\n\n- 极性器件方向；\n- 芯片 1 脚方向；\n- 连接器是否装反；\n- 有无立碑、偏移、连锡、缺件；\n- BOM 里的 DNP 位号是否真的没贴。\n\n首件不要只看“能不能上电”。上电成功不代表焊点可靠，虚焊可能在你振动或温度循环后才失效。首件要用放大镜/显微镜看焊点形状，必要时做 X 射线查 BGA/QFN 的 EP。\n\n**封装核对记录** 要留档：引脚映射表、1:1 打印照片、3D 截图、首件照片。下次改板时，这些记录就是“上一版哪里错过”的证据，比重新猜要快。\n\n#### 11.6.3 CircuitJS\n\n```circuitjs\nled-resistor\n```\n\n封装不改变欧姆定律，但改变散热与焊盘。用 LED 限流电路复核：同一阻值下，0805 与 0603 的电流相同，功率/温升不同。\n\n#### 11.6.5 用 RC 充电类比热阻\n\n封装热问题可以先用 RC 电路建立直觉：功耗像恒流源给电容充电，热阻像电阻，热容像电容，结温就是电容上的电压。电路里 `R` 越大、`C` 越大，达到稳态越慢，稳态电压越高。\n\n```circuitjs\nrc-charge\n```\n\n看两条曲线：一条是充电电压（类比结温），一条是电流（类比热流）。改 `R` 的值，观察稳态电压和上升时间；改 `C`，观察只影响上升时间、不影响稳态。热设计里，铜箔面积主要改热阻（稳态），封装材料主要改热容（瞬态）。瞬态尖峰靠热容扛，持续发热靠热阻散。\n\n#### 11.6.4 动手任务\n\n- 建一个 0805 电阻封装和一个 SOT-23 封装。\n- 用打印机 1:1 打印，放实物比对。\n- 给一块 2 层板整理 BOM，合并重复料。\n- 故意把三极管 B/C 对调，导入 PCB，记录报错。\n\n### 11.7 常见坑\n\n1. **焊盘按“看起来差不多”建**：回流焊偏移/立碑。\n2. **符号管脚号和焊盘号不一致**：网络接错。\n3. **QFN 的 EP 没接 GND**：散热/接地不良。\n4. **1 脚标识被丝印盖住**：芯片焊反。\n5. **BOM 封装字段为空**：贴片厂无法备料。\n6. **同规格料不合并**：采购/换料成本翻倍。\n7. **替代料只看品牌**：引脚/参数不兼容。\n8. **封装库版本不锁**：今天改库，昨天投的板对不上。\n9. **连接器只画焊盘不看机械图**：插不进外壳。\n\n### 11.8 本章复盘\n\n#### 11.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 封装四要素 | 建库检查 | 焊盘/阻焊/丝印/助焊层 |\n| 焊盘号 = 符号管脚号 | 网表绑定 | 逐个核对 |\n| 阻焊开窗 ≈ 焊盘 +0.05～0.1mm | 上锡 | 按板厂能力 |\n| BOM 位号唯一 | 采购/贴片 | 不能重复 |\n| 替代料引脚兼容 | 替代 | 参数不降级 |\n\n#### 11.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 封装 | footprint | 器件在 PCB 上的焊盘图形 |\n| 推荐焊盘 | recommended land pattern | 手册给出的焊盘尺寸 |\n| 阻焊 | solder mask | 防止焊锡流到相邻焊盘 |\n| 助焊层 | paste mask | 钢网开孔 |\n| EP | exposed pad | QFN 中间裸露焊盘 |\n| BOM | bill of materials | 物料清单 |\n\n#### 11.8.3 自测 10 题\n\n1. 封装四要素是什么？\n2. 焊盘编号为什么要和符号管脚号一致？\n3. 0805 焊盘间距大概多少？\n4. QFN 的 EP 有什么作用？\n5. 阻焊开窗一般比焊盘大多少？\n6. BOM 至少要有哪些字段？\n7. 替代料要检查哪三项？\n8. 1 脚标识为什么不能压焊盘？\n9. 封装库为什么要锁版本？\n10. 连接器封装还要看什么图？\n\n#### 11.8.4 能力清单\n\n- [ ] 能按手册建 0805、SOT-23 封装。\n- [ ] 能核对符号/封装引脚映射。\n- [ ] 能整理 BOM 并合并同规格料。\n- [ ] 能检查 EP、极性、1 脚、机械干涉。\n- [ ] 能判断替代料是否可用。\n\n#### 11.8.5 下一章\n\n下一章讲**PCB 布局与布线基础**：封装建好，接下来把器件摆到板上、把网络连成铜线。你会看到布局六原则、线宽/过孔计算、铺铜和回流路径。","taskSignature":"c20ce0aac26b51eb8474d5ff701be268d5e6fe3b9b7df2760d0e7dceaa92d0d0","taskCount":5},{"id":"12","title":"第 12 章 · PCB 布局与布线基础","short":"PCB 布局与布线基础","stage":2,"diff":3,"prev":"第 09～11 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清 PCB 设计九步流程，以及每步的关键产出。\n2. 按“先大后小、先核心后外围、信号流向、热分区、接口靠边、测试点可及”六原则完成布局。\n3. 用飞线走查法检查布局是否合理，再开始布线。\n4. 按电流选线宽，按载流/工艺选过孔，理解直角/锐角的危害。\n5. 解释铺铜、接地、回流路径的关系，避免“铺了铜但回流更差”。\n6. 完成一块 2 层板的布线、铺铜、DRC 清零。\n7. 说出至少 8 个布局布线常见坑。\n\n布局决定 80% 的布线难度。布局错了，布线只能“补锅”；布局对了，布线是水到渠成。\n\n## 正文\n\n### 12.1 它解决什么问题：三个真实场景\n\n#### 场景一：去耦电容放在芯片背面，电源纹波压不下去\n\n芯片电源脚旁边没有放 100nF，电容放在板子另一头。芯片瞬间取电时，电流要跑很长一段走线，寄生电感让电源电压塌陷。不是电容没用，是放错位置。\n\n#### 场景二：晶振走线穿过电源/USB，时钟被干扰\n\n晶振输出走了一条长线，旁边是 USB 差分和 DC-DC 的 SW 节点。时钟上叠了开关噪声，MCU 跑飞。晶振要靠近芯片、包地、远离噪声源。\n\n#### 场景三：USB 差分线一长一短，眼图闭合\n\nUSB D+/D− 没有按差分对走，长度差 500mil，参考平面被电源分割。低速还能枚举，高速丢包。差分对要等长、等距、连续参考平面。\n\n### 12.2 它是什么：布局是“摆关系”，布线是“连网络”\n\nPCB 设计九步：\n\n1. 需求与方案\n2. 原理图\n3. 封装匹配\n4. 网表导入\n5. 布局\n6. 布线\n7. 铺铜\n8. DRC\n9. 生产文件\n\n**布局**解决“器件之间的相对位置”：谁靠近谁、谁远离谁、接口放哪、散热怎么走。\n**布线**解决“网络怎么连”：线宽、过孔、层、长度、参考平面。\n\n> **术语第一次出现**：飞线（ratsnest）是 PCB 软件把未布线的网络画成细线，用来提示连接关系。飞线不是电气连接，只是“应该连”。\n\n#### 12.2.1 布局六原则怎么落地\n\n“先大后小、先核心后外围、信号流向、热分区、接口靠边、测试点可及”这六条，背下来容易，摆的时候容易乱。下面按顺序说明每一步在板上做什么。\n\n**先大后小**：先把连接器、电源模块、大电容、大电感、继电器、散热器这些“占地大户”放好。它们的位置由机械结构、线缆方向、散热风道决定。大件放完，再放 MCU、晶振、小芯片，最后放电阻电容。反过来先摆小件，最后发现连接器没地方放，只能把小件全部推倒重来。\n\n**先核心后外围**：核心是“必须靠近”的组合，比如 MCU + 晶振 + 去耦电容 + 复位电路，ADC + 基准 + 模拟滤波，Buck + 电感 + 输入输出电容。先把这些组合摆成一个“功能块”，再处理块与块之间的连接。功能块内部距离优先，块间距离次要。\n\n**信号流向**：按“输入 → 处理 → 输出”的方向摆，让信号从左到右、从上到下走，避免来回折返。比如 USB 接口在板边，ESD 在接口旁，USB 差分进 MCU；DC-DC 在电源入口，输出给 MCU；继电器在输出侧，靠近端子。信号一旦折返，飞线就会交叉，布线只能绕。\n\n**热分区**：发热器件（LDO、Buck、功率电阻、LED 驱动）放在板边或通风处，远离温度敏感器件（晶振、基准、电解电容、电池）。热不是“摸起来烫”的问题，是“参数漂移”的问题。晶振在高温下频率偏移，基准在温度梯度下产生误差，电解电容在高温下寿命减半。热分区要留出铜箔和空气通道，不能把发热器件围在中间。\n\n**接口靠边**：USB、网口、DC 座、排针、天线都放在板边，插拔方向朝外。接口往里缩，外壳装不上，线缆会折。接口靠边还要留出 ESD/保护器件的位置，保护器件要在接口和内部电路之间，不能放在内部电路后面。\n\n**测试点可及**：电源轨、复位、BOOT、SWD、UART、关键模拟节点都要留测试点。测试点不能被器件盖住，不能放在 BGA 底下，不能只留 0.5mm 焊盘让探针滑。调试时最怕“知道信号在哪，但探针够不着”。\n\n六条原则冲突时，优先级是：机械/接口 > 热 > 核心功能块 > 信号流向 > 测试点 > 美观。机械装不上，后面全白搭；热出问题，参数全漂；核心块散了，布线难度指数上升。美观是最后一位，板子不是给人看的，是给电信号走的。\n\n#### 12.2.3 功能块与“地”的边界\n\n布局不只是摆器件，还要提前想“地在哪、从哪回”。一块 2 层板通常只有一层地（底层铺铜），所有回流电流都挤在这一层。功能块的地如果互相穿插，回流就会绕路。\n\n先把板子分成几个功能块：电源入口/稳压、数字核心、模拟前端、接口/保护、功率输出。每块在布局上占一个相对独立的区域，块与块之间留出“地通道”。地通道不是一条线，而是一片连续铜箔，让回流能从一个块流回电源入口。\n\n**星形接地 vs 平面接地**：星形接地是把模拟地、数字地、功率地分别走线，最后在一个点汇合。它适合低频、小电流、避免地环路；缺点是走线长、高频回流差。平面接地是整层铺铜，所有地通过平面连接。它适合高频、混合信号，但要求平面连续，不能被分割得七零八落。\n\n2 层板没有完整地平面，通常用“底层整片铺铜 + 关键区域局部地”的折中。模拟区和数字区可以在布局上分开，但底层地仍然连成一片，只在 ADC 下方留一块安静的地。不要为了“隔离”把地切成孤岛，孤岛会让回流绕更远。\n\n**地通道的宽度**：地电流和电源电流一样大，回流路径的铜宽不能按信号线算。电源入口到负载的地通道，至少和电源线同宽；大电流地要铺铜，不要只走一条细线。\n\n**连接器的地**：接口的地要在连接器附近汇入板地，ESD 电流从接口进来，先经过 TVS 到地，再流回连接器。如果接口地在板子另一头，ESD 电流会穿过整块板，把噪声耦合到所有器件。\n\n### 12.3 关键参数与设计规则\n\n| 参数 | 推荐值（2 层普通板） | 依据 |\n|---|---|---|\n| 最小线宽 | 6～8mil（0.15～0.2mm） | 板厂能力 |\n| 电源线宽 | 20～40mil 或按 1A/mm 估算 | 电流/温升 |\n| 最小间距 | 6～8mil | 板厂能力 |\n| 过孔 | 0.3/0.6mm（钻孔/焊盘） | 载流/工艺 |\n| 铜厚 | 1oz（35μm） | 常规板 |\n| 晶振包地 | 是 | 抗干扰 |\n| 去耦电容 | 每个电源脚 100nF，尽量近 | 瞬态电流 |\n\n线宽估算（经验起点，最终按 IPC/板厂）：\n\n`I ≈ k × ΔT^0.44 × A^0.725`，其中 A 是铜截面积。工程上常用简化：1oz 铜、10℃ 温升，1mm 线宽约 2～3A。实际按板厂/IPC 计算器复核。\n\n#### 12.2.2 飞线不是“线”，是布局的体检报告\n\n飞线（ratsnest）把每个未布线的网络画成一条细线，线的长度和交叉程度，直接反映布局的好坏。看飞线不是看“有没有连”，而是看四件事。\n\n**第一，看总长度**。把所有飞线长度加起来，粗略反映布线总路径。总长度越大，寄生电阻/电感越大，板子越难布。布局调整后总长度应该下降，而不是上升。\n\n**第二，看交叉**。两条飞线交叉，意味着两个网络在二维平面上必须换层或绕行。少量交叉可以接受，大量交叉说明功能块摆错了。比如电源飞线从板左到板右，信号飞线又从板右到板左，交叉成网，怎么布都绕。\n\n**第三，看长距离“孤线”**。某一条网络从板的一头拉到另一头，说明相关器件没放在一起。常见的是复位电容离 MCU 很远、晶振在板边、去耦电容在电源入口。把相关器件挪近，孤线就消失。\n\n**第四，看关键网络**。电源、地、晶振、差分、复位、BOOT 这些网络，飞线越短越好。电源飞线长，压降和噪声大；晶振飞线长，时钟易受干扰；差分飞线长且交叉，等长很难做。\n\n飞线走查的操作：布局完成后先不布线，把飞线截图；按功能块圈出交叉密集区；一次只挪一个器件，观察飞线总长度和交叉数变化；挪到“顺”为止。不要一边布线一边改布局，布好的线会挡住判断。\n\n飞线顺不等于布线一定顺，但飞线乱，布线一定乱。布局阶段花 1 小时调飞线，布线阶段能省 3 小时绕线。\n\n### 12.4 三个典型布局\n\n#### 12.4.1 电源入口与保护\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 12-1：电源入口布局：接口→保护→滤波→稳压<\/text>\n  <rect x=\"30\" y=\"70\" width=\"110\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"110\" font-size=\"13\" fill=\"currentColor\">连接器<\/text>\n  <rect x=\"180\" y=\"70\" width=\"110\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"110\" font-size=\"13\" fill=\"currentColor\">保险/TVS<\/text>\n  <rect x=\"330\" y=\"70\" width=\"110\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"355\" y=\"110\" font-size=\"13\" fill=\"currentColor\">输入电容<\/text>\n  <rect x=\"480\" y=\"70\" width=\"110\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"110\" font-size=\"13\" fill=\"currentColor\">稳压器<\/text>\n  <line x1=\"140\" y1=\"105\" x2=\"180\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"290\" y1=\"105\" x2=\"330\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"105\" x2=\"480\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"35\" y=\"200\" font-size=\"13\" fill=\"currentColor\">原则：保护器件靠近接口；输入电容紧靠稳压器输入脚；<\/text>\n  <text x=\"35\" y=\"225\" font-size=\"13\" fill=\"currentColor\">大电流走线短、粗、少换层；SW 节点远离敏感模拟区。<\/text>\n<\/svg>\n```\n\n#### 12.4.2 去耦电容与芯片\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 12-2：去耦电容布局：近、短、少过孔<\/text>\n  <rect x=\"250\" y=\"80\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"145\" font-size=\"14\" fill=\"currentColor\">MCU<\/text>\n  <text x=\"270\" y=\"170\" font-size=\"12\" fill=\"currentColor\">VDD / GND<\/text>\n  <rect x=\"300\" y=\"230\" width=\"80\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"250\" font-size=\"12\" fill=\"currentColor\">100nF<\/text>\n  <line x1=\"340\" y1=\"200\" x2=\"340\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"300\" y1=\"245\" x2=\"240\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"245\" x2=\"240\" y2=\"270\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"220\" y1=\"270\" x2=\"260\" y2=\"270\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"180\" y=\"285\" font-size=\"12\" fill=\"currentColor\">GND<\/text>\n  <text x=\"430\" y=\"110\" font-size=\"13\" fill=\"currentColor\">正确：电容紧贴电源脚，<\/text>\n  <text x=\"430\" y=\"135\" font-size=\"13\" fill=\"currentColor\">回路短，过孔少。<\/text>\n  <text x=\"430\" y=\"175\" font-size=\"13\" fill=\"currentColor\">错误：电容放远/过孔多，<\/text>\n  <text x=\"430\" y=\"200\" font-size=\"13\" fill=\"currentColor\">寄生电感抵消去耦效果。<\/text>\n<\/svg>\n```\n\n#### 12.4.3 晶振与 USB 差分\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 12-3：晶振包地与 USB 差分对<\/text>\n  <rect x=\"80\" y=\"80\" width=\"160\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"110\" font-size=\"14\" fill=\"currentColor\">MCU<\/text>\n  <rect x=\"300\" y=\"100\" width=\"80\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"315\" y=\"135\" font-size=\"12\" fill=\"currentColor\">晶振<\/text>\n  <line x1=\"240\" y1=\"130\" x2=\"300\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M295 90 Q260 70 295 50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"290\" y=\"45\" font-size=\"12\" fill=\"currentColor\">包地<\/text>\n  <text x=\"80\" y=\"230\" font-size=\"13\" fill=\"currentColor\">晶振靠近芯片，走线短，下面不走高速/电源。<\/text>\n  <line x1=\"420\" y1=\"120\" x2=\"620\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"420\" y1=\"155\" x2=\"620\" y2=\"155\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"500\" y=\"105\" font-size=\"12\" fill=\"currentColor\">D+<\/text>\n  <text x=\"500\" y=\"180\" font-size=\"12\" fill=\"currentColor\">D−<\/text>\n  <text x=\"420\" y=\"215\" font-size=\"13\" fill=\"currentColor\">USB 差分：等长、等距、同层、连续参考平面。<\/text>\n<\/svg>\n```\n\n#### 12.3.1 线宽不是拍脑袋：从电流到铜截面积\n\n线宽的底层约束是温升。电流流过铜线，功率 `P = I²R`，电阻 `R = ρL/A`，`A` 是铜线截面积（宽 × 铜厚）。截面积越小，电阻越大，温升越高。\n\nIPC-2221 给了一个常用的经验公式：\n\n`I = k × ΔT^0.44 × A^0.725`\n\n其中 `I` 是电流（A），`ΔT` 是允许温升（℃），`A` 是铜截面积（mil²），`k` 是系数：外层取 0.048，内层取 0.024。内层散热差，同样截面积能承载的电流大约只有外层的一半。\n\n算例：外层 1oz 铜（铜厚约 1.37mil），允许温升 10℃，走 2A。\n\n先算 `ΔT^0.44 = 10^0.44 ≈ 2.75`，`k × ΔT^0.44 = 0.048 × 2.75 ≈ 0.132`。\n\n`A = (I / 0.132)^(1/0.725) = (2 / 0.132)^1.379 ≈ 15.15^1.379 ≈ 41.6 mil²`。\n\n线宽 `W = A / 1.37 ≈ 30.4 mil ≈ 0.77mm`。\n\n所以 2A 电流、10℃ 温升，外层线宽至少约 0.8mm。留 50% 余量，取 1.2mm。这个结果和“1mm 约 2～3A”的经验值一致。\n\n如果同样的 2A 走内层，`k=0.024`，`A` 要翻倍，线宽约 1.5mm。内层电源线不能按外层经验值直接套。\n\n**铜厚**：1oz = 35μm，2oz = 70μm。2oz 铜的截面积翻倍，同样线宽能走更大电流，但蚀刻精度变差，细间距做不了。大电流板常用 2oz，但最小线宽要相应放大。\n\n**温升不是唯一约束**。压降也要算：`V = I × ρL/A`。长线、大电流时，压降可能比温升更早成为问题。比如 2A 走 100mm、0.5mm 宽、1oz 铜，电阻约 `ρL/A`，铜电阻率约 1.7×10⁻⁸ Ω·m，`R ≈ 1.7e-8 × 0.1 / (0.5e-3 × 35e-6) ≈ 0.097Ω`，压降约 0.19V。3.3V 轨掉 0.19V，只剩 3.1V，可能超出芯片下限。\n\n所以电源线要同时算温升和压降，取更严格的那个。课程项目用 1A 以下，0.5～0.8mm 线宽通常够；电机、继电器、LED 大电流要单独算。\n\n#### 12.4.4 回流路径：电流不是只去不回\n\n信号从驱动器出发，到接收器，还要沿地/电源平面返回源端。回流电流走“阻抗最低”的路径，通常就在信号线正下方的平面上。信号线下面的平面被分割，回流只能绕行，路径变长，电感变大，高速信号就会振铃、眼图闭合。\n\n图 12-4 画了两种情况：上面是连续地平面，回流电流紧贴信号线下方；下面是地平面被电源分割切断，回流电流被迫绕到缺口两侧，路径长了，环路面积大了。\n\n**回流路径的三条规则**：\n\n1. 信号线下方要有连续参考平面，不能跨分割；\n2. 换层时旁边放回流地过孔，让回流跟着换层；\n3. 晶振、复位、模拟信号下方不要走高速/电源，保持安静。\n\n**跨分割** 是 2 层板最常见的问题。底层铺铜被电源走线切断，信号线从缺口上方经过，回流只能绕。低速信号可能还能工作，高速信号一定出问题。解决办法：调整铺铜，让信号线下方地连续；或者把信号线移到没有缺口的位置；或者改用 4 层板，专用地平面。\n\n**回流过孔**：信号从顶层换到底层，回流也要从顶层地换到底层地。如果只打过信号过孔，没打地过孔，回流只能从远处的地过孔绕，环路面积变大。高速信号换层时，信号过孔旁边 1～2mm 内放一个地过孔。\n\n#### 12.4.6 接口与 ESD 的布线顺序\n\n接口是板子对外的“窗口”，也是 ESD、浪涌、地环路最先攻击的地方。接口布线顺序错了，保护器件就形同虚设。\n\n正确的顺序是：**连接器 → TVS/ESD → 限流/滤波 → 内部电路**。ESD 电流从连接器进来，先经过 TVS 到地，把电压钳住；残压再经过限流电阻/共模电感，才进入 MCU。如果把 TVS 放在 MCU 后面，ESD 电流已经穿过 MCU，保护来不及。\n\n**TVS 的地** 要就近连接到接口地，不能接到板子另一头的地。TVS 的钳位电流很大，地路径上的寄生电感会产生“地弹”，残压可能仍然超过 MCU 的绝对最大额定值。接口地要和板地单点连接，连接点靠近连接器。\n\n**USB/网口的差分对** 要先经过共模电感/TVS，再进 MCU。保护器件的寄生电容会影响差分阻抗，选型时要看电容值，不能只看钳位电压。高速接口的 ESD 器件电容通常要求很小，具体按协议/手册。\n\n**连接器的屏蔽壳** 要接到板地，但不要直接接到信号地。屏蔽壳的地是“机壳地”，信号地是“电路地”，两者可以通过电阻/电容或螺丝孔连接，按 EMC 设计定。课程项目简化处理：屏蔽壳接板地，但留一个 0Ω 电阻位置，方便后期调整。\n\n**接口走线不要跨分割**。连接器在板边，地板在连接器下方要连续；如果接口信号跨过电源分割，ESD 回流会绕远，保护效果下降。\n\n### 12.5 选型与降额：层数、铜厚、过孔\n\n| 项目 | 2 层板 | 4 层板 | 说明 |\n|---|---|---|---|\n| 层数 | 顶层/底层 | 信号-地-电源-信号 | 4 层有完整参考平面 |\n| 铜厚 | 1oz | 1～2oz | 大电流加铜 |\n| 过孔 | 0.3/0.6mm | 0.2/0.45mm | 按板厂 |\n| 线宽 | 6～8mil | 4～6mil | 高速/密集 |\n| 阻抗控制 | 一般不做 | 需要时做 | USB/HDMI/DDR |\n\n降额：\n\n- 电源线按计算值再留 50% 余量。\n- 过孔载流按 1A/0.3mm 钻孔估算，再留余量。\n- 连接器/铜箔边缘留 0.5mm 以上。\n\n#### 12.3.2 过孔：载流、工艺与回流\n\n过孔（via）是层间连接的“短铜柱”。它有三个独立约束：载流、工艺、回流。\n\n**载流**：过孔的铜壁很薄，常见电镀厚度 20～25μm。一个 0.3mm 钻孔的过孔，铜壁截面积大约是 `π × (0.15² − 0.125²) ≈ 0.0216mm²`，不到 1mm 宽、1oz 铜线截面积的 60%。所以一个 0.3mm 过孔大约能走 1A（还要看温升），大电流要并多个过孔。\n\n算例：2A 电源，用 0.3mm 过孔，至少并 2 个，留余量用 3～4 个。过孔间距不要太小，否则钻孔会破，板厂做不了。常见规则是过孔边到边 ≥0.3mm 或按板厂能力。\n\n**工艺**：过孔的钻孔/焊盘比（aspect ratio）是板厚除以钻孔直径。0.3mm 钻头、1.6mm 板厚，比例约 5.3:1，常规板厂能做；0.2mm 钻头就是 8:1，需要更好的板厂。课程项目用 0.3/0.6mm 过孔，是最稳的。\n\n**回流**：过孔不仅传信号，也给回流电流提供路径。顶层走线、底层地平面，回流电流要从过孔回到顶层。如果过孔离信号线太远，回流路径变长，电感增加。高速信号换层时，旁边要放回流地过孔（stitching via），让回流电流跟着换层。\n\n**过孔类型**：\n\n- 通孔（through via）：从顶层到底层，最便宜；\n- 盲孔（blind via）：从外层到内层，需要多次压合，成本高；\n- 埋孔（buried via）：只在内层之间，成本更高；\n- 盘中孔（via-in-pad）：过孔打在焊盘上，需要填孔/盖帽，否则漏锡。\n\n零基础课程只用通孔。看到 BGA 需要盘中孔时，先问“板厂能不能填孔”，不要直接画。\n\n**过孔盖油 vs 开窗**：盖油（tented）是阻焊盖住过孔，防止锡流进去；开窗（untented）是过孔裸露，可以测量/散热。电源过孔盖油，测试过孔开窗，散热过孔按热设计决定。\n\n#### 12.4.5 差分对：等长、等距、同层、连续参考\n\n差分对（D+ / D−、USB、CAN、RS485、HDMI、以太网）靠两根线的电压差传信息，共模噪声在接收端被相减抵消。差分对的四条基本要求：\n\n**等长**：两根线的长度差要控制。长度差越大，到达接收端的时间差越大，差分信号变成共模信号，眼图闭合。允许的长度差按协议/手册要求，USB 2.0 高速通常要求对内偏斜很小，具体看协议版本；课程项目按“尽量等长，长度差不超过 5mm”起步，高速接口按手册收紧。\n\n**等距**：两根线之间的间距要保持恒定。间距变化会导致差分阻抗变化，产生反射。差分对要做成“耦合对”，两根线平行走，间距等于线宽或按阻抗计算。\n\n**同层**：差分对尽量在同一层走完。换层会导致两根线的过孔数量、寄生参数不一致，等长和等距都被破坏。必须换层时，两根线一起换，过孔对称放。\n\n**连续参考**：差分对下方的参考平面要连续，不能跨分割。跨分割会让两根线的回流路径不同，共模噪声增加。\n\n**差分阻抗**：USB 2.0 通常 90Ω 差分，以太网 100Ω，CAN 120Ω。阻抗由线宽、间距、铜厚、介质厚度决定，2 层板很难控制，4 层板用阻抗计算工具算。课程项目不做阻抗控制时，至少保证等长、等距、同层、连续参考，这四条比阻抗更容易做到。\n\n**蛇形等长**：长度差需要补偿时，在短的那根线上加蛇形线。蛇形线的间距要大，不能自己耦合自己；补偿要分散，不要在一小段里绕十几圈。蛇形线会增加寄生电容，高速接口要按仿真/手册调整。\n\n#### 12.5.2 铜厚、工艺与成本\n\n铜厚（铜箔重量）用 oz 表示，1oz 约 35μm，2oz 约 70μm。铜越厚，载流能力越强，但蚀刻越难，最小线宽/间距越大，成本越高。\n\n**1oz 铜**：常规板，最小线宽 0.15mm 左右，适合大多数课程项目。电源线按 0.5～1mm 走，1A 以内没问题。\n\n**2oz 铜**：大电流板、电机驱动、电源板。载流翻倍，但最小线宽可能只能做到 0.2mm，细间距芯片的焊盘会“长胖”，需要重新建库。2oz 板的价格通常比 1oz 高，打样时要注意板厂是否支持。\n\n**铜厚与阻抗**：阻抗控制不只看线宽，也看铜厚。2oz 铜的线厚翻倍，同样线宽阻抗更低。做阻抗控制时，铜厚要写进叠层参数，不能只写“1oz 常规”。\n\n**表面处理**：HASL（热风整平）、无铅 HASL、沉金（ENIG）、沉银、OSP。HASL 便宜，适合手工焊；沉金平整，适合细间距/QFN；OSP 便宜但保存期短。课程项目用无铅 HASL 或有铅 HASL 均可，BGA/QFN 建议沉金。\n\n**成本排序**：2 层 1oz HASL < 4 层 1oz < 6 层 < 2oz < 沉金 < 盲埋孔。打样时不要一上来就选最贵的工艺，先看设计需不需要。课程项目 2 层板用常规工艺，能把钱花在反复打样上，比一次做贵板更值。\n\n### 12.6 测量与仿真：飞线走查与 DRC\n\n#### 12.5.1 层数选择：2 层、4 层、6 层怎么选\n\n层数不是越多越好，是“参考平面 + 布线通道 + 成本”的平衡。\n\n**2 层板**：顶层信号 + 底层信号/地。优点是便宜，缺点是地不完整，回流路径差，阻抗难控制。适合低速、小电流、器件少的板子，比如 LED 板、继电器板、简单控制板。2 层板布高速接口（USB 高速、以太网）很吃力，不是不能做，是要花很多时间调。\n\n**4 层板**：常见叠层是“信号-地-电源-信号”。优点是地/电源完整，回流路径短，阻抗可控；缺点是成本比 2 层高。适合有 MCU、USB、以太网、ADC 的板子。4 层板的地平面在第二层，信号换层时有完整参考，布线难度大幅下降。\n\n**6 层板**：常见叠层是“信号-地-信号-电源-地-信号”或“信号-地-信号-信号-地-电源”。适合 DDR、千兆以太网、多个高速接口。6 层板的关键是“每个信号层都有相邻参考平面”，不要为了多一层信号把地平面对拆掉。\n\n**层数选择的三条判断**：\n\n1. 有高速差分/阻抗要求 → 至少 4 层；\n2. 有 BGA/高密度器件 → 至少 4 层，看 pitch 决定是否需要盲埋孔；\n3. 只有低速、低成本 → 2 层，但要把地铺好。\n\n课程项目从 2 层板学起，不是为了让你一辈子做 2 层，而是让你理解“没有完整地平面时，回流有多难”。理解了 2 层的痛点，才知道 4 层板贵在哪、值不值。\n\n#### 12.6.6 布线顺序与层分配\n\n布线不是“从第一个网络连到最后一个”，要有顺序。顺序错了，后面线被挡住，只能绕。\n\n**推荐顺序**：\n\n1. **电源和地**：先布主电源、地通道，确定大电流路径；\n2. **关键信号**：晶振、复位、BOOT、差分、ADC 基准；\n3. **高速总线**：USB、SPI、I2C、UART，按总线分组；\n4. **普通 GPIO/LED**：最后布，允许绕；\n5. **铺铜**：最后铺地，检查孤岛。\n\n**层分配**：2 层板顶层走信号、底层走地/电源；4 层板顶层/底层走信号，内层地/电源。高速信号优先走在有完整参考的层，不要走在被分割的电源层旁边。\n\n**布线宽度**：先按电流/阻抗定宽度，再布线。不要先画细线再“加粗”，加粗会挤掉间距，DRC 报错。\n\n**过孔**：电源/地过孔先打，信号过孔后打。过孔位置要考虑回流，不要随手放。\n\n**布线顺序的反例**：先布 LED 和 GPIO，把 MCU 周围的通道占满，最后布 USB 差分，只能绕远、换层、跨分割，眼图必炸。正确做法是先把“不能绕”的线布完，再布“可以绕”的线。\n\n**布完之后的复查**：按网络高亮，逐条看关键线是否连续、参考平面是否完整、过孔是否对称；用 3D 看是否有器件干涉；用 DRC 清零；用 Gerber 查看器看生产文件。\n\n#### 12.6.1 飞线走查\n\n1. 布局完成，先不布线，看飞线。\n2. 飞线是否“顺”？有没有长距离来回交叉？\n3. 关键网络（电源、晶振、差分、复位）是否短？\n4. 接口是否靠板边？测试点是否可及？\n5. 调整布局，直到飞线“顺”再布线。\n\n#### 12.6.3 铺铜：不是“倒一片铜”就完事\n\n铺铜（copper pour）是把大面积铜箔填到空白区域，通常接 GND。它的作用有三个：提供回流路径、屏蔽干扰、散热。做不好，反而变成天线。\n\n**铺铜的四个检查**：\n\n1. **是否连到 GND**：铺铜不接网络，就是一块浮铜，会耦合噪声。铺铜属性里要指定 GND，不能只画个多边形。\n2. **是否有孤岛**：孤岛是不与主地相连的铜块，必须删掉或用过孔连到主地。孤岛会形成小天线，也会在回流时产生死区。\n3. **是否跨分割**：铺铜把地分成几块，信号线跨过缺口，回流就绕。铺铜要尽量连续，不要在信号线下方挖断。\n4. **是否离板边太近**：铜箔到板边要留 0.3～0.5mm，太近铣边时会露铜、短路。板厂能力不同，按工艺要求留。\n\n**铺铜与焊盘的热连接**：铺铜直接连焊盘，回流时散热太快，手工焊很难焊。通常用“热焊盘（thermal relief）”连接，四个小缺口减少散热。但大电流焊盘要直接连（solid connect），否则载流不够。信号焊盘用热焊盘，电源/地大焊盘用全连接，按电流决定。\n\n**铺铜不是地平面**：2 层板的铺铜是“网格状/多边形”的地，不是完整平面。它的回流效果比 4 层板的实心地平面差很多。不要把 2 层铺铜当成“完整地”，高速信号该跨分割还是跨。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 12-4：连续参考面 vs 跨分割的回流路径<\/text>\n  <line x1=\"80\" y1=\"80\" x2=\"520\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"70\" font-size=\"12\" fill=\"currentColor\">信号线<\/text>\n  <rect x=\"80\" y=\"120\" width=\"440\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"90\" y=\"145\" font-size=\"11\" fill=\"currentColor\">连续地平面<\/text>\n  <path d=\"M120 105 L120 120 M200 105 L200 120 M300 105 L300 120 M420 105 L420 120\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"540\" y=\"105\" font-size=\"12\" fill=\"currentColor\">回流紧贴下方，路径短<\/text>\n  <line x1=\"80\" y1=\"210\" x2=\"520\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"80\" y=\"250\" width=\"180\" height=\"35\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"300\" y=\"250\" width=\"220\" height=\"35\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"90\" y=\"272\" font-size=\"11\" fill=\"currentColor\">地平面<\/text>\n  <text x=\"310\" y=\"272\" font-size=\"11\" fill=\"currentColor\">电源分割<\/text>\n  <path d=\"M245 235 L245 300 L230 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <path d=\"M295 235 L295 300 L310 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <text x=\"330\" y=\"310\" font-size=\"11\" fill=\"currentColor\">回流被迫绕行，环路变大<\/text>\n<\/svg>\n```\n\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 12-5：差分对等长与蛇形补偿<\/text>\n  <line x1=\"80\" y1=\"100\" x2=\"620\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"80\" y1=\"140\" x2=\"620\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"88\" font-size=\"12\" fill=\"currentColor\">D+<\/text>\n  <text x=\"80\" y=\"162\" font-size=\"12\" fill=\"currentColor\">D−<\/text>\n  <path d=\"M420 140 L440 120 L460 140 L480 120 L500 140 L520 120 L540 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"430\" y=\"185\" font-size=\"12\" fill=\"currentColor\">蛇形补偿：分散、间距大、不自己耦合<\/text>\n  <text x=\"80\" y=\"220\" font-size=\"12\" fill=\"currentColor\">等距：两根线间距恒定；同层：一起走完再换层；<\/text>\n  <text x=\"80\" y=\"245\" font-size=\"12\" fill=\"currentColor\">连续参考：下方地平面不能断开。<\/text>\n  <text x=\"80\" y=\"285\" font-size=\"12\" fill=\"currentColor\">长度差按协议/手册；课程项目先控制在 5mm 内。<\/text>\n<\/svg>\n```\n\n#### 12.6.2 DRC\n\n- 间距、线宽、过孔、阻焊、丝印全部清零；\n- 未布线网络为 0；\n- 检查孤岛铜、天线铜、锐角。\n\n#### 12.6.4 直角、锐角与阻抗突变\n\n“走线不能有直角”这句话，要分情况。低频、低速、小电流的板子，直角走线的影响很小，更多是美观和蚀刻工艺问题。高速、高压、射频的板子，直角/锐角会带来阻抗突变和尖端放电。\n\n**直角的问题**：\n\n- 阻抗突变：直角处线宽有效截面变化，阻抗不连续，高速信号反射；\n- 尖端放电：高压/射频下，尖角处电场集中，容易击穿/打火；\n- 蚀刻残留：锐角处药水流动差，容易过蚀刻或残留铜。\n\n**处理办法**：高速信号用 45° 折线或圆弧；高压/射频用圆弧；普通低速信号不必强求，但不要做锐角（小于 90°）。课程项目统一用 45° 折线，既好看又不容易出工艺问题。\n\n**阻抗突变** 不只来自直角，还来自线宽变化、过孔、焊盘、连接器。高速信号每遇到一个突变，就会反射一部分能量。眼图闭合往往是多个小突变累积的结果，不是某一个直角造成的。所以不要只盯着直角，要看整条线的连续性。\n\n**包地**：高速/时钟线两侧包地，可以减小串扰。包地过孔要密集，间距小于信号上升沿对应波长的 1/10 太苛刻，课程项目按 5mm 间距打地过孔即可。包地不接地过孔，等于没包。\n\n#### 12.6.3 CircuitJS 观察开关环路\n\n```circuitjs\npower-buck\n```\n\n观察 SW 节点电流环路。PCB 上这条环路要最短，输入电容紧靠开关管和地。\n\n#### 12.6.5 DRC 清零之后的五项人工复核\n\nDRC（Design Rule Check）能查间距、线宽、过孔、阻焊、丝印，但查不出“布局是否合理、回流是否连续、散热是否够”。DRC 清零只是及格，下面五项要人工看。\n\n**第一，未布线网络是否为 0**。DRC 有时把“未布线”当警告，不看就漏。导入生产文件前，确认飞线全消失。\n\n**第二，电源/地是否连到所有引脚**。用网络高亮，逐个电源脚看有没有连；用“地过孔”检查地平面是否连通。特别是 MCU 的每个 VDD 脚，旁边要有去耦电容和地过孔。\n\n**第三，丝印是否压焊盘**。DRC 可能只报“丝印到焊盘间距”，但压住一半的位号可能不报。放大看每个器件，位号是否可读、极性是否可见。\n\n**第四，测试点是否可及**。把测试点高亮，看探针能不能碰到；有没有被高元件挡住；地测试点是否在旁边。\n\n**第五，板边/安装孔是否干涉**。连接器、螺丝孔、外壳卡扣、天线净空区，都要按机械图复核。DRC 不管机械，3D 视图和 1:1 打印才能看出来。\n\n这五项做完，再导出 Gerber。导出后还要用 Gerber 查看器看一遍：钻孔、阻焊、丝印、铜层是否对齐；有没有缺层、镜像、偏移。DRC 是软件规则，Gerber 是生产文件，两者都要过。\n\n#### 12.6.7 用 RC 低通看走线寄生\n\n一段走线不是理想导线，它有电阻、电感、对地电容。低速时看不出，高速时它像一个低通滤波器，把边沿磨圆、把高频分量滤掉。\n\n```circuitjs\nrc-lowpass-159\n```\n\n把信号源频率逐步升高，看输出幅度怎么掉。截止频率 `fc = 1/(2πRC)`，`R` 是走线电阻+驱动内阻，`C` 是走线对参考面的电容。走线越长，`C` 越大，`fc` 越低，边沿越慢。改 `R` 或 `C`，观察幅度和相位变化；这就是“走线太长导致信号变差”的电路解释。\n\n#### 12.6.4 动手任务\n\n- 给一块 2 层 LED 板做布局，用飞线走查法自检。\n- 按 1A 电流算一条电源线宽。\n- 完成布线、铺铜、DRC 清零，截图记录。\n\n### 12.7 常见坑\n\n1. **先布线后布局**：布线绕远、交叉，最后返工。布局阶段改一个器件只要几分钟，布完线再改要拆几十根线。\n2. **去耦电容放远**：电源纹波压不下去。电容的回路包括走线、过孔、焊盘，任何一段长都会增加寄生电感。\n3. **晶振不包地/走长线**：时钟被干扰。晶振输出是周期信号，旁边一根开关走线就能把噪声叠上去。\n4. **差分对不等长**：USB/HDMI 丢包。长度差变成时间差，共模抑制变差，眼图闭合。\n5. **电源线太细**：大电流发热/掉压。温升和压降要同时算，不能只看“能通电”。\n6. **过孔太多/太小**：载流不够、工艺做不出。过孔不是越多越好，间距太小会破孔。\n7. **铺铜不接 GND 或孤岛**：形成天线。浮铜会耦合噪声，孤岛会让回流出现死区。\n8. **直角/锐角走线**：高速/高压下尖端放电/阻抗突变。低速板也要避免锐角，蚀刻容易残留。\n9. **丝印压焊盘**：上锡不良。丝印油墨会阻碍锡膏润湿，回流后留下白色残留。\n10. **不留测试点**：调试时无法下探针。测试点要在布局阶段就留，布完线再加会挤掉走线。\n\n### 12.8 本章复盘\n\n#### 12.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 九步流程 | 设计顺序 | 布局前先想清楚 |\n| 1oz 铜、10℃ 温升，1mm≈2～3A | 线宽估算 | 按 IPC/板厂复核 |\n| 去耦电容紧靠电源脚 | 瞬态电流 | 回路短、过孔少 |\n| 差分对等长/等距/同层 | 高速 | 长度差按协议要求 |\n| 晶振包地、靠近芯片 | 时钟 | 下方不走高速 |\n\n#### 12.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 布局 | placement | 摆器件位置 |\n| 布线 | routing | 把网络连成铜线 |\n| 飞线 | ratsnest | 未布线的连接提示 |\n| 过孔 | via | 连接不同层的孔 |\n| 铺铜 | copper pour | 大面积铜箔 |\n| 回流 | return current | 电流返回源头的路径 |\n| DRC | design rule check | 设计规则检查 |\n\n#### 12.8.3 自测 10 题\n\n1. PCB 九步流程是什么？\n2. 布局六原则有哪些？\n3. 飞线走查法看什么？\n4. 1oz 铜、1mm 线宽大概能走多少电流？\n5. 去耦电容为什么必须靠近电源脚？\n6. 晶振布局要注意什么？\n7. USB 差分对的三条基本要求？\n8. 铺铜为什么要接 GND？\n9. 直角走线有什么问题？\n10. DRC 清零前还要检查什么？\n\n#### 12.8.4 能力清单\n\n- [ ] 能完成 2 层板布局并用飞线走查。\n- [ ] 能按电流选线宽/过孔。\n- [ ] 能处理去耦、晶振、差分三条关键规则。\n- [ ] 能铺铜、DRC 清零。\n- [ ] 能说出布局布线常见坑。\n\n#### 12.8.6 一块 2 层板的 layout 评审清单\n\n把这块板交给别人评审前，先自己过一遍下面 20 条。每一条都能在图上指出来，不要只写“已检查”。\n\n布局：\n\n1. 连接器都在板边，插拔方向朝外；\n2. 电源入口→保护→滤波→稳压的顺序没有折返；\n3. 去耦电容在每个电源脚 3mm 内；\n4. 晶振靠近 MCU，下面没有走高速/电源；\n5. 发热器件在板边/通风处，远离晶振和基准；\n6. 安装孔、螺丝、外壳卡扣没有和器件干涉；\n7. 测试点没被器件盖住，探针可及。\n\n布线：\n\n8. 电源线宽按电流算过，留 50% 余量；\n9. 地通道和电源线同宽，大电流地铺铜；\n10. 晶振线短、包地、下方地连续；\n11. USB 差分等长、等距、同层、参考连续；\n12. 复位/BOOT 线远离 SW 节点和时钟；\n13. 过孔载流够，电源过孔并了多个；\n14. 信号换层旁边有回流地过孔；\n15. 没有锐角，高速线没有跨分割；\n16. 丝印不压焊盘，极性/1 脚可见。\n\n生产：\n\n17. DRC 清零，未布线网络为 0；\n18. 铺铜接 GND，无孤岛，离板边 0.3mm 以上；\n19. Gerber 各层对齐，钻孔/阻焊/丝印不缺；\n20. BOM 封装字段齐全，DNP 位号标清。\n\n评审时不要只说“这里不好”，要说“哪条规则、改成什么、为什么”。比如“U1 的去耦 C3 离 VDD 8mm，瞬态电流回路太长，移到 U1 下方 2mm”。可执行的评审意见，才是有效的评审。\n\n#### 12.8.5 下一章\n\n下一章讲**电源模块与电源树**：板子上所有器件都要供电，电源布局是 PCB 布局里最不能妥协的一块。你会看到 LDO、Buck、Boost、电源树和热设计。","taskSignature":"fee97ec30e53724b5608980db926f3bab0441682bae7649e80e9078244b35fb4","taskCount":5},{"id":"13","title":"第 13 章 · 电源模块与电源树","short":"电源模块与电源树","stage":2,"diff":4,"prev":"第 12 章 PCB 布局与布线基础","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 画出 Buck、Boost、LDO 三种基本电源拓扑，并说清电流路径。\n2. 根据输入/输出/电流/效率/成本做电源方案选型，画出电源树。\n3. 选输入电容、输出电容、电感、反馈分压电阻，并做最坏情况核算。\n4. 解释电源 PCB 布局的六条军规：输入电容紧靠、SW 短粗、环路最小、FB 远离噪声、单点接地、散热过孔。\n5. 计算 LDO 的功耗与温升，判断什么时候必须用 DCDC。\n6. 用万用表/示波器测电源轨、纹波、负载瞬态。\n7. 说出至少 8 个电源设计常见坑。\n\n电源是板子的心脏。电源设计错，后面 MCU、运放、接口全部跟着出问题；电源布局错，纹波和噪声会让“能亮”变成“不稳定”。\n\n## 正文\n\n### 13.1 它解决什么问题：三个真实场景\n\n#### 场景一：12V 输入，MCU 要 3.3V，直接上 LDO 烫手\n\n12V 降到 3.3V，压差 8.7V。如果负载 500mA，LDO 功耗 `P=(12−3.3)×0.5≈4.35W`，TO-220 不加散热片直接超温。这种场景要用 Buck，效率 85% 以上，损耗只有 0.3W 左右。\n\n#### 场景二：Buck 输出纹波大，ADC 读数抖\n\nBuck 的 SW 节点高频开关，输出有纹波。ADC 直接吃 Buck 输出，采样值跳。要在 Buck 后加 LC 滤波或 LDO 二级稳压，模拟电源和数字电源分开。\n\n#### 场景三：电源上电时序不对，FPGA 起不来\n\n多路电源有上电顺序：核心电压先、IO 后，或者反过来。顺序错了，芯片内部二极管倒灌，起不来/损坏。PMU 或电源使能电路要按手册时序设计。\n\n### 13.2 它是什么：三种电源与一棵树\n\n- **LDO**（Low Dropout Regulator，低压差线性稳压器）：像“可变电阻”，多余能量变热。优点：纹波小、外围少；缺点：压差大时效率低。\n- **Buck**（降压开关电源）：开关+电感+电容，把高电压降为低电压。优点：效率高；缺点：纹波/EMI/布局敏感。\n- **Boost**（升压开关电源）：电感储能后抬压。优点：输入低于输出时可用；缺点：输入电流大、环路复杂。\n\n**电源树**：把“输入→各级稳压→负载”画成树，标出每路电压、电流、效率、时序。\n\n> **术语第一次出现**：SW 节点是 Buck/Boost 中开关管与电感连接的点，电压在高频来回跳变，是最大的噪声源。布局时 SW 走线要短、粗，远离 FB/模拟区。\n\n#### 13.2.1 Buck 的电流路径：两个阶段，两个环路\n\nBuck 不是“把电压直接变低”，而是通过开关和电感把能量“打包”再释放。理解 Buck，先理解两个阶段。\n\n**第一阶段，高边开关导通**：电流从 Vin 出发，经过高边开关、电感，流向输出电容和负载。电感电流线性上升，能量储存在电感磁场里。此时低边开关关断，SW 节点接近 Vin。\n\n**第二阶段，高边开关关断**：电感电流不能突变，必须继续流。低边开关（或续流二极管）导通，电流从地经过低边开关、电感，继续流向输出。电感电流线性下降，能量释放给负载。此时 SW 节点接近地（减去低边压降）。\n\n两个阶段合起来，电感电流是一个三角波，平均值等于输出电流。占空比 `D = Vout / Vin`（连续导通模式，忽略损耗），高边导通时间占一个周期的 `D`，低边占 `1−D`。\n\n**两个环路**：\n\n- 环路一：输入电容 → 高边开关 → 电感 → 输出电容 → 地 → 输入电容。高边导通时，这个环路承载脉冲电流。\n- 环路二：低边开关 → 电感 → 输出电容 → 地 → 低边开关。高边关断时，这个环路承载续流电流。\n\n这两个环路的面积都要小，尤其是环路一。输入电容紧靠高边开关和低边开关，就是为了让脉冲电流在电容本地闭合，不跑到输入电源去。输入电容远了，脉冲电流会沿着长走线流，寄生电感产生电压尖峰，EMI 和纹波都变差。\n\n**为什么 SW 节点是噪声源**：SW 节点在 Vin 和地之间快速跳变，`dV/dt` 很大，通过寄生电容耦合到附近走线。SW 走线要短、粗，下面尽量不要有敏感信号；FB 走线要远离 SW 和电感。\n\n**同步 vs 非同步**：同步 Buck 用低边 MOSFET 代替续流二极管，效率高，但低边开关的控制更复杂；非同步 Buck 用肖特基二极管，简单便宜，但二极管压降带来损耗。课程项目小电流用非同步，大电流用同步。\n\n### 13.3 关键参数与手册\n\n| 参数 | 含义 | 选型注意 |\n|---|---|---|\n| Vin 范围 | 输入电压范围 | 覆盖最高/最低，留 20% |\n| Vout | 输出电压 | 反馈电阻决定 |\n| Iout | 最大输出电流 | 按峰值/瞬态，不按典型 |\n| 效率 | 输出/输入 | 轻载效率也看 |\n| 开关频率 | fsw | 高→电感小、EMI 难；低→电感大 |\n| 压差 Dropout | LDO 维持稳压的最小 Vin−Vout | 低压差场景关键 |\n| 静态电流 Iq | 空载消耗 | 电池产品关键 |\n| 纹波 | 输出波动 | ADC/射频要低 |\n| 热阻 θJA | 封装散热 | 算温升 |\n\nLDO 功耗：\n\n`P_loss = (Vin − Vout) × Iout + Vin × Iq`\n\n温升：\n\n`ΔT = P_loss × θJA`\n\n例：Vin=5V，Vout=3.3V，Iout=300mA，θJA=50℃/W：\n\n`P=(5−3.3)×0.3=0.51W`，`ΔT=0.51×50≈25.5℃`，环境 40℃ 时结温约 65.5℃，可接受。若 Vin=12V，则 `P≈2.61W`，`ΔT≈130℃`，必须换 Buck。\n\n#### 13.2.2 Boost 与 LDO：不同场合的三条路\n\n**Boost（升压）** 的电流路径和 Buck 相反：电感先储能，再和输入一起把能量送给输出。\n\n第一阶段，开关导通：电流从 Vin 经过电感到地，电感电流上升，能量储存。输出电容单独给负载供电。\n\n第二阶段，开关关断：电感电流不能突变，电感电压抬升，电流经过二极管流向输出电容和负载。输出电压高于输入。\n\nBoost 的输入电流是连续的（电感在输入侧），输出电流是脉冲的（二极管只在关断时导通），所以输出电容要承受较大的纹波电流。Boost 的环路更复杂，布局要求更高。\n\n**LDO** 像一个“可变电阻”，把多余的电压变成热。它的优点是输出纹波小、外围器件少、没有开关噪声；缺点是压差大时效率低。\n\nLDO 的效率近似 `η ≈ Vout / Vin`。12V 转 3.3V，效率只有 27.5%，剩下 72.5% 全变成热。5V 转 3.3V，效率 66%，还能接受。所以 LDO 适合“压差小、电流小、噪声敏感”的场合，比如 5V 转 3.3V 给 MCU/ADC，或者 Buck 后级再稳压给模拟电路。\n\n**LDO 的压差（Dropout）** 是它维持稳压的最小 `Vin−Vout`。普通 LDO 压差可能 1～2V，低压差 LDO 可以做到几百 mV。电池供电时，输入电压随电量下降，如果压差不够，输出会跟着掉。选 LDO 要看“最低输入电压时的压差”，不能只看标称。\n\n**三条路的选型**：\n\n- 输入高于输出、压差大、电流大 → Buck；\n- 输入高于输出、压差小、噪声敏感 → LDO；\n- 输入低于输出 → Boost；\n- 电池供电、要长待机 → 低 Iq 的 Buck 或 LDO；\n- 多路输出、有时序要求 → PMU 或多路使能。\n\n没有“最好的拓扑”，只有“这个场景最合适的拓扑”。\n\n### 13.4 三个典型电源电路\n\n#### 13.4.1 Buck 降压\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 13-1：Buck 拓扑：高边开关、低边开关、电感、输出电容<\/text>\n  <text x=\"40\" y=\"115\" font-size=\"13\" fill=\"currentColor\">Vin<\/text>\n  <line x1=\"80\" y1=\"110\" x2=\"160\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"160\" y1=\"110\" x2=\"160\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"140\" y1=\"150\" x2=\"180\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"158\" x2=\"170\" y2=\"158\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"160\" y1=\"158\" x2=\"160\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"140\" y1=\"190\" x2=\"180\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"185\" y=\"170\" font-size=\"11\" fill=\"currentColor\">Cin<\/text>\n  <rect x=\"180\" y=\"95\" width=\"70\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"195\" y=\"115\" font-size=\"11\" fill=\"currentColor\">HS<\/text>\n  <line x1=\"250\" y1=\"110\" x2=\"300\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"265\" y=\"100\" font-size=\"11\" fill=\"currentColor\">SW<\/text>\n  <line x1=\"300\" y1=\"110\" x2=\"300\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"270\" y=\"150\" width=\"60\" height=\"35\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"278\" y=\"172\" font-size=\"10\" fill=\"currentColor\">LS/二极管<\/text>\n  <line x1=\"300\" y1=\"185\" x2=\"300\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"285\" y1=\"215\" x2=\"315\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"325\" y=\"220\" font-size=\"11\" fill=\"currentColor\">GND<\/text>\n  <path d=\"M300 110 Q320 90 340 110 Q360 130 380 110\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"325\" y=\"82\" font-size=\"11\" fill=\"currentColor\">L<\/text>\n  <line x1=\"380\" y1=\"110\" x2=\"460\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"430\" y=\"100\" font-size=\"11\" fill=\"currentColor\">Vout<\/text>\n  <line x1=\"460\" y1=\"110\" x2=\"460\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"150\" x2=\"480\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"450\" y1=\"158\" x2=\"470\" y2=\"158\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"158\" x2=\"460\" y2=\"195\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"195\" x2=\"480\" y2=\"195\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"490\" y=\"165\" font-size=\"11\" fill=\"currentColor\">Cout<\/text>\n  <line x1=\"460\" y1=\"110\" x2=\"540\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"540\" y=\"110\" width=\"60\" height=\"85\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"552\" y=\"150\" font-size=\"11\" fill=\"currentColor\">负载<\/text>\n  <line x1=\"540\" y1=\"195\" x2=\"540\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"520\" y1=\"220\" x2=\"560\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"275\" font-size=\"13\" fill=\"currentColor\">环路：输入电容→高边开关→电感→输出电容→地，越小越好。<\/text>\n<\/svg>\n```\n\n#### 13.4.2 LDO 线性稳压\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 13-2：LDO：压差全部变成热<\/text>\n  <text x=\"40\" y=\"95\" font-size=\"13\" fill=\"currentColor\">Vin<\/text>\n  <line x1=\"80\" y1=\"90\" x2=\"140\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"140\" y=\"60\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"160\" y=\"95\" font-size=\"13\" fill=\"currentColor\">LDO<\/text>\n  <text x=\"155\" y=\"115\" font-size=\"11\" fill=\"currentColor\">IN  OUT<\/text>\n  <line x1=\"260\" y1=\"90\" x2=\"360\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"330\" y=\"80\" font-size=\"13\" fill=\"currentColor\">Vout<\/text>\n  <line x1=\"360\" y1=\"90\" x2=\"360\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"330\" y=\"140\" width=\"60\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"340\" y=\"160\" font-size=\"11\" fill=\"currentColor\">负载<\/text>\n  <line x1=\"360\" y1=\"170\" x2=\"360\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"340\" y1=\"210\" x2=\"380\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"210\" font-size=\"12\" fill=\"currentColor\">GND<\/text>\n  <text x=\"400\" y=\"95\" font-size=\"13\" fill=\"currentColor\">P = (Vin−Vout)×Iout<\/text>\n<\/svg>\n```\n\n#### 13.4.3 电源树\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 13-3：12V 输入电源树<\/text>\n  <rect x=\"280\" y=\"55\" width=\"120\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"310\" y=\"85\" font-size=\"13\" fill=\"currentColor\">12V 输入<\/text>\n  <line x1=\"340\" y1=\"105\" x2=\"340\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"260\" y=\"140\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"285\" y=\"170\" font-size=\"13\" fill=\"currentColor\">Buck → 5V/2A<\/text>\n  <line x1=\"340\" y1=\"190\" x2=\"340\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"260\" y=\"220\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"285\" y=\"250\" font-size=\"13\" fill=\"currentColor\">LDO → 3.3V/0.5A<\/text>\n  <line x1=\"260\" y1=\"245\" x2=\"150\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"50\" y=\"235\" font-size=\"12\" fill=\"currentColor\">MCU/数字<\/text>\n  <line x1=\"260\" y1=\"160\" x2=\"150\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"50\" y=\"150\" font-size=\"12\" fill=\"currentColor\">USB/继电器<\/text>\n  <line x1=\"420\" y1=\"245\" x2=\"520\" y2=\"245\" stroke=\"currentColor\" stroke-wi
