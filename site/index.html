高效的提升手段。\n\n### 26.5 按成果推进，而非按时间推进\n\n跟随 README 中的学习顺序，完成电路计算、简单板、MCU 项目和模块分析等阶段成果。遇到知识缺口及时回看对应章节；资源用于补充当前问题，不必同时追完全部教程。高速项目在资料、工具和工艺满足条件后再开展。\n\n### 26.6 入行后的进阶方向\n\n- **高速数字**：Bogatin 全书 → Fedevel 付费进阶课 → 10Gbps+ SerDes/DDR5 项目\n- **射频/无线**：史密斯圆图与匹配网络 → 天线设计 → WiFi/BT/4G/5G 产品\n- **电源专家**：LTspice 深度仿真 → 大功率/高密度电源（填孔盘上过孔 POFV 散热、多相）→ 高功率密度电源（服务器电源、汽车 OBC）\n- **模拟/传感**：低噪声设计、精密测量、ADC/DAC 系统\n- **技术管理**：设计规范制定、DFM 体系建设、带团队与供应商管理\n\n持续学习的两个习惯：**每周精读一份芯片数据手册**；**每个项目复盘沉淀一页经验**——五年后你和别人的差距就在这两个习惯里。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 按你当前所在阶段，从 26.1 挑一个视频系列，配套当前课程同步看 | 完成该系列并记录 3 条与本课程互补的知识点 |\n| 2 | 在立创开源平台找一个与你实战项目同平台的开源工程，下载源文件对照 | 写一页对比笔记：布局分区/布线策略/自己可借鉴的 5 个细节 |\n| 3 | 安装 LTspice 并跑通官方自带的示例电路 | 截图一张瞬态仿真波形 |\n| 4 | 把本课书单按你的阶段排序，确定下一本要读的书 | 写出选择理由和准备解决的问题 |\n\n## ✅ 自测清单\n\n- [ ] 我知道每个学习阶段对应的至少 2 个免费视频资源\n- [ ] 我知道去哪里下载开源 PCB 工程源文件，以及\"先画后抄再对比\"的正确姿势\n- [ ] 我知道 LTspice、CircuitJS 各自适合什么场景\n- [ ] 我能说出 3 本 SI/PI/EMC 领域的经典书及其作者\n- [ ] 我收藏了至少 2 个能提问求助的社区\n- [ ] 我能根据 README 的先修关系和阶段成果确定下一步学习任务\n\n## ⚠️ 新手常见坑\n\n1. **收藏 ≠ 学会**：资源收藏夹满满、一课没学完是最常见的\"学习幻觉\"。选定一条主线（本课程），资源只做配菜。\n2. **教程囤积症**：入门教程看三套不如跟一套做完所有练习。同一主题的视频超过两套就该警惕。\n3. **只看不做**：PCB 是手上功夫，每课的动手练习是主线不是选修。\n4. **迷信付费课**：入门到就业所需的内容网上免费资源完全覆盖；付费的价值在于督学与答疑，不是内容本身。\n5. **追新版本教程**：AD19 和 AD25 的核心操作差异极小，不必非等最新版教程——软件操作只占 PCB 能力的一小部分。\n\n## 📚 延伸学习\n\n- 本课程各课末尾的「延伸学习」小节已按知识点给出搜索关键词，与本课资源地图配合使用\n- 求职季回到第 24 课，把本课资源里做过的项目整理进作品集","taskSignature":"1fd5a99472b0a78c06f02e1af93e491aa3a1585ec78b073294bd7e07a90db2eb","taskCount":6}],"readmeMd":"> 从电学基础到 PCB 设计、制作与验证。以理解、练习、实物验证和复盘为推进依据，不以课时或月份作为完成标准。\n\n## 使用方法\n\n课程按建议学习顺序重新编号。基础课先学能支撑下一步实践的部分；焊接、工程实践与测试的进阶章节可在项目推进时回看。练习从安全低压电路开始；市电、锂电池及高风险维修只在具备明确条件和指导时学习。\n\n项目成果分为**设计练习、参考工程解读和实物验证**。只有实际完成并保留记录，才能标注为实测通过。STM32 示例固件仅完成编译与镜像结构检查，尚未下载或在实板运行。\n\n## 学习路径与练习资料\n\n先从安全低压测量、基础器件和典型电路入手；学完第 04、05 课的相关内容后，练习传感器、比较器与驱动。完成第 07～09 课的 EDA 与基础焊接后，可继续开展首板、循迹小车和 STM32 项目。以下练习资料与 26 课并行使用，不改变课号和原有学习勾选项。\n\n- [基础练习与实验记录手册](#/resource/6a69fbba188b2ab2)：限流、分压、滤波、开关和比较器的带答案练习与实验记录表。\n- [模拟电路进阶练习](#/resource/fc9c44ec59d84fc6)：运放、高低端电流检测、恒流反馈、比较器迟滞与跨阻放大的带答案练习。\n\n新项目的设计、仿真、规则检查、生产准备与实板测试分别记录；没有实际结果的项目保持待验证。初学练习只使用合适的隔离低压供电。\n\n## 学习路线与阶段验收\n\n### 一、电学、器件与测量基础\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 01 | [电学基本概念](#/lesson/01) | 电压、电流、电阻、功率与安全低压入门 |\n| 02 | [电路分析基本功](#/lesson/02) | 串并联、分压、负载和功率计算 |\n| 03 | [电容、电感与电信号](#/lesson/03) | 电容、电感、RC 与电信号专题：波形、频率和 PWM |\n| 04 | [硬件基础](#/lesson/04) | 七类器件的原理、典型电路、选型与练习 |\n| 05 | [常见电路基础](#/lesson/05) | 数字、转换、模拟、电源和变压器五类电路与常见方案 |\n| 06 | [电子测量与仪器使用基础](#/lesson/06) | 万用表、电源、示波器和基础测量 |\n\n**阶段验收：**能分析基本电路，识别元件和参数，在安全低压条件下完成基础测量并记录。\n\n### 二、EDA、PCB 与基础制作\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 07 | [EDA 软件入门](#/lesson/07) | 工程、符号、网络、库与原理图操作 |\n| 08 | [焊接与返修实操](#/lesson/08) | 焊接工具、安全、插件与贴片；返修按需深入 |\n| 09 | [PCB 设计基础](#/lesson/09) | 封装、布局、布线、DRC 与简单板 |\n| 10 | [电源模块](#/lesson/10) | 电源模块选型、LDO、DC-DC、电流预算、布局与热设计 |\n| 11 | [接口模块](#/lesson/11) | 先学 USB 基础，其他接口结合项目深入 |\n| 12 | [其他模块与综合案例](#/lesson/12) | 先学时钟和复位，其他模块结合项目深入 |\n\n**阶段验收：**能画简单原理图和 PCB，说明焊接、供电、接口、时钟和复位的基本要求。第 08 课先学安全和基础焊接。\n\n### 三、单片机与第一块项目板\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 13 | [单片机基础与 STM32 入门](#/lesson/13) | GPIO、按键、串口、定时器、中断与调试 |\n| 14 | [项目实战 · 2 层板 · STM32 开发板](#/lesson/14) | 设计、制作和验证 STM32 教学板 |\n| 15 | [工程实践补充](#/lesson/15) | 生产文件、选型、首次上电与设计评审 |\n| 16 | [硬件测试与可靠性验证](#/lesson/16) | 测试用例、仪器进阶和可靠性 |\n| 17 | [经典开源工程解读实战](#/lesson/17) | 阅读成熟工程，比较电路与布局 |\n\n**阶段验收：**理解程序与硬件的关系，完成设计或参考工程分析，并分别记录制作、下载和实测状态。第 15、16 课中生产文件、首次上电与测量部分在第 14 课动手时提前查阅。\n\n### 四、多层板与专项进阶（按目标选学）\n\n本阶段是按需要选择的进阶路线；H3、RK 项目目前侧重设计练习与参考工程解读，不是已完成的实板。\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 18 | [存储模块](#/lesson/18) | 存储接口与 DDR 基础 |\n| 19 | [专项技能强化](#/lesson/19) | 回流、阻抗、SI、PI 与 DFM |\n| 20 | [项目实战 · 4 层板 · H3 机顶盒](#/lesson/20) | H3 四层板设计练习 |\n| 21 | [项目实战 · 6 层板 · RK3576 AI 主板](#/lesson/21) | RK3576 六层板设计练习 |\n| 22 | [项目实战 · 8 层板 · RK3588 工业主板（选学）](#/lesson/22) | RK3588 八层板，按条件选学 |\n\n**阶段验收：**能依据具体器件、叠层与制造条件解释约束；资料不足时选择局部设计或参考工程分析。第 22 课为选学。\n\n### 五、选修与职业发展\n\n| 顺序 | 课程 | 核心内容 |\n|---|---|---|\n| 23 | [消费电子维修实战](#/lesson/23) | 消费电子维修，具备基础后选学 |\n| 24 | [就业准备](#/lesson/24) | 岗位、作品集与面试准备 |\n| 25 | [证书与认证](#/lesson/25) | 证书与认证，按需学习 |\n| 26 | [附录：学习资源与进阶路线](#/lesson/26) | 学习资料索引，可随时查阅 |\n\n**阶段验收：**结合目标选择维修、就业与认证内容；第 23 课为独立选修，第 25 课按需学习，第 26 课可全程查阅。\n\n## 贯穿练习与项目记录\n\n以低压 LED / RC 练习连接电路计算、测量、EDA 和焊接；接着通过纯硬件循迹小车练习传感、比较器与驱动，之后以 STM32 项目串起数据手册、供电、接口、代码和测试。实践时记录：\n\n1. 目标和范围：功能、输入输出及不包含的部分。\n2. 设计依据：具体型号、手册版本、约束出处和选型条件。\n3. 设计文件：原理图、PCB、封装、BOM 与生产文件版本。\n4. 制作条件：板厂工艺、器件来源、替代料与装配方式。\n5. 验证结果：仪器、接线、条件、预期值、实际值和异常。\n6. 复盘与未决项：修改记录、未验证事项和下一步。\n\n## 课程编号与参考资料\n\n参考资料见各课末尾和第 26 课。器件手册、特定板厂工艺与实际测试条件优先于没有适用范围的经验口诀；工具菜单依实际软件版本为准。","resources":[{"id":"6a69fbba188b2ab2","title":"基础练习与实验记录手册","md":"# 基础练习与实验记录手册\n\n本手册配合第 01～06 课，按“读图 → 自算 → 查看答案 → 仿真或测量 → 记录差异”使用。下面的数值是题设或近似模型，并非对某个器件的性能保证。**目前仅核对了算式和现有仿真文件的文本参数，未逐一运行仿真，也未做实物实验。**\n\n## 使用与安全\n\n全部练习以隔离的低压直流电源为前提；先断电接线并核对极性、引脚和连接，再检查元件的额定电压、电流、功率及电源能力。实际限流按电源说明书和负载启动情况设定；限流并不消除所有风险。发热、异味或异常电流时立即断电，不触摸疑似发热元件。不可使用市电、未经确认的电池或未知电源做这些练习。\n\n涉及波形时，先核对信号源与示波器接地和输入限制；通常先测输入和输出对同一参考点的电压，不把接地夹夹在非地节点。通断、电阻档只能在断电并确认储能元件安全放电后使用。真实装配时需查具体型号与封装引脚，示意中的器件符号不是封装图。仿真无需真实器材，但模型结果并不等同于实测。\n\n现有仿真可从课程网站相应章节进入；以下给出模型文件名和参数差异，**不假定模型与题设完全相同**。修改仿真前保留初始版本，记录软件与模型版本。题设中的理想电压源、电流表和电压表不产生测量负载，实际仪表有误差和输入阻抗。\n\n## 练习 1：LED 限流和功率\n\n**题设。** 5.00 V 理想电源依次连接限流电阻、红色 LED 和地；假设本工作电流下 LED 正向压降为 2.00 V，电阻 620 Ω。目标：求电流、电阻功率；若电源最高 5.25 V、LED 最低正向压降 1.80 V、电阻最低 589 Ω，求这些边界同时出现时的估算电流。LED 的压降范围在此为题设，并非任何红色 LED 的通用保证。\n\n**参考答案。** 标称 `I=(5.00−2.00)/620≈4.84 mA`，`PR=I²R≈0.0145 W`。题设边界电流 `(5.25−1.80)/589≈5.86 mA`；相应电阻功率约 `0.0202 W`。应查所选 LED 的额定和连续电流、压降曲线及电阻功率降额，不能单凭标称 4.84 mA 选型。\n\n**验证。** 项目 `site/sim/circuits/led-resistor.txt` 使用 5 V 与 620 Ω，但 LED 的模型并非固定 2.00 V，电流不必恰好等于答案。比较电阻两端电压及流过电流；若做实测，选择经核对的低压 LED 与电阻，先测电阻值，测量 LED 和电阻两端电压，以电阻压降除以实测阻值推算电流。\n\n**易错与风险。** LED 不能直接跨接电压源；不能用电源电压除以电阻而忽略 LED 压降，也不能将 5 V/1 A 电源理解成负载一定流过 1 A。改变接线先断电。\n\n## 练习 2：分压器的负载效应\n\n**题设。** 5.00 V 经过上臂 `R1=10 kΩ` 到输出节点，节点经下臂 `R2=10 kΩ` 接地。先假设输出开路，再将 `RL=10 kΩ` 从输出接地，求两种输出电压和负载电流，忽略元件误差。\n\n**参考答案。** 开路时 `Vout=5×10/(10+10)=2.50 V`。接入负载后 `R2∥RL=5 kΩ`，输出为 `5×5/(10+5)=1.667 V`，负载电流约 `1.667/10 kΩ=0.167 mA`。上臂电流 0.333 mA，分成下臂及负载两路，每路 0.167 mA。\n\n**验证。** 现有 `level-divider.txt` 使用两个 1 kΩ 而非本题 10 kΩ；先观察无负载的 2.5 V，再把两臂改成 10 kΩ 并从输出加 10 kΩ 到地，观察约 1.67 V。实测时将表的直流电压档并在输出与地之间，记录仪表输入阻抗及实测电阻。\n\n**易错与风险。** 负载是与下臂并联，不是直接并在上臂；不能假设接入任何负载后输出仍为 2.5 V。分压电路是否可作电源需由负载电流与允许误差共同决定。\n\n## 练习 3：RC 低通和高通\n\n**题设。** 正弦信号源无直流偏置，理想源阻抗为 0，输出不接负载；`R=1.00 kΩ`、`C=100 nF`。低通连接为信号源 → R → 输出，输出经 C 接地；高通连接为信号源 → C → 输出，输出经 R 接地。分别求时间常数、截止频率及在截止频率处输出与输入的幅值比。\n\n**参考答案。** `τ=RC=100 μs`；`fc=1/(2πRC)≈1.59 kHz`。两者在该频率的理想幅值比均约 `1/√2=0.707`，即约 −3.01 dB。低通在远低于 fc 时幅值比趋近 1，远高于 fc 时趋近 0；高通相反。高通的直流稳态输出为 0，仅在题设连接、理想条件下成立。\n\n**验证。** `rc-lowpass-1592.txt` 的 1 kΩ、100 nF、约 1591.55 Hz 对应低通题设；查看输入输出幅值，不要把峰值和峰峰值混算。高通可在仿真中交换 R 与 C 的位置并保持输出为两器件中点；低频、中频、截止点和高频分别记录幅值。若实测，信号源内阻、探头输入阻抗/电容和元件容差都要记录；电容实际耐压、极性必须合适。\n\n**易错与风险。** 低通、高通不是换一个公式，而是输出节点不同；0.707 不是适用于所有频率。频率发生器、示波器的接地方式需事先核对。\n\n## 练习 4：二极管与反向保护\n\n**题设。** 5 V 理想电源正端 → 1 kΩ 电阻 → 普通二极管阳极；阴极接地。正向导通时假设二极管压降固定 0.70 V；反向时假设漏电忽略。求正接电流和电阻功率，反转二极管后求理想电流。\n\n**参考答案。** 正接 `I=(5−0.70)/1000=4.30 mA`，电阻功率 `I²R≈0.0185 W`。反向且未击穿的理想模型电流为 0；真实器件会有漏电，其压降随电流与温度变化。题中 0.70 V 只是近似条件。\n\n**验证。** 自建低压直流仿真：给二极管串入 1 kΩ，观察正向电流；反转后再观察。实际练习须按具体二极管手册确认正向电流、反向耐压、极性标记和仪表测量条件；断电后再反转器件。\n\n**易错与风险。** 阴极条纹代表极性标记，具体封装仍要核查；不能以固定 0.7 V 推定所有二极管和电流条件。此单管例子说明方向性，不代表已完成一个满足功耗与压降要求的电源防反接设计。\n\n## 练习 5：NPN 三极管低边开关\n\n**题设。** 理想 5 V 电源 → 1 kΩ 电阻 → NPN 集电极，发射极接地。控制电压 3.3 V 经 10 kΩ 连接基极，基极经 100 kΩ 下拉到地；控制端与电源共地。先假设导通时 `VBE=0.70 V`、`VCE=0.20 V`，计算集电极电流、通过基极电阻的电流和扣除下拉电流后的估计基极电流。\n\n**参考答案。** `IC≈(5−0.20)/1 kΩ=4.80 mA`；输入电阻电流 `(3.3−0.70)/10 kΩ=0.260 mA`；下拉电流 `0.70/100 kΩ=0.007 mA`；估算 `IB≈0.253 mA`。强迫电流比 `IC/IB≈19`。以上先假设饱和，**不能以该算式反过来证明实际管子已经饱和**；应选定完整型号并查该电流及温度下的驱动和 `VCE(sat)`，再核查控制输出的电流能力。\n\n**验证。** `npn-switch.txt` 的 5 V、1 kΩ、3.3 V、10 kΩ 和 100 kΩ 与本题拓扑相近，但模型参数和实际器件不同；观察开关两种状态及集电极电压。实际接线前核对具体封装的 B/C/E 引脚；以限流电源、电阻负载测试，比较不同状态的集电极电压。\n\n**易错与风险。** 不能用放大区典型 hFE 直接保证开关饱和；基极不能直接连接电压源。下拉电阻有电流，计算基极电流时不能漏掉。电机或继电器为感性负载，需另行设计续流及驱动，不能直接照搬此电阻负载例子。\n\n## 练习 6：NMOS 低边开关\n\n**题设。** 5 V → 1 kΩ 电阻 → NMOS 漏极，源极接地；栅极由 0 V/3.3 V 控制并以 100 kΩ 下拉到地。仅为计算，假设在 3.3 V 栅源电压下 MOS 可用 `RDS(on)=0.10 Ω` 近似，忽略其他误差；求导通电流与 MOS 电阻损耗。控制信号低时，假定漏电可忽略。\n\n**参考答案。** `I=5/(1000+0.10)≈4.9995 mA`，`PMOS=I²×0.10≈2.50 μW`；低电平理想情况下电流为零。实际设计必须选定 MOS，查 **实际 VGS、温度和电流条件下**的导通电阻、栅源耐压、漏源耐压和开关损耗；题设 0.10 Ω 不代表现有模型或任一指定器件。\n\n**验证。** `nmos-switch.txt` 使用 5 V、1 kΩ、3.3 V 和 100 kΩ 下拉，模型具有自己的阈值和特性，不能预计它恰好有 0.10 Ω；比较 0 V 与 3.3 V 时漏极电压及电流。实际操作只在所选器件条件允许时进行，先核查封装 G/D/S 与控制端能力，断电再改线。\n\n**易错与风险。** 栅源阈值是特定小测试电流下的指标，不是低损耗导通的保证。体二极管方向影响关断时的电流路径；要控制电机时还需额外评估续流、启动和堵转电流。\n\n## 练习 7：开集电极比较器\n\n**题设。** 理想开集电极比较器单电源 5 V，同相输入 `V+=2.0 V` 或 `3.0 V`，反相输入 `V−=2.5 V`；输出节点经 `10 kΩ` 上拉至 5 V，后级输入电流忽略。假设比较器拉低时输出为 0.20 V，未加入迟滞。求两种输入下的输出状态及拉低时上拉电流。\n\n**参考答案。** 当 `V+=2.0 V < V−` 时，假设输出晶体管导通，输出约 0.20 V，上拉电流 `(5−0.20)/10 kΩ=0.48 mA`。当 `V+=3.0 V > V−` 时，输出晶体管关断，理想无负载输出约 5 V。2.5 V 附近因失调、噪声和缓慢变化可能多次切换；需要按要求设计迟滞并核算上下阈值。\n\n**验证。** `analog-comparator.txt` 用理想开环运放示意比较，不是 LM393 开集电极模型、无本题上拉，不能用来证明输出电流或高电平；可借它观察两输入电压比较与翻转，再单独建立含上拉的比较器模型。若选用真实 LM393 系列，查完整型号和供电条件对应的输入共模范围、输出结构、电流能力与引脚，并处理未使用通道和电源去耦；手册：[TI LM393 系列](https://www.ti.com/lit/ds/symlink/lm393.pdf)。\n\n**易错与风险。** 未上拉的开集电极输出不会主动提供高电平；输出未必能直接驱动电机。不能只根据输入“不超过电源”判断共模范围合格；输入范围、绝对最大额定值和输出电平都应逐项核对。\n\n## 练习 8：电感关断与续流路径\n\n**题设。** 一个由低压电源、线圈和低边开关串联组成的电路，开关先闭合且线圈已有电流，随后断开。比较没有续流支路与在线圈两端正确并联续流二极管时，线圈电流路径的变化。这里不指定线圈和器件型号，不要求估算峰值电压或实物通断。\n\n**参考答案。** 线圈电流不会按理想电感模型瞬时归零；开关断开时，若无合适电流通路，开关两端电压可能迅速上升，实际峰值受寄生、击穿和能量耗散等影响。典型低边驱动的续流二极管阴极接电源正端、阳极接开关与线圈的连接点；关断时它为线圈电流提供回路。实际电路仍需按具体线圈与器件核验二极管电流、反向耐压、关断速度、释放时间和功耗。\n\n**验证。** 可比较课程现有 `inductkick.txt` 与 `inductkick-snub.txt`，先核对两个模型的拓扑、参数及保护方式，再记录开关断开前后线圈电流和开关电压；不得预设后者一定是与本题完全相同的二极管电路。本题先做仿真；实物操作需选定安全低压线圈、驱动器和续流器件并完成额定值核算。\n\n**易错与风险。** 二极管方向画反可能形成对电源的低阻通路；二极管不能随意省略，也不能只因加入二极管就认定所有瞬态风险已解决。\n\n## 通用实验记录模板\n\n复制下表，每次实验单独保存；未执行项填“未做”，异常保留原始数据，不把预测值填作实测。\n\n| 项目 | 记录 |\n|---|---|\n| 日期、实验名称、操作者 |  |\n| 目标、题号及电路版本 |  |\n| 器件完整型号、批次、关键额定值、手册版本 |  |\n| 仪器型号、量程、探头及校准/状态 |  |\n| 电源类型、设定值、限流依据及实际值 |  |\n| 原理图/接线图、公共参考点和测点 |  |\n| 测试前断电检查、极性、额定值及环境 |  |\n| 仿真软件及模型版本，或实物连接方式 |  |\n| 输入条件、步骤和预期范围及依据 |  |\n| 实际测量值及单位、照片/波形文件 |  |\n| 误差及可能原因 |  |\n| 异常、停止条件、处理与复测 |  |\n| 结论（通过 / 未通过 / 待验证）、下一步 |  |\n\n## 核验和边界\n\n以上习题使用题设理想条件进行算术核对；本手册未验证实物、所有仿真模型的行为或器件在具体温度、容差和生产条件下的极限。NPN 饱和驱动的条件性可参考 [onsemi 2N3904 数据手册](https://www.onsemi.com/download/data-sheet/pdf/2n3904-d.pdf)；不同器件和供应商不能未经核对直接套用其数值。\n","path":"基础练习与实验记录手册.md","group":"基础练习"},{"id":"fc9c44ec59d84fc6","title":"模拟电路进阶练习：放大、电流检测与迟滞","md":"# 模拟电路进阶练习：放大、电流检测与迟滞\n\n配合第 04、05、06、10 课及《基础练习与实验记录手册》使用。目标是把课件中的运放、采样和比较器串成可以计算和解释的任务。以下均为**理想电路或明确假设的计算练习**，尚未实物搭建；任何电阻、公差、电源和波形均应先按所选型号重新核对。练习限于合适隔离低压电源，接线前断电；示波器和信号源接地按各自手册确认。\n\n## 1. 同相放大：理解负反馈的条件\n\n### 电路和题目\n\n理想运放以 0～5 V 供电，`V+` 接理想低阻信号 `Vin`；输出经 `Rf=90 kΩ` 接反相输入，反相输入经 `Rg=10 kΩ` 接地。第 1 小问假设运放线性工作、输入电流为零、输出无负载；供电和输出限制之外不套用理想公式。\n\n1. 当 `Vin=0.15 V`，求输出电压和反相输入电压。\n2. 若 `Vin=0.60 V`，为什么不能直接断言输出一定是 6 V？\n3. 信号源内阻、运放输入范围或输出负载变化会影响什么？\n\n### 参考答案\n\n在闭环线性工作时，反馈节点 `V−=Vout×Rg/(Rg+Rf)`，理想近似 `V−=V+=Vin`，故 `Vout=(1+Rf/Rg)Vin=10Vin`。第 1 题输出 `1.50 V`，反相输入约 `0.15 V`。第 2 题理想计算为 6 V，但这超出题设 0～5 V 供电；实际输出受具体器件和负载限制，输出可能进入饱和，不能继续应用“虚短”来求实际值。带宽、输出电流、输入共模范围、源阻抗和失调等也需核验。\n\n### 验证与误区\n\n先在课程站点第 05 课的同相放大仿真中核对电源、信号幅度及反馈电阻；模型参数不一定等于本题，须修改并记录。对比低幅值和导致削顶的输入，记下实际使用的模型及供电。实际选型须查所选器件在供电、电流、温度和负载条件下的输入共模范围、输出摆幅、带宽和稳定性。**运放有负反馈，不代表任何输入下都能保持线性。**\n\n## 2. 低端电流检测：从分流电阻到输出误差\n\n### 电路和题目\n\n负载的回流依次经过 `Rs=0.50 Ω` 到系统地；假设运放测得电阻上端相对系统地的电压，并以理想同相增益 `G=10` 放大。忽略引线电阻，输入电流为零，输出范围足够。负载电流在 `0.10～0.40 A` 内。\n\n1. 求检测电压、输出电压和最大分流电阻功耗。\n2. 假设输入等效失调为 `±1 mV`，仅计这一项，输出电压误差和反推电流误差有多大？\n3. 为什么这不是完整的实际电流检测设计？\n\n### 参考答案\n\n`Vsense=I×Rs=0.05～0.20 V`；理想输出 `Vout=G×Vsense=0.50～2.00 V`。在 0.40 A 时，`P=I²Rs=0.08 W`。如果仅考虑输入等效失调 `±1 mV`，输出误差约 `±10 mV`，反推输入电流误差约 `±0.001/0.50=±0.002 A`，即 `±2 mA`。在 0.10 A 工作点，相对于读数约为 ±2%；实际总误差还包括增益、采样电阻容差与温漂、偏置、噪声、接地和测量误差。\n\n分流电阻会抬高负载地电位并耗散功率；其温升、脉冲能力、额定功率、阻值变化和两端取样连接都必须考虑。不能仅按 0.08 W 选型，还需按环境与厂商降额留余量。运放输入必须在实际共模范围内，输出和负载也必须满足条件，不能假定任意单电源运放都能精确测到靠近地的电压。\n\n### 验证与误区\n\n先用理想电流源和 `Rs` 计算或仿真，分三个输入点记录 `I、Vsense、Vout`，再改变一个假设看误差。实体练习须先选择适合的低压负载、电流源、测量仪器和具体器件；从最低电流开始，断电后连接电流表，记录表笔压降及功率。**不能将误差项简单当作已经覆盖了全部实际误差。**\n\n## 3. 恒流反馈：先算目标，再核对余量\n\n### 电路和题目\n\n理想负载经 N 沟道 MOS 的漏极、源极及采样电阻 `Rs=1.0 Ω` 回到地；运放同相输入端接参考 `Vref=0.10 V`，反相输入端接 MOS 源极和采样电阻上端，运放输出接 MOS 栅极；负反馈调整栅极使源极电压近似等于参考。负载另一端接稳定 5 V。假设运放与 MOS 都能在此工作点线性稳定工作。\n\n1. 求理想负载电流和采样电阻功率。\n2. 如果负载电压为 2.0 V，估算 MOS 的漏源压降与功耗。\n3. 当负载要求的电压超过电源可提供的余量时会怎样？\n\n### 参考答案\n\n理想状态下 `I≈Vref/Rs=0.10 A`，`PRs=I²Rs=0.010 W`。当负载压降为 2.0 V，采样电阻上约 0.10 V，`VDS≈5.0−2.0−0.10=2.90 V`，MOS 导通功耗约 `0.10×2.90=0.29 W`，不包括动态或其它损耗。若电源电压不能同时满足负载、采样电阻和 MOS 所需压降，反馈将失去调节余量，电流不再保证为 0.10 A；实际响应依电路和负载而定。\n\n### 验证与误区\n\n这是**原理框图**，不是已经稳定、可上电的恒流源。实际必须选择运放和 MOS，核查输入、输出及栅压范围、MOS 线性工作安全区与散热、电源启动及短路、反馈环路稳定性、采样误差和实际负载。若尚无具体器件及补偿，不应直接接实物负载。增大负载电阻时，恒流只在设计规定的输出电压范围内近似成立。\n\n## 4. 比较器迟滞：让上升与下降阈值不同\n\n### 电路和题目\n\n理想推挽比较器输出只有 `0 V` 或 `5 V`；反相输入直接接理想 `2.50 V` 参考。输入信号经 `Rin=10 kΩ` 接同相输入节点 `V+`，输出经 `Rf=100 kΩ` 正反馈到同一节点。假设输入信号源阻抗为零、比较器输入电流为零。\n\n1. 当输出原先为低时，`Vin` 上升到多少触发向高翻转？\n2. 当输出原先为高时，`Vin` 下降到多少触发向低翻转？迟滞宽度是多少？\n3. 为什么不能把结果直接套用到开集电极 LM393 和不同负载？\n\n### 参考答案\n\n输入节点为 `V+=(Vin×Rf+Vout×Rin)/(Rin+Rf)`。翻转点令 `V+=2.50 V`：输出原先为 0 V 时，上升阈值 `Vin=(2.50×110−0×10)/100=2.75 V`；输出原先为 5 V 时，下降阈值 `Vin=(2.50×110−5×10)/100=2.25 V`。理想迟滞宽度为 `0.50 V`。在 2.25～2.75 V 区间，输出取决于之前状态；恰在阈值时实际切换受失调和噪声影响。\n\nLM393 是开集电极输出，需要上拉；输出高低电压受上拉、负载和反馈网络影响，不一定恰为 5 V 或 0 V。还要核对输入共模、输出灌电流、失调、供电容差及启动状态。真实设计需计算闭合的电阻网络及两种输出状态，不能把此理想结果直接作为循迹小车的参数。\n\n### 验证与误区\n\n在仿真中搭建该理想电路，从 2.0 V 缓慢增加输入至 3.0 V，再下降至 2.0 V，记录两次翻转输入、输出电压和比较器类型；若模型输出不是理想 0/5 V，以实际输出值重新计算。实体电路须先选定器件及电源，并核算电阻、输出负载和失效状态。本题和循迹项目的门限结构不同，不可直接替换其中的电阻。\n\n## 5. 高端电流检测：小差分电压与高共模电压\n\n### 电路和题目\n\n理想 5.00 V 电源正端经 `Rs=0.10 Ω` 到负载，负载回到系统地。理想差分电流检测放大器的两个输入分别连接 Rs 两端，输出参考地，差分增益设为 `20 V/V`；假设输入无负载、增益准确、输出摆幅足够。电流从电源经电阻流向负载，范围为 `0.50～1.50 A`。\n\n1. 求采样电阻两端压差、负载端电压和理想输出电压的范围。\n2. 按输入两端电压的平均值计算共模电压范围；最大电流时电阻功耗是多少？\n3. 若仅假设输入等效失调为 `±100 μV`，反推电流误差是多少？为什么必须核对输入共模范围？\n\n### 参考答案\n\n`Vsense=I×0.10=0.05～0.15 V`，负载端电压约 `4.95～4.85 V`，理想输出 `20×Vsense=1.0～3.0 V`。输入共模电压为 `(5.00+V负载端)/2`，约 `4.975～4.925 V`；最大电阻功耗 `1.50²×0.10=0.225 W`。仅计给定的输入失调项，电流误差约 `±100 μV/0.10 Ω=±1 mA`，它不包括电阻容差与温漂、增益、噪声、输入偏置或电源变化。\n\n这里测量的是远小于供电的**差分电压**，但两个输入相对地都接近 5 V。实际放大器必须允许对应的输入共模电压、供电及瞬态，输出还要满足负载和摆幅要求；不能仅因差分电压小就直接接入任意单电源运放。取样电阻的发热、环境温度、PCB 铜箔、电流路径和故障电流均需核算。高端检测便于保持负载地参考，但具体故障是否能被检测取决于整个电流路径。\n\n### 验证与误区\n\n先用理想差分模型扫电流，记录电阻两端各自对地电压及两者差值；再单独加入输入失调，比较换算误差。实际电路应选定适合输入共模、电源和输出范围的具体电流检测器件并验证过流保护；本题不提供可直接通电的实物接线。参考 [TI 高端电流检测设计](https://www.ti.com/lit/an/sboa310b/sboa310b.pdf)。\n\n## 6. 跨阻放大：把微小光电流转成电压\n\n### 电路和题目\n\n理想运放同相端接稳定 `Vref=2.50 V`；反相端为求和节点，从输出经 `Rf=100 kΩ` 反馈到该节点。用理想电流源代表反偏光电二极管，电流 `Iphoto` **从 5 V 电源侧流入求和节点**，范围为 `0～10 μA`。假设运放供电 0～5 V、线性稳定、输入电流为零、参考理想且输出无负载。\n\n1. 写出输出与输入电流的关系并求输出范围。\n2. 若电流方向相反，输出变化方向如何？\n3. 为什么不能只计算反馈电阻就直接做出稳定的实物？\n\n### 参考答案\n\n线性负反馈时求和节点约为 `2.50 V`。由节点电流守恒，流入节点的光电流通过 Rf 流向输出：`Iphoto=(Vref−Vout)/Rf`，故 `Vout=Vref−Iphoto×Rf`，输出从 `2.50 V` 降到 `1.50 V`。若其余条件不变而电流方向反向，输出将随电流幅度上升；能否保持线性仍取决于输出摆幅及电路条件。\n\n本题只用电流源抽象光电二极管，并未指定真实器件或证明其反向偏置。实际设计须核对传感器极性、光电流/暗电流、反偏电压、结电容、运放输入偏置与失调、输入共模及输出范围；结电容和输入电容会影响反馈稳定性。反馈补偿电容、带宽和噪声应结合具体器件及目标分析，不能照搬任意值。参考 [TI 运放稳定性与跨阻电路](https://www.ti.com/lit/wp/sboa626/sboa626.pdf)。\n\n### 验证与误区\n\n先使用理想电流源、理想运放和受控电源做静态仿真，依次设置 0、5、10 μA，并记录输出；反转电流方向时先核对输出是否仍处于模型线性范围。选定具体器件前，不把理想输出当成实测或实际带宽保证。\n\n## 7. 记录与验收\n\n每题先独立计算，再对照答案。建议记录电路连接、假设、器件/模型版本、输入范围、预期输出、测量条件、结果和未解释偏差。仿真和实物分别标记；未验证填写“未做”。通用表格见[基础练习与实验记录手册](#/resource/6a69fbba188b2ab2)。\n\n完成后应能：说明线性反馈的前提；算出高、低端采样的电阻功耗和单项失调误差；说明差分与共模电压；解释恒流回路的电压余量；用上升/下降两次扫描区分迟滞与单阈值；通过节点电流方向写出跨阻增益。参考：[TI 负反馈与线性工作说明](https://www.ti.com/document-viewer/lit/html/SSZT093)、[TI 同相迟滞比较器设计](https://www.ti.com/lit/an/sboa313a/sboa313a.pdf)、[TI 电流检测与比较器实例](https://www.ti.com/lit/ds/symlink/ina381.pdf)。这些资料用于理解原理，不代表本题已采用或验证其中具体器件。\n","path":"模拟电路进阶练习.md","group":"基础练习"}]}</script>

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const stars = n => '⭐'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));

/* ================= markdown renderer ================= */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m,c) => '<code>'+c+'</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,u) =>
    '<a href="'+u+'"'+(u.startsWith('#') ? '' : ' target="_blank" rel="noopener"')+'>'+t+'</a>');
  return s;
}

function mdToHtml(md, opts){
  opts = opts || {};
  let taskIdx = 0, hid = 0;
  const lines = md.split('\n');
  let out = '', i = 0;
  const isHr = s => /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(s);
  const isTableSep = s => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes('-') && s.includes('|');

  while (i < lines.length){
    const line = lines[i];

    /* fenced code / mermaid 图 */
    if (/^\s*```/.test(line)){
      const lang = line.replace(/^\s*```/, '').trim().toLowerCase();
      let buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      if (lang === 'circuitjs'){
        const name = buf.join('\n').trim(), sim = SIMS[name];
        if (sim && /^[a-z0-9-]+$/.test(name)) {
          const circuitUrl = new URL('sim/circuits/' + name + '.txt?v=20261102-orfix', location.href).href;
          const simUrl = 'sim/circuitjs.html?lang=en&startCircuitLink=' + encodeURIComponent(circuitUrl);
          out += '<figure class="circuit-figure"><figcaption><strong>原理图与互动仿真：'+esc(sim.title)+'</strong> · '+esc(sim.desc)+'；仿真参数可能与正文算例不同，模拟器菜单为英文。 <a href="#/sim/'+name+'">放大查看</a></figcaption><iframe loading="lazy" title="'+esc(sim.title)+' 原理图与互动仿真" src="'+esc(simUrl)+'"></iframe></figure>';
        } else out += '<p>仿真未配置：'+esc(name)+'</p>';
      } else if (lang === 'mermaid'){
        out += '<div class="diagram">' + esc(buf.join('\n')) + '</div>';
      } else if (lang === 'svg'){
        out += '<div class="diagram diagram-svg">' + buf.join('\n') + '</div>';
      } else {
        out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
      }
      continue;
    }
    /* details / summary 折叠块透传 */
    if (/^\s*<details[^>]*>\s*$/.test(line)){ out += '<details>'; i++; continue; }
    const sm = line.match(/^\s*-?\s*<summary>(.*?)<\/summary>\s*$/);
    if (sm){ out += '<summary>' + inline(sm[1]) + '</summary>'; i++; continue; }
    if (/^\s*<\/details>\s*$/.test(line)){ out += '</details>'; i++; continue; }
    /* heading */
    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if (m){
      const lv = Math.min(Math.max(m[1].length, 2), 6);
      out += '<h'+lv+' id="hd-'+(hid++)+'">' + inline(m[2]) + '</h'+lv+'>';
      i++; continue;
    }
    /* hr */
    if (isHr(line)){ out += '<hr>'; i++; continue; }
    /* blockquote */
    if (/^\s*>/.test(line)){
      let buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out += '<blockquote>' + buf.map(b => '<p>'+inline(b)+'</p>').join('') + '</blockquote>';
      continue;
    }
    /* table */
    if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i+1])){
      const parseRow = s => s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c => c.trim());
      const heads = parseRow(line);
      const aligns = parseRow(lines[i+1]).map(c =>
        /^:.*:$/.test(c) ? 'center' : /:$/.test(c) ? 'right' : 'left');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== ''){
        rows.push(parseRow(lines[i])); i++;
      }
      let t = '<div class="tbl-wrap"><table><thead><tr>';
      heads.forEach((h,ci) => t += '<th style="text-align:'+aligns[ci]+'">'+inline(h)+'</th>');
      t += '</tr></thead><tbody>';
      rows.forEach(r => {
        t += '<tr>';
        r.forEach((c,ci) => t += '<td style="text-align:'+(aligns[ci]||'left')+'">'+inline(c)+'</td>');
        t += '</tr>';
      });
      t += '</tbody></table></div>';
      out += t;
      continue;
    }
    /* task list item */
    m = line.match(/^(\s*)-\s+\[([ xX])\]\s+(.*)$/);
    if (m){
      let items = [];
      while (i < lines.length){
        const mm = lines[i].match(/^(\s*)-\s+\[([ xX])\]\s+(.*)$/);
        if (!mm) break;
        items.push({ind: mm[1].length, checked: mm[2].toLowerCase()==='x', text: mm[3]});
        i++;
      }
      out += '<ul class="tasks">' + items.map(it => {
        const ti = taskIdx++;
        const dis = opts.staticTasks ? ' disabled' : '';
        const ck = it.checked || (checks[opts.lessonId] && checks[opts.lessonId][ti]);
        return '<li><label><input type="checkbox" data-ti="'+ti+'"'+dis+(ck?' checked':'')+'><span>'+inline(it.text)+'</span></label></li>';
      }).join('') + '</ul>';
      continue;
    }
    /* list */
    m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (m){
      const buf = [];
      while (i < lines.length){
        const mm = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (!mm) break;
        buf.push({ind: mm[1].length, ol: /\d/.test(mm[2][0]), text: mm[3]});
        i++;
      }
      let html = '', openTag = null;
      buf.forEach(it => {
        const tag = it.ol ? 'ol' : 'ul';
        if (tag !== openTag){
          if (openTag) html += '</'+openTag+'>';
          html += '<'+tag+'>'; openTag = tag;
        }
        html += '<li'+(it.ind >= 2 ? ' class="sub"' : '')+'>' + inline(it.text) + '</li>';
      });
      if (openTag) html += '</'+openTag+'>';
      out += html;
      continue;
    }
    /* blank */
    if (line.trim() === ''){ i++; continue; }
    /* paragraph */
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' && !/^\s*(#{1,6}\s|```|>|\||-\s|\d+\.\s)/.test(lines[i]) && !isHr(lines[i])){
      para.push(lines[i]); i++;
    }
    out += '<p>' + para.map(inline).join('<br>') + '</p>';
  }
  return out;
}

function mapGeometry(){
  const perRow = 4, x0 = 92, y0 = 82, dx = 188, dy = 148;
  const rows = Math.ceil(LESSONS.length / perRow);
  return { pos(i){
    const row = Math.floor(i / perRow);
    let col = i % perRow;
    if (row % 2 === 1) col = perRow - 1 - col;
    return {x: x0 + col*dx, y: y0 + row*dy};
  }, w: x0 + 3*dx + 92, h: y0 + (rows - 1)*dy + 96 };
}

  for (let k = 0; k < LESSONS.length - 1; k++){
    const a = g.pos(k), b = g.pos(k+1), l = LESSONS[k+1];
    const bothDone = progress.has(LESSONS[k].id) && progress.has(l.id);
    svg += '<line class="seg'+(bothDone?' done-seg':'')+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" style="stroke:'+stageColor(l.stage)+'"/>';
  }
  /* nodes */
  LESSONS.forEach((l, k) => {
    const p = g.pos(k), c = stageColor(l.stage), isDone = progress.has(l.id);
    const isActive = location.hash === '#/lesson/' + l.id;
    svg += '<g class="node'+(isDone?' done':'')+(isActive?' active':'')+(l.optional?' optional':'')+'" '+
      'style="--c:'+c+'" transform="translate('+p.x+','+p.y+')" data-id="'+l.id+'">' +
      '<circle class="pad" r="24"/><text class="num" y="4.5">'+l.id+'</text>' +
      (isDone ? '<circle class="badge" cx="18" cy="-18" r="8"/><text class="badge-t" x="18" y="-14.5">✓</text>' : '') +
      '<text class="lbl" y="46">'+esc(l.short)+'</text>' +
      (l.optional ? '<text class="opt-tag" y="61">选学</text>' : '') +
      '<title>第 '+l.id+' 课 · '+esc(l.title)+'\n难度 '+stars(l.diff)+(isDone?'\n✓ 已完成':'')+'</title></g>';
  });
  svg += '</svg>';
  const wrap = $('#mapWrap');
  wrap.innerHTML = svg;
  wrap.querySelectorAll('.node').forEach(el =>
    el.addEventListener('click', () => { location.hash = '#/lesson/' + el.dataset.id; }));
}

/* ================= lesson ================= */
function renderLesson(id){
  const l = BY_ID[id];
  if (!l){ location.hash = '#/home'; return; }
  const idx = LESSONS.indexOf(l);
  const prev = LESSONS[idx-1], nxt = LESSONS[idx+1];
  const isDone = progress.has(id);
  const st = STAGES[l.stage-1];
  const total = (l.md.match(/^- \[ \]/gm) || []).length;
  const doneCk = (checks[id] || []).filter(Boolean).length;

  view.innerHTML = `
  <div class="lesson-head">
    <div class="crumb">
      <a href="#/home">‹ 路线图</a>
      <span class="stage-chip" style="--c:${st.color}">阶段${CN[l.stage-1]} · ${st.name}</span>
      <span class="spacer"></span>
      <span style="font-family:var(--mono)">←/→ 切换课程</span>
    </div>
    <h1>第 ${l.id} 课 · ${esc(l.title.replace(/^第\s*\d+\s*课\s*·\s*/,''))}</h1>
    <div class="meta-row">
      <span class="chip">难度 <b>${stars(l.diff)}</b></span>
      ${l.prev ? '<span class="chip">前置 · '+esc(l.prev)+'</span>' : ''}
      ${total ? '<span class="chip task-chip">自测 <b id="taskChip">'+doneCk+'/'+total+'</b></span>' : ''}
      ${l.optional ? '<span class="chip" style="border-style:dashed">选学</span>' : ''}
      <span class="spacer"></span>
      <button class="btn ghost" id="mindBtn">🧠 导图</button>
      <button class="btn ${isDone?'done-btn':'primary'}" id="doneBtn">${isDone?'✓ 已完成':'标记本课完成'}</button>
    </div>
  </div>
  <article class="md" id="mdBody">${mdToHtml(l.md, {lessonId:id})}</article>
  <div class="lesson-foot">
    <button class="btn ${isDone?'done-btn':'primary'}" id="doneBtn2">${isDone?'✓ 已完成（点击取消）':'标记本课完成'}</button>
  </div>
  <div class="nav-cards">
    <div class="nav-card ${prev?'':'disabled'}" ${prev?('data-id="'+prev.id+'"'):''}>
      <div class="dir">← 上一课${prev?'':'（无）'}</div><div class="tt">${prev ? esc(prev.short) : '—'}</div>
    </div>
    <div class="nav-card next" ${nxt?('data-id="'+nxt.id+'"'):''}>
      <div class="dir">${nxt?'下一课 →':'已是最后一课'}</div><div class="tt">${nxt ? esc(nxt.short) : '🏅 前往路线图回顾'}</div>
    </div>
  </div>`;

  /* checkbox persistence */
  view.querySelectorAll('input[data-ti]').forEach(inp => {
    inp.addEventListener('change', () => {
      checks[id] = checks[id] || [];
      checks[id][+inp.dataset.ti] = inp.checked;
      saveChecks();
      const all = view.querySelectorAll('input[data-ti]');
      const dn = [...all].filter(x => x.checked).length;
      const chip = $('#taskChip');
      if (chip) chip.textContent = dn + '/' + all.length;
    });
  });
  /* complete toggle */
  const toggle = () => {
    if (progress.has(id)) progress.delete(id); else progress.add(id);
    saveProgress();
    renderSidebar(id);
    const dn = progress.has(id);
    [$('#doneBtn'), $('#doneBtn2')].forEach(b => {
      if (!b) return;
      b.className = 'btn ' + (dn ? 'done-btn' : 'primary');
      b.textContent = b.id === 'doneBtn' ? (dn ? '✓ 已完成' : '标记本课完成') : (dn ? '✓ 已完成（点击取消）' : '标记本课完成');
    });
    if (dn && nxt) setTimeout(() => { location.hash = '#/lesson/' + nxt.id; }, 350);
  };
  $('#doneBtn').addEventListener('click', toggle);
  $('#doneBtn2').addEventListener('click', toggle);
  $('#mindBtn').addEventListener('click', openMind);
  view.querySelectorAll('.nav-card[data-id]').forEach(el =>
    el.addEventListener('click', () => { location.hash = '#/lesson/' + el.dataset.id; }));
  if (!nxt){
    const last = view.querySelector('.nav-card.next');
    if (last) last.addEventListener('click', () => { location.hash = '#/home'; });
  }
  buildToc();
}

/* ================= toc（右侧大纲） ================= */
let tocHeads = [];
function buildToc(){
  const toc = $('#toc');
  const heads = [...view.querySelectorAll('.md h2, .md h3, .md h4')].filter(h => h.tagName !== 'H4' || (/^04\.4\.[1-7]\s/.test(h.textContent) && location.hash === '#/lesson/04'));
  if (!heads.length){ clearToc(); return; }
  toc.classList.add('has-toc');
  toc.innerHTML = '<div class="toc-title">本课大纲</div>' + heads.map(h =>
    '<div class="toc-item '+(h.tagName === 'H2' ? 'lv1' : h.tagName === 'H4' ? 'lv3' : 'lv2')+'" data-t="'+h.id+'">'+esc(h.textContent)+'</div>').join('');
  const els = [...toc.querySelectorAll('.toc-item')];
  tocHeads = heads.map((h, k) => ({el: h, link: els[k]}));
  els.forEach(el => el.addEventListener('click', () => {
    const t = document.getElementById(el.dataset.t);
    if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'});
  }));
  updateTocActive();
}
function clearToc(){
  const toc = $('#toc');
  toc.classList.remove('has-toc');
  toc.innerHTML = '';
  tocHeads = [];
}
function updateTocActive(){
  if (!tocHeads.length) return;
  let cur = 0;
  for (let k = 0; k < tocHeads.length; k++){
    if (tocHeads[k].el.getBoundingClientRect().top <= 110) cur = k;
  }
  tocHeads.forEach((t, k) => t.link.classList.toggle('active', k === cur));
}
window.addEventListener('scroll', updateTocActive, {passive: true});

/* ================= mermaid 图渲染 ================= */
let diagSeq = 0;
const MMD_LIGHT = { primaryColor:'#e9f1ec', primaryBorderColor:'#5aa9ff', primaryTextColor:'#1d2b25',
  lineColor:'#586d63', secondaryColor:'#eef4f0', tertiaryColor:'#f7faf8', fontSize:'14px' };
const MMD_DARK = { primaryColor:'#152019', primaryBorderColor:'#5aa9ff', primaryTextColor:'#dbe7e1',
  lineColor:'#8aa097', secondaryColor:'#111b17', tertiaryColor:'#0e1613', fontSize:'14px' };
function renderDiagrams(){
  const els = view.querySelectorAll('.diagram:not(.diagram-svg)');
  if (!els.length || !window.mermaid) return;
  const dark = document.documentElement.dataset.theme === 'dark';
  try{
    window.mermaid.initialize({ startOnLoad:false, theme:'base',
      fontFamily:'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif',
      themeVariables: dark ? MMD_DARK : MMD_LIGHT });
  }catch(e){ return; }
  els.forEach(async el => {
    if (el.dataset.done) return;
    el.dataset.src = el.textContent;
    try{
      const {svg} = await window.mermaid.render('mmd-' + (diagSeq++), el.dataset.src);
      el.innerHTML = svg;
      el.dataset.done = '1';
    }catch(err){ el.classList.add('diagram-err'); }
  });
}

/* ================= sim（电路仿真弹窗·覆盖层，不动路由与课程 DOM） ================= */
function openSim(name){
  const sim = SIMS[name];
  if (!sim) return;
  const circuitUrl = new URL('sim/circuits/' + name + '.txt?v=20261102-orfix', location.href).href;
  const src = '/sim/circuitjs.html?lang=en&startCircuitLink=' + encodeURIComponent(circuitUrl);
  $('#simTitle').textContent = '🔬 ' + sim.title;
  $('#simDesc').textContent = sim.desc + ' · ' + (sim.context || ('第 ' + sim.lesson + ' 课配套仿真')) + ' · 菜单为英文';
  $('#simNewWin').href = src;
  const fr = $('#simFrame');
  fr.onload = () => {
    /* 仿真器与主页同源：桥接 iframe 内的 ESC，焦点在仿真器里也能关闭弹窗 */
    try { fr.contentDocument.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSim(); }); } catch (e) {}
  };
  fr.src = src;
  $('#simBackdrop').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSim(){
  $('#simBackdrop').hidden = true;
  $('#simFrame').src = 'about:blank';
  document.body.style.overflow = '';
}
$('#simCloseBtn').addEventListener('click', closeSim);
$('#simBackdrop').addEventListener('click', e => { if (e.target.id === 'simBackdrop') closeSim(); });
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/sim/"]');
  if (a){ e.preventDefault(); openSim(a.getAttribute('href').slice(6)); }
});

/* ================= mind（思维导图覆盖层） ================= */
const DEPTH = {H2: 1, H3: 2, H4: 3};
function buildMindTree(){
  const root = {title: '', lv: 0, children: [], el: null};
  const stack = [root];
  view.querySelectorAll('.md h2, .md h3, .md h4').forEach(h => {
    const lv = DEPTH[h.tagName] || 2;
    const node = {title: h.textContent.trim(), lv, children: [], el: h};
    while (stack.length > lv) stack.pop();
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  });
  return root;
}
function openMind(){
  const id = location.hash.slice(9);
  const l = BY_ID[id];
  if (!l) return;
  const root = buildMindTree();
  root.title = '第 ' + l.id + ' 课 · ' + l.short;
  const ROW = 40, COL = 250, PAD = 24, GAPY = 8;
  let maxDepth = 0;
  const layout = n => {
    maxDepth = Math.max(maxDepth, n.lv);
    if (!n.children.length){ n.h = ROW; return n.h; }
    let h = 0;
    n.children.forEach(c => { h += layout(c) + GAPY; });
    n.h = h - GAPY;
    return n.h;
  };
  layout(root);
  const height = Math.max(root.h + PAD * 2, 300);
  const width = (maxDepth + 1) * COL + PAD * 2 + 200;
  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '">';
  const place = (n, x, yTop) => {
    n.x = x; n.yc = yTop + n.h / 2;
    if (n.children){
      let cy = yTop;
      n.children.forEach(c => { place(c, x + COL, cy); cy += c.h + GAPY; });
    }
  };
  place(root, PAD, PAD);
  const esc2 = s => esc(s.length > 15 ? s.slice(0, 14) + '…' : s);
  const draw = n => {
    const w = Math.min(n.lv === 0 ? 210 : 215, 15 * 12.5 + 20);
    n.children.forEach(draw);
    if (n.lv > 0)
      svg += '<path class="mm-link" d="M ' + (n.x - COL + 205) + ' ' + n.yc +
             ' C ' + (n.x - COL / 2) + ' ' + n.yc + ', ' + (n.x - COL / 2) + ' ' + n.yc + ', ' + n.x + ' ' + n.yc + '"/>';
    svg += '<g class="mm-node l' + n.lv + '"' + (n.el ? ' data-t="' + n.el.id + '"' : '') + '>' +
           '<rect x="' + n.x + '" y="' + (n.yc - 17) + '" width="' + w + '" height="34" rx="7"/>' +
           '<text x="' + (n.x + 10) + '" y="' + (n.yc + 4.5) + '">' + esc2(n.title) + '</text></g>';
  };
  draw(root);
  svg += '</svg>';
  $('#mindBody').innerHTML = svg;
  $('#mindBody').querySelectorAll('.mm-node[data-t]').forEach(el =>
    el.addEventListener('click', () => {
      closeMind();
      const t = document.getElementById(el.dataset.t);
      if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'});
    }));
  $('#mindBackdrop').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeMind(){
  $('#mindBackdrop').hidden = true;
  $('#mindBody').innerHTML = '';
  document.body.style.overflow = '';
}
$('#mindCloseBtn').addEventListener('click', closeMind);
$('#mindBackdrop').addEventListener('click', e => { if (e.target.id === 'mindBackdrop') closeMind(); });

/* ================= search ================= */
const searchInput = $('#searchInput'), searchResults = $('#searchResults');
function doSearch(q){
  q = q.trim().toLowerCase();
  if (!q){ searchResults.classList.remove('show'); return; }
  const hits = [];
  for (const l of LESSONS){
    if (l.title.toLowerCase().includes(q)){
      hits.push({l, snip: l.md.split('\n').find(x => x.toLowerCase().includes(q)) || ''});
      continue;
    }
    const ln = l.md.toLowerCase().indexOf(q);
    if (ln >= 0){
      const before = l.md.lastIndexOf('\n', ln);
      const line = l.md.slice(before + 1, l.md.indexOf('\n', ln) > 0 ? l.md.indexOf('\n', ln) : undefined);
      hits.push({l, snip: line});
    }
    if (hits.length >= 8) break;
  }
  searchResults.innerHTML = hits.length
    ? hits.map(h => {
        let s = h.snip.replace(/[#*`|>]/g, '').trim();
        const at = s.toLowerCase().indexOf(q);
        if (at > 26) s = '…' + s.slice(at - 22);
        if (s.length > 70) s = s.slice(0, 70) + '…';
        const safe = esc(s).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig'), '<b>$1</b>');
        return '<div class="sr-item" data-id="'+h.l.id+'"><div class="t">'+h.l.id+' · '+esc(h.l.short)+'</div><div class="s">'+safe+'</div></div>';
      }).join('')
    : '<div class="sr-empty">没有找到包含「'+esc(q)+'」的内容</div>';
  searchResults.classList.add('show');
  searchResults.querySelectorAll('.sr-item').forEach(el =>
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      location.hash = '#/lesson/' + el.dataset.id;
      searchResults.classList.remove('show');
      searchInput.value = '';
      document.body.classList.remove('nav-open');
    }));
}
searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchInput.addEventListener('keydown', e => { if (e.key === 'Escape'){ searchResults.classList.remove('show'); searchInput.blur(); } });
searchInput.addEventListener('blur', () => setTimeout(() => searchResults.classList.remove('show'), 150));

/* ================= router & init ================= */
let lastHash = null;
function route(){
  const h = location.hash || '#/home';
  if (h === lastHash) return;
  lastHash = h;
  if (!$('#simBackdrop').hidden) closeSim();
  if (h.startsWith('#/sim/')){
    /* 直接用 URL 打开仿真的场景：背后先渲染首页 */
    if (!view.querySelector('.hero, .lesson-head')){ renderHome(); renderSidebar(null); }
    openSim(h.slice(6));
    return;
  }
  window.scrollTo(0, 0);
  if (h.startsWith('#/lesson/')){
    const id = h.slice(9);
    renderLesson(id);
    renderSidebar(id);
  } else if (h.startsWith('#/resource/')) {
    renderResource(h.slice(11));
    renderSidebar(null);
  } else {
    renderHome();
    renderSidebar(null);
  }
  renderDiagrams();
}
window.addEventListener('hashchange', route);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape'){
    if (!$('#simBackdrop').hidden){ closeSim(); return; }
    if (!$('#mindBackdrop').hidden){ closeMind(); return; }
  }
  if (!location.hash.startsWith('#/lesson/')) return;
  const id = location.hash.slice(9);
  const idx = LESSONS.findIndex(l => l.id === id);
  if (e.key === 'ArrowLeft' && LESSONS[idx-1]) location.hash = '#/lesson/' + LESSONS[idx-1].id;
  if (e.key === 'ArrowRight' && LESSONS[idx+1]) location.hash = '#/lesson/' + LESSONS[idx+1].id;
});

$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
$('#overlay').addEventListener('click', () => document.body.classList.remove('nav-open'));

/* theme */
const T_KEY = 'pcbcourse.theme';document.documentElement.dataset.theme = localStorage.getItem(T_KEY) || 'light';
const themeBtn = $('#themeBtn');
themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(T_KEY, next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  /* 已渲染的 mermaid 图按新主题就地重绘 */
  view.querySelectorAll('.diagram[data-done]').forEach(el => {
    el.textContent = el.dataset.src || '';
    delete el.dataset.done;
  });
  renderDiagrams();
});

/* 备份使用独立格式，恢复之前先核验每课的任务文本与顺序。 */
function makeProgressBackup(){
  return {format:'pcb-course-progress', version:1, exportedAt:new Date().toISOString(),
    taskSignatures:Object.fromEntries(LESSONS.map(l => [l.id, l.taskSignature])),
    progress:[...progress], checks};
}
function validateProgressBackup(data){
  if (!data || typeof data !== 'object' || Array.isArray(data) || data.format !== 'pcb-course-progress' || data.version !== 1 ||
      !Array.isArray(data.progress) || !data.checks || typeof data.checks !== 'object' || Array.isArray(data.checks) ||
      !data.taskSignatures || typeof data.taskSignatures !== 'object' || Array.isArray(data.taskSignatures)) throw Error('文件格式不正确或版本不受支持');
  if (data.progress.length > LESSONS.length || new Set(data.progress).size !== data.progress.length ||
      data.progress.some(id => typeof id !== 'string' || !Object.hasOwn(BY_ID, id))) throw Error('课程完成记录不正确');
  for (const [id, values] of Object.entries(data.checks)){
    if (!Object.hasOwn(BY_ID, id) || !Array.isArray(values) || values.length > BY_ID[id].taskCount ||
        values.some(value => value !== null && typeof value !== 'boolean')) throw Error('自测记录不正确');
    if (values.length && data.taskSignatures[id] !== BY_ID[id].taskSignature)
      throw Error('第 '+id+' 课的任务内容或顺序与备份不同，不能自动恢复，请保留备份并人工核对');
  }
  return {progress:data.progress, checks:data.checks};
}
$('#exportProgress').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(makeProgressBackup(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'PCB课程学习进度-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$('#importProgress').addEventListener('click', () => $('#progressFile').click());
$('#progressFile').addEventListener('change', async event => {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  let restored;
  try {
    if (file.size > 2 * 1024 * 1024) throw Error('文件超过 2 MB');
    restored = validateProgressBackup(JSON.parse(await file.text()));
  } catch (err) { alert('无法导入：'+err.message+'。当前进度未更改。'); return; }
  if (!confirm('导入将替换当前课程完成状态和自测记录。建议先导出当前进度。确定继续吗？')) return;
  const oldProgress = localStorage.getItem(P_KEY), oldChecks = localStorage.getItem(C_KEY);
  try {
    localStorage.setItem(P_KEY, JSON.stringify(restored.progress));
    localStorage.setItem(C_KEY, JSON.stringify(restored.checks));
  } catch (err) {
    try {
      if (oldProgress === null) localStorage.removeItem(P_KEY); else localStorage.setItem(P_KEY, oldProgress);
      if (oldChecks === null) localStorage.removeItem(C_KEY); else localStorage.setItem(C_KEY, oldChecks);
      alert('保存失败，已尝试恢复原进度。请检查浏览器存储空间。');
    } catch (_) { alert('保存和回滚均失败；请检查浏览器存储，并使用之前导出的备份恢复。'); }
    return;
  }
  progress = new Set(restored.progress); checks = restored.checks;
  lastHash = null; route(); alert('进度已导入。');
});
$('#resetBtn').addEventListener('click', () => {
  if (confirm('确定要清空全部学习进度和自测打卡记录吗？此操作不可恢复。')){
    progress = new Set(); checks = {};
    saveProgress(); saveChecks();
    renderSidebar(null); route();
    lastHash = null; route();
  }
});

renderSidebar(null);
document.querySelector('.brand .sub').textContent = '从零基础到就业 · ' + STAGES.length + ' 阶段 ' + LESSONS.length + ' 课';
route();
</script>
