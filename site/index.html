none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"215\" y=\"166\" font-size=\"10\" fill=\"currentColor\">DRC/飞线<\/text>\n  <rect x=\"40\" y=\"140\" width=\"130\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"166\" font-size=\"10\" fill=\"currentColor\">3D/丝印<\/text>\n  <rect x=\"40\" y=\"220\" width=\"130\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"246\" font-size=\"10\" fill=\"currentColor\">Gerber 预览<\/text>\n  <rect x=\"200\" y=\"220\" width=\"130\" height=\"42\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"215\" y=\"246\" font-size=\"10\" fill=\"currentColor\">自检表签字<\/text>\n  <line x1=\"170\" y1=\"81\" x2=\"200\" y2=\"81\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"330\" y1=\"81\" x2=\"360\" y2=\"81\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"490\" y1=\"81\" x2=\"520\" y2=\"81\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"595\" y1=\"102\" x2=\"595\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"520\" y1=\"161\" x2=\"490\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"360\" y1=\"161\" x2=\"330\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"200\" y1=\"161\" x2=\"170\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"105\" y1=\"182\" x2=\"105\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"170\" y1=\"241\" x2=\"200\" y2=\"241\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"300\" font-size=\"12\" fill=\"currentColor\">先难后易：难走的先走，普通信号最后补；出板前必须逐层预览 Gerber。<\/text>\n<\/svg>\n```\n\n#### 19.6.9 Gerber 逐层检查清单\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 19-6：Gerber 逐层检查的顺序<\/text>\n  <rect x=\"50\" y=\"65\" width=\"130\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"88\" font-size=\"11\" fill=\"currentColor\">外形/板框<\/text>\n  <text x=\"65\" y=\"106\" font-size=\"10\" fill=\"currentColor\">尺寸/定位孔<\/text>\n  <rect x=\"215\" y=\"65\" width=\"130\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"230\" y=\"88\" font-size=\"11\" fill=\"currentColor\">顶层铜<\/text>\n  <text x=\"230\" y=\"106\" font-size=\"10\" fill=\"currentColor\">线宽/间距<\/text>\n  <rect x=\"380\" y=\"65\" width=\"130\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"395\" y=\"88\" font-size=\"11\" fill=\"currentColor\">底层铜<\/text>\n  <text x=\"395\" y=\"106\" font-size=\"10\" fill=\"currentColor\">地平面完整<\/text>\n  <rect x=\"545\" y=\"65\" width=\"140\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"560\" y=\"88\" font-size=\"11\" fill=\"currentColor\">阻焊<\/text>\n  <text x=\"560\" y=\"106\" font-size=\"10\" fill=\"currentColor\">开窗/桥<\/text>\n  <rect x=\"545\" y=\"155\" width=\"140\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"560\" y=\"178\" font-size=\"11\" fill=\"currentColor\">丝印<\/text>\n  <text x=\"560\" y=\"196\" font-size=\"10\" fill=\"currentColor\">不压焊盘<\/text>\n  <rect x=\"380\" y=\"155\" width=\"130\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"395\" y=\"178\" font-size=\"11\" fill=\"currentColor\">钻孔表<\/text>\n  <text x=\"395\" y=\"196\" font-size=\"10\" fill=\"currentColor\">孔径/数量<\/text>\n  <rect x=\"215\" y=\"155\" width=\"130\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"230\" y=\"178\" font-size=\"11\" fill=\"currentColor\">坐标/BOM<\/text>\n  <text x=\"230\" y=\"196\" font-size=\"10\" fill=\"currentColor\">位号/封装<\/text>\n  <rect x=\"50\" y=\"155\" width=\"130\" height=\"55\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"178\" font-size=\"11\" fill=\"currentColor\">1:1 打印<\/text>\n  <text x=\"65\" y=\"196\" font-size=\"10\" fill=\"currentColor\">实物比对<\/text>\n  <line x1=\"180\" y1=\"92\" x2=\"215\" y2=\"92\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"345\" y1=\"92\" x2=\"380\" y2=\"92\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"510\" y1=\"92\" x2=\"545\" y2=\"92\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"615\" y1=\"120\" x2=\"615\" y2=\"155\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"545\" y1=\"182\" x2=\"510\" y2=\"182\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"380\" y1=\"182\" x2=\"345\" y2=\"182\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"215\" y1=\"182\" x2=\"180\" y2=\"182\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"265\" font-size=\"12\" fill=\"currentColor\">一层一层开关对比；外形/钻孔/阻焊最容易出错，先看这三层。<\/text>\n  <text x=\"50\" y=\"290\" font-size=\"12\" fill=\"currentColor\">1:1 打印能和实物/连接器对上，是最后一道保险。<\/text>\n<\/svg>\n```\n\n#### 19.6.10 设计评审 20 项（出板前）\n\n1. 原理图 ERC=0。\n2. 封装与实物一致。\n3. 板框/定位孔与外壳一致。\n4. 连接器方向/高度正确。\n5. 电源入口保护齐全。\n6. 电源线宽按电流。\n7. 去耦电容靠近引脚。\n8. 晶振包地/走线短。\n9. USB 差分等长/同层。\n10. 底层地连续。\n11. 关键信号不跨分割。\n12. 地过孔足够。\n13. 丝印不压焊盘。\n14. 测试点可探。\n15. DRC=0。\n16. 飞线=0。\n17. 3D 无干涉。\n18. Gerber 逐层正确。\n19. 钻孔/坐标/BOM 一致。\n20. 自检表签字。\n\n**评审方式**：自己按表打勾 + 同事交叉看；不要“我觉得没问题”。\n\n#### 19.6.11 1:1 打印与实物比对\n\n**做法**：把顶层/丝印/板框按 1:1 打印到 A4；把连接器/排针/大器件放上去比对。\n\n**看什么**：连接器位置/方向/间距；定位孔/螺丝孔；器件高度/干涉；板边与外壳。\n\n**工具**：纸/透明胶片；尺子；实物器件/外壳。\n\n**价值**：不用打板就能发现“装不进/插不上”；成本几块钱。\n\n**注意**：打印比例要准确（100%）；PDF 缩放会骗人；用尺子量基准。\n\n**课程**：每次出板前打印一次；比 3D 更直观。\n\n#### 19.6.12 五种“看起来能通”的错误\n\n**一、飞线清零但网络错**：两个网络被同名/短路，DRC 不报；看网络对比。\n\n**二、地铺铜“连上了”但有细颈**：大电流走细颈发热；看铺铜宽度。\n\n**三、差分等长但一正一负反了**：能通但不稳；对照原理图/封装。\n\n**四、电源线够宽但过孔不够**：过孔成瓶颈；多打过孔。\n\n**五、丝印压焊盘但 DRC 没开**：上锡不良；开丝印 DRC。\n\n**共同点**：DRC/飞线只查“规则”，不查“意图”；人要对着原理图看一遍。\n\n**方法**：打印原理图+PCB 截图，逐网络对照；重点电源/地/差分/复位。\n\n#### 19.6.13 从 2 层板到 4 层板：思路怎么迁移\n\n**不变**：分区、电源/地、晶振/差分、去耦、DRC——所有原则不变。\n\n**变化**：多一个完整地平面/电源平面；回流更好，布线更容易；但叠层/盲埋孔/平面分割变复杂。\n\n**迁移**：把 2 层板的“地通道”换成“地平面”；把“跨分割”换成“平面分割/跨分割”；把“铺铜”换成“平面”。\n\n**别丢**：层数多了不代表可以乱布；参考平面不连续照样出问题。\n\n**学习路径**：2 层板练“回流/布局”，4 层板练“叠层/阻抗/平面”；后面第 24～30 章会展开。\n\n**提醒**：4 层板成本高，别用“升层”掩盖布局问题；能 2 层解决就别 4 层。\n\n#### 19.6.14 布线后的网表对比\n\n**做法**：PCB 导出网表/网络表，与原理图网表对比；或软件自带“设计同步检查”。\n\n**看什么**：网络数量/名称/引脚连接；差分对；电源/地；NC。\n\n**常见差异**：封装引脚映射错、网络被改名、差分对反、地网络分裂。\n\n**处理**：回原理图改/回 PCB 改；不要“在 PCB 里飞线绕过”。\n\n**记录**：对比结果/差异/处理；出板前再对一次。\n\n**价值**：DRC/飞线查不出“网络意图错”；网表对比是最后一道逻辑检查。\n\n#### 19.6.15 出板后的跟踪与改版记录\n\n**记录**：版本号/日期/改了什么/为什么；Gerber/源文件/BOM 对应。\n\n**问题**：打样/贴片/调试发现的问题；拍照/定位/责任。\n\n**改版**：下一版改哪些；优先级；验证方法。\n\n**追溯**：同一版本多块板；哪块返修/换料。\n\n**交付**：版本说明 + 变更记录；不要“最后一版”“最终版”。\n\n**课程**：板子出问题不可怕，怕的是“不知道为什么/改了又忘”。\n#### 19.6.16 板边、工艺边与外形细节\n\n**板边**：铜/器件距板边 ≥0.5mm；铣刀路径；外形公差。\n\n**工艺边**：拼板时 ≥5mm；Mark/定位孔；不要放器件/走线。\n\n**外形**：直线/圆弧；圆角；避免尖角应力。\n\n**定位孔**：按结构；非金属化/金属化；孔径公差。\n\n**V-cut**：留 0.3～0.5mm；不要切到器件；分板方向。\n\n**邮票孔**：孔径/间距；掰板应力。\n\n**检查**：Gerber 外形层与板框图一致；1:1 打印量尺寸。\n\n#### 19.6.17 布线完成后的“三个对照”\n\n**对照原理图**：网络/引脚/极性；重点电源、地、复位、差分。\n\n**对照封装**：1 脚/焊盘编号/尺寸；实物放上去看。\n\n**对照结构**：板框/孔位/连接器/高度；1:1 打印/3D。\n\n**方法**：打印三份，逐项打勾；发现问题回改，不要“在脑子里对”。\n\n**结果**：三个对照都过，才算“布完”；否则只是“连上了”，离能出板还有距离。\n\n### 19.7 常见坑\n\n1. **底层地平面被切碎**：回流差。\n2. **晶振走线长/不包地**：不起振/干扰。\n3. **USB 差分不等长/跨分割**：丢包。\n4. **电源线太细**：掉压/发热。\n5. **去耦电容放远**：电源噪声。\n6. **过孔太少**：地连接差。\n7. **丝印压焊盘**：上锡不良。\n8. **排针/USB 干涉**：装不进外壳。\n9. **Gerber 少层/镜像**：板子做错。\n\n#### 19.7.1 十五个 2 层板实战坑\n\n1. **底层地平面被长线切断**：USB/复位跨缝，回流绕远。\n2. **晶振走线 20mm 还过排针**：不起振/跑飞。\n3. **去耦电容放在板边**：等于没放。\n4. **USB 差分一正一负不同层**：阻抗/时序都乱。\n5. **电源线 10mil 走 2A**：掉压/发热。\n6. **过孔只打几个**：地不连续。\n7. **铺铜孤岛/细颈**：地效果差。\n8. **丝印压焊盘**：上锡不良。\n9. **连接器被器件挡住**：插不进。\n10. **板框/定位孔和外壳对不上**：装不进。\n11. **Gerber 少外形/镜像**：板子做错。\n12. **DRC 没按板厂规则**：做不出来。\n13. **拼板没有工艺边**：贴片机夹不住。\n14. **测试点被阻焊盖住**：探针扎不到。\n15. **出板前不预览 Gerber**：错层/错孔。\n\n**共同点**：都能在“布局/DRC/Gerber 预览”阶段发现；返工成本远高于检查成本。\n\n#### 19.7.2 三个 2 层板返修案例\n\n**案例一：USB 偶发不识别**。现象：插上有时枚举、有时不。排查：D+/D− 等长差 40mil、跨地缝。整改：重走等长、缝两侧加过孔；复测通过。\n\n**案例二：晶振不起振**。现象：新板 30% 不起振。排查：负载电容按 20pF 选、实际 CL=10pF；走线 15mm。整改：换 12pF、缩短走线、包地；起振正常。\n\n**案例三：电源掉压重启**。现象：接负载后 3.3V 跌到 2.9V。排查：LDO 输入线 10mil、输入电容远。整改：加宽到 30mil、电容靠近；掉压消失。\n\n**共同点**：都不是“玄学”，是“等长/电容/线宽”的可计算问题；返修前先算/先测。\n\n#### 19.7.3 出板前 30 项自检表\n\n| # | 检查 | 通过 |\n|---|---|---|\n| 1 | 原理图 ERC=0 |  |\n| 2 | 封装与实物一致 |  |\n| 3 | 板框尺寸正确 |  |\n| 4 | 定位孔/螺丝孔正确 |  |\n| 5 | 连接器位置/方向 |  |\n| 6 | 连接器高度/干涉 |  |\n| 7 | 电源入口保护 |  |\n| 8 | 电源线宽 |  |\n| 9 | 电源过孔 |  |\n| 10 | 去耦电容位置 |  |\n| 11 | 晶振包地 |  |\n| 12 | 晶振走线长度 |  |\n| 13 | USB 差分等长 |  |\n| 14 | USB ESD/CC |  |\n| 15 | 底层地连续 |  |\n| 16 | 关键信号不跨分割 |  |\n| 17 | 地过孔数量 |  |\n| 18 | 复位/BOOT |  |\n| 19 | SWD/串口 |  |\n| 20 | 测试点 |  |\n| 21 | 丝印不压焊盘 |  |\n| 22 | 丝印可读 |  |\n| 23 | DRC=0 |  |\n| 24 | 飞线=0 |  |\n| 25 | 3D 无干涉 |  |\n| 26 | Gerber 逐层 |  |\n| 27 | 钻孔表 |  |\n| 28 | 坐标/BOM |  |\n| 29 | 1:1 打印 |  |\n| 30 | 评审签字 |  |\n\n30 项全过再下单；有一条不确定，就先问/先查。\n\n#### 19.7.4 三条“布局顺序”的经验\n\n**经验一：先放“必须靠近”的**。晶振、去耦、SWD、连接器；这些位置错了，后面怎么布都别扭。\n\n**经验二：先放“大/高/固定”的**。MCU、连接器、大电容、排针；小阻容最后塞。\n\n**经验三：先留“通道”再放器件**。电源/地/差分通道先想好；不要“先塞满再找路”。\n\n**反例**：先放一堆 LED/按键，最后 MCU 没地方、晶振绕 20mm。\n\n**方法**：用飞线视图反复挪；每次挪完看飞线是否变短/交叉变少。\n\n**结果**：布局好，布线时间减半；布局差，布线靠“硬拉”。\n#### 19.7.5 出板前最后十分钟\n\n**第一分钟**：看板框/定位孔/连接器——装不进，其他都白搭。\n\n**第二分钟**：看电源/地——线宽/过孔/去耦/地连续。\n\n**第三分钟**：看晶振/USB——位置/走线/包地/等长。\n\n**第四分钟**：看丝印——1 脚/极性/接口/警告。\n\n**第五分钟**：看 DRC/飞线——有没有“忽略/未连”。\n\n**第六分钟**：看 3D——高度/干涉。\n\n**第七分钟**：看 Gerber——外形/钻孔/阻焊/丝印。\n\n**第八分钟**：看 BOM/坐标——位号/封装/数量。\n\n**第九分钟**：看 1:1 打印——和实物比对。\n\n**第十分钟**：签字/打包/下单。\n\n**原则**：这十分钟能拦住 80% 的返工；不要“先下单再说”。\n\n### 19.8 本章复盘\n\n#### 19.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 底层地连续 | 回流 | 关键信号不跨分割 |\n| USB 90Ω 等长 | 差分 | 同层、短 |\n| 晶振包地 | 时钟 | 地过孔 |\n| 电源 20～40mil | 载流 | 按电流 |\n| DRC=0/飞线=0 | 出板 | 逐项 |\n\n#### 19.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 跨分割 | split crossing | 信号跨过平面缝隙 |\n| 回流 | return current | 电流返回路径 |\n| 包地 | ground shielding | 用地包围敏感电路 |\n| 飞线 | ratsnest | 未布线提示 |\n| Gerber | Gerber | 生产光绘文件 |\n\n#### 19.8.3 自测 15 题\n\n1. 2 层板的地怎么做才连续？\n2. 什么情况必须升 4 层？\n3. 2A 电流、1oz、10℃ 温升，线宽约多少？\n4. 0.3mm 过孔能过多大电流？\n5. 爬电距离和电气间距有什么区别？\n6. 2 层板能做 90Ω 差分吗？难点在哪？\n7. 去耦电容为什么必须靠近引脚？\n8. 晶振包地要打哪些过孔？\n9. USB 差分三条要求是什么？\n10. 底层地被切断时怎么补？\n11. DRC 清零后还要检查什么？\n12. Gerber 要包含哪些层？\n13. 拼板为什么需要工艺边和 Mark 点？\n14. 打样收货要检查什么？\n15. 出板前自检表至少包含哪几项？\n\n**参考答案要点**：连续地/多过孔；高速/细间距/大电流/EMC；约 22mil；约 1～1.5A；爬电沿表面、间距空气；介质厚线宽大；本地瞬态电流；四周+下方；等长等距同层；加地过孔/桥接/改层；飞线/丝印/3D/ Gerber；铜层/阻焊/丝印/外形/钻孔；贴片效率/夹持/定位；外观/尺寸/通断；DRC/飞线/Gerber/3D/丝印。\n\n#### 19.8.4 能力清单与验收（扩展）\n\n- [ ] 能根据外壳画板框/定位孔，连接器一次放对。\n- [ ] 能按“电源→晶振→USB→排针”顺序布局。\n- [ ] 能用 `I=k·ΔT^0.44·A^0.725` 算线宽并校验压降。\n- [ ] 能处理底层地跨分割（改层/桥接/过孔）。\n- [ ] 能做晶振包地、USB 差分等长、Type-C CC/ESD。\n- [ ] 能 DRC/飞线清零，3D/1:1 打印检查。\n- [ ] 能输出 Gerber/钻孔/坐标/BOM 并逐层预览。\n- [ ] 能写 30 项自检表并解释每一项。\n\n**项目验收**：打样回来能焊、能上电、能跑 blink、USB 能枚举、晶振稳定、电源不掉压、结构无干涉、生产文件可复用。\n\n**不达标表现**：飞线没清、DRC 靠忽略、Gerber 没预览、丝印压焊盘、连接器装不进——任何一条都说明还没到“能出板”。\n\n#### 19.8.5 复盘清单\n\n1. 先定结构还是先布局？\n2. 电源/地通道留够了吗？\n3. 晶振/ USB 是否最后才想起？\n4. 去耦电容都在 2mm 内吗？\n5. 底层地有没有被长线切断？\n6. 关键信号跨分割了吗？\n7. 过孔数量/位置合理吗？\n8. 丝印有没有压焊盘？\n9. 3D 有没有干涉？\n10. DRC/飞线清零了吗？\n11. Gerber 逐层预览了吗？\n12. 自检表签字了吗？\n\n12 条都过，2 层板才算“能出板”，而不是“看起来连上了”；这是布局布线这一章的最低交付线，也是进入下一章 Bring-Up 之前必须守住的底线；守不住，后面就只能靠返修补课，时间和成本都会翻倍，而且不一定能补回来；所以在出板前多花十分钟，永远比事后返修划算，也比“下一版再改”更省时间，更不会把问题带到下一章；板子做对，是后面所有调试的前提，也是硬件工程师最值钱的一项基本功，值得反复练，练到“看一眼就知道哪里有缝”，这就是经验，也是这一章最想让你带走的东西：会看图、会算账、会检查。\n\n#### 19.8.6 项目交付清单\n\n- [ ] 原理图 PDF（含版本/日期）。\n- [ ] PCB 源文件 + Gerber + 钻孔。\n- [ ] BOM（位号/型号/封装/数量/替代）。\n- [ ] 贴片坐标。\n- [ ] 钢网文件（如需要）。\n- [ ] 叠层/工艺说明。\n- [ ] 3D 截图/装配说明。\n- [ ] 测试点/引脚表。\n- [ ] Bring-Up 记录表模板。\n- [ ] 自检表/评审记录。\n\n**交付标准**：别人拿到这一套，能直接下单/贴片/调试，不用再问你。\n\n**课程**：第 19 章的项目文件，就是后面第 20 章 Bring-Up 的输入。\n\n#### 19.8.7 下一章\n\n\n**本章的项目文件**：原理图 PDF、PCB 源文件、Gerber、钻孔、BOM、坐标、自检表——这一套就是第 20 章 Bring-Up 的输入。板子回来之前，先把“测什么/怎么测/记录什么”想好；Bring-Up 才不会手忙脚乱。\n\n**下一章的重点**：静态检查、限流上电、电源/复位/时钟/SWD 顺序、故障树、记录表。首板不怕慢，怕跳步。\n\n\n下一章讲**首板上电与 Bring-Up**：板子回来，先别急着插 USB，按顺序上电、测点、定位。","taskSignature":"c3b06a01c86014d049d4850a3af4f91caade34c6f233191c55e141d305239cb1","taskCount":18},{"id":"20","title":"第 20 章 · 首板上电与 Bring-Up","short":"首板上电与 Bring-Up","stage":3,"diff":3,"prev":"第 19 章 2 层板布局布线实战","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 制定首板上电的安全顺序，避免“一上电就冒烟”。\n2. 用限流电源、万用表、示波器定位电源/复位/时钟问题。\n3. 按“电源→MCU→时钟→调试→外设→通信”的顺序 Bring-Up。\n4. 读懂常见现象：不亮、不跑、不认、不通，分别查什么。\n5. 用 SWD 读 ID、读寄存器、下载程序，确认芯片活着。\n6. 记录 Bring-Up 日志，形成可复现的排障表。\n7. 说出至少 8 个首板上电常见坑。\n\nBring-Up 是硬件工程师的“急诊”。板子第一次上电，最怕“全焊满、直接满压”。正确做法是分步、限流、先测后上电。\n\n## 正文\n\n### 20.1 它解决什么问题：三个真实场景\n\n#### 场景一：一上电就冒烟，LDO 反了\n\nLDO 封装焊反/引脚定义错，12V 直接灌到 3.3V 轨，MCU 烧。上电前先目视/测二极管，限流 100mA，能救回大部分板子。\n\n#### 场景二：电源正常，MCU 不跑\n\n3.3V 正常，但 BOOT0 悬空、NRST 被电容按住、晶振不起振。按“电源→复位→时钟→调试”顺序查，不要一上来刷固件。\n\n#### 场景三：SWD 能连，但下载失败\n\nSWD 能读 ID，下载时提示 Flash 保护/时钟不对。检查 BOOT、复位、电源跌落、SWD 速率。\n\n### 20.2 它是什么：Bring-Up 是分步验证\n\nBring-Up 顺序：\n\n1. 目视/短路检查（不焊关键芯片）\n2. 电源段上电（限流）\n3. 焊 MCU，测电流/电压\n4. 复位/BOOT/时钟\n5. SWD 连接/读 ID\n6. 下载/运行最小程序\n7. 外设逐个验证\n8. 通信/负载/老化\n\n> **术语第一次出现**：限流上电（current-limited power-up）是把电源限流设到预期电流的 1.2～2 倍，短路时电压跌落而不是烧板。\n\n#### 20.2.1 上电前的静态检查\n\n首板最大的风险不是“设计错”，是“焊错/短路”。上电前用 10 分钟做静态检查，能救回大部分板子。\n\n**目视**：连锡/虚焊/立碑/极性/器件方向；连接器/座子是否焊反；BGA/QFN 是否偏移。\n\n**对地阻抗**：万用表电阻档/二极管档测 12V/5V/3.3V 对 GND；正常是几百 Ω 到几 kΩ（有电容充电会跳）；接近 0Ω 就是短路，不能上电。\n\n**二极管档**：测 LDO 输入输出、MOS 体二极管、TVS 方向；能看出“反了/短路”。\n\n**电源轨隔离**：先不焊 MCU/大电流负载，只焊电源段；测电压正常再焊负载。\n\n**保险/限流**：输入串自恢复保险/限流电阻；限流电源设到预期电流 1.2～2 倍。\n\n**静电/台面**：防静电台垫/腕带；金属台面短路；板子下垫绝缘。\n\n**记录**：静态检查结果写进 Bring-Up 日志；哪一步没过，就停在哪一步。\n\n#### 20.2.2 限流上电与电流判读\n\n限流上电是“用电源保护板子”，不是“正常供电”。\n\n**设置**：电压=标称（比如 12V），限流=预期电流×1.5；预期不知道就先 50～100mA。空板/轻载电流很小，限流低能立刻发现短路。\n\n**现象判读**：\n\n- 电压正常、电流很小：正常/负载没接；\n- 电压被拉低、电流到限流值：短路/反接/器件坏；\n- 电流逐渐上升：电容充电/器件发热；\n- 电流跳动：接触不良/振荡。\n\n**逐步加压**：12V 系统可先 5V/9V 试，再 12V；3.3V 轨先 1.8V/2.5V 试（注意欠压不复位）。\n\n**限流不是保险**：限流电源反应慢，短路瞬间仍可能损坏；保险/ TVS 是第二层保护。\n\n**记录**：空板/半载/满载电流都记；后面比较“是否异常”。\n\n**常见错误**：限流设太大（等于没限）、限流设太小（正常启动被误判）、上电顺序错（先功率后控制）。\n\n#### 20.2.3 首板电流预算：先算“应该多少”\n\n不知道“正常电流”，就无法判断“异常电流”。\n\n**静态电流**：MCU 睡眠 + LDO 静态 + 上拉/指示 LED；通常几 mA 到几十 mA。\n\n**运行电流**：MCU 72MHz + 外设 + LED + 通信；几十 mA 到几百 mA。\n\n**峰值电流**：继电器/电机/无线发射；可能是平均的几倍；电源/限流要按峰值。\n\n**算法**：`I_total=ΣI_device + 余量(30%)`；每路电源分别算；DCDC/LDO 效率影响输入电流。\n\n**算例**：3.3V 轨 MCU 30mA + LED 4×5mA + 传感器 5mA + 串口 5mA ≈ 60mA；5V 输入经 LDO，`I_in≈60mA×3.3/5/0.9≈44mA`（LDO 输入电流≈输出）。\n\n**判读**：实测电流比预算大很多→短路/器件错/短路保护；小很多→没跑起来/外设没使能。\n\n**记录**：空板/运行/峰值都写进日志；后面对比“是否漂移”。\n\n#### 20.2.4 焊接顺序：先低后高、先小后大\n\n同一块板，焊接顺序影响返修难度。\n\n**先电源后负载**：电源段焊完测电压，再焊 MCU/外设；避免“电源错烧一片”。\n\n**先小后大**：0402/0603 小阻容→QFN/QFP→连接器/大电容；大器件挡住小焊点。\n\n**先低后高**：矮器件先焊，高器件后焊；避免热风/烙铁碰倒。\n\n**先贴片后插件**：贴片回流/热风，插件最后手工焊；插件挡贴片。\n\n**关键器件最后**：MCU/BGA/贵器件最后焊，减少返修次数。\n\n**焊接参数**：烙铁 330～360℃（无铅）、热风 260～300℃、预热台 100～150℃；按锡膏/器件。\n\n**保护**：ESD/防静电；连接器/屏排线最后插；焊接后清洗助焊剂。\n\n#### 20.2.5 首板预算与“预期值”表\n\n| 项目 | 预期 | 实测 | 偏差原因 |\n|---|---|---|---|\n| 12V 空载电流 | <10mA |  |  |\n| 5V 空载 | <20mA |  |  |\n| 3.3V 空载 | <30mA |  |  |\n| 3.3V 运行 | 40～80mA |  |  |\n| 5V 运行 | 50～100mA |  |  |\n| LDO 温升 | <30℃ |  |  |\n| MCU 温升 | <20℃ |  |  |\n\n先写“预期”，再测“实测”；偏差大就查，不凭感觉。\n### 20.3 关键参数与工具\n\n| 工具 | 用途 | 设置 |\n|---|---|---|\n| 可调电源 | 限流上电 | 电压=标称，限流=预期×1.5 |\n| 万用表 | 电压/通断/二极管 | 先测阻抗 |\n| 示波器 | 复位/时钟/纹波 | 20MHz 带宽 |\n| 热像仪 | 找发热 | 上电后扫 |\n| SWD 调试器 | 下载/读 ID | 速率先低后高 |\n\n#### 20.3.1 工具设置：示波器、万用表、热像仪\n\n**示波器**：探头 10×，带宽限制 20MHz（测电源纹波），耦合 DC（看电平）/AC（看纹波）；地线短（弹簧地），避免长地线引入噪声；触发用边沿/单次抓上电。\n\n**万用表**：电阻/通断/二极管/电压/电流档；测对地阻抗先断电、放电；通断档有阈值（<50Ω 响），不要当精密电阻用。\n\n**热像仪**：上电前调发射率/量程；上电后扫 LDO/MCU/驱动/MOS；异常发热点先断电查；小器件可贴黑胶带提高发射率。\n\n**SWD 调试器**：先 1MHz，稳定后升；接线短/地可靠；目标板供电/调试器供电不要冲突。\n\n**可调电源**：限流/电压/电流显示；带输出开关；最好有远端补偿（长线）。\n\n**工具不是越多越好**：万用表+示波器+限流电源，三件套能覆盖 80% 首板问题。\n\n#### 20.3.2 万用表的四个关键测法\n\n**对地阻抗**：断电/放电，红笔接测试点、黑笔接 GND；电阻档；有电容会缓慢上升，等稳定读数；<10Ω 重点查短路。\n\n**通断**：断电测焊点/连接器；<50Ω 响；不要带电测。\n\n**二极管档**：测 LDO 输入输出、MOS 体二极管、TVS；正向 0.5～0.7V，反向 OL；反了/短路能看出。\n\n**电压/电流**：电压并联、电流串联；电流档不要并联到电源（会短路）；测电流用限流电源显示更方便。\n\n**技巧**：表笔尖细/钩子；测 QFN 用针；地参考选干净点；读数跳动查接触/干扰。\n\n**误区**：通断响≠焊好（可能是旁边短路）；电压正常≠能带载；二极管档测在路会受并联影响。\n#### 20.3.3 示波器抓上电的单次设置\n\n**时基**：先 100ms/div 看全程，再放大到 1ms/div 看细节；上电过程几十 ms。\n\n**触发**：边沿触发、上升沿、电平在 1～2V；单次（Single）抓第一次上电。\n\n**通道**：CH1 电源、CH2 NRST/BOOT0；两通道对比时序。\n\n**探头**：10×、短地；测纹波用弹簧地；高压/浮地用差分探头。\n\n**保存**：截图/存波形；记录时间/条件；和后面批次对比。\n\n**常见错误**：时基太快看不到全程、触发没设好抓不到、地线长引入噪声。\n\n### 20.4 三个典型排障流程\n\n#### 20.4.1 电源不亮\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 20-1：电源不亮排障树<\/text>\n  <rect x=\"280\" y=\"55\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"85\" font-size=\"13\" fill=\"currentColor\">无输出<\/text>\n  <rect x=\"80\" y=\"140\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"105\" y=\"170\" font-size=\"12\" fill=\"currentColor\">输入有无？<\/text>\n  <rect x=\"280\" y=\"140\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"305\" y=\"170\" font-size=\"12\" fill=\"currentColor\">短路？<\/text>\n  <rect x=\"480\" y=\"140\" width=\"170\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"170\" font-size=\"12\" fill=\"currentColor\">使能/反馈？<\/text>\n  <rect x=\"80\" y=\"235\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"100\" y=\"265\" font-size=\"11\" fill=\"currentColor\">保险/接口/极性<\/text>\n  <rect x=\"280\" y=\"235\" width=\"160\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"300\" y=\"265\" font-size=\"11\" fill=\"currentColor\">测对地阻抗<\/text>\n  <rect x=\"480\" y=\"235\" width=\"170\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"500\" y=\"265\" font-size=\"11\" fill=\"currentColor\">EN/FB/电感/焊点<\/text>\n  <line x1=\"360\" y1=\"105\" x2=\"360\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"165\" x2=\"280\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"165\" x2=\"480\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"160\" y1=\"190\" x2=\"160\" y2=\"235\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"190\" x2=\"360\" y2=\"235\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"565\" y1=\"190\" x2=\"565\" y2=\"235\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n#### 20.4.2 MCU 不跑\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 20-2：MCU 不跑排查顺序<\/text>\n  <rect x=\"40\" y=\"70\" width=\"130\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"105\" font-size=\"12\" fill=\"currentColor\">电源 3.3V<\/text>\n  <rect x=\"200\" y=\"70\" width=\"130\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"220\" y=\"105\" font-size=\"12\" fill=\"currentColor\">复位波形<\/text>\n  <rect x=\"360\" y=\"70\" width=\"130\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"380\" y=\"105\" font-size=\"12\" fill=\"currentColor\">BOOT 电平<\/text>\n  <rect x=\"520\" y=\"70\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"540\" y=\"105\" font-size=\"12\" fill=\"currentColor\">晶振起振<\/text>\n  <line x1=\"170\" y1=\"100\" x2=\"200\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"100\" x2=\"360\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"490\" y1=\"100\" x2=\"520\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"200\" y=\"200\" width=\"320\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"225\" y=\"235\" font-size=\"12\" fill=\"currentColor\">SWD 读 ID / 下载最小程序<\/text>\n  <line x1=\"595\" y1=\"130\" x2=\"595\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"595\" y1=\"230\" x2=\"520\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"285\" font-size=\"13\" fill=\"currentColor\">顺序不能跳：先电源，再复位/BOOT，再时钟，最后调试。<\/text>\n<\/svg>\n```\n\n#### 20.4.3 通信不通\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 20-3：UART/RS485 不通检查点<\/text>\n  <rect x=\"40\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"115\" font-size=\"12\" fill=\"currentColor\">TX/RX<\/text>\n  <rect x=\"200\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"220\" y=\"115\" font-size=\"12\" fill=\"currentColor\">电平/交叉<\/text>\n  <rect x=\"360\" y=\"80\" width=\"120\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"380\" y=\"115\" font-size=\"12\" fill=\"currentColor\">波特率/时钟<\/text>\n  <rect x=\"520\" y=\"80\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"540\" y=\"115\" font-size=\"12\" fill=\"currentColor\">共地/终端<\/text>\n  <line x1=\"160\" y1=\"110\" x2=\"200\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"320\" y1=\"110\" x2=\"360\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"480\" y1=\"110\" x2=\"520\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"220\" font-size=\"13\" fill=\"currentColor\">先看波形有没有、电平对不对，再看协议/终端，最后怀疑固件。<\/text>\n<\/svg>\n```\n\n#### 20.4.4 电源纹波、负载瞬态与软启动\n\n电源“有电压”不等于“能带负载”。\n\n**纹波**：示波器 AC 耦合、20MHz 带宽、探头地弹簧；测 3.3V/5V 输出；纹波大查电容/布局/开关频率。\n\n**负载瞬态**：电子负载/继电器切负载，看电压跌落/恢复；跌落大查反馈/输出电容/布线。\n\n**软启动**：DCDC 的 SS 脚/内部软启动，限制上电浪涌；软启动太长会“上电慢”，太短会过流。\n\n**上电时序**：多路电源按顺序（core→IO→模拟）；用示波器多通道抓；时序错会锁死/大电流。\n\n**效率/发热**：满载测输入功率/输出功率，算效率；发热点用热像仪；效率低查电感/开关/死区。\n\n**记录**：纹波峰峰值、瞬态跌落、效率、温度；这些是“电源能不能交付”的判据。\n\n#### 20.4.5 焊接返修与冷焊：Bring-Up 的一半是焊\n\n首板问题里，焊接占很大比例。\n\n**冷焊**：焊点未润湿/发暗/成球；看似焊上，实际电阻大/时通时断。返修：加助焊剂/补焊。\n\n**连锡**：QFP/QFN 引脚间短路；用吸锡带/助焊剂清理；显微镜检查。\n\n**立碑/偏移**：小电容/电阻一端翘起；返修：热风+镊子复位。\n\n**虚焊**：BGA/QFN EP 底部空洞；X-Ray 才能看出；返修：重新植球/回流。\n\n**焊盘脱落**：过热/拉拽；飞线/补焊盘；改设计加泪滴。\n\n**返修工具**：烙铁/热风/预热台/显微镜/助焊剂/吸锡带；温度按锡膏/器件。\n\n**返修后**：重新测对地阻抗/上电电流；不要“焊完直接满压”。\n\n**记录**：返修位置/原因/结果；同一位置反复返修说明设计/工艺有问题。\n\n#### 20.4.6 复位与时钟波形怎么判读\n\n**NRST**：上电应从低到高；一直低→复位按键/电容/短路；一直高但不起振→时钟/BOOT；抖动→干扰/按键。\n\n**BOOT0**：上电时必须低（Flash）；高→进 ISP；跳变→接触不良。\n\n**晶振**：正弦/近似方波，频率 8MHz；幅度小/不起→负载电容/焊接；探头电容会让它停振，测时用 10×/短地。\n\n**SWDCLK/SWDIO**：连接时有波形；无波形→调试器/接线/目标未上电。\n\n**电源纹波**：AC 耦合，20MHz 带宽；峰峰值大→电容/布局；上电过冲→软启动/电容。\n\n**判读原则**：先看“有没有”，再看“电平对不对”，最后看“时序对不对”。\n\n#### 20.4.7 发热排查：热像仪怎么用\n\n**发射率**：金属/亮面反射，测温不准；贴黑胶带/喷哑光漆，发射率设 0.95。\n\n**量程**：先大量程扫，再缩小；避免“满量程饱和”。\n\n**扫描顺序**：LDO/DCDC→MCU→驱动/MOS→连接器→电感/电阻；异常热点优先。\n\n**判据**：`Tj=Ta+P×RθJA`；手摸烫（>60℃）要查；器件结温留 20℃ 余量。\n\n**常见热点**：LDO 压差大、MOS 导通电阻大、电感饱和、电阻功率不够、短路。\n\n**处理**：降电流/换封装/加铜/加散热；不要“烫但能用”就放过。\n\n**记录**：热点位置/温度/负载条件；老化前后对比。\n\n#### 20.4.8 多路电源的上电时序\n\n多电源系统，时序错会“锁死/大电流/器件损坏”。\n\n**顺序原则**：core（内核）→IO→模拟/射频；或按芯片手册；DCDC 的 PG（Power Good）级联 EN。\n\n**时序参数**：上升时间/延时/单调性；用示波器多通道抓；非单调上升可能锁死。\n\n**常见错误**：3.3V 早于 5V、VDDA 早于 VDD、IO 有电 core 没电→漏电/锁死。\n\n**实现**：EN 分压/RC 延时、PG 级联、电源排序芯片；软件也可控制（但硬件要先安全）。\n\n**验证**：反复上电/断电，抓时序；异常时加负载/温度。\n\n**记录**：每路上升时间/延时/过冲；和手册比。\n#### 20.4.9 静电与台面：别在最后一步毁板\n\n**静电来源**：人体/衣服/塑料/地毯；MOS/BGA/连接器最怕。\n\n**防护**：防静电台垫/腕带（1MΩ 限流）、接地烙铁、离子风机；板子放防静电袋。\n\n**台面**：金属台面/工具短路；板子下垫绝缘；不要带电插拔。\n\n**操作**：拿板边/连接器外壳，不摸金手指/引脚；插拔先断电；连接器对齐再插。\n\n**已损坏表现**：IO 漏电/ADC 漂/通信不稳/上电电流大；可能“时好时坏”。\n\n**课程**：至少做到“洗手/摸接地金属/拿板边”；条件允许用腕带。\n\n### 20.5 选型与降额\n\n| 工具/设置 | 建议 | 注意 |\n|---|---|---|\n| 限流 | 预期×1.5 | 太小会误判 |\n| 示波器探头 | 10× | 地线短 |\n| SWD 速率 | 先 1MHz | 稳定后再升 |\n| 热像仪 | 上电扫 | 找异常发热 |\n\n#### 20.5.1 首板上电顺序表（可打印）\n\n| 步 | 操作 | 判据 | 不通过怎么办 |\n|---|---|---|---|\n| 1 | 目视/短路 | 无连锡，阻抗>100Ω | 返修/查短路 |\n| 2 | 只焊电源段 | 12V/5V/3.3V 正常 | 查输入/EN/FB |\n| 3 | 焊 MCU | 3.3V 不跌，电流<50mA | 查短路/焊接 |\n| 4 | 测复位/BOOT | NRST 高，BOOT0 低 | 查 RC/下拉 |\n| 5 | 测晶振 | 8MHz 起振 | 查电容/焊接 |\n| 6 | SWD 读 ID | ID 正确 | 查地/复位/时钟 |\n| 7 | 下载 blink | LED 闪 | 查 BOOT/Flash |\n| 8 | 逐个外设 | 每个功能正常 | 查对应电路 |\n| 9 | 通信/负载 | 不丢包/不跌压 | 查终端/电源 |\n| 10 | 老化 | 温度/电流稳定 | 查热/余量 |\n\n顺序不能跳；每一步都有“判据/不通过怎么办”，新手也能照着走。\n\n#### 20.5.2 保险、TVS 与限流电阻怎么选\n\n**保险**：额定电流≥最大工作电流 1.5 倍；自恢复保险有保持/跳闸电流/时间；慢启动负载选耐浪涌。\n\n**TVS**：工作电压>正常电压，钳位<后级耐压；双向/单向按信号；结电容按速率（USB 低电容）。\n\n**限流电阻**：`R=(Vin−Vout)/I`；功耗 `P=I²R`；只适合小电流/低成本，大电流用保险/PMOS。\n\n**反接保护**：串联肖特基（压降/发热）或 PMOS（低损耗）；TVS 只能钳位不能防反接。\n\n**过压保护**：TVS + 保险/OVP 芯片；雷击/浪涌用压敏/GDT。\n\n**选型错误**：保险太大（不起作用）、TVS 钳位太高（后级先坏）、限流电阻功率不够（烧）。\n\n**验证**：限流上电 + 短路测试（小心）；确认保护动作后能恢复。\n#### 20.5.3 电源保护链的顺序\n\n保护器件不是“随便加”，顺序决定谁先承受能量。\n\n**典型链**：输入连接器→保险/自恢复→TVS/压敏→共模/滤波→DCDC/LDO→负载。\n\n**原则**：保险在最前（切断持续过流）、TVS 在保险后（钳位瞬态）、滤波在 TVS 后（去残压）；ESD 靠近接口。\n\n**反接**：PMOS/理想二极管在输入；TVS 不能防反接。\n\n**过压**：OVP 芯片/钳位；雷击/浪涌用 GDT/压敏。\n\n**选型**：保险 I²t/电压；TVS 钳位/峰值脉冲；电容耐压/纹波。\n\n**验证**：限流上电、短路、反接（小心）；保护后能恢复/更换。\n\n### 20.6 测量与仿真\n\n#### 20.6.1 上电记录表\n\n| 步骤 | 测点 | 期望 | 实测 | 结论 |\n|---|---|---|---|---|\n| 1 | Vin | 12V | | |\n| 2 | 5V | 5±0.25V | | |\n| 3 | 3.3V | 3.3±0.1V | | |\n| 4 | NRST | 高 | | |\n| 5 | BOOT0 | 低 | | |\n| 6 | SWD ID | 可读 | | |\n\n#### 20.6.2 CircuitJS\n\n```circuitjs\nrc-charge\n```\n\n观察复位 RC 上电波形。\n\n```circuitjs\npower-buck\n```\n\n观察电源软启动/纹波。\n\n#### 20.6.3 动手任务\n\n- 给一块新板做限流上电，记录电压/电流。\n- 测 NRST/BOOT0/晶振。\n- 用 SWD 读 ID，下载 blink。\n- 写一页 Bring-Up 日志。\n\n#### 20.6.4 四个“不”的故障树\n\n**不亮**（电源灯不亮）：输入→保险→LDO EN→输出→LED 极性。先测电压，再测 LED 电流。\n\n**不跑**（MCU 不运行）：3.3V→NRST→BOOT0→晶振→SWD ID。按顺序，不要一上来刷固件。\n\n**不认**（SWD/下载器识别不到）：GND→SWDIO/SWCLK→NRST→BOOT→时钟→调试器速率。地最先查。\n\n**不通**（通信不通）：TX/RX 交叉→电平→共地→波特率→终端→协议。先看波形有无，再看数据。\n\n**共同原则**：从“能量/电平”查到“协议/固件”；先用万用表/示波器，再怀疑芯片/固件。\n\n#### 20.6.5 Bring-Up 日志模板\n\n| 时间 | 步骤 | 现象 | 测量值 | 判断/动作 | 结果 |\n|---|---|---|---|---|---|\n| 10:00 | 目视 | 无连锡 | 3.3V 对地 1.2kΩ | 正常 | 通过 |\n| 10:10 | 上电 5V | 电流 0.02A | 5.01V | 正常 | 通过 |\n| 10:20 | 焊 MCU | 电流 0.05A | 3.30V | 正常 | 通过 |\n| 10:30 | SWD | 读 ID 失败 | SWCLK 无波形 | 接线松 | 重接 |\n| 10:40 | 重试 | 读 ID 成功 | 0x1BA01477 | 正常 | 通过 |\n\n**写法**：时间/步骤/现象/测量值/判断/结果；不写“好像正常”，写数值。\n\n**用途**：复盘/交接/量产对照；同一块板二次调试能快速定位。\n\n**注意**：失败记录也要留；失败比成功更有信息量。\n\n#### 20.6.6 小批试产与首板差异\n\n首板过了，不等于小批能过。\n\n**物料**：替代料/批次差异；连接器/晶振/电容公差；BOM 核对。\n\n**工艺**：贴片偏移/连锡/虚焊；回流曲线；钢网开口。\n\n**测试**：治具/测试点；ICT/FCT；限流/老化。\n\n**一致性**：多块板对比电流/波形/温度；偏差大查物料/工艺。\n\n**文档**：测试记录/不良分析/返修记录；小批问题反馈到设计。\n\n**课程**：没有小批条件，也要知道“首板≠量产”；设计要为测试/生产留余量。\n\n#### 20.6.7 测试点、治具与可测性\n\n板子难测，往往不是“技术问题”，是“没留测试点”。\n\n**测试点**：每路电源、GND、NRST、BOOT0、UART TX/RX、SWD、关键信号；直径≥1mm，间距≥2.54mm。\n\n**位置**：板边/空旷区，探头能碰；不要被高器件/连接器挡住；双面测试点错开。\n\n**丝印**：测试点标网络名/电压；极性与参考。\n\n**治具**：量产用针床/夹具；测试点要能受力；定位孔/边距。\n\n**ICT/FCT**：ICT 测开路/短路/元件值；FCT 测功能；设计要留测试模式/自检。\n\n**可测性设计**：可调/可断开（0Ω/跳线）、可注入（测试点）、可观察（LED/串口）。\n\n**课程**：首板至少留 3.3V/5V/GND/NRST/UART 测试点；调试少拆焊。\n### 20.7 常见坑\n\n1. **满压直接上电**：短路烧一片。\n2. **不测对地阻抗**：电源短路不知道。\n3. **先焊 MCU 再测电源**：电源错烧 MCU。\n4. **复位电容太大**：MCU 不启动。\n5. **BOOT0 悬空**：启动模式随机。\n6. **晶振不起振**：时钟错，串口波特率偏。\n7. **SWD 地不可靠**：连不上/下载失败。\n8. **通信不共地**：波形有但通信不通。\n9. **不记录**：同样问题再犯。\n\n#### 20.7.1 三个首板案例\n\n**案例一：12V 反接，TVS 烧短路**。现象：上电限流立即到顶。排查：输入 TVS 反接/选错，钳位后短路。整改：换双向 TVS/加反接 MOS，限流上电。\n\n**案例二：MCU 焊反，3.3V 对地 0Ω**。现象：焊完 MCU 阻抗近 0。排查：LQFP 方向错，VDD/VSS 反。整改：返修/换芯片，目视 1 脚标记。\n\n**案例三：SWD 能读 ID，下载失败**。现象：读 ID 成功，Flash 编程报错。排查：BOOT0 高/低不对、Flash 保护、电源跌落。整改：BOOT0 下拉、解除保护、加电容。\n\n**共同点**：都能在“静态检查/限流/顺序”里提前发现；跳过步骤就要用返修来补。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 20-4：限流上电的电流—电压关系<\/text>\n  <line x1=\"80\" y1=\"60\" x2=\"80\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"80\" y1=\"240\" x2=\"660\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"70\" font-size=\"11\" fill=\"currentColor\">电压<\/text>\n  <text x=\"620\" y=\"265\" font-size=\"11\" fill=\"currentColor\">电流<\/text>\n  <path d=\"M80 210 L200 210 L220 90 L660 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"230\" y=\"82\" font-size=\"10\" fill=\"currentColor\">正常：恒压<\/text>\n  <path d=\"M80 210 L200 210 L220 180 L660 180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n  <text x=\"230\" y=\"172\" font-size=\"10\" fill=\"currentColor\">短路：限流<\/text>\n  <line x1=\"200\" y1=\"60\" x2=\"200\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"205\" y=\"255\" font-size=\"10\" fill=\"currentColor\">开始带载<\/text>\n  <text x=\"40\" y=\"295\" font-size=\"12\" fill=\"currentColor\">限流=预期×1.5；电压被拉低、电流到顶 = 短路/反接，立即断电。<\/text>\n<\/svg>\n```\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 20-5：首板 Bring-Up 十步流程<\/text>\n  <rect x=\"40\" y=\"55\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"82\" font-size=\"10\" fill=\"currentColor\">1 目视/阻抗<\/text>\n  <rect x=\"190\" y=\"55\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"82\" font-size=\"10\" fill=\"currentColor\">2 电源段<\/text>\n  <rect x=\"340\" y=\"55\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"355\" y=\"82\" font-size=\"10\" fill=\"currentColor\">3 焊 MCU<\/text>\n  <rect x=\"490\" y=\"55\" width=\"140\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"82\" font-size=\"10\" fill=\"currentColor\">4 复位/BOOT<\/text>\n  <rect x=\"490\" y=\"135\" width=\"140\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"162\" font-size=\"10\" fill=\"currentColor\">5 晶振<\/text>\n  <rect x=\"340\" y=\"135\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"355\" y=\"162\" font-size=\"10\" fill=\"currentColor\">6 SWD ID<\/text>\n  <rect x=\"190\" y=\"135\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"162\" font-size=\"10\" fill=\"currentColor\">7 下载 blink<\/text>\n  <rect x=\"40\" y=\"135\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"162\" font-size=\"10\" fill=\"currentColor\">8 外设<\/text>\n  <rect x=\"40\" y=\"215\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"242\" font-size=\"10\" fill=\"currentColor\">9 通信/负载<\/text>\n  <rect x=\"190\" y=\"215\" width=\"120\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"242\" font-size=\"10\" fill=\"currentColor\">10 老化<\/text>\n  <line x1=\"160\" y1=\"77\" x2=\"190\" y2=\"77\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"310\" y1=\"77\" x2=\"340\" y2=\"77\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"460\" y1=\"77\" x2=\"490\" y2=\"77\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"560\" y1=\"100\" x2=\"560\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"490\" y1=\"157\" x2=\"460\" y2=\"157\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"340\" y1=\"157\" x2=\"310\" y2=\"157\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"190\" y1=\"157\" x2=\"160\" y2=\"157\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"100\" y1=\"180\" x2=\"100\" y2=\"215\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"160\" y1=\"237\" x2=\"190\" y2=\"237\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"300\" font-size=\"12\" fill=\"currentColor\">顺序不能跳；每步有判据，不通过就停在那一步。<\/text>\n<\/svg>\n```\n\n#### 20.7.2 首板上电 12 条红线\n\n1. 不测阻抗就上电。\n2. 满压/不限流上电。\n3. 先焊 MCU 再测电源。\n4. 电源反接/极性错。\n5. 复位电容太大/一直拉低。\n6. BOOT0 悬空。\n7. 晶振负载电容错/不起振。\n8. SWD 少地/长线。\n9. 限流设太大/太小。\n10. 通信不共地/不交叉。\n11. 发热不查继续跑。\n12. 不记录，问题重复出现。\n\n红线不是“建议”，是“踩了就大概率烧板/返修”。\n#### 20.7.3 “时好时坏”的三种典型原因\n\n**接触不良**：连接器/排线/焊点；振动/温度变化就复现；查插拔/补焊。\n\n**电源余量不足**：负载峰值/温度升高时跌压；查纹波/瞬态/线损。\n\n**时序/复位临界**：复位 RC 太大、电源上升慢；冷启动/热启动不同；查波形。\n\n**排查方法**：反复上电/轻敲/冷热；记录“什么条件下坏”；不要只测一次。\n\n**共同点**：不是“芯片玄学”，是接触/余量/时序的边界问题。\n\n### 20.8 本章复盘\n\n#### 20.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 限流 = 预期×1.5 | 上电保护 | 太小误判 |\n| 先电源后负载 | Bring-Up | 分步焊 |\n| NRST 高/BOOT0 低 | 启动 | 按手册 |\n| SWD 先低速 | 连接 | 稳定后升 |\n| 共地 | 通信 | 差分/单端都需 |\n\n#### 20.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| Bring-Up | bring-up | 新板首次上电调试 |\n| 限流 | current limit | 限制短路电流 |\n| 读 ID | read ID | 确认芯片活着 |\n| 冷焊 | cold joint | 未润湿的焊点 |\n| 热像 | thermal image | 找发热点 |\n\n#### 20.8.3 自测 10 题\n\n1. 首板上电第一步做什么？\n2. 限流设多少？\n3. 电源不亮先查什么？\n4. MCU 不跑的四步顺序？\n5. BOOT0 正常是什么电平？\n6. 晶振不起振怎么查？\n7. SWD 能连但下载失败查什么？\n8. 通信不通先看什么？\n9. 为什么要记录 Bring-Up 日志？\n10. 热像仪怎么用？\n\n#### 20.8.4 能力清单\n\n- [ ] 能制定限流上电顺序。\n- [ ] 能按电源→MCU→时钟→调试排障。\n- [ ] 能用 SWD 读 ID/下载。\n- [ ] 能测复位/BOOT/晶振/通信。\n- [ ] 能写 Bring-Up 记录。\n\n#### 20.8.5 首板 Bring-Up 复盘清单\n\n1. 上电前测阻抗了吗？\n2. 限流设对了吗？\n3. 电源段先焊先测了吗？\n4. 电流在预算内吗？\n5. 复位/BOOT 电平对吗？\n6. 晶振起振了吗？\n7. SWD 能读 ID 吗？\n8. 下载/运行正常吗？\n9. 外设逐个验证了吗？\n10. 通信共地/交叉/终端对吗？\n11. 发热点查了吗？\n12. 日志写了吗？\n13. 失败原因归档了吗？\n14. 下一块板要改什么？\n\n14 条都过，首板才算真的“Bring-Up 完成”；有一条没过，就先别急着加功能；Bring-Up 的耐心，决定了后面返修的次数；慢就是快，尤其是在首板上；先把每一步测明白，再谈功能和进度；这条顺序反过来，代价往往是一次返修，甚至是一块板报废，这些本来都可以避免，只要按顺序、做记录、不跳步，绝大多数事故都不会发生，剩下的那部分也有记录可查，不至于重头再来，也不会把同一个坑再踩一遍，这就是记录的价值。\n\n#### 20.8.6 下一章\n\n下一章讲**硬件测试与可靠性**：板子能跑只是开始，还要验证它在高低温、振动、EMC、寿命下的表现，把“能工作”变成“能交付”。","taskSignature":"cb632f64a2c94335f189d2fcb3d44eb1c6559c43ee0d21487c0e875d603aa520","taskCount":5},{"id":"21","title":"第 21 章 · 硬件测试与可靠性","short":"硬件测试与可靠性","stage":3,"diff":3,"prev":"第 20 章 首板上电与 Bring-Up","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 区分功能测试、性能测试、环境测试、可靠性测试。\n2. 设计一份覆盖电源/接口/通信/温度的测试计划。\n3. 用高低温、振动、老化、EMC 预测试发现“实验室看不到”的问题。\n4. 理解降额、余量、失效模式（FMEA）的基本思路。\n5. 计算 MTBF 的粗略概念，知道它不能代替实测。\n6. 写测试记录与问题闭环表。\n7. 说出至少 8 个可靠性设计常见坑。\n\n板子“能跑”不等于“能卖”。可靠性测试是把边界条件提前施加到板子上，让问题在出厂前暴露。\n\n## 正文\n\n### 21.1 它解决什么问题：三个真实场景\n\n#### 场景一：常温正常，高温复位\n\n板子在空调房跑一周没事，夏天户外 60℃ 时 MCU 反复复位。LDO 结温超限/晶振频偏/电容 ESR 变化。高温测试要覆盖最坏环境。\n\n#### 场景二：实验室 EMC 过，现场死机\n\n实验室辐射发射勉强过，现场变频器/继电器干扰一来，MCU 跑飞。EMC 不只是“过认证”，还要看抗扰度。\n\n#### 场景三：出货 3 个月，批量虚焊\n\n首批 100 台，3 个月后 5 台虚焊。焊点当时目视 OK，但热循环后开裂。可靠性要用温度循环/振动加速暴露。\n\n### 21.2 它是什么：四层测试\n\n| 层级 | 目的 | 典型项目 |\n|---|---|---|\n| 功能测试 | 每个功能是否工作 | 电源/接口/通信/按键 |\n| 性能测试 | 指标是否达标 | 纹波/精度/速率/温升 |\n| 环境测试 | 极端条件下是否工作 | 高低温/湿热/振动/跌落 |\n| 可靠性测试 | 寿命/失效概率 | 老化/温度循环/MTBF |\n\n> **术语第一次出现**：降额（derating）是让器件工作在额定值以下（如电容耐压用 50%），以降低失效率。余量（margin）是设计指标与极限之间的差距。\n\n#### 21.2.1 四层测试各测什么\n\n**第一层：功能测试（FCT）**。上电、按键、通信、显示、输出；验证“能不能用”。\n\n**第二层：环境测试**。高低温、湿热、温度循环、振动、跌落；验证“环境变了还能不能用”。\n\n**第三层：EMC/安规**。辐射/传导发射、ESD、浪涌、EFT；验证“会不会干扰别人/被干扰”。\n\n**第四层：寿命/可靠性**。老化、加速寿命、HALT；验证“用久了会不会坏”。\n\n**顺序**：先功能，再环境，再 EMC，最后寿命；功能不过，后面没意义。\n\n**课程**：没有实验室条件，也要会写测试计划、会做“简化版”（高低温箱/烤箱/冰箱、振动台/手动振动、ESD 枪）。\n\n**记录**：每层都有判据/样本量/记录表；不要“测了但没数据”。\n\n#### 21.2.2 测试计划怎么写\n\n**目标**：验证什么（功能/环境/EMC/寿命）；不写“尽量稳定”。\n\n**样本**：几块板；批次/版本；首件/小批。\n\n**条件**：温度/湿度/电压/负载/时间；边界/最坏情况。\n\n**判据**：量化（电压/电流/误码/温升）；“正常”不算判据。\n\n**步骤**：先做什么后做什么；怎么复现；怎么记录。\n\n**设备**：电源/示波器/万用表/温箱/振动台/ESD 枪；校准。\n\n**风险**：可能损坏/起火；保护/断电/灭火器。\n\n**输出**：报告/数据/结论/问题清单/改进建议。\n\n**课程**：测试计划是“合同”，不是“参考”；按计划做，才有可比性。\n\n#### 21.2.3 环境与设备：没有实验室也能做\n\n**温度**：高低温箱最准；没有就用烤箱（注意均匀性）/冰箱/恒温室；热电偶测实际温度。\n\n**湿度**：恒温恒湿箱；没有就用密封箱+干燥剂/湿布；湿度计。\n\n**振动**：振动台；没有就手动敲/装振动电机/车载路测；加速度计。\n\n**跌落**：跌落台/指定高度/方向；包装后跌。\n\n**EMC**：暗室/预测试；没有就近场探头+频谱/示波器看辐射；ESD 枪。\n\n**寿命**：老化架/通电计时；加速模型（温度/电压）。\n\n**记录**：设备型号/校准/环境；不要“大概 60℃”。\n\n**安全**：高温/高压/电池；防火/防触电。\n\n#### 21.2.4 首件、小批、量产各测什么\n\n**首件**：全功能/全接口/边界；慢而全；记录每项数据。\n\n**小批**（5～20 块）：抽测关键项+老化；看一致性/工艺。\n\n**量产**：FCT/ICT 快速判定；抽检环境/EMC；看不良率。\n\n**样本**：首件 1～3；小批 5～20；量产按批次抽。\n\n**判据**：首件“全部通过”；小批“无批次性问题”；量产“不良率达标”。\n\n**记录**：批次/版本/测试项/结果；可追溯。\n\n**课程**：没有量产条件，也要知道“不同阶段测的重点不同”。\n\n#### 21.2.5 一次完整测试的流程\n\n**准备**：板子/线缆/负载/仪器/记录表；检查校准。\n\n**基线**：常温功能/电流/波形；作为对比。\n\n**加压**：温度/振动/电压/ESD；逐项加。\n\n**监测**：功能/电流/通信；异常即停。\n\n**恢复**：常温复测；确认可恢复。\n\n**记录**：数据/现象/照片；签字。\n\n**结论**：通过/不通过/待分析。\n\n**课程**：流程化能减少“漏测/误判”。\n\n### 21.3 关键参数与标准\n\n| 测试 | 条件 | 判据 |\n|---|---|---|\n| 高低温 | −20～+70℃（按产品） | 功能正常/无复位 |\n| 温度循环 | −40～+85℃，若干循环 | 无焊点开裂 |\n| 湿热 | 40℃/93%RH | 无漏电/腐蚀 |\n| 振动 | 按运输/使用 | 无松脱 |\n| ESD | 接触/空气放电 | 不损坏/可自恢复 |\n| 辐射/传导 | CISPR/EN | 限值内 |\n| 老化 | 满载 24～72h | 无异常 |\n\n#### 21.3.1 关键指标：把“可靠”量化\n\n**温度范围**：工作/存储；`-20～+70℃` 商业级、`-40～+85℃` 工业级。\n\n**温升**：`Tj=Ta+P·RθJA`；结温留 20℃ 余量。\n\n**振动**：频率/加速度/时长；按标准/场景。\n\n**跌落**：高度/次数/方向。\n\n**EMC**：辐射/传导限值；ESD 接触/空气放电kV。\n\n**寿命**：MTBF/年返修率；加速试验换算。\n\n**判据**：功能正常/无损坏/参数漂移在范围内。\n\n**课程**：指标不是“越高越好”，是“和场景匹配”；过度设计也是成本。\n\n#### 21.3.2 常见标准与等级\n\n**消费电子**：GB/T 9254（EMC）、GB 4943.1（安全）；工作温度 0～40℃。\n\n**工业**：IEC 61000-4 系列（ESD/EFT/浪涌）、-40～+85℃。\n\n**汽车**：AEC-Q100/Q200、ISO 7637/11452；温度/振动/EMC 更严。\n\n**医疗**：IEC 60601；漏电流/隔离/EMC。\n\n**通信**：YD/T、3GPP；浪涌/雷击。\n\n**课程**：不需要背标准号，但要知道“产品类别决定测试等级”。\n\n**查法**：先定类别/市场，再查对应标准/等级；找认证机构确认。\n\n**注意**：标准会更新；以最新版/客户要求为准。\n\n#### 21.3.3 测试环境与夹具\n\n**温度**：温箱容积≥板子 5 倍；风道不直吹；传感器贴板。\n\n**振动**：夹具刚性；板子按实际安装；加速度计。\n\n**EMC**：接地/屏蔽；近场探头；ESD 枪校准。\n\n**电源**：可调/限流；远端补偿；纹波小。\n\n**负载**：电子负载/实际负载；动态/静态。\n\n**记录**：仪器型号/校准/环境；照片。\n\n**安全**：高温/高压/电池；灭火器；急停。\n\n### 21.4 三个典型测试设计\n\n#### 21.4.1 测试矩阵\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 21-1：测试矩阵：功能×条件×样本<\/text>\n  <rect x=\"40\" y=\"60\" width=\"640\" height=\"220\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"40\" y1=\"100\" x2=\"680\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"150\" x2=\"680\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"200\" x2=\"680\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"200\" y1=\"60\" x2=\"200\" y2=\"280\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"88\" font-size=\"12\" fill=\"currentColor\">功能<\/text>\n  <text x=\"215\" y=\"88\" font-size=\"12\" fill=\"currentColor\">常温<\/text>\n  <text x=\"350\" y=\"88\" font-size=\"12\" fill=\"currentColor\">高低温<\/text>\n  <text x=\"500\" y=\"88\" font-size=\"12\" fill=\"currentColor\">振动/湿热<\/text>\n  <text x=\"60\" y=\"135\" font-size=\"12\" fill=\"currentColor\">电源<\/text>\n  <text x=\"60\" y=\"185\" font-size=\"12\" fill=\"currentColor\">通信<\/text>\n  <text x=\"60\" y=\"235\" font-size=\"12\" fill=\"currentColor\">接口<\/text>\n  <text x=\"215\" y=\"135\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n  <text x=\"350\" y=\"135\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n  <text x=\"500\" y=\"135\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n  <text x=\"215\" y=\"185\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n  <text x=\"350\" y=\"185\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n  <text x=\"500\" y=\"185\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n  <text x=\"215\" y=\"235\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n  <text x=\"350\" y=\"235\" font-size=\"11\" fill=\"currentColor\">✓<\/text>\n<\/svg>\n```\n\n#### 21.4.2 温度循环\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 21-2：温度循环曲线<\/text>\n  <line x1=\"70\" y1=\"220\" x2=\"660\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"70\" y1=\"220\" x2=\"70\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <path d=\"M70 220 L150 80 L230 80 L310 220 L390 220 L470 80 L550 80 L630 220\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"120\" y=\"65\" font-size=\"11\" fill=\"currentColor\">+85℃<\/text>\n  <text x=\"120\" y=\"245\" font-size=\"11\" fill=\"currentColor\">−40℃<\/text>\n  <text x=\"400\" y=\"255\" font-size=\"12\" fill=\"currentColor\">循环次数按标准/产品寿命<\/text>\n<\/svg>\n```\n\n#### 21.4.3 降额与失效模式\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 21-3：降额与失效模式<\/text>\n  <rect x=\"40\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"100\" font-size=\"12\" fill=\"currentColor\">电容耐压<\/text>\n  <text x=\"55\" y=\"125\" font-size=\"11\" fill=\"currentColor\">额定 50V → 用 25V<\/text>\n  <rect x=\"260\" y=\"70\" width=\"180\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"100\" font-size=\"12\" fill=\"currentColor\">电阻功率<\/text>\n  <text x=\"275\" y=\"125\" font-size=\"11\" fill=\"currentColor\">额定 0.1W → 用 0.05W<\/text>\n  <rect x=\"480\" y=\"70\" width=\"190\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"495\" y=\"100\" font-size=\"12\" fill=\"currentColor\">连接器电流<\/text>\n  <text x=\"495\" y=\"125\" font-size=\"11\" fill=\"currentColor\">额定 3A → 用 1.5A<\/text>\n  <text x=\"40\" y=\"200\" font-size=\"13\" fill=\"currentColor\">失效模式：开路/短路/参数漂移/焊点开裂/连接器松脱。<\/text>\n  <text x=\"40\" y=\"225\" font-size=\"13\" fill=\"currentColor\">FMEA：严重度×发生度×探测度，优先处理高风险项。<\/text>\n<\/svg>\n```\n\n#### 21.4.4 振动与跌落：机械应力怎么测\n\n**振动**：正弦扫频/随机振动；夹具刚性；加速度计贴板；看焊点/连接器/大电容。\n\n**共振**：找共振点；避开/加固；长度大的器件/支架。\n\n**跌落**：角/棱/面；包装/裸机；高度按重量/标准。\n\n**判据**：功能正常、无裂纹、无虚焊、连接器不松。\n\n**常见失效**：大电容引脚裂、BGA 虚焊、连接器脱、板边裂纹。\n\n**整改**：加固点胶/支架、加粗引脚、减小悬臂、缓冲包装。\n\n**课程**：没有振动台就“手动振动+路测”；重点是“发现共振/松动”。\n\n#### 21.4.5 EMC 预测试：没有暗室也能查\n\n**辐射**：近场探头+频谱/示波器扫板；找时钟/电源/接口的谐波。\n\n**传导**：LISN/电流探头；看电源线噪声。\n\n**ESD**：ESD 枪打外壳/接口/按键；看复位/死机/损坏。\n\n**EFT/浪涌**：EFT 发生器/浪涌发生器；看电源/接口。\n\n**整改**：滤波/屏蔽/接地/布局/器件；先找“源头/路径/受体”。\n\n**预测试**：不能替代认证，但能提前发现 80% 问题。\n\n**记录**：频率/幅值/位置/现象；整改前后对比。\n\n#### 21.4.6 老化与寿命：时间怎么加速\n\n**老化**：常温/高温通电；时间 24～168h；看早期失效。\n\n**加速**：温度/电压/湿度加速；Arrhenius/Peck 模型；换算等效寿命。\n\n**HALT**：逐步加应力（温度/振动/电压）找极限；不是“ pass/fail”。\n\n**MTBF**：预计/实测；元器件计数/应力分析。\n\n**判据**：无故障/参数漂移在范围；失效率可接受。\n\n**课程**：没有时间做寿命，就做“高温老化 48h + 上下电循环”；比不测强。\n\n**记录**：温度/时间/失效/批次；失效分析（FA）。\n\n#### 21.4.7 故障复现：测试的核心能力\n\n**复现**：条件/步骤/现象；能稳定复现，才可能修。\n\n**记录**：温度/电压/负载/操作顺序；视频/照片/波形。\n\n**二分**：换板/换器件/改条件；缩小范围。\n\n**对照**：好板 vs 坏板；测同一节点。\n\n**环境**：温度/湿度/振动/EMC；很多时候“实验室不复现，现场复现”。\n\n**工具**：示波器触发/日志/黑匣子；长时间监测。\n\n**原则**：不能复现的问题，先加“观测”，不要瞎改。\n\n#### 21.5.1 降额：把寿命“买”回来\n\n**电阻**：功率 ≤50%～70%；电压 ≤80%。\n\n**电容**：电压 ≤80%；温度/纹波电流；电解电容寿命按温度。\n\n**MOS**：`Vds` ≤80%、`Id` ≤70%、`Tj` ≤80% 额定。\n\n**二极管**：电流/电压 ≤70%～80%。\n\n**连接器**：电流 ≤70%；插拔次数。\n\n**继电器**：触点电流/电压；浪涌。\n\n**原则**：降额不是“浪费”，是换可靠/寿命；高温/密闭降额更多。\n\n**算例**：1W 电阻实际 0.5W；10A 连接器实际 7A；50V 电容用在 40V。\n\n#### 21.5.2 常见失效模式与征兆\n\n**虚焊/冷焊**：时好时坏、温度/振动触发；X-Ray/显微镜。\n\n**电容失效**：鼓包/漏液/容量下降；纹波大/复位不稳。\n\n**MOS 击穿**：短路/开路；过压/过流/静电。\n\n**连接器氧化**：接触电阻大；信号/电源不稳。\n\n**PCB 腐蚀/CAF**：潮湿/助焊剂残留；绝缘下降。\n\n**BGA 虚焊**：温度循环后；X-Ray/染色。\n\n**晶振停振**：负载电容/焊接/机械应力。\n\n**课程**：测试就是“找征兆”；知道失效模式，才知道测什么。\n\n**记录**：失效位置/现象/分析；反馈设计/工艺。\n\n#### 21.5.3 环境应力筛选（ESS）\n\n**目的**：把“早期失效”筛掉，不是“验证设计”。\n\n**应力**：温度循环/随机振动/通断电；按产品/标准。\n\n**筛选 vs 鉴定**：筛选 100% 产品；鉴定抽样验证设计。\n\n**判据**：筛选后功能正常；失效品分析。\n\n**风险**：应力过大损伤好产品；按标准/试验。\n\n**课程**：小批可以做“高温老化+温度循环”简化版。\n\n**记录**：应力/时间/失效数/批次。\n\n#### 21.5.4 测试治具与自动化\n\n**治具**：针床/夹具/压棒；测试点/定位孔；探针寿命。\n\n**自动化**：PLC/单片机+继电器矩阵；测电压/电流/通信；记录/判定。\n\n**软件**：测试序列/判据/日志；MES 对接。\n\n**可测性**：测试点/自检/隔离；设计阶段就要考虑。\n\n**成本**：治具/开发/维护；小批量手工，大批量自动化。\n\n**课程**：不会做治具，也要会写“测试步骤/判据”；自动化是后面的工程能力。\n\n#### 21.4.8 高低温测试怎么做\n\n**步骤**：常温功能→低温存储→低温工作→高温工作→温度循环→常温复测。\n\n**温度点**：最低/最高/常温；停留时间按热容（30min～2h）。\n\n**监测**：板子通电/运行；测关键电压/电流/通信；热电偶贴器件。\n\n**判据**：功能正常、无复位、无死机、参数在范围。\n\n**常见失效**：低温晶振不起振、电容容量下降、液晶响应慢；高温漏电/热保护/复位。\n\n**注意**：结霜/凝露；升温降温速率；不要“只放进去不监测”。\n\n**记录**：温度/时间/现象/数据。\n\n#### 21.4.9 湿热、盐雾与防护\n\n**湿热**：高温高湿（如 40℃/93%RH）；看绝缘/腐蚀/漏电。\n\n**盐雾**：沿海/户外；看连接器/螺丝/镀层。\n\n**防护**：三防漆/灌封/密封圈/防水透气膜；按 IP 等级。\n\n**判据**：功能正常、无腐蚀/绝缘下降。\n\n**课程**：没有盐雾箱，至少知道“连接器/镀层/三防”的重要性。\n\n**设计**：避免异种金属接触、积水结构、未涂覆的裸铜。\n\n#### 21.4.10 电源完整性与信号完整性测试\n\n**电源**：纹波/瞬态/上电时序/效率；示波器 AC 耦合/20MHz。\n\n**信号**：过冲/振铃/上升时间/眼图；探头短地。\n\n**判据**：纹波在规格内、瞬态跌落可恢复、时序符合手册。\n\n**常见问题**：去耦不足、地弹、阻抗不匹配、终端缺失。\n\n**测试点**：电源/地/关键信号；测试点要留。\n\n**课程**：没有眼图仪，就用示波器看“过冲/振铃/上升时间”。\n\n#### 21.4.11 电池与适配器测试\n\n**电池**：容量/内阻/充放电曲线；过充/过放/短路保护；温度。\n\n**适配器**：输出电压/纹波/效率/温升；浪涌/EFT。\n\n**充电**：CC/CV；截止电压/电流；热。\n\n**判据**：不鼓包/不过热/保护动作；容量达标。\n\n**安全**：电池测试要有防火/防爆；不要无人值守。\n\n**课程**：电池是最危险的部分；按手册/标准，别“随便充”。\n\n#### 21.3.4 可靠性预计与 MTBF\n\n**元器件计数法**：`λ_total=Σ(N_i·λ_i·π_i)`；λ 为失效率，π 为环境/质量系数。\n\n**MTBF**：`MTBF=1/λ_total`；单位小时。\n\n**算例**：100 个器件，平均 λ=10⁻⁸/h，`λ_total≈10⁻⁶/h`，MTBF≈100 万小时（理论值）。\n\n**注意**：预计值不是实测；实际受工艺/环境/降额影响。\n\n**用途**：比较方案/找薄弱环节；不要当“保证”。\n\n**课程**：知道“MTBF 怎么来”，比背数字重要。\n\n#### 21.4.13 包装与运输测试\n\n**包装**：跌落/振动/堆码/温湿度；按运输方式。\n\n**运输**：快递/物流/海运；振动/冲击/湿度。\n\n**判据**：包装无破损、产品功能正常。\n\n**设计**：缓冲材料/固定/防潮；电池/屏特殊保护。\n\n**课程**：产品坏了不一定是板子，可能是“运输没保护好”。\n\n**记录**：包装版本/测试条件/结果。\n\n#### 21.5.6 失效分析（FA）流程\n\n**记录**：失效现象/条件/批次；拍照。\n\n**复现**：能不能稳定复现；不能就先加观测。\n\n**定位**：外观/显微镜/X-Ray/热像；测电压/波形。\n\n**拆解**：染色/切片/去封装；看焊点/芯片。\n\n**原因**：设计/工艺/物料/使用；5Why。\n\n**整改**：设计/工艺/筛选；验证。\n\n**报告**：现象/分析/结论/措施；归档。\n\n**原则**：不要“换一个就好了”就结束；不找到原因会再犯。\n\n#### 21.4.14 测试矩阵填写示例\n\n| 功能/条件 | 常温 | 低温 | 高温 | 振动 |\n|---|---|---|---|---|\n| 上电 | ✓ | ✓ | ✓ | ✓ |\n| 通信 | ✓ | ✓ | ✓ | ✓ |\n| 按键 | ✓ | ✓ | ✓ | — |\n| 输出 | ✓ | ✓ | ✓ | ✓ |\n| 电流 | 60mA | 55mA | 75mA | — |\n\n**读法**：✓ 为通过；数字为实测；空白为未测/不适用。\n\n**用法**：先填矩阵，再逐项做；避免“漏测”。\n\n**课程**：矩阵是测试计划的“骨架”，比文字更清楚。\n\n#### 21.4.15 温升实测：热电偶怎么贴\n\n**位置**：器件表面/散热器/外壳；LDO/MOS/电感/连接器。\n\n**固定**：导热胶/胶带；接触面；避免空气隙。\n\n**读数**：稳定后 10～30min；记录环境温度。\n\n**判据**：`Tj` 估算/外壳温度；留 20℃。\n\n**热像**：发射率/量程；热点定位。\n\n**错误**：贴太远/空气隙/刚上电就读。\n\n#### 21.4.16 测试前的“三查”\n\n**查板**：外观/短路/焊接；坏板不进测试。\n\n**查线**：电源/地/信号/负载；接错会烧。\n\n**查仪器**：量程/探头/校准；读数才可信。\n\n**顺序**：三查不过，不测；比“测了发现接错”省时间。\n\n**课程**：测试事故多半是“接线错/量程错”。\n\n#### 21.4.17 测试用例的写法\n\n**格式**：编号/目的/前置/步骤/输入/预期/实际/结论。\n\n**示例**：TC-01 上电电流：12V 输入、空载，预期 <10mA，实测 6mA，通过。\n\n**要求**：步骤可照做；预期可判定；实际有数据。\n\n**复用**：同类产品改编号/参数即可。\n\n**课程**：测试用例是“可重复”的保证。\n\n#### 21.4.18 测试完成的标准\n\n**数据齐**：每项有实测/波形/照片。\n\n**判据清**：每项有规格/标准。\n\n**问题闭环**：失效有分析/整改/回归。\n\n**可复现**：别人按记录能重做。\n\n**报告签**：版本/日期/测试人。\n\n**课程**：五条都满足，才叫“测完”；否则只是“做过”，不能作为出货依据，也不能作为设计评审的输入；测试和评审是连在一起的，缺了数据，评审就只能凭感觉，而这正是很多项目翻车的原因；把数据补齐，是最便宜的风险控制，也是工程师最该养成的习惯；习惯一旦建立，后面每一块板、每一个项目都会受益，这就是“可重复”的力量。\n\n#### 21.4.12 温度循环曲线与判据\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 21-4：温度循环曲线（低温→高温→常温）<\/text>\n  <line x1=\"70\" y1=\"60\" x2=\"70\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"70\" y1=\"240\" x2=\"670\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"30\" y=\"70\" font-size=\"11\" fill=\"currentColor\">温度<\/text>\n  <text x=\"600\" y=\"265\" font-size=\"11\" fill=\"currentColor\">时间<\/text>\n  <path d=\"M70 180 L150 180 L230 90 L330 90 L410 180 L500 180 L580 90 L650 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"70\" y1=\"90\" x2=\"670\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"600\" y=\"82\" font-size=\"10\" fill=\"currentColor\">+85℃<\/text>\n  <line x1=\"70\" y1=\"180\" x2=\"670\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"600\" y=\"200\" font-size=\"10\" fill=\"currentColor\">-40℃<\/text>\n  <text x=\"100\" y=\"215\" font-size=\"10\" fill=\"currentColor\">停留<\/text>\n  <text x=\"250\" y=\"80\" font-size=\"10\" fill=\"currentColor\">升温<\/text>\n  <text x=\"420\" y=\"215\" font-size=\"10\" fill=\"currentColor\">降温<\/text>\n  <text x=\"40\" y=\"285\" font-size=\"12\" fill=\"currentColor\">每个温度点停留到热平衡；循环 5～20 次；每轮后测功能/参数。<\/text>\n<\/svg>\n```\n\n**判据**：循环后功能正常、无裂纹/虚焊、参数漂移在范围；失效要记录“第几轮/什么温度”。\n\n**注意**：升降温速率按标准；避免凝露；通电/不通电两种状态都测。\n\n#### 21.3.5 测试项与判据表\n\n| 测试项 | 条件 | 判据 |\n|---|---|---|\n| 上电/电流 | 空载/满载 | 电流在预算内 |\n| 电源纹波 | 20MHz | 峰峰值<规格 |\n| 复位/时钟 | 上电/掉电 | 时序正常 |\n| 通信 | 最坏负载 | 不丢包/误码率 |\n| 高低温 | -40/+85℃ | 功能正常 |\n| 温度循环 | 5～20 次 | 无虚焊/裂纹 |\n| 振动 | 扫频/随机 | 无松动 |\n| 跌落 | 角/棱/面 | 功能正常 |\n| ESD | ±4/±8kV | 不死机/不损坏 |\n| 老化 | 24～168h | 无早期失效 |\n\n**用法**：每项都要有“条件+判据”；不要只写“测试通过”。\n\n#### 21.3.6 测试环境清单\n\n- [ ] 可调限流电源\n- [ ] 万用表/示波器（探头/短地）\n- [ ] 电子负载/实际负载\n- [ ] 温箱/热电偶\n- [ ] 振动台/加速度计\n- [ ] ESD 枪/近场探头\n- [ ] 测试治具/探针\n- [ ] 记录表/相机\n\n**用法**：按测试项勾；缺什么补什么，不要“凑合测”。\n\n### 21.5 选型与降额\n\n| 器件 | 降额建议 | 原因 |\n|---|---|---|\n| 电容 | 耐压 50%，温度按最坏 | ESR/寿命 |\n| 电阻 | 功率 50% | 温升 |\n| 连接器 | 电流 50% | 接触电阻 |\n| LDO | 结温留 20℃ | 热 |\n| 继电器 | 触点 50% | 寿命 |\n| 晶振 | 温度范围覆盖 | 频偏 |\n\n#### 21.5.5 元器件选型的可靠性视角\n\n**温度等级**：商业/工业/汽车；按环境。\n\n**寿命**：电解电容/风扇/继电器；按小时/温度。\n\n**品牌/批次**：通用料/原厂；避免拆机/翻新。\n\n**认证**：AEC-Q/UL/CE；按产品。\n\n**替代**：参数/封装/可靠性；不要只看价格。\n\n**失效**：MTBF/失效率；关键器件降额。\n\n**课程**：选型时就把“可靠性”算进去；便宜料可能贵在后端。\n\n#### 21.5.7 可靠性设计十条\n\n1. 降额 50%～80%。\n2. 热设计留 20℃。\n3. 去耦/滤波/屏蔽。\n4. 连接器/焊点加固。\n5. 防反接/过压/过流。\n6. ESD/浪涌保护。\n7. 三防/密封（按环境）。\n8. 可测/可修（测试点）。\n9. 物料/批次可追溯。\n10. 测试计划/记录。\n\n**顺序**：先做“不会坏”的设计，再做“坏了能查”的设计。\n\n**课程**：可靠性不是测出来的，是设计出来的；测试只是验证。\n\n#### 21.5.8 降额速查表\n\n| 器件 | 电压 | 电流/功率 | 温度 |\n|---|---|---|---|\n| 电阻 | 80% | 50%～70% | 按功率 |\n| 陶瓷电容 | 80% | 纹波 | 按温度 |\n| 电解电容 | 80% | 纹波 | 寿命 |\n| MOS | 80% | 70% | Tj 80% |\n| 二极管 | 80% | 70% | 按温度 |\n| 连接器 | 按规格 | 70% | 按温升 |\n| 继电器 | 80% | 70% | 按寿命 |\n\n**用法**：选型时按表留余量；高温/密闭再降。\n\n#### 21.5.9 可靠性增长与迭代\n\n**目标**：每一轮测试/失效/整改，失效率下降。\n\n**闭环**：失效→分析→整改→验证→更新设计规范。\n\n**数据**：失效率/返修率/客诉；按批次/版本。\n\n**评审**：设计评审加入“历史失效”检查。\n\n**课程**：可靠性是“迭代”出来的；不是一次测试就达标。\n\n**文化**：鼓励报问题；隐瞒问题会让失效重复。\n\n### 21.6 测量与仿真\n\n#### 21.6.1 测试记录\n\n| 项目 | 条件 | 样本 | 结果 | 问题 |\n|---|---|---|---|---|\n| 高低温 | −20/70℃ | 3 | | |\n| 温度循环 | 100 次 | 3 | | |\n| 振动 | 10～500Hz | 3 | | |\n| ESD | ±4kV | 3 | | |\n| 老化 | 72h | 3 | | |\n\n#### 21.6.2 CircuitJS\n\n```circuitjs\nrc-charge\n```\n\n观察 RC 在参数漂移下的时间变化，理解温度对定时的影响。\n\n#### 21.6.4 测试报告模板\n\n| 项 | 内容 |\n|---|---|\n| 产品/版本 | 板名/版本/批次 |\n| 样本 | 数量/来源 |\n| 环境 | 温度/湿度/电压/负载 |\n| 设备 | 型号/校准 |\n| 测试项 | 功能/环境/EMC/寿命 |\n| 数据 | 实测值/波形/照片 |\n| 判据 | 规格/标准 |\n| 结论 | 通过/不通过/待分析 |\n| 问题 | 现象/定位/建议 |\n| 附件 | 日志/波形/照片 |\n\n**写法**：数据可复算；结论有依据；问题可追踪。\n\n**课程**：报告是“交付物”，不是“草稿”。\n\n#### 21.6.5 数据记录与统计\n\n**记录**：日期/版本/样本/条件/数据/现象；表格/数据库。\n\n**统计**：均值/极值/标准差；不良率；趋势。\n\n**图表**：温度曲线/电流/误码；直方图/控制图。\n\n**判定**：规格/标准；异常点复查。\n\n**追溯**：批次/板号/测试人；可回溯。\n\n**课程**：没有数据，就没有“可靠性”；记录比结论重要。\n\n#### 21.6.6 自动化测试的判据怎么写\n\n**判据**：上限/下限/范围/趋势；“正常”不可自动判定。\n\n**采样**：稳定后读；去抖/平均；避免误判。\n\n**顺序**：上电→延时→测→断电；状态机。\n\n**异常**：超限即停/记录；不要继续测坏板。\n\n**日志**：时间/项/值/判定；板号。\n\n**复测**：失败可重试 1～2 次；仍失败判不良。\n\n**课程**：自动化不是“买设备”，是“把判据写清楚”。\n\n#### 21.6.3 动手任务\n\n- 写一份 1 页测试计划。\n- 给一块板做 24h 老化，记录温度/电流。\n- 做一次 ESD 接触放电（有条件）。\n- 填一张问题闭环表。\n\n### 21.7 常见坑\n\n1. **只测常温**：高温复位/低温不起振漏掉。\n2. **样本太少**：1 台通过不代表批量。\n3. **不测最坏负载**：满载掉压。\n4. **忽略连接器/线缆**：现场松脱。\n5. **EMC 只做发射**：抗扰度不过。\n6. **降额不足**：电容/电阻长期漂移。\n7. **测试记录不全**：问题无法复现。\n8. **问题不闭环**：改版又犯。\n9. **MTBF 当实测**：计算值不能代替寿命测试。\n\n#### 21.7.2 三个可靠性案例\n\n**案例一：高温复位**。现象：70℃ 运行 10min 复位。排查：LDO 温升超限、`RθJA` 估算错。整改：换封装/加铜/降负载；复测通过。\n\n**案例二：振动后 USB 松**。现象：路测颠簸后不识别。排查：USB 座固定焊盘小、外壳无支撑。整改：加固定脚/点胶/结构支撑。\n\n**案例三：ESD 打按键死机**。现象：接触放电 4kV 死机。排查：按键走线长、无 TVS、地不连续。整改：加 TVS/缩短走线/地过孔；复测通过。\n\n**共同点**：都能通过“温升/振动/ESD”测试提前发现；设计阶段留余量最省事。\n\n#### 21.7.3 测试顺序与流程\n\n**顺序**：外观/阻抗→功能→电源/信号→环境→EMC→寿命。\n\n**理由**：先排除“焊错/短路”，再谈性能；环境/EMC 可能损坏板子，放后面。\n\n**回归**：每次整改后重测相关项；不要“改完直接出货”。\n\n**样本**：首件全测；小批抽测；量产 FCT。\n\n**停线**：批量失效/安全风险；先分析再继续。\n\n**课程**：测试顺序错了，可能“把好板测坏/把坏板放过”。\n\n#### 21.7.4 测试漏斗：从 100% 到出货\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 21-5：测试漏斗（样本逐层筛）<\/text>\n  <path d=\"M120 60 L600 60 L520 110 L200 110 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"300\" y=\"90\" font-size=\"12\" fill=\"currentColor\">100% 功能/外观<\/text>\n  <path d=\"M200 120 L520 120 L460 170 L260 170 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"310\" y=\"150\" font-size=\"12\" fill=\"currentColor\">抽样环境<\/text>\n  <path d=\"M260 180 L460 180 L410 230 L310 230 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"320\" y=\"210\" font-size=\"12\" fill=\"currentColor\">EMC/寿命<\/text>\n  <path d=\"M310 240 L410 240 L390 275 L330 275 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"330\" y=\"262\" font-size=\"11\" fill=\"currentColor\">出货<\/text>\n  <text x=\"40\" y=\"300\" font-size=\"12\" fill=\"currentColor\">越往下样本越少、应力越强；目的是把早期失效留在厂内。<\/text>\n<\/svg>\n```\n\n**用法**：不是“每块都做全部”，而是“全检做基础、抽检做环境/EMC”；按风险/成本平衡。\n\n**顺序**：先全检排短路/焊错，再抽检环境/EMC；避免“坏板进环境箱”。\n\n#### 21.6.7 实验室记录与安全\n\n**记录**：谁/何时/什么板/什么条件/什么结果；签名。\n\n**样品**：编号/状态（待测/失败/已修）；隔离。\n\n**设备**：校准/借用/归还；状态标识。\n\n**安全**：高温/高压/电池/ESD；防护/急停/灭火器。\n\n**整洁**：台面/线缆/工具；减少误接。\n\n**课程**：实验室习惯，反映工程质量。\n\n#### 21.6.8 测试点与夹具的配合\n\n**测试点**：直径 ≥1mm；间距 ≥2.54mm；不被器件挡。\n\n**夹具**：探针行程/压力；定位；防错。\n\n**接触**：四线/开尔文（低阻）；地就近。\n\n**寿命**：探针更换；清洁。\n\n**课程**：测试点设计不好，自动化/夹具都白搭。\n\n#### 21.7.5 三个“测了没测出”的原因\n\n**一、条件不够**：只测常温/轻载；最坏情况没测。\n\n**二、判据太松**：只看“能用”，不看参数漂移/边界。\n\n**三、样本太少**：1 块板通过，批次问题没暴露。\n\n**补救**：加边界/加样本/加监测；测试不是“走流程”。\n\n**课程**：测试设计比测试执行更重要。\n\n#### 21.7.1 测试常见坑（扩展）\n\n1. **只测常温**：高温/低温失效漏掉。\n2. **样本太少**：1 块板代表不了批次。\n3. **判据模糊**：“能用”不算判据。\n4. **不记录环境**：复现不了。\n5. **测试顺序错**：先 EMC 后功能，坏了不知原因。\n6. **电源/负载不设边界**：最坏情况没测。\n7. **老化时间不够**：早期失效没筛出。\n8. **ESD 打错位置/等级**：测了等于没测。\n9. **振动夹具太软**：应力没传到板子。\n10. **失效不复现**：瞎改设计。\n11. **测试后不复位/不清洁**：下一轮误判。\n12. **报告只写“通过”**：没有数据/结论。\n\n### 21.8 本章复盘\n\n#### 21.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| `Tj=Ta+P·RθJA` | 结温 | 降额 20℃ |\n| 降额 50%～80% | 电阻/电容/MOS | 按器件 |\n| 温度循环 -40～+85℃ | 环境 | 按标准 |\n| 老化 24～168h | 早期失效 | 高温通电 |\n| ESD 接触 ±4/±8kV | 抗扰 | 按等级 |\n| 样本 ≥3～5 块 | 代表性 | 小批更多 |\n| 判据量化 | 测试 | 电压/电流/误码 |\n\n#### 21.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| FCT | functional test | 功能测试 |\n| ESS | environmental stress screening | 环境应力筛选 |\n| HALT | highly accelerated life test | 高加速寿命 |\n| MTBF | mean time between failures | 平均无故障时间 |\n| FA | failure analysis | 失效分析 |\n| LISN | line impedance stabilization network | 电源阻抗稳定网络 |\n| 温升 | temperature rise | 高于环境温度 |\n| 降额 | derating | 低于额定使用 |\n\n#### 21.8.3 自测 12 题\n\n1. 四层测试分别是什么？\n2. 测试计划必须写清哪几项？\n3. 没有温箱怎么做温度测试？\n4. 温升怎么算？为什么留 20℃？\n5. 振动测试看哪些失效？\n6. EMC 预测试怎么做？\n7. 老化和寿命有什么区别？\n8. 故障复现为什么要“记录条件”？\n9. 降额 50% 是什么意思？\n10. 常见失效模式举三个。\n11. ESS 和鉴定试验有什么区别？\n12. 测试报告至少包含什么？\n\n**参考要点**：功能/环境/EMC/寿命；目标/样本/条件/判据/步骤/记录；烤箱/冰箱+热电偶；`Tj=Ta+P·RθJA`；焊点/连接器/大电容；近场探头/ESD 枪；老化是筛选、寿命是验证；否则无法复现；实际应力为额定一半；虚焊/电容/MOS；筛选 100%、鉴定抽样；数据/结论/问题/建议。\n\n#### 21.8.4 能力清单与复盘\n\n- [ ] 能列测试矩阵并填数据。\n- [ ] 能贴热电偶/读温升。\n- [ ] 能做温循/振动/ESD 的简化版。\n- [ ] 能写自动化判据。\n- [ ] 能开失效分析会。\n- [ ] 能把问题写进设计规范。\n\n**复盘**：测试能力的核心是“可重复”；换个人按你的记录能复现，才算合格。\n\n**项目衔接**：第 23 章设计评审会用到这里的测试数据/问题清单。\n\n#### 21.8.5 复盘清单\n\n1. 测试计划写了吗？\n2. 判据量化了吗？\n3. 样本够吗？\n4. 环境/设备记录了吗？\n5. 高低温/振动/ESD 做了吗？\n6. 老化做了吗？\n7. 失效复现/分析了吗？\n8. 整改后回归了吗？\n9. 报告/数据归档了吗？\n10. 下一批改什么？\n\n\n**本章的测试数据**：会直接进入第 23 章的设计评审——评审不是“讲 PPT”，是拿数据说话。\n\n**下一章预告**：阶段复盘与设计评审，把第 17～21 章的能力串成一次“上台前的彩排”。\n\n\n\n**复盘补充**：把“这次的判据/数据/失效”写成一页纸，下次同类产品直接复用；这比“记住结论”更有价值。\n\n**能力自检**：如果你能独立写出测试计划并让别人按计划复现，这一章就过关了。\n\n\n10 条都过，才算“测试完成”，而不是“测过了”。\n\n#### 21.8.6 下一章\n\n下一章讲**经典开源工程解读**：看别人怎么把原理图、PCB、BOM、测试做成可复现的工程。","taskSignature":"6307d52a31f15a8060b7b6f8e06974a8a9619f11d8914db8b22247edfb2d0480","taskCount":14},{"id":"22","title":"第 22 章 · 经典开源工程解读","short":"经典开源工程解读","stage":3,"diff":2,"prev":"第 21 章 硬件测试与可靠性","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用“结构—电源—接口—布局—测试”五步法读一个陌生开源工程。\n2. 在 GitHub/立创开源广场找到可复现的 STM32/ESP32 项目。\n3. 判断一个开源工程是否“能打样”：BOM、Gerber、封装、许可证。\n4. 从开源工程里提取可复用的电路块和布局规则。\n5. 避免直接抄板导致的许可/封装/器件停产问题。\n6. 写一份工程解读笔记，列出优点、风险、可复用点。\n7. 说出至少 8 个读开源工程的常见坑。\n\n读开源工程不是“下载来打样”，是学别人的设计决策。看懂“为什么这样接”，比抄一张图值钱。\n\n## 正文\n\n### 22.1 它解决什么问题：三个真实场景\n\n#### 场景一：下载了工程，打开全是未知封装\n\nGitHub 上的 KiCad 工程缺库/缺 3D，打开一片红。作者只传了 `.kicad_pcb`，没传 `fp-lib-table`/自定义库。读工程先看库依赖。\n\n#### 场景二：BOM 里器件全停产\n\n一个 2018 年的开源板，BOM 里 LDO/连接器全停产，替代料没写。直接打样买不到料。开源工程要检查器件生命周期。\n\n#### 场景三：许可证不允许商用\n\n工程标 MIT，但原理图里引用了某公司的参考设计/受版权保护的库。商用前要读 LICENSE 和第三方声明。\n\n### 22.2 它是什么：五步读图法\n\n1. **结构**：板子分几个功能块，接口在哪。\n2. **电源**：输入→各级稳压→负载，电源树和去耦。\n3. **接口**：USB/串口/显示/无线，保护/匹配。\n4. **布局**：分区、地平面、晶振、差分、散热。\n5. **测试**：有没有测试点、Bring-Up 文档、已知问题。\n\n> **术语第一次出现**：可复现（reproducible）指别人拿到工程、BOM、Gerber、说明，能做出同样的板并复现测试结果。只传 PCB 文件不算可复现。\n\n### 22.3 关键检查项\n\n| 检查项 | 看什么 | 风险 |\n|---|---|---|\n| LICENSE | 是否允许商用/修改 | 侵权 |\n| 库依赖 | 自定义符号/封装 | 打不开 |\n| BOM | 器件是否停产/替代料 | 买不到 |\n| Gerber | 层数/钻孔/阻抗 | 做不出 |\n| 文档 | 上电/测试/已知问题 | 复现不了 |\n| 版本 | 最后更新/issue | 过时 |\n\n### 22.4 七个典型工程解读\n\n#### 22.4.1 STM32 最小系统板\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-1：开源 STM32 最小系统板结构<\/text>\n  <rect x=\"260\" y=\"70\" width=\"180\" height=\"80\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"305\" y=\"105\" font-size=\"13\" fill=\"currentColor\">STM32<\/text>\n  <text x=\"295\" y=\"128\" font-size=\"11\" fill=\"currentColor\">最小系统<\/text>\n  <rect x=\"60\" y=\"60\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"85\" y=\"90\" font-size=\"12\" fill=\"currentColor\">USB/电源<\/text>\n  <rect x=\"520\" y=\"60\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"545\" y=\"90\" font-size=\"12\" fill=\"currentColor\">排针<\/text>\n  <rect x=\"60\" y=\"210\" width=\"140\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"85\" y=\"240\" font-size=\"12\" fill=\"currentColor\">SWD<\/text>\n  <rect x=\"260\" y=\"210\" width=\"180\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"290\" y=\"240\" font-size=\"12\" fill=\"currentColor\">LED/按键<\/text>\n  <rect x=\"520\" y=\"210\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"545\" y=\"240\" font-size=\"12\" fill=\"currentColor\">晶振/复位<\/text>\n  <line x1=\"200\" y1=\"90\" x2=\"260\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"100\" x2=\"520\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"240\" x2=\"260\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"240\" x2=\"520\" y2=\"240\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n#### 22.4.2 ESP32 物联网板\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-2：ESP32 物联网板功能块<\/text>\n  <rect x=\"260\" y=\"70\" width=\"180\" height=\"90\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"310\" y=\"105\" font-size=\"13\" fill=\"currentColor\">ESP32<\/text>\n  <text x=\"300\" y=\"130\" font-size=\"11\" fill=\"currentColor\">Wi-Fi/BLE<\/text>\n  <rect x=\"50\" y=\"60\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"90\" font-size=\"12\" fill=\"currentColor\">USB/电源<\/text>\n  <rect x=\"520\" y=\"60\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"545\" y=\"90\" font-size=\"12\" fill=\"currentColor\">天线<\/text>\n  <rect x=\"50\" y=\"200\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"230\" font-size=\"12\" fill=\"currentColor\">传感器<\/text>\n  <rect x=\"260\" y=\"200\" width=\"180\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"290\" y=\"230\" font-size=\"12\" fill=\"currentColor\">Flash/按键<\/text>\n  <rect x=\"520\" y=\"200\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"545\" y=\"230\" font-size=\"12\" fill=\"currentColor\">排针<\/text>\n  <line x1=\"200\" y1=\"90\" x2=\"260\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"100\" x2=\"520\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"230\" x2=\"260\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"230\" x2=\"520\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n#### 22.4.3 从工程提取可复用块\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-3：可复用块提取<\/text>\n  <rect x=\"40\" y=\"70\" width=\"180\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"100\" font-size=\"12\" fill=\"currentColor\">电源入口+ESD<\/text>\n  <rect x=\"260\" y=\"70\" width=\"180\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"100\" font-size=\"12\" fill=\"currentColor\">晶振+复位+SWD<\/text>\n  <rect x=\"480\" y=\"70\" width=\"190\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"495\" y=\"100\" font-size=\"12\" fill=\"currentColor\">USB 转串口<\/text>\n  <text x=\"40\" y=\"190\" font-size=\"13\" fill=\"currentColor\">复用前：核对封装/引脚/电平/许可，重新计算参数，不照抄。<\/text>\n<\/svg>\n```\n\n#### 22.4.4 Arduino Uno R3：把“最少系统”做到可制造\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-4：Arduino Uno R3 功能分区<\/text>\n  <rect x=\"250\" y=\"70\" width=\"220\" height=\"90\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"310\" y=\"105\" font-size=\"13\" fill=\"currentColor\">ATmega328P<\/text>\n  <text x=\"300\" y=\"128\" font-size=\"10\" fill=\"currentColor\">MCU + 晶振 + 复位<\/text>\n  <rect x=\"40\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"88\" font-size=\"11\" fill=\"currentColor\">USB-B + 16U2<\/text>\n  <text x=\"60\" y=\"108\" font-size=\"10\" fill=\"currentColor\">串口/供电/复位<\/text>\n  <rect x=\"510\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"88\" font-size=\"11\" fill=\"currentColor\">DC 输入 + 电源<\/text>\n  <text x=\"530\" y=\"108\" font-size=\"10\" fill=\"currentColor\">5V/3.3V LDO<\/text>\n  <rect x=\"40\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"238\" font-size=\"11\" fill=\"currentColor\">数字/模拟排针<\/text>\n  <text x=\"60\" y=\"258\" font-size=\"10\" fill=\"currentColor\">14 IO + 6 ADC<\/text>\n  <rect x=\"260\" y=\"210\" width=\"200\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"238\" font-size=\"11\" fill=\"currentColor\">ICSP + 复位按键<\/text>\n  <text x=\"280\" y=\"258\" font-size=\"10\" fill=\"currentColor\">下载/调试<\/text>\n  <rect x=\"510\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"238\" font-size=\"11\" fill=\"currentColor\">LED/保险丝<\/text>\n  <text x=\"530\" y=\"258\" font-size=\"10\" fill=\"currentColor\">指示/保护<\/text>\n  <line x1=\"210\" y1=\"95\" x2=\"250\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"470\" y1=\"105\" x2=\"510\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"210\" y1=\"245\" x2=\"260\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"245\" x2=\"510\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n读图要点：USB 转串口（16U2）与主 MCU 分开，下载/串口不占主 MCU 外设；电源有 DC 座与 USB 两条路径，经二极管/保险丝做“或”与保护；USB 有 ESD，排针有丝印，ICSP 保证“砖了还能救”。2 层板，底层大面积地，晶振靠 MCU，USB 差分走短线，模拟区与 DC-DC/LDO 拉开。\n\n可复用块：\n\n| 块 | 为什么值得复用 | 复用时改什么 |\n|---|---|---|\n| USB 转串口 + 自动复位 | 下载方便、成本低 | 换 Type-C/CP2102，改 DTR 电路 |\n| 双电源输入“或”与保险丝 | 防反灌/过流 | 按电流选器件，核算压降 |\n| ICSP/ SWD 引出 | 救砖 | 按目标 MCU 改接口 |\n| 5V/3.3V 两级 LDO | 简单可靠 | 按负载/压差算功耗 |\n\n容易踩的点：Uno 的 5V/3.3V LDO 余量不大，外接大电流扩展板会热；USB-B 与 DC 同时插时，“谁给谁供电”要看原理图，不能凭感觉。\n\n#### 22.4.5 OrangePi Zero：低成本 SoC + DDR + 无线\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-5：OrangePi Zero 功能与电源分区<\/text>\n  <rect x=\"260\" y=\"70\" width=\"200\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"105\" font-size=\"13\" fill=\"currentColor\">Allwinner H3<\/text>\n  <text x=\"300\" y=\"130\" font-size=\"10\" fill=\"currentColor\">CPU/GPU/DRAM 控制<\/text>\n  <rect x=\"40\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"88\" font-size=\"11\" fill=\"currentColor\">DDR3<\/text>\n  <text x=\"60\" y=\"108\" font-size=\"10\" fill=\"currentColor\">16 位/等长<\/text>\n  <rect x=\"510\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"88\" font-size=\"11\" fill=\"currentColor\">microSD/eMMC<\/text>\n  <text x=\"530\" y=\"108\" font-size=\"10\" fill=\"currentColor\">启动/存储<\/text>\n  <rect x=\"40\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"238\" font-size=\"11\" fill=\"currentColor\">以太网 PHY<\/text>\n  <text x=\"60\" y=\"258\" font-size=\"10\" fill=\"currentColor\">变压器/RJ45<\/text>\n  <rect x=\"260\" y=\"210\" width=\"200\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"238\" font-size=\"11\" fill=\"currentColor\">Wi-Fi/BLE 模块<\/text>\n  <text x=\"280\" y=\"258\" font-size=\"10\" fill=\"currentColor\">天线净空/屏蔽<\/text>\n  <rect x=\"510\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"238\" font-size=\"11\" fill=\"currentColor\">USB/排针<\/text>\n  <text x=\"530\" y=\"258\" font-size=\"10\" fill=\"currentColor\">5V 输入/扩展<\/text>\n  <line x1=\"210\" y1=\"95\" x2=\"260\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"105\" x2=\"510\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"210\" y1=\"245\" x2=\"260\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"245\" x2=\"510\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n读图要点：SoC 是核心，DDR 紧邻，存储靠板边，以太网 PHY 与 RJ45 在板边，Wi-Fi 模块靠板边并做天线净空。5V 输入→多路 DCDC（核心 1.1V、DDR 1.5V、IO 3.3V），DDR 电源与 VREF 单独滤波，上电时序按 SoC 手册。以太网 100Ω、USB 90Ω、天线 50Ω。4 层常见叠层为“信号-地-电源-信号”，DDR 组内等长，晶振/DC-DC 远离天线。\n\n可复用块：\n\n| 块 | 为什么值得复用 | 复用时改什么 |\n|---|---|---|\n| SoC 多路电源时序 | 保证 core/DDR/IO 按序起 | 按具体 SoC 手册改阈值/顺序 |\n| DDR 点对点/等长 | 低成本高密度 | 按 DDR 代际/位宽改拓扑 |\n| 以太网 PHY + 变压器 | 稳定有线 | 按速率/隔离要求选器件 |\n| Wi-Fi 模块天线净空 | 射频性能 | 按模块手册改净空/匹配 |\n\n容易踩的点：DDR 电源纹波、VREF 噪声、天线净空、以太网变压器中心抽头接法。读工程时要看作者有没有写“DDR 训练失败/网口不通”的 issue。\n\n#### 22.4.6 CM4IO：核心板 + 底板的分层设计\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-6：CM4IO 核心板/底板分区<\/text>\n  <rect x=\"250\" y=\"70\" width=\"220\" height=\"90\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"105\" font-size=\"13\" fill=\"currentColor\">CM4 核心板<\/text>\n  <text x=\"290\" y=\"128\" font-size=\"10\" fill=\"currentColor\">SoC/DDR/eMMC/Wi-Fi<\/text>\n  <rect x=\"40\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"88\" font-size=\"11\" fill=\"currentColor\">12V 输入<\/text>\n  <text x=\"60\" y=\"108\" font-size=\"10\" fill=\"currentColor\">Buck 5V/3.3V<\/text>\n  <rect x=\"510\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"88\" font-size=\"11\" fill=\"currentColor\">PCIe/M.2<\/text>\n  <text x=\"530\" y=\"108\" font-size=\"10\" fill=\"currentColor\">高速差分<\/text>\n  <rect x=\"40\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"238\" font-size=\"11\" fill=\"currentColor\">HDMI/DSI<\/text>\n  <text x=\"60\" y=\"258\" font-size=\"10\" fill=\"currentColor\">TMDS/差分<\/text>\n  <rect x=\"260\" y=\"210\" width=\"200\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"238\" font-size=\"11\" fill=\"currentColor\">USB2/3 + 以太网<\/text>\n  <text x=\"280\" y=\"258\" font-size=\"10\" fill=\"currentColor\">ESD/变压器<\/text>\n  <rect x=\"510\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"238\" font-size=\"11\" fill=\"currentColor\">40Pin/风扇<\/text>\n  <text x=\"530\" y=\"258\" font-size=\"10\" fill=\"currentColor\">扩展/散热<\/text>\n  <line x1=\"210\" y1=\"95\" x2=\"250\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"470\" y1=\"105\" x2=\"510\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"210\" y1=\"245\" x2=\"260\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"245\" x2=\"510\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n读图要点：核心板把 SoC/DDR/eMMC/Wi-Fi 做成模块，底板只做接口/电源/连接器，产品可以“换核心板不换底板”。12V→5V Buck→3.3V/1.8V；核心板供电通过板对板连接器，去耦靠近连接器；PCIe/M.2 单独供电与滤波。HDMI TMDS 100Ω、PCIe 85/90Ω、USB 90Ω；连接器靠板边，ESD 靠近接口。4 层，PCIe/USB 参考完整地，M.2 下方挖空/禁布，风扇/散热器与 SoC 对齐。\n\n可复用块：\n\n| 块 | 为什么值得复用 | 复用时改什么 |\n|---|---|---|\n| 核心板 + 底板分层 | 降低重复设计 | 按连接器定义改底板 |\n| 12V→5V→3.3V 电源树 | 兼容宽压 | 按总功耗改 Buck/散热 |\n| PCIe/M.2 高速接口 | 扩展存储/加速 | 按协议改阻抗/层叠 |\n| 40Pin 扩展 + ESD | 生态兼容 | 按电平/引脚改保护 |\n\n容易踩的点：核心板连接器地针分配、PCIe 参考时钟、HDMI ESD 电容选型、M.2 供电时序。读工程时对照“连接器引脚定义”和“底板原理图”，不要只看核心板。\n\n#### 22.4.7 BeagleBone Black：开源工业级 + 多层 + 扩展\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-7：BeagleBone Black 功能分区<\/text>\n  <rect x=\"250\" y=\"70\" width=\"220\" height=\"90\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"310\" y=\"105\" font-size=\"13\" fill=\"currentColor\">AM335x<\/text>\n  <text x=\"295\" y=\"128\" font-size=\"10\" fill=\"currentColor\">Cortex-A8 + PRU<\/text>\n  <rect x=\"40\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"88\" font-size=\"11\" fill=\"currentColor\">DDR3/eMMC<\/text>\n  <text x=\"60\" y=\"108\" font-size=\"10\" fill=\"currentColor\">存储/启动<\/text>\n  <rect x=\"510\" y=\"60\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"88\" font-size=\"11\" fill=\"currentColor\">以太网/USB<\/text>\n  <text x=\"530\" y=\"108\" font-size=\"10\" fill=\"currentColor\">PHY/ESD<\/text>\n  <rect x=\"40\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"238\" font-size=\"11\" fill=\"currentColor\">HDMI<\/text>\n  <text x=\"60\" y=\"258\" font-size=\"10\" fill=\"currentColor\">TMDS/ESD<\/text>\n  <rect x=\"260\" y=\"210\" width=\"200\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"238\" font-size=\"11\" fill=\"currentColor\">cape 扩展排针<\/text>\n  <text x=\"280\" y=\"258\" font-size=\"10\" fill=\"currentColor\">电平/保护<\/text>\n  <rect x=\"510\" y=\"210\" width=\"170\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"530\" y=\"238\" font-size=\"11\" fill=\"currentColor\">5V 输入/电源<\/text>\n  <text x=\"530\" y=\"258\" font-size=\"10\" fill=\"currentColor\">多路 LDO/DCDC<\/text>\n  <line x1=\"210\" y1=\"95\" x2=\"250\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"470\" y1=\"105\" x2=\"510\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"210\" y1=\"245\" x2=\"260\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"245\" x2=\"510\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n读图要点：AM335x + DDR3 + eMMC + 以太网 + HDMI + cape 排针；PRU 可做实时 IO，是它区别于普通 MCU 的特色。5V 输入→3.3V/1.8V/1.5V/1.1V 多路，DDR 电源与 VREF 单独，上电时序按 AM335x 手册。HDMI TMDS 100Ω、以太网 100Ω、USB 90Ω；cape 排针有电平/保护，扩展板可能反灌。6 层，DDR 与 SoC 相邻层参考，HDMI/USB 差分靠板边，晶振包地。\n\n可复用块：\n\n| 块 | 为什么值得复用 | 复用时改什么 |\n|---|---|---|\n| AM335x 多路电源 | 工业级稳定 | 按手册改时序/滤波 |\n| DDR3 拓扑 | 中等速率 | 按速率/位宽改等长 |\n| cape 扩展排针 | 生态扩展 | 按电平/电流加保护 |\n| HDMI/以太网 ESD | 接口可靠 | 按连接器/标准改器件 |\n\n容易踩的点：cape 扩展板反灌、DDR 电源噪声、HDMI ESD 电容影响眼图、eMMC 与 SD 启动顺序。读工程时看“cape 兼容性说明”和“电源时序图”。\n\n### 22.4.8 四块板横向对比\n\n| 维度 | Arduino Uno | OrangePi Zero | CM4IO | BeagleBone Black |\n|---|---|---|---|---|\n| 定位 | 教学/原型 | 低成本 Linux 单板 | 核心板+底板 | 开源工业级 |\n| 主控 | ATmega328P | H3 | BCM2711 | AM335x |\n| 层数 | 2 | 4 | 4 | 6 |\n| DDR | 无 | DDR3 | LPDDR4 | DDR3 |\n| 高速接口 | 无 | 以太网/USB | PCIe/HDMI/USB3 | HDMI/USB/以太网 |\n| 电源复杂度 | 低 | 中高 | 高 | 高 |\n| 可复现难度 | 低 | 中 | 中高 | 高 |\n| 适合学什么 | 最少系统/保护 | SoC/DDR/无线 | 核心板/高速 | 多层/工业/扩展 |\n\n选型建议：第一次读开源工程从 Uno 开始；想学 DDR/无线读 OrangePi Zero；想做产品底板读 CM4IO；想学多层/工业读 BeagleBone Black。\n\n#### 22.4.9 层叠对比图\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 22-8：四块板的层叠对比（示意）<\/text>\n  <text x=\"40\" y=\"65\" font-size=\"11\" fill=\"currentColor\">Uno：2 层<\/text>\n  <rect x=\"40\" y=\"75\" width=\"120\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"48\" y=\"92\" font-size=\"9\" fill=\"currentColor\">L1 信号<\/text>\n  <rect x=\"40\" y=\"99\" width=\"120\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"48\" y=\"116\" font-size=\"9\" fill=\"currentColor\">L2 地<\/text>\n  <text x=\"220\" y=\"65\" font-size=\"11\" fill=\"currentColor\">OrangePi：4 层<\/text>\n  <rect x=\"220\" y=\"75\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"228\" y=\"90\" font-size=\"9\" fill=\"currentColor\">L1 信号<\/text>\n  <rect x=\"220\" y=\"95\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"228\" y=\"110\" font-size=\"9\" fill=\"currentColor\">L2 地<\/text>\n  <rect x=\"220\" y=\"115\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"228\" y=\"130\" font-size=\"9\" fill=\"currentColor\">L3 电源<\/text>\n  <rect x=\"220\" y=\"135\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"228\" y=\"150\" font-size=\"9\" fill=\"currentColor\">L4 信号<\/text>\n  <text x=\"400\" y=\"65\" font-size=\"11\" fill=\"currentColor\">CM4IO：4 层<\/text>\n  <rect x=\"400\" y=\"75\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"408\" y=\"90\" font-size=\"9\" fill=\"currentColor\">L1 高速<\/text>\n  <rect x=\"400\" y=\"95\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"408\" y=\"110\" font-size=\"9\" fill=\"currentColor\">L2 地<\/text>\n  <rect x=\"400\" y=\"115\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"408\" y=\"130\" font-size=\"9\" fill=\"currentColor\">L3 电源<\/text>\n  <rect x=\"400\" y=\"135\" width=\"120\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"408\" y=\"150\" font-size=\"9\" fill=\"currentColor\">L4 低速<\/text>\n  <text x=\"580\" y=\"65\" font-size=\"11\" fill=\"currentColor\">BBB：6 层<\/text>\n  <rect x=\"580\" y=\"75\" width=\"110\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"586\" y=\"87\" font-size=\"8\" fill=\"currentColor\">L1 信号<\/text>\n  <rect x=\"580\" y=\"91\" width=\"110\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"586\" y=\"103\" font-size=\"8\" fill=\"currentColor\">L2 地<\/text>\n  <rect x=\"580\" y=\"107\" width=\"110\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"586\" y=\"119\" font-size=\"8\" fill=\"currentColor\">L3 信号<\/text>\n  <rect x=\"580\" y=\"123\" width=\"110\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"586\" y=\"135\" font-size=\"8\" fill=\"currentColor\">L4 电源<\/text>\n  <rect x=\"580\" y=\"139\" width=\"110\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"586\" y=\"151\" font-size=\"8\" fill=\"currentColor\">L5 地<\/text>\n  <rect x=\"580\" y=\"155\" width=\"110\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n  <text x=\"586\" y=\"167\" font-size=\"8\" fill=\"currentColor\">L6 信号<\/text>\n  <text x=\"40\" y=\"230\" font-size=\"10\" fill=\"currentColor\">层数增加主要换三件事：参考面更完整、电源更独立、布线密度更高。<\/text>\n  <text x=\"40\" y=\"250\" font-size=\"10\" fill=\"currentColor\">不是层数越多越好；2 层能跑好的板，不要盲目上 6 层。<\/text>\n<\/svg>\n```\n\n#### 22.4.10 BOM 对比表\n\n| 类别 | Uno | OrangePi Zero | CM4IO | BBB |\n|---|---|---|---|---|\n| 主控 | ATmega328P（TQFP） | H3（BGA） | CM4 模块 | AM335x（BGA） |\n| 存储 | 无 | DDR3 + microSD | LPDDR4 + eMMC | DDR3 + eMMC |\n| 电源 | 5V/3.3V LDO | 多路 DCDC | 12V Buck + 多路 | 多路 LDO/DCDC |\n| 接口 | USB-B/排针 | RJ45/USB/天线 | PCIe/HDMI/USB/M.2 | HDMI/RJ45/USB/cape |\n| 保护 | 保险丝/ESD | ESD/变压器 | ESD/共模 | ESD/变压器 |\n| 关键成本 | 低 | 中 | 高 | 高 |\n\n读 BOM 的顺序：先看主控/存储/连接器（长交期、易停产），再看电源芯片（替代难），最后看阻容（可替代）。四块板都体现一个规律：**越靠近接口和电源的器件，越决定可制造性**。\n\n### 22.5 选型与降额\n\n| 工程来源 | 可信度 | 注意 |\n|---|---|---|\n| 芯片原厂参考设计 | 高 | 按 EVB 改 |\n| 大厂开源硬件 | 高 | 读许可证 |\n| GitHub 个人项目 | 中 | 看 issue/更新 |\n| 立创开源广场 | 中 | 库/封装要复核 |\n| 论坛附件 | 低 | 无版本/无测试 |\n\n### 22.6 测量与仿真\n\n#### 22.6.1 读工程顺序\n\n1. 读 README/LICENSE。\n2. 看原理图 PDF/图片。\n3. 看 BOM 和 Gerber。\n4. 打开工程，检查库依赖。\n5. 看 issue/已知问题。\n6. 提取 2～3 个可复用块。\n\n#### 22.6.2 CircuitJS\n\n```circuitjs\nrc-lowpass-159\n```\n\n```circuitjs\npower-buck\n```\n\n用开源工程里的 RC 参数复算截止频率，验证是否和作者说的一致。\n\n#### 22.6.3 动手任务\n\n- 选一个 STM32/ESP32 开源工程，写 1 页解读。\n- 检查 LICENSE/BOM/Gerber/库依赖。\n- 提取一个电源或接口块，画到自己的工程里。\n- 列出 3 个风险点。\n\n### 22.7 常见坑\n\n1. **只看图不看 LICENSE**：商用侵权。\n2. **直接打样不查 BOM**：器件停产。\n3. **缺库打不开**：浪费时间。\n4. **照抄参数不重算**：工况不同。\n5. **忽略已知问题**：issue 里已写。\n6. **封装不复核**：丝印/焊盘不对。\n7. **不看版本**：老工程器件过时。\n8. **把开源当“免测试”**：别人测试条件不同。\n\n### 22.8 本章复盘\n\n#### 22.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 五步读图 | 读工程 | 结构/电源/接口/布局/测试 |\n| LICENSE 先读 | 合规 | 商用/修改 |\n| BOM 查生命周期 | 可制造 | 替代料 |\n| 复用要重算 | 参数 | 工况不同 |\n| 可复现 = 工程+BOM+Gerber+文档 | 判断 | 缺一不可 |\n\n#### 22.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 可复现 | reproducible | 别人能做出同样的板 |\n| 库依赖 | library dependency | 自定义符号/封装 |\n| 生命周期 | lifecycle | 器件是否停产 |\n| 参考设计 | reference design | 原厂给的样板 |\n| 许可证 | license | 使用/修改/商用权限 |\n\n#### 22.8.3 自测 10 题\n\n1. 五步读图法是什么？\n2. 可复现需要哪些文件？\n3. LICENSE 要看什么？\n4. BOM 怎么查停产？\n5. 库依赖缺失会怎样？\n6. 开源工程能直接商用吗？\n7. 复用电路块为什么要重算？\n8. issue 里通常有什么？\n9. 原厂参考设计和 GitHub 项目可信度差在哪？\n10. 读工程笔记写什么？\n\n#### 22.8.4 能力清单\n\n- [ ] 能用五步法读一个开源工程。\n
