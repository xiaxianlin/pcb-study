| 成本 | 低 | 略高 |\n| 大电流/大压差场景 | 发热严重，不适用 | 适用 |\n| 典型场景 | 模拟供电、射频、ADC 基准等噪声敏感小电流 | 主电源轨、大电流、电池供电 |\n\n选型应比较效率、噪声频谱、PSRR、成本和热条件；某些场合适合 DCDC 后接 LDO，但 LDO 不保证滤除所有频率的纹波，需查数据手册与实测。\n\n#### 10.3.3 压差（Dropout）\n\nLDO 能正常稳压所需的最小输入输出压差。Dropout 与负载电流、温度及具体型号有关。不能用某一典型值推断所有 AMS1117 的最低输入；应使用目标工况下手册保证的最大压差，再计入输入最低值、输出精度和裕量。输入不足时输出可能失去稳压。\n\nLDO 选型五步：定输出电压与精度 → 算最大电流与功耗 → 查压差余量是否够 → 看噪声/PSRR 指标（给 ADC、射频供电时重点看）→ 定封装与热阻。五步做全，基本不会选错。\n\n#### 10.3.4 LDO 布局要点\n\n- 输入电容、输出电容紧靠对应引脚（经验值 1~3mm 内），回路短\n- 发热校验：P = (Vin − Vout) × I。例：5V→3.3V、200mA 时主要功耗约 0.34W；是否满足结温取决于具体器件、PCB 散热、环境与热阻测试条件，不能只凭封装名判断\n- 带 EP 的封装按 10.2.4 第 7 条核对电气连接、散热与装配工艺，是否使用过孔按设计决定\n- LDO 的地回路同样要短，别让地引脚绕远\n\n### 10.4 PMU 电源管理芯片\n\nPMU（Power Management Unit）/SOC 集成电源：把多路 Buck + 多路 LDO + 时序控制 + 各种保护集成进一颗芯片，常见于手机、平板、嵌入式核心板。特点：多路输出（如 4 Buck + 6 LDO）、I2C/SPI 可编程、支持动态电压调节（DVS）与各路监测。\n\n设计要点：\n\n- **上电时序（Sequencing）**：核心、IO、存储等电源轨要求按先后顺序上电（谁先谁后、间隔多少），由芯片内部时序或 EN/PG（Power Good）引脚级联实现。时序错了轻则不启动、重则损坏芯片——手册的 Power Sequencing 章节必读\n- **布局**：每路输出仍当作独立的 DCDC/LDO 对待（各自的电感、电容就近），多路地统一汇流到主地；采样与补偿网络照旧远离噪声\n- PMU 引脚密集：先画电源树、定好每路走向再动手布局，避免\"绕不过去\"\n\n### 10.5 AC-DC 高压开关电源（安全第一！）\n\n> 🔬 **配套仿真**：[二极管整流](#/sim/rectify)——AC 变脉动直流的第一步（弱电演示，无危险）\n\n产品接市电（220V AC）的第一级电源，典型拓扑是**反激（Flyback）**：开关管高频通断，能量先存进高频变压器再耦合到次级；变压器同时完成\"变压 + 电气隔离\"，输出经光耦（Optocoupler）把反馈信号隔离开关地送回初级，形成隔离闭环。\n\n三大安全概念（高压板的生死线）：\n\n1. **爬电距离（Creepage）与电气间隙（Clearance）**：初级（市电侧）与次级（低压侧）铜箔之间必须拉开足够距离，所需距离取决于工作电压、绝缘等级、污染等级等条件，须按适用的现行标准及认证要求确定；隔离屏障的布局应符合器件和安规要求\n2. **安规电容**：X 电容跨接火线-零线（滤差模干扰）；Y 电容跨接初级地与次级地（为共模干扰提供受控回路）；变压器、光耦和数字隔离器也可在满足绝缘与认证要求时跨越隔离屏障。必须使用通过安规认证的 X/Y 电容——它的失效模式有保障\n3. **热地（Hot Ground）与冷地（Cold Ground）**：初级侧地随市电浮动，碰到即触电，叫热地；次级侧常称冷地，但隔离不保证次级电压或触碰安全；是否安全须按整个设备的电压、绝缘和故障条件评估。两者不可随意直接连接；热地区域丝印画警示标识；维修前必须断电并对大电解电容放电（它存着市电峰值电压！）\n\n补充两个高频名词：X 电容分 X1/X2 等级、Y 电容分 Y1/Y2 等级（耐冲击等级不同，按电路位置选）；整机的安规认证（国内 CQC、欧盟 CE、美国 UL 等）都会检查上述间距与器件选型。\n\n新手红线：AC-DC 先学原理、看懂成熟产品板即可，**不要自己设计带市电的实验板**。市电带电测试须由受训人员使用适合的隔离与测量设备按安全规程执行；隔离设备不消除触电风险。深入内容放后续课程。\n\n### 10.6 进阶主题点名（规则先记，深学在第 19 课）\n\n| 主题 | 是什么 | 入门规则（经验值） |\n|---|---|---|\n| 拼板（Panelization） | 多块小板拼成大板生产 | 规则矩形分板用 V-cut；异形用邮票孔；四周留约 5mm 工艺边 |\n| 叠层设计（Stackup） | 多层板的层排列 | 经典 4 层：信号-GND-电源-信号；关键信号参考完整地平面 |\n| 阻抗控制（Impedance） | 控制走线特征阻抗 | 单端 50Ω；USB 差分 90Ω、以太网差分 100Ω（PCIe 常用 85Ω）；线宽线距由叠层参数计算或板厂代算 |\n| 差分线（Differential Pair） | 等长等距成对走线 | 两线紧耦合、全程平行，等长误差按接口规范控制 |\n| T 点拓扑 | 一驱多的对称分支结构 | 分支对称、主干到分支等长，常见于时钟/DDR 布线 |\n| 盲埋孔（Blind/Buried Via） | 不贯穿全板的过孔 | 高密度 BGA 才需要，成本高，现阶段了解即可 |\n| 蛇形等长（Serpentine） | 绕蛇形补偿长度差 | 3W 间距规则（蛇形间距 ≥3 倍线宽），避免密绕自耦合 |\n| 光耦（Optocoupler） | 光信号隔离传输器件 | 用于跨隔离带传反馈/信号；布局时保持其两侧的隔离间距 |\n\n这些主题在高速板与复杂板上组合出现，第 19 课系统展开。现阶段只需：见到名词知道是什么，并避免在电源板里误用（例如乱分割地平面、乱加盲埋孔拉高成本）。\n\n### 10.7 动手项目：12V→5V(Buck)→3.3V(LDO) 电源小板\n\n项目结构为 DCDC 先降压，再由 LDO 产生 3.3V；效率、纹波和噪声需依据选定器件与负载核对。\n\n参考选型（商城均可搜到，同类型替换亦可）：\n\n| 模块 | 参考型号 | 说明 |\n|---|---|---|\n| 5V Buck | TPS54331 / MP1584EN 等 | 资料全、Layout 章节写得清楚，适合精读 |\n| 3.3V LDO | AMS1117-3.3 或低压差新型号 | 5V→3.3V 压差 1.7V，Dropout 余量充足 |\n| 接口 | DC 电源座 / 排针 / 测试点 | 输入 12V，输出 5V 与 3.3V 各留测试点 |\n\n设计流程（必须走完）：\n\n1. 画电源树与功耗预算：各路最大电流、各级压差与发热估算\n2. 精读 Buck 数据手册：先读 Pin Description（引脚定义），再读典型应用图，**最后精读 Layout Guidelines 一节，逐句对照自己的布局**——这是本课最重要的作业\n3. 原理图：以所选器件典型应用图为起点，按实际输入、输出、环路、反馈及保护要求逐项核算\n4. 布局：严格按 10.2.4 十条军规执行，每条做完打钩\n5. 布线与铺铜：按电流、热条件核算路径；EP 连接与散热过孔依实际器件和工艺决定\n6. DRC 清零，输出 Gerber 与 BOM\n7. （打样回来后）上电测试：空载电压、带载电压、示波器测纹波（测试方法搜索 \"示波器 测纹波\"）\n\n上电调试的安全顺序（电源板必守）：\n\n1. 焊接完成后，万用表先量输入电源对地阻抗，排除短路\n2. 使用合适的限流电源；按预期空载、启动电流和输入电容浪涌设置限流并监测，不套用固定 100mA\n3. 由前级到后级逐级确认电压：先 12V → 5V → 3.3V\n4. 空载正常后再逐步接入负载；用合适的温度测量工具监测器件温升\n5. 出问题立即断电，先放电再排查，不带电检修\n\n**电源预算练习（题设示例）：**12V 输入，Buck 输出 5V，为外部负载提供 0.5A，同时给 3.3V、0.1A 的 LDO 供电。忽略 LDO 自身电流，Buck 侧总电流约 0.6A、输出功率约 3.0W；若 Buck 在该工作点效率假设为 85%，其输入功率约 3.53W、12V 输入电流约 0.294A。LDO 功耗约 0.17W。启动峰值、效率变化、压差和温升都需由真实器件和负载重新核对。\n\n**反馈习题参考：**题设 Vref=0.6V、R2=10kΩ，按 Vout=Vref(1+R1/R2)：3.3V 时 R1=45kΩ；5V 时 R1≈73.33kΩ，可比较 E96 的 73.2kΩ，标称输出约 4.992V。只对采用该反馈结构的芯片成立，仍须核对分压电流、容差与手册要求。\n\n### 10.8 与电路基础的衔接\n\nLDO、Buck、Boost 等供电方案的入门原理和变压器专题统一放在[第 05 课 · 05.11～05.12](#/lesson/05)。本课重点学习电源模块选型、布局、测试和设计实践。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | 拓扑手绘 | 手画 Buck 与 Boost 拓扑，标出导通/关断两阶段的电流回路（拍照存档） |\n| 2 | FB 分压计算 | 给定 Vref=0.6V，算出目标 3.3V 与 5V 两组的 R1/R2（E96 取值） |\n| 3 | 精读 Layout Guidelines | 摘抄所选 Buck 手册 Layout 章节全部要点，整理成自查清单 |\n| 4 | 电源小板原理图 | 12V→5V→3.3V 两级结构完整，编译无错 |\n| 5 | 电源小板布局 | 十条军规逐条自查通过并留记录 |\n| 6 | 布线与散热 | 路径按电流及压降核算，EP 散热方案有依据，DRC 检查完成 |\n| 7 | 输出与验证 | Gerber + BOM 完整；（进阶）打样上电测电压与纹波 |\n\n## ✅ 自测清单\n\n- [ ] 能手画 Buck/Boost 拓扑并讲出开关两阶段的电流路径\n- [ ] 能在理想稳态、CCM 条件下写出 Buck 的 Vout = D×Vin、Boost 的 Vout = Vin/(1−D)\n- [ ] 能说出 DCDC 五大外围元件的作用与选型要点（含电感饱和电流经验余量）\n- [ ] 能背出 DCDC 布局十条军规中的至少 8 条并解释物理原因\n- [ ] 能解释\"大电流环路面积最小化\"为什么重要\n- [ ] 能说明 FB 远离开关节点、缩短采样回路，并按芯片手册选择采样点\n- [ ] 能从效率/纹波/成本/噪声四个维度完成 LDO vs DCDC 选型对比\n- [ ] 能解释 Dropout，并按具体型号、负载与最坏条件计算所需输入电压\n- [ ] 能算 LDO 功耗 P=(Vin−Vout)×I 并判断封装是否够用\n- [ ] 能说出 PMU 上电时序为什么重要\n- [ ] 能说明 AC-DC 的绝缘距离、适用安规器件和初次级边界；Y 电容是否需要依拓扑和安全设计确定\n- [ ] 能说出 50Ω/90Ω/100Ω 分别对应什么信号\n- [ ] 知道 EP 的电气和散热要求为何需查手册，过孔与铺铜应按热设计和装配工艺决定\n\n- [ ] 我能说明不同变压器可能用于变压、隔离或阻抗匹配，并解释匝比与绝缘条件\n- [ ] 我能解释开关频率与磁性元件尺寸的设计权衡，以及反激磁性元件的储能作用\n\n## ⚠️ 新手常见坑\n\n1. **输入电容放得远**：CIN 离 IC 两三厘米，纹波暴涨甚至因振铃超耐压损坏芯片。CIN 必须紧贴 VIN/PGND 脚。\n2. **FB 走线从 SW 或电感旁边过**：输出电压漂移、抖动，示波器上毛刺大。改道绕行 + 缩短 FB 走线。\n3. **电感饱和电流不够**：满载时电感啸叫、发烫、限流提前触发。按峰值电流 1.3 倍以上选（经验值）。\n4. **LDO 大压差带大电流**：5V→3.3V、500mA 时 P = 0.85W，SOT-23 封装烫到稳不住。先算功耗，再换封装或改前级 DCDC。\n5. **高压板当普通板画**：初次级间距不足、隔离带内走线铺铜——安规不过、认证报废，还有触电风险。隔离区的间隙与爬电距离必须按适用标准、器件绝缘和污染等级确定，不能把单一数字当通用安规要求。\n6. **忽略散热焊盘**：EP 若未按要求焊接或散热不足，可能超温；应按器件手册和热设计决定焊盘连接、铺铜及是否使用过孔。\n7. **乱分割地平面**：把 GND 切得七零八落，回流路径绕远、EMI 变差。新手双面板整板 GND 大铺铜即可，分地要慎之又慎。\n\n## 📚 延伸学习\n\n- B 站搜索关键词：\"Buck 电路 原理 动画\"、\"DCDC PCB layout 讲解\"、\"LDO dropout 详解\"、\"反激 电源 原理\"、\"开关电源 环路 补偿\"\n- 厂商文档（搜索关键词）：\"TI application note buck converter layout\"、\"ADI LDO tutorial\"、\"TPS54331 datasheet Layout Guidelines\"、\"电源设计 黄金法则\"（TI/ADI/MPS 官网应用笔记板块）\n- 书籍参考：Pressman《开关电源设计》——深入阶段再读\n- 实战对比：搜一块开源电源板（如 \"MP1584 开源 原理图\"），对照自己的布局比较 SW 节点面积与电流环路","taskSignature":"f2381fb3328922421eb9ec7af75439e91b29b4d56575098bf85a51d48cd3805b","taskCount":15},{"id":"11","title":"第 11 课 · 接口模块","short":"接口模块","stage":2,"diff":3,"prev":"第 10 课 · 电源模块","optional":false,"md":"接口（Interface）是 PCB 上\"事故率\"最高的区域：要被反复插拔、要承受静电（ESD）与浪涌、还要跑高速信号。这一课把 7 类最常见的接口逐个拆开，用统一的三段式方法建立你自己的\"接口速查手册\"。\n\n## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 用\"协议 → 电路 → 布局布线\"三段式拆解任何一个没见过的接口，而不是死记硬背规则；\n2. 说出 USB2.0/USB3.0、HDMI、VGA、RJ45、SATA、SIM、TF 卡各自的信号组成、速率等级与差分阻抗要求；\n3. 按接口器件手册规划连接器、并联 ESD/TVS、可选滤波与芯片的位置，并解释泄放路径；\n4. 解释网络变压器的三大作用，独立完成 RJ45 接口区域的隔离挖空与 Bob Smith 端接布局；\n5. 为每种接口写出\"布局要点清单 + 布线规则表\"，汇总成个人速查手册；\n6. 拿到一块主流开发板，能对照丝印辨认每个接口区域，并说出其布线特点与设计意图。\n\n## 📖 正文\n\n### 11.1 三段式拆解法：学接口的通用方法论\n\n接口种类繁多，但拆解方法只有一套。以后每遇到一个新接口，都按下面三步走：\n\n1. **协议简介**：信号有几根？速率多快？差分（differential）还是单端（single-ended）？→ 速率和信号形式决定了布线难度与等长（length matching）要求；\n2. **电路组成**：连接器、ESD 保护、TVS 管、共模电感、滤波阻容、PHY/接口芯片各自在哪？→ 元件种类和顺序决定了摆放次序；\n3. **布局布线要点**：阻抗多少、等长多少 mil、参考层是否完整、防护器件离接口多远？→ 汇总成一张规则表，日后当速查手册用。\n\n**先记住本课所有接口的一张总表**（均为经验值，具体以所用主控/PHY 芯片的官方 Layout Guide 为准）：\n\n| 接口 | 信号形式 | 典型速率 | 差分阻抗 | 等长要求 | 是否热插拔 |\n|:---|:---|:---|:---|:---|:---:|\n| USB 2.0 | 1 对差分 D± | 480 Mbps | 90Ω | 以芯片指南与时序预算为准 | 是 |\n| USB 3.0 | 3 对差分（D± + TX± + RX±） | 5 Gbps | 90Ω | 按芯片指南确定对内与对间偏斜预算 | 是 |\n| HDMI TMDS | 3 对数据 + 1 对时钟 | 依版本与模式 | 常见目标 100Ω | 按发射/接收器及通道预算 | 依系统设计 |\n| VGA | 3 路模拟 + 2 控制信号 | 取决于显示模式 | 视频路径视带宽与长度考虑 75Ω | 视系统时序与图像质量要求 | 视设备设计 |\n| RJ45 千兆 | 4 对 MDI 差分 | 每对 125 MBd，四对并行 | 100Ω | 对内 ±5~10 mil，对间放宽 | 是 |\n| SATA 3.0 | 2 对差分（TX/RX） | 6 Gbps | 100Ω | 以芯片指南与时序预算为准 | 是 |\n| SIM / TF 卡 | 单端信号 | SIM 依卡与接口；TF SDR104 时钟最高 208 MHz | 按信号模式和器件指南 | 按速率及时序预算 | 取决于卡座、控制器和系统设计 |\n| MIPI 摄像头 | D-PHY 数据与时钟差分 lane | 依版本和器件 | 常见目标 100Ω | 按发射/接收器及通道预算 | 依系统设计 |\n\n> 观察：**凡是高速串行接口（USB3/HDMI/SATA/千兆网），无一例外都是受控阻抗差分对 + 对内等长**；SIM、TF、SDIO 等单端接口，重点就换成串扰控制与 ESD 防护。记住这条规律，接口模块就懂了一大半。\n\n### 11.2 USB 2.0 / USB 3.0\n\n#### 协议简介\n\nUSB 2.0 只有 4 根线：VBUS（5V）、D+、D-、GND。三种速率：低速 1.5 Mbps、全速 12 Mbps、高速 480 Mbps。D± 是一对 90Ω 差分对，但注意低速/全速使用差分 J/K 状态，也使用 SE0 等单端状态；走线阻抗与偏斜应按器件指南、接口模式及通道预算确定。\n\nUSB 3.0（SuperSpeed）在 USB 2.0 基础上增加了两组 5 Gbps 差分对：**TX±（主控发出）和 RX±（主控接收）**，加上原有 D±，共 **3 对差分**（A 型母口因此多出 5 个触点（4 信号 + 1 地））。TX 线上各有一颗交流耦合电容（常用 0.1 μF 量级，靠近发送端放置，以规范/手册为准）。\n\n#### 电路组成\n\n典型 USB 接口\"三件套\"：**连接器 → ESD 保护 → 主控**，可选共模电感：\n\n- **ESD/TVS 管**：接口常用低电容保护阵列。除结电容外，还须核对工作电压、钳位电压、脉冲波形、漏电、布局及通道损耗；按器件和接口的信号完整性预算选型，不能只看一个电容数字；\n- **共模电感（CMC）**：可用于抑制共模干扰，但也会引入差分插入损耗及阻抗不连续；是否需要由芯片指南、通道预算与 EMC 测试决定；\n- **VBUS 防护**：依据端口角色和功率预算选择适当的过流、过压与 ESD 保护；电容大小、启动浪涌、反灌及开关方案按规范和芯片手册核验，不能套用固定器件与大电容。\n\n#### 布局要点清单\n\n- [ ] ESD/TVS 靠近连接器和信号入口，缩短信号到保护器件及其地端的引线，按器件指南优化泄放回路；\n- [ ] 如选用共模电感，按芯片及防护参考设计确定信号路径上的位置；TVS 是并联泄放支路；\n- [ ] 交流耦合电容（USB 3.0）靠近发送端，不放在接收端；\n- [ ] 接口元件集中摆放，D±/TX/RX 出连接器后立即进入防护区，不绕行、不打桩（stub）；\n- [ ] 连接器外壳如何接机壳地、系统地或隔离网络，按整机 EMC、安全和连接器指南设计。\n\n#### 布线规则表\n\n| 规则项 | USB 2.0 | USB 3.0 | 备注 |\n|:---|:---|:---|:---|\n| 差分阻抗 | 90Ω ±10% | 90Ω ±10% | 3 对都按 90Ω |\n| 对内等长 | 按控制器和通道预算 | 按控制器和通道预算 | 不能将单一长度差作为通用保证 |\n| 对间等长 | 按通道与控制器预算 | 按通道与控制器预算 | TX/RX 方向与约束分别核查 |\n| 线宽/间距 | 按叠层计算（如 0.15/0.15 mm 起） | 同左 | 用阻抗计算工具算，勿抄别人的值 |\n| 参考层 | 完整地平面，禁跨分割 | 同左 | 换层处伴随地过孔 |\n| 过孔数量 | ≤2 个/对 | 尽量 0~1 个 | 过孔 = 阻抗突变点 |\n| 拐角 | 45° 或圆弧 | 同左，且两根线同步拐 | 避免直角 |\n\n> 顺带一提：Type-C 是可反插连接器规范，接口可以只支持 USB 2.0；是否具备 SuperSpeed、PD 或其他模式取决于产品、线缆及配置，不能由插头形状判断。需要 SuperSpeed 时，依据具体接口角色、方向检测、信号切换与芯片手册设计。学完本课再去查 Type-C 引脚定义即可。\n\n**Type-C 低压受电端入门例：**如果产品使用 USB-C 母座，只作为不协商 PD 的 5V 受电端，CC1 和 CC2 通常各自配置符合规范的 Rd 下拉；VBUS、GND、D+/D− 的引脚合并、去耦、ESD、防反灌及电流预算应按连接器、USB-C 规范和所选控制器参考设计核对。不能仅把 VBUS 和 GND 接上就假设所有线缆和主机都能正常供电。带 PD、双角色或高速切换的产品需相应控制器与完整设计。\n\n### 11.3 HDMI\n\n#### 协议简介\n\nHDMI 1.4/2.0 的 TMDS 模式采用 **TMDS（Transition Minimized Differential Signaling）差分对**：3 对数据（D0/D1/D2）+ 1 对时钟，**共 4 对差分**。HDMI 1.4 每对 ≤3.4 Gbps，2.0 提升到每对 6 Gbps。HDMI 2.1 的 FRL 模式采用不同的数据通道安排，不能照搬 TMDS 时钟对描述。此外还有低速信号：DDC（I²C 的 SCL/SDA，读显示器 EDID）、CEC、HPD（热插拔检测）和 +5V 电源。\n\n**阻抗注意**：不少入门资料写\"HDMI 90Ω\"，那是把 USB 的数值记串了。HDMI 规范的 TMDS 差分阻抗是 **100Ω（±15%）**；个别主控手册会给出自己的推荐区间（如 90~100Ω），**设计时以主控 Layout Guide 为准**。\n\n#### 电路组成\n\n- **ESD 阵列**：4 对 TMDS 共 8 根线，通常用多通道低结电容（<0.5 pF）ESD 阵列一颗搞定，紧贴连接器；\n- **共模电感/ESD 滤波阵列**：TMDS 每对可选共模电感，压 EMC；\n- **DDC/CEC/HPD**：低速线，常规 ESD（结电容不敏感）+ 上拉电阻即可。\n\n#### 布局要点清单\n\n- [ ] 低电容 ESD 支路靠近连接器与信号入口，缩短信号支路和接地回路；\n- [ ] 4 对差分整组并行走线，同层、同过孔数、同拐角，\"共进退\"；\n- [ ] TMDS 下方参考地平面完整，整组一次换层（最多 1 次）；\n- [ ] DDC/CEC 与 TMDS 分开，不要混扎在差分对之间。\n\n#### 布线规则表\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 差分阻抗 | 按器件、接口与叠层设计指南确定（常见目标 100Ω） | 核对完整通道而非只看走线 |\n| 对内等长 | 依器件与通道预算 | 补偿位置与形状按设计指南 |\n| 对间等长 | 依器件与通道预算 | 核对时钟与数据间的传播延迟 |\n| 参考层 | 完整、不跨分割、不跨挖空区 | 否则阻抗与串扰同时恶化 |\n| 长度 | 总长尽量短，各组接近 | 长度差带来的偏移无法靠端接修复 |\n| 过孔 | ≤1~2 个/对，4 对一致 | |\n\n### 11.4 VGA\n\n#### 协议简介\n\nVGA 是纯**模拟接口**：R/G/B 三路视频信号（各 0.7 Vpp、内阻 75Ω）+ 行同步 HSYNC / 场同步 VSYNC 两根数字信号，15 针 DSUB 连接器。没有数字链路的时钟恢复，RGB 通道仍需评估相对延迟——它的敌人不是偏斜，而是**噪声**：任何耦合进 R/G/B 的数字噪声都会直接变成屏幕上的花纹。\n\n#### 电路组成\n\n依据 DAC 输出结构、负载与厂商参考电路设计 RGB 的滤波和 75Ω 视频系统匹配；部分驱动器已集成所需输出或端接，不能默认每通道串 75Ω。同步线串阻及模拟供电滤波同样按芯片指南决定。\n\n#### 布局要点清单\n\n- [ ] R/G/B 滤波网络一字排开，放在 DAC 与连接器之间的直线通路上；\n- [ ] VGA 区域整体远离晶振、DCDC 开关节点、HDMI/USB 差分线；\n- [ ] 模拟地（AGND）与数字地在 VGA/DAC 附近单点连接（或统一地平面 + 布局分区，第 12 课音频一节展开讲两种流派）；\n- [ ] 连接器固定脚接地，外壳屏蔽接地。\n\n#### 布线规则表\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 阻抗 | 根据带宽、边沿、路径长度及器件指南判断 | 较长或快速的视频路径需考虑与 75Ω 系统匹配 |\n| 等长 | 根据系统允许的通道延迟差评估 | 延迟不匹配可能造成颜色错位；幅度误差还涉及阻抗和损耗 |\n| 间距 | R/G/B 相互间距 ≥3W，对数字信号间距更大 | 防串扰是 VGA 的头等大事 |\n| 包地 | 条件允许时两侧包地 + 地过孔 | 尤其走在数字区附近时 |\n| 总长 | 短直 | 每一毫米都是噪声天线 |\n\n### 11.5 RJ45 百兆 / 千兆以太网\n\n#### 协议简介\n\n百兆（100BASE-TX）用 2 对差分，千兆（1000BASE-T）用 **4 对差分（MDI，Medium Dependent Interface），每对 100Ω**。PHY 芯片与网线之间必须隔一颗**网络变压器（Magnetics）**，这是网口电路的核心。\n\n**网络变压器的三大作用**：\n\n1. **电气隔离**：磁性器件可隔开 PHY 侧与线缆侧的直流通路；耐压和绝缘应按器件、接口及整机标准确认，隔离本身不能替代雷击或浪涌保护；\n2. **信号耦合**：按 PHY 的接口与磁性器件要求传递信号，双绞线和 PCB 通道阻抗应按规范及参考设计匹配；不能只靠变压器保证匹配；\n3. **共模抑制**：磁性组件常组合变压器与共模扼流圈，提供一定共模抑制；插入损耗、共模阻抗和浪涌能力须看具体组件频率特性与系统设计。\n\n关于 **MDI/MDI 交叉（crossover）**：历史上同类设备互联要用交叉网线（T568A/B 两种压线顺序）；部分 PHY 支持 Auto-MDIX，可在规定模式下处理线缆中的发送与接收对交换；具体能力及配置依器件而异。**这不等于 PCB 上可以任意交换 PHY 引脚或变压器线对**：应按 PHY、磁性器件与 RJ45 的参考电路核对绕组、中心抽头和极性。\n\n**POE（Power over Ethernet）简介**：802.3af/at/bt（约 15/30/60~90 W），PSE 供电设备按具体供电模式通过线对施加直流电；可能采用两对或四对，部分方案使用变压器的中心抽头，PD 受电端用二极管桥整流 + PD 控制器取电。POE 板上这部分按大电流电源设计：走线宽度按压降计算（bt 90W 时每对线电流可达 1A 级）、变压器和连接器要选 POE 等级、隔离爬电要求更高。\n\n#### 电路组成\n\n- **RJ45 连接器**：可选\"内置变压器\"型号（如 HR91105 类，省布局）或外置变压器；\n- **线侧共模端接**：部分设计采用 Bob Smith 终端；是否需要、中心抽头/未用线对如何连接及电容绝缘额定值，必须以磁性器件、PoE 和 PHY 参考设计为准，不能固定套用 4×75Ω；\n- **PHY 侧**：4 对 MDI 差分 + PHY 的 Rset/晶振等常规电路；线侧可加低容 TVS/气体放电管做浪涌防护（室外或工业场合必备）。\n\n#### 布局要点清单\n\n- [ ] 变压器紧贴 RJ45（用内置变压器的连接器则一步到位）；PHY 与变压器之间距离尽量短（经验值 ≤25~50 mm，以 PHY 手册为准）；\n- [ ] 按磁性器件和整机隔离要求标出隔离边界；是否在器件下方挖空、范围与绝缘距离依封装、PCB 结构、适用标准及 PHY/连接器指南确定；\n- [ ] 如使用 Bob Smith 网络，按参考电路连接线侧与机壳参考；机壳地和系统地的关系依隔离、浪涌、ESD 与整机设计确定，不能预设单点或固定元件；\n- [ ] 连接器 HR 外壳脚、变压器屏蔽脚就近接地。\n\n#### 布线规则表\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 差分阻抗 | 100Ω（PHY 侧 MDI 与线侧都是） | 4 对一致 |\n| 对内等长 | ±5~10 mil | 相对宽松，但别放飞 |\n| 对间等长 | 无硬性，尽量 ±100 mil 内 | 千兆每对独立 CDR |\n| PHY-变压器距离 | ≤25~50 mm，越短越好 | 长了端接和 EMI 都难办 |\n| 隔离区 | 依具体器件、布局及适用标准确定 | 不能把 2mm 当作所有产品的安全保证 |\n| 电源 | 千兆 PHY 1.8V/2.5V 就近去耦 | 网口不稳先查电源 |\n\n### 11.6 SATA\n\n#### 协议简介\n\nSATA（Serial ATA）三代速率：1.5 / 3 / 6 Gbps。每个 SATA 通道就是 **TX±/RX± 两组 100Ω 差分对**（规范 ±15%），TX 线带交流耦合电容（常用 0.01~0.1 μF，靠近发送端，以主控手册为准）。协议层内嵌时钟（CDR），对内偏斜与通道损耗按控制器和连接器指南确定，不能统一套用一个长度差。\n\n#### 布局要点清单 + 布线规则表\n\n- [ ] 主控 SATA 控制器与连接器之间走线尽量短（经验值 ≤150 mm），mSATA/M.2 形态则按金手指扇出；\n- [ ] 两组差分并排走，同层、同过孔数，参考层完整；\n- [ ] 耦合电容垫在发送端路径上，不形成分支。\n\n| 规则项 | 经验值 |\n|:---|:---|\n| 差分阻抗 | 100Ω ±10%（规范容差 ±15%，取严做设计目标） |\n| 对内等长 | 依控制器与通道预算 |\n| 参考层 | 完整地平面，禁跨分割 |\n| 总长 | ≤150 mm，短直优先 |\n| 过孔 | ≤2 个/对 |\n\n### 11.7 SIM 卡\n\n#### 协议简介\n\nSIM 卡遵循 ISO 7816 接触式智能卡协议，核心 4 个信号：**VCC（电源，Class B 3.0V / Class C 1.8V）、RST（复位）、CLK（时钟）、DATA（双向数据）**，加 GND；卡座一般还引出 1~2 个插拔检测（DET）脚。信号速率低（兆赫兹级），**没有等长要求**，重点是 ESD 防护与走线短。\n\n#### 电路组成\n\n- **ESD 阵列**：SIM 卡接口可能承受静电；是否支持带电插拔由控制器、卡座及软件共同决定。按接口手册选择 VCC/RST/CLK/DATA 的保护及布置；\n- **滤波**：VCC 就近 100 nF + 1 μF；RST/CLK 常串 22Ω 抑制过冲；DATA 上拉 10 kΩ；\n- 卡座 DET 脚上拉到主控 GPIO。\n\n#### 布局要点清单 + 布线规则表\n\n- [ ] 卡座靠近主控/基带芯片，走线整体短；\n- [ ] ESD 器件靠近卡座信号入口，缩短并联支路及泄放回路；\n- [ ] CLK 线远离天线与射频区（第 12 课），防止时钟谐波干扰接收；\n- [ ] 卡座周边留出插拔操作空间，不摆高元件。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 阻抗/等长 | 常规 50Ω 单端，无等长要求 | 低速总线 |\n| 走线长度 | 尽量短（<50 mm 量级） | 走线长 = 天线长 |\n| 防护 | ESD 阵列紧贴卡座 | 热插拔必配 |\n| 电源 | 100 nF + 1 μF 就近 | VCC 稳是识别卡的前提 |\n\n### 11.8 TF 卡（SD 卡）\n\n#### 协议简介\n\nTF 卡（MicroSD）信号：**CLK、CMD（命令/响应，双向）、DAT0~DAT3（数据）**。总线宽度有 1 线 / **4 线模式（DAT0~3，TF 卡的常态）**；**8 线模式（DAT0~7）** 出现在 eMMC 和部分主控复用的 SD 控制器上，TF 卡本体按 4 线用。速率档位：默认 25 MHz、高速 50 MHz、UHS-I 的 SDR50/SDR104（50/208 MHz，1.8V 信号）——速率决定等长松紧。\n\n#### 电路组成\n\n- **上拉电阻**：CMD 与 DAT0~3 每根上拉 10~50 kΩ（UHS 模式按手册调整阻值），**CLK 不上拉**；\n- **串阻**：CLK（必要时 CMD）串 22~33 Ω，靠近主控端，做源端匹配；\n- **ESD**：TF 卡必配 TVS 阵列（热插拔），紧贴卡座。\n\n#### 布局要点清单 + 布线规则表\n\n- [ ] 卡座放板边，方便插拔，ESD 紧贴卡座；\n- [ ] 根据控制器的时序预算处理 CLK 与 DAT/CMD 的传播延迟；不能默认 CLK 一定要最长；\n- [ ] 串阻、上拉电阻集中摆放，不落在差分/时钟密集区。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 等长（25/50 MHz） | 宽松，±300 mil 内一般可工作 | 别花一下午绕普通 TF 卡的蛇形线 |\n| 等长（SDR50/104） | CLK 与 DAT/CMD 差 ±50~100 mil 级 | 高速档位必须收紧 |\n| 总长 | ≤100 mm 量级，短为好 | 以主控手册为准 |\n| 阻抗 | 50Ω 单端 | 高速档注意 |\n| 电源 | 3.3V 就近 10 μF + 100 nF，可加负载开关 | 支持热插拔断电更稳 |\n\n### 11.9 接口通用防护与机械要点\n\n不同接口的细节各异；下面是通用检查方向，具体连接、距离和器件必须按目标系统确定：\n\n1. **防护连接**：多数 TVS 是从信号线并联到参考地的泄放支路，不要求信号串过 TVS。应让信号入口靠近器件连接点，缩短支路与地回路；共模器件、串阻是否需要及其顺序依具体电路确定。\n2. **ESD 布局三原则**：连接点靠近接口、并联支路短、泄放回路到合适参考地短而低阻抗；过孔数和布局按器件及板层指南确定。\n3. **按速率选结电容**：低速口（VGA 同步、SIM、TF）结电容不敏感；USB 2.0 高速选 <5 pF；USB 3.0/HDMI/MIPI 选 <0.5~1 pF。结电容标错一个量级，高速口眼图就没了。\n4. **连接器机械净空**：按所选连接器的定位孔、金属壳、焊盘、插拔行程及图纸定义禁布区；本体下是否允许布线或铺铜因结构而异，须检查铜到金属件与孔的间距。\n5. **拔插应力区加固**：高频插拔的接口（USB/TF/SIM/网口）焊盘加大或选用带塑料锚固柱的连接器；卡座正后方 5 mm 内不摆 0201/0402 小件与细走线（会被反复撬裂）；板边连接器加安装孔螺丝固定。\n6. **认证意识**：对外接口按 IEC 61000-4-2（接触 ±8 kV / 空气 ±15 kV）的等级设计余量，防护电路按\"会有人带电插拔\"来假设。\n\n### 11.10 工业接口三兄弟：RS232 / RS485 / CAN\n\n前面 7 类接口统治消费电子，还有一族接口统治另一片领地——工厂、电表、充电桩、汽车。它们速率不高（kbps~Mbps 级），但个个抗造：传得远（百米到千米）、耐共模、防浪涌。这就是工业接口三兄弟，仍然用三段式拆解，并入你的速查手册。\n\n#### RS232：老牌串口\n\n**协议简介**：RS232（EIA/TIA-232）是最老牌的串行接口，9 针 DSUB 是它的经典形象，现在常用 3 线简化接法（TXD/RXD/GND）。速率一般 ≤115.2 kbps，距离短（经验值 ≤15 m）。它最大的特点是**电平古怪**：逻辑 1 用 −3~−15V、逻辑 0 用 +3~+15V（典型 ±12V 摆幅）——与 MCU 的 0/3.3V 完全不兼容，直连可能造成损坏或通信异常，应使用满足电压及协议要求的转换电路（如适用的 MAX3232 类器件）。\n\n**电路组成**：\n\n- **电平转换芯片**（MAX3232 类）：内部电荷泵把 3.3V/5V 泵出正负摆幅，MCU 的 TX/RX 在这里变成 RS232 电平；\n- **电荷泵电容**：典型 4 颗（0.1 μF 量级，以芯片手册为准），是芯片产生负压的\"泵芯\"；\n- 可选防护：线侧 TVS（±15V 级钳位）+ 串阻限流。\n\n**布局布线要点**：\n\n- [ ] 电荷泵电容**紧贴芯片引脚**、回路最短——泵回路里全是开关噪声，放远了负压不稳、EMC 恶化；\n- [ ] TXD/RXD 走线短直（≥0.2 mm），远离晶振与时钟线；速率低，无阻抗与等长要求；\n- [ ] 转换芯片靠近连接器放，缩短高压侧走线。\n\n#### RS485：差分总线，工业通信主力\n\n**两端端接示意：**两只端接电阻分别跨接总线的两条线。若线缆特性阻抗约 120Ω，端接可从 120Ω 开始设计；是否需要端接及其阻值要结合速率、长度和实际波形判断。A/B 命名在器件间可能不同，应以手册的电压定义核对。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 330\" role=\"img\" aria-label=\"RS485差分总线两端跨接终端电阻的接线示意\" style=\"max-width:760px\">\n<style> .w{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .box{fill:none;stroke:currentColor;stroke-width:3} .t{fill:currentColor;font:18px sans-serif} .sm{fill:currentColor;font:15px sans-serif} .node{fill:currentColor} <\/style>\n\n<rect class=\"box\" x=\"35\" y=\"110\" width=\"130\" height=\"110\"/><rect class=\"box\" x=\"590\" y=\"110\" width=\"130\" height=\"110\"/>\n<path class=\"w\" d=\"M165 140H590 M165 190H590 M200 140V151 M200 179V190 M555 140V151 M555 179V190\"/>\n<rect class=\"box\" x=\"188\" y=\"151\" width=\"24\" height=\"28\"/><rect class=\"box\" x=\"543\" y=\"151\" width=\"24\" height=\"28\"/>\n<circle class=\"node\" cx=\"200\" cy=\"140\" r=\"4\"/><circle class=\"node\" cx=\"200\" cy=\"190\" r=\"4\"/><circle class=\"node\" cx=\"555\" cy=\"140\" r=\"4\"/><circle class=\"node\" cx=\"555\" cy=\"190\" r=\"4\"/>\n<text class=\"t\" x=\"55\" y=\"165\">收发器 1<\/text><text class=\"t\" x=\"610\" y=\"165\">收发器 2<\/text><text class=\"t\" x=\"365\" y=\"127\">A<\/text><text class=\"t\" x=\"365\" y=\"216\">B<\/text><text class=\"sm\" x=\"215\" y=\"172\">端接 R<\/text><text class=\"sm\" x=\"475\" y=\"172\">端接 R<\/text><text class=\"sm\" x=\"130\" y=\"262\">电阻跨接 A/B；中间节点可接入总线，支线应尽量短<\/text><text class=\"sm\" x=\"130\" y=\"292\">偏置、共模参考、隔离及防护按实际系统设计<\/text>\n\n<\/svg>\n```\n\n\n**协议简介**：RS485（EIA/TIA-485）跑在**一对差分线 A/B** 上：接收器依据 A/B 差分电压判断状态，同时必须满足其规定的共模和绝对输入范围；A/B 命名与极性以具体器件手册为准。速率与距离此消彼长：短距可 10 Mbps、长距 100 kbps 传约 1200 m（经验值）。常见两线制是**半双工**，同一对线分时收发；也有四线制等实现。方向控制取决于收发器与协议；支持**多点组网**，一条总线挂几十个节点，典型一主多从轮询。\n\n**电路组成**：\n\n- **收发器**：MAX485、SP3485 类；MCU 侧接 TXD/RXD/DE，线侧出 A/B；\n- **终端电阻**：需要端接的线型总线通常在物理两端跨接接近线缆特性阻抗的电阻；120Ω 是常见例子，是否需要及阻值由线长、边沿、拓扑与芯片要求决定。中间节点额外端接会增加负载。\n- **偏置电阻**：让总线空闲时差值确定、不\"漂浮\"，取值按节点数计算（以收发器手册为准）；\n- **隔离**：按共模电位差、人员安全、浪涌和系统可靠性评估；若采用电气隔离，须同时设计跨隔离边界的信号、隔离侧供电和绝缘布局；非隔离方案仍要保证共模范围和回流路径；\n- **TVS 防护**：485 专用 TVS（如 SM712 类，钳位电压按 A/B 共模范围选），紧贴接线端子。\n\n**布局要点清单 + 布线规则表**：\n\n- [ ] 隔离区一次规划好：隔离器两侧的器件与地各自成区，隔离带下方全层挖空（与 11.5 变压器挖空同理）；\n- [ ] 终端电阻跨接 A/B，按总线拓扑放在需要端接的两端，不能把两线直接接地；\n- [ ] 顺序仍是\"先防护后芯片\"：端子 → TVS → 共模电感（可选）→ 收发器；\n- [ ] A/B 长距离并肩走、间距一致，下方参考层完整。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 走线形式 | A/B 并肩、同层、同长 | 不必控 100Ω 差分，但两线环境要一致 |\n| 对内等长 | ±10~20 mil 级即可 | 速率低，要求宽松 |\n| 防护 | 485 专用 TVS 紧贴端子 | 浪涌等级按现场选型 |\n| 隔离 | 按具体隔离等级、器件和标准规划 | 两侧供电、信号与绝缘距离须整体核对 |\n| GND | 是否共地按系统设计定 | 简单单板可共地，跨设备现场建议隔离 |\n\n#### CAN：汽车与工业的现场总线\n\n**协议简介**：CAN（Controller Area Network）是汽车发明、工业大量借用的多主总线：**CAN_H/CAN_L 一对差分线**，显性/隐性电平由两线差值表达；经典 CAN ≤1 Mbps（CAN FD 更高），距离随速率下降。它最强的是**协议层可靠性**：硬件仲裁（多主不冲突、优先级无损）、自动重发、CRC 校验、故障节点自动下线——这些由 CAN 控制器完成（很多 MCU 内置），硬件工程师管好物理层即可。\n\n**电路组成**：\n\n- **收发器**：TJA1050、SN65HVD230 类，MCU 的 CAN 控制器（TX/RX）↔ CAN_H/CAN_L；\n- **终端电阻 120Ω**：同样只加总线两端；端接要求应按具体 CAN 物理层、器件手册与实际波形确定，不能仅凭线长直接省略；\n- 依据车厂规范、EMC 测试和收发器指南选择 CAN TVS、共模电感等防护或滤波器件，不能一概假设必配。\n\n**RS485 与 CAN 对比**：\n\n| | RS485 | CAN |\n|:---|:---|:---|\n| 拓扑 | 一主多从轮询为主（协议层自定义） | 多主仲裁（协议层标准化） |\n| 仲裁 | 无，靠软件避让 | 硬件仲裁，优先级无损 |\n| 错误处理 | 应用层自理 | 自动重发、故障节点自动隔离 |\n| 电平 | A/B 差分 ±200 mV 判决阈值 | CAN_H/L 差分，显性/隐性两态 |\n| 典型场景 | 电表、门禁、工控传感网络 | 汽车 ECU、充电桩、工业现场设备 |\n\n**布局布线要点**：与 RS485 同款——终端电阻贴端子、TVS 在最外面、CAN_H/L 并肩走线。车规板额外注意：CAN_H/L 与其他网络的最小间距从严（经验值 ≥0.3 mm 起，按车厂规范执行），接口区加宽包地与敷铜隔离。\n\n#### 工业现场三防：防雷浪涌、隔离、滤波\n\n工业接口的可靠性三板斧，本质是**分级泄放 + 层层设卡**：\n\n1. **防雷/防浪涌（分级防护）**：第一级气体放电管（GDT，泄放雷击级大能量）→ 第二级 TVS（响应快、钳位准）→ 两级之间串 PTC/功率电阻限流解耦。能量大的先粗泄、剩下的精细钳——想靠一级独扛必炸；\n2. **隔离**：若系统需要隔离，按信号隔离、隔离侧供电、参考地、绝缘距离和浪涌回路做完整设计；隔离器本身不保证整机满足安全要求；\n3. **滤波**：共模电感 + 对地电容压共模干扰，A/B、CAN_H/L 各对地并 100 pF~1 nF 级（经验值，注意电容对速率的影响，以收发器手册为准）。\n\n三防的布局要点清单：\n\n- [ ] 根据设计区分并联泄放支路和串联限流/滤波元件，验证浪涌电流路径及器件配合；\n- [ ] 根据实际浪涌路径和合适的机壳/保护参考，缩短泄放回路；过孔数量和间距按设计及器件指南确定；\n- [ ] 隔离带下方全层挖空，隔离两侧器件分区摆放，不交叉、不混地；\n- [ ] 工业接口区整体远离晶振、天线与高速差分区（第 12 课的分区原则）。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|:---:|:---|:---|\n| 1 | 找 3 块开发板/成品板（手边实物或开源项目图），辨认 USB/HDMI/RJ45/TF/SIM 区域 | 每个区能说出防护器件顺序、差分对走向与一条布线特征，写成 300 字笔记 |\n| 2 | 画 USB 2.0 接口原理图（ESD 阵列 + 共模电感 + VBUS TVS），并完成布局布线 | D± 按 90Ω 差分、ESD 距接口 ≤5 mm、DRC 零报错 |\n| 3 | 按选定 PHY 与磁性器件手册画千兆 RJ45 原理图并布局 | 核对 4 对映射、参考设计的共模端接、隔离边界及阻抗要求 |\n| 4 | 等长专项：选定 USB 3.0 与 HDMI 器件并练习约束 | 标注各对的阻抗、偏斜预算和来源，保留布线及验证报告 |\n| 5 | 查一份 ESD 阵列 datasheet（如 USBLC6、TPD4E05 类型号） | 能指出结电容、钳位电压、通道数三个参数并说明选型理由 |\n| 6 | 汇总个人\"接口速查手册\"：7 类接口 ×（阻抗/等长/防护/布局 4 列） | 表格存档，第 12 课综合案例会直接复用 |\n\n## ✅ 自测清单\n\n- [ ] 能说明 USB 2.0 高速差分阻抗的常见目标，并依据器件指南确定偏斜预算；\n- [ ] 能画出 USB 3.0 的三对差分（D±/TX±/RX±）并说明交流耦合电容位置；\n- [ ] 能解释并联 ESD 器件为什么要靠近入口、缩短支路和泄放回路；\n- [ ] 能列出网络变压器三大作用（隔离/阻抗匹配/共模抑制）；\n- [ ] 能说出千兆网 4 对 MDI 差分 100Ω，以及 MDI/MDI 交叉是怎么回事；\n- [ ] 能依据磁性器件、PCB 和安全要求确定隔离边界与禁布范围；\n- [ ] 能说明 Bob Smith 是可选共模端接方案，器件与连接应按参考设计确认；\n- [ ] 能说出 HDMI TMDS 的信号组成，并按发送端/接收端指南检查通道与偏斜预算；\n- [ ] 能说出 SIM 卡 4 个信号（VCC/RST/CLK/DATA）与防护要点；\n- [ ] 能说出 TF 卡 4 线模式信号（CLK/CMD/DAT0~3）、上拉电阻与两种速率档的等长差异；\n- [ ] 能区分并联 ESD 支路和串联滤波器，并按具体接口选择连接与布局；\n- [ ] 能依据连接器图纸确定净空，并说出拔插应力加固方法。\n- [ ] 能解释何时在 RS485/CAN 总线两端使用匹配端接，并说明是否端接须结合拓扑、线缆与时序判断；\n- [ ] 能说明隔离信号、隔离侧供电与绝缘布局的关系，以及分级防护须按浪涌波形和器件配合设计。\n\n- [ ] 我能说出 VGA 的 R/G/B 模拟信号与行场同步的走线要点\n- [ ] 我知道 SATA 差分对的阻抗要求与布线注意事项\n- [ ] 我能说出 RS232/RS485/CAN 各自的电平特点、组网拓扑与终端电阻用法\n\n## ⚠️ 新手常见坑\n\n1. **ESD 并联支路太长或器件离入口太远**：寄生电感会削弱钳位效果。解法：靠近接口放置，缩短信号支路与到合适参考地的泄放路径，并参考器件布局指南。\n2. **高速差分线换层过多、跨参考层分割**：每次换层都是阻抗突变，跨分割更是把回流路径掐断，眼图和 EMC 双双恶化。解法：同层走完为主，必须换层时在换层点旁加回流地过孔。\n3. **忽略网口隔离边界**：隔离屏障附近的铜、过孔或连接可能破坏设计要求。解法：按磁性器件、PCB 及适用标准建立隔离与禁布规则，再核验整机。\n4. **HDMI 忽略时钟与数据关系**：TMDS 的传播延迟会影响采样窗口。应依据发送、接收器和通道指南检查对内及对间偏斜，并计入连接器与线缆。\n5. **给 USB 3.0 用了普通 ESD 管**：结电容几个 pF 在 5 Gbps 下等于一个低通滤波器。解法：按目标速率核对结电容、插入损耗、钳位、漏电与器件指南，不只看单一数字。\n6. **TF 卡座不加 ESD、不加上拉**：带电插拔烧卡座、枚举不稳定。解法：TVS 阵列 + 上拉电阻是 TF/SIM 这类插拔卡的标配，成本几毛钱，救的是主控。\n\n## 📚 延伸学习\n\n- **B 站搜索关键词**：「USB 差分走线 90欧」「HDMI TMDS 布线」「RJ45 网络变压器 PCB 设计」「Bob Smith 端接」「POE 电路设计」「ESD 防护 PCB 布局」\n- **数据手册阅读指引**：找一份 ESD 阵列手册（搜索 USBLC6-2SC6、TPD4E05U06 等常见型号），重点读电气参数表里的结电容与钳位电压；找一份内置变压器 RJ45 规格书（如 HR911105 类）与一份千兆 PHY 手册（如 RTL8211 类）的 Layout Guidelines 章节，对照本课 11.5 节逐条印证。\n- **规范阅读（进阶）**：搜索「USB 3.0 布线规范」「HDMI TMDS 阻抗 100 欧」「802.3 以太网 隔离 要求」，体会\"经验值背后都有规范出处\"。","taskSignature":"f54d2e3599e95d9ecae25c877b40be01e24bc93d6bd8d13ea0df53601780b3bf","taskCount":55},{"id":"12","title":"第 12 课 · 其他模块与综合案例","short":"其他模块与综合案例","stage":2,"diff":3,"prev":"第 05、10 课；时钟与复位先于第 14 课，涉及存储的章节结合第 18 课","optional":false,"md":"本课先学习单片机项目需要的时钟、复位和基础信号调理；射频、摄像头、音频及综合案例可在需要时深入。涉及存储的内容结合第 18 课学习。\n\n## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 说出 50Ω 阻抗、微带线（microstrip）的概念，掌握射频走线\"短、直、等宽、无直角\"的基本功与 π 型匹配网络的预留方法；\n2. 说明天线净空区（keep-out）的含义与尺寸概念，正确处理 WIFI/蓝牙模块的天线、馈线与晶振布局；\n3. 掌握 MIPI CSI 摄像头接口的差分 100Ω、按 lane（通道）分组等长规则；\n4. 完成音频模块布局：功放/耳机/麦克风走线，并说明模拟地/数字地分割与单点连接的两种流派；\n5. 正确设计晶振负载电容、复位电路，并对时钟、复位这两类敏感信号做包地与防护；\n6. 独立完成\"智能音箱主板\"的系统框图、布局分区规划与布线优先级规则表。\n\n## 📖 正文\n\n### 12.1 RF 射频电路\n\n#### 是什么：为什么全世界都说 50Ω\n\n许多射频（RF）系统使用 **50Ω 标称阻抗**；也有 75Ω 或其他阻抗系统，实际须以射频芯片、天线与连接器的规格为准。板内 RF 走线的任务就是**维持这 50Ω 不被打断**——每一处阻抗突变都会产生反射，反射就是损耗、驻波和辐射。\n\n**微带线（microstrip）**：表层走线 + 紧邻的内层完整地平面构成的传输线。特性阻抗由线宽 W、介质厚度 H、介电常数 εr、铜厚共同决定——用阻抗计算工具（Saturn PCB Toolkit、嘉立创阻抗计算器等）按自己板厂的叠层算，**不要抄别人板子的线宽**。内层走线夹在两个平面之间的叫带状线（stripline），本课只要求掌握微带线。\n\n#### 布局要点清单\n\n- [ ] RF 路径按\"芯片 → π 型匹配网络 → 天线/连接器\"一条直线摆，越短越好；\n- [ ] RF 器件的地焊盘**就近打接地过孔**（每个接地焊盘 1~2 个），顶层铺地与内层地紧密相连；\n- [ ] **π 型匹配网络预留**：在 RF 线两端预留三个焊盘（两端并联到地、中间串联），初始贴 0Ω + 空/小电容，调试时按网分实测换成 L/C：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"183.44pt\" width=\"266.984pt\" viewBox=\"-59.704 -47.8 266.984 183.44\"><path d=\"M 0.0,-0.0 L 36,-0 L 39,-9 L 45,9 L 51,-9 L 57,9 L 63,-9 L 69,9 L 72,-0 L 108,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-0.0 L 108,50.76 M 117,50.76 L 99,50.76 M 117,57.24 L 99,57.24 M 108,57.24 L 108,108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 107.99999999999999,108.0 L 108,122.4 L 99,122.4 L 117,122.4 M 101.7,126.72 L 114.3,126.72 M 106.2,131.04 L 109.8,131.04\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-0.0 L 111,-9 L 117,9 L 123,-9 L 129,9 L 135,-9 L 141,9 L 144,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-0.0 L 144,50.76 M 153,50.76 L 135,50.76 M 153,57.24 L 135,57.24 M 144,57.24 L 144,108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 143.99999999999997,108.0 L 144,122.4 L 135,122.4 L 153,122.4 M 137.7,126.72 L 150.3,126.72 M 142.2,131.04 L 145.8,131.04\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-0.0 L 158.4,-0 L 172.8,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 172.79999999999998,-0.0 L 172.8,-21.6 L 159.12,-43.2 L 186.48,-43.2 L 172.8,-21.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"54.0\" y=\"-26.6\" dominant-baseline=\"ideographic\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"54.0\" dy=\"14.0\">0Ω / 小电感<\/tspan><\/text><text x=\"120.6\" y=\"40.0\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"120.6\" dy=\"14.0\">C<\/tspan><\/text><text x=\"156.6\" y=\"40.0\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"156.6\" dy=\"14.0\">C<\/tspan><\/text><text x=\"190.07999999999998\" y=\"-35.599999999999994\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"190.07999999999998\" dy=\"14.0\">天线<\/tspan><\/text><circle cx=\"0\" cy=\"-0\" r=\"2.7\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"-6.3\" y=\"-14.0\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-6.3\" dy=\"14.0\">芯片 RF 引脚<\/tspan><\/text><circle cx=\"108\" cy=\"-0\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"144\" cy=\"-0\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n- [ ] 需要过认证或噪声敏感的场合，预留**屏蔽罩（shielding can）焊盘框**，沿框密集打**屏蔽地过孔（stitching vias）**（经验间距 ≤ λ/20 或按屏蔽罩规格，密比疏好）。\n\n#### 布线规则表\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 阻抗 | 50Ω 微带线 | 按叠层计算线宽，全程等宽 |\n| 路径 | 短、直，一次拐弯不超过 45° | **避免 90° 直角**（拐角寄生电容 + 辐射） |\n| 过孔 | 尽量 0 个 | RF 路径上过孔 = 串联电感 |\n| 线宽 | 全程一致 | 阻抗连续 |\n| 邻近 | 不与任何信号并行、下方参考层完整 | RF 线两侧多留间距（≥3W 起步） |\n| 屏蔽 | 屏蔽框 + 接地过孔阵 | 认证/EMI 用 |\n\n### 12.2 WIFI / 蓝牙模块\n\n#### 模块方案 vs 芯片方案\n\n| 维度 | 模块方案（推荐新手/量产中小批量） | 芯片方案（深度定制/超大批量） |\n|:---|:---|:---|\n| 组成 | 芯片 + RF 电路 + 天线或 IPEX 座，封装好 | 裸芯片 + 自建 RF 前端 + 自配天线 |\n| 认证 | 某些模块具有特定地区及条件下的认证；整机、天线和使用条件仍须核对 | 通常需要更多射频设计、测试和整机认证工作 |\n| 布线难度 | 只需处理天线净空与 SDIO/UART | 全套 12.1 节 RF 规则 + 天线调试 |\n| 成本 | 高 | 低（量大时） |\n\n学习和中小项目可优先比较成熟模块，但成本、天线、认证范围及整机测试仍要结合目标产品判断。本节以模块为例。\n\n#### 天线净空区（keep-out）——本节最重要的一条\n\n天线靠空间电磁场工作，**任何邻近的铜皮、走线、器件都会改变它的辐射方向图与驻波**。规则：\n\n- 按模块或天线手册规定的方向、范围和各层要求设净空；有些天线的下方与周围需要禁铜禁线，不能把一种净空形状套给所有型号；\n- 净空范围以模块手册为准（常见 ≥5 mm 量级，不同天线差异大），**宁大勿小**；\n- 按厂家推荐的板边、外壳和天线位置摆放；不是所有天线都适合伸出板外，实际还要考虑机械保护和射频性能；\n- 板内铺铜与天线的净空之间用一排地过孔把\"边界\"钉住。\n\n#### 馈线与晶振\n\n- **馈线（feed line）**：模块 ANT 引脚（或 IPEX 座）到天线的走线，**50Ω 微带线，短直、两侧包地过孔**；用 IPEX 外置天线时，馈线就是从模块到 IPEX 座那一段，同样规则；\n- **晶振位置**：芯片方案的 32 MHz/32.768 kHz 晶振**远离天线与馈线**（晶振及其谐波是 RF 接收灵敏度的头号杀手）；模块方案自带晶振，选型时确认模块布局说明；\n- 模块正下方保持**完整地平面**（模块靠它做镜像地），模块下方不走高速线；\n- SDIO/UART 等数字接口按常规数字规则，注意远离音频模拟区（WIFI 突发电流会串进喇叭，就是经典的\"滋滋\"底噪来源之一）。\n\n### 12.3 摄像头接口（CSI / MIPI）\n\n#### 协议简介\n\n主流摄像头走 MIPI CSI-2 协议、D-PHY 物理层：在常见 D-PHY 实现中使用若干对高速差分数据 lane 和一对时钟 lane；数据通道数、模式及速率依传感器、接收器和 D-PHY 版本而异，差分阻抗常以 100Ω 为设计目标并以芯片指南为准；除高速模式（HS，差分）外还有单端低功耗（LP）状态，但布线上按差分对处理即可。同轴线（coax）与 FFC/FPC 排线连接器（0.5 mm 间距常见）是两种典型物理接口，紧凑产品（运动相机类）用同轴，开发板常用 FFC。\n\n#### 布局要点清单 + 布线规则表\n\n- [ ] 摄像头连接器放**板边**，远离 DCDC 开关节点与 WIFI 天线区；\n- [ ] 每个 lane 整对并行走线，整组（含 CLK 对）一起走，不与其他高速线混扎；\n- [ ] 换层 ≤1 次/对，各组同步换层，参考层完整。\n\n| 规则项 | 经验值 | 说明 |\n|:---|:---|:---|\n| 差分阻抗 | 100Ω | D-PHY 高速模式 |\n| 对内偏斜 | 按传感器、SoC 和连接器的时序预算 | 应计入 PCB、排线与连接器差异 |\n| lane 间等长 | ±50~100 mil 内 | 接收端有弹性，但别放飞，以传感器手册为准 |\n| 总长 | 整组接近，计入 FFC 线长 | 排线也是走线的一部分 |\n| ESD | 可选低容阵列（<0.5 pF） | 连接器外接摄像头时考虑 |\n\n### 12.4 音频模块\n\n#### 电路组成\n\n- **CODEC（编解码器）**：I²S 数字音频接口进/出主控，I²C 配置寄存器，内部 DAC 出模拟、ADC 进模拟；也可用主控内置 CODEC 省一颗料；\n- **功放（PA）**：驱动喇叭。AB 类线性但效率低；**D 类**效率高但输出是 PWM 开关波形，喇叭线和输出走线是辐射源，输出侧常加磁珠 + LC 滤波压 EMI；\n- **耳机/喇叭输出**：耳机 L/R 每声道磁珠/电容滤波 + ESD；喇叭走线按**大电流差分**处理；\n- **麦克风（MIC）**：驻极体、模拟 MEMS 和数字 MEMS 的供电及接口各异；MICBIAS、滤波、输入接法依据具体麦克风与 CODEC 手册选择。\n\n#### 模拟地/数字地：分割单点连接 vs 统一地分区\n\n两种流派都要懂：\n\n- **完整地平面 + 功能分区**：先使模拟与数字电路及其回流路径合理分区，维持连续参考地；两层板也可以采用这一方法。\n- **按器件指南分区连接**：少数电路要求特定地连接或隔离，必须结合器件引脚、回流、电源和安全要求设计；单点连接并不自动消除噪声。\n- 新手应先分析回流，避免信号跨越地平面断缝。可参考 [TI 混合信号接地指南](https://www.ti.com/video/6245227303001)。\n\n#### 布局布线要点\n\n- [ ] 音频模拟区整体放**板角**，远离 DCDC、晶振、WIFI 天线、MIPI；\n- [ ] 喇叭/功放输出走线**粗（≥30 mil/1A 量级，按电流算）、短、差分紧耦合**，远离麦克风输入（功放输出耦合进 MIC = 啸叫）；\n- [ ] 耳机通道按阻抗、噪声、串扰、负载和接口保护要求布局；短板内走线通常不需为了避免增益差而机械等长；\n- [ ] MIC 走线**两侧包地 + 地过孔**，尽量短，用屏蔽线/同轴线引到远端麦克风；\n- [ ] 功放电源单独走（或磁珠隔离），大电容就近功放；D 类功放输出滤波元件紧贴输出脚。\n\n### 12.5 时钟电路（晶振）\n\n#### 负载电容怎么算\n\n无源晶体（crystal）靠两只负载电容与晶体共同决定振荡频率。晶体规格书给出负载电容 CL（常见 8~20 pF），板上取值：\n\n```\nC1 = C2 ≈ 2 ×（CL − Cstray）     对称电容近似；Cstray 为折算到晶体两端的等效寄生电容，需结合芯片、封装和布局估算\n例：CL = 12 pF → C1 = C2 ≈ 2 × (12 − 4) = 16 pF → 取 15/18 pF 标称值\n```\n\n#### 布局布线要点\n\n- 晶体与负载电容按芯片指南靠近振荡器引脚，缩短回路并避开干扰；接地、包围和参考层处理以晶体与芯片厂商推荐为准，不能额外引入过大寄生电容；\n- 晶振区域**远离干扰源**：DCDC 开关节点、USB/HDMI 差分、RF/天线、功放输出；HDMI/以太网的 25 MHz/晶振同理；\n- **有源振荡器（XO）**：内部包含振荡电路，其输出接口、电源去耦、负载及是否需要串阻依型号和接收端而定；不应照搬无源晶体的两只负载电容。\n- **时钟 buffer**：一路时钟分发多路负载时使用，每路输出按频率决定是否端接/等长（低速可裸走，百兆级需串阻）。\n\n### 12.6 复位电路\n\n#### 三种形态\n\n1. **RC 复位**：在特定复位极性和输入结构下，RC 可形成上电延时，但释放时刻受上电斜率、门限、初值和容差影响；不能保证电源已经稳定，需按手册验证掉电与复位脉宽；\n2. **复位芯片（supervisor/reset IC）**：精确电压阈值监控（如 3.3V ±5%），带手动复位（MR#）输入、看门狗可选——**现代设计首选**；\n3. **主控内部 POR**：部分芯片提供上电复位，是否还需外部复位电路、上拉或按键应查具体手册。\n\n**去抖（debounce）**：复位按键抖动可能引发多次复位；复位芯片是否对 MR 输入内置去抖要查手册。外部 RC 需验证门限、上升时间和复位脉宽；GPIO 软件去抖适用于普通按键，不应默认处理专用复位脚。\n\n#### 走线防护\n\n- 复位线**短**、两侧**包地**，远离时钟/差分/RF——复位线上耦合一个 2V 毛刺，整板随机重启且极难排查；\n- 是否接电容及其容值由复位源的驱动能力、复位输入和所需时序共同决定；不要固定加 0.1μF；\n- 复位要分发给多颗芯片时用星型拓扑，长距离分发加施密特触发器 buffer 或 RC 滤波。\n\n### 12.7 传感器电路与信号调理\n\n接下来认识：**传感器（Sensor）**——产品的\"五官\"。摄像头、麦克风本质也是传感器，本节讲的是更基础的一族：温度、光照、压力这类把物理量变成电信号的器件。它们输出的往往是\"不好读\"的信号（阻值变化、毫伏级小电压），必须经过**信号调理（Signal Conditioning）**才能喂给 MCU——这也是第 04 课运放真正的用武之地。\n\n#### 传感器分类速览\n\n| 传感器 | 测什么 | 原理一句话 | 典型应用 |\n|:---|:---|:---|:---|\n| NTC 热敏电阻 | 温度 | 负温度系数：升温阻值下降（10kΩ@25°C 常见） | 板温监测、电池温度保护 |\n| PT100 铂电阻 | 温度（精密） | 铂电阻随温度近似线性变化，0°C 时 100Ω | 工业测温、医疗设备 |\n| 光敏电阻 / 光电管 | 光照 | 光照越强阻值越低 / 光电流越大 | 感光灯、亮度自适应背光 |\n| 湿度传感器 | 湿度 | 湿敏电容介电常数随湿度变化（多集成 I²C 数字输出） | 温湿度计、新风与除湿设备 |\n| 压力传感器 | 压力 | 压阻/压电元件受力形变，输出毫伏级信号 | 气压计、血压计、工业压力检测 |\n| 霍尔传感器 | 磁场/位置 | 霍尔效应：磁场垂直作用产生电压 | 电机测速、翻盖检测、电流检测 |\n| 电流检测 | 电流 | 采样电阻压降 / 霍尔 / 互感器 | 电源监控、电机驱动、BMS |\n\n不同传感器可能输出阻值、电流、模拟电压或数字信号。是否需要分压、放大、滤波或电平转换，由信号类型和接收端要求决定。\n\n#### 信号调理三步法（通用方法论）\n\n针对电阻式或弱模拟信号，可按下列三类功能检查；次序和是否需要每一步因传感器而异，带数字接口或已调理输出的器件不必照搬：\n\n1. **第一步：偏置 / 分压**——把\"阻值变化\"变成\"电压变化\"。电阻型传感器（NTC、光敏）配一只固定电阻组成分压（第 02 课的分压在这里落地）：物理量变 → 阻值变 → 分压比变 → 节点电压变；\n2. **第二步：滤波**——RC 一阶低通（第 03 课的 τ = RC）滤掉高频噪声与干扰。截止频率 fc = 1/(2πRC)，例如 1 kΩ + 100 nF → fc ≈ 1.6 kHz（信号带宽以内、噪声以外即可）。若用于抗混叠，还须根据采样率、带外干扰和允许误差计算衰减；一阶 RC 只能逐渐衰减，不能假设高于奈奎斯特频率的信号被完全滤除；\n3. **第三步：放大 / 跟随**——把毫伏级信号放大到 ADC 量程，或用跟随器做阻抗隔离。\n\n第三步展开两个典型用法：\n\n- **同相放大**（一步不跳地算一遍）：增益 G = 1 + Rf/Rg。取 Rf = 9 kΩ、Rg = 1 kΩ → G = 1 + 9/1 = 10 倍；传感器输出 100 mV → 运放输出 = 100 mV × 10 = 1.0 V，正好落进 3.3V ADC 的舒适区；\n- **电压跟随器**（放大倍数 = 1）：不放大电压，只做\"接力棒\"——传感器分压节点内阻高（几十 kΩ 级），直接接 ADC 会因负载效应拉低读数；合适的跟随器可以降低有效源阻抗，但仍要核对运放稳定性、输出摆幅、负载与 ADC 采样建立时间（第 04 课\"扩音机\"的另一种用法）；\n- **比较器用法**：不需要\"读数\"、只要\"到没到阈值\"时（光控开关、过温保护），用比较器把连续信号变成 0/1 开关信号，MCU 一个 GPIO 就够。\n\n#### 完整实例：NTC 测温度，从热到读数\n\n仿真中下臂的 10kΩ 固定电阻代表 NTC 在 25°C 的阻值；更改其阻值可观察节点电压，但模型没有自动计算温度。\n\n```circuitjs\nntc-divider\n```\n\nNTC 在下臂，100nF 从 ADC 节点并联到地；阻值随温度变化。\n\n```svg\n<svg role=\"img\" aria-label=\"NTC测温分压，ADC节点并联滤波电容\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"197.13999999999996pt\" width=\"214.87399999999994pt\" viewBox=\"-49.56999999999999 -205.49999999999994 214.87399999999994 197.13999999999996\"><path d=\"M 0.0,-180.0 L 0,-162 L 9,-162 L 9,-126 L -9,-126 L -9,-162 L 0,-162 M 0,-126 L 0,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-108.0 L 63,-108 L 126,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-108.0 L 0,-90 L 9,-90 L 9,-54 L -9,-54 L -9,-90 L 0,-90 M 0,-54 L 0,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-36.0 L 0,-21.6 L -9,-21.6 L 9,-21.6 M -6.3,-17.28 L 6.3,-17.28 M -1.8,-12.96 L 1.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-108.0 L 72,-75.24 M 81,-75.24 L 63,-75.24 M 81,-68.76 L 63,-68.76 M 72,-68.76 L 72,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-36.0 L 72,-21.6 L 63,-21.6 L 81,-21.6 M 65.7,-17.28 L 78.3,-17.28 M 70.2,-12.96 L 73.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"3.6\" y=\"-207.39999999999998\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"3.6\" dy=\"13\">3.3V<\/tspan><\/text><text x=\"-12.599999999999998\" y=\"-157.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-12.599999999999998\" dy=\"13\">10kΩ<\/tspan><\/text><text x=\"147.6\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"147.6\" dy=\"13\">ADC<\/tspan><\/text><text x=\"-12.599999999999998\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-12.599999999999998\" dy=\"13\">NTC<\/tspan><\/text><text x=\"59.400000000000006\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"59.400000000000006\" dy=\"13\">100nF<\/tspan><\/text><circle cx=\"0\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n把适用的信号调理环节串起来：**NTC 分压 → 节点电容滤波 → MCU ADC**；本例没有另加运放。\n\n电路：3.3V — 10 kΩ 固定电阻 — 节点 A（进 ADC，节点对地并 100 nF 滤波）— NTC — GND。25°C、NTC=10kΩ 且忽略源和 ADC 负载时，电容看到的等效电阻约 10kΩ∥10kΩ=5kΩ，理想截止频率约 318Hz；NTC 阻值变化会改变该频率。\n\n以 25°C 为例走一遍换算（一步不跳）：\n\n1. **物理量 → 阻值**：查 NTC 规格表（R-T 表），25°C 时阻值 = 10 kΩ；\n2. **阻值 → 电压**（分压，NTC 在下臂）：V_A = 3.3 × 10/(10+10) = **1.65V**；\n3. **电压 → ADC 码值**：MCU 12 位 ADC、参考电压 VREF = 3.3V：理想量化码约为 1.65/3.3 × 4096 = **2048**；实际码值、边界和校准方式依 ADC 手册；\n4. **读数 → 反推温度**（MCU 里干的活）：由 V_A 反解 NTC 阻值 R_ntc = 10k × V_A/(3.3 − V_A) = 10k × 1.65/1.65 = 10 kΩ，查 R-T 表得 25°C。\n\n体会两点：ADC 的换算基准是 **VREF**。若分压电源与 ADC 参考电压来自同一电源且满足比例测量条件，部分供电波动可能抵消；不同参考、误差和噪声仍需分别分析。NTC 的 R-T 关系是非线性的，产品里常用查表或公式拟合。\n\n#### 传感器输入的保护电路\n\n信号调理除了\"处理\"，还要\"保护\"——传感器引线越长、环境越恶劣（工业现场、外接探头），越需要三件套：\n\n- **钳位二极管**：可按设计在信号节点配置到电源和地的钳位路径；压降随电流、温度变化，电流可能向电源轨反灌。必须核验注入电流、掉电状态、电源吸收能力和器件耐压，不能保证所有浪涌下 ADC 不受损；\n- **串联限流电阻**：钳位动作时电流骤增，串几百 Ω~几 kΩ 限制它，二极管才不会先烧；\n- **RC 滤波**：节点电容与电阻可减弱部分干扰，但不能默认吸收任意静电或浪涌能量；对外接口按目标脉冲、器件额定和系统标准设计专用防护。\n\n#### 嵌入式控制体系一览：主控选型的世界观\n\n传感器调理好了，读它的\"大脑\"是谁？本课程项目课会轮番登场的主控，其实分五个流派——记住这张表，选型世界观就有了：\n\n| 芯片类型 | 全称 | 擅长什么 | 代表型号 | 在板子上的角色 |\n|:---|:---|:---|:---|:---|\n| MCU | 微控制器（单片机） | 低功耗实时控制、IO 丰富、裸机或 RTOS | **STM32**、51、ESP32 | 第 14 课 2 层板主控：读传感器、控外设 |\n| CPU / SoC | 中央处理器 / 片上系统 | 跑 Linux/Android 等操作系统与多任务应用 | 全志 **H3**、瑞芯微 **RK3576/RK3588** | 第 20～22 课机顶盒/AI 主板/工控板主控 |\n| DSP | 数字信号处理器 | 高速乘加运算：音频编码、电机 FOC 算法 | TI C2000、TMS320 系列 | 电机控制板、音频处理板的算法核心 |\n| CPLD | 复杂可编程逻辑器件 | 小规模胶水逻辑：地址译码、上电时序、信号粘合 | EPM240、XC9500 系列 | 大板上的\"逻辑补丁\"，弥补主控接口不足 |\n| FPGA | 现场可编程门阵列 | 大规模并行逻辑、高速采集与协议处理 | Artix-7、Cyclone 系列 | 高速数据采集、视频处理、芯片原型验证 |\n\n选型的直觉：任务越\"实时、简单、低功耗\"越靠近 MCU；越\"多任务、上系统\"越靠近 SoC；越\"并行、硬实时、算法密集\"越靠近 DSP/FPGA。真实产品常常是\"SoC + MCU\"或\"CPU + FPGA\"的组合——大脑分工，各干各的。\n\n### 12.8 转换电路：ADC 与 DAC——模拟与数字的翻译官\n\n传感器调理链的终点是 ADC，音频/控制的起点常是 DAC——这一节把 12.7 的\"读进芯片\"补完整，再讲\"怎么从芯片输出来\"。\n\n#### ADC：模拟 → 数字的三步\n\n模数转换（ADC）永远是三步曲：**采样 → 量化 → 编码**。采样按固定时间间隔\"拍照\"（采样率，单位 SPS）；量化把每张照片的电压归到最近的刻度（分辨率）；编码把刻度号写成二进制数。\n\n| 参数 | 含义 | 经验直觉 |\n|:---|:---|:---|\n| 分辨率 | 刻度的数量，N 位 = 2^N 格 | 12 位 = 4096 格；每格 = VREF ÷ 4096（3.3V 时约 0.8mV） |\n| 采样率 | 每秒拍多少张 | 至少是信号最高频率的 2 倍以上（奈奎斯特），工程留 5~10 倍 |\n| 基准源 VREF | 刻度尺的\"1 米\"有多长 | VREF 变化会影响量化比例，实际误差及方向要结合信号源、参考配置与换算方法评估——精密场合用专用基准芯片 |\n| 输入阻抗/源阻抗 | 信号源\"推得动\"吗 | SAR 型 ADC 常要求源阻抗 ≤10kΩ 量级（以手册为准），太高读数不准（偏向上一采样通道的值） |\n\n12.7 的 NTC 算例正是完整闭环：分压得 1.65V → 12 位 ADC 量化 = 1.65 ÷ 3.3 × 4096 = **2048**。可在理想未饱和条件下用 V≈码值 ÷ 4096 × 3.3V 近似还原；12 位输出码范围是 0～4095，量化、满量程边界及实际换算以器件手册为准。\n\n#### 多路、差分与\"过采样\"\n\n一颗 ADC 内部常带**多路开关**（MUX）轮流接多个通道——引脚复用 ADC1_IN1~IN16 就是这个意思；**差分输入**测两点电压差（电流采样电阻两端的标准接法）；在噪声充分随机、样本满足统计假设且信号在平均窗口内近似不变时，**过采样+平均**16 次可使随机噪声标准差约降为 1/4，理想上相当于约 2 位改善；不能消除参考误差、失调、非线性，也不保证任意 ADC 都提高 2 位有效分辨率。\n\n#### DAC：数字 → 模拟\n\n数模转换（DAC）把数字变回电压/电流：**R-2R 梯形网络**是教科书结构（每位开关决定电流流向，运放求和）；音频 CODEC 里就是 DAC+ADC 的组合。板子上更常见的\"穷人版 DAC\"是 **PWM + RC 滤波**（第 03 课的占空比思想）：理想 0～VCC PWM 的平均值随占空比变化；RC 滤波后仍有纹波和负载效应，需按频率、阻抗与响应时间设计。风扇或背光也常直接由 PWM 驱动，不一定先转换成模拟电压。\n\n#### 这在板子上\n\n- 传感器读数精度 = 分压精度 + 基准稳定度 + ADC 分辨率，三者取短板——堆 16 位 ADC 救不了漂移的 VREF；\n- 电流采样（第 15 课故障排查、第 16 课功耗测试）的标准链路：采样电阻 → 差分 ADC → 码值换算电流；\n- 音频播放链：数字音频 → CODEC 内 DAC → 功放 → 喇叭（第 12.4 节的下半程）。\n\n### 12.9 综合案例：智能音箱类主板\n\n模块综合演练（学习第 18 课后完成）。板卡构成：**主控 SoC + 电源（PMU/DCDC）+ DDR3 + eMMC + WIFI/BT 模块 + 音频 CODEC 与功放 + USB 接口 + 摄像头接口（CSI）**。这不是让你现在就画完它——可结合第 14 课及后续项目练习——本课只完成三张\"图纸\"：**系统框图、布局规划图、布线规则表**。\n\n#### ① 系统框图\n\n先画出模块级连接关系（信号流向 + 电源流向）：\n\n```mermaid\nflowchart TD\n    VIN[\"DC 12V 输入\"] --> PMU[\"PMU / DCDC\"]\n    PMU --> RAIL[\"3.3V / 1.5V·DDR / 1.1V·核 / 1.8V\"]\n    RAIL --- SOC[\"主控 SoC\"]\n    USB[\"USB 口\"] <-->|\"USB2.0\"| SOC\n    WIFI[\"WIFI/BT 模块\"] <-->|\"SDIO\"| SOC\n    WIFI --> ANT[\"天线（板边净空）\"]\n    CAM[\"摄像头 FFC\"] <-->|\"MIPI\"| SOC\n    CODEC[\"音频 CODEC\"] <-->|\"I2S\"| SOC\n    CODEC --> AMP[\"D 类功放\"] --> SPK[\"喇叭\"]\n    MIC[\"MIC（差分，包地）\"] --> CODEC\n    MEM[\"DDR3 / eMMC\"] <--> SOC\n    CLK[\"复位芯片 / 24MHz / 32.768K 晶振\"] --- SOC\n```\n\n画框图时自查三件事：每路电源给谁、每条高速总线两端是谁、天线与音频这两个\"敏感区\"分别在哪。\n\n#### ② 布局规划（分区 → 流向 → 数模分离）\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 575 315\" width=\"575\" height=\"315\" role=\"img\"><rect class=\"fp-board\" x=\"6\" y=\"6\" width=\"560\" height=\"300\" rx=\"8\"/><rect class=\"fp-rf\" x=\"20\" y=\"18\" width=\"120\" height=\"44\" rx=\"5\"/><text x=\"80.0\" y=\"37.0\" text-anchor=\"middle\" font-size=\"11\">WIFI/BT 模块<\/text><text x=\"80.0\" y=\"51.0\" text-anchor=\"middle\" font-size=\"11\">（板边）<\/text><text x=\"160\" y=\"40\" text-anchor=\"start\" font-size=\"10\" class=\"fp-note\">天线伸出板外（全层净空 ≥5mm）<\/text><rect class=\"fp-part\" x=\"20\" y=\"76\" width=\"110\" height=\"40\" rx=\"5\"/><text x=\"75.0\" y=\"100.0\" text-anchor=\"middle\" font-size=\"11\">USB 口（板边）<\/text><rect class=\"fp-core\" x=\"150\" y=\"76\" width=\"130\" height=\"64\" rx=\"5\"/><text x=\"215.0\" y=\"112.0\" text-anchor=\"middle\" font-size=\"11\">主控 SoC<\/text><rect class=\"fp-part\" x=\"296\" y=\"76\" width=\"70\" height=\"64\" rx=\"5\"/><text x=\"331.0\" y=\"112.0\" text-anchor=\"middle\" font-size=\"11\">DDR3<\/text><rect class=\"fp-part\" x=\"378\" y=\"76\" width=\"70\" height=\"64\" rx=\"5\"/><text x=\"413.0\" y=\"105.0\" text-anchor=\"middle\" font-size=\"11\">eMMC<\/text><text x=\"413.0\" y=\"119.0\" text-anchor=\"middle\" font-size=\"11\">（贴主控）<\/text><rect class=\"fp-part\" x=\"20\" y=\"150\" width=\"110\" height=\"60\" rx=\"5\"/><text x=\"75.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"11\">电源区<\/text><text x=\"75.0\" y=\"191.0\" text-anchor=\"middle\" font-size=\"11\">DCDC/PMU（板角）<\/text><text x=\"140\" y=\"182\" text-anchor=\"start\" font-size=\"9\" class=\"fp-note\">（远离音频）<\/text><rect class=\"fp-part\" x=\"150\" y=\"156\" width=\"130\" height=\"30\" rx=\"5\"/><text x=\"215.0\" y=\"175.0\" text-anchor=\"middle\" font-size=\"11\">摄像头 FFC（板边）<\/text><rect class=\"fp-part\" x=\"20\" y=\"226\" width=\"190\" height=\"62\" rx=\"5\"/><text x=\"115.0\" y=\"254.5\" text-anchor=\"middle\" font-size=\"10\">音频模拟区（板角）<\/text><text x=\"115.0\" y=\"267.5\" text-anchor=\"middle\" font-size=\"10\">CODEC/功放 · MIC 包地 · 喇叭粗差分<\/text><rect class=\"fp-part\" x=\"230\" y=\"226\" width=\"90\" height=\"62\" rx=\"5\"/><text x=\"275.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"11\">复位芯片<\/text><text x=\"275.0\" y=\"268.0\" text-anchor=\"middle\" font-size=\"11\">晶振<\/text><text x=\"470\" y=\"288\" text-anchor=\"end\" font-size=\"9\" class=\"fp-note\">板边<\/text><\/svg>\n```\n\n三条规划原则逐条对照：\n\n- **按模块分区**：DDR3/eMMC 紧贴主控（第 18 课），电源集中一个板角，音频独占另一个板角，接口一律靠板边（第 11 课）；\n- **顺信号流向**：电源入口 → PMU → 主控；USB/CSI 从板边进来直达主控，不横穿全板；\n- **数模分离**：音频模拟区与 WIFI 天线、DCDC 开关区、晶振互为\"敌人\"，两两远离；功放与天线分居对角（功放射频噪声与 WIFI 接收互相伤害）。\n\n#### ③ 布线优先级与规则表\n\n规则表模板（完成后这张表就是你的布线\"作战地图\"）：\n\n| 优先级 | 信号组 | 阻抗 | 等长/间距 | 参考层 | 备注 |\n|:---:|:---|:---|:---|:---|:---|\n| 1 | DDR3 数据组（DQ/DQS 按字节组） | 单端 50Ω / DQS 100Ω | DQ-DQS ±25 mil 内、DQS 对内 ±5 mil（以 SoC 手册为准） | 完整 GND | 最优先、最先布 |\n| 2 | DDR3 地址/命令/控制 | 单端 50Ω | 点到点可放宽；Fly-by 按补偿表 | 完整 GND | VREF 包地 |\n| 3 | MIPI CSI（CLK + lanes） | 差分 100Ω | 对内 ±5 mil，lane 间 ±100 mil 内 | 完整 GND | 整组同层 |\n| 4 | USB 2.0 差分 | 差分 90Ω | 对内 ±5 mil | 完整 GND | ESD 紧贴接口 |\n| 5 | SDIO（WIFI 模块） | 50Ω | 常规等长（±100 mil 级） | 完整 GND | 远离音频模拟区 |\n| 6 | 电源大电流（12V 入口/功放电源） | 按载流 | 压降计算线宽 | — | 粗短，先铺主干 |\n| 7 | 音频模拟（喇叭/耳机/MIC） | 不控 | 3W 间距、包地 | — | 差分紧耦合 |\n| 8 | I2C/UART/GPIO/其他 | 常规 | 常规 | — | 最后收尾 |\n\n排优先级的心法：**越严的越先布（等长硬的 > 阻抗硬的 > 大电流的 > 常规数字的）**，把最难的信号在最空旷的板面上解决，剩下的自然水到渠成。\n\n> 完成这三张图后，对照实际器件资料检查约束，并在项目中继续练习读图与规划。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|:---:|:---|:---|\n| 1 | 选定板厂四层叠层，估算 50Ω 微带线宽 | 记录 L1 到参考层的介质厚度、介电常数、铜厚、阻焊及计算依据，再与板厂确认 |\n| 2 | 找一个 WIFI 模块手册，画出天线净空区要求图 | 标注净空尺寸、天线位置、馈线路径三要素 |\n| 3 | 画\"主控 + MIPI 摄像头 FFC\"扇出布局 | 指定 SoC 和连接器，按其设计指南记录阻抗、时序及布局依据 |\n| 4 | 画\"CODEC + D 类功放 + 喇叭 + MIC\"原理图与布局草图 | 依据具体芯片手册规划参考地、功能分区和回流路径，并标注依据 |\n| 5 | 晶振专项：CL=10 pF 晶体选负载电容，画包地布局 | 电容计算正确、包地过孔画全、远离干扰源清单列出 |\n| 6 | **综合案例三张图**：智能音箱主板系统框图、布局分区图、布线规则表 | 框图含全部 8 类模块与电源流向；分区图体现信号流向与数模分离；规则表覆盖 8 个优先级且数值标注出处（以手册为准） |\n\n## ✅ 自测清单\n\n- [ ] 能说出 50Ω 是什么、微带线阻抗由哪些参数决定（线宽/介质厚/介电常数）；\n- [ ] 能解释 RF 走线为什么要\"短、直、等宽、无直角、少过孔\"；\n- [ ] 能画出 π 型匹配网络的焊盘预留形式并说明用途；\n- [ ] 能根据模块或天线手册指出净空范围、各层要求与安装方向；\n- [ ] 能说出 WIFI 馈线按 50Ω、晶振要远离天线的原因；\n- [ ] 能说明 MIPI D-PHY 的常见阻抗目标，并按器件指南核对 lane 的偏斜预算；\n- [ ] 能解释 AGND/DGND\"分割单点连接\"与\"统一地+分区\"两种流派各自的适用场景；\n- [ ] 能说出功放输出与 MIC 走线的处理差异（大电流粗差分 vs 包地短走线）；\n- [ ] 能用 CL 公式算负载电容（含杂散电容 3~5 pF 估计）；\n- [ ] 能按芯片手册说明晶体走线、回流与干扰控制，并区分有源振荡器和晶体；\n- [ ] 能说出复位电路三种形态与复位线毛刺的排查思路；\n- [ ] 能独立排出 8 个信号组的布线优先级并说明排序逻辑（越严越先布）。\n- [ ] 能说明分压/偏置、滤波、放大/跟随的作用及何时不需要，并解释抗混叠滤波的目标；\n- [ ] 能走完 NTC 阻值、分压与 ADC 码值的示例，并说明钳位、限流和滤波必须按输入与瞬态条件设计。\n\n- [ ] 我能说出 ADC 三步曲（采样/量化/编码）与分辨率、采样率、基准源各自的含义\n- [ ] 我知道 PWM+RC 为什么能当\"穷人版 DAC\"，以及它的典型应用场景\n\n## ⚠️ 新手常见坑\n\n1. **天线下面铺了地/走了线**：信号\"能用但很差\"，吞吐量腰斩、距离缩水，还查不出错。解法：布局第一件事先锁定天线净空区并在 EDA 里画 keep-out 禁止区。\n2. **RF 线抄别人板子的线宽**：叠层不同，50Ω 宽度完全不同。解法：每块新板用自己的叠层参数现算。\n3. **功放输出线细长且贴着 MIC 走**：底噪大、通电啸叫。解法：喇叭输出按电源线对待（粗短差分），MIC 包地并远离功放，必要时换板角。\n4. **地平面分割后不检查回流**：跨缝信号可能迫使回流绕行。两层与多层板都应先比较连续地平面和功能分区；特定隔离或分区要求按器件及系统设计验证。\n5. **晶振负载电容随手贴 22 pF**：频偏超标，USB/以太网枚举不稳定甚至失败。解法：按 CL 公式计算，别用\"祖传值\"。\n6. **复位网络穿越干扰区**：可能导致误复位。应缩短路径、核对参考地与时序；是否增加电容、缓冲或复位监控器以器件手册和测试为准。\n\n## 📚 延伸学习\n\n- **B 站搜索关键词**：「微带线 阻抗计算」「天线净空区 PCB」「π 型匹配网络」「MIPI CSI 布线」「D 类功放 EMI」「模拟地 数字地 单点连接」「晶振 负载电容 计算」\n- **手册阅读指引**：找一份常见 WIFI 模块（如 ESP32 系列、或任意带 PCB 天线的模组）手册的\"天线布局\"章节，对照 12.2 逐条印证；找一颗 MIPI 传感器（如 OV 系列任意型号）手册的时序与布线章节；音频部分可搜「I2S」「D 类功放 datasheet」读输出滤波推荐电路。\n- **模块学习后的自查**：把第 10、11、12、18 课相关内容整理成一份《模块速查手册》——第 14 课起的四个项目实战会反复用到它。","taskSignature":"e401e108c9d0966b8e392f02c80b0ff9beba8d59ec486462f6b6f3e9daa1d7c2","taskCount":28},{"id":"13","title":"第 13 课 · 单片机基础与 STM32 入门","short":"单片机基础与 STM32 入门","stage":3,"diff":3,"prev":"第 04～06、10～12 课；会阅读简单电路图和基本 C 语法","optional":false,"md":"## 🎯 本课目标\n\n1. 说明单片机的处理器、存储器、时钟、复位、GPIO 和外设如何协作。\n2. 读懂 GPIO 输出、按键输入、串口、定时器与中断的基本工作过程。\n3. 理解源码、编译、链接、下载和运行之间的关系，区分“编译通过”和“硬件验证通过”。\n4. 能按实际原理图检查电源、调试接口、LED 和串口连线，并制定逐步调试计划。\n5. 知道不同 MCU 的寄存器、引脚、工具链与下载方法不通用。\n\n## 📖 正文\n\n### 13.1 单片机是什么\n\nMCU（微控制器）把处理器、存储器和多种外设集成在一颗芯片中。以一个低速控制系统为例：电源提供稳定电压；复位将系统带入确定状态；时钟提供工作节拍；程序从存储器执行，通过 GPIO、串口和定时器读取输入并控制输出。\n\n| 部件 | 作用 | 排查时要看什么 |\n|---|---|---|\n| CPU | 执行指令 | 是否从正确启动地址运行、是否进入异常 |\n| Flash / SRAM | 保存程序及运行数据 | 型号容量、链接地址、栈、数据初始化 |\n| 电源 / 去耦 | 为器件供电并支持瞬态电流 | 电压范围、全部供电脚、去耦和回流 |\n| 时钟 | 为内核与外设提供节拍 | 实际时钟源、分频、稳定与精度 |\n| 复位 / 启动 | 建立初始状态与选择启动源 | NRST、BOOT 配置、供电上升条件 |\n| GPIO | 读取或输出电平 | 模式、方向、上下拉、驱动能力、复用冲突 |\n| 外设 | 完成通信、计时、采样等 | 外设时钟、引脚配置、数据格式和状态 |\n\n本课以 STM32F103C8T6 配套教学草稿为例；型号和管脚应以 [STM32F103 数据手册](https://www.st.com/resource/en/datasheet/stm32f103c8.pdf) 与 [RM0008 参考手册](https://www.st.com/resource/en/reference_manual/rm0008-stm32f103xx-advanced-armbased-32bit-mcus-stmicroelectronics.pdf)为准。芯片最高主频不代表程序默认运行在该频率：配套示例使用标称 8MHz 的内部 HSI，不使用外部晶体。\n\n### 13.2 从代码到芯片运行\n\n`源码 → 编译 → 目标文件 → 链接 → ELF / BIN → 下载 → 复位与运行`。\n\n- **编译**把源代码变成目标代码；语言、编译器和头文件要匹配目标平台。\n- **链接**根据存储器布局放置代码与数据，决定入口、栈等；不同容量型号不能随意套用链接脚本。\n- **下载**通过所用调试器或启动方式写入目标芯片；核对工具、接口、启动设置和实际型号。\n- **运行**还依赖供电、复位、时钟、正确硬件和程序状态。构建成功不等于下载成功，更不等于板子经过验证。\n\n课程的 STM32 示例固件（LED 与串口）已完成编译、链接与镜像结构检查，但**尚未在配套教学板实测**。该程序没有可写全局/静态数据的启动初始化，增加此类变量前必须完善启动代码和链接验证；不要直接在其基础上加入中断状态变量并假定可用。\n\n初学者需要了解 C 变量、条件、循环、函数、位运算与指针。硬件寄存器访问常用 `volatile`，它提示编译器访问可能产生外部效果，但不自动保证多步骤操作的原子性，也不替代中断同步。先理解已有示例，再尝试修改。\n\n### 13.3 GPIO 输出：让 LED 亮起来\n\n仿真用开关代替 PC13 的灌电流通路：闭合相当于输出低电平，断开仅近似表示不灌电流，并不运行 MCU 程序。\n\n```circuitjs\ngpio-led-low\n```\n\n此图只摘出配套原理图草稿的 LED 支路；实际电流和引脚驱动能力仍需选料核验。\n\n```svg\n<svg role=\"img\" aria-label=\"STM32教学板LED从3.3伏经R6和LED连接到PC13\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"90.30999999999997pt\" width=\"260.32399999999996pt\" viewBox=\"-34.378 -176.40999999999997 260.32399999999996 90.30999999999997\"><polygon points=\"101.7,-145.8 114.3,-136.8 101.7,-127.8 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-136.79999999999998 L 18,-136.8 L 18,-145.8 L 54,-145.8 L 54,-127.8 L 18,-127.8 L 18,-136.8 M 54,-136.8 L 72,-136.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-136.79999999999998 L 101.7,-136.8 M 114.3,-145.8 L 114.3,-127.8 M 114.3,-136.8 L 144,-136.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 110.7,-150.29999999999998 L 116.128,-159.799\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 118.708 -164.314 L 118.628 -158.37 L 113.627 -161.228 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 102.60000000000001,-150.29999999999998 L 108.028,-159.799\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 110.608 -164.314 L 110.528 -158.37 L 105.527 -161.228 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 144.0,-136.79999999999998 L 162,-136.8 L 180,-136.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-18.0\" y=\"-153.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-18.0\" dy=\"13\">3V3<\/tspan><\/text><text x=\"36.0\" y=\"-162.39999999999998\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"36.0\" dy=\"13\">R6 4.7kΩ<\/tspan><\/text><text x=\"108.0\" y=\"-137.2\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"108.0\" dy=\"13\">D1 LED<\/tspan><\/text><text x=\"205.2\" y=\"-153.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"205.2\" dy=\"13\">PC13<\/tspan><\/text><text x=\"111.60000000000001\" y=\"-110.2\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"111.60000000000001\" dy=\"13\">PC13 输出低电平时灌电流<\/tspan><\/text><\/svg>\n```\n\n\n先看电路再写程序。配套草稿中 LED 的路径为 `3V3 → R6 → LED → PC13`，PC13 拉低时预期点亮、拉高时预期熄灭。真实开发板的接线与极性可能不同，不能只凭位号猜。限流阻值、LED 参数和 PC13 的驱动限制必须按实际器件核对。\n\n一般过程是：使能相关 GPIO 时钟 → 在配置输出前设定安全初始电平 → 配置输出模式 → 按电路极性改变引脚 → 观察并测量。F103 的具体寄存器、引脚和复用方法查 RM0008；不要把其他 STM32 系列或 STC 的寄存器名称直接拿来使用。\n\n**预期与验证**：配套程序使用轮询计时，预期 LED 约每 500ms 翻转。HSI 有误差，程序也受运行时间影响，这不是精密计时；需要实际测量。编译通过时只记录编译结果，不填写“点亮成功”。\n\n### 13.4 按键输入：从电平到事件\n\n仿真中切换按键，观察输入节点；未模拟机械抖动，也不运行 MCU 程序。\n\n```circuitjs\ngpio-button\n```\n\n此图只摘出配套原理图草稿的 PA0 按键支路。\n\n```svg\n<svg role=\"img\" aria-label=\"按键连接3.3伏与PA0，下拉电阻接地\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"137.03999999999996pt\" width=\"245.91199999999995pt\" viewBox=\"-23.577999999999996 -181.39999999999998 245.91199999999995 137.03999999999996\"><path d=\"M 0.0,-144.0 L 18,-144 M 26.64,-147.6 L 46.8,-160.2 M 54,-144 L 72,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-144.0 L 108,-144 L 144,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-144.0 L 72,-126 L 81,-126 L 81,-90 L 63,-90 L 63,-126 L 72,-126 M 72,-90 L 72,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-72.0 L 72,-57.6 L 63,-57.6 L 81,-57.6 M 65.7,-53.28 L 78.3,-53.28 M 70.2,-48.96 L 73.8,-48.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-7.199999999999999\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-7.199999999999999\" dy=\"13\">3V3<\/tspan><\/text><circle cx=\"22.32\" cy=\"-144\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"49.68\" cy=\"-144\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"36.0\" y=\"-176.79999999999998\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"36.0\" dy=\"13\">按键<\/tspan><\/text><text x=\"198.0\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"198.0\" dy=\"13\">PA0 输入<\/tspan><\/text><text x=\"59.400000000000006\" y=\"-121.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"59.400000000000006\" dy=\"13\">R5 10kΩ<\/tspan><\/text><circle cx=\"72\" cy=\"-144\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n按键输入必须有稳定的默认电平。配套草稿的 PA0 由下拉电阻保持低电平，按键按下连接 3V3，预期按下为高。实际板可能采用相反极性，应以原理图为准。上拉/下拉可以由外部电阻或器件内部结构提供，是否可用、阻值及掉电状态都需查手册。\n\n机械按键可能在一次动作中产生多次跳变。软件可周期采样：读到新电平后，只有持续稳定一段设定时间才接受变化，再把稳定的“松开→按下”转换为一次事件。延时时间应按器件和实测调整，不把某个数值当普适标准。学习者可先写状态图与伪代码；原有 LED 与串口回显固件尚未实现按键功能；独立的按键、定时器与中断练习见项目目录中的 `按键定时器中断示例/`。\n\n### 13.5 UART 串口：两端约定一致\n\nUART 发送端 TX 接另一端 RX，接收端 RX 接另一端 TX，并建立适当的公共参考地；核对双方电平、引脚复用和掉电反灌。**USB 转串口的逻辑电平不等于 RS-232 电平**，不能直接混接。\n\n本例使用 USART1：PA9 为 TX，接 CH340N 的 RX；PA10 为 RX，接 CH340N 的 TX。终端参数为 115200、8 数据位、无校验、1 停止位。HSI 精度、分频误差和对端误差都会影响通信；现有示例采用轮询且无接收缓冲，持续高速输入可能丢字节。\n\n排查顺序：检查供电与共地 → 确认实际引脚和 TX/RX 交叉 → 核对波特率及帧格式 → 检查时钟与程序配置 → 必要时观察波形。板上同时连接外部设备和板载串口芯片时，要避免多个输出端争用。\n\n### 13.6 定时器与中断：让事件按规则发生\n\n定时器以所选时钟计数，可用于周期事件、测量或 PWM。先确定定时器输入时钟，再根据预分频与计数周期计算。**示例：**若某定时器实际输入为 8MHz，且计数方式和更新条件均满足以下假设，预分频寄存器设 7999、自动重装载寄存器设 999，则计数频率为 8MHz/(7999+1)=1kHz，1000 个计数约为 1s。具体型号的时钟树、计数方向和更新行为要核对；不能只看 CPU 主频。\n\n中断是硬件或软件请求 CPU 暂停当前执行、转到处理程序并返回的机制。一般步骤：配置事件源、清除既有状态、使能外围中断和处理器中断、在服务程序中识别并按手册清除标志。服务程序尽量短；主循环和中断共享的数据需要考虑并发与原子性。\n\n初学任务：先用定时器产生周期标志，主循环据此改变 LED；再用按键改变闪烁模式。原有 LED 与串口回显固件没有该功能；另提供独立的 `按键定时器中断示例/`，已编译、链接并检查复位和 TIM2 向量，尚未实板测试。先确认目标板接线和启动条件，再依该目录说明测试；不要把下面的伪代码当成可直接烧录的完整程序。\n\n**练习用伪代码：周期任务与按键事件**\n\n以下是方法描述，不是特定芯片可编译程序。`timer_tick`、按键读取、输出以及事件来源都需要依据所选芯片实现；本例用轮询方式获取节拍，避免把未完成启动初始化的配套示例误当成中断工程。\n\n```text\n启动：配置时钟、LED 输出、按键输入和定时器\n设置初始 LED 状态；记录初始按键稳定状态\n循环：\n    如果产生一个定时节拍：\n        采样一次按键，按稳定时间判定是否产生“按下事件”\n        如果产生按下事件：切换预设闪烁周期\n        累计节拍；达到当前周期时清零累计值并翻转 LED\n```\n\n测试时先用固定输入检查计数周期，再模拟或实际操作按键，检查长按、抖动和快速重复按下；根据所选方案确认节拍丢失、计数溢出和状态初始化如何处理。中断版本还需要正确的向量、启动代码、共享变量同步及外设标志处理。\n\n### 13.7 综合调试：从现象回到证据\n\n| 现象 | 先检查 | 再检查 |\n|---|---|---|\n| 下载器无法连接 | 电源、目标电压参考、SWDIO/SWCLK、地、针序 | 复位、启动状态、芯片型号及调试器配置 |\n| 程序下载后 LED 不亮 | 电源、LED 极性、限流电阻、实际引脚 | GPIO 时钟和模式、输出电平、程序是否运行 |\n| 串口无回显 | 接口方向、共地、端口号、终端参数 | 引脚复用、外设时钟、实际波特率、收发状态 |\n| 按键一次触发多次 | 硬件连接、上拉/下拉 | 消抖策略和中断标志处理 |\n| 周期不准 | 实际时钟与分频 | 轮询耗时、中断丢失、测量方法和时钟误差 |\n\n每次只改变一项，并记录现象和证据。接通多路电源或外接信号前，要检查输入耐压与反向供电。使用现有成熟开发板练习时，先核对实际 MCU 和板级电路，不假设与本草稿完全相同。\n\n### 13.8 选学：STC 平台与音频项目\n\n[嘉立创 STC 单片机资料](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/mcu32.html)以 AI8051U 实验平台介绍 LED、按键、串口、定时器和中断。可以用它对照本课的学习顺序，但平台使用的工具链、头文件、寄存器和下载流程与 STM32 不同，具体特性应核对目标器件手册。\n\n原资料还提出麦克风、ADC、FFT 和 OLED 的综合项目；其项目描述与伪代码适合用来练习拆解系统，不能直接视为完整可运行工程。若选做，需明确采样率、模拟输入范围、抗混叠、存储与算力、显示接口，并先用已知信号或离线数据验证采样与 FFT，再验证显示；记录实际硬件与测试结果。\n\n**选学：将 STC 实验思路与 STM32 对照**\n\n| 实验 | 要先核对 | 跨平台保留的思路 |\n|---|---|---|\n| LED 输出 | 开发板实际接线、有效电平、引脚模式和供电 | 配置输出、设置初始状态、改变电平、观察现象 |\n| 按键输入 | 外部或内部上拉/下拉、按下电平 | 采样、识别稳定状态、一次按下产生一次事件 |\n| UART 通信 | 实际串口映射、逻辑电平、时钟与波特率 | 交叉连接、共同参考、发送接收、核对帧格式 |\n| 定时器 | 外设时钟、分频、计数范围与更新条件 | 根据时钟计算周期，检查溢出与误差 |\n| 中断 | 向量名称、事件使能、标志清除和优先级 | 事件源触发处理，短服务程序并考虑共享状态 |\n\n原资料以 STC AI8051U 实验箱和其配套头文件、下载与编译环境为例。实际使用时先根据 STC 官方资料及所用开发板确认型号、工作模式、工具版本与授权；STC 的 P0 配置和寄存器代码不能直接用于 STM32 的 PA0/PC13，反之亦然。比较时用“输入与输出、时钟、状态及验证结果”描述共同思路，而不是把寄存器名称对号入座。\n\n音频频谱项目可按“麦克风与偏置 → 模拟放大和滤波 → ADC 采样 → 数据缓存 → FFT → 显示”的链路拆解。先给定输入频率、幅度和采样率，检查 ADC 范围与抗混叠，再以已知信号或离线数据验证频谱计算；最后核对显示与端到端结果。原网页提供的是系统思路和伪代码；所需的实际驱动、FFT 精度、缓冲、资源和测试条件须另行实现与验证。\n\n## 🔧 动手练习\n\n1. 画出“供电、复位、时钟、主控、LED、按键、串口、调试器”的连接框图，标记输入与输出。\n2. 对照教学板原理图，写出 LED 和按键的有效电平、UART 两条线及 SWD 针序；指出 GPIO 的复用冲突。\n3. 阅读配套 `main.c`，找出 GPIO 时钟、PC13 输出、USART1 和 SysTick 的配置，解释各自功能与局限。\n4. 写出按键消抖状态图，并用输入序列说明一次按下如何只产生一个事件；再对照独立示例的实现；记录编译与实测状态。\n5. 用实际时钟资料计算一个定时器周期，说明预分频和计数范围；换一个时钟条件后重新计算。\n6. 若有适配开发板，完成编译、下载、LED 和串口验证，记录型号、接线、工具、步骤及结果；没有设备则完成代码阅读与调试方案并注明未实测。\n\n## ✅ 自测清单\n\n- [ ] 我能区分源代码、ELF/BIN、编译成功、下载成功和功能实测通过。\n- [ ] 我能根据原理图判断 LED 亮灭和按键的有效电平。\n- [ ] 我能解释 UART 交叉连接、共地、逻辑电平和帧格式。\n- [ ] 我能根据真实外设时钟推算定时器周期，并解释中断与轮询的区别。\n- [ ] 我知道 STC 示例不能直接当作 STM32 代码使用，也知道现有示例的启动和缓冲限制。\n\n## ⚠️ 常见问题\n\n- 未查引脚和电路就照搬程序，导致 LED 极性相反或调试脚冲突。\n- 把 5V USB 电源、串口逻辑电平和 RS-232 电压视为一回事。\n- 把最大主频当成实际定时器时钟，导致串口波特率和周期错误。\n- 添加全局变量或中断后没有检查启动初始化、向量表及共享数据。\n- 只记录“成功”，没有保存板卡、工具、接线、测试条件与现象。\n\n## 📚 延伸学习\n\n- [ST STM32F103 数据手册](https://www.st.com/resource/en/datasheet/stm32f103c8.pdf)：引脚、电气特性和封装。\n- [ST RM0008 参考手册](https://www.st.com/resource/en/reference_manual/rm0008-stm32f103xx-advanced-armbased-32bit-mcus-stmicroelectronics.pdf)：GPIO、RCC、USART、定时器与中断。\n- [嘉立创 STC 单片机基础](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/mcu32.html)：不同平台上的实验思路；具体代码与设置以实际平台为准。\n- 按键、定时器与中断建议另建独立工程练习；编译检查不等于实板验证。\n- 完成本课后进入第 14 课，把基础知识应用于 STM32 教学板项目。","taskSignature":"eac66e28cd54b9d3ded3543491237fae1907af4092b041b72be237c67a3a1c6e","taskCount":5},{"id":"14","title":"第 14 课 · 项目实战 · 2 层板 · STM32 开发板","short":"2 层板 · STM32 开发板","stage":3,"diff":3,"prev":"第 09、10 课；第 11 课 USB 基础、第 12 课时钟与复位；第 08 课基础焊接及第 13 课单片机基础","optional":false,"md":"## 🎯 本课目标\n\n1. 参考成熟开源设计（Blue Pill / NUCLEO），独立移植出 STM32F103 开发板的完整原理图并逐项自查\n2. 完成 2 层板布局：时钟方案、去耦电容、USB 串口、按键/LED、SWD、排针分区摆放，会用「飞线引导布局法」\n3. 完成布线与双面铺铜，DRC（设计规则检查）全部清零\n4. 输出完整生产文件（Gerber / 钻孔 / 贴片坐标 / BOM），并在打样平台正确选择下单参数\n5. 手工焊接整板：掌握 LQFP 拖焊、桥连处理与上电前短路检查\n6. 用 SWD 下载 LED 闪烁程序并验证串口通信，完成人生第一次「设计→打样→焊接→调试」闭环\n\n> **给从第 13 课走过来的你**：你已经接触电源、USB、晶振和复位等模块的基本原理，也知道各自的布局布线要点——但可能还没把一块板子从头做到尾、亲手焊出来点亮。本课新增的挑战不是某个新模块，而是**完整闭环**：打样下单的每一个参数、烙铁下的每一个焊盘、上电瞬间的每一次心跳。后面的 SoC 与 DDR 项目还需要额外的参考资料、工艺和验证能力。\n\n---\n\n## 📖 正文\n\n项目原理图草稿中的用户 LED 支路如下。PC13 拉低时预期点亮；器件选型与实板效果仍待验证。\n\n```svg\n<svg role=\"img\" aria-label=\"STM32教学板LED从3.3伏经R6和LED连接到PC13\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"90.30999999999997pt\" width=\"260.32399999999996pt\" viewBox=\"-34.378 -176.40999999999997 260.32399999999996 90.30999999999997\"><polygon points=\"101.7,-145.8 114.3,-136.8 101.7,-127.8 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-136.79999999999998 L 18,-136.8 L 18,-145.8 L 54,-145.8 L 54,-127.8 L 18,-127.8 L 18,-136.8 M 54,-136.8 L 72,-136.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-136.79999999999998 L 101.7,-136.8 M 114.3,-145.8 L 114.3,-127.8 M 114.3,-136.8 L 144,-136.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 110.7,-150.29999999999998 L 116.128,-159.799\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 118.708 -164.314 L 118.628 -158.37 L 113.627 -161.228 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 102.60000000000001,-150.29999999999998 L 108.028,-159.799\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 110.608 -164.314 L 110.528 -158.37 L 105.527 -161.228 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 144.0,-136.79999999999998 L 162,-136.8 L 180,-136.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-18.0\" y=\"-153.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-18.0\" dy=\"13\">3V3<\/tspan><\/text><text x=\"36.0\" y=\"-162.39999999999998\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"36.0\" dy=\"13\">R6 4.7kΩ<\/tspan><\/text><text x=\"108.0\" y=\"-137.2\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"108.0\" dy=\"13\">D1 LED<\/tspan><\/text><text x=\"205.2\" y=\"-153.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"205.2\" dy=\"13\">PC13<\/tspan><\/text><text x=\"111.60000000000001\" y=\"-110.2\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"111.60000000000001\" dy=\"13\">PC13 输出低电平时灌电流<\/tspan><\/text><\/svg>\n```\n\n\n### 14.1 项目方案与系统框图\n\n**项目定位**：一块类似「Blue Pill」的 STM32F103 核心板，但**不要追求极限小**——配套摆件草稿暂定 80mm × 60mm；最终尺寸还要根据连接器、排针和外壳核对。它包含你未来面试时最常被问到的元素：最小系统、USB 串口、调试口、IO 引出。\n\n**系统框图**（文字版，画原理图前先在纸上画一遍）：\n\n```mermaid\nflowchart TD\n    TC[\"USB Type-C\"] -->|\"5V 供电\"| AMS[\"LDL1117S33R 候选\"]\n    AMS -->|\"3.3V\"| STM[\"STM32F103C8T6 · LQFP48\"]\n    AMS -->|\"3.3V\"| CH\n    TC -->|\"D+/D−\"| CH[\"CH340N\"]\n    CH <-->|\"USART1\"| STM\n    HSI[\"内部 HSI 时钟\"] --- STM\n    STM --> SWD[\"SWD 5P 排针\"]\n    STM --> BOOT[\"BOOT0 跳线\"]\n    STM --> LED[\"用户 LED · PC13\"]\n    STM --> KEY[\"用户按键 PA0 + 复位按键\"]\n    STM --> HDR[\"单排 20 针排针 ×2 · 引出 GPIO 与电源\"]\n```\n\n**模块清单表**：\n\n| # | 模块 | 选型建议 | 数量 | 说明 |\n|:--:|:--|:--|:--:|:--|\n| 1 | 主控 | STM32F103C8T6（LQFP48） | 1 | Cortex-M3，最高 72MHz；配套固件目前使用 HSI 标称 8MHz |\n| 2 | 电源 | LDL1117S33R 候选 | 1 | USB 5V→3.3V；可用负载由 USB 取电、压差、热条件和电容共同决定 |\n| 3 | USB 串口 | CH340N（SOP-8） | 1 | 内置时钟；3.3V 供电，接 USART1（PA9/PA10） |\n| 4 | USB 座 | Type-C 母座 16P | 1 | 供电+数据；CC1/CC2 各接 5.1kΩ 下拉 |\n| 5 | HSE 晶振 | 8MHz 无源晶体（选做） | 0 或 1 | 当前草稿和固件使用内部 HSI；选装须补电路与封装，并按负载及寄生参数计算电容 |\n| 6 | RTC 晶振 | 32.768kHz（选做） | 0 或 1 | 当前未装；需要 LSE 时按芯片和晶体手册补充电路 |\n| 7 | 按键 | 6×6mm 轻触开关 | 2 | 复位（NRST）+ 用户键（PA0） |\n| 8 | LED | 0805 LED + 4.7kΩ 候选电阻 | 1 组 | PC13 用户 LED，低电平亮；具体 LED、电流及亮度须核验 |\n| 9 | SWD 口 | 2.54mm 排针 5P | 1 | VREF / SWDIO / SWCLK / GND / NRST；针序须与调试器核对 |\n| 10 | IO 引出 | 2.54mm 单排 20 针排针 | 2 | 引出 GPIO 与电源，注意与 SWD、串口及板载功能复用 |\n| 11 | 启动选择 | 跳线 + 排针 | 1 组 | BOOT0 使用候选 10kΩ 下拉并通过跳线选择 |\n| 12 | 电容 | 100nF ×7、1µF ×1、10µF ×2 | 10 | 涵盖供电去耦、LDO 输入输出与复位；完整料号及有效值待核验 |\n| 13 | 数据线保护 | USBLC6-2SC6 候选 | 1 | D+/D− ESD 保护；VBUS 和 CC 的完整保护方案另行核验 |\n\n**选型理由**：\n- F103C8T6：资料较丰富，LQFP48 适合练习细间距焊接；使用前核对器件来源、封装和参数。\n- CH340N：内置振荡器；本例使用 3.3V 供电，VCC 与 V3 连接，按手册配置去耦；替换成 CH340C 前必须重新核对封装和引脚。\n- Type-C：现在最通用的接口，但要记住**设备端必须给 CC1、CC2 各接一个 5.1kΩ 下拉电阻**，否则很多线不供电。\n- 功耗预算：MCU 电流随时钟与工作状态变化，CH340、指示灯和外接负载也要计入。按各器件手册和最大负载建立预算，并核对 USB 取电能力、LDO 压差和散热；不能仅凭 LDO 标称电流判定足够。\n\n**制作准备**：根据实际板厂报价、起订量、运费和器件来源核算成本；易损耗的小件可留出余量。等待制作期间可先完成固件编译并规划测试；收到板后再按实际接线、供电和固件条件验证。\n\n**原理图自查清单**（画完逐条打勾）：\n- [ ] 不接后备电池时，VBAT 接 3V3 并配置就近的 100nF 对地去耦；配套草稿对应 C10\n- [ ] NRST 有 100nF 对地电容（内部有弱上拉，外部 10kΩ 上拉可选）\n- [ ] BOOT0 有 10kΩ 下拉，跳线可选 3V3\n- [ ] VDDA 接 3V3，附近按 ST 指南配置 1µF + 100nF；如需磁珠或 0Ω 隔离，应结合模拟精度和回流重新设计。配套草稿为直接连接\n- [ ] 每个 VDD 脚附近都有一颗 100nF\n- [ ] Type-C 的 CC1、CC2 各接独立 5.1kΩ 下拉；按连接器手册连接两组 USB2.0 D+、D−触点，核对正反插；VBUS 可加合适的保护器件\n- [ ] CH340N 采用 3.3V 供电，VCC 与 V3 接 3.3V 并按器件手册去耦；TXD→PA10、RXD←PA9，共地，UD+、UD−连接对应 USB 数据网络；保护器件按所选型号的引脚定义接入\n- [ ] PB2/BOOT1 和 BOOT0 按选定启动方式配置；SWD 接口的目标电压检测脚不默认作为板载电源输出，避免与板载供电互相倒灌\n- [ ] 评估 USB D+/D− 的 ESD 防护：配套草稿选用 USBLC6-2SC6 候选，其数据端分别接 D+/D−，VBUS 脚接接口 5V，GND 脚接地；器件靠近接口并缩短接地回路。CC、VBUS 及过流保护仍需另行设计和验证\n\n**原理图核对基线（STM32F103C8T6，LQFP48）**：本段用于核查器件连接，并非已经完成或验证的原理图。\n\n| MCU 引脚 | 连接或用途 | 核对重点 |\n|---|---|---|\n| 1 VBAT；8 VSSA；9 VDDA | VBAT 接 3V3，C10 就近对地；VSSA 接地；VDDA 接模拟电源 | 不接后备电池时按手册供电；按 ST 指南去耦 |\n| 23/24、35/36、47/48 | VSS/VDD 成对供电与去耦 | 三对数字供电脚均连接；电容就近布置 |\n| 7 NRST；44 BOOT0；20 PB2/BOOT1 | 复位、启动选择 | NRST 按 ST 指南设置；BOOT0/BOOT1 组合决定启动源 |\n| 30 PA9；31 PA10 | USART1 TX、RX | 分别接 CH340N RXD、TXD，确认电平与共地 |\n| 34 PA13；37 PA14 | SWDIO、SWCLK | 调试器与目标板共地；确认目标电压检测端用途 |\n| 2 PC13；10 PA0 | 用户 LED、用户按键 | 受 PC13 驱动能力限制，按数据手册核对 LED 电流；软件与接线保持一致 |\n| 5/6 PD0/PD1 | HSE 晶体输入/输出 | 按晶体 CL、引脚/板级寄生计算两颗负载电容；ST 的 STM32F1 指南对此有说明 |\n\n依据：[STM32F103x8/xB 数据手册 DS5319 Rev 20](https://www.st.com/resource/en/datasheet/stm32f103c8.pdf)、[ST AN2586 Rev 8](https://www.st.com/resource/en/application_note/an2586-getting-started-with-stm32f10xxx-hardware-development-stmicroelectronics.pdf)、[WCH CH340 手册下载页](https://www.wch-ic.com/downloads/CH340DS1_PDF.html)。本课设计草稿提出 ST LDL1117S33R 作为候选；仍须确定输入/输出电容的完整料号、有效容值和 ESR，不能将不同 AMS1117 兼容型号视为自动互换；板上外接负载应纳入电流与热预算。\n\n> **尚缺的项目文件**：本课新增 KiCad 原理图草稿并完成 ERC 与部分网络核对；另有未布线的 PCB 摆件草稿；已加入 USB 数据线 ESD 保护候选，接口其他保护仍待设计，DRC 仍有孔间距错误；完整物料、PCB 布线、打样和实板测试数据仍未完成。示例固件（LED 与串口回显）已用 Clang 和 ARM GNU 两种路径完成编译、链接及镜像结构检查；尚未下载或实板验证。设计前应先完成器件与连接核查并逐项复核，再开展制作；不要把这里的框图当成经过验证的工程。\n\n**本课程的固件起点**：示例固件使用 HSI；草稿没有外部晶体及其焊盘，需启用 HSE 时应补充完整电路，验证状态与使用边界见课程说明。\n\n**测试程序的公开起点**：ST 提供 [STM32CubeF1 GPIO 翻转示例](https://github.com/STMicroelectronics/STM32CubeF1/tree/master/Projects/STM32F103RB-Nucleo/Examples/GPIO/GPIO_IOToggle)与 [UART 示例目录](https://github.com/STMicroelectronics/STM32CubeF1/tree/master/Projects/STM32F103RB-Nucleo/Examples/UART)。这些例程面向 NUCLEO-F103RB，不能直接视为本板程序：移植时需选择 F103C8 目标与存储容量，按实际 LED 和串口引脚修改板级配置，核对时钟、串口波特率、启动文件与链接配置，再编译并记录测试结果。资源许可依各文件附带说明核对。\n\n### 14.2 叠层设计\n\n| 层号 | 名称 | 用途 | 厚度参考 |\n|:--:|:--|:--|:--|\n| L1 | TOP | 元件 + 信号 | 1oz 铜（35µm） |\n| — | FR-4 芯板 | 介质 | 1.6mm |\n| L2 | BOTTOM | 信号 + **整层铺铜当「地平面」** | 1oz 铜（35µm） |\n\n2 层板的叠层没有选择余地，但有纪律：\n1. **BOTTOM 整层铺地不割**，它就是这块板的「地平面」。TOP 信号换层到底面时，在过孔旁边补一个伴随地孔（stitching via），给回流电流（return current）留近路。\n2. **阻抗设计**：USB 全速的走线约束仍应参考具体芯片、连接器与板厂叠层；保持差分对紧凑、参考连续，长度并非仅凭 25mm 就能保证合规。\n3. 电源没有平面，3.3V 主干走粗线（见 14.4 规则表），按实际电流、孔壁铜厚、长度和允许温升核算过孔。\n\n**两个常见认知误区**：\n- 误区一：「2 层板一面走电源一面走地」——BOTTOM 上有信号，就没有「整面电源」可言。正确做法：BOTTOM 信号间隙整层铺地，电源走 TOP 粗线。\n- 误区二：「铺铜是美化步骤，可有可无」——不铺铜的 2 层板信号回流路径乱窜，稳定性与 EMC 都差。「双面铺铜 + 缝合地孔」就是 2 层板的地平面平替方案，必须做。\n\n### 14.3 布局规划\n\n**布局分区图**（先画在纸上，再往 EDA 里摆）：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 555 255\" width=\"555\" height=\"255\" role=\"img\"><rect class=\"fp-board\" x=\"6\" y=\"6\" width=\"540\" height=\"240\" rx=\"8\"/><text x=\"20\" y=\"26\" text-anchor=\"start\" font-size=\"10\" class=\"fp-strong\">上区：供电 + 串口（同一短链路）<\/text><rect class=\"fp-part\" x=\"24\" y=\"36\" width=\"100\" height=\"34\" rx=\"5\"/><text x=\"74.0\" y=\"57.0\" text-anchor=\"middle\" font-size=\"11\">USB Type-C<\/text><rect class=\"fp-part\" x=\"140\" y=\"36\" width=\"90\" height=\"34\" rx=\"5\"/><text x=\"185.0\" y=\"57.0\" text-anchor=\"middle\" font-size=\"11\">CH340N<\/text><rect class=\"fp-part\" x=\"246\" y=\"36\" width=\"130\" height=\"34\" rx=\"5\"/><text x=\"311.0\" y=\"57.0\" text-anchor=\"middle\" font-size=\"11\">LDL1117 + 电容<\/text><rect class=\"fp-part\" x=\"392\" y=\"36\" width=\"80\" height=\"34\" rx=\"5\"/><text x=\"432.0\" y=\"57.0\" text-anchor=\"middle\" font-size=\"11\">接口保护<\/text><line class=\"wv-dash\" x1=\"16\" y1=\"84\" x2=\"536\" y2=\"84\" stroke=\"var(--line)\"/><text x=\"20\" y=\"104\" text-anchor=\"start\" font-size=\"10\" class=\"fp-strong\">中区：主控 + 时钟 + 调试口<\/text><rect class=\"fp-part\" x=\"24\" y=\"114\" width=\"66\" height=\"34\" rx=\"5\"/><text x=\"57.0\" y=\"135.0\" text-anchor=\"middle\" font-size=\"11\">排针<\/text><rect class=\"fp-part\" x=\"104\" y=\"114\" width=\"92\" height=\"34\" rx=\"5\"/><text x=\"150.0\" y=\"129.0\" text-anchor=\"middle\" font-size=\"9\">HSI 时钟<\/text><text x=\"150.0\" y=\"141.0\" text-anchor=\"middle\" font-size=\"9\">晶振选做<\/text><rect class=\"fp-core\" x=\"208\" y=\"108\" width=\"160\" height=\"46\" rx=\"5\"/><text x=\"288.0\" y=\"135.0\" text-anchor=\"middle\" font-size=\"11\">STM32F103C8T6<\/text><rect class=\"fp-part\" x=\"380\" y=\"114\" width=\"90\" height=\"34\" rx=\"5\"/><text x=\"425.0\" y=\"135.0\" text-anchor=\"middle\" font-size=\"11\">SWD 调试口<\/text><rect class=\"fp-part\" x=\"482\" y=\"114\" width=\"50\" height=\"34\" rx=\"5\"/><text x=\"507.0\" y=\"135.0\" text-anchor=\"middle\" font-size=\"11\">排针<\/text><line class=\"wv-dash\" x1=\"16\" y1=\"162\" x2=\"536\" y2=\"162\" stroke=\"var(--line)\"/><text x=\"20\" y=\"182\" text-anchor=\"start\" font-size=\"10\" class=\"fp-strong\">下区：人机交互，全靠板边<\/text><rect class=\"fp-part\" x=\"24\" y=\"192\" width=\"110\" height=\"34\" rx=\"5\"/><text x=\"79.0\" y=\"213.0\" text-anchor=\"middle\" font-size=\"11\">复位按键<\/text><rect class=\"fp-part\" x=\"150\" y=\"192\" width=\"120\" height=\"34\" rx=\"5\"/><text x=\"210.0\" y=\"213.0\" text-anchor=\"middle\" font-size=\"11\">BOOT0 跳线<\/text><rect class=\"fp-part\" x=\"286\" y=\"192\" width=\"140\" height=\"34\" rx=\"5\"/><text x=\"356.0\" y=\"213.0\" text-anchor=\"middle\" font-size=\"11\">用户 LED / 按键<\/text><\/svg>\n```\n\n**摆放理由**：\n- 若选装晶振，晶体及负载电容靠近 MCU，按器件与晶体指南控制回路、参考地和周围信号；本例的 HSI 无需外部晶振。\n- 去耦电容**先于布线摆放**：每颗 100nF 对应一个 VDD 脚，贴着脚放，GND 端就近打孔到底面地铜。\n- CH340 与 USB 座同一分区，让 D+/D− 天然就短。\n- 排针贴板边（距边 3~5mm），把 MCU「包」在中间，IO 飞线呈放射状出去，最顺。\n- SWD 口放板边一端，插杜邦线不挡手；按键放拇指容易够到的板边。\n\n**飞线引导布局法**（本课要练成的习惯）：\n1. 按分区图把模块「整块拖」进对应区域；\n2. 打开飞线（ratline）显示，观察：模块内飞线是否短？模块间是否大面积交叉？\n3. 旋转、镜像、对调同类器件（例如两颗 DDR、几个电容的位置），让飞线变短、变顺；\n4. 验收标准：**没有横穿整板的长飞线，USB/晶振/复位相关飞线都很短，整体呈「放射+局部簇」状**。\n\n**布局验收清单**（布局冻结、进入布线前逐项打勾）：\n- [ ] 元件 100% 入板，无重叠、无出界\n- [ ] 飞线无横穿整板的交叉长线\n- [ ] 如使用外部晶振，按器件指南检查晶体、负载电容与回流；当前 HSI 方案无需此项\n- [ ] 每颗去耦电容距对应电源脚 ≤5mm\n- [ ] USB 座→CH340→MCU 一条顺直短链路\n- [ ] SWD、按键、LED、排针全部贴边、可插可按\n- [ ] 板边留 ≥3mm 无件区（便于夹持与后期装壳）\n- [ ] 丝印位号粗查无遮挡（铺铜后再细查一遍）\n\n### 14.4 布线与重点难点\n\n**线宽 / 间距规则表**（2 层板，单位 mil，1mil ≈ 0.025mm）：\n\n| 对象 | 线宽 | 间距 | 说明 |\n|:--|:--:|:--:|:--|\n| 一般信号 | 8（0.2mm） | ≥8 | 空间充裕，别抠线宽，粗线良率高 |\n| USB D+/D− | 10 | 对内 6~8 | 并行走线、少打孔；25mm 仅为布局练习示例，实际按接口指南与叠层核验 |\n| 晶振走线（选做） | 按器件指南 | 按器件指南 | 两条连接分别尽量短，避免相互耦合；保护地和回流按具体指南设计 |\n| 复位线 | 8 | ≥15 | 远离 USB 和晶振，可选包地 |\n| 3.3V 主干 | ≥30（0.76mm） | — | LDO 到各去耦电容的主干道 |\n| 电源支线 | 10~12 | — | 到电容再到芯片电源脚，短而粗 |\n| 过孔 | 0.3mm 孔 / 0.6mm 盘 | — | 常规工艺最便宜档；电源过孔加倍 |\n\n**推荐布线顺序**（以后每个项目都按这个节奏）：\n1. 先确定供电、去耦和回流路径及必要的电源主干 → 2. 如有晶振，优先处理振荡回路 → 3. USB 数据线 → 4. 复位 / BOOT 与其他信号 → 5. 完成地铜并检查回流。布局和布线需迭代，不以这份顺序代替具体约束。\n\n**本板三个难点**：\n- **晶振（选做）**：晶体和负载电容靠近引脚，两条连接分别保持短而避免互相耦合；局部保护地及其连接参照 [ST AN2867](https://www.st.com/resource/en/application_note/an2867-guidelines-for-oscillator-design-on-stm8afals-and-stm32-mcusmpus-stmicroelectronics.pdf) 和目标器件指南。不要以固定线长、等长或过孔数量代替起振裕量验证。\n- **USB 差分**：把它当成一条「双绞的线」看待——尽量并排、同层、保持间距和连续参考，绕开排针区；需要换层或扇出时按器件和叠层设计。3mm 线长差仅为练习示例，实际以所选器件和设计约束核对。\n- **电源树**：从 LDO 出来先到「大电容」，再分叉去各路；先粗后细，避免「先细后粗」的瓶颈。\n\n**布线自查清单**（交给 DRC 之后、导出 Gerber 之前过一遍）：\n- [ ] DRC 零错误、飞线零残留\n- [ ] USB 对内长度差和总长按所选器件指南核对；3mm / 25mm 仅为练习示例\n- [ ] 如使用外部晶振，核对晶体、负载电容、走线、保护地和起振裕量；HSI 方案不适用\n- [ ] 每颗去耦电容的 GND 过孔距焊盘 ≤2mm\n- [ ] 3.3V 主干全程无细于 30mil 的瓶颈段\n- [ ] 长走线换层处有伴随地孔（重点查排针长线）\n- [ ] 全板无直角走线（用 45° 或圆弧）\n- [ ] 双面铺铜连通、无孤岛残留\n\n### 14.5 铺铜、地平面与电源处理\n\n1. **双面铺铜，网络选 GND**：BOTTOM 整层，TOP 在信号间隙铺；两层地铜用过孔缝合，间距 10~15mm 一个，晶振/USB/排针区加密。\n2. 铺铜边缘离板边 ≥20mil（0.5mm），防止板边毛刺短路。\n3. 铺铜后执行「移除孤岛（dead copper）」：与主地不连通的孤铜要么删掉、要么补孔接地——浮空的铜皮是天线，是噪声源。\n4. 检查铺铜与焊盘的最小间距 ≥8mil，避免阻焊桥做不出来。\n5. 电源处理要点：LDO 输入/输出电容紧贴 LDO 引脚；3V3 主干一路「粗到底」，任何一段不细于 30mil。\n\n### 14.6 DRC 检查与生产文件输出\n\n**DRC 设置与执行**：最小线宽 8mil、最小间距 8mil、过孔 0.3/0.6mm → 运行 DRC → **错误清零、未连接飞线数 = 0** 才算完。\n\n**输出文件清单**（以 Gerber RS-274X 格式为例）：\n\n| 文件 | 内容 | 用途 |\n|:--|:--|:--|\n| 顶层铜层 | GTL | 顶层走线 |\n| 底层铜层 | GBL | 底层走线 + 铺铜 |\n| 顶层阻焊 | GTS | 阻焊（solder mask）开窗 |\n| 底层阻焊 | GBS | 同上 |\n| 顶层丝印 | GTO | 元件位号（silkscreen） |\n| 底层丝印 | GBO | — |\n| 钻孔文件 | Excellon（DRL/TXT） | 所有孔位孔径 |\n| 板边层 | GKO / Outline | 板子外形 |\n\n导出后**必须**在 CAM 预览器（打样平台下单助手的预览、或独立 Gerber 查看器）里逐层检查：阻焊窗是否对准焊盘、丝印是否压焊盘（会被拒单或警告）、孔是否都在、板边是否闭合。\n\n**打样下单参数表**（新手照抄即可）：\n\n| 参数 | 选择 | 说明 |\n|:--|:--|:--|\n| 板层 / 板厚 | 2 层 / 1.6mm | — |\n| 数量 | 5 片（最低档） | 打样重在验证，不在量 |\n| 表面处理（surface finish） | 有铅喷锡 HASL | 最便宜；本板无 0.5mm 以下细间距器件，够用 |\n| 阻焊颜色 | 绿色 | 便宜、对比度好，焊接检查方便 |\n| 最小线宽/间距 | **如实填写**（本板 8/8mil） | 填低不填高；低于免费档位会加价，别隐瞒 |\n| 过孔工艺 | **过孔盖油（tenting）** | 防手工焊时过孔漏锡造成短路，必勾 |\n| 铜厚 | 1oz | — |\n| 工艺边 | 不需要 | 手焊/手工贴片不用 |\n| 备注 | 无特殊要求 | — |\n\n**BOM 与坐标**：BOM 导出含位号、参数、封装、（若用立创商城则带商品编号，采购省事）；贴片坐标文件（CPL）本板可选——手焊为主，但导出一份存档，养成习惯。\n\n**下单流程时间线**（第一次走一遍，以后形成肌肉记忆）：\n1. 导出 Gerber 全套文件并压缩；\n2. 上传打样平台，用在线预览再核一遍层数与板形；\n3. 核对系统自动识别的层数 / 板厚 / 最小线宽间距是否与设计一致；\n4. 填参数表（14.6），勾选**过孔盖油**；\n5. 提交审核：一般 1 个工作日内出结果；被拒的常见原因是丝印压焊盘、阻焊开窗异常、参数填报与文件不符——按意见回 EDA 修改后重传，**不要硬下**；\n6. 付款排产（常规 2~4 天）→ 发货 → 收板开箱检查：板厚、颜色、板边、孔位、丝印逐一目检，有问题当场拍照留证。\n\n### 14.7 本课核心技能专项：打样下单与焊接调试\n\n如果第 09 课已完成简单板，这里将制作经验应用到 STM32 项目；按以下步骤检查。\n\n**A. 等板期间：备料**\n- 按 BOM 采购元件 + 排针 + 一小段焊锡丝损耗余量；\n- 工具清单：T12 恒温烙铁、0.6mm 焊锡丝（有铅 63/37 更好上手）、**助焊剂（必买，拖焊的灵魂）**、弯头镊子、吸锡带、放大镜或显微镜、万用表。\n\n**B. 焊接顺序：先低后高，先小后大**\n1. 电阻电容（0805 尺寸，新手友好）→ 2. LQFP48 主控 → 3. CH340 → 4. LDO → 5. Type-C 座 → 6. 按键/跳线 → 7. **排针最后焊**（高件先焊会挡烙铁，这是新手最常见的顺序错误）。\n\n**C. LQFP48 拖焊五步法**：\n1. 对角线两个引脚定位、校正芯片摆正；\n2. 一侧引脚堆满锡，烙铁头带锡**从一端平拖到另一端**；\n3. 桥连（solder bridging）了别慌：吸锡带吸锡带轻压平拖一遍；\n4. 放大镜逐脚检查焊点；\n5. 万用表蜂鸣档测相邻引脚确认无短路。\n\n**D. 上电前三查（每次上电前都做，形成肌肉记忆）**：\n1. 蜂鸣档测 3V3–GND、5V–GND 之间**无短路**；\n2. 目检 USB 座、Type-C 四焊点、LQFP 四边；\n3. 确认有极性器件方向（LED、CH340、LDO）没反。\n\n**E. 上电与点检**：\n- 用电脑 USB 口或带限流保护的 Hub 供电（别第一次就用大电流电源）；\n- 测 LDO 输出与实际供电、电压容差和器件手册核对；记录空载电流并与设计预算和同版本良板比较，不能把固定电流范围当作全部板子的验收标准；\n- LDO 温度异常时立即断电，待冷却后结合负载、电压、功耗和焊接情况逐段排查；不要凭烫手直接认定短路。\n\n**F. SWD 点亮**：\n- ST-Link 接 SWDIO、SWCLK、GND 和目标板 3.3V 检测端；确认具体调试器的电压检测端不直接给板供电，避免与 USB 电源相互倒灌。可增加 NRST 连接以便连接复位；使用已准备的工程在 IDE 中编译并下载 LED 闪烁程序；\n- 下载失败先查：供电、参考电压、SWD 线序、目标芯片是否响应；程序占用调试脚时可按调试器说明尝试连接复位。BOOT0 配置会影响启动源，但拉高本身不等于 SWD 必然连接失败；\n- 串口验证：串口助手发字符经 CH340→PA10→PA9 回环（写个 echo 程序），收发一致则 USB 串口链路全通。\n\n**G. 常见上电故障排查表**（第一次上电十有八九不完美，对着这张表查）：\n\n| 症状 | 高概率原因 | 排查动作 |\n|:--|:--|:--|\n| 插 USB 无反应、无电流 | Type-C CC 电阻缺失/虚焊 | 蜂鸣档量 CC 对地约 5.1kΩ；补焊 |\n| 电流明显异常或电源保护 | 短路、过载、启动浪涌或设置不当等 | 断电检查，结合电路资料和正常板分段定位；不要只凭电流值认定短路 |\n| 3V3 电压偏低（<3.0V） | LDO 焊接不良 / 后级过载 | 量 LDO 输入是否 5V；割开负载对比电流 |\n| LDO 温度异常 | 功耗过大、散热不足、过载或焊接错误等 | 断电冷却，核对功耗、负载、电源及器件方向，再定位 |\n| ST-Link 连不上 | SWD 线序、目标参考电压、供电或固件配置异常 | 核对调试器引脚与目标 3V3；必要时连接 NRST 并尝试连接复位 |\n| 下载成功但不运行 | 启动配置、固件或时钟等原因 | 复查启动状态和固件；本例使用 HSI，不依赖外部晶体。需要测晶体时优先用芯片时钟输出或低负载测量方法 |\n| 串口乱码 | 波特率错 / TX RX 接反 | 交换 TX/RX 试；核对 115200-8-N-1 |\n\n**H. 项目复盘（错题本第一次开张）**：\n- 记录三类问题：打样审核/拒单原因、焊接翻车点、调试排查路径；\n- 每条按「现象 → 根因 → 下次如何在设计阶段避免」三段式书写；\n- 第 20 课开课前重读一遍——项目课难度是叠加的，教训也应该叠加。这一课的结束动作不是「灯亮了」，而是「错题本写完了」。\n\n**本课术语速查**：\n\n| 术语 | 英文 | 一句话解释 |\n|:--|:--|:--|\n| 飞线 | ratline | 布局阶段表示网络连接关系的预拉线 |\n| 铺铜 | copper pour | 大面积覆铜，常用作地 |\n| 阻焊 | solder mask | 绿油层，控制上锡区域 |\n| 丝印 | silkscreen | 白色字符层（位号、参数） |\n| 过孔盖油 | via tenting | 用阻焊层把过孔盖住 |\n| 拖焊 | drag soldering | 烙铁带锡拖焊细间距引脚的手法 |\n| 桥连 | solder bridging | 相邻焊盘被焊锡连住的缺陷 |\n| 表面处理 | surface finish | 喷锡/沉金等焊盘涂层工艺 |\n| 贴片坐标文件 | CPL / pick & place file | 元件坐标，供贴片机使用 |\n| 物料清单 | BOM（Bill of Materials） | 采购与焊接对照表 |\n\n### 14.8 参考开源工程（对照学习）\n\n| 工程 | 获取 | 对照看点 |\n|:---|:---|:---|\n| Arduino Uno Rev3 | [官方硬件页](https://docs.arduino.cc/hardware/uno-rev3/)（原理图 + EAGLE 源文件） | 同为 2 层入门板：电源合流与防倒灌、USB 转串口方案（16U2 vs 你的 CH340）、排针丝印规范 |\n| 正点原子/野火 STM32 开发板 | 官网资料中心免费下载原理图 PDF | 中文标注最全的 STM32 最小系统：下载电路、排针引出、电源 |\n| 立创·梁山派 GD32F470 开发板 | [oshwhub.com](https://oshwhub.com) 搜\"梁山派\" | 立创官方全套视频+文档的国产开源开发板，可在线看源文件 |\n| Phil's Lab STM32 板 | [phils-lab.io](https://phils-lab.io/) 项目页（KiCad 源文件） | STM32+Buck 的视频级教学，电源布局讲解全网最佳 |\n\n> 📖 系统的解读方法见第 17 课\"经典开源工程解读实战\"（解读五步法 + 临摹任务）。\n\n---\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|:--:|:--|:--|\n| 1 | 移植原理图：按 14.1 模块清单分模块绘制，参考 Blue Pill / NUCLEO 原理图 | ERC 无错，14.1 自查清单逐项打勾 |\n| 2 | 布局：按 14.3 分区图摆放全部元件 | 飞线尽量短且少交叉；选装晶振时按器件指南布局，去耦电容靠近对应引脚 |\n| 3 | 布线：按 14.4 顺序与规则完成 | 100% 连通，DRC 清零；USB 约束按器件指南及具体叠层核对 |\n| 4 | 铺铜：双面 GND 铺铜 + 缝合孔 | 清除无用途孤岛；检查回流路径，缝合孔与板边间距按设计及板厂工艺确定 |\n| 5 | 输出生产文件四件套 | CAM 预览逐层检查通过，无丝印压盘 |\n| 6 | 打样下单 | 按 14.6 参数表完成下单，收到板子拍照记录 |\n| 7 | 手工焊接整板 | 万用表查电源轨无短路，焊点放大镜检查合格 |\n| 8 | 调试点亮 | SWD 下载 LED 闪烁成功 + 串口回环收发正常 |\n\n## ✅ 自测清单\n\n- [ ] 能说清 2 层板为什么必须把 BOTTOM 整层铺地吗？\n- [ ] 选用外部晶振时，如何控制连线长度、耦合和保护地？为什么还要验证起振裕量？\n- [ ] Type-C 的 CC 脚不接 5.1kΩ 下拉会发生什么？\n- [ ] BOOT0 悬空或拉高分别是什么后果？\n- [ ] 去耦电容为什么必须紧贴电源脚，摆远了有什么症状？\n- [ ] USB D+/D− 布线的三个要点（并排/同层/少孔）能复述吗？\n- [ ] 上电前必查的三项是什么？\n- [ ] 怎样建立空载电流参考？LDO 温度异常时应如何检查？\n- [ ] Gerber 输出包含哪几类文件？哪一层漏了会「开不出孔」？\n- [ ] 过孔盖油解决什么问题？喷锡和沉金怎么选？\n- [ ] LQFP 桥连后用什么工具、怎么处理？\n- [ ] 不看讲义，能独立重走一遍「下单→焊接→点亮」全流程吗？\n\n## ⚠️ 新手常见坑\n\n1. **Type-C 不供电**：CC1 和 CC2 **两个脚都要**各接 5.1kΩ 下拉，只接一个，遇到某些线序就断电——原理图阶段就要检查。\n2. **BOOT0 悬空**：电平不定，出现「下载成功但不运行」的灵异现象。BOOT0 必须 10kΩ 下拉 + 跳线选择。\n3. **去耦电容摆太远**：板子能跑，但 USB 枚举偶发失败、ADC 跳变——这类「软故障」最难查，返工改板才知道疼。\n4. **晶振负载电容随手抓**：不按晶振 CL 计算匹配，常温起振、低温停振。按规格书来，别用「别人板上是 22pF」当依据。\n5. **Gerber 漏导钻孔层或板边层**：板厂开不出孔或无法报价，白等一周。导出清单按 14.6 表格逐项打勾。\n6. **焊接顺序错（先焊排针）**：高件挡住烙铁，小件没法焊，只能拆了重来。记住口诀：**先低后高、先小后大、排针最后**。\n\n## 📚 延伸学习\n\n- **意法半导体（ST）官网**：STM32F103 数据手册、参考手册 RM0008、应用笔记 AN2586《STM32 硬件开发入门》（Getting started with STM32 hardware development）——最小系统的官方标准答案。\n- **ST 官方 NUCLEO-F103RB 原理图**：官网免费下载，对照学习官方去耦与复位电路画法。\n- **立创开源硬件平台**：搜「STM32F103 最小系统」「Blue Pill」，对比 3 个开源工程的布局差异，思考别人为什么那样摆。\n- **沁恒（WCH）官网**：CH340 数据手册，重点核对 CH340N 的引脚、USB 信号和供电电容；Type-C 连接器引脚另查所选连接器图纸。\n- **打样平台工艺参数页**（嘉立创 / 捷配等）：下单前通读「工艺参数」与常见拒单原因。\n- **B 站实操视频**：搜「LQFP 拖焊」「0803 贴片焊接入门」，焊接前看两遍再动手。","taskSignature":"7e59ed3a78693a9fc7c23170a45573fd8d094e54b781e7ccb6bf420ad2cf1f5a","taskCount":37},{"id":"15","title":"第 15 课 · 工程实践补充","short":"工程实践补充","stage":3,"diff":4,"prev":"第 07、09 课；生产文件与首次上电部分配合首板，量产部分按项目深入","optional":false,"md":"这一课配合首板与后续项目，解决\"交得出、造得出、算得清\"：从设计文件到工厂能用的光绘（Gerber），从拿到陌生原理图到快速看懂，从\"照 BOM 买料\"到自己选型比价，从打样下单到小批量贴片，再到量产的成本账。这些是公司里每天都要用的工程流程，面试官问\"你们怎么打样的\"时，你要能像流水一样答出来。\n\n## 🎯 本课目标\n\n学完这一课，你应该能够：\n\n1. 独立输出一套完整的打样文件（各层 Gerber + 钻孔 + 边框），并用 CAM 检查工具完成输出前自检。\n2. 拿到一份陌生原理图，按\"电源树→主控→模块化→网络标号\"的流程在 1~2 小时内看懂主体结构。\n3. 读元器件关键参数（容值/耐压/精度/封装/温度等级），完成 LDO/DCDC/MOS 的选型对比与替代料分析。\n4. 正确填写打样下单参数（板厚/铜厚/阻焊色/表面工艺等），说出 HASL 与 ENIG 的适用场景。\n5. 描述小批量 SMT 的完整流程（钢网→锡膏→贴片→回流焊）以及 BGA 焊接为什么要 X-Ray 检测。\n6. 用 DFM 审查清单和降本手段（层数/工艺/器件替代/拼板）评估一块板的可制造性与成本。\n\n## 📖 正文\n\n### 15.1 光绘输出：把设计翻译成工厂的语言\n\n**是什么**：PCB 工厂的机器不认识你的 `.PcbDoc` 或工程文件，只认识**光绘（Gerber）文件**和**钻孔文件**。输出光绘（也叫 CAM 输出）是每个项目的\"交卷\"动作，也是新手最容易翻车的环节——图画得再好，层选错/漏输出一样报废。\n\n**一套完整的生产文件长什么样**（文件后缀以 Altium/常见约定为例，不同 EDA 命名不同）：\n\n| 文件 | 后缀（常见） | 内容 |\n|:---|:---:|:---|\n| 顶层铜箔 | GTL | 顶层走线与铺铜 |\n| 底层铜箔 | GBL | 底层走线与铺铜 |\n| 内层信号/电源 | G1/G2… | 各内层（内电层注意正负片设置） |\n| 顶层阻焊 | GTS | 阻焊开窗（露焊盘的地方） |\n| 底层阻焊 | GBS | 同上 |\n| 顶层丝印 | GTO | 顶层文字/图形 |\n| 底层丝印 | GBO | 底层文字/图形 |\n| 钻孔文件 | DRL（Excellon 格式） | 孔位与刀径 |\n| 板边框 | GKO / Outline | 板子外形 |\n| 顶层贴片 | GTP | 钢网开孔（SMT 用） |\n| 底层贴片 | GBP | 同上 |\n| 坐标/装配文件 | TXT/CSV | 贴片机取料坐标（SMT 用） |\n\n**格式常识**：Gerber 主流格式为 RS-274X（扩展 Gerber，图形信息自带，单文件即可用），老旧的 RS-274D 需要配套光圈表、易出错，基本淘汰；钻孔文件用 Excellon 格式；输出时注意**单位（公制 mm/英制 inch）与精度（如 2:4、2:3）要前后统一**。部分大厂接受 ODB++ 或 IPC-2581 这类智能格式，能携带更多工艺信息。\n\n**输出前检查（照着做一遍）**：\n\n1. 层叠对应：导出的层顺序、层数与叠构一致，内电层的正片/负片（Negative）极性正确——负片层极性反了就是\"该留的铜全被蚀刻掉\"；\n2. 阻焊层检查：所有需要焊接的焊盘都开了窗（包括手焊的通孔、测试点）；不想露铜的地方没有误开窗；\n3. 丝印检查：没有压焊盘、没有超出板框、字符方向统一（贴片面从左到右、从下到上阅读）；\n4. 钻孔检查：孔径分档齐全，过孔与焊盘一一对齐，没有\"忘了输出的孤立孔\"；\n5. 板框：闭合、单一、无多余断线。\n\n**CAM 检查**：用 CAM350、GerbTool、KiCad 自带 Gerber 查看器，或打样平台的上传预览/DFM 分析工具（如嘉立创下单助手的预览）打开你导出的文件逐层看：\n\n- 各层叠起来对不对齐（对着钻孔层看偏移）；\n- 用网表比对功能（部分工具支持导入 IPC-D-356 网表）核对连通性与设计一致；\n- 3D 预览最后过一眼整体效果。\n\n**归档习惯**：文件打包命名\"项目名_版本_层数_日期\"，连同 BOM、坐标文件、层叠说明一起存档。版本管理从打样这一步就要养成——工厂是按你上次的文件返单的，版本一乱就是批量事故。\n\n**输出参数设置与三起常见\"翻车事故\"**：\n\n- 事故一：钻孔文件单位英制、Gerber 公制，孔整体偏移对不上焊盘 → 统一单位与精度；\n- 事故二：内电层没按负片（Negative）输出，电源层铜箔被全部蚀刻掉 → 输出前逐层预览确认极性；\n- 事故三：忘了输出边框层，工厂不知道板子多大，工程询问来回耽误一周 → 输出模板里固定包含边框与钻孔。\n\n对策：在 EDA 里建一套固定的输出模板（含全部层与钻孔），每次只做微调；收到板厂的工程确认问题（EQ）时逐条书面回复，不要口头。\n\n### 15.2 原理图解读：拿到别人的图怎么快速看懂\n\n工作中你收到的大多是别人画的原理图（芯片原厂参考设计改的、离职同事留下的）。目标是**快速建立框架，按需下钻细节**，不要从左上角逐个元器件硬啃。\n\n**推荐流程（六步法）**：\n\n1. **看图纸信息**：标题栏、版本号、修改记录、页码——先知道这是什么板、改过几版、哪页是什么。\n2. **先找电源树**：从电源输入端开始追——输入（USB/适配器/电池）→ 保护（保险丝/防反接）→ 变换（DCDC/LDO 各路输出）→ 分配到各用电模块。**自己动手画一张电源树图**（哪路电压、多大胆流、给谁用），这是看懂任何板子的第一把钥匙。\n3. **再找主控**：定位 CPU/MCU，把它的引脚按功能分组看——电源、时钟（晶振）、复位、调试（JTAG/SWD/UART）、存储、各接口。主控一通，全图皆活。\n4. **模块化阅读**：按接口单元逐块看——USB、网口、显示、音频、传感器……每块对照第 10、11、18、12 课学
