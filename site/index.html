压。\n\n有效值的定义非常实在：一个交流电压加在电炉上发热，和某个直流电压发热一样快，这个直流值就是交流的\"有效值\"。**220V 交流点电炉，和 220V 直流点同一台电炉，发热完全相同。**电表收电费，按它算。\n\n类比\"**平均战斗力**\"：交流电压出拳忽轻忽重（0 → 311 → 0 → −311 循环），我们用一记稳定输出的\"220V 直流拳\"来等效它——总战果（发热）一模一样。220V 说的是平均战力，311V 才是单拳最重的一击。\n\n对**无直流偏置的正弦波**，换算关系为：**有效值 = 峰值 × 0.707**（0.707 ≈ 1/√2）；其他波形或有直流偏置时须按有效值定义计算。反过来由有效值求幅值，一步不跳：\n- 幅值 = 有效值 ÷ 0.707\n- = 220 ÷ 0.707\n- ≈ **311V**\n\n峰峰值再翻倍：311 × 2 = 622V。\n\n❌ **误解**：\"插座写着 220V，那最高就是 220V。\"\n\n✅ **正解**：在题设理想正弦条件下，220V 是有效值，瞬时最高约 +311V、最低约 −311V，峰峰值约 622V。实际器件需按工作电压、浪涌、额定交流或直流条件及适用标准选型；电气间隙和爬电距离不能仅凭 311V 确定。把 220V 当最高值，是经典的翻车点。\n\n#### 03.6.4 从插座到手机：充电头里发生了什么（预告）\n\n你的充电头内部是一条四步流水线：\n\n以常见隔离式开关电源为例：\n\n1. **输入整流与滤波**：市电经整流、滤波形成高压直流；\n2. **高频变换与隔离**：开关器件将高压直流变成高频脉冲，经高频变压器传递能量并提供隔离；\n3. **输出整流与滤波**：次级信号整流、滤波，得到低压直流；\n4. **反馈稳压**：通过控制开关工作状态维持所需输出电压。不同拓扑与充电协议的输出电压并不相同。\n\n每一环分别在第 04 课（二极管）和第 10 课（电源模块）展开。现在能看懂这条流水线的\"字幕\"就够了。\n\n**这在板子上**：凡是从插座取电的板子，第一件事就是把 311V 的\"重拳\"挡在安全区外——耐压、绝缘、爬电距离，还需考虑最高市电、电路拓扑、浪涌、适用安规及环境，不能只依据 311V 确定。\n\n**停下来检查**\n\n1. 无直流偏置的正弦波幅值 10V，峰峰值是多少？有效值约是多少？\n2. 220V 市电的幅值是多少？写出换算式。\n3. 100Hz 的正弦波，周期是多少毫秒？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 无直流偏置的正弦波幅值 10V，峰峰值是多少？有效值约是多少？**\n峰峰值 = 2 × 10 = 20V；有效值 = 10 × 0.707 = 7.07V。\n\n**2. 220V 市电的幅值是多少？写出换算式。**\n幅值 = 220 ÷ 0.707 ≈ 311V。\n\n**3. 100Hz 的正弦波，周期是多少毫秒？**\nT = 1/100 秒 = 0.01 秒 = 10ms。\n\n<\/details>\n\n### 03.7 模拟信号 vs 数字信号\n\n#### 03.7.1 调光台灯 vs 开关灯\n- **模拟信号（analog）**：连续变化，可以取任意值——像**调光台灯**，亮度从 0% 到 100% 随便调，中间每个亮度都存在\n- **数字信号（digital）**：信息按离散状态表示；本课程主要学习二进制信号，用两种逻辑状态表示 0 和 1。物理波形仍需经过电平转换，且也存在多电平数字信号。\n\n典型代表：模拟有麦克风输出（声音→电压连续起伏）、温度传感器电压、电位器分压；数字有单片机 IO 口电平、U 盘里的数据、UART / SPI / I2C 总线（芯片之间相互传数据的几种约定）。\n\n为什么要分清？因为真实世界（声音、光、温度）天生是模拟的，而计算机内部全靠数字。两者之间的\"翻译官\"是 ADC / DAC（模数 / 数模转换器），后面的项目课会亲手用到。\n\n#### 03.7.2 方波与上升沿\n\n周期性数字时钟可用**方波**示意；数字数据的高低状态不一定周期重复：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 210\" width=\"470\" height=\"210\" role=\"img\"><line class=\"wv-axis\" stroke=\"currentColor\" x1=\"55\" y1=\"152\" x2=\"450\" y2=\"152\"/><polyline class=\"wv-curve\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" points=\"100,55 176,55 182,135 324,135 330,55 420,55\"/><text x=\"8\" y=\"59\" text-anchor=\"start\" font-size=\"10\" class=\"wv-lab\">高电平 ≈3.3V<\/text><text x=\"8\" y=\"139\" text-anchor=\"start\" font-size=\"10\" class=\"wv-lab\">低电平 ≈0V<\/text><text x=\"179\" y=\"166\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-em\">↓下降沿<\/text><text x=\"327\" y=\"166\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-em\">↑上升沿<\/text><text x=\"450\" y=\"152\" text-anchor=\"end\" font-size=\"10\" class=\"wv-lab\">时间 →<\/text><line class=\"wv-dash\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" x1=\"100\" y1=\"55\" x2=\"100\" y2=\"184\"/><line class=\"wv-dash\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" x1=\"330\" y1=\"55\" x2=\"330\" y2=\"184\"/><line class=\"wv-axis\" stroke=\"currentColor\" x1=\"100\" y1=\"178\" x2=\"330\" y2=\"178\"/><text x=\"215\" y=\"195\" text-anchor=\"middle\" font-size=\"10\" class=\"wv-lab\">一个周期（高电平＋低电平）<\/text><\/svg>\n```\n- **上升沿（rising edge）**：从低跳到高的那一下；**下降沿**：从高跳到低的那一下\n- 理想方波是垂直跳变；现实的沿都带一点斜坡，快慢常以纳秒计——原因正是本课讲的道理：任何电路里都藏着小电阻小电容，把\"瞬间跳变\"磨成\"极快的渐变\"\n- **占空比**：高电平时间占一个周期的比例。高 1ms、周期 2ms → 占空比 50%。以后会碰到的\"PWM 调光调速\"，本质就是飞快地开关灯 + 控制占空比\n- **频率**：周期性波形每秒重复的周期数，单位 Hz。SPI 的时钟频率可用 MHz 表示；UART 的 115200 是每秒符号数（波特率），不能直接当作信号固定频率\n\n读波形是硬件调试的基本功：在示波器上一眼看出\"周期多少、幅度多少、上升沿干不干净\"，比万用表快得多——第 06 课将学习仪器使用和测量。\n\n#### 03.7.3 高和低是\"区间\"，不是\"精确值\"\n\n数字电路怎么判断 0 和 1？靠**阈值**。以常见的 3.3V 单电源逻辑为例（具体数值以芯片手册为准）：\n- 高于约 2V → 判\"1\"\n- 低于约 0.8V → 判\"0\"\n- 0.8V ~ 2V 之间 → **未定义区**，信号不许停在这里\n\n所以\"3.3V 逻辑\"并不要求信号精确等于 3.3V 或 0V——在一个很宽的区间里都算数，这正是它皮实耐造的原因（见下一节）。顺带一个坑：5V 器件和 3.3V 器件的区间不一样，互连之前必须查手册确认电平兼容——接口电路的常客，后面的课程会细说。\n\n#### 03.7.4 数字信号为什么抗干扰强\n- 模拟：信号 1.25V，路上叠了 10mV 噪声 → 真的变成 1.26V，误差原样混进结果。谁踩它一脚，它就错给谁看\n- 数字：信号 3.3V，叠同样的噪声 → 还是\"高\"，判出来还是 1。**只要噪声不把电压推进另一个区间，判决结果纹丝不动**\n\n类比：传**悄悄话**（模拟）——路上谁咳嗽一声都可能听错；喊**口令**（数字）——风再大，只要听得清\"一——二——\"，内容就不会错。\n\n再加一条：数字只有两种状态，复制、存储、纠错都容易——这就是计算机内部和通信总线几乎全用数字的原因。而真实世界的声、光、温度是模拟的，中间的翻译官就是 ADC/DAC，模拟进、数字出，是后面项目课的重头戏。\n\n**这在板子上**：单片机板上可能同时有数字波形、模拟信号和电源波形。调试时拿示波器看一眼时钟、复位、串口的波形，是最基本的日常——而现在你已经认识方波和上升沿了。\n\n**停下来检查**\n\n1. 麦克风的输出和单片机 IO 口的输出，谁是模拟谁是数字？\n2. 上升沿是什么？为什么现实中的上升沿不是垂直的？\n3. 3.3V 数字信号上叠了 0.5V 噪声，一定会出错吗？为什么？\n\n<details>\n<summary>参考答案<\/summary>\n\n**1. 麦克风的输出和单片机 IO 口的输出，谁是模拟谁是数字？**\n麦克风是模拟（电压随声音连续起伏，可取任意值）；IO 口是数字（只有高/低两种状态）。\n\n**2. 上升沿是什么？为什么现实中的上升沿不是垂直的？**\n上升沿是信号从低电平跳到高电平的过渡过程。现实电路里到处是小电阻小电容，它们按 RC 的规律把\"瞬间跳变\"磨成\"极快但有限的渐变\"。\n\n**3. 3.3V 数字信号上叠了 0.5V 噪声，一定会出错吗？为什么？**\n不一定。只要噪声没把信号推出它的判决区间（仍需确认实际高低电平、噪声方向、接收端阈值和采样时刻），读出来的 0/1 就不变——这正是数字抗干扰强的原因。\n\n<\/details>\n\n### 03.8 电信号专题：怎样读懂一条波形\n\n前面介绍了电容、电感和交流。本专题把信号当作随时间变化的电压或电流，说明如何从波形读出信息。模拟信号与数字信号都是实际电压或电流；区别在于信息的表示和判读方式。\n\n#### 03.8.1 电信号是什么，参照点在哪里\n\n麦克风把声音变化转换为电信号，温度传感器可以输出随温度变化的电压，单片机引脚也可以输出高低电平。信号电压总是两个节点之间的电压：例如“输出 1.2V”必须说清是相对哪个参考点；差分信号则关注两根信号线之间的电压。\n\n模拟信号在工作范围内可以连续变化；数字信号用约定的电压区间表示逻辑状态，但实际边沿仍连续变化，有噪声和传输延迟。固定高电平或任意数字数据不一定是周期方波。\n\n#### 03.8.2 波形的幅度、周期和频率\n\n| 名称 | 含义 | 例子 |\n|---|---|---|\n| 峰值 | 相对参考点的最大幅度，必须说明参考点 | 以 0V 为中心的正弦波峰值为 2V |\n| 峰峰值 Vpp | 最大值减最小值 | 从 −2V 到 +2V，Vpp＝4V |\n| 周期 T | 周期信号重复一次的时间 | 2ms |\n| 频率 f | 每秒重复的周期数，`f=1/T` | T＝2ms，则 f＝500Hz |\n| 占空比 | 周期内指定状态持续时间与周期之比 | 高电平 0.5ms、周期 2ms，D＝25% |\n| 直流偏置 | 波形的平均值或指定直流工作点 | 0～3V 对称方波的平均值为 1.5V |\n\n正弦波若无直流偏置，其有效值 `Vrms=Vp/√2`；这是特定波形的关系，其他波形必须按其定义计算。有效值与相同电阻产生相同平均热功率的直流电压对应，不是简单的算术平均值。\n\n#### 03.8.3 PWM、时钟与数据有什么不同\n\n时钟是为电路提供时间基准的周期信号；PWM（脉宽调制）利用脉冲宽度或占空比表达控制量；UART 等数据线的高低状态按协议和时间承载数据，未必固定周期。假设理想 0～3.3V PWM 的占空比为 25%，一个周期内平均电压为 0.825V；这是数学平均值，负载是否真正得到稳定直流取决于滤波、负载与频率。\n\n#### 03.8.4 看信号先问什么\n\n先确定参考地或差分测量方式，再问：信号范围是多少？是否周期？频率与边沿有多快？谁驱动、谁接收？输出和输入的电压范围是否匹配？测量仪器的带宽、探头和接地方式是否适用？示波器与信号发生器的使用细节见第 06 课。\n\n**练习与答案：**① 一个方波周期 4ms，高电平 1ms，其频率为 **250Hz**、高电平占空比为 **25%**。② 波形从 1V 到 3V，Vpp 为 **2V**；仅凭最大、最小值不能确定任意波形的有效值或平均值。③ 3.3V 供电的器件输出能否被 5V 逻辑识别，应比较具体 VOH/VOL 与 VIH/VIL，并核对绝对最大额定值和掉电状态，不能只看电源名称。\n\n资料衔接：DragonClass《01 电路基础》与《09 数字电路》；更具体的频率响应参见 [ADI 低通与高通滤波基础](https://www.analog.com/en/resources/analog-dialogue/studentzone/2019/07/25/14/51/studentzone-october-2018.html)。\n\n## 🔧 动手练习\n\n| # | 练习内容 | 完成标准 |\n|---|---------|---------|\n| 1 | τ 计算三连（练习 A） | 全对，每题写出完整单位换算过程 |\n| 2 | 慢镜头推演（练习 B） | 每个时间点的电压、电流数值全对 |\n| 3 | 正弦波识读（练习 C） | 五个参数全部求出，写出公式代入 |\n| 4 | 定性判断（练习 D） | 全对，每条说得出\"通/堵\"的理由 |\n| 5 | 打开配套仿真 | RC 仿真里验证 1τ 处约 63%；电感仿真里对比加缓冲前后的尖峰 |\n| 6 | 找实物 | 在手边任何一块电路板上找出 5 颗电容，按\"去耦 / 耦合 / 其他\"分类并说明理由 |\n| 7 | 查继电器模块 | 上网找一张\"继电器模块\"原理图，找到续流二极管，说明它给谁续流、断电瞬间电流走哪条路 |\n| 8 | 讲给别人听 | 用\"海绵\"和\"飞轮\"，给家人讲清电容和电感各自存什么、脾气是什么 |\n\n### 练习 A：τ 计算三连\n\n**A1**：R = 10kΩ、C = 100μF。τ = ? 充到约 95% 需要多久？（要求写出单位换算全过程）\n\n**A2**：想要一个时间常数 τ = 1 秒的 RC 环节，手头已有 R = 100kΩ，C 应取多大？（用 μF 表示）\n\n**A3**：示波器看到某 RC 电路充电到终值的 63% 用了 5ms，已知 R = 1kΩ，C 是多少？\n\n### 练习 B：慢镜头推演\n\n电路：理想 5V 电源、R = 1kΩ、C = 1000μF 串联，电容起初未充电。求：（1）τ = ?（2）合上开关的第 0 时刻，电流多大？（3）1τ 时，电容电压多少伏？电阻两端多少伏？电流多大？\n\n### 练习 C：正弦波识读（文字版\"示波器截图\"）\n\n示波器屏幕上一个正弦波：最低点 −4V，最高点 +4V；水平方向一个完整周期占 5 格，时基调到 2ms/格。求：幅值、峰峰值、有效值、周期、频率。\n\n### 练习 D：定性判断\n\n对下面每种情形，判断元件是\"通\"还是\"堵\"，并用一句话说理由：\n\n1. 100μF 电容，对稳恒直流（充满之后）\n2. 电感，对稳恒直流\n3. 电容，对高频小信号\n4. 电感，对高频小信号\n5. 音频耦合电容，对前级的直流偏置\n\n<details>\n<summary>练习 A～D 参考答案（点击展开）<\/summary>\n\n**A1**：10kΩ = 10000Ω；100μF = 100 × 0.000001 = 0.0001F；τ = 10000 × 0.0001 = 1 秒。95% ≈ 3τ = 3 秒。\n**A2**：C = τ / R = 1 秒 ÷ 100000Ω = 0.00001F = 10μF。\n**A3**：充到 63% 对应 1τ，故 τ = 5ms；C = τ / R = 0.005 ÷ 1000 = 0.000005F = 5μF。\n\n**B**：（1）τ = 1000 × (1000 × 0.000001) = 1000 × 0.001 = 1 秒。\n（2）第 0 时刻电容 0V，电阻扛全部 5V：I = 5V ÷ 1kΩ = 5mA，全程最大。\n（3）1τ 时电容充到 63%：U_C = 5 × 0.63 = 3.15V；电阻两端 = 5 − 3.15 = 1.85V；I = 1.85V ÷ 1kΩ = 1.85mA。\n\n**C**：幅值 = 4V；峰峰值 = 4 × 2 = 8V；有效值 = 4 × 0.707 ≈ 2.83V；周期 = 5 格 × 2ms/格 = 10ms；频率 = 1/0.01s = 100Hz。\n\n**D**：1. 理想电容在直流稳态电流为 0，真实电容可能存在漏电；2. 理想电感在稳恒直流下压降为零，真实电感还有绕组电阻；3. 理想电容的容抗随频率上升而减小；4. 理想电感的感抗随频率上升而增大。实际元件还受寄生参数与自谐振限制；5. 堵——耦合电容的本职就是挡直流、放交流。\n\n<\/details>\n\n## ✅ 自测清单\n\n- [ ] 能用海绵/水库类比讲清电容存的是电荷，电压只是\"水位刻度\"\n- [ ] 能用慢镜头说出充电全程：电压先快后慢逼近上限，电流从最大逐渐趋近于零\n- [ ] 能默写 τ = RC，并一步不跳算出 10kΩ × 100μF = 1 秒（含单位换算）\n- [ ] 能背 1τ→63%、3τ→95%、5τ 约 99.3%，是否够用取决于允许误差，以及放电 1τ 后剩 37%\n- [ ] 能说出\"电容电压不能突变、电感电流不能突变\"这对镜像\n- [ ] 能各举一个板子场景说明 RC 三大应用：去耦（100nF 贴引脚）、耦合（串在信号路径）、上电复位延时\n- [ ] 能解释理想电容的交流电流与反复充放电，并知道实际介质存在漏电\n- [ ] 能用飞轮类比解释断开电感为什么出高压，以及续流二极管怎么救场\n- [ ] 能解释理想电容、电感的频率趋势，并说出真实器件受寄生参数和自谐振限制\n- [ ] 能用一句话说清\"阻抗\"是交流世界的总阻力\n- [ ] 能对无直流偏置的正弦波使用 Vpp = 2×峰值、有效值 = 峰值 × 0.707，并对周期信号使用 T = 1/f\n- [ ] 能写出 220V → 幅值 311V 的换算（220 ÷ 0.707 ≈ 311），并说明实际耐压与安规要求还要考虑器件类型及浪涌\n- [ ] 能区分模拟/数字信号并各举 2 例，用\"悄悄话 vs 喊口令\"讲清数字抗干扰\n- [ ] 能说出\"高频下走线不再是导线\"，并知道该话题在第 19 课展开\n\n## ⚠️ 新手常见坑\n\n1. **把 τ 当\"充满时间\"**：1τ 才 63%；3τ 达到约 95%，5τ 达到约 99.3%；是否够用应按允许误差决定。τ 只是\"刻度尺\"，不是终点线。\n2. **单位不换算就直接乘**：看到 10 × 100 = 1000 就写\"τ = 1000 秒\"？错。必须先化成 Ω 和 F：10000 × 0.0001 = 1 秒。τ = RC 的计算错误，十个有九个坑在单位。\n3. **把 220V 当最高电压**：220V 是标称有效值；对于无偏置的理想正弦，峰值约 +311V、峰峰值约 622V；实际市电与瞬态可能不同；市电侧器件还需按额定电压类型、浪涌和适用标准选型。\n4. **忘了续流二极管**：驱动继电器、马达、电磁阀，线圈两端必加，反向并联。不加，自感高压迟早击穿驱动管——\"莫名损坏\"基本就是它。\n5. **去耦电容随手乱放**：100nF 必须紧贴芯片供电引脚，放远了走线电感会把它的高频作用抵消掉，水杯形同虚设。\n6. **把峰峰值当有效值**：对无直流偏置的正弦波，峰峰值除以 2 得峰值，再除以 √2 得有效值；其他波形或存在偏置时不能照搬，应按波形定义计算。\n\n## 📚 延伸学习\n\n- B 站搜索关键词：\"电容充放电 动画\"、\"RC 时间常数 通俗\"、\"电感 续流二极管 为什么\"、\"正弦波 峰值 有效值\"、\"模拟信号 数字信号 区别\"\n- 经典教材参考：初中物理\"电与磁\"章节（帮着建立磁场的画面感，选读）；邱关源《电路》一阶动态电路章节（选读，能看多少看多少，不强求）\n- 仿真实践：EveryCircuit（手机 App，看电容充放电、电感续流的动画最直观）；LTspice 瞬态分析复现 03.2.2 的 RC 慢镜头\n- 生活观察：数一数家里充电器或旧电路板上的电容个数；下次按开发板的 RESET 键，告诉自己\"一颗电容正在从 0V 往上爬\"\n- 承上启下：本课之后进入第 05 课常见电路基础，再在第 05、06 课认识元器件与学习测量。","taskSignature":"9cc627bdd7457e449538aeb462246ce1488a25700d89df35f7883a79a0ee4aa7","taskCount":14},{"id":"04","title":"第 04 课 · 硬件基础","short":"硬件基础","stage":1,"diff":2,"prev":"第 01～03 课 · 电学、电路分析与电信号","optional":false,"md":"## 🎯 本课目标\n\n本课面向初学者。完成后，你应该能：\n\n1. 识别电阻、电容、电感、二极管、三极管、MOS 管和运放，并说明各端子的作用。\n2. 分别解释它们的基本工作过程和常见类型，读懂给出的低压典型电路。\n3. 区分 NPN 与 PNP、NMOS 与 PMOS，结合具体引脚电压分析开关状态。\n4. 理解参数的含义，结合使用条件查看数据手册，完成基本计算和选型。\n5. 从连接、电压与电流路径入手分析故障；具备条件时在安全低压下测量并记录。\n\n## 📖 正文\n\n> **读图与仿真：**以下图示可直接观察连接和工作状态。图中为理想化教学模型，元件数值可能与附近的计算题不同；点击“放大查看”可操作，仿真不代表实际器件已测试。\n\n此前已经学过电压、电流、串并联和基本信号。本课要把这些知识放到真实的器件和电路中。每个模块先回答“它是什么、为什么这样工作、怎样接”，再讲参数与进阶案例。遇到不熟悉的公式，可先回看第 01～03 课。\n\n### 04.1 从一块 PCB 到一张原理图\n\n**PCB** 是印刷电路板：绝缘基材提供机械支撑，铜层中的走线、焊盘和过孔实现连接；表面的阻焊层保护铜并减少焊接时的意外搭连，丝印则标注位号、方向等信息。单面、双面或多层板指铜层数量；过孔可连接指定铜层。\n\n**原理图**用符号与连线表示电气关系，并不表示元件在板上的真实位置。位号如 R1、C1、Q1、U1 用于区分同一电路中的器件实例；数值或型号说明器件规格。符号、封装和实物脚位需要通过完整料号与手册对应，丝印只能提供线索。\n\n先看一条简单支路：\n\n```text\n5V 电源正端 ── R1 限流电阻 ── LED 阳极 → 阴极 ── GND\n```\n\n在电源、元件和返回路径正确连接并满足条件时，电流经过 R1 和 LED 返回电源。R1 限制电流，LED 发光。接下来逐个学习元件，最后把它们重新连成系统。\n\n### 04.2 读图前先统一几个概念\n\n- **节点：**由导线连接成同一电气连接点的部分。图中连线交叉是否连接，应看节点标记及 EDA 工具的网络信息。\n- **电压与参考：**电压是两点之间的电位差；说“节点为 3.3V”通常是指它相对于指定参考地。GND 是电路参考网络，不一定是大地。\n- **通路：**电流必须有完整的去路和返回路径；器件标称可以导通，不等于实际电路已形成通路。\n- **高边和低边：**开关位于电源与负载之间称高边；位于负载与返回地之间称低边。判断时仍要看实际连接。\n- **常见缩写：**MCU 是单片机；GPIO 是可配置的通用输入/输出引脚；ADC 是将模拟电压转换为数字读数的电路。\n- **引脚与封装：**原理图符号表达电气功能，封装表达实物和焊盘位置。同一个封装的不同器件未必具有相同引脚定义。\n\n### 04.3 怎样学习每类器件\n\n每个模块的基础原理与典型电路属于**核心掌握**，参数、类型和识别属于**熟悉应用**，标为进阶的案例可以学完基础后回看。\n\n每个模块依次回答五个问题：**是什么、怎样工作、有哪些类型、怎样接入电路、怎样按条件选择和验证。**先掌握基本工作状态，再学习实际参数和优缺点；进阶计算可以在完成基本练习后回看。\n\n选取具体器件时，记录制造商、完整型号、功能、引脚、封装、工作条件、主要规格、手册版本及待验证事项。下文的电压、电流和元件值若标为“假设”，只用于解释原理，不能直接当作真实器件规格。\n\n### 04.4 七类核心器件：七个独立模块\n\n按电阻 → 电容 → 电感 → 二极管 → 三极管 → MOS 管 → 运放的顺序学习；每个模块包含原理识别、参数、典型应用、选型与练习。可分次完成，不以课时划分。\n\n#### 04.4.1 电阻（Resistor）：电路里的\"减速带\"\n\n**学习目标：**能说出电阻怎样限制电流、怎样分压，并能根据电路估算阻值和功耗。\n\n##### 先认识它：电流为什么需要限制？\n\n一只普通 LED 接到电源上时，如果没有限流，电流可能超过 LED 能承受的范围。把电阻串入这条电流通路，电阻会分担一部分电压，使电流受到限制。除了限流，电阻还可以分压、设定引脚状态和测量电流。\n\n**电阻器**是用于提供一定电阻的两端元件；**电阻值**是衡量它对电流阻碍程度的量。常用单位是 Ω（欧姆）、kΩ 和 MΩ，1kΩ＝1000Ω，1MΩ＝1000kΩ。原理图中通常以矩形或锯齿形符号表示，位号为 R，如 R1；符号旁的 1kΩ 是标称阻值。普通固定电阻无正负极，但实际尺寸和功率有限。\n\n在线性电阻温度等条件基本不变时，电阻两端电压 `U`、流过它的电流 `I` 和阻值 `R` 满足 `I=U/R`。这里的 U 是**电阻两端的电压差**，不总等于电源电压。同样的电压下，阻值越大，电流越小。电阻消耗的电功率可用 `P=UI=I²R=U²/R` 计算；能否长期使用还要查额定功率、温度和耐压。\n\n##### 电路一：LED 限流\n\n```svg\n<svg role=\"img\" aria-label=\"5伏电源经620欧电阻和LED接地的限流电路\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"103.25000000000003pt\" width=\"202.67300000000003pt\" viewBox=\"-9.072999999999999 -183.61 202.67300000000003 103.25000000000003\"><polygon points=\"137.7,-153 150.3,-144 137.7,-135 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-144.0 L 18,-144 L 36,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 36.0,-144.0 L 54,-144 L 54,-153 L 90,-153 L 90,-135 L 54,-135 L 54,-144 M 90,-144 L 108,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 108.0,-144.0 L 137.7,-144 M 150.3,-153 L 150.3,-135 M 150.3,-144 L 180,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 146.70000000000002,-157.5 L 152.128,-166.999\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 154.708 -171.514 L 154.628 -165.57 L 149.627 -168.428 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 138.6,-157.5 L 144.028,-166.999\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 146.608 -171.514 L 146.528 -165.57 L 141.527 -168.428 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 180.0,-144.0 L 180,-126 L 180,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 180.0,-108.0 L 180,-93.6 L 171,-93.6 L 189,-93.6 M 173.7,-89.28 L 186.3,-89.28 M 178.2,-84.96 L 181.8,-84.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"3.6\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"3.6\" dy=\"13\">5V<\/tspan><\/text><text x=\"72.0\" y=\"-169.6\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">R1 620Ω<\/tspan><\/text><text x=\"144.0\" y=\"-144.4\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"144.0\" dy=\"13\">LED<\/tspan><\/text><\/svg>\n```\n\n\n```circuitjs\nled-resistor\n```\n\n```text\n5V 电源正端 ── R1 ── LED 阳极 → LED 阴极 ── GND（电源负端）\n```\n\n假设电源为 5V、LED 在目标电流附近正向压降约 2V，计划电流 5mA。电阻分担约 `5−2=3V`，初算 `R=3V/0.005A=600Ω`；选常见 620Ω，按相同假设电流约 4.84mA。电阻功耗约 `3V×0.00484A=0.0145W`。实际还要考虑电源、LED 压降和电阻容差，并核对 LED 电流及电阻额定功率。LED 正向压降随电流和温度变化，上述数字只是练习假设。\n\n##### 电路二：分压与负载\n\n下图为正文的 5V 空载算例；下方仿真采用 10V 电源，并额外展示多级分压，数值不同。\n\n```svg\n<svg role=\"img\" aria-label=\"两个电阻串联，中点作为输出的分压电路\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"168.34pt\" width=\"180.52999999999997pt\" viewBox=\"-68.60199999999999 -158.7 180.52999999999997 168.34\"><path d=\"M 0.0,-144.0 L 0,-135 L 0,-126\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-126.0 L 0,-117 L 9,-117 L 9,-81 L -9,-81 L -9,-117 L 0,-117 M 0,-81 L 0,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-72.0 L 0,-63 L 9,-63 L 9,-27 L -9,-27 L -9,-63 L 0,-63 M 0,-27 L 0,-18\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-18.0 L 0,-3.6 L -9,-3.6 L 9,-3.6 M -6.3,0.72 L 6.3,0.72 M -1.8,5.04 L 1.8,5.04\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-72.0 L 36,-72 L 72,-72\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"3.6\" y=\"-160.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"3.6\" dy=\"13\">5V<\/tspan><\/text><text x=\"-12.599999999999998\" y=\"-112.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-12.599999999999998\" dy=\"13\">R1 10kΩ<\/tspan><\/text><text x=\"-12.599999999999998\" y=\"-58.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-12.599999999999998\" dy=\"13\">R2 10kΩ<\/tspan><\/text><text x=\"93.60000000000001\" y=\"-88.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"93.60000000000001\" dy=\"13\">Vout<\/tspan><\/text><circle cx=\"0\" cy=\"-72\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```circuitjs\nvoltdivide\n```\n\n```text\n5V ── R1=10kΩ ──●── R2=10kΩ ── GND\n                  │\n               输出 Vout\n```\n\n输出端不接负载时，两只电阻串联，电流 `5V/20kΩ=0.25mA`；每只电阻分到 2.5V，因此 ● 相对地为 2.5V。若再接一个 10kΩ 负载从 ● 到地，负载与 R2 并联，等效为 5kΩ，输出变成 `5×5/(10+5)≈1.67V`。所以分压点不是不受负载影响的稳定电源。\n\n##### 电路三：上拉、下拉\n\n输入引脚未被驱动时可能浮空。用一个电阻把输入接到正电源称为**上拉**，把输入接地称为**下拉**。例如 3.3V 经 10kΩ 接输入，按键闭合时将输入接地：松开时输入通常为高电平，按下时为低电平；按下时约有 0.33mA 从电源经电阻和按键流向地。实际阻值要结合输入漏电、干扰与速度选择。\n\n##### 类型、识别与注意事项\n\n固定电阻用于提供标称阻值；电位器有两个固定端和一个滑动端，调节时可改变分压；NTC 的阻值通常随温度升高而下降，压敏电阻用于瞬态过压保护。它们的用途不同，不可仅因都有“电阻”二字就互换。下面继续学习标识、封装和选型。\n\n##### 原理图符号示意\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 180\" width=\"480\" height=\"180\" role=\"img\" aria-label=\"电阻的矩形与锯齿符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 90 H90 M160 90 H195 M335 90 H395\"/><rect x=\"90\" y=\"72\" width=\"70\" height=\"36\"/><path d=\"M225 90 H240 L247 75 L255 105 L263 75 L271 105 L279 75 L287 105 L295 75 L303 105 L311 75 L319 105 L327 90 H335\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"80\" y=\"48\">矩形电阻符号<\/text><text x=\"225\" y=\"48\">锯齿形电阻符号<\/text><text x=\"80\" y=\"150\">两种符号都表示同一个两端电阻。<\/text><\/g><\/svg>\n```\n\n图中是常见符号示意；实物引脚编号与极性仍以具体器件手册为准。\n\n##### 电阻的种类与如何识别\n\n固定电阻常见厚膜、薄膜、金属膜和绕线电阻；它们的精度、温漂、脉冲能力、寄生参数和功率因具体系列而异，不能只凭材料名判断。电位器有两个固定端和一个滑动端：三端作可调分压，两端可作可变电阻；数字电位器的供电、端电压、电流和掉电位置须查手册。NTC/PTC 热敏电阻随温度变化，光敏电阻随光照变化，应变片随机械应变变化；压敏电阻用于限制瞬态过压，不能代替普通定值电阻。\n\n| 常见封装 | 英制名义尺寸 | 入门辨认 |\n|---|---|---|\n| 0402 | 约 1.0mm × 0.5mm | 小，手焊与标识较困难 |\n| 0603 | 约 1.6mm × 0.8mm | 常见贴片规格 |\n| 0805 | 约 2.0mm × 1.25mm | 比较适合手焊练习 |\n| 1206 | 约 3.2mm × 1.6mm | 具体功率仍须查料号 |\n\n注意英制和公制代码可能冲突，须查尺寸而不是只看数字。四色环由两个有效数字、乘数和容差组成；五环通常是三个有效数字、乘数和容差。常用数字颜色依次为黑 0、棕 1、红 2、橙 3、黄 4、绿 5、蓝 6、紫 7、灰 8、白 9。黄紫红金按四环读为 47×100=4.7kΩ、±5%；金色也可能出现在乘数位置，读向不确定时查资料并测量。常见三位码 `473` 表示 47×1000=47kΩ，`4R7` 和 `R047` 在相应规则下分别表示 4.7Ω 和 0.047Ω。举例橙绿红金为 35×100=3.5kΩ、±5%。四位贴片标记 `4531` 常按 453×10¹=4.53kΩ 解读；但 EIA-96、R 小数点、无字和厂商专用编码并不遵循同一规则，必须查原厂资料。\n\n##### 从电路要求确定阻值\n\n**LED 限流**：假设供电 5V、LED 正向压降按 2V、目标电流 5mA，初算 `R=(5−2)/0.005=600Ω`。可从标准阻值中选择较大一档 620Ω，标称条件下约 4.84mA；还须以最大电源、最小 LED 压降、最小电阻核验最大电流，并核对亮度和功耗。LED 不应在没有限流的情况下直接跨接电源。\n\n**分压与负载**：5V 经 10kΩ 上臂和 10kΩ 下臂，无负载时输出 2.5V。如果输出再接一个 10kΩ 负载到地，下臂等效 5kΩ，输出约 1.67V。分压点不能默认当作稳定电源；ADC 输入采样电容、泄漏及采样时间也要结合芯片手册检查。\n\n**上拉/下拉**：3.3V 电源、10kΩ 上拉、开关闭合到地时，静态电流约 0.33mA；松开时把输入拉向高电平。阻值并非越大越好，还需考虑输入漏电、干扰和线路电容。开漏总线的上拉须结合所有器件、电容及上升时间设计。\n\n##### 选型、测量与故障\n\n检查阻值及容差、额定功率与工作电压、温度降额、温漂、封装和脉冲能力。电流采样电阻还要看四端测量、阻值温漂及功耗；0Ω 电阻有额定电流和阻值，不是无限载流的理想导线。用万用表测阻前先断电并放电，在板测量可能被并联通路拉低；必要时隔离后复测。\n\n##### 优点、局限与选择\n\n电阻适合限流、分压、上拉和取样，结构简单，通常价格低、使用方便；它的代价是通过电流时会发热。两个电阻组成的分压器也会受负载影响，不能直接替代稳压电源。具体优缺点取决于系列和工作条件：\n\n| 类型 | 常见优点 | 局限与适用场景 |\n|---|---|---|\n| 厚膜电阻 | 常见、成本通常较低，可覆盖一般阻值需求 | 精度、温漂及噪声依系列而异；适合一般限流、上拉，精密测量须核查指标 |\n| 薄膜电阻 | 有适合高精度、低温漂的产品 | 通常成本较高；脉冲和功率能力仍须按具体系列核对，适合精密分压与测量 |\n| 绕线电阻 | 有适合较高功率或脉冲负载的系列 | 部分结构的寄生电感较明显，可能不适合高频；具体看频率特性和手册 |\n| 电位器 | 可现场调整分压或阻值 | 机械磨损、接触变化及滑动端故障需考虑；适合调节，不一定适合长期高可靠固定参数 |\n\n**怎么选：**指示灯限流先算最坏功耗与耐压；测量分压再看精度、温漂和负载。不能仅凭“薄膜”或封装尺寸保证精度、功率或脉冲能力。\n\n##### 进阶案例：容差如何改变分压结果\n\n**问题：**需要把最高 5.25V 的电源电压分压给允许输入不超过 3.3V 的 ADC；候选上臂 R1=10kΩ、下臂 R2=10kΩ，均为 ±1%。先忽略 ADC 漏电和采样动态，能否只看标称的 2.625V？\n\n输出最大值出现在上臂最小、下臂最大时：R1=9.9kΩ、R2=10.1kΩ，`Vout,max=5.25×10.1/(9.9+10.1)≈2.651V`。在这些假设下低于 3.3V；但还要核对 ADC 允许输入范围随供电变化的限制、供电关闭时的反灌、输入瞬态、采样电容与建立时间。仅凭静态电压计算不能判定全部场景安全。\n\n源端等效电阻约为 `R1∥R2≈5kΩ`。若 ADC 需要很低源阻抗或很短采样时间，必须按照具体 ADC 手册检查，不能把 ADC 固定等效为一个无限大电阻。分压功耗还要在最大输入电压下计算：忽略负载时总电流约 0.263mA，每只电阻约 0.69mW。\n\n**常见故障：**输出比空载计算明显偏低，先测实际输入和分压点，再断电检查阻值及下游负载；不要马上替换 ADC。输出电压过高时，检查电阻位置、虚焊和地连接；若下臂开路，输入可能经上臂接近整个电源电压。\n\n##### 🔧 动手练习与参考答案\n\n1. 四环橙绿红金是多少？**3.5kΩ ±5%**；四位 `4531` 按上述常见规则是多少？**4.53kΩ**。\n2. 5V 加在 100Ω 上，电流和功率是多少？**50mA、0.25W**；标称 0.125W 器件在该条件下过载，实际须再核查温度和耐压。\n3. 画出 3.3V 上拉按键电路，说明松开、按下电平，并核对输入耐压和电流。\n4. 按目标电路选择电阻：记录工作点、容差、最大功率、电压和完整料号；在板实测前写出并联通路可能造成的误判。\n5. 5V、两个 10kΩ 电阻串联且输出空载时，中点是多少？**2.5V**。若在下臂并联 10kΩ 负载，输出约 **1.67V**；负载改变了下臂的等效阻值。\n\n##### ✅ 自测清单\n\n- [ ] 能区分标称值、容差、功率、工作电压和温度降额。\n- [ ] 能计算 LED 限流与分压负载效应，并说出电位器的三个端子。\n- [ ] 知道断电测阻及在板测量的限制。\n\n##### 📚 延伸学习\n\n[嘉立创元器件基础](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)中的电阻识别与应用；具体参数及标识以所选电阻厂商手册为准。\n\n#### 04.4.2 电容（Capacitor）：存电荷的\"小水池\"\n\n**学习目标：**能解释电容两端电压如何变化，并区分充放电、去耦、滤波和信号耦合。\n\n##### 先认识它：为什么电源旁边常有电容？\n\n芯片工作时，电流需求可能突然变化，而电源和走线不能在所有频率上立刻响应。靠近芯片电源端的电容可以在短时间内提供或吸收一部分电荷，帮助减小局部电压波动。这是**去耦**的一种作用；它不能代替电源，也不能保证消除所有噪声。\n\n电容由两个导体和中间的绝缘介质构成，有两个端子；电容器储存电荷与电场能量。原理图位号通常为 C，如 C1；普通电容符号常画成两条平行线。有极性电容会标出正极，实际连接方向必须查具体器件标记和手册。电容量单位依次有 F、μF、nF、pF：`1μF=1000nF`，`1nF=1000pF`。\n\n##### 充电与放电到底发生了什么？\n\n下图是正文的充电算例；互动仿真的元件值和开关接法以仿真窗口为准。\n\n```svg\n<svg role=\"img\" aria-label=\"5伏电源通过开关和10千欧电阻为100微法电容充电\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"137.04pt\" width=\"240.95600000000005pt\" viewBox=\"-27.073 -145.4 240.95600000000005 137.04\"><path d=\"M 0.0,-108.0 L 18,-108 M 26.64,-111.6 L 46.8,-124.2 M 54,-108 L 72,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-108.0 L 90,-108 L 90,-117 L 126,-117 L 126,-99 L 90,-99 L 90,-108 M 126,-108 L 144,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-108.0 L 162,-108 L 180,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-108.0 L 144,-75.24 M 153,-75.24 L 135,-75.24 M 153,-68.76 L 135,-68.76 M 144,-68.76 L 144,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-36.0 L 144,-21.6 L 135,-21.6 L 153,-21.6 M 137.7,-17.28 L 150.3,-17.28 M 142.2,-12.96 L 145.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-14.4\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-14.4\" dy=\"13\">5V<\/tspan><\/text><circle cx=\"22.32\" cy=\"-108\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"49.68\" cy=\"-108\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"36.0\" y=\"-140.8\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"36.0\" dy=\"13\">S1<\/tspan><\/text><text x=\"108.0\" y=\"-133.60000000000002\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"108.0\" dy=\"13\">R 10kΩ<\/tspan><\/text><text x=\"201.6\" y=\"-124.60000000000001\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"201.6\" dy=\"13\">Vc<\/tspan><\/text><text x=\"131.4\" y=\"-85.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"131.4\" dy=\"13\">C 100µF<\/tspan><\/text><circle cx=\"144\" cy=\"-108\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```circuitjs\nrc-charge\n```\n\n给一个原先未充电的电容通过电阻接上直流电源，电源推动电荷重新分布，电容两端电压逐渐上升；这个过程中回路中有电流。电容电压越接近电源，电阻两端压差越小，充电电流也越小。理想情况下，经过足够长时间，电容电压接近电源电压，电流接近零。断开电源后，电容仍可能带电；接上合适的放电通路后才会释放能量。\n\n```text\n充电：  5V ── 开关 ── R=10kΩ ──●── C=100μF ── GND\n                               │\n                          测量电容电压\n```\n\n在理想模型中，时间常数 `τ=RC=10000Ω×0.0001F=1s`。从 0V 开始充电，约 1 秒时电容电压为最终值的 63%，即约 3.16V；约 5 秒时接近 5V。τ 不是“充满所需时间”，实际值受电阻、电容及电源影响。若要自行放电，必须先断电，按器件和测量条件使用合适的放电路径并确认电压。\n\n##### 并联去耦、串联耦合有什么不同？\n\n- **电源去耦：**电容跨接芯片电源脚与该电源的返回地，即并联在电源两端；尽量缩短电源引脚—电容—返回地的实际回路，并遵循芯片手册。\n- **整流后平滑：**电容并在负载两端，在输入较高时充电、输入下降时向负载供电，减小电压起伏；是否够用取决于负载、频率和容值。\n- **信号耦合：**电容串入信号路径，使两侧可以有不同的直流工作电位，变化的信号可通过；它与周围电阻一起决定低频响应，并非所有交流都无损通过。\n\n##### 串联与并联：容量如何变化？\n\n理想电容并联时，各电容两端电压相同，等效容量相加；两个 1μF 并联约为 2μF。理想电容串联时，等效容量为 `C1×C2/(C1+C2)`，两个 1μF 串联约为 0.5μF。实际串联时各电容分担的电压不一定相同，不能只把额定电压相加就认定安全，还应考虑漏电、均压和极性。\n\n##### 类型与选用\n\n陶瓷电容一般无极性，常用于去耦；铝电解电容常有极性，常用于较大容量储能；薄膜电容可用于信号与滤波；钽电容通常有极性。每种类型的容值、稳定性、漏电和损耗都依具体系列而变化。选型应先看需要的**实际有效容值**，再核对耐压、极性、容差、温度、ESR 与封装。下文将这些条件展开。\n\n##### 原理图符号示意\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 185\" width=\"480\" height=\"185\" role=\"img\" aria-label=\"无极性与有极性电容符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 90 H95 M95 55 V125 M110 55 V125 M110 90 H170 M250 90 H315 M315 55 V125 M330 55 V125 M330 90 H390\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"50\" y=\"40\">无极性电容<\/text><text x=\"255\" y=\"40\">有极性电容<\/text><text x=\"289\" y=\"72\">+<\/text><text x=\"30\" y=\"160\">每个元件均有两个端子；极性件按标识接线。<\/text><\/g><\/svg>\n```\n\n图中是常见符号示意；实物引脚编号与极性仍以具体器件手册为准。\n\n##### 电容类型、封装和极性\n\n| 类型 | 常见特点 | 选型重点 |\n|---|---|---|\n| MLCC 多层陶瓷 | 小型、常用于去耦；一般无极性 | 介质、直流偏压、温度、容差、ESR/ESL 与机械应力 |\n| 铝电解 | 容量较大，通常有极性 | 耐压、纹波电流、寿命、温度和极性 |\n| 钽电容 | 常见有极性，参数与系列有关 | 标识、耐压降额、浪涌及失效条件 |\n| 薄膜 | 不同介质特性不同，常用于滤波和脉冲 | 电压、脉冲电流、频率及尺寸 |\n| 超级电容 | 容量大但额定单体电压较低 | 均衡、漏电、充电限流及储能安全 |\n| X/Y 安规电容 | 应用于适用的交流电源抑制场景 | 按安全标准和具体产品认证选择；市电实践需专业条件 |\n\n直插铝电解常以外壳色带标负极；许多贴片钽电容以色带标正极，但形态不统一，必须查具体型号图纸。无丝印 MLCC 不能凭颜色确定容值。对常见以 pF 为单位的三位标记，`104` 通常是 10×10⁴pF=100nF，`223` 为 22nF；并非所有丝印都遵循此规则。\n\n##### 充放电、滤波与去耦\n\n理想恒定电容满足 `Q=CV`，RC 充电时间常数 `τ=RC`。1kΩ 和 100nF 的 τ 为 100μs；从 0V 经电阻接理想阶跃电源，约 1τ 时电容电压达到最终变化量的 63.2%。元件容差、信号源阻抗及负载会改变实际结果。\n\n去耦电容并接电源与地，目标是给附近电路提供瞬态电流并降低供电阻抗；电容值、数量、位置和回流都要按芯片指南设计。输入滤波、电源储能、信号耦合和计时虽然都用电容，对有效容值、ESR、耐压和频率的要求可能不同。\n\n**实际器件不是理想 C**：介质、电极、封装和连接引入 ESR、ESL 与漏电；电容的频率响应存在自谐振。MLCC 的有效电容可能随着直流偏压下降，电解电容需核对纹波电流和寿命。仅凭“10µF”字样不能判断 LDO 稳定或 USB 浪涌是否合格。\n\n##### 选型与测量流程\n\n1. 明确电路功能、实际电压范围、温度、频率和瞬态。\n2. 选择电容类型与封装，核对极性、额定电压、容差、偏压下有效容值、ESR 和纹波。\n3. 检查布局、焊接与机械应力；电源器件还应核对厂商稳定性区域。\n4. 断电并确认放电后测量；在板读数可能包含并联元件。LCR 仪表的频率、偏压和测试方式影响结果。\n\n##### 优点、局限与选择\n\n电容可以储能、去耦和耦合信号，但实际器件存在容差、漏电、等效串联电阻（ESR）及寄生电感；能否满足需求取决于电压、频率、温度和布局。\n\n| 类型 | 常见优点 | 局限与适用场景 |\n|---|---|---|\n| 多层陶瓷电容（MLCC） | 体积小、许多型号高频特性好，常用于芯片去耦 | X5R/X7R 等高介电常数介质的有效容值可能随直流偏压明显下降；部分产品对机械应力敏感，需查曲线与安装要求 |\n| 铝电解电容 | 常能以较小成本获得较大容量，适合电源储能和低频滤波 | 多数有极性；ESR、纹波电流和寿命受温度等影响，需要核对工作条件 |\n| 薄膜电容 | 多种系列具有较好的稳定性或低损耗，常用于信号、滤波和脉冲场合 | 相同容量下可能较大；耐压、频率和脉冲能力因系列而异 |\n| C0G/NP0 陶瓷电容 | 容值稳定性较好，适合精密定时和谐振等场合 | 可选容量和尺寸受产品系列限制，通常不用于需要大容量储能的位置 |\n\n**怎么选：**芯片去耦先查芯片手册及 MLCC 的有效容值；需要较大储能时比较电解、聚合物等方案。不同类型可以配合使用，但须共同满足稳压器的稳定性、纹波和布局要求。高介电常数 MLCC 的偏压特性可参考[村田的说明](https://www.murata.com/en-us/support/faqs/capacitor/ceramiccapacitor/char/0005)。\n\n##### 进阶案例：一个标称 10µF 不等于实际 10µF\n\n以稳压器输出为例，先把“最小有效电容”和“ESR 稳定范围”从所选器件手册中抄下来，再查具体电容在工作电压、温度、测试频率下的曲线，同时计入容差、老化与制造离散性。**没有可用曲线时只能记作待确认，不能用额定耐压反推有效容值。**\n\n例如某方案要求在实际工作条件下至少 4.7µF；假设某候选电容经过完整最坏条件评估后只有 4.0µF，则它不满足该假设条件，尽管本体标称 10µF。可以比较更大封装、更高额定电压或其他电容技术，但必须重新确认 ESR、空间、成本及瞬态行为。这个 4.0µF 只是演示数值，不是对某个料号的实测结论。\n\n**看布局：**电容的两个端子分别接到需要去耦的电源与返回网络，关注电源引脚—电容—地返回的实际路径。只量电容外壳距芯片多近，不能证明环路已经短；也不能保证任何单个电容覆盖所有频率。\n\n**看故障：**电源在突变负载下下陷或振荡，可能来自电源能力、负载、补偿、电容、布线或测量方式。使用适当仪器检查电压及工作条件，记录探头方式与负载；不得仅凭“加一颗 100nF 后似乎好转”就认定根因。\n\n##### 🔧 动手练习与参考答案\n\n1. `104` 若采用三位 pF 编码，是多少？**100nF**；无丝印电容不能仅靠外观定值。\n2. 10kΩ 和 100nF 的时间常数是多少？**1ms**；理想阶跃约 1ms 后达到最终变化量的 63.2%。\n3. 查一颗 10µF MLCC 在目标偏压和温度下的有效容值，并核对 LDO 的输出电容要求；没有曲线时标记待核，不能填“合格”。\n4. 说明电解与钽电容为什么必须按实际型号核对极性。\n5. 在理想直流电路中，电容刚开始通过电阻充电和稳定很久后，电流分别如何变化？**开始时较大，随后减小并趋近于零**；实际电流取决于电路及器件。\n\n##### ✅ 自测清单\n\n- [ ] 能区分电容用途、额定电压、有效容值、ESR 和 ESL。\n- [ ] 能计算 RC 时间常数，并说明理想模型的前提。\n- [ ] 能解释去耦与耦合接法不同，以及在板测量的限制。\n\n##### 📚 延伸学习\n\n[嘉立创元器件基础](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)中的电容识别与应用；结合具体电容和稳压器数据手册阅读。\n\n#### 04.4.3 电感（Inductor）：存磁场的\"飞轮\"\n\n**学习目标：**能解释电感怎样储能和阻碍电流变化，认识电感量、电流额定值与续流通路。\n\n##### 先认识它：为什么线圈断电时会产生尖峰？\n\n线圈通电时，电流在周围建立磁场；磁场中储存了能量。切断电源时，线圈电流不能凭空瞬间消失，线圈两端可能出现较高电压，尝试维持原来的电流方向。如果没有合适的通路和钳位，开关器件可能承受过大的电压。这也是继电器驱动电路需要考虑续流的原因。\n\n**电感器**常由导线绕成线圈，也可能带磁芯；电路位号通常为 L，如 L1，原理图常用线圈形符号。电感量 L 表示电感对电流变化的响应能力，常见单位 H、mH、μH：`1H=1000mH`，`1mH=1000μH`。实物外形有贴片功率电感、插件线圈等，仅凭形状不能确定型号。\n\n##### 电感怎样工作？\n\n```circuitjs\ninductor-basic\n```\n\n理想模型下，电感两端电压 `v=L×di/dt`：两端施加电压时，电流随时间变化；电流变化越快，所需电压越大。它阻碍的是**电流的变化**，不是永远阻止电流。接入受限的直流电路后，电流逐渐建立；达到稳定直流后，理想电感两端电压为零，真实线圈仍有直流电阻，因而会有压降和发热。\n\n理想电感储能为 `E=½LI²`。同一个电感中电流越大，储存的能量越多。现实中还有线圈电阻、磁芯损耗和磁饱和等限制，不能把理想公式当作完整选型结果。\n\n##### 电路：开关控制继电器线圈\n\n```svg\n<svg role=\"img\" aria-label=\"继电器线圈两端并联续流二极管，二极管阴极接电源正端\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"186.34pt\" width=\"170.3pt\" viewBox=\"-12.7 -194.7 170.3 186.34\"><path d=\"M 72 -153 a 4.5 4.5 90 1 1 0 9\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 72 -144 a 4.5 4.5 90 1 1 0 9\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 72 -135 a 4.5 4.5 90 1 1 0 9\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 72 -126 a 4.5 4.5 90 1 1 0 9\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><polygon points=\"135,-128.7 144,-141.3 153,-128.7 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 0.0,-180.0 L 36,-180 L 72,-180\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-180.0 L 72,-153 M 72,-117 L 72,-90\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-90.0 L 108,-90 L 144,-90\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-90.0 L 144,-128.7 M 135,-141.3 L 153,-141.3 M 144,-141.3 L 144,-180\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 144.0,-180.0 L 108,-180 L 72,-180\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-90.0 L 72,-81 M 75.6,-72.36 L 88.2,-52.2 M 72,-45 L 72,-36\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-36.0 L 72,-21.6 L 63,-21.6 L 81,-21.6 M 65.7,-17.28 L 78.3,-17.28 M 70.2,-12.96 L 73.8,-12.96\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"3.6\" y=\"-196.6\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"3.6\" dy=\"13\">电源正端<\/tspan><\/text><text x=\"68.4\" y=\"-148.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"68.4\" dy=\"13\">继电器线圈<\/tspan><\/text><text x=\"131.4\" y=\"-148.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"131.4\" dy=\"13\">续流二极管 D1<\/tspan><\/text><circle cx=\"72\" cy=\"-76.68\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"72\" cy=\"-49.32\" r=\"4.32\" style=\"stroke:currentColor;fill:white;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"64.08\" y=\"-76.0\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"64.08\" dy=\"13\">开关<\/tspan><\/text><circle cx=\"72\" cy=\"-180\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><circle cx=\"72\" cy=\"-90\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><\/svg>\n```\n\n\n```text\n电源正端 ── 继电器线圈 ── 开关器件 ── GND\n          │              │\n          └─ 续流二极管 ─┘\n```\n\n二极管**并联在线圈两端**：阴极 K 接电源正端，阳极 A 接开关与线圈相连的一端。开关导通时，电源经线圈和开关形成电流；二极管通常反偏。开关关断时，线圈中原方向的电流经二极管形成局部回路，逐渐衰减。实际设计要核对二极管电流、耐压、能量及继电器释放速度；有些场合需用其他钳位方案。\n\n##### 电感用于什么？怎样选？\n\n开关电源利用电感在不同开关状态间储存和释放能量；与电容配合可滤波或谐振。**电感量**描述磁场相关特性，**直流电阻 DCR**描述线圈电阻，二者不是同一个参数。选电源电感还要分别看峰值电流、饱和电流的定义和温升电流的测试条件。磁珠常用于规定频段的干扰抑制，不能仅因有两个端子就当作电源储能电感替换。\n\n##### 原理图符号示意\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 175\" width=\"480\" height=\"175\" role=\"img\" aria-label=\"电感符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 90 H75 A15 15 0 0 1 105 90 A15 15 0 0 1 135 90 A15 15 0 0 1 165 90 A15 15 0 0 1 195 90 H250\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"50\" y=\"45\">电感符号<\/text><text x=\"30\" y=\"145\">图形表示线圈；实际电感还具有电阻和寄生参数。<\/text><\/g><\/svg>\n```\n\n图中是常见符号示意；实物引脚编号与极性仍以具体器件手册为准。\n\n##### 种类、封装与识别\n\n功率电感常用于开关电源储能；射频电感用于匹配或谐振；共模电感与磁珠常用于干扰控制。磁珠的阻抗随频率及直流偏置变化，不应只看“100MHz 阻抗”就断言对目标频段有效；共模电感和普通串联电感的作用也不同。\n\n常见外形有绕线功率电感、一体成型电感、贴片叠层电感以及磁珠。`4R7` 在部分功率电感系列表示 4.7µH；`100` 等标识可能依厂商规则表示不同数值。没有可靠型号时，应查 BOM 或以适当仪器测量，不能只凭外观和丝印推断。\n\n##### 参数：感量之外还要看什么\n\n- **感量与容差**：测试频率、电流和温度不同，读数可能不同。\n- **饱和电流 Isat**：厂商按规定的感量下降比例定义；应看最坏峰值电流、温度和启动/过载，而非将标称电流直接与平均负载相比。\n- **温升电流 Irms**：通常按规定温升定义，受板上散热条件影响；与 Isat 不一定相同。\n- **DCR**：可估算绕组直流铜损 `P≈Irms²×DCR`，实际还可能有交流及磁芯损耗。\n- **自谐振频率、屏蔽和磁场**：频率升高后寄生参数不可忽略；器件和布局会影响邻近敏感电路。\n\n例：某电感在工作条件下 DCR 按 0.1Ω、有效电流按 0.5A 估算，直流铜损约 `0.5²×0.1=0.025W`。这不是总损耗，不能据此直接得到温升。\n\n##### 电源储能、滤波与续流\n\nBuck 电源中电感连接开关节点和输出，电流随开关状态上升和下降；感量会影响纹波，峰值电流影响饱和余量。电感值和频率、最坏电流、控制器稳定性与布局应按选定控制器手册共同确定。LC 滤波器也需要考虑源和负载阻抗、阻尼及稳定性。\n\n线圈或继电器断电时，电感电流需要连续路径，否则节点电压可能快速变化。常见低边驱动电路可在负载线圈两端配置适当续流二极管：负载正端接二极管阴极、开关侧接阳极；具体钳位策略会影响释放速度、器件电压和能量，需核算选型。\n\n##### 优点、局限与选择\n\n电感能够储存磁场能量、抑制电流快速变化，是开关电源储能和滤波的重要元件；代价包括绕组及磁芯损耗、体积、磁场耦合，以及部分磁芯器件的饱和风险。\n\n| 类型 | 常见优点 | 局限与适用场景 |\n|---|---|---|\n| 功率电感 | 适合在规定条件下承载较大电流并参与电源储能 | 须核对峰值、饱和电流、温升电流、DCR 和磁芯损耗；适合开关电源 |\n| 屏蔽结构电感 | 有助于降低向周围的磁场耦合 | 不代表没有漏磁或必然满足 EMC；结构、尺寸与成本因产品而异，敏感电路附近可优先比较 |\n| 空芯电感 | 没有磁芯饱和，部分设计适合高频谐振 | 达到较大感量可能需要更大体积或更多匝数；外部磁场耦合及寄生参数仍需考虑 |\n| 磁珠 | 在指定频率范围可提供损耗性阻抗，常用于抑制高频干扰 | 阻抗随频率和直流偏置变化，通常不能直接代替开关电源储能电感 |\n\n**怎么选：**Buck 电源先按控制器要求和最坏峰值电流选功率电感；抑制高频干扰时比较磁珠的阻抗—频率曲线及偏置条件，不能只比标称数值。\n\n##### 进阶案例：平均电流与峰值电流分开算\n\n假设某 Buck 稳态电感平均电流为 0.8A，电感电流纹波为 0.4A 峰峰值，近似三角波且未进入断续模式，则 `Ipeak≈0.8+0.4/2=1.0A`，谷值约 0.6A。选型时要按输入电压、负载、频率及容差找**最坏峰值**，并与电感的 Isat 判据和温度曲线比较；不能只拿平均 0.8A 对比 1.0A 标称 Isat。\n\n三角纹波近似下 `Irms≈√(Iavg²+ΔIpp²/12)`，上述数值约 0.808A；如果 DCR 假设为 0.1Ω，绕组直流电阻的近似损耗约 0.065W。真实设计还包括 DCR 温升、交流损耗和磁芯损耗，应按数据表及电源设计指南验证。这组条件仅用来学习计算，不对应特定控制器。\n\n**诊断方向：**电源满载时异常发热，可对照负载电流、电感峰值、开关频率、DCR、散热及波形逐项检查。磁珠不能当作任意储能电感替换；其标称阻抗是在指定频率、偏置和测试条件下测得。\n\n##### 🔧 动手练习与参考答案\n\n1. 0.5A、0.1Ω 的电感直流铜损约多少？**25mW**；说明为什么仍不能判断总温升。\n2. 画低边三极管驱动线圈和续流二极管，说明导通、关断时的电流路径。\n3. 对照一颗电源电感数据表，记录 L、DCR、Isat 判据和温升条件，比较目标电路的峰值与有效电流。\n4. 断电后使用 LCR 仪表比较不同测试频率下的读数；无仪器可先写测试方案。\n5. 电感是阻止电流，还是阻碍电流变化？**阻碍电流变化**；稳定直流下真实电感仍有绕组电阻和损耗。\n\n##### ✅ 自测清单\n\n- [ ] 能区分平均电流、峰值电流、Isat 与温升电流。\n- [ ] 能说明电感和磁珠不能按同一器件模型互换。\n- [ ] 能解释感性负载断电时为什么需要适当续流或钳位路径。\n\n##### 📚 延伸学习\n\n[嘉立创元器件基础](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)中的电感识别与应用；以选定电感和电源控制器手册核对参数。\n\n#### 04.4.4 二极管（Diode）：电流的\"单行道\"\n\n**学习目标：**能判断二极管方向，解释正向压降、反向阻断及不同类型的用途。\n\n##### 先认识它：怎样让电流主要朝一个方向通过？\n\n二极管是一个两端半导体器件，两个端子叫**阳极 A** 和 **阴极 K**。普通二极管在正向偏置时较容易导电，在规定的反向电压范围内通常只有较小漏电；实际电流随电压和温度变化，不是完美的单向开关。\n\n原理图位号常为 D，符号中靠横线的一端是 K。许多实物用色环或标条标记阴极，但具体器件须查手册；LED、TVS 等不能一概依外形口诀判断。**正向偏置**是 A 电位高于 K，**反向偏置**是 A 电位低于 K；正向有足够电压并有电流限制时可以导通，反向电压过大可能进入击穿。\n\n##### 正向压降是什么？\n\n```circuitjs\ndiode-forward\n```\n\n电流正向流过二极管时，A 相对 K 有一个电压差，称为正向压降 VF。VF 与型号、电流和温度有关。若假设某二极管在 1A 工作点 VF 为 0.4V，它本身功耗约 `0.4V×1A=0.4W`；5V 电源串接它后，负载端约为 4.6V。实际必须按数据表曲线和热条件核验，不能把 0.4V 当作所有肖特基管的固定值。\n\n##### 电路一：LED 指示灯\n\n```text\n5V ── 限流电阻 ── LED 阳极 A → LED 阴极 K ── GND\n```\n\nLED 正向通电时可发光，限流电阻确定支路电流的大致范围；接反时一般不会正常发光，但仍须注意 LED 的反向耐压。不能把 LED 直接接普通电压源试亮。限流计算见电阻模块和 04.6。\n\n##### 电路二：防反接与续流\n\n**串联防反接：**电源正端接二极管阳极，阴极接后级正电源。正常接入时二极管导通；电源反接时，二极管处于反偏，限制反向电流。其代价是正向压降和发热；具体还要核对反向耐压及漏电。\n\n**线圈续流：**二极管并在线圈两端，正常供电时反偏；开关关闭后为线圈电流提供衰减回路。电感模块已画出连接，这里要重点检查 K、A 的方向；接反可能直接在电源两端形成低阻通路。\n\n##### 整流与稳压：把方向特性用起来\n\n```circuitjs\nrectify\n```\n\n**半波整流：**交流电压正负交替变化；在特定连接下，一只二极管让其中一个方向的电流较容易流过负载，另一方向被阻断，得到单向脉动输出。**桥式整流：**四只二极管按桥式连接，每个半周由其中两只导通，使负载中的约定电流方向保持一致；输出仍是脉动电压，常另加滤波，且需计入导通管压降。入门只分析低压隔离信号，实际电源设计要核对反向耐压、浪涌电流和散热。\n\n**稳压管参考：**电源经电阻接输出节点，稳压管阴极接该节点、阳极接地，负载并在节点与地之间。在满足稳压管规定反向电流的条件下，它可使节点电压近似稳定；串联电阻限制总电流。输入、负载和温度改变会影响电压与电流，不能当作能供应任意电流的理想电源。数值分析见后面的进阶案例。\n\n##### 类型：同叫二极管，用途不同\n\n普通整流二极管用于整流与导流；肖特基在某些工作点压降较低但漏电需关注；LED 用于发光；稳压管利用规定反向工作区间提供近似稳定电压；TVS 用于吸收规定短时瞬态。稳压管与 TVS 的测试条件和用途不同，不能只看标称电压就互换。下面进一步学习参数和选型。\n\n##### 原理图符号示意\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 430 85\" width=\"430\" height=\"85\" role=\"img\"><line x1=\"20\" y1=\"40\" x2=\"56\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M 56 24 L 56 56 L 82 40 Z\" fill=\"currentColor\"/><line x1=\"82\" y1=\"24\" x2=\"82\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"82\" y1=\"40\" x2=\"118\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"160\" y1=\"40\" x2=\"196\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M 196 24 L 196 56 L 222 40 Z\" fill=\"currentColor\"/><line x1=\"222\" y1=\"24\" x2=\"222\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M 212 18 l 10 -10 m -3 10 l 3 -3 M 220 26 l 10 -10 m -3 10 l 3 -3\" stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\"/><line x1=\"222\" y1=\"40\" x2=\"258\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"300\" y1=\"40\" x2=\"336\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M 336 24 L 336 56 L 362 40 Z\" fill=\"currentColor\"/><line x1=\"362\" y1=\"22\" x2=\"362\" y2=\"58\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M 362 22 l -8 0 M 362 58 l 8 0\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><line x1=\"362\" y1=\"40\" x2=\"398\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"69\" y=\"75\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-note\">普通二极管<\/text><text x=\"229\" y=\"75\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-note\">LED（小箭头=发光）<\/text><text x=\"369\" y=\"75\" text-anchor=\"middle\" font-size=\"11\" class=\"fp-note\">稳压（Z 形横线）<\/text><text x=\"40\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" class=\"fp-note\">A<\/text><text x=\"96\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" class=\"fp-note\">K<\/text><text x=\"180\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" class=\"fp-note\">A<\/text><text x=\"236\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" class=\"fp-note\">K<\/text><text x=\"320\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" class=\"fp-note\">A<\/text><text x=\"376\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" class=\"fp-note\">K<\/text><\/svg>\n```\n\n图中是常见符号示意；实物引脚编号与极性仍以具体器件手册为准。\n\n##### 二极管分类与识别\n\n| 类型 | 主要用途 | 核查重点 |\n|---|---|---|\n| 整流二极管 | 将交流变为单向脉动电流 | 反向耐压、平均和浪涌电流、散热 |\n| 快恢复二极管 | 高频整流、开关路径 | 反向恢复、损耗、电压和电流 |\n| 肖特基二极管 | 低压降整流、防反接 | VF、反向漏电、温度和耐压 |\n| LED | 指示或照明 | 正向电流、VF、亮度、颜色、极性 |\n| 稳压二极管 | 在规定反向电流下形成参考 | 稳压电压、测试电流、动态电阻、功耗 |\n| TVS | 将短时瞬态限制在一定范围 | 工作电压、击穿、钳位、脉冲能力和波形 |\n\n标条通常用于标识某一电极，但不同器件与封装可能采用不同标记；LED 长短脚也可能被剪短或不是通用规则。先查具体型号的阳极、阴极与封装图，无法识别时隔离器件后用二极管档辅助判断。表笔极性、测试电流及 LED 能否点亮取决于仪表，不亮不等于一定损坏。\n\n##### 三个电路例子\n\n**LED 限流**：5V、假设 LED 的 VF 为 2V、目标电流 5mA，初算 600Ω，可取 620Ω，再按电源和器件最坏条件核对。LED 的 VF 随电流和温度变化，不能当作固定电压源。\n\n**电源串联防反接**：假设 5V、1A 工作点下二极管 VF=0.4V，则二极管功耗约 0.4W，负载端约 4.6V。该结果仅对假设工作点成立；应查实际 VF 曲线、漏电、温升、浪涌电流与后级最低工作电压。\n\n**齐纳并联参考**：假设 5V 输入、3.0V 稳压管、串联电阻 1kΩ，暂忽略稳压管电压变化且输出无负载时，支路电流约 2mA、稳压管功耗约 6mW。加负载后电流分流，必须确认最小/最大输入及负载下仍满足稳压管规定电流和功耗；它不适合作为任意负载的理想 3V 电源。\n\n##### 续流、浪涌与测试\n\n感性负载关断时需要续流或钳位；选型要考虑线圈电流、能量、最大反向电压和释放时间。TVS 的钳位电压对应特定脉冲条件，不是任意浪涌下恒定的电压；需要结合器件耐受、布线寄生和测试。测量先断电，电容放电后使用二极管档；不同路径的并联器件可能影响读数。\n\n##### 优点、局限与选择\n\n二极管能用简单电路实现整流、保护或指示；但并非理想单向开关，正向压降会带来损耗，反向也有漏电，部分器件还有反向恢复问题。\n\n| 类型 | 常见优点 | 局限与适用场景 |\n|---|---|---|\n| 普通整流二极管 | 结构简单，适合规定条件下的整流、防反接或续流 | 正向压降带来发热；反向恢复可能限制高频应用，须查具体型号 |\n| 肖特基二极管 | 在某些工作点具有较低正向压降，反向恢复问题较小 | 反向漏电及温度影响需重视，耐压和 VF 需按型号比较；适合部分低压整流和防反接 |\n| 稳压二极管 | 电路简单，可在规定电流范围提供近似参考电压 | 精度、动态电阻及负载范围有限，持续消耗电流；适合简单参考或钳位 |\n| TVS | 按规定波形吸收短时瞬态能量 | 钳位值随脉冲电流变化，不能替代稳压器；保护效果还取决于布线与能量等级 |\n| LED | 可直接提供可视指示 | 需要受控电流；亮度、压降和寿命受工作条件影响，不是普通电源整流器件 |\n\n**怎么选：**1A 电源防反接需比较压降、漏电、功耗及散热；瞬态保护则按脉冲波形和实际钳位电压选 TVS，两者不能只按“电压相近”互换。\n\n##### 进阶案例：稳压管的负载边界\n\n假设 5V 电源通过 1kΩ 电阻连接到标称 3V 的齐纳节点；为练习，假设该稳压管在 0.5～5mA 内可近似保持 3V。输入 5V 时串联电流约 `(5−3)/1000=2mA`。若外部负载需要 1mA，齐纳支路约 1mA，处于本例假设范围；若负载需要 2mA，齐纳支路接近 0mA，节点可能不再稳定在 3V。\n\n此例只说明电流分配，不是选型结论。实际还要用最大/最小输入、稳压电压容差、动态电阻、温度、最大功率及负载瞬态核算。TVS 和齐纳虽然都可能使用击穿特性，但其额定波形、重复能力和用途不同，不能根据标称电压直接互换。\n\n**故障定位：**正向导通却压降过大，可能是电流超预期、型号不同、接触不良或温度影响；稳压节点不稳要先测输入、串联电阻与负载电流，不能只更换二极管。\n\n##### 🔧 动手练习与参考答案\n\n1. 5V、1A、VF=0.4V 时，串联二极管功耗约 **0.4W**、负载约 **4.6V**；实际值依电流和温度而变。\n2. 画 LED 限流、线圈续流及 TVS 防护三种连接，并解释它们的目的不同。\n3. 查两种肖特基二极管的 VF 测试条件、反向漏电与额定温度，比较实际工作点。\n4. 描述在板测二极管档可能出现的并联路径问题。\n5. 在线圈续流电路中，二极管的阴极和阳极分别接哪里？在本课低边例子中，**阴极接电源正端，阳极接线圈的开关侧**；其他拓扑应重新判断。\n\n##### ✅ 自测清单\n\n- [ ] 能区分阳极/阴极、正常工作点和反向击穿条件。\n- [ ] 能按实际电压电流计算功耗，并理解稳压管与 TVS 的用途不同。\n- [ ] 能说出续流二极管方向必须根据具体电路判断。\n\n##### 📚 延伸学习\n\n[嘉立创元器件基础](https://wiki.lceda.cn/zh-hans/contest/e-contests/basic-training/electron-component.html)中的二极管识别与应用；具体额定值以器件厂商资料为准。\n\n#### 04.4.5 三极管（BJT）：小电流拧大电流的\"水阀\"\n\n**学习目标：**能区分 NPN 和 PNP，说明 B、C、E 的作用，并读懂两种基本开关电路。\n\n##### 先认识它：小信号怎样控制负载？\n\n单片机的引脚能提供的电流有限。如果负载需要的电流超过引脚允许值，可以用合适的三极管做驱动：单片机控制三极管，负载电流由电源经三极管通路提供。是否适合要核对电源、电流、驱动和散热，不能假设任何三极管都能带动任何负载。\n\n本节所说的**三极管**是双极型晶体管（BJT），有三个端子：**基极 B**、**集电极 C**、**发射极 E**。它可用来控制负载电流，也可用于信号放大。原理图位号常用 Q；实物脚位顺序随型号和封装而变，要查完整料号的引脚图。\n\n##### NPN 和 PNP 是什么？\n\n它们是 BJT 的两种类型，结构和正常驱动极性不同。初学开关电路，先看**基极相对发射极**的关系：\n\n| 类型 | 常见工作条件 | 常见开关位置 | 符号辨认 |\n|---|---|---|---|\n| NPN | 基极相对发射极较高，通过合适路径提供基极电流 | 负载下方，低边开关 | 发射极箭头向外 |\n| PNP | 基极相对发射极较低，通过合适路径使基极电流流出 | 负载上方，高边开关 | 发射极箭头向内 |\n\n箭头画在 E 极，表示该结的约定电流方向；不能仅靠符号朝向或外壳形状猜实物脚位。常见硅管的 B-E 正向电压在某些工作点可约为 0.7V，但它随电流和温度变化，并不是适用于所有型号的固定门槛。\n\n##### 三种工作状态\n\n- **截止：**驱动不足以形成正常导通，集电极支路电流通常很小；在开关电路中相当于关断，但实际有漏电。\n- **放大区：**在合适偏置和工作范围内，基极驱动的变化可以控制集电极电流变化；用于线性放大时要设计工作点。\n- **饱和：**在外部负载和充足基极驱动下，集电极与发射极间的压降较小；常作为开关导通状态。此时电流主要受负载和电源限制。\n\n##### 电路一：NPN 低边开关\n\n下图使用 LED 和限流电阻作负载；仿真用 1kΩ 电阻代替 LED 支路，并增加基极下拉，只比较开关动作，不能从仿真判断 LED 亮度。\n\n```svg\n<svg role=\"img\" aria-label=\"NPN高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"276.34pt\" width=\"222.05899999999997pt\" viewBox=\"-67.375 -277.49999999999994 222.05899999999997 276.34\"><polygon points=\"108.06,-175.5 99.06,-162.9 90.06,-175.5 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 72.0,-81.0 L 85.2,-81\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-94.2 L 85.2,-67.8\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-87.6 L 99.06,-99.48 L 99.06,-106.08\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-74.4 L 99.06,-62.52 L 99.06,-55.92\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 85.2,-74.4 L 92.227,-68.377\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 97.541 -63.822 L 89.884 -65.644 L 94.57 -71.11 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 99.05999999999999,-106.08 L 99.06,-125.04 L 99.06,-144\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 99.05999999999999,-144.0 L 99.06,-162.9 M 108.06,-162.9 L 90.06,-162.9 M 99.06,-175.5 L 99.06,-194.4\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 76.0613506232961,-161.07220035616922 L 85.56,-166.5\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 71.546 -158.492 L 74.632 -163.573 L 77.49 -158.572 Z\" style=\"stroke:currentColor;fill:currentColor;stroke-linecap:butt;stroke-linejoin:miter;\" /><path d=\"M 76.0613506232961,-169.1722003561692 L 85.56,-174.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasha al\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"start\"><tspan x=\"111.66\" dy=\"13\">LED<\/tspan><\/text><text x=\"86.46\" y=\"-236.20000000000002\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"86.46\" dy=\"13\">RLED<\/tspan><\/text><text x=\"95.46\" y=\"-279.4\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"95.46\" dy=\"13\">5V<\/tspan><\/text><text x=\"0.0\" y=\"-106.60000000000001\" dominant-baseline=\"ideographic\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"0.0\" dy=\"13\">RB<\/tspan><\/text><text x=\"-54.0\" y=\"-90.39999999999999\" dominant-baseline=\"central\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"-54.0\" dy=\"13\">控制端<\/tspan><\/text><circle cx=\"72\" cy=\"-81\" r=\"2.7\" style=\"stroke:currentColor;fill:currentColor;stroke-width:2.0;stroke-dasharray:-;\" /><text x=\"72.0\" y=\"-87.7\" dominant-baseline=\"hanging\" fill=\"black\" font-size=\"13\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"72.0\" dy=\"13\">B<\/tspan><\/text><\/svg>\n```\n\n\n```circuitjs\nnpn-switch\n```\n\n```text\n5V ── 限流电阻 ── LED（A → K）── C  Q1  E ── GND\nGPIO ── 基极电阻 RB ──────────── B\n控制电路与 5V 电源共地\n```\n\nGPIO 低电平时，B 相对 E 接近 0V，Q1 近似截止，LED 熄灭；GPIO 高电平且经 RB 提供足够基极电流时，Q1 可进入饱和，负载电流沿 `5V→电阻→LED→C→E→GND` 流动，LED 点亮。基极电阻限制控制端电流；基极不能不经设计就直接接 GPIO。GPIO 在复位或高阻时的状态也需检查，必要时增加 B-E 下拉电阻。\n\n##### 电路二：PNP 高边开关\n\n下图使用 LED 负载；仿真用 1kΩ 电阻负载，开关经基极电阻把控制端拉低，用于观察通断。\n\n```svg\n<svg role=\"img\" aria-label=\"PNP高边或低边开关电路，LED和限流电阻构成负载\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"287.14pt\" width=\"234.527pt\" viewBox=\"-67.375 -223.49999999999994 234.527 287.14\"><polygon points=\"108.06,2.7 99.06,15.3 90.06,2.7 \" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dash
