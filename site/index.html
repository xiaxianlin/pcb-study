<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB 设计系统教学课程</title>
<style>
@font-face{
  font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;
  src:url('./fonts/jetbrains/jb-400.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;
  src:url('./fonts/jetbrains/jb-700.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
:root{
  --bg:#f7f9fa; --bg2:#eef2f5; --panel:#ffffff; --panel2:#f2f6f8;
  --line:#e0e7eb; --line2:#ccd7dd;
  --text:#223039; --muted:#5a6b76; --faint:#8a99a3;
  --green:#0e9f5f; --green-dim:#0b7a4c; --gold:#a97b1c;
  --s1:#2f6fd6;
  --st1:#0891a5; --st2:#2f6fd6; --st3:#0e9f5f; --st4:#e07c24; --st5:#7c5cd6;
  --btn-text:#ffffff; --strong:#111f19;
  --code-bg:#f4f8f5; --code-text:#24413a; --dot:rgba(0,0,0,.09);
  --shadow:0 12px 30px rgba(20,40,32,.14);
  --bq-bg:rgba(169,123,28,.08);
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Sarasa Mono SC',monospace;
}
html[data-theme='dark']{
  --bg:#0a0f0d; --bg2:#0d1512; --panel:#111b17; --panel2:#152019;
  --line:#1f2f28; --line2:#2a3d34;
  --text:#dbe7e1; --muted:#8aa097; --faint:#5c7168;
  --green:#34e08a; --green-dim:#1d7a4e; --gold:#d8b45a;
  --s1:#5aa9ff;
  --st1:#56c8d8; --st2:#5aa9ff; --st3:#34e08a; --st4:#ffa04d; --st5:#b78cff;
  --btn-text:#06130c; --strong:#ffffff;
  --code-bg:#0b1210; --code-text:#b9d4c6; --dot:rgba(139,160,151,.14);
  --shadow:0 12px 30px rgba(0,0,0,.5);
  --bq-bg:rgba(216,180,90,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:500 15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
  -webkit-font-smoothing:antialiased}
a{color:var(--s1);text-decoration:none}
a:hover{text-decoration:underline}

.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{width:290px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.5px}
#themeBtn{margin-left:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
  width:30px;height:30px;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;padding:0}
#themeBtn:hover{border-color:var(--faint)}
.brand .dot{width:26px;height:26px;border-radius:50%;background:
  radial-gradient(circle at center, var(--bg) 0 7px, var(--green) 7px 10px, var(--bg2) 10px);
  border:2px solid var(--green);flex-shrink:0}
.brand .sub{margin-top:6px;font-size:12px;color:var(--faint)}
.search-wrap{padding:12px 14px;position:relative}
.search-box{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px}
.search-box input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:13px;min-width:0}
.search-box .ic{color:var(--faint);font-size:13px;cursor:default}
.search-results{position:absolute;left:14px;right:14px;top:52px;background:var(--panel);
  border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);
  max-height:380px;overflow-y:auto;display:none;z-index:50}
.search-results.show{display:block}
.sr-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sr-item:last-child{border-bottom:0}
.sr-item:hover{background:var(--panel)}
.sr-item .t{font-size:13.5px;font-weight:600}
.sr-item .s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.sr-item .s b{color:var(--gold);font-weight:600}
.sr-empty{padding:14px;font-size:13px;color:var(--faint)}
nav#nav{flex:1;padding:6px 10px 14px}
.stage-group{margin-top:12px}
.stage-head{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12.5px;color:var(--muted);letter-spacing:.5px}
.stage-head .sdot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stage-head .cnt{margin-left:auto;font-size:11.5px;color:var(--faint)}
.lesson-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;
  color:var(--text);font-size:13.5px;border:1px solid transparent}
.lesson-item:hover{background:var(--panel)}
.lesson-item.active{background:var(--panel2);border-color:var(--line2)}
.lesson-item .no{font-family:var(--mono);font-size:12px;color:var(--faint);width:20px;flex-shrink:0}
.lesson-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-item .hr{font-size:11px;color:var(--faint);font-family:var(--mono)}
.lesson-item .ok{color:var(--green);font-size:13px;width:16px;text-align:center;flex-shrink:0}
.lesson-item.done .nm{color:var(--muted)}
.side-foot{border-top:1px solid var(--line);padding:14px 18px;font-size:12px;color:var(--faint)}
.pbar{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));border-radius:99px;transition:width .4s}
.side-foot .row{display:flex;justify-content:space-between;align-items:center}
.side-foot .pct{color:var(--green);font-family:var(--mono)}
.reset-link{color:var(--faint);cursor:pointer}
.reset-link:hover{color:var(--s3);text-decoration:underline}
.side-foot .tip{margin-top:8px;line-height:1.6;font-size:11.5px}
.progress-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.progress-tools button{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;color:var(--text);font-size:12px;cursor:pointer}

.overlay{display:none}
.menu-btn{display:none}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:36px 44px 90px;display:flex;justify-content:center;gap:36px;align-items:flex-start}
.container{width:100%;max-width:940px;min-width:0}

/* ---------- toc（右侧大纲） ---------- */
.toc{display:none;position:sticky;top:36px;flex:0 0 216px;max-height:calc(100vh - 72px);overflow-y:auto;
  padding:2px 0 20px 2px}
@media (min-width:1380px){ .toc.has-toc{display:block} }
.toc-title{font-size:12px;color:var(--faint);letter-spacing:1.5px;margin:0 0 10px 14px;font-weight:700}
.toc-item{font-size:12.5px;line-height:1.45;color:var(--muted);padding:4px 8px 4px 12px;margin:1px 0;
  border-left:2px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-radius:0 6px 6px 0;transition:color .12s}
.toc-item.lv3{padding-left:38px;font-size:12px}
.toc-item.lv2{padding-left:26px;font-size:12px}
.toc-item:hover{color:var(--text);background:var(--panel)}
.toc-item.active{color:var(--green);border-left-color:var(--green);background:var(--panel)}
.md h2,.md h3,.md h4,.md h5,.md h6{scroll-margin-top:16px}

/* ---------- sim modal（电路仿真弹窗） ---------- */
.sim-backdrop{position:fixed;inset:0;z-index:90;background:rgba(5,12,9,.62);
  display:flex;align-items:center;justify-content:center;padding:26px}
.sim-backdrop[hidden]{display:none}
.sim-panel{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  width:min(1240px,96vw);height:min(880px,92vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.sim-head{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.sim-head .t{font-weight:700;font-size:15.5px;white-space:nowrap}
.sim-head .d{color:var(--faint);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sim-btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:8px;
  padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
.sim-btn:hover{border-color:var(--faint)}
.sim-frame{flex:1;width:100%;border:0;background:#fff}

/* 思维导图 */
.mind-panel{width:min(1150px,96vw);height:min(720px,90vh)}
.mind-body{flex:1;overflow:auto;padding:18px;color:var(--text)}
.mm-link{stroke:var(--line2);stroke-width:1.5;fill:none}
.mm-node{cursor:pointer}
.mm-node rect{fill:var(--panel2);stroke:var(--line2)}
.mm-node text{fill:currentColor;font-size:12.5px}
.mm-node.l1 rect{stroke:var(--green);stroke-width:1.6}
.mm-node.l1 text{font-weight:700}
.mm-node.l0 rect{fill:var(--green);stroke:var(--green)}
.mm-node.l0 text{fill:var(--btn-text);font-weight:700;font-size:13.5px}
.mm-node:hover rect{stroke:var(--green);stroke-width:2}

.hero{border:1px solid var(--line);border-radius:16px;padding:34px 36px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 85% -10%, rgba(52,224,138,.08), transparent 45%),
    radial-gradient(circle at 12% 120%, rgba(90,169,255,.07), transparent 40%),
    var(--panel)}
.hero::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--dot) 1px, transparent 1.4px);
  background-size:26px 26px;pointer-events:none}
.hero h1{margin:0 0 8px;font-size:30px;letter-spacing:.5px;position:relative}
.hero p{margin:0;color:var(--muted);font-size:15px;position:relative}
.hero .cta{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 20px;font-size:14.5px;
  cursor:pointer;border:1px solid transparent;font-weight:600}
.btn.primary{background:var(--green);color:var(--btn-text)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--faint)}
.btn.done-btn{background:var(--panel2);color:var(--green);border-color:var(--green-dim)}
.btn.done-btn:hover{filter:brightness(1.2)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.stat .v{font-size:22px;font-weight:700;font-family:var(--mono)}
.stat .v em{font-style:normal;font-size:13px;color:var(--faint);margin-left:2px}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat.g .v{color:var(--green)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:26px;padding:24px 26px}
.panel .panel-title{display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:700;margin:0 0 4px}
.panel .panel-sub{color:var(--faint);font-size:12.5px;margin:0 0 12px}

/* route map */
.map-wrap{overflow-x:auto}
svg.routemap{width:100%;min-width:640px;height:auto;display:block}
.node{cursor:pointer}
.node .pad{fill:var(--panel2);stroke:var(--c);stroke-width:2.5;transition:all .15s}
.node .num{fill:var(--c);font:700 13px var(--mono);text-anchor:middle;pointer-events:none}
.node .lbl{fill:var(--muted);font-size:11.5px;text-anchor:middle;pointer-events:none}
.node .opt-tag{fill:var(--faint);font-size:9.5px;text-anchor:middle}
.node.optional .pad{stroke-dasharray:5 4}
.node:hover .pad{stroke-width:4;filter:brightness(1.25)}
.node.done .pad{fill:var(--c)}
.node.done .num{fill:#0a0f0d}
.node.done .lbl{fill:var(--text)}
.node.active .pad{stroke-width:5;filter:drop-shadow(0 0 7px var(--c))}
.node .badge{fill:var(--green)}
.node .badge-t{fill:var(--btn-text);font:700 10px var(--mono);text-anchor:middle}
.seg{opacity:.45;stroke-width:3;stroke-linecap:round}
.seg.done-seg{opacity:.85}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--muted)}
.map-legend .li{display:flex;align-items:center;gap:7px}
.map-legend .sw{width:22px;height:4px;border-radius:99px}
.map-legend .done-sw{width:12px;height:12px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:var(--btn-text);font-weight:800}

/* stage cards */
.stages{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stage-card{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:16px 18px;background:var(--panel)}
.stage-card .h{display:flex;align-items:baseline;gap:10px}
.stage-card .h .n{font-weight:700;font-size:15.5px;color:var(--c)}
.stage-card .h .r{font-size:12px;color:var(--faint);font-family:var(--mono)}
.stage-card .d{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.65}
.stage-card .mini{margin-top:10px;height:5px;background:var(--bg);border-radius:99px;overflow:hidden}
.stage-card .mini i{display:block;height:100%;background:var(--c);border-radius:99px}
.stage-card .mrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px}

/* lesson view */
.crumb{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--faint);margin-bottom:14px}
.crumb a{color:var(--muted)}
.crumb .stage-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:99px;
  border:1px solid var(--c);color:var(--c);font-size:12px}
.lesson-head h1{margin:0 0 12px;font-size:26px;line-height:1.4}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border:1px solid var(--line2);
  border-radius:99px;color:var(--muted);font-size:12.5px}
.chip b{color:var(--text);font-weight:600}
.chip.task-chip{border-color:var(--green-dim)}
.chip.task-chip b{color:var(--green)}
.spacer{flex:1}

/* markdown content */
.md{margin-top:28px}
.md h1{font-size:24px;margin:34px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.md h2{font-size:21px;margin:36px 0 14px;padding-left:14px;border-left:4px solid var(--green)}
.md h3{font-size:19px;margin:30px 0 12px;color:var(--text);font-weight:700;
  padding-bottom:6px;border-bottom:1px dashed var(--line2)}
.md h4{font-size:15.5px;margin:26px 0 10px;color:var(--text);font-weight:700;
  display:inline-block;max-width:100%;padding:4px 12px;
  background:var(--panel2);border-left:3px solid var(--green);border-radius:0 8px 8px 0}
.md h4::before{content:"§ ";color:var(--green);font-weight:700}
.md h5{font-size:15px;margin:22px 0 8px;color:var(--text);font-weight:700}
.md p{margin:12px 0}
.md strong{color:var(--strong)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--gold)}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  overflow-x:auto;line-height:1.55;margin:14px 0}
.md pre code{background:none;border:0;padding:0;color:var(--code-text);font-size:12.8px;white-space:pre}
.md blockquote{margin:14px 0;padding:10px 18px;border-left:3px solid var(--gold);
  background:var(--bq-bg);border-radius:0 8px 8px 0;color:var(--muted)}
.md blockquote p{margin:4px 0}
.md ul,.md ol{margin:12px 0;padding-left:26px}
.md li{margin:5px 0}
.md li.sub{margin-left:20px}
.md hr{border:0;border-top:1px dashed var(--line2);margin:26px 0}
.md details{margin:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.md details summary{cursor:pointer;padding:10px 16px;font-weight:600;user-select:none;list-style:none}
.md details summary::-webkit-details-marker{display:none}
.md details summary::before{content:"▸ ";color:var(--faint)}
.md details[open] summary::before{content:"▾ ";color:var(--green)}
.md details > *:not(summary){margin-left:16px;margin-right:16px}

/* mermaid 图 / 内嵌 SVG 图 */
.diagram{margin:14px 0;padding:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;overflow-x:auto;display:flex;justify-content:center;color:var(--text)}
.diagram svg{max-width:100%}
.diagram-err{font-family:var(--mono);font-size:12.5px;white-space:pre;color:var(--s3);justify-content:flex-start;display:block}
.diagram-svg svg{max-width:100%;height:auto}
.diagram-svg text{font-family:inherit;fill:currentColor}
.fp-board{fill:var(--bg2);stroke:var(--line2);stroke-width:1.5}
.fp-zone{fill:var(--panel);stroke:var(--line);stroke-dasharray:5 3}
.fp-part{fill:var(--panel2);stroke:var(--line2)}
.fp-core{fill:var(--panel2);stroke:var(--s4);stroke-width:2}
.fp-rf{fill:var(--panel2);stroke:var(--s1);stroke-width:2}
.fp-note{fill:var(--faint)}
.fp-strong{fill:var(--text);font-weight:600}
.wv-axis{stroke:var(--muted)}
.wv-curve{stroke:var(--green);stroke-width:2.5;fill:none}
.wv-dash{stroke:var(--faint);stroke-dasharray:4 4;fill:none}
.wv-lab{fill:var(--muted)}
.wv-em{fill:var(--gold);font-weight:600}
.tbl-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6}
.md th{background:var(--panel2);font-weight:700;text-align:left;white-space:nowrap}
.md th,.md td{padding:8px 14px;border-bottom:1px solid var(--line)}
.md tr:last-child td{border-bottom:0}
.md td{color:var(--muted)}
.md td:first-child{color:var(--text)}
ul.tasks{list-style:none;padding-left:4px}
ul.tasks li{margin:8px 0}
ul.tasks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.tasks input[type=checkbox]{width:16px;height:16px;margin-top:5px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
ul.tasks input:disabled{cursor:default}

/* lesson bottom */
.lesson-foot{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}
.nav-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.nav-card{border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--panel)}
.nav-card:hover{border-color:var(--faint)}
.nav-card.next{text-align:right}
.nav-card .dir{font-size:11.5px;color:var(--faint)}
.nav-card .tt{font-size:14.5px;font-weight:600;margin-top:3px}
.nav-card.disabled{opacity:.35;pointer-events:none}

/* readme details */
details.readme{margin-top:26px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
details.readme summary{cursor:pointer;padding:16px 22px;font-weight:700;font-size:15.5px;list-style:none;display:flex;align-items:center;gap:10px}
details.readme summary::before{content:"▸";color:var(--faint);transition:transform .15s}
details.readme[open] summary::before{transform:rotate(90deg)}
details.readme .inner{padding:4px 26px 26px}

/* code / misc */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* responsive */
@media (max-width:960px){
  .main{padding:26px 18px 70px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stages{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;width:290px}

<script id="course-data" type="application/json">{"title":"PCB 设计系统教学课程","lessons":[{"id":"01","title":"第 01 章 · 基础概念","short":"基础概念","stage":1,"diff":1,"prev":"无","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用自己的话解释电荷、电流、电压、电阻、功率，并说出它们的单位。\n2. 看懂 `5V`、`10kΩ`、`100nF`、`20mA` 这类标注，能换算常见数量级。\n3. 判断串联与并联，算总电阻、分压和分流。\n4. 用欧姆定律和功率公式算 LED 限流电阻、走线压降和电阻功耗。\n5. 说清通路、开路、短路，知道短路为什么危险。\n6. 说清“地”只是参考点，知道电压表并联、电流表串联。\n7. 用 KCL、KVL 检查一个简单电路，理解负载效应。\n8. 知道直流、交流、周期、频率、占空比、有效值这些词在说什么。\n\n本章不要求你背完所有公式。更重要的是建立画面：看到一块板子、一张原理图、一个数字，你知道它在说哪件事。\n\n## 正文\n\n### 1.1 电、电荷与电流：先建立画面\n\n这一节只做一件事：把“电”从一个抽象名词，变成你能在脑子里看见的画面。后面所有公式，都是在这个画面上做加减乘除。\n\n#### 1.1.1 电荷：电的“原材料”\n\n想象一个水池，里面装了多少水，我们心里有数。电也一样，是一种“东西”，只是小到看不见。\n\n一切物质由原子组成。原子中心是**原子核**，带正电；外围是**电子**，带负电。平时正负电量相等、互相抵消，物体就“不带电”；一旦电子被搬走或塞进来，平衡被打破，物体就带电了。\n\n这种“带电的多少”叫**电荷**（charge），符号常用 `Q`，单位是**库仑**（coulomb，符号 `C`）。\n\n库仑是一个很大的单位。1 库仑约等于 `6.24×10¹⁸` 个电子所带电荷量的绝对值。这个数不用记，有感觉就行：单个电子的电量小到夸张，所以人们成堆地数它们，就像用“吨”来数米。\n\n两个够用的直觉：\n\n- **同性相斥、异性相吸**：正正互推、正负互拉。\n- **电荷只转移、不凭空产生**：这叫电荷守恒。摩擦起电不是“造出电”，而是把电子从一个物体搬到另一个物体。\n\n材料按“电子能不能自由跑”分成三类：\n\n| 类别 | 特点 | 常见材料 | 在 PCB 上的角色 |\n|---|---|---|---|\n| 导体 | 电子能自由移动 | 铜、金、银、铝、焊锡 | 铜箔走线、焊盘、过孔内壁镀铜 |\n| 绝缘体 | 电子被束缚，几乎不导电 | 玻璃纤维与树脂组成的 FR-4、塑料、陶瓷、空气 | 基材、阻焊层、导线外皮 |\n| 半导体 | 导电能力介于两者之间，而且可以控制 | 硅、锗 | 二极管、三极管、MOS 管、芯片的原材料 |\n\n半导体先留个印象：芯片不是“更高级的铜线”，而是用“可控制的导体/绝缘体”堆出来的开关阵列。它什么时候通、什么时候断，由电压和掺杂决定。第 05～08 章会逐个拆开。\n\n**这在板子上**：一块 PCB 就是“导体 + 绝缘体”的三明治。中间是玻璃纤维（绝缘），两面贴铜箔（导体）；蚀刻掉不要的铜，剩下的铜线就是电路。你以后画的每一根走线，本质上都是这里的“导体”。\n\n#### 1.1.2 电流：电荷的定向移动\n\n水在水管里流动，我们叫水流；电荷在导体里定向移动，我们叫**电流**（current），符号常用 `I`。\n\n电流的大小，用“单位时间内流过某个截面的电荷量”来定义：\n\n```text\nI = Q / t\n```\n\n- `I`：电流，单位**安培**（ampere，符号 `A`）\n- `Q`：电荷量，单位库仑（`C`）\n- `t`：时间，单位秒（`s`）\n\n所以 `1 A = 1 C/s`：每秒钟有 1 库仑电荷流过这个截面。\n\n这里要提前说清一个容易误会的地方：**电流的方向，物理上规定为正电荷流动的方向**，也就是从电源正极经外电路流向负极。但在金属导线里，真正移动的是带负电的电子，它们的方向正好相反。\n\n这会不会矛盾？不会。这只是“记账约定”。就像地铁里人群往出口走，但你统计“客流方向”时可以从入口往出口记。工程上统一用“正电荷方向”，公式和符号才不容易乱。你只要记住：**算电路时按规定的电流方向算，不要一会儿按电子、一会儿按正电荷。**\n\n电流还分两种情况：\n\n- **直流**（DC，direct current）：方向不随时间改变，大小可以稳定，也可以有纹波。\n- **交流**（AC，alternating current）：方向随时间周期性改变。家里插座就是交流，我们后面做实验只用隔离低压。\n\n严格说，“直流/交流”描述的是随时间的变化方式，不是“电池/插座”的同义词。电池也可能被电路快速开关，变成脉冲电流；插座经过整流也能变直流。第 1.5 节会专门讲“随时间变化”这件事。\n\n电流要持续流动，必须有**闭合路径**：从电源一端出发，经过负载，再回到电源另一端。路径断了，电流就停了（开路）；路径被一根几乎零电阻的线直接接通，电流会异常大（短路，1.2 节讲）。\n\n**这在板子上**：电流从电源正极出发，经过稳压器、走线、过孔、器件引脚、负载，再经地线回到电源负极。走线不是“理想导线”，它有电阻，所以大电流路径会发热、会掉电压。第 1.3 节会算这件事。\n\n#### 1.1.3 电压：两点之间的“电位差”\n\n水为什么往低处流？因为高处和低处有高度差。电荷为什么愿意流动？因为两点之间有**电位差**。\n\n**电压**（voltage）就是两点之间的电位差，符号常用 `U`（有些书用 `V`），单位**伏特**（volt，符号 `V`）。\n\n电压的定义可以从能量理解：把 1 库仑电荷从一点搬到另一点，如果电场做了 1 焦耳的功，这两点之间的电压就是 1 伏特：\n\n```text\n1 V = 1 J/C\n```\n\n这个定义现在不用深究，先记住一句更重要的话：\n\n> **电压永远是两个点之间的事，不存在“某一点有 5V”这种绝对说法。**\n\n我们说“这个引脚是 5V”，省略了参照点，完整意思是“这个引脚相对于电路的地（0V 参考点）是 5V”。如果换一个参考点，同一个点的“电压读数”会变，但两点之间的电压差不变。\n\n这和身高很像：你说“他身高 1.8 米”，是以地面为参考；如果站在 10 米高的楼顶量，读数会变，但他和地面之间的高度差没变。电压也一样，**参考点决定读数，不决定电路里真实的电位差**。\n\n电路里的**地**（GND，ground）通常被选作 0V 参考点。注意：这里的“地”不一定真的接到大地。它可能只是板上的一条公共回线，叫**信号地**；也可能是金属外壳，叫**机壳地**；还可能是通过隔离电源浮空的**隔离地**。它们不是一回事，后面第 11 课讲接口和隔离时会展开。\n\n电压有正负。比如 `A 点比 B 点高 5V`，写成 `U_AB = +5V`；反过来 `U_BA = -5V`。负号只表示方向相反，不表示“比零小所以没有电”。\n\n**这在板子上**：电源轨（3.3V、5V、12V）是对地电压；器件的“耐压”指的是它两端允许的最大电压差；万用表测电压时，表笔要分别接触两个点，读数是这两点之间的差。\n\n**常见错**：把“电源电压”当成“某个电阻两端的电压”。比如 5V 电源串一个电阻和一个 LED，电阻两端并不是 5V，而是 `5V - LED 压降`。第 1.3 节会用算例纠正。\n\n#### 1.1.4 电阻：对电流的阻碍\n\n水在水管里流，会遇到管壁摩擦、弯头、阀门；电荷在导体里跑，也会遇到阻碍。这个阻碍作用叫**电阻**（resistance），符号常用 `R`，单位**欧姆**（ohm，符号 `Ω`）。\n\n电阻的定义来自欧姆定律：\n\n```text\nR = U / I\n```\n\n- `R`：电阻，单位欧姆（`Ω`）\n- `U`：电阻两端的电压，单位伏特（`V`）\n- `I`：流过电阻的电流，单位安培（`A`）\n\n所以 `1 Ω = 1 V/A`：在电阻两端加 1V，如果流过 1A，这个电阻就是 1Ω。\n\n电阻的大小由材料、长度、截面积和温度决定。定性地说：\n\n- 材料越难导电，电阻越大；\n- 导体越长，电阻越大；\n- 截面积越粗，电阻越小；\n- 温度升高时，多数金属的电阻会变大（不是所有材料都这样，半导体通常相反）。\n\n写成公式就是：\n\n```text\nR = ρ × L / A\n```\n\n- `ρ`（读作“rho”）：电阻率，材料本身的属性，单位 `Ω·m`\n- `L`：导体长度，单位米（`m`）\n- `A`：截面积，单位平方米（`m²`）\n\n这个公式现在不用代入复杂数字，但要记住它的三个结论：**长、细、材料差 → 电阻大**。PCB 走线为什么大电流要加宽？因为加宽就是增大 `A`，电阻和压降都会变小。\n\n还要分清两个概念：\n\n- **电阻**是物理性质，任何导体都有，哪怕是一根铜线。\n- **电阻器**（resistor）是专门做出来、具有确定阻值的元件，原理图里用 `R` 表示，位号如 `R1`。\n\n电阻器有额定功率。电流流过电阻会发热，超过额定功率可能烧毁。第 1.3 节会算。\n\n电阻不一定是“线性的”。线性电阻满足 `U/I` 为常数；二极管、LED、灯丝、热敏电阻的 `U/I` 关系不是直线，不能简单套欧姆定律。这个区别在第 05 章讲二极管时会非常关键。\n\n**这在板子上**：铜走线有电阻，过孔有电阻，连接器触点有电阻，电阻器本身更是故意做出来的电阻。小信号路径上，几欧姆可能无所谓；大电流路径上，几毫欧都会变成压降和热量。\n\n#### 1.1.5 功率与能量：电到底在“干什么”\n\n电流流过电阻会发热，灯泡会发光，电机会转。这些都是电在做功，也就是把电能转换成其他形式。\n\n**功率**（power）是单位时间内转移或消耗的能量，符号 `P`，单位**瓦特**（watt，符号 `W`）。\n\n最基本的公式是：\n\n```text\nP = U × I\n```\n\n- `P`：功率，单位瓦（`W`）\n- `U`：器件两端的电压，单位伏（`V`）\n- `I`：流过器件的电流，单位安（`A`）\n\n结合欧姆定律 `U = I × R`，还能得到两个常用变形：\n\n```text\nP = I² × R\nP = U² / R\n```\n\n这三个公式是同一件事的不同写法，用哪个方便就用哪个：\n\n- 知道电压和电流：用 `P = U × I`。\n- 知道电流和电阻：用 `P = I² × R`。\n- 知道电压和电阻：用 `P = U² / R`。\n\n**能量**（energy）是功率乘以时间：\n\n```text\nE = P × t\n```\n\n单位是**焦耳**（`J`）。日常电费说的“度”，是千瓦时（`kWh`）：`1 kWh = 1000W × 3600s = 3.6×10⁶ J`。\n\n功率和能量别混：\n\n- 功率是“快慢”：1W 的灯，每秒钟消耗 1J。\n- 能量是“总量”：1W 的灯亮 1 小时，消耗 3600J。\n\n**这在板子上**：电阻的额定功率常见 0.125W、0.25W、0.5W、1W。算出实际功耗后，不能贴着额定值用，要留降额余量（比如按额定值的 50%～70% 设计，具体看温度和厂家要求）。一个 0.25W 的电阻上消耗 0.2W，虽然“没超”，但已经很热，长期可靠性会下降。第 02 章会专门讲选型。\n\n#### 1.1.6 单位换算与数量级\n\n电子电路里的数字跨度很大，从皮安到安培、从皮法到法拉。先建立“数量级感”，比死记换算表更重要。\n\n常用前缀：\n\n| 前缀 | 符号 | 倍数 | 例子 |\n|---|---|---:|---|\n| 皮 | p | 10⁻¹² | 10pF = 0.00000000001F |\n| 纳 | n | 10⁻⁹ | 100nF = 0.1μF |\n| 微 | μ | 10⁻⁶ | 10μF = 0.00001F |\n| 毫 | m | 10⁻³ | 20mA = 0.02A |\n| 千 | k | 10³ | 10kΩ = 10000Ω |\n| 兆 | M | 10⁶ | 1MΩ = 1000000Ω |\n| 吉 | G | 10⁹ | 1GHz = 10⁹Hz |\n\n几个必须脱口而出的换算：\n\n- `1 A = 1000 mA = 10⁶ μA`\n- `1 V = 1000 mV`\n- `1 Ω = 1000 mΩ`；`1 kΩ = 1000 Ω`；`1 MΩ = 1000 kΩ`\n- `1 F = 1000 mF = 10⁶ μF = 10⁹ nF = 10¹² pF`\n- `100 nF = 0.1 μF`\n- `1 kHz = 1000 Hz`；`1 MHz = 1000 kHz`\n\n做计算前，先把单位统一成“伏、安、欧、瓦、秒”。比如 `20mA` 要写成 `0.02A`，`10kΩ` 要写成 `10000Ω`。这一步不做，答案会差 1000 倍。\n\n**这在板子上**：丝印上的 `103` 不是 103Ω，而是 `10×10³Ω = 10kΩ`；`104` 是 `100kΩ`。电容上的 `104` 是 `10×10⁴pF = 100nF`。这些标记法第 02、03 章会讲，现在先知道“数字不等于阻值本身”。\n\n#### 1.1.7 停下来检查\n\n1. 一个物体带负电，是多了电子还是少了电子？\n2. `2 A` 的电流，10 秒内流过某截面的电荷量是多少库仑？\n3. “这个引脚是 3.3V”这句话省略了什么？\n4. 一根铜线被加粗后，电阻变大还是变小？为什么？\n5. `P = U × I` 和 `P = I² × R` 在什么条件下等价？\n6. `100nF` 等于多少 `μF`？`10kΩ` 等于多少 `Ω`？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 多了电子。电子带负电，负电荷过剩。\n2. `Q = I × t = 2A × 10s = 20C`。\n3. 省略了参考点。完整意思是“这个引脚相对于电路 0V 参考点是 3.3V”。\n4. 变小。加粗增大了截面积 `A`，由 `R = ρL/A`，电阻与截面积成反比。\n5. 对线性电阻、且 `U` 是电阻两端电压时，由欧姆定律 `U = IR` 可推出 `P = I²R`。如果 `U` 拿的是电源电压而不是电阻两端电压，就不能直接代。\n6. `100nF = 0.1μF`；`10kΩ = 10000Ω`。\n\n<\/details>\n\n### 1.2 电路的基本连接\n\n#### 1.2.1 通路、开路、短路\n\n一个能持续工作的电路，至少要有三部分：\n\n- **电源**（source）：提供电压，推动电荷流动。\n- **负载**（load）：消耗电能、完成工作的部分，比如 LED、电阻、电机、芯片。\n- **连接路径**：把电源和负载连成闭合回路的导线、走线、接插件。\n\n按路径状态，电路分三种：\n\n| 状态 | 路径情况 | 电流 | 现象 |\n|---|---|---|---|\n| **通路**（closed circuit） | 闭合，电流能回到电源 | 正常 | 负载工作 |\n| **开路**（open circuit） | 某处断开 | 近似为零 | 负载不工作 |\n| **短路**（short circuit） | 电源两端被极低电阻直接连通 | 很大 | 发热、烧器件、电池危险 |\n\n短路为什么危险？因为回路里几乎只剩电源内阻和导线电阻，按欧姆定律 `I = U/R`，电阻极小，电流会非常大。这个电流会在导线、接插件、电池内部产生大量热，可能烧毁器件、熔化焊锡、引燃附近材料，锂电池还可能发生热失控。\n\n**短路不是“电压没了”**。短路时电源电压几乎都降在电源内阻和导线电阻上，负载两端反而接近 0V；但电流可能已经大到危险。所以“用万用表量到 0V”不能说明安全，必须断电查短路。\n\n**这在板子上**：焊接桥连、锡渣、器件引脚搭到一起、电源与地接反、封装焊盘画错，都可能造成短路。第一次上电前，先断电用万用表通断档查电源正负之间是否直通，是基本习惯。\n\n#### 1.2.2 串联与并联\n\n两个电阻（或任何器件）只有两种基本接法。\n\n**串联**：首尾相连，只有一条电流路径。\n\n```text\n        R1          R2\n  A ──[====]──●──[====]── B\n              │\n            这里没有分支\n```\n\n串联的特点：\n\n- 流过每个器件的**电流相同**（同一根水管，水流量一样）。\n- 各器件两端电压**相加**等于总电压：`U_total = U1 + U2`。\n- 总电阻**相加**：`R_total = R1 + R2 + …`。\n\n为什么总电阻相加？因为电荷要依次穿过每一段阻力，阻力当然越走越大。串联两个 10kΩ，总电阻就是 20kΩ。\n\n**并联**：首首相连、尾尾相连，电流有多个分支。\n\n```text\n          ┌──[ R1 ]──┐\n  A ──●──┤          ├──●── B\n          └──[ R2 ]──┘\n```\n\n并联的特点：\n\n- 每个分支两端的**电压相同**（都接在同样的两个节点上）。\n- 各分支电流**相加**等于总电流：`I_total = I1 + I2`。\n- 总电阻的倒数等于各分支倒数之和：\n\n```text\n1 / R_total = 1 / R1 + 1 / R2 + …\n```\n\n两个电阻并联时，有一个更顺手的形式：\n\n```text\nR_total = (R1 × R2) / (R1 + R2)\n```\n\n两个 10kΩ 并联，总电阻是 `(10k×10k)/(10k+10k)=5kΩ`。**并联越并越小**，因为相当于给电流多开了一条路；总电阻一定小于最小的那个分支。这个直觉很重要，后面算负载、算上拉下拉都会用到。\n\n串联分压、并联分流，是电路里最常用的两个“分配规则”。\n\n#### 1.2.3 分压与分流：先会算，再谈用\n\n**分压**：两个电阻串联，总电压按阻值比例分到各电阻上。\n\n```text\n        R1\n  Vin ──[====]──● Vout\n                │\n              [ R2 ]\n                │\n               GND\n```\n\n如果 `Vout` 取自 R2 两端（相对 GND），空载时：\n\n```text\nVout = Vin × R2 / (R1 + R2)\n```\n\n推导很短：串联电流 `I = Vin/(R1+R2)`；R2 两端电压 `Vout = I×R2`；代入就得到上式。\n\n例子：`Vin=5V`，`R1=10kΩ`，`R2=10kΩ`，则 `Vout=5×10k/(10k+10k)=2.5V`。两个阻值相等，电压对半分。\n\n如果 `R1=10kΩ`、`R2=1kΩ`，则 `Vout=5×1k/(11k)≈0.455V`。R2 越小，分到的电压越小。\n\n**分压公式只在输出端“几乎不取电流”时成立**。一旦在 Vout 上接负载，负载会和 R2 并联，等效阻值变小，输出电压就跌。这个现象叫**负载效应**，1.4 节会算。分压电路不能当“稳压电源”用，这是零基础最容易踩的坑之一。\n\n**分流**：两个电阻并联，总电流按阻值反比分配。\n\n```text\nI_total ──●──[ R1 ]──┐\n          │          ├── 回到电源\n          └──[ R2 ]──┘\n```\n\n两个并联分支中，流过 R1 的电流是：\n\n```text\nI1 = I_total × R2 / (R1 + R2)\n```\n\n注意分子是“另一个电阻”。因为阻值越小，分到的电流越大，所以公式里 R1 的电流配 R2。这个形式和分压刚好“反过来”，容易记混，建议每次用之前先想“电流喜欢走阻力小的路”。\n\n例子：总电流 3mA，R1=1kΩ，R2=2kΩ，则 `I1=3mA×2k/(1k+2k)=2mA`，`I2=1mA`。1kΩ 那条路更通畅，分到更多电流。\n\n#### 1.2.4 地（GND）只是参考点\n\n原理图里经常看到一条横线、一个倒三角，或者 `GND`、`AGND`、`PGND`、`EARTH` 这些标记。零基础最容易以为“地就是没有电”，其实不是。\n\n**地是人为选定的 0V 参考点。** 就像测身高以地面为 0，地只是“我们约定从这里开始量电压”。电路里的电流照样会流经地线，地线也有电阻，也会发热、掉电压。\n\n常见的“地”至少有三种：\n\n| 名称 | 含义 | 注意 |\n|---|---|---|\n| **信号地**（GND） | 板上大部分电路的 0V 参考，也是信号回流的公共路径 | 不是“万能吸收点”，大电流回流会抬高地电位 |\n| **大地 / 保护地**（EARTH、PE） | 真正接到建筑物大地，用于安全保护 | 与信号地可能隔离，不能想当然短接 |\n| **机壳地**（Chassis GND） | 金属外壳、屏蔽罩的参考 | 常与信号地通过电容/电阻/螺钉连接，具体看设计 |\n\n还有**隔离地**：通过变压器、光耦、隔离电源隔开的地。隔离两侧的地之间可能有很高的电位差，直接用万用表把两边地夹在一起，可能损坏设备或引入危险。\n\n**这在板子上**：`GND` 网络不是一个“点”，而是一大片铜、很多过孔、很多引脚。大电流（电机、电源）和小信号（传感器、ADC）共用一条地线时，大电流在地线电阻上产生的压降会叠加到小信号上，造成干扰。这就是后面要学的“回流路径”和“分区/单点接地”的由来。现在先记住：**地是参考点，也是电流的回流路径，不是垃圾场。**\n\n#### 1.2.5 电压表、电流表怎么接\n\n测量电压和电流，接线方式完全不同。接错可能读不出数，也可能烧表、烧电路。\n\n**测电压：并联。**\n\n电压是两点之间的差，所以电压表要跨接在被测两点上。\n\n```text\n       ┌──────[ V ]──────┐\n       │                 │\n  A ───●────[ 电阻 ]─────●─── B\n```\n\n电压表的内阻很大（理想为无穷大），几乎不取电流，所以并联上去不会明显改变原电路。万用表电压档就是这样用的。\n\n**测电流：串联。**\n\n电流要流过表，表才能数出多少电荷通过。所以电流表要串在被测支路里，让电流从表里穿过。\n\n```text\n  A ───[ A ]───[ 电阻 ]─── B\n        ↑\n     电流从表里流过\n```\n\n电流表的内阻很小（理想为零），串进去尽量不改变原电路。但“很小”不是零，会有一点**压降**（叫负担电压），大电流测量时要注意。\n\n**绝对不要把电流表并联在电源两端**。那相当于用一根几乎零电阻的线把电源短路，电流会瞬间很大，轻则烧保险，重则烧表、烧电源。\n\n**这在板子上**：测某器件电压，表笔分别点器件两端；测某支路电流，需要断开支路串入表，或者用电流探头/分流器。板上留测试点（test point）就是为了方便夹表笔，不用在密密麻麻的引脚上冒险。\n\n#### 1.2.6 停下来检查\n\n1. 两个 10kΩ 电阻串联、并联，总电阻各是多少？\n2. 5V 经 R1=10kΩ、R2=2kΩ 串联，R2 两端电压是多少？如果输出端接一个 2kΩ 负载，输出会变大还是变小？\n3. 为什么并联电路的总电阻一定小于最小的分支电阻？\n4. “GND 上没有电压”这句话为什么是错的？\n5. 测一个电阻两端的电压，表应该并联还是串联？测流过它的电流呢？\n6. 如果不小心把电流表并联到 5V 电源两端，会发生什么？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 串联 `20kΩ`；并联 `5kΩ`。\n2. 空载 `Vout=5×2k/(10k+2k)=0.833V`；接 2kΩ 负载后，R2 与负载并联成 1kΩ，`Vout=5×1k/(10k+1k)=0.455V`，变小。\n3. 并联相当于多开电流通路，总电流变大而电压不变，所以等效电阻变小；极限情况（短路一条分支）总电阻趋近 0。\n4. 地只是 0V 参考点，地线有电阻，电流流过会产生压降；大电流回流时地电位会抬升。\n5. 测电压并联；测电流串联。\n6. 相当于短路电源，电流会非常大，可能烧表、烧电源或引发危险。\n\n<\/details>\n\n### 1.3 欧姆定律与功率：电路计算的两把起子\n\n#### 1.3.1 欧姆定律的三种形态\n\n欧姆定律描述的是线性电阻上电压、电流、电阻三者的关系：\n\n```text\nU = I × R\nI = U / R\nR = U / I\n```\n\n三个式子完全等价，只是把不同的量放在等号左边。做题时先看“已知什么、求什么”，再挑最省事的那一个。\n\n- 已知电流和电阻，求电压：`U = I × R`。\n- 已知电压和电阻，求电流：`I = U / R`。\n- 已知电压和电流，求电阻：`R = U / I`。\n\n关键不是背公式，而是记住**每个量指的是同一段电路**。`U` 必须是这段电阻两端的电压，`I` 必须是通过这段电阻的电流，`R` 必须是这段电阻的阻值。三个量“对不上号”，算出来一定错。\n\n#### 1.3.2 欧姆定律的适用条件\n\n欧姆定律不是万能公式。它成立需要满足：\n\n1. **线性关系**：电压和电流成正比，`U/I` 是常数。普通金属电阻、绝大多数电阻器在正常工作范围内满足。\n2. **温度等条件基本稳定**：电阻会随温度变化，温度大幅变化时 `R` 不再是常数。\n3. **是同一段导体/电阻**：不能拿电源电压和另一个器件的电流硬套。\n\n下面这些**不能直接套欧姆定律**：\n\n- 二极管、LED：正向电压和电流是指数关系，不是直线。\n- 三极管、MOS 管：它们是受控器件，电流由控制端决定，不是简单 `U/R`。\n- 灯丝灯泡：冷态和热态电阻差很多，开机瞬间浪涌电流大。\n- 电机：启动、堵转、空载状态差别巨大。\n\n所以看到“非线性器件”，要查数据手册或按器件模型分析，不能拿万用表量一个电阻值就代入。\n\n#### 1.3.3 算之前先统一单位\n\n电子电路里最常见的计算错误不是公式错，而是单位没统一。\n\n规则很简单：**代入公式前，把电压换成伏（V）、电流换成安（A）、电阻换成欧（Ω）、功率换成瓦（W）、时间换成秒（s）。**\n\n例如：\n\n- `20mA` 写成 `0.02A`\n- `10kΩ` 写成 `10000Ω`\n- `100nF` 写成 `100×10⁻⁹F`\n- `2ms` 写成 `0.002s`\n\n如果题目给的是 `5V`、`10kΩ`，求电流，可以直接用 `I=5/10000=0.0005A=0.5mA`。如果先把 `10kΩ` 当成 `10` 代进去，就错了 1000 倍。\n\n#### 1.3.4 算例一：给 LED 选限流电阻\n\n这是最经典、也最容易被“想当然”算错的一道题。\n\n**题目**：5V 电源，红色 LED 正向压降约 2V，希望工作电流约 5mA，求串联限流电阻。\n\n**第一步：画清谁和谁串联。**\n\n```text\n  +5V ───[ R1 ]───→|─── GND\n                  LED\n```\n\n电阻和 LED 串联，流过它们的电流相同。电源电压 5V 分在两部分上：\n\n```text\nU_R + U_LED = 5V\n```\n\n**第二步：求电阻两端的电压。**\n\nLED 正向导通时，两端大约有 2V 的压降（具体查手册，且随电流、温度变化）。所以电阻两端不是 5V，而是：\n\n```text\nU_R = 5V - 2V = 3V\n```\n\n**第三步：用欧姆定律求电阻。**\n\n目标电流 5mA = 0.005A：\n\n```text\nR = U_R / I = 3V / 0.005A = 600Ω\n```\n\n600Ω 不是常用阻值，选标准系列里最接近的 **620Ω**。\n\n**第四步：复核实际电流。**\n\n```text\nI = 3V / 620Ω ≈ 0.00484A = 4.84mA\n```\n\n和 5mA 很接近，可以接受。实际还要考虑电源容差、LED 压降离散性、电阻容差。\n\n**第五步：算电阻功耗。**\n\n```text\nP_R = U_R × I ≈ 3V × 0.00484A ≈ 0.0145W\n```\n\n选 0.25W 电阻远远够用。\n\n**第六步：做一次保守上界。**\n\n如果电源偏高到 5.25V、电阻偏小到 646Ω（620Ω ±5% 的下限），并且极端假设 LED 压降为 0V：\n\n```text\nI_max = 5.25V / 646Ω ≈ 8.13mA\n```\n\n这个值是“最坏情况”的保守估计，用来确认不会超过 LED 允许电流。实际 LED 有正向压降，电流会比这个小。不能把绝对最大额定值（比如 30mA）当成推荐工作电流，仍要留余量和查温度降额。\n\n**这道题的关键不是 600Ω，而是：电阻两端的电压 = 电源电压 − LED 压降。** 直接把 5V 代进 `R=U/I` 会得到 `R=1kΩ`，电流只有约 3mA，LED 会偏暗；如果 LED 压降更低的型号，偏差更大。\n\n#### 1.3.5 算例二：PCB 走线的电阻和压降\n\n铜不是理想导体，走线有电阻。小信号可以忽略，大电流不能忽略。\n\n**题目**：一条 1oz 铜、宽 1mm、长 100mm 的走线，流过 1A，估算压降和功耗。\n\n1oz 铜厚约 `35μm = 35×10⁻⁶m`，宽 `1mm = 1×10⁻³m`，长 `0.1m`。截面积：\n\n```text\nA = 35×10⁻⁶ × 1×10⁻³ = 3.5×10⁻⁸ m²\n```\n\n铜的电阻率约 `ρ = 1.7×10⁻⁸ Ω·m`（室温附近，具体随温度和铜纯度变化）：\n\n```text\nR = ρL/A = 1.7×10⁻⁸ × 0.1 / 3.5×10⁻⁸ ≈ 0.049Ω\n```\n\n压降：\n\n```text\nU_drop = I × R = 1A × 0.049Ω ≈ 0.049V = 49mV\n```\n\n功耗：\n\n```text\nP = I²R = 1² × 0.049 ≈ 0.049W\n```\n\n49mV 的压降对 3.3V 逻辑可能已经接近允许范围，对 5V 电源也不小；0.049W 集中在一条细走线上，会局部升温。如果电流是 3A，压降和功耗都按平方/比例变大：压降约 0.147V，功耗约 0.44W。这就是大电流走线要加宽、加铜、多打过孔的原因。\n\n注意：这是**估算**，没有算过孔、焊盘、连接器、铜厚公差、温度升高等。实际设计要用板厂参数、载流表或仿真复核。这里只建立“走线不是零电阻”的意识。\n\n#### 1.3.6 功率、额定功率与降额\n\n前面已经给出三个功率公式。工程上还要多问一句：**这个功率，器件受不受得了？**\n\n电阻器手册里会写额定功率，比如：\n\n- 0603 贴片电阻常见 0.1W\n- 0805 常见 0.125W\n- 1206 常见 0.25W\n- 插件金属膜电阻常见 0.25W、0.5W、1W\n\n额定功率是在规定环境温度、安装条件下的允许值，不是“超过一点也没事”。实际使用要**降额**：\n\n- 电阻长期工作，建议按额定功率的 50%～70% 以内设计；\n- 环境温度高、散热差、多个发热器件挨在一起时，还要再降；\n- 脉冲、浪涌、启动电流要单独核算，不能只看平均值。\n\n**这在板子上**：一个 0.25W 电阻实际耗 0.2W，看起来“没超”，但已经很热；长期高温会改变阻值、缩短寿命，甚至烧断。选型时宁可大一号，也不要贴着极限用。\n\n功率和能量再区分一次：\n\n- 功率是“每秒消耗多少能量”，单位 W；\n- 能量是“总共消耗多少”，单位 J 或 kWh。\n\n电阻的发热功率是瞬时/平均功率；一段时间的总发热量是 `E=P×t`。算温升要看热阻和散热条件，不能只拿功率对比额定值。\n\n#### 1.3.7 常见错误清单\n\n1. **拿电源电压当电阻电压**：串联多个器件时，每个器件只分到一部分电压。\n2. **忘记 LED 正向压降**：`R=(5−2)/I`，不是 `R=5/I`。\n3. **mA 没换成 A**：`5mA` 要写成 `0.005A`，否则结果差 1000 倍。\n4. **把欧姆定律套在二极管/LED 上**：它们不是线性电阻，`U/I` 不是常数。\n5. **忽略电阻功率**：算出阻值就选最便宜的 0603，结果一上电就发烫。\n6. **把“额定功率”当“实际功耗上限”**：额定值要降额使用。\n7. **忽略容差和温度**：`±5%` 的电阻，最坏情况要按边界算。\n8. **把走线当理想导线**：大电流路径的压降和发热必须核算。\n\n#### 1.3.8 停下来检查\n\n1. 5V 电源、LED 压降 2V、目标电流 5mA，限流电阻约多少？选 620Ω 后实际电流约多少？\n2. 一个 1kΩ 电阻两端电压 5V，流过它的电流是多少？功耗是多少？\n3. 一个 0.25W 电阻实际耗 0.3W，能不能长期用？为什么？\n4. 为什么不能直接用 `R=U/I` 算 LED 的“电阻”？\n5. 一条走线电阻 0.1Ω，流过 2A，压降和功耗各是多少？\n6. `20mA`、`10kΩ` 代入公式前分别要写成什么？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `R=(5−2)/0.01=300Ω`；选 620Ω 后 `I=3/620≈4.84mA`（如果题目要求 10mA，应选 300Ω 左右的标准值，620Ω 会偏暗）。\n2. `I=5/1000=0.005A=5mA`；`P=5×0.005=0.025W`。\n3. 不能。已经超过额定值，长期发热会缩短寿命甚至烧毁；应选更大功率或降低电流。\n4. LED 的正向电压和电流不是线性关系，`U/I` 随工作点变化，不是常数；应按手册的正向特性或串限流电阻设计。\n5. `U=2×0.1=0.2V`；`P=2²×0.1=0.4W`。\n6. `20mA=0.02A`；`10kΩ=10000Ω`。\n\n<\/details>\n\n### 1.4 电路分析的两条“对账规则”\n\n#### 1.4.1 为什么需要 KCL 和 KVL\n\n简单电路可以靠直觉：串联电流一样，并联电压一样，分压按比例。但电路一复杂，直觉就不够用了。比如一个节点连着三条支路，每条支路的电流是多少？一个回路里有电源、两个电阻、一个二极管，电压怎么分？\n\n这时需要两条“对账规则”：\n\n- **KCL**（基尔霍夫电流定律，Kirchhoff's Current Law）：电荷不会在节点上堆积，流进来的必须等于流出去的。\n- **KVL**（基尔霍夫电压定律，Kirchhoff's Voltage Law）：绕一个闭合回路走一圈，电压升和电压降必须抵消，回到起点电位相同。\n\n先定义三个词：\n\n- **节点**（node）：两条或更多支路汇合的点。\n- **支路**（branch）：连接两个节点的路径，通常是一段导线或一个器件。\n- **回路**（loop）：从某个节点出发，沿支路走一圈回到该节点，途中不重复经过支路。\n\n这两条规则本质上是**电荷守恒**和**能量守恒**在电路里的写法。它们对线性、非线性电路都成立，不依赖欧姆定律，所以比“分压公式”更通用。\n\n#### 1.4.2 KCL：节点上的电流账本\n\nKCL 的一句话版本：\n\n> 流入一个节点的电流总和，等于流出这个节点的电流总和。\n\n写成式子：\n\n```text\nΣ I_in = Σ I_out\n```\n\n如果把“流入”记为正、“流出”记为负，也可以写成：\n\n```text\nΣ I = 0\n```\n\n两种写法等价，选一种，全程不要混。\n\n例子：一个节点连着三条支路，支路 A 流入 2mA，支路 B 流出 1mA，支路 C 的电流是多少？\n\n```text\n流入 = 流出\n2mA = 1mA + I_C\nI_C = 1mA（流出）\n```\n\n如果算出来是负值，说明实际方向和假设相反，不是“没有电流”。\n\nKCL 的直觉很像十字路口的车流：不管路口里怎么拐，进路口的车总数必须等于出路口的车总数；车不会在路口堆起来。电荷也一样，节点不是仓库。\n\n#### 1.4.3 KVL：绕回路走一圈的电压账本\n\nKVL 的一句话版本：\n\n> 沿一个闭合回路走一圈，所有电压升之和等于所有电压降之和；回到起点，电位差为零。\n\n写成式子：\n\n```text\nΣ U_rise = Σ U_drop\n```\n\n或者把“升”记正、“降”记负：\n\n```text\nΣ U = 0\n```\n\n例子：5V 电源、R1、R2 串联成一个回路。从电源负极出发，经电源升 5V，再经 R1 降 U1、经 R2 降 U2，回到负极：\n\n```text\n5V = U1 + U2\n```\n\n这就是串联分压的来源。KVL 不需要知道电阻多少，先告诉你“总电压被分完了”。\n\n符号约定很重要：\n\n- 从 `+` 到 `−` 穿过一个器件，算**电压降**。\n- 从 `−` 到 `+` 穿过电源，算**电压升**。\n- 绕行方向可以自己选，选顺时针或逆时针都行，但一圈内要一致。算出的负号只表示实际极性与假设相反。\n\n#### 1.4.4 用 KCL、KVL 解一个分压电路\n\n题目：5V 电源，R1=10kΩ，R2=10kΩ 串联，求 R2 两端电压和回路电流。\n\n**第一步：KVL 列电压账。**\n\n```text\n5V = U1 + U2\n```\n\n**第二步：欧姆定律把电压换成电流。**\n\n串联回路只有一条电流 `I`，流过 R1 和 R2：\n\n```text\nU1 = I × R1\nU2 = I × R2\n```\n\n代入 KVL：\n\n```text\n5V = I × R1 + I × R2 = I × (R1 + R2)\n```\n\n所以：\n\n```text\nI = 5V / (10kΩ + 10kΩ) = 5V / 20kΩ = 0.00025A = 0.25mA\n```\n\n**第三步：求 R2 电压。**\n\n```text\nU2 = I × R2 = 0.00025A × 10000Ω = 2.5V\n```\n\n结果和分压公式 `Vout=Vin×R2/(R1+R2)` 一致。分压公式不是新公式，它就是 KVL + 欧姆定律推出来的快捷方式。\n\n**第四步：KCL 检查。**\n\n这个串联回路只有一个回路电流，每个节点都是一进一出，KCL 自动满足：`I_in = I_out = 0.25mA`。如果电路有分支，KCL 才真正派上用场。\n\n#### 1.4.5 负载效应：分压点为什么一接东西就跌\n\n这是零基础最重要的“反直觉”之一。\n\n前面算出 5V、10kΩ、10kΩ 的分压点是 2.5V。但这个 2.5V 是**空载**值。现在在输出点和地之间接一个 10kΩ 的负载，会发生什么？\n\n负载 R_L 与 R2 并联：\n\n```text\nR2 || R_L = (10k × 10k) / (10k + 10k) = 5kΩ\n```\n\n下半段等效电阻从 10kΩ 变成 5kΩ，分压比变了：\n\n```text\nVout = 5V × 5kΩ / (10kΩ + 5kΩ) = 5 × 5/15 ≈ 1.667V\n```\n\n从 2.5V 掉到 1.667V，跌了 0.833V，跌幅约 33%。\n\n为什么？因为负载不是“白拿电压”，它要从分压点取电流。这个电流流过 R1，在 R1 上产生额外压降，输出自然被拉低。\n\n从“输出端看进去”，这个分压电路不是一个理想电压源，而是一个带**内阻**的电压源。内阻等于 R1 与 R2 并联：\n\n```text\nR_out = R1 || R2 = 5kΩ\n```\n\n负载 R_L 和 R_out 串联分压，负载越重（R_L 越小），拿到的电压越低。这个“内阻”概念是后面戴维南等效、信号源阻抗、传感器输入阻抗的基础，现在先建立直觉。\n\n**结论**：\n\n- 分压电路可以当**电压参考**（后级几乎不取电流时），不能当**电源**。\n- 如果后级要取明显电流，需要加缓冲器（运放跟随器）、稳压器，或者把分压电阻取小（但功耗变大）。\n- 万用表测分压点时，表的内阻也会形成负载。普通数字万用表输入阻抗很高（通常 10MΩ 量级），对 10kΩ 分压影响很小；但用低阻抗表或测高阻分压时，读数会明显偏低。\n\n**这在板子上**：传感器分压、ADC 采样、基准电压，都要算“后级输入阻抗”。一个 100kΩ/100kΩ 的分压接进 10kΩ 输入，输出会严重偏离设计值，这不是器件坏了，是负载效应。\n\n#### 1.4.6 惠斯通电桥：分压的进阶用法\n\n惠斯通电桥是四个电阻组成的桥式电路，常用于传感器测量。\n\n```text\n            R1          R2\n      + ───[====]──●──[====]─── +\n                  │\n                 Vout\n                  │\n      − ───[====]──●──[====]─── −\n            R3          R4\n```\n\n两个分压支路并联在同一个电源上：\n\n- 上支路：R1 与 R2 分压，中点电压 `V_A = Vin × R2/(R1+R2)`。\n- 下支路：R3 与 R4 分压，中点电压 `V_B = Vin × R4/(R3+R4)`。\n- 输出电压是两点之差：`Vout = V_A − V_B`。\n\n当电桥**平衡**时：\n\n```text\nR1 / R2 = R3 / R4\n```\n\n或者交叉相乘：\n\n```text\nR1 × R4 = R2 × R3\n```\n\n此时 `V_A = V_B`，`Vout = 0V`。\n\n电桥的价值在于“测微小变化”：把其中一个电阻换成传感器（应变片、热敏电阻、光敏电阻），它的阻值随物理量变化，电桥就从不平衡输出一个小电压。这个电压很小，通常需要后面接仪表放大器或比较器。第 02 章讲电阻传感器、第 08 章讲运放时会再回来。\n\n现在只要记住：**电桥不是新魔法，就是两个分压支路相减；平衡条件是阻值比例相等。**\n\n#### 1.4.7 停下来检查\n\n1. 一个节点流入 5mA，两条支路分别流出 3mA 和 `I`，`I` 是多少？\n2. 5V 电源、R1=2kΩ、R2=3kΩ 串联，回路电流和 R2 电压各是多少？\n3. 分压电路空载输出 2.5V，接负载后跌到 1.8V，主要原因是什么？\n4. 分压电路的“输出内阻”怎么算？为什么负载越小，输出跌得越多？\n5. 惠斯通电桥平衡的条件是什么？平衡时输出是多少？\n6. KCL 和 KVL 只对线性电路成立吗？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `I = 5mA − 3mA = 2mA`（流出）。\n2. `I=5V/(2k+3k)=1mA`；`U2=1mA×3kΩ=3V`。\n3. 负载取电流，负载与下臂电阻并联使等效阻值变小，同时电流在上臂电阻上产生额外压降。\n4. `R_out = R1 || R2`；负载 R_L 与 R_out 串联分压，R_L 越小，分到的电压越小。\n5. `R1/R2 = R3/R4`（或 `R1×R4 = R2×R3`）；平衡时 `Vout=0V`。\n6. 不是。KCL 和 KVL 来自电荷守恒和能量守恒，对线性、非线性电路都成立；欧姆定律才要求线性电阻。\n\n<\/details>\n\n### 1.5 电压和电流随时间变化\n\n前面几节默认电压、电流是稳定的：5V 一直是 5V，1mA 一直是 1mA。现实电路里，它们经常随时间变化：插座电压每秒来回变 50 次，开关电源每秒开关几十万次，单片机的引脚在高低电平之间跳变。\n\n这一节建立一套描述“变化”的语言。不要求你会解微分方程，只要看到波形图、示波器屏幕或手册里的时序图，知道它在说什么。\n\n#### 1.5.1 直流与交流\n\n**直流**（DC，direct current）：电流方向不随时间改变。注意是“方向不变”，不是“大小绝对不变”。电池经稳压后的输出是直流；带纹波的电源输出也是直流，只是上面叠了一点波动。\n\n**交流**（AC，alternating current）：电流方向随时间周期性改变。家里插座是交流；变压器次级、函数信号发生器输出的正弦波也是交流。\n\n除了正弦，还有方波、三角波、锯齿波、脉冲等波形。它们都可能是交流，也可能是带直流偏置的交流。判断是不是交流，看**方向有没有周期性反转**，不看波形长什么样。\n\n一个容易混淆的点：**“直流”和“交流”描述的是随时间的变化方式，“模拟”和“数字”描述的是信号的表示方式。** 这是两组不同的分类，不要混在一起。第 1.5.5 小节讲模拟/数字。\n\n#### 1.5.2 波形、周期与频率\n\n把电压随时间的变化画成图，横轴是时间，纵轴是电压，这张图就叫**波形**（waveform）。示波器屏幕就是实时画这个图。\n\n一个周期性的波形，重复一次所用的时间叫**周期**（period），符号 `T`，单位秒（`s`）。\n\n一秒钟内重复的次数叫**频率**（frequency），符号 `f`，单位**赫兹**（hertz，符号 `Hz`）。\n\n周期和频率互为倒数：\n\n```text\nf = 1 / T\nT = 1 / f\n```\n\n例子：\n\n- 中国市电频率 50Hz，周期 `T = 1/50 = 0.02s = 20ms`。\n- 1kHz 的方波，周期 `1ms`。\n- 1MHz 的时钟，周期 `1μs`。\n- 2.4GHz 的 WiFi，周期约 `0.417ns`。\n\n频率越高，周期越短，同样的走线长度更容易表现出“传输线”效应。这个后面讲高速设计时再说，现在只要会换算。\n\n#### 1.5.3 幅值、峰峰值、平均值、有效值\n\n一个变化的电压，有四个常用的“大小”描述，必须分清。\n\n**峰值**（peak value，`Vp`）：波形在一个周期内达到的最大电压值（相对参考点）。如果波形有正负对称，峰值通常指正向最大值。\n\n**峰峰值**（peak-to-peak value，`Vpp`）：一个周期内最大值与最小值之差：\n\n```text\nVpp = Vmax − Vmin\n```\n\n**平均值**（average value，`Vavg`）：一个周期内电压的平均，也就是波形的“直流分量”。对称正弦波的平均值是 0；0～3.3V、50% 占空比的方波，平均值是 1.65V。\n\n**有效值**（RMS，root mean square，均方根值）：一个周期内电压平方的平均值再开方：\n\n```text\nVrms = √( (1/T) ∫ v(t)² dt )\n```\n\n这个公式看起来吓人，先不用手算积分。记住它的意义：**有效值是“产生同样热量”的等效直流电压。** 一个电阻 `R` 上，直流电压 `V` 的功率是 `V²/R`；交流电压的瞬时功率是 `v(t)²/R`，平均功率就是 `Vrms²/R`。所以有效值也叫“热等效值”。\n\n常用波形的结论：\n\n| 波形 | 平均值 | 有效值 |\n|---|---|---|\n| 恒定直流 `V` | `V` | `V` |\n| 正弦波，峰值 `Vp` | 0 | `Vp / √2 ≈ 0.707Vp` |\n| 0～`Vp` 方波，占空比 `D` | `D × Vp` | `Vp × √D` |\n| 对称方波，±`Vp`，50% | 0 | `Vp` |\n\n例子：中国市电标称 220V，这是**有效值**。它的峰值是 `220×√2 ≈ 311V`，峰峰值约 `622V`。所以说“220V”时，千万不要以为示波器上看到的峰值也是 220V；直接测市电峰值需要专用探头和隔离措施，零基础不要碰。\n\n再比如 3.3V 单片机 PWM，50% 占空比：\n\n```text\nVavg = 3.3 × 0.5 = 1.65V\nVrms = 3.3 × √0.5 ≈ 2.33V\n```\n\n同样波形，平均值和有效值不一样。万用表打在 DC 档读的是平均值，打在 AC 档读的是交流部分的某种有效值；普通万用表按正弦校准，测方波/PWM 时读数可能不准，需要 true RMS 表或示波器。\n\n#### 1.5.4 占空比与 PWM\n\n**占空比**（duty cycle，`D`）是一个周期内“高电平时间”占整个周期的比例：\n\n```text\nD = t_on / T\n```\n\n- `D=0%`：一直低。\n- `D=50%`：一半高、一半低。\n- `D=100%`：一直高。\n\n**PWM**（pulse width modulation，脉冲宽度调制）就是保持周期不变，改变高电平宽度，从而改变占空比。它不是“输出一个可变的模拟电压”，而是“快速开关，让负载自己平均”。\n\nPWM 的典型用途：\n\n- LED 调光：快速开关，眼睛看到的是平均亮度。\n- 电机调速：快速开关，电机电感把电流平滑掉。\n- 开关电源：控制开关管导通时间，稳定输出电压。\n- 舵机、加热器控制：用占空比表示目标位置/功率。\n\nPWM 的频率要足够高，让负载“感觉不到”开关。LED 调光一般几百 Hz 到几 kHz；电机 PWM 常见几 kHz 到几十 kHz。频率太低会看到闪烁、听到啸叫；频率太高会增加开关损耗。\n\n**这在板子上**：很多“模拟量控制”其实是 PWM。比如用单片机调 LED 亮度、调电机速度、调加热功率。看到 `PWM` 引脚，先问三个参数：频率、占空比、高电平电压。\n\n#### 1.5.5 模拟与数字：两种表示方式\n\n**模拟信号**（analog signal）：电压（或电流）在时间和数值上都连续变化。麦克风输出、温度传感器输出、正弦波，都是模拟信号。它的优点是能表示很细的连续变化；缺点是容易受噪声、温漂、传输损耗影响。\n\n**数字信号**（digital signal）：只使用有限的几个离散电平表示信息，最常见的是两个电平：低电平（逻辑 0）和高电平（逻辑 1）。单片机 GPIO、UART、I²C、SPI 都是数字信号。\n\n数字信号在物理上仍然是电压波形，仍然有上升沿、下降沿、过冲、振铃、噪声。它之所以“抗干扰”，是因为接收端只判断“高于某个阈值算 1、低于某个阈值算 0”，中间有一段容差；不是因为它变成了数学，不再受电学规律约束。\n\n这里只建立三个词：\n\n- **高电平**（VOH，output high voltage；VIH，input high voltage）：输出/输入被认作逻辑 1 的电压范围。\n- **低电平**（VOL，output low voltage；VIL，input low voltage）：输出/输入被认作逻辑 0 的电压范围。\n- **阈值**（threshold）：接收端判断高低的分界，通常是一个范围，不是某一个精确点。\n\n数字逻辑门、时序、建立保持时间、信号完整性，放到阶段三“数字电路基础”系统讲。本章只要求你知道：**模拟是连续表示，数字是离散电平表示；两者都是电压/电流的具体形态。**\n\n#### 1.5.6 边沿与带宽：先建立定性认识\n\n数字波形不是瞬间从 0 跳到 1。真实波形有一个上升过程，从低到高所需的时间叫**上升时间**（rise time，`t_r`），通常定义从 10% 到 90%。从高到低叫**下降时间**（fall time，`t_f`）。\n\n方波由很多不同频率的正弦波叠加而成：频率越高，边沿越陡。如果测量系统或传输通道的**带宽**（bandwidth）不够，高频成分被削弱，方波边沿就会变圆、变慢，甚至看起来像正弦波。\n\n一个常用的估算关系（只适用于一阶系统、10%～90% 定义）：\n\n```text\nBW ≈ 0.35 / t_r\n```\n\n例子：上升时间 10ns，对应带宽约 `0.35/10ns = 35MHz`。这意味着要观察这个边沿，示波器和探头带宽至少要在几十 MHz 以上，最好留 3～5 倍余量。\n\n现在不用会算，只要记住：\n\n- 边沿越陡，包含的高频成分越多；\n- 带宽不够，边沿会被“抹圆”；\n- 探头也有带宽和负载效应，不是接上去就绝对真实。\n\n#### 1.5.7 停下来检查\n\n1. 50Hz 的周期是多少毫秒？1kHz 呢？\n2. 一个 0～5V、25% 占空比的方波，平均值和有效值各是多少？\n3. 正弦波峰值 10V，有效值约多少？峰峰值多少？\n4. “220V 市电”的 220V 是峰值还是有效值？峰值约多少？\n5. PWM 是“输出可变电压”吗？它为什么能让 LED 变暗？\n6. 模拟信号和数字信号的根本区别是什么？数字信号是不是不受电学规律约束？\n7. 上升时间 20ns，估算需要多高带宽的测量系统？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `T=1/50=0.02s=20ms`；`T=1/1000=1ms`。\n2. `Vavg=5×0.25=1.25V`；`Vrms=5×√0.25=2.5V`。\n3. `Vrms=10/√2≈7.07V`；`Vpp=20V`。\n4. 220V 是有效值；峰值约 `220×√2≈311V`。\n5. 不是。PWM 在高低电平之间快速开关，负载（眼睛、电感、加热体）把平均效果表现出来；改变占空比就改变平均功率。\n6. 模拟在时间和数值上连续，数字只用有限离散电平表示信息；数字信号物理上仍是电压波形，仍受噪声、边沿、带宽等电学规律约束。\n7. `BW≈0.35/20ns=17.5MHz`，实际测量建议更高带宽并留余量。\n\n<\/details>\n\n### 1.6 安全与测量：先保证人和板子都活着\n\n#### 1.6.1 电的危险在哪里\n\n电伤人，主要不是“电压高”本身，而是**电流流过人体**，尤其是流过心脏、造成肌肉强直、灼伤或引发二次伤害。\n\n人体电阻不是固定值：干燥皮肤可能几十 kΩ 到几百 kΩ，出汗、破皮、潮湿时可能降到几 kΩ 甚至更低。按欧姆定律，同样电压下，电阻越小，流过人体的电流越大。所以“36V 是安全电压”这种说法有严格前提（干燥、正常环境、特定标准），不能当成“所有低压都随便摸”。\n\n大致感觉（仅用于建立危险意识，不是精确医学阈值）：\n\n- 约 1mA：有轻微刺痛感。\n- 约 10～30mA：肌肉可能不受控制地收缩，手可能“抓”住导线松不开。\n- 约 50mA 以上，路径经过心脏：可能引发心室颤动，有生命危险。\n\n家用 220V 交流电，在潮湿、破皮、单手到另一只手/脚形成回路时，电流足以致命。**零基础阶段不要测市电、不要拆电源适配器、不要碰任何带 220V 的板子。** 涉及市电的活，交给有资质、有隔离设备的人。\n\n做低压实验也要养成习惯：\n\n- 用**隔离低压电源**或电池供电，不用“裸”市电经整流桥直接搭电路。\n- 用**限流电源**：先设一个较小的电流上限（比如 100mA 或更小），一旦短路，电源自动降压限流，而不是让电流无限大。\n- 单手操作，另一只手不碰电路；不戴金属手表、戒指、项链。\n- 用绝缘工具，桌面干净，不把板子放在金属上。\n- 上电前确认电源正负、电压档位、极性；不确定就先用万用表量。\n- 电解电容、大电容断电后仍可能存电。断电后等一会儿，用合适电阻放电，不要拿螺丝刀直接短路（会打火、烧触点、伤电容）。\n- 锂电池短路、穿刺、过充可能起火。不要用普通电源直接给裸锂电池充电，要用带保护的充电电路。\n\n**安全不是“小心一点”的口号，是一套固定动作**：断电、放电、限流、检查、再上电。每次按顺序做，不靠记性。\n\n#### 1.6.2 第一次上电的正确顺序\n\n新板第一次上电，最容易“啪”一声烧器件。按下面顺序，可以把损失降到最小：\n\n1. **目视检查**：有没有锡渣、连锡、器件装反、极性电容反接、二极管方向反、芯片引脚歪、焊盘翘起。\n2. **断电测短路**：万用表通断档，测电源正极与地之间是否直通。蜂鸣不代表一定坏（有些电路有低阻路径），但要和原理图对照，确认不是短路。\n3. **空载/轻载上电**：限流电源先设小电流，电压从低到高，观察电流是否异常。\n4. **测电源轨**：先测稳压器输出、各电源轨对地电压，确认不是 0V、不是偏高、不是振荡。\n5. **摸温度**：断电后摸（或测温枪）芯片、稳压器、电阻，是否有异常发热。不要带电用手直接摸。\n6. **接负载**：确认电源正常后再接负载，逐步加负载，观察电压跌落和电流。\n7. **记录**：把电源电压、电流、关键点电压、温度、现象记下来。出问题时，这些数据比“好像不对”有用得多。\n\n**“烟酒测试”不是好方法**。上电闻焦味、看冒烟已经晚了。限流电源和逐步上电才是可控的。\n\n#### 1.6.3 万用表：最常用的四类测量\n\n万用表（multimeter）是电压、电流、电阻、通断/二极管等测量的基础工具。先分清档位和表笔插孔。\n\n**（1）直流电压档（DCV / V⎓）**\n\n- 用途：测电源轨、器件两端电压、分压点。\n- 接法：**并联**在被测两点上。\n- 注意：表的内阻很高（常见 10MΩ），一般不会明显影响电路；但测很高阻值的节点时，表本身也会形成负载。\n- 读数为负：表笔极性与实际电压方向相反，交换表笔即可，或按负数理解。\n\n**（2）交流电压档（ACV / V~）**\n\n- 用途：测交流电压，比如变压器次级、信号发生器输出。\n- 注意：普通万用表按正弦波有效值校准，测方波、PWM、失真波形时读数可能不准；需要 true RMS（真有效值）表。\n- 测市电有危险，零基础不要用普通表笔直接测插座。\n\n**（3）直流电流档（DCA / A⎓）**\n\n- 用途：测某条支路流过的电流。\n- 接法：**串联**在支路中，让电流从表里流过。\n- 注意：电流档内阻很小，**绝对不能并联在电源两端**，否则相当于短路。表内通常有保险丝，但不要依赖它。\n- 负担电压：电流表串进去会引入一点压降，大电流测量时会影响电路，要查手册的 burden voltage。\n- 换档前先断电，或至少先断开表笔；不要在带电情况下把表笔从电流插孔挪到电压插孔。\n\n**（4）电阻档 / 通断档 / 二极管档（Ω / 🔊 / ➜|）**\n\n- 电阻档：**必须断电测量**。带电测电阻，读数不准，还可能损坏表。\n- 在路测电阻：其他并联路径会影响读数，通常要拆下一端或确认没有旁路。\n- 通断档：测两点是否连通，蜂鸣不一定代表 0Ω，要看具体阈值；测电源短路时先断电。\n- 二极管档：测二极管/LED 的正向压降，判断极性和好坏。普通二极管正向约 0.6～0.7V，LED 可能 1.8～3.3V 或更高，具体看型号。部分万用表二极管档提供的测试电流很小，LED 可能微亮或不亮，不代表坏。\n\n**万用表的局限**：\n\n- 精度、分辨率、温漂有限；\n- 交流档通常假设正弦；\n- 电流档有负担电压；\n- 表笔、保险丝、接触电阻都会影响结果；\n- 不能测高频、瞬态、噪声、波形，这些要示波器。\n\n#### 1.6.4 示波器：只看“电压随时间怎么变”\n\n示波器（oscilloscope）把电压随时间的变化画成波形。它比万用表多了一个关键维度：**时间**。万用表给你一个数，示波器给你“这个过程长什么样”。\n\n基本组成和调节：\n\n- **探头**（probe）：把电路节点接到示波器输入。常见 1× 和 10×。10× 探头把信号衰减 10 倍，输入电容更小、负载更轻，但屏幕上读数要乘 10（现代示波器通常能自动识别）。\n- **接地夹**：探头的地线夹。它通常与示波器外壳/大地相连，不是“随便夹”的。\n- **垂直档位**（volt/div）：每格代表多少伏。\n- **水平档位**（time/div）：每格代表多少时间。\n- **触发**（trigger）：让波形稳定显示。常用边沿触发，设置触发电平，选择上升沿/下降沿。\n- **耦合**（coupling）：DC 耦合显示真实电压（含直流分量）；AC 耦合隔掉直流，只看交流波动。\n- **带宽**（bandwidth）：示波器能准确观察的最高频率。带宽不够，边沿会被抹圆。\n- **采样率**（sample rate）：每秒采样点数，要满足采样定理，通常至少是最高频率的 2 倍，实际要看边沿，建议更高。\n\n示波器能测：\n\n- 峰峰值、最大值、最小值；\n- 周期、频率；\n- 占空比；\n- 上升时间、下降时间；\n- 过冲、振铃、毛刺、噪声；\n- 两路信号的相位关系（双通道）。\n\n**安全红线**：\n\n- 示波器探头的地线夹通常连着大地。**不能把地线夹夹到不是地的节点上**，否则可能通过大地形成短路，损坏设备。\n- 测“浮地”或市电热地侧，需要隔离变压器或差分探头，零基础不要尝试。\n- 探头也有输入电容和电阻，接到高阻、高频节点会改变波形。测开关节点、晶振时尤其要注意。\n- 地线夹要尽量短，长地线会引入电感，测高频时波形失真。\n\n**示波器和万用表的分工**：\n\n- 想知道“现在多少伏”：万用表。\n- 想知道“电压怎么变、有没有毛刺、边沿多快”：示波器。\n- 想知道“电流波形”：用电流探头、分流电阻+差分探头，不能把示波器地线夹随便串进电路。\n\n#### 1.6.5 误差、精度与记录\n\n测量不是“读一个数就完了”。至少要知道这个数有多可信。\n\n- **精度**（accuracy）：测量值与真实值的接近程度，通常写成“±(读数的 x% + 几个字)”。\n- **分辨率**（resolution）：能显示的最小变化，比如 1mV。\n- **量程**（range）：当前档位能测的范围，超了显示 `OL` 或溢出。\n- **容差**（tolerance）：器件本身允许的偏差，比如电阻 ±5%、电容 ±10%。\n- **负载效应**：表或探头接上去，改变了原电路。\n- **负担电压**：电流表串入带来的压降。\n- **温度、湿度、接触电阻、表笔好坏**：都会影响结果。\n\n记录测量结果时，至少写清：\n\n```text\n日期/时间：\n板子/版本：\n测量点（网络/器件位号）：\n仪器与档位：\n电源条件（电压/限流值）：\n负载条件：\n环境温度：\n预期值：\n实测值：\n现象/备注：\n```\n\n没有条件的测量数据，别人无法复现，也无法判断是电路问题还是测量问题。**“我量了，是 3.3V”不如“用 Fluke 17B+ DCV 档，限流 100mA，空载，TP1 对 GND，实测 3.28V，预期 3.3V”有用。**\n\n#### 1.6.6 停下来检查\n\n1. 为什么“36V 安全电压”不能理解为“36V 以下随便摸”？\n2. 第一次上电，为什么要先用限流电源，而不是直接接稳压电源？\n3. 测电压、测电流、测电阻，表分别怎么接？测电阻为什么必须断电？\n4. 万用表电流档为什么不能并联在电源两端？\n5. 示波器探头的地线夹为什么不能随便夹到任意节点？\n6. 普通万用表测 50% 占空比的 3.3V PWM，DC 档和 AC 档分别大概读什么？为什么 AC 档可能不准？\n7. 记录测量结果时，为什么必须写清仪器、档位、电源和负载条件？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. “安全电压”有干燥、环境、标准等前提；人体电阻会因出汗、破皮、潮湿大幅下降，低压也可能产生危险电流。零基础不要凭电压数字判断绝对安全。\n2. 限流电源在短路或接反时会把电流限制在设定值，避免“啪”一下烧器件；直接稳压电源可能瞬间输出很大电流。\n3. 电压并联；电流串联；电阻断电后并联在被测元件两端。带电测电阻读数不准且可能损坏表。\n4. 电流档内阻极小，并联在电源两端相当于短路，会产生很大电流，可能烧保险丝、烧表或烧电源。\n5. 示波器地线夹通常连大地，夹到非地节点可能通过大地形成短路，损坏设备或造成危险；浮地测量需要隔离/差分探头。\n6. DC 档约读平均值 1.65V；AC 档读交流有效值，但普通表按正弦校准，对方波/PWM 不准，且不同表结果可能不同；准确值应用 true RMS 表或示波器算。\n7. 没有条件的数据无法复现，也无法区分“电路本身如此”还是“测量方法/仪器负载造成的偏差”。\n\n<\/details>\n\n### 1.7 读图与查手册：看懂别人画的电路\n\n#### 1.7.1 原理图到底在说什么\n\n**原理图**（schematic）用符号和连线表示电路的逻辑连接，不表示器件实际长什么样、放在板子哪里。它是“电流该怎么走”的地图，不是“板子长什么样”的照片。\n\n一张原理图至少包含四层信息：\n\n1. **符号**：这个器件是什么类型（电阻、电容、二极管、芯片）。\n2. **位号**（reference designator）：这个器件在板子上的唯一编号，比如 `R1`、`C2`、`U3`。\n3. **参数/型号**：这个器件的值或具体型号，比如 `10kΩ`、`100nF`、`STM32F103C8T6`。\n4. **网络**（net）：哪些点连在一起。网络是“电气上同一节点”的集合，可能跨很多页、很多器件引脚。\n\n原理图里没有“导线必须从这里走到那里”的物理位置。两个引脚只要网络名相同，就是连在一起的；哪怕它们在图纸上离得很远，或者根本没画线。\n\n#### 1.7.2 符号、位号、网络\n\n常见符号先认个脸：\n\n| 器件 | 符号要点 | 位号前缀 | 常见标注 |\n|---|---|---|---|\n| 电阻 | 折线或方框 | `R` | `10kΩ`、`103` |\n| 电容 | 两条平行线 | `C` | `100nF`、`104` |\n| 电解电容 | 一条直线+一条弧线/加号 | `C` | `10μF/16V`，注意极性 |\n| 电感 | 连续半圆/线圈 | `L` | `10μH`，注意饱和电流 |\n| 二极管 | 三角+竖线，竖线为阴极 | `D` | `1N4148`、`SS34` |\n| LED | 二极管符号+向外箭头 | `D` 或 `LED` | 颜色、`Vf`、电流 |\n| NPN 三极管 | 箭头向外 | `Q` | `MMBT3904` |\n| PNP 三极管 | 箭头向内 | `Q` | `MMBT3906` |\n| NMOS | 栅极、漏极、源极，箭头方向有讲究 | `Q` 或 `M` | `2N7002`、`AO3400` |\n| PMOS | 与 NMOS 箭头/衬底方向相反 | `Q` 或 `M` | `AO3401` |\n| 运放 | 三角形，两个输入一个输出 | `U` | `LM358`、`TL072` |\n| 芯片/模块 | 方框，标引脚名 | `U` | `U1`、`U2` |\n| 连接器 | 插针/插座符号 | `J`、`P` | `J1`、`P2` |\n| 开关 | 触点符号 | `SW` | `SW1` |\n| 晶振 | 晶体符号 | `Y` 或 `X` | `8MHz` |\n| 保险丝 | 矩形/波浪线 | `F` | `F1`、`500mA` |\n| 测试点 | 小圆点/靶标 | `TP` | `TP1` |\n\n位号前缀不是死规定，但行业习惯很统一。看到 `U` 就知道是芯片/模块，看到 `Q` 就知道是三极管/MOS，看到 `J` 就知道是连接器。读图时先扫位号，能快速判断这块电路大概在干什么。\n\n**网络**（net）是读图的核心。常见表示方式：\n\n- 直接画线连接：线两端的引脚属于同一网络。\n- **连接点**（junction dot）：两条线交叉处有实心圆点，表示连接；没有圆点通常表示只是交叉，不连接。\n- **网络标签**（net label）：给一条线起名字，比如 `+3V3`、`GND`、`USB_D+`、`LED_EN`。同名标签在图纸任何地方都视为连接。\n- **电源符号**：`VCC`、`+5V`、`+3V3`、`VBAT`、`GND`、`AGND`、`PGND`。它们本质上是全局网络标签，但用符号表示，减少画线。\n- **跨页连接**：多页原理图里，同名网络标签跨页连接。\n\n读图时最怕“以为连了，其实没连”：\n\n- 两条线交叉没有圆点：通常不连。\n- 两个网络标签拼写差一个字母：不连，而且可能是错误。\n- `GND` 和 `AGND` 是两个不同网络：除非有 0Ω 电阻/磁珠/单点连接，否则不连。\n- 芯片的电源引脚可能被隐藏，靠网络标签连接，不要以为没画线就没供电。\n\n#### 1.7.3 读图的顺序\n\n拿到一张原理图，不要从左上角逐行读。按下面顺序，先建骨架，再填细节：\n\n1. **先找电源和地**：哪些电源轨（+5V、+3V3、VBAT、VIN）？哪些地（GND、AGND、PGND、EARTH）？电源从哪进来，经过哪些稳压器？\n2. **找连接器**：对外接口在哪？USB、电源、排针、调试口。连接器决定了“外界怎么和板子打交道”。\n3. **分功能块**：把图分成电源、主控、存储、接口、模拟、功率输出等块。先看块与块之间的信号，不要一开始陷进每个电阻。\n4. **找主控/核心器件**：MCU、运放、电源芯片。看它的电源引脚、复位、时钟、启动配置、关键外设引脚。\n5. **追信号路径**：从输入到输出，沿着网络名走。比如传感器 → 分压/滤波 → ADC；USB → 保护/匹配 → 主控。\n6. **看无源网络**：上拉、下拉、分压、限流、RC 滤波、去耦。每个电阻电容都要能说出“它为什么在这里”。\n7. **看保护与测试点**：保险丝、TVS、ESD、反接保护、测试点、跳线、DNP（不贴）器件。\n8. **对照 PCB**：原理图网络和实际板子丝印、封装、引脚一一对应；注意 pin 1、极性、封装方向。\n\n一个简单的读图例子：\n\n```text\n+5V ──[ R1 1kΩ ]──●──[ LED1 ]── GND\n                   │\n                  TP1\n```\n\n- `R1` 和 `LED1` 串联，限制 LED 电流。\n- `TP1` 是测试点，方便测 R1 与 LED 之间的电压。\n- 如果 LED 不亮，先测 `+5V`、再测 `TP1`、再查 LED 极性和 R1 是否装错。\n- 如果 `TP1` 电压接近 5V，说明 LED 可能开路或没装；如果接近 0V，说明 R1 可能短路或 LED 正常导通但电流很大。\n\n#### 1.7.4 数据手册：先看三块，不要从头读到尾\n\n**数据手册**（datasheet）是器件厂家给出的规格书。几十页很正常，零基础不要从头逐页读。先看三块：\n\n**（1）绝对最大额定值（Absolute Maximum Ratings）**\n\n这是“超过就可能永久损坏”的极限，不是正常工作范围。比如：\n\n- 电源电压最大 6V；\n- 某引脚电压范围 −0.3V～VCC+0.3V；\n- 工作温度 −40～85℃；\n- 结温最大 150℃；\n- 输入电流最大 20mA。\n\n绝对最大额定值不是“推荐使用值”。在 6V 下可能“没马上坏”，但寿命、参数、可靠性都没有保证。设计时通常要留余量。\n\n**（2）推荐工作条件（Recommended Operating Conditions）**\n\n这是厂家推荐的工作范围，比如：\n\n- 电源电压 2.7～5.5V；\n- 工作温度 −40～85℃；\n- 输入电压范围 0～VCC；\n- 时钟频率最大 20MHz。\n\n设计应落在这个范围内，不要贴着绝对最大值用。\n\n**（3）电气特性（Electrical Characteristics）**\n\n这是具体参数表，通常给 **最小值（Min）、典型值（Typ）、最大值（Max）**，而且每行都有**测试条件**。\n\n常见参数：\n\n- `Vf`：正向压降（forward voltage），二极管/LED 导通时两端电压。\n- `Vr`：反向耐压。\n- `I_R`：反向漏电流。\n- `Rds(on)`：MOS 导通时漏源电阻。\n- `Vth`：MOS 阈值电压。\n- `hFE`：三极管直流电流放大倍数。\n- `VOH/VOL`：输出高/低电平。\n- `VIH/VIL`：输入高/低电平阈值。\n- `Iq`：静态电流。\n- `CMRR`：共模抑制比（运放）。\n- `PSRR`：电源抑制比（运放）。\n- `GBW`：增益带宽积（运放）。\n\n**读参数表的第一原则：先看条件列。** 同一个 `Rds(on)`，在 `Vgs=4.5V` 和 `Vgs=10V` 下可能差很多；同一个 `Vf`，在不同电流、不同温度下也不同。脱离条件比较数字，等于耍流氓。\n\n数据手册后面还会有：\n\n- 引脚图（Pin Configuration）和引脚功能说明；\n- 封装尺寸（Package Outline）；\n- 典型应用电路（Typical Application）；\n- 热阻（Thermal Resistance）；\n- 布局建议（Layout Guidelines）；\n- 时序图/曲线图（Performance Curves）。\n\n零基础先掌握“三块 + 引脚图 + 典型应用”，其余用到再查。\n\n#### 1.7.5 型号、封装、批次与替代\n\n**型号**（part number）不是随便一串字符。以常见芯片为例，型号里往往编码了：\n\n- 系列/功能；\n- 封装类型（SOT-23、SOIC-8、TSSOP-20、QFN-32、LQFP-48）；\n- 温度等级（商业级 0～70℃、工业级 −40～85℃、汽车级 −40～125℃）；\n- 包装方式（卷带、管装、托盘）；\n- RoHS/无铅标识；\n- 批次/日期码。\n\n**封装**（package）是器件的外形和引脚排列；** footprint** 是 PCB 上对应的焊盘图形。两者相关但不完全一样：同一个封装可能有不同焊盘推荐（手焊/回流、带散热焊盘/不带）。画板时要按厂家推荐的 land pattern 或 IPC 标准，不要凭感觉。\n\n**批次**（date code / lot）是生产批次。不同批次可能有轻微参数差异、丝印差异、甚至翻新/假货风险。关键物料要从正规渠道买，保留批次记录。\n\n**替代料**不能只看“功能一样”。至少核对：\n\n1. 电气参数：电压、电流、速度、精度、温度范围；\n2. 引脚定义和封装：pin-to-pin 是否兼容，散热焊盘是否一样；\n3. 外围电路：是否需要不同的电容、电阻、补偿网络；\n4. 时序/协议：能不能直接替换；\n5. 生命周期/供货：是否停产、是否车规/工业级；\n6. 认证/合规：安规、RoHS、REACH 等。\n\n**这在板子上**：丝印上的 `R1`、`C2`、`U3` 对应原理图位号；器件本体上的 pin 1 圆点/斜角对应封装方向；极性电容的“+”色带、二极管的色环、LED 的阴极标记，都是装配时不能搞反的。原理图正确、封装画反，板子照样报废。\n\n#### 1.7.6 停下来检查\n\n1. 原理图里的“网络”是什么？两个引脚没有画线，但网络名都叫 `LED_EN`，它们连不连？\n2. 两条线交叉，没有实心圆点，通常表示什么？\n3. `GND` 和 `AGND` 可以直接当同一个网络吗？\n4. 拿到一张原理图，为什么要先看电源和地，而不是从左到右逐行读？\n5. 绝对最大额定值和推荐工作条件有什么区别？\n6. 数据手册里 `Rds(on)=10mΩ`，为什么不能直接拿来和另一个器件的 `5mΩ` 比？\n7. 替代料除了“功能一样”，还要核对哪些东西？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. 网络是电气上连在一起的所有节点集合；同名网络标签视为连接，所以会连。\n2. 通常表示只是交叉、不连接；有实心连接点才表示连在一起。\n3. 不一定。它们可能是不同网络，只在设计指定的单点（0Ω、磁珠、特殊连接）相连；直接短接可能引入噪声或安全问题。\n4. 电源和地是电路的骨架，先确定能量从哪来、回流到哪去，再看功能块，效率更高，也不容易漏掉供电/极性错误。\n5. 绝对最大额定值是“超过可能损坏”的极限，不是正常工作范围；推荐工作条件是厂家建议的正常使用范围。\n6. 因为参数必须看测试条件：`Vgs`、电流、温度不同，`Rds(on)` 差别很大；脱离条件比较没有意义。\n7. 电气参数、引脚/封装兼容性、外围电路、时序/协议、温度等级、供货与生命周期、认证合规等。\n\n<\/details>\n\n### 1.8 本章复盘\n\n#### 1.8.1 一页纸公式表\n\n先不要把公式背成文字，理解每个符号指哪段电路、适用条件是什么。\n\n| 公式 | 用途 | 条件与注意 |\n|---|---|---|\n| `I = Q / t` | 电流定义 | `Q` 是流过截面的电荷量，`t` 是时间 |\n| `U = I × R` | 欧姆定律 | 线性电阻，`U` 必须是该电阻两端电压 |\n| `I = U / R` | 求电流 | 同上，单位统一为 V、A、Ω |\n| `R = U / I` | 求电阻 | 同上；非线性器件不能直接用 |\n| `P = U × I` | 功率 | `U`、`I` 是同一器件的电压和电流 |\n| `P = I² × R` | 电阻功耗 | 已知电流和电阻时最方便 |\n| `P = U² / R` | 电阻功耗 | 已知电阻两端电压时最方便 |\n| `E = P × t` | 能量 | 功率乘以时间，单位 J |\n| `R_series = R1 + R2 + …` | 串联总电阻 | 电流相同，电压相加 |\n| `1/R_parallel = 1/R1 + 1/R2 + …` | 并联总电阻 | 电压相同，电流相加 |\n| `Vout = Vin × R2/(R1+R2)` | 分压 | 输出端几乎不取电流；接负载会跌 |\n| `I1 = I_total × R2/(R1+R2)` | 两电阻并联分流 | 分子是“另一个电阻” |\n| `R = ρL/A` | 导体电阻 | 长、细、材料差 → 电阻大 |\n| `f = 1/T` | 频率与周期 | `f` 单位 Hz，`T` 单位 s |\n| `Vrms = Vp/√2` | 正弦有效值 | 仅正弦波，且无直流偏置 |\n| `Vavg = D × Vp` | PWM 平均值 | 0～Vp 方波，占空比 D |\n| `Vrms = Vp × √D` | PWM 有效值 | 同上 |\n| `D = t_on/T` | 占空比 | 高电平时间除以周期 |\n| `BW ≈ 0.35/t_r` | 带宽估算 | 一阶系统，10%～90% 上升时间 |\n\n#### 1.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| 电荷 | charge | 电的“量”，单位库仑 C |\n| 电流 | current | 电荷定向流动的速率，单位 A |\n| 电压 | voltage | 两点之间的电位差，单位 V |\n| 电阻 | resistance | 对电流的阻碍，单位 Ω |\n| 功率 | power | 单位时间转移/消耗的能量，单位 W |\n| 能量 | energy | 功率乘以时间，单位 J |\n| 电源 | source | 提供电压、推动电流的器件 |\n| 负载 | load | 消耗电能、完成工作的部分 |\n| 通路 | closed circuit | 电流能回到电源的闭合路径 |\n| 开路 | open circuit | 路径断开，电流近似为零 |\n| 短路 | short circuit | 电源两端被极低电阻直接连通 |\n| 串联 | series | 首尾相连，电流相同，电压相加 |\n| 并联 | parallel | 首首/尾尾相连，电压相同，电流相加 |\n| 分压 | voltage divider | 串联电阻按比例分配电压 |\n| 分流 | current divider | 并联电阻按反比分配电流 |\n| 地 | ground / GND | 人为选定的 0V 参考点，也是回流路径 |\n| KCL | Kirchhoff's Current Law | 节点上流入电流等于流出电流 |\n| KVL | Kirchhoff's Voltage Law | 闭合回路电压升等于电压降 |\n| 负载效应 | loading effect | 接负载后输出电压被拉低的现象 |\n| 直流 | DC | 电流方向不随时间改变 |\n| 交流 | AC | 电流方向周期性改变 |\n| 波形 | waveform | 电压/电流随时间变化的图形 |\n| 周期 | period | 波形重复一次的时间，单位 s |\n| 频率 | frequency | 每秒重复次数，单位 Hz |\n| 峰值 | peak value | 一个周期内的最大电压值 |\n| 峰峰值 | peak-to-peak | 最大值与最小值之差 |\n| 平均值 | average value | 一个周期内的平均，代表直流分量 |\n| 有效值 | RMS | 产生同等热量的等效直流值 |\n| 占空比 | duty cycle | 高电平时间占周期的比例 |\n| PWM | pulse width modulation | 固定周期、改变脉宽的开关方式 |\n| 模拟信号 | analog signal | 时间和数值都连续变化的信号 |\n| 数字信号 | digital signal | 用有限离散电平表示信息的信号 |\n| 带宽 | bandwidth | 系统能准确处理的频率范围 |\n| 上升时间 | rise time | 波形从 10% 到 90% 的时间 |\n| 原理图 | schematic | 用符号和网络表示电路连接 |\n| 网络 | net | 电气上连在一起的所有节点 |\n| 位号 | reference designator | 器件在板上的唯一编号，如 R1 |\n| 数据手册 | datasheet | 厂家给出的器件规格书 |\n| 绝对最大额定值 | absolute maximum ratings | 超过可能永久损坏的极限 |\n| 推荐工作条件 | recommended operating conditions | 厂家建议的正常工作范围 |\n| 封装 | package | 器件外形和引脚排列 |\n| 替代料 | alternative part | 替换原器件的其他型号，需逐项核对 |\n\n#### 1.8.3 常见坑总表\n\n| 现象 | 最可能的原因 | 排查顺序 |\n|---|---|---|\n| 一上电就大电流/发热 | 电源与地短路、器件装反、锡桥 | 断电测通断 → 查极性 → 查连锡 |\n| LED 不亮或很快烧掉 | 限流电阻算错、LED 极性反、电源过高 | 测电源 → 测 LED 两端 → 查极性与电阻 |\n| 分压点一接负载就跌 | 负载效应，分压电阻太大 | 算并联等效 → 测空载/负载电压 → 加缓冲 |\n| 电阻发烫 | 功耗超过额定、降额不足 | 算 `I²R` → 查额定功率 → 换大功率/降流 |\n| 万用表读数差 1000 倍 | mA/A、kΩ/Ω 没统一 | 检查单位 → 重算 |\n| 电流档一接就烧保险 | 电流表并联在电源两端 | 断电 → 换保险 → 改串联 |\n| 在路测电阻读数不对 | 带电测量或并联旁路 | 断电 → 拆一端 → 重测 |\n| 示波器波形失真/短路 | 地线夹夹错、探头负载、带宽不够 | 查地线 → 换 10× 探头 → 查带宽 |\n| 器件“没超绝对最大值”却坏了 | 把绝对最大值当工作值、没留余量 | 查推荐工作条件 → 降额 → 查散热 |\n| 换替代料后不稳定 | 引脚/参数/外围不兼容 | 对照手册 → 查 pinout → 查外围 |\n\n#### 1.8.4 综合自测\n\n1. 5V 电源、红色 LED（`Vf≈2V`）、目标电流 8mA，限流电阻取多少？实际电流多少？\n2. 两个 4.7kΩ 电阻并联，总电阻多少？串联呢？\n3. 12V 经 R1=10kΩ、R2=2kΩ 分压，空载输出多少？接一个 2kΩ 负载后输出多少？\n4. 一个 0～3.3V、占空比 75% 的 PWM，平均值和有效值各是多少？\n5. 一条走线电阻 0.05Ω，流过 3A，压降和功耗多少？\n6. 为什么“GND 上量不到电压”不代表地线没有问题？\n7. 示波器探头拨到 10×，但示波器里的探头设置仍是 1×，屏幕上读到 0.5V，实际电压多少？\n8. 数据手册写 `VIN` 绝对最大 6V，推荐工作 2.7～5.5V，能不能长期用 5.8V？\n\n<details>\n<summary>参考答案<\/summary>\n\n1. `R=(5−2)/0.008=375Ω`，取标准值 390Ω；`I=3/390≈7.69mA`。\n2. 并联 `2.35kΩ`；串联 `9.4kΩ`。\n3. 空载 `12×2k/(10k+2k)=2V`；接 2kΩ 负载后下臂变 1kΩ，`12×1k/(10k+1k)≈1.09V`。\n4. `Vavg=3.3×0.75=2.475V`；`Vrms=3.3×√0.75≈2.86V`。\n5. `U=3×0.05=0.15V`；`P=3²×0.05=0.45W`。\n6. 地是参考点，万用表以地为参考时读数为 0，但地线有电阻，大电流回流会产生压降和电位抬升；要用毫伏档/差分测量查。\n7. 实际约 `0.5V × 10 = 5V`（若示波器未自动换算）。\n8. 不能。5.8V 超过推荐工作范围，虽然没到绝对最大值，但参数、寿命、可靠性没有保证；应降到 5.5V 以下并留余量。\n\n<\/details>\n\n#### 1.8.5 本章动手清单\n\n- [ ] 用万用表 DCV 档测一个电池或电源适配器的输出电压，记录仪器、档位、实测值。\n- [ ] 用 5V 电源、LED、电阻搭一个限流电路，先算电阻，再实测电流，比较计算与实测差多少。\n- [ ] 搭一个 10kΩ/10kΩ 分压，空载测一次，接 10kΩ 负载再测一次，记录跌落。\n- [ ] 用示波器观察一个 PWM（或信号发生器方波），测周期、频率、占空比、峰峰值。\n- [ ] 找一份常用器件的数据手册，抄下绝对最大额定值、推荐工作条件、三个电气参数及其测试条件。\n- [ ] 照着本章的 LED 电路，画一张原理图，标上位号、网络名、电源和地。\n\n#### 1.8.6 延伸与下一步\n\n想先动手仿真，可以打开：\n\n- [欧姆定律](#/sim/ohms)\n- [串联电阻](#/sim/res-series)\n- [分压电路](#/sim/voltdivide)\n- [惠斯通电桥](#/sim/wheatstone)\n\n下一章进入**电阻**。电阻看起来最简单，但它承担的功能比多数人想的多：限流、分压、上拉、下拉、采样、阻尼、假负载、0Ω 跳线。第 02 章会把“阻值怎么选、功率怎么算、精度和温漂怎么看、什么时候不能用电阻硬扛”讲清楚。","taskSignature":"c6724131ef2cb304b9c91b37c5d1aa2e9d1ca30932c534a5d94f70837e11b8cf","taskCount":6},{"id":"02","title":"第 02 章 · 电阻","short":"电阻","stage":1,"diff":2,"prev":"第 01 章 基础概念","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 用自己的话解释电阻、电阻器、电阻率，分清“物理性质”和“具体元件”。\n2. 看懂 `10kΩ`、`103`、`4R7`、`0Ω` 这些标注，能读出阻值和容差。\n3. 算串联、并联、分压、分流，并用 KCL/KVL 复核。\n4. 根据 LED、ADC 分压、按键上拉三个场景选阻值，做最坏情况核算。\n5. 查电阻手册里的额定功率、耐压、温漂、封装，做降额。\n6. 用万用表正确测电阻，知道在板测量为什么会偏小。\n7. 说出至少 8 个电阻常见坑，并给出排查顺序。\n\n电阻是七大器件里最不起眼、但用得最多的一个。它不放大、不储能、不开关，却几乎出现在每一块板子的每一个功能块里。学不好电阻，后面电容、三极管、MOS、运放的电路都会算错。\n\n## 正文\n\n### 2.1 它解决什么问题：三个真实场景\n\n#### 场景一：LED 直接接 5V，为什么会烧\n\nLED 的正向电压—电流关系很陡。红色 LED 在 2V 左右开始明显导通，电压再高一点点，电流就可能从几毫安冲到几十毫安甚至更大。5V 直接加在 LED 上，等于让它承受远超设计值的电压，电流不受控制，轻则亮度异常、寿命骤降，重则瞬间烧毁。\n\n串联一个电阻，电阻会分担一部分电压，把电流限制在目标值。这是电阻最经典的作用：**限流**。\n\n#### 场景二：12V 电池电压要送进 3.3V 的 ADC\n\n单片机 ADC 的输入通常只能接受 0～3.3V（具体看手册，有的芯片是 0～VDD，有的是特定范围）。12V 电池电压直接接进去，轻则读数饱和，重则损坏引脚。\n\n用两个电阻组成分压器，把 12V 按比例降到 3.3V 以内，再送进 ADC。这是电阻的第二个经典作用：**分压/缩放**。\n\n#### 场景三：按键没按下时，引脚到底是什么电平\n\n单片机输入引脚如果什么都不接，处于“浮空”状态，电压不确定，可能被附近走线、手靠近、静电干扰拉高或拉低，读出来的值随机跳。用一个电阻把引脚接到 3.3V（上拉）或接到地（下拉），就能在按键未按下时给它一个确定的默认电平。这是电阻的第三个经典作用：**设定静态电平**。\n\n除此之外，电阻还用于电流采样、阻尼、假负载、分压反馈、RC 滤波、0Ω 跳线、熔断/限流保护等。先把这三个场景吃透，后面的用法都是它们的变体。\n\n### 2.2 它是什么：从水管到电阻器\n\n#### 2.2.1 生活类比：水管里的狭窄段\n\n想象一根水管，水从高处流向低处。如果管子里有一段特别细、特别长，或者塞了海绵，水流就会受阻。阻力越大，同样的水压差下，流量越小。\n\n电阻就是电路里的“狭窄段”。它不阻止电流，而是**限制电流的大小**。给同样的电压，电阻越大，电流越小；电阻为零，电流理论上可以无限大（这就是短路）；电阻无穷大，电流近似为零（这就是开路）。\n\n这个类比能帮我们记住三个关系：\n\n- 电压像“水压差”，是推动力；\n- 电阻像“管路阻力”，是阻碍；\n- 电流像“流量”，是结果。\n\n但要注意类比的边界：电压并不是“水的压力”，而是“单位电荷的能量差”；电阻也不是“管子变细”这么简单，它还和材料、温度有关。类比只用来建立直觉，计算必须回到公式。\n\n#### 2.2.2 物理直觉：电阻从哪里来\n\n任何导体都有电阻，哪怕是一根铜线。电阻的大小由四个因素决定：\n\n```text\nR = ρ × L / A\n```\n\n- `R`：电阻，单位欧姆（`Ω`）\n- `ρ`（rho）：电阻率，材料本身的属性，单位 `Ω·m`\n- `L`：导体长度，单位米（`m`）\n- `A`：导体截面积，单位平方米（`m²`）\n\n三个结论：\n\n1. **越长，电阻越大**：电流要穿过更长的“阻力路”。\n2. **越细，电阻越大**：同样的电流挤在更小的截面里，阻碍更大。\n3. **材料电阻率越大，电阻越大**：铜、银、金电阻率低；镍铬合金电阻率高，所以能做电热丝。\n\n温度也会影响电阻。多数金属温度升高时电阻变大，这叫**正温度系数**；某些半导体、热敏电阻温度升高时电阻变小，叫**负温度系数**。普通电阻的阻值随温度的变化，用**温度系数**（TCR，temperature coefficient of resistance）描述，单位常用 `ppm/℃`。\n\n例子：一个 10kΩ、TCR 为 `±100ppm/℃` 的电阻，温度变化 50℃ 时，阻值变化约：\n\n```text\nΔR = 10kΩ × 100×10⁻⁶ × 50 = 0.05kΩ = 50Ω\n```\n\n也就是约 ±0.5%。看起来不大，但在精密分压、电流采样里，可能已经超过允许误差。精密场合要选低温漂电阻（比如 `±10ppm/℃` 或更好），并做温度补偿/校准。\n\n#### 2.2.3 工程定义：电阻 vs 电阻器\n\n这两个词经常混用，但要分清：\n\n- **电阻**（resistance）：物理性质，任何导体都有，符号 `R`，单位 `Ω`。\n- **电阻器**（resistor）：专门制造出来、具有确定阻值的两端元件，原理图位号 `R1`、`R2`。\n\n电阻器没有极性，两个引脚可以互换。它的主要作用是限流、分压、上拉/下拉、采样、阻尼、假负载等。\n\n理想电阻只服从欧姆定律：\n\n```text\nU = I × R\n```\n\n真实电阻不是完美的，它还有：\n\n- **寄生电感**（ESL）：绕线电阻、长引脚电阻更明显，高频时阻抗不再是纯电阻。\n- **寄生电容**：两个引脚之间、电阻体与周围之间都有小电容，高频时会影响。\n- **热噪声**：电阻会自己产生微弱噪声，精密小信号电路要算。\n- **温度漂移**：阻值随温度变化。\n- **功率限制**：超过额定功率会发热、漂移、烧毁。\n- **耐压限制**：两端电压过高可能击穿。\n\n低频、普通精度场合，这些可以忽略；高频、精密、大电流场合，必须查手册。\n\n#### 2.2.4 原理图符号与封装\n\n电阻在原理图里通常有两种符号：IEC 的矩形和美式的锯齿形。两种都表示同一个两端电阻，没有极性。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 180\" width=\"480\" height=\"180\" role=\"img\" aria-label=\"电阻的矩形与锯齿符号\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 90 H90 M160 90 H195 M335 90 H395\"/><rect x=\"90\" y=\"72\" width=\"70\" height=\"36\"/><path d=\"M225 90 H240 L247 75 L255 105 L263 75 L271 105 L279 75 L287 105 L295 75 L303 105 L311 75 L319 105 L327 90 H335\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"80\" y=\"48\">矩形电阻符号<\/text><text x=\"225\" y=\"48\">锯齿形电阻符号<\/text><text x=\"80\" y=\"150\">两种符号都表示同一个两端电阻。<\/text><\/g><\/svg>\n```\n\n图 2-1 电阻的两种原理图符号\n\n电阻器的实物封装很多。插件电阻常见轴向引线、金属膜、绕线；贴片电阻常见 0402、0603、0805、1206、1210、2010、2512 等。封装数字是英制名义尺寸，不是功率，也不是阻值。**同样封装，不同系列/厂家的额定功率可能不同，必须查具体料号。**\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 300\" role=\"img\" aria-label=\"常见贴片电阻封装尺寸对比：0402、0603、0805、1206、1210、2512\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <rect x=\"60\" y=\"62\" width=\"36\" height=\"22\"/><rect x=\"50\" y=\"66\" width=\"10\" height=\"14\"/><rect x=\"96\" y=\"66\" width=\"10\" height=\"14\"/>\n  <rect x=\"150\" y=\"98\" width=\"50\" height=\"24\"/><rect x=\"138\" y=\"102\" width=\"12\" height=\"16\"/><rect x=\"200\" y=\"102\" width=\"12\" height=\"16\"/>\n  <rect x=\"265\" y=\"134\" width=\"66\" height=\"26\"/><rect x=\"251\" y=\"139\" width=\"14\" height=\"16\"/><rect x=\"331\" y=\"139\" width=\"14\" height=\"16\"/>\n  <rect x=\"390\" y=\"170\" width=\"90\" height=\"28\"/><rect x=\"374\" y=\"175\" width=\"16\" height=\"18\"/><rect x=\"480\" y=\"175\" width=\"16\" height=\"18\"/>\n  <rect x=\"515\" y=\"206\" width=\"96\" height=\"30\"/><rect x=\"499\" y=\"212\" width=\"16\" height=\"18\"/><rect x=\"611\" y=\"212\" width=\"16\" height=\"18\"/>\n  <rect x=\"390\" y=\"242\" width=\"132\" height=\"34\"/><rect x=\"372\" y=\"249\" width=\"18\" height=\"20\"/><rect x=\"522\" y=\"249\" width=\"18\" height=\"20\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"56\" y=\"50\">0402<\/text><text x=\"56\" y=\"106\">1.0×0.5mm<\/text>\n  <text x=\"146\" y=\"86\">0603<\/text><text x=\"146\" y=\"138\">1.6×0.8mm<\/text>\n  <text x=\"261\" y=\"122\">0805<\/text><text x=\"261\" y=\"174\">2.0×1.25mm<\/text>\n  <text x=\"386\" y=\"158\">1206<\/text><text x=\"386\" y=\"210\">3.2×1.6mm<\/text>\n  <text x=\"511\" y=\"194\">1210<\/text><text x=\"511\" y=\"246\">3.2×2.5mm<\/text>\n  <text x=\"386\" y=\"266\">2512<\/text><text x=\"518\" y=\"294\">6.3×3.2mm<\/text>\n<\/g><\/svg>\n```\n\n图 2-2 常见贴片电阻封装尺寸对比（示意，非等比例；方形为焊端，长条为电阻体）\n\n| 封装 | 英制名义尺寸 | 常见用途 | 入门注意 |\n|---|---|---|---|\n| 0402 | 约 1.0×0.5mm | 高密度板 | 手焊困难，标记常不可见 |\n| 0603 | 约 1.6×0.8mm | 最常见贴片 | 手焊练习推荐起点 |\n| 0805 | 约 2.0×1.25mm | 手焊友好 | 功率仍须查料号 |\n| 1206 | 约 3.2×1.6mm | 较大功率/手焊 | 不等于一定能扛 1W |\n| 2512 | 约 6.3×3.2mm | 电流采样/大功率 | 注意散热与焊盘 |\n\n#### 2.2.5 串联、并联与分压、分流\n\n第 01 章已经讲过基本规则，这里换成电阻语言再复述一遍，因为后面每个电路都要用。\n\n**串联**：首尾相连，电流相同。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:lang=\"en\" height=\"143.8pt\" width=\"329.516pt\" viewBox=\"-80 -145 360 155\"><circle cx=\"0\" cy=\"-54\" r=\"18\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;\" /><path d=\"M 0.0,-0.0 L 0,-36 L 0,-36 M 0,-72 L 0,-72 L 0,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000003,-45.0 L -3.6,-45\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.637200993467639e-15,-59.4 L 0,-66.6\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 3.600000000000004,-63.0 L -3.6,-63\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 6.613092715395707e-15,-108.0 L 14.4,-108 L 28.8,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 28.80000000000001,-108.0 L 64.8,-108 L 67.8,-117 L 73.8,-99 L 79.8,-117 L 85.8,-99 L 91.8,-117 L 97.8,-99 L 100.8,-108 L 136.8,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 136.8,-108.0 L 172.8,-108 L 175.8,-117 L 181.8,-99 L 187.8,-117 L 193.8,-99 L 199.8,-117 L 205.8,-99 L 208.8,-108 L 244.8,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 244.8,-108.0 L 259.2,-108 L 273.6,-108\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 273.6,-108.0 L 273.6,-54 L 273.6,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><path d=\"M 273.59999999999997,-0.0 L 136.8,-0 L 0,-0\" style=\"stroke:currentColor;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;\" /><text x=\"-21.599999999999994\" y=\"-68.0\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"end\"><tspan x=\"-21.599999999999994\" dy=\"14.0\">电源 U<\/tspan><\/text><text x=\"82.80000000000001\" y=\"-134.60000000000002\" dominant-baseline=\"ideographic\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"82.80000000000001\" dy=\"14.0\">R1<\/tspan><\/text><text x=\"190.8\" y=\"-134.60000000000002\" dominant-baseline=\"ideographic\" fill=\"currentColor\" font-size=\"14.0\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"190.8\" dy=\"14.0\">R2<\/tspan><\/text><text x=\"130\" y=\"-27.200000000000003\" dominant-baseline=\"central\" fill=\"currentColor\" font-size=\"11\" font-family=\"sans\" text-anchor=\"middle\"><tspan x=\"130\" dy=\"11\">电流 I 处处相等 ←<\/tspan><\/text><\/svg>\n```\n\n```text\nR_total = R1 + R2 + … + Rn\nU_total = U1 + U2 + … + Un\nI 相同\n```\n\n**并联**：首首、尾尾相连，电压相同。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" width=\"620\" height=\"250\" role=\"img\" aria-label=\"两只电阻并联且无短路线\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M90 45 H490 M90 205 H490 M90 45 V95 M90 155 V205 M250 45 V77 M250 127 V205 M410 45 V77 M410 127 V205\"/><circle cx=\"90\" cy=\"125\" r=\"30\"/><rect x=\"235\" y=\"77\" width=\"30\" height=\"50\"/><rect x=\"395\" y=\"77\" width=\"30\" height=\"50\"/><circle cx=\"250\" cy=\"45\" r=\"3\" fill=\"currentColor\"/><circle cx=\"410\" cy=\"45\" r=\"3\" fill=\"currentColor\"/><\/g><g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\"><text x=\"84\" y=\"120\">+<\/text><text x=\"84\" y=\"143\">−<\/text><text x=\"25\" y=\"130\">电源<\/text><text x=\"275\" y=\"108\">R1<\/text><text x=\"435\" y=\"108\">R2<\/text><text x=\"170\" y=\"238\">两支路接在同一对节点上<\/text><\/g><\/svg>\n```\n\n```text\n1/R_total = 1/R1 + 1/R2 + … + 1/Rn\n两个电阻：R_total = (R1 × R2) / (R1 + R2)\nI_total = I1 + I2 + … + In\nU 相同\n```\n\n图 2-3 串联与并联\n\n**分压**：两个电阻串联，输出取自下臂 R2 两端。\n\n```text\n        R1\n  Vin ──[====]──● Vout\n                │\n              [ R2 ]\n                │\n               GND\n```\n\n空载时：\n\n```text\nVout = Vin × R2 / (R1 + R2)\n```\n\n**分流**：两个电阻并联，总电流按阻值反比分配。\n\n```text\nI1 = I_total × R2 / (R1 + R2)\nI2 = I_total × R1 / (R1 + R2)\n```\n\n记法：**分压看“自己占总阻值的比例”，分流看“另一个电阻占总阻值的比例”。** 分流公式分子是另一个电阻，因为阻值越小，分到的电流越大。\n\n### 2.3 关键参数与数据手册\n\n电阻手册不要只看“阻值”一列。下面这些参数，决定了它能不能在你的电路里长期可靠工作。\n\n#### 2.3.1 标称阻值、容差与 E 系列\n\n**标称阻值**（nominal resistance）：厂家标在器件上的值，比如 `10kΩ`。实际阻值不是绝对精确的，允许的偏差叫**容差**（tolerance），常见 `±1%`、`±5%`、`±0.1%`。\n\n为什么会有 10kΩ、4.7kΩ、3.3kΩ 这些“奇怪”的值？因为厂家按 **E 系列** 生产，阻值按几何级数分布，保证相邻值之间的比例大致固定，覆盖整个范围。常见 E12、E24、E96：\n\n- E12：每十倍 12 个值，容差约 ±10%。\n- E24：每十倍 24 个值，容差约 ±5%。\n- E96：每十倍 96 个值，容差约 ±1%。\n\n常见 E24 值：`1.0, 1.1, 1.2, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2, 6.8, 7.5, 8.2, 9.1`，再乘 10 的幂。\n\n所以算出来 600Ω，实际会选 620Ω；算出来 375Ω，实际选 390Ω 或 360Ω。**不要设计一个买不到的值。**\n\n#### 2.3.2 贴片电阻的标记码\n\n贴片电阻体积小，常用数字码：\n\n- 三位码：前两位是有效数字，第三位是 10 的幂。\n  - `103` = `10 × 10³ = 10kΩ`\n  - `472` = `47 × 10² = 4.7kΩ`\n  - `100` = `10 × 10⁰ = 10Ω`\n- 四位码：前三位有效数字，第四位是 10 的幂。\n  - `4531` = `453 × 10¹ = 4.53kΩ`\n  - `1002` = `100 × 10² = 10kΩ`\n- `R` 表示小数点：\n  - `4R7` = `4.7Ω`\n  - `R047` = `0.047Ω`\n  - `1R0` = `1.0Ω`\n- `0` 或 `000` 表示 0Ω 跳线。\n- 0603 以下常见无字，靠包装/标签/测量辨认。\n\n注意：EIA-96 编码（两位数字+字母）和厂家专用编码不遵循上面的规则，必须查手册。**看到不确定的标记，先测，不要猜。**\n\n#### 2.3.3 额定功率与降额\n\n电阻通电会发热，功率：\n\n```text\nP = U × I = I² × R = U² / R\n```\n\n**额定功率**（power rating）是厂家在规定环境温度、安装条件下允许长期耗散的最大功率。常见贴片电阻的额定功率（不同系列有差异）：\n\n| 封装 | 常见额定功率（示例） | 说明 |\n|---|---|---|\n| 0402 | 0.0625W / 0.1W | 具体查料号 |\n| 0603 | 0.1W | 最常见 |\n| 0805 | 0.125W / 0.25W | 系列差异大 |\n| 1206 | 0.25W / 0.5W | 不要默认 1W |\n| 1210 | 0.5W | 大电流采样常用 |\n| 2512 | 1W / 2W | 需注意焊盘散热 |\n\n**降额**：长期工作不要贴着额定值用。一般建议实际功耗不超过额定功率的 50%～70%，环境温度高、散热差、邻近发热器件时还要再降。\n\n例子：一个 0603、0.1W 电阻，实际耗 0.08W，虽然“没超”，但已经 80% 额定，长期高温下容易漂移、寿命下降。应换 0805/1206 或降低电流。\n\n还要注意**脉冲功率**。电阻在短时间内承受的脉冲能量可能远大于平均功率，手册里会有脉冲/浪涌曲线。电机启动、电容充电、LED 脉冲驱动等场景，不能只算平均功率。\n\n#### 2.3.4 最大工作电压\n\n电阻不仅有功率限制，还有**最大工作电压**（maximum working voltage）。即使功率没超，电压太高也可能击穿电阻体或沿表面爬电。\n\n常见贴片电阻的最大工作电压（示例，具体查手册）：\n\n- 0402：约 50V\n- 0603：约 75V\n- 0805：约 150V\n- 1206：约 200V\n\n高压分压、电源泄放、浪涌吸收场景，要同时查功率和耐压，不能只看阻值。\n\n#### 2.3.5 温度系数（TCR）\n\n**TCR**（temperature coefficient of resistance）表示阻值随温度变化的程度，单位 `ppm/℃`。`1ppm = 10⁻⁶`，即百万分之一。\n\n例子：10kΩ、`±100ppm/℃`，温度升高 50℃：\n\n```text\nΔR/R = 100×10⁻⁶ × 50 = 0.005 = 0.5%\nΔR = 10kΩ × 0.005 = 50Ω\n```\n\n普通厚膜电阻常见 `±100ppm/℃` 到 `±200ppm/℃`；精密薄膜电阻可以做到 `±10ppm/℃` 甚至更好。精密分压、电流采样、传感器调理要选低温漂，并注意安装应力、温度梯度。\n\n#### 2.3.6 热噪声（进阶）\n\n电阻会自己产生**热噪声**（thermal noise，也叫约翰逊噪声）。在音频、传感器、精密测量里，它可能成为下限。\n\n噪声电压有效值近似：\n\n```text\nVn = √(4 × k × T × R × B)\n```\n\n- `k`：玻尔兹曼常数，`1.38×10⁻²³ J/K`\n- `T`：绝对温度，单位 K（25℃ ≈ 298K）\n- `R`：电阻，单位 Ω\n- `B`：测量带宽，单位 Hz\n\n例子：10kΩ 电阻，带宽 1kHz，25℃：\n\n```text\nVn = √(4 × 1.38×10⁻²³ × 298 × 10000 × 1000)\n   ≈ √(1.645×10⁻¹³)\n   ≈ 0.41μV\n```\n\n0.41μV 很小，但如果信号本身只有几十 μV，就不能忽略。降低电阻、降低带宽、降低温度都能减小热噪声；但降低电阻会增加功耗和负载效应，要折中。\n\n#### 2.3.7 数据手册速查表\n\n拿到一份电阻手册，先找这几项：\n\n| 参数 | 英文 | 为什么重要 | 典型条件 |\n|---|---|---|---|\n| 阻值 | resistance | 决定电流/分压 | 25℃、标称 |\n| 容差 | tolerance | 最坏情况误差 | ±1%、±5% |\n| 额定功率 | power rating | 发热/烧毁 | 70℃ 或 25℃ |\n| 最大工作电压 | max working voltage | 击穿/爬电 | 直流或脉冲 |\n| 温度系数 | TCR | 温漂 | −55～+155℃ |\n| 封装 | package | 尺寸/散热/手焊 | 0402～2512 |\n| 脉冲能力 | pulse power | 浪涌/启动 | 特定波形 |\n| 工作温度 | operating temperature | 环境限制 | −55～+155℃ |\n\n**读手册第一原则：先看条件列。** 同一个 0603，不同厂家的 0.1W 可能是在 70℃ 还是 25℃ 下标的；同一个 10kΩ，±1% 和 ±0.1% 的价格差很多。脱离条件比较数字没有意义。\n\n#### 2.3.8 选型顺序\n\n拿到一个电阻需求，按这个顺序选：\n\n1. **算阻值**：根据电路公式算，选 E24/E96 标准值。\n2. **算功耗**：`I²R` 或 `U²/R`，按最坏情况算。\n3. **定封装/功率**：留 50%～70% 降额，考虑温度。\n4. **定精度**：普通限流 ±5% 够用；分压/采样按误差预算选 ±1% 或更好。\n5. **定温漂**：精密/户外/高温选低温漂。\n6. **查耐压**：高压场景查最大工作电压。\n7. **查脉冲**：启动/浪涌场景查脉冲曲线。\n8. **定料号**：写完整厂家型号，不写“10k 0603”就下单。\n\n### 2.4 三个典型电路\n\n#### 2.4.1 电路一：LED 限流\n\n这是电阻最基础、也最容易“算对但选错”的电路。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 240\" role=\"img\" aria-label=\"5伏电源经620欧电阻和LED接地的限流电路\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M40 100 H110\"/><rect x=\"110\" y=\"87\" width=\"64\" height=\"26\"/><path d=\"M174 100 H250\"/>\n  <path d=\"M250 80 V120 L290 100 Z\"/><path d=\"M290 80 V120\"/><path d=\"M290 100 H340\"/><path d=\"M340 100 V160\"/>\n  <path d=\"M320 160 H360 M330 168 H350 M334 176 H346 M338 184 H342\"/>\n  <path d=\"M298 86 L314 70 M306 94 L322 78\"/><path d=\"M314 70 L308 74 M314 70 L311 77\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\">\n  <text x=\"34\" y=\"85\">+5V<\/text><text x=\"118\" y=\"72\">R1 620Ω<\/text>\n  <text x=\"246\" y=\"145\">LED1<\/text><text x=\"366\" y=\"166\">GND<\/text>\n<\/g><\/svg>\n```\n\n```circuitjs\nled-resistor\n```\n\n图 2-4 LED 限流电路\n\n**工作原理**：电阻和 LED 串联，电流相同。电源电压被分成两部分：\n\n```text\nU_R + U_LED = 5V\nU_R = 5V − U_LED\n```\n\nLED 的正向压降 `U_LED`（也叫 `Vf`，forward voltage）不是固定值，随颜色、电流、温度变化。红色 LED 常见 1.8～2.2V，绿色 2.0～2.4V，蓝/白 2.8～3.4V。计算时不能只用一个“典型值”，要做范围核算。\n\n**标称计算**：假设 `Vf=2.0V`，目标电流 `5mA`：\n\n```text\nR = (5 − 2.0) / 0.005 = 600Ω\n```\n\n选 E24 标准值 **620Ω**，实际电流：\n\n```text\nI = (5 − 2.0) / 620 = 3.0 / 620 ≈ 4.84mA\n```\n\n**最坏情况核算**：电源 ±5%（4.75～5.25V），LED `Vf` 1.8～2.2V，电阻 ±1%（613.8～626.2Ω）。\n\n最大电流出现在“电源最高、Vf 最低、电阻最小”：\n\n```text\nI_max = (5.25 − 1.8) / 613.8 ≈ 3.45 / 613.8 ≈ 5.62mA\n```\n\n最小电流出现在“电源最低、Vf 最高、电阻最大”：\n\n```text\nI_min = (4.75 − 2.2) / 626.2 ≈ 2.55 / 626.2 ≈ 4.07mA\n```\n\n所以实际电流大约在 4.07～5.62mA 之间，围绕 4.84mA 波动。这个范围对普通指示灯可以接受；如果要求亮度很稳，就要用恒流驱动，而不是单电阻。\n\n**电阻功耗**：按最大电流算：\n\n```text\nP_R = I_max² × R_min = (0.00562)² × 613.8 ≈ 0.0194W\n```\n\n0.0194W 不到 0.1W 的 20%，0603 电阻够用，且降额充分。如果是 20mA 的 LED：\n\n```text\nP_R ≈ (5 − 2)² / 150 ≈ 0.06W\n```\n\n0603 0.1W 已经用到 60%，长期高温下建议换 0805 或降低电流。\n\n**常见设计错误**：\n\n- 用 5V 直接算 `R=5/0.005=1kΩ`，忘记减 LED 压降，结果电流偏小、亮度不足。\n- 只算标称，不算 Vf/电源/电阻容差，批量生产时亮度不一致。\n- 忽略电阻功率，0603 用在 20mA 以上。\n- LED 极性接反，不亮；反接时 LED 反向耐压通常不高，可能损坏。\n- 多个 LED 并联共用一个电阻：LED Vf 不一致，电流分配不均，容易一个亮一个暗甚至烧掉。应每个 LED 单独限流，或串联后共用电阻。\n\n#### 2.4.2 电路二：12V 电池分压进 3.3V ADC\n\n**需求**：12V 铅酸/锂电池（最高按 15V 考虑），送进 3.3V ADC，要求 15V 时不超过 3.3V，12V 时尽量接近满量程。\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 320\" role=\"img\" aria-label=\"12V电池经10千欧和2.7千欧分压，再经100欧与100纳法低通送ADC\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M80 25 V55\"/><rect x=\"67\" y=\"55\" width=\"26\" height=\"62\"/><path d=\"M80 117 V150\"/>\n  <circle cx=\"80\" cy=\"160\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M80 160 V205\"/><rect x=\"67\" y=\"205\" width=\"26\" height=\"54\"/><path d=\"M80 259 V285\"/>\n  <path d=\"M80 285 H160 M148 285 V300 M136 300 H160 M140 308 H156 M144 316 H152\"/>\n  <path d=\"M80 160 H150\"/><rect x=\"150\" y=\"147\" width=\"64\" height=\"26\"/><path d=\"M214 160 H300\"/>\n  <circle cx=\"300\" cy=\"160\" r=\"4\" fill=\"currentColor\"/>\n  <path d=\"M300 160 V195\"/><path d=\"M287 195 H313\"/><path d=\"M287 205 H313\"/><path d=\"M300 205 V235\"/>\n  <path d=\"M300 235 H370 M358 235 V250 M346 250 H370 M350 258 H366 M354 266 H362\"/>\n  <path d=\"M300 160 H400\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"15\">\n  <text x=\"62\" y=\"18\">+12V<\/text><text x=\"110\" y=\"92\">R1 10kΩ<\/text>\n  <text x=\"110\" y=\"235\">R2 2.7kΩ<\/text><text x=\"222\" y=\"153\">R3 100Ω<\/text>\n  <text x=\"322\" y=\"188\">C1 100nF<\/text><text x=\"410\" y=\"165\">ADC_IN<\/text>\n  <text x=\"175\" y=\"305\">GND<\/text>\n<\/g><\/svg>\n```\n\n```circuitjs\nvoltdivide\n```\n\n图 2-5 12V 电池分压进 ADC\n\n**分压比**：\n\n```text\nVout = Vin × R2 / (R1 + R2)\n```\n\n先算 15V 时不超过 3.3V 的要求：\n\n```text\nR2 / (R1 + R2) ≤ 3.3 / 15 = 0.22\n```\n\n取 `R1=10kΩ`、`R2=2.7kΩ`：\n\n```text\nVout(12V) = 12 × 2.7 / 12.7 ≈ 2.55V\nVout(15V) = 15 × 2.7 / 12.7 ≈ 3.19V\n```\n\n15V 时 3.19V，留了约 0.11V 余量。如果电池可能到 18V：\n\n```text\nVout(18V) = 18 × 2.7 / 12.7 ≈ 3.83V\n```\n\n已经超过 3.3V，必须改用更小的分压比（比如 R2=2.2kΩ，18V 时约 3.25V），或者在 ADC 前加 3.3V 钳位/ TVS。**不要假设“电池不会超过 15V”**，充电、浪涌、接错电源都可能超。\n\n**电流与功耗**：15V 时，分压支路电流：\n\n```text\nI = 15 / (10k + 2.7k) ≈ 1.18mA\nP_R1 = I² × 10k ≈ 0.0139W\nP_R2 = I² × 2.7k ≈ 0.0038W\n```\n\n0603 0.1W 都够用，但 1.18mA 是持续消耗。电池产品要算待机功耗：1.18mA 对 1Ah 电池约 846 小时（理论，不考虑其他负载），不算小。可以把电阻加大到 100k/27k，电流降到 0.118mA，但源阻抗变大，ADC 采样更容易受干扰，响应也变慢。\n\n**源阻抗与 ADC 采样**：从 ADC 输入端看，分压器的等效源阻抗是：\n\n```text\nR_source = R1 || R2 = (10k × 2.7k) / (10k + 2.7k) ≈ 2.13kΩ\n```\n\n很多 ADC 要求源阻抗低于几 kΩ，采样电容才能在采样时间内充好。`R3=100Ω` 与 `C1=100nF` 组成低通，截止频率约：\n\n```text\nfc = 1 / (2π × (R3 + R_source) × C1)\n   ≈ 1 / (2π × 2.23k × 100n) ≈ 713Hz\n```\n\n对缓慢变化的电池电压够用，但对快速信号太慢。`C1` 还能在 ADC 采样瞬间提供电荷，降低对源阻抗的要求。具体 R3/C1 要看 ADC 手册的采样时间、采样电容和允许误差。\n\n**容差最坏情况**：R1 ±1%、R2 ±1%。最大输出出现在 R1 最小、R2 最大：\n\n```text\nR1 = 9.9kΩ, R2 = 2.727kΩ\nVout(15V) = 15 × 2.727 / (9.9 + 2.727) ≈ 3.24V\n```\n\n仍低于 3.3V，但只剩 60mV 余量。如果 ADC 的允许上限随电源/温度变化，或者有瞬态，建议再加钳位。**分压电阻的容差要按最坏情况算，不能只看标称。**\n\n**负载效应**：ADC 输入通常很高阻（比如 10MΩ 以上），静态负载影响小；但采样电容、泄漏电流、保护二极管漏电会形成动态负载。如果后级是运放/比较器，输入阻抗可能只有几 kΩ，分压输出会明显下跌，需要加缓冲。\n\n#### 2.4.3 电路三：按键上拉/下拉\n\n单片机 GPIO 浮空时，电平不确定。上拉/下拉电阻给它一个默认状态。\n\n**上拉 + 按键到地**（最常见）：\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"上拉按键与下拉按键两种接法\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <!-- left: pull-up -->\n  <path d=\"M90 25 V55\"/><rect x=\"77\" y=\"55\" width=\"26\" height=\"60\"/><path d=\"M90 115 V150\"/>\n  <circle cx=\"90\" cy=\"160\" r=\"4\" fill=\"currentColor\"/><path d=\"M90 160 H210\"/>\n  <path d=\"M90 160 V205 M90 215 L115 195 M90 215 V245\"/>\n  <path d=\"M90 245 H140 M128 245 V260 M116 260 H140 M120 268 H136 M124 276 H132\"/>\n  <!-- right: pull-down -->\n  <path d=\"M430 25 V45\"/><path d=\"M430 45 V85 M430 85 L455 65 M430 85 V105\"/>\n  <circle cx=\"430\" cy=\"115\" r=\"4\" fill=\"currentColor\"/><path d=\"M430 115 H540\"/>\n  <path d=\"M430 115 V140\"/><rect x=\"417\" y=\"140\" width=\"26\" height=\"60\"/><path d=\"M430 200 V230\"/>\n  <path d=\"M430 230 H480 M468 230 V245 M456 245 H480 M460 253 H476 M464 261 H472\"/>\n<\/g>\n<g fill=\"currentColor\" font-family=\"sans-serif\" font-size=\"14\">\n  <text x=\"74\" y=\"18\">+3.3V<\/text><text x=\"110\" y=\"90\">R1 10kΩ<\/text>\n  <text x=\"220\" y=\"165\">GPIO<\/text><text x=\"120\" y=\"215\">SW1<\/text><text x=\"148\" y=\"270\">GND<\/text>\n  <text x=\"414\" y=\"18\">+3.3V<\/text><text x=\"440\" y=\"100\">SW1<\/text>\n  <text x=\"545\" y=\"120\">GPIO<\/text><text x=\"450\" y=\"175\">R1 10kΩ<\/text><text x=\"488\" y=\"255\">GND<\/text>\n  <text x=\"70\" y=\"295\">上拉：松开=高，按下=低<\/text>\n  <text x=\"360\" y=\"295\">下拉：松开=低，按下=高<\/text>\n<\/g><\/svg>\n```\n\n```circuitjs\ngpio-button\n```\n\n图 2-6 上拉与下拉\n\n- 按键松开：没有电流流过 R1，GPIO 被拉到 3.3V（高电平）。\n- 按键按下：GPIO 直接接地，电流 `3.3V / 10kΩ = 0.33mA`，GPIO 为 0V（低电平）。\n- 按键松开瞬间，GPIO 线上的电容（引脚电容、走线电容、示波器探头）通过 R1 充电，上升时间约 `τ=R1×C`。10kΩ 和 100pF 的 τ 是 1μs，普通按键没问题；如果线很长、电容很大，上升会变慢。\n\n**下拉 + 按键到电源**：\n\n<!-- 下拉接法见图 2-5 右半部分 -->\n\n- 松开：GPIO 被拉到 0V（低电平）。\n- 按下：GPIO 接 3.3V（高电平），电流 0.33mA。\n\n**阻值怎么选**：\n\n- 太大（比如 1MΩ）：省电，但容易受干扰、上升慢，长线/高容性负载可能读错。\n- 太小（比如 100Ω）：抗干扰强、上升快，但按下时电流大、功耗高。\n- 普通按键：10kΩ～100kΩ 常见；3.3V/10kΩ 按下电流 0.33mA，可以接受。\n- I²C 等开漏总线：上拉阻值由总线电容和上升时间决定，常见 2.2k～10kΩ；400kHz 高速总线不能用 10kΩ 配大电容。\n- 低功耗电池设备：可以用 100kΩ～1MΩ，但要核算漏电、湿度和干扰。\n\n**开漏输出**：很多芯片的输出只能“拉低”，不能
