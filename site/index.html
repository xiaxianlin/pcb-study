：150kHz～80MHz，注入 3/10V。\n-4-11 电压暂降/中断。\n\n**课程**：先弄清“打几级”，再谈器件选型。\n\n#### 26.3.3 ESD 等级与“接触/空气”的区别\n\n接触放电是“枪头直接碰金属”，能量集中、重复性好；空气放电是“枪头靠近，空气击穿”，受湿度/速度影响大。产品要过“接触 ±8kV、空气 ±15kV”时，接口金属件、按键、连接器外壳都要有泄放路径。等级越高，TVS 的钳位/浪涌能力要求越高。\n\n**课程**：别把“空气放电过了”当成“整机过了”。\n\n#### 26.3.4 浪涌（Surge）与 EFT 的区别\n\n**Surge**：能量大、持续时间长（μs 级），模拟雷击/电网切换；要气体放电管/压敏/TVS 组合。\n\n**EFT**：能量小、重复快（ns 级脉冲群），模拟继电器/电机火花；靠滤波/去耦/地。\n\n两者防护器件不同：Surge 看“能量吸收”，EFT 看“高频旁路”。用 TVS 单独扛 Surge 会烧；用压敏单独扛 EFT 效果差。\n\n**课程**：Surge 和 EFT 是“两种病”，不能吃一种药。\n\n#### 26.3.5 传导发射：差模与共模分开测\n\n传导测试用 LISN 测电源线噪声，分“差模电压/共模电压”。差模靠 X 电容/电感，共模靠 Y 电容/共模电感。150kHz～30MHz 是主战场；开关电源的开关频率/谐波常在这里超标。整改先看“哪个频点、差模还是共模”，再选器件。\n\n**课程**：传导不过，先分“差模/共模”，别乱加电容。\n\n#### 26.3.6 辐射发射：近场定位比“盲加”快\n\n30MHz～1GHz 辐射超标，先用近场探头扫板/电缆，找“热点”（开关电源/时钟/接口/缝隙）。热点定位后再改：源（展频/缓冲/降低边沿）、路径（屏蔽/滤波/地）、天线（缩短电缆/加共模扼流）。盲加磁珠常“压下一个频点、冒出另一个”。\n\n**课程**：先定位，再动手。\n\n#### 26.3.7 标准测试布置：别忽略“电缆/接地”\n\n辐射/抗扰测试对“电缆长度/摆放/接地”很敏感：电缆 1m/3m、离地高度、转台角度都会影响结果。实验室布置要按标准；自己预测试也要“固定布置”，否则数据不可比。很多“过了/没过”的差异，来自“线怎么摆”。\n\n**课程**：EMC 测试是“布置的艺术”，不是“只看机器”。\n\n#### 26.3.8 认证与自测的分工\n\n正式认证在第三方实验室（CNAS/CE/FCC）；自测用近场探头/频谱仪/ESD 枪做“预测试”。自测不能替代认证，但能在打样阶段发现 80% 的问题。建议：原理图阶段做“防护评审”，PCB 阶段做“近场扫描”，首板做“ESD/EFT 预测试”，量产前做正式认证。\n\n**课程**：认证不是“最后一步”，是“全程的验收”。\n\n### 26.4 三个典型防护\n\n#### 26.4.1 接口 ESD/浪涌两级\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 26-1：接口两级防护：GDT/压敏 + TVS<\/text>\n  <rect x=\"40\" y=\"80\" width=\"100\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"115\" font-size=\"12\" fill=\"currentColor\">接口<\/text>\n  <rect x=\"180\" y=\"80\" width=\"110\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"195\" y=\"110\" font-size=\"11\" fill=\"currentColor\">GDT/压敏<\/text>\n  <text x=\"195\" y=\"130\" font-size=\"10\" fill=\"currentColor\">大能量<\/text>\n  <rect x=\"330\" y=\"80\" width=\"100\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"345\" y=\"110\" font-size=\"11\" fill=\"currentColor\">TVS<\/text>\n  <text x=\"345\" y=\"130\" font-size=\"10\" fill=\"currentColor\">钳位<\/text>\n  <rect x=\"470\" y=\"80\" width=\"100\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"485\" y=\"110\" font-size=\"11\" fill=\"currentColor\">滤波<\/text>\n  <rect x=\"610\" y=\"80\" width=\"80\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"625\" y=\"115\" font-size=\"11\" fill=\"currentColor\">芯片<\/text>\n  <line x1=\"140\" y1=\"115\" x2=\"180\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"290\" y1=\"115\" x2=\"330\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"430\" y1=\"115\" x2=\"470\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"570\" y1=\"115\" x2=\"610\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"40\" y=\"220\" font-size=\"13\" fill=\"currentColor\">大能量先泄放，再钳位，再滤波；器件越靠接口越好。<\/text>\n<\/svg>\n```\n\n#### 26.4.2 屏蔽与缝隙\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 26-2：外壳缝隙与波长<\/text>\n  <rect x=\"80\" y=\"70\" width=\"260\" height=\"120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"70\" x2=\"200\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"6\"/>\n  <text x=\"100\" y=\"215\" font-size=\"12\" fill=\"currentColor\">缝隙长度 &lt; λ/20<\/text>\n  <text x=\"400\" y=\"100\" font-size=\"13\" fill=\"currentColor\">缝隙像天线，长度接近 λ/2 时辐射最强；<\/text>\n  <text x=\"400\" y=\"125\" font-size=\"13\" fill=\"currentColor\">用弹片/导电泡棉/多点螺钉缩短缝隙。<\/text>\n<\/svg>\n```\n\n#### 26.4.3 共模与滤波\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 26-3：共模电感与 Y 电容<\/text>\n  <text x=\"40\" y=\"95\" font-size=\"13\" fill=\"currentColor\">线缆<\/text>\n  <line x1=\"100\" y1=\"90\" x2=\"220\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"100\" y1=\"120\" x2=\"220\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"220\" y=\"70\" width=\"100\" height=\"70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"235\" y=\"100\" font-size=\"11\" fill=\"currentColor\">共模<\/text>\n  <text x=\"235\" y=\"120\" font-size=\"11\" fill=\"currentColor\">电感<\/text>\n  <line x1=\"320\" y1=\"90\" x2=\"440\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"320\" y1=\"120\" x2=\"440\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"380\" y1=\"105\" x2=\"380\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"160\" x2=\"400\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"410\" y=\"165\" font-size=\"11\" fill=\"currentColor\">Y 电容<\/text>\n  <text x=\"440\" y=\"100\" font-size=\"12\" fill=\"currentColor\">到板内<\/text>\n  <text x=\"40\" y=\"220\" font-size=\"13\" fill=\"currentColor\">共模电感抑制同向电流；Y 电容给共模电流提供回流。<\/text>\n<\/svg>\n```\n\n#### 26.4.4 TVS 怎么选：钳位电压是第一参数\n\nTVS 选型顺序：工作电压（VRWM ≥ 信号最高电压）→ 击穿电压（VBR）→ 钳位电压（VC，越低越好）→ 峰值脉冲功率/电流（按 8/20μs 波形）→ 结电容（高速信号要低，如 <1pF）。钳位电压要低于被保护器件的绝对最大电压，否则“保护了但器件还是坏”。单向/双向按信号极性选；ESD 用低电容、Surge 用大功率。\n\n**课程**：TVS 不是“电压对就行”，钳位电压决定成败。\n\n#### 26.4.5 压敏电阻与气体放电管：粗保护的“接力”\n\n**压敏（MOV）**：吸收能量大、响应慢、有老化/漏电；适合电源口第一级。\n\n**气体放电管（GDT）**：耐冲击强、残压高、响应慢；适合雷击/浪涌第一级。\n\n**组合**：GDT/MOV 先“削峰”，TVS 再“精修”到安全电平；中间加电感/电阻做“退耦”，让两级不同时导通。只放一级，要么残压高、要么被烧。\n\n**课程**：防护是“接力赛”，不是“一个人扛”。\n\n#### 26.4.6 共模电感与 Y 电容\n\n共模电感对共模呈现高阻抗、对差模影响小；Y 电容把共模噪声旁路到地。两者配合是“接口共模滤波”的标配（如以太网/RS485/USB）。注意：Y 电容有漏电流限制（医疗/安规），容量不能太大；共模电感要注意饱和/直流偏置。布局上“先共模电感、后 Y 电容”，靠近接口。\n\n**课程**：共模滤波要“成对”用，单用一个效果有限。\n\n#### 26.4.7 串阻/磁珠：限流与高频损耗\n\n串阻（22～100Ω）限制 ESD/浪涌电流、阻尼振铃；磁珠在高频呈阻性，吸收高频噪声。二者都“不能万能”：串阻影响信号完整性（高速差分慎用），磁珠有直流电阻/饱和。用法：低速信号串阻+TVS；高速信号用低电容 TVS/共模电感，慎加串阻。\n\n**课程**：防护器件也会“伤信号”，要算清代价。\n\n#### 26.4.8 隔离：地环路与高压的“断点”\n\n光耦/数字隔离器/隔离电源，把“地”分开，解决地环路/共模/高压。RS485/CAN/以太网常用隔离；医疗/工业接口必须隔离。隔离器要注意“隔离耐压/爬电距离/共模瞬态抗扰（CMTI）”。隔离不是“万能”，它只断“地环路”，不断“空间辐射”。\n\n**课程**：隔离解决“地”的问题，不解决“天线”的问题。\n\n#### 26.4.9 屏蔽与结构：缝隙、开孔、搭接\n\n屏蔽体设计：缝隙长度 <λ/20、螺钉间距 <λ/20、开孔用孔阵列（孔深/孔径比 >3）、接缝加导电衬垫。塑料外壳喷导电漆/贴铜箔，要保证“搭接”到地。连接器金属壳要“搭接”到屏蔽地，不能浮空。屏蔽效能靠“整体搭接”，不是“局部贴一块铜箔”。\n\n**课程**：屏蔽的短板永远是“缝/搭接”。\n\n#### 26.4.10 接口防护的“顺序”：从粗到细\n\n以 RS485 为例：接口 → GDT/MOV（粗）→ 共模电感 → TVS（细）→ 串阻 → 收发器。每一级之间留“退耦”距离/电感。顺序反了（先 TVS 后 GDT），TVS 先被大能量打坏。评审时画“防护链”，逐级标器件/参数。\n\n**课程**：防护链的顺序，比单个器件贵不贵更重要。\n\n#### 26.4.11 电源口的防护：保险+压敏+TVS+滤波\n\n电源口典型链：保险丝/自恢复保险 → MOV/GDT → 共模电感 → X/Y 电容 → TVS → DC-DC。保险丝防“持续过流”，MOV 吸“浪涌”，TVS 钳“残压”，滤波抑“传导发射”。注意安规（爬电/电气间隙）、保险丝额定电流/熔断特性。\n\n**课程**：电源口是“最容易被雷击/浪涌打”的地方。\n\n#### 26.4.12 板级 ESD：地平面与“泄放路径”\n\n板级 ESD 防护：接口地/数字地分区、地过孔密集、TVS 靠近接口、敏感器件远离板边、按键/连接器加泄放。ESD 电流要走“低阻抗路径”到地，不能穿过敏感芯片。评审时看“接口→TVS→地”的路径是否短、是否被分割。\n\n**课程**：ESD 防护是“路径设计”，不是“器件堆叠”。\n\n#### 26.4.13 一条完整的接口防护链\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 26-4：RS485 接口防护链<\/text>\n  <rect x=\"40\" y=\"90\" width=\"70\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"120\" font-size=\"11\" fill=\"currentColor\">接口<\/text>\n  <line x1=\"110\" y1=\"115\" x2=\"160\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"160\" y=\"82\" width=\"70\" height=\"66\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"172\" y=\"102\" font-size=\"10\" fill=\"currentColor\">GDT<\/text>\n  <text x=\"172\" y=\"120\" font-size=\"10\" fill=\"currentColor\">MOV<\/text>\n  <text x=\"168\" y=\"138\" font-size=\"9\" fill=\"currentColor\">粗保护<\/text>\n  <line x1=\"230\" y1=\"115\" x2=\"280\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"280\" y=\"82\" width=\"80\" height=\"66\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"292\" y=\"108\" font-size=\"10\" fill=\"currentColor\">共模电感<\/text>\n  <text x=\"288\" y=\"128\" font-size=\"9\" fill=\"currentColor\">+ Y 电容<\/text>\n  <line x1=\"360\" y1=\"115\" x2=\"410\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"410\" y=\"88\" width=\"70\" height=\"54\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"430\" y=\"112\" font-size=\"11\" fill=\"currentColor\">TVS<\/text>\n  <text x=\"424\" y=\"128\" font-size=\"9\" fill=\"currentColor\">细保护<\/text>\n  <line x1=\"480\" y1=\"115\" x2=\"530\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"530\" y=\"92\" width=\"50\" height=\"46\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"540\" y=\"120\" font-size=\"11\" fill=\"currentColor\">22Ω<\/text>\n  <line x1=\"580\" y1=\"115\" x2=\"630\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"630\" y=\"92\" width=\"60\" height=\"46\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"640\" y=\"120\" font-size=\"10\" fill=\"currentColor\">收发器<\/text>\n  <line x1=\"40\" y1=\"175\" x2=\"690\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <text x=\"40\" y=\"195\" font-size=\"10\" fill=\"currentColor\">GND（接口地）<\/text>\n  <line x1=\"195\" y1=\"148\" x2=\"195\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"320\" y1=\"148\" x2=\"320\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"445\" y1=\"142\" x2=\"445\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"235\" font-size=\"12\" fill=\"currentColor\">顺序：粗保护→共模→细保护→限流；反了会先烧 TVS。<\/text>\n  <text x=\"40\" y=\"262\" font-size=\"12\" fill=\"currentColor\">每级的地都要就近回接口地，不能绕到数字地。<\/text>\n  <text x=\"40\" y=\"300\" font-size=\"11\" fill=\"currentColor\">“防护链”要画在原理图里，评审逐个器件对参数。<\/text>\n<\/svg>\n```\n\n**看图**：从接口往里，器件越来越“精细”；每一级都有对地的泄放/旁路，地回路越短越好。\n\n### 26.5 选型与降额\n\n| 场景 | 方案 | 注意 |\n|---|---|---|\n| 电源入口 | 压敏+TVS+共模+滤波 | 两级配合 |\n| 高速接口 | 低电容 ESD | 不影响信号 |\n| 继电器/电机 | 续流+RC/压敏 | 触点/线圈 |\n| 电缆 | 屏蔽/双绞/共模 | 接地 |\n| 外壳 | 导电涂层/弹片 | 缝隙 |\n\n#### 26.5.1 防护器件选型总表\n\n| 场景 | 第一级 | 第二级 | 第三级 | 关键参数 |\n|---|---|---|---|---|\n| USB/HDMI | 低容 TVS | 共模电感 | 串阻/磁珠 | 结电容<1pF、钳位<器件极限 |\n| RS485/CAN | GDT/MOV | 共模电感 | TVS+串阻 | 浪涌功率、共模阻抗 |\n| 电源口 | 保险+MOV | 共模电感 | TVS | 熔断特性、能量 |\n| 按键/外壳 | ESD 枪路径 | TVS/RC | 地平面 | 泄放路径短 |\n| 天线/RF | — | 低损耗滤波 | 屏蔽 | 插损、隔离 |\n\n**用法**：先填表，再选型号；不要“先买器件再想放哪”。\n\n#### 26.5.2 降额：电压/电流/能量\n\nTVS 工作电压按信号最高电压的 1.1～1.2 倍选；浪涌电流按“实际波形/次数”降额（如 8/20μs 单次能力的 50%～70%）；MOV 按“能量/老化”降额。电容/电感按“温升/直流偏置”降额。防护器件是“消耗品”，要按寿命/次数设计。\n\n**课程**：防护器件也会“累”，降额是寿命设计。\n\n#### 26.5.3 安规：爬电距离与漏电流\n\n接口/电源的爬电距离/电气间隙按工作电压/污染等级查表；Y 电容漏电流要满足安规（医疗更严）；隔离器要满足隔离耐压。安规不过，EMC 过了也不能卖。评审时把“安规距离”单列一张图。\n\n**课程**：EMC 和安规是“两本账”，都要算。\n\n#### 26.5.4 成本：防护 vs 返修\n\n防护器件占 BOM 比例很小，但“省一颗 TVS”可能导致整批返修/客诉。按“失效成本×概率”算，而不是“器件单价”。关键接口（电源/通信/人机）必须防护；内部板间可简化。\n\n**课程**：防护是“保险”，不是“成本项”。\n\n#### 26.5.5 布局：防护器件的“位置学”\n\nTVS 要靠近接口/连接器，走线短、地过孔近；共模电感在接口与 TVS 之间；Y 电容靠近接口地。防护器件“远离敏感芯片”，让 ESD 电流在接口处就被泄放。布局错了，参数再好也白搭。\n\n**课程**：防护的第一原则是“位置”。\n\n#### 26.5.6 评审清单：十个问题\n\n1. 每个对外接口有没有防护链？\n2. TVS 钳位电压是否低于器件极限？\n3. 防护器件是否靠近接口、地回路是否短？\n4. 差模/共模是否分开处理？\n5. 屏蔽缝隙/开孔是否 <λ/20？\n6. 电缆/连接器是否有共模扼流/屏蔽？\n7. 接地是否完整、接口地是否分区？\n8. 安规距离/漏电流是否满足？\n9. 是否有 ESD/EFT/Surge 预测试计划？\n10. 量产抽测/客诉回溯是否有记录？\n\n**课程**：这 10 条过一遍，能挡住大多数“低级 EMC 事故”，也能让评审有据可依。\n\n#### 26.4.14 缝隙与开孔：屏蔽的短板\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 26-5：屏蔽体的缝与孔（λ/20 原则）<\/text>\n  <rect x=\"80\" y=\"70\" width=\"240\" height=\"150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"70\" x2=\"200\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"3\"/>\n  <text x=\"150\" y=\"60\" font-size=\"10\" fill=\"currentColor\">长缝（易漏）<\/text>\n  <text x=\"80\" y=\"245\" font-size=\"10\" fill=\"currentColor\">缝长≈λ/2 → 泄漏峰<\/text>\n  <rect x=\"400\" y=\"70\" width=\"240\" height=\"150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <circle cx=\"450\" cy=\"100\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"490\" cy=\"100\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"530\" cy=\"100\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"570\" cy=\"100\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"450\" cy=\"150\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"490\" cy=\"150\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"530\" cy=\"150\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"570\" cy=\"150\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"60\" font-size=\"10\" fill=\"currentColor\">孔阵列（抑制好）<\/text>\n  <text x=\"400\" y=\"245\" font-size=\"10\" fill=\"currentColor\">孔径/孔深 &lt; λ/20，孔距小<\/text>\n  <text x=\"40\" y=\"278\" font-size=\"12\" fill=\"currentColor\">同样的开孔面积，长缝比小孔漏得多；能打孔就不要开长槽。<\/text>\n<\/svg>\n```\n\n**读法**：屏蔽效能由“最长缝”决定；开孔要“小而密”，接缝要“搭接到地”。\n\n### 26.6 测量与仿真\n\n#### 26.6.1 预测试\n\n1. 近场探头扫板子，找噪声源。\n2. 频谱仪看辐射包络。\n3. 拔线/加磁环，判断传导/辐射。\n4. 改布局/加滤波，复测。\n\n#### 26.6.2 CircuitJS\n\n```circuitjs\ninductkick-snub\n```\n\n观察续流/吸收对开关反峰的影响。\n\n#### 26.6.3 动手任务\n\n- 用近场探头扫一块 Buck 板，找最强点。\n- 给 RS485 画两级防护。\n- 给电源入口画共模+Y 电容。\n- 写一页 EMC 整改记录。\n\n#### 26.6.4 近场探头扫描：找“热点”\n\n近场探头（H 场/E 场）贴板扫描，配合频谱仪看 30MHz～1GHz 的热点。重点扫：开关电源、时钟/晶振、连接器、电缆出口、板边缝隙。热点定位后，用“手指/铜箔/磁环”做快速验证：按住某处噪声下降，说明那里是源/路径。扫描要记录“位置/频点/幅度”，形成整改清单。\n\n**课程**：近场扫描是“EMC 的听诊器”。\n\n#### 26.6.5 频谱仪与 LISN：传导测试\n\n传导发射用 LISN 隔离电网、测电源线噪声；频谱仪看 150kHz～30MHz。先测“本底”，再接设备；分“差模/共模”用 CDN/分离器。超标频点对应开关频率/谐波，先查“开关电源/DC-DC”的环路/滤波。测试布置固定，数据才可比。\n\n**课程**：传导测试要“先本底、后设备”。\n\n#### 26.6.6 ESD 枪测试：接触/空气\n\nESD 枪按 IEC 61000-4-2 打：接触放电打金属件/连接器外壳，空气放电打缝隙/按键/塑料表面。每点 10 次/极性，观察复位/死机/通信中断。测试要记录“电压/位置/现象”，整改后复测。注意“枪的地线/放电网络”要按标准，否则结果不可信。\n\n**课程**：ESD 测试是“找路径”，不是“比谁扛得高”。\n\n#### 26.6.7 EFT/Surge 预测试\n\nEFT：脉冲群耦合到电源/信号线，观察通信误码/复位；Surge：1.2/50μs 打电源口，观察防护器件是否损坏/残压。预测试用“低成本耦合夹/浪涌发生器”，重点看“防护链是否逐级动作”。测试后检查 TVS/MOV 是否劣化。\n\n**课程**：防护器件“扛过一次”不代表“还能扛第二次”。\n\n#### 26.6.8 仿真：共模滤波的频响\n\n用 LC/RC 仿真看“共模电感+Y 电容”的插入损耗：低频影响小、高频衰减大；但寄生参数（电感匝间电容/电容 ESL）会让高频失效。仿真提醒：滤波器不是“理想”，布局/寄生决定实际效果。\n\n```circuitjs\nrc-lowpass-159\n```\n\n**判据**：目标频段插损 ≥20dB；不影响信号带宽；Y 电容漏电流满足安规。\n\n#### 26.6.9 整改记录：一张表闭环\n\n| 频点/现象 | 定位 | 措施 | 复测 | 结论 |\n|---|---|---|---|---|\n| 48MHz 辐射 | DC-DC 开关 | 加 RC 缓冲/展频 | -8dB | 通过 |\n| 接触 8kV 复位 | 按键走线 | TVS+串阻+地 | 不复位 | 通过 |\n| 传导 150k～1M | 差模 | X 电容+电感 | -6dB | 通过 |\n\n**用法**：每条整改都要“可复现/可复测”，不要“感觉好了”。\n\n#### 26.6.10 测试记录要写“最坏条件”\n\nEMC 结果对温度/电压/负载/电缆摆放敏感；记录要写“最坏条件”（高温/低压/满负载/最长电缆），不要只写“通过”。最坏条件过了，才算真的过；否则量产/现场会“翻车”。\n\n**课程**：EMC 报告不写条件，等于没测。\n\n### 26.7 常见坑\n\n1. **只加 TVS 不分级**：大能量打坏。\n2. **ESD 器件放远**：保护不到芯片。\n3. **高速线用大电容**：信号失真。\n4. **屏蔽缝隙太长**：泄漏。\n5. **共模电感方向错**：无效。\n6. **Y 电容位置错**：共模无回流。\n7. **继电器无续流**：触点/驱动损坏。\n8. **只在实验室过认证**：现场线缆/接地不同。\n9. **忽略电缆辐射**：板子好，整机不过。\n\n#### 26.7.1 只加 TVS，不改地\n\nTVS 钳位了，但 ESD 电流没低阻抗路径，地弹照样复位。修法：TVS 地过孔就近、接口地/数字地分区、加泄放路径。\n\n**课程**：TVS 是“阀”，地是“管”。\n\n#### 26.7.2 防护器件放太远\n\nTVS 放在板子另一头，走线电感让钳位失效。修法：靠近连接器、短线、地过孔近。\n\n**课程**：防护器件的“位置”比“型号”重要。\n\n#### 26.7.3 用高结电容 TVS 保护高速线\n\nUSB3/HDMI 用了几 pF 的 TVS，眼图闭合。修法：低电容（<0.5pF）/专用 ESD 阵列。\n\n**课程**：防护不能“牺牲信号”。\n\n#### 26.7.4 屏蔽只贴铜箔不搭接\n\n铜箔浮空/搭接不良，屏蔽无效。修法：导电衬垫/螺钉/搭接到地。\n\n**课程**：屏蔽的命门是“搭接”。\n\n#### 26.7.5 传导整改乱加 Y 电容\n\nY 电容加大，漏电流超标/安规不过。修法：按安规上限选、共模电感配合。\n\n**课程**：EMC 整改要“守安规”。\n\n#### 26.7.6 忽略电缆/连接器\n\n板子改了半天，超标是“电缆天线”。修法：共模扼流/屏蔽电缆/缩短/改变布线。\n\n**课程**：EMC 问题常在“板外”。\n\n#### 26.7.7 只做“认证前突击”\n\n平时不管 EMC，送检前一周加磁珠/贴铜箔，结果“过了一版、量产又超标”。EMC 要“设计进去”：原理图防护评审、PCB 地/屏蔽评审、首板预测试、量产抽测。突击整改只能救一次，救不了量产。\n\n**课程**：EMC 是“设计属性”，不是“测试技巧”；把防护写进原理图/PCB 规范，比送检前熬夜贴铜箔有效得多。\n\n### 26.8 本章复盘\n\n#### 26.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| EMC=EMI+EMS | 概念 | 发射+抗扰 |\n| 缝隙 &lt; λ/20 | 屏蔽 | 最高频率 |\n| 两级防护 | 浪涌 | 大能量+钳位 |\n| 共模电感+Y 电容 | 电缆 | 共模回流 |\n| 近场探头 | 定位 | 噪声源 |\n| 波长 λ | c/f | 30MHz=10m、1GHz=30cm |\n| 天线长度 | ≈λ/4 高效 | 电缆/长走线 |\n| 边沿拐点 | f≈0.35/tr | 谐波起点 |\n| TVS 钳位 | VC &lt; 器件极限 | 8/20μs |\n\n\n#### 26.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| EMC | electromagnetic compatibility | 电磁兼容 |\n| EMI | electromagnetic interference | 电磁发射 |\n| EMS | electromagnetic susceptibility | 电磁抗扰 |\n| 共模 | common mode | 同向电流 |\n| GDT | gas discharge tube | 气体放电管 |\n| Y 电容 | Y-capacitor | 跨接地的安规电容 |\n\n#### 26.8.3 自测 10 题\n\n1. EMC/EMI/EMS 关系？\n2. EMC 三要素？\n3. 共模和差模区别？\n4. 两级防护怎么配？\n5. 缝隙为什么用 λ/20？\n6. 共模电感作用？\n7. Y 电容作用？\n8. 近场探头怎么用？\n9. 为什么实验室过认证现场还死机？\n10. 继电器为什么要续流？\n\n**11. 为什么“时钟 24MHz”会辐射到 300MHz？**\n答：方波边沿陡，谐波丰富；上升时间决定拐点频率（f≈0.35/tr），拐点以上仍有谐波，只是衰减更快。\n\n**12. TVS 的钳位电压选低了会怎样？**\n答：正常信号会被削顶/漏电，甚至影响通信；选型要“VRWM 略高于信号、VC 低于器件绝对最大电压”。\n\n**13. 屏蔽体上有一条 10cm 长缝，1GHz 时有问题吗？**\n答：1GHz 的 λ=30cm，λ/2=15cm，10cm 已接近，容易漏；应缩短缝隙/加衬垫/改孔阵列。\n\n**14. 传导发射超标，先加 Y 电容为什么可能更糟？**\n答：Y 电容加大会增加漏电流，可能违反安规；且共模/差模没分清时乱加，可能压下一个频点、冒出另一个。\n\n**15. 为什么“板子改了、电缆没改”EMC 还是不过？**\n答：辐射/抗扰的“天线”常在电缆/连接器；电缆长度接近 λ/4 时效率高，必须共模扼流/屏蔽/缩短。\n\n#### 26.8.4 能力清单\n\n- [ ] 能解释 EMC 三要素。\n- [ ] 能设计接口两级防护。\n- [ ] 能处理屏蔽/缝隙/共模。\n- [ ] 能用近场探头定位噪声。\n- [ ] 能写整改记录。\n\n#### 26.8.5 复盘清单\n\n1. 每个对外接口是否有“粗→细”的防护链，且画在原理图上？\n2. TVS 的 VRWM/VC/结电容是否与信号匹配？\n3. 防护器件是否靠近接口、地过孔是否就近？\n4. 差模/共模是否分开处理，Y 电容是否守安规？\n5. 屏蔽缝隙/开孔是否满足 λ/20，接缝是否搭接？\n6. 电缆/连接器是否有共模扼流或屏蔽？\n7. 地平面是否完整、接口地/数字地是否分区？\n8. 是否做了近场扫描/ESD/EFT 预测试并留记录？\n9. 整改是否“可复现/可复测”，有没有闭环表？\n10. 量产抽测/客诉回溯是否进问题库？\n\n**课程**：EMC 的“验收”不是“过认证”，是“量产不出事”。\n\n#### 26.8.6 动手练习\n\n**练习一**：拿一根 1m 排线，用近场探头在 30～300MHz 扫，记录峰值频率，再套 λ/4 算“哪段在当天线”。\n\n**练习二**：给一块带 RS485 的板画防护链，标清每级器件/钳位/地回路，找同学互相挑错。\n\n**练习三**：用 ESD 枪打外壳缝隙，记录“复位/死机/无影响”，再改地/加 TVS 复测。\n\n**延伸**：EMC 是“实践学科”，看十篇标准不如亲手打一次 ESD；但每次测试都要记录布置/现象，否则经验无法复用；这也是 EMC 工程师“越老越值钱”的原因：他见过足够多的现场，也踩过足够多的坑；把每次整改写进问题库，下一次就不要在同一个接口上再犯；问题库里的每一条，都是下一次评审的“预防针”。\n\n#### 26.8.7 下一章\n\n下一章讲**DFM、拼板与生产成本**：设计要能做得出来、做得便宜。","taskSignature":"40e0625cf9ebd0d0bf6dd5d41504c276c4cb0fa29e2e2579e79dd0a93d562bf4","taskCount":5},{"id":"27","title":"第 27 章 · DFM、拼板与生产成本","short":"DFM、拼板与生产成本","stage":4,"diff":3,"prev":"第 26 章 EMC/ESD 与防护设计","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 说清 DFM（可制造性设计）检查的 8 个维度。\n2. 设计拼板：V-cut/邮票孔/间距/工艺边。\n3. 估算 PCB 成本：面积、层数、工艺、数量。\n4. 处理阻焊/丝印/孔径/线宽等板厂工艺边界。\n5. 做一份可被板厂直接生产的 Gerber/钻孔/坐标包。\n6. 理解“设计降本”不等于“偷工减料”。\n7. 说出至少 8 个 DFM/拼板常见坑。\n\n设计出来的板子必须能制造。DFM 不是“板厂的事”，是设计阶段就要避免的坑；拼板/工艺边/成本，直接影响打样和量产。\n\n## 正文\n\n### 27.1 它解决什么问题：三个真实场景\n\n#### 场景一：拼板没有工艺边，贴片机夹不住\n\n板子拼在一起，边缘没有 5mm 工艺边/定位孔，贴片机轨道夹不住，只能手贴。拼板要留工艺边和 Mark 点。\n\n#### 场景二：V-cut 太靠边，板子掰裂\n\nV-cut 线离器件/焊盘太近，掰板时应力把焊盘拉裂。V-cut 要留安全距离，邮票孔要按孔径/间距。\n\n#### 场景三：孔太小/线太细，板厂加价或做不出\n\n0.2mm 孔、4mil 线，普通板厂做不了/良率低，价格翻倍。设计前先看板厂工艺能力表。\n\n### 27.2 它是什么：DFM 是“设计迁就工艺”\n\nDFM（Design for Manufacturability，可制造性设计）检查：\n\n1. 最小线宽/间距\n2. 最小孔径/环宽\n3. 阻焊/丝印\n4. 焊盘/钢网\n5. 拼板/工艺边\n6. 阻抗/叠层\n7. 测试点/定位\n8. 文件完整性\n\n> **术语第一次出现**：工艺边（process edge）是拼板边缘留出的 5～10mm 区域，给贴片机轨道/定位孔用，不放器件。\n\n#### 27.2.1 DFM 是什么：让设计“能被造出来”\n\nDFM（Design for Manufacturing）不是“画完让板厂挑毛病”，是“画的时候就按工艺能力设计”。它管：最小线宽/间距、最小孔径/环宽、焊盘/阻焊桥、孔到边、板边/工艺边、拼板/V-cut、Mark 点、阻抗/叠层。DFM 做得好，板厂“一次就过”；做不好，加价、延期、甚至做不出来。\n\n**课程**：DFM 不是“可选项”，是“报价单的第一页”。\n\n#### 27.2.2 工艺能力表：先问“板厂能做到多少”\n\n每家板厂都有“工艺能力表”：最小线宽/间距（如 4/4mil、3/3mil）、最小孔径（0.2/0.15mm）、最小环宽、层数、板厚、铜厚、阻抗控制、V-cut/邮票孔。设计前拿表，把“关键参数”对着填；不要按“网上教程”的极限值画。\n\n**课程**：先拿能力表，再动手；顺序反了必返工。\n\n#### 27.2.3 最小线宽/间距：不是“越细越高级”\n\n线宽/间距越细，板厂蚀刻/对位难度越大，良率越低、价格越高。普通板 6/6mil 很稳，4/4mil 常见加价，3/3mil 要选厂。细线还影响阻抗/载流/可靠性。设计时“能用 8mil 不用 6mil，能用 6mil 不用 4mil”；只有高密度 BGA 才被迫用细线。\n\n**课程**：细线是“成本/良率”的开关，不是“技术炫耀”。\n\n#### 27.2.4 孔径与环宽：孔是“最容易做坏”的地方\n\n钻孔有“孔径公差/对位偏差”，环宽（焊盘-孔径）太小会“破环/孔壁脱离”。常见：孔径 0.3mm、环宽 ≥0.15mm（单边）；0.2mm 孔要更小环宽/更高工艺。孔到边、孔到孔、孔到铜的距离都要留。过孔盖油/塞孔按需求选。\n\n**课程**：孔做不好，整板报废；孔径/环宽要留余量。\n\n#### 27.2.5 阻焊与焊盘：桥、开窗、散热\n\n阻焊桥（两个焊盘之间的阻焊）太窄会“连锡”；开窗太小会“上锡不良”；大铜面散热会“焊接困难”。DFM 要看：阻焊桥宽度（≥0.1mm）、开窗单边余量（0.05～0.1mm）、热焊盘/散热过孔、Mark 点（1mm 圆、周围无铜）。这些细节决定“能不能贴、贴得好不好”。\n\n**课程**：贴片不良，一半是焊盘/阻焊的锅。\n\n#### 27.2.6 板边与工艺边：贴片机的“抓手”\n\n拼板/单板要有工艺边（通常 5～10mm），用于贴片机轨道/夹持；工艺边上放 Mark 点、定位孔。板边到铜/孔要留距离（如 0.5mm），V-cut 线要留“余量”。没有工艺边，贴片机夹不住/贴不准；工艺边太窄，轨道压到元件。\n\n**课程**：工艺边不是“废料”，是“贴片机的手”。\n\n#### 27.2.7 Mark 点与定位：机器“看得见”才能贴\n\nMark 点（基准点）用于贴片机/印刷机对位：常见 1mm 圆、周围 2mm 无阻焊/无铜、对比度高；拼板每块小板/整体都要有。定位孔（工具孔）用于铣边/测试夹具。Mark 点被阻焊/铜覆盖、位置不对称，机器就“找不到”。\n\n**课程**：Mark 点不是“装饰”，是“对位基准”。\n\n#### 27.2.8 拼板：为什么要拼、拼多少\n\n拼板把多块小板拼成一张大板，提高贴片/测试/出货效率、降低单价。拼多少看：板尺寸/利用率、贴片机轨道宽度、V-cut/邮票孔强度、元件高度/间距、订单量。拼板不是“越密越好”：太密 V-cut 掰裂、邮票孔残留、贴片干涉。\n\n**课程**：拼板是“效率/强度/成本”的平衡。\n\n#### 27.2.9 什么时候不拼板\n\n小批量/大板/异形/高元件/双面贴片复杂时，拼板可能“不划算”：V-cut 难、干涉多、分板应力大。此时可选“单板+工艺边”或“2 拼”。拼板不是“默认动作”，要按“批量/尺寸/工艺”判断。\n\n**课程**：能不拼就不拼；拼是为了效率，不是为了好看。\n\n### 27.3 关键参数与工艺\n\n| 项目 | 普通板厂 | 高密度 | 说明 |\n|---|---|---|---|\n| 最小线宽 | 6mil | 4mil | 越细越贵 |\n| 最小间距 | 6mil | 4mil | 同上 |\n| 最小孔 | 0.3mm | 0.2mm | 钻孔/环宽 |\n| 环宽 | 0.15mm | 0.1mm | 孔到铜 |\n| 板厚 | 1.6mm | 0.8～2.0 | 按叠层 |\n| 阻焊 | 绿/黑/白 | — | 黑油难检查 |\n| 拼板 | V-cut/邮票孔 | — | 按形状 |\n| 工艺边 | 5～10mm | — | 贴片 |\n\n#### 27.3.1 层数/板厚/铜厚：报价的三大变量\n\n层数（4/6/8）决定压合/钻孔/布线成本；板厚（1.6/1.2/0.8mm）影响材料/压合；铜厚（1oz/2oz）影响蚀刻/载流/价格。厚铜/薄板/高层数都是“加价项”。设计时按“电气需求”选，不要“为保险全上 2oz/8 层”。\n\n**课程**：层数/板厚/铜厚，是报价单上最直观的三行。\n\n#### 27.3.2 孔径/线宽组合：板厂的“难度等级”\n\n板厂常按“最小孔径/最小线宽/最小间距”组合定价：3/3mil+0.2mm 孔是“高难度”，6/6mil+0.3mm 是“常规”。同一块板，把最细的 2 根线改粗、把最小的 2 个孔改大，价格可能降一档。设计评审时问“这几个极限值能不能放宽”。\n\n**课程**：一处极限值，可能拉高整板价格。\n\n#### 27.3.3 拼板方式：V-cut、邮票孔、桥连\n\n**V-cut**：适合矩形板、直线分割，掰板后边缘整齐；但 V 槽深度/剩余厚度要控，太深易裂、太浅掰不断。\n\n**邮票孔**：适合异形/圆角/需要留边，孔+连接筋；掰后有毛刺，需要修边。\n\n**桥连**：用少量连接筋+铣槽，适合高密度/异形。\n\n**选择**：矩形大批量用 V-cut；异形/小批量用邮票孔；高密度用桥连/铣槽。\n\n#### 27.3.4 V-cut 的参数：深度、角度、余量\n\nV-cut 用“V 形铣刀”在板面切槽，常见角度 30°/45°/60°，剩余厚度约板厚的 1/3（如 1.6mm 板留 0.5～0.6mm）。V-cut 线要直、离板边/元件有距离；拼板间距（通常 0～2mm）要够。太靠边会“掰裂焊盘”，太深会“运输中断裂”。\n\n**课程**：V-cut 是“半切”，不是“切穿”。\n\n#### 27.3.5 邮票孔：孔径、孔距、连接筋\n\n邮票孔（mouse bite）沿分割线打一排小孔（常见 0.5～0.8mm 孔径、0.8～1.2mm 孔距），孔间留连接筋；掰板时沿孔断裂。孔太小/太密，板厂钻孔成本高；孔太大/太稀，掰板费力/毛刺大。邮票孔要离铜/焊盘有距离，避免掰板拉伤。\n\n**课程**：邮票孔是“可控的断点”，不是“随便打一排孔”。\n\n#### 27.3.6 拼板利用率：算“一张大板能出几块”\n\n拼板利用率=（小板面积×数量）/大板面积。常见大板 400×500mm/500×600mm；按板尺寸/间距/工艺边排。利用率低（<70%）时，单价会明显上升。异形板可以“嵌套/旋转”提高利用率；但要注意 V-cut 方向/元件高度。\n\n**算例**：50×50mm 小板，在 400×500mm 大板上排 7×9=63 块（含间距/边），利用率约 79%。\n\n#### 27.3.7 元件高度与拼板间距\n\n拼板时相邻小板的“高元件”要错开/留距离，避免贴片头干涉/回流焊遮挡。高连接器/大电感旁边留 3～5mm；双面贴片要考虑“另一面元件是否顶到”。拼板间距太小，贴片机吸嘴/轨道会撞。\n\n**课程**：拼板不只算“面积”，还要算“高度”。\n\n#### 27.3.8 分板方式：铣刀、冲压、激光\n\n**铣刀分板**：精度高、边缘好，适合小批量/高密度；有粉尘/应力。\n\n**冲压**：效率高、模具贵，适合大批量；有机械应力。\n\n**激光**：无应力、精度高，适合薄板/精细；速度慢/成本高。\n\n**选择**：按批量/板厚/边缘要求/预算；分板应力会伤焊点，薄板/大板要评估。\n\n#### 27.3.9 治具与测试点：DFM 的“后半段”\n\nDFM 不只在板厂，也在“贴片/测试/组装”。测试点要“够大（≥1mm）、够间距（≥2mm）、不被元件挡住”；定位孔要“非金属化/金属化”按治具选；拼板要方便“上治具/下治具”。没有测试点，治具做不了，只能“手工测/飞针”，成本高。\n\n**课程**：DFM 的终点是“能测、能装、能修”。\n\n#### 27.3.10 丝印与标识：别让产线“猜”\n\n丝印要标：版本号/日期、极性/1 脚、连接器定义、按键功能、测试点名称。字体高度 ≥0.8mm、线宽 ≥0.15mm，不要压焊盘/过孔。标识不清，产线“贴反/插反/测错”，返修成本远高于丝印面积。\n\n**课程**：丝印是“给产线看的说明书”。\n\n### 27.4 三个典型拼板\n\n#### 27.4.1 V-cut 拼板\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 27-1：V-cut 拼板与工艺边<\/text>\n  <rect x=\"40\" y=\"60\" width=\"640\" height=\"220\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"80\" width=\"180\" height=\"180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"270\" y=\"80\" width=\"180\" height=\"180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"480\" y=\"80\" width=\"180\" height=\"180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"240\" y1=\"80\" x2=\"240\" y2=\"260\" stroke=\"currentColor\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\n  <line x1=\"450\" y1=\"80\" x2=\"450\" y2=\"260\" stroke=\"currentColor\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\n  <text x=\"200\" y=\"295\" font-size=\"11\" fill=\"currentColor\">V-cut<\/text>\n  <text x=\"60\" y=\"55\" font-size=\"11\" fill=\"currentColor\">工艺边 5～10mm<\/text>\n<\/svg>\n```\n\n#### 27.4.2 邮票孔拼板\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 27-2：邮票孔拼板<\/text>\n  <rect x=\"80\" y=\"70\" width=\"240\" height=\"160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"360\" y=\"70\" width=\"240\" height=\"160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"320\" y1=\"80\" x2=\"320\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 6\"/>\n  <text x=\"330\" y=\"255\" font-size=\"12\" fill=\"currentColor\">邮票孔：孔径 0.5～1.0mm，孔间距 1.5～2.5mm<\/text>\n<\/svg>\n```\n\n#### 27.4.3 成本构成\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 27-3：PCB 成本构成<\/text>\n  <rect x=\"80\" y=\"200\" width=\"70\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"180\" y=\"160\" width=\"70\" height=\"100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"280\" y=\"120\" width=\"70\" height=\"140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"380\" y=\"90\" width=\"70\" height=\"170\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"480\" y=\"60\" width=\"70\" height=\"200\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"90\" y=\"285\" font-size=\"11\" fill=\"currentColor\">面积<\/text>\n  <text x=\"190\" y=\"285\" font-size=\"11\" fill=\"currentColor\">层数<\/text>\n  <text x=\"290\" y=\"285\" font-size=\"11\" fill=\"currentColor\">工艺<\/text>\n  <text x=\"390\" y=\"285\" font-size=\"11\" fill=\"currentColor\">数量<\/text>\n  <text x=\"490\" y=\"285\" font-size=\"11\" fill=\"currentColor\">交期<\/text>\n<\/svg>\n```\n\n#### 27.4.4 拼板排法：行列、旋转、镜像\n\n**行列排**：矩形板最常用，V-cut 横竖各切一刀；注意长宽比/掰板方向。\n\n**旋转 90°**：长条板旋转排，提高利用率；但丝印/元件方向要统一。\n\n**镜像排**：双面贴片/对称结构，注意“镜像后丝印/极性”。\n\n**混排**：不同小板拼一张，适合“多品种小批量”；要加“分隔/标识”，避免贴错。\n\n**课程**：排法先算“利用率”，再算“贴片/分板方便”。\n\n#### 27.4.5 工艺边怎么加：单边/双边/四边\n\n小批量/单板：加“双边工艺边”（左右各 5～10mm），放 Mark/定位孔。\n\n拼板：整张大板加“四边工艺边”，或“上下工艺边 + 左右 V-cut 余量”。\n\n异形板：用“桥连/邮票孔 + 工艺边”，保证贴片机夹持。\n\n**注意**：工艺边不能有“高元件/开孔”，否则轨道/吸嘴干涉。\n\n#### 27.4.6 Mark 点布置：整体 + 局部\n\n拼板：大板四角/对角放“整体 Mark”（2～3 个），每块小板放“局部 Mark”（对角 2 个）。Mark 点周围 2mm 无铜/无阻焊，直径 1mm，对比度高。贴片机先找整体 Mark 粗定位，再找局部 Mark 精定位。\n\n**课程**：Mark 点少了，贴片偏移；多了，编程麻烦。\n#### 27.4.7 V-cut 与邮票孔的“混合”\n\n同一张拼板可以“V-cut 为主、邮票孔为辅”：直线分割用 V-cut，异形/圆角处用邮票孔；但两者交界要留“过渡/连接筋”，避免掰板撕裂。混合拼板要画“分板示意图”，标清“哪里掰、哪里铣”。\n\n**课程**：混合不是“随便混”，要有分板顺序。\n\n#### 27.4.8 拼板与“元件干涉”\n\n拼板后相邻板的“高元件/连接器”可能“顶到”贴片机吸嘴/轨道；双面贴片时，另一面的元件可能“顶到”夹具。排板时把“高元件”放外侧/错开，或加“间距/避让区”。DFM 评审要看“3D 高度图/干涉”。\n\n**课程**：拼板是“2D 排布”，但要按“3D”检查。\n\n#### 27.4.9 成本构成：板费、工程费、贴片、测试\n\n**板费**：按面积/层数/工艺/数量；批量越大单价越低。\n\n**工程费（NRE）**：开模/编程/测试架，一次性。\n\n**贴片费**：按点数/拼板数/首件。\n\n**测试/组装/包装**：按工时/治具。\n\n**总成本**=板费+工程费+贴片+测试+物流+返修风险。\n\n#### 27.4.10 报价单怎么看：别只比“单价”\n\n报价单要拆开看：板材/层数/铜厚/工艺/阻抗/拼板/测试/工程费/交期。低价可能“少工序/低良率/慢交期”；高价可能“含阻抗/测试/快速”。比价要“同规格/同交期/同测试”，否则“苹果比橘子”。\n\n**课程**：比价先比“规格”，再比“价格”。\n\n#### 27.4.11 打样 vs 批量：两套逻辑\n\n打样：快、贵、工艺宽容（可飞线/手工焊）；验证“功能/结构”。\n\n批量：慢、便宜、工艺严格（DFM/拼板/测试）；验证“良率/一致性”。\n\n打样阶段就要按“批量 DFM”画，否则“打样过了、批量做不出”。\n\n**课程**：打样是“验证”，批量是“复制”；复制要按工艺。\n\n#### 27.4.12 交期：哪些环节最耗时\n\n板材采购（特殊材料/厚铜）→ 压合/钻孔 → 图形/蚀刻 → 阻焊/表面处理 → 铣边/拼板 → 测试。特殊工艺（阻抗/盲埋孔/背钻）加时间。排产前问“最长工序”，不要“按常规 5 天”承诺客户。\n\n**课程**：交期是“工序链”，不是“一个数字”。\n\n#### 27.4.13 案例：一块 4 层控制板的拼板与报价\n\n板尺寸 80×60mm，4 层 1.6mm，1oz，绿油白字，HASL，1000 片。拼板：2×3=6 拼，加四边 8mm 工艺边，V-cut 横竖各两刀。大板约 340×210mm，利用率约 72%。报价拆：板费（面积×单价）、工程费（一次性）、贴片（按点数）、测试（治具+工时）、分板/包装。结论：拼 6 拼比单板便宜约 35%，但 V-cut 深度要控、工艺边不能省。\n\n**课程**：拼板省的錢，常在“分板/良率”里花回去；账要一起算。\n\n#### 27.4.14 拼板图长什么样\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 27-4：2×3 拼板（工艺边+Mark+分板线）<\/text>\n  <rect x=\"70\" y=\"60\" width=\"580\" height=\"230\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"90\" y=\"80\" width=\"540\" height=\"190\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <text x=\"300\" y=\"76\" font-size=\"10\" fill=\"currentColor\">工艺边 8mm<\/text>\n  <rect x=\"100\" y=\"90\" width=\"160\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <rect x=\"280\" y=\"90\" width=\"160\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <rect x=\"460\" y=\"90\" width=\"160\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <rect x=\"100\" y=\"185\" width=\"160\" height=\"75\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <rect x=\"280\" y=\"185\" width=\"160\" height=\"75\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <rect x=\"460\" y=\"185\" width=\"160\" height=\"75\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <line x1=\"260\" y1=\"90\" x2=\"260\" y2=\"260\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"440\" y1=\"90\" x2=\"440\" y2=\"260\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"100\" y1=\"175\" x2=\"620\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <text x=\"200\" y=\"305\" font-size=\"10\" fill=\"currentColor\">V-cut/分板线（虚线）<\/text>\n  <circle cx=\"110\" cy=\"70\" r=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"610\" cy=\"70\" r=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"55\" font-size=\"10\" fill=\"currentColor\">Mark<\/text>\n  <circle cx=\"110\" cy=\"280\" r=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"100\" y=\"300\" font-size=\"10\" fill=\"currentColor\">定位孔<\/text>\n<\/svg>\n```\n\n**看图**：外框是工艺边，里面 2×3 六块小板，虚线是 V-cut 分板线；Mark 点在对角，定位孔在工艺边上。\n\n#### 27.4.16 多品种混拼：小批量救星\n\n多品种小批量时，把“同板厚/同工艺/同颜色”的几款小板拼一张，摊薄工程费/板费。要求：间距/工艺边/Mark 统一，丝印标清“型号/版本”，分板图分开。混拼的代价是“排板复杂/贴片编程多”，适合“几十片/款”的场景。\n\n**课程**：混拼省的是“开机费”，花的是“管理成本”。\n\n### 27.5 选型与降额\n\n| 决策 | 低成本 | 高性能 | 建议 |\n|---|---|---|---|\n| 层数 | 2/4 层 | 6/8 层 | 按信号 |\n| 线宽 | 6mil | 4mil | 不盲目细 |\n| 孔 | 0.3mm | 0.2mm | 按板厂 |\n| 拼板 | V-cut | 邮票孔 | 按形状 |\n| 表面处理 | HASL | ENIG | 按焊接 |\n| 数量 | 多拼 | 单板 | 摊薄 |\n\n#### 27.5.1 工艺余量：把“极限”让给板厂\n\n设计不要卡板厂极限：线宽/间距留 1～2mil 余量、孔径留 0.05mm、环宽留 0.05mm、孔到边留 0.2mm。余量就是“良率/交期/价格”的缓冲。评审时问“这个值在能力表里是‘常规’还是‘极限’”。\n\n**课程**：余量不是“浪费”，是“买良率”。\n\n#### 27.5.2 拼板数量：按订单/贴片/分板算\n\n拼板数量=（大板尺寸/小板尺寸）×（利用率/间距）。小批量拼 4～6 拼，大批量拼 8～12 拼；太少效率低，太多分板难/翘曲大。双面板要考虑“另一面贴片/过炉”。订单量小，可用“多品种混拼”。\n\n**课程**：拼多少，先算“订单+贴片+分板”。\n\n#### 27.5.3 板厚/翘曲：拼板越大越易翘\n\n大拼板/薄板在回流焊后易翘曲；对策：对称叠层、加筋/工艺边、控制拼板尺寸、过炉方向。翘曲会导致“贴片偏移/焊点开裂”。批量前做“过炉试验”。\n\n**课程**：拼板尺寸也是“可靠性参数”。\n\n#### 27.5.4 表面处理：HASL/ENIG/OSP\n\n**HASL（喷锡）**：便宜、可焊性好，不适合细间距（不平）。\n\n**ENIG（沉金）**：平整、适合细间距/BGA，成本高；注意“黑盘”风险。\n\n**OSP**：环保、平整，怕氧化/多次过炉。\n\n**选择**：按间距/可靠性/成本；BGA/细间距优先 ENIG。\n\n#### 27.5.5 测试与治具：别把成本漏算\n\n测试治具（ICT/FCT/烧录）是“一次性+维护”成本；小批量可用“手工测试/飞针”，大批量做“治具/自动化”。测试点要留（测试焊盘/定位孔），否则“治具做不了”。报价时把“测试/治具”算进总成本。\n\n**课程**：测试不是“免费”，治具也是钱。\n\n#### 27.5.6 降额：良率与价格的平衡\n\nDFM 降额不是“越松越好”：太松会“布线困难/性能下降”，太紧会“良率低/价格高”。按“电气必要+工艺常规”取中间值；关键信号按性能，非关键按工艺。评审时列“必须紧/可以松”两张清单。\n\n**课程**：DFM 是“取舍”，不是“一刀切”。\n\n#### 27.4.15 V-cut 与邮票孔的断面\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 27-5：V-cut（左）与邮票孔（右）断面<\/text>\n  <rect x=\"70\" y=\"90\" width=\"220\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"70\" y1=\"130\" x2=\"290\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <path d=\"M170 90 L180 130 L190 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"150\" y=\"80\" font-size=\"10\" fill=\"currentColor\">V 形槽<\/text>\n  <text x=\"70\" y=\"195\" font-size=\"10\" fill=\"currentColor\">剩余厚度≈板厚 1/3<\/text>\n  <text x=\"70\" y=\"215\" font-size=\"10\" fill=\"currentColor\">掰板沿槽断，边缘较直<\/text>\n  <rect x=\"420\" y=\"90\" width=\"220\" height=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"450\" cy=\"130\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"490\" cy=\"130\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"530\" cy=\"130\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"570\" cy=\"130\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"430\" y=\"80\" font-size=\"10\" fill=\"currentColor\">邮票孔+连接筋<\/text>\n  <text x=\"420\" y=\"195\" font-size=\"10\" fill=\"currentColor\">孔径 0.5～0.8mm、孔距 0.8～1.2mm<\/text>\n  <text x=\"420\" y=\"215\" font-size=\"10\" fill=\"currentColor\">掰后有毛刺，需修边<\/text>\n  <text x=\"40\" y=\"255\" font-size=\"12\" fill=\"currentColor\">矩形大批量：V-cut 便宜、边缘好；异形/小批量：邮票孔灵活。<\/text>\n<\/svg>\n```\n\n**读法**：V-cut 是“整条线半切”，邮票孔是“一排小孔+连接筋”；一个靠槽，一个靠孔。\n\n### 27.6 测量与仿真\n\n#### 27.6.1 出板前检查\n\n1. Gerber 逐层对照。\n2. 钻孔表/孔径。\n3. 阻焊/丝印不压焊盘。\n4. 拼板/工艺边/Mark。\n5. 板厂工艺能力核对。\n6. 阻抗/叠层确认。\n\n#### 27.6.2 CircuitJS\n\n```circuitjs\nrc-lowpass-159\n```\n\n用 RC 理解“工艺/走线寄生”对信号的影响，避免为省成本牺牲关键线。\n\n#### 27.6.3 动手任务\n\n- 给自己的板做一次拼板（3×2）。\n- 加 5mm 工艺边和 3 个 Mark。\n- 查板厂工艺表，核对最小线宽/孔。\n- 估算 10 片/100 片成本。\n\n#### 27.6.1 出板前 DFM 检查清单\n\n1. 最小线宽/间距是否在能力表“常规”档？\n2. 最小孔径/环宽是否够？\n3. 孔到边/孔到铜/孔到孔是否够？\n4. 阻焊桥/开窗是否够？\n5. 工艺边/Mark/定位孔是否有？\n6. 拼板/V-cut/邮票孔是否标清？\n7. 元件高度/干涉是否检查？\n8. 叠层/阻抗是否给板厂确认？\n9. 测试点/治具是否留？\n10. 丝印/极性/版本号是否完整？\n\n**课程**：这 10 条过一遍，能省一次返工。\n\n#### 27.6.2 拼板图怎么画\n\n拼板图要标：大板尺寸、小板阵列（几行几列）、间距、工艺边宽度、V-cut/邮票孔位置、Mark 点坐标、定位孔、分板方向、版本/日期。最好附“分板示意图/3D 高度图”。板厂按图施工，不要“口头说”。\n\n**课程**：拼板图是“施工图”，不是“示意”。\n\n#### 27.6.3 用 Gerber 检查“能不能做”\n\n出 Gerber 后，用 CAM 工具/板厂 DFM 报告检查：线宽/间距/孔径/环宽/阻焊/钻孔/外形。重点看“最小值”和“孤立焊盘/断线”。板厂 DFM 报告要逐条回复“改/不改/为什么”。\n\n**课程**：Gerber 是“最终事实”，不是“参考”。\n\n#### 27.6.4 首件与拼板验证\n\n首件检查：外形/孔位/阻抗/丝印/极性/拼板 V-cut 深度。拼板验证：掰板是否顺利、边缘是否裂、邮票孔毛刺、尺寸公差。首件不过，批量不投。\n\n**课程**：首件是“批量的大门”。\n\n#### 27.6.5 成本估算表：一张表算清\n\n| 项 | 单价/公式 | 数量 | 小计 |\n|---|---|---|---|\n| PCB 板费 | 面积×单价 | 拼板数 | — |\n| 工程费 | 一次性 | 1 | — |\n| 贴片 | 点数×单价 | 点数 | — |\n| 测试/治具 | 工时/治具 | — | — |\n| 分板/组装 | 工时 | — | — |\n| 物流/包装 | 按批 | — | — |\n\n**用法**：先算“单板成本”，再算“总成本/报价”。\n\n#### 27.6.6 仿真：拼板不是电路，但可以“算应力”\n\n用简单梁模型估算“V-cut 剩余厚度/掰板应力”：剩余越薄，掰板越省力但越易裂；邮票孔连接筋越少，应力越集中。仿真不能替代试掰，但能帮你选“深度/孔距”。\n\n```circuitjs\nrc-charge\n```\n\n**说明**：这里借 RC 充电曲线讲“应力/时间常数”的类比——不是电路仿真，是“用熟悉的曲线理解‘慢慢加载/快速断裂’”。\n\n#### 27.6.7 与板厂沟通的“三句话”\n\n1. “这是我的叠层/阻抗/拼板图，请确认可生产。”\n2. “这几个极限值（线宽/孔径）能不能放宽？放宽后价格/交期变多少？”\n3. “DFM 报告请逐条给建议，我回复改/不改。”\n\n**课程**：沟通要“给图+给问题+给选择”，不要“只问多少钱”。\n\n#### 27.6.8 与贴片厂对齐“拼板/工艺边”\n\n贴片厂关心：轨道宽度、夹持边、Mark 点、元件高度、拼板尺寸、双面过炉。给他们“拼板图+3D 高度图+元件清单”，让他们回“能不能贴/要不要改”。不要“板厂说能做、贴片厂说贴不了”。\n\n**课程**：DFM 要过“板厂+贴片厂”两道关。\n\n#### 27.6.9 一次真实的 DFM 返工记录\n\n某 4 层板首版：最小线宽 4mil、最小孔 0.2mm、V-cut 距板边 1.0mm、无整体 Mark。板厂 DFM 报告标红 12 项：线宽/孔“高难度加价”、V-cut 太靠边“掰板裂”、Mark 缺失“贴片对不上”。改版：线宽放宽到 6mil、孔改 0.3mm、V-cut 退到 1.8mm、加大板 Mark；价格降一档、首件一次过。教训：**极限值不是“能力”，是“成本”**。\n\n**课程**：DFM 报告不是“挑刺”，是“报价单的明细”。\n\n#### 27.6.10 小结：DFM 是“把工艺装进设计”\n\n一块板能不能赚钱，不只看“设计多漂亮”，还看“能不能一次做出来、一次贴好、一次过测试”。DFM 把“板厂能力/贴片机/治具/分板”提前装进设计，让“报价/交期/良率”都可控。评审时把本章清单当“门禁”，比事后救火便宜得多。\n\n**课程**：DFM 做得好，硬件工程师就少熬一半的夜。\n\n### 27.7 常见坑\n\n1. **无工艺边**：贴片夹不住。\n2. **V-cut 靠器件太近**：掰裂。\n3. **邮票孔太少/太大**：掰不断/应力大。\n4. **Mark 点被阻焊盖**：贴片机识别不到。\n5. **孔太小**：板厂加价/良率低。\n6. **线太细**：断线/良率低。\n7. **黑油阻焊**：检查困难。\n8. **Gerber 缺层/镜像**：做错。\n9. **拼板不对称**：应力/变形。\n\n#### 27.7.1 没有工艺边\n\n贴片机夹不住/贴不准，只能手工贴。修法：加双边/四边工艺边，Mark/定位孔齐全。\n\n**课程**：工艺边是“贴片门票”。\n\n#### 27.7.2 V-cut 太靠边/太深\n\n掰板撕裂焊盘/运输断裂。修法：V-cut 线离板边/元件留距离，剩余厚度按板厚 1/3 控。\n\n**课程**：V-cut 是“半切”，参数要写进拼板图。\n\n#### 27.7.3 邮票孔太少/太密\n\n太少掰不动、太多钻孔贵/毛刺大。修法：按孔径 0.5～0.8mm、孔距 0.8～1.2mm、留连接筋。\n\n**课程**：邮票孔要“够断、好掰、不伤板”。\n\n#### 27.7.4 拼板太密，元件干涉\n\n高元件顶到吸嘴/轨道，双面贴片顶到夹具。修法：高元件错开/留 3～5mm，3D 检查。\n\n**课程**：拼板要按“高度”排，不只按“面积”。\n\n#### 27.7.5 只比单价，不算总成本\n\n低价板“良率低/交期慢/测试另收”，总成本更高。修法：同规格/同交期/同测试比价，算“总成本”。\n\n**课程**：采购要看“总成本”，不是“单价”。\n\n#### 27.7.6 打样按“手工”画，批量做不出\n\n打样飞线/手工焊能过，批量 DFM 不过。修法：打样就按批量 DFM 画，首件按批量工艺验证。\n\n**课程**：打样是“预演”，不是“特例”。\n\n#### 27.7.7 拼板尺寸超出贴片机轨道\n\n拼板太大，贴片机轨道/夹持放不下，只能“单板贴/手工贴”。修法：先查贴片机最大板宽（常见 350～460mm），再定拼板尺寸；超宽就“竖拼/减少列数”。\n\n**课程**：拼板尺寸要“先问贴片机”，再问板厂。\n\n#### 27.7.8 忽略“分板方向”\n\nV-cut 方向与元件/焊盘平行，掰板时应力拉到焊点；修法：分板线避开“长焊盘/细间距”，按“最省力/最不伤”的方向掰。\n\n**课程**：掰板也是“力学设计”。\n\n### 27.8 本章复盘\n\n#### 27.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 工艺边 5～10mm | 贴片 | 不放器件 |\n| V-cut 留安全距离 | 掰板 | 按板厂 |\n| 邮票孔 0.5～1.0mm | 拼板 | 孔距 1.5～2.5mm |\n| Mark 3 个 | 贴片 | 不被阻焊盖 |\n| 成本≈面积×层数×工艺×数量 | 估算 | 交期也影响 |\n\n| 拼板利用率 | (小板面积×数量)/大板面积 | 目标 >70% |\n| 工艺边 | 5～10mm | 贴片夹持 |\n| Mark | 1mm 圆、周围 2mm 无铜 | 对位 |\n| V-cut 余厚 | ≈板厚 1/3 | 0.5～0.6mm |\n| 邮票孔 | 0.5～0.8mm / 0.8～1.2mm | 孔距 |\n| 阻焊桥 | ≥0.1mm | 防连锡 |\n| 孔环宽 | ≥0.15mm（单边） | 防破环 |\n\n#### 27.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| DFM | design for manufacturability | 可制造性设计 |\n| 拼板 | panelization | 多板拼在一起 |\n| V-cut | V-score | V 形切割线 |\n| 邮票孔 | mouse bite | 小孔连接拼板 |\n| 工艺边 | process edge | 贴片机用的边缘 |\n| Mark 点 | fiducial | 贴片定位标记 |\n\n**NRE（工程费）**：一次性开模/编程/测试架费用。\n\n**工艺边（tooling strip）**：拼板边缘供贴片机夹持的区域。\n\n**Mark 点**：贴片/印刷对位基准。\n\n**V-cut**：V 形半切分板线。\n\n**邮票孔（mouse bite）**：一排小孔+连接筋的分板方式。\n\n**阻焊桥**：两焊盘间保留的阻焊。\n\n**环宽**：焊盘外径与孔径之差的一半。\n\n**拼板利用率**：小板总面积/大板面积。\n\n**首件（FAI）**：批量前第一块全尺寸/全功能检查。\n\n**分板应力**：掰板/铣板对焊点的机械应力。\n\n**拼板（panelization）**：多块小板拼一张大板。\n\n**混拼**：多品种拼一张，摊薄开机费。\n\n**工艺能力表**：板厂可稳定生产的最小线宽/孔径等参数。\n\n**DFM 报告**：板厂对设计的可制造性检查结果。\n\n**过炉**：回流焊高温过程，考翘曲/焊点。\n\n**翘曲（bow & twist）**：板子在高温/冷却后的变形。\n\n**测试点**：供治具/探针接触的焊盘。\n\n**定位孔**：供铣边/测试夹具固定的孔。\n\n#### 27.8.3 自测 10 题\n\n1. DFM 检查哪些维度？\n2. 工艺边多宽？\n3. V-cut 和邮票孔区别？\n4. Mark 点作用？\n5. 孔太小有什么问题？\n6. 成本由哪些因素决定？\n7. 黑油阻焊为什么难？\n8. 拼板不对称有什么后果？\n9. Gerber 要检查哪些层？\n10. 设计降本不能牺牲什么？\n\n**11. 为什么“拼 6 拼比单板便宜”但不能无限拼？**\n答：拼板提高贴片/测试效率、摊薄工程费；但拼太多会 V-cut 掰裂、翘曲、元件干涉、分板困难，良率下降。\n\n**12. V-cut 的剩余厚度怎么定？**\n答：约板厚 1/3（1.6mm 板留 0.5～0.6mm）；太薄运输断裂、太厚掰不动，按板厂经验/试掰确定。\n\n**13. 没有 Mark 点会怎样？**\n答：贴片机/印刷机无法对位，贴偏/印刷偏；拼板要整体+局部 Mark，周围无铜/无阻焊。\n\n**14. 为什么“打样过了，批量做不出”？**\n答：打样可飞线/手工/宽松工艺；批量按 DFM/拼板/治具，极限线宽/孔径/间距会被判“做不了”。\n\n**15. 报价单上最容易被忽略的成本是什么？**\n答：工程费（NRE）、测试/治具、分板/组装、返修风险；只比“板费单价”会算错总成本。\n\n| 拼板数量 | 按订单/贴片/分板 | 4～12 拼 |\n| 表面处理 | HASL/ENIG/OSP | 细间距 ENIG |\n| 首件 | 全尺寸/全功能 | 不过不批量 |\n\n| 混拼 | 同板厚/同工艺 | 标型号/版本 |\n| 拼板间距 | 0～2mm（V-cut） | 兼顾分板/干涉 |\n\n**16. 拼板为什么先问贴片机，再问板厂？**\n答：贴片机有最大板宽/夹持边限制；超宽就贴不了，板厂再便宜也没用。先定“能贴的尺寸”，再让板厂按此报价。\n\n**17. 什么时候应该放弃拼板？**\n答：小批量、大板、异形、高元件干涉多、分板应力大时，单板+工艺边更省事；拼板是为了效率，不是为了“看起来专业”；算不过账的时候，单板反而更稳；拼板是手段，不是目的，别为了拼而拼。\n\n#### 27.8.4 能力清单\n\n- [ ] 能拿板厂能力表，逐项对照设计。\n- [ ] 能画拼板图（阵列/工艺边/Mark/V-cut/邮票孔）。\n- [ ] 能算拼板利用率与单板成本。\n- [ ] 能读 DFM 报告并逐条回复。\n- [ ] 能做首件/掰板验证。\n- [ ] 能拆报价单，算总成本而非单价。\n\n- [ ] 能做 DFM 检查。\n- [ ] 能设计 V-cut/邮票孔拼板。\n- [ ] 能加工艺边/Mark。\n- [ ] 能估算成本。\n- [ ] 能出完整生产包。\n\n#### 27.8.5 复盘清单\n\n1. 最小线宽/间距/孔径/环宽是否在“常规”档？\n2. 工艺边/Mark/定位孔是否齐？会不会被轨道压到？\n3. 拼板阵列/间距/V-cut 深度/邮票孔参数是否标清？\n4. 高元件/双面贴片是否 3D 检查过干涉？\n5. 叠层/阻抗/表面处理是否与板厂确认？\n6. 测试点/治具/分板方式是否算进成本？\n7. 首件/掰板/过炉试验是否做了？\n8. 报价是否按“同规格/同交期/同测试”比较？\n9. 打样是否按“批量 DFM”画？\n10. 有没有把这次 DFM 问题写进问题库？\n\n#### 27.8.6 动手练习\n\n**练习一**：拿一块 80×60mm 板，在 400×500mm 大板上排 2×3/3×4 两种拼法，算利用率与单板面积成本。\n\n**练习二**：给这块板画拼板图，标工艺边/Mark/定位孔/V-cut，找板厂 DFM 报告对照。\n\n**练习三**：拆一张真实报价单，把板费/工程费/贴片/测试/分板分开，算“总成本/片”。\n\n**延伸**：DFM 是“和板厂一起做设计”；多问一句“这个能不能放宽”，往往比“自己抠参数”更省钱。\n\n**练习四**：找一块有 V-cut 的旧板，量剩余厚度/槽角，掰一块看断口，判断“参数是否合理”。\n\n**练习五**：把本章的 10 条 DFM 清单做成表格，给你手上的板逐条打勾，标“必须改/可接受”。\n\n#### 27.8.7 下一章\n\n下一章讲**4 层板·H3 机顶盒**：把叠层、DDR、EMC、DFM 用到一块真实项目板。","taskSignature":"b34cc20fa71cc692933278abc8830c03eead3560ee23002dba322c5e2552a51a","taskCount":11},{"id":"28","title":"第 28 章 · 4 层板项目：H3 机顶盒","short":"4 层板项目：H3 机顶盒","stage":4,"diff":4,"prev":"第 24～27 章","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 把“机顶盒”需求拆成 SoC、DDR、eMMC、Wi-Fi、以太网、HDMI、USB、电源。\n2. 设计 4 层叠层，并给 DDR/HDMI/USB 分配合适参考面。\n3. 完成 H3（Allwinner H3）类 SoC 的核心板原理图框架。\n4. 规划 DDR 拓扑、电源树、接口保护、Wi-Fi 天线净空。\n5. 做 4 层板布局分区与关键布线。\n6. 制定 Bring-Up/测试计划。\n7. 说出至少 8 个 4 层机顶盒项目常见坑。\n\nH3 机顶盒是“低成本 4 层板”的典型：SoC + DDR3 + eMMC + Wi-Fi + 以太网 + HDMI。它不追求极致，追求“能跑、能过、能便宜”。\n\n## 正文\n\n### 28.1 需求与功能块\n\n需求：4 层板，H3 类 SoC，1GB DDR3，8GB eMMC，百兆以太网，Wi-Fi/BT，HDMI 输出，2×USB，12V 输入。\n\n功能块：\n\n| 块 | 关键器件 | 接口 |\n|---|---|---|\n| SoC | H3/A53 类 | DDR/HDMI/USB/ETH |\n| 内存 | DDR3 x16 | 1GB |\n| 存储 | eMMC 5.1 | 8GB |\n| 以太网 | PHY + RJ45 | 百兆 |\n| Wi-Fi | 模块/芯片 | SDIO/USB |\n| 电源 | PMIC/DCDC | 多路 |\n| 接口 | HDMI/USB/TF | ESD |\n\n#### 28.1.1 产品定义：这台“机顶盒”到底要做什么\n\n项目定位：百元级电视盒子/信息发布终端，主控 Allwinner H3（四核 Cortex-A7、Mali-400），1GB DDR3（16bit），8GB eMMC，HDMI 1080p 输出，百兆以太网，2.4GHz Wi-Fi，2×USB2.0，红外接收，5V/2A DC 输入。目标：能跑 Linux + 视频播放 + 网络，BOM 控制在 80 元内，4 层板、单面贴片为主。\n\n**边界**：不做 4K、不做千兆、不做 PoE；这些留给后面的 RK3576/RK3588 项目。\n\n**课程**：项目章先定“做什么/不做什么”，再谈电路。\n\n#### 28.1.2 需求拆解：把“功能”变成“接口/器件/指标”\n\n| 需求 | 实现 | 关键指标 |\n|---|---|---|\n| 1080p 输出 | H3 HDMI + ESD | 阻抗 100Ω差分、HDMI 认证预测试 |\n| 网络 | H3 内置 EMAC + PHY | 百兆、变压器隔离、ESD |\n| 无线 | USB Wi-Fi 模块 | 天线净空、2.4G 干扰 |\n| 存储 | eMMC 5.0 + microSD | 启动顺序、SD 卡 ESD |\n| 人机 | 红外/按键/LED | 38kHz 载波、ESD |\n| 供电 | 5V→3.3/1.8/1.5/1.2 | 电源树、上电时序 |\n\n**用法**：每个需求都要落到“接口+器件+指标”，否则“需求”只是口号。\n\n#### 28.1.3 接口清单与连接器选型\n\nHDMI Type-A（19pin）、RJ45 带变压器（或分离变压器）、USB-A×2、microSD、3.5mm AV（可选）、DC 5.5/2.1、红外接收头。连接器选“带固定脚/带屏蔽壳”的，插拔受力不撕焊盘；HDMI/USB 要有 ESD 阵列。连接器位置决定“板边/外壳开孔”，结构件要先给尺寸。\n\n**课程**：连接器是“最容易被插坏”的器件，选型要抗造。\n\n#### 28.1.4 成本目标与 BOM 分层\n\nBOM 分三层：主控/存储/电源（占 50%～60%）、接口/连接器（20%）、阻容/小器件（20%）。H3 方案的成本敏感点是 DDR3/eMMC/PHY/变压器。降本顺序：选国产替代（验证过）、减少连接器、简化电源（LDO 换 Buck 或反之）、拼板摊薄。不要“为省 1 元换未验证物料”。\n\n**课程**：项目章要会“算账”，不只是“画图”。\n\n#### 28.1.5 认证与合规：先定“过什么”\n\nCE/FCC（辐射/传导）、HDMI 认证（可选）、RoHS、USB-IF（可选）、电源安规（EN 62368）。认证决定“接口滤波/屏蔽/ESD”的配置；例如 HDMI 要共模扼流+ESD，网口要变压器+ESD。先列“认证清单”，再定“防护清单”。\n\n**课程**：认证不是“做完再说”，是“设计输入”。\n\n#### 28.1.6 项目计划：从原理图到小批\n\n第 1～2 周：需求/框图/选型；第 3～4 周：原理图/评审；第 5～6 周：PCB/评审；第 7 周：打样/贴片；第 8～9 周：Bring-Up/调试；第 10 周：EMC 预测试/整改；第 11～12 周：小批/量产准备。每阶段有“交付物+门禁”，不要“一锅端”。\n\n**课程**：项目章要有“时间轴”，否则永远在救火。\n\n#### 28.1.7 风险清单：这个项目最可能死在哪\n\n风险一：DDR3 训练不过（概率高、影响大）——对策：预留降频/放宽时序，首版就按 1600MT/s 保守设计。风险二：HDMI 眼图不过——对策：ESD 选低电容、预留共模位置、走线同层直。风险三：Wi-Fi 距离短——对策：净空+天线方向+外壳塑料窗。风险四：EMC 整改改板——对策：原理图阶段预留滤波/屏蔽。风险五：散热不足——对策：散热过孔+散热片+高温老化。风险六：物料交期——对策：第二供应商/替代料。每条风险写“触发条件/应对/负责人”。\n\n**课程**：项目管理的本质是“风险管理”，不是“排甘特图”。\n\n#### 28.1.8 验收标准：什么算“做完了”\n\n功能：1080p 输出、网口、Wi-Fi、USB、SD、IR 全通过；性能：连续播放 24h 不死机、Wi-Fi 吞吐达标、网口丢包率达标；环境：45℃ 满载 24h、-10℃ 启动、±5% 电压拉偏；EMC：预测试留 6dB；可制造：拼板/测试治具/良率≥95%；文档：原理图/PCB/BOM/测试报告/问题库齐全。验收要“可量化”，不能“我觉得行了”。\n\n**课程**：没有验收标准的项目，永远“差一点”。\n\n#### 28.1.9 从 H3 到 RK3576/RK3588 的“能力迁移”\n\nH3 项目练的是“4 层板+DDR3+HDMI+网口+Wi-Fi”的基本功；RK3576（6 层、LPDDR4/4X、多路 MIPI、千兆）与 RK3588（8 层、LPDDR5、PCIe/SATA/多屏）是在同一套方法上“加层数/加速度/加接口”。会了 H3，后面的差别是“叠层/阻抗/等长/电源完整性”要求更高，方法不变：需求→框图→电源树→关键电路→叠层布局→Bring-Up→EMC→量产。\n\n**课程**：项目难度在升级，方法论在复用。\n\n### 28.2 系统框图与电源树\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 380\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 28-1：H3 机顶盒系统框图<\/text>\n  <rect x=\"260\" y=\"70\" width=\"180\" height=\"90\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"105\" font-size=\"14\" fill=\"currentColor\">H3 SoC<\/text>\n  <text x=\"290\" y=\"130\" font-size=\"11\" fill=\"currentColor\">DDR/HDMI/USB/ETH<\/text>\n  <rect x=\"40\" y=\"60\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"90\" font-size=\"12\" fill=\"currentColor\">DDR3 1GB<\/text>\n  <rect x=\"530\" y=\"60\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"555\" y=\"90\" font-size=\"12\" fill=\"currentColor\">eMMC 8GB<\/text>\n  <rect x=\"40\" y=\"180\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"210\" font-size=\"12\" fill=\"currentColor\">Wi-Fi/BT<\/text>\n  <rect x=\"260\" y=\"180\" width=\"180\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"285\" y=\"210\" font-size=\"12\" fill=\"currentColor\">以太网 PHY/RJ45<\/text>\n  <rect x=\"530\" y=\"180\" width=\"150\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"555\" y=\"210\" font-size=\"12\" fill=\"currentColor\">HDMI/USB<\/text>\n  <rect x=\"260\" y=\"290\" width=\"180\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"285\" y=\"320\" font-size=\"12\" fill=\"currentColor\">12V→PMIC/DCDC<\/text>\n  <line x1=\"190\" y1=\"90\" x2=\"260\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"100\" x2=\"530\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"190\" y1=\"210\" x2=\"260\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"440\" y1=\"210\" x2=\"530\" y2=\"210\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"350\" y1=\"290\" x2=\"350\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n电源树：\n\n| 轨 | 电压 | 负载 |\n|---|---|---|\n| VCC_IN | 12V | 输入 |\n| VCC_SYS | 5V | USB/外设 |\n| VDD_CPU | 1.1V | SoC 核心 |\n| VDD_DDR | 1.5V | DDR3 |\n| VCC_IO | 3.3V | IO/PHY |\n| VCC_A | 1.8V/2.5V | 模拟/HDMI |\n\n#### 28.2.1 系统框图：把“主控”当中心\n\nH3 引出：DDR3 16bit、eMMC、SD、HDMI、USB×2、EMAC、UART/IR、I2S/ADC。外围：PMIC（或分立 DC-DC+LDO）、PHY、Wi-Fi 模块、音频、红外。框图要标“电源域/时钟/复位/调试口”，不要只画“方框+箭头”。\n\n**课程**：框图是“项目的骨架”，先画框图再画原理图。\n\n#### 28.2.2 电源树：5V 输入到 1.2V 核心\n\n5V→（Buck）3.3V（IO/PHY/Wi-Fi）→（LDO/Buck）1.8V（DDR/eMMC IO）→（Buck）1.5V（DDR 终端，若需要）→（Buck）1.2V（H3 核心）。H3 核心电流约 1～2A（满载），DDR3 约 0.5A，Wi-Fi 峰值 0.5A。电源树要标“最大电流/效率/发热/上电时序”。\n\n**课程**：电源树是“电流的地图”，不是“电压列表”。\n\n#### 28.2.3 上电时序：H3 的“先后顺序”\n\nH3 要求：VCC-DRAM（1.5V）与 VCC-IO（3.3V）先稳，再 VCC-CORE（1.2V），最后释放 RESET；具体按数据手册“Power-Up Sequence”。PMIC 可用“时序控制/使能级联”；分立方案用“EN 串联/RC 延时”。时序错了会“不启动/ DDR 初始化失败”。\n\n**课程**：上电时序是“隐形的复位”，看不见但决定生死。\n\n#### 28.2.4 功耗预算：别让 5V/2A 变成“5V/1A”\n\nH3 满载 3～5W、DDR 1W、Wi-Fi 1～2W、PHY 0.5W、eMMC 0.5W、HDMI 0.5W、LDO 损耗 0.5～1W。总功耗约 6～9W，5V/2A=10W 刚好；若加 2.5 寸硬盘/风扇，要 5V/3A。预算要按“最坏同时工作”，并留 20% 余量。\n\n**课程**：电源选型看“总功耗”，不是“主控功耗”。\n\n#### 28.2.5 地与电源分区：4 层板的“两层半”\n\n4 层：L1 信号/器件、L2 GND、L3 PWR、L4 信号。地：L2 完整地，模拟/数字不另切（靠布局分区）；电源：L3 按 3.3/1.8/1.2 分岛。DDR/HDMI/USB 参考 L2；L4 走低速/电源。关键是“L2 不被切碎”，所有高速回流都靠它。\n\n**课程**：4 层板的“命”在 L2 地，别在上面开槽。\n\n#### 28.2.6 时钟与复位：H3 的最小系统\n\nH3 需要 24MHz 晶振（或内部 RC）、32.768kHz RTC 晶振（可选）、复位按键、UART0 调试口、BOOT 选择（eMMC/SD/USB）。晶振靠近芯片、负载电容按手册、下面不走线；复位 RC/按键要有 ESD。调试口留排针（3.3V TX/RX/GND），Bring-Up 第一件事就是“看串口”。\n\n**课程**：最小系统=电源+时钟+复位+启动方式+调试口。\n\n#### 28.2.7 电源树的“热”与“噪”：两条线一起看\n\n电源树不只是“电压转换”，还要看“热”和“噪”。热：Buck 的效率 85%～92%，损耗变成热；1.2V/2A 输出、90% 效率，损耗约 0.27W，靠铜皮/过孔散热。噪：Buck 的 SW 节点是“噪声源”，要远离 DDR/音频/天线；LDO 的 PSRR 在低频好、高频差，要和电容配合。电源树评审要画“电流/损耗/热点/噪声源”四张标注。\n\n**课程**：电源树是“能量地图”，也是“噪声地图”。\n\n#### 28.2.8 复位与看门狗：死机自救\n\nH3 的 RESET 由 PMIC/RC/按键产生；量产板建议加“看门狗/复位芯片”，死机自动重启。复位信号要“干净/有 RC 滤波/ESD”，走线短；按键复位要防“抖/静电”。看门狗喂狗要在“主循环”，不能放在中断里“假装活着”。\n\n**课程**：机顶盒无人值守，复位/看门狗是“远程运维”的基础。\n\n#### 28.2.9 启动介质与量产烧录\n\nH3 支持 eMMC/SD/USB 启动，量产用“eMMC 烧录/治具”或“SD 卡量产”。BOOT 电阻/按键要“可切换”，方便研发/量产；烧录口（USB OTG）要留。量产烧录要“防呆/校验/记录”，避免“漏烧/错版本”。\n\n**课程**：启动方式决定“研发怎么调、量产怎么烧”。\n\n#### 28.2.10 结构与散热：先定“盒子”再定板\n\n机顶盒是“结构先行”：外壳尺寸/开孔/天线窗/散热片位置决定 PCB 外形/连接器位置/天线方向。PCB 设计前拿“结构 3D/开孔图”，做“板框/禁布区/高度限制”。结构改了，PCB 要重画；所以“先结构、后 PCB”。\n\n**课程**：消费电子的 PCB，是“结构的一部分”。\n\n#### 28.2.11 测试点与调试接口\n\n留：UART0（TX/RX/GND）、JTAG（可选）、复位按键、BOOT 按键、电源测试点（5V/3.3/1.8/1.5/1.2）、DDR 测试点（CK/DQS）、HDMI/网口测试点。测试点要“可探/不破坏阻抗”；调试接口要“靠近板边/不被外壳挡住”。\n\n**课程**：测试点是“研发的眼睛”，量产后可去掉。\n\n#### 28.2.12 版本与变更管理\n\n原理图/PCB/BOM/结构要有“版本号/日期/变更记录”；ECO 要“改一处、记一处、验证一处”。量产变更要“重新认证/抽测”。版本混乱是“项目延期/客诉”的常见原因。\n\n**课程**：项目章要讲“版本”，否则越做越乱。\n\n#### 28.2.13 电源树图\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"28\" font-size=\"16\" fill=\"currentColor\">图 28-5：H3 机顶盒电源树<\/text>\n  <rect x=\"60\" y=\"120\" width=\"110\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"150\" font-size=\"12\" fill=\"currentColor\">DC 5V/2A<\/text>\n  <rect x=\"240\" y=\"60\" width=\"130\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"262\" y=\"90\" font-size=\"11\" fill=\"currentColor\">Buck 3.3V/3A<\/text>\n  <rect x=\"240\" y=\"140\" width=\"130\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"262\" y=\"170\" font-size=\"11\" fill=\"currentColor\">Buck 1.2V/3A<\/text>\n  <rect x=\"240\" y=\"220\" width=\"130\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"262\" y=\"250\" font-size=\"11\" fill=\"currentColor\">Buck 1.5V/1A<\/text>\n  <rect x=\"450\" y=\"60\" width=\"120\" height=\"46\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <text x=\"466\" y=\"87\" font-size=\"10\" fill=\"currentColor\">LDO 1.8V<\/text>\n  <text x=\"450\" y=\"128\" font-size=\"10\" fill=\"currentColor\">IO/PHY/Wi-Fi<\/text>\n  <text x=\"450\" y=\"196\" font-size=\"10\" fill=\"currentColor\">H3 核心<\/text>\n  <text x=\"450\" y=\"284\" font-size=\"10\" fill=\"currentColor\">DDR3 VDDQ<\/text>\n  <line x1=\"170\" y1=\"145\" x2=\"240\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"170\" y1=\"145\" x2=\"240\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"170\" y1=\"145\" x2=\"240\" y2=\"245\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"370\" y1=\"85\" x2=\"450\" y2=\"83\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"370\" y1=\"165\" x2=\"450\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <line x1=\"370\" y1=\"245\" x2=\"450\" y2=\"278\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"60\" y=\"205\" font-size=\"10\" fill=\"currentColor\">上电顺序：3.3/1.5 → 1.2 → RESET<\/text>\n  <text x=\"60\" y=\"290\" font-size=\"10\" fill=\"currentColor\">总功耗 6～9W，5V/2A 余量约 10%～20%<\/text>\n<\/svg>\n```\n\n**读图**：5V 分三路 Buck + 一路 LDO，1.8V 由 3.3V 降压；DDR 1.5V 单独一路，避免被核心大电流污染。图 28-5 与 28.2.2 的文字一一对应。\n\n### 28.3 关键电路\n\n#### 28.3.1 DDR3 拓扑\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 300\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 28-2：H3 与 DDR3 点对点（x16）<\/text>\n  <rect x=\"70\" y=\"80\" width=\"160\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"110\" y=\"115\" font-size=\"13\" fill=\"currentColor\">H3<\/text>\n  <text x=\"95\" y=\"145\" font-size=\"11\" fill=\"currentColor\">DDR 控制器<\/text>\n  <rect x=\"460\" y=\"80\" width=\"160\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"500\" y=\"115\" font-size=\"13\" fill=\"currentColor\">DDR3 x16<\/text>\n  <text x=\"485\" y=\"145\" font-size=\"11\" fill=\"currentColor\">1GB<\/text>\n  <line x1=\"230\" y1=\"115\" x2=\"460\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"145\" x2=\"460\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"175\" x2=\"460\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"280\" y=\"105\" font-size=\"10\" fill=\"currentColor\">DQ[15:0]<\/text>\n  <text x=\"280\" y=\"140\" font-size=\"10\" fill=\"currentColor\">DQS/DM<\/text>\n  <text x=\"280\" y=\"170\" font-size=\"10\" fill=\"currentColor\">CA/CLK<\/text>\n  <text x=\"70\" y=\"250\" font-size=\"13\" fill=\"currentColor\">DQ 组内等长；CA/CLK 短；VREF/VTT 按手册。<\/text>\n<\/svg>\n```\n\n#### 28.3.2 HDMI/USB 接口\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 28-3：HDMI 与 USB 接口保护<\/text>\n  <rect x=\"50\" y=\"70\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"70\" y=\"105\" font-size=\"12\" fill=\"currentColor\">HDMI 座<\/text>\n  <rect x=\"220\" y=\"70\" width=\"100\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"235\" y=\"105\" font-size=\"11\" fill=\"currentColor\">ESD<\/text>\n  <rect x=\"370\" y=\"70\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"390\" y=\"105\" font-size=\"12\" fill=\"currentColor\">SoC<\/text>\n  <line x1=\"170\" y1=\"110\" x2=\"220\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"320\" y1=\"110\" x2=\"370\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"50\" y=\"200\" width=\"120\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"70\" y=\"235\" font-size=\"12\" fill=\"currentColor\">USB 座<\/text>\n  <rect x=\"220\" y=\"200\" width=\"100\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"235\" y=\"235\" font-size=\"11\" fill=\"currentColor\">ESD<\/text>\n  <line x1=\"170\" y1=\"235\" x2=\"220\" y2=\"235\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"320\" y1=\"235\" x2=\"370\" y2=\"235\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"390\" y=\"235\" font-size=\"12\" fill=\"currentColor\">SoC<\/text>\n  <text x=\"50\" y=\"300\" font-size=\"13\" fill=\"currentColor\">HDMI 4 对差分 100Ω；USB 90Ω；ESD 靠接口。<\/text>\n<\/svg>\n```\n\n#### 28.3.3 Wi-Fi 天线净空\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 280\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 28-4：Wi-Fi 天线净空<\/text>\n  <rect x=\"60\" y=\"70\" width=\"360\" height=\"160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <rect x=\"420\" y=\"70\" width=\"220\" height=\"160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/>\n  <text x=\"450\" y=\"105\" font-size=\"12\" fill=\"currentColor\">天线净空区<\/text>\n  <text x=\"450\" y=\"130\" font-size=\"11\" fill=\"currentColor\">无铜/无器件/无走线<\/text>\n  <line x1=\"380\" y1=\"120\" x2=\"420\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"385\" y=\"110\" font-size=\"10\" fill=\"currentColor\">50Ω<\/text>\n  <text x=\"60\" y=\"260\" font-size=\"13\" fill=\"currentColor\">天线区域所有层挖空，馈线 50Ω，靠近板边。<\/text>\n<\/svg>\n```\n\n#### 28.3.4 DDR3 位宽与拓扑：16bit 单颗粒\n\nH3 支持 DDR3 16bit；用一颗 16bit DDR3（如 1GB）点对点，走线最短。地址/命令/时钟一组、DQ 分两组（低 8/高 8）+DQS 差分。速率按 800MHz（1600MT/s）设计，等长：组内 ±10mil、地址/命令/时钟相对 CK ±20mil。终端：DDR3 用 ODT（颗粒内）+ 控制器驱动；VREF 分压 1/2 VDDQ，1% 电阻+0.1μF。\n\n**课程**：16bit 单颗粒是 4 层板做 DDR3 的“最省事”方案。\n\n#### 28.3.5 DDR3 电源与去耦\n\nVDDQ=1.5V（DDR3）、VTT=0.75V（若用终端）、VREF=0.75V。去耦：每颗颗粒 0.1μF×4～6 + 10μF×1，靠近引脚；VREF 单独 0.1μF。L3 电源岛给 DDR 单独一块，避免被 SoC 大电流噪声污染；DDR 电源走线宽、过孔多。\n\n**课程**：DDR 的“稳定”一半靠电源，一半靠等长。\n\n#### 28.3.6 HDMI：100Ω 差分 + ESD + 共模\n\nHDMI 4 对 TMDS（100Ω 差分）+ 时钟对 + DDC（I2C）+ HPD + 5V。走线：差分等长对内 ±5mil、对间 ±10mil、参考 L2 完整；连接器旁加 ESD 阵列（低电容）+ 共模扼流（可选）。HDMI 5V 要限流/防倒灌；HPD 要电平转换/ESD。ESD 器件结电容 <0.5pF，否则眼图闭合。\n\n**课程**：HDMI 是“高速+热插拔+ESD”三合一，防护要全套。\n\n#### 28.3.7 百兆以太网：PHY、变压器、端接\n\nH3 内置 EMAC，外接百兆 PHY（如 IP101/YT8512）+ 网络变压器 + RJ45。TX/RX 差分 100Ω、等长；变压器中心抽头按 PHY 要求接 3.3V/地；RJ45 的 LED/屏蔽壳要处理。变压器到 RJ45 之间加 ESD/共模；网口是“雷击/浪涌”入口，防护要按 IEC 61000-4-5。\n\n**课程**：网口是“最容易招雷”的接口，变压器+ESD 不能省。\n\n#### 28.3.8 USB2.0：差分、限流、ESD\n\nUSB2.0 差分 90Ω、等长 ±5mil；VBUS 加限流开关（500mA/1A）+ ESD；D+/D- 加低电容 ESD 阵列。USB 座要带屏蔽壳/固定脚；ID 脚（OTG）按需。走线不要跨分割，长度尽量短。\n\n**课程**：USB 的“热插拔”决定它必须有 ESD+限流。\n\n#### 28.3.9 Wi-Fi 模块与天线净空\n\nUSB Wi-Fi 模块（如 RTL8188）放在板边，天线区域“三面净空”（无铜/无器件/无走线），净空宽度≥5mm；天线馈线 50Ω、短、直；模块电源加 LC 滤波，避免 2.4G 噪声串到电源。金属外壳要留“天线窗”（塑料）。\n\n**课程**：Wi-Fi 的“性能”一半在天线净空，不在芯片。\n\n#### 28.3.10 eMMC 与 microSD\n\neMMC：CLK/CMD/DATA 走线等长（±10mil）、CLK 包地、电源 3.3V/1.8V 双电压、去耦靠近；DS 脚（数据选通）按需。microSD：CLK/CMD/DATA 等长、ESD、卡座固定脚；SD 卡是“用户可插拔”，ESD/限流必须有。启动顺序：eMMC 优先/SD 次之，按 BOOT 电阻配置。\n\n**课程**：eMMC 是“焊死的”，SD 是“插拔的”；防护等级不同。\n\n#### 28.3.11 红外、按键、LED\n\n红外接收头（38kHz）输出接 GPIO/IR，电源加 RC 滤波、输出加 ESD；按键加 RC 消抖+ESD；LED 串限流电阻（按亮度/电流算）。这些“低速小器件”最容易被忽略 ESD，却是用户“天天摸”的地方。\n\n**课程**：人机接口的 ESD，是“用户手指”的第一道防线。\n\n#### 28.3.12 音频与调试口\n\n3.5mm AV/HDMI 音频：H3 内置 ADC/DAC，模拟音频要“远离 DDR/HDMI/电源”，加 RC 低通/隔直；调试口 UART0（3.3V）留 4pin 排针，串口线要“交叉 TX/RX”。调试口是 Bring-Up 的“眼睛”，没有它只能“猜”。\n\n**课程**：模拟音频要“躲开”高速，调试口要“先留”。\n\n#### 28.3.13 原理图评审：这台盒子最容易漏的十处\n\n电源：DC 口保险/TVS、Buck 使能上拉/下拉、DDR VREF 分压、HDMI 5V 限流、Wi-Fi 电源滤波；接口：HDMI/USB/网口 ESD、SD 卡 ESD、红外/按键 ESD、连接器屏蔽壳接地；时钟：24MHz 负载电容、RTC 晶振 32.768kHz；复位：RC/按键/看门狗；启动：BOOT 电阻；调试：UART0 排针。每一项都要在原理图上“看得见”，不能“心里想着”。评审用“打印+红笔”逐页过，比在屏幕上翻更可靠；每个“未接/待定”都要有责任人和日期。\n\n**课程**：原理图评审是“最便宜的改板机会”。\n\n#### 28.3.14 从原理图到 PCB 的“接口清单”\n\n原理图定稿后，导出：网表、BOM、叠层、阻抗目标、电源树、时钟/复位、接口防护、测试点、结构尺寸。PCB 设计前开“交接会”，确认“哪些是硬约束（DDR/HDMI 等长/叠层）、哪些可调（丝印/测试点位置）”。交接不清，PCB 一定返工。项目章要有“交接清单”，像接力赛的“交棒”。\n\n**课程**：PCB 不是“照着原理图连线”，是“实现电气+物理约束”。\n\n### 28.4 4 层叠层与布局\n\n| 层 | 用途 |\n|---|---|\n| L1 | SoC/DDR/接口器件 + 高速信号 |\n| L2 | 完整地 |\n| L3 | 电源平面（多路分割） |\n| L4 | 低速/电源/地 |\n\n布局顺序：\n\n1. 接口靠边（HDMI/USB/RJ45/TF/DC）。\n2. SoC 放中心，DDR 靠近 DDR 控制器。\n3. eMMC 靠近 SoC。\n4. Wi-Fi 模块靠板边，天线净空。\n5. 电源按电源树分区。\n6. 晶振/复位/SWD 靠近 SoC。\n\n#### 28.4.1 叠层：4 层 1.6mm 的具体参数\n\nL1 信号 1oz；L1-L2 介质 0.2mm；L2 GND 1oz；L2-L3 芯板 0.5mm；L3 PWR 1oz；L3-L4 介质 0.2mm；L4 信号 1oz。总厚约 1.6mm。阻抗：L1 微带 50Ω 线宽约 0.33mm；L4 微带 50Ω 同；HDMI/USB 差分按 90/100Ω 算线宽/间距。叠层给板厂确认“PP 组合/阻抗”。\n\n**课程**：4 层板的参数要写死，别让板厂“自由发挥”。\n\n#### 28.4.2 布局分区：从“接口”往内排\n\n板边：DC、HDMI、RJ45、USB、SD、AV、IR；主控放中间偏上；DDR 紧贴主控（同侧/近端）；eMMC 靠近主控；Wi-Fi 模块放板边/天线朝外；电源（Buck）放 DC 附近，远离 DDR/音频；音频放远离高速。分区原则：高速集中、模拟隔离、接口靠边、电源靠入口。\n\n**课程**：布局是“按信号流向排队”，不是“见缝插针”。\n\n#### 28.4.3 DDR3 布局：紧、短、同层\n\nDDR 放主控同面/近端，走线长度尽量 <50mm；VREF/去耦靠近颗粒；DDR 电源岛在 L3 单独一块；DQS/DQ 同层、不跨分割。4 层板 L1 走 DDR、L2 地完整、L4 走低速，避免 DDR 与 HDMI/USB 混层。\n\n**课程**：DDR 布局的第一原则是“离主控近”。\n\n#### 28.4.4 HDMI/USB 布局：连接器→ESD→主控\n\nHDMI 座放板边，ESD/共模紧靠座；差分走线从座到主控“一条直线”，不绕、不换层；USB 座同理。连接器金属壳下方“挖空/隔离”，避免外壳地噪声进信号地。高速对之间留 3W 间距，避免串扰。\n\n**课程**：高速接口布局是“直线最短”，不是“能连上就行”。\n\n#### 28.4.5 电源布局：Buck 的“输入-输出-反馈”\n\nBuck 输入电容紧靠 Vin/GND，SW 节点小、短；电感/输出电容靠近；反馈走线短、远离 SW；LDO 输入/输出电容按手册。电源与 DDR/音频保持距离，避免开关噪声耦合。散热：铜皮/过孔/开窗按电流算。\n\n**课程**：电源布局的“三件套”是输入电容、SW 节点、反馈。\n\n#### 28.4.6 Wi-Fi/天线布局：净空与方向\n\n模块放板边，天线朝“外壳塑料窗”；净空区三面不铺铜、不走线、不放高元件；馈线 50Ω、短；模块下方地平面完整（但天线正下方挖空）。Wi-Fi 与 DDR/HDMI 保持距离，避免 2.4G 被噪声淹没。\n\n**课程**：天线净空是“物理尺寸”，不是“软件设置”。\n\n#### 28.4.7 散热与结构：H3 的“热”\n\nH3 满载 3～5W，靠 PCB 铜皮/过孔散热；主控下方铺铜+散热过孔（阵列 0.3mm/1mm 间距），背面可加散热片（结构件）。外壳开孔/导热垫按热仿真/实测；不要“只靠空气”。\n\n**课程**：机顶盒是“密闭盒子”，散热要按“最坏环境”设计。\n\n#### 28.4.8 拼板与工艺边：小批量的做法\n\n板尺寸约 120×80mm，拼 2×2 或 2×3；四边工艺边 8mm，Mark 点对角，V-cut 分板。连接器靠板边，拼板时间距要够“插拔/贴片”。首件检查“连接器/HDMI 座”是否被 V-cut 影响。\n\n**课程**：拼板要避开“连接器受力区”。\n\n#### 28.4.9 DDR 与 SoC 的“同面/近端”取舍\n\nDDR 放主控同面（L1），走线在 L1 短距离直连，L2 完整参考；若放背面（L4），走线要换层，过孔 stub 增加、回流路径变长。4 层板优先“同面近端”，代价是“主控周边拥挤”，需要提前规划扇出/电源。\n\n**课程**：DDR 的位置不是“哪有空放哪”，是“离主控几毫米”。\n\n#### 28.4.10 去耦电容的“位置学”\n\n0.1μF 要“贴引脚”（<2mm），10μF 可“近但不必贴”，大容量（22/47μF）放“电源入口”。DDR 的 VREF 电容要“靠近 VREF 引脚”，不能被电源噪声污染。去耦不是“数量多”，是“回路短”：电容-过孔-地平面-芯片引脚，四段都要短。\n\n**课程**：去耦的有效性由“回路电感”决定，不是容值。\n\n#### 28.4.11 过孔与回流：换层要“带地”\n\nHDMI/USB/DDR 换层时，信号过孔旁要放“地过孔”（0.2～0.3mm，1～2 个），给回流“搭桥”；否则回流被迫绕远，等效电感上升、辐射增加。电源过孔要“多/大”，按电流算（1A 约 2～3 个 0.3mm 过孔）。\n\n**课程**：过孔不是“连接”，是“回流的一部分”。\n\n#### 28.4.12 丝印与装配：给产线“防呆”\n\n丝印标：板号/版本、连接器方向（1 脚）、LED 含义、按键功能、测试点名称、ESD 敏感标识。连接器旁标“HDMI/USB1/USB2”，避免插错；eMMC/DDR 标“1 脚点”。丝印不压焊盘/过孔，字高≥0.8mm。\n\n**课程**：丝印是“装配/维修的说明书”。\n\n#### 28.4.13 板框与结构：开孔/避让/高度\n\n板框按结构 3D；连接器开孔要“留 0.2～0.5mm 余量”；螺丝孔要“非金属化/接地”按结构；元件高度限制区（如外壳卡扣/散热片）要标“禁高”。板边留 3mm 安全区，避免 V-cut/外壳干涉。\n\n**课程**：板框不是“画个矩形”，是“结构和电气的交界”。\n\n#### 28.4.14 检查清单：出板前的“最后一小时”\n\nDRC/DFM 全过；DDR/HDMI 等长报告；电源载流/热过孔；丝印/极性；拼板/Mark/工艺边；BOM/位号；Gerber/钻孔/阻抗说明。每项“有人签字”，不要“大家以为别人看过”。\n\n**课程**：出板前的检查，是“最便宜的返工”。\n\n### 28.5 选型与降额\n\n| 器件 | 选择 | 降额 |\n|---|---|---|\n| SoC | H3 类 | 散热 |\n| DDR3 | 1GB x16 | 速率按 SoC |\n| eMMC | 8GB | 寿命 |\n| PHY | 百兆 | ESD |\n| Wi-Fi | 模块 | 天线净空 |\n| PMIC | 多路 | 电流×1.3 |\n\n#### 28.5.1 主控/存储选型：先看“能不能买到”\n\nH3 是成熟芯片，注意“批次/封装/温度”；DDR3 选“16bit/1GB/800MHz”，优先“参考设计用过”的颗粒；eMMC 选 5.0/8GB，注意“3.3V/1.8V 双电压”；PHY 选“H3 参考设计用过”的（如 IP101）。选型先看“供货/价格/参考设计”，再看“参数”。\n\n**课程**：项目选型的第一关是“买得到、跑得起来”。\n\n#### 28.5.2 电源器件选型：Buck/LDO/PMIC\n\n3.3V 用 Buck（效率高、发热小）；1.8V 用 LDO（噪声低）或 Buck（效率高）；1.2V 核心用 Buck（大电流）；DDR 1.5V 用 Buck/LDO。PMIC 简化时序/监控，但贵/难换。按“电流/效率/噪声/成本/时序”选；关键是把“上电时序”做对。\n\n**课程**：电源选型不是“电压对”，是“时序/噪声/效率”都对。\n\n#### 28.5.3 连接器/防护选型：抗造优先\n\nHDMI/USB/RJ45/SD 选“带屏蔽/固定脚/高插拔寿命”的；ESD 选“低电容/低钳位”；共模扼流选“HDMI/USB 专用”。连接器是“用户暴力使用”的第一环，便宜 1 元可能导致“整机返修”。\n\n**课程**：连接器/防护省的钱，售后会加倍还。\n\n#### 28.5.4 降额：电流/电压/温度\n\nBuck 按“最大电流 70%”选；LDO 按“压差/功耗”算结温；DDR/HDMI 按“速率降一档”留余量；连接器按“额定电流 50%”。机顶盒密闭/高温环境，降额要更狠；否则“夏天死机”。\n\n**课程**：降额是“给夏天/批次/灰尘留余量”。\n\n#### 28.5.5 物料替代的验证方法\n\n替代料要过“三关”：参数（电压/电流/时序/封装）、系统（能不能跑/温升/EMC）、批次（至少 3 批/50 片）。不要“ pin-to-pin 就换”。DDR/eMMC 的替代尤其敏感：时序参数、ODT、驱动强度都不同，必须重新训练/压测。替代料导入要“小批试产+老化”，并记录“批次/日期/结论”。\n\n#### 28.5.6 成本与“隐形成本”\n\nBOM 成本之外，还有“测试时间/返修率/认证/库存/停产风险”。便宜 1 元的连接器，若插拔寿命差、返修率 2%，售后成本远超节省。评估要算“全生命周期成本”，不是“采购单价”。小批量阶段，工程费/NRE 摊到每片很贵；拼板/合并订单能摊薄。\n\n#### 28.5.7 供货与生命周期\n\nH3/DDR3 是成熟料，注意“停产/涨价/交期”。选型时查“生命周期/替代型号/库存”。量产板要留“第二供应商”，关键料（主控/存储/PHY）要有“替代方案/改板预案”。不要“设计锁死在一颗料上”。\n\n#### 28.5.8 降额的实际算法\n\n以 1.2V/2A Buck 为例：选 3A 器件（降额 67%）；损耗 P=(1-η)·Pout，η=0.9、Pout=2.4W → 0.27W；θJA=60℃/W → 温升 16℃，45℃环境结温 61℃，可接受。LDO 以 3.3→1.8V/0.3A 为例：P=(3.3-1.8)×0.3=0.45W，SOT-23 θJA≈200℃/W → 温升 90℃，不可接受，必须换封装/加铜皮/改 Buck。降额要“算结温”，不是“看额定”。\n\n### 28.6 测量与仿真\n\n#### 28.6.1 Bring-Up\n\n1. 电源逐路测。\n2. SoC 复位/时钟。\n3. DDR 训练/内存测试。\n4. eMMC 识别/读写。\n5. HDMI 输出。\n6. USB/以太网/Wi-Fi。\n7. 老化/温度。\n\n#### 28.6.2 CircuitJS\n\n```circuitjs\npower-buck\n```\n\n观察多路电源的纹波/负载瞬态。\n\n#### 28.6.3 动手任务\n\n- 画 H3 机顶盒框图/电源树。\n- 给 DDR3 画点对点连接。\n- 做 4 层布局分区。\n- 列 Bring-Up 检查表。\n\n#### 28.6.4 上电顺序验证：先量“谁先谁后”\n\n用示波器（多通道）量 3.3V/1.8V/1.5V/1.2V/RESET 的上电波形，确认“顺序/上升时间/复位释放”。顺序错：查 EN 级联/PMIC 配置；复位不释放：查 RC/按键/看门狗。上电顺序是 Bring-Up 的“第一关”。\n\n**课程**：上电顺序不对，后面全是“玄学”。\n\n#### 28.6.5 串口与启动：看“第一行日志”\n\nUART0 接 3.3V USB-TTL，波特率 115200；上电看“Boot/DRAM 初始化/内核”。无输出：查 TX/RX 交叉、GND、波特率、BOOT 模式；卡在 DRAM：查 DDR 电源/等长/颗粒；卡在 eMMC：查 eMMC 电源/CLK/CMD。\n\n**课程**：串口日志是“Bring-Up 的 CT 片”。\n\n#### 28.6.6 DDR 训练与压力测试\n\nH3 的 DDR 初始化会做“training”；若失败，先降频/放宽时序，再查“电源/等长/参考面”。压力测试：memtester/连续读写/高温；观察误码/重启。DDR 是“最容易翻车”的部分，要留测试时间。\n\n**课程**：DDR 不通，先降速；通了再提速。\n\n#### 28.6.7 HDMI/网络/USB 功能验证\n\nHDMI：接显示器看“分辨率/色彩/热插拔”；网络：ping/iperf/拔插网线；USB：U 盘/键鼠/热插拔；Wi-Fi：扫描/吞吐/距离。每项都要“最坏条件”（高温/低压/满负载）。功能验证要记录“版本/现象/结论”。\n\n**课程**：接口验证要“插拔/热插/最坏条件”，不能只看“亮不亮”。\n\n#### 28.6.8 EMC 预测试与整改\n\n近场扫 HDMI/DC-DC/网口；传导看 5V 输入；ESD 打 HDMI/USB/网口/按键。常见问题：DC-DC 30～100MHz 包络、HDMI 时钟谐波、网口共模。整改：输入滤波/共模/展频/屏蔽/地。预测试留 6dB 余量。\n\n**课程**：机顶盒 EMC 的“大头”是电源和接口。\n\n#### 28.6.9 高低温/老化：小批前必做\n\n高温 45～55℃ 连续跑 24～72h，观察死机/花屏/重启；低温 -10～0℃ 启动；电压拉偏 ±5%。老化发现“热相关问题”（LDO 过热/DDR 时序/焊接）。小批前不做，量产会“集中爆发”。\n\n**课程**：老化是“把未来的问题提前引爆”。\n\n#### 28.6.10 产线测试：治具与测试项\n\nFCT：电源电压/电流、串口启动、HDMI 输出、网口 ping、USB、Wi-Fi、按键/IR、LED。治具要“快速插拔/防呆”；测试项要“能定位到功能块”。测试时间控制在 2～3 分钟/台。\n\n**课程**：产线测试不是“研发复测”，要“快/准/防呆”。\n\n#### 28.7.1 DDR 走线跨分割\n\n4 层板 L2 被电源岛切开，DDR 走线跨过去，训练失败。修法：L2 保持完整，电源岛放 L3；必须跨时加桥接电容/改层。\n\n**课程**：DDR 只认“连续的地”。\n\n#### 28.7.2 HDMI 差分换层/绕线\n\n换层没伴随地孔、对内不等长，眼图差。修法：同层直走、换层加地孔、对内 ±5mil。\n\n**课程**：HDMI 的“直”比“短”更重要。\n\n#### 28.7.3 Wi-Fi 天线净空被铜填满\n\n为了“好看”铺铜到天线区，Wi-Fi 距离骤降。修法：净空区三面禁铜/禁线/禁器件，天线朝外壳塑料窗。\n\n**课程**：天线净空是“不能碰的红线”。\n\n#### 28.7.4 电源上电时序错\n\n1.2V 先于 1.5V，DDR 初始化失败。修法：按手册时序，EN 级联/PMIC 配置，示波器验证。\n\n**课程**：时序是“隐形的原理图”。\n\n#### 28.7.5 eMMC/SD 走线不等长\n\nCLK/CMD/DATA 差太多，识别不到/读写错。修法：等长 ±10mil、CLK 包地、ESD。\n\n**课程**：存储走线要“像 DDR 一样认真”。\n\n#### 28.7.6 5V 输入保护不足\n\nDC 口无 TVS/保险，插错电源/浪涌烧板。修法：保险+TVS+共模，按 Surge 等级选。\n\n**课程**：机顶盒的“第一道门”是 DC 口。\n\n#### 28.7.7 散热只靠“铜皮”\n\n密闭外壳+满载，H3 降频/死机。修法：散热过孔阵列+背面散热片/导热垫，做高温老化。\n\n**课程**：机顶盒是“烤箱”，热设计要当结构件做。\n\n#### 28.7.8 只测“功能”，不测“最坏”\n\n常温/轻载都过，高温/满负载死机。修法：高温/低压/满负载/长时间老化。\n\n**课程**：项目验收要“最坏条件”，不是“演示条件”。\n\n#### 28.7.9 连接器下方地被打碎\n\nHDMI/USB 座下方挖空过度，回流断/ESD 差。修法：保留完整地，挖空只针对“外壳地”，加缝合孔。\n\n**课程**：连接器的地，要“完整+搭接”。\n\n#### 28.7.10 认证前才发现“没留滤波”\n\nHDMI/网口没留共模/ESD 位置，整改要改板。修法：原理图阶段按“认证清单”预留。\n\n**课程**：认证是“设计输入”，不是“事后补丁”。\n\n#### 28.6.11 DDR3 的一次“训练失败”实录\n\n首版 16bit DDR3，串口卡在“DRAM init”。先降频到 400MHz 仍失败，说明不是余量问题。示波器量 VDDQ 纹波 120mV（偏大），VREF 只有 0.68V（分压电阻被 0.1μF 漏电影响）；查布线：DQS 与 DQ 有 3 根差 40mil，且 L2 在 DDR 区域被一条 3.3V 电源岛切开 2mm。改版：VREF 加缓冲/换 1% 电阻、L2 恢复完整、等长重排；一次训练通过。结论：**DDR 失败先看电源与参考面，再看等长**。\n\n**课程**：训练失败不是“玄学”，是三个物理量：电压、回流、时序。\n\n#### 28.6.12 HDMI 眼图与“共模扼流”的取舍\n\n1080p60 输出，示波器（带 HDMI 夹具）看眼图：上升沿 700ps、眼高偏小。加共模扼流后眼图更差——选错了型号（差模阻抗高）。换“低差模损耗/高共模阻抗”的 HDMI 专用扼流，眼图恢复并留 15% 余量。ESD 从 0.8pF 换 0.3pF 后，上升沿改善 80ps。结论：**HDMI 的器件要按“差分损耗/结电容”选，不是“能焊上就行”**。\n\n**课程**：高速链路的每个器件，都要看“它对眼图做了什么”。\n\n#### 28.6.13 整机功耗实测：5V/2A 到底够不够\n\n空载 5V/0.35A（1.75W）；1080p 播放 0.9A（4.5W）；Wi-Fi 满速+USB 供电 1.35A（6.75W）；峰值（开机瞬间）1.8A。5V/2A 有余量但“夏天+老化”后电容 ESR 上升，建议 5V/2.5A 适配器。实测还发现：HDMI 5V 输出给电视的电流未限流，热插拔时倒灌；加限流开关后峰值下降。结论：**功耗要测“峰值+最坏”，不是“标称”**。\n\n**课程**：电源选型看“峰值/温升/老化”，不是“平均”。\n\n#### 28.6.14 一次完整的 Bring-Up 时间线\n\n第一天：目检/短路/电源阻抗，5V 限流 0.3A 上电，量 3.3/1.8/1.5/1.2 与纹波，确认时序；接串口看 Boot。第二天：DDR 训练/降频验证，eMMC 识别/烧录，HDMI 点亮。第三天：网口 ping/iperf、USB、Wi-Fi 扫描。第四天：满负载/高温 8h，ESD 抽打，记录问题。每天结束写“今天验证了什么/没验证什么/明天第一步”。Bring-Up 最怕“东摸一下西摸一下”，要“按电源→时钟→复位→启动→接口→压力”的顺序推进，每步有“判据”。串口日志要存盘、编号，和硬件版本对应；改一个电阻也要记录，否则“昨天好好的，今天不行了”无法复现。时间盒：每个功能块给它 2～4 小时，超时就“先绕过、记录、继续”，不要在一个点上耗到失去全局。项目章真正考的是“推进节奏”，不是“单点技术”。\n\n#### 28.6.15 问题定位：从“现象”到“物理量”\n\n“不开机”可以拆成：无 5V/无 3.3V/无 1.2V/无复位/无时钟/无启动介质/固件不匹配。每一层用一个“可测量”判据：电压、波形、日志、电流。不要“换一个芯片试试”，那是赌博。定位到层之后，再问“为什么这一层不对”：设计（原理图/PCB）、物料（焊接/批次）、环境（温度/供电）、固件（配置/驱动）。记录“假设→验证→结论”，避免“凭感觉”。项目里 80% 的时间在定位，20% 在修；定位方法比焊接速度重要。学会用“二分法”：拔掉负载/断开电源岛/换启动介质，把范围砍半。\n\n#### 28.6.16 修好之后：把“个案”变成“规则”\n\n每次调试完，写一条“规则”：例如“DDR 区域 L2 不得开槽”“HDMI ESD 结电容 <0.5pF”“5V 入口必须有 TVS+保险”。规则进“设计检查表”，下一版评审逐条打勾。没有规则化，同一个坑会在 29/30 章的项目里再踩一次。项目章的价值不只是“做出这块板”，而是“提炼出能复用的方法与清单”。把这次的问题按“设计/物料/工艺/测试”分类，统计哪类最多，下一版优先改哪类。这种“复盘→规则→检查表”的闭环，才是硬件工程师真正的成长路径。\n\n#### 28.6.17 第二个仿真：LC 滤波把 Buck 纹波压下去\n\n机顶盒的 1.2V 核心电源由 Buck 产生，开关频率 500kHz，输出纹波约 30mV。DDR/HDMI 对电源噪声敏感，可在 Buck 输出后加一级 LC（1μH+10μF）做“二次滤波”。截止频率 f=1/(2π√(LC))=1/(2π√(1e-6×10e-6))≈50kHz，对 500kHz 衰减约 20dB（一个极点 -20dB/dec，约 1 个十倍频），纹波从 30mV 降到约 3mV。代价是“负载瞬态变慢/电感压降”，要在“纹波”和“瞬态”之间取平衡。\n\n```circuitjs\nrc-lowpass-159\n```\n\n**怎么用这个仿真**：把 R 换成电感（或直接看 RC 低通的频响），观察“截止频率之后每十倍频衰减 20dB”；再把负载阶跃加进去，看“输出跌落/恢复时间”。结论：**滤波越狠，瞬态越慢；电源设计是“纹波 vs 瞬态”的折中**。图 28-5 的电源树里，DDR 单独一路就是为了“少一层滤波、少一点瞬态损失”。\n\n### 28.7 常见坑\n\n1. **DDR 拓扑/等长错**：训练失败。\n2. **HDMI 差分跨分割**：无显示。\n3. **Wi-Fi 天线净空不足**：信号差。\n4. **电源时序错**：SoC 不启动。\n5. **eMMC 走线太长**：识别不稳。\n6. **接口 ESD 缺失**：插拔损坏。\n7. **散热不足**：降频/死机。\n8. **4 层叠层参考不对**：阻抗/EMI 差。\n9. **TF 卡座干涉**：装不进外壳。\n\n#### 28.7.11 只做“一块板”，不做“可复制流程”\n\n首版靠“飞线/换料/熬夜”点亮，却没有记录“怎么点的”。第二版换人/换厂，同样的问题重来。项目章要求：每个问题都要“现象/定位/根因/对策/验证”五段记录，形成“问题库”。下一版评审先翻问题库，能省一半时间。硬件工程师的竞争力，不是“会焊”，是“有一本能复用的错题本”。\n\n**课程**：不会复盘的项目，等于没做过。\n\n#### 28.7.12 忽略“产线可制造性”\n\n设计时只考虑“手焊能修”，没考虑“贴片/测试/组装”。例如 0402 放在连接器阴影里、测试点被外壳挡住、拼板 V-cut 切到座子。修法：布局阶段就拉产线/贴片厂评审，用“3D 装配图”检查。项目不是“画完就完”，要“能造出来”。\n\n**课程**：可制造性，是项目章的“隐形验收项”。\n\n#### 28.7.13 把“参考设计”当“免死金牌”\n\n参考设计是“能跑”的起点，不是“能量产”的答案。它可能用 6 层板、不同叠层、不同物料；照抄到 4 层板，DDR 余量/EMC/散热都会变。正确用法：抄“拓扑/参数/时序”，按自己的层数/结构/成本重算。项目章要能“读懂参考设计为什么这么设计”，而不是“复制粘贴”。\n\n**课程**：参考设计是“路标”，不是“终点”。\n\n#### 28.7.14 文档缺失：三个月后自己都看不懂\n\n原理图没标“版本/改了什么”、PCB 没标“叠层/阻抗”、BOM 没标“替代料”、调试没写“怎么试的”。三个月后返修/改版，只能“重新摸一遍”。修法：设计文件+调试记录+问题库“三件套”，每个版本一个文件夹，命名“日期_版本_说明”。\n\n**课程**：文档不是“给领导看的”，是“给未来的自己看的”。\n\n#### 28.6.18 测试记录怎么写：一页纸模板\n\n日期/板号/版本、供电（电压/限流）、环境（温度/湿度）、测试项、仪器（型号/校准）、判据、实测、结论（PASS/FAIL/待定）、下一步。每页只写“一个主题”，例如“DDR 训练”或“HDMI 眼图”。三个月后回看，能一眼知道“当时怎么测的”。项目章要求“测试记录可复现”，不是“我记得测过”。\n\n**课程**：记录的价值在“复现”，不在“好看”。\n\n#### 28.7.15 用“软件”掩盖“硬件问题”\n\n花屏/死机先怀疑软件，改驱动/降频，硬件问题被“压”下去；量产批次一变又复发。修法：先做“硬件基线”（电源/时钟/复位/信号），再动软件；软件改动要“可回退/有记录”。硬件问题用“硬件手段”验证（示波器/替换/断开），不要“用代码赌”。\n\n**课程**：软件能绕过问题，但绕不过量产。\n\n### 28.8 本章复盘\n\n#### 28.8.1 公式与规则表\n\n| 公式/规则 | 用途 | 条件与注意 |\n|---|---|---|\n| 4 层：信号-地-电源-信号 | 叠层 | 关键信号参考地 |\n| DDR DQ 组内等长 | 训练 | 按手册 |\n| HDMI 100Ω/USB 90Ω | 差分 | 按叠层 |\n| 天线净空 | Wi-Fi | 所有层挖空 |\n| 电源×1.3 | 选型 | 峰值 |\n\n| DDR3 位宽 | 16bit 单颗粒 | 点对点 |\n| DDR3 VDDQ | 1.5V | VREF=0.75V |\n| DDR3 等长 | 组内 ±10mil | 地址/命令 ±20mil |\n| HDMI 差分 | 100Ω | 对内 ±5mil |\n| USB2.0 差分 | 90Ω | 对内 ±5mil |\n| 百兆网差分 | 100Ω | 变压器隔离 |\n| eMMC 等长 | ±10mil | CLK 包地 |\n| 电源余量 | 70% 负载 | 密闭高温 |\n| 拼板工艺边 | 8mm | Mark 对角 |\n\n#### 28.8.2 术语表\n\n| 术语 | 英文 | 一句话解释 |\n|---|---|---|\n| SoC | system on chip | 片上系统 |\n| eMMC | embedded MMC | 嵌入式存储 |\n| PHY | physical layer | 物理层收发 |\n| 净空 | keep-out | 禁止铺铜/器件区 |\n| PMIC | power management IC | 电源管理芯片 |\n\n**H3**：Allwinner 四核 A7 主控，内置 EMAC/HDMI/音频，本项目核心。\n\n**DDR3**：16bit 双倍速率同步 DRAM，1.5V IO。\n\n**eMMC**：嵌入式存储，双电压 3.3/1.8V。\n\n**PHY**：以太网物理层收发器。\n\n**TMDS**：HDMI 的差分传输方式。\n\n**HPD**：HDMI 热插拔检测。\n\n**VREF**：DDR 采样参考电压。\n\n**净空（keep-out）**：天线周围禁止铺铜/走线/放件的区域。\n\n**老化（burn-in）**：高温/满载长时间运行测试。\n\n**FCT**：功能测试（Function Test）。\n\n**BOOT**：启动介质选择。\n\n**ECO**：工程变更单。\n\n#### 28.8.3 自测 10 题\n\n1. H3 机顶盒功能块？\n2. 4 层叠层怎么排？\n3. DDR3 拓扑/等长要求？\n4. HDMI/USB 阻抗？\n5. Wi-Fi 天线净空要求？\n6. 电源树有哪几路？\n7. Bring-Up 顺序？\n8. eMMC 走线注意什么？\n9. 接口 ESD 放哪？\n10. 散热怎么考虑？\n\n**11. 为什么 H3 的 DDR3 要做 16bit 单颗粒而不是 32bit？**\n答：4 层板布线与层数受限，16bit 点对点走线最短、组数少、等长容易；32bit 需要更多 DQ/DQS 组，布线/串扰/层数压力大。容量不够可换更大单颗，而不是加位宽。\n\n**12. 上电时序里“先 1.5V 后 1.2V”的依据是什么？**\n答：DDR 的 IO 电源要先建立，避免 IO 先有电压而核心未初始化造成闩锁/误动作；具体顺序以 H3 数据手册 Power-Up Sequence 为准，并用示波器实测确认。\n\n**13. HDMI 的 ESD 为什么强调“低电容”？**\n答：TMDS 速率高（1080p 约 1.5Gbps/对），ESD 结电容会与走线电感形成低通，抬高上升时间、闭合眼图；一般要求 <0.5pF，且钳位电压低于接收端绝对最大。\n\n**14. Wi-Fi 天线净空为什么“三面”都要空？**\n答：天线是分布参数，靠近的铜/器件会改变谐振频率与辐射方向图；净空不足表现为“能连但距离短/吞吐低”。净空区还要避开电池/金属结构件。\n\n**15. 4 层板把电源岛放 L3、地把 L2 留完整，好处是什么？**\n答：所有高速信号（DDR/HDMI/USB）都能以 L2 为连续参考，回流路径短、阻抗稳定；电源分割放在 L3 不影响信号参考面，避免“为了电源把地切碎”。\n\n**16. 为什么网口要“变压器+ESD”两级，而不是只加 TVS？**\n答：变压器提供隔离/共模抑制，承担“共模/雷击能量”的第一道；ESD 在连接器侧泄放静电，保护 PHY。只加 TVS 扛不住浪涌能量，只加变压器对静电泄放不够快。\n\n**17. DDR 训练失败，先改布线还是先降频？**\n答：先降频/放宽时序，判断“是余量不足还是根本连错”；能降频跑通说明布线/电源有余量问题，再逐项查等长/参考面/去耦；完全跑不通才查焊接/颗粒/电源。\n\n**18. 机顶盒为什么要做“高温+满负载”老化？**\n答：密闭外壳内温度高，DDR 时序/LDO 结温/焊点应力在高温下才暴露；常温轻载通过不代表量产稳定。老化是把“现场几个月的问题”压缩到 72 小时。\n\n**19. 拼板时为什么连接器附近要留更大间距？**\n答：连接器插拔受力大、V-cut 分板应力集中，间距不足会“掰裂焊盘/外壳变形”；同时贴片机吸嘴/轨道需要避让高度。\n\n**20. 如果只能改一处来提升 EMC，你改哪里？**\n答：优先改“地/回流”——完整地平面、换层伴随地孔、接口地与数字地分区；地不好，滤波/屏蔽都是“浮空”的。其次才是接口共模/滤波。\n\n- [ ] 能写“需求→接口→器件→指标”表。\n- [ ] 能画电源树/上电时序并实测。\n- [ ] 能布 DDR3 16bit（等长/参考面/去耦）。\n- [ ] 能布 HDMI/USB/网口差分并加防护。\n- [ ] 能留 Wi-Fi 净空与调试口。\n- [ ] 能 Bring-Up：串口→DDR→eMMC→HDMI→网口。\n- [ ] 能做 EMC 预测试/高低温老化。\n- [ ] 能算 BOM/拼板/测试成本。\n\n#### 28.8.4 能力清单\n\n- [ ] 能拆机顶盒需求/功能块。\n- [ ] 能画 4 层叠层/电源树。\n- [ ] 能画 DDR/HDMI/USB/Wi-Fi 关键连接。\n- [ ] 能完成布局分区。\n- [ ] 能制定 Bring-Up 计划。\n\n#### 28.8.6 动手任务\n\n**任务一**：按本章电源树，画一张“电流/损耗/热点”标注图，算 1.2V Buck 的结温。\n\n**任务二**：画 DDR3 16bit 的等长分组表（DQ/DQS/地址/时钟），标出允许偏差。\n\n**任务三**：给 HDMI/USB/网口各画一条“连接器→防护→主控”的链路，标器件参数（结电容/钳位/阻抗）。\n\n**任务四**：写一份 Bring-Up 检查表（上电前/上电中/上电后），至少 20 项。\n\n**任务五**：把本章 12 个坑做成“设计检查表”，给你手上的项目逐条打勾。\n\n#### 28.8.6 下一章\n\n下一章讲**6 层板·RK3576 AI 主板**：从 4 层走到 6 层，DDR/高速/电源复杂度再上一级。\n\n### 28.9 项目交付物清单\n\n原理图（PDF+源文件）、PCB（Gerber/钻孔/阻抗说明/叠层表）、BOM（含替代料）、拼板图（工艺边/Mark/V-cut）、测试报告（Bring-Up/高低温/EMC 预测试）、问题库（现象/定位/根因/对策）、结构 3D/开孔图、烧录镜像与治具说明。交付物要“别人接手能继续做”，不是“只有自己看得懂”。\n\n**课程**：项目做完的标志，是“文档能交接”。\n\n### 28.10 从这块板带走的能力\n\n独立完成 4 层板：需求拆解、电源树与时序、DDR3 16bit 布局布线、HDMI/USB/网口差分与防护、Wi-Fi 净空、拼板与结构配合、Bring-Up 与 EMC 预测试。能把“参考设计”改成“自己的板”，能用“现象→物理量→根因→验证”定位问题，能把个案写成检查表。这些能力直接迁移到 6 层/8 层项目，只是公差更紧、层数更多。\n\n**课程**：会做 4 层板，才有资格谈 6 层/8 层。\n\n### 28.11 项目复盘三问\n\n一问：哪一处“返工”最贵？答：DDR 参考面被电源岛切开，导致训练失败、改版重投。二问：哪一处“最省”？答：原理图阶段就预留 ESD/共模位置，EMC 一次预测试过关。三问：下一版先改什么？答：先把 DDR 区域的地与电源规划画成“禁布图”，再谈走线。\n\n**课程**：复盘要落到“下一版动作”，不是“感想”。\n\n**写在最后**：这块板不是“考试题”，是“能拿去做产品的练习”。把它做完、做稳、做成文档，下一块 6 层板就不会从零开始。\n\n**给自学者的一句话**：先把“电源、时钟、复位、启动、调试口”这五件事做到位，再去追 DDR 眼图；顺序对了，4 层板没有那么难。\n\n**检查点**：如果你能不看本章，自己讲清“5V 怎么变成 1.2V、DDR 为什么只能参考 L2、HDMI 为什么要低电容 ESD”，这一章就真的学完了。\n\n**下一步**：把本章的检查表带进第 29 章，做 6 层板时逐条对照，你会发现“坑还是那些坑，只是更贵”。","taskSignature":"0c2287dc6e97661ae611e08e7d1e13b5cffda6dadab823078865b5cee6670ba0","taskCount":13},{"id":"29","title":"第 29 章 · 6 层板项目：RK3576 AI 主板","short":"6 层板项目：RK3576 AI 主板","stage":4,"diff":5,"prev":"第 28 章 4 层板项目：H3 机顶盒","optional":false,"md":"## 本章目标\n\n学完本章，你应该能够：\n\n1. 拆解 RK3576 类 AI 主板的算力/接口/存储/电源需求。\n2. 设计 6 层叠层，给 LPDDR4/DDR4、PCIe、USB3、HDMI 分参考面。\n3. 规划多路电源（核心/GPU/NPU/DDR/IO）的时序与去耦。\n4. 处理 PCIe/以太网/USB3 的高速差分与连接器。\n5. 做 6 层板布局分区、DDR 拓扑、散热/屏蔽。\n6. 制定高速 Bring-Up/信号测试计划。\n7. 说出至少 8 个 6 层 AI 主板常见坑。\n\nRK3576 这类板子把“多层、高速、多电源、大电流”叠在一起。6 层不是“多两层”，是“每层都要有明确用途”。\n\n## 正文\n\n### 29.1 需求与功能块\n\n需求：6 层板，RK3576 类 SoC，LPDDR4/DDR4 4GB，eMMC 32GB，千兆以太网，Wi-Fi6，PCIe SSD，USB3，HDMI，MIPI 屏/摄像头，12V 输入。\n\n| 块 | 关键 | 速率/电源 |\n|---|---|---|\n| SoC | RK3576 | 多路核心 |\n| 内存 | LPDDR4/DDR4 | 高速 |\n| 存储 | eMMC/PCIe SSD | 高速 |\n| 网络 | 千兆 PHY/Wi-Fi6 | 差分 |\n| 显示 | HDMI/MIPI | 差分/并行 |\n| 接口 | USB3/PCIe | 高速差分 |\n| 电源 | PMIC/多路 DCDC | 大电流 |\n\n#### 29.1.1 产品定义：AI 主板做什么\n\n定位：边缘 AI 盒子/商显主板/轻量服务器，主控 RK3576（4×A72+4×A53，Mali-G52，6TOPS NPU），LPDDR4X 4GB（32bit），eMMC 32GB，HDMI 4K60 + MIPI DSI，2×MIPI CSI 摄像头，千兆网，Wi-Fi6（可选），USB3.0×1 + USB2.0×2，PCIe 2.1（M.2 或 mini-PCIe），12V/3A 输入。6 层板，双面贴片。\n\n**边界**：不做 8K、不做多路 4K 解码、不做 10G；这些给 RK3588。\n\n#### 29.1.2 需求拆解：AI 主板的“三高一多”\n\n高带宽（LPDDR4X 32bit、PCIe、USB3、千兆）、高速（HDMI 4K、MIPI D-PHY）、高功耗（12V/3A、核心 1～2A）、多接口（显示/摄像/网络/存储）。每条都要落到“接口+器件+指标”：例如 MIPI CSI 4lane 1.5Gbps/lane、HDMI 4K60 约 6Gbps/对、PCIe Gen2 5GT/s。\n\n**课程**：AI 主板不是“接口多”，是“每条接口都要算速率”。\n\n#### 29.1.3 接口清单与连接器\n\nHDMI Type-A、MIPI DSI FPC（40pin）、MIPI CSI FPC×2、RJ45 带变压器、USB3 Type-A、USB2×2、M.2 Key-M（PCIe）、TF 卡、DC 12V、风扇/调试串口。FPC 连接器要“带锁扣/防呆”，MIPI 排线要“阻抗/屏蔽”，USB3 座要“带屏蔽壳”。\n\n#### 29.1.4 成本与 BOM 分层\n\n主控+LPDDR4X+eMMC 约 55%，接口/连接器 20%，电源 10%，阻容/其他 15%。LPDDR4X 比 DDR4 便宜/省电，但布线更严（Fly-by/等长/阻抗）；6 层板比 4 层板贵约 60%，但能换“阻抗/EMC/布线密度”。成本敏感点：LPDDR4X、eMMC、PCIe 连接器。\n\n#### 29.1.5 认证与合规\n\nCE/FCC、HDMI 认证、USB-IF（可选）、PCIe 一致性（可选）、RoHS。HDMI 4K 对“眼图/共模/ESD”要求更高；千兆网要过 Surge；MIPI 是“板内”，主要看“辐射/抗扰”。认证清单要在原理图前定。\n\n#### 29.1.6 项目计划与风险\n\n需求 2 周、原理图 3 周、PCB 4 周（6 层/等长多）、打样贴片 2 周、Bring-Up 3 周、EMC/认证 3 周、小批 3 周，约 20 周。风险：LPDDR4X 时序/眼图、PCIe 损耗、HDMI 4K 眼图、散热（NPU 满载）、6 层叠层阻抗。每条风险配“降频/预留/仿真”对策。\n\n### 29.2 系统框图与叠层\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 400\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 29-1：RK3576 AI 主板系统框图<\/text>\n  <rect x=\"260\" y=\"80\" width=\"200\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <text x=\"315\" y=\"115\" font-size=\"14\" fill=\"currentColor\">RK3576<\/text>\n  <text x=\"290\" y=\"140\" font-size=\"11\" fill=\"currentColor\">CPU/GPU/NPU<\/text>\n  <rect x=\"40\" y=\"70\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"100\" font-size=\"12\" fill=\"currentColor\">LPDDR4/DDR4<\/text>\n  <rect x=\"530\" y=\"70\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"555\" y=\"100\" font-size=\"12\" fill=\"currentColor\">eMMC/PCIe SSD<\/text>\n  <rect x=\"40\" y=\"190\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"220\" font-size=\"12\" fill=\"currentColor\">千兆/Wi-Fi6<\/text>\n  <rect x=\"260\" y=\"190\" width=\"200\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"290\" y=\"220\" font-size=\"12\" fill=\"currentColor\">HDMI/MIPI/USB3<\/text>\n  <rect x=\"530\" y=\"190\" width=\"160\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"555\" y=\"220\" font-size=\"12\" fill=\"currentColor\">PCIe/连接器<\/text>\n  <rect x=\"260\" y=\"310\" width=\"200\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"285\" y=\"340\" font-size=\"12\" fill=\"currentColor\">12V→PMIC/多路 DCDC<\/text>\n  <line x1=\"200\" y1=\"100\" x2=\"260\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"110\" x2=\"530\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"220\" x2=\"260\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"220\" x2=\"530\" y2=\"220\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"360\" y1=\"310\" x2=\"360\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg>\n```\n\n6 层叠层：\n\n| 层 | 用途 |\n|---|---|\n| L1 | 器件 + 高速信号（USB3/PCIe/HDMI） |\n| L2 | 完整地 |\n| L3 | 高速信号（DDR/差分） |\n| L4 | 电源平面 |\n| L5 | 地/低速信号 |\n| L6 | 低速/电源/器件 |\n\n```svg\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 340\">\n  <text x=\"20\" y=\"30\" font-size=\"16\" fill=\"currentColor\">图 29-2：6 层叠层与参考面<\/text>\n  <rect x=\"100\" y=\"60\" width=\"420\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"82\" font-size=\"11\" fill=\"currentColor\">L1 信号/器件<\/text>\n  <rect x=\"100\" y=\"94\" width=\"420\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"116\" font-size=\"11\" fill=\"currentColor\">L2 地<\/text>\n  <rect x=\"100\" y=\"128\" width=\"420\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"150\" font-size=\"11\" fill=\"currentColor\">L3 信号<\/text>\n  <rect x=\"100\" y=\"162\" width=\"420\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"184\" font-size=\"11\" fill=\"currentColor\">L4 电源<\/text>\n  <rect x=\"100\" y=\"196\" width=\"420\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"218\" font-size=\"11\" fill=\"currentColor\">L5 地/低速<\/text>\n  <rect x=\"100\" y=\"230\" width=\"420\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"252\" font-size=\"11\" fill=\"currentColor\">L6 低速/电源<\/text>\n  <text x=\"100\" y=\"300\" font-size=\"13\" fill=\"currentColor\">L1/L3 高速信号都有 L2/L5 地参考；L4 电源完整。<\/text>\n<\/svg>\n```\n\n#### 29.2.1 框图：主控为中心\n\nRK3576 引出：LPDDR4X 32bit、eMMC、SD、HDMI、MIPI DSI/CSI、USB3/2、PCIe、GMAC、音频、调试串口。外围：PMIC（多路）、PHY、Wi-Fi 模块、风扇。框图标“电源域/时钟/复位/调试/散热”。\n\n#### 29.2.2 6 层叠层：信号-地-信号-地-电源-信号\n\n推荐：L1 信号（HDMI/USB3/MIPI 顶层）、L2 GND、L3 信号（LPDDR4X/PCIe）、L4 GND、L5 PWR、L6 信号（低速/电源）。总厚 1.6mm；L1/L3/L6 阻抗按 50Ω 单端/90/100Ω 差分。核心：L3 走 LPDDR4X，参考 L2/L4 双地，回流最好。\n\n#### 29.2.3 叠层选择：为什么不是 4 层\n\n4 层板只有一层地，LPDDR4X 32bit+PCIe+HDMI 4K 同时走，“地”不够用、阻抗难控、串扰大。6 层给“双地+内层信号”，LPDDR4X 走 L3 夹在两个地之间，HDMI/USB3 走 L1 参考 L2。代价是成本/工艺，但“能过”比“便宜”重要。\n\n#### 29.2.4 电源树：12V 到 0.6V 核心\n\n12V→Buck 5V（外设/USB）→Buck 3.3V（IO/PHY）→Buck 1.8V（LPDDR4X VDDQ/eMMC IO）→Buck 1.1V（LPDDR4X VDD1）→Buck 0.6～0.9V（核心，按 DVFS）→LDO 1.8V/3.3V（模拟/HDMI）。RK3576 核心电流 2～4A（NPU 满载），LPDDR4X 约 1A。PMIC 可简化时序，但要确认“通道能力/散热”。\n\n#### 29.2.5 上电时序与复位\n\nLPDDR4X 要求 VDD1（1.1V）、VDD2（1.8V）、VDDQ（1.1V）按手册顺序，RESET 最后释放；核心 0.6V 由 PMIC/DVFS 控制。时序错→LPDDR 训练失败/不启动。用 PMIC 的“时序寄存器”或“EN 级联+RC”，示波器多通道验证。\n\n#### 29.2.6 散热与结构：NPU 满载的“热”\n\nRK3576 NPU 满载 5～8W，核心 2～4W；6 层板铜厚 1oz，主控下方散热过孔阵列+背面散热片/风扇。外壳要“进/出风口”，风扇 PWM 控速。热设计要在“45℃环境+满载”下验证，不能只看“常温空载”。\n\n#### 29.3.1 LPDDR4X 的“Fly-by 还是点对点”\n\n32bit 单颗/双颗：单颗点对点最简单；两颗 16bit 可“点对点各走各的”或“Fly-by 共用地址”。LPDDR4X 速率高（1600～2133MT/s），Fly-by 的地址/命令要“末端匹配/等长”，布线难度大。课程建议：单颗 32bit 点对点，先保证“通”，再谈“快”。\n\n#### 29.3.2 LPDDR4X 等长与阻抗\n\nDQ/DQS 组内 ±5mil、组间 ±10mil；CK 与 DQS ±10mil；地址/命令相对 CK ±15mil。单端 40～50Ω、差分 80～100Ω。LPDDR4X 的 DQS 是差分，走线要“同层/等长/包地”；DQ 与 DQS 不跨分割、不跨电源岛。\n\n#### 29.3.3 6 层板的阻抗控制\n\nL1/L6 微带 50Ω（线宽约 0.3mm@0.2mm 介质）；L3 带状线 50Ω（线宽约 0.25mm）；差分 90Ω（USB3/PCIe）、100Ω（HDMI/LPDDR4X DQS）。叠层表要“写死线宽/间距/介质”，板厂按表做阻抗条；首批要“TDR 测 coupon”。\n\n#### 29.3.4 串扰与“3W/包地”\n\n高速对之间 ≥3W；LPDDR4X 的 DQ 组间加地线/包地；PCIe/USB3 差分对间 ≥5W；HDMI 4 对之间加地。6 层板内层信号两侧有地，串扰比表层小，但“同层并行”仍要间距。\n\n#### 29.3.5 参考面与“跨分割”\n\n所有高速（LPDDR4X/PCIe/USB3/HDMI/MIPI）必须“参考连续地”：L3 参考 L2/L4，L1 参考 L2，L6 参考 L5（电源）或 L4。跨分割=回流断=辐射/误码；必须跨时加“桥接电容/缝合孔/改层”。\n\n#### 29.3.6 设计约束表\n\n| 信号 | 阻抗 | 等长 | 参考 |\n|---|---|---|---|\n| LPDDR4X DQ | 40～50Ω | 组内 ±5mil | L2/L4 |\n| LPDDR4X CK | 差分 80～100Ω | ±10mil | L2/L4 |\n| HDMI | 100Ω | 对内 ±5mil | L2 |\n| USB3 | 90Ω | 对内 ±5mil | L2 |\n| PCIe | 85Ω | 对内 ±5mil | L2/L4 |\n| MIPI | 100Ω | 对内 ±5mil | L2 |\n\n#### 29.2.7 6 层叠层的两个备选方案与取舍\n\n方案 A（推荐）：L1 信号 / L2 地 / L3 信号 / L4 地 / L5 电源 / L6 信号。优点是“双地夹内层信号”，LPDDR4X 与 PCIe 都能拿到连续参考；缺点是 L5 电源到 L1 器件要打孔，电源完整性要靠去耦补。方案 B：L1 信号 / L2 地 / L3 电源 / L4 信号 / L5 地 / L6 信号。优点是电源层完整、去耦回路短；缺点是 L4 信号参考 L3（电源）与 L5（地），跨层时参考面变化，高速信号容易“参考切换”出问题。音频/射频项目常选 B，AI 主板选 A，因为“信号完整性优先于电源平面完整”，电
