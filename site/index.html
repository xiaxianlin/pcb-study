0 V`；理想输出 `Vout=G×Vsense=0.50～2.00 V`。在 0.40 A 时，`P=I²Rs=0.08 W`。如果仅考虑输入等效失调 `±1 mV`，输出误差约 `±10 mV`，反推输入电流误差约 `±0.001/0.50=±0.002 A`，即 `±2 mA`。在 0.10 A 工作点，相对于读数约为 ±2%；实际总误差还包括增益、采样电阻容差与温漂、偏置、噪声、接地和测量误差。\n\n分流电阻会抬高负载地电位并耗散功率；其温升、脉冲能力、额定功率、阻值变化和两端取样连接都必须考虑。不能仅按 0.08 W 选型，还需按环境与厂商降额留余量。运放输入必须在实际共模范围内，输出和负载也必须满足条件，不能假定任意单电源运放都能精确测到靠近地的电压。\n\n### 验证与误区\n\n先用理想电流源和 `Rs` 计算或仿真，分三个输入点记录 `I、Vsense、Vout`，再改变一个假设看误差。实体练习须先选择适合的低压负载、电流源、测量仪器和具体器件；从最低电流开始，断电后连接电流表，记录表笔压降及功率。**不能将误差项简单当作已经覆盖了全部实际误差。**\n\n## 3. 恒流反馈：先算目标，再核对余量\n\n### 电路和题目\n\n理想负载经 N 沟道 MOS 的漏极、源极及采样电阻 `Rs=1.0 Ω` 回到地；运放同相输入端接参考 `Vref=0.10 V`，反相输入端接 MOS 源极和采样电阻上端，运放输出接 MOS 栅极；负反馈调整栅极使源极电压近似等于参考。负载另一端接稳定 5 V。假设运放与 MOS 都能在此工作点线性稳定工作。\n\n1. 求理想负载电流和采样电阻功率。\n2. 如果负载电压为 2.0 V，估算 MOS 的漏源压降与功耗。\n3. 当负载要求的电压超过电源可提供的余量时会怎样？\n\n### 参考答案\n\n理想状态下 `I≈Vref/Rs=0.10 A`，`PRs=I²Rs=0.010 W`。当负载压降为 2.0 V，采样电阻上约 0.10 V，`VDS≈5.0−2.0−0.10=2.90 V`，MOS 导通功耗约 `0.10×2.90=0.29 W`，不包括动态或其它损耗。若电源电压不能同时满足负载、采样电阻和 MOS 所需压降，反馈将失去调节余量，电流不再保证为 0.10 A；实际响应依电路和负载而定。\n\n### 验证与误区\n\n这是**原理框图**，不是已经稳定、可上电的恒流源。实际必须选择运放和 MOS，核查输入、输出及栅压范围、MOS 线性工作安全区与散热、电源启动及短路、反馈环路稳定性、采样误差和实际负载。若尚无具体器件及补偿，不应直接接实物负载。增大负载电阻时，恒流只在设计规定的输出电压范围内近似成立。\n\n## 4. 比较器迟滞：让上升与下降阈值不同\n\n### 电路和题目\n\n理想推挽比较器输出只有 `0 V` 或 `5 V`；反相输入直接接理想 `2.50 V` 参考。输入信号经 `Rin=10 kΩ` 接同相输入节点 `V+`，输出经 `Rf=100 kΩ` 正反馈到同一节点。假设输入信号源阻抗为零、比较器输入电流为零。\n\n1. 当输出原先为低时，`Vin` 上升到多少触发向高翻转？\n2. 当输出原先为高时，`Vin` 下降到多少触发向低翻转？迟滞宽度是多少？\n3. 为什么不能把结果直接套用到开集电极 LM393 和不同负载？\n\n### 参考答案\n\n输入节点为 `V+=(Vin×Rf+Vout×Rin)/(Rin+Rf)`。翻转点令 `V+=2.50 V`：输出原先为 0 V 时，上升阈值 `Vin=(2.50×110−0×10)/100=2.75 V`；输出原先为 5 V 时，下降阈值 `Vin=(2.50×110−5×10)/100=2.25 V`。理想迟滞宽度为 `0.50 V`。在 2.25～2.75 V 区间，输出取决于之前状态；恰在阈值时实际切换受失调和噪声影响。\n\nLM393 是开集电极输出，需要上拉；输出高低电压受上拉、负载和反馈网络影响，不一定恰为 5 V 或 0 V。还要核对输入共模、输出灌电流、失调、供电容差及启动状态。真实设计需计算闭合的电阻网络及两种输出状态，不能把此理想结果直接作为循迹小车的参数。\n\n### 验证与误区\n\n在仿真中搭建该理想电路，从 2.0 V 缓慢增加输入至 3.0 V，再下降至 2.0 V，记录两次翻转输入、输出电压和比较器类型；若模型输出不是理想 0/5 V，以实际输出值重新计算。实体电路须先选定器件及电源，并核算电阻、输出负载和失效状态。本题和循迹项目的门限结构不同，不可直接替换其中的电阻。\n\n## 5. 高端电流检测：小差分电压与高共模电压\n\n### 电路和题目\n\n理想 5.00 V 电源正端经 `Rs=0.10 Ω` 到负载，负载回到系统地。理想差分电流检测放大器的两个输入分别连接 Rs 两端，输出参考地，差分增益设为 `20 V/V`；假设输入无负载、增益准确、输出摆幅足够。电流从电源经电阻流向负载，范围为 `0.50～1.50 A`。\n\n1. 求采样电阻两端压差、负载端电压和理想输出电压的范围。\n2. 按输入两端电压的平均值计算共模电压范围；最大电流时电阻功耗是多少？\n3. 若仅假设输入等效失调为 `±100 μV`，反推电流误差是多少？为什么必须核对输入共模范围？\n\n### 参考答案\n\n`Vsense=I×0.10=0.05～0.15 V`，负载端电压约 `4.95～4.85 V`，理想输出 `20×Vsense=1.0～3.0 V`。输入共模电压为 `(5.00+V负载端)/2`，约 `4.975～4.925 V`；最大电阻功耗 `1.50²×0.10=0.225 W`。仅计给定的输入失调项，电流误差约 `±100 μV/0.10 Ω=±1 mA`，它不包括电阻容差与温漂、增益、噪声、输入偏置或电源变化。\n\n这里测量的是远小于供电的**差分电压**，但两个输入相对地都接近 5 V。实际放大器必须允许对应的输入共模电压、供电及瞬态，输出还要满足负载和摆幅要求；不能仅因差分电压小就直接接入任意单电源运放。取样电阻的发热、环境温度、PCB 铜箔、电流路径和故障电流均需核算。高端检测便于保持负载地参考，但具体故障是否能被检测取决于整个电流路径。\n\n### 验证与误区\n\n先用理想差分模型扫电流，记录电阻两端各自对地电压及两者差值；再单独加入输入失调，比较换算误差。实际电路应选定适合输入共模、电源和输出范围的具体电流检测器件并验证过流保护；本题不提供可直接通电的实物接线。参考 [TI 高端电流检测设计](https://www.ti.com/lit/an/sboa310b/sboa310b.pdf)。\n\n## 6. 跨阻放大：把微小光电流转成电压\n\n### 电路和题目\n\n理想运放同相端接稳定 `Vref=2.50 V`；反相端为求和节点，从输出经 `Rf=100 kΩ` 反馈到该节点。用理想电流源代表反偏光电二极管，电流 `Iphoto` **从 5 V 电源侧流入求和节点**，范围为 `0～10 μA`。假设运放供电 0～5 V、线性稳定、输入电流为零、参考理想且输出无负载。\n\n1. 写出输出与输入电流的关系并求输出范围。\n2. 若电流方向相反，输出变化方向如何？\n3. 为什么不能只计算反馈电阻就直接做出稳定的实物？\n\n### 参考答案\n\n线性负反馈时求和节点约为 `2.50 V`。由节点电流守恒，流入节点的光电流通过 Rf 流向输出：`Iphoto=(Vref−Vout)/Rf`，故 `Vout=Vref−Iphoto×Rf`，输出从 `2.50 V` 降到 `1.50 V`。若其余条件不变而电流方向反向，输出将随电流幅度上升；能否保持线性仍取决于输出摆幅及电路条件。\n\n本题只用电流源抽象光电二极管，并未指定真实器件或证明其反向偏置。实际设计须核对传感器极性、光电流/暗电流、反偏电压、结电容、运放输入偏置与失调、输入共模及输出范围；结电容和输入电容会影响反馈稳定性。反馈补偿电容、带宽和噪声应结合具体器件及目标分析，不能照搬任意值。参考 [TI 运放稳定性与跨阻电路](https://www.ti.com/lit/wp/sboa626/sboa626.pdf)。\n\n### 验证与误区\n\n先使用理想电流源、理想运放和受控电源做静态仿真，依次设置 0、5、10 μA，并记录输出；反转电流方向时先核对输出是否仍处于模型线性范围。选定具体器件前，不把理想输出当成实测或实际带宽保证。\n\n## 7. 记录与验收\n\n每题先独立计算，再对照答案。建议记录电路连接、假设、器件/模型版本、输入范围、预期输出、测量条件、结果和未解释偏差。仿真和实物分别标记；未验证填写“未做”。通用表格见[基础练习与实验记录手册](#/resource/6a69fbba188b2ab2)。\n\n完成后应能：说明线性反馈的前提；算出高、低端采样的电阻功耗和单项失调误差；说明差分与共模电压；解释恒流回路的电压余量；用上升/下降两次扫描区分迟滞与单阈值；通过节点电流方向写出跨阻增益。参考：[TI 负反馈与线性工作说明](https://www.ti.com/document-viewer/lit/html/SSZT093)、[TI 同相迟滞比较器设计](https://www.ti.com/lit/an/sboa313a/sboa313a.pdf)、[TI 电流检测与比较器实例](https://www.ti.com/lit/ds/symlink/ina381.pdf)。这些资料用于理解原理，不代表本题已采用或验证其中具体器件。\n","path":"模拟电路进阶练习.md","group":"基础练习"}]}</script>

/* ================= markdown renderer ================= */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m,c) => '<code>'+c+'</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,u) =>
    '<a href="'+u+'"'+(u.startsWith('#') ? '' : ' target="_blank" rel="noopener"')+'>'+t+'</a>');
  return s;
}

function mdToHtml(md, opts){
  opts = opts || {};
  let taskIdx = 0, hid = 0;
  const lines = md.split('\n');
  let out = '', i = 0;
  const isHr = s => /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(s);
  const isTableSep = s => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes('-') && s.includes('|');

  while (i < lines.length){
    const line = lines[i];

    /* fenced code / mermaid 图 */
    if (/^\s*```/.test(line)){
      const lang = line.replace(/^\s*```/, '').trim().toLowerCase();
      let buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      if (lang === 'circuitjs'){
        const name = buf.join('\n').trim(), sim = SIMS[name];
        if (sim && /^[a-z0-9-]+$/.test(name)) {
          const circuitUrl = new URL('sim/circuits/' + name + '.txt?v=20261102-orfix', location.href).href;
          const simUrl = 'sim/circuitjs.html?lang=en&startCircuitLink=' + encodeURIComponent(circuitUrl);
          out += '<figure class="circuit-figure"><figcaption><strong>原理图与互动仿真：'+esc(sim.title)+'</strong> · '+esc(sim.desc)+'；仿真参数可能与正文算例不同，模拟器菜单为英文。 <a href="#/sim/'+name+'">放大查看</a></figcaption><iframe loading="lazy" title="'+esc(sim.title)+' 原理图与互动仿真" src="'+esc(simUrl)+'"></iframe></figure>';
        } else out += '<p>仿真未配置：'+esc(name)+'</p>';
      } else if (lang === 'mermaid'){
        out += '<div class="diagram">' + esc(buf.join('\n')) + '</div>';
      } else if (lang === 'svg'){
        out += '<div class="diagram diagram-svg">' + buf.join('\n') + '</div>';
      } else {
        out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
      }
      continue;
    }
    /* details / summary 折叠块透传 */
    if (/^\s*<details[^>]*>\s*$/.test(line)){ out += '<details>'; i++; continue; }
    const sm = line.match(/^\s*-?\s*<summary>(.*?)<\/summary>\s*$/);
    if (sm){ out += '<summary>' + inline(sm[1]) + '</summary>'; i++; continue; }
    if (/^\s*<\/details>\s*$/.test(line)){ out += '</details>'; i++; continue; }
    /* heading */
    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if (m){
      const lv = Math.min(Math.max(m[1].length, 2), 6);
      out += '<h'+lv+' id="hd-'+(hid++)+'">' + inline(m[2]) + '</h'+lv+'>';
      i++; continue;
    }
    /* hr */
    if (isHr(line)){ out += '<hr>'; i++; continue; }
    /* blockquote */
    if (/^\s*>/.test(line)){
      let buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out += '<blockquote>' + buf.map(b => '<p>'+inline(b)+'</p>').join('') + '</blockquote>';
      continue;
    }
    /* table */
    if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i+1])){
      const parseRow = s => s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c => c.trim());
      const heads = parseRow(line);
      const aligns = parseRow(lines[i+1]).map(c =>
        /^:.*:$/.test(c) ? 'center' : /:$/.test(c) ? 'right' : 'left');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== ''){
        rows.push(parseRow(lines[i])); i++;
      }
      let t = '<div class="tbl-wrap"><table><thead><tr>';
      heads.forEach((h,ci) => t += '<th style="text-align:'+aligns[ci]+'">'+inline(h)+'</th>');
      t += '</tr></thead><tbody>';
      rows.forEach(r => {
        t += '<tr>';
        r.forEach((c,ci) => t += '<td style="text-align:'+(aligns[ci]||'left')+'">'+inline(c)+'</td>');
        t += '</tr>';
      });
      t += '</tbody></table></div>';
      out += t;
      continue;
    }
    /* task list item */
    m = line.match(/^(\s*)-\s+\[([ xX])\]\s+(.*)$/);
    if (m){
      let items = [];
      while (i < lines.length){
        const mm = lines[i].match(/^(\s*)-\s+\[([ xX])\]\s+(.*)$/);
        if (!mm) break;
        items.push({ind: mm[1].length, checked: mm[2].toLowerCase()==='x', text: mm[3]});
        i++;
      }
      out += '<ul class="tasks">' + items.map(it => {
        const ti = taskIdx++;
        const dis = opts.staticTasks ? ' disabled' : '';
        const ck = it.checked || (checks[opts.lessonId] && checks[opts.lessonId][ti]);
        return '<li><label><input type="checkbox" data-ti="'+ti+'"'+dis+(ck?' checked':'')+'><span>'+inline(it.text)+'</span></label></li>';
      }).join('') + '</ul>';
      continue;
    }
    /* list */
    m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (m){
      const buf = [];
      while (i < lines.length){
        const mm = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (!mm) break;
        buf.push({ind: mm[1].length, ol: /\d/.test(mm[2][0]), text: mm[3]});
        i++;
      }
      let html = '', openTag = null;
      buf.forEach(it => {
        const tag = it.ol ? 'ol' : 'ul';
        if (tag !== openTag){
          if (openTag) html += '</'+openTag+'>';
          html += '<'+tag+'>'; openTag = tag;
        }
        html += '<li'+(it.ind >= 2 ? ' class="sub"' : '')+'>' + inline(it.text) + '</li>';
      });
      if (openTag) html += '</'+openTag+'>';
      out += html;
      continue;
    }
    /* blank */
    if (line.trim() === ''){ i++; continue; }
    /* paragraph */
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' && !/^\s*(#{1,6}\s|```|>|\||-\s|\d+\.\s)/.test(lines[i]) && !isHr(lines[i])){
      para.push(lines[i]); i++;
    }
    out += '<p>' + para.map(inline).join('<br>') + '</p>';
  }
  return out;
}

    const a = g.pos(k), b = g.pos(k+1), l = LESSONS[k+1];
    const bothDone = progress.has(LESSONS[k].id) && progress.has(l.id);
    svg += '<line class="seg'+(bothDone?' done-seg':'')+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" style="stroke:'+stageColor(l.stage)+'"/>';
  }
  /* nodes */
  LESSONS.forEach((l, k) => {
    const p = g.pos(k), c = stageColor(l.stage), isDone = progress.has(l.id);
    const isActive = location.hash === '#/lesson/' + l.id;
    svg += '<g class="node'+(isDone?' done':'')+(isActive?' active':'')+(l.optional?' optional':'')+'" '+
      'style="--c:'+c+'" transform="translate('+p.x+','+p.y+')" data-id="'+l.id+'">' +
      '<circle class="pad" r="24"/><text class="num" y="4.5">'+l.id+'</text>' +
      (isDone ? '<circle class="badge" cx="18" cy="-18" r="8"/><text class="badge-t" x="18" y="-14.5">✓</text>' : '') +
      '<text class="lbl" y="46">'+esc(l.short)+'</text>' +
      (l.optional ? '<text class="opt-tag" y="61">选学</text>' : '') +
      '<title>第 '+l.id+' 课 · '+esc(l.title)+'\n难度 '+stars(l.diff)+(isDone?'\n✓ 已完成':'')+'</title></g>';
  });
  svg += '</svg>';
  const wrap = $('#mapWrap');
  wrap.innerHTML = svg;
  wrap.querySelectorAll('.node').forEach(el =>
    el.addEventListener('click', () => { location.hash = '#/lesson/' + el.dataset.id; }));
}

/* ================= lesson ================= */
function renderLesson(id){
  const l = BY_ID[id];
  if (!l){ location.hash = '#/home'; return; }
  const idx = LESSONS.indexOf(l);
  const prev = LESSONS[idx-1], nxt = LESSONS[idx+1];
  const isDone = progress.has(id);
  const st = STAGES[l.stage-1];
  const total = (l.md.match(/^- \[ \]/gm) || []).length;
  const doneCk = (checks[id] || []).filter(Boolean).length;

  view.innerHTML = `
  <div class="lesson-head">
    <div class="crumb">
      <a href="#/home">‹ 路线图</a>
      <span class="stage-chip" style="--c:${st.color}">阶段${CN[l.stage-1]} · ${st.name}</span>
      <span class="spacer"></span>
      <span style="font-family:var(--mono)">←/→ 切换课程</span>
    </div>
    <h1>第 ${l.id} 课 · ${esc(l.title.replace(/^第\s*\d+\s*课\s*·\s*/,''))}</h1>
    <div class="meta-row">
      <span class="chip">难度 <b>${stars(l.diff)}</b></span>
      ${l.prev ? '<span class="chip">前置 · '+esc(l.prev)+'</span>' : ''}
      ${total ? '<span class="chip task-chip">自测 <b id="taskChip">'+doneCk+'/'+total+'</b></span>' : ''}
      ${l.optional ? '<span class="chip" style="border-style:dashed">选学</span>' : ''}
      <span class="spacer"></span>
      <button class="btn ghost" id="mindBtn">🧠 导图</button>
      <button class="btn ${isDone?'done-btn':'primary'}" id="doneBtn">${isDone?'✓ 已完成':'标记本课完成'}</button>
    </div>
  </div>
  <article class="md" id="mdBody">${mdToHtml(l.md, {lessonId:id})}</article>
  <div class="lesson-foot">
    <button class="btn ${isDone?'done-btn':'primary'}" id="doneBtn2">${isDone?'✓ 已完成（点击取消）':'标记本课完成'}</button>
  </div>
  <div class="nav-cards">
    <div class="nav-card ${prev?'':'disabled'}" ${prev?('data-id="'+prev.id+'"'):''}>
      <div class="dir">← 上一课${prev?'':'（无）'}</div><div class="tt">${prev ? esc(prev.short) : '—'}</div>
    </div>
    <div class="nav-card next" ${nxt?('data-id="'+nxt.id+'"'):''}>
      <div class="dir">${nxt?'下一课 →':'已是最后一课'}</div><div class="tt">${nxt ? esc(nxt.short) : '🏅 前往路线图回顾'}</div>
    </div>
  </div>`;

  /* checkbox persistence */
  view.querySelectorAll('input[data-ti]').forEach(inp => {
    inp.addEventListener('change', () => {
      checks[id] = checks[id] || [];
      checks[id][+inp.dataset.ti] = inp.checked;
      saveChecks();
      const all = view.querySelectorAll('input[data-ti]');
      const dn = [...all].filter(x => x.checked).length;
      const chip = $('#taskChip');
      if (chip) chip.textContent = dn + '/' + all.length;
    });
  });
  /* complete toggle */
  const toggle = () => {
    if (progress.has(id)) progress.delete(id); else progress.add(id);
    saveProgress();
    renderSidebar(id);
    const dn = progress.has(id);
    [$('#doneBtn'), $('#doneBtn2')].forEach(b => {
      if (!b) return;
      b.className = 'btn ' + (dn ? 'done-btn' : 'primary');
      b.textContent = b.id === 'doneBtn' ? (dn ? '✓ 已完成' : '标记本课完成') : (dn ? '✓ 已完成（点击取消）' : '标记本课完成');
    });
    if (dn && nxt) setTimeout(() => { location.hash = '#/lesson/' + nxt.id; }, 350);
  };
  $('#doneBtn').addEventListener('click', toggle);
  $('#doneBtn2').addEventListener('click', toggle);
  $('#mindBtn').addEventListener('click', openMind);
  view.querySelectorAll('.nav-card[data-id]').forEach(el =>
    el.addEventListener('click', () => { location.hash = '#/lesson/' + el.dataset.id; }));
  if (!nxt){
    const last = view.querySelector('.nav-card.next');
    if (last) last.addEventListener('click', () => { location.hash = '#/home'; });
  }
  buildToc();
}

/* ================= toc（右侧大纲） ================= */
let tocHeads = [];
function buildToc(){
  const toc = $('#toc');
  const heads = [...view.querySelectorAll('.md h2, .md h3, .md h4')].filter(h => h.tagName !== 'H4' || (/^04\.4\.[1-7]\s/.test(h.textContent) && location.hash === '#/lesson/04'));
  if (!heads.length){ clearToc(); return; }
  toc.classList.add('has-toc');
  toc.innerHTML = '<div class="toc-title">本课大纲</div>' + heads.map(h =>
    '<div class="toc-item '+(h.tagName === 'H2' ? 'lv1' : h.tagName === 'H4' ? 'lv3' : 'lv2')+'" data-t="'+h.id+'">'+esc(h.textContent)+'</div>').join('');
  const els = [...toc.querySelectorAll('.toc-item')];
  tocHeads = heads.map((h, k) => ({el: h, link: els[k]}));
  els.forEach(el => el.addEventListener('click', () => {
    const t = document.getElementById(el.dataset.t);
    if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'});
  }));
  updateTocActive();
}
function clearToc(){
  const toc = $('#toc');
  toc.classList.remove('has-toc');
  toc.innerHTML = '';
  tocHeads = [];
}
function updateTocActive(){
  if (!tocHeads.length) return;
  let cur = 0;
  for (let k = 0; k < tocHeads.length; k++){
    if (tocHeads[k].el.getBoundingClientRect().top <= 110) cur = k;
  }
  tocHeads.forEach((t, k) => t.link.classList.toggle('active', k === cur));
}
window.addEventListener('scroll', updateTocActive, {passive: true});

/* ================= mermaid 图渲染 ================= */
let diagSeq = 0;
const MMD_LIGHT = { primaryColor:'#e9f1ec', primaryBorderColor:'#5aa9ff', primaryTextColor:'#1d2b25',
  lineColor:'#586d63', secondaryColor:'#eef4f0', tertiaryColor:'#f7faf8', fontSize:'14px' };
const MMD_DARK = { primaryColor:'#152019', primaryBorderColor:'#5aa9ff', primaryTextColor:'#dbe7e1',
  lineColor:'#8aa097', secondaryColor:'#111b17', tertiaryColor:'#0e1613', fontSize:'14px' };
function renderDiagrams(){
  const els = view.querySelectorAll('.diagram:not(.diagram-svg)');
  if (!els.length || !window.mermaid) return;
  const dark = document.documentElement.dataset.theme === 'dark';
  try{
    window.mermaid.initialize({ startOnLoad:false, theme:'base',
      fontFamily:'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif',
      themeVariables: dark ? MMD_DARK : MMD_LIGHT });
  }catch(e){ return; }
  els.forEach(async el => {
    if (el.dataset.done) return;
    el.dataset.src = el.textContent;
    try{
      const {svg} = await window.mermaid.render('mmd-' + (diagSeq++), el.dataset.src);
      el.innerHTML = svg;
      el.dataset.done = '1';
    }catch(err){ el.classList.add('diagram-err'); }
  });
}

/* ================= sim（电路仿真弹窗·覆盖层，不动路由与课程 DOM） ================= */
function openSim(name){
  const sim = SIMS[name];
  if (!sim) return;
  const circuitUrl = new URL('sim/circuits/' + name + '.txt?v=20261102-orfix', location.href).href;
  const src = '/sim/circuitjs.html?lang=en&startCircuitLink=' + encodeURIComponent(circuitUrl);
  $('#simTitle').textContent = '🔬 ' + sim.title;
  $('#simDesc').textContent = sim.desc + ' · ' + (sim.context || ('第 ' + sim.lesson + ' 课配套仿真')) + ' · 菜单为英文';
  $('#simNewWin').href = src;
  const fr = $('#simFrame');
  fr.onload = () => {
    /* 仿真器与主页同源：桥接 iframe 内的 ESC，焦点在仿真器里也能关闭弹窗 */
    try { fr.contentDocument.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSim(); }); } catch (e) {}
  };
  fr.src = src;
  $('#simBackdrop').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSim(){
  $('#simBackdrop').hidden = true;
  $('#simFrame').src = 'about:blank';
  document.body.style.overflow = '';
}
$('#simCloseBtn').addEventListener('click', closeSim);
$('#simBackdrop').addEventListener('click', e => { if (e.target.id === 'simBackdrop') closeSim(); });
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/sim/"]');
  if (a){ e.preventDefault(); openSim(a.getAttribute('href').slice(6)); }
});

/* ================= mind（思维导图覆盖层） ================= */
const DEPTH = {H2: 1, H3: 2, H4: 3};
function buildMindTree(){
  const root = {title: '', lv: 0, children: [], el: null};
  const stack = [root];
  view.querySelectorAll('.md h2, .md h3, .md h4').forEach(h => {
    const lv = DEPTH[h.tagName] || 2;
    const node = {title: h.textContent.trim(), lv, children: [], el: h};
    while (stack.length > lv) stack.pop();
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  });
  return root;
}
function openMind(){
  const id = location.hash.slice(9);
  const l = BY_ID[id];
  if (!l) return;
  const root = buildMindTree();
  root.title = '第 ' + l.id + ' 课 · ' + l.short;
  const ROW = 40, COL = 250, PAD = 24, GAPY = 8;
  let maxDepth = 0;
  const layout = n => {
    maxDepth = Math.max(maxDepth, n.lv);
    if (!n.children.length){ n.h = ROW; return n.h; }
    let h = 0;
    n.children.forEach(c => { h += layout(c) + GAPY; });
    n.h = h - GAPY;
    return n.h;
  };
  layout(root);
  const height = Math.max(root.h + PAD * 2, 300);
  const width = (maxDepth + 1) * COL + PAD * 2 + 200;
  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '">';
  const place = (n, x, yTop) => {
    n.x = x; n.yc = yTop + n.h / 2;
    if (n.children){
      let cy = yTop;
      n.children.forEach(c => { place(c, x + COL, cy); cy += c.h + GAPY; });
    }
  };
  place(root, PAD, PAD);
  const esc2 = s => esc(s.length > 15 ? s.slice(0, 14) + '…' : s);
  const draw = n => {
    const w = Math.min(n.lv === 0 ? 210 : 215, 15 * 12.5 + 20);
    n.children.forEach(draw);
    if (n.lv > 0)
      svg += '<path class="mm-link" d="M ' + (n.x - COL + 205) + ' ' + n.yc +
             ' C ' + (n.x - COL / 2) + ' ' + n.yc + ', ' + (n.x - COL / 2) + ' ' + n.yc + ', ' + n.x + ' ' + n.yc + '"/>';
    svg += '<g class="mm-node l' + n.lv + '"' + (n.el ? ' data-t="' + n.el.id + '"' : '') + '>' +
           '<rect x="' + n.x + '" y="' + (n.yc - 17) + '" width="' + w + '" height="34" rx="7"/>' +
           '<text x="' + (n.x + 10) + '" y="' + (n.yc + 4.5) + '">' + esc2(n.title) + '</text></g>';
  };
  draw(root);
  svg += '</svg>';
  $('#mindBody').innerHTML = svg;
  $('#mindBody').querySelectorAll('.mm-node[data-t]').forEach(el =>
    el.addEventListener('click', () => {
      closeMind();
      const t = document.getElementById(el.dataset.t);
      if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'});
    }));
  $('#mindBackdrop').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeMind(){
  $('#mindBackdrop').hidden = true;
  $('#mindBody').innerHTML = '';
  document.body.style.overflow = '';
}
$('#mindCloseBtn').addEventListener('click', closeMind);
$('#mindBackdrop').addEventListener('click', e => { if (e.target.id === 'mindBackdrop') closeMind(); });

/* ================= search ================= */
const searchInput = $('#searchInput'), searchResults = $('#searchResults');
function doSearch(q){
  q = q.trim().toLowerCase();
  if (!q){ searchResults.classList.remove('show'); return; }
  const hits = [];
  for (const l of LESSONS){
    if (l.title.toLowerCase().includes(q)){
      hits.push({l, snip: l.md.split('\n').find(x => x.toLowerCase().includes(q)) || ''});
      continue;
    }
    const ln = l.md.toLowerCase().indexOf(q);
    if (ln >= 0){
      const before = l.md.lastIndexOf('\n', ln);
      const line = l.md.slice(before + 1, l.md.indexOf('\n', ln) > 0 ? l.md.indexOf('\n', ln) : undefined);
      hits.push({l, snip: line});
    }
    if (hits.length >= 8) break;
  }
  searchResults.innerHTML = hits.length
    ? hits.map(h => {
        let s = h.snip.replace(/[#*`|>]/g, '').trim();
        const at = s.toLowerCase().indexOf(q);
        if (at > 26) s = '…' + s.slice(at - 22);
        if (s.length > 70) s = s.slice(0, 70) + '…';
        const safe = esc(s).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig'), '<b>$1</b>');
        return '<div class="sr-item" data-id="'+h.l.id+'"><div class="t">'+h.l.id+' · '+esc(h.l.short)+'</div><div class="s">'+safe+'</div></div>';
      }).join('')
    : '<div class="sr-empty">没有找到包含「'+esc(q)+'」的内容</div>';
  searchResults.classList.add('show');
  searchResults.querySelectorAll('.sr-item').forEach(el =>
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      location.hash = '#/lesson/' + el.dataset.id;
      searchResults.classList.remove('show');
      searchInput.value = '';
      document.body.classList.remove('nav-open');
    }));
}
searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchInput.addEventListener('keydown', e => { if (e.key === 'Escape'){ searchResults.classList.remove('show'); searchInput.blur(); } });
searchInput.addEventListener('blur', () => setTimeout(() => searchResults.classList.remove('show'), 150));

/* ================= router & init ================= */
let lastHash = null;
function route(){
  const h = location.hash || '#/home';
  if (h === lastHash) return;
  lastHash = h;
  if (!$('#simBackdrop').hidden) closeSim();
  if (h.startsWith('#/sim/')){
    /* 直接用 URL 打开仿真的场景：背后先渲染首页 */
    if (!view.querySelector('.hero, .lesson-head')){ renderHome(); renderSidebar(null); }
    openSim(h.slice(6));
    return;
  }
  window.scrollTo(0, 0);
  if (h.startsWith('#/lesson/')){
    const id = h.slice(9);
    renderLesson(id);
    renderSidebar(id);
  } else if (h.startsWith('#/resource/')) {
    renderResource(h.slice(11));
    renderSidebar(null);
  } else {
    renderHome();
    renderSidebar(null);
  }
  renderDiagrams();
}
window.addEventListener('hashchange', route);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape'){
    if (!$('#simBackdrop').hidden){ closeSim(); return; }
    if (!$('#mindBackdrop').hidden){ closeMind(); return; }
  }
  if (!location.hash.startsWith('#/lesson/')) return;
  const id = location.hash.slice(9);
  const idx = LESSONS.findIndex(l => l.id === id);
  if (e.key === 'ArrowLeft' && LESSONS[idx-1]) location.hash = '#/lesson/' + LESSONS[idx-1].id;
  if (e.key === 'ArrowRight' && LESSONS[idx+1]) location.hash = '#/lesson/' + LESSONS[idx+1].id;
});

$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
$('#overlay').addEventListener('click', () => document.body.classList.remove('nav-open'));

/* theme */
const T_KEY = 'pcbcourse.theme';document.documentElement.dataset.theme = localStorage.getItem(T_KEY) || 'light';
const themeBtn = $('#themeBtn');
themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(T_KEY, next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  /* 已渲染的 mermaid 图按新主题就地重绘 */
  view.querySelectorAll('.diagram[data-done]').forEach(el => {
    el.textContent = el.dataset.src || '';
    delete el.dataset.done;
  });
  renderDiagrams();
});

/* 备份使用独立格式，恢复之前先核验每课的任务文本与顺序。 */
function makeProgressBackup(){
  return {format:'pcb-course-progress', version:1, exportedAt:new Date().toISOString(),
    taskSignatures:Object.fromEntries(LESSONS.map(l => [l.id, l.taskSignature])),
    progress:[...progress], checks};
}
function validateProgressBackup(data){
  if (!data || typeof data !== 'object' || Array.isArray(data) || data.format !== 'pcb-course-progress' || data.version !== 1 ||
      !Array.isArray(data.progress) || !data.checks || typeof data.checks !== 'object' || Array.isArray(data.checks) ||
      !data.taskSignatures || typeof data.taskSignatures !== 'object' || Array.isArray(data.taskSignatures)) throw Error('文件格式不正确或版本不受支持');
  if (data.progress.length > LESSONS.length || new Set(data.progress).size !== data.progress.length ||
      data.progress.some(id => typeof id !== 'string' || !Object.hasOwn(BY_ID, id))) throw Error('课程完成记录不正确');
  for (const [id, values] of Object.entries(data.checks)){
    if (!Object.hasOwn(BY_ID, id) || !Array.isArray(values) || values.length > BY_ID[id].taskCount ||
        values.some(value => value !== null && typeof value !== 'boolean')) throw Error('自测记录不正确');
    if (values.length && data.taskSignatures[id] !== BY_ID[id].taskSignature)
      throw Error('第 '+id+' 课的任务内容或顺序与备份不同，不能自动恢复，请保留备份并人工核对');
  }
  return {progress:data.progress, checks:data.checks};
}
$('#exportProgress').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(makeProgressBackup(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'PCB课程学习进度-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$('#importProgress').addEventListener('click', () => $('#progressFile').click());
$('#progressFile').addEventListener('change', async event => {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  let restored;
  try {
    if (file.size > 2 * 1024 * 1024) throw Error('文件超过 2 MB');
    restored = validateProgressBackup(JSON.parse(await file.text()));
  } catch (err) { alert('无法导入：'+err.message+'。当前进度未更改。'); return; }
  if (!confirm('导入将替换当前课程完成状态和自测记录。建议先导出当前进度。确定继续吗？')) return;
  const oldProgress = localStorage.getItem(P_KEY), oldChecks = localStorage.getItem(C_KEY);
  try {
    localStorage.setItem(P_KEY, JSON.stringify(restored.progress));
    localStorage.setItem(C_KEY, JSON.stringify(restored.checks));
  } catch (err) {
    try {
      if (oldProgress === null) localStorage.removeItem(P_KEY); else localStorage.setItem(P_KEY, oldProgress);
      if (oldChecks === null) localStorage.removeItem(C_KEY); else localStorage.setItem(C_KEY, oldChecks);
      alert('保存失败，已尝试恢复原进度。请检查浏览器存储空间。');
    } catch (_) { alert('保存和回滚均失败；请检查浏览器存储，并使用之前导出的备份恢复。'); }
    return;
  }
  progress = new Set(restored.progress); checks = restored.checks;
  lastHash = null; route(); alert('进度已导入。');
});
$('#resetBtn').addEventListener('click', () => {
  if (confirm('确定要清空全部学习进度和自测打卡记录吗？此操作不可恢复。')){
    progress = new Set(); checks = {};
    saveProgress(); saveChecks();
    renderSidebar(null); route();
    lastHash = null; route();
  }
});

renderSidebar(null);
document.querySelector('.brand .sub').textContent = '从零基础到就业 · ' + STAGES.length + ' 阶段 ' + LESSONS.length + ' 课';
route();
</script>
