<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1920" height="1080" fill="#FDFBF7"/>

  <text x="960" y="95" text-anchor="middle" font-size="56" font-weight="800" fill="#1F2937">最简单的电路，只要三样</text>

  <!-- closed loop -->
  <g transform="translate(960,485)">
    <rect x="-380" y="-235" width="760" height="470" rx="110" fill="none" stroke="#D97706" stroke-width="20"/>
    <rect x="-380" y="-235" width="760" height="470" rx="110" fill="none" stroke="#F59E0B" stroke-width="9"/>

    <!-- power source (left) -->
    <g transform="translate(-425,-62)">
      <rect x="0" y="0" width="110" height="126" rx="16" fill="#10B981" stroke="#065F46" stroke-width="5"/>
      <text x="55" y="62" text-anchor="middle" font-size="38" font-weight="800" fill="#ECFDF5">＋</text>
      <text x="55" y="106" text-anchor="middle" font-size="38" font-weight="800" fill="#ECFDF5">−</text>
    </g>
    <text x="-370" y="135" text-anchor="middle" font-size="36" font-weight="800" fill="#047857">电源</text>

    <!-- load (right): lamp -->
    <g transform="translate(315,-80)">
      <circle cx="55" cy="55" r="54" fill="#FBBF24" stroke="#F59E0B" stroke-width="6"/>
      <path d="M35 35 L 75 75 M75 35 L 35 75" stroke="#92400E" stroke-width="6" stroke-linecap="round"/>
      <rect x="38" y="109" width="34" height="24" rx="6" fill="#6B7280"/>
    </g>
    <text x="370" y="135" text-anchor="middle" font-size="36" font-weight="800" fill="#B45309">负载</text>

    <!-- switch as small gate (top) -->
    <g transform="translate(-65,-298)">
      <circle cx="0" cy="36" r="13" fill="#374151"/>
      <circle cx="130" cy="36" r="13" fill="#374151"/>
      <line x1="0" y1="36" x2="130" y2="36" stroke="#374151" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text x="0" y="-325" text-anchor="middle" font-size="32" font-weight="700" fill="#6B7280">开关（只管开门关门）</text>

    <!-- moving electrons -->
    <g fill="#3B82F6" stroke="#1D4ED8" stroke-width="4">
      <circle cx="0" cy="-235" r="24"/>
      <circle cx="380" cy="0" r="24"/>
      <circle cx="0" cy="235" r="24"/>
      <circle cx="-380" cy="0" r="24"/>
    </g>
    <g font-size="22" font-weight="700" fill="#EFF6FF" text-anchor="middle">
      <text x="0" y="-227">−</text><text x="380" y="8">−</text><text x="0" y="243">−</text><text x="-380" y="8">−</text>
    </g>
  </g>

  <!-- three ingredient chips -->
  <g text-anchor="middle" font-size="34" font-weight="800">
    <g transform="translate(360,790)">
      <rect x="0" y="0" width="320" height="82" rx="18" fill="#D1FAE5" stroke="#10B981" stroke-width="4"/>
      <text x="160" y="53" fill="#047857">① 电源</text>
    </g>
    <g transform="translate(800,790)">
      <rect x="0" y="0" width="320" height="82" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="4"/>
      <text x="160" y="53" fill="#92400E">② 负载</text>
    </g>
    <g transform="translate(1240,790)">
      <rect x="0" y="0" width="320" height="82" rx="18" fill="#FED7AA" stroke="#F97316" stroke-width="4"/>
      <text x="160" y="53" fill="#C2410C">③ 闭合导电路径</text>
    </g>
  </g>
</svg>
