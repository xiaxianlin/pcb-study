<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1920" height="1080" fill="#FDFBF7"/>

  <text x="960" y="88" text-anchor="middle" font-size="54" font-weight="800" fill="#1F2937">一个水路，一个电路，长得一模一样</text>

  <!-- column headers -->
  <g text-anchor="middle" font-size="38" font-weight="800">
    <rect x="200" y="115" width="560" height="64" rx="32" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
    <text x="480" y="159" fill="#1D4ED8">水路系统</text>
    <rect x="1160" y="115" width="560" height="64" rx="32" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
    <text x="1440" y="159" fill="#047857">电路系统</text>
  </g>

  <!-- water side rows -->
  <g font-size="32" font-weight="700">
    <g transform="translate(200,210)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3"/>
      <circle cx="74" cy="59" r="38" fill="#3B82F6"/>
      <path d="M57 59 h34 M74 42 v34" stroke="#EFF6FF" stroke-width="6" stroke-linecap="round"/>
      <text x="140" y="54" fill="#1E40AF">水泵</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#3B82F6">把水抽到高处</text>
    </g>
    <g transform="translate(200,348)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3"/>
      <rect x="42" y="47" width="74" height="24" rx="9" fill="#60A5FA"/>
      <text x="140" y="54" fill="#1E40AF">水管</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#3B82F6">水的通道</text>
    </g>
    <g transform="translate(200,486)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3"/>
      <circle cx="74" cy="59" r="36" fill="#0EA5E9"/>
      <g stroke="#E0F2FE" stroke-width="5" stroke-linecap="round">
        <line x1="74" y1="32" x2="74" y2="86"/><line x1="47" y1="59" x2="101" y2="59"/>
      </g>
      <text x="140" y="54" fill="#1E40AF">水轮机</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#3B82F6">被水推着干活</text>
    </g>
    <g transform="translate(200,624)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3"/>
      <path d="M50 74 L 74 46 L 98 74" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="74" y1="46" x2="74" y2="30" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
      <text x="140" y="54" fill="#1E40AF">阀门</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#3B82F6">控制通断</text>
    </g>
  </g>

  <!-- mapping arrows -->
  <g fill="#F97316" font-size="40" font-weight="800" text-anchor="middle">
    <text x="960" y="285">↔</text><text x="960" y="423">↔</text><text x="960" y="561">↔</text><text x="960" y="699">↔</text>
  </g>

  <!-- circuit side rows -->
  <g font-size="32" font-weight="700">
    <g transform="translate(1160,210)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="3"/>
      <rect x="44" y="34" width="60" height="50" rx="9" fill="#10B981"/>
      <text x="74" y="69" text-anchor="middle" font-size="27" fill="#ECFDF5">＋</text>
      <text x="140" y="54" fill="#065F46">电源</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#059669">把电荷搬到高电位</text>
    </g>
    <g transform="translate(1160,348)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="3"/>
      <line x1="42" y1="59" x2="116" y2="59" stroke="#D97706" stroke-width="13" stroke-linecap="round"/>
      <text x="140" y="54" fill="#065F46">走线</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#059669">电荷的通道</text>
    </g>
    <g transform="translate(1160,486)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="3"/>
      <circle cx="74" cy="59" r="34" fill="#FBBF24" stroke="#F59E0B" stroke-width="4"/>
      <path d="M62 47 L 86 71 M86 47 L 62 71" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
      <text x="140" y="54" fill="#065F46">灯 / 芯片（负载）</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#059669">被电流推着干活</text>
    </g>
    <g transform="translate(1160,624)">
      <rect x="0" y="0" width="560" height="118" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="3"/>
      <circle cx="52" cy="74" r="9" fill="#374151"/><circle cx="98" cy="50" r="9" fill="#374151"/>
      <line x1="52" y1="74" x2="98" y2="50" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
      <text x="140" y="54" fill="#065F46">开关</text>
      <text x="140" y="94" font-size="26" font-weight="500" fill="#059669">控制通断</text>
    </g>
  </g>

  <text x="960" y="815" text-anchor="middle" font-size="34" font-weight="700" fill="#EA580C">PCB 就是把"导线和连接点"批量印刷出来的产品</text>
</svg>
