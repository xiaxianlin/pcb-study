<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1920" height="1080" fill="#FDFBF7"/>

  <text x="960" y="105" text-anchor="middle" font-size="56" font-weight="800" fill="#1F2937">停下来，检查一下</text>

  <!-- question card -->
  <g transform="translate(360,140)">
    <rect x="0" y="0" width="1200" height="105" rx="24" fill="#FFF7ED" stroke="#F97316" stroke-width="4"/>
    <text x="600" y="68" text-anchor="middle" font-size="40" font-weight="700" fill="#EA580C">金属钥匙 和 橡胶手套，哪个是导体？</text>
  </g>

  <!-- key -->
  <g transform="translate(360,330)">
    <circle cx="82" cy="82" r="58" fill="#FCD34D" stroke="#D97706" stroke-width="6"/>
    <circle cx="82" cy="82" r="23" fill="#FDFBF7"/>
    <rect x="130" y="67" width="230" height="29" rx="11" fill="#FCD34D" stroke="#D97706" stroke-width="5"/>
    <rect x="300" y="96" width="27" height="40" rx="7" fill="#FCD34D" stroke="#D97706" stroke-width="5"/>
    <rect x="248" y="96" width="23" height="32" rx="7" fill="#FCD34D" stroke="#D97706" stroke-width="5"/>
    <text x="195" y="205" text-anchor="middle" font-size="40" font-weight="800" fill="#92400E">金属钥匙</text>
  </g>

  <!-- VS -->
  <text x="960" y="450" text-anchor="middle" font-size="64" font-weight="800" fill="#6B7280">VS</text>

  <!-- rubber glove -->
  <g transform="translate(1150,300)">
    <path d="M105 175 L 105 80 C 105 54, 131 54, 131 80 L 131 28 C 131 5, 159 5, 159 28 L 159 83 L 171 19 C 175 -4, 203 0, 199 24 L 183 87 L 210 35 C 221 14, 247 27, 237 50 L 203 103 L 229 88 C 252 76, 268 99, 250 118 L 201 167 C 187 181, 166 188, 140 188 C 116 188, 98 183, 105 175 Z" fill="#F472B6" stroke="#DB2777" stroke-width="5" stroke-linejoin="round"/>
    <rect x="98" y="172" width="158" height="35" rx="12" fill="#EC4899" stroke="#DB2777" stroke-width="4"/>
    <text x="175" y="255" text-anchor="middle" font-size="40" font-weight="800" fill="#BE185D">橡胶手套</text>
  </g>

  <!-- comment box -->
  <g transform="translate(560,615)">
    <rect x="0" y="0" width="800" height="78" rx="22" fill="#EFF6FF" stroke="#3B82F6" stroke-width="4"/>
    <text x="400" y="51" text-anchor="middle" font-size="36" font-weight="700" fill="#1D4ED8">答案打在评论区 ↓</text>
  </g>

  <!-- next episode card -->
  <g transform="translate(360,735)">
    <rect x="0" y="0" width="1200" height="125" rx="26" fill="#1F2937"/>
    <text x="600" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#9CA3AF">下一集</text>
    <text x="600" y="103" text-anchor="middle" font-size="48" font-weight="800" fill="#FBBF24">电流：电的"流量"</text>
  </g>
</svg>
