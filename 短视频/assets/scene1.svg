<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1920" height="1080" fill="#FDFBF7"/>
  <!-- dotted paper texture -->
  <g fill="#E5E7EB">
    <circle cx="120" cy="120" r="3"/><circle cx="320" cy="120" r="3"/><circle cx="520" cy="120" r="3"/><circle cx="720" cy="120" r="3"/><circle cx="920" cy="120" r="3"/><circle cx="1120" cy="120" r="3"/><circle cx="1320" cy="120" r="3"/><circle cx="1520" cy="120" r="3"/><circle cx="1720" cy="120" r="3"/>
    <circle cx="220" cy="900" r="3"/><circle cx="420" cy="900" r="3"/><circle cx="620" cy="900" r="3"/><circle cx="820" cy="900" r="3"/><circle cx="1020" cy="900" r="3"/><circle cx="1220" cy="900" r="3"/><circle cx="1420" cy="900" r="3"/><circle cx="1620" cy="900" r="3"/>
  </g>

  <!-- top series tag -->
  <g>
    <rect x="760" y="60" width="400" height="62" rx="31" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
    <text x="960" y="102" text-anchor="middle" font-size="34" fill="#059669" font-weight="600">PCB 设计课程 · 第 1 集</text>
  </g>

  <!-- main title -->
  <text x="960" y="225" text-anchor="middle" font-size="104" font-weight="800" fill="#1F2937">电到底是个啥？</text>
  <rect x="610" y="258" width="700" height="14" rx="7" fill="#F97316" opacity="0.85"/>

  <!-- phone -->
  <g transform="translate(760,310)">
    <rect x="0" y="0" width="240" height="420" rx="38" fill="#1F2937"/>
    <rect x="16" y="20" width="208" height="380" rx="26" fill="#F9FAFB"/>
    <rect x="90" y="34" width="60" height="10" rx="5" fill="#9CA3AF"/>
    <rect x="48" y="110" width="144" height="66" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="4"/>
    <rect x="60" y="121" width="26" height="44" rx="5" fill="#EF4444"/>
    <text x="120" y="155" text-anchor="middle" font-size="38" font-weight="700" fill="#EF4444">5%</text>
    <path d="M128 225 L92 288 L120 288 L104 345 L152 273 L122 273 Z" fill="#FBBF24" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- charging cable with current -->
  <path d="M1000 660 C 1150 700, 1250 640, 1330 545" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
  <g fill="#3B82F6">
    <circle cx="1060" cy="675" r="12"/>
    <circle cx="1150" cy="652" r="12"/>
    <circle cx="1235" cy="600" r="12"/>
  </g>

  <!-- question bubble -->
  <g transform="translate(1280,360)">
    <path d="M40 120 C 40 54, 96 10, 170 10 C 244 10, 300 54, 300 120 C 300 186, 244 230, 170 230 C 140 230, 112 222, 90 208 L 40 235 L 58 196 C 46 176, 40 150, 40 120 Z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="5"/>
    <text x="170" y="165" text-anchor="middle" font-size="130" font-weight="800" fill="#2563EB">?</text>
  </g>

  <!-- subtitle (kept above safe zone, ends y ~805) -->
  <g transform="translate(560,770)">
    <rect x="0" y="0" width="800" height="80" rx="40" fill="#FFF7ED" stroke="#F97316" stroke-width="4"/>
    <text x="400" y="53" text-anchor="middle" font-size="42" font-weight="700" fill="#EA580C">不背定义，先修一条"水路"</text>
  </g>
</svg>
